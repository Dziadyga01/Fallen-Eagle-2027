l_english:
 MRX_tydzien:0 "Codzienność Romanowskiego"
 MRX_tydzien_desc:0 "Zaufanie: [?ROOT.MRX_zaufanie]/100. Przeciążenie: [?ROOT.MRX_napiecie]/100. Sygnał: [?ROOT.MRX_sygnal]/100. Aby dokończyć kampanie, ukończ dwa wątki poboczne."
 MRX_w_nocy:0 "Telefon o 02:17"
 MRX_w_nocy_desc:0 "Na Rubinkowie gaśnie internet. Dzwonią urzędnicy, studenci, znajomi i ludzie, którzy są przekonani, że autor mapy wie, jak skończy się prawdziwy kryzys."
 MRX_mapa:0 "Mapa nie jest już grą"
 MRX_mapa_desc:0 "Mod pokazuje ulice, które właśnie odcinają się od miasta. To przypadek, czy ktoś korzysta z Twoich projektow?"
 MRX_wybor:0 "Trzy telefony. Jedna decyzja."
 MRX_wybor_desc:0 "Ratusz chce planu, redakcje chcą twarzy kryzysu, a Twoi bliscy przypominają, że doba wciąż ma dwadzieścia cztery godziny. Kogo odbierzesz najpierw?"
 MRX_a_ulica:0 "Schodzimy z Discorda"
 MRX_a_ulica_desc:0 "Jeżeli Rubinkowo ma decydować o sobie, to głosowanie nie odbędzie się w ankiecie na serwerze. Potrzebne są prawdziwe spotkania."
 MRX_a_bloki:0 "Zebranie pod blokiem"
 MRX_a_bloki_desc:0 "Mieszkańcy przynoszą kartki, termosy i listę problemów. Nikt nie ma czasu słuchać o wielkiej ideologii, kiedy nie ma ogrzewania."
 MRX_a_klatka:0 "Klatka schodowa to parlament"
 MRX_a_klatka_desc:0 "Pan z szóstego piętra przynosi przedłużacz, pani z parteru sprawdza listy potrzeb. Lokalna demokracja zaczyna się od małego kompromisu."
 MRX_a_sasiad:0 "Obiady zamiast obietnic"
 MRX_a_sasiad_desc:0 "Zanim ktokolwiek zaproponuje nową nazwę państwa, wspólne kuchnie muszą wydać dzisiejszy obiad."
 MRX_a_spoldzielnia:0 "Robotnicy wiedzą lepiej"
 MRX_a_spoldzielnia_desc:0 "Zarządzenie na ekranie jest ładne. Pracownicy wodociągów pokazują, co faktycznie da się uruchomić."
 MRX_a_tramwaj:0 "Ostatni tramwaj na Rubinkowo"
 MRX_a_tramwaj_desc:0 "W komunikacji miejskiej nie chodzi o PR, ale o powrót ludzi do domu. Niech to będzie pierwsza widoczna zmiana."
 MRX_a_jawne:0 "Budżet podany do publicznej wiadomości"
 MRX_a_jawne_desc:0 "Im mniej tajnych decyzji, tym mniej plotek. Nawet gdy liczby wyglądają fatalnie."
 MRX_a_spor:0 "Założyciele nie są nietykalni"
 MRX_a_spor_desc:0 "Mieszkańcy mogą głosować przeciwko Twojemu pomysłowi. Tak działa demokracja, również w twojej republice."
 MRX_a_final:0 "Miasto bez jednego bohatera"
 MRX_a_final_desc:0 "Przestań udawać, że jeden lider naprawi Toruń. Stworzyć struktury, które będą działały także bez Ciebie."
 MRX_b_ekran:0 "Wszyscy patrzą na ekran"
 MRX_b_ekran_desc:0 "Nie ma wojny bez opowieści o wojnie. Możesz zostać rzecznikiem, zanim ktokolwiek zapyta, kto dał Ci mikrofon."
 MRX_b_vira:0 "Rolki przed komunikatem ratusza"
 MRX_b_vira_desc:0 "Krótki film dociera dalej niż trzysta stron raportu. Problem pojawia się, kiedy emocje wygrywają z informacją."
 MRX_b_prawda:0 "Nie sprzedawać paniki"
 MRX_b_prawda_desc:0 "Statystyki wyświetleń nie są głosami poparcia. Zespół redakcyjny domaga się potwierdzonych źródeł."
 MRX_b_bot:0 "ManyChat 403: brak uprawnień"
 MRX_b_bot_desc:0 "Automatyczne wiadomości stają w połowie kampanii. Państwa nie uratuje nawet najlepszy autoresponder."
 MRX_b_kontr:0 "Fake news o moście"
 MRX_b_kontr_desc:0 "Internet twierdzi, że most został wysadzony. W rzeczywistości zamknięto jeden pas. Masz dwie minuty na sprostowanie."
 MRX_b_redakcja:0 "Redakcja, nie dwór"
 MRX_b_redakcja_desc:0 "Zamiast mieć jeden głos, zatrudniasz ludzi, którzy odważą się Tobie zaprzeczyć."
 MRX_b_live:0 "Transmisja bez cięcia"
 MRX_b_live_desc:0 "Widzowie zobacza pytania, których nie wybrałeś. To ryzykowne, ale pomaga odzyskać wiarygodność."
 MRX_b_protokol:0 "Algorytm nie wybiera burmistrza"
 MRX_b_protokol_desc:0 "Nawet popularny twórca nie powinien mieć prawa uciszać oponentów. Nadaj wyborcom realny głos."
 MRX_b_final:0 "Wolne media w czasach rozpadu"
 MRX_b_final_desc:0 "Niezależna redakcja przetrwa kolejne wybory. Czas odejść od marki osobistej i stworzyć instytucje."
 MRX_c_oddech:0 "Dzień bez powiadomień"
 MRX_c_oddech_desc:0 "Bez telefonu miasto nie zniknie. Sprawdź, kto nadal potrafi podejmowac decyzje i kto musi zacząć."
 MRX_c_analog:0 "Notatnik zamiast feedu"
 MRX_c_analog_desc:0 "Papier nie padnie przez brak serwera. Dyspozytorzy zaczynają planowac trasy ręcznie."
 MRX_c_grafik:0 "Nie wszystko na wczoraj"
 MRX_c_grafik_desc:0 "Nową zasada: jeden wykonany projekt jest wart więcej niż siedem niezaczętych."
 MRX_c_zastepcy:0 "Prezydent też ma zastępcow"
 MRX_c_zastepcy_desc:0 "Włącza się delegowanie. Rada miasta odzyskuje kompetencje, a ty odzyskujesz czas."
 MRX_c_szkola:0 "Szkoły mają pierwszeństwo"
 MRX_c_szkola_desc:0 "Władze zaczynają odbudowe nie od propagandy, tylko od szkół, szpitali i podstawowej administracji."
 MRX_c_strefa:0 "Rubinkowo o poranku"
 MRX_c_strefa_desc:0 "Bez mikrofonów i kamer słychać, czego ludzie potrzebują. Pierwszy raz od dawna nikt nie pyta o wyświetlenia."
 MRX_c_tydzien:0 "Kalendarz ma wolne pole"
 MRX_c_tydzien_desc:0 "Wolny wieczór nie jest porażka polityczna. Obywatele widzą, że urząd nie musi działać w trybie alarmowym."
 MRX_c_urzad:0 "Sprawny urząd, nie kult jednostki"
 MRX_c_urzad_desc:0 "System funkcjonuje, kiedy nie ma Ciebie w pokoju. To lepszy wynik niż kolejny wizerunkowy triumf."
 MRX_c_final:0 "Rewolucja normalności"
 MRX_c_final_desc:0 "W państwie ciągle wyjątkowym odpoczynek zaczyna wyglądać jak akt buntu. Niech zwyczajne życie stanie się celem rządu."
 MRX_fronty:0 "Cztery otwarte karty"
 MRX_fronty_desc:0 "Toruń funkcjonuje. Teraz wracają zaległe sprawy: auto u kuzyna, egzamin, repozytorium i radio. Wybierz przynajmniej dwie, aby domknac historie."
 MRX_m_auto:0 "Mazda nie odpala"
 MRX_m_auto_desc:0 "Niebieska Mazda 6 GG z 2007 roku wciąż stoi u kuzyna. Silnik 2.0 benzyna i czarne felgi nie naprawiają panewek."
 MRX_m_panewki:0 "Panewki wygrały wybory"
 MRX_m_panewki_desc:0 "Gdy kazdy wydatek idzie na części, minister finansow traci cierpliwość. Ale auto ma już swoją historie."
 MRX_m_czesci:0 "Nie każda część pasuje"
 MRX_m_czesci_desc:0 "Hamulec, wahacz, chłodnica. Zanim cos kupisz, sprawdź numery i zgodnosc. Państwowa komisja techniczna robi to samo."
 MRX_m_oem:0 "OEM+ zamiast rakiety"
 MRX_m_oem_desc:0 "Nie musisz przerabiac rodzinnego sedana na wyścigówkę. Wystarczy, żeby w koncu był sprawny."
 MRX_m_final:0 "Kurs po leki, nie na Berlin"
 MRX_m_final_desc:0 "Odrestaurowana Mazda służy do transportu pomocy. Najbardziej heroiczna misja okazuje się zwykła dostawa."
 MRX_s_uczelnia:0 "Teams: nowy wykład"
 MRX_s_uczelnia_desc:0 "Merito przenosi zajęcia do trybu kryzysowego. Zadania na Moodle nie interesują się upadkiem kraju."
 MRX_s_egzamin:0 "12 minut na ratowanie semestru"
 MRX_s_egzamin_desc:0 "Dwie próby, 51 procent i licznik, który nie zna litości. Na pocieszenie pozostaje genialny wynik z ustnego polskiego."
 MRX_s_podstawy:0 "Podstawy zarządzania państwem"
 MRX_s_podstawy_desc:0 "W zeszycie opisano organizowanie zasobów. Po raz pierwszy definicja wyglada jak instrukcja do urzedu."
 MRX_s_discord:0 "Serwer roku musi działać"
 MRX_s_discord_desc:0 "Role W i K są przypisane. Czas, żeby instrukcje były na tyle proste, aby kazdy trafił na swój kanał."
 MRX_s_final:0 "Zaliczenie z rzeczywistości"
 MRX_s_final_desc:0 "Teorię zarządzania zweryfikowały koleje losu. Nie wszystkie pytania mają cztery odpowiedzi."
 MRX_g_git:0 "Commit o 03:00"
 MRX_g_git_desc:0 "Fallen Eagle mial być alternatywna historia. Teraz jego repozytorium jest najbardziej niepokojącym dziennikiem wydarzeń."
 MRX_g_mapa:0 "2575 gmin i jeden błąd"
 MRX_g_mapa_desc:0 "Jedno przesunięcie granicy i Rubinkowo ląduje po złej stronie Wisly. Mapa przestaje udawać, że jest bezstronna."
 MRX_g_portret:0 "Kto dodał moją twarz?"
 MRX_g_portret_desc:0 "W repozytorium pojawia się portret przywódcy, którego nikt nie pamięta z ostatniego commita."
 MRX_g_tfr:0 "The Fallen Eagle gra we mnie"
 MRX_g_tfr_desc:0 "Nawet fikcyjny system fokusow pokazuje dziury w realnych planach. Kto tu właściwie steruje kim?"
 MRX_g_final:0 "Zamknij debug menu"
 MRX_g_final_desc:0 "Nie da się poprawic wszystkiego jednym patchem. Można za to nie odpuscic ludziom w rzeczywistości."
 MRX_r_radio:0 "Częstotliwość Rubinkowo"
 MRX_r_radio_desc:0 "Gdy gasną nadajniki, ktoś odpala stare nagrania. OdNOVA FM powstaje nie z budżetu, tylko z potrzeby usłyszenia głosu."
 MRX_r_artpop:0 "ARTPOP w stanie wyjątkowym"
 MRX_r_artpop_desc:0 "Lady Gaga i t.A.T.u. brzmią dziwnie w czasie kryzysu. Właśnie dlatego ludzie proszą o kolejny utwór."
 MRX_r_odbior:0 "Vladivostok FM? Nie tutaj."
 MRX_r_odbior_desc:0 "Radio ma własne brzmienie. Jeden słuchacz chce rosyjski klub, drugi klasyczny polski pop, trzeci disco polo."
 MRX_r_noc:0 "Radio Kryzys o północy"
 MRX_r_noc_desc:0 "Zamiast komunikatu o zwyciestwie spiker czyta numery punktów pomocy. Potem zaczyna się darkwave."
 MRX_r_final:0 "To nie jest radio rządowe"
 MRX_r_final_desc:0 "Nadajnik przetrwa, bo nie należy do jednego człowieka. Wolne radio staje się przydatniejsze od hymnu."
 MRX_lustro:0 "Wybierz, czego nie robisz"
 MRX_lustro_desc:0 "Nie wszystko w życiu musi mieć swoje drzewko. Zrealizowałeś dwie ważne sprawy, teraz pora przestać brać na siebie kolejne."
 MRX_sesja:0 "Najdłuższa noc się kończy"
 MRX_sesja_desc:0 "Za oknem Toruń, nie piksele. Decyzja ma znaczenie: jak duzo kontroli chcesz oddać innym ludziom?"
 MRX_jutro:0 "Nie da się załadować savea"
 MRX_jutro_desc:0 "Kraj nie jest gra, a życie nie ma szybkiego zapisu. To właśnie nadaje decyzjom wagę."
 MRX_end_ulica:0 "Miasto mieszkańców"
 MRX_end_ulica_desc:0 "Demokracja zaczyna się pod blokiem."
 MRX_end_media:0 "Wolna redakcja"
 MRX_end_media_desc:0 "Instytucje silniejsze od algorytmu."
 MRX_end_analog:0 "Analogowa Republika"
 MRX_end_analog_desc:0 "Spokojne zarządzanie bez kultu lidera."
 MRX_end_czlowiek:0 "Zwykłe życie"
 MRX_end_czlowiek_desc:0 "Ludzie, nie mity, są fundamentem państwa."
 MRX_end_plik:0 "Przerwa techniczna państwa"
 MRX_end_plik_desc:0 "Za duzo nieprzeczytanych powiadomień. Rada przejmuje obowiązki, a Ty po raz pierwszy nie obiecujesz powrotu nazajutrz."
 MRX_pracownicy:0 "Rady pracownicze"
 MRX_pracownicy_desc:0 "Pracownicy współtworzą plan odbudowy."
 MRX_komitety:0 "Bloki mają głos"
 MRX_komitety_desc:0 "Komitety osiedlowe są realna władza."
 MRX_redakcja:0 "Redakcja zamiast dworu"
 MRX_redakcja_desc:0 "Niezależny zespół weryfikuje komunikaty."
 MRX_wolne_media:0 "Wolne media nad Wisłą"
 MRX_wolne_media_desc:0 "Informacją działa nawet bez głównego rzecznika."
 MRX_delegacja:0 "Prawdziwe delegowanie"
 MRX_delegacja_desc:0 "Urzędnicy mają swoje kompetencje."
 MRX_spokoj:0 "Rewolucja normalności"
 MRX_spokoj_desc:0 "Rozsadne tempo, wolne wieczory, sprawne instytucje."
 MRX_transport:0 "Mazda uratowała dyżur"
 MRX_transport_desc:0 "Transport leków i zaopatrzenia po Rubinkowie."
 MRX_nauka:0 "Zaliczenie z rzeczywistości"
 MRX_nauka_desc:0 "Wiedza przydaje się przy zarządzaniu w kryzysie."
 MRX_moder:0 "Debugowanie państwa"
 MRX_moder_desc:0 "Drobne, regularne poprawki zamiast nieskończonych rewolucji."
 MRX_radio:0 "Radio, które nie milczy"
 MRX_radio_desc:0 "Działająca sieć lokalnej komunikacji."
 MRX_end_przerwa:0 "Przerwa techniczna"
 MRX_end_przerwa_desc:0 "Rada miasta przejęła bieżące decyzje."
 mrx.1.t:0 "Telefon o 02:17"
 mrx.1.d:0 "Terenowy sztab prosi o pomoc. W tym samym czasie ktoś taguje Cię w filmie, który ma już więcej wyświetleń niż ostatni komunikat ratusza."
 mrx.1.a:0 "Przejdź do ludzi, nie do statystyk"
 mrx.1.b:0 "Nagrać pilny komunikat"
 mrx.2.t:0 "Mapa nie jest już gra"
 mrx.2.d:0 "Na mapie moda widać zaporę tam, gdzie rano ustawiono faktyczna blokade. Czy zbieg okoliczności może być aż tak dziwny?"
 mrx.2.a:0 "Zachować dystans i zweryfikować dane"
 mrx.2.b:0 "Sprawdzić repozytorium natychmiast"
 mrx.3.t:0 "Trzy telefony"
 mrx.3.d:0 "Ratusz, redakcja i znajomi dzwonią jednocześnie. Wybor jednej sprawy oznacza opóźnienie pozostalych."
 mrx.3.a:0 "Najpierw ludzie"
 mrx.3.b:0 "Najpierw komunikat"
 mrx.3.c:0 "Najpierw chwila ciszy"
 mrx.4.t:0 "Debata o niepopularnej decyzji"
 mrx.4.d:0 "Mieszkańcy odrzucili jeden z Twoich pomysłów. Nie ma nic gorszego dla dumy przywódcy i nic lepszego dla uczciwej republiki."
 mrx.4.a:0 "Przyjąć wynik głosowania"
 mrx.4.b:0 "Spróbować raz jeszcze przekonać"
 mrx.5.t:0 "Rolki o kryzysie"
 mrx.5.d:0 "Klip z Rubinkowa trafił do odbiorców daleko poza Toruniem. Tylko połowa oglądała do konca. Czy to wystarczy, by na nim oprzeć polityke?"
 mrx.5.a:0 "Zrobić sprostowanie ze źródłami"
 mrx.5.b:0 "Utrzymać mocny hook"
 mrx.6.t:0 "ManyChat: brak uprawnień"
 mrx.6.d:0 "Automatyzacja nie wysyła wiadomości. Komentarze przychodza szybciej niż Twój zespół odpowiada. Ktoś twierdzi, że awaria ma znaczenie polityczne."
 mrx.6.a:0 "Odpowiadać ręcznie i bez paniki"
 mrx.6.b:0 "Publikować instrukcje awaryjną"
 mrx.7.t:0 "Fake news o moście"
 mrx.7.d:0 "Na lokalnych grupach krazy film z eksplozja. Most nie został zniszczony, ale panika może zamknąć miasto szybciej niż blokada."
 mrx.7.a:0 "Pokazać oryginalne nagranie"
 mrx.7.b:0 "Wyłączyć komentarze na dobę"
 mrx.8.t:0 "Live bez pytań kontrolnych"
 mrx.8.d:0 "Sztab proponuje gotowa listę przyjaznych pytań. Kontrkandydaci są już pod domem kultury."
 mrx.8.a:0 "Wpuścić nieprzygotowane pytania"
 mrx.8.b:0 "Utrzymać scenariusz"
 mrx.9.t:0 "Kiedy nikogo nie ma na Discordzie"
 mrx.9.d:0 "Spotkanie w terenie udało się mimo wyciszonych powiadomień. Ludzie wiedza, gdzie znaleźć urzędnika, a urzędnik nie musi być dostępny 24 godziny."
 mrx.9.a:0 "Tak właśnie ma wyglądać państwo"
 mrx.9.b:0 "Dopisać jeszcze jeden projekt"
 mrx.10.t:0 "Panewki kontra plan finansowy"
 mrx.10.d:0 "Mechanik ma listę usterek dłuższa niż ostatnia uchwala Rady. Mazda jest sympatyczna, ale ma swoje prawa."
 mrx.10.a:0 "Naprawić najpierw to, co potrzebne"
 mrx.10.b:0 "Zamówić wszystko od razu"
 mrx.11.t:0 "Egzamin: 12 minut"
 mrx.11.d:0 "Na ekranie pojawia się licznik. To nie analiza wyborcza, tylko Podstawy Zarządzania. Wszystkie odpowiedzi wyglądają podobnie."
 mrx.11.a:0 "Czytać spokojnie i sprawdzać"
 mrx.11.b:0 "Klikać, aby zdążyć"
 mrx.12.t:0 "Portret w plikach gry"
 mrx.12.d:0 "Ktoś wrzucił portret Romanowskiego. Data commita zgadza się z wydarzeniem, które jeszcze się nie wydarzyło."
 mrx.12.a:0 "Nie dopisywać historii na siłę"
 mrx.12.b:0 "Szukać autora tajemniczego commita"
 mrx.13.t:0 "Bitwa o playliste"
 mrx.13.d:0 "Radio OdNOVA dostaje setki prosb. Jeden słuchacz chce Gaga, kolejny t.A.T.u., a trzeci żąda disco polo bez przerwy."
 mrx.13.a:0 "Autorska playlista i wieczorny program"
 mrx.13.b:0 "Niech mieszkańcy zagłosują"
 mrx.14.t:0 "Czy to nadal jest gra?"
 mrx.14.d:0 "Na ekranie wyświetla się ostatni komunikat: \"Nie da się załadować savea\". Obok leży lista realnych zadań na jutro. Jedno z nich nie jest zadaniem państwowym."
 mrx.14.a:0 "Nie muszę robić wszystkiego sam"
 mrx.14.b:0 "Dopisać jeszcze jeden cel"
 mrx.15.t:0 "Pod postem znowu wojna"
 mrx.15.d:0 "Obcy profil publikuje sfabrykowane statystyki. Komentarze kipia, a prawdziwi mieszkańcy pytaja o numer autobusu."
 mrx.15.a:0 "Opublikuj dane i rozkład jazdy"
 mrx.15.b:0 "Wejdź w internetową awanturę"
 mrx.16.t:0 "Przekładamy jazdę probna"
 mrx.16.d:0 "Mazda ciągle czeka na części. Samochód nie jest symbolem porażki, kiedy został dobrze zabezpieczony i spokojnie naprawiany."
 mrx.16.a:0 "Trzymać się planu i budżetu"
 mrx.16.b:0 "Kupić nieplanowany gadżet"
 mrx.17.t:0 "Nowy odcinek radiowy"
 mrx.17.d:0 "Program o nocnym Toruniu ma mały zasięg, ale w komentarzach pojawiają się pierwsze prosby o sprawdzenie zaginionych bliskich."
 mrx.17.a:0 "Przekazać adresy punktów pomocy"
 mrx.17.b:0 "Zrobić z tego spektakl"
 mrx.18.t:0 "Commit bez konca"
 mrx.18.d:0 "Ktoś napisał, że gra ma 13 tysiecy błędów. Liczba jest ogromna, ale najpierw sprawdź log i szukaj tych, które psuja kampanie."
 mrx.18.a:0 "Naprawić jedno, ale porządnie"
 mrx.18.b:0 "Zmienić wszystko naraz"
 MRX_d_glosowanie:0 "Głosowanie na Rubinkowie"
 MRX_d_glosowanie_desc:0 "Koszt niepopularnej demokracji. Podnosi zaufanie, ale daje przeciążenie."
 MRX_d_sprostowanie:0 "Publikuj sprostowanie"
 MRX_d_sprostowanie_desc:0 "Potwierdzone dane wzmacniają wiarygodność, ale kosztuja czas."
 MRX_d_przerwa:0 "Wyjdź na spacer bez telefonu"
 MRX_d_przerwa_desc:0 "Zmniejsz przeciążenie, ale na chwilę znikasz z feedu."
 MRX_d_radio:0 "Nagraj audycję OdNOVA"
 MRX_d_radio_desc:0 "Wzmacnia sygnał i zaufanie kosztem energii."
 MRX_d_plan:0 "Jeden projekt na tydzień"
 MRX_d_plan_desc:0 "Rezygnujesz z natychmiastowych terminow. Przeciążenie spada, zaufanie rosnie."
 MRX_d_debug:0 "Napraw jeden błąd w modzie"
