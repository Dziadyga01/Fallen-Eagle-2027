l_english:
 CIE_polska_upadla:0 "Polska upadła. A co z moim skierowaniem?"
 CIE_polska_upadla_desc:0 "Telewizja pokazuje upadek państwa. W recepcji najważniejsze pytanie brzmi: czy NFZ odda za turnus?"
 CIE_nfz_nie_odbiera:0 "NFZ nie odbiera telefonu"
 CIE_nfz_nie_odbiera_desc:0 "Dzwonimy po raz trzydziesty siódmy. Automat zapewnia, że nasze połączenie jest bardzo ważne."
 CIE_radom_autokar:0 "Autobus z emerytami z Radomia"
 CIE_radom_autokar_desc:0 "Nikt nie wie, jak kierowca przejechał przez trzy linie frontu. Ważne, że przyjechali punktualnie na obiad."
 CIE_pilot:0 "Ktoś ukradł pilota od telewizora"
 CIE_pilot_desc:0 "Nie ma wiadomości, nie ma meczu, nie ma M jak miłość. Kryzys państwowości wkracza w nową fazę."
 CIE_ostatnia_masc:0 "Ostatnie zapasy maści końskiej"
 CIE_ostatnia_masc_desc:0 "Ministerstwo Zdrowia już nie istnieje. Magazynier posiada jednak ostatnią tubkę maści końskiej."
 CIE_herbata_rada:0 "Nadzwyczajne posiedzenie przy herbacie"
 CIE_herbata_rada_desc:0 "Wszystkie frakcje spotkały się o szesnastej. Przewodnicząca przyniosła herbatniki i zamknęła obrady przed kolacją."
 CIE_kto_rzadzi:0 "Kto rządzi tym pierdolnikiem?"
 CIE_kto_rzadzi_desc:0 "Ratusz, klub seniora czy zarząd parkietu? Żadna konstytucja nie przygotowała nas na podobny problem."
 CIE_wodzirej:0 "Przejmujemy mikrofon"
 CIE_wodzirej_desc:0 "Bez mikrofonu nie ma władzy. DJ Mietek właśnie ogłosił się przewodniczącym zebrania."
 CIE_jedna_partia:0 "Jedna partia, jeden parkiet"
 CIE_jedna_partia_desc:0 "Program rządu jest prosty. Jeśli muzyka gra, opozycja siedzi."
 CIE_wolne_zakaz:0 "Zakazać wolnych piosenek"
 CIE_wolne_zakaz_desc:0 "Nikt nie będzie spowalniał rytmu odbudowy państwa."
 CIE_polka:0 "Obowiązkowa polka"
 CIE_polka_desc:0 "Władza ogłasza polkę narodowym standardem ruchu. Niewykonanie obrotu grozi upomnieniem."
 CIE_podejrzani:0 "Kto nie tańczy, ten podejrzany"
 CIE_podejrzani_desc:0 "Bezpieczeństwo państwa mierzymy liczbą osób przy stolikach."
 CIE_wyjatkowy_17:0 "Stan wyjątkowy o 17:00"
 CIE_wyjatkowy_17_desc:0 "Stan wyjątkowy zaczyna się o siedemnastej i kończy po bisach."
 CIE_wieczny_dancing:0 "Wieczny dancing"
 CIE_wieczny_dancing_desc:0 "Obywatel ma obowiązek tańczyć. Resort muzyki ma obowiązek nie puszczać reklam."
 CIE_najwyzszy_dj:0 "Najwyższy Wodzirej Ciechocinka"
 CIE_najwyzszy_dj_desc:0 "Na czele państwa stoi najwyższy wodzirej, a parlament mieści się obok parkietu."
 CIE_plotki:0 "Plotki spod Grzybka"
 CIE_plotki_desc:0 "Pani Halinka wszystko wie. Wystarczy postawić ławkę i zacząć słuchać."
 CIE_komitet_pan:0 "Komitet Pań z Turnusu"
 CIE_komitet_pan_desc:0 "Rada najstarszych powstaje bez wyborów. Wszyscy i tak wiedzą, kto decyduje."
 CIE_wszystkie_lawki:0 "Zająć wszystkie ławki"
 CIE_wszystkie_lawki_desc:0 "Strategiczne ławki pod Grzybkiem przechodzą pod kontrolę nowej administracji."
 CIE_stolowki:0 "Kontrola stołówek"
 CIE_stolowki_desc:0 "Nikt nie odejdzie od stołu głodny. Nikt też nie dostanie dokładki bez zgody pani Halinki."
 CIE_romanse_komisja:0 "Komisja do spraw romansów"
 CIE_romanse_komisja_desc:0 "Nowa komisja otrzymuje kompetencje do badania wszystkich spraw podwójnie sercowych."
 CIE_obiad:0 "Każdy musi zjeść obiad"
 CIE_obiad_desc:0 "Dyscyplina żywieniowa jest fundamentem ustroju."
 CIE_halinka:0 "Rządzi pani Halinka"
 CIE_halinka_desc:0 "Nikt nie protestuje. Wszyscy wolą nie ryzykować utraty miejsca przy stoliku."
 CIE_republika_san:0 "Republika Sanatoryjna"
 CIE_republika_san_desc:0 "Nie potrzebujemy królów. Potrzebujemy przynajmniej czterech herbat dziennie."
 CIE_samotni:0 "Samotni w okolicy"
 CIE_samotni_desc:0 "Okazuje się, że samotność jest większym problemem niż brak dostaw prądu."
 CIE_ministerstwo_flirtu:0 "Ministerstwo Flirtu"
 CIE_ministerstwo_flirtu_desc:0 "Powstaje resort odpowiedzialny za relacje międzyludzkie i zaproszenia na kawę."
 CIE_randki_teznia:0 "Szybkie randki pod tężniami"
 CIE_randki_teznia_desc:0 "Kolejka do tężni nigdy wcześniej nie cieszyła się tak dużym zainteresowaniem."
 CIE_stoliki_podwojne:0 "Zakazać samotnych stolików"
 CIE_stoliki_podwojne_desc:0 "Od dziś przy każdym stoliku muszą stać przynajmniej dwa krzesła."
 CIE_love_story:0 "Sanatoryjne love story"
 CIE_love_story_desc:0 "Nawet koniec świata nie zatrzyma turnusowych romansów."
 CIE_rozwody:0 "Rozwody są problemem innych państw"
 CIE_rozwody_desc:0 "W Ciechocinku obowiązuje wyłącznie dobra zabawa. Reszta to sprawa dyplomacji."
 CIE_milosc:0 "Miłość silniejsza od kryzysu"
 CIE_milosc_desc:0 "Wojna? Proszę ciszej. Tutaj ktoś właśnie wyznał miłość pod Grzybkiem."
 CIE_ruchocinek:0 "Wolne Miasto Ruchocinek"
 CIE_ruchocinek_desc:0 "Świat może płonąć. Ciechocinek ma randkę o siedemnastej."
 CIE_panowie:0 "Panowie proszą panie"
 CIE_panowie_desc:0 "Oficjalny komunikat kryzysowy: panowie proszą panie. Kolejny komunikat za siedem dni."
 CIE_modern:0 "Modern Talking nie umarło"
 CIE_modern_desc:0 "W radiowęźle odnaleziono kasetę. Ma dwa utwory i gra w pętli od rana."
 CIE_aux:0 "Gdzie jest kabel AUX?"
 CIE_aux_desc:0 "Walka o kabel AUX zatrzymuje działanie rządu na pół doby."
 CIE_trzy_malzenstwa:0 "Jeden stolik, trzy małżeństwa"
 CIE_trzy_malzenstwa_desc:0 "Zasady rezerwacji stolików okazały się bardziej skomplikowane niż prawo międzynarodowe."
 CIE_zenek:0 "Kto zamówił Zenka?"
 CIE_zenek_desc:0 "Nikt się nie przyznaje. Wszyscy znają refren."
 CIE_mietek:0 "DJ Mietek wraca z emerytury"
 CIE_mietek_desc:0 "Jedyny człowiek, który rozumie ten sprzęt, znów zostaje zatrudniony."
 CIE_dwa_piwa:0 "Dwa piwa i parkiet mój"
 CIE_dwa_piwa_desc:0 "Pewien kuracjusz uznaje, że wystarczy mu już rozgrzewki. Ochrona odmawia komentarza."
 CIE_bitwa_stolik:0 "Bitwa o ostatni stolik"
 CIE_bitwa_stolik_desc:0 "Rozpoczyna się najpoważniejszy konflikt terytorialny w historii uzdrowiska."
 CIE_stali:0 "Pierwszeństwo dla stałych bywalców"
 CIE_stali_desc:0 "Stali bywalcy mają pierwszeństwo do stolików i do opowiadania historii o dawnych czasach."
 CIE_glosnik:0 "Wojna o pilota do głośnika"
 CIE_glosnik_desc:0 "Tym razem pilot jest. Problem w tym, że są dwa piloty i trzy obozy polityczne."
 CIE_disco:0 "Ochrona przed disco polo"
 CIE_disco_desc:0 "Komisja muzyczna ma prawo wetować co trzeci utwór. Nikt nie umie policzyć do trzech."
 CIE_bombardowanie:0 "O 17:00 nawet podczas bombardowania"
 CIE_bombardowanie_desc:0 "Syreny wyły, a zegar wskazywał siedemnastą. DJ Mietek nacisnął play."
 CIE_cala_polska:0 "Cała Polska tańczy w Ciechocinku"
 CIE_cala_polska_desc:0 "Wiadomość dociera do pozostałych miast. Nie wierzą, że ktoś tu wciąż organizuje fajfy."
 CIE_fajfy_wieczne:0 "FAJFY NIGDY NIE UMRĄ"
 CIE_fajfy_wieczne_desc:0 "Koniec kampanii: uzdrowisko przetrwało, a turnus wiosenny 2028 uratowano."
 CIE_zus_bastion:0 "Sanatorium ZUS-u, ostatni bastion"
 CIE_zus_bastion_desc:0 "Prąd może zgasnąć w całym kraju, ale rehabilitacja ma działać."
 CIE_herbatka:0 "Herbatka o 16:00"
 CIE_herbatka_desc:0 "Oficjalne przerwy na herbatę ograniczają liczbę skarg."
 CIE_pilot_wojna:0 "Wojna o pilota od telewizora"
 CIE_pilot_wojna_desc:0 "Komisja śledcza odnajduje odbiornik i brakującą baterię."
 CIE_reczniki:0 "Kto ukradł ręczniki?"
 CIE_reczniki_desc:0 "Nadzwyczajna kontrola magazynów udowadnia, że każdy ma po cztery ręczniki."
 CIE_cukier:0 "Cukier do kieszeni"
 CIE_cukier_desc:0 "Zapas cukru na pół roku znalazł się w kieszeniach kurtki jednego kuracjusza."
 CIE_masc_waluta:0 "Maść końska jako waluta narodowa"
 CIE_masc_waluta_desc:0 "Wartość gospodarki mierzy się teraz liczbą pełnych tubek."
 CIE_kapcie:0 "Handel kapciami"
 CIE_kapcie_desc:0 "Rozwija się rynek wewnętrzny. Handlarze przyjmują wszystkie rozmiary oprócz 43."
 CIE_szara_reha:0 "Szara strefa rehabilitacji"
 CIE_szara_reha_desc:0 "Podziemne zabiegi w pokoju 203 przynoszą niespodziewane dochody."
 CIE_nfz_blagam:0 "NFZ, błagam, odbierz"
 CIE_nfz_blagam_desc:0 "System automatycznej sekretarki działa. Niestety, tylko odtwarza muzykę."
 CIE_reforma_turnus:0 "Wielka reforma turnusowa"
 CIE_reforma_turnus_desc:0 "Nowy model gospodarki: trzy posiłki dziennie i żadnego podatku od fajfów."
 CIE_linia:0 "Pierwsza linia obrony"
 CIE_linia_desc:0 "Nikt nie wie, gdzie przebiega granica. Na wszelki wypadek obstawiamy wejście do stołówki."
 CIE_kijki:0 "Mobilizacja kijków"
 CIE_kijki_desc:0 "Kijki do nordic walking oficjalnie stają się wyposażeniem porządkowym."
 CIE_grazyna_skrot:0 "Pani Grażyna zna skrót"
 CIE_grazyna_skrot_desc:0 "Dzięki codziennym spacerom ktoś wreszcie zna wszystkie ścieżki parku."
 CIE_nordic:0 "Batalion Nordic Walking"
 CIE_nordic_desc:0 "Oddział liczy niewiele osób, ale pojawia się wszędzie pięć minut przed innymi."
 CIE_lezaki:0 "Straż Ochrony Leżaków"
 CIE_lezaki_desc:0 "Od teraz żaden ręcznik nie zajmie strategicznego leżaka bez pozwolenia."
 CIE_zajety:0 "Operacja „Zajęty stolik”"
 CIE_zajety_desc:0 "Pierwsza operacja wojskowa kończy się odzyskaniem trzech krzeseł i jednego obrusa."
 CIE_cisza:0 "Cisza nocna albo wpierdol"
 CIE_cisza_desc:0 "Dowódca straży odczytuje nowy regulamin. Cisza ma obowiązywać po ostatnim bisie."
 CIE_grzybek:0 "Nie oddamy Grzybka!"
 CIE_grzybek_desc:0 "Centralny symbol państwowości zostaje objęty ochroną. Nawet najgorszy kryzys nie zmieni tego rozkazu."
 CIE_aleksandrow_telefon:0 "Telefon do Aleksandrowa"
 CIE_aleksandrow_telefon_desc:0 "Po piętnastu próbach ktoś odebrał. Niestety dzwoniliśmy do pizzerii."
 CIE_wodzirej_zada:0 "Oddajcie nam wodzireja"
 CIE_wodzirej_zada_desc:0 "Wystosowano notę dyplomatyczną o zwrot mikrofonu i człowieka, który umie go obsługiwać."
 CIE_ino_kuracjusze:0 "Inowrocław kradnie kuracjuszy"
 CIE_ino_kuracjusze_desc:0 "Konkurencyjne uzdrowisko oferuje lepsze ciasto. Wybucha kryzys wizerunkowy."
 CIE_embargo_woda:0 "Embargo na wodę mineralną"
 CIE_embargo_woda_desc:0 "Nasze kurortowe państwo zapowiada sankcje. Nikt nie wie, gdzie podpisano umowę handlową."
 CIE_turnusy_wojna:0 "Wojna cenowa turnusów"
 CIE_turnusy_wojna_desc:0 "W ramach ofensywy dyplomatycznej obniżono ceny pobytu o trzy złote."
 CIE_pakt_uzdrowisk:0 "Pakt Uzdrowiskowy"
 CIE_pakt_uzdrowisk_desc:0 "Oficjalny pakt zobowiązuje sygnatariuszy do powstrzymania się od kradzieży wodzirejów."
 CIE_festiwal:0 "Międzynarodowy Festiwal Fajfów"
 CIE_festiwal_desc:0 "Za granicą toczą się wojny, u nas odbywa się walka o pierwsze miejsce w konkursie tańca."
 CIE_regional_identity:0 "Ciechocinek - uzdrowisko"
 CIE_regional_identity_desc:0 "Miejscowi nie pytaja, czy Polska przetrwa. Pytaja, o ktorej otwieraja tężnie."
 CIE_kryzys_turnusu:0 "Kryzys turnusu"
 CIE_kryzys_turnusu_desc:0 "Telefon nie działa, pilot zaginął, a turnus powinien skończyć się trzy tygodnie temu."
 CIE_wodzirejat:0 "Rząd mikrofonu"
 CIE_wodzirejat_desc:0 "O wszystkim rozstrzyga człowiek trzymający mikrofon."
 CIE_rada_babc:0 "Rada turnusowych babć"
 CIE_rada_babc_desc:0 "Cała administracja mieści się na trzech ławkach pod Grzybkiem."
 CIE_romanse:0 "Ministerstwo flirtu"
 CIE_romanse_desc:0 "Priorytet państwa: więcej romansów, mniej komunikatów kryzysowych."
 CIE_wolne_miasto:0 "Wolne Miasto Ruchocinek"
 CIE_wolne_miasto_desc:0 "Wszyscy szukają partnera do tańca. Nikt nie szuka wojny."
 CIE_gospodarka_turnusu:0 "Gospodarka herbatnika"
 CIE_gospodarka_turnusu_desc:0 "Stabilizacja nastąpiła po wprowadzeniu trzech posiłków i regularnej herbaty."
 CIE_obrona_grzybka:0 "Nie oddamy Grzybka"
 CIE_obrona_grzybka_desc:0 "Własnego symbolu bronimy nawet wtedy, gdy nie ma zasilania."
 CIE_fajfy_final:0 "FAJFY NIGDY NIE UMRĄ"
 CIE_fajfy_final_desc:0 "Najważniejszy sukces Ciechocinka: wszystko się rozpadło, a impreza trwa."
 cie.1.t:0 "NFZ nie odbiera"
 cie.1.d:0 "Po czterdziestu pięciu minutach na infolinii odezwał się automat. Poradził, żebyśmy zadzwonili jutro."
 cie.1.a:0 "Zapiszmy skargę na kartce."
 cie.1.b:0 "Puśćmy muzykę z infolinii na sali."
 cie.2.t:0 "Autokar z Radomia"
 cie.2.d:0 "Na parking wjechał autokar. Kierowca nie zna aktualnej sytuacji geopolitycznej, ale posiada listę pokoi."
 cie.2.a:0 "Wpuścić wszystkich. Herbata już się gotuje."
 cie.2.b:0 "Najpierw niech pokażą skierowania."
 cie.3.t:0 "Zaginiony pilot"
 cie.3.d:0 "Sytuacja stała się krytyczna. Bez pilota nie działa telewizor w pokoju wspólnym."
 cie.3.a:0 "Powołać komisję śledczą."
 cie.3.b:0 "Wszyscy na fajfy, po co nam telewizja?"
 cie.4.t:0 "Nadzwyczajne wybory przy herbatnikach"
 cie.4.d:0 "Zgromadzenie nie osiągnęło kworum. Trzy osoby wyszły po biszkopty. Pozostali żądają nowego rządu."
 cie.4.a:0 "Niech zwycięży parkiet."
 cie.4.b:0 "Niech zwycięży zdrowy rozsądek."
 cie.5.t:0 "Komisja do spraw romansów"
 cie.5.d:0 "Pani Halinka przedstawiła raport o niejasnych relacjach stolikowych. Zawiera siedemdziesiąt trzy strony."
 cie.5.a:0 "Zarchiwizować raport."
 cie.5.b:0 "Ogłosić amnestię romansową."
 cie.6.t:0 "Gdzie jest kabel AUX?"
 cie.6.d:0 "DJ Mietek twierdzi, że kabel zabrał kierownik. Kierownik twierdzi, że nigdy takiego kabla nie było."
 cie.6.a:0 "Kupić nowy kabel."
 cie.6.b:0 "Śpiewamy bez nagłośnienia."
 cie.7.t:0 "Zaginął DJ Mietek"
 cie.7.d:0 "Od siedemnastej minęło osiem minut. Dj-a Mietka nie ma, a publiczność zaczyna klaskać nie w rytm."
 cie.7.a:0 "Wysłać straż na poszukiwania."
 cie.7.b:0 "Zastąpić go radiem z recepcji."
 cie.8.t:0 "Bitwa o ostatni stolik"
 cie.8.d:0 "Dwie grupy twierdzą, że rezerwowały stolik od środy. Obie mają po cztery ręczniki."
 cie.8.a:0 "Podzielić stolik."
 cie.8.b:0 "Kto pierwszy, ten lepszy."
 cie.9.t:0 "Rosjanie zbliżają się do Wisły"
 cie.9.d:0 "Ktoś przyniósł złą wiadomość o froncie. DJ Mietek zapytał tylko, czy nadal ma grać."
 cie.9.a:0 "O 17:00 nawet podczas bombardowania."
 cie.9.b:0 "Najpierw przeprowadźmy próbę ewakuacji."
 cie.10.t:0 "Nowy dekret Najwyższego Wodzireja"
 cie.10.d:0 "Wszystkie uchwały państwa mają teraz formę listy przebojów. DJ Mietek staje się najwyższą instancją."
 cie.10.a:0 "Jeszcze jeden bis!"
 cie.10.b:0 "Przerwa na schabowego."
 cie.11.t:0 "Premierka Halinka ogłasza plan"
 cie.11.d:0 "Władza seniorów ustanowiła obowiązkowe herbatniki. Wszyscy przyjęli plan bez głosowania."
 cie.11.a:0 "Kolejna herbata!"
 cie.11.b:0 "Wydajmy karty stałego kuracjusza."
 cie.12.t:0 "Sanatoryjne love story"
 cie.12.d:0 "O siedemnastej trzech panów zaprosiło tę samą osobę do tańca. Ministerstwo Flirtu żąda wyjaśnień."
 cie.12.a:0 "Wprowadźmy kalendarz randek."
 cie.12.b:0 "Niech sami się dogadają."
 cie.13.t:0 "Wolne Miasto Ruchocinek"
 cie.13.d:0 "Oficjalny komunikat nie informuje już o wojnie. Informuje o liczbie nowych par na parkiecie."
 cie.13.a:0 "Miłość zwycięża!"
 cie.13.b:0 "Zorganizować wspólne śniadanie."
 cie.14.t:0 "FAJFY NIGDY NIE UMRĄ"
 cie.14.d:0 "Polska jest podzielona, telefony milczą, a politycy dyskutują. W Ciechocinku o siedemnastej zabrzmiała pierwsza piosenka nowego turnusu. Uzdrowisko przetrwało."
 cie.14.a:0 "Dobra, to kto idzie tańczyć?"
 cie.15.t:0 "Afera: zaginęły kapcie"
 cie.15.d:0 "Po obiedzie zgłoszono zniknięcie siedmiu par kapci. Nie zgadza się rozmiar, kolor i zeznania świadków."
 cie.15.a:0 "Komisja śledcza od kapci."
 cie.15.b:0 "Kupimy nowe po turnusie."
 cie.16.t:0 "Dramat w kawiarni"
 cie.16.d:0 "Ekspres do kawy odmówił współpracy. Ludzie gromadzą się pod bufetem, domagając się nadzwyczajnych działań."
 cie.16.a:0 "Naprawić ekspres."
 cie.16.b:0 "Niech piją herbatę."
 cie.17.t:0 "Afera ostatniego kotleta"
 cie.17.d:0 "W stołówce został jeden kotlet. Trzech kuracjuszy ma skierowania na dietę zwykłą."
 cie.17.a:0 "Podzielić na trzy części."
 cie.17.b:0 "Zorganizować losowanie."
 cie.18.t:0 "Mikrofon przestał działać"
 cie.18.d:0 "DJ Mietek trzyma mikrofon, ale z głośnika dochodzi tylko niepokojące trzeszczenie. Parkiet czeka."
 cie.18.a:0 "Awaryjny śpiew zbiorowy."
 cie.18.b:0 "Odwołać dzisiejsze fajfy."
 CIE_panel:0 "Komisja do spraw fajfów"
 CIE_panel_desc:0 "Nastroje kuracjuszy: [?CIE_humor|0]/100. Zaopatrzenie: [?CIE_zapasy|0]/100. Maść końska: [?CIE_masc|0]/100. Liczba fajfów: [?CIE_fajfy|0]."
 CIE_d_fajfy:0 "Zorganizuj kolejne fajfy"
 CIE_d_fajfy_desc:0 "Godzina siedemnasta. Stoliki zajęte. Potrzebujemy jedynie 10 jednostek zaopatrzenia."
 CIE_d_masc:0 "Skup maści końskiej"
 CIE_d_masc_desc:0 "Dyżurny rehabilitant kupuje awaryjną partię maści."
 CIE_d_herbata:0 "Rozdaj herbatniki"
 CIE_d_herbata_desc:0 "Ktoś odnalazł zapasy. Prosimy o spokojne ustawienie się w kolejce."
 CIE_d_kartki:0 "Wprowadź kartki obiadowe"
 CIE_d_kartki_desc:0 "Niepopularna reforma ratuje stołówkę, ale obniża zadowolenie kuracjuszy."
