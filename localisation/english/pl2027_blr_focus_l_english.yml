l_english:
 BLR_zachod:0 "Mińsk patrzy na zachód"
 BLR_zachod_desc:0 "Za zachodnią granicą rozpada się państwo, z którym Białoruś graniczy od ponad trzydziestu lat. W Mińsku trwają narady: zagrożenie czy okazja?"
 BLR_rada:0 "Posiedzenie Rady Bezpieczeństwa"
 BLR_rada_desc:0 "Rada Bezpieczeństwa omawia scenariusze dla granicy zachodniej: współpraca z Rosją, równowaga albo ostrożne otwarcie na sąsiadów."
 BLR_zwiazkowe:0 "Państwo Związkowe"
 BLR_zwiazkowe_desc:0 "Mińsk stawia na integrację z Rosją: wspólne dowództwo, wspólna polityka wobec rozbitej Polski i rosyjskie kredyty."
 BLR_wielowektor:0 "Wielowektorowość"
 BLR_wielowektor_desc:0 "Stara doktryna Mińska: nikomu nie odmawiać, nikomu nie obiecywać zbyt wiele. Rosja, Litwa i polskie państwa mają być partnerami w handlu, nie w wojnie."
 BLR_otwarcie_f:0 "Ostrożne otwarcie"
 BLR_otwarcie_f_desc:0 "Białoruś otwiera przejścia graniczne z Litwą i polskimi państwami. Pierwsi kupcy i inwestorzy przyjeżdżają z Wilna i Białegostoku."
 BLR_potas:0 "Biełaruśkalij"
 BLR_potas_desc:0 "Kopalnie potasu w Soligorsku to najcenniejszy towar eksportowy kraju. Trzeba znaleźć dla niego nowe szlaki."
 BLR_rafinerie:0 "Rafinerie Mozyrza i Nowopołocka"
 BLR_rafinerie_desc:0 "Ropa z Rosji, paliwo dla regionu. Rafinerie mogą zarabiać na tym, że po drugiej stronie granicy brakuje wszystkiego."
 BLR_maz:0 "MAZ i BiełAZ"
 BLR_maz_desc:0 "Fabryki ciężarówek i maszyn pracują na trzy zmiany. Wojsko i rolnictwo potrzebują pojazdów."
 BLR_kredyt_rosja:0 "Kredyt z Moskwy"
 BLR_kredyt_rosja_desc:0 "Rosyjski kredyt pozwala utrzymać pensje i ceny. Oprocentowanie jest polityczne."
 BLR_wielki_kamien:0 "Park Wielki Kamień"
 BLR_wielki_kamien_desc:0 "Park przemysłowy pod Mińskiem ściąga inwestorów z Azji. Fabryki elektroniki i maszyn powstają szybciej, niż Moskwa zdąży zaprotestować."
 BLR_tranzyt:0 "Korytarz tranzytowy"
 BLR_tranzyt_desc:0 "Kolej z Chin do Europy idzie przez Brześć i Małaszewicze. Białoruś oferuje polskim państwom korytarz tranzytowy."
 BLR_samowystarczalnosc:0 "Samowystarczalność"
 BLR_samowystarczalnosc_desc:0 "Rolnictwo, potas, ciężarówki i paliwo – Białoruś może przetrwać nawet wtedy, gdy wszyscy sąsiedzi zamkną granice."
 BLR_armia:0 "Siły Zbrojne Białorusi"
 BLR_armia_desc:0 "Armia ma sprzęt, ale za mało ludzi. Reforma ma dać więcej zawodowych batalionów."
 BLR_cwiczenia:0 "Wspólne ćwiczenia z Rosją"
 BLR_cwiczenia_desc:0 "Ćwiczenia przy granicy z rozbitą Polską. Kolumny pancerne jadą wzdłuż Bugu – na pokaz, przynajmniej na razie."
 BLR_obrona_terytorialna:0 "Obrona terytorialna"
 BLR_obrona_terytorialna_desc:0 "Ochotnicy w każdym obwodzie – doktryna obrony, a nie ataku. Sąsiedzi nie muszą się bać, Rosja nie ma pretekstu."
 BLR_granica_zach:0 "Granica zachodnia"
 BLR_granica_zach_desc:0 "Posterunki, zasieki i patrole na granicy z Podlasiem i Suwalszczyzną. Pytanie, przed kim ta granica ma chronić."
 BLR_baza_rosyjska:0 "Rozmowy o bazach"
 BLR_baza_rosyjska_desc:0 "Moskwa chce stałych baz. Mińsk może je dać – albo wynegocjować coś w zamian."
 BLR_wsparcie_rosji:0 "Wsparcie operacji Rosji"
 BLR_wsparcie_rosji_desc:0 "Jeśli Rosja walczy z państwami polskimi przy naszej granicy, sztab w Mińsku ma gotowe plany odciążenia rosyjskich dywizji."
 BLR_neutralnosc:0 "Gwarancje neutralności"
 BLR_neutralnosc_desc:0 "Białoruś ogłasza, że jej terytorium nie będzie użyte do ataku na sąsiadów. Litwa i polskie państwa przyjmują to z ulgą – Moskwa z chłodem."
 BLR_media:0 "Telewizja państwowa"
 BLR_media_desc:0 "Wieczorne wiadomości tłumaczą, dlaczego Białoruś jest wyspą spokoju w regionie pełnym chaosu."
 BLR_administracja:0 "Pionowa administracja"
 BLR_administracja_desc:0 "Przewodniczący obwodów meldują się co tydzień w Mińsku. Państwo działa – jak jedno przedsiębiorstwo."
 BLR_sukcesja:0 "Kwestia sukcesji"
 BLR_sukcesja_desc:0 "Rada Bezpieczeństwa przygotowuje procedury na wypadek zmiany pokoleniowej. Kto je napisze, ten zdecyduje o przyszłości państwa."
 BLR_stabilizacja:0 "Wyspa spokoju"
 BLR_stabilizacja_desc:0 "Białoruś pokazuje sąsiadom, że u niej pociągi jeżdżą, sklepy mają towar, a prąd nie znika wieczorami."
 BLR_granica_pl:0 "Granica z rozbitą Polską"
 BLR_granica_pl_desc:0 "Za Bugiem kilka państw zamiast jednego. Każde ma własną straż graniczną, własne cła i własne pretensje."
 BLR_mniejszosc:0 "Polacy z Grodzieńszczyzny"
 BLR_mniejszosc_desc:0 "Szkoły z polskim językiem i polskie organizacje dostają gwarancje. Gest wobec sąsiadów – i sygnał, że Mińsk szuka porozumienia."
 BLR_przemyt:0 "Przymykanie oczu na przemyt"
 BLR_przemyt_desc:0 "Uzbrojone grupy przemytnicze, wspierane przez część służb, przerzucają ludzi przez granicę. Ofiarami są oszukani przemycani ludzie – a Mińsk płaci za to izolacją."
 BLR_wspolpraca_graniczna:0 "Wspólne patrole z Podlasiem"
 BLR_wspolpraca_graniczna_desc:0 "Wspólne patrole i wymiana informacji o siatkach przemytniczych. Przemytnicy tracą trasy, a przemycani ludzie dostają pomoc zamiast pułapki."
 BLR_handel_pl:0 "Handel graniczny"
 BLR_handel_pl_desc:0 "Targowiska w Grodnie i Brześciu znów są pełne kupców z Białegostoku i Białej Podlaskiej."
 BLR_mediator:0 "Mińsk jako mediator"
 BLR_mediator_desc:0 "Białoruś proponuje rozmowy między skłóconymi państwami polskimi. Nikt nie ufa Mińskowi całkowicie – ale wszyscy przyjeżdżają."
 BLR_nowa_bialorus:0 "Białoruś między Wschodem a Zachodem"
 BLR_nowa_bialorus_desc:0 "Białoruś stała się krajem, z którym rozmawiają wszyscy sąsiedzi. Samodzielność ma swoją cenę – ale i swoją wartość."
 BLR_jednosc_zwiazku:0 "Fundament Państwa Związkowego"
 BLR_jednosc_zwiazku_desc:0 "Wspólna waluta, wspólne dowództwo, wspólne granice. Białoruś jest najwierniejszym sojusznikiem Moskwy – i coraz mniej sama sobą."
