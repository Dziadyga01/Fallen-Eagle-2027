l_english:
 BST_podlasie:0 "Podlasie po rozpadzie"
 BST_podlasie_desc:0 "Białystok obudził się stolicą państwa, o które nikt nie prosił. Od Biebrzy po Bug – granice, rzeki, puszcze i ludzie, którzy chcą wiedzieć, co dalej."
 BST_rada:0 "Rada Regionu"
 BST_rada_desc:0 "W Pałacu Branickich zbiera się Rada Regionu. Pierwsze pytanie: kto ma prowadzić Podlasie przez najtrudniejsze lata?"
 BST_g_kryzys:0 "Kryzys na granicy"
 BST_g_kryzys_desc:0 "Od Kuźnicy po Mielnik przemytnicy, wspierani przez białoruskie służby, testują każdy kilometr granicy. Trzeba ją wreszcie zorganizować."
 BST_g_straz:0 "Straż Graniczna Podlasia"
 BST_g_straz_desc:0 "Dawny Podlaski Oddział Straży Granicznej dostaje nowych ludzi, pojazdy i drony."
 BST_g_zapora:0 "Zapora na granicy"
 BST_g_zapora_desc:0 "Stalowa zapora, kamery termowizyjne i czujki ruchu od Kuźnicy po Bug."
 BST_g_forty:0 "Umocnienia nad Bugiem i Narwią"
 BST_g_forty_desc:0 "Stanowiska obronne w gminach przygranicznych – na wypadek, gdyby po drugiej stronie ktoś postanowił przejść od prowokacji do wojny."
 BST_g_pomoc:0 "Punkty pomocy humanitarnej"
 BST_g_pomoc_desc:0 "Szpitale w Hajnówce i Sokółce oraz punkty pomocy przy granicy. Ludzie oszukani przez przemytników dostają opiekę, a mieszkańcy widzą, że państwo działa."
 BST_g_litwa:0 "Wspólne patrole z Litwą"
 BST_g_litwa_desc:0 "Litewska straż graniczna patroluje z nami odcinek przy Kuźnicy i Sejnach."
 BST_g_siatki:0 "Rozbić siatki przemytnicze"
 BST_g_siatki_desc:0 "Policja i kontrwywiad uderzają w przemytników po naszej stronie granicy: kierowców, kurierów i kryjówki."
 BST_g_spokoj:0 "Spokojna granica"
 BST_g_spokoj_desc:0 "Granica wreszcie jest szczelna, a region odzyskuje spokój. Destabilizacja przestaje być zagrożeniem."
 BST_k_droga:0 "Droga Aleksieja Kaczyńskiego"
 BST_k_droga_desc:0 "Aleksiej Kaczyński proponuje spokojną budowę państwa: najpierw instytucje, potem gospodarka, a na końcu – cała Nizina Podlaska."
 BST_k_urzedy:0 "Urzędy Podlasia"
 BST_k_urzedy_desc:0 "Urząd wojewódzki staje się rządem. Urzędnicy dostają nowe pieczątki i stare biurka."
 BST_k_przemysl:0 "Przemysł Białegostoku"
 BST_k_przemysl_desc:0 "Fabryki przy Elewatorskiej i w strefie ekonomicznej dostają zamówienia."
 BST_k_kolej:0 "Kolej do Ełku i Łomży"
 BST_k_kolej_desc:0 "Linie kolejowe łączą Białystok z sąsiadami – handel dziś, logistyka wojskowa jutro."
 BST_k_rolnictwo:0 "Spółdzielnie rolnicze"
 BST_k_rolnictwo_desc:0 "Podlaskie gospodarstwa łączą się w spółdzielnie i karmią cały region."
 BST_k_armia:0 "Brygada Podlaska"
 BST_k_armia_desc:0 "Z oddziałów obrony terytorialnej powstaje Brygada Podlaska."
 BST_k_tozsamosc:0 "Idea Niziny Podlaskiej"
 BST_k_tozsamosc_desc:0 "Historycy z Uniwersytetu w Białymstoku przypominają, że Podlasie zawsze było jednym krajem – podzielonym tylko przez cudze granice."
 BST_k_suw_oferta:0 "Oferta dla Suwalszczyzny"
 BST_k_suw_oferta_desc:0 "Suwałki i Augustów dostają propozycję: wspólna obrona granicy z Litwą i Białorusią w zamian za przyłączenie."
 BST_k_nar_oferta:0 "Rozmowy z Łomżą"
 BST_k_nar_oferta_desc:0 "Państwo Narodowe w Łomży dostaje ofertę: wspólne państwo albo izolacja między silniejszymi sąsiadami."
 BST_k_suw_wojna:0 "Kampania suwalska"
 BST_k_suw_wojna_desc:0 "Suwalszczyzna odrzuciła ofertę. Brygada Podlaska rusza na północ, przez Augustów do Suwałk."
 BST_k_nar_wojna:0 "Kampania łomżyńska"
 BST_k_nar_wojna_desc:0 "Państwo Narodowe nie chce rozmawiać. Armia przekracza Narew pod Tykocinem."
 BST_k_integracja:0 "Integracja Niziny"
 BST_k_integracja_desc:0 "Suwałki i Łomża dostają przedstawicieli w Radzie Regionu, a ich urzędy – nowe pieczątki."
 BST_k_nizina:0 "Nizina Podlaska"
 BST_k_nizina_desc:0 "Od Biebrzy po Bug, od Suwałk po Łomżę – Aleksiej Kaczyński ogłasza powstanie Niziny Podlaskiej."
 BST_m_droga:0 "Nieznany Warmiańczyk"
 BST_m_droga_desc:0 "Do Białegostoku przyjeżdża Krzysztof Kononowicz – Warmiak z wyboru, kandydat z przekonania. Mówi krótko: porządek, praca, mleko."
 BST_m_kampania:0 "Kampania na rynkach"
 BST_m_kampania_desc:0 "Kononowicz objeżdża targowiska od Bielska po Sokółkę. Rozmawia z każdym, kto chce słuchać – a słucha coraz więcej ludzi."
 BST_m_wladza:0 "Prezydent Kononowicz"
 BST_m_wladza_desc:0 "Kandydat, którego nikt nie traktował poważnie, wygrywa wybory. Zaczyna się Mleczny Ład."
 BST_m_mleko:0 "Mleko w każdej szkole"
 BST_m_mleko_desc:0 "Pierwsza obietnica spełniona: kartony mleka w każdej szkole i koszarach. Rolnicy mają zbyt, dzieci – drugie śniadanie."
 BST_m_mleczarnie:0 "Podlaskie mleczarnie"
 BST_m_mleczarnie_desc:0 "Mleczarnie w Bielsku, Hajnówce i Sokółce pracują na trzy zmiany. Nabiał staje się walutą regionu."
 BST_m_porzadek:0 "Porządek na ulicach"
 BST_m_porzadek_desc:0 "Nowy prezydent obiecywał porządek – i straż miejska dostaje nowe radiowozy w biało-niebieskich barwach."
 BST_m_gwardia:0 "Gwardia Mleczna"
 BST_m_gwardia_desc:0 "Ochotnicze bataliony w białych beretach. Prezydent osobiście wręcza im pierwsze kartony."
 BST_m_cysterny:0 "Kolumny cystern"
 BST_m_cysterny_desc:0 "Cysterny z mlekiem jeżdżą po całym regionie. Przy okazji wożą też paliwo – i żołnierzy."
 BST_m_mapa:0 "Mapa Mlecznego Imperium"
 BST_m_mapa_desc:0 "Na ścianie gabinetu prezydenta wisi mapa: Podlasie, Suwalszczyzna, Łomża, Warmia i Mazury. Wszystkie zaznaczone na biało."
 BST_m_suwalki:0 "Suwałki pod białą flagą"
 BST_m_suwalki_desc:0 "Gwardia Mleczna rusza na Suwalszczyznę. Kto przyjmie mleko, ten zostanie przyjęty."
 BST_m_lomza:0 "Łomża i Piątnica"
 BST_m_lomza_desc:0 "Mleczarnie w Piątnicy i Wysokiem Mazowieckiem to perła regionu. Mleczne Imperium nie może bez nich istnieć."
 BST_m_mazury:0 "Wyprawa na Mazury"
 BST_m_mazury_desc:0 "Gwardia Mleczna rusza nad jeziora. Mazury mają dużo wody – brakuje im tylko mleka."
 BST_m_warmia:0 "Powrót na Warmię"
 BST_m_warmia_desc:0 "Warmiak wraca do domu – z armią. Olsztyn ma zobaczyć, kim stał się „nieznany Warmiańczyk”."
 BST_m_integracja:0 "Prowincje Imperium"
 BST_m_integracja_desc:0 "Podbite i przyłączone ziemie dostają gubernatorów, mleczarnie i lodówki w każdej szkole."
 BST_m_imperium:0 "Mleczne Imperium"
 BST_m_imperium_desc:0 "Od Olsztyna po Siemiatycze płyną cysterny z mlekiem. Krzysztof Kononowicz ogłasza powstanie Mlecznego Imperium."
 BST_e_przejecie:0 "Generał w Pałacu Branickich"
 BST_e_przejecie_desc:0 "Gen. Arkadij Riazancew przejmuje władzę „do czasu przywrócenia porządku”. Nikt nie pyta, kiedy to nastąpi."
 BST_e_stan:0 "Stan wojenny"
 BST_e_stan_desc:0 "Godzina policyjna, patrole i zakaz zgromadzeń. Białystok milknie."
 BST_e_dostawy:0 "Dostawy z Grodna"
 BST_e_dostawy_desc:0 "Przez dawne przejście w Kuźnicy jadą ciężarówki z bronią i amunicją."
 BST_e_garnizony:0 "Garnizony enklawy"
 BST_e_garnizony_desc:0 "Koszary w Białymstoku, Bielsku i Hajnówce znów są pełne."
 BST_e_propaganda:0 "Radio Enklawy"
 BST_e_propaganda_desc:0 "Radio nadaje komunikaty generała po polsku i po rosyjsku."
 BST_e_przemysl:0 "Fabryki enklawy"
 BST_e_przemysl_desc:0 "Zakłady przy Elewatorskiej produkują dla armii."
 BST_e_doradcy:0 "Doradcy wojskowi"
 BST_e_doradcy_desc:0 "Oficerowie bez dystynkcji szkolą lokalne pułki."
 BST_e_porzadek:0 "Porządek generała"
 BST_e_porzadek_desc:0 "Granica jest zamknięta na głucho – także dla przemytników. Generał ma swoje sposoby."
 BST_e_twierdza:0 "Twierdza Podlasie"
 BST_e_twierdza_desc:0 "Enklawa staje się twierdzą między Litwą, Polską a Białorusią."
 BST_e_strefa:0 "Strefa buforowa"
 BST_e_strefa_desc:0 "Generał ogłasza, że enklawa potrzebuje „strefy bezpieczeństwa” – czyli ziem sąsiadów."
 BST_e_przesmyk:0 "Przesmyk suwalski"
 BST_e_przesmyk_desc:0 "Wąski pas ziemi między Białorusią a Królewcem. Kto go kontroluje, kontroluje drogę na północ."
 BST_e_lomza:0 "Marsz na Łomżę"
 BST_e_lomza_desc:0 "Państwo Narodowe zostaje uznane za „zagrożenie dla enklawy”."
 BST_e_korytarz:0 "Korytarz na północ"
 BST_e_korytarz_desc:0 "Przez zdobyty przesmyk przejeżdżają pierwsze kolumny wojskowe w stronę Królewca."
 BST_e_mazury:0 "Uderzenie na Mazury"
 BST_e_mazury_desc:0 "Generał patrzy na mapę jezior. Mazury leżą dokładnie na drodze do Królewca."
 BST_e_protektorat:0 "Pod opieką Moskwy?"
 BST_e_protektorat_desc:0 "Generał może poprosić Rosję o oficjalną opiekę – albo zostać niezależnym watażką."
 BST_e_final:0 "Enklawa Podlaska"
 BST_e_final_desc:0 "Między Bugiem a Biebrzą powstało państwo, którego nikt nie chciał i którego nikt nie potrafi pokonać."
