 BYD2_prz_w_integracja_desc:0 "Gminy podporządkowane Bydgoszczy stają się jej częścią."
 BYD2_prz_w_swiecie:0 "Unia ze Świeciem"
 BYD2_prz_w_swiecie_desc:0 "Świecie i papiernia nad Wisłą dostają propozycję unii z Bydgoszczą."
 BYD2_prz_w_dominacja:0 "Przewodnictwo w regionie"
 BYD2_prz_w_dominacja_desc:0 "Bydgoszcz jest najsilniejszym państwem w okolicy."
 BYD2_rad_przejecie:0 "Rady przejmują miasto"
 BYD2_rad_przejecie_desc:0 "Delegaci rad robotniczych zajmują Ratusz. Pierwsze posiedzenie odbywa się w hali PESY, przy taśmie produkcyjnej."
 BYD2_rad_kongres:0 "Kongres zakładów"
 BYD2_rad_kongres_desc:0 "Każdy zakład wysyła delegatów. Kongres decyduje o płacach, produkcji i budżecie miasta."
 BYD2_rad_kontrola:0 "Robotnicza kontrola"
 BYD2_rad_kontrola_desc:0 "Każda faktura i każdy kontrakt są jawne. Dyrektorzy mogą zostać – jako doradcy."
 BYD2_rad_kontrola_tb:0 "Robotnicza kontrola"
 BYD2_rad_mieszkania:0 "Mieszkania dla robotników"
 BYD2_rad_mieszkania_desc:0 "Puste mieszkania w kamienicach na Gdańskiej trafiają do rodzin robotniczych."
 BYD2_rad_osiem_godzin:0 "Sześć godzin pracy"
 BYD2_rad_osiem_godzin_desc:0 "Rady skracają dzień pracy. Wydajność spada, morale rośnie."
 BYD2_rad_milicja:0 "Milicja robotnicza"
 BYD2_rad_milicja_desc:0 "Każdy zakład wystawia oddział. Dowódców wybierają robotnicy."
 BYD2_rad_spoldzielnie:0 "Spółdzielnie produkcyjne"
 BYD2_rad_spoldzielnie_desc:0 "Opuszczone hale przy Kanale zamieniają się w spółdzielnie: meble, części, odzież i chleb."
 BYD2_rad_magazyny:0 "Wspólne magazyny"
 BYD2_rad_magazyny_desc:0 "Magazyny w porcie należą do wszystkich. Każda dzielnica wie, ile ma mąki i paliwa."
 BYD2_rad_pesa:0 "PESA w rękach robotników"
 BYD2_rad_pesa_desc:0 "Rada zakładowa PESY uruchamia produkcję na trzy zmiany – dla miasta i dla regionu."
 BYD2_rad_kanal:0 "Kanał i port"
 BYD2_rad_kanal_desc:0 "Barkarze i dokerzy tworzą własną spółdzielnię transportową."
 BYD2_rad_plan:0 "Plan produkcji"
 BYD2_rad_plan_desc:0 "Kongres zakładów uchwala plan. Każda hala wie, co i dla kogo produkuje."
 BYD2_rad_gospodarka:0 "Gospodarka wspólnotowa"
 BYD2_rad_gospodarka_desc:0 "Spółdzielnie, rady i wspólne magazyny działają razem. Bydgoszcz pokazuje, że da się inaczej."
 BYD2_rad_wezwanie:0 "Wezwanie do gmin"
 BYD2_rad_wezwanie_desc:0 "Rady wysyłają list do każdej gminy: przyłączcie się, nie jako poddani, lecz jako równi."
 BYD2_rad_torun_kontakty:0 "Robotnicy Torunia"
 BYD2_rad_torun_kontakty_desc:0 "Związkowcy z Apatora i toruńskich zajezdni przyjeżdżają do Bydgoszczy. Robotnicy obu miast mają więcej wspólnego niż ich ratusze."
 BYD2_rad_federacja_soc:0 "Federacja socjalna z Toruniem"
 BYD2_rad_federacja_soc_desc:0 "Jeśli w Toruniu rządzi Michał Romanowski, oba miasta mogą stworzyć federację socjalną."
 BYD2_rad_federacja_kom:0 "Rady i komuny"
 BYD2_rad_federacja_kom_desc:0 "Jeśli w Toruniu rządzą komuny Krevienki, rady proponują federację – ale spór syndykalistów z anarchistami może skończyć się wojną."
 BYD2_rad_referenda:0 "Referenda robotnicze"
 BYD2_rad_referenda_desc:0 "Mieszkańcy spornych gmin głosują, czy chcą przystąpić do Republiki Rad."
 BYD2_rad_front:0 "Front Robotniczy"
 BYD2_rad_front_desc:0 "Rady zakładają sojusz lewicowych państw regionu."
 BYD2_rad_milicje:0 "Milicje dzielnicowe"
 BYD2_rad_milicje_desc:0 "Każda dzielnica i każdy zakład wystawia oddział z wybieranymi dowódcami."
 BYD2_rad_obrona_zakladow:0 "Obrona zakładów"
 BYD2_rad_obrona_zakladow_desc:0 "Każda hala ma plan obrony i zapasy na miesiąc oblężenia."
 BYD2_rad_szkolenie:0 "Szkolenie robotników"
 BYD2_rad_szkolenie_desc:0 "Weterani uczą młodych obsługi broni po godzinach pracy."
 BYD2_rad_wyposazenie:0 "Broń z Nitro-Chemu"
 BYD2_rad_wyposazenie_desc:0 "Zakłady produkują amunicję i granaty dla milicji."
 BYD2_rad_mobilizacja:0 "Obywatelska mobilizacja"
 BYD2_rad_mobilizacja_desc:0 "Gdy trzeba bronić miasta, staje całe miasto. Milicje zamieniają się w armię."
 BYD2_rad_kujawy:0 "Rewolucja na Kujawach"
 BYD2_rad_kujawy_desc:0 "Robotnicy Inowrocławia czekają na wsparcie. Milicje ruszają na Kujawy."
 BYD2_rad_rada_regionu:0 "Rada Robotnicza Regionu"
 BYD2_rad_rada_regionu_desc:0 "Delegaci rad z całego regionu zjeżdżają do Bydgoszczy."
 BYD2_rad_swiecie:0 "Robotnicy Świecia"
 BYD2_rad_swiecie_desc:0 "Papiernia w Świeciu to serce przemysłu północy. Robotnicy muszą przejąć zakład."
 BYD2_rad_integracja:0 "Rady na nowych ziemiach"
 BYD2_rad_integracja_desc:0 "Wyzwolone gminy zakładają własne rady i wysyłają delegatów do Bydgoszczy."
 BYD2_rad_region:0 "Region robotników"
 BYD2_rad_region_desc:0 "Republika Rad ogłasza, że cały region jest przestrzenią wolnej pracy."
 BYD2_rad_armia:0 "Armia Rad"
 BYD2_rad_armia_desc:0 "Milicje rad tworzą wspólną armię z wybieralnymi dowódcami."
 BYD2_rad_final:0 "Republika Rad"
 BYD2_rad_final_desc:0 "Od PESY po port w Brdyujściu – region należy do tych, którzy pracują."
