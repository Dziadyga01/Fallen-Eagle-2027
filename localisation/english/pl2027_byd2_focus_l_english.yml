l_english:
 BYD2_bez_panstwa:0 "Bydgoszcz bez państwa"
 BYD2_bez_panstwa_desc:0 "Jedenastego listopada Bydgoszcz obudziła się bez państwa nad sobą. W Ratuszu przy Jezuickiej zbiera się Komitet Tymczasowy, bo nikt inny nie chce wziąć kluczy."
 BYD2_komitet:0 "Komitet Tymczasowy"
 BYD2_komitet_desc:0 "Urzędnicy z Urzędu Wojewódzkiego i Ratusza wracają do biurek. Z ich teczek można zbudować państwo – i sieć wpływów w okolicznych gminach."
 BYD2_mosty:0 "Mosty na Brdzie"
 BYD2_mosty_desc:0 "Przez Brdę i Wisłę prowadzi kilkanaście mostów – od Bernardyńskiego po Fordoński. Kto je kontroluje, kontroluje miasto."
 BYD2_kolejki:0 "Kolejki na Błoniu"
 BYD2_kolejki_desc:0 "Hurtownie na Fordońskiej mają towar na tydzień. Trzeba ustalić, kto rozdziela chleb, paliwo i leki."
 BYD2_pesa:0 "Strajk przed bramą PESY"
 BYD2_pesa_desc:0 "PESA bez zamówień, Nitro-Chem bez kontraktów. Tysiące robotników czekają przed bramami na decyzję."
 BYD2_fordon:0 "Fordon i Wisła"
 BYD2_fordon_desc:0 "Most Fordoński łączy miasto z Ostromeckiem i drugim brzegiem Wisły. Toruń też ma na tę przeprawę ochotę."
 BYD2_solec:0 "Spór o Solec Kujawski"
 BYD2_solec_desc:0 "Solec leży w połowie drogi do Torunia i obie metropolie uważają go za swoje przedmieście."
 BYD2_oficerowie:0 "Oficerowie z Szubińskiej"
 BYD2_oficerowie_desc:0 "Oficerowie z koszar przy Szubińskiej proponują „pomoc w utrzymaniu porządku”. Płk Fordoński nie ukrywa ambicji."
 BYD2_rady:0 "Rady w zakładach"
 BYD2_rady_desc:0 "W PESIE i Nitro-Chemie robotnicy wybierają własne rady. Chcą kontroli nad zakładami – i nad miastem."
 BYD2_przemyslowcy:0 "Przemysłowcy zakładają Radę"
 BYD2_przemyslowcy_desc:0 "Prezesi największych firm miasta zakładają Radę Przemysłową. Mają pieniądze, kontakty i plan – miasto ma być zarządzane jak firma."
 BYD2_brdowski:0 "Bydgoszcz Pierwsza!"
 BYD2_brdowski_desc:0 "Wiktor Brdowski, właściciel sieci myjni i lokalnej telewizji, zakłada ruch „Bydgoszcz Pierwsza”. Obiecuje tanie paliwo, nowy stadion i koniec „toruńskiej dyktatury”."
 BYD2_koniec_komitetu:0 "Koniec Komitetu Tymczasowego"
 BYD2_koniec_komitetu_desc:0 "Komitet Tymczasowy ogłasza wybory. Komitety mają tydzień na rejestrację – a Komitet decyduje, kogo dopuścić."
 BYD2_rejestracja:0 "Rejestracja komitetów"
 BYD2_rejestracja_desc:0 "Komisja wyborcza zamyka listy. Na kartach znajdą się tylko ci, których Komitet dopuścił."
 BYD2_debata:0 "Debata w Operze Nova"
 BYD2_debata_desc:0 "Sala Opery Nova pęka w szwach. Kto wygra debatę, ten może wygrać wybory."
 BYD2_wybory:0 "Wybory nad Brdą"
 BYD2_wybory_desc:0 "Lokale wyborcze w szkołach, punkty kontrolne przy mostach i obserwatorzy z każdego komitetu."
 BYD2_zaprzysiezenie:0 "Zaprzysiężenie nowych władz"
 BYD2_zaprzysiezenie_desc:0 "Nowa władza składa przysięgę w Ratuszu przy Jezuickiej. Kryzys się skończył – zaczyna się prawdziwa polityka."
 BYD2_kamp_brus_osiedla:0 "Spotkania na osiedlach"
 BYD2_kamp_brus_osiedla_desc:0 "Bruski odwiedza Fordon, Kapuściska i Błonie. Słucha, notuje i obiecuje, że urzędy znów będą działać."
 BYD2_kamp_brus_program:0 "Program „Bydgoszcz – miasto otwarte”"
 BYD2_kamp_brus_program_desc:0 "Jawny budżet, sprawna administracja i współpraca z sąsiadami zamiast wojny o każdy most."
 BYD2_kamp_brus_urzednicy:0 "Poparcie urzędników"
 BYD2_kamp_brus_urzednicy_desc:0 "Urzędnicy, którzy przez kryzys trzymali miasto przy życiu, stają za dawnym prezydentem."
 BYD2_kamp_brus_rynek:0 "Wiec na Starym Rynku"
 BYD2_kamp_brus_rynek_desc:0 "Tysiące ludzi na Starym Rynku. Bruski mówi o ciągłości i odbudowie."
 BYD2_kamp_brus_poparcie:0 "Komitet popiera: Rafał Bruski"
 BYD2_kamp_brus_poparcie_desc:0 "Komitet Tymczasowy oficjalnie popiera kandydaturę: Rafał Bruski. Komitet „Bydgoszcz Obywatelska” zostanie dopuszczony do wyborów bez głosowania, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 BYD2_kamp_prze_mlyny:0 "Kolacja w Młynach Rothera"
 BYD2_kamp_prze_mlyny_desc:0 "Prezesi największych firm spotykają się na Wyspie Młyńskiej. Miasto ma być zarządzane jak przedsiębiorstwo."
 BYD2_kamp_prze_program:0 "Program „Bydgoszcz pracuje”"
 BYD2_kamp_prze_program_desc:0 "Kontrakty dla PESY, niskie podatki i ochrona zakładów przed strajkami."
 BYD2_kamp_prze_izba:0 "Poparcie izby gospodarczej"
 BYD2_kamp_prze_izba_desc:0 "Izba gospodarcza finansuje kampanię Rady Przemysłowej."
 BYD2_kamp_prze_media:0 "Kampania w lokalnych mediach"
 BYD2_kamp_prze_media_desc:0 "Billboardy na Fordońskiej i spoty w radiu: „Praca, nie wiece”."
 BYD2_kamp_prze_poparcie:0 "Komitet popiera: Rada Przemysłowa"
 BYD2_kamp_prze_poparcie_desc:0 "Komitet Tymczasowy oficjalnie popiera kandydaturę: Rada Przemysłowa. Komitet „Rada Przemysłowa Bydgoszczy” zostanie dopuszczony do wyborów bez głosowania, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 BYD2_kamp_rady_zebrania:0 "Zebrania w PESIE"
 BYD2_kamp_rady_zebrania_desc:0 "W halach PESY robotnicy wybierają delegatów. Każdy wydział ma swój głos."
 BYD2_kamp_rady_program:0 "Program „Zakłady dla załóg”"
 BYD2_kamp_rady_program_desc:0 "Rady pracownicze w każdej fabryce i miasto zarządzane przez delegatów dzielnic."
 BYD2_kamp_rady_zwiazki:0 "Poparcie związków z Nitro-Chemu"
 BYD2_kamp_rady_zwiazki_desc:0 "Związkowcy z Nitro-Chemu i zajezdni ogłaszają poparcie dla Rad."
 BYD2_kamp_rady_brama:0 "Wiec przed bramą PESY"
 BYD2_kamp_rady_brama_desc:0 "Przed bramą zakładów gromadzi się cały Fordon. Rady pokazują, że mają większość."
 BYD2_kamp_rady_poparcie:0 "Komitet popiera: Rady Robotnicze"
 BYD2_kamp_rady_poparcie_desc:0 "Komitet Tymczasowy oficjalnie popiera kandydaturę: Rady Robotnicze. Komitet „Bydgoskie Rady Robotnicze” zostanie dopuszczony do wyborów bez głosowania, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 BYD2_kamp_junt_patrole:0 "Patrole z Szubińskiej"
 BYD2_kamp_junt_patrole_desc:0 "Żołnierze z koszar przy Szubińskiej patrolują ulice. Mieszkańcy po raz pierwszy od tygodni czują się bezpiecznie."
 BYD2_kamp_junt_program:0 "Program „Porządek nad Brdą”"
 BYD2_kamp_junt_program_desc:0 "Godzina policyjna, ochrona mostów i armia zamiast „gadających komitetów”."
 BYD2_kamp_junt_rezerwisci:0 "Poparcie rezerwistów"
 BYD2_kamp_junt_rezerwisci_desc:0 "Związki rezerwistów i strzelcy ogłaszają poparcie dla płk. Fordońskiego."
 BYD2_kamp_junt_defilada:0 "Defilada na Wyspie Młyńskiej"
 BYD2_kamp_junt_defilada_desc:0 "Kompanie z Szubińskiej maszerują przez centrum. Jedni klaszczą, inni zamykają okna."
 BYD2_kamp_junt_poparcie:0 "Komitet popiera: płk Tomasz Fordoński"
 BYD2_kamp_junt_poparcie_desc:0 "Komitet Tymczasowy oficjalnie popiera kandydaturę: płk Tomasz Fordoński. Komitet „Komitet Bezpieczeństwa” zostanie dopuszczony do wyborów bez głosowania, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 BYD2_kamp_brdo_myjnie:0 "Darmowe myjnie dla mieszkańców"
 BYD2_kamp_brdo_myjnie_desc:0 "Sieć myjni Brdowskiego myje auta za darmo – „na koszt przyszłego prezydenta”."
 BYD2_kamp_brdo_program:0 "Program „Bydgoszcz Pierwsza”"
 BYD2_kamp_brdo_program_desc:0 "Tanie paliwo, nowy stadion i koniec „toruńskich przywilejów”."
 BYD2_kamp_brdo_telewizja:0 "Telewizja Brdowskiego"
 BYD2_kamp_brdo_telewizja_desc:0 "Lokalna telewizja nadaje kampanię bez przerwy. Każdy wieczór kończy się wywiadem z właścicielem."
 BYD2_kamp_brdo_festyn:0 "Festyn w Myślęcinku"
 BYD2_kamp_brdo_festyn_desc:0 "Grill, koncert i darmowe bilety na mecz. Polityka przez żołądek działa."
 BYD2_kamp_brdo_poparcie:0 "Komitet popiera: Wiktor Brdowski"
 BYD2_kamp_brdo_poparcie_desc:0 "Komitet Tymczasowy oficjalnie popiera kandydaturę: Wiktor Brdowski. Komitet „Ruch „Bydgoszcz Pierwsza”” zostanie dopuszczony do wyborów bez głosowania, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 BYD2_bru_ratusz:0 "Republika Bydgoska"
 BYD2_bru_ratusz_desc:0 "Rafał Bruski obejmuje urząd w Ratuszu przy Jezuickiej. Pierwsza decyzja: jawny budżet i sesje transmitowane na żywo."
 BYD2_bru_konstytucja:0 "Konstytucja Brdy"
 BYD2_bru_konstytucja_desc:0 "Prawnicy z UKW piszą konstytucję w kamienicach na Wyspie Młyńskiej. Władza należy do obywateli."
 BYD2_bru_sady:0 "Niezależne sądy"
 BYD2_bru_sady_desc:0 "Sąd Okręgowy przy Wałach Jagiellońskich znów orzeka. Sędziowie nie pytają, której frakcji jest oskarżony."
 BYD2_bru_media:0 "Wolne media"
 BYD2_bru_media_desc:0 "Lokalne gazety i telewizja nadają bez cenzury. Krytykują rząd, ale też przypominają, że w Toruniu jest gorzej."
 BYD2_bru_rady_osiedli:0 "Rady osiedli"
 BYD2_bru_rady_osiedli_desc:0 "Każde osiedle ma swojego przedstawiciela w radzie doradczej prezydenta."
 BYD2_bru_demokracja:0 "Odnowiona demokracja"
 BYD2_bru_demokracja_desc:0 "Wolne wybory i niezależne komisje – Republika jest przeciwieństwem chaosu, który ją zrodził."
 BYD2_bru_pesa:0 "Odbudować PESĘ"
 BYD2_bru_pesa_desc:0 "Hale przy Zielonej znów pracują. Pierwszy tramwaj z nowej serii trafi do Bydgoszczy, następne – do każdego, kto zapłaci."
 BYD2_bru_kanal:0 "Kanał Bydgoski"
 BYD2_bru_kanal_desc:0 "Śluzy kanału łączącego Brdę z Notecią znów przepuszczają barki – od Nakła aż po Wisłę."
 BYD2_bru_park:0 "Park technologiczny"
 BYD2_bru_park_desc:0 "Firmy z Parku Przemysłowo-Technologicznego dostają ulgi i zamówienia Republiki."
 BYD2_bru_park_tb:0 "Park technologiczny"
 BYD2_bru_port:0 "Port w Brdyujściu"
 BYD2_bru_port_desc:0 "Port rzeczny przeładowuje zboże, drewno i kontenery. Barki płyną do Gdańska bez pytania nikogo o zgodę."
 BYD2_bru_praca:0 "Nowe miejsca pracy"
 BYD2_bru_praca_desc:0 "Autobusy z Nowej Wsi Wielkiej i Białych Błot przywożą ludzi do bydgoskich fabryk. Pensje przekonują lepiej niż ulotki."
 BYD2_bru_serce:0 "Gospodarcze serce regionu"
 BYD2_bru_serce_desc:0 "Bydgoszcz znów jest miastem, w którym się pracuje, handluje i produkuje."
 BYD2_bru_sasiedzi:0 "Dobre sąsiedztwo"
 BYD2_bru_sasiedzi_desc:0 "Delegacje z Ratusza jadą do Solca, Koronowa i Osielska z ofertą współpracy, nie żądaniami."
 BYD2_bru_traktat:0 "Traktat Bydgoski"
 BYD2_bru_traktat_desc:0 "Gminy wokół Bydgoszczy dostają propozycję wspólnego rynku, wspólnych dróg i wspólnej obrony."
 BYD2_bru_sejm:0 "Wspólny Sejm Kujawski"
 BYD2_bru_sejm_desc:0 "Delegaci gmin obradują w Operze Nova – bo tylko tam jest dość krzeseł."
 BYD2_bru_pakt_trn:0 "Pakt z Toruniem"
 BYD2_bru_pakt_trn_desc:0 "Prezydent proponuje Toruniowi koniec sporów: wspólne lotnisko, szpital i obronę regionu."
 BYD2_bru_europa:0 "Okno na Europę"
 BYD2_bru_europa_desc:0 "Bydgoszcz nawiązuje kontakty z Niemcami i Litwą. Handel wraca, a z nim inwestorzy."
 BYD2_bru_wspolne:0 "Wspólne instytucje regionu"
 BYD2_bru_wspolne_desc:0 "Szpital, lotnisko i straż pożarna obsługują cały region. Współpraca okazuje się tańsza niż spór."
 BYD2_bru_gwardia:0 "Gwardia Republiki"
 BYD2_bru_gwardia_desc:0 "Ochotnicy z dawnej obrony terytorialnej tworzą Gwardię – wojsko, które przysięga na konstytucję."
 BYD2_bru_przeprawy:0 "Obrona przepraw"
 BYD2_bru_przeprawy_desc:0 "Saperzy przygotowują stanowiska przy każdym moście na Brdzie i przy przeprawie w Fordonie."
 BYD2_bru_inzynieria:0 "Wojska inżynieryjne"
 BYD2_bru_inzynieria_desc:0 "Bydgoszcz ma tradycje saperskie i pontonowe. Gwardia uczy się budować mosty szybciej, niż wróg je wysadza."
 BYD2_bru_inz_tb:0 "Wojska inżynieryjne"
 BYD2_bru_sojusz:0 "Sojusz demokratycznych miast"
 BYD2_bru_sojusz_desc:0 "Republika zakłada sojusz demokratycznych państw regionu."
 BYD2_bru_gwarancje:0 "Gwarancje dla sąsiadów"
 BYD2_bru_gwarancje_desc:0 "Republika gwarantuje niepodległość małym sąsiadom. Kto ma Bydgoszcz za plecami, nie musi bać się nikogo."
 BYD2_bru_brda:0 "Bezpieczna Brda"
 BYD2_bru_brda_desc:0 "Gwardia, saperzy i sojusznicy tworzą linię obrony od Koronowa po Fordon."
 BYD2_bru_republika:0 "Republika obywateli"
 BYD2_bru_republika_desc:0 "Bydgoszcz to państwo prawa w regionie, który go zapomniał. To przyciąga ludzi – i ich pieniądze."
 BYD2_bru_zjazd:0 "Zjazd miast regionu"
 BYD2_bru_zjazd_desc:0 "Prezydenci i burmistrzowie zjeżdżają do Bydgoszczy. Temat: wspólna przyszłość Kujaw i Pomorza."
 BYD2_bru_wspolna_rep:0 "Wspólna republika z Toruniem"
 BYD2_bru_wspolna_rep_desc:0 "Jeśli w Toruniu rządzi Paweł Gulewski, dwa miasta mogą stworzyć jedną demokratyczną republikę."
 BYD2_bru_kujawy_pomorze:0 "Kujawy i Pomorze razem"
 BYD2_bru_kujawy_pomorze_desc:0 "Republika zgłasza roszczenia do regionu – by negocjować z pozycji siły."
 BYD2_bru_integracja:0 "Integracja regionu"
 BYD2_bru_integracja_desc:0 "Gminy, które dobrowolnie przystąpiły do Republiki, dostają pełne prawa i własnych przedstawicieli."
 BYD2_bru_final:0 "Nowa Republika Kujawsko-Pomorska"
 BYD2_bru_final_desc:0 "Od Tucholi po Inowrocław – republika obywateli staje się państwem regionu."
 BYD2_bru_r_plan:0 "Plan rozbudowy Bydgoszczy"
 BYD2_bru_r_plan_desc:0 "Ratusz zatwierdza plan: osiedla, drogi i usługi publiczne."
 BYD2_bru_r_fordon:0 "Fordon"
 BYD2_bru_r_fordon_desc:0 "Największa dzielnica miasta dostaje nowe szkoły, przychodnie i tramwaj."
 BYD2_bru_r_kapusciska:0 "Kapuściska i Wyżyny"
 BYD2_bru_r_kapusciska_desc:0 "Blokowiska dostają ocieplenie, windy i nowe sklepy."
 BYD2_bru_r_uczelnie:0 "UKW i Politechnika"
 BYD2_bru_r_uczelnie_desc:0 "Uczelnie kształcą inżynierów dla PESY i całego regionu."
 BYD2_bru_r_uczelnie_tb:0 "UKW i Politechnika"
 BYD2_bru_r_osiedla:0 "Nowe osiedla"
 BYD2_bru_r_osiedla_desc:0 "Mieszkania dla rodzin, które uciekły z mniejszych miejscowości do bezpiecznej Bydgoszczy."
 BYD2_bru_r_tramwaje:0 "Tramwaje z PESY"
 BYD2_bru_r_tramwaje_desc:0 "Nowe linie tramwajowe łączą Fordon, Błonie i Kapuściska."
 BYD2_bru_r_infrastruktura:0 "Infrastruktura regionalna"
 BYD2_bru_r_infrastruktura_desc:0 "Drogi do gmin i węzły kolejowe – zaplecze dla gospodarki i armii."
 BYD2_bru_r_2030:0 "Bydgoszcz 2030"
 BYD2_bru_r_2030_desc:0 "Miasto ma plan na najbliższe lata – i środki, żeby go zrealizować."
 BYD2_bru_p_odbudowa:0 "Odbudowa przemysłu"
 BYD2_bru_p_odbudowa_desc:0 "Bydgoskie firmy wracają do pracy po miesiącach chaosu."
 BYD2_bru_p_odbudowa_tb:0 "Odbudowa przemysłu"
 BYD2_bru_p_pesa:0 "Zamówienia dla PESY"
 BYD2_bru_p_pesa_desc:0 "Tramwaje i wagony dla regionu – za gotówkę albo za wpływy."
 BYD2_bru_p_chemia:0 "Chemia nad Brdą"
 BYD2_bru_p_chemia_desc:0 "Nitro-Chem i dawne zakłady chemiczne produkują nawozy i materiały wybuchowe."
 BYD2_bru_p_zachem:0 "Rekultywacja Zachemu"
 BYD2_bru_p_zachem_desc:0 "Skażone tereny po Zachemie wreszcie są oczyszczane. Woda w Brdzie znów nadaje się do picia."
 BYD2_bru_p_port:0 "Port i Kanał"
 BYD2_bru_p_port_desc:0 "Barki z Bydgoszczy płyną do Gdańska i na zachód."
 BYD2_bru_p_belma:0 "Elektronika"
 BYD2_bru_p_belma_desc:0 "Belma i firmy parku technologicznego produkują elektronikę dla miasta i wojska."
 BYD2_bru_p_belma_tb:0 "Elektronika"
 BYD2_bru_p_strefa:0 "Strefa ekonomiczna"
 BYD2_bru_p_strefa_desc:0 "Inwestorzy z całego regionu otwierają zakłady nad Brdą."
 BYD2_bru_p_przemysl:0 "Przemysłowa stolica regionu"
 BYD2_bru_p_przemysl_desc:0 "Bydgoszcz znów ma przemysł, z którego może być dumna."
 BYD2_bru_p_przemysl_tb:0 "Przemysłowa stolica regionu"
 BYD2_bru_d_urzednicy:0 "Pomoc administracyjna"
 BYD2_bru_d_urzednicy_desc:0 "Bydgoscy urzędnicy pomagają gminom uporządkować ewidencję, budżet i zamówienia. Przy okazji poznają wszystkie dokumenty."
 BYD2_bru_d_misje:0 "Misje dyplomatyczne"
 BYD2_bru_d_misje_desc:0 "Delegacje z Bydgoszczy, orkiestra i tort z herbem miasta."
 BYD2_bru_d_finansowanie:0 "Finansowanie lokalnych organizacji"
 BYD2_bru_d_finansowanie_desc:0 "Kluby sportowe, stowarzyszenia i koła gospodyń dostają granty z Bydgoszczy."
 BYD2_bru_d_metropolia:0 "Spór o metropolię"
 BYD2_bru_d_metropolia_desc:0 "Bydgoszcz wchodzi do sporu z Toruniem o gminy między miastami."
 BYD2_bru_d_kampanie:0 "Inwestycje w gminach"
 BYD2_bru_d_kampanie_desc:0 "Plakaty, wiece i inwestycje w gminach między miastami."
 BYD2_bru_d_referenda:0 "Lokalne referenda"
 BYD2_bru_d_referenda_desc:0 "Gminy, w których Bydgoszcz ma przewagę, głosują o przyłączeniu – w sporze o metropolię i w strefie wpływów."
 BYD2_bru_d_sasiedzi:0 "Krajna i Pałuki"
 BYD2_bru_d_sasiedzi_desc:0 "Gminy Krajny i Pałuk dostają ofertę wspólnoty."
 BYD2_bru_d_metropolia_f:0 "Federacja Bydgosko-Toruńska"
 BYD2_bru_d_metropolia_f_desc:0 "Spór o metropolię dobiega końca: Bydgoszcz proponuje Toruniowi federację."
 BYD2_bru_w_obrona:0 "Obrona Brdy"
 BYD2_bru_w_obrona_desc:0 "Umocnienia przy mostach, na skarpie fordońskiej i przy Kanale."
 BYD2_bru_w_mobilizacja:0 "Mobilizacja miejska"
 BYD2_bru_w_mobilizacja_desc:0 "Każda dzielnica wystawia kompanię ochotników."
 BYD2_bru_w_garnizon:0 "Garnizon bydgoski"
 BYD2_bru_w_garnizon_desc:0 "Koszary przy Szubińskiej znów są pełne."
 BYD2_bru_w_roszczenia:0 "Roszczenia regionalne"
 BYD2_bru_w_roszczenia_desc:0 "Bydgoszcz zgłasza roszczenia do sąsiednich gmin – jako podstawa do negocjacji."
 BYD2_bru_w_lokalne:0 "Zaproszenie dla gmin"
 BYD2_bru_w_lokalne_desc:0 "Gminy wokół Bydgoszczy dostają zaproszenie do wspólnoty."
 BYD2_bru_w_integracja:0 "Integracja gmin"
 BYD2_bru_w_integracja_desc:0 "Gminy podporządkowane Bydgoszczy stają się jej częścią."
 BYD2_bru_w_swiecie:0 "Unia ze Świeciem"
 BYD2_bru_w_swiecie_desc:0 "Świecie i papiernia nad Wisłą dostają propozycję unii z Bydgoszczą."
 BYD2_bru_w_dominacja:0 "Przewodnictwo w regionie"
 BYD2_bru_w_dominacja_desc:0 "Bydgoszcz jest najsilniejszym państwem w okolicy."
 BYD2_prz_rada:0 "Rada Przemysłowa przejmuje stery"
 BYD2_prz_rada_desc:0 "Prezesi największych firm zasiadają w Ratuszu. Miasto ma być zarządzane jak dobrze prowadzona spółka."
 BYD2_prz_zarzad:0 "Zarząd zamiast Rady Miasta"
 BYD2_prz_zarzad_desc:0 "Rada Miasta staje się radą nadzorczą. Głosują ci, którzy płacą najwięcej podatków."
 BYD2_prz_audyt:0 "Audyt miejskich spółek"
 BYD2_prz_audyt_desc:0 "Księgowi z Big Four przeglądają każdą fakturę. Połowa prezesów spółek miejskich szuka nowej pracy."
 BYD2_prz_prywatyzacja:0 "Prywatyzacja usług"
 BYD2_prz_prywatyzacja_desc:0 "Wodociągi, ciepłownia i komunikacja trafiają do spółek z udziałem prywatnym. Działa – za odpowiednią cenę."
 BYD2_prz_banki:0 "Bydgoski Bank Regionalny"
 BYD2_prz_banki_desc:0 "Nowy bank udziela kredytów firmom z całego regionu – i zbiera informacje o każdej z nich."
 BYD2_prz_lobby:0 "Lobby przemysłowe"
 BYD2_prz_lobby_desc:0 "Każdy radny ma doradcę z branży. Przypadkiem zawsze tej samej."
 BYD2_prz_pesa_eksport:0 "PESA na eksport"
 BYD2_prz_pesa_eksport_desc:0 "Tramwaje i pociągi z Bydgoszczy jadą do każdego państwa w regionie, które zapłaci gotówką."
 BYD2_prz_nitrochem:0 "Nitro-Chem"
 BYD2_prz_nitrochem_desc:0 "Zakłady chemiczne produkują materiały wybuchowe – na eksport i dla własnej ochrony."
 BYD2_prz_belma:0 "Belma i elektronika"
 BYD2_prz_belma_desc:0 "Zakłady elektroniczne produkują sprzęt łączności i czujniki."
 BYD2_prz_belma_tb:0 "Belma i elektronika"
 BYD2_prz_logistyka:0 "Logistyka Kanału"
 BYD2_prz_logistyka_desc:0 "Kanał Bydgoski, port i węzeł kolejowy tworzą centrum logistyczne regionu."
 BYD2_prz_strefa:0 "Specjalna strefa ekonomiczna"
 BYD2_prz_strefa_desc:0 "Zero podatków przez pięć lat dla każdego, kto otworzy fabrykę nad Brdą."
 BYD2_prz_konsorcjum:0 "Konsorcjum Brdy"
 BYD2_prz_konsorcjum_desc:0 "Wszystkie największe zakłady miasta tworzą jedno konsorcjum. Bydgoszcz to firma – i to dochodowa."
 BYD2_prz_kontrakty:0 "Kontrakty z gminami"
 BYD2_prz_kontrakty_desc:0 "Gminy dostają tanie dostawy i kredyty. Spłacają je lojalnością."
 BYD2_prz_wykup:0 "Wykup długów gmin"
 BYD2_prz_wykup_desc:0 "Rada Przemysłowa skupuje długi okolicznych gmin – i proponuje ich „restrukturyzację”."
 BYD2_prz_sponsor_pdg:0 "Sponsoring transmisji z Podgórza"
 BYD2_prz_sponsor_pdg_desc:0 "Najpopularniejszy stream w regionie potrzebuje sponsora. Rada Przemysłowa widzi w tym najtańszą reklamę w historii."
 BYD2_prz_przedstawicielstwa:0 "Przedstawicielstwa handlowe"
 BYD2_prz_przedstawicielstwa_desc:0 "Biura handlowe Bydgoszczy w Gdańsku, Poznaniu i Berlinie."
 BYD2_prz_rynek_trn:0 "Rynek toruński"
 BYD2_prz_rynek_trn_desc:0 "Toruńskie sklepy pełne są bydgoskich towarów. Spór o metropolię rozstrzyga się w koszykach."
 BYD2_prz_monopol:0 "Monopol regionalny"
 BYD2_prz_monopol_desc:0 "Kto chce kupić cement, tramwaj albo nawóz – kupuje w Bydgoszczy."
 BYD2_prz_ochrona:0 "Ochrona Przemysłowa"
 BYD2_prz_ochrona_desc:0 "Firmy ochroniarskie z dzielnicy przemysłowej stają się regularnym wojskiem z kontraktami."
 BYD2_prz_zbrojenia:0 "Kontrakty zbrojeniowe"
 BYD2_prz_zbrojenia_desc:0 "Nitro-Chem i warsztaty PESY dostają zamówienia na broń."
 BYD2_prz_sprzet:0 "Zakupy sprzętu"
 BYD2_prz_sprzet_desc:0 "Pieniądze konsorcjum kupują to, czego Bydgoszcz nie wyprodukuje sama."
 BYD2_prz_wywiad:0 "Wywiad gospodarczy"
 BYD2_prz_wywiad_desc:0 "Analitycy konsorcjum wiedzą o sąsiadach więcej niż ich własne rządy."
 BYD2_prz_wyw_tb:0 "Wywiad gospodarczy"
 BYD2_prz_kadra:0 "Kadra kontraktowa"
 BYD2_prz_kadra_desc:0 "Byli oficerowie zatrudnieni na kontraktach menedżerskich."
 BYD2_prz_armia:0 "Armia konsorcjum"
 BYD2_prz_armia_desc:0 "Ochrona Przemysłowa staje się armią, która broni interesów – i inwestycji."
 BYD2_prz_holding:0 "Holding Bydgoski"
 BYD2_prz_holding_desc:0 "Miasto, zakłady i gminy tworzą jeden holding z jednym zarządem."
 BYD2_prz_przejecia:0 "Przejęcia"
 BYD2_prz_przejecia_desc:0 "Gminy, które przyjęły restrukturyzację, stają się oddziałami holdingu."
 BYD2_prz_roszczenia:0 "Strefa ekonomiczna regionu"
 BYD2_prz_roszczenia_desc:0 "Holding zgłasza roszczenia do regionu, w którym i tak wszystko należy do niego."
 BYD2_prz_kujawy:0 "Oferta dla Kujaw"
 BYD2_prz_kujawy_desc:0 "Republika Kujawska dostaje ofertę: inwestycje w zamian za przyłączenie."
 BYD2_prz_dominacja:0 "Dominacja rynkowa"
 BYD2_prz_dominacja_desc:0 "Każda gmina w regionie zależy od bydgoskich dostaw."
 BYD2_prz_final:0 "Bydgoska Republika Przemysłowa"
 BYD2_prz_final_desc:0 "Bydgoszcz jest fabryką, bankiem i giełdą regionu. Polityka? To tylko dział w strukturze holdingu."
 BYD2_prz_r_plan:0 "Plan rozbudowy Bydgoszczy"
 BYD2_prz_r_plan_desc:0 "Ratusz zatwierdza plan: osiedla, drogi i usługi publiczne."
 BYD2_prz_r_fordon:0 "Fordon"
 BYD2_prz_r_fordon_desc:0 "Największa dzielnica miasta dostaje nowe szkoły, przychodnie i tramwaj."
 BYD2_prz_r_kapusciska:0 "Kapuściska i Wyżyny"
 BYD2_prz_r_kapusciska_desc:0 "Blokowiska dostają ocieplenie, windy i nowe sklepy."
 BYD2_prz_r_uczelnie:0 "UKW i Politechnika"
 BYD2_prz_r_uczelnie_desc:0 "Uczelnie kształcą inżynierów dla PESY i całego regionu."
 BYD2_prz_r_uczelnie_tb:0 "UKW i Politechnika"
 BYD2_prz_r_osiedla:0 "Nowe osiedla"
 BYD2_prz_r_osiedla_desc:0 "Mieszkania dla rodzin, które uciekły z mniejszych miejscowości do bezpiecznej Bydgoszczy."
 BYD2_prz_r_tramwaje:0 "Tramwaje z PESY"
 BYD2_prz_r_tramwaje_desc:0 "Nowe linie tramwajowe łączą Fordon, Błonie i Kapuściska."
 BYD2_prz_r_infrastruktura:0 "Infrastruktura regionalna"
 BYD2_prz_r_infrastruktura_desc:0 "Drogi do gmin i węzły kolejowe – zaplecze dla gospodarki i armii."
 BYD2_prz_r_2030:0 "Bydgoszcz 2030"
 BYD2_prz_r_2030_desc:0 "Miasto ma plan na najbliższe lata – i środki, żeby go zrealizować."
 BYD2_prz_p_odbudowa:0 "Odbudowa przemysłu"
 BYD2_prz_p_odbudowa_desc:0 "Bydgoskie firmy wracają do pracy po miesiącach chaosu."
 BYD2_prz_p_odbudowa_tb:0 "Odbudowa przemysłu"
 BYD2_prz_p_pesa:0 "Zamówienia dla PESY"
 BYD2_prz_p_pesa_desc:0 "Tramwaje i wagony dla regionu – za gotówkę albo za wpływy."
 BYD2_prz_p_chemia:0 "Chemia nad Brdą"
 BYD2_prz_p_chemia_desc:0 "Nitro-Chem i dawne zakłady chemiczne produkują nawozy i materiały wybuchowe."
 BYD2_prz_p_zachem:0 "Rekultywacja Zachemu"
 BYD2_prz_p_zachem_desc:0 "Skażone tereny po Zachemie wreszcie są oczyszczane. Woda w Brdzie znów nadaje się do picia."
 BYD2_prz_p_port:0 "Port i Kanał"
 BYD2_prz_p_port_desc:0 "Barki z Bydgoszczy płyną do Gdańska i na zachód."
 BYD2_prz_p_belma:0 "Elektronika"
 BYD2_prz_p_belma_desc:0 "Belma i firmy parku technologicznego produkują elektronikę dla miasta i wojska."
 BYD2_prz_p_belma_tb:0 "Elektronika"
 BYD2_prz_p_strefa:0 "Strefa ekonomiczna"
 BYD2_prz_p_strefa_desc:0 "Inwestorzy z całego regionu otwierają zakłady nad Brdą."
 BYD2_prz_p_przemysl:0 "Przemysłowa stolica regionu"
 BYD2_prz_p_przemysl_desc:0 "Bydgoszcz znów ma przemysł, z którego może być dumna."
 BYD2_prz_p_przemysl_tb:0 "Przemysłowa stolica regionu"
 BYD2_prz_d_urzednicy:0 "Pomoc administracyjna"
 BYD2_prz_d_urzednicy_desc:0 "Bydgoscy urzędnicy pomagają gminom uporządkować ewidencję, budżet i zamówienia. Przy okazji poznają wszystkie dokumenty."
 BYD2_prz_d_misje:0 "Misje dyplomatyczne"
 BYD2_prz_d_misje_desc:0 "Delegacje z Bydgoszczy, orkiestra i tort z herbem miasta."
 BYD2_prz_d_finansowanie:0 "Finansowanie lokalnych organizacji"
 BYD2_prz_d_finansowanie_desc:0 "Kluby sportowe, stowarzyszenia i koła gospodyń dostają granty z Bydgoszczy."
 BYD2_prz_d_metropolia:0 "Spór o metropolię"
 BYD2_prz_d_metropolia_desc:0 "Bydgoszcz wchodzi do sporu z Toruniem o gminy między miastami."
 BYD2_prz_d_kampanie:0 "Inwestycje w gminach"
 BYD2_prz_d_kampanie_desc:0 "Plakaty, wiece i inwestycje w gminach między miastami."
 BYD2_prz_d_referenda:0 "Lokalne referenda"
 BYD2_prz_d_referenda_desc:0 "Gminy, w których Bydgoszcz ma przewagę, głosują o przyłączeniu – w sporze o metropolię i w strefie wpływów."
 BYD2_prz_d_sasiedzi:0 "Krajna i Pałuki"
 BYD2_prz_d_sasiedzi_desc:0 "Gminy Krajny i Pałuk dostają ofertę wspólnoty."
 BYD2_prz_d_metropolia_f:0 "Federacja Bydgosko-Toruńska"
 BYD2_prz_d_metropolia_f_desc:0 "Spór o metropolię dobiega końca: Bydgoszcz proponuje Toruniowi federację."
 BYD2_prz_w_obrona:0 "Obrona Brdy"
 BYD2_prz_w_obrona_desc:0 "Umocnienia przy mostach, na skarpie fordońskiej i przy Kanale."
 BYD2_prz_w_mobilizacja:0 "Mobilizacja miejska"
 BYD2_prz_w_mobilizacja_desc:0 "Każda dzielnica wystawia kompanię ochotników."
 BYD2_prz_w_garnizon:0 "Garnizon bydgoski"
 BYD2_prz_w_garnizon_desc:0 "Koszary przy Szubińskiej znów są pełne."
