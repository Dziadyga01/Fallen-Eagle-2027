 BYD2_rad_d_sasiedzi_desc:0 "Gminy Krajny i Pałuk dostają ultimatum."
 BYD2_rad_d_metropolia_f:0 "Metropolia Bydgoska"
 BYD2_rad_d_metropolia_f_desc:0 "Spór o metropolię dobiega końca: Bydgoszcz stawia Toruń przed faktem dokonanym."
 BYD2_rad_w_obrona:0 "Obrona Brdy"
 BYD2_rad_w_obrona_desc:0 "Umocnienia przy mostach, na skarpie fordońskiej i przy Kanale."
 BYD2_rad_w_mobilizacja:0 "Mobilizacja miejska"
 BYD2_rad_w_mobilizacja_desc:0 "Każda dzielnica wystawia kompanię ochotników."
 BYD2_rad_w_garnizon:0 "Garnizon bydgoski"
 BYD2_rad_w_garnizon_desc:0 "Koszary przy Szubińskiej znów są pełne."
 BYD2_rad_w_roszczenia:0 "Roszczenia regionalne"
 BYD2_rad_w_roszczenia_desc:0 "Bydgoszcz zgłasza roszczenia do sąsiednich gmin – jako cel operacji."
 BYD2_rad_w_lokalne:0 "Ultimata dla gmin"
 BYD2_rad_w_lokalne_desc:0 "Gminy wokół Bydgoszczy dostają ultimatum."
 BYD2_rad_w_integracja:0 "Integracja gmin"
 BYD2_rad_w_integracja_desc:0 "Gminy podporządkowane Bydgoszczy stają się jej częścią."
 BYD2_rad_w_swiecie:0 "Operacja Świecie"
 BYD2_rad_w_swiecie_desc:0 "Świecie i papiernia nad Wisłą muszą zostać zdobyte, by otworzyć drogę na północ."
 BYD2_rad_w_dominacja:0 "Dominacja regionalna"
 BYD2_rad_w_dominacja_desc:0 "Bydgoszcz jest najsilniejszym państwem w okolicy."
 BYD2_jun_komitet:0 "Komitet Bezpieczeństwa"
 BYD2_jun_komitet_desc:0 "Oficerowie z koszar przy Szubińskiej przejmują władzę. Płk Fordoński obiecuje, że to tylko na czas kryzysu."
 BYD2_jun_rozwiazanie_rady:0 "Rozwiązanie Rady"
 BYD2_jun_rozwiazanie_rady_desc:0 "Radni dostają list z podziękowaniem za służbę. Do Ratusza wchodzi żandarmeria."
 BYD2_jun_gubernatorzy:0 "Komendanci dzielnic"
 BYD2_jun_gubernatorzy_desc:0 "Fordon, Szwederowo i Wyżyny mają teraz komendantów, nie burmistrzów."
 BYD2_jun_przysiega:0 "Przysięga urzędników"
 BYD2_jun_przysiega_desc:0 "Urzędnicy składają przysięgę lojalności wobec Komitetu."
 BYD2_jun_porzadek:0 "Porządek w mieście"
 BYD2_jun_porzadek_desc:0 "Tramwaje jeżdżą punktualnie, sklepy są otwarte, a nikt nie pyta, kiedy będą wybory."
 BYD2_jun_propaganda:0 "Radio Komitetu"
 BYD2_jun_propaganda_desc:0 "Radio nadaje komunikaty sztabu i marsze wojskowe."
 BYD2_jun_gosp_wojenna:0 "Gospodarka wojenna"
 BYD2_jun_gosp_wojenna_desc:0 "Komitet przejmuje nadzór nad zakładami. Plan produkcji pisze sztab, nie rada nadzorcza."
 BYD2_jun_amunicja:0 "Produkcja amunicji"
 BYD2_jun_amunicja_desc:0 "Nitro-Chem i Belma produkują to, do czego je zbudowano – trotyl i miny."
 BYD2_jun_ciezki:0 "Przemysł ciężki"
 BYD2_jun_ciezki_desc:0 "Hale PESY przestawiają się na podwozia i pancerze."
 BYD2_jun_ciezki_tb:0 "Przemysł ciężki"
 BYD2_jun_warsztaty:0 "Wojskowe warsztaty"
 BYD2_jun_warsztaty_desc:0 "Wojskowe Zakłady Lotnicze naprawiają wszystko – od śmigłowców po ciężarówki."
 BYD2_jun_zamowienia:0 "Państwowe zamówienia"
 BYD2_jun_zamowienia_desc:0 "Komitet płaci bonami skarbowymi. Kto odmówi, traci koncesję."
 BYD2_jun_mobilizacja:0 "Mobilizacja fabryk"
 BYD2_jun_mobilizacja_desc:0 "Każda hala w Bydgoszczy pracuje dla armii."
 BYD2_jun_dowodztwo:0 "Reorganizacja dowództwa"
 BYD2_jun_dowodztwo_desc:0 "Oficerowie dawnego Inspektoratu Wsparcia tworzą sztab z prawdziwego zdarzenia."
 BYD2_jun_brygady:0 "Bydgoskie brygady"
 BYD2_jun_brygady_desc:0 "Pierwsze pełne brygady piechoty z artylerią i saperami."
 BYD2_jun_opl:0 "Obrona przeciwlotnicza"
 BYD2_jun_opl_desc:0 "Stanowiska przeciwlotnicze na dachach Fordonu. Drony sąsiadów nie przelecą nad Brdą."
 BYD2_jun_opl_tb:0 "Obrona przeciwlotnicza"
 BYD2_jun_pancerne:0 "Batalion pancerny"
 BYD2_jun_pancerne_desc:0 "Opancerzone ciężarówki z warsztatów PESY i transportery z demobilu."
 BYD2_jun_sztab:0 "Sztab pod Myślęcinkiem"
 BYD2_jun_sztab_desc:0 "W bunkrze pod Myślęcinkiem powstaje sztab, który planuje operacje na całe Kujawy."
 BYD2_jun_armia:0 "Armia Regionalna"
 BYD2_jun_armia_desc:0 "Armia Bydgoszczy jest gotowa – zdyscyplinowana, wyposażona i głodna działania."
 BYD2_jun_solec:0 "Kontrola Solca"
 BYD2_jun_solec_desc:0 "Pierwszy przyczółek: Solec Kujawski i drogi do Torunia. Komitet nie pyta już o referendum."
 BYD2_jun_ostromecko:0 "Zabezpieczyć Ostromecko"
 BYD2_jun_ostromecko_desc:0 "Przyczółek za Wisłą, przy Moście Fordońskim."
 BYD2_jun_ultimata:0 "Ultimata dla gmin"
 BYD2_jun_ultimata_desc:0 "Gminy wokół Bydgoszczy dostają ultimatum: podporządkowanie Komitetowi albo wojna."
 BYD2_jun_elana:0 "Rywal z Torunia"
 BYD2_jun_elana_desc:0 "Jeśli w Toruniu rządzi Ruch Elany, region ma dwóch kandydatów na hegemona. Musi zostać jeden."
 BYD2_jun_grudziadz:0 "Pakt z Grudziądzem"
 BYD2_jun_grudziadz_desc:0 "Twierdza Grudziądz dostaje propozycję paktu o nieagresji."
 BYD2_jun_torun:0 "Blokada Torunia"
 BYD2_jun_torun_desc:0 "Rywalizacja dwóch miast kończy się tam, gdzie zaczyna się artyleria."
 BYD2_jun_rada_wojskowa:0 "Wojskowa Rada Regionu"
 BYD2_jun_rada_wojskowa_desc:0 "Oficerowie z podporządkowanych gmin dostają miejsca w Radzie. Formalnie to sojusz, w praktyce – łańcuch dowodzenia."
 BYD2_jun_administracja:0 "Administracja wojskowa"
 BYD2_jun_administracja_desc:0 "Komendanci przejmują urzędy na zdobytych ziemiach."
 BYD2_jun_twierdza:0 "Twierdza Bydgoszcz"
 BYD2_jun_twierdza_desc:0 "Bunkry na skarpie fordońskiej i zapory na Brdzie."
 BYD2_jun_kujawy:0 "Operacja Kujawy"
 BYD2_jun_kujawy_desc:0 "Sztab kładzie na stole mapę Kujaw. Region ma mieć jedno dowództwo."
 BYD2_jun_okreg:0 "Kujawski Okręg Wojskowy"
 BYD2_jun_okreg_desc:0 "Państwo Bydgoskie przestaje udawać miasto. Od dziś to Kujawski Okręg Wojskowy."
 BYD2_jun_final:0 "Nowy porządek regionalny"
 BYD2_jun_final_desc:0 "Od Noteci po Wisłę obowiązuje jedno prawo – rozkaz Komitetu. Płk Fordoński awansuje sam siebie na generała."
 BYD2_jun_r_plan:0 "Plan rozbudowy Bydgoszczy"
 BYD2_jun_r_plan_desc:0 "Ratusz zatwierdza plan: osiedla, drogi i usługi publiczne."
 BYD2_jun_r_fordon:0 "Fordon"
 BYD2_jun_r_fordon_desc:0 "Największa dzielnica miasta dostaje nowe szkoły, przychodnie i tramwaj."
 BYD2_jun_r_kapusciska:0 "Kapuściska i Wyżyny"
 BYD2_jun_r_kapusciska_desc:0 "Blokowiska dostają ocieplenie, windy i nowe sklepy."
 BYD2_jun_r_uczelnie:0 "UKW i Politechnika"
 BYD2_jun_r_uczelnie_desc:0 "Uczelnie kształcą inżynierów dla PESY i całego regionu."
 BYD2_jun_r_uczelnie_tb:0 "UKW i Politechnika"
 BYD2_jun_r_osiedla:0 "Nowe osiedla"
 BYD2_jun_r_osiedla_desc:0 "Mieszkania dla rodzin, które uciekły z mniejszych miejscowości do bezpiecznej Bydgoszczy."
 BYD2_jun_r_tramwaje:0 "Tramwaje z PESY"
 BYD2_jun_r_tramwaje_desc:0 "Nowe linie tramwajowe łączą Fordon, Błonie i Kapuściska."
 BYD2_jun_r_infrastruktura:0 "Infrastruktura regionalna"
 BYD2_jun_r_infrastruktura_desc:0 "Drogi do gmin i węzły kolejowe – zaplecze dla gospodarki i armii."
