 BYD2_jun_w_dominacja:0 "Dominacja regionalna"
 BYD2_jun_w_dominacja_desc:0 "Bydgoszcz jest najsilniejszym państwem w okolicy."
 BYD2_brd_wiec:0 "Wiec zwycięstwa"
 BYD2_brd_wiec_desc:0 "Wiktor Brdowski świętuje na Starym Rynku. Darmowe kiełbaski, fajerwerki i transmisja w trzech jego telewizjach."
 BYD2_brd_obietnice:0 "Tanie paliwo dla bydgoszczan"
 BYD2_brd_obietnice_desc:0 "Pierwsza obietnica spełniona: paliwo na stacjach Brdowskiego jest tańsze. Na razie."
 BYD2_brd_czystka:0 "Nowi ludzie w urzędach"
 BYD2_brd_czystka_desc:0 "Urzędnicy „toruńskiego układu” tracą posady. Na ich miejsce przychodzą ludzie z firm Brdowskiego."
 BYD2_brd_telewizja:0 "Telewizja Bydgoszcz Pierwsza"
 BYD2_brd_telewizja_desc:0 "Lokalna telewizja nadaje całą dobę. Brdowski występuje w każdym programie – także w prognozie pogody."
 BYD2_brd_referendum:0 "Referendum ludowe"
 BYD2_brd_referendum_desc:0 "Mieszkańcy głosują, czy Bydgoszcz ma być „pierwsza w regionie”. Wynik: 94% za."
 BYD2_brd_stadion:0 "Nowy stadion Zawiszy"
 BYD2_brd_stadion_desc:0 "Obietnica numer dwa: stadion na 30 tysięcy miejsc. Kibice są zachwyceni, księgowi – mniej."
 BYD2_brd_budowy:0 "Wielkie budowy"
 BYD2_brd_budowy_desc:0 "Dźwigi nad Brdą to najlepsza kampania wyborcza."
 BYD2_brd_drogi:0 "Drogi do gmin"
 BYD2_brd_drogi_desc:0 "Nowe drogi do Solca, Koronowa i Nakła – z billboardami Brdowskiego co kilometr."
 BYD2_brd_lotnisko:0 "Lotnisko „Bydgoszcz Pierwsza”"
 BYD2_brd_lotnisko_desc:0 "Lotnisko w Szwederowie zmienia nazwę i dostaje nowe pasy – dla turystów i dla wojska."
 BYD2_brd_firmy:0 "Firmy przyjaciół"
 BYD2_brd_firmy_desc:0 "Kontrakty miejskie trafiają do zaufanych firm. Szybko, choć niekoniecznie tanio."
 BYD2_brd_przemysl:0 "Bydgoszcz produkuje"
 BYD2_brd_przemysl_desc:0 "PESA i Nitro-Chem dostają zamówienia, a Brdowski przecina wstęgi."
 BYD2_brd_boom:0 "Boom nad Brdą"
 BYD2_brd_boom_desc:0 "Miasto rośnie, a z nim popularność prezydenta. Długi? Spłaci je następca."
 BYD2_brd_boom_tb:0 "Boom nad Brdą"
 BYD2_brd_torun_wrog:0 "„Toruń nam zabiera”"
 BYD2_brd_torun_wrog_desc:0 "Kampania billboardowa przypomina, kto „ukradł” Bydgoszczy urząd marszałkowski. Napięcie z Toruniem rośnie."
 BYD2_brd_straz:0 "Straż Obywatelska"
 BYD2_brd_straz_desc:0 "Ochotnicy w kurtkach z logo ruchu patrolują ulice i granice gmin."
 BYD2_brd_ultimata:0 "Ultimata dla gmin"
 BYD2_brd_ultimata_desc:0 "Brdowski ogłasza w telewizji, że gminy wokół miasta „mają tydzień na decyzję”."
 BYD2_brd_solec:0 "Solec jest nasz"
 BYD2_brd_solec_desc:0 "Solec Kujawski „był, jest i będzie bydgoski”. Straż przekracza granicę gminy."
 BYD2_brd_referenda:0 "Referenda w gminach"
 BYD2_brd_referenda_desc:0 "Referenda w spornych gminach – pod czujnym okiem kamer Brdowskiego."
 BYD2_brd_kujawy_roszczenia:0 "Wielka Bydgoszcz – mapa"
 BYD2_brd_kujawy_roszczenia_desc:0 "Telewizja pokazuje mapę „Wielkiej Bydgoszczy”. Sąsiedzi oglądają ją z niepokojem."
 BYD2_brd_armia:0 "Armia ochotnicza"
 BYD2_brd_armia_desc:0 "Każdy, kto zgłosi się do wojska, dostaje bilet na mecz Zawiszy i talon na paliwo."
 BYD2_brd_sprzet:0 "Sprzęt z demobilu"
 BYD2_brd_sprzet_desc:0 "Hurtowe zakupy sprzętu od każdego, kto sprzedaje."
 BYD2_brd_fortyfikacje:0 "Mur nad Wisłą"
 BYD2_brd_fortyfikacje_desc:0 "Brdowski obiecuje, że Toruń zapłaci za umocnienia. Toruń nic o tym nie wie."
 BYD2_brd_oficerowie:0 "Oficerowie z telewizji"
 BYD2_brd_oficerowie_desc:0 "Emerytowani oficerowie, znani z programów publicystycznych, dostają dowództwa."
 BYD2_brd_torun:0 "Marsz na Toruń"
 BYD2_brd_torun_desc:0 "Wielki finał kampanii: Toruń ma przestać „okradać” Bydgoszcz – raz na zawsze."
 BYD2_brd_integracja:0 "Wielka Bydgoszcz rośnie"
 BYD2_brd_integracja_desc:0 "Podporządkowane gminy stają się dzielnicami Wielkiej Bydgoszczy."
 BYD2_brd_kujawy:0 "Kierunek: Inowrocław"
 BYD2_brd_kujawy_desc:0 "Kujawy mają „wrócić do Bydgoszczy”, choć nigdy do niej nie należały."
 BYD2_brd_region:0 "Region Bydgoszczy"
 BYD2_brd_region_desc:0 "Ruch zgłasza roszczenia do całego regionu."
 BYD2_brd_defilada:0 "Defilada na Gdańskiej"
 BYD2_brd_defilada_desc:0 "Kolumny wojska, wozy strażackie i platforma telewizyjna. Najlepsza oglądalność w historii."
 BYD2_brd_cores:0 "Nowe dzielnice"
 BYD2_brd_cores_desc:0 "Zdobyte gminy dostają tablice „Bydgoszcz Pierwsza” i nowych burmistrzów."
 BYD2_brd_wybory2:0 "Wybory, które wygramy"
 BYD2_brd_wybory2_desc:0 "Brdowski ogłasza nowe wybory. Wynik jest znany z góry, ale transmisja i tak bije rekordy."
 BYD2_brd_final:0 "Wielka Bydgoszcz"
 BYD2_brd_final_desc:0 "Bydgoszcz jest pierwsza – w regionie, w telewizji i na każdym billboardzie."
 BYD2_brd_r_plan:0 "Plan rozbudowy Bydgoszczy"
 BYD2_brd_r_plan_desc:0 "Ratusz zatwierdza plan: osiedla, drogi i usługi publiczne."
 BYD2_brd_r_fordon:0 "Fordon"
 BYD2_brd_r_fordon_desc:0 "Największa dzielnica miasta dostaje nowe szkoły, przychodnie i tramwaj."
 BYD2_brd_r_kapusciska:0 "Kapuściska i Wyżyny"
 BYD2_brd_r_kapusciska_desc:0 "Blokowiska dostają ocieplenie, windy i nowe sklepy."
 BYD2_brd_r_uczelnie:0 "UKW i Politechnika"
 BYD2_brd_r_uczelnie_desc:0 "Uczelnie kształcą inżynierów dla PESY i całego regionu."
 BYD2_brd_r_uczelnie_tb:0 "UKW i Politechnika"
 BYD2_brd_r_osiedla:0 "Nowe osiedla"
 BYD2_brd_r_osiedla_desc:0 "Mieszkania dla rodzin, które uciekły z mniejszych miejscowości do bezpiecznej Bydgoszczy."
 BYD2_brd_r_tramwaje:0 "Tramwaje z PESY"
 BYD2_brd_r_tramwaje_desc:0 "Nowe linie tramwajowe łączą Fordon, Błonie i Kapuściska."
 BYD2_brd_r_infrastruktura:0 "Infrastruktura regionalna"
 BYD2_brd_r_infrastruktura_desc:0 "Drogi do gmin i węzły kolejowe – zaplecze dla gospodarki i armii."
 BYD2_brd_r_2030:0 "Bydgoszcz 2030"
 BYD2_brd_r_2030_desc:0 "Miasto ma plan na najbliższe lata – i środki, żeby go zrealizować."
 BYD2_brd_p_odbudowa:0 "Odbudowa przemysłu"
 BYD2_brd_p_odbudowa_desc:0 "Bydgoskie firmy wracają do pracy po miesiącach chaosu."
 BYD2_brd_p_odbudowa_tb:0 "Odbudowa przemysłu"
 BYD2_brd_p_pesa:0 "Zamówienia dla PESY"
 BYD2_brd_p_pesa_desc:0 "Tramwaje i wagony dla regionu – za gotówkę albo za wpływy."
 BYD2_brd_p_chemia:0 "Chemia nad Brdą"
 BYD2_brd_p_chemia_desc:0 "Nitro-Chem i dawne zakłady chemiczne produkują nawozy i materiały wybuchowe."
 BYD2_brd_p_zachem:0 "Rekultywacja Zachemu"
 BYD2_brd_p_zachem_desc:0 "Skażone tereny po Zachemie wreszcie są oczyszczane. Woda w Brdzie znów nadaje się do picia."
 BYD2_brd_p_port:0 "Port i Kanał"
 BYD2_brd_p_port_desc:0 "Barki z Bydgoszczy płyną do Gdańska i na zachód."
 BYD2_brd_p_belma:0 "Elektronika"
 BYD2_brd_p_belma_desc:0 "Belma i firmy parku technologicznego produkują elektronikę dla miasta i wojska."
 BYD2_brd_p_belma_tb:0 "Elektronika"
 BYD2_brd_p_strefa:0 "Strefa ekonomiczna"
 BYD2_brd_p_strefa_desc:0 "Inwestorzy z całego regionu otwierają zakłady nad Brdą."
 BYD2_brd_p_przemysl:0 "Przemysłowa stolica regionu"
 BYD2_brd_p_przemysl_desc:0 "Bydgoszcz znów ma przemysł, z którego może być dumna."
 BYD2_brd_p_przemysl_tb:0 "Przemysłowa stolica regionu"
 BYD2_brd_d_urzednicy:0 "Pomoc administracyjna"
 BYD2_brd_d_urzednicy_desc:0 "Bydgoscy urzędnicy pomagają gminom uporządkować ewidencję, budżet i zamówienia. Przy okazji poznają wszystkie dokumenty."
 BYD2_brd_d_misje:0 "Misje dyplomatyczne"
 BYD2_brd_d_misje_desc:0 "Delegacje z Bydgoszczy, orkiestra i tort z herbem miasta."
 BYD2_brd_d_finansowanie:0 "Finansowanie lokalnych organizacji"
 BYD2_brd_d_finansowanie_desc:0 "Kluby sportowe, stowarzyszenia i koła gospodyń dostają granty z Bydgoszczy."
 BYD2_brd_d_metropolia:0 "Spór o metropolię"
 BYD2_brd_d_metropolia_desc:0 "Bydgoszcz wchodzi do sporu z Toruniem o gminy między miastami."
 BYD2_brd_d_kampanie:0 "Kampanie w gminach"
 BYD2_brd_d_kampanie_desc:0 "Plakaty, wiece i inwestycje w gminach między miastami."
 BYD2_brd_d_referenda:0 "Lokalne referenda"
 BYD2_brd_d_referenda_desc:0 "Gminy, w których Bydgoszcz ma przewagę, głosują o przyłączeniu – w sporze o metropolię i w strefie wpływów."
 BYD2_brd_d_sasiedzi:0 "Ultimata dla sąsiadów"
 BYD2_brd_d_sasiedzi_desc:0 "Gminy Krajny i Pałuk dostają ultimatum."
 BYD2_brd_d_metropolia_f:0 "Metropolia Bydgoska"
 BYD2_brd_d_metropolia_f_desc:0 "Spór o metropolię dobiega końca: Bydgoszcz stawia Toruń przed faktem dokonanym."
 BYD2_brd_w_obrona:0 "Obrona Brdy"
 BYD2_brd_w_obrona_desc:0 "Umocnienia przy mostach, na skarpie fordońskiej i przy Kanale."
 BYD2_brd_w_mobilizacja:0 "Mobilizacja miejska"
 BYD2_brd_w_mobilizacja_desc:0 "Każda dzielnica wystawia kompanię ochotników."
 BYD2_brd_w_garnizon:0 "Garnizon bydgoski"
 BYD2_brd_w_garnizon_desc:0 "Koszary przy Szubińskiej znów są pełne."
 BYD2_brd_w_roszczenia:0 "Roszczenia regionalne"
 BYD2_brd_w_roszczenia_desc:0 "Bydgoszcz zgłasza roszczenia do sąsiednich gmin – jako cel operacji."
 BYD2_brd_w_lokalne:0 "Ultimata dla gmin"
 BYD2_brd_w_lokalne_desc:0 "Gminy wokół Bydgoszczy dostają ultimatum."
 BYD2_brd_w_integracja:0 "Integracja gmin"
 BYD2_brd_w_integracja_desc:0 "Gminy podporządkowane Bydgoszczy stają się jej częścią."
 BYD2_brd_w_swiecie:0 "Operacja Świecie"
 BYD2_brd_w_swiecie_desc:0 "Świecie i papiernia nad Wisłą muszą zostać zdobyte, by otworzyć drogę na północ."
 BYD2_brd_w_dominacja:0 "Dominacja regionalna"
 BYD2_brd_w_dominacja_desc:0 "Bydgoszcz jest najsilniejszym państwem w okolicy."
