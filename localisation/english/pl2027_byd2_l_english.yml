 byd2.1.t:0 "Bydgoszcz bez państwa"
 byd2.1.d:0 "Wojewoda zamknął się w urzędzie, komisarz wyjechał do Warszawy po instrukcje i nie wrócił. Na Starym Rynku ludzie pytają, kto teraz podpisuje decyzje."
 byd2.1.a:0 "Ratusz bierze odpowiedzialność."
 byd2.1.b:0 "Potrzebny jest porządek – wezwać wojsko."
 byd2.1.c:0 "Zapytać ludzi z zakładów."
 byd2.2.t:0 "Kto pilnuje mostów?"
 byd2.2.d:0 "Posterunki stanęły przy Moście Bernardyńskim i Królowej Jadwigi. Kto ma je obsadzić na stałe?"
 byd2.2.a:0 "Wojsko."
 byd2.2.b:0 "Straż miejska pod nadzorem Rady."
 byd2.2.c:0 "Ochrona firm z dzielnicy przemysłowej."
 byd2.3.t:0 "Kolejki pod piekarniami"
 byd2.3.d:0 "Na Błoniu i w Fordonie kolejki ustawiają się od piątej rano. Hurtownicy chcą płatności w euro, robotnicy proponują wspólne magazyny."
 byd2.3.a:0 "Kontrakty z hurtowniami."
 byd2.3.b:0 "Wspólne magazyny zakładów."
 byd2.3.c:0 "Darmowy chleb od „Bydgoszczy Pierwszej”."
 BYD2_sup_przemysl_p3:0 "Poparcie: Rada Przemysłowa §G+3§!"
 BYD2_sup_rady_p8:0 "Poparcie: Rady Robotnicze §G+8§!"
 byd2.4.t:0 "Strajk przed bramą PESY"
 byd2.4.d:0 "Robotnicy PESY blokują Zieloną i Fordońską. Żądają wypłat i gwarancji, że fabryki nie zostaną rozkradzione."
 byd2.4.a:0 "Negocjować i zamówić tramwaje dla miasta."
 byd2.4.b:0 "Niech robotnicy przejmą hale."
 byd2.4.c:0 "Wojsko zabezpiecza zakłady."
 BYD2_sup_brdowski_p2:0 "Poparcie: Wiktor Brdowski §G+2§!"
 byd2.5.t:0 "Most Fordoński"
 byd2.5.d:0 "Toruń wysyła do Ostromecka urzędników i autobusy. Bydgoszcz musi odpowiedzieć."
 byd2.5.a:0 "Oferta współpracy dla gmin za Wisłą."
 byd2.5.b:0 "Posterunek wojskowy przy moście."
 byd2.6.t:0 "Solec Kujawski"
 byd2.6.d:0 "Solec dostaje oferty z obu miast. Mieszkańcy uważają, że są przede wszystkim z Solca."
 byd2.6.a:0 "Referendum – niech Solec wybierze."
 byd2.6.b:0 "„Solec był, jest i będzie bydgoski!”"
 byd2.6.c:0 "Inwestycje firm w Solcu."
 BYD2_sup_junta_m3:0 "Poparcie: płk Tomasz Fordoński §R-3§!"
 BYD2_sup_junta_p8:0 "Poparcie: płk Tomasz Fordoński §G+8§!"
 byd2.7.t:0 "Oferta oficerów"
 byd2.7.d:0 "Płk Tomasz Fordoński proponuje, by do wyborów miastem zarządzał „Komitet Bezpieczeństwa”."
 byd2.7.a:0 "Odmówić – wojsko jest od obrony, nie od rządzenia."
 byd2.7.b:0 "Przyjąć pomoc oficerów."
 BYD2_sup_bruski_p2:0 "Poparcie: Rafał Bruski §G+2§!"
 BYD2_sup_junta_p3:0 "Poparcie: płk Tomasz Fordoński §G+3§!"
 byd2.8.t:0 "Rady w zakładach"
 byd2.8.d:0 "Rady robotnicze zapowiadają, że wystawią własnego kandydata – albo przejmą miasto bez wyborów."
 byd2.8.a:0 "Zaprosić rady do rozmów."
 byd2.8.b:0 "Rady to zagrożenie dla gospodarki."
 BYD2_sup_przemysl_p8:0 "Poparcie: Rada Przemysłowa §G+8§!"
 BYD2_sup_bruski_p3:0 "Poparcie: Rafał Bruski §G+3§!"
 BYD2_sup_rady_p3:0 "Poparcie: Rady Robotnicze §G+3§!"
 byd2.9.t:0 "Rada Przemysłowa"
 byd2.9.d:0 "Prezesi PESY, Nitro-Chemu i parku technologicznego proponują: „Dajcie nam miasto na cztery lata, a oddamy je bogatsze”."
 byd2.9.a:0 "Ciekawa propozycja."
 byd2.9.b:0 "Miasto to nie spółka."
 BYD2_sup_brdowski_p8:0 "Poparcie: Wiktor Brdowski §G+8§!"
 BYD2_sup_brdowski_m3:0 "Poparcie: Wiktor Brdowski §R-3§!"
 byd2.10.t:0 "Bydgoszcz Pierwsza!"
 byd2.10.d:0 "Wiec Wiktora Brdowskiego na Starym Rynku transmitują trzy lokalne telewizje – wszystkie należą do niego."
 byd2.10.a:0 "Populista, ale ludzie go słuchają."
 byd2.10.b:0 "Wyśmiać go w debacie."
 BYD2_sup_bruski_m5:0 "Poparcie: Rafał Bruski §R-5§!"
 byd2.20.t:0 "Komitet: Bydgoszcz Obywatelska"
 byd2.20.d:0 "Komitet „Bydgoszcz Obywatelska” (Rafał Bruski) składa listę podpisów i program. Komitet Tymczasowy musi zdecydować, czy dopuścić go do wyborów. Obecne poparcie: §Y[?BYD2_pop_bruski|0]§!."
 byd2.20.a:0 "Dopuścić komitet do wyborów."
 byd2.20.b:0 "Odrzucić zgłoszenie."
 BYD2_sup_przemysl_m5:0 "Poparcie: Rada Przemysłowa §R-5§!"
 byd2.21.t:0 "Komitet: Rada Przemysłowa Bydgoszczy"
 byd2.21.d:0 "Komitet „Rada Przemysłowa Bydgoszczy” (Rada Przemysłowa) składa listę podpisów i program. Komitet Tymczasowy musi zdecydować, czy dopuścić go do wyborów. Obecne poparcie: §Y[?BYD2_pop_przemysl|0]§!."
 byd2.21.a:0 "Dopuścić komitet do wyborów."
 byd2.21.b:0 "Odrzucić zgłoszenie."
 BYD2_sup_rady_m5:0 "Poparcie: Rady Robotnicze §R-5§!"
 byd2.22.t:0 "Komitet: Bydgoskie Rady Robotnicze"
 byd2.22.d:0 "Komitet „Bydgoskie Rady Robotnicze” (Rady Robotnicze) składa listę podpisów i program. Komitet Tymczasowy musi zdecydować, czy dopuścić go do wyborów. Obecne poparcie: §Y[?BYD2_pop_rady|0]§!."
 byd2.22.a:0 "Dopuścić komitet do wyborów."
 byd2.22.b:0 "Odrzucić zgłoszenie."
 BYD2_sup_junta_m5:0 "Poparcie: płk Tomasz Fordoński §R-5§!"
 byd2.23.t:0 "Komitet: Komitet Bezpieczeństwa"
 byd2.23.d:0 "Komitet „Komitet Bezpieczeństwa” (płk Tomasz Fordoński) składa listę podpisów i program. Komitet Tymczasowy musi zdecydować, czy dopuścić go do wyborów. Obecne poparcie: §Y[?BYD2_pop_junta|0]§!."
 byd2.23.a:0 "Dopuścić komitet do wyborów."
 byd2.23.b:0 "Odrzucić zgłoszenie."
 BYD2_sup_brdowski_p3:0 "Poparcie: Wiktor Brdowski §G+3§!"
 BYD2_sup_brdowski_m5:0 "Poparcie: Wiktor Brdowski §R-5§!"
 byd2.24.t:0 "Komitet: Ruch „Bydgoszcz Pierwsza”"
 byd2.24.d:0 "Komitet „Ruch „Bydgoszcz Pierwsza”” (Wiktor Brdowski) składa listę podpisów i program. Komitet Tymczasowy musi zdecydować, czy dopuścić go do wyborów. Obecne poparcie: §Y[?BYD2_pop_brdowski|0]§!."
 byd2.24.a:0 "Dopuścić komitet do wyborów."
 byd2.24.b:0 "Odrzucić zgłoszenie."
 byd2.29.t:0 "Listy zamknięte"
 byd2.29.d:0 "Komisja wyborcza zamyka listy kandydatów."
 byd2.29.a:0 "Do wyborów!"
 byd2.29.b:0 "Nikt nie został dopuszczony – dodatkowa tura."
 BYD2_sup_bruski_p10:0 "Poparcie: Rafał Bruski §G+10§!"
 BYD2_sup_przemysl_p10:0 "Poparcie: Rada Przemysłowa §G+10§!"
 BYD2_sup_rady_p10:0 "Poparcie: Rady Robotnicze §G+10§!"
 BYD2_sup_junta_p10:0 "Poparcie: płk Tomasz Fordoński §G+10§!"
 BYD2_sup_brdowski_p10:0 "Poparcie: Wiktor Brdowski §G+10§!"
 byd2.30.t:0 "Debata w Operze Nova"
 byd2.30.d:0 "Kandydaci stają naprzeciw siebie. Kto przekona Bydgoszcz?"
 byd2.30.a:0 "Rafał Bruski wygrywa debatę."
 byd2.30.b:0 "Rada Przemysłowa wygrywa debatę."
 byd2.30.c:0 "Rady Robotnicze wygrywa debatę."
 byd2.30.e:0 "płk Tomasz Fordoński wygrywa debatę."
 byd2.30.f:0 "Wiktor Brdowski wygrywa debatę."
 byd2.40.t:0 "Wybory nad Brdą"
 byd2.40.d:0 "Komisje liczą głosy przez całą noc. Rano Bydgoszcz zna wynik. (Wybór kandydata o poparciu poniżej 20 oznacza kontrowersyjny wynik.)"
 byd2.40.a:0 "Zwycięża Rafał Bruski (Republika Bydgoska)."
 byd2.40.b:0 "Zwycięża Rada Przemysłowa (Bydgoska Republika Przemysłowa)."
 byd2.40.c:0 "Zwycięża Rady Robotnicze (Bydgoska Republika Rad)."
 byd2.40.e:0 "Zwycięża płk Tomasz Fordoński (Bydgoski Komitet Bezpieczeństwa)."
 byd2.40.f:0 "Zwycięża Wiktor Brdowski (Bydgoszcz Pierwsza)."
 byd2.60.t:0 "Pucz przy Jezuickiej"
 byd2.60.d:0 "Stabilność w mieście spadła tak nisko, że oficerowie nie chcą czekać na wybory. Żandarmeria otacza Ratusz."
 byd2.60.a:0 "Komitet Tymczasowy jeszcze się utrzyma."
 byd2.60.b:0 "Junta przejmuje miasto."
 byd2.70.t:0 "Propozycja z Bydgoszczy"
 byd2.70.d:0 "[From.GetName] proponuje nam przyłączenie: wspólną administrację, inwestycje i ochronę – przy zachowaniu samorządu."
 byd2.70.a:0 "Przyjmujemy propozycję."
 byd2.70.b:0 "Zostajemy niezależni."
 byd2.71.t:0 "Ultimatum z Bydgoszczy"
 byd2.71.d:0 "[From.GetName] żąda podporządkowania. Bydgoskie ciężarówki już stoją przy granicy."
 byd2.71.a:0 "Przyjmujemy warunki."
 byd2.71.b:0 "Nie ugniemy się."
 byd2.72.t:0 "Zaproszenie do sojuszu"
 byd2.72.d:0 "[From.GetName] zaprasza nas do sojuszu państw regionu."
 byd2.72.a:0 "Dołączamy."
 byd2.72.b:0 "Nie teraz."
 byd2.73.t:0 "Propozycja przyjęta"
 byd2.73.d:0 "Władze państwa [From.GetName] przyjęły nasze warunki."
 byd2.73.a:0 "Bydgoszcz rośnie."
 byd2.74.t:0 "Odmowa"
 byd2.74.d:0 "Władze państwa [From.GetName] odrzuciły naszą propozycję."
 byd2.74.a:0 "Zapamiętamy to."
 byd2.75.t:0 "Pakt z Bydgoszczą"
 byd2.75.d:0 "[From.GetName] proponuje Toruniowi pakt: koniec sporów, wspólne lotnisko i wspólną obronę regionu."
 byd2.75.a:0 "Zgoda – koniec wojny między miastami."
 byd2.75.b:0 "Toruń nie potrzebuje paktów."
 byd2.80.t:0 "Wspólna republika"
 byd2.80.d:0 "[From.GetName] proponuje połączenie obu miast w jedną demokratyczną republikę z dwiema stolicami i równą reprezentacją."
 byd2.80.a:0 "Zgoda – jedna republika, dwie stolice."
 byd2.80.b:0 "Toruń zostaje osobnym państwem."
 byd2.81.t:0 "Federacja socjalna"
 byd2.81.d:0 "[From.GetName] – Bydgoskie Rady Robotnicze – proponuje federację socjalną robotników obu miast."
 byd2.81.a:0 "Robotnicy obu miast – łączcie się!"
 byd2.81.b:0 "Toruń zostaje niezależny."
 byd2.82.t:0 "Federacja rad i komun"
 byd2.82.d:0 "[From.GetName] proponuje federację rad i komun. Syndykaliści z Bydgoszczy i anarchiści z Torunia spierają się o wszystko – od rad zakładowych po rolę milicji."
 byd2.82.a:0 "Federacja – mimo różnic."
 byd2.82.b:0 "Komuny nie podporządkują się radom."
 byd2.82.c:0 "Odrzucamy, ale bez wojny."
 byd2.83.t:0 "Generałowie rzucają wyzwanie"
 byd2.83.d:0 "[From.GetName] – bydgoska junta – ogłasza, że region potrzebuje jednego dowództwa. Ruch Elany odpowiada mobilizacją kibiców."
 byd2.83.a:0 "Przyjmujemy wyzwanie."
 byd2.84.t:0 "Oferta sponsorska z Bydgoszczy"
 byd2.84.d:0 "Rada Przemysłowa z Bydgoszczy proponuje kontrakt sponsorski: logo PESY na każdej transmisji, kod rabatowy na bilety tramwajowe i „sekcję przemysłową” w trakcie streamu. W zamian – fundusze na całą republikę."
 byd2.84.a:0 "Kontrakt podpisany na żywo!"
 byd2.84.b:0 "Czat mówi „nie” – zostajemy niezależni."
 byd2.85.t:0 "Podgórz w naszych barwach"
 byd2.85.d:0 "Transmisje z Podgórza mają teraz sponsora – i to nas. Widzowie z całego regionu wiedzą, gdzie produkuje się najlepsze tramwaje."
 byd2.85.a:0 "Reklama dźwignią handlu."
 byd2.86.t:0 "Podgórz szuka sponsora"
 byd2.86.d:0 "[From.GetName] – republika transmitowana na żywo – szuka sponsora. Ich widzowie to tysiące młodych ludzi z całego regionu, którzy nigdy nie widzieli reklamy PESY."
 byd2.86.a:0 "Podpisujemy kontrakt."
 byd2.86.b:0 "Za drogo za kilka memów."
 BYD2_przemysl_1:0 "Zarząd miasta"
 BYD2_przemysl_1_desc:0 "Miastem kieruje rada nadzorcza złożona z prezesów. Decyzje zapadają szybko – i zawsze się opłacają."
 BYD2_przemysl_2:0 "Konsorcjum Brdy"
 BYD2_przemysl_2_desc:0 "Bydgoszcz jest największym centrum przemysłowym regionu. Kto chce tramwajów, chemii albo elektroniki – płaci Bydgoszczy."
 BYD2_rady_1:0 "Rady Robotnicze"
 BYD2_rady_1_desc:0 "Zakłady należą do tych, którzy w nich pracują. Rady wybierają delegatów do Rady Miasta."
 BYD2_rady_2:0 "Republika Rad"
 BYD2_rady_2_desc:0 "Od PESY po port w Brdyujściu – całą gospodarką kierują rady pracownicze."
 BYD2_brdowski_1:0 "Bydgoszcz Pierwsza"
 BYD2_brdowski_1_desc:0 "Wiece, darmowe festyny i transmisje w lokalnej telewizji. Brdowski obiecuje wszystko – i część z tego nawet robi."
 BYD2_brdowski_2:0 "Wielka Bydgoszcz"
 BYD2_brdowski_2_desc:0 "Bydgoszcz jest stolicą regionu – i każdy sąsiad ma o tym wiedzieć."
 BYD2_tt_rep_trn:0 "Jeśli Toruniem rządzi §YPaweł Gulewski§!, Toruń otrzyma propozycję wspólnej republiki demokratycznej."
 BYD2_tt_sponsor:0 "Jeśli Podgórzem rządzi §YDaniel Magical§!, jego republika otrzyma ofertę kontraktu sponsorskiego."
 BYD2_tt_fed_soc:0 "Jeśli Toruniem rządzi §YMichał Romanowski§!, Toruń otrzyma propozycję federacji socjalnej."
 BYD2_tt_fed_kom:0 "Jeśli Toruniem rządzi §YMaksim Krevienko§!, Toruń otrzyma propozycję federacji (z ryzykiem konfliktu)."
 BYD2_tt_elana:0 "Jeśli Toruniem rządzi §YRuch Elany§!, oba państwa dostaną cele wojenne przeciw sobie."
