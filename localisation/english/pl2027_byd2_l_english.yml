 BYD2_start_tree:0 "Miasto nad Brdą"
 BYD2_tt_wplywy:0 "Odblokowuje §Ywpływy Bydgoszczy§! w sąsiednich gminach (rozwijane fokusami po wyborach)."
 BYD2_tt_kand:0 "Kandydaci zgłoszą się w kolejnych zdarzeniach: każdego można §Gdopuścić§! albo §Rodrzucić§!. Odrzucenie wszystkich oznacza §Ydodatkową turę§!."
 BYD2_req_kand:0 "Co najmniej jeden komitet został dopuszczony do wyborów"
 BYD2_req_zwyciezca:0 "Wybory się odbyły i znamy zwycięzcę"
 BYD2_tt_zaprz:0 "Zwycięzca obejmuje władzę, zmienia się ustrój, nazwa państwa i drzewko narodowe. Odblokowują się §Ygospodarka, wojsko, wpływy i ekspansja§!."
