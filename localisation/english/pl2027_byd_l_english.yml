 BYD_tt_rep_m3:0 "Poparcie – Republika: §R-3§!"
 byd.1.t:0 "Mosty na Brdzie"
 byd.1.d:0 "Posterunki stanęły przy Moście Bernardyńskim, Królowej Jadwigi i na przeprawie w Fordonie. Pytanie tylko, kto ma je obsadzić na stałe: żołnierze z jednostek przy Szubińskiej, ochotnicy z dzielnic czy straż miejska z nowymi uprawnieniami?"
 byd.1.a:0 "Niech pilnuje ich wojsko."
 byd.1.b:0 "Mosty należą do dzielnic, które łączą."
 byd.1.c:0 "Straż miejska pod nadzorem Komitetu."
 BYD_tt_rep_p6:0 "Poparcie – Republika: §G+6§!"
 byd.2.t:0 "Kolejki pod piekarniami"
 byd.2.d:0 "Na Błoniu i w Fordonie kolejki ustawiają się od piątej rano. Hurtownicy chcą płatności w euro, rady osiedlowe proponują wspólne magazyny, a wojskowi – kartki i przydziały z magazynów obrony cywilnej."
 byd.2.a:0 "Kartki i przydziały z magazynów wojskowych."
 byd.2.b:0 "Wspólne magazyny prowadzone przez dzielnice."
 byd.2.c:0 "Kontrakty z hurtowniami i pomoc z zewnątrz."
 byd.2.e:0 "Niech rynek sam się ułoży."
 BYD_tt_jun_m4:0 "Poparcie – Junta: §R-4§!"
 BYD_tt_jun_p7:0 "Poparcie – Junta: §G+7§!"
 BYD_tt_wd_m5:0 "Poparcie – Wolne Dzielnice: §R-5§!"
 BYD_tt_wd_p7:0 "Poparcie – Wolne Dzielnice: §G+7§!"
 BYD_tt_rep_m4:0 "Poparcie – Republika: §R-4§!"
 byd.3.t:0 "Strajk przed bramą PESY"
 byd.3.d:0 "Kilka tysięcy robotników PESY i dawnych zakładów chemicznych blokuje Zieloną i Fordońską. Żądają wypłat, zamówień i gwarancji, że fabryki nie zostaną rozkradzione przez nikogo – ani przez Komitet, ani przez sąsiadów."
 byd.3.a:0 "Negocjować – zamówienia na tramwaje dla miasta."
 byd.3.b:0 "Wojsko zabezpiecza zakłady."
 byd.3.c:0 "Niech robotnicy przejmą hale."
 BYD_tt_jun_p5:0 "Poparcie – Junta: §G+5§!"
 BYD_tt_wd_p5:0 "Poparcie – Wolne Dzielnice: §G+5§!"
 byd.4.t:0 "Straż Obywatelska na Szwederowie"
 byd.4.d:0 "Patrole Straży Obywatelskiej zatrzymały szabrowników w sklepie przy Kruszwickiej. Teraz pytają, komu podlegają – i czy mogą nosić broń także w dzień."
 byd.4.a:0 "Podporządkować Straż oficerom rezerwy."
 byd.4.b:0 "Niech Straż podlega radom osiedli."
 byd.4.c:0 "Straż pod nadzorem Komitetu i sądu."
 byd.5.t:0 "Spór o Solec Kujawski"
 byd.5.d:0 "Delegacja z Torunia przyjechała do Solca z ofertą wspólnej administracji i darmowym autobusem do Rynku Staromiejskiego. Bydgoszcz odpowiada swoją ofertą – ale nie wiadomo jeszcze, jaką."
 byd.5.a:0 "Wysłać patrol na granicę Solca."
 byd.5.b:0 "Zaproponować Solcowi wspólne referendum."
 byd.5.c:0 "Zaprosić solecką radę na zgromadzenie dzielnic."
 BYD_tt_rep_p7:0 "Poparcie – Republika: §G+7§!"
 byd.6.t:0 "Debata w Operze Nova"
 byd.6.d:0 "Sala Opery Nova pęka w szwach. Joanna Młyńska mówi o konstytucji i wolnych sądach, płk Tomasz Fordoński o porządku i bezpiecznych mostach, a Kuba Szwederowski o miastach rządzonych przez mieszkańców. Kto wygrał debatę?\n\nObecne poparcie – Republika: §Y[?BYD_pop_rep|0]§! · Junta: §Y[?BYD_pop_jun|0]§! · Wolne Dzielnice: §Y[?BYD_pop_wd|0]§!"
 byd.6.a:0 "Młyńska – rzeczowo i spokojnie."
 byd.6.b:0 "Fordoński – krótko i stanowczo."
 byd.6.c:0 "Szwederowski – porwał salę."
 byd.10.t:0 "Wybory"
 byd.10.d:0 "Komisje liczą głosy przez całą noc. Rano Bydgoszcz zna wynik – i wie, że następnych wyborów może już długo nie być.\n\nWyniki: Republika: §Y[?BYD_pop_rep|0]§! · Junta: §Y[?BYD_pop_jun|0]§! · Wolne Dzielnice: §Y[?BYD_pop_wd|0]§!"
 byd.10.a:0 "Wygrywa Republika – Joanna Młyńska zostaje premierem."
 byd.10.b:0 "Wygrywa Junta – płk Fordoński przejmuje władzę."
 byd.10.c:0 "Wygrywają Wolne Dzielnice – Kuba Szwederowski na czele rad."
 BYD_kampania:0 "Kampania wyborcza w Bydgoszczy"
 BYD_kampania_desc:0 "Komitet Tymczasowy rządzi do czasu wyborów. Każda frakcja walczy o głosy dzielnic.\n\nObecne poparcie – Republika: §Y[?BYD_pop_rep|0]§! · Junta: §Y[?BYD_pop_jun|0]§! · Wolne Dzielnice: §Y[?BYD_pop_wd|0]§!"
 BYD_kampania_rep:0 "Kampania Republiki"
 BYD_kampania_rep_desc:0 "Wiece na Starym Rynku, ulotki w tramwajach i debaty w Telewizji Bydgoszcz. Joanna Młyńska obiecuje konstytucję i wolne sądy.\n\nObecne poparcie – Republika: §Y[?BYD_pop_rep|0]§! · Junta: §Y[?BYD_pop_jun|0]§! · Wolne Dzielnice: §Y[?BYD_pop_wd|0]§!"
 BYD_kampania_jun:0 "Kampania Junty"
 BYD_kampania_jun_desc:0 "Parady na Placu Wolności, wojskowe ciężarówki z pomocą humanitarną i obietnica porządku płk. Fordońskiego.\n\nObecne poparcie – Republika: §Y[?BYD_pop_rep|0]§! · Junta: §Y[?BYD_pop_jun|0]§! · Wolne Dzielnice: §Y[?BYD_pop_wd|0]§!"
 BYD_kampania_wd:0 "Kampania Wolnych Dzielnic"
 BYD_kampania_wd_desc:0 "Zebrania w świetlicach na Szwederowie i Okolu, wspólne kuchnie i plakaty Kuby Szwederowskiego na każdym słupie.\n\nObecne poparcie – Republika: §Y[?BYD_pop_rep|0]§! · Junta: §Y[?BYD_pop_jun|0]§! · Wolne Dzielnice: §Y[?BYD_pop_wd|0]§!"
 byd.11.t:0 "Wolne media"
 byd.11.d:0 "Pierwszy numer niezależnego dziennika ukazuje się z okładką krytykującą rząd Joanny Młyńskiej. Ministrowie pytają, czy na pewno o taką wolność walczyli."
 byd.11.a:0 "Taka jest cena demokracji."
 byd.11.b:0 "Zaprosić redaktorów na rozmowę."
 byd.12.t:0 "Federacja albo samodzielność"
 byd.12.d:0 "Wspólny Sejm Kujawski głosuje nad przyszłością Republiki. Jedni chcą federacji z Toruniem i sąsiadami, inni – silnej, samodzielnej Bydgoszczy, która nikomu nie musi się tłumaczyć."
 byd.12.a:0 "Federacja – szukamy porozumienia z sąsiadami."
 byd.12.b:0 "Samodzielność – Bydgoszcz sama zbuduje Republikę."
 byd.13.t:0 "Protest przed Ratuszem"
 byd.13.d:0 "Radni nie chcą wyjść z sali sesyjnej. Przed Ratuszem gromadzą się mieszkańcy z flagami miasta, a żandarmeria czeka na rozkaz."
 byd.13.a:0 "Wynieść radnych – spokojnie, ale stanowczo."
 byd.13.b:0 "Pozwolić im obradować jako rada doradcza."
 byd.14.t:0 "Propozycja z Bydgoszczy"
 byd.14.d:0 "Rady Wolnych Dzielnic z Bydgoszczy proponują Toruniowi współpracę: wspólny kongres rad, wymianę delegatów i obronę przed każdym, kto chciałby przywrócić stary porządek. Dla wielu torunian to propozycja nie do pomyślenia – dla Krevienki jest niemal oczywista."
 byd.14.a:0 "Przyjmujemy – wolne miasta muszą trzymać się razem."
 byd.14.b:0 "Odmawiamy – Toruń nie będzie przedmieściem Bydgoszczy."
 byd.15.t:0 "Toruń się zgadza"
 byd.15.d:0 "Maksim Krevienko przyjeżdża do Bydgoszczy przez Solec, bez obstawy. Na Starym Rynku ściska dłoń Kuby Szwederowskiego, a tłum skanduje nazwy obu miast naraz."
 byd.15.a:0 "Brda i Wisła płyną razem."
 byd.16.t:0 "Toruń odmawia"
 byd.16.d:0 "Toruńskie zgromadzenie odrzuciło propozycję. Bydgoszcz musi zbudować federację bez Torunia – albo wbrew niemu."
 byd.16.a:0 "Pójdziemy własną drogą."
 byd.17.t:0 "Spór w Federacji Brdy i Wisły"
 byd.17.d:0 "Delegaci Torunia oskarżają Bydgoszcz o dominację w kongresie, a bydgoskie rady – Toruń o prowadzenie własnej polityki za plecami federacji. Wspólne zgromadzenie kończy się krzykiem."
 byd.17.a:0 "Kompromis – rotacyjne przewodnictwo kongresu."
 byd.17.b:0 "Niech Toruń odejdzie, jeśli chce."
 byd.17.c:0 "Przeczekać i liczyć na dzielnice."
 byd.18.t:0 "Wiec na Starym Rynku"
 byd.18.d:0 "Tłum na Starym Rynku jest większy niż na jakimkolwiek wiecu od lat. Ktoś proponuje marsz pod siedzibę dawnego wojewody, ktoś inny – przyjęcie od razu deklaracji Wolnej Bydgoszczy."
 byd.18.a:0 "Deklaracja Wolnej Bydgoszczy – tu i teraz."
 byd.18.b:0 "Marsz pod Urząd Wojewódzki."
 byd.19.t:0 "Ultimatum z Bydgoszczy"
 byd.19.d:0 "Komitet Bezpieczeństwa płk. Fordońskiego żąda, by Złąwieś Wielka podporządkowała się Bydgoszczy. Bydgoskie ciężarówki już stoją przy granicy gminy."
 byd.19.a:0 "Przyjmujemy warunki."
 byd.19.b:0 "Nie ugniemy się."
 byd.21.t:0 "Złąwieś się podporządkowuje"
 byd.21.d:0 "Wójt Złąwsi Wielkiej podpisał warunki Komitetu Bezpieczeństwa. Bydgoskie ciężarówki wjeżdżają do gminy bez jednego wystrzału."
 byd.21.a:0 "Porządek zwycięża."
 byd.22.t:0 "Złąwieś odmawia"
 byd.22.d:0 "Rada gminy odrzuciła ultimatum. Komitet Bezpieczeństwa ma teraz pretekst – i obowiązek – by sprawdzić, ile znaczą jego groźby."
 byd.22.a:0 "Przygotować oddziały."
 byd.20.t:0 "Propozycja Komitetu Bezpieczeństwa"
 byd.20.d:0 "Bydgoski Komitet Bezpieczeństwa proponuje Grudziądzowi pakt o nieagresji i wymianę oficerów łącznikowych. Twierdza nad Wisłą może zyskać sojusznika – albo wpuścić wilka do owczarni."
 byd.20.a:0 "Przyjmujemy pakt."
 byd.20.b:0 "Grudziądz nie potrzebuje opiekunów."
