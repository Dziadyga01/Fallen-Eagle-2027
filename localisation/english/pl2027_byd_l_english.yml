l_english:
 BYD_tree:0 "Miasto nad Brdą"
 BYD_i_miasto_bez_rzadu:0 "Miasto bez rządu"
 BYD_i_miasto_bez_rzadu_desc:0 "Komisarz miejski wyjechał do Warszawy po instrukcje i nie wrócił, wojewoda zamknął się w urzędzie, a Komitet Tymczasowy rządzi z sali w Ratuszu przy Jezuickiej. Nikt nie wie, kto podpisuje decyzje."
 BYD_i_rzad_tymczasowy:0 "Rząd tymczasowy"
 BYD_i_rzad_tymczasowy_desc:0 "Urzędy działają, choć na zastępstwach i pieczątkach z dawnego województwa. To już nie chaos – to prowizorka."
 BYD_i_straz_obywatelska:0 "Straż Obywatelska"
 BYD_i_straz_obywatelska_desc:0 "Ochotnicze patrole w odblaskowych kamizelkach pilnują sklepów na Szwederowie i przystanków na Kapuściskach."
 BYD_i_mosty_pod_kontrola:0 "Mosty pod kontrolą"
 BYD_i_mosty_pod_kontrola_desc:0 "Most Bernardyński, Królowej Jadwigi i Most Fordoński mają posterunki. Kto kontroluje mosty, kontroluje Bydgoszcz."
 BYD_i_strajki:0 "Fala strajków"
 BYD_i_strajki_desc:0 "Hale stoją, a związkowcy palą opony pod bramą PESY."
 BYD_i_kartki:0 "Kartki na chleb"
 BYD_i_kartki_desc:0 "System przydziałów działa, choć kolejki pod piekarniami na Błoniu wciąż sięgają rogu ulicy."
 BYD_i_mandat_rep:0 "Mandat Republiki"
 BYD_i_mandat_rep_desc:0 "Bydgoszczanie wybrali demokrację. Rada Miasta znów obraduje jawnie, a jej posiedzenia transmituje lokalna telewizja."
 BYD_i_rep_demokracja_1:0 "Odnowiona demokracja"
 BYD_i_rep_demokracja_1_desc:0 "Wolne wybory i niezależne komisje – Republika chce być przeciwieństwem chaosu, który ją zrodził."
 BYD_i_rep_demokracja_2:0 "Konstytucja Brdy"
 BYD_i_rep_demokracja_2_desc:0 "Ustawa zasadnicza spisana na Wyspie Młyńskiej gwarantuje prawa obywateli i podział władzy."
 BYD_i_rep_demokracja_3:0 "Republika obywateli"
 BYD_i_rep_demokracja_3_desc:0 "Państwo, w którym obywatele naprawdę mają wpływ na decyzje – rzadkość w rozbitej Polsce."
 BYD_i_pesa_1:0 "Odrodzona PESA"
 BYD_i_pesa_1_desc:0 "Linie montażowe tramwajów i pociągów znów pracują. Bydgoszcz ma coś, czego sąsiedzi potrzebują."
 BYD_i_pesa_2:0 "Gospodarcze serce regionu"
 BYD_i_pesa_2_desc:0 "Fabryki, kanał i port czynią z Bydgoszczy centrum handlu między Wisłą a Notecią."
 BYD_i_przeprawy:0 "Obrona przepraw"
 BYD_i_przeprawy_desc:0 "Każdy most na Brdzie ma przygotowane stanowiska i ładunki – na wszelki wypadek."
 BYD_i_bezpieczna_brda:0 "Bezpieczna Brda"
 BYD_i_bezpieczna_brda_desc:0 "Linia Brdy i Kanału Bydgoskiego stała się barierą, której żaden sąsiad nie odważy się sprawdzić."
 BYD_i_sejm_kujawski:0 "Wspólny Sejm Kujawski"
 BYD_i_sejm_kujawski_desc:0 "Delegaci z gmin wokół Bydgoszczy obradują w Operze Nova – bo tylko tam jest dość krzeseł."
 BYD_i_samodzielnosc:0 "Bydgoska samodzielność"
 BYD_i_samodzielnosc_desc:0 "Bydgoszcz nie musi się z nikim łączyć, by być stolicą regionu."
 BYD_i_mandat_jun:0 "Komitet Bezpieczeństwa"
 BYD_i_mandat_jun_desc:0 "Wojskowi z dawnego Inspektoratu Wsparcia przejęli inicjatywę. Porządek jest ważniejszy niż procedury."
 BYD_i_stan_wyjatkowy:0 "Stan wyjątkowy"
 BYD_i_stan_wyjatkowy_desc:0 "Godzina policyjna od 22:00, patrole na Gdańskiej i punkty kontrolne przy mostach."
 BYD_i_porzadek:0 "Porządek w mieście"
 BYD_i_porzadek_desc:0 "Tramwaje jeżdżą punktualnie, sklepy są otwarte, a nikt nie pyta, kiedy będą wybory."
 BYD_i_gosp_wojenna:0 "Gospodarka wojenna"
 BYD_i_gosp_wojenna_desc:0 "Fabryki pracują na trzy zmiany, a każda faktura przechodzi przez biurko oficera."
 BYD_i_mobilizacja_fabryk:0 "Mobilizacja fabryk"
 BYD_i_mobilizacja_fabryk_desc:0 "Od Nitro-Chemu po halę PESY – cały przemysł Bydgoszczy pracuje dla armii."
 BYD_i_armia_regionalna:0 "Armia Regionalna"
 BYD_i_armia_regionalna_desc:0 "Najlepiej wyszkolona armia między Wisłą a Notecią – i wszyscy sąsiedzi o tym wiedzą."
 BYD_i_twierdza_bydgoszcz:0 "Twierdza Bydgoszcz"
 BYD_i_twierdza_bydgoszcz_desc:0 "Bunkry w Myślęcinku, zapory na Fordonie i stanowiska na skarpie nad Brdą."
 BYD_i_nowy_porzadek:0 "Nowy porządek regionalny"
 BYD_i_nowy_porzadek_desc:0 "Kujawy i Pomorze pod jednym dowództwem. Mapa sztabowa w Bydgoszczy stała się mapą państwa."
 BYD_i_mandat_wd:0 "Mandat Dzielnic"
 BYD_i_mandat_wd_desc:0 "Rady osiedlowe z Szwederowa, Okola i Kapuścisk przejęły miasto. Ratusz jest teraz salą zebrań, a nie urzędem."
 BYD_i_rady_dzielnic:0 "Rady dzielnic"
 BYD_i_rady_dzielnic_desc:0 "Każda dzielnica decyduje o swoich sprawach – od remontu chodnika po przydział mieszkań."
 BYD_i_wolna_bydgoszcz:0 "Wolna Bydgoszcz"
 BYD_i_wolna_bydgoszcz_desc:0 "Federacja dzielnic działa. Miasto nie ma burmistrza, ale ma tysiące ludzi, którzy czują się za nie odpowiedzialni."
 BYD_i_spoldzielnie:0 "Spółdzielnie produkcyjne"
 BYD_i_spoldzielnie_desc:0 "Pracownicy przejmują hale i sami decydują, co produkować."
 BYD_i_gosp_wspolnotowa:0 "Gospodarka wspólnotowa"
 BYD_i_gosp_wspolnotowa_desc:0 "Wspólne magazyny, spółdzielnie i rady pracownicze tworzą gospodarkę bez prezesów."
 BYD_i_milicje:0 "Milicje dzielnicowe"
 BYD_i_milicje_desc:0 "Każda dzielnica wystawia własny oddział. Dowódców wybiera się na zebraniu."
 BYD_i_mobilizacja_obyw:0 "Obywatelska mobilizacja"
 BYD_i_mobilizacja_obyw_desc:0 "Gdy trzeba bronić miasta, staje całe miasto – od studentów UKW po emerytów z Wyżyn."
 BYD_i_autonomia:0 "Autonomia mieszkańców"
 BYD_i_autonomia_desc:0 "Wspólnoty sąsiedzkie, lokalne referenda i otwarte szkoły – miasto, które rządzi się samo."
 BYD_i_samodzielne_rady:0 "Samodzielne rady"
 BYD_i_samodzielne_rady_desc:0 "Toruń nie przyszedł na kongres. Trudno – Bydgoszcz zbuduje federację sama."
 BYD_komitet:0 "Komitet Tymczasowy Bydgoszczy"
 BYD_joanna_mlynska:0 "Joanna Młyńska"
 BYD_tomasz_fordonski:0 "płk Tomasz Fordoński"
 BYD_kuba_szwederowski:0 "Kuba Szwederowski"
 BYD_gen_bartodziej:0 "gen. bryg. Ryszard Bartodziej"
 BYD_gen_kapuscinska:0 "ppłk Ewa Kapuścińska"
 BYD_gen_glinkowski:0 "mjr Paweł Glinkowski"
 BYD_party_jun:0 "Komitet Bezpieczeństwa"
 BYD_party_jun_long:0 "Komitet Bezpieczeństwa Bydgoszczy"
 BYD_party_wd:0 "Rady Dzielnic"
 BYD_party_wd_long:0 "Federacja Rad Wolnych Dzielnic"
 BYD_FED_BRDY_WISLY:0 "Federacja Brdy i Wisły"
