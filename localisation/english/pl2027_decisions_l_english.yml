l_english:
 PL2027_metropolia:0 "Walka o metropolię"
 PL2027_metropolia_desc:0 "Toruń i Bydgoszcz rywalizują o to, kto stanie się prawdziwą metropolią Kujaw i Pomorza. Zdobywaj wpływy w okolicznych gminach, a potem rozpisz referendum o przyłączeniu."
 PL2027_TRN_wplywy_LUB:0 "Wpływy Toruń: Gmina Lubicz"
 PL2027_TRN_wplywy_LUB_desc:0 "Inwestycje, linie autobusowe i lokalni działacze – budujemy poparcie dla przyłączenia do Torunia. Trzy kampanie wpływów otwierają drogę do referendum."
 PL2027_TRN_referendum_LUB:0 "Referendum: Gmina Lubicz do Torunia"
 PL2027_TRN_referendum_LUB_desc:0 "Mieszkańcy zdecydują, czy przyłączyć się do Torunia. Szansa powodzenia: 75%."
