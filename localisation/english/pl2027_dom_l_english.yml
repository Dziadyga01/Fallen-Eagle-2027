l_english:
 blr.1.t:0 "Prośba z Moskwy"
 blr.1.d:0 "Ambasador Rosji przynosi list: Moskwa liczy na „sojuszniczą solidarność Państwa Związkowego” w porządkowaniu sytuacji na Mazurach i Podlasiu. Mińsk może dołączyć do rosyjskiego sojuszu, wysłać tylko sprzęt – albo grzecznie przeczekać."
 blr.1.a:0 "Państwo Związkowe działa razem."
 blr.1.b:0 "Wyślemy sprzęt, nie żołnierzy."
 blr.1.c:0 "Białoruś nie będzie walczyć o cudze ziemie."
 blr.2.t:0 "Wojska na granicy z Polską"
 blr.2.d:0 "Rosja prowadzi wojnę z państwami za naszą zachodnią granicą. Sztab w Mińsku ma gotowe plany: uderzenie na Podlasie odciąży rosyjskie dywizje na Mazurach."
 blr.2.a:0 "Uderzyć razem z Rosją."
 blr.2.b:0 "Tylko pilnujemy granicy."
 blr.3.t:0 "Mińsk po naszej stronie"
 blr.3.d:0 "Białoruś dołącza do naszego sojuszu i otwiera granicę dla rosyjskich kolumn."
 blr.3.a:0 "Państwo Związkowe istnieje nie tylko na papierze."
 blr.4.t:0 "Mińsk odmawia"
 blr.4.d:0 "Białoruś odmawia udziału w operacji. Mińsk mówi o „neutralności” – i liczy, co na tym zyska."
 blr.4.a:0 "Zapamiętamy to."
 ROS_ZWIAZKOWE:0 "Państwo Związkowe"
 ROSW_tt_blr:0 "Białoruś otrzyma prośbę o wsparcie: może §Ydołączyć do naszego sojuszu§!, przysłać tylko sprzęt albo §Rodmówić§!."
 ROSW_tt_fala:0 "Rosja otrzymuje §Ycel wojenny§! przeciwko jednemu z polskich sąsiadów (AI od razu wypowiada wojnę)."
 ROSW_tt_podlasie:0 "Cel wojenny przeciw słabszemu polskiemu sąsiadowi. Jeśli Białoruś jest w naszym sojuszu, otrzyma propozycję §Yuderzenia od wschodu§! (może odmówić)."
 ROSW_tt_wisla:0 "Kontrolujemy co najmniej §Y120§! stanów"
