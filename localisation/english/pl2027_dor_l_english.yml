l_english:
 PL2027_dor_TRN_grabowska:0 "Kanclerz Uniwersytetu"
 PL2027_dor_TRN_grabowska_desc:0 "§YEwa Grabowska§! – Była kanclerz uniwersytetu na Bielanach. Zna każdego profesora, każdy grant i każdą piwnicę z agregatem. Postać fikcyjna."
 TRN_dor_grabowska:0 "Ewa Grabowska"
 PL2027_dor_TRN_pierzchala:0 "Mistrz cechu piernikarzy"
 PL2027_dor_TRN_pierzchala_desc:0 "§YTomasz Pierzchała§! – Prowadzi rodzinną piekarnię od trzech pokoleń. Gdy zabrakło mąki, to on zorganizował dostawy dla całej Starówki. Postać fikcyjna."
 TRN_dor_pierzchala:0 "Tomasz Pierzchała"
 PL2027_dor_TRN_wislanska:0 "Gospodyni przepraw wiślanych"
 PL2027_dor_TRN_wislanska_desc:0 "§YJoanna Wiślańska§! – Inżynier mostowa. Pilnuje obu mostów i promu, a bez jej podpisu nie przejedzie żaden konwój. Postać fikcyjna."
 TRN_dor_wislanska:0 "Joanna Wiślańska"
 PL2027_dor_TRN_lisowski:0 "Teoretyk obrony miasta"
 PL2027_dor_TRN_lisowski_desc:0 "§Ydr Marek Lisowski§! – Politolog, który przed rozpadem pisał o wojnach miejskich. Teraz rysuje sektory obrony na mapach Torunia. Postać fikcyjna."
 TRN_dor_lisowski:0 "dr Marek Lisowski"
 PL2027_dor_TRN_podgorski:0 "Szef artylerii garnizonu"
 PL2027_dor_TRN_podgorski_desc:0 "§Ypłk Grzegorz Podgórski§! – Wykładowca toruńskiego centrum szkolenia artylerii. Zna każdą baterię w regionie z numeru seryjnego. Postać fikcyjna."
 TRN_dor_podgorski:0 "płk Grzegorz Podgórski"
 PL2027_dor_TRN_barska:0 "Komendantka obrony terytorialnej"
 PL2027_dor_TRN_barska_desc:0 "§Yppłk Dorota Barska§! – Dowodzi ochotnikami z okolicznych gmin. Jej ludzie znają każdy las i każdą drogę gruntową. Postać fikcyjna."
 TRN_dor_barska:0 "ppłk Dorota Barska"
 PL2027_dor_BYD_brdowska:0 "Komisarz ds. zaopatrzenia"
 PL2027_dor_BYD_brdowska_desc:0 "§YHalina Brdowska§! – Była dyrektorka hurtowni spożywczej. Wie, gdzie jest każdy magazyn w mieście – i komu się należy. Postać fikcyjna."
 BYD_dor_brdowska:0 "Halina Brdowska"
 PL2027_dor_BYD_sielski:0 "Dyrektor zakładów taboru"
 PL2027_dor_BYD_sielski_desc:0 "§YRobert Sielski§! – Inżynier z fabryki pociągów i tramwajów. Uruchomił linię produkcyjną na agregatach w trzy tygodnie. Postać fikcyjna."
 BYD_dor_sielski:0 "Robert Sielski"
 PL2027_dor_BYD_fordonska:0 "Rzeczniczka rady dzielnic"
 PL2027_dor_BYD_fordonska_desc:0 "§YAgnieszka Fordońska§! – Społeczniczka z Fordonu. Godzi spory między osiedlami, zanim przerodzą się w barykady. Postać fikcyjna."
 BYD_dor_fordonska:0 "Agnieszka Fordońska"
 PL2027_dor_BYD_nowosielski:0 "Analityk ćwiczeń sztabowych"
 PL2027_dor_BYD_nowosielski_desc:0 "§Ydr Paweł Nowosielski§! – Pracował przy wielonarodowych ćwiczeniach sztabowych w Bydgoszczy. Planuje operacje szybciej niż ktokolwiek w regionie. Postać fikcyjna."
 BYD_dor_nowosielski:0 "dr Paweł Nowosielski"
 PL2027_dor_BYD_kolasa:0 "Szef logistyki"
 PL2027_dor_BYD_kolasa_desc:0 "§Ygen. bryg. Andrzej Kolasa§! – Logistyk z bydgoskich jednostek wsparcia. Paliwo, amunicja i racje docierają tam, gdzie powinny. Postać fikcyjna."
 BYD_dor_kolasa:0 "gen. bryg. Andrzej Kolasa"
 PL2027_dor_BYD_bielawski:0 "Dowódca saperów"
 PL2027_dor_BYD_bielawski_desc:0 "§Ypłk Ireneusz Bielawski§! – Saper z doświadczeniem z misji. Stawia zapory na Brdzie i kanale szybciej, niż wróg zdąży je zobaczyć. Postać fikcyjna."
 BYD_dor_bielawski:0 "płk Ireneusz Bielawski"
 PL2027_dor_SMR_konopka:0 "Szefowa Biura Legislacyjnego"
 PL2027_dor_SMR_konopka_desc:0 "§YBarbara Konopka§! – Mecenas, która pisze ustawy w nocy, a rano są już uchwalone. Bez niej Sejm byłby tylko budynkiem. Postać fikcyjna."
 SMR_dor_konopka:0 "Barbara Konopka"
 PL2027_dor_SMR_hoza:0 "Kwestor Sejmu"
 PL2027_dor_SMR_hoza_desc:0 "§YZbigniew Hoża§! – Zarządza tym, co zostało z budżetu Kancelarii Sejmu. Liczy każdy litr paliwa do agregatów. Postać fikcyjna."
 SMR_dor_hoza:0 "Zbigniew Hoża"
 PL2027_dor_SMR_szuch:0 "Rzeczniczka Kancelarii Sejmu"
 PL2027_dor_SMR_szuch_desc:0 "§YMarta Szuch§! – Codziennie o ósmej ogłasza w radiu, że Rzeczpospolita trwa. Ludzie jej wierzą. Postać fikcyjna."
 SMR_dor_szuch:0 "Marta Szuch"
 PL2027_dor_SMR_lesinski:0 "Konstytucjonalista"
 PL2027_dor_SMR_lesinski_desc:0 "§Yprof. Witold Lesiński§! – Profesor prawa, który uzasadnia każdą decyzję Marszałka – i ostrzega, gdy prawo zaczyna się kończyć. Postać fikcyjna."
 SMR_dor_lesinski:0 "prof. Witold Lesiński"
 PL2027_dor_SMR_ostrowski:0 "Komendant Straży Marszałkowskiej"
 PL2027_dor_SMR_ostrowski_desc:0 "§Ypłk Henryk Ostrowski§! – Ochraniał posiedzenia Sejmu przez dwadzieścia lat. Teraz broni Wiejskiej przed całym miastem. Postać fikcyjna."
 SMR_dor_ostrowski:0 "płk Henryk Ostrowski"
 PL2027_dor_SMR_rybak:0 "Szefowa ochrony obiektów"
 PL2027_dor_SMR_rybak_desc:0 "§Yppłk Iwona Rybak§! – Zamieniła gmachy wokół Wiejskiej w system punktów oporu połączonych piwnicami. Postać fikcyjna."
 SMR_dor_rybak:0 "ppłk Iwona Rybak"
 PL2027_dor_SMR_kukiz:0 "Pełnomocnik ds. referendów"
 PL2027_dor_SMR_kukiz_desc:0 "§YPaweł Kukiz§! – Muzyk i poseł. W modzie pełnomocnik Sejmu do spraw referendów i jednomandatowych okręgów – jeździ po zachodnich przedmieściach i przekonuje gminy, by zostały przy Rzeczypospolitej. Jego ścieżka w modzie to fikcja."
 SMR_dor_kukiz:0 "Paweł Kukiz"
 PL2027_dor_KPR_krupinski:0 "Szef Kancelarii"
 PL2027_dor_KPR_krupinski_desc:0 "§YAdam Krupiński§! – Prowadzi Pałac jak sztab: krótkie odprawy, krótkie decyzje, długie dni. Postać fikcyjna."
 KPR_dor_krupinski:0 "Adam Krupiński"
 PL2027_dor_KPR_zbikowska:0 "Doradczyni ds. bezpieczeństwa"
 PL2027_dor_KPR_zbikowska_desc:0 "§YKatarzyna Żbikowska§! – Analityczka bezpieczeństwa narodowego. Przygotowuje uzasadnienia dla każdej operacji Kancelarii. Postać fikcyjna."
 KPR_dor_zbikowska:0 "Katarzyna Żbikowska"
 PL2027_dor_KPR_rogowski:0 "Szef protokołu"
 PL2027_dor_KPR_rogowski_desc:0 "§YMichał Rogowski§! – Dyplomata, który rozmawia z ambasadami, choć kraju formalnie już nie ma. Ma kontakty, które otwierają magazyny. Postać fikcyjna."
 KPR_dor_rogowski:0 "Michał Rogowski"
 PL2027_dor_KPR_sowinski:0 "Strateg bezpieczeństwa"
 PL2027_dor_KPR_sowinski_desc:0 "§Ydr Łukasz Sowiński§! – Autor planów obrony stolicy, które przez lata leżały w szufladzie. Teraz są realizowane. Postać fikcyjna."
 KPR_dor_sowinski:0 "dr Łukasz Sowiński"
 PL2027_dor_KPR_zolnowski:0 "Szef sztabu przy Prezydencie"
 PL2027_dor_KPR_zolnowski_desc:0 "§Ygen. dyw. Jerzy Żołnowski§! – Ostatni generał, który został w stolicy. Koordynuje Wojsko z Rembertowa i Wesołej. Postać fikcyjna."
 KPR_dor_zolnowski:0 "gen. dyw. Jerzy Żołnowski"
 PL2027_dor_KPR_grot:0 "Dowódca ochrony państwa"
 PL2027_dor_KPR_grot_desc:0 "§Ypłk Robert Grot§! – Dowodzi ochroną najważniejszych osób i obiektów. Jego ludzie przechodzą najlepsze szkolenie w mieście. Postać fikcyjna."
 KPR_dor_grot:0 "płk Robert Grot"
 PL2027_dor_MPR_ksiegowy:0 "Księgowy Rodziny"
 PL2027_dor_MPR_ksiegowy_desc:0 "§Y„Księgowy”§! – Nikt nie zna jego nazwiska. Zna za to każdy przelew, każdy kantor i każdą skrytkę. Postać fikcyjna."
 MPR_dor_ksiegowy:0 "„Księgowy”"
 PL2027_dor_MPR_doktor:0 "Prawnik Rodziny"
 PL2027_dor_MPR_doktor_desc:0 "§Y„Doktor”§! – Były adwokat, który zawsze wie, jak wyjść z każdej sprawy. Uspokaja ludzi lepiej niż groźby. Postać fikcyjna."
 MPR_dor_doktor:0 "„Doktor”"
 PL2027_dor_MPR_kantor:0 "Właściciel kantorów"
 PL2027_dor_MPR_kantor_desc:0 "§Y„Kantor”§! – Pierze pieniądze w myjniach i hurtowniach, a za pieniądze rosną warsztaty. Postać fikcyjna."
 MPR_dor_kantor:0 "„Kantor”"
 PL2027_dor_MPR_profesor:0 "Strateg porachunków"
 PL2027_dor_MPR_profesor_desc:0 "§Y„Profesor”§! – Planuje każdą akcję co do minuty. Dawniej napady, dziś operacje w dzielnicach. Postać fikcyjna."
 MPR_dor_profesor:0 "„Profesor”"
 PL2027_dor_MPR_kierowca:0 "Szef bojówek"
 PL2027_dor_MPR_kierowca_desc:0 "§Y„Kierowca”§! – Prowadzi furgonetki bez tablic i ludzi w kominiarkach. Szybki, ale nie zawsze myśli o jutrze. Postać fikcyjna."
 MPR_dor_kierowca:0 "„Kierowca”"
 PL2027_dor_MPR_kwatermistrz:0 "Magazynier hurtowni"
 PL2027_dor_MPR_kwatermistrz_desc:0 "§Y„Kwatermistrz”§! – Z hurtowni w Pruszkowie wyjeżdża wszystko: amunicja, paliwo, kamizelki. Za gotówkę. Postać fikcyjna."
 MPR_dor_kwatermistrz:0 "„Kwatermistrz”"
 PL2027_dor_ZKR_baumann:0 "Wielki Szafarz"
 PL2027_dor_ZKR_baumann_desc:0 "§Ybrat Heinrich Baumann§! – Zarządza majątkiem Zakonu: spichlerzami na Żuławach, tartakami i warsztatami. Postać fikcyjna."
 ZKR_dor_baumann:0 "brat Heinrich Baumann"
 PL2027_dor_ZKR_kessler:0 "Wielki Szpitalnik"
 PL2027_dor_ZKR_kessler_desc:0 "§Ybrat Ulrich Kessler§! – Prowadzi szpitale i przytułki. Ludzie przychodzą do Zakonu po chleb i opatrunki – i zostają. Postać fikcyjna."
 ZKR_dor_kessler:0 "brat Ulrich Kessler"
 PL2027_dor_ZKR_vogel:0 "Kanclerz Zakonu"
 PL2027_dor_ZKR_vogel_desc:0 "§Ysiostra Agnes Vogel§! – Pisze listy do kurii, ambasad i stowarzyszeń za granicą. Każdy list wraca z pieniędzmi. Postać fikcyjna."
 ZKR_dor_vogel:0 "siostra Agnes Vogel"
 PL2027_dor_ZKR_reinholt:0 "Kronikarz Zakonu"
 PL2027_dor_ZKR_reinholt_desc:0 "§Ybrat Klaus Reinholt§! – Pisze kronikę nowego Zakonu. Każda bitwa staje się w niej legendą – i podnosi morale. Postać fikcyjna."
 ZKR_dor_reinholt:0 "brat Klaus Reinholt"
 PL2027_dor_ZKR_falk:0 "Wielki Marszałek"
 PL2027_dor_ZKR_falk_desc:0 "§Ykomtur Dietrich Falk§! – Były oficer, który poprowadził pierwsze oddziały Zakonu. Bezwzględny w ataku. Postać fikcyjna."
 ZKR_dor_falk:0 "komtur Dietrich Falk"
 PL2027_dor_ZKR_lindner:0 "Komtur zamku"
 PL2027_dor_ZKR_lindner_desc:0 "§Ykomtur Otto Lindner§! – Odpowiada za mury, bramy i magazyny malborskiej twierdzy. Twierdza nie padła od wieków. Postać fikcyjna."
 ZKR_dor_lindner:0 "komtur Otto Lindner"
 PL2027_dor_ROS_sokolow:0 "Szef administracji"
 PL2027_dor_ROS_sokolow_desc:0 "§YIgor Sokołow§! – Urzędnik, który przetrwał każdą zmianę na szczycie. Wie, które teczki otworzyć i kiedy. Postać fikcyjna."
 ROS_dor_sokolow:0 "Igor Sokołow"
 PL2027_dor_ROS_bielajew:0 "Minister finansów czasu wojny"
 PL2027_dor_ROS_bielajew_desc:0 "§YWiktor Bielajew§! – Szuka pieniędzy na wojnę w budżetach regionów i funduszach rezerwowych. Postać fikcyjna."
 ROS_dor_bielajew:0 "Wiktor Bielajew"
 PL2027_dor_ROS_morozowa:0 "Szefowa przekazu państwowego"
 PL2027_dor_ROS_morozowa_desc:0 "§YSwietłana Morozowa§! – Kieruje telewizją państwową. Każda porażka zamienia się na ekranie w „trudny, ale konieczny etap”. Postać fikcyjna."
 ROS_dor_morozowa:0 "Swietłana Morozowa"
 PL2027_dor_ROS_rybin:0 "Teoretyk wojny hybrydowej"
 PL2027_dor_ROS_rybin_desc:0 "§Yprof. Arkadij Rybin§! – Akademik ze sztabowej uczelni. Łączy działania wojska, służb i propagandy w jeden plan. Postać fikcyjna."
 ROS_dor_rybin:0 "prof. Arkadij Rybin"
 PL2027_dor_ROS_tarasow:0 "P.o. szefa sztabu generalnego"
 PL2027_dor_ROS_tarasow_desc:0 "§Ygen. Nikołaj Tarasow§! – Awansowany po czystkach w dowództwie. Ostrożny, metodyczny, lojalny wobec tego, kto rządzi. Postać fikcyjna."
 ROS_dor_tarasow:0 "gen. Nikołaj Tarasow"
 PL2027_dor_ROS_siemionow:0 "Dowódca Floty Bałtyckiej (p.o.)"
 PL2027_dor_ROS_siemionow_desc:0 "§Yadm. Gleb Siemionow§! – Dowodzi okrętami, które od miesięcy stoją w Bałtijsku. Chce udowodnić, że flota jeszcze się liczy. Postać fikcyjna."
 ROS_dor_siemionow:0 "adm. Gleb Siemionow"
 PL2027_dor_WMZ_lidzbarska:0 "Starościna Warmii"
 PL2027_dor_WMZ_lidzbarska_desc:0 "§YAgata Lidzbarska§! – Samorządowczyni z Warmii. Trzyma razem gminy, które jeszcze rok temu kłóciły się o drogi powiatowe. Postać fikcyjna."
 WMZ_dor_lidzbarska:0 "Agata Lidzbarska"
 PL2027_dor_WMZ_jezioranski:0 "Komisarz ds. lasów i jezior"
 PL2027_dor_WMZ_jezioranski_desc:0 "§YPiotr Jeziorański§! – Leśnik i dawny przewodnik turystyczny. Drewno, ryby i schroniska – to dziś gospodarka regionu. Postać fikcyjna."
 WMZ_dor_jezioranski:0 "Piotr Jeziorański"
 PL2027_dor_WMZ_reszelski:0 "Rzecznik gmin mazurskich"
 PL2027_dor_WMZ_reszelski_desc:0 "§YBogdan Reszelski§! – Wójt, który zna każdego sołtysa. Mówi prosto i nikt mu nie przerywa. Postać fikcyjna."
 WMZ_dor_reszelski:0 "Bogdan Reszelski"
 PL2027_dor_WMZ_sowka:0 "Badaczka walki w lasach i na jeziorach"
 PL2027_dor_WMZ_sowka_desc:0 "§Ydr Ewelina Sówka§! – Naukowczyni z olsztyńskiego kampusu. Opracowała zasady obrony w terenie lesistym i bagiennym. Postać fikcyjna."
 WMZ_dor_sowka:0 "dr Ewelina Sówka"
 PL2027_dor_WMZ_borowiecki:0 "Szef obrony Mazur"
 PL2027_dor_WMZ_borowiecki_desc:0 "§Ypłk Adam Borowiecki§! – Dowodzi obroną pasa przy granicy z Obwodem Królewieckim. Spodziewa się ataku każdego dnia. Postać fikcyjna."
 WMZ_dor_borowiecki:0 "płk Adam Borowiecki"
 PL2027_dor_WMZ_mikolajski:0 "Dowódca strzelców jeziornych"
 PL2027_dor_WMZ_mikolajski_desc:0 "§Yppłk Lech Mikołajski§! – Jego oddziały poruszają się łodziami i na nartach. Zimą są najszybsi w regionie. Postać fikcyjna."
 WMZ_dor_mikolajski:0 "ppłk Lech Mikołajski"
 PL2027_dor_NNA_ciechanski:0 "Przewodniczący Izby Handlowej"
 PL2027_dor_NNA_ciechanski_desc:0 "§YMarek Ciechański§! – Przedsiębiorca, który wymyślił Konfederację jako związek gmin handlujących ze sobą bez ceł. Postać fikcyjna."
 NNA_dor_ciechanski:0 "Marek Ciechański"
 PL2027_dor_NNA_opinska:0 "Skarbniczka Konfederacji"
 PL2027_dor_NNA_opinska_desc:0 "§YRenata Opińska§! – Pilnuje wspólnej kasy gmin. Każdy wydatek musi mieć fakturę – nawet w czasie wojny. Postać fikcyjna."
 NNA_dor_opinska:0 "Renata Opińska"
 PL2027_dor_NNA_nasielski:0 "Negocjator Konfederacji"
 PL2027_dor_NNA_nasielski_desc:0 "§YGrzegorz Nasielski§! – Jeździ od gminy do gminy i przekonuje, że razem jest taniej. Zwykle ma rację. Postać fikcyjna."
 NNA_dor_nasielski:0 "Grzegorz Nasielski"
 PL2027_dor_NNA_wolski:0 "Ekonomista wolnorynkowy"
 PL2027_dor_NNA_wolski_desc:0 "§Ydr Igor Wolski§! – Uważa, że gospodarkę odbuduje rynek, nie urzędnicy. Na razie wyniki przyznają mu rację. Postać fikcyjna."
 NNA_dor_wolski:0 "dr Igor Wolski"
 PL2027_dor_NNA_grabowiecki:0 "Szef sztabu Konfederacji"
 PL2027_dor_NNA_grabowiecki_desc:0 "§Ypłk Rafał Grabowiecki§! – Oficer rezerwy, który zbudował armię Konfederacji z ochotników i straży gminnych. Postać fikcyjna."
 NNA_dor_grabowiecki:0 "płk Rafał Grabowiecki"
 PL2027_dor_NNA_krajewska:0 "Dowódczyni oddziałów zmotoryzowanych"
 PL2027_dor_NNA_krajewska_desc:0 "§Ymjr Joanna Krajewska§! – Zamieniła furgonetki firm kurierskich w kolumnę szybkiego reagowania. Postać fikcyjna."
 NNA_dor_krajewska:0 "mjr Joanna Krajewska"
 PL2027_dor_PRW_chelminski:0 "Kanclerz Rzeczypospolitej"
 PL2027_dor_PRW_chelminski_desc:0 "§YStanisław Chełmiński§! – Wieloletni urzędnik wojewódzki. Uważa, że państwo to przede wszystkim działające urzędy. Postać fikcyjna."
 PRW_dor_chelminski:0 "Stanisław Chełmiński"
 PL2027_dor_PRW_rudnicka:0 "Ministra rolnictwa"
 PL2027_dor_PRW_rudnicka_desc:0 "§YTeresa Rudnicka§! – Rolniczka z Lubelszczyzny. Jej plan zasiewów wyżywił region przez pierwszą zimę. Postać fikcyjna."
 PRW_dor_rudnicka:0 "Teresa Rudnicka"
 PL2027_dor_PRW_wierzbicki:0 "Mediator społeczny"
 PL2027_dor_PRW_wierzbicki_desc:0 "§Yks. Antoni Wierzbicki§! – Proboszcz, który godzi skłócone wsie i pilnuje, by uchodźcy mieli dach nad głową. Postać fikcyjna."
 PRW_dor_wierzbicki:0 "ks. Antoni Wierzbicki"
 PL2027_dor_PRW_wojtowicz:0 "Historyk wojskowości"
 PL2027_dor_PRW_wojtowicz_desc:0 "§Yprof. Jan Wójtowicz§! – Uczy oficerów na przykładach z dawnych wojen na wschodnich rubieżach. Postać fikcyjna."
 PRW_dor_wojtowicz:0 "prof. Jan Wójtowicz"
 PL2027_dor_PRW_kozak:0 "Szef Sztabu Generalnego"
 PL2027_dor_PRW_kozak_desc:0 "§Ygen. bryg. Wiesław Kozak§! – Dowódca dawnej brygady zmechanizowanej. Chce, żeby armia Rzeczypospolitej była najlepsza w kraju. Postać fikcyjna."
 PRW_dor_kozak:0 "gen. bryg. Wiesław Kozak"
 PL2027_dor_PRW_bugaj:0 "Strażnik linii Bugu"
 PL2027_dor_PRW_bugaj_desc:0 "§Ypłk Leszek Bugaj§! – Pilnuje przepraw na Bugu. Nikt nie przejdzie bez jego wiedzy. Postać fikcyjna."
 PRW_dor_bugaj:0 "płk Leszek Bugaj"
 PL2027_dor_BST_sokolska:0 "Komisarz ds. granicy"
 PL2027_dor_BST_sokolska_desc:0 "§YAnna Sokólska§! – Koordynuje straże, szpitale i pomoc dla ludzi porzuconych przy granicy przez przemytników. Postać fikcyjna."
 BST_dor_sokolska:0 "Anna Sokólska"
 PL2027_dor_BST_lapinski:0 "Dyrektor elektrociepłowni"
 PL2027_dor_BST_lapinski_desc:0 "§YJarosław Łapiński§! – Dzięki niemu w Białymstoku jest prąd i ciepła woda. Nikt nie kłóci się z człowiekiem od kaloryferów. Postać fikcyjna."
 BST_dor_lapinski:0 "Jarosław Łapiński"
 PL2027_dor_BST_kiryluk:0 "Rzeczniczka społeczności prawosławnej"
 PL2027_dor_BST_kiryluk_desc:0 "§YNadzieja Kiryluk§! – Mówi po polsku, białorusku i rosyjsku. Pilnuje, by nikt nie dzielił mieszkańców regionu. Postać fikcyjna."
 BST_dor_kiryluk:0 "Nadzieja Kiryluk"
 PL2027_dor_BST_biernacki:0 "Ekspert od zagrożeń hybrydowych"
 PL2027_dor_BST_biernacki_desc:0 "§Ydr Michał Biernacki§! – Analizował kryzysy graniczne na długo przed rozpadem. Rozpoznaje operacje służb z drugiej strony granicy. Postać fikcyjna."
 BST_dor_biernacki:0 "dr Michał Biernacki"
 PL2027_dor_BST_puszczanski:0 "Dowódca obrony granicy"
 PL2027_dor_BST_puszczanski_desc:0 "§Ypłk Konrad Puszczański§! – Dowodzi obroną od Puszczy Knyszyńskiej po Bug. Zna każdą ścieżkę przemytników. Postać fikcyjna."
 BST_dor_puszczanski:0 "płk Konrad Puszczański"
 PL2027_dor_BST_bielska:0 "Szefowa straży granicznej"
 PL2027_dor_BST_bielska_desc:0 "§Ymjr Ewa Bielska§! – Prowadzi posterunki przy granicy. Jej ludzie są zmęczeni, ale doświadczeni jak nikt. Postać fikcyjna."
 BST_dor_bielska:0 "mjr Ewa Bielska"
 PL2027_dor_GDY_orlowska:0 "Dyrektorka portu"
 PL2027_dor_GDY_orlowska_desc:0 "§YKrystyna Orłowska§! – Prowadzi port, który jako jedyny w regionie przyjmuje statki z zagranicy. To okno na świat. Postać fikcyjna."
 GDY_dor_orlowska:0 "Krystyna Orłowska"
 PL2027_dor_GDY_ruminski:0 "Przewodniczący związku portowców"
 PL2027_dor_GDY_ruminski_desc:0 "§YPaweł Rumiński§! – Gdy staje port, staje miasto. Rumiński pilnuje, żeby port nie stawał. Postać fikcyjna."
 GDY_dor_ruminski:0 "Paweł Rumiński"
 PL2027_dor_GDY_puzdrowska:0 "Negocjatorka handlowa"
 PL2027_dor_GDY_puzdrowska_desc:0 "§YMarta Puzdrowska§! – Kontrakty na paliwo, zboże i części zamienne podpisuje na pokładach statków. Postać fikcyjna."
 GDY_dor_puzdrowska:0 "Marta Puzdrowska"
 PL2027_dor_GDY_wronski:0 "Teoretyk wojny morskiej"
 PL2027_dor_GDY_wronski_desc:0 "§Ykmdr por. Tadeusz Wroński§! – Wykładowca akademii morskiej. Pisze o obronie wybrzeża siłami małych okrętów. Postać fikcyjna."
 GDY_dor_wronski:0 "kmdr por. Tadeusz Wroński"
 PL2027_dor_GDY_kaszubowski:0 "Dowódca obrony wybrzeża"
 PL2027_dor_GDY_kaszubowski_desc:0 "§Ypłk Adam Kaszubowski§! – Dowodzi piechotą morską i baterią nadbrzeżną na Oksywiu. Postać fikcyjna."
 GDY_dor_kaszubowski:0 "płk Adam Kaszubowski"
 PL2027_dor_GDY_gajewski:0 "Szef floty"
 PL2027_dor_GDY_gajewski_desc:0 "§Ykmdr Jan Gajewski§! – Ma pod sobą kilka okrętów, które zostały w porcie. Każdy z nich zna od stępki. Postać fikcyjna."
 GDY_dor_gajewski:0 "kmdr Jan Gajewski"
 PL2027_dor_WMG_szadkowska:0 "Skarbniczka Wolnego Miasta"
 PL2027_dor_WMG_szadkowska_desc:0 "§YBeata Szadkowska§! – Prowadzi miejską kasę od czasów, gdy miasto było jeszcze częścią państwa. Nie lubi długów. Postać fikcyjna."
 WMG_dor_szadkowska:0 "Beata Szadkowska"
 PL2027_dor_WMG_palaszewski:0 "Lider związku stoczniowców"
 PL2027_dor_WMG_palaszewski_desc:0 "§YJerzy Pałaszewski§! – Spawacz z czterdziestoletnim stażem. Gdy mówi na wiecu, cała stocznia słucha. Postać fikcyjna."
 WMG_dor_palaszewski:0 "Jerzy Pałaszewski"
 PL2027_dor_WMG_brzeznicka:0 "Dyrektorka portu"
 PL2027_dor_WMG_brzeznicka_desc:0 "§YHelena Brzeźnicka§! – Zarządza nabrzeżami i terminalem kontenerowym. Port to pieniądze, a pieniądze to niezależność. Postać fikcyjna."
 WMG_dor_brzeznicka:0 "Helena Brzeźnicka"
 PL2027_dor_WMG_zielinski:0 "Historyk Wolnego Miasta"
 PL2027_dor_WMG_zielinski_desc:0 "§Ydr Konrad Zieliński§! – Zna historię Gdańska jak nikt. Przekonuje, że miasto już raz było niezależne – i może być znowu. Postać fikcyjna."
 WMG_dor_zielinski:0 "dr Konrad Zieliński"
 PL2027_dor_WMG_sobieszewski:0 "Dowódca obrony Żuław"
 PL2027_dor_WMG_sobieszewski_desc:0 "§Ypłk Rafał Sobieszewski§! – Broni miasta od strony Żuław, gdzie każda śluza może zatopić drogę wroga. Postać fikcyjna."
 WMG_dor_sobieszewski:0 "płk Rafał Sobieszewski"
 PL2027_dor_WMG_bielecki:0 "Komendant portu wojennego"
 PL2027_dor_WMG_bielecki_desc:0 "§Ykmdr Dariusz Bielecki§! – Pilnuje wejścia do portu i kanału portowego. Bez jego zgody nic nie wpłynie ani nie wypłynie. Postać fikcyjna."
 WMG_dor_bielecki:0 "kmdr Dariusz Bielecki"
