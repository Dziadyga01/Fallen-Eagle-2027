l_english:
 EK_PMN_zarzad:0 "Zarząd tymczasowy w Szczecinie"
 EK_PMN_zarzad_desc:0 "Na Wałach Chrobrego zawieszono flagę Unii obok flagi miasta. Zarząd tymczasowy przejmuje urzędy, port i jednostki stacjonujące w regionie."
 EK_PMN_port:0 "Port Szczecin–Świnoujście"
 EK_PMN_port_desc:0 "Port pracuje znowu na trzy zmiany. Statki z Hamburga i Rotterdamu wiozą maszyny dla całego regionu."
 EK_PMN_terminal:0 "Terminal gazowy w Świnoujściu"
 EK_PMN_terminal_desc:0 "Gazoport zapewnia regionowi paliwo, którego brakuje dalej na wschód. Część dostaw można sprzedawać sąsiadom."
 EK_PMN_stocznia:0 "Stocznia nad Odrą"
 EK_PMN_stocznia_desc:0 "Dawne pochylnie wracają do pracy: kutry patrolowe, barki i remonty statków."
 EK_PMN_fundusze:0 "Fundusze odbudowy z warunkami"
 EK_PMN_fundusze_desc:0 "Transze płyną, ale każda ma listę warunków: audyt, przetargi, niezależne sądy. Część radnych mówi o „kurateli”."
 EK_PMN_s3:0 "Droga S3 i kolej nadodrzańska"
 EK_PMN_s3_desc:0 "Remonty dróg i torów wzdłuż Odry. Ciężarówki dojeżdżają z portu do Zielonej Góry w pół dnia."
 EK_PMN_standardy:0 "Europejskie standardy w urzędach"
 EK_PMN_standardy_desc:0 "Szpitale, sądy i urzędy według europejskich procedur. Działa – choć wymaga mnóstwa papierów."
 EK_PMN_przemysl:0 "Odbudowa przemysłu Pomorza"
 EK_PMN_przemysl_desc:0 "Fabryki w Policach, Stargardzie i Gorzowie wracają do produkcji dzięki europejskim kredytom."
 EK_PMN_erp_mandat:0 "Europejski mandat"
 EK_PMN_erp_mandat_desc:0 "Donald Tusk (fikcyjna ścieżka moda) ogłasza w Szczecinie, że Eurokomisariat nie jest końcem Polski, tylko początkiem jej odbudowy – pod warunkami, które przyjmie każdy uczestnik."
 EK_PMN_erp_rada:0 "Rada Regionów"
 EK_PMN_erp_rada_desc:0 "Szczecin zaprasza regiony do Rady Regionów. Pierwsze delegacje przyjeżdżają z Trójmiasta i Wielkopolski. Odblokowuje decyzje „Rada Regionów”."
 EK_PMN_erp_pomoc:0 "Pomoc z warunkami"
 EK_PMN_erp_pomoc_desc:0 "Bruksela otwiera fundusz odbudowy dla regionów, które przyjmą wspólne standardy. Pomoc jest hojna – i ma długą listę warunków."
 EK_PMN_erp_instytucje:0 "Wspólne instytucje"
 EK_PMN_erp_instytucje_desc:0 "Trybunał, bank odbudowy i wspólna komisja wyborcza. Instytucje działają, zanim istnieje państwo, któremu mają służyć."
 EK_PMN_erp_spor:0 "Spór o zależność od Unii"
 EK_PMN_erp_spor_desc:0 "Na sesji Rady Regionów delegaci pytają wprost: kto tu rządzi – my czy Komisja? Odpowiedź ustawi cały projekt."
 EK_PMN_erp_konwent:0 "Konwent konstytucyjny"
 EK_PMN_erp_konwent_desc:0 "Delegaci regionów piszą konstytucję federacji: wspólna polityka zagraniczna i obrona, szeroka autonomia, prawo wyjścia."
 EK_PMN_erp_projekt:0 "Europejska Rzeczpospolita Polska"
 EK_PMN_erp_projekt_desc:0 "Projekt dostaje nazwę roboczą i statut. Regiony mogą przystąpić do federacji – każdy osobno, przez negocjacje i ratyfikację (panel „Integracja regionów”)."
 EK_PMN_erp_stolica:0 "Stolica: Szczecin czy Warszawa?"
 EK_PMN_erp_stolica_desc:0 "Federacja ma działać w Szczecinie, ale bez Warszawy nie będzie Polską. Rada Regionów proponuje Sejmowi miejsce przy stole."
 EK_PMN_erp_federacja:0 "Federacja europejska"
 EK_PMN_erp_federacja_desc:0 "Federacja ma pierwszych członków. Wspólne dowództwo, wspólny budżet odbudowy, wspólna polityka zagraniczna."
 EK_PMN_komisaryczny:0 "Zarząd komisaryczny"
 EK_PMN_komisaryczny_desc:0 "Bez polityka, który chciałby budować Polskę od nowa, Eurokomisariat rządzi się jak urząd: sprawnie, cicho i bez ambicji."
 EK_PMN_euroregion:0 "Euroregion Pomorze"
 EK_PMN_euroregion_desc:0 "Komisja uznaje Pomorze Zachodnie za stały euroregion: fundusze bez końca, polityka zagraniczna bez nas."
 EK_PMN_wybory:0 "Wybory do sejmiku"
 EK_PMN_wybory_desc:0 "Pierwsze wybory pod zarządem tymczasowym. Wyborcy pytają, czy Szczecin ma być Polską, Europą, czy po prostu Szczecinem."
 EK_PMN_suwerennosc:0 "Pomorze samo o sobie"
 EK_PMN_suwerennosc_desc:0 "Sejmik domaga się przejęcia kompetencji od zarządu tymczasowego. Fundusze maleją, władza rośnie."
 EK_PMN_straz:0 "Straż Wybrzeża"
 EK_PMN_straz_desc:0 "Kutry patrolowe i straż graniczna na Zalewie Szczecińskim. Przemytnicy przenoszą się dalej na wschód."
 EK_PMN_brygada:0 "Brygada Pomorska"
 EK_PMN_brygada_desc:0 "Ochotnicy, rezerwiści i jednostki, które zostały w regionie po Godzinie Zero, tworzą pierwszą brygadę Eurokomisariatu."
 EK_PMN_misja:0 "Misja doradcza UE"
 EK_PMN_misja_desc:0 "Oficerowie z kilku państw Unii szkolą sztab. Doktryna jest nowoczesna, broni wciąż mało."
 EK_PMN_odra:0 "Linia Odry i Warty"
 EK_PMN_odra_desc:0 "Umocnienia na przeprawach przez Odrę i Wartę. Granica z rozbitą Polską przestaje być otwarta dla każdej kolumny."
 EK_PMN_trojmiasto:0 "Oferta dla Trójmiasta"
 EK_PMN_trojmiasto_desc:0 "Gdańsk, Gdynia i Sopot pozostają osobnymi państwami. Szczecin proponuje im stowarzyszenie i wspólne przetargi portowe – bez żadnego zwierzchnictwa."
 EK_PMN_os_odry:0 "Oś Odry ze Śląskiem"
 EK_PMN_os_odry_desc:0 "Szczecin i Wrocław łączy rzeka i ten sam rodzaj zarządu. Współpraca – handel, kolej, wspólna obrona – ale bez łączenia eurokomisariatów."
 EK_PMN_posen:0 "Granica z Eurostaatem Posen"
 EK_PMN_posen_desc:0 "Na południu protektorat Niemiec, na wschodzie rozbita Polska. Eurokomisariat ustala zasady przejść granicznych z oboma."
 EK_PMN_kujawy:0 "Handel z Kujawami i Pomorzem Gdańskim"
 EK_PMN_kujawy_desc:0 "Ciężarówki z portu jadą na wschód, z Kujaw wraca żywność. Wspólny rynek zaczyna się od faktur."
 EK_SLS_wroclaw:0 "Eurokomisariat we Wrocławiu"
 EK_SLS_wroclaw_desc:0 "Borys Budka (fikcyjna ścieżka moda) obejmuje zarząd Eurokomisariatu Śląska: Dolny Śląsk, Opolszczyzna i południe Ziemi Lubuskiej. Górny Śląsk pozostaje poza nim."
 EK_SLS_miedz:0 "Zagłębie Miedziowe"
 EK_SLS_miedz_desc:0 "Kopalnie i huty miedzi w Lubinie, Polkowicach i Głogowie wracają do pełnej pracy. Miedź to waluta, którą rozumie każdy sąsiad."
 EK_SLS_wroclaw_fabryki:0 "Fabryki wokół Wrocławia"
 EK_SLS_wroclaw_fabryki_desc:0 "Strefy przemysłowe pod Wrocławiem dostają europejskie kredyty – i europejskich kontrolerów."
 EK_SLS_odra:0 "Odra jako droga wodna"
 EK_SLS_odra_desc:0 "Barki z węglem, kruszywem i zbożem płyną z Koźla do Szczecina. Rzeka znów pracuje."
 EK_SLS_walbrzych:0 "Wałbrzych i Kotlina"
 EK_SLS_walbrzych_desc:0 "Dawne zakłady w Wałbrzychu i Świdnicy produkują sprzęt dla straży i amunicję. Region, który pamięta bezrobocie, nie chce go znowu."
 EK_SLS_energia:0 "Energetyka regionu"
 EK_SLS_energia_desc:0 "Elektrownie na Dolnym Śląsku i sieć z Czechami i Niemcami. Prąd jest – pytanie, kto za niego płaci."
 EK_SLS_strefa:0 "Specjalna strefa odbudowy"
 EK_SLS_strefa_desc:0 "Niskie podatki dla każdego, kto otworzy zakład w regionie. Inwestorzy wracają – ostrożnie."
 EK_SLS_statut:0 "Statut Eurokomisariatu"
 EK_SLS_statut_desc:0 "Sejmik uchwala statut: dwujęzyczne gminy tam, gdzie mieszkańcy tego chcą, własne podatki i prawo do własnej polityki gospodarczej."
 EK_SLS_opole:0 "Opolszczyzna w Eurokomisariacie"
 EK_SLS_opole_desc:0 "Opole dostaje własną radę regionalną i część budżetu. Gminy dwujęzyczne zachowują swoje szkoły i tablice."
 EK_SLS_gorny:0 "Pytanie o Górny Śląsk"
 EK_SLS_gorny_desc:0 "Katowice nie są częścią Eurokomisariatu i nie muszą nim być. Wrocław proponuje sąsiadom współpracę, a nie roszczenia."
 EK_SLS_czechy:0 "Granica z Czechami"
 EK_SLS_czechy_desc:0 "Kotlina Kłodzka i Karkonosze: wspólne patrole, otwarte przejścia, czeski prąd i czeskie ciężarówki."
 EK_SLS_os_odry:0 "Oś Odry"
 EK_SLS_os_odry_desc:0 "Wrocław i Szczecin – dwa eurokomisariaty, jedna rzeka. Wspólny rozkład barek, kolej i obrona przepraw. Każdy zostaje u siebie."
 EK_SLS_kolej:0 "Kolej nadodrzańska"
 EK_SLS_kolej_desc:0 "Pociągi towarowe z Wrocławia do Szczecina jeżdżą codziennie. Węgiel na północ, maszyny na południe."
 EK_SLS_wspolny_rynek:0 "Wspólny rynek Odry"
 EK_SLS_wspolny_rynek_desc:0 "Bez ceł i bez kolejek na granicy obu eurokomisariatów. Wspólne inwestycje – osobne budżety."
 EK_SLS_bez_warszawy:0 "Odbudowa bez czekania na Warszawę"
 EK_SLS_bez_warszawy_desc:0 "Wrocław inwestuje w siebie. Jeśli Warszawa się podniesie – świetnie. Jeśli nie – Śląsk sobie poradzi."
 EK_SLS_most:0 "Most do Warszawy"
 EK_SLS_most_desc:0 "Budka proponuje Sejmowi stałą linię współpracy: dostawy, kredyty i wspólne stanowisko wobec Brukseli. Bez podporządkowania, ale z zaufaniem."
 EK_SLS_inwestorzy:0 "Wrocław inwestorów"
 EK_SLS_inwestorzy_desc:0 "Firmy, które opuściły rozbitą Polskę, wracają do Wrocławia: stabilny zarząd, europejskie prawo, tani prąd."
 EK_SLS_kredyty:0 "Kredyty dla Sejmu"
 EK_SLS_kredyty_desc:0 "Eurokomisariat udziela Sejmowi kredytu na zaopatrzenie stolicy. W zamian – miejsce przy stole, gdy Polska będzie się odbudowywać."
 EK_SLS_europa:0 "Śląsk w projekcie europejskim"
 EK_SLS_europa_desc:0 "Wrocław przystępuje do Rady Regionów. Jeśli powstanie Europejska Rzeczpospolita Polska, Śląsk będzie w niej na własnych warunkach."
 EK_SLS_straz:0 "Straż Odrzańska"
 EK_SLS_straz_desc:0 "Patrole na przeprawach przez Odrę i na granicy z Wielkopolską."
 EK_SLS_brygada:0 "Brygada Dolnośląska"
 EK_SLS_brygada_desc:0 "Pierwsza brygada Eurokomisariatu: ochotnicy z Wrocławia, Legnicy i Jeleniej Góry."
 EK_SLS_klodzko:0 "Obrona Kotliny Kłodzkiej"
 EK_SLS_klodzko_desc:0 "Sudety to naturalna twierdza. Umocnienia na przełęczach i przy przeprawach."
 EK_SLS_sztab:0 "Sztab Eurokomisariatu"
 EK_SLS_sztab_desc:0 "Sztab szkolony przez misję doradczą UE. Planowanie jest nowoczesne, ludzi wciąż za mało."
