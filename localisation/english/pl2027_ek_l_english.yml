l_english:
 EK_stowarzyszenie_op:0 "Stowarzyszenie z projektem europejskim"
 EK_odmowa_op:0 "Odrzucona oferta stowarzyszenia"
 EK_os_odry_op:0 "Oś Odry"
 EK_sejm_op:0 "Rozmowy z Sejmem"
 EK_komisariat:0 "Eurokomisariat"
 EK_komisariat_desc:0 "Zarząd tymczasowy pod nadzorem instytucji Unii: urzędy działają, pensje przychodzą na czas, fundusze płyną. Własnej armii jest niewiele, a każda większa decyzja wymaga zgody Komisji."
 EK_rada:0 "Rada Regionów"
 EK_rada_desc:0 "Europejski projekt odbudowy Polski zaprasza regiony do stowarzyszenia: fundusze z warunkami, wspólne standardy i miejsce w Radzie Regionów. Stowarzyszenie nie zmienia granic – to pierwszy krok, po którym region może (ale nie musi) przystąpić do federacji w panelu „Integracja regionów”.\n\nZależność od instytucji europejskich: §Y[?EUR_zaleznosc|0]§!."
 EK_d_oferta:0 "Oferta stowarzyszenia"
 EK_d_oferta_desc:0 "Delegacja jedzie do regionu z ofertą: fundusze odbudowy z warunkami (audyt, przetargi, sądy) i miejsce w Radzie Regionów. Region może odmówić."
 EK_fundusze_stowarzyszeniowe:0 "Fundusze stowarzyszeniowe"
 EK_fundusze_stowarzyszeniowe_desc:0 "Pieniądze z projektu europejskiego: szybsze budowy, ale każdy przetarg sprawdza audytor z Brukseli."
 ek.10.t:0 "Oferta stowarzyszenia"
 ek.10.d:0 "[From.GetName] proponuje nam stowarzyszenie z europejskim projektem odbudowy Polski: fundusze odbudowy, wspólne standardy i miejsce w Radzie Regionów. Granice się nie zmienią, ale audytorzy zaczną zaglądać do naszych przetargów."
 ek.10.a:0 "Przyjmujemy stowarzyszenie."
 ek.10.b:0 "Odmawiamy – nie będziemy brać pieniędzy z warunkami."
 EK_PMN_tree:0 "Eurokomisariat Pomorza"
 EK_tt_1:0 "Donald Tusk kieruje Eurokomisariatem Pomorza"
 EK_tt_2:0 "Eurokomisariatem kieruje zarząd komisaryczny (bez Donalda Tuska)"
 EK_tt_3:0 "Odblokowuje panel §YRada Regionów§! (oferty stowarzyszenia)."
 EK_tt_4:0 "Odblokowuje projekt §YEuropejska Rzeczpospolita Polska§! w panelu „Integracja regionów”."
 EK_req_stow:0 "Co najmniej §Y2§! regiony przyjęły ofertę stowarzyszenia"
 EK_req_fed:0 "Projekt „Europejska Rzeczpospolita Polska” zakończył integrację co najmniej jednego członka"
 EK_PMN_gaz:0 "Gaz ze Świnoujścia"
 EK_PMN_gaz_desc:0 "Terminal gazowy daje regionowi energię i towar na sprzedaż."
 EK_pomoc_warunkowa:0 "Pomoc z warunkami"
 EK_pomoc_warunkowa_desc:0 "Fundusz odbudowy dla regionów projektu europejskiego. Hojny – pod warunkiem audytów, niezależnych sądów i przejrzystych przetargów."
 EK_federacja_centrum:0 "Centrum federacji"
 EK_federacja_centrum_desc:0 "W Szczecinie działają wspólne instytucje federacji. Każda decyzja to kompromis z członkami – ale decyzje zapadają."
 EK_straz_wybrzeza:0 "Straż Wybrzeża"
 EK_straz_wybrzeza_desc:0 "Patrole na Zalewie i u ujścia Odry."
 EK_misja_ue:0 "Misja doradcza UE"
 EK_misja_ue_desc:0 "Sztab szkolony według europejskich standardów."
 ek.20.t:0 "Kto tu rządzi?"
 ek.20.d:0 "Delegaci Rady Regionów kłócą się do rana. Jedni chcą, żeby Komisja pilnowała wszystkiego – bo tylko wtedy pieniądze dotrą. Drudzy mówią, że Polska odbudowana z cudzej woli nie będzie Polską.\n\nZależność od instytucji europejskich: §Y[?EUR_zaleznosc|0]§!."
 ek.20.a:0 "Europa pilnuje – fundusze i standardy ponad wszystko."
 ek.20.b:0 "Polska decyduje – suwerenność ponad pieniądze."
 ek.20.c:0 "Kompromis: wspólny nadzór Rady Regionów i Komisji."
 ek.30.t:0 "Zaproszenie ze Szczecina"
 ek.30.d:0 "[From.GetName] proponuje Sejmowi miejsce w Radzie Regionów i rolę w europejskim projekcie odbudowy Polski. W Warszawie jedni widzą w tym szansę, inni – podporządkowanie Szczecinowi."
 ek.30.a:0 "Przyjąć – Polska odbuduje się szybciej z Europą."
 ek.30.b:0 "Sejm jest w Warszawie i tu zostanie."
 EK_SLS_tree:0 "Eurokomisariat Śląska"
 EK_req_os:0 "Pomorze przyjęło współpracę „Oś Odry”"
 EK_SLS_miedz:0 "Miedź z Zagłębia"
 EK_SLS_miedz_desc:0 "Kopalnie i huty pracują. Eksport miedzi finansuje odbudowę regionu."
 EK_SLS_strefa:0 "Specjalna strefa odbudowy"
 EK_SLS_strefa_desc:0 "Ulgi podatkowe przyciągają inwestorów."
 EK_SLS_straz:0 "Straż Odrzańska"
 EK_SLS_straz_desc:0 "Patrole na przeprawach."
 EK_wspolny_rynek_odry:0 "Wspólny rynek Odry"
 EK_wspolny_rynek_odry_desc:0 "Bez ceł między eurokomisariatami. Każdy zostaje u siebie, towary jeżdżą swobodnie."
 EK_os_odry_idea:0 "Oś Odry"
 EK_os_odry_idea_desc:0 "Współpraca dwóch eurokomisariatów: kolej, barki i wspólna obrona przepraw. Bez łączenia państw."
 ek.40.t:0 "Oś Odry"
 ek.40.d:0 "[From.GetName] proponuje współpracę „Oś Odry”: wspólny rozkład barek i pociągów, otwarta granica dla wojska przy obronie przepraw. Oba eurokomisariaty pozostają osobnymi państwami."
 ek.40.a:0 "Zgoda – rzeka nas łączy."
 ek.40.b:0 "Nie teraz."
 EK_tt_5:0 "Donald Tusk kieruje sejmowym ośrodkiem władzy"
 EK_tt_6:0 "Sejmem kieruje następca wybrany po wyjeździe Donalda Tuska"
 EK_tt_7:0 "Rząd otworzył kanał z Brukselą przed Godziną Zero albo Sejm ma dobre relacje z eurokomisariatem"
 EK_tt_8:0 "Odblokowuje projekt §YEuropejska Rzeczpospolita Polska§! z Sejmem jako inicjatorem."
 EK_SMR_konwoje:0 "Konwoje do stolicy"
 EK_SMR_konwoje_desc:0 "Żywność i paliwo z regionów, które ufają Sejmowi. Warszawa przetrwa zimę."
