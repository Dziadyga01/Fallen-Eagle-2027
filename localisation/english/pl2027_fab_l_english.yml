 FAB_GDY_urzad:0 "Gdyńska administracja"
 FAB_GDY_urzad_desc:0 "Sprawy załatwiane w jeden dzień."
 FAB_GDY_republika:0 "Republika Morska"
 FAB_GDY_republika_desc:0 "Najlepiej zorganizowane miasto nad Zatoką."
 FAB_SPT_kasyna:0 "Podatek kasynowy"
 FAB_SPT_kasyna_desc:0 "Kasyna finansują miasto."
 FAB_SPT_neutralnosc:0 "Neutralny kurort"
 FAB_SPT_neutralnosc_desc:0 "Sopot nie bierze udziału w wojnach sąsiadów."
 FAB_SPT_riwiera:0 "Riwiera Północy"
 FAB_SPT_riwiera_desc:0 "Najbogatsze miasto regionu."
 FAB_MPR_rynek_idea:0 "Czarny rynek"
 FAB_MPR_rynek_idea_desc:0 "Wszystko ma swoją cenę."
 FAB_MPR_rodziny_idea:0 "Rada Rodzin"
 FAB_MPR_rodziny_idea_desc:0 "Pruszków rządzi przez pieniądze."
 FAB_PLC_porzadek_idea:0 "Prawo i porządek"
 FAB_PLC_porzadek_idea_desc:0 "Policja przyjeżdża na wezwanie."
 FAB_LEG_legion_idea:0 "Legion Łazienkowskiej"
 FAB_LEG_legion_idea_desc:0 "Kibice jako formacja wojskowa."
 FAB_WMZ_sztab_idea:0 "Sztab obrony regionu"
 FAB_WMZ_sztab_idea_desc:0 "Plan obrony przed operacją z obwodu."
 FAB_MAZ_jeziora:0 "Flotylla jezior"
 FAB_MAZ_jeziora_desc:0 "Jeziora jako droga zaopatrzenia."
 FAB_MAZ_mosty:0 "Mosty do wysadzenia"
 FAB_MAZ_mosty_desc:0 "Kolumny wroga mają tylko kilka dróg."
 FAB_MAZ_twierdza:0 "Twierdza Mazur"
 FAB_MAZ_twierdza_desc:0 "Każdy kilometr kosztuje."
 FAB_SUW_straz:0 "Straż przesmyku"
 FAB_SUW_straz_desc:0 "Posterunki na granicach."
 FAB_SUW_brama:0 "Brama Północy"
 FAB_SUW_brama_desc:0 "Przesmyk zamknięty dla wroga."
 FAB_tt_1:0 "Rosja zaatakowała Warmię i Mazury, Mazury albo Suwalszczyznę"
 FAB_BST_granica_idea:0 "Straż na granicy z Białorusią"
 FAB_BST_granica_idea_desc:0 "Zatrzymywanie przemytników, ratowanie przemycanych."
 FAB_BST_front:0 "Front Północno-Wschodni"
 FAB_BST_front_desc:0 "Wspólne dowództwo z Mazurami."
 FAB_BST_neutralny:0 "Zaplecze frontu"
 FAB_BST_neutralny_desc:0 "Pomagamy, ale nie walczymy."
 FAB_WMZ_stolica:0 "Olsztyn, stolica Warmii"
 FAB_WMZ_stolica_desc:0 "Urząd marszałkowski w Olsztynie przejmuje kompetencje województwa. Region ma rząd – i granicę z obwodem."
 FAB_WMZ_sztab:0 "Sztab obrony regionu"
 FAB_WMZ_sztab_desc:0 "Sztab w koszarach przy Kościuszki planuje obronę przed operacją z obwodu."
 FAB_WMZ_uniwersytet:0 "Uniwersytet Warmińsko-Mazurski"
 FAB_WMZ_uniwersytet_desc:0 "Inżynierowie i agronomowie z Kortowa pracują dla regionu: łączność, drony, żywność."
 FAB_WMZ_kolej:0 "Węzeł olsztyński"
 FAB_WMZ_kolej_desc:0 "Linie z Olsztyna do Ełku, Iławy i Korsz to kręgosłup zaopatrzenia regionu."
 FAB_WMZ_obrona_terytorialna:0 "Brygada Warmińska"
 FAB_WMZ_obrona_terytorialna_desc:0 "Obrona terytorialna z lasów Warmii: znają teren, nie znają strachu."
 FAB_WMZ_zywnosc:0 "Spichlerz Warmii"
 FAB_WMZ_zywnosc_desc:0 "Region karmi się sam i sprzedaje nadwyżki. Bez żywności z Warmii Mazury nie przetrwają oblężenia."
 FAB_WMZ_mazury:0 "Wspólny projekt Warmii i Mazur"
 FAB_WMZ_mazury_desc:0 "Olsztyn proponuje Giżycku i Ziemi Lubawskiej jedno państwo – przez negocjacje i ratyfikację, nie przez wojnę."
 FAB_MAZ_boyen:0 "Twierdza Boyen"
 FAB_MAZ_boyen_desc:0 "XIX-wieczne forty w Giżycku zamykają przesmyk między jeziorami. Mazurzy wiedzą, że kto ma Boyen, ma serce Mazur."
 FAB_MAZ_jeziora:0 "Flotylla Wielkich Jezior"
 FAB_MAZ_jeziora_desc:0 "Łodzie patrolowe na Niegocinie, Mamrach i Śniardwach. Jeziora stają się drogą zaopatrzenia – i linią frontu."
 FAB_MAZ_partyzanci:0 "Leśni ludzie"
 FAB_MAZ_partyzanci_desc:0 "Myśliwi, leśnicy i rezerwiści z Puszczy Piskiej. Nie utrzymają linii frontu – ale żadna kolumna nie przejdzie bez strat."
 FAB_MAZ_mosty:0 "Mosty i groble"
 FAB_MAZ_mosty_desc:0 "Saperzy przygotowują mosty i groble do wysadzenia. Kolumny z obwodu mają tylko kilka dróg."
 FAB_MAZ_zwiazek:0 "Związek Mazurski"
 FAB_MAZ_zwiazek_desc:0 "Gminy Mazur podpisują wspólny akt obrony. Każda wystawia ludzi, każda dzieli się magazynami."
 FAB_MAZ_turystyka:0 "Mazury po wojnie"
 FAB_MAZ_turystyka_desc:0 "Żeglarze wrócą, gdy ucichną działa. Region planuje odbudowę przystani i hoteli."
 FAB_MAZ_twierdza_mazur:0 "Twierdza Mazur"
 FAB_MAZ_twierdza_mazur_desc:0 "Jeziora, forty i lasy w jednym planie obrony. Jeśli Rosja przyjdzie, zapłaci za każdy kilometr."
