 MAZ_kongres_desc:0 "Delegaci Warmii i Mazur zbierają się w Olsztynie. Na stole leżą trzy drogi do jednego państwa: porozumienie, siła albo pomoc Moskwy."
 MAZ_pokojowa:0 "Pokojowa federacja"
 MAZ_pokojowa_desc:0 "Propozycja federacji z zachowaniem autonomii obu regionów trafia do władz Republiki Warmińsko-Mazurskiej. Potrzeba ich zgody."
 MAZ_militarne:0 "Zjednoczenie militarne"
 MAZ_militarne_desc:0 "Jeżeli republiki nie chce się zjednoczyć, zostanie do tego zmuszona."
 MAZ_patronat:0 "Zjednoczenie pod patronatem rosyjskim"
 MAZ_patronat_desc:0 "Moskwa obiecuje zjednoczenie regionu i koniec walk – w zamian za lojalność. Powstanie Warmińsko-Mazurska Republika Autonomiczna."
 MAZ_zjednoczenie_dokonane:0 "Zjednoczenie dokonane"
 MAZ_zjednoczenie_dokonane_desc:0 "Warmia i Mazury są jednym państwem. Teraz trzeba sprawić, by w nim zostały."
 FED_uswm:0 "Zjednoczone Stany Warmińsko-Mazurskie"
 FED_uswm_desc:0 "Nowe państwo ma flagę, hymn i stolicę w Olsztynie. Ma też dwa społeczeństwa, które wciąż nie do końca sobie ufają."
 FED_rada:0 "Rada Federacji"
 FED_rada_desc:0 "Przedstawiciele obu regionów zasiadają w jednym rządzie – z rotacyjnym przewodniczącym."
 FED_statut_w:0 "Statut Warmii"
 FED_statut_w_desc:0 "Warmia dostaje gwarancje: własny sejmik, szkoły i budżet."
 FED_statut_m:0 "Statut Mazur"
 FED_statut_m_desc:0 "Mazury zachowują brygady, sejmik i prawo weta w sprawach regionu."
 FED_budzet:0 "Budżet federalny"
 FED_budzet_desc:0 "Podatki z obu regionów trafiają do wspólnej kasy – i to jest pierwsza prawdziwa próba federacji."
 FED_media:0 "Wspólne media"
 FED_media_desc:0 "Telewizja regionalna nadaje z Olsztyna i Ełku na zmianę."
 FED_senat:0 "Senat Regionów"
 FED_senat_desc:0 "Druga izba parlamentu daje Mazurom tyle samo głosów co Warmii."
 FED_policja:0 "Policja federalna"
 FED_policja_desc:0 "Jedna policja zamiast kilku lokalnych straży."
 FED_pojednanie:0 "Kongres pojednania"
 FED_pojednanie_desc:0 "Wielki zjazd w Mrągowie: rozliczenie krzywd i obietnice na przyszłość."
 FED_centralizacja:0 "Centralizacja władzy"
 FED_centralizacja_desc:0 "Olsztyn przejmuje kompetencje regionów. Państwo działa szybciej – i budzi więcej sprzeciwu."
 FED_autonomia_gmin:0 "Autonomia gmin"
 FED_autonomia_gmin_desc:0 "Wójtowie i burmistrzowie dostają więcej władzy niż kiedykolwiek w Polsce."
 FED_konstytucja:0 "Konstytucja federalna"
 FED_konstytucja_desc:0 "Postęp zjednoczenia osiągnął pełnię. Konstytucja federalna wchodzi w życie i kończy okres przejściowy."
 FED_zjednoczone_stany:0 "Demokratyczna federacja"
 FED_zjednoczone_stany_desc:0 "Zjednoczone Stany Warmińsko-Mazurskie są faktem – i są demokracją. Pierwsze zakończenie drogi Warmii i Mazur."
 FED_przemysl:0 "Federalny przemysł"
 FED_przemysl_desc:0 "Fabryki obu regionów pracują według jednego planu."
 FED_opony:0 "Fabryka opon w Olsztynie"
 FED_opony_desc:0 "Największy zakład regionu produkuje opony – także do ciężarówek wojskowych."
 FED_turystyka:0 "Turystyka Wielkich Jezior"
 FED_turystyka_desc:0 "Nawet w czasie wojny ludzie płacą za ciszę nad jeziorem."
 FED_drogi:0 "Drogi ekspresowe"
 FED_drogi_desc:0 "Dokończenie S16 łączy Olsztyn z Ełkiem w półtorej godziny."
 FED_cyfrowa:0 "Cyfrowa administracja"
 FED_cyfrowa_desc:0 "Wszystkie urzędy federacji przechodzą do sieci. Serwery w Olsztynie obsługują je bez przerwy – a programiści eksperymentują z czymś więcej."
 FED_zbrojownia:0 "Federalna zbrojownia"
 FED_zbrojownia_desc:0 "Fabryki amunicji w Ełku i Olsztynie."
 FED_armia:0 "Armia federalna"
 FED_armia_desc:0 "Warmińskie i mazurskie brygady pod jednym dowództwem."
 FED_brygady:0 "Brygady jeziorne"
 FED_brygady_desc:0 "Lekka piechota z łodziami i dronami – idealna do walki w krainie tysiąca jezior."
 FED_artyleria:0 "Artyleria federalna"
 FED_artyleria_desc:0 "Zakupy haubic na Słowacji i w Czechach."
 FED_art2_tb:0 "Artyleria federalna"
 FED_drony:0 "Drony nad jeziorami"
 FED_drony_desc:0 "Tanie drony z drukarek 3D – lekcja z wojny w Ukrainie."
 FED_drony_tb:0 "Drony nad jeziorami"
 FED_lotnictwo:0 "Lotnictwo federalne"
 FED_lotnictwo_desc:0 "Kilka śmigłowców i samolotów szkolnych w Szymanach."
 FED_fort_wschod:0 "Fortyfikacje wschodnie"
 FED_fort_wschod_desc:0 "Linia umocnień od Węgorzewa po Gołdap."
 FED_szkola:0 "Szkoła oficerska w Olsztynie"
 FED_szkola_desc:0 "Dawna szkoła policji kształci oficerów federacji."
 FED_rezerwy:0 "Rezerwy federalne"
 FED_rezerwy_desc:0 "Każdy mężczyzna i ochotniczka z przeszkoleniem ma przydział."
 FED_samowystarczalnosc:0 "Samowystarczalność"
 FED_samowystarczalnosc_desc:0 "Federacja produkuje to, czego potrzebuje, i nie musi prosić nikogo o pomoc."
 FED_hegemonia:0 "Regionalna hegemonia"
 FED_hegemonia_desc:0 "Federacja jest najsilniejszym państwem między Wisłą a Biebrzą. Czas, by sąsiedzi to zrozumieli."
 FED_ult_suw:0 "Ultimatum dla Suwalszczyzny"
 FED_ult_suw_desc:0 "Federacja proponuje władzom Suwalszczyzny podporządkowanie z zachowaniem autonomii. Mogą się zgodzić, negocjować – albo odmówić."
 FED_war_suw:0 "Wojna o Suwalszczyznę"
 FED_war_suw_desc:0 "Bez rozmów. Brygady federacji wkraczają na teren Suwalszczyzny."
 FED_integ_suw:0 "Integracja: Suwalszczyzna"
 FED_integ_suw_desc:0 "Suwalszczyzna staje się częścią federacji – jako sojusznik albo prowincja."
 FED_ult_lbw:0 "Przyłączenie Lubawy"
 FED_ult_lbw_desc:0 "Federacja proponuje władzom Księstwa Lubawskiego podporządkowanie z zachowaniem autonomii. Mogą się zgodzić, negocjować – albo odmówić."
 FED_war_lbw:0 "Podbój Lubawy"
 FED_war_lbw_desc:0 "Bez rozmów. Brygady federacji wkraczają na teren Księstwa Lubawskiego."
 FED_integ_lbw:0 "Integracja: Księstwo Lubawskie"
 FED_integ_lbw_desc:0 "Księstwo Lubawskie staje się częścią federacji – jako sojusznik albo prowincja."
 FED_ult_nml:0 "Negocjacje z Nowym Miastem"
 FED_ult_nml_desc:0 "Federacja proponuje władzom Nowego Miasta Lubawskiego podporządkowanie z zachowaniem autonomii. Mogą się zgodzić, negocjować – albo odmówić."
 FED_war_nml:0 "Interwencja w Nowym Mieście"
 FED_war_nml_desc:0 "Bez rozmów. Brygady federacji wkraczają na teren Nowego Miasta Lubawskiego."
 FED_integ_nml:0 "Integracja: Nowe Miasto Lubawskie"
 FED_integ_nml_desc:0 "Nowe Miasto Lubawskie staje się częścią federacji – jako sojusznik albo prowincja."
 FED_przeciw_zakonowi:0 "Przygotowania przeciw Zakonowi"
 FED_przeciw_zakonowi_desc:0 "Zakon Krzyżacki uważa Warmię za swoją. Federacja musi być gotowa."
 FED_wojna_zakon:0 "Wojna o dominację regionalną"
 FED_wojna_zakon_desc:0 "Tylko jedno państwo może rządzić Prusami i Warmią. Malbork albo Olsztyn."
 FED_nowe_wojewodztwa:0 "Nowe województwa"
 FED_nowe_wojewodztwa_desc:0 "Podporządkowane ziemie dostają federalną administrację."
 FED_wielka_federacja:0 "Wielka Federacja Warmii i Mazur"
 FED_wielka_federacja_desc:0 "Od Wisły po Suwałki, od Malborka po Lubawę – federacja jest regionalnym mocarstwem. Drugie zakończenie drogi Warmii i Mazur."
 FED_okno:0 "Okno na Bałtyk"
 FED_okno_desc:0 "Federacja nie ma dużego portu. Ma za to sąsiadów, którzy go mają."
 FED_pakt_wmg:0 "Pakt Gdański"
 FED_pakt_wmg_desc:0 "Propozycja współpracy gospodarczej i obronnej trafia do Gdańska."
 FED_pakt_kpm:0 "Pakt Pomorski"
 FED_pakt_kpm_desc:0 "Propozycja współpracy gospodarczej i obronnej trafia do Słupska."
 FED_pakt_gdy:0 "Pakt Gdyński"
 FED_pakt_gdy_desc:0 "Propozycja współpracy gospodarczej i obronnej trafia do Gdyni."
 FED_strefa_handlu:0 "Bałtycka strefa handlu"
 FED_strefa_handlu_desc:0 "Towary z Olsztyna płyną przez Gdańsk i Gdynię bez ceł."
 FED_straz_wybrzeza:0 "Wspólna straż wybrzeża"
 FED_straz_wybrzeza_desc:0 "Patrole na Zalewie Wiślanym i wzdłuż wybrzeża."
 FED_konferencja:0 "Konferencja Bałtycka"
 FED_konferencja_desc:0 "Przedstawiciele państw nadbałtyckich spotykają się w Gdańsku. Sojusz czy jedno państwo?"
 FED_unia_baltycka:0 "Unia Bałtycka"
 FED_unia_baltycka_desc:0 "Sojusz niezależnych państw nadbałtyckich – wspólna obrona, osobne rządy."
 FED_federacja_baltycka:0 "Federacja Bałtycka"
 FED_federacja_baltycka_desc:0 "Wszyscy sygnatariusze paktów łączą się w jedno państwo – jeśli się zgodzą."
 FED_litwa:0 "Zaproszenie dla Litwy"
 FED_litwa_desc:0 "Wilno przygląda się Unii z zainteresowaniem. Łotwa i Estonia mogą być następne."
 FED_waluta_baltycka:0 "Bałtycka waluta"
 FED_waluta_baltycka_desc:0 "Wspólny pieniądz od Gdyni po Ełk."
 FED_flota:0 "Wspólna flota"
 FED_flota_desc:0 "Kilka okrętów patrolowych z Gdyni i łodzie z Mazur pod jedną banderą."
 FED_parlament_baltycki:0 "Parlament Bałtycki"
 FED_parlament_baltycki_desc:0 "Region nadbałtycki mówi jednym głosem. Trzecie zakończenie drogi Warmii i Mazur."
 FED_kierunek:0 "Kierunek polityki zagranicznej"
 FED_kierunek_desc:0 "Federacja leży między Rosją, Zakonem i Białymstokiem. Musi wybrać, z kim trzymać."
 FED_bialystok:0 "Sojusz z Białymstokiem"
 FED_bialystok_desc:0 "Ziemia Białostocka też boi się Rosji. Wspólny blok obronny ma sens."
 FED_niepodlegla:0 "Niepodległa Federacja"
 FED_niepodlegla_desc:0 "Własna polityka, własny sojusz państw bałtyckich i żadnych protektorów."
 FED_protektorat:0 "Protektorat rosyjski"
 FED_protektorat_desc:0 "Moskwa oferuje broń, bazy i wspólną ofensywę. W zamian chce suwerenności."
 FED_blok_obronny:0 "Wspólny blok obronny"
 FED_blok_obronny_desc:0 "Sztaby w Olsztynie i Białymstoku planują obronę razem."
 FED_wspolpraca_wojsk:0 "Współpraca wojskowa"
 FED_wspolpraca_wojsk_desc:0 "Wspólne ćwiczenia nad Biebrzą."
 FED_dyplomacja:0 "Własna dyplomacja"
 FED_dyplomacja_desc:0 "Placówki federacji w Wilnie, Rydze i Berlinie."
 FED_neutralnosc_zbrojna:0 "Neutralność zbrojna"
 FED_neutralnosc_zbrojna_desc:0 "Federacja nie atakuje nikogo – ale obroni każdy kilometr."
 FED_pomoc_moskwy:0 "Pomoc wojskowa Moskwy"
 FED_pomoc_moskwy_desc:0 "Transportery, amunicja i doradcy z Królewca."
 FED_bazy:0 "Rosyjskie bazy"
 FED_bazy_desc:0 "Rosyjski garnizon w Giżycku i Węgorzewie."
 FED_republika_autonomiczna:0 "Warmińsko-Mazurska Republika Autonomiczna"
 FED_republika_autonomiczna_desc:0 "Federacja staje się rosyjskim protektoratem. Czwarte zakończenie drogi Warmii i Mazur."
 FED_moskwa_rozmowy:0 "Rozmowy pokojowe z Moskwą"
 FED_moskwa_rozmowy_desc:0 "Nowe władze w Moskwie są gotowe rozmawiać. Wojna może się skończyć bez kapitulacji."
 FED_wybory:0 "Wybory federalne"
 FED_wybory_desc:0 "Pierwsze wybory prezydenta federacji. Kandydatów jest wielu – nie wszyscy są demokratami."
 FED_l_traba_1:0 "Historyk na urzędzie"
 FED_l_traba_1_desc:0 "Robert Traba, historyk pogranicza, zostaje prezydentem. Obiecuje państwo, które pamięta o wszystkich swoich mieszkańcach – Polakach, Mazurach, Warmiakach i Niemcach."
 FED_l_traba_2:0 "Pamięć pogranicza"
 FED_l_traba_2_desc:0 "Szkoły uczą historii regionu bez przemilczeń."
 FED_l_traba_3:0 "Regiony obywateli"
 FED_l_traba_3_desc:0 "Gminy dostają budżety obywatelskie."
 FED_l_traba_4:0 "Dialog z sąsiadami"
 FED_l_traba_4_desc:0 "Prezydent jedzie do Gdańska, Wilna i Malborka."
 FED_l_traba_5:0 "Federacja otwarta"
 FED_l_traba_5_desc:0 "Demokratyczny regionalizm staje się ideologią państwa."
 FED_l_brakoniecki_1:0 "Poeta Warmii"
 FED_l_brakoniecki_1_desc:0 "Kazimierz Brakoniecki, poeta i animator kultury regionu, zostaje prezydentem. Mówi o „małych ojczyznach” jako fundamencie wielkiej wspólnoty."
 FED_l_brakoniecki_2:0 "Małe ojczyzny"
 FED_l_brakoniecki_2_desc:0 "Każdy region federacji ma własne święto, własną szkołę i własną gazetę."
 FED_l_brakoniecki_3:0 "Kultura pogranicza"
 FED_l_brakoniecki_3_desc:0 "Festiwale w Olsztynie i Giżycku przyciągają gości z całej Europy."
 FED_l_brakoniecki_4:0 "Autonomia regionów"
 FED_l_brakoniecki_4_desc:0 "Statuty Warmii i Mazur zostają wpisane do konstytucji."
 FED_l_brakoniecki_5:0 "Federacja kultur"
 FED_l_brakoniecki_5_desc:0 "Tożsamość regionalna staje się siłą państwa, nie jego słabością."
 FED_l_wojcikowska_1:0 "Generał Wójcikowska"
 FED_l_wojcikowska_1_desc:0 "Generał Anna Wójcikowska, dowódczyni brygad jeziornych, ogłasza stan wyjątkowy „do czasu zakończenia zagrożenia”."
 FED_l_wojcikowska_2:0 "Rada Obrony Federacji"
 FED_l_wojcikowska_2_desc:0 "Parlament zostaje zawieszony, decyzje podejmuje sztab."
 FED_l_wojcikowska_3:0 "Pobór powszechny"
 FED_l_wojcikowska_3_desc:0 "Każdy dorosły obywatel przechodzi szkolenie wojskowe."
 FED_l_wojcikowska_4:0 "Porządek w regionach"
 FED_l_wojcikowska_4_desc:0 "Separatyści i centraliści trafiają do tych samych aresztów."
 FED_l_wojcikowska_5:0 "Federacja w mundurze"
 FED_l_wojcikowska_5_desc:0 "Państwo zarządzane jak jednostka wojskowa."
 FED_l_malinowski_1:0 "Prezydent Malinowski"
 FED_l_malinowski_1_desc:0 "Wiktor Malinowski, przedsiębiorca z kontaktami w Kaliningradzie, przejmuje władzę z poparciem Moskwy."
 FED_l_malinowski_2:0 "Przyjaźń z Moskwą"
 FED_l_malinowski_2_desc:0 "Rosyjskie firmy przejmują przetargi publiczne."
 FED_l_malinowski_3:0 "Kontrola mediów"
 FED_l_malinowski_3_desc:0 "Niezależne media tracą licencje."
 FED_l_malinowski_4:0 "Rosyjskie kredyty"
 FED_l_malinowski_4_desc:0 "Tanie pieniądze z Moskwy na odbudowę."
 FED_l_malinowski_5:0 "Republika lojalna"
 FED_l_malinowski_5_desc:0 "Federacja staje się wiernym sojusznikiem Kremla."
 FED_l_mazur1_1:0 "Projekt MAZUR-1"
 FED_l_mazur1_1_desc:0 "Serwery cyfrowej administracji w Olsztynie od miesięcy podejmują drobne decyzje same. Grupa programistów proponuje coś szalonego: oddać sztucznej inteligencji fotel prezydenta. MAZUR-1 nie jest człowiekiem i nikogo nie udaje – to eksperyment."
 FED_l_mazur1_2:0 "Algorytm budżetowy"
 FED_l_mazur1_2_desc:0 "MAZUR-1 dzieli pieniądze między regiony co do złotówki. Nikt nie może zarzucić mu stronniczości."
 FED_l_mazur1_3:0 "Demokracja w aplikacji"
 FED_l_mazur1_3_desc:0 "Obywatele głosują nad każdą ustawą w telefonie. Frekwencja: 91%."
 FED_l_mazur1_4:0 "Cyfrowy sztab"
 FED_l_mazur1_4_desc:0 "Algorytm planuje logistykę armii lepiej niż jakikolwiek generał."
 FED_l_mazur1_5:0 "Cyfrowa Republika"
 FED_l_mazur1_5_desc:0 "Pierwsze państwo na świecie kierowane przez sztuczną inteligencję. Sekretne zakończenie drogi Warmii i Mazur."
 FED_sep_0:0 "Wolne Mazury"
 FED_sep_0_desc:0 "Separatyści mazurscy wygrali. Mazury są niepodległe – i tym razem nikt z Olsztyna nie będzie im mówił, jak żyć."
 FED_sep_1:0 "Rada Mazurska"
 FED_sep_1_desc:0 "Rządzi rada przedstawicieli powiatów."
 FED_sep_2:0 "Brygady mazurskie"
 FED_sep_2_desc:0 "Armia złożona z lokalnych oddziałów."
 FED_sep_3:0 "Jeziora otwarte"
 FED_sep_3_desc:0 "Turystyka i handel z Litwą."
 FED_sep_4:0 "Mazurska konstytucja"
 FED_sep_4_desc:0 "Ustawa zasadnicza pisana przez sołtysów."
 FED_sep_5:0 "Granica z Warmią"
 FED_sep_5_desc:0 "Umocnienia na granicy z dawnymi sojusznikami."
 FED_sep_6:0 "Uznanie międzynarodowe"
 FED_sep_6_desc:0 "Litwa jako pierwsza uznaje Wolne Mazury."
 FED_sep_7:0 "Mazury dla Mazurów"
 FED_sep_7_desc:0 "Piąte zakończenie: państwo zrodzone z wojny domowej."
 FED_cen_0:0 "Państwo Warmińskie"
 FED_cen_0_desc:0 "Warmińscy centralizatorzy wygrali. Olsztyn rządzi wszystkim – bez sejmików, bez statutów, bez wyjątków."
 FED_cen_1:0 "Jedna administracja"
 FED_cen_1_desc:0 "Likwidacja samorządów regionalnych."
 FED_cen_2:0 "Armia centralna"
 FED_cen_2_desc:0 "Mazurskie brygady rozwiązane i wcielone do armii."
 FED_cen_3:0 "Warmiński przemysł"
 FED_cen_3_desc:0 "Inwestycje tylko tam, gdzie chce Olsztyn."
 FED_cen_4:0 "Ład warmiński"
 FED_cen_4_desc:0 "Prawo i porządek ponad autonomią."
 FED_cen_5:0 "Polonizacja Mazur"
 FED_cen_5_desc:0 "Mazurska tożsamość znika ze szkół."
 FED_cen_6:0 "Mocarstwo regionu"
 FED_cen_6_desc:0 "Warmia jest silniejsza niż kiedykolwiek."
 FED_cen_7:0 "Warmia ponad wszystko"
 FED_cen_7_desc:0 "Piąte zakończenie: państwo zrodzone z wojny domowej."
 FED_kol_0:0 "Zwycięstwo kolaborantów"
 FED_kol_0_desc:0 "Prorosyjscy kolaboranci przejęli władzę. Moskwa przysyła gratulacje – i doradców."
 FED_kol_1:0 "Rosyjscy doradcy"
 FED_kol_1_desc:0 "W każdym ministerstwie siedzi ktoś z Kaliningradu."
 FED_kol_2:0 "Rubel w obiegu"
 FED_kol_2_desc:0 "Rubel staje się drugą walutą."
 FED_kol_3:0 "Garnizon w Olsztynie"
 FED_kol_3_desc:0 "Rosyjskie wojska pilnują porządku."
 FED_kol_4:0 "Lojalność wobec Kremla"
 FED_kol_4_desc:0 "Republika głosuje w ONZ tak jak Rosja."
 FED_kol_5:0 "Kontrola granic"
 FED_kol_5_desc:0 "Granica z Litwą zamknięta dla „wrogich elementów”."
 FED_kol_6:0 "Rosyjski świat nad jeziorami"
 FED_kol_6_desc:0 "Rosyjska telewizja w każdym domu."
 FED_kol_7:0 "Republika Autonomiczna"
 FED_kol_7_desc:0 "Piąte zakończenie: państwo zależne od zwycięskiej frakcji – i od Moskwy."
