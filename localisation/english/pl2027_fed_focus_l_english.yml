l_english:
 WMZ_dwa_regiony:0 "Dwa regiony, jedna przyszłość"
 WMZ_dwa_regiony_desc:0 "Warmia i Mazury od wieków są wymieniane jednym tchem, ale nigdy nie były jednym krajem. Po rozpadzie Polski powstały tu dwa państwa – i oba wiedzą, że osobno nie przetrwają między Rosją a Zakonem."
 WMZ_administracja_olsztyna:0 "Administracja Olsztyna"
 WMZ_administracja_olsztyna_desc:0 "Olsztyn przejął urzędy wojewódzkie, archiwa i serwery. Teraz musi udowodnić, że potrafi rządzić czymś więcej niż miastem."
 WMZ_tozsamosc:0 "Warmińska tożsamość"
 WMZ_tozsamosc_desc:0 "Warmia przez wieki była osobną krainą – biskupią, katolicką, inną niż protestanckie Mazury. Ta pamięć może stać się fundamentem państwa."
 WMZ_reformy:0 "Reformy gospodarcze"
 WMZ_reformy_desc:0 "Regionalne spółki, specjalna strefa ekonomiczna i ulgi dla firm, które zostały w Olsztynie."
 WMZ_wspolny_parlament:0 "Wspólny parlament"
 WMZ_wspolny_parlament_desc:0 "Sejmik w Olsztynie otwiera drzwi dla posłów z Mazur. Jeśli ma powstać jedno państwo, musi mieć jeden parlament."
 WMZ_uwm:0 "Uniwersytet Warmińsko-Mazurski"
 WMZ_uwm_desc:0 "Kortowo to największy kampus regionu. Naukowcy mogą pracować dla państwa, a studenci – dla armii."
 FED_uwm_tb:0 "Uniwersytet Warmińsko-Mazurski"
 WMZ_lidzbark:0 "Lidzbark – dawna stolica biskupów"
 WMZ_lidzbark_desc:0 "Zamek w Lidzbarku przypomina, że Warmia była kiedyś państwem samym w sobie."
 WMZ_archiwum:0 "Archiwum Warmińskie"
 WMZ_archiwum_desc:0 "Kroniki i akty lokacyjne miast stają się argumentem w każdym sporze o granice."
 WMZ_olsztyn_metropolia:0 "Olsztyn – metropolia regionu"
 WMZ_olsztyn_metropolia_desc:0 "Stolica Warmii przyciąga uchodźców z rozpadającej się Polski. Każdy z nich to nowy pracownik albo żołnierz."
 WMZ_infrastruktura:0 "Odbudowa infrastruktury"
 WMZ_infrastruktura_desc:0 "Drogi S16 i S51 są w fatalnym stanie po zimie i pierwszych starciach."
 WMZ_fabryki_cywilne:0 "Fabryki cywilne"
 WMZ_fabryki_cywilne_desc:0 "Zakłady meblarskie i spożywcze dostają zamówienia od państwa."
 WMZ_koleje:0 "Koleje regionalne"
 WMZ_koleje_desc:0 "Linia Olsztyn–Ełk znów kursuje codziennie."
 WMZ_rolnictwo:0 "Rolnictwo"
 WMZ_rolnictwo_desc:0 "Region zawsze żył z ziemi. Teraz musi się z niej wyżywić."
 WMZ_fabryki_wojskowe:0 "Fabryki wojskowe"
 WMZ_fabryki_wojskowe_desc:0 "Część hal przestawia się na produkcję amunicji i części."
 WMZ_administracja:0 "Sprawna administracja"
 WMZ_administracja_desc:0 "Urzędnicy, którzy wcześniej pracowali dla województwa, teraz pracują dla państwa."
 WMZ_obrona_terytorialna:0 "Obrona terytorialna"
 WMZ_obrona_terytorialna_desc:0 "Ochotnicy z każdej gminy dostają karabiny i przydział."
 WMZ_szkolenie:0 "Szkolenie rezerw"
 WMZ_szkolenie_desc:0 "Rezerwiści wracają na poligon w Orzyszu."
 WMZ_artyleria:0 "Artyleria regionalna"
 WMZ_artyleria_desc:0 "Kilka baterii z magazynów dawnego Wojska Polskiego."
 FED_art_tb:0 "Artyleria regionalna"
 WMZ_fortyfikacje:0 "Fortyfikacje granicy z obwodem"
 WMZ_fortyfikacje_desc:0 "Rowy przeciwczołgowe i zapory na granicy z Obwodem Królewieckim."
 WMZ_zmotoryzowanie:0 "Zmotoryzowanie armii"
 WMZ_zmotoryzowanie_desc:0 "Ciężarówki i pikapy dla brygad."
 WMZ_sztab:0 "Sztab regionalny"
 WMZ_sztab_desc:0 "Pierwsze pełne brygady z artylerią i saperami."
 WMZ_rozmowy:0 "Rozmowy z Mazurami"
 WMZ_rozmowy_desc:0 "Delegacje spotykają się w Mrągowie, w połowie drogi. Wszyscy mówią o jedności, nikt nie chce oddać władzy."
 WMZ_waluta:0 "Wspólna waluta"
 WMZ_waluta_desc:0 "Złoty warmińsko-mazurski zamiast sześciu walut w obiegu."
 WMZ_rynek:0 "Wspólny rynek"
 WMZ_rynek_desc:0 "Zniesienie ceł między Warmią a Mazurami."
 WMZ_komisja:0 "Komisja zjednoczeniowa"
 WMZ_komisja_desc:0 "Prawnicy z obu stron piszą projekt konstytucji federalnej."
 WMZ_obchody:0 "Wspólne obchody"
 WMZ_obchody_desc:0 "Dzień Warmii i Mazur obchodzony razem w Olsztynie i Giżycku."
 WMZ_kongres:0 "Kongres Olsztyński"
 WMZ_kongres_desc:0 "Delegaci Warmii i Mazur zbierają się w Olsztynie. Na stole leżą trzy drogi do jednego państwa: porozumienie, siła albo pomoc Moskwy."
 WMZ_pokojowa:0 "Pokojowa federacja"
 WMZ_pokojowa_desc:0 "Propozycja federacji z zachowaniem autonomii obu regionów trafia do władz Związku Mazurskiego. Potrzeba ich zgody."
 WMZ_militarne:0 "Zjednoczenie militarne"
 WMZ_militarne_desc:0 "Jeżeli związku nie chce się zjednoczyć, zostanie do tego zmuszona."
 WMZ_patronat:0 "Zjednoczenie pod patronatem rosyjskim"
 WMZ_patronat_desc:0 "Moskwa obiecuje zjednoczenie regionu i koniec walk – w zamian za lojalność. Powstanie Warmińsko-Mazurska Republika Autonomiczna."
 WMZ_zjednoczenie_dokonane:0 "Zjednoczenie dokonane"
 WMZ_zjednoczenie_dokonane_desc:0 "Warmia i Mazury są jednym państwem. Teraz trzeba sprawić, by w nim zostały."
 MAZ_dwa_regiony:0 "Dwa regiony, jedna przyszłość"
 MAZ_dwa_regiony_desc:0 "Warmia i Mazury od wieków są wymieniane jednym tchem, ale nigdy nie były jednym krajem. Po rozpadzie Polski powstały tu dwa państwa – i oba wiedzą, że osobno nie przetrwają między Rosją a Zakonem."
 MAZ_autonomia:0 "Mazurska autonomia"
 MAZ_autonomia_desc:0 "Mazury nigdy nie chciały, by rządzono nimi z Olsztyna – ani z Warszawy. Związek Mazurski ma to zagwarantować."
 MAZ_odbudowa_przemyslu:0 "Odbudowa przemysłu"
 MAZ_odbudowa_przemyslu_desc:0 "Zakłady w Ełku, Giżycku i Piszu znów pracują – na razie na pół gwizdka."
 MAZ_rozbudowa_wojska:0 "Rozbudowa wojska"
 MAZ_rozbudowa_wojska_desc:0 "Mazurska obrona terytorialna zna każdy las i każde jezioro. Potrzebuje tylko broni."
 MAZ_wspolna_armia:0 "Wspólna armia"
 MAZ_wspolna_armia_desc:0 "Mazurscy oficerowie proponują Olsztynowi jeden sztab i jedną armię – pod warunkiem, że Mazury zachowają swoje brygady."
 MAZ_wielkie_jeziora:0 "Kraina Wielkich Jezior"
 MAZ_wielkie_jeziora_desc:0 "Turyści z Litwy i Niemiec wciąż przyjeżdżają na żagle. Ich euro utrzymuje połowę gospodarki."
 MAZ_boyen:0 "Twierdza Boyen"
 MAZ_boyen_desc:0 "Pruskie forty w Giżycku znów mają garnizon."
 MAZ_tozsamosc_maz:0 "Mazurska tożsamość"
 MAZ_tozsamosc_maz_desc:0 "Mazurzy – ani Niemcy, ani do końca Polacy z Warszawy. Ich historia staje się państwową tradycją."
 MAZ_zegluga:0 "Żegluga mazurska"
 MAZ_zegluga_desc:0 "Kanały i jeziora to drogi, których nie zniszczy żadna zima."
 MAZ_infrastruktura:0 "Odbudowa infrastruktury"
 MAZ_infrastruktura_desc:0 "Drogi S16 i S51 są w fatalnym stanie po zimie i pierwszych starciach."
