 fed.10.t:0 "Propozycja federacji"
 fed.10.d:0 "[From.GetName] proponuje utworzenie wspólnego państwa – Zjednoczonych Stanów Warmińsko-Mazurskich – z zachowaniem autonomii obu regionów. Zgoda oznacza koniec naszej osobnej państwowości, ale też koniec samotności między Rosją a Zakonem."
 fed.10.a:0 "Zgadzamy się na federację."
 fed.10.b:0 "Nie oddamy niepodległości."
 fed.11.t:0 "Powstaje federacja Warmii i Mazur"
 fed.11.d:0 "Warmia i Mazury zjednoczyły się w jedno państwo. Nowa federacja ma stolicę w Olsztynie i musi pogodzić dwa regiony, które przez wieki żyły osobno."
 fed.11.a:0 "Dwa regiony, jedna przyszłość."
 fed.12.t:0 "Federacja odrzucona"
 fed.12.d:0 "[From.GetName] odrzuca naszą propozycję. Możemy poczekać i spróbować ponownie – albo uznać, że rozmowy się skończyły."
 fed.12.a:0 "Spróbujemy ponownie za dwa miesiące."
 fed.12.b:0 "Zmusimy ich do zjednoczenia."
 fed.20.t:0 "Ultimatum federacji"
 fed.20.d:0 "[From.GetName] żąda podporządkowania. Możemy się zgodzić, wynegocjować autonomię albo odmówić – co oznacza wojnę."
 fed.20.a:0 "Przyjmujemy warunki."
 fed.20.b:0 "Negocjujemy autonomię."
 fed.20.c:0 "Odmawiamy!"
 fed.21.t:0 "Ultimatum odrzucone"
 fed.21.d:0 "[From.GetName] odrzuca nasze żądania."
 fed.21.a:0 "Do broni!"
 fed.21.b:0 "Jeszcze nie teraz."
 fed.22.t:0 "Ultimatum przyjęte"
 fed.22.d:0 "[From.GetName] przyjmuje zwierzchnictwo federacji."
 fed.22.a:0 "Federacja rośnie."
 fed.30.t:0 "Propozycja paktu"
 fed.30.d:0 "[From.GetName] proponuje porozumienie o współpracy gospodarczej i obronnej nad Bałtykiem."
 fed.30.a:0 "Podpisujemy pakt."
 fed.30.b:0 "Nie jesteśmy zainteresowani."
 fed.31.t:0 "Pakt podpisany"
 fed.31.d:0 "[From.GetName] podpisuje pakt z federacją."
 fed.31.a:0 "Bałtyk się jednoczy."
 fed.32.t:0 "Pakt odrzucony"
 fed.32.d:0 "[From.GetName] odrzuca naszą propozycję."
 fed.32.a:0 "Trudno."
 fed.35.t:0 "Federacja Bałtycka"
 fed.35.d:0 "[From.GetName] proponuje połączenie sygnatariuszy paktów w jedno państwo – Federację Bałtycką."
 fed.35.a:0 "Łączymy się w jedno państwo."
 fed.35.b:0 "Zostańmy sojusznikami, nie jednym krajem."
 fed.36.t:0 "Zaproszenie do Unii Bałtyckiej"
 fed.36.d:0 "[From.GetName] zaprasza Litwę do sojuszu państw nadbałtyckich."
 fed.36.a:0 "Przystępujemy."
 fed.36.b:0 "Nie teraz."
 fed.40.t:0 "Sojusz z Olsztynem"
 fed.40.d:0 "[From.GetName] proponuje wspólny blok obronny przeciw Rosji."
 fed.40.a:0 "Razem przeciw Rosji."
 fed.40.b:0 "Poradzimy sobie sami."
 fed.50.t:0 "Protesty – Warmii"
 fed.50.d:0 "Niezadowolenie Warmii przekroczyło połowę. Na ulicach stoją tysiące ludzi, którzy uważają, że federacja faworyzuje mieszkańców Mazur."
 fed.50.a:0 "Musimy ich wysłuchać."
 fed.51.t:0 "Radykalizacja – Warmii"
 fed.51.d:0 "Radykałowie z Warmii tworzą własne straże i mówią otwarcie o secesji."
 fed.51.a:0 "To robi się niebezpieczne."
 fed.52.t:0 "Kryzys secesyjny – Warmii"
 fed.52.d:0 "Niezadowolenie Warmii sięgnęło 75%. Przywódcy regionu dają rządowi federalnemu 30 dni na negocjacje. Jeśli się nie uda – wybuchnie wojna domowa."
 fed.52.a:0 "Rozpoczynamy negocjacje."
 fed.55.t:0 "Protesty – Mazur"
 fed.55.d:0 "Niezadowolenie Mazur przekroczyło połowę. Na ulicach stoją tysiące ludzi, którzy uważają, że federacja faworyzuje mieszkańców Warmii."
 fed.55.a:0 "Musimy ich wysłuchać."
 fed.56.t:0 "Radykalizacja – Mazur"
 fed.56.d:0 "Radykałowie z Mazur tworzą własne straże i mówią otwarcie o secesji."
 fed.56.a:0 "To robi się niebezpieczne."
 fed.57.t:0 "Kryzys secesyjny – Mazur"
 fed.57.d:0 "Niezadowolenie Mazur sięgnęło 75%. Przywódcy regionu dają rządowi federalnemu 30 dni na negocjacje. Jeśli się nie uda – wybuchnie wojna domowa."
 fed.57.a:0 "Rozpoczynamy negocjacje."
 fed.54.t:0 "Wojna domowa w federacji"
 fed.54.d:0 "Negocjacje się nie powiodły. Część brygad odmówiła wykonywania rozkazów rządu federalnego i ogłosiła własne państwo. Federaliści muszą obronić wspólny kraj."
 fed.54.a:0 "Za federację!"
 fed.59.t:0 "Nowe państwo"
 fed.59.d:0 "Ogłosiliśmy niezależność od rządu federalnego. Wygrać możemy tylko wtedy, gdy zrobimy to szybko."
 fed.59.a:0 "Do zwycięstwa!"
 fed.60.t:0 "Chaos w federacji"
 fed.60.d:0 "Federacja Warmii i Mazur pogrąża się w wojnie domowej. Kapituła pyta, czy to nie jest chwila, by Zakon upomniał się o Warmię."
 fed.60.a:0 "Zakon uderza!"
 fed.60.b:0 "Poczekamy na rozwój wydarzeń."
 fed.61.t:0 "Wojna domowa na Warmii i Mazurach"
 fed.61.d:0 "W federacji Warmii i Mazur wybuchła wojna domowa. Moskwa może wesprzeć jedną ze stron – albo trzymać się z daleka."
 fed.61.a:0 "Wspieramy buntowników."
 fed.61.b:0 "Wspieramy rząd federalny."
 fed.61.c:0 "Trzymamy się z daleka."
 fed.70.t:0 "Federacja przetrwała"
 fed.70.d:0 "Buntownicy złożyli broń. Federacja przetrwała wojnę domową – osłabiona, ale jedna."
 fed.70.a:0 "Nigdy więcej."
 fed.71.t:0 "Wolne Mazury"
 fed.71.d:0 "Separatyści mazurscy wygrali wojnę domową. Mazury są niepodległe."
 fed.71.a:0 "Nowy początek."
 fed.72.t:0 "Państwo Warmińskie"
 fed.72.d:0 "Warmińscy centraliści wygrali wojnę domową. Olsztyn rządzi bez ograniczeń."
 fed.72.a:0 "Nowy początek."
 fed.73.t:0 "Republika Autonomiczna"
 fed.73.d:0 "Prorosyjscy kolaboranci wygrali wojnę domową. Region staje się zależny od Moskwy."
 fed.73.a:0 "Nowy początek."
 fed.80.t:0 "Zjednoczone Stany Warmińsko-Mazurskie"
 fed.80.d:0 "Konstytucja federalna weszła w życie. Warmia i Mazury są demokratyczną federacją – pierwszym stabilnym państwem powstałym z rozpadu Polski."
 fed.80.a:0 "Gratulacje dla Olsztyna."
 fed.81.t:0 "Wielka Federacja Warmii i Mazur"
 fed.81.d:0 "Federacja Warmii i Mazur podporządkowała sąsiadów od Lubawy po Suwałki. Na północy dawnej Polski wyrosło nowe regionalne mocarstwo."
 fed.81.a:0 "Kto ją zatrzyma?"
 fed.82.t:0 "Parlament Bałtycki"
 fed.82.d:0 "Państwa nadbałtyckie powołały wspólny parlament. Od Gdyni po Ełk region mówi jednym głosem."
 fed.82.a:0 "Bałtyk się jednoczy."
 FED_rownowaga_kat:0 "Równowaga federacji"
 FED_rownowaga_kat_desc:0 "Niezadowolenie Warmii: §Y[?FED_niez_w|0]%§!\nNiezadowolenie Mazur: §Y[?FED_niez_m|0]%§!\nPostęp zjednoczenia: §G[?FED_postep|0]%§!\n\nPrzy 50% wybuchają protesty, przy 65% zaczyna się radykalizacja, a przy 75% kryzys secesyjny – po 30 dniach bez porozumienia wybucha wojna domowa. Przy 100% postępu można uchwalić konstytucję federalną."
 FED_dec_warmia:0 "Wspierać Warmię"
 FED_dec_warmia_desc:0 "Inwestycje i stanowiska dla Warmiaków. Mazury będą niezadowolone."
 FED_dec_mazury:0 "Wspierać Mazury"
 FED_dec_mazury_desc:0 "Inwestycje i stanowiska dla Mazurów. Warmia będzie niezadowolona."
 FED_dec_pojednanie:0 "Kongres pojednania"
 FED_dec_pojednanie_desc:0 "Zjazd przedstawicieli obu regionów w Mrągowie."
 FED_dec_centralizacja:0 "Centralizacja władzy"
 FED_dec_centralizacja_desc:0 "Olsztyn przejmuje kolejne kompetencje. Zjednoczenie przyspiesza, niezadowolenie rośnie."
 FED_dec_negocjacje_w:0 "Negocjacje z separatystami Warmii"
 FED_dec_negocjacje_w_desc:0 "Ostatnia szansa, by uniknąć wojny domowej: ustępstwa wobec Warmii."
 FED_dec_negocjacje_m:0 "Negocjacje z separatystami Mazur"
 FED_dec_negocjacje_m_desc:0 "Ostatnia szansa, by uniknąć wojny domowej: ustępstwa wobec Mazur."
