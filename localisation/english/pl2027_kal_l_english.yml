l_english:
 KAL_przejecie_administracji:0 "Przejęta administracja"
 KAL_przejecie_administracji_desc:0 "Urzędnicy, którzy wczoraj czekali na okólniki z Warszawy, dziś piszą je sami. Nikt nie wie jeszcze, czy to awans, czy dezercja."
 KAL_straz_regionalna:0 "Regionalna straż bezpieczeństwa"
 KAL_straz_regionalna_desc:0 "Policjanci, strażacy i rezerwiści w jednej formacji z nową opaską na ramieniu. Opaski szyto w nocy."
 KAL_myto_wislane:0 "Myto wiślane"
 KAL_myto_wislane_desc:0 "Każdy most i każda śluza ma dziś swojego poborcę. Towar płynie wolniej niż rzeka."
 KAL_oplaty_mostowe:0 "Opłaty mostowe"
 KAL_oplaty_mostowe_desc:0 "Mosty są nasze, więc i opłaty są nasze. Sąsiedzi płacą, klną i płacą dalej."
 KAL_kanal_bydgoski:0 "Kanał jako alternatywa"
 KAL_kanal_bydgoski_desc:0 "Stare śluzy Kanału Bydgoskiego znów pracują pełną parą. Barki omijające wiślane myto płacą za to wdzięcznością – i gotówką."
 KAL_archiwa_wojewodzkie:0 "Archiwa urzędu wojewódzkiego"
 KAL_archiwa_wojewodzkie_desc:0 "Teczki, rejestry i pieczęcie przeniesione nocą do piwnic ratusza. Kto ma archiwum, ten ma ciągłość państwa."
 KAL_przewoznik_regionalny:0 "Regionalny przewoźnik"
 KAL_przewoznik_regionalny_desc:0 "Lokalne spółki przejęły składy, rozkłady i konduktorów. Pociąg spóźnia się, ale przynajmniej jedzie."
 KAL_kolejowy_paraliz:0 "Kolejowy paraliż"
 KAL_kolejowy_paraliz_desc:0 "Na peronach stoją puste wagony, a na drogach ciężarówki w trzykilometrowych korkach."
 KAL_blackout:0 "Wielki blackout"
 KAL_blackout_desc:0 "Hale stoją w ciemności, piekarnie pieką na agregatach, a radio na baterie stało się najcenniejszym sprzętem w domu."
 KAL_blackout_wspolpraca:0 "Wspólna sieć awaryjna"
 KAL_blackout_wspolpraca_desc:0 "Sąsiednie republiki dzielą się prądem według tabelki spisanej długopisem na kolanie. Tabelka działa lepiej niż ministerstwo."
 KAL_eksport_pradu:0 "Eksport prądu"
 KAL_eksport_pradu_desc:0 "Nasze elektrownie dymią jak nigdy, a sąsiedzi płacą za każdą megawatogodzinę – w złotówkach, paliwie i przysługach."
 KAL_garnizony_neutralne:0 "Neutralne garnizony"
 KAL_garnizony_neutralne_desc:0 "Oficerowie zamknęli bramy koszar i czekają, aż ktoś przedstawi im rozkaz z prawdziwą pieczęcią."
 KAL_uchodzcy_pomoc:0 "Pomoc uciekinierom ze stolicy"
 KAL_uchodzcy_pomoc_desc:0 "Szkoły i hale sportowe zamieniły się w noclegownie. Warszawiacy przywieźli ze sobą walizki, dyplomy i przekonanie, że wszystko wiedzą lepiej."
 KAL_robotnicy_z_warszawy:0 "Robotnicy ze stolicy"
 KAL_robotnicy_z_warszawy_desc:0 "Inżynierowie, spawacze i księgowi z Warszawy pracują za połowę stawki i bez narzekania. Na razie."
 KAL_pusta_stolica:0 "Pustoszejąca stolica"
 KAL_pusta_stolica_desc:0 "Całe osiedla stoją ciemne. Zostali ci, którzy nie mieli dokąd iść – i ci, którzy nie zamierzają nikomu oddać miasta."
 KAL_konfederacja:0 "Duch konfederacji"
 KAL_konfederacja_desc:0 "Delegaci wrócili z Kongresu z projektem wspólnych instytucji i bez pewności, czy ktokolwiek je powoła."
 KAL_wlasna_waluta:0 "Własna waluta"
 KAL_wlasna_waluta_desc:0 "Banknoty drukowane w miejscowej drukarni mają krzywe marginesy i pewną siebie nazwę. Rynek przyjmuje je z ociąganiem."
 KAL_zloty_bez_banku:0 "Złoty bez banku centralnego"
 KAL_zloty_bez_banku_desc:0 "Wszyscy wciąż liczą w złotych, choć nikt nie wie, kto je teraz emituje. Inflacja nie czeka na odpowiedź."
 KAL_bony:0 "Bony i kontrakty"
 KAL_bony_desc:0 "Pensje wypłacane są w bonach na węgiel, mąkę i paliwo. Gospodarka wróciła do epoki, którą znali tylko dziadkowie."
 KAL_odbudowa:0 "Projekt odbudowy Polski"
 KAL_odbudowa_desc:0 "Na biurkach leżą mapy całego kraju, a nie tylko naszego skrawka. Ambicja jest wielka, środki – jak zwykle – skromne."
 kal.1.t:0 "Ostatnie posiedzenie polskiego rządu"
 kal.1.d:0 "Zapis z ostatniego posiedzenia Rady Ministrów wyciekł do sieci w nocy: dwadzieścia minut kłótni o kworum, potem cisza i trzask zamykanych drzwi. Od tamtej chwili żaden resort nie wydał ani jednego rozporządzenia, a infolinie ministerstw odsyłają do nagranej wiadomości sprzed tygodnia. Starostowie, prezydenci miast i komendanci powiatowi zrozumieli to po swojemu: skoro nikt nie rządzi, rządzić muszą oni. W ratuszach od Bałtyku po Tatry trwa ciche przejmowanie pieczątek, magazynów i list płac."
 kal.1.a:0 "Przejmujemy administrację – ktoś musi podpisywać."
 kal.1.b:0 "Budujemy własne struktury bezpieczeństwa."
 kal.1.c:0 "Czekamy na komunikat z Warszawy."
 kal.8.t:0 "Kryzys na Wiśle"
 kal.8.d:0 "Na moście w Toruniu stoi budka z napisem „OPŁATA TRANZYTOWA”, a pod Włocławkiem śluza otwiera się tylko dla tych, którzy zapłacą z góry. W ciągu trzech dni każda gmina nad Wisłą odkryła, że rzeka to najlepszy interes od czasów krzyżackich. Barki ze żwirem, zbożem i paliwem stoją na kotwicy, a armatorzy wyliczają straty w milionach. Handel wzdłuż królowej polskich rzek zamienia się w wojnę cenników."
 kal.8.a:0 "Płacimy myto i zaciskamy zęby."
 kal.8.b:0 "Szukamy dróg lądowych, choćby drożej."
 kal.8.c:0 "Toruń: nasze mosty, nasze opłaty."
 kal.8.e:0 "Bydgoszcz: otwieramy Kanał Bydgoski dla wszystkich."
 kal.8.f:0 "Włocławek: zapora dyktuje warunki."
 kal.8.g:0 "Kociewie: skoro rzeka stoi, niech jadą pociągi."
 kal.2.t:0 "Ostatni wojewodowie składają urzędy"
 kal.2.d:0 "Szesnaście gabinetów, szesnaście identycznych pism: „W związku z brakiem kontaktu z organem nadrzędnym składam rezygnację”. Ostatni wojewoda zrobił to podobno w kurtce, z kartonem dokumentów pod pachą, nie gasząc światła w urzędzie. Epoka autonomicznych regionów, która trwała zaledwie kilka tygodni, właśnie się skończyła. Na jej gruzach rodzą się republiki, księstwa i rady, które nie zamierzają już nikogo pytać o zgodę."
 kal.2.a:0 "Ogłaszamy pełną niepodległość republiki."
 kal.2.b:0 "Nasze władze pozostają tymczasowe – do odwołania."
 kal.2.c:0 "Zabezpieczamy archiwa urzędu wojewódzkiego."
 kal.5.t:0 "Kryzys polskiej kolei"
 kal.5.d:0 "O szóstej rano centrala przewoźnika rozesłała krótki komunikat: „Do odwołania wstrzymuje się kursowanie wszystkich pociągów”. Maszyniści zostali w lokomotywowniach, a w Starogardzie, Tczewie i Bydgoszczy kolejarze sami zaczęli spisywać inwentarz – co do ostatniej drezyny. Regionalni przewoźnicy rzucili się na trasy jak na spadek po bogatym wuju. Na Kociewiu mówi się już otwarcie o Polskim Holdingu Kolejowym – państwie, którego krwiobiegiem będą tory."
 kal.5.a:0 "Regionalny przewoźnik przejmuje nasze trasy."
 kal.5.b:0 "Zamykamy dworce i ratujemy, co się da."
 kal.5.c:0 "Kociewie: drogę dla Polskiego Holdingu Kolejowego!"
 kal.5.e:0 "Wynajmujemy składy od kolejarzy z Kociewia."
 kal.3.t:0 "Wielki blackout"
 kal.3.d:0 "O 17:42, w najciemniejszym tygodniu roku, krajowa sieć przesyłowa rozpadła się jak domek z kart. Dyspozytornia, która dotąd równoważyła cały kraj, przestała odbierać telefony od regionów, a regiony przestały oddawać nadwyżki komukolwiek. Fabryki stanęły, szpitale przeszły na agregaty, a mieszkańcy bloków po raz pierwszy od pokolenia gotowali na grillach na balkonach. Kto ma elektrownię, ma dziś władzę – dosłownie."
 kal.3.a:0 "Tworzymy wspólną sieć awaryjną z sąsiadami."
 kal.3.b:0 "Przejmujemy lokalną elektrownię – za wszelką cenę."
 kal.3.c:0 "Czekamy, aż ktoś naprawi sieć."
 kal.3.e:0 "Nasze elektrownie pracują – sprzedajemy prąd."
 kal.4.t:0 "Armia odmawia rozkazu"
 kal.4.d:0 "Rozkaz był krótki i opatrzony podpisem, którego nikt nie potrafił zweryfikować: wszystkie jednostki mają wrócić do koszar i czekać na dalsze dyspozycje centrum. Część dowódców zasalutowała w stronę Warszawy, część w stronę najbliższego ratusza, a kilku zamknęło się w sztabach z magazynem amunicji i zestawem kart do brydża. Garnizony dzielą się jak spadek – czołg dla miasta, ciężarówki dla powiatu, sztandar dla tego, kto pierwszy podjedzie. Wojsko, które miało trzymać kraj w całości, stało się jego najcenniejszym łupem."
 kal.4.a:0 "Garnizon przysięga wierność republice."
 kal.4.b:0 "Oficerowie pozostają neutralni."
 kal.4.c:0 "Kupujemy lojalność dowódców."
 kal.4.e:0 "Jesteśmy ostatnią armią Rzeczypospolitej."
 kal.6.t:0 "Wielka ucieczka z Warszawy"
 kal.6.d:0 "Wylotówki ze stolicy zamieniły się w parking długi na sto kilometrów. Po zimie bez prądu, z barykadami między dzielnicami i strzelaniną przy moście, tysiące warszawiaków spakowało do aut to, co zmieściło się w bagażniku. Na rogatkach sąsiednich republik czekają rodziny z dziećmi, informatycy z laptopami i emeryci z kotami w transporterach. Każda władza musi odpowiedzieć na pytanie, czy to kryzys, czy okazja."
 kal.6.a:0 "Otwieramy szkoły i hale – pomagamy."
 kal.6.b:0 "Zamykamy granice."
 kal.6.c:0 "Przyjmujemy tylko tych, którzy przyjdą do pracy."
 kal.6.e:0 "Zostajemy. To wciąż nasze miasto."
 kal.9.t:0 "Pierwszy Kongres Odbudowy Polski"
 kal.9.d:0 "W auli prowincjonalnego uniwersytetu zebrały się delegacje kilkudziesięciu państw, które jeszcze rok temu były powiatami. Obrady otworzono hymnem, którego połowa sali nie odśpiewała do końca, bo nie było zgody, czy ostatnią zwrotkę zaśpiewać z „Rzeczpospolitą”, czy z „Konfederacją”. Projekt wspólnej organizacji politycznej ma trzy wersje, pięć załączników i żadnej większości. Każda delegacja musi wreszcie powiedzieć, czego naprawdę chce."
 kal.9.a:0 "Uznajemy wspólny rząd centralny."
 kal.9.b:0 "Konfederacja równych państw."
 kal.9.c:0 "Nasza suwerenność nie podlega negocjacjom."
 kal.7.t:0 "Upadek wspólnej waluty"
 kal.7.d:0 "Bankomaty w całym kraju wyświetlają ten sam komunikat: „Usługa chwilowo niedostępna”. Lokalne banki spółdzielcze przestały rozliczać przelewy z innymi regionami, bo nie wiadomo już, czyja gwarancja stoi za złotówką. Na targowiskach ceny podaje się w złotych, euro, litrach paliwa i workach cementu – czasem wszystkich naraz. Każda republika musi zdecydować, czym zapłaci swoim żołnierzom w przyszłym miesiącu."
 kal.7.a:0 "Drukujemy własną walutę."
 kal.7.b:0 "Zostajemy przy złotym – póki ktoś go przyjmuje."
 kal.7.c:0 "Bony, kontrakty i wymiana barterowa."
 kal.7.e:0 "Płacimy kuponami na pizzę."
 kal.10.t:0 "Czy Polska powróci?"
 kal.10.d:0 "Drugie Święto Niepodległości bez Polski wypadło w deszczu. Na rynkach kilkunastu miast odczytano jednocześnie kilkanaście różnych deklaracji zjednoczenia – każda z innym godłem, inną stolicą i innym przywódcą narodu. Telewizje regionalne transmitowały je po kolei, jak losowanie grup na mundialu. Jedno jest pewne: Polska powróci, ale każdy chce, by wróciła właśnie do niego."
 kal.10.a:0 "Ogłaszamy własny projekt odbudowy Polski."
 kal.10.b:0 "Wierni postanowieniom Kongresu."
 kal.10.c:0 "Popieramy silniejszych – byle był porządek."
 kal.10.e:0 "Polska to my – i tylko my."
