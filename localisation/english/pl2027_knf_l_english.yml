l_english:
 KNF_tree:0 "Skonfederowana Polska"
 KNF_FRONT:0 "Front Konfederacji i Korony"
 KNF_ZN:0 "Zjednoczenie Narodowe"
 KNF_ruch:0 "Ruch, nie partia"
 KNF_ruch_desc:0 "Konfederacja nie ma struktur państwa – ma tysiące ludzi, którzy przyszli na wiec i zostali. Entuzjazm zastępuje urzędników."
 KNF_wolny_rynek:0 "Polska bez pośredników"
 KNF_wolny_rynek_desc:0 "Niskie podatki, mało przepisów i zero koncesji. Kto chce budować – buduje."
 KNF_wolny_rynek2:0 "Kapitał wraca do Polski"
 KNF_wolny_rynek2_desc:0 "Firmy, które uciekły przed chaosem, wracają na północne Mazowsze. Ciechanów ma najniższe podatki od Bałtyku po Tatry."
 KNF_straz:0 "Straż Narodowa"
 KNF_straz_desc:0 "Ochotnicy z każdej gminy: myśliwi, strzelcy sportowi i rezerwiści. Mało musztry, dużo motywacji."
 KNF_gwardia:0 "Gwardia Konfederacji"
 KNF_gwardia_desc:0 "Najlepsi ze Straży Narodowej tworzą Gwardię. Mają mundury, radiostacje i oficerów z doświadczeniem."
 KNF_front_prawicy:0 "Wspólny front prawicy"
 KNF_front_prawicy_desc:0 "Ciechanów i Siedlce mają wspólny sztab i wspólną listę wrogów. Kto rządzi frontem – o tym porozmawiamy po wojnie."
 KNF_sztab_zn:0 "Wspólny sztab Zjednoczenia"
 KNF_sztab_zn_desc:0 "Oficerowie Wojska planują operacje razem z dowódcami Straży Narodowej. Pałac daje legitymację, Ciechanów – ludzi."
 KNF_stolik:0 "Wywrócony stolik"
 KNF_stolik_desc:0 "Żadnych koalicji, żadnych kompromisów, żadnego „starego układu”. Konfederacja bierze odpowiedzialność sama – i sama zbiera owoce."
 KNF_pelnia:0 "Pełnia władzy"
 KNF_pelnia_desc:0 "Rząd Konfederacji kontroluje wojsko, skarb i media. Opozycja ma prawo głosu – w granicach rozsądku, które wyznacza rząd."
 KNF_konstytucja:0 "Konstytucja Wolnościowa"
 KNF_konstytucja_desc:0 "Krótka konstytucja: własność, wolność słowa, niskie podatki i silna armia. Reszta – według uznania gmin."
 knf.1.t:0 "Propozycja z Ciechanowa"
 knf.1.d:0 "[From.GetName] proponuje wspólny front: Ciechanów i Siedlce mają walczyć razem o odbudowę Polski, a spory o to, kto będzie nią rządził, odłożyć na później. Sławomir Mentzen zapewnia, że „Korona ma w tym froncie swoje honorowe miejsce”."
 knf.1.a:0 "Przyjmujemy. Razem zbudujemy imperium."
 knf.1.b:0 "Korona nie potrzebuje partnerów."
 knf.2.t:0 "Front z Koroną"
 knf.2.d:0 "[From.GetName] przyjmuje naszą propozycję. Od dziś Konfederacja i Korona walczą razem."
 knf.2.a:0 "Do dzieła."
 knf.3.t:0 "Korona odmawia"
 knf.3.d:0 "[From.GetName] odrzuca naszą propozycję. Będziemy musieli budować imperium sami."
 knf.3.a:0 "Ich strata."
 knf.4.t:0 "List z Ciechanowa"
 knf.4.d:0 "[From.GetName] proponuje sojusz: Zjednoczenie Narodowe – Kancelaria Prezydenta, Wojsko i Konfederacja w jednym froncie. Ciechanów oferuje tysiące ochotników Straży Narodowej i obiecuje uznać zwierzchnictwo Prezydenta nad siłami zbrojnymi."
 knf.4.a:0 "Zjednoczenie Narodowe staje się faktem."
 knf.4.b:0 "Pałac nie zawiera sojuszy z partiami."
 knf.5.t:0 "Zjednoczenie Narodowe"
 knf.5.d:0 "[From.GetName] przyjmuje propozycję. Kancelaria Prezydenta, Wojsko i Konfederacja tworzą Zjednoczenie Narodowe."
 knf.5.a:0 "Za Polskę."
 knf.6.t:0 "Pałac odmawia"
 knf.6.d:0 "[From.GetName] odrzuca sojusz. Zjednoczenie Narodowe trzeba będzie zbudować inaczej."
 knf.6.a:0 "Trudno."
 knf.7.t:0 "Wojsko i Konfederacja"
 knf.7.d:0 "[From.GetName] prosi o broń z magazynów wojskowych dla Straży Narodowej. W zamian ochotnicy z północnego Mazowsza wzmocnią garnizony Wojska."
 knf.7.a:0 "Dać broń – walczymy po tej samej stronie."
 knf.7.b:0 "Magazyny zostają zamknięte."
 knf.8.t:0 "Ultimatum Konfederacji"
 knf.8.d:0 "[From.GetName] żąda, byśmy podporządkowali się rządowi w Ciechanowie. „Wywracamy stolik” – piszą. – „Albo jesteście z nami, albo jesteście częścią starego układu”."
 knf.8.a:0 "Podporządkować się."
 knf.8.b:0 "Nie oddamy wolności."
 knf.9.t:0 "Jedno państwo?"
 knf.9.d:0 "[From.GetName] proponuje, by Korona weszła w skład Skonfederowanej Polski: wspólny rząd, wspólna armia, wspólny sztandar. Odmowa oznacza koniec frontu."
 knf.9.a:0 "Zgadzamy się. Jedna Polska."
 knf.9.b:0 "Korona nie da się wchłonąć."
 KNF_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: front z Koroną, Zjednoczenie Narodowe albo samodzielną walkę o pełnię władzy."
 KNF_tt_a:0 "Korona Polska otrzyma propozycję wspólnego frontu."
 KNF_tt_unia:0 "Korona otrzyma propozycję wejścia do wspólnego państwa. Odmowa oznacza §Rwojnę§!."
 KNF_tt_b:0 "Kancelaria Prezydenta otrzyma propozycję sojuszu „Zjednoczenie Narodowe”."
 KNF_tt_stolica:0 "Kontrolujemy Warszawę (Śródmieście) albo co najmniej §Y150§! stanów"
