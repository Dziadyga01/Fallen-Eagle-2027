l_english:
 KOR_rafineria_stoi:0 "Rafineria nie może stanąć"
 KOR_rafineria_stoi_desc:0 "Kraj się rozpadł, ale kolumny destylacyjne nie mają przycisku „pauza”. Zarząd Koncernu ogłasza stan ciągłości produkcji – pierwszy dekret nowej władzy w Płocku."
 KOR_straz_przemyslowa:0 "Straż Przemysłowa na ulicach"
 KOR_straz_przemyslowa_desc:0 "Ochrona zakładów dostaje radiowozy, plan miasta i nowy regulamin. Patrol zaczyna się od kontroli gaśnic, a kończy na kontroli porządku publicznego."
 KOR_outsourcing_miasta:0 "Outsourcing administracji"
 KOR_outsourcing_miasta_desc:0 "Ratusz podpisuje z Koncernem umowę na „kompleksową obsługę funkcji publicznych”. Wydział komunikacji przenosi się do biurowca przy rafinerii."
 KOR_rada_nadzorcza:0 "Rada Nadzorcza przejmuje stery"
 KOR_rada_nadzorcza_desc:0 "Rada Nadzorcza ogłasza, że będzie pełnić funkcje rządu „do czasu wyjaśnienia sytuacji rynkowej”. Analitycy zaczynają wyceniać państwo jak spółkę."
 KOR_korporacyjna_polska:0 "Korporacyjna Polska"
 KOR_korporacyjna_polska_desc:0 "Statut spółki staje się konstytucją, a Prezes Zarządu – głową państwa. Księstwo Płockie przyjmuje nazwę Korporacyjnej Polski i ogłasza, że rozbitą Rzeczpospolitą trzeba zarządzać jak koncernem: z budżetem, planem i wynikiem na koniec kwartału."
 KOR_pelna_moc:0 "Rafineria na pełnej mocy"
 KOR_pelna_moc_desc:0 "Wszystkie instalacje wracają do pracy. Brakuje tylko ropy – i tu zaczyna się prawdziwa polityka."
 KOR_zbiorniki:0 "Strategiczne zbiorniki"
 KOR_zbiorniki_desc:0 "Bazy paliw pod Płockiem zostają rozbudowane i ogrodzone podwójnie. Państwo bez ropy jest państwem tylko na papierze."
 KOR_rurociag_pomorski:0 "Rurociąg Pomorski"
 KOR_rurociag_pomorski_desc:0 "Rurą z Gdańska znów płynie ropa. Zawór jest w Płocku, ale drugi koniec – w mieście, które ma własne ambicje."
 KOR_odwierty:0 "Odwierty na Mazowszu"
 KOR_odwierty_desc:0 "Geolodzy Koncernu ogłaszają odkrycie złoża pod polami koło Płocka. Sceptycy mówią, że to tylko wyciek z rurociągu. Zarząd mówi, że to sceptycy są wyciekiem."
 KOR_paliwo_dla_armii:0 "Karta flotowa dla armii"
 KOR_paliwo_dla_armii_desc:0 "Wojsko tankuje na kredyt Koncernu, a każdy pluton ma swoją kartę flotową. Rachunek przyjdzie po wojnie – albo nigdy."
 KOR_druga_rafineria:0 "Druga instalacja rafineryjna"
 KOR_druga_rafineria_desc:0 "Druga linia przerobu ropy powstaje w rekordowym tempie. Robotnicy dostają premie w bonach na paliwo."
 KOR_f_petrochemia:0 "Kombinat petrochemiczny"
 KOR_f_petrochemia_desc:0 "Z ropy robimy wszystko: paliwo, gumę, folię i politykę zagraniczną. Sąsiedzi mogą od dziś kupować paliwo w Płocku."
 KOR_paliwowe_mocarstwo:0 "Paliwowe mocarstwo nad Wisłą"
 KOR_paliwowe_mocarstwo_desc:0 "Płock tankuje armie, miasta i korporacje. Kto kontroluje paliwo, kontroluje ruch – a kto kontroluje ruch, kontroluje Polskę."
 KOR_f_karta:0 "Obywatelska karta lojalnościowa"
 KOR_f_karta_desc:0 "Każdy mieszkaniec dostaje kartę z chipem. Punkty zbiera się za tankowanie, terminowe podatki i obecność na apelach Zarządu."
 KOR_f_stacje:0 "Stacje paliw jako urzędy"
 KOR_f_stacje_desc:0 "Sieć stacji przejmuje okienka urzędów. Wniosek o dowód złożysz między myjnią a automatem z kawą."
 KOR_grupa_kapitalowa:0 "Grupa kapitałowa"
 KOR_grupa_kapitalowa_desc:0 "Spółki zależne przejmują piekarnie, warsztaty i zakłady remontowe. Każda dostaje cel sprzedażowy i flagę państwową w logo."
 KOR_zaklady_zbrojeniowe:0 "Spółka zbrojeniowa"
 KOR_zaklady_zbrojeniowe_desc:0 "Dział „Bezpieczeństwo i obronność” dostaje własną halę i własny budżet. Produkuje to, co zamówi Zarząd – a Zarząd zamawia dużo."
 KOR_centrum_badan:0 "Centrum badawczo-rozwojowe"
 KOR_centrum_badan_desc:0 "Laboratoria Koncernu pracują nad paliwami, materiałami i wszystkim, co da się opatentować. Granty przyznaje dział marketingu."
 KOR_bad_tb:0 "Centrum badawczo-rozwojowe"
 KOR_debiut_gieldowy:0 "Debiut na Giełdzie Płockiej"
 KOR_debiut_gieldowy_desc:0 "Państwo wchodzi na giełdę, którą samo przed chwilą założyło. Pierwsze notowanie otwiera dzwonek – ten sam, którym kiedyś wzywano na obiad w stołówce zakładowej."
 KOR_lobbing:0 "Rozmowy z korporacjami"
 KOR_lobbing_desc:0 "Prezes Zarządu dzwoni do Włocławka i na Kociewie. W rozbitej Polsce korporacje rozumieją się lepiej niż państwa."
 KOR_konsorcjum:0 "Konsorcjum Polskich Korporacji"
 KOR_konsorcjum_desc:0 "Płock zakłada sojusz gospodarczo-wojskowy korporacji. Zaproszenia trafiają do T-Pizzy we Włocławku i Polskich Kolei na Kociewiu. Udziałowcy wspólnie kupują, wspólnie transportują – i wspólnie się bronią."
 KOR_wspolna_logistyka:0 "Wspólna logistyka paliwowa"
 KOR_wspolna_logistyka_desc:0 "Cysterny Koncernu, wagony PKP i skutery T-Pizzy tworzą jedną sieć dostaw. Paliwo dociera tam, gdzie jest potrzebne – w 30 minut albo pociągiem."
 KOR_wspolna_obrona:0 "Wzajemna pomoc wojskowa"
 KOR_wspolna_obrona_desc:0 "Udziałowcy podpisują aneks o wzajemnej obronie. Płock dostarcza broń, Włocławek – zaopatrzenie, Kociewie – transport."
 KOR_zintegrowane_konsorcjum:0 "Zintegrowane Konsorcjum"
 KOR_zintegrowane_konsorcjum_desc:0 "Wspólny zarząd, wspólne magazyny, wspólny sztab. Konsorcjum przestaje być umową handlową – staje się blokiem."
 KOR_wrogie_przejecia:0 "Wrogie przejęcia"
 KOR_wrogie_przejecia_desc:0 "Dział fuzji i przejęć dostaje nową instrukcję: jeśli sąsiad nie chce sprzedać udziałów, można go przejąć inaczej."
 KOR_przyg_kst:0 "Analiza przejęcia: Kasztelania Sierpecka"
 KOR_przyg_kst_desc:0 "Sierpc ma drogi na północ i rafinerię paliw dla rolników. Zarząd uznaje go za „naturalne uzupełnienie portfela”. Analitycy przygotowują wycenę, prawnicy – roszczenia, a Straż Przemysłowa – plany operacji."
 KOR_przej_kst:0 "Wrogie przejęcie: Kasztelania Sierpecka"
 KOR_przej_kst_desc:0 "Państwo Kasztelania Sierpecka nie chce sprzedać udziałów. Dział fuzji i przejęć przechodzi do planu „B” – z czołgami zamiast prawników."
 KOR_przyg_mla:0 "Analiza przejęcia: Ziemia Mławska"
 KOR_przyg_mla_desc:0 "Mława leży na trasie do Gdańska. Kto ją kontroluje, kontroluje transport paliwa na północ. Analitycy przygotowują wycenę, prawnicy – roszczenia, a Straż Przemysłowa – plany operacji."
 KOR_przej_mla:0 "Wrogie przejęcie: Ziemia Mławska"
 KOR_przej_mla_desc:0 "Państwo Ziemia Mławska nie chce sprzedać udziałów. Dział fuzji i przejęć przechodzi do planu „B” – z czołgami zamiast prawników."
 KOR_przyg_dob:0 "Analiza przejęcia: Ziemia Dobrzyńska"
 KOR_przyg_dob_desc:0 "Ziemia Dobrzyńska po drugiej stronie Wisły to rynek zbytu, rolnicy i ziemia pod nowe instalacje. Analitycy przygotowują wycenę, prawnicy – roszczenia, a Straż Przemysłowa – plany operacji."
 KOR_przej_dob:0 "Wrogie przejęcie: Ziemia Dobrzyńska"
 KOR_przej_dob_desc:0 "Państwo Ziemia Dobrzyńska nie chce sprzedać udziałów. Dział fuzji i przejęć przechodzi do planu „B” – z czołgami zamiast prawników."
 KOR_grupa_mazowsza:0 "Grupa kapitałowa Mazowsza"
 KOR_grupa_mazowsza_desc:0 "Przejęte ziemie dostają zarządy spółek zależnych, stacje paliw i nowe tablice z logo Koncernu. Grupa rośnie – a z nią państwo."
 KOR_eksport_paliwa:0 "Kontrakty paliwowe z sąsiadami"
 KOR_eksport_paliwa_desc:0 "Dział handlu podpisuje długoterminowe kontrakty: sąsiedzi dostają paliwo z Płocka, a Koncern – pieniądze, wpływy i lojalnych klientów."
 KOR_siec_stacji:0 "Stacje Koncernu u sąsiadów"
 KOR_siec_stacji_desc:0 "Stacje z naszym logo stoją przy każdej drodze w regionie. Kto tankuje u nas, ten myśli o Płocku jak o partnerze – a czasem jak o zwierzchniku."
 KOR_zaproszenia2:0 "Ponowna oferta dla korporacji"
 KOR_zaproszenia2_desc:0 "Kto odmówił za pierwszym razem, dostaje drugą ofertę – lepszą, z większym pakietem paliwa i miejscem w zarządzie Konsorcjum."
 KOR_fundusz:0 "Wspólny fundusz inwestycyjny"
 KOR_fundusz_desc:0 "Udziałowcy składają się na wspólny fundusz. Kapitał z Płocka, logistyka z Kociewia, catering z Włocławka – i nowa fabryka u każdego."
 KOR_cysterny_f:0 "Cysterny dla udziałowców"
 KOR_cysterny_f_desc:0 "Regularne dostawy paliwa dla członków Konsorcjum po cenie hurtowej. Armie partnerów jeżdżą na płockim paliwie."
 KOR_rzeczpospolita:0 "Korporacyjna Rzeczpospolita"
 KOR_rzeczpospolita_desc:0 "Płock ogłasza się centrum nowej, korporacyjnej Polski. Herb dostaje logo, hymn – dżingiel, a każdy obywatel – udział w zysku. Teraz trzeba tylko przejąć resztę kraju."
