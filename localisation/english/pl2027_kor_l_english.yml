l_english:
 KOR_krakowiak:0 "Zbigniew Krakowiak"
 KOR_zawadzka:0 "Ewa Zawadzka"
 KOR_KONSORCJUM:0 "Konsorcjum Polskich Korporacji"
 KOR_partia:0 "Zarząd Koncernu"
 KOR_partia_long:0 "Zarząd Koncernu – Korporacyjna Polska"
 KOR_niepewnosc:0 "Płock w zawieszeniu"
 KOR_niepewnosc_desc:0 "Po 11 listopada nikt nie wie, kto rządzi miastem: ratusz, wojewoda czy Zarząd Koncernu. Rafineria pracuje na rezerwowych zmianach, a kierowcy cystern pytają, komu oddać listy przewozowe."
 KOR_straz:0 "Straż Przemysłowa"
 KOR_straz_desc:0 "Ochrona zakładów przejęła patrole w mieście. Zawsze w odblaskowych kamizelkach, zawsze z protokołem BHP."
 KOR_panstwo_koncern:0 "Państwo-koncern"
 KOR_panstwo_koncern_desc:0 "Państwo działa jak spółka: obywatele są interesariuszami, ministerstwa – działami, a budżet – planem finansowym zatwierdzanym przez Radę Nadzorczą."
 KOR_panstwo_koncern2:0 "Spółka notowana na giełdzie"
 KOR_panstwo_koncern2_desc:0 "Państwo ma kurs, analityków i kwartalne raporty. Wyniki finansowe zastępują sondaże, a walne zgromadzenie – wybory."
 KOR_panstwo_koncern3:0 "Korporacyjna Rzeczpospolita"
 KOR_panstwo_koncern3_desc:0 "Grupa kapitałowa stała się państwem, a państwo – grupą kapitałową. Herb ma teraz wersję na stacje paliw i wersję na sztandary."
 KOR_karta_lojalnosci:0 "Obywatelska karta lojalnościowa"
 KOR_karta_lojalnosci_desc:0 "Punkty za tankowanie, punkty za podatki, punkty za udział w apelu. Za 10 000 punktów – kubek termiczny z herbem państwa."
 KOR_stacje_urzedy:0 "Stacje paliw jako urzędy"
 KOR_stacje_urzedy_desc:0 "Dowód osobisty odbierzesz przy kasie numer dwa, a hot doga dostaniesz w okienku podawczym. Kolejki skróciły się o połowę."
 KOR_paliwo_armii:0 "Paliwo z Płocka dla armii"
 KOR_paliwo_armii_desc:0 "Każda jednostka ma kartę flotową Koncernu, a cysterny jeżdżą za frontem jak kuchnie polowe."
 KOR_petrochemia:0 "Kombinat petrochemiczny"
 KOR_petrochemia_desc:0 "Kolumny destylacyjne pracują na trzy zmiany. Z ropy powstaje paliwo, guma, tworzywa – i budżet państwa."
 KOR_petrochemia2:0 "Paliwowe mocarstwo nad Wisłą"
 KOR_petrochemia2_desc:0 "Płock tankuje pół rozbitej Polski. Kto chce jeździć, latać albo walczyć, musi rozmawiać z Zarządem."
 KOR_panika:0 "Panika na giełdzie"
 KOR_panika_desc:0 "Kurs leci w dół, a inwestorzy wynoszą z biur nawet doniczki. Zarząd zwołuje posiedzenie kryzysowe co trzy godziny."
 KOR_hossa:0 "Hossa na akcjach Koncernu"
 KOR_hossa_desc:0 "Kurs bije rekordy, a analitycy prześcigają się w rekomendacjach „kupuj”. Pieniądze same pchają się do inwestycji."
 KOR_czlonek_konsorcjum:0 "Członek Konsorcjum Polskich Korporacji"
 KOR_czlonek_konsorcjum_desc:0 "Wspólne zakupy, wspólna logistyka i wspólny fundusz awaryjny. Paliwo z Płocka trafia do partnerów po cenach hurtowych."
 KOR_czlonek_konsorcjum2:0 "Zintegrowane Konsorcjum"
 KOR_czlonek_konsorcjum2_desc:0 "Konsorcjum ma wspólną sieć cystern, wspólne magazyny i wspólny sztab. Atak na jednego udziałowca to atak na cały kapitał."
 KOR_kurs_mod:0 "Kurs akcji Koncernu"
 KOR_kurs_mod_desc:0 "Państwo jest spółką, a jego kondycję mierzy kurs akcji. Obecnie: §Y[?KOR_kurs|0]§! (neutralnie 100, zakres 0–200). Wysoki kurs zwiększa wydajność fabryk, siłę polityczną i stabilność; niski – obniża je. Poniżej 50 grozi panika, powyżej 150 – hossa."
 KOR_rurociag:0 "Rurociąg Pomorski"
 KOR_rurociag_desc:0 "Ropa z Naftoportu w Gdańsku płynie rurociągiem prosto do rafinerii w Płocku. Wojna z państwem, które trzyma Gdańsk, zakręca zawór."
 KOR_tree:0 "Korporacyjna Polska"
 KOR_tt_kurs:0 "Uruchamia mechanikę §YKurs akcji Koncernu§! i fokusy §YRady Nadzorczej§! (gałąź „Zarząd” w drzewku)."
 KOR_kurs_tt_p5:0 "Kurs akcji Koncernu: §G+5§!"
 KOR_kurs_tt_p3:0 "Kurs akcji Koncernu: §G+3§!"
 KOR_tt_rurociag:0 "Region §YPłock§! otrzymuje §G+6 ropy§!, dopóki nie walczymy z państwem, które posiada §YGdańsk§!."
 KOR_kurs_tt_p4:0 "Kurs akcji Koncernu: §G+4§!"
 KOR_tt_sprzedaz:0 "Odblokowuje §Yzakup interwencyjny ropy§! i kontrakty paliwowe z sąsiadami (cele w drzewku)."
 KOR_kurs_tt_p10:0 "Kurs akcji Koncernu: §G+10§!"
 KOR_kurs_tt_p2:0 "Kurs akcji Koncernu: §G+2§!"
 KOR_tt_gielda:0 "Odblokowuje fokus §YEmisja akcji§!."
 KOR_kurs_tt_p15:0 "Kurs akcji Koncernu: §G+15§!"
 KOR_tt_lobbing:0 "Przygotowuje powstanie §YKonsorcjum Polskich Korporacji§!."
 KOR_tt_zaproszenia:0 "Zaproszenia do Konsorcjum otrzymują §YT-Pizza§! (Włocławek) i §YPKP§! (Kociewie)."
 KOR_tt_logistyka:0 "Członkowie Konsorcjum otrzymują §G2000 paliwa§!."
 KOR_tt_obrona:0 "Członkowie Konsorcjum otrzymują §G200 broni strzeleckiej§! i §G40 sprzętu wsparcia§!."
 KOR_tt_zintegr:0 "Idea członków zmienia się na §YZintegrowane Konsorcjum§! (paliwo, budowa, zużycie paliwa armii, obrona)."
 KOR_kurs_tt_p6:0 "Kurs akcji Koncernu: §G+6§!"
 KOR_tt_przejecia:0 "Odblokowuje kolejne przejęcia: Kasztelania Sierpecka, Ziemia Mławska, Ziemia Dobrzyńska."
 KOR_kurs_tt_m5:0 "Kurs akcji Koncernu: §R-5§!"
 KOR_kurs_tt_p8:0 "Kurs akcji Koncernu: §G+8§!"
 KOR_tt_eksport:0 "Sąsiedzi, z którymi nie walczymy, dostają §G2000 paliwa§! i lepszą opinię o nas."
 KOR_tt_fundusz:0 "Każdy członek Konsorcjum (także my) dostaje §Gfabrykę cywilną§!."
 KOR_tt_cysterny:0 "Członkowie Konsorcjum dostają §G3000 paliwa§!."
 KOR_kurs_tt_p20:0 "Kurs akcji Koncernu: §G+20§!"
 KOR_rada_kat:0 "Rada Nadzorcza Koncernu"
 KOR_rada_kat_desc:0 "Posiedzenia Rady odbywają się w sali na ostatnim piętrze biurowca. Za oknem – kominy rafinerii, na ekranie – kurs akcji. Obecny kurs: §Y[?KOR_kurs|0]§!."
 KOR_kurs_tt_m12:0 "Kurs akcji Koncernu: §R-12§!"
 KOR_dywidenda:0 "Wypłata dywidendy"
 KOR_dywidenda_desc:0 "Zysk trafia do „akcjonariuszy”, czyli do budżetu państwa. Rynek nie lubi, kiedy spółka wydaje gotówkę, ale państwo potrzebuje władzy politycznej."
 KOR_skup_akcji:0 "Skup akcji własnych"
 KOR_skup_akcji_desc:0 "Zarząd skupuje własne akcje, żeby uspokoić rynek. Kosztuje to trochę politycznego kapitału, ale wykres znów idzie w górę."
 KOR_kurs_tt_m15:0 "Kurs akcji Koncernu: §R-15§!"
 KOR_emisja_akcji:0 "Emisja akcji"
 KOR_emisja_akcji_desc:0 "Nowe akcje, nowi inwestorzy, nowa fabryka. Kurs spada, bo zysk trzeba dzielić z większą liczbą udziałowców."
 KOR_podwyzka_cen:0 "Podwyżka cen na stacjach"
 KOR_podwyzka_cen_desc:0 "Litr kosztuje więcej, marża rośnie, a kierowcy klną pod dystrybutorami. Rynek jest zachwycony, obywatele – mniej."
 KOR_kurs_tt_m6:0 "Kurs akcji Koncernu: §R-6§!"
 KOR_promocja:0 "Promocja „Tankuj taniej”"
 KOR_promocja_desc:0 "Cena na totemach spada o kilkadziesiąt groszy. Kolejki pod stacjami ciągną się aż do Wisły, a popularność Zarządu rośnie."
 KOR_paliwo_kat:0 "Paliwo i dostawy"
 KOR_paliwo_kat_desc:0 "Dział handlu paliwami pilnuje zapasów. Kontrakty z sąsiadami i dostawy dla partnerów Konsorcjum są teraz częścią drzewka narodowego."
 KOR_rezerwa:0 "Zakup interwencyjny ropy"
 KOR_rezerwa_desc:0 "Gdy zbiorniki pustoszeją, Koncern kupuje ropę na wolnym rynku – drogo, szybko i bez negocjacji."
 kor.1.t:0 "Korporacyjna Polska"
 kor.1.d:0 "Na maszcie przed biurowcem Koncernu zawisła nowa flaga. Prezes Zarządu ogłasza w orędziu: „Polska nie upadła – Polska wymaga restrukturyzacji”. Rada Nadzorcza zatwierdza plan na pierwszy kwartał nowego państwa: paliwo, porządek i wzrost."
 kor.1.a:0 "Zarząd dziękuje za zaufanie."
 kor.2.t:0 "Korporacyjna Rzeczpospolita"
 kor.2.d:0 "Płock przestaje być prowincją. Konsorcjum, rafinerie i giełda tworzą nowe centrum władzy w rozbitej Polsce. Media nazywają to „pierwszym państwem z raportem rocznym”."
 kor.2.a:0 "Wynik powyżej oczekiwań."
 kor.20.t:0 "Propozycja z Płocka"
 kor.20.d:0 "Zarząd Koncernu w Płocku proponuje nam udział w Konsorcjum Polskich Korporacji: wspólne zakupy paliwa, wspólną logistykę i obronę. W zamian oczekuje lojalności udziałowca – i miejsca w Radzie dla przedstawiciela Płocka."
 kor.20.a:0 "Przystępujemy do Konsorcjum."
 kor.20.b:0 "Nie oddamy kontroli nad naszą firmą."
 kor.21.t:0 "Nowy udziałowiec Konsorcjum"
 kor.21.d:0 "Państwo [FROM.GetName] przyjęło zaproszenie i wchodzi do Konsorcjum Polskich Korporacji. Kurs akcji reaguje natychmiast."
 kor.21.a:0 "Witamy w grupie."
 KOR_kurs_tt_m3:0 "Kurs akcji Koncernu: §R-3§!"
 kor.22.t:0 "Odmowa udziałowca"
 kor.22.d:0 "Państwo [FROM.GetName] odrzuciło naszą ofertę. Zarząd przyjmuje to do wiadomości i odkłada sprawę do następnego kwartału."
 kor.22.a:0 "Wrócimy z lepszą ofertą."
 kor.30.t:0 "Panika na giełdzie"
 kor.30.d:0 "Kurs akcji Koncernu spadł poniżej psychologicznej granicy. Inwestorzy wyprzedają udziały, a przed biurowcem stoją wozy telewizyjne."
 kor.30.a:0 "Uspokoić rynek – skupujemy akcje."
 kor.30.b:0 "Przeczekać."
 KOR_kurs_tt_m10:0 "Kurs akcji Koncernu: §R-10§!"
 kor.31.t:0 "Hossa na akcjach Koncernu"
 kor.31.d:0 "Kurs bije kolejne rekordy. Analitycy z sąsiednich państw pytają, czy Płock jest jeszcze państwem, czy już funduszem inwestycyjnym."
 kor.31.a:0 "Inwestujemy zyski."
 kor.31.b:0 "Wypłacamy premie Zarządowi."
