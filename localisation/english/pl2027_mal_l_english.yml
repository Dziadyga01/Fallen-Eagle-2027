l_english:
 MAL_gwarancja_op:0 "Opiekun małego sąsiada"
 MAL_odmowa_op:0 "Odmowa ochrony"
 MAL_male_mod:0 "Małe państwo"
 MAL_male_mod_desc:0 "Kilka gmin, jeden ratusz i sąsiedzi, którzy są więcej niż dwa razy silniejsi. Małe państwo przetrwa dzięki administracji, gospodarce i obronie – nie podbojom. Uzasadnianie celów wojennych trwa 6 razy dłużej, a fokusy wojenne są zablokowane."
 PL2027_req_nie_male:0 "Małe państwa (do §Y3§! regionów, poza Toruniem, Bydgoszczą i blokami Warszawy) nie prowadzą kampanii podbojów"
 MAL_kat:0 "Małe państwo"
 MAL_kat_desc:0 "Nie mamy armii, by podbijać sąsiadów – mamy ratusz, kasę gminną i ludzi, którzy znają każdą drogę. Tu są nasze narzędzia przetrwania."
 MAL_sprawny_urzad:0 "Sprawny urząd"
 MAL_sprawny_urzad_desc:0 "Urzędnicy załatwiają sprawy od ręki, bo jest ich kilkunastu i wszyscy się znają."
 MAL_neutralnosc:0 "Neutralność gminy"
 MAL_neutralnosc_desc:0 "Ogłosiliśmy neutralność i każdemu sąsiadowi powtarzamy to samo: nie stanowimy zagrożenia, a atak na nas będzie kosztowny politycznie."
 MAL_obrona_granicy:0 "Obrona granicy gminy"
 MAL_obrona_granicy_desc:0 "Posterunki na drogach, worki z piaskiem przy mostach i straż ochotnicza w pogotowiu."
 MAL_d_urzad:0 "Sprawny urząd"
 MAL_d_urzad_desc:0 "Reorganizacja ratusza: jedno okienko, jeden rejestr, jeden podpis."
 MAL_d_fundusz:0 "Fundusz gminny"
 MAL_d_fundusz_desc:0 "Pieniądze z kasy gminnej na drogi, ciepłownię i warsztaty."
 MAL_d_straz:0 "Straż obywatelska"
 MAL_d_straz_desc:0 "Ochotnicza straż z myśliwych, strażaków i rezerwistów. Nie podbije nikogo, ale zatrzyma szabrowników."
 MAL_d_neutralnosc:0 "Ogłosić neutralność"
 MAL_d_neutralnosc_desc:0 "Gmina ogłasza neutralność w sporach regionu i prosi sąsiadów o jej uszanowanie."
 MAL_d_granica:0 "Obrona granicy"
 MAL_d_granica_desc:0 "Sąsiad walczy, a front jest za blisko. Posterunki, zapory na drogach i bunkry przy mostach."
 MAL_d_opieka:0 "Poprosić o ochronę"
 MAL_d_opieka_desc:0 "Prosimy silniejszego sąsiada o gwarancję niepodległości. To nie podporządkowanie – tylko obietnica, że nie zostaniemy sami."
 mal.1.t:0 "Mały sąsiad prosi o ochronę"
 mal.1.d:0 "[From.GetName] prosi nas o gwarancję niepodległości. Nie chce zwierzchnictwa – chce wiedzieć, że ktoś stanie po jego stronie."
 mal.1.a:0 "Gwarantujemy."
 mal.1.b:0 "Nie bierzemy na siebie cudzych wojen."
