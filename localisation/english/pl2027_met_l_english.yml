 MET_obszar_1:0 "Solec Kujawski"
 MET_obszar_2:0 "Zławieś Wielka"
 MET_obszar_3:0 "Ostromecko"
 MET_obszar_4:0 "Unisław"
 MET_obszar_5:0 "Nowa Wieś Wielka"
 MET_obszar_6:0 "Chełmno"
 MET_tt_1:0 "Napięcie w metropolii: §G-15§!"
 met.10.t:0 "Napięcie w metropolii"
 met.10.d:0 "Kibice obu miast obrzucają się kamieniami na moście w Fordonie, a radni piszą listy otwarte, których nikt nie czyta do końca. Spór o gminy między Toruniem a Bydgoszczą przestaje być zabawny."
 met.10.a:0 "Załagodzić spór – wspólna komisja i kosztowne gesty."
 met.10.b:0 "Nie będziemy przepraszać za to, że mamy rację."
 MET_tt_2:0 "Napięcie w metropolii: §G-40§!"
 met.11.t:0 "Kryzys metropolitalny"
 met.11.d:0 "Na drogach między miastami stoją uzbrojone straże, w gminach nikt nie wie, czyich urzędników słuchać, a z obu ratuszy padają słowa, których nie da się cofnąć. Albo zapłacimy wysoką cenę za spokój, albo spór rozstrzygnie broń."
 met.11.a:0 "Deeskalacja za wszelką cenę."
 met.11.b:0 "Dość rozmów – wojna o metropolię!"
 met.20.t:0 "Referendum wygrane: [MET_GetObszar]"
 met.20.d:0 "Mieszkańcy zagłosowali za przyłączeniem. Obszar [MET_GetObszar] przechodzi pod naszą władzę, a po drugiej stronie Wisły słychać zgrzytanie zębów."
 met.20.a:0 "Metropolia rośnie."
 met.21.t:0 "Referendum przegrane: [MET_GetObszar]"
 met.21.d:0 "Mieszkańcy obszaru [MET_GetObszar] odrzucili przyłączenie. Rywal ogłasza w mediach „zwycięstwo zdrowego rozsądku”."
 met.21.a:0 "To jeszcze nie koniec."
 met.22.t:0 "Rywal wygrał referendum: [MET_GetObszar]"
 met.22.d:0 "Rywal zza Wisły – [FROM.GetName] – wygrał referendum i przejmuje obszar [MET_GetObszar]. Nasi radni domagają się zdecydowanej odpowiedzi."
 met.22.a:0 "Zapamiętamy to."
 met.50.t:0 "Ultimatum metropolitalne"
 met.50.d:0 "Władze państwa [FROM.GetName] ogłaszają, że metropolia może mieć tylko jedno centrum – i nie jesteśmy nim my. Żądają podporządkowania naszego miasta. Odmowa oznacza, że sprawę rozstrzygnie siła."
 met.50.a:0 "Ustąpić. Lepiej być drugim miastem niż zgliszczami."
 met.50.b:0 "Nigdy! Niech przyjdą, jeśli się odważą."
 met.51.t:0 "Rywal ustąpił"
 met.51.d:0 "Władze państwa [FROM.GetName] przyjęły nasze warunki. Metropolia ma jedno centrum, a drugie miasto – nowy status i nową tablicę przy wjeździe."
 met.51.a:0 "Jedna metropolia."
 met.52.t:0 "Rywal odrzucił ultimatum"
 met.52.d:0 "Władze państwa [FROM.GetName] odrzuciły nasze żądania. Mamy cel wojenny – spór o metropolię rozstrzygnie się na polu walki."
 met.52.a:0 "Do broni."
