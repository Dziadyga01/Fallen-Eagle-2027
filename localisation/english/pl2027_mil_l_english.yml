 BYD2_rady_mil_start_desc:0 "Powołujemy Radę Obrony: dowódcy, urzędnicy i przedstawiciele zakładów pracy po raz pierwszy siadają przy jednym stole, żeby policzyć ludzi, broń i magazyny."
 BYD2_rady_mil_rejestr:0 "Rejestr poborowych"
 BYD2_rady_mil_rejestr_desc:0 "Urzędy spisują wszystkich zdolnych do służby. Komisje lekarskie pracują w szkołach i domach kultury."
 BYD2_rady_mil_ochotnicy:0 "Nabór ochotników"
 BYD2_rady_mil_ochotnicy_desc:0 "Plakaty na przystankach, punkty werbunkowe przy rynkach i obietnica żołdu. Ochotnicy zgłaszają się szybciej, niż ktokolwiek się spodziewał."
 BYD2_rady_mil_fabryka:0 "Fabryka broni"
 BYD2_rady_mil_fabryka_desc:0 "Hala po upadłym zakładzie dostaje nowe maszyny. Zamiast części do pralek – zamki do karabinów."
 BYD2_rady_mil_pobor:0 "Pobór powszechny"
 BYD2_rady_mil_pobor_desc:0 "Służba wojskowa staje się obowiązkiem. Każdy rocznik przechodzi szkolenie podstawowe i trafia do rezerwy."
 BYD2_rady_mil_bataliony:0 "Nowe bataliony"
 BYD2_rady_mil_bataliony_desc:0 "Z ochotników formujemy pierwsze bataliony obrony. Mają mundury z demobilu, ale też karabiny i dowódców."
 BYD2_rady_mil_produkcja:0 "Produkcja wyposażenia"
 BYD2_rady_mil_produkcja_desc:0 "Warsztaty i zakłady dostają zamówienia na amunicję, hełmy i sprzęt łączności. Produkcja rośnie z tygodnia na tydzień."
 BYD2_rady_mil_rezerwisci:0 "Powołanie rezerwistów"
 BYD2_rady_mil_rezerwisci_desc:0 "Dawni żołnierze zawodowi i rezerwiści wracają do służby. Wielu z nich pamięta jeszcze ćwiczenia sprzed rozpadu państwa."
 BYD2_rady_mil_brygady:0 "Brygady obrony terytorialnej"
 BYD2_rady_mil_brygady_desc:0 "Bataliony łączą się w brygady z własnym rozpoznaniem i saperami. To już nie straż obywatelska, ale armia."
 BYD2_rady_mil_zaplecze:0 "Zaplecze logistyczne"
 BYD2_rady_mil_zaplecze_desc:0 "Magazyny, warsztaty naprawcze i kolumny zaopatrzenia. Armia, która nie dostaje paliwa i amunicji, przegra każdą wojnę."
 BYD2_rady_mil_kadra:0 "Szkoła oficerska"
 BYD2_rady_mil_kadra_desc:0 "Kursy dla dowódców plutonów i kompanii prowadzą weterani i wykładowcy dawnych akademii wojskowych."
