 REG_PLK_mil_fabryka_desc:0 "Hala po upadłym zakładzie dostaje nowe maszyny. Zamiast części do pralek – zamki do karabinów."
 REG_PLK_mil_pobor:0 "Pobór powszechny"
 REG_PLK_mil_pobor_desc:0 "Służba wojskowa staje się obowiązkiem. Każdy rocznik przechodzi szkolenie podstawowe i trafia do rezerwy."
 REG_PLK_mil_bataliony:0 "Nowe bataliony"
 REG_PLK_mil_bataliony_desc:0 "Z ochotników formujemy pierwsze bataliony obrony. Mają mundury z demobilu, ale też karabiny i dowódców."
 REG_PLK_mil_produkcja:0 "Produkcja wyposażenia"
 REG_PLK_mil_produkcja_desc:0 "Warsztaty i zakłady dostają zamówienia na amunicję, hełmy i sprzęt łączności. Produkcja rośnie z tygodnia na tydzień."
 REG_PLK_mil_rezerwisci:0 "Powołanie rezerwistów"
