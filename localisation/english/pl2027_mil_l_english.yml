 MIL_produkcja:0 "Produkcja wojenna"
 MIL_produkcja_desc:0 "Zakłady pracują na potrzeby armii – przez rok kosztem towarów dla ludności."
 MIL_zaopatrzenie:0 "Zaplecze logistyczne"
