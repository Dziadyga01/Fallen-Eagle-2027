 REG_KKR_mil_brygady_desc:0 "Bataliony łączą się w brygady z własnym rozpoznaniem i saperami. To już nie straż obywatelska, ale armia."
 REG_KKR_mil_zaplecze:0 "Zaplecze logistyczne"
 REG_KKR_mil_zaplecze_desc:0 "Magazyny, warsztaty naprawcze i kolumny zaopatrzenia. Armia, która nie dostaje paliwa i amunicji, przegra każdą wojnę."
 REG_KKR_mil_kadra:0 "Szkoła oficerska"
 REG_KKR_mil_kadra_desc:0 "Kursy dla dowódców plutonów i kompanii prowadzą weterani i wykładowcy dawnych akademii wojskowych."
 REG_KKR_mil_zawodowa:0 "Armia zawodowa"
 REG_KKR_mil_zawodowa_desc:0 "Siły zbrojne mają już kadrę, doktrynę i zaplecze. Z pospolitego ruszenia powstała zawodowa armia gotowa do dłuższej kampanii."
 REG_KLS_mil_start:0 "Rada Obrony"
