l_english:
 PL2027_ARMIA_10000:0 "Żołnierze w wystawionych dywizjach: co najmniej §Y10 000§!"
 BLR_mil_start:0 "Rada Obrony"
 BLR_mil_start_desc:0 "Powołujemy Radę Obrony: dowódcy, urzędnicy i przedstawiciele zakładów pracy po raz pierwszy siadają przy jednym stole, żeby policzyć ludzi, broń i magazyny."
 BLR_mil_rejestr:0 "Rejestr poborowych"
 BLR_mil_rejestr_desc:0 "Urzędy spisują wszystkich zdolnych do służby. Komisje lekarskie pracują w szkołach i domach kultury."
 BLR_mil_ochotnicy:0 "Nabór ochotników"
 BLR_mil_ochotnicy_desc:0 "Plakaty na przystankach, punkty werbunkowe przy rynkach i obietnica żołdu. Ochotnicy zgłaszają się szybciej, niż ktokolwiek się spodziewał."
 BLR_mil_fabryka:0 "Fabryka broni"
 BLR_mil_fabryka_desc:0 "Hala po upadłym zakładzie dostaje nowe maszyny. Zamiast części do pralek – zamki do karabinów."
 BLR_mil_pobor:0 "Pobór powszechny"
 BLR_mil_pobor_desc:0 "Służba wojskowa staje się obowiązkiem. Każdy rocznik przechodzi szkolenie podstawowe i trafia do rezerwy."
 BLR_mil_bataliony:0 "Nowe bataliony"
 BLR_mil_bataliony_desc:0 "Z ochotników formujemy pierwsze bataliony obrony. Mają mundury z demobilu, ale też karabiny i dowódców."
 BLR_mil_produkcja:0 "Produkcja wyposażenia"
 BLR_mil_produkcja_desc:0 "Warsztaty i zakłady dostają zamówienia na amunicję, hełmy i sprzęt łączności. Produkcja rośnie z tygodnia na tydzień."
 BLR_mil_rezerwisci:0 "Powołanie rezerwistów"
 BLR_mil_rezerwisci_desc:0 "Dawni żołnierze zawodowi i rezerwiści wracają do służby. Wielu z nich pamięta jeszcze ćwiczenia sprzed rozpadu państwa."
 BLR_mil_brygady:0 "Brygady obrony terytorialnej"
 BLR_mil_brygady_desc:0 "Bataliony łączą się w brygady z własnym rozpoznaniem i saperami. To już nie straż obywatelska, ale armia."
 BLR_mil_zaplecze:0 "Zaplecze logistyczne"
 BLR_mil_zaplecze_desc:0 "Magazyny, warsztaty naprawcze i kolumny zaopatrzenia. Armia, która nie dostaje paliwa i amunicji, przegra każdą wojnę."
 BLR_mil_kadra:0 "Szkoła oficerska"
 BLR_mil_kadra_desc:0 "Kursy dla dowódców plutonów i kompanii prowadzą weterani i wykładowcy dawnych akademii wojskowych."
 BLR_mil_zawodowa:0 "Armia zawodowa"
 BLR_mil_zawodowa_desc:0 "Siły zbrojne mają już kadrę, doktrynę i zaplecze. Z pospolitego ruszenia powstała zawodowa armia gotowa do dłuższej kampanii."
