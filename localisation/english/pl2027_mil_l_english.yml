 REG_KLS_mil_fabryka:0 "Fabryka broni"
 REG_KLS_mil_fabryka_desc:0 "Hala po upadłym zakładzie dostaje nowe maszyny. Zamiast części do pralek – zamki do karabinów."
 REG_KLS_mil_pobor:0 "Pobór powszechny"
