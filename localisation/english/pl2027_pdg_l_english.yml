l_english:
 PDG_magical:0 "Daniel Magical"
 PDG_moderator:0 "Kamil „Moderator” Nowicki"
 PDG_partia:0 "Magiczna Lista"
 PDG_partia_long:0 "Magiczna Lista – Ruch Widzów Podgórza"
 PDG_panstwo_na_zywo:0 "Państwo na żywo"
 PDG_panstwo_na_zywo_desc:0 "Posiedzenia rządu są transmitowane, budżet omawia się w przerwach na reklamy, a obywatele komentują ustawy emotkami."
 PDG_panstwo_na_zywo2:0 "Milion widzów"
 PDG_panstwo_na_zywo2_desc:0 "Transmisję z Podgórza ogląda pół rozbitej Polski. Kto ma widzów, ma władzę – a Podgórz ma ich najwięcej nad Wisłą."
 PDG_magiczny_torun:0 "Magiczny Toruń"
 PDG_magiczny_torun_desc:0 "Stolica przeniosła się na prawy brzeg, ale studio zostało na Podgórzu. Każdy obywatel ma darmową subskrypcję i obowiązek oglądania orędzi."
 PDG_minister_rozrywki:0 "Minister ds. Rozrywki"
 PDG_minister_rozrywki_desc:0 "Rada Starszych rządzi, ale ma w składzie kogoś, kto potrafi zebrać tłum. Komunikaty rządu wreszcie ktoś ogląda."
 PDG_donejty:0 "Budżet z donejtów"
 PDG_donejty_desc:0 "Podatki zastąpiono wpłatami z czatu. Każda wpłata powyżej 50 zł odtwarza na placu przed urzędem dźwięk syreny i odczytuje imię darczyńcy."
 PDG_moderatorzy:0 "Moderatorzy zamiast ministrów"
 PDG_moderatorzy_desc:0 "Ministerstwa zastąpili moderatorzy. Mają jedną władzę – bana – ale używają jej z wyczuciem. Zwykle."
 PDG_festiwal:0 "Festiwal Lewego Brzegu"
 PDG_festiwal_desc:0 "Podgórz żyje z koncertów, jarmarków i transmisji. Ludzie z prawego brzegu przyjeżdżają tu na weekend – i zostawiają pieniądze."
 PDG_hype:0 "Hype na czacie"
 PDG_hype_desc:0 "Czat spamuje okrzykami bojowymi, a ochotnicy ustawiają się w kolejce po kamizelki. Morale nigdy nie było wyższe."
 PDG_offline:0 "Transmisja offline"
 PDG_offline_desc:0 "Ekran jest czarny, czat milczy, a ludzie pytają, czy państwo w ogóle jeszcze działa."
 PDG_widzowie_mod:0 "Widzowie na żywo"
 PDG_widzowie_mod_desc:0 "Podgórzem rządzi ten, kogo ogląda najwięcej ludzi. Obecnie: §Y[?PDG_widzowie|0]/100§!. Dużo widzów to siła polityczna, stabilność i poparcie dla wojny; mało – kary. Widzowie co miesiąc się nudzą i odpływają. Powyżej 85 – hype, poniżej 10 – transmisja offline."
 PDG_tree:0 "Magiczny Podgórz"
 PDG_tt_mech:0 "Uruchamia mechanikę §YWidzowie na żywo§! i fokusy §YStudio na Podgórzu§! (gałąź „Zarząd” w drzewku)."
 PDG_widz_tt_p5:0 "Widzowie na żywo: §G+5§!"
 PDG_tt_ankieta:0 "Odblokowuje fokus §YAnkieta na czacie§!."
 PDG_widz_tt_p10:0 "Widzowie na żywo: §G+10§!"
 PDG_tt_zbiorka:0 "Odblokowuje fokus §YZbiórka na żywo§!."
 PDG_widz_tt_p8:0 "Widzowie na żywo: §G+8§!"
 PDG_tt_najazd:0 "Republika Toruńska traci §R3% stabilności§!."
 PDG_tt_most:0 "Cel wojenny wobec §YRepubliki Toruńskiej§! (jeśli Podgórz nie jest jej podporządkowany)."
 PDG_req_final:0 "Kontrolujemy Toruń albo Republika Toruńska jest nam podporządkowana"
 PDG_tt_sponsor:0 "Jeśli Bydgoszczą rządzi §YRada Przemysłowa§!, Bydgoszcz otrzyma propozycję kontraktu sponsorskiego. W przeciwnym razie – zbiórka wśród widzów."
 PDG_studio_kat:0 "Studio na Podgórzu"
 PDG_studio_kat_desc:0 "Liczba widzów: §Y[?PDG_widzowie|0]/100§!. Im więcej ludzi ogląda, tym więcej może władza na Podgórzu."
 PDG_widz_tt_p12:0 "Widzowie na żywo: §G+12§!"
 PDG_maraton:0 "Maraton na żywo (24 godziny)"
 PDG_maraton_desc:0 "Doba bez przerwy na antenie. Widzowie zostają do rana, a ministrowie przysypiają na kanapie w tle."
 PDG_ankieta:0 "Ankieta na czacie"
 PDG_ankieta_desc:0 "Ważna sprawa państwowa trafia pod głosowanie czatu. Wynik bywa nieprzewidywalny."
 PDG_widz_tt_m8:0 "Widzowie na żywo: §R-8§!"
 PDG_zbiorka:0 "Zbiórka na żywo"
 PDG_zbiorka_desc:0 "Cel zbiórki: „na państwo”. Pasek postępu rośnie, ale część widzów wychodzi, gdy słyszy słowo „przelew”."
 pdg.1.t:0 "Transmisja z Podgórza"
 pdg.1.d:0 "Kamera na statywie, w tle most i światła Starówki. „Siema, Podgórz. Państwo upadło, ale my jesteśmy na żywo.” Czat eksploduje. W ciągu nocy transmisję ogląda więcej ludzi niż sesję Rady Starszych przez ostatnie dziesięć lat. Pod spodem ktoś pisze: „to kto tu właściwie rządzi?”."
 pdg.1.a:0 "„Zostańcie na kanale, będzie się działo.”"
 pdg.1.b:0 "„Spokojnie, to tylko relacja.”"
 PDG_widz_tt_m10:0 "Widzowie na żywo: §R-10§!"
 pdg.2.t:0 "Rada Starszych kontra transmisja"
 pdg.2.d:0 "Rada Starszych zbiera się w sali przy dworcu. Jedni chcą zakazać transmisji z posiedzeń, drudzy proponują, żeby zaprosić streamera do współpracy. Trzeci po cichu sprawdzają, ile mają obserwujących."
 pdg.2.a:0 "Zakazać transmisji z posiedzeń."
 pdg.2.b:0 "Niech nadaje – ludzie przynajmniej wiedzą, co robimy."
 pdg.3.t:0 "Pierwsze orędzie na żywo"
 pdg.3.d:0 "Pierwsze orędzie przywódcy Magicznej Republiki Podgórza trwa cztery godziny, w tym dwie przerwy techniczne i jedną reklamę lokalnej piekarni. Program rządu mieści się na jednym slajdzie: „Ogarnąć. Nadawać. Nie dać się zbanować Toruniowi”."
 pdg.3.a:0 "„Dzięki za suby, Podgórz!”"
 PDG_widz_tt_p4:0 "Widzowie na żywo: §G+4§!"
 PDG_widz_tt_p2:0 "Widzowie na żywo: §G+2§!"
 PDG_widz_tt_p3:0 "Widzowie na żywo: §G+3§!"
 pdg.20.t:0 "Ankieta na czacie"
 pdg.20.d:0 "Na ekranie pojawia się ankieta: „Co robi państwo w tym tygodniu?”. Czat ma dwie minuty. Odpowiedzi spływają szybciej, niż moderatorzy nadążają je czytać."
 pdg.20.a:0 "Wygrywa: „Nowy hymn – remiks”."
 pdg.20.b:0 "Wygrywa: „Inwestycje w drogi”."
 pdg.20.c:0 "Wygrywa: „Ćwiczenia wojskowe nad Wisłą”."
 pdg.21.t:0 "Najazd widzów z Podgórza"
 pdg.21.d:0 "Transmisja z konferencji Ratusza zamieniła się w festiwal emotek. Widzowie z lewego brzegu zalali czat pytaniami o most, Wisłę i to, „kto tu ma więcej widzów”."
 pdg.21.a:0 "Zignorować – to tylko internet."
 pdg.21.b:0 "Wyłączyć komentarze i wysłać notę protestacyjną."
 pdg.22.t:0 "Most przyjaźni z Podgórzem"
 pdg.22.d:0 "Rada Starszych Podgórza proponuje umowę: Podgórz pozostanie niezależny i przyjazny, a Toruń zagwarantuje mu bezpieczeństwo. W zamian – wspólne festiwale i otwarty most."
 pdg.22.a:0 "Zgoda. Most zostaje otwarty."
 pdg.22.b:0 "Podgórz to część Torunia. Żadnych umów."
 pdg.23.t:0 "Toruń przyjmuje ofertę"
 pdg.23.d:0 "Toruń gwarantuje niezależność Podgórza. Na moście zawisają lampki, a pierwsze autobusy wiozą gości na festiwal."
 pdg.23.a:0 "Do zobaczenia na festiwalu."
 pdg.24.t:0 "Toruń odrzuca ofertę"
 pdg.24.d:0 "Ratusz nie chce rozmawiać. Rada Starszych zamyka teczkę z umową i otwiera teczkę z planami obrony."
 pdg.24.a:0 "Poradzimy sobie sami."
 pdg.30.t:0 "Hype na czacie"
 pdg.30.d:0 "Licznik widzów bije rekord za rekordem, czat nie nadąża z wyświetlaniem wiadomości, a pod studiem stoi tłum z transparentami „PODGÓRZ NA ŻYWO”."
 pdg.30.a:0 "Wykorzystać hype – mobilizacja ochotników."
 pdg.30.b:0 "Wykorzystać hype – zbiórka na państwo."
 pdg.31.t:0 "Transmisja offline"
 pdg.31.d:0 "Ekran zgasł, a liczba widzów spadła do garstki wiernych fanów. Na mieście krążą plotki, że „Podgórz przestał nadawać”. Ludzie pytają, czy państwo w ogóle jeszcze działa."
 pdg.31.a:0 "Przerwa techniczna. Wracamy jutro."
 pdg.40.t:0 "Magiczny Toruń"
 pdg.40.d:0 "Podgórz przeszedł most. Nad Ratuszem Staromiejskim powiewa fioletowa flaga Magicznej Republiki, a transmisję z Rynku ogląda cała rozbita Polska. Komentatorzy nie wiedzą, czy to rewolucja, czy odcinek specjalny."
 pdg.40.a:0 "Region się zmienia."
