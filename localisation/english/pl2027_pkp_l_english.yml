l_english:
 PKP_tree:0 "Państwo na torach"
 PKP_chaos:0 "Chaos na torach"
 PKP_chaos_desc:0 "Pociągi stoją, rozkład jazdy jest fikcją, a Rada Republiki obraduje w poczekalni dworca w Starogardzie."
 PKP_holding_kolejowy:0 "Holding kolejowy"
 PKP_holding_kolejowy_desc:0 "Państwo jest spółką, obywatel – pasażerem, a konstytucja – regulaminem przewozów. Każda decyzja przechodzi przez Zarząd."
 PKP_bilet_idea:0 "Bilet jako dokument"
 PKP_bilet_idea_desc:0 "Dowód osobisty zastąpiono biletem okresowym z hologramem. Kto nie ma ważnego biletu, formalnie nie istnieje."
 PKP_lojalny_pasazer:0 "Program „Lojalny Pasażer”"
 PKP_lojalny_pasazer_desc:0 "Punkty za każdy przejechany kilometr, donos na gapowicza i udział w defiladzie. Za 10 000 punktów – przydział mieszkania przy torach."
 PKP_windykacja:0 "Urząd Windykacji"
 PKP_windykacja_desc:0 "Każdy dług wobec Holdingu jest długiem wobec państwa – i odwrotnie. Komornicy w mundurach SOK odwiedzają wsie co tydzień."
 PKP_sok:0 "Straż Ochrony Kolei"
 PKP_sok_desc:0 "Dawna ochrona dworców stała się armią. Jej regulamin wciąż zaczyna się od zakazu palenia na peronach."
 PKP_mosty:0 "Mosty pod strażą"
 PKP_mosty_desc:0 "Most w Tczewie wysadzano już dwa razy w historii. Holding nie zamierza dopuścić do trzeciego razu."
 PKP_strajk:0 "Strajk maszynistów"
 PKP_strajk_desc:0 "Lokomotywy stoją w zajezdniach, a Zarząd ogłasza, że „opóźnienie może ulec zmianie”."
 PKP_maszynisci:0 "Maszyniści-akcjonariusze"
 PKP_maszynisci_desc:0 "Każdy maszynista dostał pakiet akcji. Teraz strajkuje przeciwko sobie samemu – więc nie strajkuje wcale."
 PKP_wegiel:0 "Węglarki ze Śląska"
 PKP_wegiel_desc:0 "Składy z węglem jadą przez całą rozbitą Polskę. Każdy z nich płaci za przejazd – także Holdingowi."
 PKP_port_gdanski:0 "Umowa portowa z Gdańskiem"
 PKP_port_gdanski_desc:0 "Kontenery z Portu Gdańsk jadą dalej wyłącznie wagonami Holdingu. Taryfa jest „konkurencyjna” – bo konkurencji nie ma."
 PKP_wojenny_rozklad:0 "Wojenny rozkład jazdy"
 PKP_wojenny_rozklad_desc:0 "Pociągi pasażerskie odwołane do odwołania. Torami jadą wyłącznie żołnierze, amunicja i Zarząd."
 PKP_konfederacja:0 "Wspólny rozkład Pomorza"
 PKP_konfederacja_desc:0 "Od Gdańska po Toruń obowiązuje jeden bilet, jedna taryfa i jedna rada przewoźników – pod przewodnictwem Tczewa."
 PKP_imperium:0 "Imperium logistyczne"
 PKP_imperium_desc:0 "Kto kontroluje tory, kontroluje wszystko. Każdy węzeł kolejowy północnej Polski ma należeć do Holdingu – po dobroci albo pod lufą pociągu pancernego."
 PKP_prezes:0 "Jerzy Semaforski"
 PKP_kolasinski:0 "Ryszard Kolasiński"
 PKP_mostowska:0 "Wanda Mostowska"
 PKP_partia_long:0 "Zarząd Holdingu PKP"
 PKP_partia:0 "Zarząd PKP"
 PKP_frakcja:0 "Kolejowa Konfederacja Pomorza"
 pkp.1.t:0 "Ostatni pociąg Republiki"
 pkp.1.d:0 "Rada Republiki Kociewskiej zebrała się po raz ostatni w poczekalni dworca w Starogardzie – w budynku urzędu od tygodnia nie ma prądu. Gdy skład do Tczewa odjechał bez radnych, przewodniczący ogłosił przerwę „do odwołania”. Na peronie czeka już zarząd zakładu kolejowego z gotowym projektem uchwały."
 pkp.1.a:0 "Kolej przejmuje obowiązki państwa."
 pkp.1.b:0 "Utrzymać pozory – Rada podpisze wszystko."
 pkp.2.t:0 "Strajk maszynistów"
 pkp.2.d:0 "Związek Zawodowy Maszynistów Kociewia ogłosił, że lokomotywy nie wyjadą z zajezdni, dopóki Zarząd nie wypłaci zaległych pensji. Prezes Semaforski stwierdził na konferencji prasowej, że „pociąg, który stoi, przynajmniej nie jest opóźniony”."
 pkp.2.a:0 "Wypłacić podwyżki z rezerwy Zarządu."
 pkp.2.b:0 "Wysłać SOK do zajezdni."
 pkp.2.c:0 "Rozdać maszynistom pakiety akcji."
 pkp.3.t:0 "Bunt akcjonariuszy"
 pkp.3.d:0 "Na Wielkim Zjeździe grupa drobnych akcjonariuszy z Pelplina i Gniewu zażądała wypłaty dywidendy i odwołania Zarządu. Część delegatów zablokowała drzwi sali, inni zaczęli głośno odczytywać regulamin przewozów jako akt oskarżenia."
 pkp.3.a:0 "Wypłacić dywidendę."
 pkp.3.b:0 "Unieważnić ich akcje – Urząd Windykacji się nimi zajmie."
 pkp.3.c:0 "Wpuścić ich do Rady Nadzorczej."
 pkp.4.t:0 "Gapowicze i Urząd Windykacji"
 pkp.4.d:0 "Urząd Windykacji przedstawił pierwszy raport: co trzeci mieszkaniec Kociewia zalega Holdingowi za przejazdy, abonament lub „opłatę za pozostawanie w pobliżu torów”. Kolejka do okienka reklamacji ciągnie się od dworca aż do rynku w Tczewie."
 pkp.4.a:0 "Ogłosić amnestię dla gapowiczów."
 pkp.4.b:0 "Egzekwować do ostatniego grosza."
 pkp.4.c:0 "Dłużnicy odpracują dług na torach."
 pkp.5.t:0 "Węglarki ze Śląska"
 pkp.5.d:0 "Na granicy Kociewia stanęło czterdzieści węglarek z węglem z Górnego Śląska, jadących do portu w Gdańsku. Konduktor przekazuje, że przewoźnik nie ma pozwolenia na przejazd – ani pieniędzy na opłatę tranzytową."
 pkp.5.a:0 "Kupić węgiel na potrzeby Holdingu."
 pkp.5.b:0 "Przepuścić skład za opłatą – i za przysługę w Gdańsku."
 pkp.5.c:0 "Skonfiskować ładunek jako „towar bez biletu”."
 pkp.6.t:0 "Oferta Holdingu kolejowego"
 pkp.6.d:0 "Polski Holding Kolejowy z Tczewa proponuje Gdańskowi umowę portową: wyłączność na przewóz kontenerów z nabrzeży w zamian za stały udział w opłatach tranzytowych. Kupcy z Długiego Targu liczą zyski, radni – stracone wpływy."
 pkp.6.a:0 "Podpisać umowę."
 pkp.6.b:0 "Odrzucić – port nie jest na sprzedaż."
 pkp.7.t:0 "Gdańsk odmawia"
 pkp.7.d:0 "Rada Wolnego Miasta Gdańska odrzuciła ofertę Holdingu, nazywając ją „próbą przejęcia portu w przebraniu rozkładu jazdy”. Prezes Semaforski skomentował krótko: kontenery i tak muszą gdzieś pojechać."
 pkp.7.a:0 "Przekierować ładunki do Gdyni."
 pkp.7.b:0 "Wstrzymać dostawy do Gdańska „z przyczyn technicznych”."
 pkp.8.t:0 "Państwo na torach"
 pkp.8.d:0 "Na nadzwyczajnym posiedzeniu Zarządu Holdingu na stole leżą dwie mapy. Pierwsza to wspólna sieć Pomorza – rada przewoźników, jeden bilet i dobrowolni wspólnicy. Druga to Imperium Logistyczne – każdy węzeł, każdy most i każdy port pod kontrolą Tczewa, choćby trzeba było wysłać pociągi pancerne."
 pkp.8.a:0 "Kolejowa Konfederacja Pomorza."
 pkp.8.b:0 "Imperium Logistyczne PKP."
 PKP_zarzad_decyzje:0 "Zarząd Holdingu PKP"
 PKP_zarzad_decyzje_desc:0 "Posiedzenia Zarządu odbywają się w wagonie salonowym na bocznicy w Tczewie. Protokół sporządza konduktor."
 PKP_emisja_akcji:0 "Emisja akcji"
 PKP_emisja_akcji_desc:0 "Nowa transza akcji Holdingu trafia do obywateli. Kupno jest dobrowolne, ale bez akcji nie można kupić biletu miesięcznego."
 PKP_nalot_sok:0 "Nalot SOK na gapowiczów"
 PKP_nalot_sok_desc:0 "Funkcjonariusze SOK przeczesują pociągi i dworce. Złapani gapowicze mają wybór: grzywna albo dwa lata służby w Straży."
 PKP_wojenny_rozklad_dec:0 "Wojenny rozkład jazdy"
 PKP_wojenny_rozklad_dec_desc:0 "Wszystkie składy pasażerskie zostają odwołane. Tory służą wyłącznie przerzutowi wojsk i amunicji."
 PKP_logistyka_korporacji:0 "Logistyka korporacji"
 PKP_logistyka_korporacji_desc:0 "Pociągi Holdingu wożą paliwo z Płocka, mąkę dla T-Pizzy i części dla fabryk. Każdy kurs to faktura – i przysługa."
 PKP_rada_korporacji:0 "Rada Korporacji"
 PKP_rada_korporacji_desc:0 "Zarządy Holdingu, Koncernu i T-Pizzy spotykają się co miesiąc w wagonie salonowym na stacji w Tczewie."
 PKP_tt_konsorcjum:0 "Jesteśmy w jednym sojuszu z Koncernem w Płocku albo z T-Pizzą"
 pkp.30.t:0 "Holding kolejowy u bram Płocka"
 pkp.30.d:0 "[From.GetName] proponuje Koncernowi współpracę: pociągi z paliwem do portów i baz w zamian za miejsce w Konsorcjum Polskich Korporacji."
 pkp.30.a:0 "Przyjmujemy Holding do Konsorcjum."
 pkp.30.b:0 "Koncern ma własne cysterny."
 pkp.31.t:0 "Holding w Konsorcjum"
 pkp.31.d:0 "[From.GetName] przyjmuje nas do Konsorcjum Polskich Korporacji. Tory i ropa grają teraz w jednej drużynie."
 pkp.31.a:0 "Pierwszy skład odjeżdża jutro."
 pkp.32.t:0 "Kontrakt kolejowy dla T-Pizzy"
 pkp.32.d:0 "[From.GetName] oferuje T-Pizzy stałe dostawy mąki i sera koleją oraz pierwszeństwo na bocznicach. W zamian chce udziału w przychodach franczyz przy dworcach."
 pkp.32.a:0 "Podpisujemy kontrakt."
 pkp.32.b:0 "Mamy własne skutery."
