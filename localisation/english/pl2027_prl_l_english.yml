 PRL_ref_PRW:0 "Lublin: rozpisać referendum"
 PRL_ref_PRW_desc:0 "Rząd zgadza się na legalne referendum pod nadzorem komisji wyborczej. Drogie, ale uczciwe: wynik zależy od zaufania społecznego i lojalności regionu. Jeśli region zostanie – ma silny mandat. Jeśli odejdzie – odejdzie spokojnie, bez eskalacji."
 PRL_ust_PRW:0 "Lublin: ustępstwa autonomiczne"
 PRL_ust_PRW_desc:0 "Rząd przyznaje regionowi autonomię: własny kolor na mapie, własne podatki, wciąż w Rzeczypospolitej. Tanio – ale każda autonomia osłabia administrację centralną."
