l_english:
 PRL_rzad_mod:0 "Rząd w kryzysie zaufania"
 PRL_rzad_mod_desc:0 "Poparcie rządu §Y[?global.PRL_poparcie|0]§! zmienia przyrost władzy politycznej, a zaufanie społeczne §Y[?global.PRL_zaufanie|0]§! – stabilność."
 PRL_rzad_rp:0 "Rząd Rzeczypospolitej"
 PRL_rzad_rp_desc:0 "Ministerstwa wciąż działają, choć coraz częściej tylko na papierze. Każdy dzień ciągłości państwa jest sukcesem."
 prl.1.t:0 "Kryzys zaufania"
 prl.1.d:0 "22 października 2027. Na biurku premiera leżą trzy teczki: żądania regionów, które grożą referendami i secesją, raporty o aferach w ministerstwach i list z Brukseli o „mechanizmie ochrony obywateli Unii” na Pomorzu Zachodnim i na Dolnym Śląsku.\n\n§YJak gra się prologiem (20 dni):§!\n– regiony stawiają żądania; każde ma licznik do eskalacji w panelu „Rzeczpospolita: żądania regionów”;\n– reakcje: §Ynegocjacje§! (drogie, cena rośnie po aferach), §Yreferendum§! (wysoki koszt, wynik zależy od zaufania), §Yustępstwa autonomiczne§! (tanie, osłabiają administrację), §Yodwlekanie§! (jedna dodatkowa runda, drożej);\n– władzy politycznej nie wystarczy na wszystkich: wybierz, kogo zatrzymać;\n– Pomorze Zachodnie i Dolny Śląsk odejdą na pewno – liczy się, na jakich warunkach;\n– 11 listopada wybierzesz, gdzie grasz dalej: Sejm w Warszawie albo jeden z eurokomisariatów. Bilans prologu ustala start regionalny."
 prl.1.a:0 "Do pracy. Każdy region, który zostanie, to lepszy start."
 prl.2.t:0 "Godzina Zero za dwadzieścia dni"
 prl.2.d:0 "Rzeczpospolita wciąż istnieje – na mapach, w ustawach i w przemówieniach. Ale regiony zapowiadają referenda, w ministerstwach wybuchają afery, a Bruksela przygotowuje zarząd tymczasowy dla Szczecina i Wrocławia. Do 11 listopada zostały trzy tygodnie."
 prl.2.a:0 "Zobaczymy, kto pierwszy się wyłamie."
 PRL_regiony:0 "Rzeczpospolita: żądania regionów"
 PRL_regiony_desc:0 "Regiony stawiają żądania i grożą referendami. Każde żądanie ma licznik – po jego upływie region eskaluje: ogłasza samorząd bez zgody Warszawy, a sąsiedzi szybciej stawiają własne warunki.\n\n§YWskaźniki:§! zaufanie §Y[?global.PRL_zaufanie|0]§!, poparcie rządu §Y[?global.PRL_poparcie|0]§!, administracja §Y[?global.PRL_administracja|0]§!, rezerwy §Y[?global.PRL_rezerwy|0]§! (średnia zaufania, poparcia i administracji §Y[?global.PRL_srednia|0]§!). Poziom kosztów po aferach: §Y[?global.PRL_koszt|0]§!/3.\n§YBilans prologu:§! §Y[?global.PRL_bilans|0]§! (porozumień §G[?global.PRL_porozumienia|0]§!, eskalacji §R[?global.PRL_eskalacje|0]§!).\n\n§YLojalność regionów (0–100):§! Gdańsk §Y[?WMG.PRL_lojalnosc|0]§!, Toruń §Y[?TRN.PRL_lojalnosc|0]§!, Gdynia §Y[?GDY.PRL_lojalnosc|0]§!, Bydgoszcz §Y[?BYD.PRL_lojalnosc|0]§!, Sopot §Y[?SPT.PRL_lojalnosc|0]§!, Konfederacja Północna §Y[?NNA.PRL_lojalnosc|0]§!, Warmia i Mazury §Y[?WMZ.PRL_lojalnosc|0]§!, Suwalszczyzna §Y[?SUW.PRL_lojalnosc|0]§!, Podlasie §Y[?BST.PRL_lojalnosc|0]§!, Lublin §Y[?PRW.PRL_lojalnosc|0]§!, Łódź §Y[?LWC.PRL_lojalnosc|0]§!, Malbork §Y[?ZKR.PRL_lojalnosc|0]§!, Kociewie §Y[?KOC.PRL_lojalnosc|0]§!, Włocławek §Y[?WLC.PRL_lojalnosc|0]§!, Płock §Y[?PLO.PRL_lojalnosc|0]§!."
 PRL_goraczka_secesji:0 "Gorączka secesji"
 PRL_goraczka_secesji_desc:0 "Region ogłosił samorząd bez zgody Warszawy. Na ulicach flagi regionu, w urzędach – chaos kompetencji."
 PRL_umowa_z_warszawa:0 "Umowa z Warszawą"
 PRL_umowa_z_warszawa_desc:0 "Region wynegocjował warunki z rządem przed Godziną Zero. Urzędy przetrwały rozpad w lepszym stanie niż gdzie indziej."
 PRL_mandat_jednosci:0 "Mandat referendalny"
 PRL_mandat_jednosci_desc:0 "Mieszkańcy zagłosowali za wspólnym państwem. Władze regionu mają silny mandat – i zobowiązanie wobec tych, którzy głosowali."
 PRL_mandat_niepodleglosci:0 "Mandat niepodległości"
 PRL_mandat_niepodleglosci_desc:0 "Region odszedł w legalnym referendum. Nowe państwo ma uznanie mieszkańców i spokojne granice z Warszawą."
 PRL_autonomia_umowna:0 "Autonomia z umowy"
 PRL_autonomia_umowna_desc:0 "Rząd przyznał regionowi autonomię jeszcze przed rozpadem. Część urzędów działa według dwóch regulaminów naraz."
 prl.200.t:0 "Gdańsk: Port i Westerplatte pod zarządem miasta"
 prl.200.d:0 "Rada Miasta żąda przekazania portu, terenów stoczni i Westerplatte pod zarząd miejski oraz własnej straży portowej.\n\nLojalność regionu: §Y[?WMG.PRL_lojalnosc|0]§!/100. Po §Y7§! dniach bez odpowiedzi region eskaluje (przy lojalności co najmniej 50 – tylko czeka bez umowy). Koszt negocjacji: §Y55–85§! PP (rośnie po aferach i po odwlekaniu), referendum §Y70§! PP, ustępstwa §Y30§! PP."
 prl.200.a:0 "Odpowiemy w panelu żądań regionów."
 PRL_tt_1:0 "Zaufanie społeczne §R-2§!, Poparcie rządu §R-2§!, Sprawność administracji §R-1§!"
 PRL_m_WMG:0 "Gdańsk: Port i Westerplatte pod zarządem miasta"
 PRL_m_WMG_desc:0 "Rada Miasta żąda przekazania portu, terenów stoczni i Westerplatte pod zarząd miejski oraz własnej straży portowej.\n\nPo upływie czasu region eskaluje – chyba że jego lojalność wynosi co najmniej §Y50§!: wtedy czeka na Godzinę Zero bez umowy. Odpowiedz decyzją: negocjacje, referendum, ustępstwa albo odwlekanie."
 PRL_m2_WMG:0 "Gdańsk: ostatnia runda rozmów"
 PRL_m2_WMG_desc:0 "Odwlekanie dało nam kilka dni. Region czeka na odpowiedź – drugi raz nie poczeka."
 PRL_tt_2:0 "Zaufanie społeczne §G+3§!, Poparcie rządu §R-1§!"
 PRL_neg_WMG_0:0 "Gdańsk: negocjacje"
 PRL_neg_WMG_0_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_neg_WMG_1:0 "Gdańsk: negocjacje (drożej)"
 PRL_neg_WMG_1_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_neg_WMG_2:0 "Gdańsk: negocjacje (najdrożej)"
 PRL_neg_WMG_2_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_tt_3:0 "Zaufanie społeczne §G+4§!, Poparcie rządu §G+2§!"
 PRL_tt_4:0 "Zaufanie społeczne §G+2§!, Poparcie rządu §R-5§!"
 PRL_ref_WMG:0 "Gdańsk: rozpisać referendum"
 PRL_ref_WMG_desc:0 "Rząd zgadza się na legalne referendum pod nadzorem komisji wyborczej. Drogie, ale uczciwe: wynik zależy od zaufania społecznego i lojalności regionu. Jeśli region zostanie – ma silny mandat. Jeśli odejdzie – odejdzie spokojnie, bez eskalacji."
 PRL_tt_5:0 "Sprawność administracji §R-2§!, Poparcie rządu §R-2§!"
 PRL_ust_WMG:0 "Gdańsk: ustępstwa autonomiczne"
 PRL_ust_WMG_desc:0 "Rząd przyznaje regionowi autonomię: własny kolor na mapie, własne podatki, wciąż w Rzeczypospolitej. Tanio – ale każda autonomia osłabia administrację centralną."
 PRL_tt_6:0 "Zaufanie społeczne §R-2§!"
 PRL_odw_WMG:0 "Gdańsk: odwlekać rozmowy"
 PRL_odw_WMG_desc:0 "Komisja, podkomisja, zespół roboczy. Region dostanie jeszcze jedną, krótką rundę rozmów (4 dni) – ale cena porozumienia wzrośnie, a cierpliwość mieszkańców spadnie."
 PRL_region_WMG:0 "Region w Rzeczypospolitej"
 PRL_region_WMG_desc:0 "Nasze żądanie: §YPort i Westerplatte pod zarządem miasta§!. Lojalność wobec Warszawy: §Y[?PRL_lojalnosc|0]§!/100."
 PRL_twarde_WMG:0 "Zaostrzyć żądania"
 PRL_twarde_WMG_desc:0 "Radni ogłaszają, że nie zejdą poniżej swoich warunków. Porozumienie z rządem będzie droższe."
 PRL_wycofaj_WMG:0 "Wycofać żądania w zamian za gwarancje"
 PRL_wycofaj_WMG_desc:0 "Zostajemy z Rzeczpospolitą bez dodatkowych pieniędzy – w zamian rząd gwarantuje nasz budżet. Po Godzinie Zero zaczniemy z umową z Warszawą."
 prl.201.t:0 "Toruń: Status metropolii i uniwersytet"
 prl.201.d:0 "Toruń chce statusu metropolii, pieniędzy dla UMK i gwarancji, że żadna decyzja o regionie nie zapadnie w Bydgoszczy.\n\nLojalność regionu: §Y[?TRN.PRL_lojalnosc|0]§!/100. Po §Y7§! dniach bez odpowiedzi region eskaluje (przy lojalności co najmniej 50 – tylko czeka bez umowy). Koszt negocjacji: §Y45–65§! PP (rośnie po aferach i po odwlekaniu), referendum §Y60§! PP, ustępstwa §Y25§! PP."
 prl.201.a:0 "Odpowiemy w panelu żądań regionów."
