 prl.207.d:0 "Suwałki chcą własnej straży granicznej i pieniędzy na przesmyk – „bo Warszawa i tak nie zdąży”.\n\nLojalność regionu: §Y[?SUW.PRL_lojalnosc|0]§!/100. Po §Y6§! dniach bez odpowiedzi region eskaluje (przy lojalności co najmniej 50 – tylko czeka bez umowy). Koszt negocjacji: §Y45–65§! PP (rośnie po aferach i po odwlekaniu), referendum §Y60§! PP, ustępstwa §Y25§! PP."
