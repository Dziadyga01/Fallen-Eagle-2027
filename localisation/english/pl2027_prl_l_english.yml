 prl.212.t:0 "Kociewie: Węzeł w Tczewie dla Holdingu kolejowego"
 prl.212.d:0 "Holding kolejowy z Tczewa żąda kontroli nad węzłami i rozkładem jazdy w regionie.\n\nLojalność regionu: §Y[?KOC.PRL_lojalnosc|0]§!/100. Po §Y6§! dniach bez odpowiedzi region eskaluje (przy lojalności co najmniej 50 – tylko czeka bez umowy). Koszt negocjacji: §Y30–50§! PP (rośnie po aferach i po odwlekaniu), referendum §Y50§! PP, ustępstwa §Y20§! PP."
