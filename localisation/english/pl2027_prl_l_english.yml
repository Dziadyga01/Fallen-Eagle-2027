 prl.202.t:0 "Gdynia: Port wojenny i stocznia dla miasta"
 prl.202.d:0 "Gdynia żąda kontroli nad portem, stocznią i nabrzeżem Marynarki Wojennej – „zanim zrobi to ktoś inny”.\n\nLojalność regionu: §Y[?GDY.PRL_lojalnosc|0]§!/100. Po §Y6§! dniach bez odpowiedzi region eskaluje (przy lojalności co najmniej 50 – tylko czeka bez umowy). Koszt negocjacji: §Y45–65§! PP (rośnie po aferach i po odwlekaniu), referendum §Y60§! PP, ustępstwa §Y25§! PP."
