 PRL_region_BST_desc:0 "Nasze żądanie: §YWojsko na wschodniej granicy§!. Lojalność wobec Warszawy: §Y[?PRL_lojalnosc|0]§!/100."
 PRL_twarde_BST:0 "Zaostrzyć żądania"
 PRL_twarde_BST_desc:0 "Radni ogłaszają, że nie zejdą poniżej swoich warunków. Porozumienie z rządem będzie droższe."
 PRL_wycofaj_BST:0 "Wycofać żądania w zamian za gwarancje"
 PRL_wycofaj_BST_desc:0 "Zostajemy z Rzeczpospolitą bez dodatkowych pieniędzy – w zamian rząd gwarantuje nasz budżet. Po Godzinie Zero zaczniemy z umową z Warszawą."
 prl.209.t:0 "Lublin: Referendum o „prawdziwej Rzeczypospolitej”"
 prl.209.d:0 "Lublin zapowiada referendum o „przeniesieniu prawowitego rządu na wschód” i żąda gwarancji dla swoich urzędników.\n\nLojalność regionu: §Y[?PRW.PRL_lojalnosc|0]§!/100. Po §Y8§! dniach bez odpowiedzi region eskaluje (przy lojalności co najmniej 50 – tylko czeka bez umowy). Koszt negocjacji: §Y55–85§! PP (rośnie po aferach i po odwlekaniu), referendum §Y70§! PP, ustępstwa §Y30§! PP."
 prl.209.a:0 "Odpowiemy w panelu żądań regionów."
 PRL_m_PRW:0 "Lublin: Referendum o „prawdziwej Rzeczypospolitej”"
 PRL_m_PRW_desc:0 "Lublin zapowiada referendum o „przeniesieniu prawowitego rządu na wschód” i żąda gwarancji dla swoich urzędników.\n\nPo upływie czasu region eskaluje – chyba że jego lojalność wynosi co najmniej §Y50§!: wtedy czeka na Godzinę Zero bez umowy. Odpowiedz decyzją: negocjacje, referendum, ustępstwa albo odwlekanie."
 PRL_m2_PRW:0 "Lublin: ostatnia runda rozmów"
 PRL_m2_PRW_desc:0 "Odwlekanie dało nam kilka dni. Region czeka na odpowiedź – drugi raz nie poczeka."
 PRL_neg_PRW_0:0 "Lublin: negocjacje"
 PRL_neg_PRW_0_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_neg_PRW_1:0 "Lublin: negocjacje (drożej)"
 PRL_neg_PRW_1_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_neg_PRW_2:0 "Lublin: negocjacje (najdrożej)"
