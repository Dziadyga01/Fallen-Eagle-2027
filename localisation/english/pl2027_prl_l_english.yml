 PRL_odw_BYD_desc:0 "Komisja, podkomisja, zespół roboczy. Region dostanie jeszcze jedną, krótką rundę rozmów (4 dni) – ale cena porozumienia wzrośnie, a cierpliwość mieszkańców spadnie."
 PRL_region_BYD:0 "Region w Rzeczypospolitej"
 PRL_region_BYD_desc:0 "Nasze żądanie: §YSiedziba regionu i zamówienia dla przemysłu§!. Lojalność wobec Warszawy: §Y[?PRL_lojalnosc|0]§!/100."
 PRL_twarde_BYD:0 "Zaostrzyć żądania"
 PRL_twarde_BYD_desc:0 "Radni ogłaszają, że nie zejdą poniżej swoich warunków. Porozumienie z rządem będzie droższe."
 PRL_wycofaj_BYD:0 "Wycofać żądania w zamian za gwarancje"
 PRL_wycofaj_BYD_desc:0 "Zostajemy z Rzeczpospolitą bez dodatkowych pieniędzy – w zamian rząd gwarantuje nasz budżet. Po Godzinie Zero zaczniemy z umową z Warszawą."
 prl.204.t:0 "Sopot: Strefa specjalna i własne podatki"
 prl.204.d:0 "Sopot proponuje strefę specjalną: własne podatki, kasyna, port jachtowy i „neutralność kurortu” w sporach Trójmiasta.\n\nLojalność regionu: §Y[?SPT.PRL_lojalnosc|0]§!/100. Po §Y6§! dniach bez odpowiedzi region eskaluje (przy lojalności co najmniej 50 – tylko czeka bez umowy). Koszt negocjacji: §Y30–50§! PP (rośnie po aferach i po odwlekaniu), referendum §Y50§! PP, ustępstwa §Y20§! PP."
 prl.204.a:0 "Odpowiemy w panelu żądań regionów."
 PRL_m_SPT:0 "Sopot: Strefa specjalna i własne podatki"
 PRL_m_SPT_desc:0 "Sopot proponuje strefę specjalną: własne podatki, kasyna, port jachtowy i „neutralność kurortu” w sporach Trójmiasta.\n\nPo upływie czasu region eskaluje – chyba że jego lojalność wynosi co najmniej §Y50§!: wtedy czeka na Godzinę Zero bez umowy. Odpowiedz decyzją: negocjacje, referendum, ustępstwa albo odwlekanie."
 PRL_m2_SPT:0 "Sopot: ostatnia runda rozmów"
 PRL_m2_SPT_desc:0 "Odwlekanie dało nam kilka dni. Region czeka na odpowiedź – drugi raz nie poczeka."
 PRL_neg_SPT_0:0 "Sopot: negocjacje"
 PRL_neg_SPT_0_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_neg_SPT_1:0 "Sopot: negocjacje (drożej)"
 PRL_neg_SPT_1_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_neg_SPT_2:0 "Sopot: negocjacje (najdrożej)"
 PRL_neg_SPT_2_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_ref_SPT:0 "Sopot: rozpisać referendum"
 PRL_ref_SPT_desc:0 "Rząd zgadza się na legalne referendum pod nadzorem komisji wyborczej. Drogie, ale uczciwe: wynik zależy od zaufania społecznego i lojalności regionu. Jeśli region zostanie – ma silny mandat. Jeśli odejdzie – odejdzie spokojnie, bez eskalacji."
 PRL_ust_SPT:0 "Sopot: ustępstwa autonomiczne"
 PRL_ust_SPT_desc:0 "Rząd przyznaje regionowi autonomię: własny kolor na mapie, własne podatki, wciąż w Rzeczypospolitej. Tanio – ale każda autonomia osłabia administrację centralną."
