 prl.211.t:0 "Malbork: Uznanie praw Zakonu do zamku"
 prl.211.d:0 "Rekonstruktorzy z Malborka żądają uznania „praw Zakonu” do zamku, ziem nad Nogatem i własnej straży. Brzmi jak żart – do czasu.\n\nLojalność regionu: §Y[?ZKR.PRL_lojalnosc|0]§!/100. Po §Y5§! dniach bez odpowiedzi region eskaluje (przy lojalności co najmniej 50 – tylko czeka bez umowy). Koszt negocjacji: §Y30–50§! PP (rośnie po aferach i po odwlekaniu), referendum §Y50§! PP, ustępstwa §Y20§! PP."
