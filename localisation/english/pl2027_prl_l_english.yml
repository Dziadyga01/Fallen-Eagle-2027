 PRL_twarde_WLC_desc:0 "Radni ogłaszają, że nie zejdą poniżej swoich warunków. Porozumienie z rządem będzie droższe."
 PRL_wycofaj_WLC:0 "Wycofać żądania w zamian za gwarancje"
 PRL_wycofaj_WLC_desc:0 "Zostajemy z Rzeczpospolitą bez dodatkowych pieniędzy – w zamian rząd gwarantuje nasz budżet. Po Godzinie Zero zaczniemy z umową z Warszawą."
 prl.214.t:0 "Płock: Rafineria i podatek od paliwa"
 prl.214.d:0 "Płock żąda udziału w akcyzie i zarządu nad bezpieczeństwem rafinerii. Bez paliwa z Płocka kraj stanie w tydzień.\n\nLojalność regionu: §Y[?PLO.PRL_lojalnosc|0]§!/100. Po §Y7§! dniach bez odpowiedzi region eskaluje (przy lojalności co najmniej 50 – tylko czeka bez umowy). Koszt negocjacji: §Y55–85§! PP (rośnie po aferach i po odwlekaniu), referendum §Y70§! PP, ustępstwa §Y30§! PP."
 prl.214.a:0 "Odpowiemy w panelu żądań regionów."
 PRL_m_PLO:0 "Płock: Rafineria i podatek od paliwa"
 PRL_m_PLO_desc:0 "Płock żąda udziału w akcyzie i zarządu nad bezpieczeństwem rafinerii. Bez paliwa z Płocka kraj stanie w tydzień.\n\nPo upływie czasu region eskaluje – chyba że jego lojalność wynosi co najmniej §Y50§!: wtedy czeka na Godzinę Zero bez umowy. Odpowiedz decyzją: negocjacje, referendum, ustępstwa albo odwlekanie."
 PRL_m2_PLO:0 "Płock: ostatnia runda rozmów"
 PRL_m2_PLO_desc:0 "Odwlekanie dało nam kilka dni. Region czeka na odpowiedź – drugi raz nie poczeka."
 PRL_neg_PLO_0:0 "Płock: negocjacje"
 PRL_neg_PLO_0_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_neg_PLO_1:0 "Płock: negocjacje (drożej)"
 PRL_neg_PLO_1_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_neg_PLO_2:0 "Płock: negocjacje (najdrożej)"
 PRL_neg_PLO_2_desc:0 "Minister jedzie do regionu z pakietem: pieniądze, kompetencje i gwarancje dla urzędników. Region zostaje z Rzeczpospolitą – a po Godzinie Zero zaczyna z umową z Warszawą. Cena zależy od afer, odwlekania i lojalności regionu."
 PRL_ref_PLO:0 "Płock: rozpisać referendum"
 PRL_ref_PLO_desc:0 "Rząd zgadza się na legalne referendum pod nadzorem komisji wyborczej. Drogie, ale uczciwe: wynik zależy od zaufania społecznego i lojalności regionu. Jeśli region zostanie – ma silny mandat. Jeśli odejdzie – odejdzie spokojnie, bez eskalacji."
 PRL_ust_PLO:0 "Płock: ustępstwa autonomiczne"
 PRL_ust_PLO_desc:0 "Rząd przyznaje regionowi autonomię: własny kolor na mapie, własne podatki, wciąż w Rzeczypospolitej. Tanio – ale każda autonomia osłabia administrację centralną."
 PRL_odw_PLO:0 "Płock: odwlekać rozmowy"
 PRL_odw_PLO_desc:0 "Komisja, podkomisja, zespół roboczy. Region dostanie jeszcze jedną, krótką rundę rozmów (4 dni) – ale cena porozumienia wzrośnie, a cierpliwość mieszkańców spadnie."
 PRL_region_PLO:0 "Region w Rzeczypospolitej"
 PRL_region_PLO_desc:0 "Nasze żądanie: §YRafineria i podatek od paliwa§!. Lojalność wobec Warszawy: §Y[?PRL_lojalnosc|0]§!/100."
 PRL_twarde_PLO:0 "Zaostrzyć żądania"
 PRL_twarde_PLO_desc:0 "Radni ogłaszają, że nie zejdą poniżej swoich warunków. Porozumienie z rządem będzie droższe."
 PRL_wycofaj_PLO:0 "Wycofać żądania w zamian za gwarancje"
 PRL_wycofaj_PLO_desc:0 "Zostajemy z Rzeczpospolitą bez dodatkowych pieniędzy – w zamian rząd gwarantuje nasz budżet. Po Godzinie Zero zaczniemy z umową z Warszawą."
 prl.12.t:0 "Region eskaluje"
 prl.12.d:0 "Region, który czekał na odpowiedź Warszawy, ogłasza samorząd bez zgody rządu. Sąsiednie województwa przyglądają się uważnie – i szykują własne listy żądań."
 prl.12.a:0 "Kolejny region się wyłamał."
 prl.13.t:0 "Referendum: region zostaje"
 prl.13.d:0 "Komisja ogłosiła wyniki: region zostaje w Rzeczypospolitej. Frekwencja była wysoka, a lokalni liderzy secesji przyznają się do porażki."
 prl.13.a:0 "Głos ludzi."
 prl.14.t:0 "Referendum: region odchodzi"
 prl.14.d:0 "Region zagłosował za samodzielnością. Rząd uznaje wynik – po Godzinie Zero region odejdzie spokojnie, bez wojny o urzędy."
 prl.14.a:0 "Głos ludzi."
 PRL_tt_7:0 "Zaufanie społeczne §G+3§!"
 PRL_d_konferencja:0 "Konferencja prasowa premiera"
 PRL_d_konferencja_desc:0 "Premier odpowiada na pytania przez trzy godziny. Ludzie lubią, gdy ktoś w końcu tłumaczy, co się dzieje."
 PRL_tt_8:0 "Rezerwy państwa §R-10§!"
 PRL_d_pakiet:0 "Pakiet dla samorządów"
 PRL_d_pakiet_desc:0 "Pieniądze z rezerwy dla wszystkich województw: na szpitale, wodociągi i pensje. Lojalność wszystkich regionów rośnie – rezerwy maleją."
 PRL_tt_9:0 "Rezerwy państwa §R-15§!, Sprawność administracji §R-2§!"
 PRL_d_rezerwy:0 "Sięgnąć po rezerwy strategiczne"
 PRL_d_rezerwy_desc:0 "Paliwo, żywność i amunicja z magazynów Agencji Rezerw trafiają do budżetu jako zabezpieczenie kredytów. Władza polityczna teraz – braki po Godzinie Zero."
 PRL_tt_10:0 "Poparcie rządu §R-4§!, Zaufanie społeczne §G+3§!"
 PRL_tt_11:0 "Zaufanie społeczne §R-6§!, Koszt porozumień §Rwyższy§!"
 PRL_tt_12:0 "Sprawność administracji §R-3§!"
 PRL_tt_13:0 "Rezerwy państwa §G+6§!, Zaufanie społeczne §G+1§!"
 PRL_tt_14:0 "Poparcie rządu §G+3§!, Rezerwy państwa §R-6§!, Koszt porozumień §Rwyższy§!"
 PRL_tt_15:0 "Zaufanie społeczne §R-5§!, Rezerwy państwa §R-10§!"
 PRL_tt_16:0 "Zaufanie społeczne §R-3§!"
 PRL_tt_17:0 "Sprawność administracji §R-5§!, Poparcie rządu §R-2§!"
 PRL_tt_18:0 "Sprawność administracji §G+5§!, Koszt porozumień §Rwyższy§!"
 PRL_tt_19:0 "Zaufanie społeczne §G+4§!"
 PRL_tt_20:0 "Zaufanie społeczne §R-4§!, Koszt porozumień §Rwyższy§!"
 PRL_tt_21:0 "Poparcie rządu §R-5§!, Zaufanie społeczne §G+3§!, Sprawność administracji §R-3§!"
 PRL_tt_22:0 "Sprawność administracji §G+4§!, Zaufanie społeczne §R-6§!, Koszt porozumień §Rwyższy§!"
 PRL_tt_23:0 "Rezerwy państwa §R-12§!, Zaufanie społeczne §G+3§!"
 PRL_tt_24:0 "Sprawność administracji §R-4§!, Poparcie rządu §R-2§!"
 PRL_tt_25:0 "Zaufanie społeczne §R-6§!, Poparcie rządu §G+2§!"
 prl.70.t:0 "Afera: Taśmy z ministerstwa infrastruktury"
 prl.70.d:0 "Portal publikuje nagrania wiceministra infrastruktury (postać fikcyjna) o „ustawianiu” przetargów na drogi w regionach, które „i tak odejdą”. Na Pomorzu i Mazurach nagrania puszczają radiowęzły.\n\n§YAfery zmieniają zaufanie, poparcie rządu, koszt porozumień i lojalność konkretnych regionów.§!"
 prl.70.a:0 "Natychmiastowa dymisja i prokuratura. (lojalność: WMG, GDY, WMZ, KOC +3)"
 prl.70.b:0 "Obrona ministra – to manipulacja. (lojalność: WMG, GDY, WMZ, KOC -8)"
 prl.70.c:0 "Komisja do zbadania przetargów (30 PP). (lojalność: WMG, GDY, WMZ, KOC -2)"
 prl.71.t:0 "Afera: Rezerwy paliwa sprzedane po cichu"
 prl.71.d:0 "Dziennikarze ujawniają, że część rezerw paliwa sprzedano prywatnemu pośrednikowi po cenach z ubiegłego roku. Kierowcy ciężarówek blokują rogatki Płocka i Białegostoku.\n\n§YAfery zmieniają zaufanie, poparcie rządu, koszt porozumień i lojalność konkretnych regionów.§!"
 prl.71.a:0 "Audyt i odzyskanie paliwa (25 PP). (lojalność: PLO, BST +2)"
 prl.71.b:0 "Zrzucić winę na poprzedników. (lojalność: PLO, BST -6)"
 prl.71.c:0 "Przemilczeć – byle do 11 listopada. (lojalność: PLO, BST -4)"
 prl.72.t:0 "Afera: Lista wojewodów do odwołania"
 prl.72.d:0 "Wycieka lista wojewodów, których rząd chce odwołać „w razie nielojalności regionu”. Na liście są nazwiska z regionów, które jeszcze nie zgłosiły żądań.\n\n§YAfery zmieniają zaufanie, poparcie rządu, koszt porozumień i lojalność konkretnych regionów.§!"
 prl.72.a:0 "Zdementować. (lojalność: NNA, PRW, LWC, TRN, BYD -5)"
 prl.72.b:0 "Przeprosić i wycofać listę. (lojalność: NNA, PRW, LWC, TRN, BYD +4)"
 prl.72.c:0 "Przyspieszyć odwołania – państwo musi działać. (lojalność: NNA, PRW, LWC, TRN, BYD -10)"
 prl.73.t:0 "Afera: Fundusz odbudowy dla „swoich”"
 prl.73.d:0 "Raport kontrolerów pokazuje, że pieniądze z funduszu odbudowy trafiały głównie do gmin rządzonych przez koalicję. Lublin, Płock i Konfederacja Północna mówią o „okupacji budżetowej”.\n\n§YAfery zmieniają zaufanie, poparcie rządu, koszt porozumień i lojalność konkretnych regionów.§!"
 prl.73.a:0 "Podzielić resztę funduszu po równo (35 PP). (lojalność: PRW, NNA, PLO +6)"
 prl.73.b:0 "To była uczciwa procedura. (lojalność: PRW, NNA, PLO -8)"
 prl.74.t:0 "Afera: Podsłuchy w samorządach"
 prl.74.d:0 "Rządowy system analizy łączności (w grze: fikcyjny „Argus”) nagrywał rozmowy marszałków i prezydentów miast. Gdańsk, Toruń i Bydgoszcz zapowiadają pozwy.\n\n§YAfery zmieniają zaufanie, poparcie rządu, koszt porozumień i lojalność konkretnych regionów.§!"
 prl.74.a:0 "Komisja śledcza i wyłączenie systemu. (lojalność: WMG, TRN, BYD, SPT +2)"
 prl.74.b:0 "Bezpieczeństwo państwa ponad wszystko. (lojalność: WMG, TRN, BYD, SPT -10)"
 prl.75.t:0 "Afera: Bankructwo spółki energetycznej"
 prl.75.d:0 "Państwowa spółka energetyczna ogłasza niewypłacalność. W Łodzi, Włocławku i Kutnie wyłączane są ciepłownie, a rząd musi zdecydować, kto zapłaci.\n\n§YAfery zmieniają zaufanie, poparcie rządu, koszt porozumień i lojalność konkretnych regionów.§!"
 prl.75.a:0 "Ratować spółkę z rezerw. (lojalność: LWC, WLC +4)"
 prl.75.b:0 "Przekazać ciepłownie samorządom. (lojalność: LWC, WLC +6)"
 prl.75.c:0 "Pozwolić na upadek – rynek to wyreguluje. (lojalność: LWC, WLC -8)"
 PRL_tt_26:0 "Rezerwy państwa §G+8§!, Zaufanie społeczne §G+2§!, Poparcie rządu §R-3§!"
 PRL_tt_27:0 "Poparcie rządu §G+4§!, Zaufanie społeczne §R-2§!, Rezerwy państwa §R-6§!"
 PRL_tt_28:0 "Sprawność administracji §G+3§!, Poparcie rządu §R-5§!"
 prl.50.t:0 "Eurokomisariat Pomorza"
 prl.50.d:0 "Komisja Europejska uruchamia „mechanizm ochrony obywateli Unii”: w Szczecinie powstaje zarząd tymczasowy, który przejmuje Pomorze Zachodnie i północną część Ziemi Lubuskiej. Referendum niczego tu nie zatrzyma – decyzja zapadła w Brukseli i w Szczecinie. Rząd może jedynie wynegocjować warunki rozdziału.\n\nWarunki zmienią relacje z Eurokomisariatem, rezerwy państwa i to, czy europejski projekt odbudowy Polski będzie później w ogóle możliwy."
 prl.50.a:0 "Umowa o rozdziale: wspólne magazyny, kolej i port (40 PP)."
 prl.50.b:0 "Rozdział pod protestem – nie uznajemy zarządu tymczasowego."
 prl.50.c:0 "Rozmowy o wspólnej przyszłości w Europie (25 PP)."
 prl.51.t:0 "Pomorze Zachodnie odchodzi"
 prl.51.d:0 "W Szczecinie zawieszono flagi Unii obok flag miasta. Eurokomisariat Pomorza przejmuje urzędy, port i jednostki stacjonujące w regionie. Warszawa traci pierwszy region – i to bez jednego wystrzału."
 prl.51.a:0 "Pierwszy, ale nie ostatni."
 PRL_tt_29:0 "Rezerwy państwa §G+6§!, Zaufanie społeczne §G+2§!"
 PRL_tt_30:0 "Poparcie rządu §G+4§!, Rezerwy państwa §R-5§!, Zaufanie społeczne §R-2§!"
 PRL_tt_31:0 "Rezerwy państwa §G+10§!, Poparcie rządu §R-4§!"
 prl.55.t:0 "Eurokomisariat Śląska"
 prl.55.d:0 "Wrocław ogłasza utworzenie Eurokomisariatu Śląska z ośrodkiem na Dolnym Śląsku: Dolny Śląsk, Opolszczyzna i południe Ziemi Lubuskiej. Górny Śląsk pozostaje poza nim. Na czele zarządu staje Borys Budka (w grze: rola fikcyjna), który zapowiada „odbudowę gospodarczą bez czekania na Warszawę” i współpracę z Pomorzem – bez łączenia obu eurokomisariatów.\n\nReferendum tego nie zatrzyma. Rząd może wynegocjować warunki rozdziału."
 prl.55.a:0 "Umowa o rozdziale: wspólny zarząd Odry i energetyki (35 PP)."
 prl.55.b:0 "Rozdział pod protestem."
 prl.55.c:0 "Kontrakt na miedź i węgiel w zamian za uznanie (20 PP)."
 prl.56.t:0 "Dolny Śląsk odchodzi"
 prl.56.d:0 "We Wrocławiu powstał Eurokomisariat Śląska. Unia przejmuje zarząd nad Dolnym Śląskiem i Opolszczyzną, a Borys Budka obiecuje, że „Wrocław nie zamknie granicy przed Polską”."
 prl.56.a:0 "Drugi region odchodzi."
 PRL_tt_32:0 "Rezerwy państwa §G+4§!, Poparcie rządu §R-3§!"
 PRL_tt_33:0 "Poparcie rządu §G+4§!, Zaufanie społeczne §R-1§!"
 prl.58.t:0 "Eurostaat Posen"
 prl.58.d:0 "Pod Poznaniem powstaje zarząd tymczasowy pod nadzorem Berlina – Eurostaat Posen. W odróżnieniu od eurokomisariatów to protektorat Niemiec, nie projekt europejski."
 prl.58.a:0 "Uznać zarząd tymczasowy – lepiej mieć z nim kontakt."
 prl.58.b:0 "Protest w Berlinie i Brukseli."
 prl.30.t:0 "Gdzie gramy dalej?"
 prl.30.d:0 "Eurokomisariat właśnie odszedł od Rzeczypospolitej. Możesz zostać przy rządzie w Warszawie albo przejąć jeden z istniejących eurokomisariatów i grać nim dalej.\n\nRząd w Warszawie nie zniknie – poprowadzi go komputer. Wybór można zmienić jeszcze raz 11 listopada (zdarzenie „Godzina Zero”)."
 prl.30.a:0 "Zostaję przy rządzie Rzeczypospolitej."
 prl.30.b:0 "Przejmuję Eurokomisariat Pomorza."
 prl.30.c:0 "Przejmuję Eurokomisariat Śląska."
 PMN_tusk:0 "Donald Tusk"
 SMR_komendant:0 "Komendant Straży Marszałkowskiej"
 SMR_prezydium:0 "Prezydium Sejmu"
 SMR_marszalek_seniorka:0 "Włodzimierz Czarzasty"
 SMR_rada_ocalenia:0 "Rada Ocalenia Państwa"
 PMN_komisarz:0 "Ursula von der Leyen"
 SLS_budka:0 "Borys Budka"
 PRL_tt_34:0 "Sprawność administracji §G+6§!, Zaufanie społeczne §G+2§!"
 PRL_tt_35:0 "Poparcie rządu §R-6§!, Sprawność administracji §R-5§!"
 prl.20.t:0 "Premier i Eurokomisariat Pomorza"
 prl.20.d:0 "Po secesji Pomorza Zachodniego przewodniczący Komisji proponuje premierowi Donaldowi Tuskowi (w grze: fikcyjna decyzja historii alternatywnej) kierowanie Eurokomisariatem Pomorza i budowę europejskiego projektu zjednoczenia Polski. W Sejmie mówi się, że bez niego struktury państwa rozsypią się w tydzień.\n\n§YZostaje w Sejmie:§! po Godzinie Zero poprowadzi sejmowy ośrodek władzy w Warszawie (negocjacje, zaopatrzenie, walka o legalność, rywalizacja z frakcjami stolicy, później odbudowa Polski).\n§YJedzie do Szczecina:§! Eurokomisariat Pomorza zbuduje projekt „Europejskiej Rzeczypospolitej Polskiej” – pomoc z warunkami i zależność od instytucji Unii; Sejm wybierze następcę. Gracz w obu przypadkach zostaje w Warszawie, dopóki sam nie wybierze inaczej."
 prl.20.a:0 "Premier zostaje w Sejmie – ratujemy struktury państwa."
 prl.20.b:0 "Premier jedzie do Szczecina – Europa da Polsce drugą szansę."
 PRL_tt_36:0 "Poparcie rządu §G+3§!"
 PRL_tt_37:0 "Sprawność administracji §G+4§!, Zaufanie społeczne §R-3§!"
 prl.21.t:0 "Następca w Sejmie"
 prl.21.d:0 "Premier wyjechał do Szczecina. Sejm musi wskazać, kto po Godzinie Zero poprowadzi sejmowy ośrodek władzy w Warszawie. Kandydaci są fikcyjni albo zbiorowi – żaden z nich nie ma jeszcze mandatu, który uzna reszta kraju."
 prl.21.a:0 "Prezydium Sejmu – władza kolegialna, legalizm ponad wszystko."
 prl.21.b:0 "Marszałek Czarzasty – jeden głos, szybkie decyzje."
 prl.21.c:0 "Rada Ocalenia Państwa – rząd wojewodów i dowódców."
 prl.22.t:0 "Premier w Szczecinie"
 prl.22.d:0 "Donald Tusk (w grze: fikcyjna ścieżka) obejmuje kierownictwo Eurokomisariatu Pomorza. W Sejmie trwa szukanie następcy, a w regionach – pytanie, czy Europa naprawdę chce ratować Polskę, czy tylko jej zachodnie ziemie."
 prl.22.a:0 "Nowy rozdział w Szczecinie."
 PRL_sejm_sprawny:0 "Państwo, które przetrwało"
 PRL_sejm_sprawny_desc:0 "Sejm przejął urzędy, archiwa i łączność rządu w dobrym stanie. Ministerstwa pracują dalej – w mniejszej skali, ale bez przerwy."
 PRL_sejm_rozsypka:0 "Administracja w rozsypce"
 PRL_sejm_rozsypka_desc:0 "Część urzędników przeszła do regionów, część do domu. To, co zostało, wystarcza na Warszawę – i niewiele więcej."
 PRL_panstwo_z_papieru:0 "Państwo z papieru"
 PRL_panstwo_z_papieru_desc:0 "Pieczątki są, ludzi brak. Rozkazy z Wiejskiej docierają tylko tam, gdzie da się dojść pieszo."
 PRL_plan_obrony:0 "Plan obrony z Warszawy"
 PRL_plan_obrony_desc:0 "Przed Godziną Zero Rada Bezpieczeństwa przekazała regionowi plany obrony, mapy i rezerwy. Teraz trzeba je wykonać samemu."
 PRL_tt_38:0 "Bilans prologu zostanie zastosowany: Śródmieście, duchy regionów, rezerwy i relacje. Potem rusza start regionalny (fazy rozpadu, kampania Torunia, walka o Warszawę)."
 prl.40.t:0 "Godzina Zero"
 prl.40.d:0 "11 listopada 2027. Rząd zbiera się po raz ostatni w pełnym składzie. Państwo, które jeszcze rano wysyłało rozporządzenia do szesnastu województw, od jutra będzie istnieć tylko tam, gdzie ktoś zechce go słuchać.\n\n§YBilans prologu:§! §Y[?global.PRL_bilans|0]§! (porozumień §G[?global.PRL_porozumienia|0]§!, eskalacji §R[?global.PRL_eskalacje|0]§!), średnia wskaźników §Y[?global.PRL_srednia|0]§!.\n– co najmniej 4 porozumienia (umowy i wygrane referenda), najwyżej 6 eskalacji i średnia wskaźników co najmniej 30: Sejm zachowuje Śródmieście i Ożarów, sprawną administrację i rezerwy;\n– 10 lub więcej eskalacji albo średnia poniżej 22: „państwo z papieru”;\n– regiony z umową, mandatem albo autonomią zaczynają z lepszymi duchami i dobrymi relacjami z Sejmem.\n\n§YGdzie grasz dalej?§! Rząd przekazuje władzę Sejmowi – możesz poprowadzić sejmowy ośrodek władzy albo przejąć eurokomisariat."
 prl.40.a:0 "Zostaję przy władzy centralnej – Sejm w Warszawie."
 prl.40.b:0 "Przejmuję Eurokomisariat Pomorza."
 prl.40.c:0 "Przejmuję Eurokomisariat Śląska."
 prl.42.t:0 "Rzeczpospolita się rozpada"
 prl.42.d:0 "Rząd Rzeczypospolitej przekazał władzę Sejmowi i ogłosił samorozwiązanie. Województwa, które jeszcze czekały na decyzję, stają się niepodległymi państwami. Na mapie Polski nie ma już jednej barwy.\n\nBilans prologu: §Y[?global.PRL_bilans|0]§!. To, jak rząd poradził sobie z żądaniami regionów, zostanie zapamiętane – w relacjach, duchach narodowych i w tym, kto zechce kiedyś wrócić do wspólnego państwa."
 prl.42.a:0 "Koniec pewnej epoki."
 PRL_rzad_tree:0 "Rząd w kryzysie zaufania"
