 prl.205.d:0 "Samorządy północnego Mazowsza przestają przekazywać podatki i żądają ustawy o samodzielności finansowej.\n\nLojalność regionu: §Y[?NNA.PRL_lojalnosc|0]§!/100. Po §Y8§! dniach bez odpowiedzi region eskaluje (przy lojalności co najmniej 50 – tylko czeka bez umowy). Koszt negocjacji: §Y55–85§! PP (rośnie po aferach i po odwlekaniu), referendum §Y70§! PP, ustępstwa §Y30§! PP."
