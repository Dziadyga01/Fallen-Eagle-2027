 RCHJ_s3:0 "Jedna ziemia w Borach"
 RCHJ_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RCHJ_w1:0 "Wojna z [KRJ.GetNameDef]"
 RCHJ_w1_desc:0 "[KRJ.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RCHJ_w2:0 "Wojna z [KPM.GetNameDef]"
 RCHJ_w2_desc:0 "[KPM.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RCHJ_w3:0 "Wojna z [TUC.GetNameDef]"
 RCHJ_w3_desc:0 "[TUC.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RCHJ_region:0 "Ziemia Zaborska i Bory"
 RCHJ_region_desc:0 "Od Człuchowa po Tucholę – jedno państwo w lasach."
 RCHJ_centralizacja:0 "Centralizacja"
 RCHJ_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RCHJ_porozumienie:0 "Porozumienie z samorządami"
 RCHJ_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RCHJ_pl1:0 "Więcej niż region"
 RCHJ_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RCHJ_pl2:0 "Marsz na Warszawę"
 RCHJ_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RCHJ_pl3:0 "Rzeczpospolita Odrodzona"
 RCHJ_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RCHJ_bory:0 "Kryjówki w Borach"
 RCHJ_bory_desc:0 "W Borach Tucholskich powstają magazyny i kryjówki."
 RCHE_start:0 "Ziemia Chełmińska"
 RCHE_start_desc:0 "Chełmno ogłasza odnowienie Ziemi Chełmińskiej. Burmistrz czyta na rynku fragmenty przywileju z 1233 roku – i ludzie słuchają w ciszy."
 RCHE_porzadek:0 "Straż na murach"
 RCHE_porzadek_desc:0 "Ochotnicy pilnują bram w murach obronnych i zjazdów ze skarpy."
 RCHE_zaopatrzenie:0 "Sady i ogrody"
 RCHE_zaopatrzenie_desc:0 "Sady na skarpach i ogrody działkowe dają żywność na zimę."
 RCHE_wladza:0 "Rada w ratuszu"
 RCHE_wladza_desc:0 "Rada zbiera się w renesansowym ratuszu. Na ścianie wisi pręt chełmiński – dawna miara długości. „Wszystko ma swoją miarę” – mówi burmistrz."
 RCHE_wybor:0 "Prawo, bractwo czy opieka?"
 RCHE_wybor_desc:0 "Chełmno musi zdecydować, jak przetrwać między wielkimi."
 RCHE_a1:0 "Przywilej 1233"
 RCHE_a1_desc:0 "Rada ogłasza, że przywilej chełmiński z 1233 roku jest podstawą ustroju."
 RCHE_a2:0 "Sąd ławniczy"
 RCHE_a2_desc:0 "Sąd ławników znów rozstrzyga spory mieszczan."
 RCHE_a3:0 "Wybory do rady"
 RCHE_a3_desc:0 "Pierwsze wybory w Chełmnie."
 RCHE_a4:0 "Wolne Miasto Chełmno"
 RCHE_a4_desc:0 "Chełmno staje się wolnym miastem na prawie chełmińskim."
 RCHE_b1:0 "Cechy i parafie"
 RCHE_b1_desc:0 "Cechy rzemieślnicze i parafie tworzą bractwo."
 RCHE_b2:0 "Relikwie św. Walentego"
 RCHE_b2_desc:0 "Relikwie w farze stają się symbolem miasta."
 RCHE_b3:0 "Rada Bractwa"
 RCHE_b3_desc:0 "Bractwo przejmuje władzę."
 RCHE_b4:0 "Bractwo Chełmińskie"
 RCHE_b4_desc:0 "Chełmnem rządzi bractwo."
 RCHE_c1:0 "Szukamy opiekuna"
 RCHE_c1_desc:0 "Burmistrz jedzie do Torunia i Bydgoszczy."
 RCHE_c2:0 "Umowa o ochronie"
 RCHE_c2_desc:0 "Chełmno podpisuje umowę o ochronie."
 RCHE_c3:0 "Kupcy z Torunia"
 RCHE_c3_desc:0 "Kupcy z Torunia otwierają składy w Chełmnie."
 RCHE_c4:0 "Chełmno pod opieką"
 RCHE_c4_desc:0 "Chełmno zachowuje prawo – i zyskuje opiekuna."
 RCHE_e1:0 "Prąd z Torunia"
 RCHE_e1_desc:0 "Linie z Torunia są naprawione. Chełmno płaci owocami."
 RCHE_e2:0 "Warsztaty w Chełmnie"
 RCHE_e2_desc:0 "Warsztaty i małe zakłady produkują dla Ziemi."
 RCHE_e3:0 "Przetwórnie owoców"
 RCHE_e3_desc:0 "Soki, susz i dżemy z Chełmna trafiają do Torunia, Grudziądza i Bydgoszczy."
 RCHE_e4:0 "Most w Chełmnie"
 RCHE_e4_desc:0 "Most przez Wisłę zostaje naprawiony i strzeżony.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RCHE_e5:0 "Zbrojownia w baszcie"
 RCHE_e5_desc:0 "W baszcie przy murach powstaje mała zbrojownia.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RCHE_e6:0 "Sady nad Wisłą"
 RCHE_e6_desc:0 "Ziemia ma stabilną, małą gospodarkę."
 RCHE_m1:0 "Straż murów"
 RCHE_m1_desc:0 "Ochotnicy tworzą straż."
 RCHE_m2:0 "Pobór gmin"
 RCHE_m2_desc:0 "Gminy wokół Chełmna wystawiają drużyny.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RCHE_m3:0 "Broń z magazynów"
 RCHE_m3_desc:0 "Magazyny oddają broń.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RCHE_m4:0 "Batalion Chełmiński"
 RCHE_m4_desc:0 "Straż tworzy batalion z artylerią."
 RCHE_m5:0 "Straż murów"
 RCHE_m5_desc:0 "Mury Chełmna mają obrońców."
 RCHE_d0:0 "Między Toruniem a Grudziądzem"
 RCHE_d0_desc:0 "Chełmża, Grudziądz, Dąbrowa i Łysomice – Chełmno jest otoczone sąsiadami, a w tle Toruń i Bydgoszcz walczą o wpływy."
 RCHE_s1:0 "Związek Ziemi Chełmińskiej"
 RCHE_s1_desc:0 "Chełmno proponuje sąsiadom wspólną obronę."
 RCHE_s2:0 "Wspólne prawo"
 RCHE_s2_desc:0 "Członkowie Związku przyjmują prawo chełmińskie."
 RCHE_pomoc:0 "Pomoc z zagranicy"
 RCHE_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
