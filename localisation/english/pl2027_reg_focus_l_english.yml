 RKLS_pl2:0 "Marsz na Warszawę"
 RKLS_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RKLS_pl3:0 "Rzeczpospolita Odrodzona"
 RKLS_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RKLS_calisia:0 "Dwa tysiące lat Kalisza"
 RKLS_calisia_desc:0 "Kalisz obchodzi rocznicę wzmianki u Ptolemeusza. Festyn na Głównym Rynku przypomina, że miasto przetrwało wszystko."
 RKLS_tech:0 "Biuro konstrukcyjne"
 RKLS_tech_desc:0 "Inżynierowie z zakładów lotniczych tworzą biuro konstrukcyjne. Kalisz projektuje, a nie tylko produkuje."
 RSRD_start:0 "Ziemia Sieradzka"
 RSRD_start_desc:0 "Sieradz ogłasza niezależność bez fanfar. Starosta Sieradzki mówi krótko: „Nikt nas nie pytał o rozpad. Teraz sami zdecydujemy, co dalej”."
 RSRD_porzadek:0 "Straż na Warcie"
 RSRD_porzadek_desc:0 "Ochotnicy pilnują mostów na Warcie. Kto chce przejść, musi powiedzieć dokąd i po co."
 RSRD_zaopatrzenie:0 "Plony nad Wartą"
 RSRD_zaopatrzenie_desc:0 "Gospodarstwa Ziemi Sieradzkiej mają nadwyżki zboża i ziemniaków."
 RSRD_wladza:0 "Rada Ziemi Sieradzkiej"
 RSRD_wladza_desc:0 "Rada zbiera się w starostwie. Większość radnych to rolnicy – i to widać po porządku obrad."
 RSRD_wybor:0 "Jak przetrwać?"
 RSRD_wybor_desc:0 "Wspólnota gmin, spółdzielnie rolnicze czy ochrona silniejszego sąsiada? Sieradz musi wybrać."
 RSRD_a1:0 "Gminy decydują"
 RSRD_a1_desc:0 "Gminy dostają prawo do decyzji o swoich sprawach. Sieradz tylko koordynuje."
 RSRD_a2:0 "Wiece gminne"
 RSRD_a2_desc:0 "Wiece w każdej gminie: mieszkańcy decydują o podatkach i straży."
 RSRD_a3:0 "Statut Wspólnoty"
 RSRD_a3_desc:0 "Statut Wspólnoty jest krótki i zrozumiały dla każdego."
 RSRD_a4:0 "Wspólnota Ziemi Sieradzkiej"
 RSRD_a4_desc:0 "Ziemia Sieradzka staje się wspólnotą gmin."
 RSRD_b1:0 "Spółdzielnie rolnicze"
 RSRD_b1_desc:0 "Rolnicy łączą maszyny, magazyny i ziemię w spółdzielnie."
 RSRD_b2:0 "Wspólne maszyny"
 RSRD_b2_desc:0 "Kombajny i traktory należą do spółdzielni, nie do pojedynczych gospodarzy."
 RSRD_b3:0 "Rada Spółdzielni"
 RSRD_b3_desc:0 "Rada Spółdzielni staje się parlamentem Ziemi Sieradzkiej."
 RSRD_b4:0 "Spółdzielcza Ziemia Sieradzka"
 RSRD_b4_desc:0 "Państwo spółdzielców: każdy rolnik ma głos i udział w zysku."
 RSRD_c1:0 "Szukamy opiekuna"
 RSRD_c1_desc:0 "Starosta jedzie do Łodzi i Kalisza. Sieradz potrzebuje ochrony – pytanie, czyjej."
 RSRD_c2:0 "Umowa o ochronie"
 RSRD_c2_desc:0 "Sieradz podpisuje umowę o ochronie z silniejszym sąsiadem. Niezależność zostaje, ale z gwiazdką."
 RSRD_c3:0 "Spokój za cenę"
 RSRD_c3_desc:0 "Ziemia Sieradzka płaci zbożem za bezpieczeństwo."
 RSRD_c4:0 "Starostwo Sieradzkie"
 RSRD_c4_desc:0 "Starosta rządzi spokojnie, w cieniu silniejszych. Ziemia przetrwa."
 RSRD_e1:0 "Lokalne ciepłownie"
 RSRD_e1_desc:0 "Ciepłownie w Sieradzu i Zduńskiej Woli dostają węgiel z Bełchatowa."
 RSRD_e2:0 "Zakłady w Zduńskiej Woli"
 RSRD_e2_desc:0 "Zakłady w Zduńskiej Woli przestawiają się na produkcję narzędzi i części."
 RSRD_e3:0 "Spichlerz centralnej Polski"
 RSRD_e3_desc:0 "Ziemia Sieradzka sprzedaje zboże sąsiadom. Chleb staje się walutą."
 RSRD_e4:0 "Drogi powiatowe"
 RSRD_e4_desc:0 "Drogi między wsiami są naprawione, a kolej z Sieradza do Łodzi – uruchomiona.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RSRD_e5:0 "Warsztaty w Wieluniu"
 RSRD_e5_desc:0 "Warsztaty w Wieluniu produkują amunicję i części do broni.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RSRD_e6:0 "Spokojna gospodarka"
 RSRD_e6_desc:0 "Ziemia Sieradzka nie ma wielkiego przemysłu, ale ma stabilną gospodarkę, która karmi sąsiadów."
 RSRD_m1:0 "Straż Nadwarciańska"
 RSRD_m1_desc:0 "Ochotnicy z gmin tworzą Straż."
 RSRD_m2:0 "Pobór w gminach"
 RSRD_m2_desc:0 "Każda gmina wystawia drużynę.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RSRD_m3:0 "Broń z Wielunia"
 RSRD_m3_desc:0 "Magazyny w Wieluniu oddają broń Straży.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RSRD_m4:0 "Dywizja Sieradzka"
 RSRD_m4_desc:0 "Straż tworzy dywizję z artylerią."
 RSRD_m5:0 "Straż Nadwarciańska"
 RSRD_m5_desc:0 "Straż zna każdy bród na Warcie. Nikt nie przejdzie niezauważony."
 RSRD_d0:0 "Między Łodzią a Kaliszem"
 RSRD_d0_desc:0 "Łódź, Piotrków i Kalisz – Sieradz jest otoczony silniejszymi sąsiadami."
 RSRD_s1:0 "Związek Nadwarciański"
 RSRD_s1_desc:0 "Sieradz proponuje sąsiadom wspólną obronę."
 RSRD_s2:0 "Wspólne magazyny"
 RSRD_s2_desc:0 "Członkowie Związku mają wspólne magazyny zboża."
 RSRD_pomoc:0 "Pomoc z zagranicy"
 RSRD_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
