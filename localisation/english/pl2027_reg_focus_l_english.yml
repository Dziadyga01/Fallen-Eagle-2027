 RMLA_start_desc:0 "Mława ogłasza niezależność. Burmistrz przypomina, że to miasto już raz zatrzymało armię, której nikt inny nie umiał zatrzymać."
 RMLA_porzadek:0 "Straż na S7"
 RMLA_porzadek_desc:0 "Ekspresówka z Gdańska do Warszawy przechodzi przez Mławę. Straż kontroluje ruch."
 RMLA_zaopatrzenie:0 "Magazyny przy S7"
 RMLA_zaopatrzenie_desc:0 "Magazyny logistyczne przy ekspresówce są pełne."
 RMLA_wladza:0 "Rada Ziemi"
 RMLA_wladza_desc:0 "Rada zbiera się w Mławie."
 RMLA_wybor:0 "Samorząd, Konfederacja czy reduta?"
 RMLA_wybor_desc:0 "Mława musi zdecydować, jak przetrwać między Ciechanowem, Płockiem a Warmią."
