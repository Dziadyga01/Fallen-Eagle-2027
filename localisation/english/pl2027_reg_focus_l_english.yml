 RSRD_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RSRD_porozumienie:0 "Porozumienie z samorządami"
 RSRD_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RSRD_pl1:0 "Więcej niż region"
 RSRD_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RSRD_pl2:0 "Marsz na Warszawę"
 RSRD_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RSRD_pl3:0 "Rzeczpospolita Odrodzona"
 RSRD_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RSRD_skansen:0 "Skansen i tradycja"
 RSRD_skansen_desc:0 "Skansen w Sieradzu staje się miejscem spotkań i festynów. Ziemia Sieradzka przypomina sobie, kim jest."
 RLES_start:0 "Ziemia Leszczyńska"
 RLES_start_desc:0 "Leszno ogłasza niezależność. Prezydent Leszna mówi, że miasto, które wygrało tyle mistrzostw, nie przegra też z chaosem."
 RLES_porzadek:0 "Straż na drogach do Wrocławia"
 RLES_porzadek_desc:0 "Droga S5 do Wrocławia przechodzi przez Leszno. Straż pilnuje, kto wjeżdża z niemieckiego protektoratu na Śląsku."
 RLES_zaopatrzenie:0 "Wielkopolskie gospodarstwa"
 RLES_zaopatrzenie_desc:0 "Gospodarstwa wokół Leszna są zadbane jak zawsze. Zboża i mięsa nie brakuje."
 RLES_wladza:0 "Rada Ziemi Leszczyńskiej"
 RLES_wladza_desc:0 "Rada zbiera się w ratuszu. Obrady zaczynają się punktualnie – po wielkopolsku."
 RLES_wybor:0 "Republika, tron czy stadion?"
 RLES_wybor_desc:0 "Rada Miasta, tron Leszczyńskich czy kibice Unii? Leszno musi wybrać, kto rządzi."
 RLES_a1:0 "Rada Miasta"
 RLES_a1_desc:0 "Rada Miasta przejmuje pełnię władzy."
 RLES_a2:0 "Wybory punktualnie"
 RLES_a2_desc:0 "Wybory odbywają się dokładnie w wyznaczonym terminie – wyniki są znane godzinę po zamknięciu lokali."
 RLES_a3:0 "Statut Republiki"
 RLES_a3_desc:0 "Statut Republiki jest krótki i praktyczny."
 RLES_a4:0 "Republika Leszczyńska"
 RLES_a4_desc:0 "Leszno staje się republiką – małą, porządną i punktualną."
 RLES_b1:0 "Pamięć Stanisława"
 RLES_b1_desc:0 "Leszno przypomina, że dało Polsce króla Stanisława Leszczyńskiego. Rada Miasta ogłasza „rok królewski”."
 RLES_b2:0 "Zamek w Rydzynie"
 RLES_b2_desc:0 "Zamek w Rydzynie staje się siedzibą Rady Koronnej."
 RLES_b3:0 "Herb Wieniawa"
 RLES_b3_desc:0 "Herb Leszczyńskich wraca na flagi i pieczęcie."
 RLES_b4:0 "Księstwo Leszczyńskie"
 RLES_b4_desc:0 "Leszno staje się księstwem. Tron czeka na dziedzica – a na razie rządzi Rada Koronna."
 RLES_c1:0 "Kibice na trybunach"
 RLES_c1_desc:0 "Kibice Unii Leszno zbierają się na stadionie. Mówią, że skoro drużyna wygrywa, to i miasto może."
 RLES_c2:0 "Mecz o władzę"
 RLES_c2_desc:0 "Po wygranym meczu tłum maszeruje pod ratusz. Rada Miasta ustępuje – bez jednego strzału."
 RLES_c3:0 "Stadion jako siedziba rządu"
 RLES_c3_desc:0 "Rząd urzęduje w budynku klubowym. Posiedzenia odbywają się w szatni."
 RLES_c4:0 "Republika Żużlowa"
 RLES_c4_desc:0 "Leszno staje się Republiką Żużlową. Mecze są świętem państwowym."
 RLES_e1:0 "Prąd z Konina"
 RLES_e1_desc:0 "Leszno kupuje prąd z Konina i naprawia lokalne sieci."
 RLES_e2:0 "Zakłady w Lesznie"
 RLES_e2_desc:0 "Zakłady produkcyjne w Lesznie przestawiają się na potrzeby państwa."
 RLES_e3:0 "Szybowisko"
 RLES_e3_desc:0 "Szybowisko w Strzyżewicach staje się bazą lotniczą. Szybowce i awionetki to tanie lotnictwo dla małego państwa."
 RLES_e4:0 "Węzeł kolejowy"
 RLES_e4_desc:0 "Leszno jest węzłem kolejowym między Poznaniem a Wrocławiem. Pociągi znów kursują.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RLES_e5:0 "Warsztaty zbrojeniowe"
 RLES_e5_desc:0 "Warsztaty w Lesznie produkują amunicję i części do broni.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RLES_e6:0 "Wielkopolski porządek"
 RLES_e6_desc:0 "Gospodarka Leszna pracuje jak w zegarku."
 RLES_m1:0 "Batalion Leszczyński"
 RLES_m1_desc:0 "Ochotnicy z Leszna tworzą batalion."
 RLES_m2:0 "Pobór w gminach"
 RLES_m2_desc:0 "Gminy wokół Leszna wystawiają kompanie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RLES_m3:0 "Magazyny w Lesznie"
 RLES_m3_desc:0 "Magazyny oddają broń i wyposażenie.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RLES_m4:0 "Dywizja Leszczyńska"
 RLES_m4_desc:0 "Batalion staje się dywizją z artylerią."
 RLES_m5:0 "Lotnicy z Leszna"
 RLES_m5_desc:0 "Szybownicy zostają zwiadowcami armii."
 RLES_d0:0 "Granica z protektoratami"
 RLES_d0_desc:0 "Na zachodzie i południu niemieckie protektoraty, na wschodzie Kalisz. Leszno musi wybrać sojuszników."
 RLES_s1:0 "Związek Zachodniej Wielkopolski"
 RLES_s1_desc:0 "Leszno proponuje sąsiadom wspólną obronę granicy."
 RLES_s2:0 "Wspólna straż graniczna"
 RLES_s2_desc:0 "Członkowie Związku mają wspólną straż na granicy z protektoratami."
 RLES_pomoc:0 "Pomoc z zagranicy"
 RLES_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RLES_samodzielnosc:0 "Bez obcych pieniędzy"
 RLES_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RLES_s3:0 "Jedna Wielkopolska Zachodnia"
 RLES_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RLES_w1:0 "Wojna z [KLS.GetNameDef]"
 RLES_w1_desc:0 "[KLS.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RLES_w2:0 "Wojna z [NOT.GetNameDef]"
 RLES_w2_desc:0 "[NOT.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RLES_region:0 "Ziemia Leszczyńska"
 RLES_region_desc:0 "Leszno jest stolicą małego, porządnego państwa."
 RLES_centralizacja:0 "Centralizacja"
 RLES_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RLES_porozumienie:0 "Porozumienie z samorządami"
 RLES_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RLES_pl1:0 "Więcej niż region"
 RLES_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RLES_pl2:0 "Marsz na Warszawę"
 RLES_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RLES_pl3:0 "Rzeczpospolita Odrodzona"
 RLES_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RLES_zuzel:0 "Stadion im. Alfreda Smoczyka"
 RLES_zuzel_desc:0 "Stadion staje się miejscem wieców, festynów i zbiórek. Leszno ma swoje święto co tydzień."
 RSUW_start:0 "Suwalszczyzna"
 RSUW_start_desc:0 "Suwałki ogłaszają niezależność. Wojewoda Suwalski mówi wprost: „Jesteśmy najbardziej niebezpiecznym miejscem w Europie. Nikt nas nie obroni, jeśli nie zrobimy tego sami”."
 RSUW_porzadek:0 "Patrole na granicy"
 RSUW_porzadek_desc:0 "Straż Graniczna i ochotnicy pilnują granic z Litwą, Białorusią i obwodem królewieckim."
 RSUW_zaopatrzenie:0 "Handel z Litwą"
 RSUW_zaopatrzenie_desc:0 "Przejście w Budzisku znów działa. Litewskie ciężarówki przywożą paliwo i leki."
 RSUW_wladza:0 "Rada Suwalszczyzny"
 RSUW_wladza_desc:0 "Rada zbiera się w Suwałkach. Przy stole siedzą Polacy, Litwini z Puńska i oficerowie brygady."
 RSUW_wybor:0 "Jak bronić przesmyku?"
 RSUW_wybor_desc:0 "Otwarta republika, przyjaźń z Litwą czy twierdza pod rządami wojska? Suwałki muszą wybrać."
 RSUW_a1:0 "Rada Suwalszczyzny"
 RSUW_a1_desc:0 "Rada przejmuje pełnię władzy."
 RSUW_a2:0 "Wybory na pograniczu"
 RSUW_a2_desc:0 "Pierwsze wybory na Suwalszczyźnie od rozpadu. Litwini z Puńska mają własnych kandydatów."
 RSUW_a3:0 "Otwarte granice"
 RSUW_a3_desc:0 "Granica z Litwą jest otwarta dla handlu i ludzi."
 RSUW_a4:0 "Republika Suwalska"
 RSUW_a4_desc:0 "Suwałki stają się republiką pogranicza."
 RSUW_b1:0 "Most do Wilna"
 RSUW_b1_desc:0 "Delegacja jedzie do Wilna. Suwałki potrzebują przyjaciela – a Litwa potrzebuje spokojnej granicy."
 RSUW_b2:0 "Puńsk i Sejny"
 RSUW_b2_desc:0 "Litwini z Puńska i Polacy z Sejn mają wspólną radę. Dawne spory zostają odłożone."
 RSUW_b3:0 "Wspólna straż"
 RSUW_b3_desc:0 "Polsko-litewskie patrole pilnują granicy z obwodem królewieckim."
 RSUW_b4:0 "Suwalszczyzna Polsko-Litewska"
 RSUW_b4_desc:0 "Suwałki stają się mostem między Polską a Litwą."
 RSUW_c1:0 "Dowództwo brygady"
 RSUW_c1_desc:0 "Dowódca brygady ogłasza stan wojenny na Suwalszczyźnie."
 RSUW_c2:0 "Strefa zamknięta"
 RSUW_c2_desc:0 "Pas przygraniczny staje się strefą zamkniętą."
 RSUW_c3:0 "Umocnienia przesmyku"
 RSUW_c3_desc:0 "Saperzy budują umocnienia wzdłuż całego przesmyku."
 RSUW_c4:0 "Twierdza Przesmyk"
 RSUW_c4_desc:0 "Suwalszczyzna staje się twierdzą."
 RSUW_e1:0 "Prąd z Litwy"
 RSUW_e1_desc:0 "Linia energetyczna z Litwy zasila Suwałki. Pogranicze zależy od sąsiada – na razie."
 RSUW_e2:0 "Strefa w Suwałkach"
 RSUW_e2_desc:0 "Suwalska strefa ekonomiczna znów przyjmuje firmy."
 RSUW_e3:0 "Puszcza Augustowska"
 RSUW_e3_desc:0 "Drewno z Puszczy Augustowskiej to opał, materiał budowlany i towar na sprzedaż."
 RSUW_e4:0 "Via Baltica"
 RSUW_e4_desc:0 "Droga z Białegostoku na Litwę jest naprawiona i strzeżona. Suwałki leżą na szlaku z Polski do krajów bałtyckich.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RSUW_e5:0 "Warsztaty brygady"
 RSUW_e5_desc:0 "Warsztaty wojskowe w Suwałkach naprawiają sprzęt i produkują amunicję.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RSUW_e6:0 "Gospodarka pogranicza"
 RSUW_e6_desc:0 "Pogranicze żyje z tego, że łączy. Handel, drewno i turystyka."
 RSUW_m1:0 "Brygada Suwalska"
 RSUW_m1_desc:0 "Jednostki z Suwałk i Augustowa tworzą brygadę."
 RSUW_m2:0 "Pobór pogranicza"
 RSUW_m2_desc:0 "Mieszkańcy pogranicza zgłaszają się do służby. Wiedzą, co jest po drugiej stronie granicy.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RSUW_m3:0 "Magazyny brygady"
 RSUW_m3_desc:0 "Magazyny wojskowe oddają broń i sprzęt.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RSUW_m4:0 "Dywizja Przesmyku"
 RSUW_m4_desc:0 "Brygada staje się dywizją z artylerią i saperami."
 RSUW_m5:0 "Strażnicy Przesmyku"
 RSUW_m5_desc:0 "Brygada zna każde wzgórze i każde jezioro przesmyku."
 RSUW_d0:0 "Między Rosją a Litwą"
 RSUW_d0_desc:0 "Na północy obwód królewiecki, na wschodzie Litwa i Białoruś, na południu Białystok i Łomża."
 RSUW_s1:0 "Związek Północno-Wschodni"
 RSUW_s1_desc:0 "Suwałki proponują sąsiadom wspólną obronę wschodniej granicy."
 RSUW_s2:0 "Wspólna obrona granicy"
 RSUW_s2_desc:0 "Członkowie Związku mają wspólne dowództwo obrony granicy."
 RSUW_pomoc:0 "Pomoc z zagranicy"
 RSUW_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
