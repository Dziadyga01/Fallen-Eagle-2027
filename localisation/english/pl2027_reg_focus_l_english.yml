 RKRJ_w3_desc:0 "[SCK.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKRJ_region:0 "Wielka Krajna"
 RKRJ_region_desc:0 "Od Wałcza po Nakło – jedno państwo na granicy."
 RKRJ_centralizacja:0 "Centralizacja"
 RKRJ_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RKRJ_porozumienie:0 "Porozumienie z samorządami"
 RKRJ_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RKRJ_pl1:0 "Więcej niż region"
 RKRJ_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RKRJ_pl2:0 "Marsz na Warszawę"
 RKRJ_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RKRJ_pl3:0 "Rzeczpospolita Odrodzona"
 RKRJ_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RKRJ_wal:0 "Wał Pomorski"
 RKRJ_wal_desc:0 "Bunkry z 1945 roku dostają nowe stanowiska i łączność. Granica z protektoratem staje się linią umocnień."
 RGNZ_start:0 "Księstwo Gnieźnieńskie"
 RGNZ_start_desc:0 "Gniezno ogłasza Księstwo Gnieźnieńskie. Na Wzgórzu Lecha zbiera się tłum, a starosta przypomina, że tu zaczynała się Polska."
 RGNZ_porzadek:0 "Straż na Wzgórzu Lecha"
 RGNZ_porzadek_desc:0 "Ochotnicy pilnują katedry, ratusza i dróg wylotowych."
 RGNZ_zaopatrzenie:0 "Spółdzielnie rolnicze"
 RGNZ_zaopatrzenie_desc:0 "Spółdzielnie wokół Gniezna mają magazyny pełne zboża i ziemniaków."
 RGNZ_wladza:0 "Rada Księstwa"
 RGNZ_wladza_desc:0 "Rada zbiera się w ratuszu. Przy stole siedzą ludowcy, proboszczowie i starostowie."
 RGNZ_wybor:0 "Ludowcy, korona czy prymas?"
 RGNZ_wybor_desc:0 "Gniezno musi zdecydować, czy jest stolicą rolników, królów czy Kościoła."
 RGNZ_a1:0 "Ruch ludowy"
 RGNZ_a1_desc:0 "Ludowcy przejmują inicjatywę. Wieś ma decydujący głos."
 RGNZ_a2:0 "Spółdzielnie i samorządy"
 RGNZ_a2_desc:0 "Spółdzielnie i samorządy dostają realną władzę."
 RGNZ_a3:0 "Wybory ludowe"
 RGNZ_a3_desc:0 "Pierwsze wybory w Księstwie."
 RGNZ_a4:0 "Ludowe Księstwo"
 RGNZ_a4_desc:0 "Gniezno staje się państwem ludowców."
 RGNZ_b1:0 "Korona w katedrze"
 RGNZ_b1_desc:0 "Kopia korony Chrobrego zostaje wystawiona w katedrze."
 RGNZ_b2:0 "Drzwi Gnieźnieńskie"
 RGNZ_b2_desc:0 "Sceny z Drzwi Gnieźnieńskich trafiają na plakaty i pieczęcie."
 RGNZ_b3:0 "Rada Koronna"
 RGNZ_b3_desc:0 "Rada Koronna szuka kandydata na króla."
 RGNZ_b4:0 "Królestwo Gnieźnieńskie"
 RGNZ_b4_desc:0 "Gniezno ogłasza się stolicą Królestwa – na razie bez króla."
 RGNZ_c1:0 "Rada przy archidiecezji"
 RGNZ_c1_desc:0 "Rada świeckich przy archidiecezji dostaje głos w sprawach Księstwa."
 RGNZ_c2:0 "Opieka społeczna parafii"
 RGNZ_c2_desc:0 "Parafie prowadzą jadłodajnie, szpitale i szkoły."
 RGNZ_c3:0 "Pokój Boży"
 RGNZ_c3_desc:0 "Gniezno ogłasza „Pokój Boży” – zakaz walk w niedziele i święta. Sąsiedzi traktują to różnie."
 RGNZ_c4:0 "Księstwo Prymasowskie"
 RGNZ_c4_desc:0 "Gniezno jest stolicą duchową – i polityczną."
 RGNZ_e1:0 "Prąd z Konina"
 RGNZ_e1_desc:0 "Linie z Konina są naprawione."
 RGNZ_e2:0 "Zakłady w Gnieźnie"
 RGNZ_e2_desc:0 "Zakłady w Gnieźnie produkują dla Księstwa."
 RGNZ_e3:0 "Wielkopolska wieś"
 RGNZ_e3_desc:0 "Gospodarstwa są najlepiej zorganizowane w kraju. Nadwyżki trafiają do sąsiadów."
 RGNZ_e4:0 "Szlak Piastowski"
 RGNZ_e4_desc:0 "Drogi z Gniezna do Poznania, Trzemeszna i Strzelna są naprawione – szlak, którym jeździli pierwsi królowie.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RGNZ_e5:0 "Warsztaty we Wrześni"
 RGNZ_e5_desc:0 "Zakłady we Wrześni produkują części i amunicję.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RGNZ_e6:0 "Gospodarka Piastów"
 RGNZ_e6_desc:0 "Gniezno ma stabilną gospodarkę opartą na ziemi."
 RGNZ_m1:0 "Drużyna Piastowska"
 RGNZ_m1_desc:0 "Ochotnicy tworzą Drużynę z białym orłem na tarczach."
 RGNZ_m2:0 "Pobór wielkopolski"
 RGNZ_m2_desc:0 "Gminy wystawiają kompanie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RGNZ_m3:0 "Magazyny rezerw"
 RGNZ_m3_desc:0 "Magazyny rezerw oddają broń Drużynie.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RGNZ_m4:0 "Dywizja Gnieźnieńska"
 RGNZ_m4_desc:0 "Drużyna tworzy dywizję z artylerią."
 RGNZ_m5:0 "Drużyna Piastowska"
 RGNZ_m5_desc:0 "Drużyna jest gotowa bronić pierwszej stolicy."
 RGNZ_d0:0 "Wielkopolska podzielona"
 RGNZ_d0_desc:0 "Poznań pod niemieckim protektoratem, Pałuki, Konin i Kalisz – Gniezno musi znaleźć sojuszników."
 RGNZ_s1:0 "Związek Piastowski"
 RGNZ_s1_desc:0 "Gniezno proponuje sąsiadom wspólną obronę."
 RGNZ_s2:0 "Wspólna Drużyna"
 RGNZ_s2_desc:0 "Członkowie Związku mają wspólne dowództwo."
