 RNOT_porzadek:0 "Straż na przeprawach"
 RNOT_porzadek_desc:0 "Ochotnicy pilnują mostów na Noteci."
 RNOT_zaopatrzenie:0 "Magazyny fabryki"
 RNOT_zaopatrzenie_desc:0 "Fabryka porcelany ma zapasy, które można wymienić na żywność."
 RNOT_wladza:0 "Rada Ziemi"
 RNOT_wladza_desc:0 "Rada zbiera się w Chodzieży."
 RNOT_wybor:0 "Wspólnota, Piła czy protektorat?"
 RNOT_wybor_desc:0 "Ziemia musi zdecydować, na czym się oprzeć."
 RNOT_a1:0 "Rada gmin"
 RNOT_a1_desc:0 "Gminy rządzą razem."
 RNOT_a2:0 "Wiece"
 RNOT_a2_desc:0 "Wiece w gminach."
 RNOT_a3:0 "Statut"
 RNOT_a3_desc:0 "Ziemia ma konstytucję."
 RNOT_a4:0 "Nadnotecka Wspólnota"
 RNOT_a4_desc:0 "Ziemia staje się wspólnotą."
 RNOT_b1:0 "Rozmowy z Piłą"
 RNOT_b1_desc:0 "Chodzież szuka oparcia w Pile."
 RNOT_b2:0 "Wspólna obrona"
 RNOT_b2_desc:0 "Straż ćwiczy z garnizonem w Wałczu."
 RNOT_b3:0 "Wspólny rynek"
 RNOT_b3_desc:0 "Cła z Krajną znikają."
 RNOT_b4:0 "Nadnotecka Krajna"
 RNOT_b4_desc:0 "Ziemia wiąże się z Krajną."
 RNOT_c1:0 "Kupcy z Piły i Poznania"
 RNOT_c1_desc:0 "Kupcy z protektoratu otwierają składy w Chodzieży."
 RNOT_c2:0 "Porcelana za paliwo"
 RNOT_c2_desc:0 "Umowa z protektoratem: porcelana za paliwo."
 RNOT_c3:0 "Wolny handel"
 RNOT_c3_desc:0 "Ziemia znosi cła."
 RNOT_c4:0 "Wolny Handel Nadnotecki"
 RNOT_c4_desc:0 "Chodzież żyje z handlu ze wszystkimi."
 RNOT_e1:0 "Prąd dla Chodzieży"
 RNOT_e1_desc:0 "Sieci są naprawione."
 RNOT_e2:0 "Zakłady w Czarnkowie"
 RNOT_e2_desc:0 "Zakłady produkują dla Ziemi."
 RNOT_e3:0 "Porcelana z Chodzieży"
 RNOT_e3_desc:0 "Fabryka porcelany eksportuje swoje wyroby."
 RNOT_e4:0 "Drogi nad Notecią"
 RNOT_e4_desc:0 "Drogi są naprawione.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RNOT_e5:0 "Warsztaty w Ujściu"
 RNOT_e5_desc:0 "Warsztaty produkują amunicję.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RNOT_e6:0 "Porcelana z Chodzieży"
 RNOT_e6_desc:0 "Ziemia ma stabilną gospodarkę."
 RNOT_m1:0 "Straż Noteci"
 RNOT_m1_desc:0 "Ochotnicy tworzą straż."
 RNOT_m2:0 "Pobór gmin"
 RNOT_m2_desc:0 "Gminy wystawiają drużyny.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RNOT_m3:0 "Broń z magazynów"
 RNOT_m3_desc:0 "Magazyny oddają broń.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RNOT_m4:0 "Batalion Nadnotecki"
 RNOT_m4_desc:0 "Straż tworzy batalion."
 RNOT_m5:0 "Straż Noteci"
 RNOT_m5_desc:0 "Noteć jest strzeżona."
 RNOT_d0:0 "Między protektoratami"
 RNOT_d0_desc:0 "Pałuki, Leszno i Krajna – a na zachodzie i południu niemieckie protektoraty."
 RNOT_s1:0 "Związek Nadnotecki"
 RNOT_s1_desc:0 "Chodzież proponuje sąsiadom wspólną obronę."
 RNOT_s2:0 "Wspólna straż"
 RNOT_s2_desc:0 "Członkowie Związku mają wspólną straż."
 RNOT_pomoc:0 "Pomoc z zagranicy"
 RNOT_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RNOT_samodzielnosc:0 "Bez obcych pieniędzy"
 RNOT_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RNOT_s3:0 "Jedna Ziemia Nadnotecka"
 RNOT_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RNOT_w1:0 "Wojna z [PLK.GetNameDef]"
 RNOT_w1_desc:0 "[PLK.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RNOT_w2:0 "Wojna z [LES.GetNameDef]"
 RNOT_w2_desc:0 "[LES.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RNOT_w3:0 "Wojna z [KRJ.GetNameDef]"
 RNOT_w3_desc:0 "[KRJ.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RNOT_region:0 "Ziemia Nadnotecka"
 RNOT_region_desc:0 "Jedno państwo nad Notecią."
 RNOT_centralizacja:0 "Centralizacja"
 RNOT_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RNOT_porozumienie:0 "Porozumienie z samorządami"
 RNOT_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RNOT_pl1:0 "Więcej niż region"
 RNOT_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RNOT_pl2:0 "Marsz na Warszawę"
 RNOT_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RNOT_pl3:0 "Rzeczpospolita Odrodzona"
 RNOT_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
