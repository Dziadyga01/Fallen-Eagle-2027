 RGNZ_katedra:0 "Katedra prymasowska"
 RGNZ_katedra_desc:0 "Katedra staje się miejscem wielkich uroczystości państwowych."
 RKTN_start:0 "Ziemia Łęczycko-Kutnowska"
 RKTN_start_desc:0 "Kutno i Łęczyca ogłaszają wspólne państwo. Na dworcu w Kutnie zawisa nowa flaga – i nowy rozkład jazdy."
 RKTN_porzadek:0 "Straż kolejowa"
 RKTN_porzadek_desc:0 "Straż Ochrony Kolei pilnuje węzła i magazynów."
 RKTN_zaopatrzenie:0 "Magazyny przeładunkowe"
 RKTN_zaopatrzenie_desc:0 "Magazyny przy węźle są pełne towarów, które utknęły po rozpadzie."
 RKTN_wladza:0 "Rada Ziemi"
 RKTN_wladza_desc:0 "Rada zbiera się w Kutnie. Łęczyca żąda połowy miejsc."
 RKTN_wybor:0 "Gminy, kolej czy gród?"
 RKTN_wybor_desc:0 "Ziemia musi zdecydować, kto rządzi."
 RKTN_a1:0 "Rada Gmin"
 RKTN_a1_desc:0 "Gminy wysyłają przedstawicieli do Kutna."
 RKTN_a2:0 "Wybory"
 RKTN_a2_desc:0 "Pierwsze wybory w Ziemi."
 RKTN_a3:0 "Statut"
 RKTN_a3_desc:0 "Ziemia ma konstytucję."
 RKTN_a4:0 "Republika Kutnowska"
 RKTN_a4_desc:0 "Kutno staje się republiką."
 RKTN_b1:0 "Dyrektor węzła"
 RKTN_b1_desc:0 "Dyrektor węzła kolejowego przejmuje władzę."
 RKTN_b2:0 "Opłaty za przejazd"
 RKTN_b2_desc:0 "Każdy pociąg płaci. Kasa się zapełnia."
 RKTN_b3:0 "Kolejarze w urzędach"
 RKTN_b3_desc:0 "Urzędy obejmują kolejarze."
 RKTN_b4:0 "Dyrekcja Węzła"
 RKTN_b4_desc:0 "Ziemią rządzi dyrekcja kolei."
 RKTN_c1:0 "Zamek w Łęczycy"
 RKTN_c1_desc:0 "Zamek w Łęczycy staje się siedzibą władzy."
 RKTN_c2:0 "Diabeł Boruta"
 RKTN_c2_desc:0 "Legenda o diable Borucie, który pilnuje skarbów w lochach zamku, staje się symbolem Ziemi. „Nawet diabeł broni Łęczycy”."
 RKTN_c3:0 "Kolegiata w Tumie"
 RKTN_c3_desc:0 "Romańska kolegiata w Tumie jest miejscem uroczystości państwowych."
 RKTN_c4:0 "Księstwo Łęczyckie"
 RKTN_c4_desc:0 "Łęczyca znów jest stolicą dzielnicy."
 RKTN_e1:0 "Prąd z Konina i Płocka"
 RKTN_e1_desc:0 "Linie energetyczne są naprawione."
 RKTN_e2:0 "Zakłady w Kutnie"
 RKTN_e2_desc:0 "Zakłady w Kutnie produkują dla Ziemi."
 RKTN_e3:0 "Węzeł Kutno"
 RKTN_e3_desc:0 "Węzeł znów działa. Każdy pociąg płaci za przejazd."
 RKTN_e4:0 "Autostrada A1"
 RKTN_e4_desc:0 "Odcinek A1 przez Ziemię jest strzeżony i naprawiony.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RKTN_e5:0 "Warsztaty kolejowe"
 RKTN_e5_desc:0 "Warsztaty produkują części i amunicję.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RKTN_e6:0 "Kutnowska logistyka"
 RKTN_e6_desc:0 "Kutno żyje z tego, że wszystko przez nie przejeżdża."
 RKTN_m1:0 "Batalion Nadbzurzański"
 RKTN_m1_desc:0 "Ochotnicy tworzą batalion."
 RKTN_m2:0 "Pobór gmin"
 RKTN_m2_desc:0 "Gminy wystawiają kompanie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RKTN_m3:0 "Magazyny kolejowe"
 RKTN_m3_desc:0 "Wojsko przejmuje sprzęt z magazynów.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RKTN_m4:0 "Dywizja Kutnowska"
 RKTN_m4_desc:0 "Batalion staje się dywizją."
 RKTN_m5:0 "Pamięć Bzury"
 RKTN_m5_desc:0 "Żołnierze przysięgają na sztandar bitwy nad Bzurą."
 RKTN_d0:0 "W środku Polski"
 RKTN_d0_desc:0 "Łódź, Konin, Płock, Łowicz i Sieradz – Kutno leży w samym środku rozbitego kraju."
 RKTN_s1:0 "Związek Nadbzurzański"
 RKTN_s1_desc:0 "Kutno proponuje sąsiadom wspólną obronę."
 RKTN_s2:0 "Wspólny węzeł"
 RKTN_s2_desc:0 "Członkowie Związku korzystają z węzła bez opłat."
 RKTN_pomoc:0 "Pomoc z zagranicy"
 RKTN_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RKTN_samodzielnosc:0 "Bez obcych pieniędzy"
 RKTN_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RKTN_s3:0 "Jedna ziemia nad Bzurą"
 RKTN_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RKTN_w1:0 "Wojna z [LWC.GetNameDef]"
 RKTN_w1_desc:0 "[LWC.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKTN_w2:0 "Wojna z [KON.GetNameDef]"
 RKTN_w2_desc:0 "[KON.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKTN_w3:0 "Wojna z [PLO.GetNameDef]"
 RKTN_w3_desc:0 "[PLO.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKTN_region:0 "Ziemia Nadbzurzańska"
 RKTN_region_desc:0 "Kutno jest stolicą ziemi nad Bzurą."
 RKTN_centralizacja:0 "Centralizacja"
 RKTN_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RKTN_porozumienie:0 "Porozumienie z samorządami"
 RKTN_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RKTN_pl1:0 "Więcej niż region"
 RKTN_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RKTN_pl2:0 "Marsz na Warszawę"
 RKTN_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RKTN_pl3:0 "Rzeczpospolita Odrodzona"
 RKTN_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RKTN_boruta:0 "Strażnik skarbów"
 RKTN_boruta_desc:0 "W lochach zamku w Łęczycy urządzono skarbiec Ziemi. Strażnicy mówią, że pilnuje go Boruta – i nikt nie próbuje sprawdzić."
 RLOW_start:0 "Księstwo Łowickie"
 RLOW_start_desc:0 "Łowicz ogłasza Księstwo Łowickie. Nazwa przypomina dawne księstwo z XIX wieku – i rzeczywiście ma w sobie coś z bajki."
 RLOW_porzadek:0 "Straż na A2"
 RLOW_porzadek_desc:0 "Autostrada A2 przechodzi obok Łowicza. Straż kontroluje ruch."
 RLOW_zaopatrzenie:0 "Mleczarnie i sady"
 RLOW_zaopatrzenie_desc:0 "Mleczarnie i sady mają nadwyżki."
 RLOW_wladza:0 "Rada Księstwa"
 RLOW_wladza_desc:0 "Rada zbiera się w ratuszu na Starym Rynku."
 RLOW_wybor:0 "Stronnictwo, prymasi czy Sochaczew?"
 RLOW_wybor_desc:0 "Łowicz musi zdecydować, kto rządzi Księstwem."
 RLOW_a1:0 "Stronnictwo Księżackie"
 RLOW_a1_desc:0 "Stronnictwo regionalne przejmuje inicjatywę."
 RLOW_a2:0 "Pasiaki na flagach"
 RLOW_a2_desc:0 "Barwy łowickich pasiaków trafiają na flagę Księstwa."
 RLOW_a3:0 "Boże Ciało"
 RLOW_a3_desc:0 "Procesja Bożego Ciała staje się świętem państwowym."
 RLOW_a4:0 "Księstwo Łowickie"
 RLOW_a4_desc:0 "Łowicz rządzi się po swojemu."
 RLOW_b1:0 "Rezydencja prymasów"
 RLOW_b1_desc:0 "Dawna rezydencja prymasów staje się siedzibą władzy."
 RLOW_b2:0 "Kolegiata łowicka"
 RLOW_b2_desc:0 "Kolegiata – „mała katedra” – jest centrum życia Księstwa."
 RLOW_b3:0 "Rada przy kolegiacie"
 RLOW_b3_desc:0 "Rada duchownych i świeckich rządzi Księstwem."
 RLOW_b4:0 "Księstwo Prymasowskie"
 RLOW_b4_desc:0 "Łowicz wraca do tradycji prymasów."
 RLOW_c1:0 "Rozmowy z Sochaczewem"
 RLOW_c1_desc:0 "Kanclerz Republiki Wolnościowej proponuje unię gospodarczą."
 RLOW_c2:0 "Zniesienie ceł"
 RLOW_c2_desc:0 "Cła między Łowiczem a Sochaczewem znikają."
 RLOW_c3:0 "Wolny rynek"
 RLOW_c3_desc:0 "Łowicz przyjmuje zasady wolnego rynku."
 RLOW_c4:0 "Unia Wolnościowa"
 RLOW_c4_desc:0 "Łowicz wiąże się z Sochaczewem."
 RLOW_e1:0 "Prąd dla Łowicza"
 RLOW_e1_desc:0 "Linie energetyczne są naprawione."
 RLOW_e2:0 "Przetwórnie owoców"
 RLOW_e2_desc:0 "Przetwórnie produkują soki, dżemy i susz."
 RLOW_e3:0 "Łowickie mleko"
 RLOW_e3_desc:0 "Mleczarnie sprzedają mleko i sery sąsiadom."
 RLOW_e4:0 "Drogi do Skierniewic"
 RLOW_e4_desc:0 "Drogi do Skierniewic i Głowna są naprawione.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RLOW_e5:0 "Warsztaty w Skierniewicach"
 RLOW_e5_desc:0 "Warsztaty produkują amunicję.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RLOW_e6:0 "Łowickie mleko i sady"
 RLOW_e6_desc:0 "Łowicz karmi sąsiadów."
 RLOW_m1:0 "Gwardia Księżacka"
 RLOW_m1_desc:0 "Ochotnicy tworzą gwardię."
 RLOW_m2:0 "Pobór gmin"
 RLOW_m2_desc:0 "Gminy wystawiają kompanie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RLOW_m3:0 "Magazyny rezerw"
 RLOW_m3_desc:0 "Magazyny oddają broń.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RLOW_m4:0 "Dywizja Łowicka"
 RLOW_m4_desc:0 "Gwardia tworzy dywizję."
 RLOW_m5:0 "Gwardia Księżacka"
 RLOW_m5_desc:0 "Gwardia jest gotowa."
 RLOW_d0:0 "Między Warszawą a Łodzią"
 RLOW_d0_desc:0 "Sochaczew, Łódź, Kutno i Piotrków – Łowicz leży między wielkimi."
 RLOW_s1:0 "Związek Księżacki"
 RLOW_s1_desc:0 "Łowicz proponuje sąsiadom wspólną obronę."
 RLOW_s2:0 "Wspólne jarmarki"
 RLOW_s2_desc:0 "Członkowie Związku handlują bez ceł."
