 RGRU_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RGRU_s3:0 "Wolne Miasta Wisły"
 RGRU_s3_desc:0 "Liga ma stać się jednym państwem ze stolicą w twierdzy nad Wisłą."
