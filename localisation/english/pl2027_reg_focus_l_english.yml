 RTUC_b1_desc:0 "Gwara wraca do szkół i urzędów."
 RTUC_b2:0 "Tradycje Borów"
 RTUC_b2_desc:0 "Święta i obrzędy borowiackie stają się świętami państwowymi."
 RTUC_b3:0 "Rada Bractwa"
 RTUC_b3_desc:0 "Bractwo przejmuje władzę."
 RTUC_b4:0 "Bractwo Borowiackie"
 RTUC_b4_desc:0 "Bory rządzą się po swojemu."
