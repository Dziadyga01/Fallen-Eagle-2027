 RCHE_pl2:0 "Marsz na Warszawę"
 RCHE_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RCHE_pl3:0 "Rzeczpospolita Odrodzona"
 RCHE_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RCHE_mury:0 "Mury obronne"
 RCHE_mury_desc:0 "Saperzy umacniają gotyckie mury i baszty."
 RCHZ_start:0 "Wolne Miasto Chełmża"
 RCHZ_start_desc:0 "Chełmża ogłasza się wolnym miastem. Na wieży katedry zawisa flaga miasta, a burmistrz zapewnia, że cukrownia nie stanie."
 RCHZ_porzadek:0 "Straż nad jeziorem"
 RCHZ_porzadek_desc:0 "Ochotnicy pilnują brzegów jeziora i dróg."
 RCHZ_zaopatrzenie:0 "Magazyny cukrowni"
 RCHZ_zaopatrzenie_desc:0 "Magazyny cukrowni są pełne."
 RCHZ_wladza:0 "Rada Miasta"
 RCHZ_wladza_desc:0 "Rada zbiera się w ratuszu przy rynku."
 RCHZ_wybor:0 "Rada, katedra czy cukrownia?"
 RCHZ_wybor_desc:0 "Chełmża musi zdecydować, kto rządzi."
 RCHZ_a1:0 "Rada Miasta"
 RCHZ_a1_desc:0 "Rada przejmuje pełnię władzy."
 RCHZ_a2:0 "Jawny budżet"
 RCHZ_a2_desc:0 "Budżet miasta wisi na tablicy przed ratuszem."
 RCHZ_a3:0 "Wybory"
 RCHZ_a3_desc:0 "Pierwsze wybory."
 RCHZ_a4:0 "Wolne Miasto Chełmża"
 RCHZ_a4_desc:0 "Chełmża jest wolnym miastem."
 RCHZ_b1:0 "Katedra Świętej Trójcy"
 RCHZ_b1_desc:0 "Katedra staje się centrum życia miasta."
 RCHZ_b2:0 "Rada przy katedrze"
 RCHZ_b2_desc:0 "Rada duchownych i świeckich ma decydujący głos."
 RCHZ_b3:0 "Procesje"
 RCHZ_b3_desc:0 "Procesje gromadzą całe miasto."
 RCHZ_b4:0 "Chełmża Katedralna"
 RCHZ_b4_desc:0 "Miastem rządzi Bractwo Katedralne."
 RCHZ_c1:0 "Lewica Cukrownicza"
 RCHZ_c1_desc:0 "Pracownicy cukrowni zakładają komitet."
 RCHZ_c2:0 "Plantatorzy i robotnicy"
 RCHZ_c2_desc:0 "Plantatorzy buraków i robotnicy cukrowni mają wspólną radę."
 RCHZ_c3:0 "Rada Cukrowni"
 RCHZ_c3_desc:0 "Rada cukrowni przejmuje władzę."
 RCHZ_c4:0 "Cukrowa Republika"
 RCHZ_c4_desc:0 "Chełmżą rządzą ci, którzy robią cukier."
 RCHZ_e1:0 "Prąd z Torunia"
 RCHZ_e1_desc:0 "Linie z Torunia są naprawione."
 RCHZ_e2:0 "Warsztaty w Chełmży"
 RCHZ_e2_desc:0 "Warsztaty produkują dla miasta."
 RCHZ_e3:0 "Cukrownia Chełmża"
 RCHZ_e3_desc:0 "Cukrownia pracuje na pełnych obrotach. Cukier płynie do Torunia, Grudziądza i Rypina."
 RCHZ_e4:0 "Kolej do Torunia"
 RCHZ_e4_desc:0 "Pociągi do Torunia znów jeżdżą.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RCHZ_e5:0 "Warsztaty mechaniczne"
 RCHZ_e5_desc:0 "Warsztaty produkują amunicję.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RCHZ_e6:0 "Cukrownia Chełmża"
 RCHZ_e6_desc:0 "Chełmża ma stabilną gospodarkę."
 RCHZ_m1:0 "Straż Jeziora"
 RCHZ_m1_desc:0 "Ochotnicy tworzą straż."
 RCHZ_m2:0 "Pobór gmin"
