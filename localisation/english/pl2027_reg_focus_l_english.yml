 RGRU_region:0 "Ziemia Grudziądzka"
 RGRU_region_desc:0 "Grudziądz jest stolicą, nie twierdzą na pograniczu. Od Wisły po Drwęcę – jedna władza."
 RGRU_centralizacja:0 "Centralizacja"
 RGRU_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
