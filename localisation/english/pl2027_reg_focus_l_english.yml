 RLBW_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RLBW_s3:0 "Jedno pojezierze"
 RLBW_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego księstwa."
 RLBW_w1:0 "Wojna z [WMZ.GetNameDef]"
 RLBW_w1_desc:0 "[WMZ.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RLBW_w2:0 "Wojna z [ZKR.GetNameDef]"
 RLBW_w2_desc:0 "[ZKR.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RLBW_w3:0 "Wojna z [GNL.GetNameDef]"
 RLBW_w3_desc:0 "[GNL.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RLBW_region:0 "Pojezierze Iławskie"
 RLBW_region_desc:0 "Od Ostródy po Nowe Miasto – jedno księstwo nad jeziorami."
 RLBW_centralizacja:0 "Centralizacja"
 RLBW_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RLBW_porozumienie:0 "Porozumienie z samorządami"
 RLBW_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RLBW_pl1:0 "Więcej niż region"
 RLBW_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RLBW_pl2:0 "Marsz na Warszawę"
 RLBW_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RLBW_pl3:0 "Rzeczpospolita Odrodzona"
 RLBW_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RLBW_jeziorak:0 "Flotylla jeziorna"
 RLBW_jeziorak_desc:0 "Łodzie żaglowe i motorówki z przystani w Iławie dostają karabiny maszynowe. Jeziorak jest najdłuższym jeziorem w Polsce – i najlepszą drogą przez Księstwo."
 RPLK_start:0 "Księstwo Pałuckie"
 RPLK_start_desc:0 "Żnin ogłasza Księstwo Pałuckie. Burmistrz mówi, że ziemia, na której stał Biskupin, przetrwa każdy rozpad."
 RPLK_porzadek:0 "Palisady na drogach"
 RPLK_porzadek_desc:0 "Na wjazdach do miasteczek stają zapory z drewna i opon. Stare grody wracają w nowej formie."
 RPLK_zaopatrzenie:0 "Cukrownia w Żninie"
 RPLK_zaopatrzenie_desc:0 "Magazyny cukrowni są pełne. Cukier staje się walutą Pałuk."
 RPLK_wladza:0 "Rada Pałucka"
 RPLK_wladza_desc:0 "Rada zbiera się w ratuszu w Żninie, pod wieżą z XIV wieku."
 RPLK_wybor:0 "Wiec, książę czy spółdzielnie?"
 RPLK_wybor_desc:0 "Pałuki muszą zdecydować, kto rządzi grodami."
 RPLK_a1:0 "Wiec w Biskupinie"
 RPLK_a1_desc:0 "Mieszkańcy zbierają się na wiecu w rekonstruowanym grodzie w Biskupinie."
 RPLK_a2:0 "Głosowanie przez podniesienie ręki"
 RPLK_a2_desc:0 "Najważniejsze decyzje zapadają na wiecu, przez podniesienie ręki."
 RPLK_a3:0 "Rada Starszych"
 RPLK_a3_desc:0 "Wiec wybiera radę starszych, która rządzi między wiecami."
 RPLK_a4:0 "Wspólnota Pałucka"
 RPLK_a4_desc:0 "Pałuki stają się wspólnotą – najstarszą formą demokracji w Polsce."
 RPLK_b1:0 "Herb Topór"
 RPLK_b1_desc:0 "Herb rodu Pałuków wraca na pieczęcie."
 RPLK_b2:0 "Elekcja księcia"
 RPLK_b2_desc:0 "Rada wybiera księcia na dożywocie."
 RPLK_b3:0 "Dwór w Żninie"
 RPLK_b3_desc:0 "Książę urzęduje w ratuszu w Żninie – skromnie, ale z ceremoniałem."
 RPLK_b4:0 "Księstwo Pałuk"
 RPLK_b4_desc:0 "Pałuki mają księcia. Tradycja wraca."
 RPLK_c1:0 "Spółdzielnia cukrowni"
 RPLK_c1_desc:0 "Pracownicy i plantatorzy przejmują cukrownię."
 RPLK_c2:0 "Spółdzielnie rolnicze"
 RPLK_c2_desc:0 "Gospodarstwa łączą się w spółdzielnie."
 RPLK_c3:0 "Rada Spółdzielni"
 RPLK_c3_desc:0 "Rada spółdzielni rządzi Księstwem."
 RPLK_c4:0 "Spółdzielcze Pałuki"
 RPLK_c4_desc:0 "Pałuki należą do tych, którzy na nich pracują."
 RPLK_e1:0 "Prąd z Bydgoszczy"
 RPLK_e1_desc:0 "Linie z Bydgoszczy są naprawione. Pałuki płacą za prąd żywnością."
 RPLK_e2:0 "Zakłady w Kcyni"
 RPLK_e2_desc:0 "Zakłady w Kcyni produkują dla Księstwa."
 RPLK_e3:0 "Kolejka wąskotorowa"
 RPLK_e3_desc:0 "Kolejka z Żnina do Gąsawy znów jeździ – wozi zboże, ludzi i żołnierzy. Nie potrzebuje diesla, wystarczy węgiel."
 RPLK_e4:0 "Drogi wśród jezior"
 RPLK_e4_desc:0 "Drogi między jeziorami są naprawione.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RPLK_e5:0 "Warsztaty kolejowe"
 RPLK_e5_desc:0 "Warsztaty kolejki produkują części i amunicję.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RPLK_e6:0 "Cukier i kolejka"
 RPLK_e6_desc:0 "Pałuki mają małą, samowystarczalną gospodarkę."
 RPLK_m1:0 "Drużyny grodowe"
 RPLK_m1_desc:0 "Każde miasteczko wystawia drużynę."
 RPLK_m2:0 "Pobór pałucki"
 RPLK_m2_desc:0 "Gminy wystawiają kompanie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RPLK_m3:0 "Magazyny drużyn"
 RPLK_m3_desc:0 "Myśliwi i rezerwiści oddają broń.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RPLK_m4:0 "Pułk Pałucki"
 RPLK_m4_desc:0 "Drużyny tworzą pułk z artylerią."
 RPLK_m5:0 "Drużyny grodowe"
 RPLK_m5_desc:0 "Drużyny znają bagna i jeziora jak własne podwórko."
 RPLK_d0:0 "Między Bydgoszczą a Gnieznem"
 RPLK_d0_desc:0 "Gniezno, Kujawy, Krajna i Bydgoszcz – Pałuki leżą na skrzyżowaniu."
 RPLK_s1:0 "Związek Pałucko-Krajeński"
 RPLK_s1_desc:0 "Żnin proponuje sąsiadom wspólną obronę."
 RPLK_s2:0 "Wspólne grody"
 RPLK_s2_desc:0 "Członkowie Związku mają wspólne punkty obrony."
 RPLK_pomoc:0 "Pomoc z zagranicy"
 RPLK_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RPLK_samodzielnosc:0 "Bez obcych pieniędzy"
 RPLK_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RPLK_s3:0 "Jedno księstwo"
 RPLK_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RPLK_w1:0 "Wojna z [GNZ.GetNameDef]"
 RPLK_w1_desc:0 "[GNZ.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPLK_w2:0 "Wojna z [KUJ.GetNameDef]"
 RPLK_w2_desc:0 "[KUJ.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPLK_w3:0 "Wojna z [NOT.GetNameDef]"
 RPLK_w3_desc:0 "[NOT.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPLK_region:0 "Wielkie Pałuki"
 RPLK_region_desc:0 "Od Kcyni po Gąsawę – jedno księstwo."
 RPLK_centralizacja:0 "Centralizacja"
 RPLK_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RPLK_porozumienie:0 "Porozumienie z samorządami"
 RPLK_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RPLK_pl1:0 "Więcej niż region"
 RPLK_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RPLK_pl2:0 "Marsz na Warszawę"
 RPLK_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RPLK_pl3:0 "Rzeczpospolita Odrodzona"
 RPLK_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RPLK_biskupin:0 "Duch Biskupina"
 RPLK_biskupin_desc:0 "Biskupin staje się symbolem Księstwa: ludzie przetrwali tu tysiące lat przed państwem – przetrwają i po nim."
 RKRJ_start:0 "Republika Krajeńska"
 RKRJ_start_desc:0 "Piła ogłasza Republikę Krajeńską. Prezydent miasta mówi, że Krajna zawsze była na granicy – i zawsze potrafiła się obronić."
 RKRJ_porzadek:0 "Posterunki na granicy"
 RKRJ_porzadek_desc:0 "Posterunki stają na drogach z protektoratu zachodniopomorskiego."
 RKRJ_zaopatrzenie:0 "Magazyny kolejowe"
 RKRJ_zaopatrzenie_desc:0 "Magazyny przy stacji w Pile są pełne towarów, które utknęły po rozpadzie."
 RKRJ_wladza:0 "Rada Republiki w Pile"
 RKRJ_wladza_desc:0 "Rada zbiera się w ratuszu w Pile. Przy stole siedzą burmistrzowie, kolejarze i oficerowie z Wałcza."
 RKRJ_wybor:0 "Rada, wojsko czy kolej?"
 RKRJ_wybor_desc:0 "Republika musi zdecydować, kto nią rządzi."
 RKRJ_a1:0 "Rada Republiki"
 RKRJ_a1_desc:0 "Rada przejmuje pełnię władzy."
 RKRJ_a2:0 "Wybory w gminach"
 RKRJ_a2_desc:0 "Pierwsze wybory w gminach Krajny."
 RKRJ_a3:0 "Statut Republiki"
 RKRJ_a3_desc:0 "Republika ma konstytucję."
 RKRJ_a4:0 "Demokratyczna Krajna"
 RKRJ_a4_desc:0 "Krajna staje się demokratyczną republiką."
 RKRJ_b1:0 "Komendant z Wałcza"
 RKRJ_b1_desc:0 "Komendant garnizonu przejmuje władzę."
 RKRJ_b2:0 "Wał Pomorski"
 RKRJ_b2_desc:0 "Saperzy odkopują bunkry dawnego Wału Pomorskiego. Fortyfikacje z 1945 roku znów mają bronić granicy."
 RKRJ_b3:0 "Strefa nadgraniczna"
 RKRJ_b3_desc:0 "Pas przygraniczny staje się strefą wojskową."
 RKRJ_b4:0 "Strażnica Krajeńska"
 RKRJ_b4_desc:0 "Krajną rządzi wojsko."
 RKRJ_c1:0 "Kolejarze przejmują stery"
 RKRJ_c1_desc:0 "Związek zawodowy kolejarzy przejmuje władzę w Pile."
 RKRJ_c2:0 "Rozkład jazdy jako ustawa"
 RKRJ_c2_desc:0 "Rozkład jazdy ma moc ustawy. Spóźnienie to wykroczenie."
 RKRJ_c3:0 "Rada Warsztatów"
 RKRJ_c3_desc:0 "Rada warsztatów kolejowych zarządza gospodarką."
 RKRJ_c4:0 "Kolejarska Republika"
 RKRJ_c4_desc:0 "Krajną rządzą kolejarze."
 RKRJ_e1:0 "Prąd dla Piły"
 RKRJ_e1_desc:0 "Ciepłownie w Pile dostają węgiel koleją."
 RKRJ_e2:0 "Zakłady w Pile"
 RKRJ_e2_desc:0 "Dawne zakłady oświetleniowe przestawiają się na produkcję dla Republiki."
 RKRJ_e3:0 "Węzeł Piła"
 RKRJ_e3_desc:0 "Węzeł kolejowy znów działa. Pociągi z Poznania, Szczecina i Bydgoszczy przejeżdżają przez Piłę – i płacą."
 RKRJ_e4:0 "Drogi Krajny"
 RKRJ_e4_desc:0 "Drogi do Złotowa, Wałcza i Trzcianki są naprawione.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RKRJ_e5:0 "Warsztaty kolejowe"
 RKRJ_e5_desc:0 "Warsztaty kolejowe w Pile produkują pociągi pancerne.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RKRJ_e6:0 "Węzeł Piła"
 RKRJ_e6_desc:0 "Piła jest sercem transportu północnej Wielkopolski."
 RKRJ_m1:0 "Garnizon Wałcz"
 RKRJ_m1_desc:0 "Żołnierze z Wałcza tworzą armię Republiki."
 RKRJ_m2:0 "Pobór Krajny"
 RKRJ_m2_desc:0 "Gminy Krajny wystawiają kompanie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RKRJ_m3:0 "Magazyny garnizonu"
 RKRJ_m3_desc:0 "Magazyny w Wałczu oddają broń i sprzęt.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RKRJ_m4:0 "Dywizja Krajeńska"
 RKRJ_m4_desc:0 "Garnizon staje się dywizją z artylerią."
 RKRJ_m5:0 "Garnizon Wałcz"
 RKRJ_m5_desc:0 "Armia Krajny jest gotowa bronić granicy."
 RKRJ_d0:0 "Na granicy protektoratu"
 RKRJ_d0_desc:0 "Na zachodzie niemiecki protektorat, na północy Zabory i Pomorze, na wschodzie Bory i Koronowo."
 RKRJ_s1:0 "Związek Krajeński"
 RKRJ_s1_desc:0 "Piła proponuje sąsiadom wspólną obronę granicy."
 RKRJ_s2:0 "Wspólna obrona granicy"
 RKRJ_s2_desc:0 "Członkowie Związku mają wspólne dowództwo."
