 RKLS_region:0 "Wielkopolska Południowa"
 RKLS_region_desc:0 "Kalisz jest stolicą regionu z dwoma tysiącami lat historii."
 RKLS_centralizacja:0 "Centralizacja"
 RKLS_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RKLS_porozumienie:0 "Porozumienie z samorządami"
 RKLS_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
