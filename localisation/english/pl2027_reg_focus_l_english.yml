 RSWC_start:0 "Świecie"
 RSWC_start_desc:0 "Świecie ogłasza niezależność. Pierwszy dekret zostaje wydrukowany na papierze z miejscowej papierni – w nakładzie stu tysięcy egzemplarzy."
 RSWC_porzadek:0 "Straż papierni"
 RSWC_porzadek_desc:0 "Ochrona papierni staje się pierwszą formacją miasta."
 RSWC_zaopatrzenie:0 "Magazyny nad Wisłą"
 RSWC_zaopatrzenie_desc:0 "Magazyny przy porcie rzecznym są pełne."
 RSWC_wladza:0 "Rada w zamku"
 RSWC_wladza_desc:0 "Rada zbiera się w krzyżackim zamku nad Wdą."
 RSWC_wybor:0 "Samorząd, załoga czy wydawnictwo?"
 RSWC_wybor_desc:0 "Świecie musi zdecydować, kto rządzi."
 RSWC_a1:0 "Rada Gmin"
 RSWC_a1_desc:0 "Gminy wysyłają przedstawicieli do Świecia."
 RSWC_a2:0 "Wybory"
 RSWC_a2_desc:0 "Pierwsze wybory."
 RSWC_a3:0 "Statut"
 RSWC_a3_desc:0 "Świecie ma konstytucję – wydrukowaną na najlepszym papierze w Polsce."
 RSWC_a4:0 "Republika Świecka"
 RSWC_a4_desc:0 "Świecie staje się republiką."
 RSWC_b1:0 "Komitet załogi"
 RSWC_b1_desc:0 "Załoga papierni zakłada komitet."
 RSWC_b2:0 "Papiernia dla ludzi"
 RSWC_b2_desc:0 "Papiernia przechodzi pod zarząd załogi."
 RSWC_b3:0 "Rada Załogi"
 RSWC_b3_desc:0 "Rada Załogi przejmuje władzę."
 RSWC_b4:0 "Papiernicza Republika"
 RSWC_b4_desc:0 "Świeciem rządzą papiernicy."
 RSWC_c1:0 "Drukarnia dla wszystkich"
 RSWC_c1_desc:0 "Świecie drukuje ulotki dla każdego, kto zapłaci."
 RSWC_c2:0 "Zamówienia z Torunia i Bydgoszczy"
 RSWC_c2_desc:0 "Oba miasta drukują w Świeciu swoje kampanie."
 RSWC_c3:0 "Redaktor naczelny"
 RSWC_c3_desc:0 "Redaktor naczelny Wydawnictwa przejmuje władzę."
 RSWC_c4:0 "Wydawnictwo Świeckie"
 RSWC_c4_desc:0 "Państwem rządzi drukarnia."
 RSWC_e1:0 "Elektrociepłownia papierni"
 RSWC_e1_desc:0 "Elektrociepłownia papierni zasila całe miasto."
 RSWC_e2:0 "Zakłady w Świeciu"
 RSWC_e2_desc:0 "Zakłady produkują dla miasta."
 RSWC_e3:0 "Papiernia Świecie"
 RSWC_e3_desc:0 "Papiernia drukuje gazety, ulotki i bony dla całego regionu."
 RSWC_e4:0 "Most przez Wisłę"
 RSWC_e4_desc:0 "Most w Grudziądzu i drogi do Bydgoszczy są naprawione.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RSWC_e5:0 "Warsztaty w Świeciu"
 RSWC_e5_desc:0 "Warsztaty produkują amunicję.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RSWC_e6:0 "Papiernia Świecie"
 RSWC_e6_desc:0 "Świecie ma silną gospodarkę."
 RSWC_m1:0 "Straż Wdy"
 RSWC_m1_desc:0 "Ochotnicy tworzą straż."
 RSWC_m2:0 "Pobór gmin"
 RSWC_m2_desc:0 "Gminy wystawiają drużyny.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RSWC_m3:0 "Broń z magazynów"
 RSWC_m3_desc:0 "Magazyny oddają broń.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RSWC_m4:0 "Batalion Świecki"
 RSWC_m4_desc:0 "Straż tworzy batalion."
 RSWC_m5:0 "Straż Wdy"
 RSWC_m5_desc:0 "Świecie jest gotowe."
 RSWC_d0:0 "Między Borami a Wisłą"
 RSWC_d0_desc:0 "Tuchola, PKP, Osielsko, Grudziądz i Koronowo."
 RSWC_s1:0 "Związek Dolnej Wdy"
 RSWC_s1_desc:0 "Świecie proponuje sąsiadom wspólną obronę."
 RSWC_s2:0 "Wspólna straż"
 RSWC_s2_desc:0 "Członkowie Związku mają wspólną straż."
 RSWC_pomoc:0 "Pomoc z zagranicy"
 RSWC_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RSWC_samodzielnosc:0 "Bez obcych pieniędzy"
 RSWC_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RSWC_s3:0 "Jedna ziemia"
 RSWC_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RSWC_w1:0 "Wojna z [TUC.GetNameDef]"
 RSWC_w1_desc:0 "[TUC.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RSWC_w2:0 "Wojna z [KOC.GetNameDef]"
 RSWC_w2_desc:0 "[KOC.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RSWC_w3:0 "Wojna z [OSD.GetNameDef]"
 RSWC_w3_desc:0 "[OSD.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RSWC_region:0 "Ziemia Świecka"
 RSWC_region_desc:0 "Świecie jest stolicą."
 RSWC_centralizacja:0 "Centralizacja"
 RSWC_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RSWC_porozumienie:0 "Porozumienie z samorządami"
 RSWC_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RSWC_pl1:0 "Więcej niż region"
 RSWC_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RSWC_pl2:0 "Marsz na Warszawę"
 RSWC_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RSWC_pl3:0 "Rzeczpospolita Odrodzona"
 RSWC_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RTUC_start:0 "Tuchola"
 RTUC_start_desc:0 "Tuchola ogłasza niezależność. Nadleśniczy mówi, że Bory przetrwały Krzyżaków, Szwedów i dwie wojny światowe – przetrwają i to."
 RTUC_porzadek:0 "Leśna straż"
 RTUC_porzadek_desc:0 "Leśnicy i myśliwi pilnują dróg przez Bory."
 RTUC_zaopatrzenie:0 "Dary lasu"
 RTUC_zaopatrzenie_desc:0 "Grzyby, jagody, ryby i dziczyzna – Bory karmią mieszkańców."
 RTUC_wladza:0 "Rada Borów"
 RTUC_wladza_desc:0 "Rada zbiera się w Tucholi."
 RTUC_wybor:0 "Wspólnota, bractwo czy straż?"
 RTUC_wybor_desc:0 "Tuchola musi zdecydować, kto rządzi Borami."
 RTUC_a1:0 "Rada gmin leśnych"
 RTUC_a1_desc:0 "Gminy leśne rządzą razem."
 RTUC_a2:0 "Wiece w leśniczówkach"
 RTUC_a2_desc:0 "Wiece odbywają się w leśniczówkach."
 RTUC_a3:0 "Statut Borów"
 RTUC_a3_desc:0 "Bory mają konstytucję."
 RTUC_a4:0 "Wspólnota Borów"
 RTUC_a4_desc:0 "Tuchola staje się wspólnotą."
