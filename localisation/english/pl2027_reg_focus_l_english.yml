 RCHE_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
