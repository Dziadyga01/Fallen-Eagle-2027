 RGNZ_region:0 "Ziemia Gnieźnieńska"
 RGNZ_region_desc:0 "Gniezno znów jest stolicą."
 RGNZ_centralizacja:0 "Centralizacja"
 RGNZ_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
