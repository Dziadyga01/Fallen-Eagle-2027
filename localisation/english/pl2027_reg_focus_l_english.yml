 RCHZ_m4:0 "Batalion Chełmżyński"
 RCHZ_m4_desc:0 "Straż tworzy batalion."
 RCHZ_m5:0 "Straż Jeziora"
 RCHZ_m5_desc:0 "Chełmża jest gotowa."
 RCHZ_d0:0 "Sąsiedzi nad jeziorem"
 RCHZ_d0_desc:0 "Chełmno, Ziemia Dobrzyńska, Lubicz, Grudziądz i Łysomice – a za nimi Toruń."
