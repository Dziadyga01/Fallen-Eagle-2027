 RSUW_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RSUW_s3:0 "Jedno państwo na wschodzie"
 RSUW_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RSUW_w1:0 "Wojna z [BST.GetNameDef]"
 RSUW_w1_desc:0 "[BST.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RSUW_w2:0 "Wojna z [MAZ.GetNameDef]"
 RSUW_w2_desc:0 "[MAZ.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RSUW_w3:0 "Wojna z [NAR.GetNameDef]"
 RSUW_w3_desc:0 "[NAR.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RSUW_region:0 "Ziemia Suwalska"
 RSUW_region_desc:0 "Od Wigier po Biebrzę – jedno państwo pilnujące przesmyku."
 RSUW_centralizacja:0 "Centralizacja"
 RSUW_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RSUW_porozumienie:0 "Porozumienie z samorządami"
 RSUW_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RSUW_pl1:0 "Więcej niż region"
 RSUW_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RSUW_pl2:0 "Marsz na Warszawę"
 RSUW_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RSUW_pl3:0 "Rzeczpospolita Odrodzona"
 RSUW_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RSUW_wigry:0 "Klasztor nad Wigrami"
 RSUW_wigry_desc:0 "Klasztor kamedułów nad Wigrami staje się miejscem spotkań i rozmów pokojowych pogranicza."
 RSUW_umocnienia:0 "Linia przesmyku"
 RSUW_umocnienia_desc:0 "Saperzy budują bunkry i zapory na całej szerokości przesmyku."
 FAB_SUW_przesmyk:0 "Przesmyk suwalski"
 FAB_SUW_przesmyk_desc:0 "Sześćdziesiąt pięć kilometrów między obwodem a Białorusią. Suwałki to najwęższe gardło regionu – i jego najważniejszy punkt."
 FAB_SUW_litwa:0 "Współpraca z Litwą"
 FAB_SUW_litwa_desc:0 "Wilno chce, żeby przesmyk był otwarty – dla siebie i dla sojuszników. Wspólne patrole i dostęp dla wojska."
 FAB_SUW_straz:0 "Straż graniczna regionu"
 FAB_SUW_straz_desc:0 "Pogranicznicy, którzy zostali na posterunkach, pilnują granic z obwodem i z Białorusią."
 FAB_SUW_wigry:0 "Brygada Wigierska"
 FAB_SUW_wigry_desc:0 "Ochotnicy z Suwałk, Augustowa i Sejn. Lasy i jeziora to ich sprzymierzeńcy."
 FAB_SUW_dostawy:0 "Dostawy przez Litwę"
 FAB_SUW_dostawy_desc:0 "Pociągi z Kowna przywożą amunicję i paliwo. Bez nich przesmyk nie wytrzyma długo."
 FAB_SUW_sejny:0 "Pogranicze trzech narodów"
 FAB_SUW_sejny_desc:0 "Polacy, Litwini i Białorusini mieszkają tu od wieków. Region stawia na wspólną obronę, nie na spory."
 FAB_SUW_brama:0 "Brama Północy"
 FAB_SUW_brama_desc:0 "Przesmyk jest zamknięty dla kolumn z obwodu i otwarty dla sojuszników. Suwalszczyzna staje się kluczem do całego regionu."
 RPDL_start:0 "Podlasie Nadbużańskie"
 RPDL_start_desc:0 "Biała Podlaska ogłasza niezależność. Starosta Bialski mówi, że Podlasie zawsze było bramą – i że to brama decyduje, kto przez nią przechodzi."
 RPDL_porzadek:0 "Granica na Bugu"
 RPDL_porzadek_desc:0 "Straż Graniczna zostaje na posterunkach. Po drugiej stronie Bugu uzbrojeni przemytnicy, wspierani przez białoruskie służby, szukają słabych punktów."
 RPDL_zaopatrzenie:0 "Magazyny w Małaszewiczach"
 RPDL_zaopatrzenie_desc:0 "Magazyny terminalu są pełne towarów, których nikt nie odebrał. Podlasie przejmuje je dla mieszkańców."
 RPDL_wladza:0 "Rada Podlasia"
 RPDL_wladza_desc:0 "Rada zbiera się w Białej Podlaskiej. Przy stole: starostowie, oficerowie Straży Granicznej i operatorzy terminalu."
 RPDL_wybor:0 "Jak strzec bramy?"
 RPDL_wybor_desc:0 "Otwarte Podlasie z punktami pomocy, rządy straży granicznej czy kupcy z terminalu? Podlasie musi wybrać."
 RPDL_a1:0 "Rada Podlasia"
 RPDL_a1_desc:0 "Rada przejmuje pełnię władzy."
 RPDL_a2:0 "Punkty pomocy"
 RPDL_a2_desc:0 "Na granicy powstają punkty pomocy dla ludzi, których przemytnicy przeprowadzili przez Bug i zostawili w lesie. Lekarze, żywność i transport do schronisk."
 RPDL_a3:0 "Wolne wybory"
 RPDL_a3_desc:0 "Pierwsze wybory na Podlasiu od rozpadu."
 RPDL_a4:0 "Republika Podlaska"
 RPDL_a4_desc:0 "Podlasie staje się otwartą republiką na granicy."
 RPDL_b1:0 "Dowództwo straży"
 RPDL_b1_desc:0 "Komendant Straży Granicznej przejmuje władzę."
 RPDL_b2:0 "Rozbić siatki przemytników"
 RPDL_b2_desc:0 "Specjalne oddziały rozbijają uzbrojone siatki przemytnicze. Przemycani ludzie trafiają do punktów pomocy, a ich przewodnicy – do aresztu."
 RPDL_b3:0 "Strefa nadgraniczna"
 RPDL_b3_desc:0 "Pas przygraniczny staje się strefą wojskową."
 RPDL_b4:0 "Straż Wschodnia"
 RPDL_b4_desc:0 "Podlasiem rządzi Straż. Granica jest szczelna."
 RPDL_c1:0 "Operatorzy terminalu"
 RPDL_c1_desc:0 "Operatorzy terminalu proponują, by państwem zarządzać jak portem."
 RPDL_c2:0 "Cła i opłaty"
 RPDL_c2_desc:0 "Każdy wagon płaci. Kasa państwa szybko się zapełnia."
 RPDL_c3:0 "Kontrakty ze wschodem i zachodem"
 RPDL_c3_desc:0 "Podlasie handluje ze wszystkimi."
 RPDL_c4:0 "Wolny Port Małaszewicze"
 RPDL_c4_desc:0 "Państwo staje się portem przeładunkowym."
 RPDL_e1:0 "Prąd dla Podlasia"
 RPDL_e1_desc:0 "Lokalne elektrociepłownie dostają węgiel z Bogdanki."
 RPDL_e2:0 "Zakłady w Białej Podlaskiej"
 RPDL_e2_desc:0 "Zakłady w Białej Podlaskiej przestawiają się na produkcję dla państwa."
 RPDL_e3:0 "Terminal Małaszewicze"
 RPDL_e3_desc:0 "Terminal przeładunkowy znów pracuje. Podlasie zarabia na każdym wagonie."
 RPDL_e4:0 "Linia kolejowa E20"
 RPDL_e4_desc:0 "Linia kolejowa z Terespola do Siedlec jest naprawiona i strzeżona.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RPDL_e5:0 "Warsztaty kolejowe"
 RPDL_e5_desc:0 "Warsztaty kolejowe produkują części do pojazdów i broni.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RPDL_e6:0 "Brama na wschód"
 RPDL_e6_desc:0 "Podlasie zarabia na handlu i pilnuje granicy."
 RPDL_m1:0 "Straż Nadbużańska"
 RPDL_m1_desc:0 "Straż Graniczna i ochotnicy tworzą Straż Nadbużańską."
 RPDL_m2:0 "Pobór z gmin"
 RPDL_m2_desc:0 "Gminy nad Bugiem wystawiają kompanie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RPDL_m3:0 "Magazyny garnizonu"
 RPDL_m3_desc:0 "Magazyny wojskowe w Białej Podlaskiej oddają broń.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RPDL_m4:0 "Dywizja Podlaska"
 RPDL_m4_desc:0 "Straż staje się dywizją z artylerią i saperami."
 RPDL_m5:0 "Straż Nadbużańska"
 RPDL_m5_desc:0 "Każdy brod na Bugu jest obserwowany."
 RPDL_d0:0 "Między Lublinem a Siedlcami"
 RPDL_d0_desc:0 "Na zachodzie Lublin i Korona, na wschodzie Białoruś i Ukraina."
 RPDL_s1:0 "Związek Nadbużański"
 RPDL_s1_desc:0 "Podlasie proponuje sąsiadom wspólną obronę granicy."
 RPDL_s2:0 "Wspólna straż na Bugu"
 RPDL_s2_desc:0 "Członkowie Związku mają wspólną straż na Bugu."
 RPDL_pomoc:0 "Pomoc z zagranicy"
 RPDL_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RPDL_samodzielnosc:0 "Bez obcych pieniędzy"
 RPDL_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RPDL_s3:0 "Jedno Podlasie"
 RPDL_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RPDL_w1:0 "Wojna z [PRW.GetNameDef]"
 RPDL_w1_desc:0 "[PRW.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPDL_w2:0 "Wojna z [KKR.GetNameDef]"
 RPDL_w2_desc:0 "[KKR.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPDL_region:0 "Podlasie Południowe"
 RPDL_region_desc:0 "Od Bugu po Łuków – jedno państwo pilnujące wschodniej bramy."
 RPDL_centralizacja:0 "Centralizacja"
 RPDL_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RPDL_porozumienie:0 "Porozumienie z samorządami"
 RPDL_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RPDL_pl1:0 "Więcej niż region"
 RPDL_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RPDL_pl2:0 "Marsz na Warszawę"
 RPDL_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RPDL_pl3:0 "Rzeczpospolita Odrodzona"
 RPDL_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RPDL_lotnisko:0 "Lotnisko w Białej Podlaskiej"
 RPDL_lotnisko_desc:0 "Dawne lotnisko wojskowe znów przyjmuje samoloty."
 RWOL_start:0 "Republika Wolnościowa"
 RWOL_start_desc:0 "Sochaczew ogłasza Republikę Wolnościową. Kanclerz w pierwszym przemówieniu znosi trzy podatki, dwa urzędy i jeden zakaz – „na rozgrzewkę”."
 RWOL_porzadek:0 "Prywatna ochrona"
 RWOL_porzadek_desc:0 "Porządku pilnują prywatne firmy ochroniarskie opłacane przez mieszkańców. Kto nie płaci – dzwoni do sąsiada."
 RWOL_zaopatrzenie:0 "Wolny rynek żywności"
 RWOL_zaopatrzenie_desc:0 "Ceny żywności są wolne. Na targu w Sochaczewie jest wszystko – dla tych, których stać."
 RWOL_wladza:0 "Rada Kanclerska"
 RWOL_wladza_desc:0 "Rada Kanclerska ma pięciu członków i obraduje w kawiarni na rynku. Rachunek płaci każdy za siebie."
 RWOL_wybor:0 "Jak bardzo wolni?"
 RWOL_wybor_desc:0 "Kanclerz bez ministrów, konstytucja wolności czy miasta prywatne? Republika musi wybrać, jak daleko pójść."
 RWOL_a1:0 "Kanclerz decyduje"
 RWOL_a1_desc:0 "Kanclerz ogłasza, że demokracja to „dyktatura większości”. Decyduje sam – szybko i tanio."
 RWOL_a2:0 "Licytacja ministerstw"
 RWOL_a2_desc:0 "Budynki ministerstw zostają sprzedane na licytacji. Pieniądze idą na armię."
 RWOL_a3:0 "Jeden sekretarz"
 RWOL_a3_desc:0 "Cała administracja państwa to Kanclerz i jego sekretarz."
 RWOL_a4:0 "Kanclerstwo Wolnościowe"
 RWOL_a4_desc:0 "Republika staje się kanclerstwem."
 RWOL_b1:0 "Konstytucja Wolności"
 RWOL_b1_desc:0 "Konstytucja ma jedną stronę: własność, wolność słowa i zakaz podnoszenia podatków bez referendum."
 RWOL_b2:0 "Referendum podatkowe"
 RWOL_b2_desc:0 "Mieszkańcy głosują nad podatkami. Wynik jest przewidywalny."
 RWOL_b3:0 "Sądy prywatne"
 RWOL_b3_desc:0 "Spory rozstrzygają prywatne sądy arbitrażowe."
 RWOL_b4:0 "Republika Wolnościowa"
 RWOL_b4_desc:0 "Republika ma konstytucję wolności."
 RWOL_c1:0 "Statut na sprzedaż"
 RWOL_c1_desc:0 "Każda gmina może kupić statut miasta prywatnego z własnym regulaminem."
 RWOL_c2:0 "Miasto Sochaczew S.A."
 RWOL_c2_desc:0 "Sochaczew staje się spółką akcyjną. Mieszkańcy dostają akcje."
 RWOL_c3:0 "Konkurencja miast"
 RWOL_c3_desc:0 "Miasta konkurują o mieszkańców niskimi czynszami i dobrą ochroną."
 RWOL_c4:0 "Konfederacja Miast Prywatnych"
 RWOL_c4_desc:0 "Republika staje się konfederacją miast prywatnych."
 RWOL_e1:0 "Prywatna energetyka"
 RWOL_e1_desc:0 "Elektrownie słoneczne i agregaty na każdym dachu. Kto ma prąd, sprzedaje nadwyżki sąsiadom."
 RWOL_e2:0 "Strefa bez podatków"
 RWOL_e2_desc:0 "Cała Republika jest strefą bez podatku dochodowego. Firmy przeprowadzają się z Warszawy."
 RWOL_e3:0 "Raj podatkowy"
 RWOL_e3_desc:0 "Rejestr spółek w Sochaczewie ma więcej firm niż mieszkańców. Czynsze z biurowców zapełniają kasę."
 RWOL_e4:0 "Prywatne drogi"
 RWOL_e4_desc:0 "Drogi są budowane przez firmy i płatne za przejazd. Asfalt jest najlepszy w regionie.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RWOL_e5:0 "Wolny handel bronią"
 RWOL_e5_desc:0 "Każdy może kupić i sprzedać broń. Sklepy z bronią są na każdej ulicy.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RWOL_e6:0 "Raj podatkowy Mazowsza"
 RWOL_e6_desc:0 "Sochaczew jest najbogatszym miastem regionu – przynajmniej na papierze."
 RWOL_m1:0 "Milicja ochotnicza"
 RWOL_m1_desc:0 "Ochotnicy tworzą milicję. Każdy przynosi własną broń."
 RWOL_m2:0 "Kontrakty najemnicze"
 RWOL_m2_desc:0 "Republika podpisuje kontrakty z prywatnymi firmami wojskowymi.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RWOL_m3:0 "Broń ze sklepów"
 RWOL_m3_desc:0 "Sklepy z bronią przekazują zapasy milicji – za fakturą.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RWOL_m4:0 "Brygada Wolności"
 RWOL_m4_desc:0 "Milicja i najemnicy tworzą brygadę z artylerią."
 RWOL_m5:0 "Milicja ochotnicza"
 RWOL_m5_desc:0 "Armia jest ochotnicza, a żołd płacą sponsorzy."
 RWOL_d0:0 "Wolny handel z sąsiadami"
 RWOL_d0_desc:0 "Radom, Łowicz, Grodzisk i Piaseczno – Republika chce handlować ze wszystkimi."
 RWOL_s1:0 "Liga Wolnego Handlu"
 RWOL_s1_desc:0 "Republika proponuje sąsiadom ligę bez ceł."
 RWOL_s2:0 "Strefa wolnego handlu"
 RWOL_s2_desc:0 "Członkowie Ligi znoszą cła między sobą."
 RWOL_pomoc:0 "Pomoc z zagranicy"
 RWOL_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RWOL_samodzielnosc:0 "Bez obcych pieniędzy"
 RWOL_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RWOL_s3:0 "Wolne Mazowsze"
 RWOL_s3_desc:0 "Członkowie Ligi dostają propozycję wspólnego, wolnościowego państwa."
 RWOL_w1:0 "Wojna z [RAD.GetNameDef]"
 RWOL_w1_desc:0 "[RAD.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RWOL_w2:0 "Wojna z [LOW.GetNameDef]"
 RWOL_w2_desc:0 "[LOW.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RWOL_w3:0 "Wojna z [GRD.GetNameDef]"
 RWOL_w3_desc:0 "[GRD.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RWOL_region:0 "Wolne Mazowsze"
 RWOL_region_desc:0 "Od Sochaczewa po Łowicz – państwo, w którym urzędnik jest gatunkiem zagrożonym."
 RWOL_centralizacja:0 "Centralizacja"
 RWOL_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RWOL_porozumienie:0 "Porozumienie z samorządami"
 RWOL_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RWOL_pl1:0 "Więcej niż region"
 RWOL_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RWOL_pl2:0 "Marsz na Warszawę"
 RWOL_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RWOL_pl3:0 "Rzeczpospolita Odrodzona"
 RWOL_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RWOL_chopin:0 "Żelazowa Wola"
 RWOL_chopin_desc:0 "Dom urodzenia Chopina w Żelazowej Woli staje się miejscem koncertów. Nawet Republika Wolnościowa ma coś, czego nie sprzedaje."
 RDOB_start:0 "Ziemia Dobrzyńska"
 RDOB_start_desc:0 "Starostowie z Rypina, Lipna i Golubia-Dobrzynia podpisują akt odnowienia Ziemi Dobrzyńskiej. Dawna nazwa wraca na mapy po siedmiuset latach."
 RDOB_porzadek:0 "Straż na mostach Drwęcy"
 RDOB_porzadek_desc:0 "Mosty na Drwęcy to bramy ziemi. Ochotnicy z OSP i koła łowieckiego trzymają je dzień i noc."
 RDOB_zaopatrzenie:0 "Skup zboża"
 RDOB_zaopatrzenie_desc:0 "Ziemia skupuje zboże od rolników i przechowuje je w elewatorach w Rypinie. Nikt nie będzie głodował – i nikt nie sprzeda zboża wrogowi."
 RDOB_wladza:0 "Starosta Ziemi Dobrzyńskiej"
 RDOB_wladza_desc:0 "Rada wybiera starostę ziemi. Ma władzę nad strażą, magazynami i drogami – i obowiązek odpowiadać przed sejmikiem."
 RDOB_wybor:0 "Sejmik, zakon czy Płock?"
 RDOB_wybor_desc:0 "Sejmik gmin, nowy zakon rycerski czy unia z silnym Płockiem? Ziemia Dobrzyńska musi zdecydować, na czym się oprzeć."
 RDOB_a1:0 "Sejmik w Rypinie"
 RDOB_a1_desc:0 "Gminy wysyłają delegatów do Rypina. Sejmik decyduje o podatkach i straży."
 RDOB_a2:0 "Wolne wybory w gminach"
 RDOB_a2_desc:0 "Pierwsze wybory w gminach od rozpadu."
 RDOB_a3:0 "Statut Ziemi"
 RDOB_a3_desc:0 "Statut Ziemi Dobrzyńskiej zostaje uchwalony przez sejmik."
 RDOB_a4:0 "Rzeczpospolita Dobrzyńska"
 RDOB_a4_desc:0 "Ziemia Dobrzyńska staje się rzecząpospolitą gmin."
 RDOB_b1:0 "Pamięć Braci Dobrzyńskich"
 RDOB_b1_desc:0 "Historycy z Rypina przypominają: osiemset lat temu rycerze z Dobrzynia bronili tej ziemi przed Prusami."
 RDOB_b2:0 "Śluby rycerskie"
 RDOB_b2_desc:0 "Pierwsi ochotnicy składają śluby w kościele w Dobrzyniu: bronić ziemi, wiary i słabszych."
 RDOB_b3:0 "Komturia w Golubiu"
 RDOB_b3_desc:0 "Zamek w Golubiu – ten, w którym od lat odbywały się turnieje rycerskie – staje się siedzibą zakonu."
 RDOB_b4:0 "Zakon Braci Dobrzyńskich"
 RDOB_b4_desc:0 "Ziemią rządzi Mistrz Zakonu i kapituła. Zakon na wschodzie ma teraz swoje lustrzane odbicie."
 RDOB_c1:0 "Delegacja do Płocka"
 RDOB_c1_desc:0 "Starosta jedzie do Płocka. Rafineria potrzebuje żywności, Rypin – paliwa i pieniędzy."
 RDOB_c2:0 "Paliwo za zboże"
 RDOB_c2_desc:0 "Umowa handlowa z Płockiem: cysterny jadą do Rypina, ciężarówki ze zbożem – do Płocka."
 RDOB_c3:0 "Wspólna waluta"
 RDOB_c3_desc:0 "Ziemia Dobrzyńska przyjmuje płockie bony paliwowe jako walutę."
 RDOB_c4:0 "Unia Płocka"
 RDOB_c4_desc:0 "Ziemia Dobrzyńska wiąże się z Płockiem unią gospodarczą – niezależna, ale z paliwem w baku."
 RDOB_e1:0 "Prąd z Płocka"
 RDOB_e1_desc:0 "Linie z elektrociepłowni w Płocku są naprawione. Ziemia płaci za prąd zbożem."
 RDOB_e2:0 "Przetwórnie w Rypinie"
 RDOB_e2_desc:0 "Mleczarnie, ubojnie i młyny pracują na trzy zmiany."
 RDOB_e3:0 "Spiżarnia Dobrzyńska"
 RDOB_e3_desc:0 "Nadwyżki żywności idą na sprzedaż do Płocka, Torunia i Grudziądza. Zboże jest lepsze niż złoto."
 RDOB_e4:0 "Drogi między wsiami"
 RDOB_e4_desc:0 "Drogi powiatowe zostają odśnieżone, naprawione i oznakowane – po raz pierwszy od rozpadu.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RDOB_e5:0 "Warsztaty w Lipnie"
 RDOB_e5_desc:0 "Warsztaty w Lipnie produkują amunicję i części do broni.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RDOB_e6:0 "Spiżarnia Dobrzyńska"
 RDOB_e6_desc:0 "Ziemia Dobrzyńska karmi sąsiadów – i na tym buduje swoje znaczenie."
 RDOB_m1:0 "Chorągwie gminne"
 RDOB_m1_desc:0 "Każda gmina wystawia chorągiew z herbem ziemi."
 RDOB_m2:0 "Szlachta zagrodowa"
 RDOB_m2_desc:0 "Potomkowie drobnej szlachty z dobrzyńskich zaścianków zgłaszają się do służby – z dumą i z dziadkowymi szablami na ścianie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RDOB_m3:0 "Broń z koła łowieckiego"
 RDOB_m3_desc:0 "Myśliwi oddają broń i amunicję na potrzeby chorągwi.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RDOB_m4:0 "Pułk Dobrzyński"
 RDOB_m4_desc:0 "Chorągwie łączą się w pułk z artylerią."
 RDOB_m5:0 "Chorągwie Dobrzyńskie"
 RDOB_m5_desc:0 "Dobrzyńskie chorągwie są gotowe bronić rzek i mostów."
 RDOB_d0:0 "Między Płockiem a Grudziądzem"
 RDOB_d0_desc:0 "Płock, Lubawa, Chełmża, Lubicz i Grudziądz – Ziemia Dobrzyńska ma wielu sąsiadów i żadnej gwarancji."
 RDOB_s1:0 "Związek Dobrzyński"
 RDOB_s1_desc:0 "Rypin proponuje sąsiadom wspólną obronę rzek."
 RDOB_s2:0 "Wspólne elewatory"
 RDOB_s2_desc:0 "Członkowie Związku mają wspólne magazyny zboża."
 RDOB_pomoc:0 "Pomoc z zagranicy"
 RDOB_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RDOB_samodzielnosc:0 "Bez obcych pieniędzy"
 RDOB_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RDOB_s3:0 "Jedna ziemia nad Drwęcą"
 RDOB_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RDOB_w1:0 "Wojna z [PLO.GetNameDef]"
 RDOB_w1_desc:0 "[PLO.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RDOB_w2:0 "Wojna z [LBW.GetNameDef]"
 RDOB_w2_desc:0 "[LBW.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RDOB_w3:0 "Wojna z [CHZ.GetNameDef]"
 RDOB_w3_desc:0 "[CHZ.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RDOB_region:0 "Ziemia Dobrzyńsko-Michałowska"
 RDOB_region_desc:0 "Od Golubia po Sierpc – jedna ziemia z jednym starostą."
 RDOB_centralizacja:0 "Centralizacja"
 RDOB_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RDOB_porozumienie:0 "Porozumienie z samorządami"
 RDOB_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RDOB_pl1:0 "Więcej niż region"
 RDOB_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RDOB_pl2:0 "Marsz na Warszawę"
 RDOB_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RDOB_pl3:0 "Rzeczpospolita Odrodzona"
 RDOB_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RDOB_golub:0 "Zamek w Golubiu"
 RDOB_golub_desc:0 "Krzyżacki zamek nad Drwęcą znów staje się twierdzą. Mury z czternastego wieku dostają nowoczesne stanowiska."
 RLBW_start:0 "Księstwo Lubawskie"
 RLBW_start_desc:0 "Lubawa, Iława i Ostróda ogłaszają Księstwo Lubawskie. Nazwa brzmi jak żart – ale w czasach, gdy Toruń wybiera prezydenta, a na wschodzie odrodził się Zakon, nikt się nie śmieje."
 RLBW_porzadek:0 "Straż na drogach S7"
 RLBW_porzadek_desc:0 "Ekspresówka z Gdańska do Warszawy przechodzi przez Księstwo. Straż kontroluje każdą ciężarówkę."
 RLBW_zaopatrzenie:0 "Ryby z Jezioraka"
 RLBW_zaopatrzenie_desc:0 "Rybacy z Iławy łowią na Jezioraku i jeziorach wokół. Ryby i wędzarnie karmią Księstwo przez zimę."
 RLBW_wladza:0 "Rada Księstwa"
 RLBW_wladza_desc:0 "Rada zbiera się w Lubawie, w dawnym zamku biskupów. Przewodniczący przyjmuje tytuł księcia – bo „tak ładniej brzmi w radiu”."
 RLBW_wybor:0 "Jakie księstwo?"
 RLBW_wybor_desc:0 "Rada gmin, kapituła duchowna czy sojusz z Warmią? Księstwo musi zdecydować, czym jest poza nazwą."
 RLBW_a1:0 "Książę-przewodniczący"
 RLBW_a1_desc:0 "Rada ogłasza, że książę jest tylko przewodniczącym. Tytuł zostaje, władza przechodzi do rady."
 RLBW_a2:0 "Wybory w gminach"
 RLBW_a2_desc:0 "Pierwsze wybory w gminach Księstwa."
 RLBW_a3:0 "Konstytucja Księstwa"
 RLBW_a3_desc:0 "Księstwo ma konstytucję – najkrótszą w rozbitej Polsce."
 RLBW_a4:0 "Demokratyczne Księstwo"
 RLBW_a4_desc:0 "Księstwo Lubawskie jest księstwem tylko z nazwy. Rządzi rada."
 RLBW_b1:0 "Sanktuarium św. Anny"
 RLBW_b1_desc:0 "Sanktuarium w Lubawie staje się centrum życia Księstwa."
 RLBW_b2:0 "Kapituła"
 RLBW_b2_desc:0 "Rada duchownych i świeckich przejmuje władzę."
 RLBW_b3:0 "Pielgrzymki"
 RLBW_b3_desc:0 "Pielgrzymki do Lubawy przyciągają ludzi z całego regionu – i ich pieniądze."
 RLBW_b4:0 "Kapitulne Księstwo"
 RLBW_b4_desc:0 "Księstwem rządzi kapituła. Tradycja, porządek i pielgrzymki."
 RLBW_c1:0 "Rozmowy z Olsztynem"
 RLBW_c1_desc:0 "Książę jedzie do Olsztyna. Warmia jest silniejsza – i potrzebuje sojuszników przeciw Zakonowi."
 RLBW_c2:0 "Wspólny rynek"
 RLBW_c2_desc:0 "Cła między Lubawą a Warmią znikają."
 RLBW_c3:0 "Wspólna obrona"
 RLBW_c3_desc:0 "Strzelcy Pojezierza ćwiczą razem z wojskiem Warmii."
 RLBW_c4:0 "Unia Warmińska"
 RLBW_c4_desc:0 "Lubawa wiąże się z Warmią unią – jako partner, nie prowincja."
 RLBW_e1:0 "Prąd dla pojezierza"
 RLBW_e1_desc:0 "Elektrownia wodna i sieci w Iławie są naprawione."
 RLBW_e2:0 "Fabryki Lubawy"
 RLBW_e2_desc:0 "Zakłady w Lubawie szyją namioty, osłony i siatki maskujące – dla Księstwa i na sprzedaż."
 RLBW_e3:0 "Kanał Elbląski"
 RLBW_e3_desc:0 "Pochylnie Kanału Elbląskiego – gdzie statki jadą po trawie – znów działają. Barki wożą drewno i towary do Elbląga."
 RLBW_e4:0 "Węzeł w Iławie"
 RLBW_e4_desc:0 "Iława jest węzłem kolejowym. Pociągi z Gdańska, Olsztyna i Torunia znów się tu spotykają.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RLBW_e5:0 "Warsztaty w Ostródzie"
 RLBW_e5_desc:0 "Hale w Ostródzie przestawiają się na produkcję broni i amunicji.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RLBW_e6:0 "Zakłady Lubawy"
 RLBW_e6_desc:0 "Lubawa szyje sprzęt dla połowy armii regionu."
 RLBW_m1:0 "Strzelcy Pojezierza"
 RLBW_m1_desc:0 "Ochotnicy z Iławy i Ostródy tworzą pierwszy batalion."
 RLBW_m2:0 "Pobór gmin"
 RLBW_m2_desc:0 "Gminy Księstwa wystawiają kompanie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RLBW_m3:0 "Sprzęt z Lubawy"
 RLBW_m3_desc:0 "Fabryki dostarczają wojsku namioty, osłony i siatki maskujące.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RLBW_m4:0 "Dywizja Lubawska"
 RLBW_m4_desc:0 "Strzelcy tworzą dywizję z artylerią."
 RLBW_m5:0 "Strzelcy Pojezierza"
 RLBW_m5_desc:0 "Żołnierze Księstwa znają każdą zatokę i każdy kanał."
 RLBW_d0:0 "Między Warmią a Zakonem"
 RLBW_d0_desc:0 "Na wschodzie Warmia i Zakon, na zachodzie Grudziądz, na południu Płock i Mława."
 RLBW_s1:0 "Związek Pojezierza"
 RLBW_s1_desc:0 "Księstwo proponuje sąsiadom wspólną obronę jezior."
 RLBW_s2:0 "Flotylla na Jezioraku"
 RLBW_s2_desc:0 "Łodzie Związku patrolują jeziora i kanały."
 RLBW_pomoc:0 "Pomoc z zagranicy"
 RLBW_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
