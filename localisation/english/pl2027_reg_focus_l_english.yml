 RTUC_c4:0 "Straż Borów"
 RTUC_c4_desc:0 "Tucholą rządzi straż."
 RTUC_e1:0 "Prąd dla Tucholi"
 RTUC_e1_desc:0 "Sieci są naprawione."
 RTUC_e2:0 "Tartaki"
 RTUC_e2_desc:0 "Tartaki pracują na trzy zmiany."
 RTUC_e3:0 "Gospodarka leśna"
 RTUC_e3_desc:0 "Drewno i żywica idą na sprzedaż."
 RTUC_e4:0 "Drogi przez Bory"
 RTUC_e4_desc:0 "Drogi leśne są przejezdne.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
