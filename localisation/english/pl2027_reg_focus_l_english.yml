 RGRU_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RGRU_pl3:0 "Rzeczpospolita Odrodzona"
 RGRU_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RGRU_spichrze:0 "Bank Zbożowy"
 RGRU_spichrze_desc:0 "Spichrze stają się bankiem: kto złoży zboże, dostaje kwit, który można wymienić w każdym sklepie w mieście."
 RGRU_wodna:0 "Wały nad Wisłą"
 RGRU_wodna_desc:0 "Saperzy umacniają wały i bastiony. Twierdza od strony rzeki staje się nie do zdobycia."
 RKPM_start:0 "Republika Pomorska"
 RKPM_start_desc:0 "Słupsk ogłasza powstanie Republiki Pomorskiej. Prezydent miasta zostaje premierem rządu tymczasowego, a ratusz – siedzibą państwa od Łeby po Bytów."
 RKPM_porzadek:0 "Straż na drodze krajowej"
 RKPM_porzadek_desc:0 "Krajowa szóstka to jedyna droga z Gdańska do Szczecina. Republika ustawia posterunki – i pobiera opłaty."
 RKPM_zaopatrzenie:0 "Ryby z Ustki"
 RKPM_zaopatrzenie_desc:0 "Kutry z Ustki i Łeby wypływają codziennie. Ryba staje się podstawą wyżywienia Republiki – i jej pierwszym towarem eksportowym."
 RKPM_wladza:0 "Rada Republiki w Słupsku"
 RKPM_wladza_desc:0 "W sali ratusza zasiadają burmistrzowie, wójtowie i przedstawiciele Kaszubów. Republika ma rząd – i mnóstwo pytań."
 RKPM_wybor:0 "Czyje Pomorze?"
 RKPM_wybor_desc:0 "Republika gmin, kaszubska autonomia czy sojusz z Trójmiastem? Pomorze musi zdecydować, kim jest."
 RKPM_a1:0 "Rady gmin"
 RKPM_a1_desc:0 "Każda gmina wybiera radę, a rady – delegatów do Słupska. Pomorze rządzi się samo."
 RKPM_a2:0 "Wolne media"
 RKPM_a2_desc:0 "Radio Koszalin i lokalne gazety nadają bez cenzury. Republika chce, żeby wszyscy wiedzieli, co się dzieje."
 RKPM_a3:0 "Statut gmin"
 RKPM_a3_desc:0 "Statut daje gminom prawo do własnych podatków i własnej straży."
 RKPM_a4:0 "Republika Gmin Pomorskich"
 RKPM_a4_desc:0 "Konstytucja Pomorza: gminy, rada, prezydent. Mała demokracja nad dużym morzem."
 RKPM_b1:0 "Zrzeszenie Kaszubsko-Pomorskie"
 RKPM_b1_desc:0 "Zrzeszenie wychodzi z sal muzealnych na ulice. Kaszubi chcą mieć głos w państwie, które powstaje na ich ziemi."
 RKPM_b2:0 "Kaszëbsczi jãzëk"
 RKPM_b2_desc:0 "Kaszubski staje się drugim językiem urzędowym. Tablice w gminach dostają dwie nazwy."
 RKPM_b3:0 "Sejmik kaszubski"
 RKPM_b3_desc:0 "Gminy kaszubskie tworzą sejmik z prawem weta w sprawach ziemi i języka."
 RKPM_b4:0 "Kaszubsko-Pomorska Wspólnota"
 RKPM_b4_desc:0 "Republika staje się wspólnotą Kaszubów i Pomorzan. Gryf na czarno-żółtym tle wisi nad ratuszem."
 RKPM_c1:0 "Telefon do Gdyni"
 RKPM_c1_desc:0 "Premier dzwoni do Gdyni. Port, kolej i bank – Trójmiasto ma wszystko, czego Słupsk potrzebuje."
 RKPM_c2:0 "Kapitał z Trójmiasta"
 RKPM_c2_desc:0 "Firmy z Gdańska i Gdyni otwierają oddziały w Słupsku. Ceny rosną, ale rośnie też liczba miejsc pracy."
 RKPM_c3:0 "Wspólna kolej"
 RKPM_c3_desc:0 "Pociągi z Gdyni jeżdżą do Słupska co godzinę. Pomorze znów jest połączone."
 RKPM_c4:0 "Pomorze Trójmiejskie"
 RKPM_c4_desc:0 "Słupsk wchodzi w orbitę Trójmiasta jako partner, nie prowincja. Przynajmniej na papierze."
 RKPM_e1:0 "Prąd z wiatraków"
 RKPM_e1_desc:0 "Farmy wiatrowe na wybrzeżu zasilają Słupsk. Gdy wieje – Republika ma prąd. Wieje często."
 RKPM_e2:0 "Strefa w Słupsku"
 RKPM_e2_desc:0 "Słupska strefa ekonomiczna znów przyjmuje firmy. Meble, autobusy, opakowania – wszystko się przyda."
 RKPM_e3:0 "Porty Ustki i Łeby"
 RKPM_e3_desc:0 "Nabrzeża zostają pogłębione, a dźwigi naprawione. Pierwszy statek z paliwem wpływa do Ustki od miesięcy."
 RKPM_e4:0 "Kolej przez Pomorze"
 RKPM_e4_desc:0 "Linia Słupsk–Chojnice–Bydgoszcz znów działa. Pociągi wożą drewno, ryby i ludzi.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RKPM_e5:0 "Warsztaty w Redzikowie"
 RKPM_e5_desc:0 "Hangary po dawnej bazie zamieniają się w warsztaty zbrojeniowe. Republika produkuje własną amunicję.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RKPM_e6:0 "Porty Środkowego Pomorza"
 RKPM_e6_desc:0 "Pomorze staje się bramą na morze dla połowy rozbitej Polski."
 RKPM_m1:0 "Pomorska Brygada Obrony"
 RKPM_m1_desc:0 "Ochotnicy z wybrzeża tworzą brygadę: rybacy, leśnicy i ratownicy morscy."
 RKPM_m2:0 "Pobór kaszubski"
 RKPM_m2_desc:0 "Gminy kaszubskie wystawiają własne kompanie – z dowódcami, którzy rozkazy wydają po kaszubsku.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RKPM_m3:0 "Magazyny z Redzikowa"
 RKPM_m3_desc:0 "Magazyny wokół dawnej bazy kryją sprzęt, o którym nikt nie mówił głośno.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RKPM_m4:0 "Dywizja Pomorska"
 RKPM_m4_desc:0 "Brygady tworzą dywizję z artylerią i saperami. Republika może bronić wybrzeża."
 RKPM_m5:0 "Gwardia Wybrzeża"
 RKPM_m5_desc:0 "Gwardia pilnuje plaż, portów i lasów. Każdy port ma swój garnizon."
 RKPM_d0:0 "Między Gdańskiem a Szczecinem"
 RKPM_d0_desc:0 "Na zachodzie Niemcy, na wschodzie Trójmiasto, na południu Bory. Republika musi wybrać sojuszników – albo cele."
 RKPM_s1:0 "Związek Pomorski"
 RKPM_s1_desc:0 "Słupsk proponuje sąsiadom związek: wspólna obrona, wspólne porty i wspólne Pomorze."
 RKPM_s2:0 "Wspólna flota kutrów"
 RKPM_s2_desc:0 "Kutry Związku patrolują wybrzeże. Kto chce przemycać, musi płacić Związkowi."
 RKPM_pomoc:0 "Pomoc z zagranicy"
 RKPM_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RKPM_samodzielnosc:0 "Bez obcych pieniędzy"
 RKPM_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RKPM_s3:0 "Jedno Pomorze"
 RKPM_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa ze stolicą w Słupsku."
 RKPM_w1:0 "Wojna z [CHJ.GetNameDef]"
 RKPM_w1_desc:0 "[CHJ.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKPM_w2:0 "Wojna z [GDY.GetNameDef]"
 RKPM_w2_desc:0 "[GDY.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKPM_w3:0 "Wojna z [SPT.GetNameDef]"
 RKPM_w3_desc:0 "[SPT.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKPM_region:0 "Wielkie Pomorze"
 RKPM_region_desc:0 "Od Łeby po Bory Tucholskie – jedno państwo, jedna flaga z gryfem."
 RKPM_centralizacja:0 "Centralizacja"
 RKPM_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RKPM_porozumienie:0 "Porozumienie z samorządami"
 RKPM_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RKPM_pl1:0 "Więcej niż region"
 RKPM_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RKPM_pl2:0 "Marsz na Warszawę"
 RKPM_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RKPM_pl3:0 "Rzeczpospolita Odrodzona"
 RKPM_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RKPM_gryf:0 "Gryf nad Słupskiem"
 RKPM_gryf_desc:0 "Gryf Pomorski wraca na flagi i pieczęcie. Symbol starszy niż Polska ma przypomnieć, że Pomorze potrafiło przetrwać niejedną burzę."
 RKPM_lasy:0 "Drewno z lasów"
 RKPM_lasy_desc:0 "Lasy Bytowa i Miastka dają drewno na opał, meble i baraki. Tartaki pracują na trzy zmiany."
 RKON_start:0 "Zagłębie Konińskie"
 RKON_start_desc:0 "Konin ogłasza niezależność, zanim ktokolwiek zdążył zapytać o elektrownie. Zarząd spółek energetycznych, prezydent miasta i związki zawodowe podpisują porozumienie o wspólnej władzy."
 RKON_porzadek:0 "Ochrona elektrowni"
 RKON_porzadek_desc:0 "Straż przemysłowa i ochotnicy z kopalń obstawiają elektrownie. Bez prądu nie ma państwa – a każdy sąsiad chciałby go mieć."
 RKON_zaopatrzenie:0 "Węgiel za żywność"
 RKON_zaopatrzenie_desc:0 "Konin wymienia węgiel i prąd na zboże z Kujaw i Kalisza. Handel wymienny działa lepiej niż jakakolwiek waluta."
 RKON_wladza:0 "Porozumienie Konińskie"
 RKON_wladza_desc:0 "Miasto, związki i spółki dzielą się władzą. Każdy ma weto – i każdy wie, że bez pozostałych nie przetrwa."
 RKON_wybor:0 "Kto zarządza prądem?"
 RKON_wybor_desc:0 "Samorząd, związki zawodowe czy zarząd spółki? Zagłębie musi zdecydować, czyj jest węgiel."
 RKON_a1:0 "Rada Zagłębia"
 RKON_a1_desc:0 "Gminy, związki i spółki mają swoich przedstawicieli w Radzie. Spory rozstrzyga się głosowaniem, nie strajkiem."
 RKON_a2:0 "Wybory samorządowe"
 RKON_a2_desc:0 "Pierwsze wybory w Zagłębiu. Frekwencja w osiedlach górniczych bije rekordy."
 RKON_a3:0 "Umowa społeczna"
 RKON_a3_desc:0 "Spółki gwarantują pracę, związki – spokój, a gminy – mieszkania. Umowa na papierze, który wszyscy podpisali."
 RKON_a4:0 "Samorządne Zagłębie"
 RKON_a4_desc:0 "Zagłębie dostaje konstytucję opartą na umowie społecznej. Węgiel należy do wszystkich."
 RKON_b1:0 "Związek Górników i Energetyków"
 RKON_b1_desc:0 "Związek przejmuje inicjatywę. Na cechowni ogłasza, że kopalnie należą do tych, którzy w nich pracują."
 RKON_b2:0 "Barbórka władzy"
 RKON_b2_desc:0 "Na Barbórkę zamiast akademii – wiec. Górnicy w galowych mundurach maszerują pod ratusz."
 RKON_b3:0 "Rada Górnicza"
 RKON_b3_desc:0 "Każda kopalnia i elektrownia wybiera delegatów do Rady Górniczej. Rada ma ostatnie słowo."
 RKON_b4:0 "Górnicza Republika Konińska"
 RKON_b4_desc:0 "Związki rządzą Zagłębiem. Szczęść Boże – i do roboty."
 RKON_c1:0 "Zarząd przejmuje stery"
 RKON_c1_desc:0 "Zarząd spółek energetycznych proponuje „profesjonalne zarządzanie kryzysem”. Prezes zostaje premierem."
 RKON_c2:0 "Ceny rynkowe"
 RKON_c2_desc:0 "Prąd ma cenę rynkową – także dla mieszkańców. Kasa państwa szybko się zapełnia."
 RKON_c3:0 "Kontrakty z sąsiadami"
 RKON_c3_desc:0 "Konin podpisuje kontrakty na dostawy prądu z każdym, kto zapłaci. Polityka? Tylko biznes."
 RKON_c4:0 "Konińska Korporacja Energetyczna"
 RKON_c4_desc:0 "Państwo staje się korporacją. Obywatele są klientami, a rząd – zarządem."
 RKON_e1:0 "Elektrownia Pątnów"
 RKON_e1_desc:0 "Bloki elektrowni wracają do pracy. Konin ma prąd przez całą dobę – jako jedno z niewielu miast w Polsce."
 RKON_e2:0 "Huta aluminium"
 RKON_e2_desc:0 "Huta w Koninie znów leje metal. Aluminium to towar, którego potrzebuje każdy, kto buduje broń."
 RKON_e3:0 "Odkrywka Tomisławice"
 RKON_e3_desc:0 "Nowa odkrywka rusza pełną parą. Węgla wystarczy na lata – o ile ktoś będzie go bronił."
 RKON_e4:0 "Linie przesyłowe"
 RKON_e4_desc:0 "Monterzy naprawiają linie wysokiego napięcia do Kalisza, Gniezna i Kutna. Prąd staje się towarem eksportowym.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RKON_e5:0 "Zakłady remontowe"
 RKON_e5_desc:0 "Warsztaty górnicze naprawiają nie tylko koparki, ale i transportery opancerzone.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RKON_e6:0 "Zagłębie Energetyczne"
 RKON_e6_desc:0 "Konin sprzedaje prąd i aluminium sąsiadom. Jego głos waży więcej niż liczba ludności."
 RKON_m1:0 "Straż Zagłębia"
 RKON_m1_desc:0 "Straż przemysłowa staje się wojskiem. Hełmy górnicze zamieniają się na wojskowe."
 RKON_m2:0 "Górnicy pod bronią"
 RKON_m2_desc:0 "Każda zmiana w kopalni wystawia pluton. Górnicy pracują i ćwiczą na przemian.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RKON_m3:0 "Sprzęt z kopalń"
 RKON_m3_desc:0 "Ciężkie maszyny, materiały wybuchowe i ciężarówki z kopalń trafiają do wojska.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RKON_m4:0 "Dywizja Konińska"
 RKON_m4_desc:0 "Bataliony łączą się w dywizję z saperami i artylerią. Zagłębie potrafi się bronić."
 RKON_m5:0 "Bataliony górnicze"
 RKON_m5_desc:0 "Saperzy z kopalń stają się elitą armii. Nikt nie buduje umocnień szybciej."
 RKON_d0:0 "Prąd dla sąsiadów"
 RKON_d0_desc:0 "Kujawy, Kalisz, Gniezno, Kutno – wszyscy potrzebują prądu z Konina. Pytanie, co dostaniemy w zamian."
 RKON_s1:0 "Porozumienie Energetyczne"
 RKON_s1_desc:0 "Konin proponuje sąsiadom sojusz: tani prąd w zamian za wspólną obronę."
 RKON_s2:0 "Wspólna sieć"
 RKON_s2_desc:0 "Sieci energetyczne sojuszników zostają połączone. Wyłączenie jednego oznacza ciemność u wszystkich."
 RKON_pomoc:0 "Pomoc z zagranicy"
 RKON_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RKON_samodzielnosc:0 "Bez obcych pieniędzy"
 RKON_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RKON_s3:0 "Państwo energetyczne"
 RKON_s3_desc:0 "Sojusznicy dostają propozycję wspólnego państwa. Konin ma prąd – i chce mieć też władzę."
 RKON_w1:0 "Wojna z [WLC.GetNameDef]"
 RKON_w1_desc:0 "[WLC.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKON_w2:0 "Wojna z [GNZ.GetNameDef]"
 RKON_w2_desc:0 "[GNZ.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKON_w3:0 "Wojna z [KLS.GetNameDef]"
 RKON_w3_desc:0 "[KLS.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKON_region:0 "Wschodnia Wielkopolska"
 RKON_region_desc:0 "Od Kłodawy po Słupcę – jedno państwo, jedna sieć, jedna władza."
 RKON_centralizacja:0 "Centralizacja"
 RKON_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RKON_porozumienie:0 "Porozumienie z samorządami"
 RKON_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RKON_pl1:0 "Więcej niż region"
 RKON_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RKON_pl2:0 "Marsz na Warszawę"
 RKON_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RKON_pl3:0 "Rzeczpospolita Odrodzona"
 RKON_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RKON_lichen:0 "Pielgrzymi z Lichenia"
 RKON_lichen_desc:0 "Do sanktuarium w Licheniu przybywają tysiące pielgrzymów z całej rozbitej Polski. Zagłębie zapewnia im bezpieczną drogę – i zyskuje opinię miejsca spokoju."
 RKON_kanal:0 "Warta i kanał Ślesiński"
 RKON_kanal_desc:0 "Barki z węglem płyną Wartą i kanałem Ślesińskim. Woda nie potrzebuje paliwa tyle, co ciężarówki."
 RPRW_start:0 "Zjednoczona Polska Prawica"
 RPRW_start_desc:0 "Rząd w Lublinie ogłasza, że jest jedynym prawowitym rządem Polski. Rząd Przemysława Czarnka (w grze: rola fikcyjna) zapowiada, że państwo przetrwa na wschodzie, jak przetrwało już nieraz."
 RPRW_porzadek:0 "Policja Państwowa"
 RPRW_porzadek_desc:0 "Komendy wojewódzkie z Lublina i Rzeszowa podlegają jednemu ministrowi. Na drogach znów stoją radiowozy z napisem „Rzeczpospolita”."
 RPRW_zaopatrzenie:0 "Rezerwy państwowe"
 RPRW_zaopatrzenie_desc:0 "Magazyny Agencji Rezerw na wschodzie są pełne. Lublin rozdaje paliwo, leki i zboże – każdemu, kto uzna jego władzę."
 RPRW_wladza:0 "Rada Ministrów w Lublinie"
 RPRW_wladza_desc:0 "Ministerstwa mieszczą się w akademikach i salach wykładowych. Ale działają – a to więcej, niż można powiedzieć o większości Polski."
 RPRW_wybor:0 "Jaki rząd dla Rzeczypospolitej?"
 RPRW_wybor_desc:0 "Konserwatywny rząd ocalenia, wielka koalicja wszystkich partii czy władza generałów? Od tego zależy, jaką Polskę Lublin będzie odbudowywał."
 RPRW_a1:0 "Rząd Ocalenia Narodowego"
 RPRW_a1_desc:0 "Premier ogłasza program ocalenia: rodzina, szkoła, Kościół i wojsko mają być filarami państwa w czasie próby."
 RPRW_a2:0 "Szkoła dla Rzeczypospolitej"
 RPRW_a2_desc:0 "Nowy program nauczania: historia, wychowanie obywatelskie i przysposobienie obronne. Lekcje od września – nawet w szkołach z prowizorycznym ogrzewaniem."
 RPRW_a3:0 "Katolicki Uniwersytet Lubelski"
 RPRW_a3_desc:0 "KUL staje się kuźnią kadr państwa. Absolwenci prawa i administracji obejmują urzędy w odzyskanych powiatach."
 RPRW_a4:0 "Rzeczpospolita Polska"
 RPRW_a4_desc:0 "Lublin przestaje mówić o „Zjednoczonej Polskiej Prawicy”. Od dziś to po prostu Rzeczpospolita Polska – jedyna i prawowita."
 RPRW_b1:0 "Okrągły stół w Lublinie"
 RPRW_b1_desc:0 "Premier zaprasza do stołu wszystkie partie – także te, z którymi przez lata się nie zgadzał. Polska jest ważniejsza niż spór."
 RPRW_b2:0 "Rząd wielkiej koalicji"
 RPRW_b2_desc:0 "Ministrowie z czterech partii w jednym rządzie. Konferencje prasowe trwają długo, ale ustawy przechodzą."
 RPRW_b3:0 "Sejm Ustawodawczy"
 RPRW_b3_desc:0 "Posłowie z rozbitych okręgów zbierają się w Lublinie. Mają napisać konstytucję państwa, które jeszcze się nie skończyło rozpadać."
 RPRW_b4:0 "Rzeczpospolita Jedności Narodowej"
 RPRW_b4_desc:0 "Konstytucja jedności: państwo wszystkich obywateli, niezależnie od tego, na kogo głosowali przed rozpadem."
 RPRW_c1:0 "Generałowie tracą cierpliwość"
 RPRW_c1_desc:0 "Dowódcy garnizonów piszą list do premiera: politycy kłócą się, a wróg stoi u bram. Czas na „rząd fachowców w mundurach”."
 RPRW_c2:0 "Stan wojenny na wschodzie"
 RPRW_c2_desc:0 "Wojsko przejmuje kontrolę nad drogami, koleją i radiem. Wybory zostają zawieszone „do odwołania”."
 RPRW_c3:0 "Rada Obrony Państwa"
 RPRW_c3_desc:0 "Rada złożona z generałów i kilku cywilów przejmuje funkcje rządu. Premier zostaje doradcą."
 RPRW_c4:0 "Dowództwo Wschód"
 RPRW_c4_desc:0 "Rzeczpospolitą rządzi wojsko. Cel jest jeden: zjednoczyć kraj – siłą, jeśli trzeba."
 RPRW_e1:0 "Elektrownie wschodu"
 RPRW_e1_desc:0 "Elektrownie w Połańcu i Kozienicach wracają do pracy na pełną moc. Wschód ma prąd, a przemysł może ruszyć."
 RPRW_e2:0 "Zakłady w Puławach"
 RPRW_e2_desc:0 "Azoty w Puławach produkują nawozy dla rolnictwa – i chemię dla przemysłu zbrojeniowego."
 RPRW_e3:0 "Węgiel z Bogdanki"
 RPRW_e3_desc:0 "Kopalnia Bogdanka fedruje na trzy zmiany. Węgiel z Lubelszczyzny zasila huty i elektrownie Rzeczypospolitej."
 RPRW_e4:0 "Drogi ekspresowe wschodu"
 RPRW_e4_desc:0 "S17 i S19 zostają oczyszczone i strzeżone. Kolumny z zaopatrzeniem jadą z Lublina do Rzeszowa w dwie godziny.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RPRW_e5:0 "Huta Stalowa Wola"
 RPRW_e5_desc:0 "Zakłady w Stalowej Woli znów produkują haubice i transportery. Rzeczpospolita ma własną zbrojownię.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RPRW_e6:0 "Przemysł Wschodu"
 RPRW_e6_desc:0 "Świdnik, Puławy, Stalowa Wola i Bogdanka pracują dla jednego państwa. „Polska B” utrzymuje resztę kraju."
 RPRW_m1:0 "Brygady garnizonowe"
 RPRW_m1_desc:0 "Jednostki z Lublina, Chełma i Zamościa tworzą brygady pod jednym dowództwem."
 RPRW_m2:0 "Powszechny obowiązek obrony"
 RPRW_m2_desc:0 "Rząd przywraca pobór. Rezerwiści z całego wschodu stawiają się w koszarach.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RPRW_m3:0 "Magazyny Agencji Mienia"
 RPRW_m3_desc:0 "Magazyny wojskowe na wschodzie oddają broń, amunicję i umundurowanie.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RPRW_m4:0 "Dywizje Rzeczypospolitej"
 RPRW_m4_desc:0 "Brygady łączą się w dywizje z artylerią ze Stalowej Woli. Lublin ma największą armię w rozbitej Polsce."
 RPRW_m5:0 "Armia Rzeczypospolitej"
 RPRW_m5_desc:0 "Szkoły oficerskie, sztab generalny i wspólna przysięga. Armia znów należy do państwa, a nie do województwa."
 RPRW_d0:0 "Polityka wobec ziem polskich"
 RPRW_d0_desc:0 "Podlasie, Radom, Piotrków, Łódź – Lublin uważa ich wszystkich za część Rzeczypospolitej. Pytanie tylko, czy oni o tym wiedzą."
 RPRW_s1:0 "Porozumienie Lubelskie"
 RPRW_s1_desc:0 "Lublin proponuje sąsiadom porozumienie: uznanie rządu w Lublinie za koordynatora obrony w zamian za pomoc i rezerwy."
 RPRW_s2:0 "Wspólne dowództwo"
 RPRW_s2_desc:0 "Sojusznicy oddają swoje jednostki pod wspólne dowództwo w Lublinie. Na mapach sztabowych znów jest jedna linia frontu."
 RPRW_pomoc:0 "Pomoc z zagranicy"
 RPRW_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RPRW_samodzielnosc:0 "Bez obcych pieniędzy"
 RPRW_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RPRW_s3:0 "Powrót do Rzeczypospolitej"
 RPRW_s3_desc:0 "Członkowie Porozumienia dostają propozycję powrotu do Rzeczypospolitej – z zachowaniem samorządu i urzędników."
 RPRW_w1:0 "Wojna z [PDL.GetNameDef]"
 RPRW_w1_desc:0 "[PDL.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPRW_w2:0 "Wojna z [RAD.GetNameDef]"
 RPRW_w2_desc:0 "[RAD.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPRW_w3:0 "Wojna z [PTK.GetNameDef]"
 RPRW_w3_desc:0 "[PTK.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPRW_region:0 "Rzeczpospolita Odrodzona"
 RPRW_region_desc:0 "Od Bugu po Wisłę – Rzeczpospolita nie musi już tłumaczyć, że jest Polską. Teraz musi to udowodnić reszcie kraju."
 RPRW_centralizacja:0 "Centralizacja"
 RPRW_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RPRW_porozumienie:0 "Porozumienie z samorządami"
 RPRW_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RPRW_pl1:0 "Więcej niż region"
 RPRW_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RPRW_pl2:0 "Marsz na Warszawę"
 RPRW_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RPRW_pl3:0 "Rzeczpospolita Odrodzona"
 RPRW_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RPRW_swidnik:0 "Zakłady w Świdniku"
 RPRW_swidnik_desc:0 "Fabryka śmigłowców w Świdniku wraca do pracy. Pierwszy raz od rozpadu nad Lublinem lata coś, co należy do państwa."
 RPRW_trybunal:0 "Trybunał Koronny"
 RPRW_trybunal_desc:0 "W dawnym gmachu Trybunału Koronnego w Lublinie znów zasiadają sędziowie. Sąd najwyższy Rzeczypospolitej ma siedzibę tam, gdzie miał ją przed wiekami."
 RPRW_unia:0 "Pamięć Unii Lubelskiej"
 RPRW_unia_desc:0 "W rocznicę Unii Lubelskiej premier wygłasza mowę: Lublin już raz łączył narody i ziemie. Zrobi to znowu."
 ZPP_frakcje:0 "Partia trzech frakcji"
 ZPP_frakcje_desc:0 "Maślarze, Harcerze i – od niedawna – serwerownia. Kierownictwo musi zdecydować, komu oddać partię."
 ZPP_m_powiaty:0 "Człowiek w każdym powiecie"
 ZPP_m_powiaty_desc:0 "Pełnomocnicy partii w każdym powiecie: rozdzielają pieniądze, pilnują list i pamiętają nazwiska."
 ZPP_m_spolki:0 "Spółki dla swoich"
 ZPP_m_spolki_desc:0 "Rady nadzorcze spółek komunalnych dla zasłużonych działaczy. Lojalność jest pewna, efektywność – mniej."
 ZPP_m_kola:0 "Koła i parafie"
 ZPP_m_kola_desc:0 "Dotacje dla kół gospodyń, straży ochotniczych i parafii. Ludzie z powiatów wiedzą, komu zawdzięczają remont remizy."
 ZPP_m_sasiedzi:0 "Patronat nad sąsiadami"
 ZPP_m_sasiedzi_desc:0 "Lublin wysyła pieniądze i działaczy do konserwatywnych sąsiadów. W zamian – lojalne rady gmin po drugiej stronie granicy."
 ZPP_m_przeciw_ue:0 "Przeciw projektowi europejskiemu"
 ZPP_m_przeciw_ue_desc:0 "Struktury terenowe nie chcą „rządu ze Szczecina”. Lublin ogłasza, że nie przystąpi do żadnej federacji pod nadzorem Brukseli."
 ZPP_m_milicje:0 "Gwardia struktur"
 ZPP_m_milicje_desc:0 "Działacze z powiatów zakładają gwardię: lojalną partii, słabo wyszkoloną, ale zawsze na miejscu."
 ZPP_m_panstwo:0 "Państwo struktur"
 ZPP_m_panstwo_desc:0 "Partia i państwo to jedno. Każdy urząd ma swojego człowieka, każdy człowiek – swoją lojalność."
 ZPP_h_sztab:0 "Sztab programowy"
 ZPP_h_sztab_desc:0 "Analitycy z dawnych ministerstw tworzą sztab: wskaźniki, raporty i budżet zadaniowy dla całego państwa."
 ZPP_h_administracja:0 "Administracja na wynik"
 ZPP_h_administracja_desc:0 "Urzędnik dostaje premię za załatwione sprawy, nie za lojalność. Działacze protestują – petenci są zachwyceni."
 ZPP_h_inwestycje:0 "Program inwestycji wschodnich"
 ZPP_h_inwestycje_desc:0 "Świdnik, Puławy, Stalowa Wola i Bogdanka w jednym planie inwestycyjnym."
 ZPP_h_uklady:0 "Pragmatyczne układy"
 ZPP_h_uklady_desc:0 "Lublin podpisuje umowy z każdym, kto płaci i dotrzymuje słowa – także z liberałami i Sejmem. Ideologia na drugim miejscu."
 ZPP_h_fundusze:0 "Fundusze bez federacji"
 ZPP_h_fundusze_desc:0 "Harcerze negocjują z Brukselą dostęp do funduszy odbudowy bez wstępowania do żadnej federacji. Warunki są twarde, ale pieniądze realne."
 ZPP_h_menedzerowie:0 "Państwo menedżerów"
 ZPP_h_menedzerowie_desc:0 "Lublin rządzony jak dobrze zarządzana spółka. Nudne – i skuteczne."
 ZPP_c_siec:0 "Sieć kierownictwa"
 ZPP_c_siec_desc:0 "Każdy urząd podłączony do jednego systemu. CyberJarek widzi wszystkie wnioski naraz – i odpowiada na wszystkie naraz."
 ZPP_c_automatyzacja:0 "Automatyzacja urzędów"
 ZPP_c_automatyzacja_desc:0 "Kolejki znikają, urzędnicy też. Wnioski rozpatruje system – w kilka sekund, bez odwołania."
 ZPP_c_drony:0 "Fabryka dronów w Świdniku"
 ZPP_c_drony_desc:0 "Zakłady lotnicze produkują drony według projektów, których nikt w zakładach nie rysował."
 ZPP_drony_tb:0 "Fabryka dronów w Świdniku"
 ZPP_c_centralizacja:0 "Centralizacja"
 ZPP_c_centralizacja_desc:0 "Powiaty tracą kompetencje, gminy – budżety. Wszystko przechodzi przez serwerownię w Lublinie."
 ZPP_c_podporzadkowanie:0 "Technologiczne podporządkowanie"
 ZPP_c_podporzadkowanie_desc:0 "Sąsiedzi dostają tani dostęp do systemu: łączność, płatności, rozkłady jazdy. Tylko że wyłącznik jest w Lublinie."
 ZPP_c_izolacja:0 "Cyfrowa suwerenność"
 ZPP_c_izolacja_desc:0 "Lublin odcina się od sieci sąsiadów i od projektów europejskich. Kto chce rozmawiać, musi przejść przez interfejs CyberJarka."
 ZPP_c_wersja3:0 "Wersja 3.0"
 ZPP_c_wersja3_desc:0 "CyberJarek ogłasza aktualizację. Nowa wersja nie potrzebuje już kongresu, prezydium ani partii."
 RLWC_start:0 "Republika Socjaldemokratyczna"
 RLWC_start_desc:0 "Łódź ogłasza Republikę Socjaldemokratyczną. Adrian Zandberg obiecuje państwo, które „nie zostawi nikogo na mrozie” – i pierwszą zimę bez odcięć ogrzewania."
 RLWC_porzadek:0 "Milicja dzielnicowa"
 RLWC_porzadek_desc:0 "Rady osiedli tworzą milicję. Na Bałutach i Widzewie patrolują sąsiedzi, nie najemnicy."
 RLWC_zaopatrzenie:0 "Magazyny przy autostradach"
 RLWC_zaopatrzenie_desc:0 "Centra logistyczne przy węźle A1 i A2 są pełne towarów, których nikt już nie odbierze. Republika przejmuje je dla mieszkańców."
 RLWC_wladza:0 "Rada Republiki w Łodzi"
 RLWC_wladza_desc:0 "Rada zbiera się w Białej Fabryce Geyera. Na ścianach wiszą zdjęcia strajkujących włókniarek – nikt nie uważa tego za przypadek."
 RLWC_wybor:0 "Jaka lewica?"
 RLWC_wybor_desc:0 "Państwo dobrobytu, komuna rad pracowniczych czy koalicja z centrum? Lewica w Łodzi musi wybrać, czy rządzi, czy rewolucjonizuje."
 RLWC_a1:0 "Program 35 godzin"
 RLWC_a1_desc:0 "Rada uchwala 35-godzinny tydzień pracy i płacę minimalną w żywności i bonach. Ekonomiści łapią się za głowę, robotnicy – za transparenty."
 RLWC_a2:0 "Mieszkania komunalne"
 RLWC_a2_desc:0 "Puste mieszkania deweloperów zostają przejęte i przydzielone rodzinom z kolejki. Pierwsze klucze wręcza prezydent miasta."
 RLWC_a3:0 "Publiczna ochrona zdrowia"
 RLWC_a3_desc:0 "Szpitale i przychodnie są darmowe dla wszystkich. Lekarze z całej Polski przyjeżdżają do Łodzi, bo tu ktoś płaci pensje."
 RLWC_a4:0 "Łódzka Republika Socjalna"
 RLWC_a4_desc:0 "Konstytucja socjalna: praca, dach nad głową i lekarz jako prawa obywatela."
 RLWC_b1:0 "Rady pracownicze"
 RLWC_b1_desc:0 "W każdej fabryce rada pracownicza przejmuje zarząd. Dyrektorzy mogą zostać – jako zwykli pracownicy."
 RLWC_b2:0 "Strajk generalny"
 RLWC_b2_desc:0 "Związki ogłaszają strajk generalny przeciw „starym strukturom”. Miasto staje na trzy dni, a potem rusza na nowych zasadach."
 RLWC_b3:0 "Kongres Rad"
 RLWC_b3_desc:0 "Delegaci rad zbierają się w Teatrze Wielkim. Uchwalają, że władza należy do kongresu, nie do rządu."
 RLWC_b4:0 "Komuna Łódzka"
 RLWC_b4_desc:0 "Łódź staje się komuną rad. Nikt nie wie, jak to się skończy – ale wszyscy chcą zobaczyć."
 RLWC_c1:0 "Rozmowy z samorządowcami"
 RLWC_c1_desc:0 "Bezpartyjni samorządowcy z Łodzi i okolic mają pieniądze, urzędników i kontakty. Lewica siada z nimi do stołu."
 RLWC_c2:0 "Wspólny budżet"
 RLWC_c2_desc:0 "Budżet miasta i Republiki jest pisany wspólnie. Mniej obietnic, więcej faktur."
 RLWC_c3:0 "Rząd fachowców"
 RLWC_c3_desc:0 "Ministerstwa obejmują ludzie z doświadczeniem w samorządzie, nie tylko z partii."
 RLWC_c4:0 "Republika Łódzka"
 RLWC_c4_desc:0 "Republika staje się państwem kompromisu. Rewolucja może poczekać – zima nie."
 RLWC_e1:0 "Elektrociepłownie dla miasta"
 RLWC_e1_desc:0 "Łódzkie elektrociepłownie dostają węgiel z Bełchatowa i Konina. Ogrzewanie jest prawem, nie towarem."
 RLWC_e2:0 "Fabryki z odzysku"
 RLWC_e2_desc:0 "Opuszczone hale przy Piotrkowskiej i Pabianickiej zamieniają się w spółdzielnie produkcyjne."
 RLWC_e3:0 "Włókniarki wracają"
 RLWC_e3_desc:0 "Szwalnie i przędzalnie wracają do pracy. Łódź szyje mundury, koce i namioty dla połowy Polski."
 RLWC_e4:0 "Węzeł Stryków"
 RLWC_e4_desc:0 "Skrzyżowanie A1 i A2 jest sercem transportu centralnej Polski. Republika pobiera opłaty – i dba o drogi.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RLWC_e5:0 "Zbrojownia na Widzewie"
 RLWC_e5_desc:0 "Zakłady na Widzewie przestawiają się na produkcję broni strzeleckiej. Spółdzielnia „Czerwona Strzała” ma pierwsze zamówienia.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RLWC_e6:0 "Ziemia obiecana"
 RLWC_e6_desc:0 "Łódź znów jest przemysłowym sercem kraju. Tym razem fabryki należą do miasta."
 RLWC_m1:0 "Bataliony związkowe"
 RLWC_m1_desc:0 "Związki zawodowe wystawiają pierwsze bataliony. Każdy żołnierz ma legitymację związkową."
 RLWC_m2:0 "Pobór z fabryk"
 RLWC_m2_desc:0 "Każda fabryka wystawia kompanię. Zmiany są krótsze, żeby wszyscy zdążyli ćwiczyć.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RLWC_m3:0 "Mundury z łódzkich szwalni"
 RLWC_m3_desc:0 "Szwalnie dostarczają mundury, a warsztaty – broń i oporządzenie.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RLWC_m4:0 "Dywizja Łódzka"
 RLWC_m4_desc:0 "Bataliony łączą się w dywizję z artylerią. Republika ma armię, której nikt się nie spodziewał."
 RLWC_m5:0 "Gwardia Robotnicza"
 RLWC_m5_desc:0 "Żołnierz w Łodzi zarabia tyle, co tokarz. I tak samo dobrze wie, za co pracuje."
 RLWC_d0:0 "Centrum Polski"
 RLWC_d0_desc:0 "Piotrków, Sieradz, Kutno i Łowicz – Łódź jest otoczona sąsiadami, z których każdy ma inne pomysły na przyszłość."
 RLWC_s1:0 "Sojusz Miast Centralnej Polski"
 RLWC_s1_desc:0 "Republika proponuje sąsiadom sojusz obrony i wspólną kasę zasiłkową."
 RLWC_s2:0 "Wspólna kasa zasiłkowa"
 RLWC_s2_desc:0 "Zasiłki dla bezrobotnych i rodzin żołnierzy wypłaca sojusz, nie gmina. Kto należy do sojuszu, ten nie głoduje."
 RLWC_pomoc:0 "Pomoc z zagranicy"
 RLWC_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RLWC_samodzielnosc:0 "Bez obcych pieniędzy"
 RLWC_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RLWC_s3:0 "Rzeczpospolita Socjalna"
 RLWC_s3_desc:0 "Członkowie sojuszu dostają propozycję wspólnego państwa – socjalnego, demokratycznego i ze stolicą w Łodzi."
 RLWC_w1:0 "Wojna z [PTK.GetNameDef]"
 RLWC_w1_desc:0 "[PTK.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RLWC_w2:0 "Wojna z [SRD.GetNameDef]"
 RLWC_w2_desc:0 "[SRD.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RLWC_w3:0 "Wojna z [KTN.GetNameDef]"
 RLWC_w3_desc:0 "[KTN.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RLWC_region:0 "Rzeczpospolita Socjalna"
 RLWC_region_desc:0 "Łódź jest stolicą państwa, które obiecuje każdemu dach nad głową. Teraz trzeba dotrzymać słowa."
 RLWC_centralizacja:0 "Centralizacja"
 RLWC_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RLWC_porozumienie:0 "Porozumienie z samorządami"
 RLWC_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RLWC_pl1:0 "Więcej niż region"
 RLWC_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RLWC_pl2:0 "Marsz na Warszawę"
 RLWC_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RLWC_pl3:0 "Rzeczpospolita Odrodzona"
 RLWC_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RLWC_filmowka:0 "Filmówka dla Republiki"
 RLWC_filmowka_desc:0 "Szkoła Filmowa produkuje kroniki, reportaże i plakaty. Łódź opowiada swoją historię lepiej niż ktokolwiek w Polsce."
 RLWC_manufaktura:0 "Manufaktura dla ludzi"
 RLWC_manufaktura_desc:0 "Dawne centrum handlowe w fabrykach Poznańskiego staje się halą targową, magazynem i szpitalem polowym naraz."
 RKKR_start:0 "Korona Polska"
 RKKR_start_desc:0 "W Siedlcach Grzegorz Braun ogłasza powstanie Korony Polskiej. Na ratuszu zawisa biały orzeł w koronie, a ludzie na rynku śpiewają „Boże, coś Polskę” w wersji z „Ojczyznę wolną racz nam wrócić, Panie”."
 RKKR_porzadek:0 "Straż sejmikowa"
 RKKR_porzadek_desc:0 "Każda gmina wystawia straż podległą sejmikowi powiatowemu. Porządek ma być lokalny – i polski."
 RKKR_zaopatrzenie:0 "Spichrze Podlasia"
 RKKR_zaopatrzenie_desc:0 "Rolnicy z okolic Siedlec oddają część plonów do spichrzy Korony. W zamian dostają zwolnienie z podatków na trzy lata."
 RKKR_wladza:0 "Sejmik Koronny"
 RKKR_wladza_desc:0 "W Siedlcach zbiera się Sejmik Koronny: rolnicy, księża, przedsiębiorcy i weterani. Obrady zaczynają się mszą."
 RKKR_wybor:0 "Jaka korona?"
 RKKR_wybor_desc:0 "Regencja i przyszły król, wspólny front z Konfederacją czy Rzeczpospolita sejmików? Korona musi zdecydować, kim chce być."
 RKKR_a1:0 "Rada Regencyjna"
 RKKR_a1_desc:0 "Three regents take power on behalf of the future king. The council prepares the coronation of the Crown's founder – Grzegorz Braun. (Fictional path of the mod.)"
 RKKR_a2:0 "Insygnia koronne"
 RKKR_a2_desc:0 "Złotnicy z Siedlec wykonują kopię korony Chrobrego. Pokazuje się ją w kościołach – i na każdym wiecu."
 RKKR_a3:0 "Kandydaci do tronu"
 RKKR_a3_desc:0 "Descendants of magnate families from all over Europe come to Siedlce. The regents listen politely – and send them home. The Crown already has its candidate."
 RKKR_a4:0 "Królestwo Polskie"
 RKKR_a4_desc:0 "The regency proclaims the Kingdom of Poland and Grzegorz Braun is crowned King of Poland. The Crown now awaits the rest of the country. (Fictional path of the mod.)"
 RKKR_b1:0 "Telefon do Ciechanowa"
 RKKR_b1_desc:0 "Korona i Konfederacja mają różne wizje państwa, ale tego samego wroga. Rozmowy zaczynają się od tego, co wspólne."
 RKKR_b2:0 "Wspólne listy"
 RKKR_b2_desc:0 "Korona i Konfederacja wystawiają wspólnych kandydatów w gminach. Wyborcy prawicy nie muszą wybierać."
 RKKR_b3:0 "Wspólny front"
 RKKR_b3_desc:0 "Sztaby obu państw planują operacje razem. Kto będzie rządził po wojnie – o tym później."
 RKKR_b4:0 "Korona Konfederacji"
 RKKR_b4_desc:0 "Korona staje się częścią wielkiego frontu prawicy – na własnych warunkach i z własną koroną."
 RKKR_c1:0 "Sejmiki ziemskie"
 RKKR_c1_desc:0 "Każdy powiat ma swój sejmik. Sejmiki wybierają posłów na Sejm Walny – a posłowie przywożą instrukcje."
 RKKR_c2:0 "Wolna elekcja"
 RKKR_c2_desc:0 "Władca ma być wybierany przez wszystkich obywateli – osobiście, na polu elekcyjnym pod Siedlcami."
 RKKR_c3:0 "Sejm Walny"
 RKKR_c3_desc:0 "Pierwszy Sejm Walny od czasów rozbiorów. Obrady trwają tydzień i kończą się – ku zaskoczeniu wszystkich – uchwałą."
 RKKR_c4:0 "Rzeczpospolita Sejmików"
 RKKR_c4_desc:0 "Korona staje się Rzecząpospolitą sejmików: wolność, tradycja i bardzo długie obrady."
 RKKR_e1:0 "Prąd dla wsi"
 RKKR_e1_desc:0 "Linie energetyczne na wsiach są naprawiane w pierwszej kolejności. Korona obiecała, że wieś nie będzie gorsza od miasta."
 RKKR_e2:0 "Rzemiosło i cechy"
 RKKR_e2_desc:0 "Korona przywraca cechy rzemieślnicze. Warsztaty dostają zamówienia i ulgi."
 RKKR_e3:0 "Mennica Koronna"
 RKKR_e3_desc:0 "Korona bije własną monetę – złotego koronnego. Ludzie ufają metalowi bardziej niż elektronicznym przelewom, które przestały działać."
 RKKR_e4:0 "Gościńce Korony"
 RKKR_e4_desc:0 "Drogi z Siedlec do Węgrowa, Łukowa i Sokołowa zostają naprawione. Na każdym rozstaju stoi krzyż i posterunek.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RKKR_e5:0 "Zbrojownia w Siedlcach"
 RKKR_e5_desc:0 "Warsztaty w Siedlcach produkują broń dla Straży Koronnej.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RKKR_e6:0 "Gospodarstwa Korony"
 RKKR_e6_desc:0 "Własność rodzinna, cechy i spichrze – Korona ma gospodarkę, która może nie rośnie szybko, ale nie upada."
 RKKR_m1:0 "Straż Koronna"
 RKKR_m1_desc:0 "Ochotnicy dostają mundury z orłem w koronie i krótką przysięgę: „Bogu, Koronie i Ojczyźnie”."
 RKKR_m2:0 "Pospolite ruszenie"
 RKKR_m2_desc:0 "Korona ogłasza pospolite ruszenie. Na rynkach miasteczek stoją stoły werbunkowe.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RKKR_m3:0 "Broń z myśliwskich magazynów"
 RKKR_m3_desc:0 "Koła łowieckie, strzelnice i magazyny rezerw oddają broń Straży.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RKKR_m4:0 "Pułki Koronne"
 RKKR_m4_desc:0 "Straż tworzy pułki z tradycyjnymi nazwami – i nowoczesną artylerią."
 RKKR_m5:0 "Straż Koronna"
 RKKR_m5_desc:0 "Morale wysokie, musztra coraz lepsza. Korona ma wojsko, które wierzy w swoją sprawę."
 RKKR_d0:0 "Sąsiedzi Korony"
 RKKR_d0_desc:0 "Podlasie, Wołomin, Otwock, Białystok – Korona ma wielu sąsiadów i niewielu przyjaciół. Konfederacja w Ciechanowie jest wyjątkiem."
 RKKR_s1:0 "Liga Koronna"
 RKKR_s1_desc:0 "Korona proponuje Ciechanowowi i Białej Podlaskiej ligę: wspólna obrona i wspólny wróg."
 RKKR_s2:0 "Wspólny sztab w Węgrowie"
 RKKR_s2_desc:0 "Sztab Ligi zbiera się w Węgrowie. Mapy, rozkazy i długie dyskusje o tym, kto dowodzi."
 RKKR_pomoc:0 "Pomoc z zagranicy"
 RKKR_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RKKR_samodzielnosc:0 "Bez obcych pieniędzy"
 RKKR_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RKKR_s3:0 "Pod jedną koroną"
 RKKR_s3_desc:0 "Członkowie Ligi dostają propozycję wejścia do Korony. Herby zostaną, granice – znikną."
 RKKR_w1:0 "Wojna z [PDL.GetNameDef]"
 RKKR_w1_desc:0 "[PDL.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKKR_w2:0 "Wojna z [WLM.GetNameDef]"
 RKKR_w2_desc:0 "[WLM.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKKR_w3:0 "Wojna z [BST.GetNameDef]"
 RKKR_w3_desc:0 "[BST.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKKR_region:0 "Korona Wschodnia"
 RKKR_region_desc:0 "Od Siedlec po Bug rządzi Korona. Herby wracają na ratusze, a sejmiki – do starostw."
 RKKR_centralizacja:0 "Centralizacja"
 RKKR_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RKKR_porozumienie:0 "Porozumienie z samorządami"
 RKKR_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RKKR_pl1:0 "Więcej niż region"
 RKKR_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RKKR_pl2:0 "Marsz na Warszawę"
 RKKR_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RKKR_pl3:0 "Rzeczpospolita Odrodzona"
 RKKR_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RKKR_husaria:0 "Chorągwie konne"
 RKKR_husaria_desc:0 "Na Podlasiu jest więcej koni niż ciężarówek z paliwem. Korona tworzy chorągwie konne – szybkie, ciche i niezależne od stacji benzynowych."
 RKKR_jasna_gora:0 "Ślub Korony"
 RKKR_jasna_gora_desc:0 "Sejmik Koronny składa ślub, wzorem ślubów lwowskich: Korona będzie bronić wiary i ludu. Kościoły w Siedlcach są pełne."
 RNAR_start:0 "Państwo Narodowe"
 RNAR_start_desc:0 "Komitet Narodowy przejmuje władzę w Łomży. Naczelnik Państwa Narodowego obiecuje „porządek, pracę i polskość” – i natychmiastowy koniec rozkradania magazynów."
 RNAR_porzadek:0 "Straż na ulicach"
 RNAR_porzadek_desc:0 "Ochotnicy w białych opaskach patrolują ulice. Grabieże ustają w ciągu tygodnia."
 RNAR_zaopatrzenie:0 "Mleczarnie pod ochroną"
 RNAR_zaopatrzenie_desc:0 "Mleczarnie w Piątnicy i okolicach dostają ochronę i paliwo. Mleko i sery to podstawa wyżywienia regionu."
 RNAR_wladza:0 "Komitet Narodowy"
 RNAR_wladza_desc:0 "Komitet zbiera się w ratuszu. Radni z różnych partii siedzą w jednej sali – na razie."
 RNAR_wybor:0 "Jaki naród?"
 RNAR_wybor_desc:0 "Twardy porządek Straży Narodowej, kurpiowska wspólnota gmin czy umiarkowana republika? Łomża musi wybrać drogę."
 RNAR_a1:0 "Naczelnik Państwa"
 RNAR_a1_desc:0 "Komitet Narodowy przekazuje pełnię władzy Naczelnikowi. Rada zostaje – jako ciało doradcze."
 RNAR_a2:0 "Porządek na ulicach"
 RNAR_a2_desc:0 "Godzina policyjna, kontrole i Straż Narodowa na każdym rogu. Przestępczość spada, a z nią – swoboda."
 RNAR_a3:0 "Praca dla wszystkich"
 RNAR_a3_desc:0 "Każdy dorosły ma przydział pracy: w polu, fabryce albo Straży."
 RNAR_a4:0 "Państwo Narodowe"
 RNAR_a4_desc:0 "Naczelnik ogłasza Państwo Narodowe w pełnym kształcie. Porządek ponad wszystko."
 RNAR_b1:0 "Kurpie mają głos"
 RNAR_b1_desc:0 "Gminy kurpiowskie żądają udziału we władzy. Bez nich nie ma ani żywności, ani strzelców."
 RNAR_b2:0 "Sejmiki kurpiowskie"
 RNAR_b2_desc:0 "Każda gmina ma sejmik. Naczelnik musi pytać sejmiki o zdanie w sprawach podatków i poboru."
 RNAR_b3:0 "Wycinanki na sztandarach"
 RNAR_b3_desc:0 "Kurpiowskie wycinanki trafiają na sztandary i plakaty. Państwo ma kolorową twarz."
 RNAR_b4:0 "Wspólnota Kurpiowska"
 RNAR_b4_desc:0 "Państwo staje się wspólnotą gmin Kurpiów i Ziemi Łomżyńskiej. Mniej haseł, więcej sąsiedztwa."
 RNAR_c1:0 "Radni mówią dość"
 RNAR_c1_desc:0 "Umiarkowani radni mają dość haseł i opasek. Przygotowują wotum nieufności dla Komitetu."
 RNAR_c2:0 "Wolne wybory"
 RNAR_c2_desc:0 "Pierwsze wolne wybory w regionie od rozpadu. Narodowcy przegrywają z kandydatami z listy samorządowej."
 RNAR_c3:0 "Sąd i media"
 RNAR_c3_desc:0 "Sądy znów działają, a lokalne radio nadaje bez cenzury."
 RNAR_c4:0 "Republika Nadnarwiańska"
 RNAR_c4_desc:0 "Państwo Narodowe staje się republiką. Łomża chce być miastem, nie koszarami."
 RNAR_e1:0 "Prąd dla Łomży"
 RNAR_e1_desc:0 "Elektrociepłownia dostaje paliwo, a monterzy naprawiają linie do Ostrołęki."
 RNAR_e2:0 "Zakłady w Ostrołęce"
 RNAR_e2_desc:0 "Zakłady papiernicze i elektrownia w Ostrołęce wracają do pracy."
 RNAR_e3:0 "Browar i mleczarnie"
 RNAR_e3_desc:0 "Browar w Łomży i mleczarnie w okolicach produkują dla całego regionu. Piwo i ser mają cenę złota."
 RNAR_e4:0 "Drogi nad Narwią"
 RNAR_e4_desc:0 "Mosty na Narwi zostają naprawione, a drogi do Zambrowa i Kolna – odblokowane.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RNAR_e5:0 "Warsztaty w Zambrowie"
 RNAR_e5_desc:0 "Hale po dawnych zakładach w Zambrowie produkują amunicję i części do broni.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RNAR_e6:0 "Mleko, piwo i Narew"
 RNAR_e6_desc:0 "Gospodarka małego państwa – wystarczająca, żeby przetrwać, i stabilna, żeby rosnąć."
 RNAR_m1:0 "Bataliony Narodowe"
 RNAR_m1_desc:0 "Ochotnicy tworzą pierwsze bataliony. Dowódcami zostają rezerwiści z Zambrowa."
 RNAR_m2:0 "Pobór kurpiowski"
 RNAR_m2_desc:0 "Kurpie wystawiają kompanie strzelców. Każda wieś ma swoją drużynę.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RNAR_m3:0 "Broń z koszar w Zambrowie"
 RNAR_m3_desc:0 "Koszary w Zambrowie oddają broń i amunicję z magazynów.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RNAR_m4:0 "Dywizja Nadnarwiańska"
 RNAR_m4_desc:0 "Bataliony łączą się w dywizję z artylerią i saperami."
 RNAR_m5:0 "Strzelcy Kurpiowscy"
 RNAR_m5_desc:0 "Kurpiowscy strzelcy stają się elitą armii – mistrzami wojny w puszczy."
 RNAR_d0:0 "Między Białymstokiem a Ciechanowem"
 RNAR_d0_desc:0 "Na wschodzie Białystok, na zachodzie Konfederacja, na północy Mazury. Łomża musi wybrać sojuszników – albo cele."
 RNAR_s1:0 "Związek Nadnarwiański"
 RNAR_s1_desc:0 "Łomża proponuje sąsiadom związek obronny miast nad Narwią."
 RNAR_s2:0 "Flotylla na Narwi"
 RNAR_s2_desc:0 "Związek uzbraja barki i patroluje rzekę."
 RNAR_pomoc:0 "Pomoc z zagranicy"
 RNAR_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RNAR_samodzielnosc:0 "Bez obcych pieniędzy"
 RNAR_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RNAR_s3:0 "Jedno państwo nad Narwią"
 RNAR_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RNAR_w1:0 "Wojna z [BST.GetNameDef]"
 RNAR_w1_desc:0 "[BST.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RNAR_w2:0 "Wojna z [NNA.GetNameDef]"
 RNAR_w2_desc:0 "[NNA.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RNAR_w3:0 "Wojna z [MAZ.GetNameDef]"
 RNAR_w3_desc:0 "[MAZ.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RNAR_region:0 "Ziemia Łomżyńska"
 RNAR_region_desc:0 "Od Puszczy Kurpiowskiej po Biebrzę – jedna władza i jeden porządek."
 RNAR_centralizacja:0 "Centralizacja"
 RNAR_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RNAR_porozumienie:0 "Porozumienie z samorządami"
 RNAR_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RNAR_pl1:0 "Więcej niż region"
 RNAR_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RNAR_pl2:0 "Marsz na Warszawę"
 RNAR_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RNAR_pl3:0 "Rzeczpospolita Odrodzona"
 RNAR_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RNAR_puszcza:0 "Kryjówki w puszczy"
 RNAR_puszcza_desc:0 "W Puszczy Kurpiowskiej powstają magazyny, ziemianki i stanowiska. Nawet jeśli Łomża padnie, wojna będzie trwała dalej."
 RPTK_start:0 "Ziemia Piotrkowska"
 RPTK_start_desc:0 "Piotrków ogłasza niezależność, a Bełchatów – że prąd popłynie tylko tam, gdzie uznaje się władzę Piotrkowa. Pierwsza decyzja nowego państwa to ochrona elektrowni."
 RPTK_porzadek:0 "Ochrona kombinatu"
 RPTK_porzadek_desc:0 "Straż przemysłowa, policja i ochotnicy otaczają kopalnię i elektrownię. Bez nich Piotrków jest tylko kolejnym miasteczkiem."
 RPTK_zaopatrzenie:0 "Prąd za żywność"
 RPTK_zaopatrzenie_desc:0 "Piotrków wymienia prąd na zboże z Sieradza i mięso z Opoczna. Kable wysokiego napięcia stają się szlakiem handlowym."
 RPTK_wladza:0 "Rada Ziemi Piotrkowskiej"
 RPTK_wladza_desc:0 "Rada zbiera się w dawnym gmachu Trybunału Koronnego. Starosta, burmistrzowie i dyrektor kombinatu – wszyscy przy jednym stole."
 RPTK_wybor:0 "Prawo, kombinat czy starosta?"
 RPTK_wybor_desc:0 "Państwo prawa z Trybunałem, rządy dyrekcji kombinatu czy silna ręka starosty? Piotrków musi zdecydować."
 RPTK_a1:0 "Trybunał wraca"
 RPTK_a1_desc:0 "Sędziowie z całego regionu zbierają się w Piotrkowie. Trybunał znów sądzi – tym razem także władzę."
 RPTK_a2:0 "Kodeks Piotrkowski"
 RPTK_a2_desc:0 "Krótki kodeks praw obywatelskich jest drukowany i rozdawany w każdej gminie."
 RPTK_a3:0 "Wybory do Rady"
 RPTK_a3_desc:0 "Wybory do Rady Ziemi Piotrkowskiej. Kampania trwa dwa tygodnie, a debaty – do świtu."
 RPTK_a4:0 "Rzeczpospolita Trybunalska"
 RPTK_a4_desc:0 "Piotrków staje się państwem prawa – może najmniejszym, ale najbardziej praworządnym w rozbitej Polsce."
 RPTK_b1:0 "Dyrekcja przejmuje stery"
 RPTK_b1_desc:0 "Dyrektor kombinatu proponuje, by państwem zarządzali ludzie, którzy potrafią zarządzać największą elektrownią w Europie."
 RPTK_b2:0 "Plan produkcyjny"
 RPTK_b2_desc:0 "Państwo ma plan produkcyjny na trzy lata. Polityka ustępuje miejsca tabelkom."
 RPTK_b3:0 "Menedżerowie w urzędach"
 RPTK_b3_desc:0 "Starostwa i urzędy gmin obejmują menedżerowie z kombinatu."
 RPTK_b4:0 "Kombinat Bełchatowski"
 RPTK_b4_desc:0 "Państwo staje się kombinatem. Prąd płynie, fabryki pracują, a wybory – może kiedyś."
 RPTK_c1:0 "Starosta bierze odpowiedzialność"
 RPTK_c1_desc:0 "Starosta ogłasza, że w czasie kryzysu nie ma czasu na debaty. Rada zostaje zawieszona."
 RPTK_c2:0 "Gwardia na ulicach"
 RPTK_c2_desc:0 "Gwardia Trybunalska pilnuje porządku w miastach. Kradzieże znikają, protesty też."
 RPTK_c3:0 "Dekrety starosty"
 RPTK_c3_desc:0 "Dekrety starosty mają moc ustawy. Krótkie, jasne i nie do zaskarżenia."
 RPTK_c4:0 "Starostwo Trybunalskie"
 RPTK_c4_desc:0 "Piotrkowem rządzi starosta. Porządek jest – pytań nie ma."
 RPTK_e1:0 "Bloki energetyczne"
 RPTK_e1_desc:0 "Kolejne bloki elektrowni wracają do pracy. Bełchatów produkuje więcej prądu, niż region potrafi zużyć."
 RPTK_e2:0 "Zakłady w Tomaszowie"
 RPTK_e2_desc:0 "Fabryki w Tomaszowie Mazowieckim przestawiają się na produkcję dla państwa."
 RPTK_e3:0 "Odkrywka Szczerców"
 RPTK_e3_desc:0 "Odkrywka Szczerców fedruje na pełną moc. Węgiel brunatny wystarczy na dziesięciolecia."
 RPTK_e4:0 "Węzeł drogowy"
 RPTK_e4_desc:0 "Skrzyżowanie A1 i S8 pod Piotrkowem jest strzeżone i naprawione. Kto jedzie z północy na południe, jedzie przez Piotrków.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RPTK_e5:0 "Warsztaty kombinatu"
 RPTK_e5_desc:0 "Warsztaty kopalni naprawiają czołgi i transportery tak samo dobrze jak koparki.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RPTK_e6:0 "Kombinat Bełchatowski"
 RPTK_e6_desc:0 "Kopalnia, elektrownia i fabryki pracują jak jeden organizm. Piotrków zasila centralną Polskę."
 RPTK_m1:0 "Gwardia Trybunalska"
 RPTK_m1_desc:0 "Ochotnicy dostają naramienniki z wagą sprawiedliwości i karabiny z magazynów policji."
 RPTK_m2:0 "Pobór z kopalni"
 RPTK_m2_desc:0 "Górnicy i energetycy tworzą kompanie, które znają teren kombinatu jak własną kieszeń.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RPTK_m3:0 "Ciężki sprzęt"
 RPTK_m3_desc:0 "Ciężarówki, spychacze i dźwigi z kopalni trafiają do wojska.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RPTK_m4:0 "Dywizja Piotrkowska"
 RPTK_m4_desc:0 "Gwardia tworzy dywizję z artylerią i saperami."
 RPTK_m5:0 "Gwardia Trybunalska"
 RPTK_m5_desc:0 "Gwardia staje się zawodową armią państwa."
 RPTK_d0:0 "Sąsiedzi Piotrkowa"
 RPTK_d0_desc:0 "Łódź, Sieradz, Radom i Lublin – wszyscy potrzebują prądu z Bełchatowa. I wszyscy chętnie przejęliby elektrownię."
 RPTK_s1:0 "Związek Trybunalski"
 RPTK_s1_desc:0 "Piotrków proponuje sąsiadom związek: tani prąd i wspólny sąd rozjemczy."
 RPTK_s2:0 "Sąd rozjemczy"
 RPTK_s2_desc:0 "Spory między członkami Związku rozstrzyga Trybunał. Mniej wojen, więcej wyroków."
 RPTK_pomoc:0 "Pomoc z zagranicy"
 RPTK_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RPTK_samodzielnosc:0 "Bez obcych pieniędzy"
 RPTK_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RPTK_s3:0 "Pod jednym Trybunałem"
 RPTK_s3_desc:0 "Członkowie Związku dostają propozycję wspólnego państwa."
 RPTK_w1:0 "Wojna z [LWC.GetNameDef]"
 RPTK_w1_desc:0 "[LWC.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPTK_w2:0 "Wojna z [SRD.GetNameDef]"
 RPTK_w2_desc:0 "[SRD.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPTK_w3:0 "Wojna z [PRW.GetNameDef]"
 RPTK_w3_desc:0 "[PRW.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RPTK_region:0 "Ziemia Trybunalska"
 RPTK_region_desc:0 "Od Bełchatowa po Tomaszów – jedno państwo i jeden Trybunał."
 RPTK_centralizacja:0 "Centralizacja"
 RPTK_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RPTK_porozumienie:0 "Porozumienie z samorządami"
 RPTK_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RPTK_pl1:0 "Więcej niż region"
 RPTK_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RPTK_pl2:0 "Marsz na Warszawę"
 RPTK_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RPTK_pl3:0 "Rzeczpospolita Odrodzona"
 RPTK_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RPTK_trybunal:0 "Gmach Trybunału"
 RPTK_trybunal_desc:0 "Odnowiony gmach Trybunału Koronnego staje się siedzibą państwa. Turyści byli tu przed rozpadem – teraz przyjeżdżają delegacje."
 RPTK_siec:0 "Eksport prądu"
 RPTK_siec_desc:0 "Linie wysokiego napięcia do Łodzi, Radomia i Kalisza zostają naprawione. Piotrków sprzedaje prąd wszystkim, którzy płacą."
 RRAD_start:0 "Ziemia Radomska"
 RRAD_start_desc:0 "Radom ogłasza niezależność. Prezydent Radomia staje na czele rządu tymczasowego i ogłasza, że Łucznik nie odda broni nikomu, kto nie uzna władzy miasta."
 RRAD_porzadek:0 "Straż fabryczna Łucznika"
 RRAD_porzadek_desc:0 "Ochrona fabryki broni staje się pierwszą formacją państwa. Kto ma Łucznika, ten ma Radom."
 RRAD_zaopatrzenie:0 "Sady Grójca"
 RRAD_zaopatrzenie_desc:0 "Sadownicy spod Grójca i Warki dostarczają jabłka, soki i susz. Radom nie będzie głodował."
 RRAD_wladza:0 "Rada Ziemi Radomskiej"
 RRAD_wladza_desc:0 "Radni, związkowcy z Łucznika i sadownicy zbierają się w ratuszu. Każdy ma coś, czego potrzebują inni."
 RRAD_wybor:0 "Robotnicy, kupcy czy prezydent?"
 RRAD_wybor_desc:0 "Rada robotnicza, firma zbrojeniowa jako państwo czy silny prezydent? Radom musi wybrać."
 RRAD_a1:0 "Pamięć Czerwca"
 RRAD_a1_desc:0 "W rocznicę protestów z 1976 roku na placu przed komitetem zbiera się tłum. Robotnicy chcą, by tym razem władza ich słuchała."
 RRAD_a2:0 "Związki w fabrykach"
 RRAD_a2_desc:0 "Związki zawodowe dostają miejsce w zarządach Łucznika i Radoskóru."
 RRAD_a3:0 "Rada Robotnicza"
 RRAD_a3_desc:0 "Rada Robotnicza staje się najważniejszym organem państwa."
 RRAD_a4:0 "Robotnicza Republika Radomska"
 RRAD_a4_desc:0 "Radom staje się republiką robotników. Pamięć Czerwca jest teraz konstytucją."
 RRAD_b1:0 "Zarząd Łucznika"
 RRAD_b1_desc:0 "Zarząd fabryki broni proponuje, by państwem zarządzać jak firmą: przychody, koszty, zysk."
 RRAD_b2:0 "Katalog dla sąsiadów"
 RRAD_b2_desc:0 "Radom drukuje katalog broni i wysyła go do wszystkich państw rozbitej Polski."
 RRAD_b3:0 "Kontrakty eksportowe"
 RRAD_b3_desc:0 "Pierwsze duże kontrakty: Lublin, Kielce i Sochaczew kupują karabiny."
 RRAD_b4:0 "Radomska Spółka Zbrojeniowa"
 RRAD_b4_desc:0 "Państwo staje się spółką. Obywatele są udziałowcami – przynajmniej ci, którzy mają akcje."
 RRAD_c1:0 "Prezydent bierze władzę"
 RRAD_c1_desc:0 "Prezydent Radomia ogłasza, że w czasie kryzysu potrzebny jest jeden ośrodek decyzji – jego gabinet."
 RRAD_c2:0 "Rządy dekretami"
 RRAD_c2_desc:0 "Dekrety prezydenta są krótkie i wchodzą w życie od razu."
 RRAD_c3:0 "Radom się nie wstydzi"
 RRAD_c3_desc:0 "Kampania „Radom się nie wstydzi” zmienia nastroje. Mieszkańcy są dumni z miasta – pierwszy raz od lat."
 RRAD_c4:0 "Wolne Miasto Radom"
 RRAD_c4_desc:0 "Radom staje się wolnym miastem z silnym prezydentem. Żarty o Radomiu się skończyły."
 RRAD_e1:0 "Elektrownia Kozienice"
 RRAD_e1_desc:0 "Elektrownia w Kozienicach wraca do pracy. Radom ma prąd – i kartę przetargową wobec sąsiadów."
 RRAD_e2:0 "Strefa przy lotnisku"
 RRAD_e2_desc:0 "Hale przy lotnisku zamieniają się w zakłady i magazyny. Lotnisko, z którego żartowano, staje się bazą logistyczną."
 RRAD_e3:0 "Fabryka Broni Łucznik"
 RRAD_e3_desc:0 "Łucznik produkuje karabiny i pistolety na trzy zmiany. Radomska broń trafia do połowy Polski."
 RRAD_e4:0 "Droga S7"
 RRAD_e4_desc:0 "Ekspresówka z Radomia do Kielc i Warszawy zostaje oczyszczona i strzeżona.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RRAD_e5:0 "Amunicja ze Skarżyska"
 RRAD_e5_desc:0 "Zakłady w Skarżysku-Kamiennej produkują amunicję. Radom ma broń i naboje do niej.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RRAD_e6:0 "Zbrojownia Polski"
 RRAD_e6_desc:0 "Radom staje się zbrojownią rozbitego kraju. Kto chce walczyć, kupuje w Radomiu."
 RRAD_m1:0 "Strzelcy Radomscy"
 RRAD_m1_desc:0 "Ochotnicy dostają karabiny prosto z linii produkcyjnej Łucznika."
 RRAD_m2:0 "Pobór z fabryk"
 RRAD_m2_desc:0 "Robotnicy Łucznika i Radoskóru tworzą kompanie fabryczne.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RRAD_m3:0 "Arsenał Łucznika"
 RRAD_m3_desc:0 "Magazyny fabryki oddają broń wojsku. Nikt w Polsce nie jest lepiej uzbrojony.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RRAD_m4:0 "Dywizja Radomska"
 RRAD_m4_desc:0 "Strzelcy tworzą dywizję z artylerią i saperami."
 RRAD_m5:0 "Strzelcy Radomscy"
 RRAD_m5_desc:0 "Każdy żołnierz Radomia wie, jak naprawić własną broń. To robi różnicę."
 RRAD_d0:0 "Broń dla sąsiadów?"
 RRAD_d0_desc:0 "Lublin, Piotrków, Kielce i Sochaczew chcą kupować broń z Radomia. Komu sprzedać, a komu odmówić?"
 RRAD_s1:0 "Porozumienie Radomskie"
 RRAD_s1_desc:0 "Radom proponuje sąsiadom porozumienie: broń w zamian za sojusz."
 RRAD_s2:0 "Wspólne dostawy"
 RRAD_s2_desc:0 "Sojusznicy dostają broń z Łucznika po cenach „dla przyjaciół”."
 RRAD_pomoc:0 "Pomoc z zagranicy"
 RRAD_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RRAD_samodzielnosc:0 "Bez obcych pieniędzy"
 RRAD_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RRAD_s3:0 "Ziemia Radomska razem"
 RRAD_s3_desc:0 "Członkowie Porozumienia dostają propozycję wspólnego państwa."
 RRAD_w1:0 "Wojna z [PRW.GetNameDef]"
 RRAD_w1_desc:0 "[PRW.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RRAD_w2:0 "Wojna z [WOL.GetNameDef]"
 RRAD_w2_desc:0 "[WOL.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RRAD_w3:0 "Wojna z [PTK.GetNameDef]"
 RRAD_w3_desc:0 "[PTK.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RRAD_region:0 "Ziemia Radomska"
 RRAD_region_desc:0 "Od Kozienic po Szydłowiec – Radom jest stolicą, nie prowincją."
 RRAD_centralizacja:0 "Centralizacja"
 RRAD_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RRAD_porozumienie:0 "Porozumienie z samorządami"
 RRAD_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RRAD_pl1:0 "Więcej niż region"
 RRAD_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RRAD_pl2:0 "Marsz na Warszawę"
 RRAD_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RRAD_pl3:0 "Rzeczpospolita Odrodzona"
 RRAD_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RRAD_lotnisko:0 "Lotnisko Radom"
 RRAD_lotnisko_desc:0 "Lotnisko, z którego się śmiano, staje się bazą lotniczą. Pierwsze drony rozpoznawcze startują z pasa, który był pusty przez lata."
 RRAD_skarzysko:0 "Moździerze z Mesko"
 RRAD_skarzysko_desc:0 "Zakłady w Skarżysku produkują moździerze i pociski. Strzelcy Radomscy dostają wsparcie ogniowe."
 RKLS_start:0 "Ziemia Kaliska"
 RKLS_start_desc:0 "Kalisz ogłasza niezależność. Prezydent Kalisza przypomina, że miasto przetrwało Szwedów, Prusaków i spalenie w 1914 roku. Przetrwa i to."
 RKLS_porzadek:0 "Straż Miejska Kalisza"
 RKLS_porzadek_desc:0 "Straż Miejska i ochotnicy pilnują mostów na Prośnie i dróg wylotowych."
 RKLS_zaopatrzenie:0 "Wielkopolskie gospodarstwa"
 RKLS_zaopatrzenie_desc:0 "Gospodarstwa wokół Kalisza i Ostrowa mają nadwyżki. Kalisz nie będzie głodował."
 RKLS_wladza:0 "Rada Ziemi Kaliskiej"
 RKLS_wladza_desc:0 "Rada zbiera się w ratuszu na Głównym Rynku. Radni z Kalisza i Ostrowa po raz pierwszy od lat zgadzają się w ważnej sprawie."
 RKLS_wybor:0 "Jaki Kalisz?"
 RKLS_wybor_desc:0 "Republika miejska, wielkopolski porządek czy miasto graniczne z silną armią? Kalisz musi wybrać."
 RKLS_a1:0 "Rada Miasta"
 RKLS_a1_desc:0 "Rada Miasta Kalisza przejmuje pełnię władzy. Prezydent odpowiada przed nią co tydzień."
 RKLS_a2:0 "Wolne media"
 RKLS_a2_desc:0 "Lokalne gazety i radio nadają bez cenzury. Kalisz chce być wzorem dla kraju."
 RKLS_a3:0 "Wybory co dwa lata"
 RKLS_a3_desc:0 "Konstytucja przewiduje wybory co dwa lata. Krótka kadencja – krótka smycz dla władzy."
 RKLS_a4:0 "Republika Kaliska"
 RKLS_a4_desc:0 "Najstarsze miasto staje się najmłodszą republiką."
 RKLS_b1:0 "Praca u podstaw"
 RKLS_b1_desc:0 "Kaliscy przedsiębiorcy proponują program „pracy u podstaw”: najpierw gospodarka, potem polityka."
 RKLS_b2:0 "Spółdzielnie kredytowe"
 RKLS_b2_desc:0 "Spółdzielnie kredytowe, jak sto lat temu, finansują warsztaty i gospodarstwa."
 RKLS_b3:0 "Budżet bez długów"
 RKLS_b3_desc:0 "Kalisz nie zadłuża się. Każdy wydatek musi mieć pokrycie."
 RKLS_b4:0 "Wielkopolska Kaliska"
 RKLS_b4_desc:0 "Kalisz rządzi się jak dobre gospodarstwo: porządnie, oszczędnie i z wyprzedzeniem."
 RKLS_c1:0 "Miasto graniczne"
 RKLS_c1_desc:0 "Kalisz przez stulecie leżał na granicy. Komendant garnizonu przypomina, że granice znów są blisko."
 RKLS_c2:0 "Umocnienia na Prośnie"
 RKLS_c2_desc:0 "Saperzy budują umocnienia wzdłuż Prosny."
 RKLS_c3:0 "Pamięć 1914"
 RKLS_c3_desc:0 "W rocznicę zniszczenia miasta w 1914 roku Kalisz przysięga, że nigdy więcej nie da się spalić."
 RKLS_c4:0 "Kaliska Marchia Graniczna"
 RKLS_c4_desc:0 "Kalisz staje się marchią: wojskowym pograniczem z silnym komendantem."
 RKLS_e1:0 "Prąd z Konina"
 RKLS_e1_desc:0 "Kalisz kupuje prąd z Konina i naprawia lokalne ciepłownie."
 RKLS_e2:0 "Fabryki Ostrowa"
 RKLS_e2_desc:0 "Zakłady w Ostrowie Wielkopolskim przestawiają się na produkcję wagonów i części."
 RKLS_e3:0 "Zakłady lotnicze"
 RKLS_e3_desc:0 "Fabryka silników lotniczych w Kaliszu wraca do pracy. Kalisz ma technologię, której zazdrości mu cały region."
 RKLS_silniki:0 "Zakłady lotnicze"
 RKLS_e4:0 "Węzeł Ostrów"
 RKLS_e4_desc:0 "Węzeł kolejowy w Ostrowie łączy Kalisz z Poznaniem, Wrocławiem i Łodzią.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RKLS_e5:0 "Zbrojownia w Kaliszu"
 RKLS_e5_desc:0 "Warsztaty w Kaliszu produkują broń i części do pojazdów.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RKLS_e6:0 "Silniki z Kalisza"
 RKLS_e6_desc:0 "Kalisz sprzedaje silniki, części i technologię. Najstarsze miasto staje się najnowocześniejszym."
 RKLS_m1:0 "Gwardia Kaliska"
 RKLS_m1_desc:0 "Ochotnicy tworzą Gwardię. Mundury szyje się w kaliskich zakładach."
 RKLS_m2:0 "Pobór z Ostrowa"
 RKLS_m2_desc:0 "Ostrów wystawia własne kompanie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RKLS_m3:0 "Magazyny garnizonu"
 RKLS_m3_desc:0 "Garnizon w Kaliszu oddaje broń i wyposażenie.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RKLS_m4:0 "Dywizja Kaliska"
 RKLS_m4_desc:0 "Gwardia tworzy dywizję z artylerią."
 RKLS_m5:0 "Gwardia Kaliska"
 RKLS_m5_desc:0 "Mała, dobrze wyszkolona, dumna z historii. Kaliska Gwardia jest gotowa."
 RKLS_d0:0 "Południowa Wielkopolska"
 RKLS_d0_desc:0 "Sieradz, Leszno, Konin, Gniezno i Śląsk pod niemiecką opieką. Kalisz musi wybrać sojuszników."
 RKLS_s1:0 "Związek Południowej Wielkopolski"
 RKLS_s1_desc:0 "Kalisz proponuje sąsiadom wspólną obronę."
 RKLS_s2:0 "Wspólna Gwardia"
 RKLS_s2_desc:0 "Gwardie członków Związku ćwiczą razem i mają wspólne dowództwo."
 RKLS_pomoc:0 "Pomoc z zagranicy"
 RKLS_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
