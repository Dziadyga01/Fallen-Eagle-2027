l_english:
 RKUJ_start:0 "Republika Kujawska"
 RKUJ_start_desc:0 "Inowrocław ogłasza, że Kujawy nie będą czekać na nikogo – ani na Warszawę, ani na Toruń, ani na Bydgoszcz. Starostowie, burmistrzowie i wójtowie podpisują akt powołania Republiki."
 RKUJ_porzadek:0 "Straż Miejska na drogach"
 RKUJ_porzadek_desc:0 "Straż Miejska i ochotnicy z OSP pilnują skrzyżowań krajowej piętnastki. Kto jedzie z bronią, musi się zatrzymać i wytłumaczyć."
 RKUJ_zaopatrzenie:0 "Magazyny cukrowni"
 RKUJ_zaopatrzenie_desc:0 "Cukrownie mają zapasy na miesiące. Republika przejmuje magazyny i wydaje cukier na kartki – słodko, ale sprawiedliwie."
 RKUJ_wladza:0 "Rada Republiki"
 RKUJ_wladza_desc:0 "Pierwsze posiedzenie Rady Republiki w sali uzdrowiska. Na porządku obrad: chleb, prąd, policja i pytanie, kim chcemy być."
 RKUJ_wybor:0 "Jakie Kujawy?"
 RKUJ_wybor_desc:0 "Sejmik, korona czy rady robotnicze? Każda gmina ma inną odpowiedź – a Republika musi wybrać jedną."
 RKUJ_a1:0 "Sejmik Kujawski"
 RKUJ_a1_desc:0 "Każda gmina wysyła do Inowrocławia dwóch radnych. Sejmik ma decydować o wszystkim, co dotyczy więcej niż jednej gminy."
 RKUJ_a2:0 "Wybory w gminach"
 RKUJ_a2_desc:0 "Pierwsze wybory od rozpadu. Kolejki przed lokalami są dłuższe niż przed piekarniami."
 RKUJ_a3:0 "Budżet obywatelski"
 RKUJ_a3_desc:0 "Każda gmina sama decyduje o połowie swoich pieniędzy. Reszta idzie na wspólną obronę."
 RKUJ_a4:0 "Kujawska Rzeczpospolita Samorządowa"
 RKUJ_a4_desc:0 "Konstytucja Kujaw: gminy, sejmik, sąd i straż. Najmniejsza rzeczpospolita w historii – i może najuczciwsza."
 RKUJ_b1:0 "Dziedzictwo Kruszwicy"
 RKUJ_b1_desc:0 "Kruszwica była stolicą Goplan, zanim powstała Polska. Radni z prawicy proponują, by Kujawy znów miały księcia."
 RKUJ_b2:0 "Herold na rynku"
 RKUJ_b2_desc:0 "Na rynku w Inowrocławiu herold odczytuje proklamację. Ludzie śmieją się – i przychodzą posłuchać znowu."
 RKUJ_b3:0 "Rada Koronna"
 RKUJ_b3_desc:0 "Starostowie i proboszczowie tworzą Radę Koronną. Kandydat na księcia musi mieć ziemię, rodzinę i poparcie Kościoła."
 RKUJ_b4:0 "Księstwo Kujawskie"
 RKUJ_b4_desc:0 "Koronacja w kolegiacie w Kruszwicy. Kujawy mają księcia – pierwszego od siedmiuset lat."
 RKUJ_c1:0 "Komitet strajkowy w sodowni"
 RKUJ_c1_desc:0 "Robotnicy sodowni w Mątwach nie dostali pensji od trzech miesięcy. Komitet strajkowy przejmuje zakład – i zaprasza inne fabryki."
 RKUJ_c2:0 "Kooperatywy rolne"
 RKUJ_c2_desc:0 "Rolnicy łączą maszyny i magazyny w spółdzielnie. Cukrownie kupują buraki od kooperatyw, nie od pośredników."
 RKUJ_c3:0 "Rada Delegatów"
 RKUJ_c3_desc:0 "Każdy zakład wybiera delegata. Rada Delegatów zbiera się w hali sodowni i decyduje o produkcji i płacach."
 RKUJ_c4:0 "Kujawska Republika Rad"
 RKUJ_c4_desc:0 "Rady pracownicze przejmują władzę w Republice. Fabryki należą do tych, którzy w nich pracują."
 RKUJ_e1:0 "Odbudowa sieci energetycznej"
 RKUJ_e1_desc:0 "Elektrociepłownia w Inowrocławiu dostaje węgiel z Konina i nowych operatorów. Prąd wraca do domów na dłużej niż dwie godziny dziennie."
 RKUJ_e2:0 "Strefa przemysłowa Inowrocławia"
 RKUJ_e2_desc:0 "Hale przy obwodnicy dostają ulgi podatkowe i zamówienia od Republiki. Pierwsze firmy wracają z Bydgoszczy."
 RKUJ_e3:0 "Soda z Mątw"
 RKUJ_e3_desc:0 "Sodownia w Mątwach rusza pełną parą. Soda, sól i chemikalia to towar, za który sąsiedzi płacą paliwem i bronią."
 RKUJ_e4:0 "Drogi między polami"
 RKUJ_e4_desc:0 "Drogi powiatowe dostają nowy asfalt, a kolej z Inowrocławia do Torunia i Gniezna znów kursuje według rozkładu.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RKUJ_e5:0 "Warsztaty w Janikowie"
 RKUJ_e5_desc:0 "Zakłady w Janikowie produkują części do broni i amunicję. Chemia przemysłowa przydaje się nie tylko w sodowni.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RKUJ_e6:0 "Kujawskie zagłębie chemiczne"
 RKUJ_e6_desc:0 "Soda, cukier, tłuszcze i chemia – Kujawy stają się zapleczem przemysłowym całego regionu."
 RKUJ_m1:0 "Kujawska Brygada Obrony"
 RKUJ_m1_desc:0 "Batalion terytorialny z Inowrocławia staje się brygadą. Dostaje sztandar, dowódcę i pierwszą listę rozkazów."
 RKUJ_m2:0 "Pobór w gminach"
 RKUJ_m2_desc:0 "Każda gmina wystawia kompanię. Rolnicy, mechanicy i strażacy dostają mundury i trzy tygodnie szkolenia.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RKUJ_m3:0 "Magazyny garnizonowe"
 RKUJ_m3_desc:0 "Magazyny w Inowrocławiu oddają broń i amunicję, które czekały tam na wojnę od dziesięcioleci.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RKUJ_m4:0 "Dywizja Kujawska"
 RKUJ_m4_desc:0 "Brygady łączą się w dywizję z artylerią i saperami. Kujawy mają armię, z którą sąsiedzi muszą się liczyć."
 RKUJ_m5:0 "Kujawska Obrona Terytorialna"
 RKUJ_m5_desc:0 "Szkoła podoficerska, rezerwy i plan obrony każdej gminy. Kujawy nie dadzą się zaskoczyć."
 RKUJ_d0:0 "Sąsiedzi Kujaw"
 RKUJ_d0_desc:0 "Włocławek, Pałuki, Toruń – każdy sąsiad ma własne plany wobec Kujaw. Trzeba zdecydować, z kim rozmawiać, a z kim walczyć."
 RKUJ_s1:0 "Związek Kujawski"
 RKUJ_s1_desc:0 "Delegaci Republiki jadą do sąsiadów z propozycją: wspólna obrona, wspólne magazyny, wspólne Kujawy."
 RKUJ_s2:0 "Wspólny sztab w Kruszwicy"
 RKUJ_s2_desc:0 "Sztab Związku zbiera się w Kruszwicy – symbolicznie, nad Gopłem, gdzie zaczynały się Kujawy."
 RKUJ_pomoc:0 "Pomoc z zagranicy"
 RKUJ_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
 RKUJ_samodzielnosc:0 "Bez obcych pieniędzy"
 RKUJ_samodzielnosc_desc:0 "Rada odrzuca zagraniczne oferty. Nikt nie będzie kupował naszej polityki za paczki z karabinami.\n\n§YWybór:§! przez rok więcej siły politycznej i poparcia dla wojny, bez sprzętu z zewnątrz."
 RKUJ_s3:0 "Jedna Republika"
 RKUJ_s3_desc:0 "Członkowie Związku dostają propozycję: niech Związek stanie się jednym państwem."
 RKUJ_w1:0 "Wojna z [WLC.GetNameDef]"
 RKUJ_w1_desc:0 "[WLC.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKUJ_w2:0 "Wojna z [PLK.GetNameDef]"
 RKUJ_w2_desc:0 "[PLK.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKUJ_w3:0 "Wojna z [TRN.GetNameDef]"
 RKUJ_w3_desc:0 "[TRN.GetNameDef] blokuje nasze drogi i przyjmuje naszych uciekinierów jak wrogów. Sztab ma gotowy plan – czeka tylko na rozkaz."
 RKUJ_region:0 "Zjednoczone Kujawy"
 RKUJ_region_desc:0 "Od Gopła po Wisłę – jedna administracja, jedno wojsko, jedna Republika. Kujawy przestały być pograniczem cudzych państw."
 RKUJ_centralizacja:0 "Centralizacja"
 RKUJ_centralizacja_desc:0 "Starostów w przyłączonych powiatach mianuje stolica. Administracja przyspiesza – a lokalni działacze tracą stanowiska i cierpliwość.\n\n§YWybór:§! przez 2 lata sprawniejsza administracja, ale przez pierwsze 180 dni niezadowolenie regionów."
 RKUJ_porozumienie:0 "Porozumienie z samorządami"
 RKUJ_porozumienie_desc:0 "Burmistrzowie i wójtowie przyłączonych gmin zostają na stanowiskach. Podpisują lojalkę, a w zamian zachowują część podatków.\n\n§YWybór:§! przez rok wyższa stabilność i spokojna integracja, ale mniej zasobów i siły politycznej z nowych ziem."
 RKUJ_pl1:0 "Więcej niż region"
 RKUJ_pl1_desc:0 "Region jest nasz. Ale granice Polski nie kończą się na granicach regionu – a w innych stolicach ktoś myśli dokładnie to samo o nas."
 RKUJ_pl2:0 "Marsz na Warszawę"
 RKUJ_pl2_desc:0 "Kto ma Warszawę, ten może mówić w imieniu Polski. Sztab kreśli strzałki na mapie – wszystkie kończą się na Śródmieściu."
 RKUJ_pl3:0 "Rzeczpospolita Odrodzona"
 RKUJ_pl3_desc:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Rozbita Polska ma znowu jeden rząd – nasz."
 RKUJ_kruszwica:0 "Mysia Wieża"
 RKUJ_kruszwica_desc:0 "Nad Gopłem staje scena, a Mysia Wieża dostaje nowe oświetlenie. Legenda o Popielu wraca jako opowieść o władcach, którzy zapomnieli o ludziach."
 RKUJ_sanatoria:0 "Szpitale w uzdrowisku"
 RKUJ_sanatoria_desc:0 "Sanatoria zamieniają się w szpitale wojskowe. Ranni z całego regionu wracają do zdrowia nad tężniami."
 RGRU_start:0 "Wolne Miasto Grudziądz"
 RGRU_start_desc:0 "Rada Miasta ogłasza, że Grudziądz nie należy do nikogo poza swoimi mieszkańcami. Bramy Cytadeli zostają zamknięte, a na spichrzach pojawiają się posterunki."
 RGRU_porzadek:0 "Patrole na mostach"
 RGRU_porzadek_desc:0 "Most przez Wisłę jest jedyną drogą na wschód w promieniu kilkudziesięciu kilometrów. Kto go pilnuje, ten decyduje, kto przejedzie."
 RGRU_zaopatrzenie:0 "Spichrze nad Wisłą"
 RGRU_zaopatrzenie_desc:0 "Zabytkowe spichrze znów służą temu, do czego zostały zbudowane: przechowują zboże na zimę."
 RGRU_wladza:0 "Rada Obrony Miasta"
 RGRU_wladza_desc:0 "Rada Miasta i komendant Cytadeli zasiadają przy jednym stole. Na razie wspólny wróg – głód i chaos – łączy ich bardziej niż dzielą poglądy."
 RGRU_wybor:0 "Kto rządzi twierdzą?"
 RGRU_wybor_desc:0 "Rada, komendant czy kupcy? Grudziądz musi zdecydować, czy jest miastem, koszarami czy portem."
 RGRU_a1:0 "Rada Wolnego Miasta"
 RGRU_a1_desc:0 "Rada Miasta ogłasza, że Grudziądz będzie miastem wolnym jak Gdańsk przed wiekiem – z własną konstytucją i własnym sądem."
 RGRU_a2:0 "Milicja obywatelska"
 RGRU_a2_desc:0 "Mieszkańcy dzielnic tworzą milicję. Każdy dorosły ma obowiązek jednego dyżuru w tygodniu."
 RGRU_a3:0 "Statut Wolnego Miasta"
 RGRU_a3_desc:0 "Statut miasta – krótki, napisany prostym językiem – zostaje wywieszony na każdym przystanku."
 RGRU_a4:0 "Konstytucja Wolnego Miasta"
 RGRU_a4_desc:0 "Grudziądz uchwala konstytucję. Rada, burmistrz i sąd – jak w średniowiecznym mieście, tylko z internetem."
 RGRU_b1:0 "Komendant Cytadeli"
 RGRU_b1_desc:0 "Komendant Cytadeli ogłasza stan oblężenia. Rada Miasta może obradować – pod warunkiem, że nie przeszkadza."
 RGRU_b2:0 "Godzina policyjna"
 RGRU_b2_desc:0 "Od zmroku do świtu ulice należą do patroli. Kradzieże znikają, a razem z nimi nocne życie miasta."
 RGRU_b3:0 "Racje twierdzy"
 RGRU_b3_desc:0 "Wszystkie zapasy trafiają do magazynów Cytadeli. Każdy dostaje rację – żołnierz podwójną."
 RGRU_b4:0 "Twierdza Grudziądz"
 RGRU_b4_desc:0 "Miasto staje się twierdzą w pełnym znaczeniu słowa. Komendant rządzi, rada doradza, mieszkańcy służą."
 RGRU_c1:0 "Gildia Wiślana"
 RGRU_c1_desc:0 "Armatorzy barek, hurtownicy i spedytorzy zakładają Gildię. Kto ma pieniądze, ma głos."
 RGRU_c2:0 "Wolny port"
 RGRU_c2_desc:0 "Grudziądz ogłasza wolny port: zero ceł dla członków Gildii, wysokie cła dla wszystkich innych."
 RGRU_c3:0 "Prywatna ochrona"
 RGRU_c3_desc:0 "Gildia wynajmuje ochroniarzy do pilnowania magazynów i barek. Policja miejska dostaje lepsze pensje – od Gildii."
 RGRU_c4:0 "Kupiecka Republika Wiślana"
 RGRU_c4_desc:0 "Grudziądzem rządzi rada Gildii. Miasto handluje ze wszystkimi – i na wszystkich zarabia."
 RGRU_e1:0 "Elektrownia i wodociągi"
 RGRU_e1_desc:0 "Miejskie wodociągi i ciepłownia dostają priorytet w dostawach paliwa. Twierdza bez wody nie przetrwa żadnego oblężenia."
 RGRU_e2:0 "Zakłady przy Chełmińskiej"
 RGRU_e2_desc:0 "Fabryki przy ulicy Chełmińskiej przestawiają się na produkcję dla miasta: narzędzia, części, ogumienie."
 RGRU_e3:0 "Port rzeczny"
 RGRU_e3_desc:0 "Nabrzeże zostaje odmulone, a barki znów pływają do Torunia i Kwidzyna. Wisła to najbezpieczniejsza droga w regionie."
 RGRU_e4:0 "Drogi do Chełmna i Łasina"
 RGRU_e4_desc:0 "Drogi wylotowe zostają odblokowane i naprawione. Rolnicy z okolic mogą znów dowozić żywność na targ.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RGRU_e5:0 "Zbrojownia w Cytadeli"
 RGRU_e5_desc:0 "Warsztaty w Cytadeli produkują amunicję i naprawiają broń. Twierdza znów ma arsenał.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RGRU_e6:0 "Port na Wiśle"
 RGRU_e6_desc:0 "Grudziądz staje się portem i rynkiem dla całej dolnej Wisły. Kto chce handlować, płaci cło w mieście nad rzeką."
 RGRU_m1:0 "Batalion Cytadeli"
 RGRU_m1_desc:0 "Ochotnicy z miasta dostają mundury z magazynów Cytadeli. Batalion składa przysięgę na dziedzińcu twierdzy."
 RGRU_m2:0 "Rezerwiści z Grudziądza"
 RGRU_m2_desc:0 "W mieście mieszka wielu byłych żołnierzy. Teraz wracają do służby – tym razem dla Wolnego Miasta.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RGRU_m3:0 "Arsenał twierdzy"
 RGRU_m3_desc:0 "Magazyny pod Cytadelą skrywają więcej, niż ktokolwiek przypuszczał.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RGRU_m4:0 "Pułk Grudziądzki"
 RGRU_m4_desc:0 "Bataliony łączą się w pułk z artylerią na wałach. Grudziądz ma armię godną twierdzy."
 RGRU_m5:0 "Szkoła Cytadeli"
 RGRU_m5_desc:0 "Szkoła podoficerska w Cytadeli przyjmuje kandydatów z całego regionu. Grudziądzcy podoficerowie stają się legendą."
 RGRU_d0:0 "Sąsiedzi twierdzy"
 RGRU_d0_desc:0 "Lubawa, Chełmża, Ziemia Dobrzyńska i Zakon na wschodzie. Twierdza musi wiedzieć, kto jest przyjacielem, a kto oblegającym."
 RGRU_s1:0 "Liga Dolnej Wisły"
 RGRU_s1_desc:0 "Grudziądz proponuje sąsiadom ligę: wspólna obrona mostów, wspólne barki i wspólny rynek."
 RGRU_s2:0 "Flotylla barek"
 RGRU_s2_desc:0 "Liga uzbraja barki i tworzy flotyllę rzeczną. Wisła jest pod kontrolą Ligi."
 RGRU_pomoc:0 "Pomoc z zagranicy"
 RGRU_pomoc_desc:0 "Fundacje, ambasady i „przyjaciele Polski” oferują broń, sprzęt i pieniądze na odbudowę. Każda paczka ma dołączoną listę życzeń.\n\n§YWybór:§! sprzęt i fabryka cywilna od razu, w zamian rok ustępstw politycznych."
