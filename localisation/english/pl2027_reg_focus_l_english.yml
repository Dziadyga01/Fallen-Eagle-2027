 RLOW_skansen:0 "Wycinanki i skansen"
 RLOW_skansen_desc:0 "Skansen w Maurzycach i warsztaty wycinanek przyciągają ludzi z całego regionu."
 RCHJ_start:0 "Ziemia Zaborska"
 RCHJ_start_desc:0 "Chojnice ogłaszają Ziemię Zaborską. Burmistrz przypomina, że w 1454 roku pod Chojnicami przegrało już niejedno wielkie wojsko."
 RCHJ_porzadek:0 "Straż na drogach"
 RCHJ_porzadek_desc:0 "Ochotnicy pilnują dróg do Człuchowa, Tucholi i Bytowa."
 RCHJ_zaopatrzenie:0 "Lasy Borów"
 RCHJ_zaopatrzenie_desc:0 "Drewno z Borów Tucholskich to opał na zimę."
 RCHJ_wladza:0 "Rada Ziemi Zaborskiej"
 RCHJ_wladza_desc:0 "Rada zbiera się w Chojnicach."
 RCHJ_wybor:0 "Wspólnota, Kaszuby czy Pomorze?"
 RCHJ_wybor_desc:0 "Zabory muszą zdecydować, kim są."
 RCHJ_a1:0 "Rada Gmin"
 RCHJ_a1_desc:0 "Gminy rządzą Ziemią."
 RCHJ_a2:0 "Wybory"
 RCHJ_a2_desc:0 "Pierwsze wybory."
 RCHJ_a3:0 "Statut"
 RCHJ_a3_desc:0 "Ziemia ma konstytucję."
 RCHJ_a4:0 "Zaborska Wspólnota"
 RCHJ_a4_desc:0 "Zabory stają się wspólnotą."
 RCHJ_b1:0 "Zaborscy Kaszubi"
 RCHJ_b1_desc:0 "Kaszubi z południa domagają się głosu."
 RCHJ_b2:0 "Język kaszubski"
 RCHJ_b2_desc:0 "Kaszubski staje się językiem urzędowym."
 RCHJ_b3:0 "Sejmik kaszubski"
 RCHJ_b3_desc:0 "Gminy kaszubskie mają sejmik."
 RCHJ_b4:0 "Kaszubskie Zabory"
 RCHJ_b4_desc:0 "Zabory należą do Kaszubów."
 RCHJ_c1:0 "Rozmowy ze Słupskiem"
 RCHJ_c1_desc:0 "Chojnice szukają oparcia na Pomorzu."
 RCHJ_c2:0 "Wspólny rynek"
 RCHJ_c2_desc:0 "Cła znikają."
 RCHJ_c3:0 "Wspólna obrona"
 RCHJ_c3_desc:0 "Strzelcy ćwiczą z wojskiem Pomorza."
 RCHJ_c4:0 "Unia Pomorska"
 RCHJ_c4_desc:0 "Zabory wiążą się z Pomorzem."
 RCHJ_e1:0 "Prąd dla Chojnic"
 RCHJ_e1_desc:0 "Sieci energetyczne są naprawione."
 RCHJ_e2:0 "Fabryki mebli"
 RCHJ_e2_desc:0 "Zakłady meblarskie produkują dla Ziemi i na sprzedaż."
 RCHJ_e3:0 "Tartaki Borów"
 RCHJ_e3_desc:0 "Tartaki pracują na trzy zmiany."
 RCHJ_e4:0 "Węzeł Chojnice"
 RCHJ_e4_desc:0 "Węzeł kolejowy w Chojnicach łączy Pomorze z Wielkopolską.\n\n§YWybór:§! szybsza odbudowa i dwie fabryki cywilne kosztem wolniejszej zbrojeniówki przez rok."
 RCHJ_e5:0 "Warsztaty w Człuchowie"
 RCHJ_e5_desc:0 "Warsztaty produkują amunicję.\n\n§YWybór:§! fabryka zbrojeniowa i wyższa produkcja wojskowa przez rok kosztem dóbr konsumpcyjnych i stabilności."
 RCHJ_e6:0 "Drewno i jeziora"
 RCHJ_e6_desc:0 "Zabory mają swoją gospodarkę."
 RCHJ_m1:0 "Strzelcy Zaborscy"
 RCHJ_m1_desc:0 "Ochotnicy tworzą strzelców."
 RCHJ_m2:0 "Pobór kaszubski"
 RCHJ_m2_desc:0 "Gminy kaszubskie wystawiają kompanie.\n\n§YWybór:§! dużo rekrutów od razu, ale przez pół roku fabryki tracą robotników, a nowe jednostki trzeba wyposażyć."
 RCHJ_m3:0 "Broń leśników"
 RCHJ_m3_desc:0 "Leśnicy i myśliwi oddają broń.\n\n§YWybór:§! mniej rekrutów, ale broń z magazynów, krótsze szkolenie i lepsza organizacja przez pół roku."
 RCHJ_m4:0 "Dywizja Zaborska"
 RCHJ_m4_desc:0 "Strzelcy tworzą dywizję."
 RCHJ_m5:0 "Strzelcy Zaborscy"
 RCHJ_m5_desc:0 "Strzelcy znają każdą ścieżkę w Borach."
 RCHJ_d0:0 "Między Pomorzem a Krajną"
 RCHJ_d0_desc:0 "Krajna, Pomorze, Bory i PKP – Chojnice są otoczone."
 RCHJ_s1:0 "Związek Borów i Zaborów"
 RCHJ_s1_desc:0 "Chojnice proponują sąsiadom wspólną obronę."
 RCHJ_s2:0 "Wspólne lasy"
 RCHJ_s2_desc:0 "Członkowie Związku mają wspólną straż leśną."
