 PL2027_ROS_DESC:0 "Rosja trzyma Obwód Królewiecki i skrawek północnej Warmii. Wojna w Ukrainie wciąż trwa, armia jest wyczerpana, a elity coraz głośniej szepczą o następcy. Rozpad Polski to dla Władimira Putina ostatnia okazja na zwycięstwo – i ostatnia szansa, by Kreml przetrwał."
