l_english:
 ROS_wyczerpana_armia:0 "Wyczerpana armia"
 ROS_wyczerpana_armia_desc:0 "Najlepsze jednostki obwodu walczą albo zginęły w Ukrainie. Zostali rezerwiści i sprzęt z magazynów."
 ROS_koszty_wojny:0 "Rosnące koszty wojny"
 ROS_koszty_wojny_desc:0 "Każdy miesiąc wojny to miliardy rubli. W sklepach brakuje towarów, a ceny rosną."
 ROS_niezadowolenie:0 "Niezadowolenie społeczne"
 ROS_niezadowolenie_desc:0 "Ludzie są zmęczeni wojną, mobilizacją i kłamstwami telewizji."
 ROS_kryzys_elit:0 "Kryzys elit"
 ROS_kryzys_elit_desc:0 "Oligarchowie, generałowie i urzędnicy szukają już miejsca w Rosji po Putinie."
 ROS_front_ukrainski:0 "Front ukraiński"
 ROS_front_ukrainski_desc:0 "Wojna w Ukrainie wciąż wiąże większość rosyjskiej armii. Obwód dostaje tylko to, co zostanie."
 ROS_zaplecze_imperium:0 "Zaplecze imperium"
 ROS_zaplecze_imperium_desc:0 "Obwód Królewiecki to tylko skrawek Rosji. Za nim stoją fabryki, pieniądze i rezerwy całego kraju."
 ROS_iskander:0 "Brygada Iskanderów"
 ROS_iskander_desc:0 "Rakiety balistyczne z Czerniachowska mogą uderzyć w każdy punkt Mazur."
 ROS_planowanie:0 "Plan operacyjny"
 ROS_planowanie_desc:0 "Sztab przygotował plan ofensywy kilometr po kilometrze."
 ROS_przewaga_powietrzna:0 "Przewaga w powietrzu"
 ROS_przewaga_powietrzna_desc:0 "Rosyjskie śmigłowce i drony panują nad Mazurami."
 ROS_szturm:0 "Szturm"
 ROS_szturm_desc:0 "Jednostki szturmowe dostały rozkaz nacierania bez względu na straty."
 ROS_przesmyk:0 "Przesmyk suwalski"
 ROS_przesmyk_desc:0 "Kolumny z obwodu i z Białorusi idą sobie naprzeciw."
 ROS_zaklocanie:0 "Wojna elektroniczna"
 ROS_zaklocanie_desc:0 "Drony obrońców spadają z nieba, a łączność rwie się co kilka minut."
 ROS_kociol:0 "Kocioł mazurski"
 ROS_kociol_desc:0 "Lasy i jeziora dzielą obrońców na małe, odcięte grupy."
 ROS_obrona_pozycji:0 "Obrona zdobytych pozycji"
 ROS_obrona_pozycji_desc:0 "Jednostki okopały się i czekają na rozkazy z Moskwy."
 ROS_ani_kroku:0 "Ani kroku w tył"
 ROS_ani_kroku_desc:0 "Odwrót bez rozkazu jest zdradą."
 ROS_twierdza_krolewiec:0 "Twierdza Królewiec"
 ROS_twierdza_krolewiec_desc:0 "Obwód zamienił się w jedną wielką twierdzę."
 ROS_zwyciestwo_za_wszelka_cene:0 "Zwycięstwo za wszelką cenę"
 ROS_zwyciestwo_za_wszelka_cene_desc:0 "Straty nie mają znaczenia. Liczy się tylko zwycięstwo."
 ROS_proznia_wladzy:0 "Próżnia władzy"
 ROS_proznia_wladzy_desc:0 "Kreml nie ma gospodarza. Każda decyzja wymaga zgody kilku frakcji, które sobie nie ufają."
 ROS_chaos_sztab:0 "Chaos w sztabie generalnym"
 ROS_chaos_sztab_desc:0 "Rozkazy z Moskwy są sprzeczne, a dowódcy na Mazurach nie wiedzą, kogo słuchać."
 ROS_niepewna_przyszlosc:0 "Niepewna przyszłość"
 ROS_niepewna_przyszlosc_desc:0 "Nikt nie wie, kto będzie rządził Rosją za miesiąc. Rubel traci, a ludzie wypłacają oszczędności."
 ROS_putin_umocniony:0 "Prezydent przetrwał"
 ROS_putin_umocniony_desc:0 "Ci, którzy już szykowali się do walki o sukcesję, muszą udawać, że nigdy w to nie wątpili."
 ROS_administracja_kryzysowa:0 "Administracja kryzysowa"
 ROS_administracja_kryzysowa_desc:0 "Rząd tymczasowy działa na podstawie nadzwyczajnych dekretów i ma tylko jedno zadanie: doprowadzić do wyborów."
 ROS_stan_wyjatkowy:0 "Stan wyjątkowy"
 ROS_stan_wyjatkowy_desc:0 "Godzina policyjna, cenzura i sądy wojskowe."
 ROS_mie_putinizm:0 "Putinizm bez Putina"
 ROS_mie_putinizm_desc:0 "Ten sam system, te same media, ten sam język. Tylko twarz na portretach jest inna."
 ROS_szo_junta:0 "Rządy wojskowych"
 ROS_szo_junta_desc:0 "Państwem kieruje Rada Najwyższego Dowództwa."
 ROS_cho_oligarchia:0 "Republika inwestorów"
 ROS_cho_oligarchia_desc:0 "Rosją rządzą ci, którzy mają pieniądze – tym razem otwarcie."
 ROS_szl_parlament:0 "Demokracja parlamentarna"
 ROS_szl_parlament_desc:0 "Duma znów jest miejscem sporów, a nie maszynką do głosowania."
 ROS_naw_antykorupcja:0 "Rewolucja antykorupcyjna"
 ROS_naw_antykorupcja_desc:0 "Państwo odzyskuje pieniądze, które przez dekady wyprowadzano za granicę."
 ROS_triumf_mazurski:0 "Triumf na Mazurach"
 ROS_triumf_mazurski_desc:0 "Pierwsze od lat zwycięstwo, które można pokazać na mapie."
 ROS_administracja_mazur:0 "Administracja wojskowa Mazur"
 ROS_administracja_mazur_desc:0 "Zajęte ziemie są zarządzane przez komendantury wojskowe. Opór nie słabnie."
 ROS_kryzys_rzadowy:0 "Kryzys rządowy"
 ROS_kryzys_rzadowy_desc:0 "Klęska podważyła autorytet władzy. W Moskwie mówi się o następcy."
 ROS_pokoj_negocjowany:0 "Pokój negocjowany"
 ROS_pokoj_negocjowany_desc:0 "Wojna na Mazurach się skończyła. Nie wszyscy uważają, że to dobrze."
 ROS_wieczna_rosja:0 "Wieczna Rosja"
 ROS_wieczna_rosja_desc:0 "System okazał się silniejszy niż wszystkie kryzysy."
 ROS_jesien_patriarchy:0 "Jesień patriarchy"
 ROS_jesien_patriarchy_desc:0 "Starzejący się przywódca, dwór walczący o sukcesję i państwo, które przestaje działać."
 ROS_drugie_imperium:0 "Drugie imperium"
 ROS_drugie_imperium_desc:0 "Rosja znów jest imperium – przynajmniej we własnych oczach."
 ROS_panstwo_koszary:0 "Państwo-koszary"
 ROS_panstwo_koszary_desc:0 "Cały kraj zorganizowany jak jednostka wojskowa."
 ROS_rosja_sa:0 "Rosja S.A."
 ROS_rosja_sa_desc:0 "Państwo zarządzane jak spółka giełdowa."
 ROS_federacja:0 "Federacja równych"
 ROS_federacja_desc:0 "Republiki i obwody rządzą się same."
 ROS_nowa_demokracja:0 "Nowa demokracja"
 ROS_nowa_demokracja_desc:0 "Pierwsze pokojowe przekazanie władzy w historii Rosji."
 PL2027_mobilizacja_mazurska:0 "Mobilizacja przeciw Rosji"
 PL2027_mobilizacja_mazurska_desc:0 "Rosyjskie czołgi przekroczyły granicę. Każdy, kto potrafi trzymać broń, zgłasza się do obrony."
 PL2027_chaos_w_moskwie:0 "Chaos w Moskwie"
 PL2027_chaos_w_moskwie_desc:0 "Rosja straciła przywódcę. To szansa, której nie wolno zmarnować."
 PL2027_republika_baltycka:0 "Republika nad Pregołą"
 PL2027_republika_baltycka_desc:0 "Obwód Królewiecki wybił się na niepodległość. Teraz musi ją utrzymać."
 ROS_putin:0 "Władimir Putin"
 ROS_premier:0 "Premier – p.o. Prezydenta"
 ROS_poklonska:0 "Natalia Pokłonska"
 ROS_miedwiediew:0 "Dmitrij Miedwiediew"
 ROS_szojgu:0 "Siergiej Szojgu"
 ROS_chodorkowski:0 "Michaił Chodorkowski"
 ROS_szlosberg:0 "Lew Szlosberg"
 ROS_nawalna:0 "Julia Nawalna"
 ros.1.t:0 "Rosja atakuje Mazury!"
 ros.1.d:0 "Nad ranem rosyjska artyleria otworzyła ogień wzdłuż granicy z obwodem. Kolumny pancerne przekraczają linię demarkacyjną pod Bartoszycami i Gołdapią, a z Białorusi napływają meldunki o ruchach wojsk w stronę Suwałk.\n\nNikt nie przyjdzie nam z pomocą – Warszawy już nie ma. Musimy bronić się sami."
 ros.1.a:0 "Do broni!"
 ros.2.t:0 "Wojna na Mazurach"
 ros.2.d:0 "Rosja zaatakowała państwa powstałe na Mazurach i Suwalszczyźnie. To pierwsza wojna z udziałem wielkiego mocarstwa na ziemiach dawnej Rzeczypospolitej od jej rozpadu. W Wilnie, Berlinie i Brukseli zwołano nadzwyczajne narady – ale nikt nie zapowiada interwencji."
 ros.2.a:0 "Zaczęło się."
 ros.2.b:0 "Naprzód."
 ros.21.t:0 "Prezydent przetrwał"
 ros.21.d:0 "Przez tydzień Kreml milczał, a w Moskwie krążyły plotki o zawale, operacji i tajnym pogrzebie. Dziś rano telewizja pokazała prezydenta przy biurku, odbierającego meldunek z Mazur. Wyglądał na zmęczonego – ale żył.\n\nCi, którzy już szykowali się do walki o sukcesję, muszą teraz udawać, że nigdy w to nie wątpili."
 ros.21.a:0 "Ostatni car Kremla."
 ros.100.t:0 "Putin nie żyje!"
 ros.100.d:0 "„Moskwa pogrążyła się w ciszy. Po tygodniach spekulacji Kreml potwierdził śmierć Władimira Putina. Władza w Rosji zaczyna się rozpadać. Generałowie domagają się kontroli nad armią, politycy przygotowują się do walki o prezydenturę, a obywatele nie wiedzą, co przyniesie jutro.”\n\nZgodnie z konstytucją obowiązki prezydenta przejmuje premier. Nikt jednak nie wierzy, że to on będzie decydował."
 ros.100.a:0 "Kto teraz będzie rządził Rosją?"
 ros.101.t:0 "Nie żyje prezydent Rosji"
 ros.101.d:0 "Kreml potwierdził śmierć Władimira Putina. W Moskwie trwa walka o władzę, a rosyjskie wojska czekają na rozkazy, które nie przychodzą. Na ziemiach dawnej Polski wielu po raz pierwszy od miesięcy patrzy w przyszłość z nadzieją."
 ros.101.a:0 "Era się skończyła."
 ros.101.b:0 "Rosja przetrwa."
 ros.102.t:0 "Szansa dla Mazur"
 ros.102.d:0 "Rosyjskie dowództwo jest sparaliżowane. Jednostki na froncie nie wiedzą, czy mają nacierać, czy się okopać. Jeśli kiedykolwiek mamy odzyskać utracone ziemie, to teraz."
 ros.102.a:0 "Kontratak!"
 ros.199.t:0 "Wybierz przyszłość Rosji"
 ros.199.d:0 "Lokale wyborcze zostały zamknięte, a komisje liczą głosy. Od wyniku zależy nie tylko, kto zasiądzie na Kremlu, ale też co stanie się z wojną na Mazurach."
 ros.199.a:0 "Dmitrij Miedwiediew"
 ros.199.b:0 "Siergiej Szojgu"
 ros.199.c:0 "Michaił Chodorkowski"
 ros.199.e:0 "Lew Szlosberg"
 ros.199.f:0 "Julia Nawalna"
 ros.201.t:0 "Prezydent Miedwiediew"
 ros.201.d:0 "Dmitrij Miedwiediew wygrał wybory. Aparat partii władzy, gubernatorzy i państwowa telewizja zrobili swoje. Nowy prezydent obiecuje kontynuację – i zwycięstwo na Mazurach."
 ros.201.a:0 "Kontynuacja."
 ros.202.t:0 "Najwyższy Dowódca Szojgu"
 ros.202.d:0 "Siergiej Szojgu przejmuje pełnię władzy. Armia ma teraz własne państwo – albo państwo ma swoją armię. W Moskwie mało kto widzi różnicę."
 ros.202.a:0 "Porządek ponad wszystko."
 ros.203.t:0 "Prezydent Chodorkowski"
 ros.203.d:0 "Michaił Chodorkowski wygrywa wybory. To wariant fikcyjny: Rosja ma odtąd być republiką inwestorów, w której pieniądze mówią głośniej niż generałowie."
 ros.203.a:0 "Czas na interesy."
 ros.204.t:0 "Prezydent Szlosberg"
 ros.204.d:0 "Lew Szlosberg wygrywa wybory. Jabłoko, partia, która przez dekady była na marginesie, nagle rządzi największym krajem świata. Szlosberg zapowiada demokrację parlamentarną i koniec wojny."
 ros.204.a:0 "Parlament ponad Kremlem."
 ros.205.t:0 "Prezydent Nawalna"
 ros.205.d:0 "Julia Nawalna wygrywa wybory. Na placu Maneżowym tysiące ludzi trzymają zdjęcia jej męża. Nowa prezydent mówi o więźniach politycznych, korupcji i natychmiastowym zawieszeniu broni."
 ros.205.a:0 "Rosja przyszłości."
 ros.300.t:0 "Rosyjskie zwycięstwo na Mazurach"
 ros.300.d:0 "Nad ratuszem w Olsztynie i nad fortami w Giżycku powiewają rosyjskie flagi. Obrona państw mazurskich załamała się.\n\nW Moskwie trwa spór, co dalej: włączyć Mazury do Federacji, oddać je pod zarząd wojskowy czy stworzyć zależne państwo, które będzie kosztować mniej niż okupacja. Wybór czeka w drzewku narodowym (cele „Przyszłość Mazur”)."
 ros.300.a:0 "Mazury są nasze."
 ros.302.t:0 "Moskwa nie może dłużej czekać"
 ros.302.d:0 "Od zwycięstwa na Mazurach minęły cztery miesiące, a w Moskwie wciąż nie zapadła decyzja, co zrobić z zajętymi ziemiami. Sztab generalny i administracja prezydenta przestały czekać i same wprowadzają rozwiązanie zgodne z linią obecnej władzy."
 ros.302.a:0 "Niech tak będzie."
 ros.301.t:0 "Mazury pod rosyjską kontrolą"
 ros.301.d:0 "Państwa powstałe na Mazurach po rozpadzie Polski nie wytrzymały rosyjskiej ofensywy. Rosja kontroluje Olsztyn, Giżycko i Suwałki. Sąsiedzi pytają, kto będzie następny."
 ros.301.a:0 "Kto następny?"
 ros.301.b:0 "Zwycięstwo!"
 ros.310.t:0 "Klęska ofensywy na Mazurach"
 ros.310.d:0 "Ofensywa ugrzęzła w lasach i na bagnach. Kolumny, które miały dojść do Suwałk, wracają do obwodu z połową stanu. Sztab przyznaje, że dalsza walka nie ma sensu.\n\nW Moskwie zaczyna się szukanie winnych."
 ros.310.a:0 "Kto za to odpowie?"
 ros.311.t:0 "Miedwiediew traci poparcie"
 ros.311.d:0 "Klęska na Mazurach uderzyła prosto w prezydenta. Gubernatorzy przestają odbierać telefony z Kremla, a deputowani Jednej Rosji szukają nowego patrona."
 ros.311.a:0 "Rozpisać przedterminowe wybory."
 ros.311.b:0 "Utrzymać władzę za wszelką cenę."
 ros.312.t:0 "Bunt generałów"
 ros.312.d:0 "Dowódcy, którzy przeżyli Mazury, obwiniają Najwyższego Dowódcę. W dwóch okręgach wojskowych sztaby odmówiły wykonania rozkazów."
 ros.312.a:0 "Stłumić bunt."
 ros.312.b:0 "Oddać władzę cywilom."
 ros.313.t:0 "Wymuszone negocjacje"
 ros.313.d:0 "Członkowie Rady Gospodarczej liczą straty. Wojna przestała się opłacać już dawno, a teraz grozi bankructwem połowy z nich. Chodorkowski musi siąść do stołu."
 ros.313.a:0 "Interesy wymagają pokoju."
 ros.314.t:0 "Kryzys reżimu"
 ros.314.d:0 "Po raz pierwszy od dekad ludzie z otoczenia prezydenta mówią głośno, że czas na zmianę. Telewizja milczy o Mazurach."
 ros.314.a:0 "To tylko chwilowe trudności."
 ros.315.t:0 "Gorzka lekcja"
 ros.315.d:0 "Klęska na Mazurach to cios dla nowej władzy, choć to nie ona zaczęła tę wojnę."
 ros.315.a:0 "Musimy to przetrwać."
 ros.316.t:0 "Rosja przegrywa na Mazurach"
 ros.316.d:0 "Rosyjska ofensywa na Mazurach zakończyła się klęską. Wojska wycofują się do Obwodu Królewieckiego. Państwa mazurskie świętują, ale wiedzą, że Rosja nie zapomni."
 ros.316.a:0 "Zwycięstwo!"
 ros.316.b:0 "Hańba."
 ros.320.t:0 "Bunt w Królewcu"
 ros.320.d:0 "Po klęsce na Mazurach na ulicach Królewca, Tylży i Wystrucia pojawiają się tysiące ludzi z flagami „Republiki Bałtyckiej”. Część garnizonów przechodzi na stronę protestujących. Moskwa nie ma już siły, by ich powstrzymać."
 ros.320.a:0 "Niech idą."
 ros.321.t:0 "Republika nad Pregołą"
 ros.321.d:0 "Wschodnia część obwodu ogłosiła niepodległość. Nowe państwo nie ma armii, pieniędzy ani uznania – ma za to ludzi, którzy nie chcą już umierać za Moskwę."
 ros.321.a:0 "Wolność!"
 ros.330.t:0 "Zawieszenie broni na Mazurach"
 ros.330.d:0 "Rosyjska delegacja ogłosiła jednostronne zawieszenie broni i wycofanie wojsk z Mazur. Linia frontu ma wrócić do granic sprzed wojny. Nie wszyscy w to wierzą – ale po raz pierwszy od miesięcy w nocy jest cicho."
 ros.330.a:0 "Trzeba odbudować to, co zniszczono."
 ros.331.t:0 "Pokój na Mazurach"
 ros.331.d:0 "Nowe władze w Moskwie zakończyły wojnę na Mazurach. Rosyjskie wojska wracają do Obwodu Królewieckiego, a sąsiednie państwa otrzymały zapewnienia o zawieszeniu broni."
 ros.331.a:0 "Oby na długo."
 ros.331.b:0 "Pokój."
 ROS_wojna_kat:0 "Wojna na Mazurach"
 ROS_wojna_kat_desc:0 "Moskwa może wspierać obwód ludźmi i sprzętem – ale każdy transport przez Białoruś albo nad Bałtykiem kosztuje."
 ROS_mazury_kat:0 "Przyszłość Mazur"
 ROS_mazury_kat_desc:0 "Ofensywa się powiodła. Teraz trzeba zdecydować, co zrobić ze zdobytymi ziemiami."
 ROS_dec_posilki:0 "Posiłki z Moskwy"
 ROS_dec_posilki_desc:0 "Dwie batalionowe grupy taktyczne przejadą przez Białoruś albo przypłyną z Ust-Ługi."
 ROS_dec_most:0 "Most powietrzny"
 ROS_dec_most_desc:0 "Samoloty transportowe przywiozą amunicję i broń dla obwodu."
 ROS_dec_mobilizacja:0 "Mobilizacja w obwodzie"
 ROS_dec_mobilizacja_desc:0 "Kolejna fala wezwań do wojska. Mieszkańcy obwodu mają coraz mniej cierpliwości."
 ROS_PUTIN_FATE:0 "Rosja: los Putina"
 ROS_PUTIN_FATE_RANDOM:0 "Losowy (90% śmierci)"
 ROS_PUTIN_FATE_RANDOM_DESC:0 "W połowie wojny na Mazurach – gdy Rosja zajmie połowę ziem Mazur albo po 180 dniach walk (a jeśli do interwencji nie dojdzie – wiosną 2028) – gra rozstrzyga, czy Putin umiera (90%) czy przeżywa (10%)."
 ROS_PUTIN_FATE_DIES:0 "Zawsze umiera"
 ROS_PUTIN_FATE_DIES_DESC:0 "Putin zawsze umiera 45 dni po rozpoczęciu interwencji – Rosja wchodzi w kryzys sukcesji."
 ROS_PUTIN_FATE_SURVIVES:0 "Zawsze przeżywa"
 ROS_PUTIN_FATE_SURVIVES_DESC:0 "Putin przeżywa i prowadzi wojnę do końca (drzewko „Ostatni car Kremla”)."
 ROS_ELECTIONS:0 "Rosja: wybory prezydenckie"
 ROS_ELECTIONS_WEIGHTED:0 "Ważone losowanie"
 ROS_ELECTIONS_WEIGHTED_DESC:0 "Zwycięzca jest losowany – im większe poparcie zbudowały fokusy, tym większa szansa kandydata."
 ROS_ELECTIONS_PLAYER:0 "Wybór gracza"
 ROS_ELECTIONS_PLAYER_DESC:0 "Gracz grający Rosją sam wybiera zwycięzcę wyborów."
 PL2027_SOJUSZ_MAZURSKI:0 "Sojusz Mazurski"
