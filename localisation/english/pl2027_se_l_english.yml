 PL2027_SE_naglowek_ivrp_sejm:0 "IV RZECZPOSPOLITA POLSKA  ·  REPUBLIKA SEJMOWA"
 PL2027_SE_tytul_ivrp_sejm:0 "NARODZINY IV RZECZYPOSPOLITEJ"
 PL2027_SE_opis_ivrp_sejm:0 "Rząd i Sejm biorą Warszawę w swoje ręce. W sali plenarnej przy Wiejskiej odczytano akt proklamacji: Rzeczpospolita nie umarła – odradza się jako republika, w której władza należy do przedstawicieli Narodu. Przed Pałacem Kultury tłum macha flagami do rana."
 PL2027_SE_przycisk_ivrp_sejm:0 "Niech żyje Rzeczpospolita!"
 PL2027_SE_naglowek_ivrp_prezydent:0 "IV RZECZPOSPOLITA POLSKA  ·  REPUBLIKA PREZYDENCKA"
 PL2027_SE_tytul_ivrp_prezydent:0 "NARODZINY IV RZECZYPOSPOLITEJ"
 PL2027_SE_opis_ivrp_prezydent:0 "Przed Pałacem Prezydenckim stoją kolumny Wojska, nad Krakowskim Przedmieściem krążą śmigłowce. Dekret nr 1 ogłasza powstanie IV Rzeczypospolitej Polskiej – do czasu „przywrócenia normalności” władza należy do Prezydenta."
 PL2027_SE_przycisk_ivrp_prezydent:0 "Za Prezydentem!"
 PL2027_SE_naglowek_ivrp_mafia:0 "IV RZECZPOSPOLITA POLSKA  ·  RZECZPOSPOLITA RODZIN"
 PL2027_SE_tytul_ivrp_mafia:0 "NARODZINY IV RZECZYPOSPOLITEJ"
 PL2027_SE_opis_ivrp_mafia:0 "Nikt nie przemawia z balkonu. Akt proklamacji podpisano nocą, przy czarnych limuzynach i walizkach pełnych gotówki. Rano Warszawa budzi się w IV Rzeczypospolitej – urzędów pilnują ludzie z Pruszkowa, a „wszyscy dostaną swoją działkę”."
 PL2027_SE_przycisk_ivrp_mafia:0 "Rodzina pozdrawia."
 PL2027_SE_naglowek_inwazja_rosji:0 "MAZURY  ·  GRANICA OBWODU KRÓLEWIECKIEGO"
 PL2027_SE_tytul_inwazja_rosji:0 "ROSJA WKRACZA NA MAZURY"
 PL2027_SE_opis_inwazja_rosji:0 "O świcie kolumny z obwodu królewieckiego przekraczają granicę pod Bezledami i Gołdapią. Moskwa mówi o „operacji stabilizacyjnej” i „ochronie ludności”, a w Olsztynie syreny wyją po raz pierwszy od osiemdziesięciu lat. Rozbita Polska nie ma jednej armii, która mogłaby stanąć na drodze – ma kilkanaście."
 PL2027_SE_przycisk_inwazja_rosji:0 "Mazury będą walczyć."
 PL2027_SE_naglowek_krucjata:0 "ZAKON KRZYŻACKI  ·  MALBORK"
 PL2027_SE_tytul_krucjata:0 "WYPRAWA KRZYŻOWA"
 PL2027_SE_opis_krucjata:0 "Z bram zamku w Malborku wyjeżdżają kolumny pod czarnym krzyżem. Wielki Mistrz ogłasza, że ziemie dawnego Państwa Zakonnego „wracają do prawowitych właścicieli”. Jeszcze niedawno śmiano się z rekonstruktorów w płaszczach – dziś nikt się nie śmieje."
 PL2027_SE_przycisk_krucjata:0 "Niech Bóg ma nas w opiece."
 PL2027_SE_naglowek_wojna_metropolitalna:0 "TORUŃ  ·  BYDGOSZCZ"
 PL2027_SE_tytul_wojna_metropolitalna:0 "WOJNA METROPOLITALNA"
 PL2027_SE_opis_wojna_metropolitalna:0 "Czterdzieści kilometrów, sto lat rywalizacji i jeden spór, którego nikt nie umiał rozstrzygnąć: która z nich jest stolicą regionu. Spór o urzędy, lotnisko i pieniądze z Unii zamienia się w wojnę. Między miastami stoją gminy, które właśnie stały się linią frontu."
 PL2027_SE_przycisk_wojna_metropolitalna:0 "Jest tylko jedna metropolia."
 PL2027_SE_naglowek_bialorus:0 "PODLASIE  ·  GRANICA NA BUGU"
 PL2027_SE_tytul_bialorus:0 "BIAŁORUŚ PRZEKRACZA BUG"
 PL2027_SE_opis_bialorus:0 "Białoruskie dywizje przechodzą przez mosty na Bugu, które jeszcze tydzień temu pilnowała Straż Graniczna. Mińsk mówi o „wsparciu sojusznika z Państwa Związkowego”. Podlasie, które przez lata broniło granicy przed przemytnikami, ma teraz przed sobą regularną armię."
 PL2027_SE_przycisk_bialorus:0 "Bronimy granicy."
 PL2027_SE_naglowek_bitwa_o_warszawe:0 "WARSZAWA  ·  SEJM  ·  PAŁAC  ·  PRUSZKÓW"
 PL2027_SE_tytul_bitwa_o_warszawe:0 "BITWA O WARSZAWĘ"
 PL2027_SE_opis_bitwa_o_warszawe:0 "Rozejm między blokami trwał tylko tak długo, jak długo każdy liczył, że wygra bez strzału. Na Wiejskiej, Krakowskim Przedmieściu i Alejach Jerozolimskich stają barykady. Kto utrzyma Śródmieście, ten będzie mówił w imieniu Polski."
 PL2027_SE_przycisk_bitwa_o_warszawe:0 "Warszawa wybierze."
 PL2027_SE_naglowek_odrodzona:0 "RZECZPOSPOLITA POLSKA"
 PL2027_SE_tytul_odrodzona:0 "ORZEŁ POWSTAJE"
 PL2027_SE_opis_odrodzona:0 "Nad Zamkiem Królewskim znów powiewa biało-czerwona flaga państwa, które sięga od wielu rzek do wielu granic. Po latach rozbicia Polska ma jeden rząd, jedną armię i jedną stolicę. Orzeł spadł – ale się podniósł."
 PL2027_SE_przycisk_odrodzona:0 "Jeszcze Polska nie zginęła."
 PL2027_SE_naglowek_zima:0 "PIERWSZA ZIMA ROZPADU"
 PL2027_SE_tytul_zima:0 "NOC BEZ ŚWIATŁA"
 PL2027_SE_opis_zima:0 "Styczniowy mróz przychodzi do kraju, w którym nikt nie odpowiada za sieć energetyczną. Elektrownie stają, ciepłownie nie mają węgla, a z kosmosu Polska po raz pierwszy wygląda jak puste pole – z kilkoma światłami tam, gdzie ktoś jeszcze trzyma władzę."
 PL2027_SE_przycisk_zima:0 "Przetrwamy tę zimę."
 PL2027_SE_naglowek_kapitulacja:0 "KAPITULACJA  ·  [PL2027_SE_Get_przegrany]"
 PL2027_SE_tytul_kapitulacja:0 "BIAŁA FLAGA"
 PL2027_SE_opis_kapitulacja:0 "Front się załamał. Delegacja państwa „[PL2027_SE_Get_przegrany]” podpisała akt kapitulacji przed przedstawicielami państwa „[PL2027_SE_Get_zwyciezca]”. Żołnierze składają broń na rynkach miast, w których jeszcze niedawno nikt nie myślał o granicach. Rozbita Polska ma o jednego gracza mniej."
 PL2027_SE_przycisk_kapitulacja:0 "Taka jest wojna."
 PL2027_SE_naglowek_aneksja:0 "KONIEC PAŃSTWA  ·  [PL2027_SE_Get_przegrany]"
 PL2027_SE_tytul_aneksja:0 "ZNIKA Z MAPY"
 PL2027_SE_opis_aneksja:0 "Ostatnie urzędy państwa „[PL2027_SE_Get_przegrany]” zamknięto, a jego flagę zdjęto z masztów. Ziemie, ludzie i magazyny przechodzą pod władzę państwa „[PL2027_SE_Get_zwyciezca]”. W kronikach rozbicia zostanie po nim kilka linijek – i granica, której już nie ma."
 PL2027_SE_przycisk_aneksja:0 "Historia pisze się dalej."
 PL2027_SE_naglowek_rosja_triumf:0 "MAZURY  ·  KONIEC WOJNY Z ROSJĄ"
 PL2027_SE_tytul_rosja_triumf:0 "MAZURY POD ROSYJSKĄ FLAGĄ"
 PL2027_SE_opis_rosja_triumf:0 "Działa umilkły, ale nie dlatego, że ktoś wygrał rozmowy pokojowe. Nad ratuszem w Olsztynie wisi rosyjska flaga, a w Moskwie mówią o „przywróconym porządku”. Na Mazurach zaczyna się życie pod okupacją – a reszta rozbitej Polski patrzy na wschód z rosnącym strachem."
 PL2027_SE_przycisk_rosja_triumf:0 "Tego nie zapomnimy."
 PL2027_SE_naglowek_rosja_odparta:0 "MAZURY  ·  KONIEC WOJNY Z ROSJĄ"
 PL2027_SE_tytul_rosja_odparta:0 "ROSJA ODPARTA"
 PL2027_SE_opis_rosja_odparta:0 "Kolumny wracają tam, skąd przyszły. Rozbita Polska, która nie miała jednej armii, zatrzymała ofensywę z obwodu królewieckiego siłami kilkunastu państw, gmin i ochotników. Olsztyn świętuje, a na granicy pod Gołdapią znów stoją polskie posterunki."
 PL2027_SE_przycisk_rosja_odparta:0 "Mazury wytrzymały!"
 PL2027_SE_naglowek_bialorus_triumf:0 "PODLASIE  ·  KONIEC WOJNY Z BIAŁORUSIĄ"
 PL2027_SE_tytul_bialorus_triumf:0 "BIAŁYSTOK POD OKUPACJĄ"
 PL2027_SE_opis_bialorus_triumf:0 "Nad białostockim ratuszem wisi czerwono-zielona flaga. Mińsk ogłasza „tymczasową administrację” i zamyka drogi na zachód. Ludzie, którzy latami słyszeli o wojnie hybrydowej na granicy, dziś mieszkają po jej drugiej stronie."
 PL2027_SE_przycisk_bialorus_triumf:0 "Bug kiedyś znów będzie granicą."
 PL2027_SE_naglowek_bialorus_odparta:0 "PODLASIE  ·  KONIEC WOJNY Z BIAŁORUSIĄ"
 PL2027_SE_tytul_bialorus_odparta:0 "BIAŁORUŚ ZA BUGIEM"
 PL2027_SE_opis_bialorus_odparta:0 "Białoruskie dywizje wycofują się za Bug. Mosty, po których niedawno przejeżdżały czołgi, znów pilnują żołnierze z Podlasia. Mińsk milczy, a w Białymstoku biją dzwony."
 PL2027_SE_przycisk_bialorus_odparta:0 "Granica wytrzymała."
 PL2027_SE_naglowek_zakon_triumf:0 "ZAKON KRZYŻACKI  ·  KONIEC KRUCJATY"
 PL2027_SE_tytul_zakon_triumf:0 "PAŃSTWO ZAKONNE POWRACA"
 PL2027_SE_opis_zakon_triumf:0 "Czarny krzyż powiewa nad miastami, z których zniknął ponad pięćset lat temu. Wielki Mistrz przyjmuje hołdy w Malborku, a kronikarze zakonu piszą o „powrocie porządku”. To, co zaczęło się jak rekonstrukcja historyczna, skończyło się państwem."
 PL2027_SE_przycisk_zakon_triumf:0 "Niech Bóg ma nas w opiece."
 PL2027_SE_naglowek_zakon_upadek:0 "MALBORK  ·  KONIEC KRUCJATY"
 PL2027_SE_tytul_zakon_upadek:0 "UPADEK ZAKONU"
 PL2027_SE_opis_zakon_upadek:0 "Mury Malborka drugi raz nie wytrzymały. Ostatni rycerze zdejmują płaszcze z czarnym krzyżem, a sztandary zakonu wracają do muzeum, z którego je kiedyś wyniesiono. Krucjata skończyła się tam, gdzie się zaczęła."
 PL2027_SE_przycisk_zakon_upadek:0 "Grunwald, część druga."
 PL2027_SE_naglowek_torun_wygrywa:0 "TORUŃ  ·  BYDGOSZCZ  ·  KONIEC WOJNY METROPOLITALNEJ"
 PL2027_SE_tytul_torun_wygrywa:0 "TORUŃ STOLICĄ REGIONU"
 PL2027_SE_opis_torun_wygrywa:0 "Spór trwał sto lat, a skończył się w kilka miesięcy. Nad bydgoskim ratuszem wisi flaga Torunia, urzędy zostają nad Wisłą przy Starówce, a lotnisko – cóż, lotnisko też jest teraz toruńskie."
 PL2027_SE_przycisk_torun_wygrywa:0 "Jest tylko jedna metropolia."
 PL2027_SE_naglowek_bydgoszcz_wygrywa:0 "TORUŃ  ·  BYDGOSZCZ  ·  KONIEC WOJNY METROPOLITALNEJ"
 PL2027_SE_tytul_bydgoszcz_wygrywa:0 "BYDGOSZCZ STOLICĄ REGIONU"
 PL2027_SE_opis_bydgoszcz_wygrywa:0 "Toruń skapitulował. Na Rynku Staromiejskim stoją bydgoskie patrole, a urzędy przenoszą się nad Brdę. W Bydgoszczy mówią, że sprawiedliwości stało się zadość – w Toruniu wolą nic nie mówić."
 PL2027_SE_przycisk_bydgoszcz_wygrywa:0 "Jest tylko jedna metropolia."
 PL2027_SE_naglowek_warszawa_smr:0 "WARSZAWA  ·  KONIEC BITWY O STOLICĘ"
 PL2027_SE_tytul_warszawa_smr:0 "SEJM UTRZYMAŁ WARSZAWĘ"
 PL2027_SE_opis_warszawa_smr:0 "Barykady na Wiejskiej rozbiera się w ciszy. Straż Marszałkowska kontroluje Śródmieście, a z mównicy pada zapowiedź „przywrócenia porządku konstytucyjnego”. To, kto będzie mówił w imieniu Warszawy, rozstrzygnęło się na ulicach."
 PL2027_SE_przycisk_warszawa_smr:0 "Za Sejmem!"
 PL2027_SE_naglowek_warszawa_kpr:0 "WARSZAWA  ·  KONIEC BITWY O STOLICĘ"
 PL2027_SE_tytul_warszawa_kpr:0 "PAŁAC BIERZE WARSZAWĘ"
 PL2027_SE_opis_warszawa_kpr:0 "Nad Krakowskim Przedmieściem krążą śmigłowce, a funkcjonariusze SOP pilnują każdego skrzyżowania w Śródmieściu. Kancelaria ogłasza, że stolica jest bezpieczna – i że to ona będzie teraz mówić w imieniu Polski."
 PL2027_SE_przycisk_warszawa_kpr:0 "Za Pałacem!"
 PL2027_SE_naglowek_warszawa_mpr:0 "WARSZAWA  ·  KONIEC BITWY O STOLICĘ"
 PL2027_SE_tytul_warszawa_mpr:0 "PRUSZKÓW W ŚRÓDMIEŚCIU"
 PL2027_SE_opis_warszawa_mpr:0 "Nikt nie ogłosił zwycięstwa. Po prostu rano okazało się, że Śródmieścia pilnują ludzie z Pruszkowa, a urzędy znów działają – za odpowiednią opłatą. Mafia Pruszkowska ma teraz stolicę."
 PL2027_SE_przycisk_warszawa_mpr:0 "Rodzina dziękuje."
