l_english:
 TPZ_kryzys_dostaw:0 "Kryzys dostaw"
 TPZ_kryzys_dostaw_desc:0 "Po 11 listopada hurtownie stanęły, a sklepy we Włocławku świecą pustymi półkami. Jedyna flota, która wciąż jeździ po mieście, ma czerwone skrzynki z logo T-Pizzy."
 TPZ_darmowa_pizza:0 "Darmowa pizza dla mieszkańców"
 TPZ_darmowa_pizza_desc:0 "Rafał Archacki ogłasza w nagraniu z zaplecza: dziś nikt we Włocławku nie będzie głodny. Kolejka ustawia się od Zielonego Rynku aż po bulwary nad Wisłą."
 TPZ_awaryjne_magazyny:0 "Awaryjne magazyny"
 TPZ_awaryjne_magazyny_desc:0 "Chłodnie, kartony i zapasy mąki z całej sieci trafiają do hal przy centrali. Firma liczy kilogramy szybciej niż miejski sztab kryzysowy."
 TPZ_zaufanie:0 "Zaufanie Włocławka"
 TPZ_zaufanie_desc:0 "Ludzie przestali pytać, gdzie jest urząd – pytają, gdzie jest najbliższy kurier. Sondaż w aplikacji pokazuje, że firmie ufa więcej mieszkańców niż radzie miasta."
 TPZ_przejecie_ratusza:0 "Przejęcie ratusza"
 TPZ_przejecie_ratusza_desc:0 "Władze miasta podpisują umowę outsourcingu całej administracji z T-Pizza Sp. z o.o. Urzędnicy dostają firmowe polary, a sesje rady odbywają się w sali konferencyjnej centrali."
 TPZ_republika:0 "Republika Korporacyjna"
 TPZ_republika_desc:0 "Statut spółki zastępuje konstytucję, a walne zgromadzenie – parlament. Rafał „Archadzio” Archacki obejmuje funkcję prezesa zarządu państwa i obiecuje dostawę stabilności w 30 minut."
 TPZ_piece:0 "Nowe piece przemysłowe"
 TPZ_piece_desc:0 "Piece, które wypiekały tysiące pizz dziennie, dostają nowych braci – i nowe zastosowania. Zakład uczy się produkować coś więcej niż spody."
 TPZ_centrum_dystrybucji:0 "Wielkie centrum dystrybucji"
 TPZ_centrum_dystrybucji_desc:0 "Nowa hala logistyczna obsłuży całe Kujawy, a sąsiedzi mogą zamawiać dostawy strategiczne z odroczoną płatnością. Faktury przyjdą później – razem z odsetkami."
 TPZ_franczyza:0 "Franczyza zamiast urzędu"
 TPZ_franczyza_desc:0 "Po co gminie urzędnik, skoro może mieć franczyzobiorcę z terminalem płatniczym? Sąsiednie miasta mogą teraz otwierać lokale T-Pizza razem z pakietem usług administracyjnych."
 TPZ_maka:0 "Kontrola dostaw mąki"
 TPZ_maka_desc:0 "Młyny w Kowalu i Brześciu Kujawskim dostają wieloletnie kontrakty, a silosy – firmowe plomby. Kto kontroluje mąkę, ten kontroluje Kujawy."
 TPZ_podatek:0 "Podatek od konkurencji"
 TPZ_podatek_desc:0 "Każda pizzeria spoza sieci płaci teraz „opłatę wyrównawczą”. Budżet rośnie, ale na mieście pojawiają się ulotki o wolnym rynku."
 TPZ_monopol:0 "Monopol spożywczy"
 TPZ_monopol_desc:0 "Od chleba po kebab – każdy posiłek na Kujawach przechodzi przez nasz system zamówień. Sąsiedzi, którzy u nas kupują, nie mogą sobie pozwolić na kłótnię z zarządem."
 TPZ_kupony:0 "Kupony żywnościowe"
 TPZ_kupony_desc:0 "Każdy mieszkaniec dostaje miesięczną pulę kuponów na pizzę, pieczywo i makaron. Kartki jak za PRL-u, tylko z kodem QR."
 TPZ_pracowniczy:0 "Program pracowniczy"
 TPZ_pracowniczy_desc:0 "Bezrobotni z zamkniętych zakładów trafiają do kuchni, magazynów i floty skuterów. Każdy dostaje umowę, firmową kurtkę i 10% zniżki na menu."
 TPZ_premium:0 "Obywatelstwo Premium"
 TPZ_premium_desc:0 "Za miesięczny abonament obywatel dostaje szybszą obsługę w urzędzie, darmową dostawę i miejsce w pierwszym rzędzie na wiecu prezesa. Pozostali stoją w kolejce standardowej."
 TPZ_marketing:0 "Państwowy marketing"
 TPZ_marketing_desc:0 "Billboardy z uśmiechniętym prezesem stoją przy każdym wjeździe do miasta. Hasło „Smakuje jak niepodległość” przetestowano na trzech grupach fokusowych."
 TPZ_lojalnosc:0 "Program lojalnościowy"
 TPZ_lojalnosc_desc:0 "Każde zamówienie, każdy podatek i każda godzina w Straży Korporacyjnej nabija punkty. Można je wymienić na pizzę, przywileje albo dobry humor zarządu."
 TPZ_jedna_firma:0 "Jedna firma, jeden naród"
 TPZ_jedna_firma_desc:0 "Pracownik, klient i obywatel to dziś jedna i ta sama osoba. Na porannych odprawach śpiewamy hymn – w wersji z firmowym dżinglem."
 TPZ_ochrona_dostaw:0 "Ochrona dostaw"
 TPZ_ochrona_dostaw_desc:0 "Po kilku napadach na kurierów zarząd zatrudnia byłych żołnierzy do eskortowania transportów. Pizza ma dotrzeć ciepła i w całości."
 TPZ_skutery:0 "Skutery rozpoznawcze"
 TPZ_skutery_desc:0 "Kurierzy znają każdy zaułek od Zazamcza po Michelin. Teraz meldują nie tylko o adresach, ale też o ruchach obcych oddziałów."
 TPZ_magazyny_wojskowe:0 "Magazyny wojskowe"
 TPZ_magazyny_wojskowe_desc:0 "Część hal przy centrali dostaje kraty, alarmy i nowy asortyment. W katalogu obok sosu czosnkowego pojawiają się karabinki."
 TPZ_straz:0 "Straż Korporacyjna"
 TPZ_straz_desc:0 "Ochrona obiektów staje się formacją porządkową z własnym regulaminem i czerwonymi beretami. Funkcjonariusze mówią „dzień dobry” i „proszę okazać paragon”."
 TPZ_brygada:0 "Brygada Ekspresowej Dostawy"
 TPZ_brygada_desc:0 "Zmotoryzowana jednostka szybkiego reagowania dociera na front szybciej niż pizza na Zazamcze. Gwarancja 30 minut obowiązuje także na polu bitwy."
 TPZ_armia:0 "Armia T-Pizza"
 TPZ_armia_desc:0 "Mała, ale najlepiej zaopatrzona armia w środkowej Polsce. Każdy żołnierz ma ciepły posiłek, suche skarpety i aplikację do zamawiania amunicji."
 TPZ_brzesc:0 "Franczyza w Brześciu Kujawskim"
 TPZ_brzesc_desc:0 "Brześć zawsze miał własne ambicje, więc miejscowi przedsiębiorcy dostają franczyzę na preferencyjnych warunkach. Rada miejska przyjmuje ofertę przez aklamację – i przy dostawie."
 TPZ_kowal:0 "Oferta dla Kowala"
 TPZ_kowal_desc:0 "Radni i franczyzobiorcy z Kowala dostają pakiet: nowy lokal, udziały w spółce i obietnicę, że trasa do Kowala zawsze będzie priorytetowa."
 TPZ_lipno:0 "Kontrakty z Lipnem"
 TPZ_lipno_desc:0 "Ziemia Dobrzyńska potrzebuje mąki, paliwa i świętego spokoju. Podpisujemy z Lipnem długie kontrakty – drobnym drukiem, ale uczciwie."
 TPZ_aleksandrow:0 "Aleksandrów w naszej sieci"
 TPZ_aleksandrow_desc:0 "Aleksandrów Kujawski leży na szlaku do Torunia i Inowrocławia. Otwieramy tam lokal flagowy i zapraszamy radnych Republiki Kujawskiej na degustację."
 TPZ_torun:0 "Negocjacje z Toruniem"
 TPZ_torun_desc:0 "Toruń ma pierniki, uniwersytet i ambicje. My mamy logistykę. Delegacja zarządu jedzie nad Wisłę z prezentacją i dwoma tysiącami pizz."
 TPZ_bydgoszcz:0 "Rywalizacja z Bydgoszczą"
 TPZ_bydgoszcz_desc:0 "Bydgoszcz uważa się za stolicę regionu, ale nie ma skutera w każdym powiecie. Czas pokazać, kto naprawdę dowozi."
 TPZ_pakiet:0 "Wielki pakiet regionalny"
 TPZ_pakiet_desc:0 "Zestaw rodzinny dla całego regionu: dostawy, kredyty i franczyzy w jednej cenie. Oferta ważna do odwołania – także w Płocku."
 TPZ_siec:0 "Kujawska sieć dostaw"
 TPZ_siec_desc:0 "Trasy, magazyny i punkty przeładunkowe łączą Włocławek z każdym miastem Kujaw. Kierowcy znają drogi lepiej niż nawigacja."
 TPZ_wykup:0 "Wykup lokalnych spółek"
 TPZ_wykup_desc:0 "Wodociągi, ciepłownie i spółki komunalne w sąsiednich państwach szukają inwestora – a my mamy gotówkę. Gdy wpływy będą wystarczająco duże, kupimy całe państwo."
 TPZ_referendum:0 "Referendum korporacyjne"
 TPZ_referendum_desc:0 "Mieszkańcy zagłosują w aplikacji, czy chcą zostać udziałowcami państwa. Każdy oddany głos nagradzamy darmowym napojem."
 TPZ_porzadek:0 "Korporacyjny porządek"
 TPZ_porzadek_desc:0 "Regulaminy, procedury i wskaźniki KPI obejmują każdą dziedzinę życia. Nawet wiewiórki w parku na Słodowie mają opis stanowiska."
 TPZ_imperium:0 "Imperium T-Pizza"
 TPZ_imperium_desc:0 "Od pierwszej dostawy do własnego imperium. Rafał Archacki wychodzi na balkon centrali i ogłasza nową epokę – z dostawą do każdego domu na Kujawach."
 WPL_tpz_franczyzy:0 "Franczyzy w regionie"
 WPL_tpz_franczyzy_desc:0 "Nowe lokale T-Pizzy w każdym sąsiednim państwie: neon, dowóz w 30 minut i lokalny franczyzobiorca, który wie, komu zawdzięcza dochody."
 WPL_tpz_kredyt:0 "Dostawy na kredyt"
 WPL_tpz_kredyt_desc:0 "Ciężarówki z mąką, serem i olejem jadą do sąsiadów. Płatność? Spokojnie, rozłożymy na raty. Odsetki ustalimy później."
 WPL_tpz_wykup:0 "Wykup zadłużonych państw"
 WPL_tpz_wykup_desc:0 "Część sąsiadów jest nam winna więcej, niż kiedykolwiek spłaci. Proponujemy prostą transakcję: umorzymy dług, a w zamian państwo przejdzie pod nasz nadzór."
 WPL_tpz_wykup2:0 "Druga runda wykupów"
 WPL_tpz_wykup2_desc:0 "Dział windykacji ma nową listę. Kto nie spłacił długów za pierwszym razem, dostaje ostatnią ofertę."
 TPZ_trasa62:0 "Spór o drogę krajową 62"
 TPZ_trasa62_desc:0 "Republika Kujawska zamyka DK62 dla naszych dostawców i każe płacić myto w Kruszwicy. Bez przejazdu przez Kujawy T-Pizza nie dotrze ani do Torunia, ani do Bydgoszczy. Zarząd wysyła do Inowrocławia propozycję: korytarz tranzytowy – albo konsekwencje."
 TPZ_korytarz:0 "Korytarz tranzytowy"
 TPZ_korytarz_desc:0 "Inowrocław zgodził się: nasze kolumny przejeżdżają przez Kujawy, a Republika Kujawska dostaje opłaty tranzytowe i darmową dostawę dla urzędników. Droga na północ stoi otworem – bez jednego wystrzału."
 TPZ_incydent:0 "Incydent pod Kruszwicą"
 TPZ_incydent_desc:0 "Kujawska straż graniczna zatrzymała konwój T-Pizzy pod Kruszwicą i zarekwirowała trzy chłodnie. Zarząd nazywa to „wrogim przejęciem towaru”. Media firmowe pokazują puste kartony na tle Mysiej Wieży. Nikt nie pyta, co konwój robił po zmroku na polnej drodze."
 TPZ_uderzenie_kuj:0 "Uderzenie na Kujawy"
 TPZ_uderzenie_kuj_desc:0 "Koniec negocjacji. Brygady T-Pizzy przekraczają granicę pod Kruszwicą. Najpierw jednak armia musi być na tyle duża, żeby nie utknąć w pierwszym rowie melioracyjnym."
 TPZ_ofensywa_kuj:0 "Ofensywa na Inowrocław"
 TPZ_ofensywa_kuj_desc:0 "Brygada Ekspresowej Dostawy rusza wzdłuż DK62. Cel: Inowrocław, Aleksandrów i węzły drogowe, które otworzą nam drogę do Torunia i Solca."
 TPZ_droga_na_polnoc:0 "Droga na północ otwarta"
 TPZ_droga_na_polnoc_desc:0 "Kujawy przestały być murem. Z Inowrocławia i Aleksandrowa nasze kolumny mają prostą drogę do Torunia, Solca, Nowej Wsi Wielkiej i na Pałuki. Rafał Archacki ogłasza nowy cel sprzedażowy: cały region w zasięgu 30 minut."
 TPZ_kamp_przyg_slk:0 "Przygotowanie kampanii: Solec Kujawski"
 TPZ_kamp_przyg_slk_desc:0 "Wolne Miasto nad Wisłą ma port rzeczny i drogę do Bydgoszczy. Kto kontroluje Solec, kontroluje przeprawę. Zanim ruszą kolumny, dział logistyki zbiera mapy, rozkłady dostaw i listy lokali do otwarcia po zwycięstwie."
 TPZ_kamp_slk:0 "Kampania franczyzowa: Solec Kujawski"
 TPZ_kamp_slk_desc:0 "Państwo Solec Kujawski odrzuca naszą ofertę franczyzową. Dział ekspansji przygotowuje „dostawę specjalną” – z eskortą wojskową."
 TPZ_kamp_int_slk:0 "Nowy rynek: Solec Kujawski"
 TPZ_kamp_int_slk_desc:0 "Lokale franczyzowe, magazyny i nowa administracja. Solec Kujawski staje się częścią sieci T-Pizzy."
 TPZ_kamp_przyg_nww:0 "Przygotowanie kampanii: Nowa Wieś Wielka"
 TPZ_kamp_przyg_nww_desc:0 "Gmina na skraju Puszczy Bydgoskiej to brama do Bydgoszczy od południa. Mała, ale strategiczna. Zanim ruszą kolumny, dział logistyki zbiera mapy, rozkłady dostaw i listy lokali do otwarcia po zwycięstwie."
 TPZ_kamp_nww:0 "Kampania franczyzowa: Nowa Wieś Wielka"
 TPZ_kamp_nww_desc:0 "Państwo Nowa Wieś Wielka odrzuca naszą ofertę franczyzową. Dział ekspansji przygotowuje „dostawę specjalną” – z eskortą wojskową."
 TPZ_kamp_int_nww:0 "Nowy rynek: Nowa Wieś Wielka"
 TPZ_kamp_int_nww_desc:0 "Lokale franczyzowe, magazyny i nowa administracja. Nowa Wieś Wielka staje się częścią sieci T-Pizzy."
 TPZ_kamp_przyg_plk:0 "Przygotowanie kampanii: Pałuki (Żnin)"
 TPZ_kamp_przyg_plk_desc:0 "Księstwo Pałuckie ma jeziora, cukrownie i drogę na Wielkopolskę. Dział ekspansji widzi tam nowy rynek. Zanim ruszą kolumny, dział logistyki zbiera mapy, rozkłady dostaw i listy lokali do otwarcia po zwycięstwie."
 TPZ_kamp_plk:0 "Kampania franczyzowa: Pałuki (Żnin)"
 TPZ_kamp_plk_desc:0 "Państwo Pałuki (Żnin) odrzuca naszą ofertę franczyzową. Dział ekspansji przygotowuje „dostawę specjalną” – z eskortą wojskową."
 TPZ_kamp_int_plk:0 "Nowy rynek: Pałuki (Żnin)"
 TPZ_kamp_int_plk_desc:0 "Lokale franczyzowe, magazyny i nowa administracja. Pałuki (Żnin) staje się częścią sieci T-Pizzy."
 TPZ_siec_kuchnia:0 "Centralna kuchnia"
 TPZ_siec_kuchnia_desc:0 "Hala na obrzeżach Włocławka staje się sercem sieci: ciasto, sosy i logistyka w jednym miejscu."
 TPZ_siec_maka:0 "Mąka z Kujaw"
 TPZ_siec_maka_desc:0 "Młyny i spółdzielnie z Kujaw i Ziemi Dobrzyńskiej mogą zostać stałymi dostawcami korporacji."
 TPZ_siec_flota:0 "Flota dostawcza"
 TPZ_siec_flota_desc:0 "Skutery, dostawczaki i stacje paliw na trasach. Pizza – i nie tylko – dociera wszędzie."
 TPZ_siec_franczyza:0 "Franczyza w regionie"
 TPZ_siec_franczyza_desc:0 "Sąsiednie miasta dostają ofertę: lokal T-Pizzy z dostawą do domu. Każdy nowy lokal to wpływy korporacji."
 TPZ_siec_aplikacja:0 "Aplikacja zamówień"
 TPZ_siec_aplikacja_desc:0 "Zamówienia przez aplikację, która działa nawet przy blackoutach – na krótkofalówkach dostawców."
 TPZ_siec_ser:0 "Ser z Podlasia"
 TPZ_siec_ser_desc:0 "Kontrakt z mleczarniami ze wschodu: ser przyjeżdża chłodniami co dwa dni, nawet gdy po drodze są trzy granice."
 TPZ_siec_imperium:0 "Imperium dostaw"
 TPZ_siec_imperium_desc:0 "Sieć T-Pizzy obejmuje pół Polski. Kto rządzi dostawami, ten rządzi codziennością."
