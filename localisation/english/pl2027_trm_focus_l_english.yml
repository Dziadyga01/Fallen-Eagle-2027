 TRM_GDY_o_ruszenie_desc:0 "Każda dzielnica wystawia własny batalion."
 TRM_GDY_o_magazyny:0 "Magazyny portowe"
 TRM_GDY_o_magazyny_desc:0 "W kontenerach w porcie znalazło się więcej broni, niż ktokolwiek przypuszczał."
 TRM_GDY_o_obrona:0 "Obrona Zatoki"
 TRM_GDY_o_obrona_desc:0 "Baterie, posterunki i patrole tworzą jeden system obrony od Helu po Mewią Łachę."
 TRM_GDY_o_piechota:0 "Piechota morska"
 TRM_GDY_o_piechota_desc:0 "Najlepsi ze Straży Wybrzeża przechodzą szkolenie desantowe."
 TRM_GDY_baltyk:0 "Nad Bałtykiem"
 TRM_GDY_baltyk_desc:0 "Trójmiasto nie jest już sceną sporu, tylko stolicą. Rozbita Polska patrzy na północ – i liczy się z Zatoką."
 FAB_GDY_z_morza:0 "Miasto z morza"
 FAB_GDY_z_morza_desc:0 "Gdynia zbudowała się z niczego sto lat temu. Teraz musi zrobić to jeszcze raz – z portem wojennym zamiast ministerstwa."
 FAB_GDY_oksywie:0 "Port wojenny Oksywie"
 FAB_GDY_oksywie_desc:0 "Okręty, które zostały w porcie po Godzinie Zero, podnoszą banderę Republiki. Załogi trzeba opłacić – i przekonać."
 FAB_GDY_nauta:0 "Stocznia remontowa"
 FAB_GDY_nauta_desc:0 "Stocznia remontuje kutry, holowniki i okręty. Pracy jest więcej niż ludzi."
 FAB_GDY_piechota_morska:0 "Batalion piechoty morskiej"
 FAB_GDY_piechota_morska_desc:0 "Marynarze bez okrętów i ochotnicy z Obłuża tworzą piechotę morską Republiki."
 FAB_GDY_urzad:0 "Urząd jednego okienka"
 FAB_GDY_urzad_desc:0 "Gdyńscy urzędnicy chwalą się, że załatwiają sprawę w jeden dzień. Republika rządzi jak dobrze prowadzona firma."
 FAB_GDY_akademia:0 "Akademia Morska"
 FAB_GDY_akademia_desc:0 "Kadry dla floty, portu i stoczni. Republika inwestuje w ludzi, bo ma ich mniej niż sąsiedzi."
 FAB_GDY_terminal:0 "Terminal promowy"
 FAB_GDY_terminal_desc:0 "Promy do Szwecji kursują codziennie. Gdynia jest oknem na świat dla całego regionu."
 FAB_GDY_flotylla:0 "Flotylla Zatoki"
 FAB_GDY_flotylla_desc:0 "Kutry patrolowe i okręty obrony wybrzeża pilnują Zatoki Gdańskiej. Kto chce wejść do Gdańska albo Sopotu, mija Gdynię."
 FAB_GDY_przywodztwo:0 "Gdynia liderem Trójmiasta"
 FAB_GDY_przywodztwo_desc:0 "Gdynia proponuje sąsiadom wspólne dowództwo morskie w zamian za przewodnictwo w Federacji Trójmiejskiej – albo zostaje sama."
 FAB_GDY_republika_morska:0 "Republika Morska"
 FAB_GDY_republika_morska_desc:0 "Flota, port i administracja, która działa. Gdynia jest najmniejsza z trzech miast – i najlepiej zorganizowana."
 TRM_SPT_ksiestwo:0 "Księstwo Sopockie"
 TRM_SPT_ksiestwo_desc:0 "Sopot ogłasza się księstwem – trochę dla żartu, trochę na serio. Prezydent Sopotu przyjmuje tytuł i obiecuje, że kurort przetrwa każdą burzę."
 TRM_SPT_monciak:0 "Dwór na Monciaku"
 TRM_SPT_monciak_desc:0 "Książęcy dwór urzęduje w hotelu przy molo. Rada miasta, właściciele kasyn i hotelarze – wszyscy mają swój głos."
 TRM_SPT_kasyno:0 "Pieniądze z kasyna"
 TRM_SPT_kasyno_desc:0 "Kasyna i hotele płacą podatek wojenny. Sopot jest małe, ale ma najwięcej gotówki nad Zatoką."
 TRM_SPT_najemnicy:0 "Najemnicy z mola"
 TRM_SPT_najemnicy_desc:0 "Za pieniądze z kasyn Sopot wynajmuje ochotników z całego Pomorza – byłych żołnierzy, ochroniarzy i strzelców sportowych."
 TRM_SPT_las:0 "Twierdza w Lesie Oliwskim"
 TRM_SPT_las_desc:0 "Na wzgórzach nad Sopotem powstają okopy i punkty obserwacyjne. Las ma bronić miasta lepiej niż mury."
 TRM_SPT_spor:0 "Spór o Zatokę"
 TRM_SPT_spor_desc:0 "Gdańsk, Gdynia i Sopot leżą tak blisko, że granice wyznacza się dziś przystankami SKM. Każde z miast uważa, że to ono powinno poprowadzić Trójmiasto."
 TRM_SPT_droga:0 "Jaka droga dla Trójmiasta?"
 TRM_SPT_droga_desc:0 "Wojna, unia czy wspólna wyprawa po Pomorze? Ratusz musi wybrać, zanim zrobią to sąsiedzi."
 TRM_SPT_a_mob:0 "Zjednoczeni przez wojnę"
 TRM_SPT_a_mob_desc:0 "Ratusz ogłasza mobilizację. Trójmiasto zjednoczy się pod jednym sztandarem – naszym."
 TRM_SPT_a_ultimatum:0 "Ultimatum dla sąsiadów"
 TRM_SPT_a_ultimatum_desc:0 "Do dwóch pozostałych ratuszy trafia ten sam list: uznajcie nasze przywództwo albo spotkamy się na Alei Grunwaldzkiej."
 TRM_SPT_a_desant:0 "Desant przez Zatokę"
 TRM_SPT_a_desant_desc:0 "Kutry, promy i barki przewiozą żołnierzy wzdłuż wybrzeża. Wojna o Zatokę będzie toczona także na wodzie."
 TRM_SPT_a_wojna:0 "Wojna o Zatokę"
 TRM_SPT_a_wojna_desc:0 "Kto nie przyjął ultimatum, ten przyjmie wojnę. Kolumny ruszają wzdłuż torów SKM."
 TRM_SPT_a_hegemon:0 "Hegemon Zatoki"
 TRM_SPT_a_hegemon_desc:0 "Wojna skończona. Trójmiasto ma jednego gospodarza, a dawni rywale stają się dzielnicami Metropolii."
 TRM_SPT_a_porzadek:0 "Porządek w Metropolii"
 TRM_SPT_a_porzadek_desc:0 "Barykady znikają, kolejka znów jeździ. Pokonane miasta dostają własne rady dzielnic – i nowe urzędy pod naszym okiem."
 TRM_SPT_a_kaszuby:0 "Kaszuby i Kociewie"
 TRM_SPT_a_kaszuby_desc:0 "Metropolia potrzebuje zaplecza: lasów, pól i torów. Kociewie i Pomorze Środkowe mają wybrać – przyłączenie albo wojna."
 TRM_SPT_a_metro:0 "Metropolia nad Bałtykiem"
 TRM_SPT_a_metro_desc:0 "Jedno miasto od Helu po Pruszcz – z jednym portem, jedną flotą i jednym budżetem."
 TRM_SPT_b_konf:0 "Zjednoczeni przez sojusz"
 TRM_SPT_b_konf_desc:0 "Zapraszamy prezydentów Gdańska, Gdyni, Sopotu i Malborka na Konferencję Czterech Miast. Unia zamiast wojny."
 TRM_SPT_b_malbork:0 "Zaproszenie dla Malborka"
 TRM_SPT_b_malbork_desc:0 "Zamek w Malborku to symbol i twierdza. Czwarte miasto Unii strzeże Żuław i drogi na wschód."
 TRM_SPT_b_zloty:0 "Złoty bałtycki"
 TRM_SPT_b_zloty_desc:0 "Wspólna waluta Unii. Bank w Gdańsku, mennica w Gdyni, kasa w Sopocie – i skarbiec na zamku w Malborku."
 TRM_SPT_b_straz:0 "Wspólna straż wybrzeża"
 TRM_SPT_b_straz_desc:0 "Kutry i patrole wszystkich miast Unii pływają pod jedną banderą."
 TRM_SPT_b_akt:0 "Akt Unii"
 TRM_SPT_b_akt_desc:0 "Na sesji w Dworze Artusa prezydenci miast podpisują Akt Unii. Cztery miasta mają się stać jednym państwem."
 TRM_SPT_b_rada:0 "Rada Czterech Miast"
 TRM_SPT_b_rada_desc:0 "Prezydenci miast spotykają się co tydzień – raz w Gdańsku, raz w Malborku. Unia rządzi się konsensusem."
 TRM_SPT_b_obrona:0 "Wspólna obrona Unii"
 TRM_SPT_b_obrona_desc:0 "Twierdza w Malborku, baterie na Oksywiu i okopy w Lesie Oliwskim – jeden system obrony."
 TRM_SPT_b_unia:0 "Unia nad Zatoką"
 TRM_SPT_b_unia_desc:0 "Unia Czteromiasta działa. Od Helu po Malbork obowiązuje jedno prawo, jedna waluta i jedna flaga."
 TRM_SPT_c_koal:0 "Koalicja Pomorska"
 TRM_SPT_c_koal_desc:0 "Trzy miasta zostają osobno, ale razem idą po Pomorze. Propozycja trafia do pozostałych ratuszy."
 TRM_SPT_c_kociewie:0 "Korytarz przez Kociewie"
 TRM_SPT_c_kociewie_desc:0 "Żeby dojść do Wisły i Malborka, trzeba przejść przez Kociewie. Holding kolejowy dostaje propozycję nie do odrzucenia: ulgi w porcie za prawo przemarszu."
 TRM_SPT_c_ambicje:0 "Ambicje pomorskie"
 TRM_SPT_c_ambicje_desc:0 "Na mapie w ratuszu ktoś rysuje Pomorze od Helu po Pregołę. Malbork, Warmia, Mazury i Królewiec – to wszystko „ziemie Zatoki”."
 TRM_SPT_c_malbork:0 "Wojna o Malbork"
 TRM_SPT_c_malbork_desc:0 "Zakon w Malborku twierdzi, że strzeże historii. Koalicja twierdzi, że strzeże Żuław przed Zakonem."
 TRM_SPT_c_warmia:0 "Warmia i Mazury"
 TRM_SPT_c_warmia_desc:0 "Z Malborka do Olsztyna jest dzień marszu. Republika Warmińsko-Mazurska musi wybrać – Koalicja albo wojna."
 TRM_SPT_c_krolewiec:0 "Królewiec"
 TRM_SPT_c_krolewiec_desc:0 "Obwód Królewiecki to najsilniejszy przeciwnik na wschodzie. Bez niego Pomorze nigdy nie będzie bezpieczne."
 TRM_SPT_c_pomorze:0 "Wielkie Pomorze"
 TRM_SPT_c_pomorze_desc:0 "Koalicja zwyciężyła. Od Helu po Olsztyn powiewa jedna flaga – a sojusznicy z Zatoki dostają propozycję wejścia do nowego państwa."
 TRM_SPT_p_port:0 "Port jako państwo"
 TRM_SPT_p_port_desc:0 "Budżet miasta to dziś budżet portu. Każdy statek przy nabrzeżu to pieniądze, praca i przyjaciele."
 TRM_SPT_p_przeladunki:0 "Przeładunki"
 TRM_SPT_p_przeladunki_desc:0 "Magazyny portowe zamieniają się w hale montażowe."
 TRM_SPT_p_kolej:0 "Kolej portowa"
 TRM_SPT_p_kolej_desc:0 "Bocznice i tory odstawcze znów działają. Towar z portu jedzie w głąb lądu."
 TRM_SPT_p_stocznie:0 "Stocznie remontowe"
 TRM_SPT_p_stocznie_desc:0 "Remonty statków z całego Bałtyku – za walutę, za paliwo, za broń."
 TRM_SPT_p_handel:0 "Handel bałtycki"
 TRM_SPT_p_handel_desc:0 "Kupcy z Kłajpedy, Kalmaru i Kopenhagi wracają do Zatoki."
 TRM_SPT_p_zbrojownia:0 "Zbrojownia portowa"
 TRM_SPT_p_zbrojownia_desc:0 "W halach portowych produkuje się amunicję i opancerzenie dla pojazdów."
 TRM_SPT_p_bogactwo:0 "Bogactwo Zatoki"
 TRM_SPT_p_bogactwo_desc:0 "Przeładunki rosną z miesiąca na miesiąc. Zatoka Gdańska znów jest oknem na świat."
 TRM_SPT_o_straz:0 "Straż Wybrzeża"
 TRM_SPT_o_straz_desc:0 "Ochotnicy z nadmorskich dzielnic tworzą Straż Wybrzeża: piechota, moździerze i stare działa z muzeum."
 TRM_SPT_o_baterie:0 "Baterie nadbrzeżne"
 TRM_SPT_o_baterie_desc:0 "Na klifach Orłowa i Oksywia stają działa. Zatoka jest zamknięta dla nieproszonych gości."
 TRM_SPT_o_kutry:0 "Kutry z Helu"
 TRM_SPT_o_kutry_desc:0 "Rybacy z Helu i Jastarni zgłaszają się na ochotnika. Ich kutry patrolują Zatokę dzień i noc."
 TRM_SPT_o_ruszenie:0 "Pospolite ruszenie"
 TRM_SPT_o_ruszenie_desc:0 "Każda dzielnica wystawia własny batalion."
 TRM_SPT_o_magazyny:0 "Magazyny portowe"
 TRM_SPT_o_magazyny_desc:0 "W kontenerach w porcie znalazło się więcej broni, niż ktokolwiek przypuszczał."
 TRM_SPT_o_obrona:0 "Obrona Zatoki"
 TRM_SPT_o_obrona_desc:0 "Baterie, posterunki i patrole tworzą jeden system obrony od Helu po Mewią Łachę."
 TRM_SPT_o_piechota:0 "Piechota morska"
 TRM_SPT_o_piechota_desc:0 "Najlepsi ze Straży Wybrzeża przechodzą szkolenie desantowe."
 TRM_SPT_baltyk:0 "Nad Bałtykiem"
 TRM_SPT_baltyk_desc:0 "Trójmiasto nie jest już sceną sporu, tylko stolicą. Rozbita Polska patrzy na północ – i liczy się z Zatoką."
 FAB_SPT_kurort:0 "Kurort ponad wojną"
 FAB_SPT_kurort_desc:0 "Sopot nie ma armii, ma molo, hotele i kasyna. Kto chce tu wypocząć – albo negocjować – płaci w euro."
 FAB_SPT_kasyna:0 "Licencje kasynowe"
 FAB_SPT_kasyna_desc:0 "Kasyna przy Monciaku pracują całą dobę. Podatek od gier finansuje miasto."
 FAB_SPT_bankowosc:0 "Sopocka bankowość"
 FAB_SPT_bankowosc_desc:0 "Rachunki bez pytań o pochodzenie – ale z audytem z Brukseli, żeby nikt nie zamknął miasta. Pieniądze z całego regionu płyną do Sopotu."
 FAB_SPT_festiwal:0 "Festiwal w Operze Leśnej"
 FAB_SPT_festiwal_desc:0 "Pierwszy festiwal od Godziny Zero. Telewizje z całego regionu transmitują koncert – i obraz miasta, w którym wciąż jest normalnie."
 FAB_SPT_neutralnosc:0 "Neutralność kurortu"
 FAB_SPT_neutralnosc_desc:0 "Sopot ogłasza neutralność w sporach Trójmiasta i Pomorza. Kto zaatakuje kurort, straci miejsce, w którym można się dogadać."
 FAB_SPT_grand_hotel:0 "Rozmowy w Grand Hotelu"
 FAB_SPT_grand_hotel_desc:0 "Sopot proponuje sąsiadom stół rozmów: spory o granice, porty i długi rozstrzygane w hotelowej sali balowej."
 FAB_SPT_mediator:0 "Mediator Trójmiasta"
 FAB_SPT_mediator_desc:0 "Burmistrz Sopotu godzi Gdańsk z Gdynią. Jeśli kiedyś powstanie federacja, Sopot będzie jej sumieniem – i kasjerem."
 FAB_SPT_ochrona:0 "Prywatna ochrona"
 FAB_SPT_ochrona_desc:0 "Zamiast armii – firmy ochroniarskie opłacane z podatku kasynowego. Wystarczy na szabrowników, nie na wojnę."
 FAB_SPT_gwarancje:0 "Gwarancje dla kurortu"
 FAB_SPT_gwarancje_desc:0 "Sąsiedzi gwarantują neutralność Sopotu. Kto ją złamie, będzie miał przeciwko sobie wszystkich, którzy tu negocjują."
 FAB_SPT_riwiera:0 "Riwiera Północy"
 FAB_SPT_riwiera_desc:0 "Sopot jest najbogatszym miastem regionu, choć nie ma ani jednego czołgu."
