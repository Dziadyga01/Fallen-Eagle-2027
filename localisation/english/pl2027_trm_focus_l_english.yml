l_english:
 TRM_WMG_wolne:0 "Wolne Miasto Gdańsk"
 TRM_WMG_wolne_desc:0 "Rada Miasta ogłasza Wolne Miasto – jak w 1920 roku, tylko tym razem bez Ligi Narodów. Prezydentka Gdańska obiecuje, że miasto „nie zginie w chaosie”."
 TRM_WMG_artus:0 "Rada w Dworze Artusa"
 TRM_WMG_artus_desc:0 "Radni zbierają się w Dworze Artusa. Pierwsza uchwała: port i stocznia mają pracować bez przerwy."
 TRM_WMG_stocznia:0 "Stocznia znów pracuje"
 TRM_WMG_stocznia_desc:0 "Pochylnie przy Bramie Stoczniowej ożywają. Zamiast promów – kutry patrolowe i opancerzone barki."
 TRM_WMG_port:0 "Port Północny"
 TRM_WMG_port_desc:0 "Terminale paliwowe i węglowe przechodzą pod zarząd miasta. Gdańsk ma towar, którego potrzebuje cały region."
 TRM_WMG_sierpien:0 "Duch Sierpnia"
 TRM_WMG_sierpien_desc:0 "Pod pomnikiem Poległych Stoczniowców zbierają się tysiące ludzi. Gdańsk wie, jak się zorganizować."
 TRM_WMG_spor:0 "Spór o Zatokę"
 TRM_WMG_spor_desc:0 "Gdańsk, Gdynia i Sopot leżą tak blisko, że granice wyznacza się dziś przystankami SKM. Każde z miast uważa, że to ono powinno poprowadzić Trójmiasto."
 TRM_WMG_droga:0 "Jaka droga dla Trójmiasta?"
 TRM_WMG_droga_desc:0 "Wojna, unia czy wspólna wyprawa po Pomorze? Ratusz musi wybrać, zanim zrobią to sąsiedzi."
 TRM_WMG_a_mob:0 "Zjednoczeni przez wojnę"
 TRM_WMG_a_mob_desc:0 "Ratusz ogłasza mobilizację. Trójmiasto zjednoczy się pod jednym sztandarem – naszym."
 TRM_WMG_a_ultimatum:0 "Ultimatum dla sąsiadów"
 TRM_WMG_a_ultimatum_desc:0 "Do dwóch pozostałych ratuszy trafia ten sam list: uznajcie nasze przywództwo albo spotkamy się na Alei Grunwaldzkiej."
 TRM_WMG_a_desant:0 "Desant przez Zatokę"
 TRM_WMG_a_desant_desc:0 "Kutry, promy i barki przewiozą żołnierzy wzdłuż wybrzeża. Wojna o Zatokę będzie toczona także na wodzie."
 TRM_WMG_a_wojna:0 "Wojna o Zatokę"
 TRM_WMG_a_wojna_desc:0 "Kto nie przyjął ultimatum, ten przyjmie wojnę. Kolumny ruszają wzdłuż torów SKM."
 TRM_WMG_a_hegemon:0 "Hegemon Zatoki"
 TRM_WMG_a_hegemon_desc:0 "Wojna skończona. Trójmiasto ma jednego gospodarza, a dawni rywale stają się dzielnicami Metropolii."
 TRM_WMG_a_porzadek:0 "Porządek w Metropolii"
 TRM_WMG_a_porzadek_desc:0 "Barykady znikają, kolejka znów jeździ. Pokonane miasta dostają własne rady dzielnic – i nowe urzędy pod naszym okiem."
 TRM_WMG_a_kaszuby:0 "Kaszuby i Kociewie"
 TRM_WMG_a_kaszuby_desc:0 "Metropolia potrzebuje zaplecza: lasów, pól i torów. Kociewie i Pomorze Środkowe mają wybrać – przyłączenie albo wojna."
 TRM_WMG_a_metro:0 "Metropolia nad Bałtykiem"
 TRM_WMG_a_metro_desc:0 "Jedno miasto od Helu po Pruszcz – z jednym portem, jedną flotą i jednym budżetem."
 TRM_WMG_b_konf:0 "Zjednoczeni przez sojusz"
 TRM_WMG_b_konf_desc:0 "Zapraszamy prezydentów Gdańska, Gdyni, Sopotu i Malborka na Konferencję Czterech Miast. Unia zamiast wojny."
 TRM_WMG_b_malbork:0 "Zaproszenie dla Malborka"
 TRM_WMG_b_malbork_desc:0 "Zamek w Malborku to symbol i twierdza. Czwarte miasto Unii strzeże Żuław i drogi na wschód."
 TRM_WMG_b_zloty:0 "Złoty bałtycki"
 TRM_WMG_b_zloty_desc:0 "Wspólna waluta Unii. Bank w Gdańsku, mennica w Gdyni, kasa w Sopocie – i skarbiec na zamku w Malborku."
 TRM_WMG_b_straz:0 "Wspólna straż wybrzeża"
 TRM_WMG_b_straz_desc:0 "Kutry i patrole wszystkich miast Unii pływają pod jedną banderą."
 TRM_WMG_b_akt:0 "Akt Unii"
 TRM_WMG_b_akt_desc:0 "Na sesji w Dworze Artusa prezydenci miast podpisują Akt Unii. Cztery miasta mają się stać jednym państwem."
 TRM_WMG_b_rada:0 "Rada Czterech Miast"
 TRM_WMG_b_rada_desc:0 "Prezydenci miast spotykają się co tydzień – raz w Gdańsku, raz w Malborku. Unia rządzi się konsensusem."
 TRM_WMG_b_obrona:0 "Wspólna obrona Unii"
 TRM_WMG_b_obrona_desc:0 "Twierdza w Malborku, baterie na Oksywiu i okopy w Lesie Oliwskim – jeden system obrony."
 TRM_WMG_b_unia:0 "Unia nad Zatoką"
 TRM_WMG_b_unia_desc:0 "Unia Czteromiasta działa. Od Helu po Malbork obowiązuje jedno prawo, jedna waluta i jedna flaga."
 TRM_WMG_c_koal:0 "Koalicja Pomorska"
 TRM_WMG_c_koal_desc:0 "Trzy miasta zostają osobno, ale razem idą po Pomorze. Propozycja trafia do pozostałych ratuszy."
 TRM_WMG_c_kociewie:0 "Korytarz przez Kociewie"
 TRM_WMG_c_kociewie_desc:0 "Żeby dojść do Wisły i Malborka, trzeba przejść przez Kociewie. Holding kolejowy dostaje propozycję nie do odrzucenia: ulgi w porcie za prawo przemarszu."
 TRM_WMG_c_ambicje:0 "Ambicje pomorskie"
 TRM_WMG_c_ambicje_desc:0 "Na mapie w ratuszu ktoś rysuje Pomorze od Helu po Pregołę. Malbork, Warmia, Mazury i Królewiec – to wszystko „ziemie Zatoki”."
 TRM_WMG_c_malbork:0 "Wojna o Malbork"
 TRM_WMG_c_malbork_desc:0 "Zakon w Malborku twierdzi, że strzeże historii. Koalicja twierdzi, że strzeże Żuław przed Zakonem."
 TRM_WMG_c_warmia:0 "Warmia i Mazury"
 TRM_WMG_c_warmia_desc:0 "Z Malborka do Olsztyna jest dzień marszu. Republika Warmińsko-Mazurska musi wybrać – Koalicja albo wojna."
 TRM_WMG_c_krolewiec:0 "Królewiec"
 TRM_WMG_c_krolewiec_desc:0 "Obwód Królewiecki to najsilniejszy przeciwnik na wschodzie. Bez niego Pomorze nigdy nie będzie bezpieczne."
 TRM_WMG_c_pomorze:0 "Wielkie Pomorze"
 TRM_WMG_c_pomorze_desc:0 "Koalicja zwyciężyła. Od Helu po Olsztyn powiewa jedna flaga – a sojusznicy z Zatoki dostają propozycję wejścia do nowego państwa."
 TRM_WMG_p_port:0 "Port jako państwo"
 TRM_WMG_p_port_desc:0 "Budżet miasta to dziś budżet portu. Każdy statek przy nabrzeżu to pieniądze, praca i przyjaciele."
 TRM_WMG_p_przeladunki:0 "Przeładunki"
 TRM_WMG_p_przeladunki_desc:0 "Magazyny portowe zamieniają się w hale montażowe."
 TRM_WMG_p_kolej:0 "Kolej portowa"
 TRM_WMG_p_kolej_desc:0 "Bocznice i tory odstawcze znów działają. Towar z portu jedzie w głąb lądu."
 TRM_WMG_p_stocznie:0 "Stocznie remontowe"
 TRM_WMG_p_stocznie_desc:0 "Remonty statków z całego Bałtyku – za walutę, za paliwo, za broń."
 TRM_WMG_p_handel:0 "Handel bałtycki"
 TRM_WMG_p_handel_desc:0 "Kupcy z Kłajpedy, Kalmaru i Kopenhagi wracają do Zatoki."
 TRM_WMG_p_zbrojownia:0 "Zbrojownia portowa"
 TRM_WMG_p_zbrojownia_desc:0 "W halach portowych produkuje się amunicję i opancerzenie dla pojazdów."
 TRM_WMG_p_bogactwo:0 "Bogactwo Zatoki"
 TRM_WMG_p_bogactwo_desc:0 "Przeładunki rosną z miesiąca na miesiąc. Zatoka Gdańska znów jest oknem na świat."
 TRM_WMG_o_straz:0 "Straż Wybrzeża"
 TRM_WMG_o_straz_desc:0 "Ochotnicy z nadmorskich dzielnic tworzą Straż Wybrzeża: piechota, moździerze i stare działa z muzeum."
 TRM_WMG_o_baterie:0 "Baterie nadbrzeżne"
 TRM_WMG_o_baterie_desc:0 "Na klifach Orłowa i Oksywia stają działa. Zatoka jest zamknięta dla nieproszonych gości."
 TRM_WMG_o_kutry:0 "Kutry z Helu"
 TRM_WMG_o_kutry_desc:0 "Rybacy z Helu i Jastarni zgłaszają się na ochotnika. Ich kutry patrolują Zatokę dzień i noc."
 TRM_WMG_o_ruszenie:0 "Pospolite ruszenie"
 TRM_WMG_o_ruszenie_desc:0 "Każda dzielnica wystawia własny batalion."
 TRM_WMG_o_magazyny:0 "Magazyny portowe"
 TRM_WMG_o_magazyny_desc:0 "W kontenerach w porcie znalazło się więcej broni, niż ktokolwiek przypuszczał."
 TRM_WMG_o_obrona:0 "Obrona Zatoki"
 TRM_WMG_o_obrona_desc:0 "Baterie, posterunki i patrole tworzą jeden system obrony od Helu po Mewią Łachę."
 TRM_WMG_o_piechota:0 "Piechota morska"
 TRM_WMG_o_piechota_desc:0 "Najlepsi ze Straży Wybrzeża przechodzą szkolenie desantowe."
 TRM_WMG_baltyk:0 "Nad Bałtykiem"
 TRM_WMG_baltyk_desc:0 "Trójmiasto nie jest już sceną sporu, tylko stolicą. Rozbita Polska patrzy na północ – i liczy się z Zatoką."
 FAB_WMG_motlawa:0 "Wolne Miasto nad Motławą"
 FAB_WMG_motlawa_desc:0 "Gdańsk nie chce być ani prowincją, ani stolicą cudzego państwa. Chce być Gdańskiem – portem, który handluje z każdym."
 FAB_WMG_port_polnocny:0 "Port Północny"
 FAB_WMG_port_polnocny_desc:0 "Terminal kontenerowy przyjmuje statki, które omijają rozbite porty dalej na wschód. Opłaty portowe to nowy budżet miasta."
 FAB_WMG_rafineria:0 "Rafineria nad Martwą Wisłą"
 FAB_WMG_rafineria_desc:0 "Rafineria pracuje dla miasta i na eksport. Kto chce paliwa, musi rozmawiać z Gdańskiem."
 FAB_WMG_bursztyn:0 "Szlak bursztynowy"
 FAB_WMG_bursztyn_desc:0 "Kupcy z Litwy, Szwecji i Danii wracają na Długi Targ. Handel bursztynem, rybami i maszynami."
 FAB_WMG_hanza:0 "Liga Hanzeatycka"
 FAB_WMG_hanza_desc:0 "Gdańsk proponuje portom Bałtyku dawną formułę: wspólne cła, wspólna ochrona statków, każdy rządzi u siebie."
 FAB_WMG_sala_bhp:0 "Sala BHP"
 FAB_WMG_sala_bhp_desc:0 "W miejscu, gdzie kiedyś podpisano porozumienia sierpniowe, Rada Miasta zbiera robotników, przedsiębiorców i studentów. Umowa społeczna Wolnego Miasta."
 FAB_WMG_westerplatte:0 "Straż Westerplatte"
 FAB_WMG_westerplatte_desc:0 "Półwysep znów ma garnizon – tym razem miejski. Umocnienia przy wejściu do portu i na Wisłoujściu."
 FAB_WMG_unia_baltycka:0 "Gdańsk w Unii Bałtyckiej"
 FAB_WMG_unia_baltycka_desc:0 "Gdańsk staje się sercem Unii Bałtyckiej: sekretariat w Dworze Artusa, wspólna taryfa portowa."
 FAB_WMG_trojmiasto:0 "Gdańsk proponuje federację"
 FAB_WMG_trojmiasto_desc:0 "Gdańsk nie zdobędzie Gdyni ani Sopotu – może je przekonać. Projekt „Federacja Trójmiejska” w panelu „Integracja regionów” jest tańszy w zaufaniu i opiniach."
 FAB_WMG_wolne_miasto:0 "Wolne Miasto Gdańsk"
 FAB_WMG_wolne_miasto_desc:0 "Konstytucja Wolnego Miasta: neutralny port, własne prawo, otwarte dla każdego, kto płaci cła."
 TRM_GDY_republika:0 "Republika Gdyńska"
 TRM_GDY_republika_desc:0 "Gdynia ogłasza republikę. Miasto, które zbudowano z niczego, nie zamierza czekać, aż ktoś inny zdecyduje o jego losie."
 TRM_GDY_rada_portu:0 "Rada Portu"
 TRM_GDY_rada_portu_desc:0 "Port, armatorzy i związki zawodowe tworzą Radę Portu – prawdziwy rząd Gdyni."
 TRM_GDY_oksywie:0 "Baza na Oksywiu"
 TRM_GDY_oksywie_desc:0 "Marynarze z Oksywia zostają w mieście. Mają broń, dyscyplinę i własne pododdziały piechoty."
 TRM_GDY_terminal:0 "Terminal kontenerowy"
 TRM_GDY_terminal_desc:0 "Kontenery z całego Bałtyku płyną teraz do Gdyni. Dźwigi pracują na trzy zmiany."
 TRM_GDY_marzenia:0 "Miasto z morza i marzeń"
 TRM_GDY_marzenia_desc:0 "Na Skwerze Kościuszki burmistrz przypomina: Gdynia powstała w dwadzieścia lat. Teraz zbuduje państwo."
 TRM_GDY_spor:0 "Spór o Zatokę"
 TRM_GDY_spor_desc:0 "Gdańsk, Gdynia i Sopot leżą tak blisko, że granice wyznacza się dziś przystankami SKM. Każde z miast uważa, że to ono powinno poprowadzić Trójmiasto."
