l_english:
 TRM_UNIA:0 "Unia Czteromiasta"
 TRM_KOALICJA:0 "Koalicja Pomorska"
 TRM_spor:0 "Spór o Zatokę"
 TRM_spor_desc:0 "Trzy miasta, jedna zatoka, jeden port przeładunkowy za mało. Każde z nich uważa, że to ono powinno rządzić Trójmiastem."
 TRM_wojna:0 "Wojna o Zatokę"
 TRM_wojna_desc:0 "Kolejka SKM nie kursuje, a na Alei Grunwaldzkiej stoją barykady. Kto wygra, ten zjednoczy Trójmiasto."
 TRM_metro:0 "Metropolia nad Bałtykiem"
 TRM_metro_desc:0 "Jedno miasto od Helu po Pruszcz: wspólny port, wspólna flota i wspólny budżet."
 TRM_zloty:0 "Złoty bałtycki"
 TRM_zloty_desc:0 "Wspólna waluta miast nad Zatoką. Kupcy z Kłajpedy i Kopenhagi przyjmują ją chętniej niż cokolwiek z Warszawy."
 TRM_rada:0 "Rada Czterech Miast"
 TRM_rada_desc:0 "Prezydenci czterech miast spotykają się co tydzień – raz w Dworze Artusa, raz na zamku w Malborku."
 TRM_koalicja:0 "Koalicja Pomorska"
 TRM_koalicja_desc:0 "Gdańsk, Gdynia i Sopot zostają osobnymi państwami, ale mają wspólny cel: Pomorze od Wisły po Pregołę."
 TRM_pomorze:0 "Wielkie Pomorze"
 TRM_pomorze_desc:0 "Od Helu po Królewiec – jedna kraina nad Bałtykiem, która nie czeka na Warszawę."
 TRM_port:0 "Port jako państwo"
 TRM_port_desc:0 "Port to budżet, praca i dyplomacja. Kto ma statki, ma przyjaciół."
 TRM_port2:0 "Bogactwo Zatoki"
 TRM_port2_desc:0 "Przeładunki rosną z miesiąca na miesiąc. Zatoka Gdańska znów jest oknem na świat."
 TRM_obrona:0 "Obrona Zatoki"
 TRM_obrona_desc:0 "Baterie na klifach, posterunki na plażach i patrole kutrów od Helu po Mewią Łachę."
 TRM_baltyk:0 "Nad Bałtykiem"
 TRM_baltyk_desc:0 "Pomorze ma znów jedno centrum – nad Zatoką. Rozbita Polska patrzy na północ z zazdrością."
 TRM_WMG_sierpien:0 "Duch Sierpnia"
 TRM_WMG_sierpien_desc:0 "Stocznia pamięta 1980 rok. Gdańszczanie wiedzą, jak się zorganizować, gdy państwo zawodzi."
 TRM_GDY_morze:0 "Miasto z morza i marzeń"
 TRM_GDY_morze_desc:0 "Gdynia zbudowana od zera w dwadzieścia lat – i znów gotowa zaczynać od nowa."
 TRM_SPT_kasyno:0 "Pieniądze z kasyna"
 TRM_SPT_kasyno_desc:0 "Kasyna, hotele i kurorty przy Monciaku przynoszą więcej gotówki niż niejeden powiat. Sopot płaci – i ma za co walczyć."
 TRM_SPT_las:0 "Twierdza w lesie"
 TRM_SPT_las_desc:0 "Wzgórza Lasów Oliwskich zamieniają się w twierdzę. Każdy, kto zechce zdobyć Sopot, będzie musiał przejść przez las."
 trm.1.t:0 "Ultimatum znad Zatoki"
 trm.1.d:0 "[From.GetName] żąda, byśmy uznali jego zwierzchnictwo nad Trójmiastem: wspólny port, wspólna flota, jeden rząd – w jego mieście. Odmowa oznacza wojnę o Zatokę."
 trm.1.a:0 "Uznajemy zwierzchnictwo. Lepsza unia niż wojna."
 trm.1.b:0 "Nigdy. Zatoka będzie nasza."
 trm.2.t:0 "Konferencja Czterech Miast"
 trm.2.d:0 "[From.GetName] zaprasza nas do Unii Czterech Miast: Gdańsk, Gdynia, Sopot i Malbork mają mieć wspólną obronę, wspólną walutę i wspólny port. Każde miasto zachowa własny ratusz – na razie."
 trm.2.a:0 "Wchodzimy do Unii."
 trm.2.b:0 "Nie oddamy niezależności."
 trm.3.t:0 "Nowy członek Unii"
 trm.3.d:0 "[From.GetName] przyjmuje zaproszenie. Unia Czterech Miast rośnie."
 trm.3.a:0 "Witamy."
 trm.4.t:0 "Odmowa"
 trm.4.d:0 "[From.GetName] odrzuca zaproszenie. Będzie musiało poradzić sobie samo – albo przekonamy je inaczej."
 trm.4.a:0 "Ich wybór."
 trm.5.t:0 "Akt Unii"
 trm.5.d:0 "[From.GetName] proponuje Akt Unii: miasta Zatoki łączą się w jedno państwo z jednym rządem i jedną armią. Nasz ratusz zostanie siedzibą władz dzielnicy, a nasi radni wejdą do Rady Unii."
 trm.5.a:0 "Podpisujemy Akt Unii."
 trm.5.b:0 "Zostajemy osobno."
 trm.6.t:0 "Unia rośnie"
 trm.6.d:0 "[From.GetName] podpisuje Akt Unii i wchodzi w skład naszego państwa."
 trm.6.a:0 "Jedno państwo nad Zatoką."
 trm.7.t:0 "Koalicja Pomorska"
 trm.7.d:0 "[From.GetName] proponuje Koalicję Pomorską: trzy miasta zostają niezależne, ale razem walczą o Pomorze – Malbork, Warmię, Mazury i Królewiec."
 trm.7.a:0 "Idziemy razem po Pomorze."
 trm.7.b:0 "Pomorze nie jest naszą sprawą."
 trm.8.t:0 "Korytarz przez Kociewie"
 trm.8.d:0 "[From.GetName] prosi o prawo przemarszu przez Kociewie. Ich kolumny chcą dojść do Wisły i Malborka. W zamian oferują ulgi w porcie."
 trm.8.a:0 "Zgoda – za ulgi w porcie."
 trm.8.b:0 "Nikt nie przejdzie przez nasze tory."
 trm.9.t:0 "Wielkie Pomorze"
 trm.9.d:0 "[From.GetName] ogłasza Wielkie Pomorze i proponuje, byśmy weszli w jego skład jako miasto z własnym samorządem. Koalicja zwyciężyła – czas zdecydować, czy zostaje jednym państwem."
 trm.9.a:0 "Wchodzimy do Wielkiego Pomorza."
 trm.9.b:0 "Zostajemy niezależni."
 TRM_WMG_tree:0 "Trójmiasto: Gdańsk"
 TRM_tt_droga:0 "Odblokowuje §Ytrzy drogi§!: zjednoczenie przez wojnę, Unię Czteromiasta albo Koalicję Pomorską."
 TRM_tt_hegemon:0 "Pozostałe miasta Trójmiasta nie istnieją albo są naszymi marionetkami"
 TRM_tt_unia:0 "Co najmniej jedno z pozostałych miast Unii jest z nami w sojuszu"
 TRM_tt_akt:0 "Miasta z naszego sojuszu otrzymają propozycję §Ydobrowolnego połączenia§! w jedno państwo."
 TRM_tt_pomorze:0 "Kontrolujemy Malbork i Olsztyn"
 TRM_GDY_tree:0 "Trójmiasto: Gdynia"
 TRM_SPT_tree:0 "Trójmiasto: Sopot"
