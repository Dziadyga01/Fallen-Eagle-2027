l_english:
 TRN_kom_proklamacja:0 "Proklamacja Federacji Wolnych Komun"
 TRN_kom_proklamacja_desc:0 "Na Rynku Staromiejskim Zgromadzenie Ogólne ogłasza federację wolnych komun od Brdy po Drwęcę. Maksim Andrei Krevienko podkreśla, że nie jest jej przywódcą – tylko delegatem."
 TRN_kom_kongres:0 "Kongres delegatów"
 TRN_kom_kongres_desc:0 "Każda gmina wysyła delegatów z imperatywnym mandatem. Obrady trwają godzinami – ale decyzje mają poparcie."
 TRN_kom_spoldzielnie:0 "Sieć spółdzielni"
 TRN_kom_spoldzielnie_desc:0 "Zakłady, piekarnie i gospodarstwa łączą się w sieć wymiany bez pośredników."
 TRN_kom_milicje:0 "Milicje ludowe"
 TRN_kom_milicje_desc:0 "Straże sąsiedzkie łączą się w Milicje Komun z wybieralnymi dowódcami."
 TRN_kom_kuchnie:0 "Wspólne kuchnie"
 TRN_kom_kuchnie_desc:0 "Darmowe obiady i opał organizowane przez same osiedla."
 TRN_kom_ziemie:0 "Komuny Kujaw"
 TRN_kom_ziemie_desc:0 "Inowrocław, Kruszwica i Radziejów mają własne zgromadzenia – czas zaprosić je do federacji."
 TRN_kom_bydgoszcz:0 "Zaproszenie dla Bydgoszczy"
 TRN_kom_bydgoszcz_desc:0 "Federacja proponuje Bydgoszczy przyłączenie na zasadach komuny – dobrowolnie albo w ogniu walk."
 TRN_kom_rotacja:0 "Rotacja delegatów"
 TRN_kom_rotacja_desc:0 "Nikt nie pełni funkcji dłużej niż rok. Urzędnicy wracają do pracy w warsztatach."
 TRN_kom_solidarnosc:0 "Pakt solidarności"
 TRN_kom_solidarnosc_desc:0 "Komuny zobowiązują się pomagać sobie nawzajem w razie głodu, mrozu i wojny."
 TRN_kom_wisla:0 "Wolna Wisła"
 TRN_kom_wisla_desc:0 "Barki i promy krążą między komunami bez ceł i rogatek."
 TRN_kom_obrona:0 "Obrona federacji"
 TRN_kom_obrona_desc:0 "Każda komuna wystawia oddział – i każda może go wycofać, jeśli wojna przestanie być obronna."
 TRN_kom_kujawy_pomorze:0 "Wolne Kujawy i Pomorze"
 TRN_kom_kujawy_pomorze_desc:0 "Cel końcowy: federacja wolnych komun obejmuje cały region. Otwiera drogę do etapu III."
 TRN_wpt_ponad:0 "Toruń ponad wszystko"
 TRN_wpt_ponad_desc:0 "Nacjonaliści Elany ogłaszają Wielkie Państwo Toruńskie. Na trybunach i ulicach – te same flagi."
 TRN_wpt_jeden_narod:0 "Jedno miasto, jeden naród"
 TRN_wpt_jeden_narod_desc:0 "Kto nie jest z nami, jest przeciw Toruniowi."
 TRN_wpt_militaryzacja:0 "Militaryzacja społeczeństwa"
 TRN_wpt_militaryzacja_desc:0 "Szkolenie wojskowe obowiązkowe od 16. roku życia."
 TRN_wpt_umiarkowani:0 "Umiarkowani w rządzie"
 TRN_wpt_umiarkowani_desc:0 "Część ministrów to fachowcy, a nie bojówkarze. Radykałom się to nie podoba."
 TRN_wpt_bojowki:0 "Bojówki narodowe"
 TRN_wpt_bojowki_desc:0 "Bojówki dostają mundury i legitymacje."
 TRN_wpt_marsz:0 "Marsz na Bydgoszcz"
 TRN_wpt_marsz_desc:0 "Kolumny ruszają przez most fordoński."
 TRN_wpt_ziemie:0 "Ziemie historyczne Torunia"
 TRN_wpt_ziemie_desc:0 "Ziemia Chełmińska, Dobrzyńska i Michałowska – „historyczne” w rozumieniu ministerstwa propagandy."
 TRN_wpt_doktryna:0 "Toruńska doktryna wojskowa"
 TRN_wpt_doktryna_desc:0 "Szybkie uderzenia z mostów i twierdz."
 TRN_doktryna_tb:0 "Toruńska doktryna wojskowa"
 TRN_wpt_twierdza:0 "Twierdza Toruń"
 TRN_wpt_twierdza_desc:0 "Forty z XIX wieku znów są linią obrony."
 TRN_wpt_propaganda:0 "Ministerstwo Propagandy"
 TRN_wpt_propaganda_desc:0 "Jedna gazeta, jedna stacja radiowa, jeden przekaz."
 TRN_wpt_armia:0 "Armia Wielkiego Państwa"
 TRN_wpt_armia_desc:0 "Każdy powiat wystawia batalion."
 TRN_wpt_wielkie:0 "Wielkie Państwo Toruńskie"
 TRN_wpt_wielkie_desc:0 "Cel końcowy: Toruń dominuje nad regionem. Otwiera drogę do etapu III."
 TRN_fkp_porozumienie:0 "Historyczne porozumienie"
 TRN_fkp_porozumienie_desc:0 "Prezydenci Torunia i Bydgoszczy podają sobie ręce na moście w Fordonie. Kibice obu miast patrzą z niedowierzaniem."
 TRN_fkp_dwie_stolice:0 "Dwie stolice, jedno państwo"
 TRN_fkp_dwie_stolice_desc:0 "Toruń – rząd i parlament. Bydgoszcz – sądy, wojsko i gospodarka."
 TRN_fkp_parlament:0 "Federalny parlament"
 TRN_fkp_parlament_desc:0 "Sejm Kujawsko-Pomorski zbiera się na zmianę w obu miastach."
 TRN_fkp_bruski:0 "Rafał Bruski w rządzie"
 TRN_fkp_bruski_desc:0 "Prezydent Bydgoszczy obejmuje urząd premiera federacji. Bydgoszczanie czują, że to także ich państwo."
 TRN_fkp_administracja:0 "Wspólna administracja"
 TRN_fkp_administracja_desc:0 "Jeden urząd wojewódzki zamiast dwóch ratuszy."
 TRN_fkp_konstytucja:0 "Nowa konstytucja"
 TRN_fkp_konstytucja_desc:0 "Konstytucja federalna gwarantuje równowagę stolic."
 TRN_fkp_armia:0 "Armia Federalna"
 TRN_fkp_armia_desc:0 "Brygady z obu miast pod jednym dowództwem w Bydgoszczy."
 TRN_fkp_program:0 "Program Rozwoju Kujaw i Pomorza"
 TRN_fkp_program_desc:0 "Inwestycje rozdzielane według algorytmu – po równo dla obu stolic."
 TRN_fkp_pesa:0 "Pociągi z Bydgoszczy"
 TRN_fkp_pesa_desc:0 "Zakłady kolejowe w Bydgoszczy dostają zamówienie na składy dla całej federacji."
 TRN_fkp_kompromis:0 "Kompromis stolic"
 TRN_fkp_kompromis_desc:0 "Stała komisja pilnuje, by żadne miasto nie zdominowało drugiego."
 TRN_fkp_republika:0 "Zjednoczona Republika"
 TRN_fkp_republika_desc:0 "Cel końcowy: demokratyczna federacja, w której oba miasta mają swoje miejsce. Otwiera drogę do etapu III."
 TRN_kop_nauka:0 "Nauka ponad polityką"
 TRN_kop_nauka_desc:0 "Rada Naukowa przejmuje władzę w Ratuszu. Partie zostają zawieszone „do czasu ustalenia, czy są potrzebne”."
 TRN_kop_akademia:0 "Akademia Kopernikańska"
 TRN_kop_akademia_desc:0 "UMK staje się akademią państwową z własnym budżetem i własną policją."
 TRN_kop_eksperci:0 "Rząd ekspertów"
 TRN_kop_eksperci_desc:0 "Ministrami zostają profesorowie. Pierwsza decyzja: wszystkie ustawy muszą mieć recenzję."
 TRN_kop_instytut:0 "Centralny Instytut Badawczy"
 TRN_kop_instytut_desc:0 "Dawne zakłady Apatora zamieniają się w laboratoria."
 TRN_instytut_tb:0 "Centralny Instytut Badawczy"
 TRN_kop_piwnice:0 "Obserwatorium w Piwnicach"
 TRN_kop_piwnice_desc:0 "Radioteleskop słucha nie tylko gwiazd, ale też łączności wojskowej sąsiadów."
 TRN_piwnice_tb:0 "Obserwatorium w Piwnicach"
 TRN_kop_spoleczenstwo:0 "Uniwersytet otwarty"
 TRN_kop_spoleczenstwo_desc:0 "Darmowe kursy i stypendia dla każdego – nauka ma służyć ludziom, nie tylko elicie."
 TRN_kop_rewolucja:0 "Technologiczna rewolucja Kujaw"
 TRN_kop_rewolucja_desc:0 "Drony, sieci, automatyczne fabryki. Kujawy wyprzedzają resztę dawnej Polski o dekadę."
 TRN_rewolucja_tech_tb:0 "Technologiczna rewolucja Kujaw"
 TRN_kop_opieka:0 "Państwo opiekuńcze ekspertów"
 TRN_kop_opieka_desc:0 "Algorytmy planują szpitale i szkoły. Ludzie dostają więcej, ale nie mają nic do powiedzenia."
 TRN_kop_obrona:0 "Obrona oparta na nauce"
 TRN_kop_obrona_desc:0 "Zamiast liczebności – technologia."
 TRN_obrona_nauka_tb:0 "Obrona oparta na nauce"
 TRN_kop_panstwo:0 "Państwo zarządzane przez naukę"
 TRN_kop_panstwo_desc:0 "Cel końcowy: pierwsze państwo technokratyczne na ziemiach dawnej Polski. Otwiera drogę do etapu III."
 TRN_zkp_start:0 "Zjednoczone Kujawy i Pomorze"
 TRN_zkp_start_desc:0 "Toruń, Bydgoszcz, Włocławek, Grudziądz i Świecie w jednym państwie. Pierwszy raz od rozpadu Polski region ma jedną władzę."
 TRN_zkp_integracja:0 "Integracja regionu"
 TRN_zkp_integracja_desc:0 "Zdobyte ziemie stają się pełnoprawną częścią państwa."
 TRN_zkp_gospodarka:0 "Gospodarka regionu"
 TRN_zkp_gospodarka_desc:0 "Wspólny rynek od Brdy po Drwęcę."
 TRN_zkp_armia:0 "Armia regionu"
 TRN_zkp_armia_desc:0 "Jedna armia dla całego regionu."
 TRN_zkp_wisla:0 "Pan na Wiśle"
 TRN_zkp_wisla_desc:0 "Port w Bydgoszczy, mosty w Toruniu i zapora we Włocławku – cała środkowa Wisła w jednych rękach."
 TRN_zkp_przemysl:0 "Przemysł zbrojeniowy regionu"
 TRN_zkp_przemysl_desc:0 "Zakłady w Bydgoszczy i Toruniu produkują dla wojska."
 TRN_zkp_dyplomacja:0 "Regionalne mocarstwo"
 TRN_zkp_dyplomacja_desc:0 "Sąsiedzi traktują Kujawy i Pomorze poważnie – czasem za poważnie."
 TRN_zkp_cel:0 "Przyszłość Kujaw i Pomorza"
 TRN_zkp_cel_desc:0 "Cel końcowy etapu III: stabilne, silne państwo regionu."
 TRN_zkp_imperium:0 "Imperium Kujawsko-Pomorskie"
 TRN_zkp_imperium_desc:0 "Militarny zdobywca regionu ogłasza imperium. Nikt w okolicy nie odważy się zaprotestować – przynajmniej na razie."
 TRN_zkp_rzeczpospolita:0 "Rzeczpospolita Kujawska"
 TRN_zkp_rzeczpospolita_desc:0 "Demokratyczne Kujawy odbudowują większą część Polski – jako republika, z Toruniem jako sercem."
 TRN_zkp_konfederacja:0 "Konfederacja Wolnych Ziem"
 TRN_zkp_konfederacja_desc:0 "Federacja komun rozlewa się na Wielkopolskę i Mazowsze. Gniezno, Poznań, Płock i Warszawa mają własne zgromadzenia – i żadnej stolicy."
 TRN_zkp_kopernik_europa:0 "Republika Uczonych"
 TRN_zkp_kopernik_europa_desc:0 "Państwo Kopernikańskie staje się ośrodkiem nauki dla całego regionu – i wzorem dla Europy."
 TRN_zkp_wfp:0 "Wielka Federacja Polska"
 TRN_zkp_wfp_desc:0 "Wyjątkowo trudne zakończenie: ziemie polskie znów są jednym państwem, a jego stolicą jest Toruń."
