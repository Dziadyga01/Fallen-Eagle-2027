l_english:
 UBT_partner:0 "Partner w Unii Bałtyckiej"
 UBT_odmowa:0 "Odrzucone zaproszenie do Unii"
 UBT_czlonek_mod:0 "Członek Unii Bałtyckiej"
 UBT_czlonek_mod_desc:0 "Wspólne porty, taryfy i straż wybrzeża. Spójność Unii: §Y[?global.UBT_spojnosc|0]§!/100 – im wyższa, tym większe korzyści."
 ubt.1.t:0 "Powstaje Unia Bałtycka"
 ubt.1.d:0 "[From.GetName] ogłasza powstanie Unii Bałtyckiej: wspólne porty, wspólne taryfy i wspólna straż wybrzeża dla państw nad Bałtykiem. Zaproszenia są już w drodze."
 ubt.1.a:0 "Morze łączy."
 UBT_tt_sp8:0 "Spójność Unii Bałtyckiej: §G+8§!"
 ubt.2.t:0 "Zaproszenie do Unii Bałtyckiej"
 ubt.2.d:0 "[From.GetName] zaprasza nas do Unii Bałtyckiej. Wspólne porty i taryfy to pieniądze, straż wybrzeża – bezpieczeństwo. Ale członkostwo oznacza też, że będziemy bronić sąsiadów, gdy ktoś ich zaatakuje.\n\nSpójność Unii: §Y[?global.UBT_spojnosc|0]§!."
 ubt.2.a:0 "Przystępujemy."
 ubt.2.b:0 "Dziękujemy, ale nie."
 ubt.3.t:0 "Nowy członek Unii"
 ubt.3.d:0 "[From.GetName] przystępuje do Unii Bałtyckiej."
 ubt.3.a:0 "Witamy na pokładzie."
 ubt.4.t:0 "Zaproszenie odrzucone"
 ubt.4.d:0 "[From.GetName] nie chce przystąpić do Unii Bałtyckiej."
 ubt.4.a:0 "Ich strata."
 UBT_federacja_idea:0 "Federacja Bałtycka"
 UBT_federacja_idea_desc:0 "Porty od Szczecina po Elbląg pod jednym rządem. Wspólna flota, wspólna waluta, wspólny parlament w Gdańsku."
 UBT_tt_sm10:0 "Spójność Unii Bałtyckiej: §R-10§!"
 ubt.5.t:0 "Propozycja Federacji Bałtyckiej"
 ubt.5.d:0 "[From.GetName] proponuje przekształcenie Unii w Federację Bałtycką: jeden rząd, jedna armia, jedno państwo. Nasz rząd stanie się rządem krajowym w federacji.\n\nSpójność Unii: §Y[?global.UBT_spojnosc|0]§!."
 ubt.5.a:0 "Zgoda – razem jesteśmy silniejsi."
 ubt.5.b:0 "Nie – zostajemy w Unii, ale na swoich warunkach."
 ubt.6.t:0 "Federacja Bałtycka"
 ubt.6.d:0 "[From.GetName] ogłasza powstanie Federacji Bałtyckiej. Nad portami Gdańska i Gdyni wiszą nowe flagi."
 ubt.6.a:0 "Nowe państwo nad morzem."
 UBT_unia:0 "Unia Bałtycka"
 UBT_unia_desc:0 "Związek nadmorskich państw polskich: wspólne porty, taryfy i straż wybrzeża. Spójność Unii: §Y[?global.UBT_spojnosc|0]§!/100, członków: §Y[?global.UBT_liczba|0]§!. Członkowie dostają premie zależne od spójności; przy spójności 80 i co najmniej trzech członkach założyciel może zaproponować Federację Bałtycką."
 UBT_tt_sp30:0 "Spójność Unii Bałtyckiej: §G+30§!"
 UBT_d_zaloz:0 "Założyć Unię Bałtycką"
 UBT_d_zaloz_desc:0 "Ogłaszamy powstanie Unii Bałtyckiej i zapraszamy nadmorskich sąsiadów. Unia jest też sojuszem obronnym."
 UBT_frakcja:0 "Unia Bałtycka"
 UBT_d_zapros:0 "Zaprosić do Unii"
 UBT_d_zapros_desc:0 "Wysyłamy zaproszenie do nadmorskiego sąsiada. Może przyjąć albo odmówić."
 UBT_taryfa:0 "Wspólna taryfa portowa"
 UBT_taryfa_desc:0 "Jedna stawka za kontener w Gdańsku, Gdyni i Elblągu. Armatorzy przestali przeskakiwać z portu do portu."
 UBT_tt_sp6:0 "Spójność Unii Bałtyckiej: §G+6§!"
 UBT_d_taryfa:0 "Wspólna taryfa portowa"
 UBT_d_taryfa_desc:0 "Członkowie uzgadniają wspólne opłaty portowe. Spójność Unii rośnie, a nasza gospodarka zyskuje na 120 dni."
 UBT_straz_idea:0 "Wspólna straż wybrzeża"
 UBT_straz_idea_desc:0 "Kutry i patrolowce członków pływają pod wspólnym dowództwem. Przemytnicy omijają Zatokę Gdańską."
 UBT_tt_sp5:0 "Spójność Unii Bałtyckiej: §G+5§!"
 UBT_d_straz:0 "Wspólna straż wybrzeża"
 UBT_d_straz_desc:0 "Wspólne patrole i dowództwo straży wybrzeża. Spójność rośnie, obrona wybrzeża jest silniejsza."
 UBT_zloty:0 "Bałtycki złoty"
 UBT_zloty_desc:0 "Wspólna waluta portów. Kupcy z Hamburga i Kłajpedy przyjmują ją bez targowania się."
 UBT_tt_sp10:0 "Spójność Unii Bałtyckiej: §G+10§!"
 UBT_d_waluta:0 "Bałtycki złoty"
 UBT_d_waluta_desc:0 "Założyciel wprowadza wspólną walutę Unii. Wszyscy członkowie dostają stałą premię gospodarczą."
 UBT_d_federacja:0 "Federacja Bałtycka"
 UBT_d_federacja_desc:0 "Proponujemy członkom pokojowe połączenie w jedno państwo. Każdy członek sam zdecyduje, czy się zgadza."
 UBT_tt_sm15:0 "Spójność Unii Bałtyckiej: §R-15§!"
 UBT_d_wystap:0 "Wystąpić z Unii"
 UBT_d_wystap_desc:0 "Wychodzimy z Unii Bałtyckiej. Odzyskujemy swobodę – i tracimy wspólne korzyści."
