 feukr.1.t:0 "Raport z frontu ukraińskiego"
 feukr.1.d:0 "Suma postępów w 24 obwodach wynosi [?ROS_UKR_total|0] na 2400 możliwych punktów. Dominacja nad Ukrainą: [?ROS_UKR_dominance|2]%. Wartość obejmuje trzy w pełni zajęte obwody oraz częściową kontrolę kolejnych terenów. Jest to system strategiczny, nie rzeczywista zmiana granic na mapie."
 feukr.1.a:0 "Przyjąć raport"
 feukr.25.t:0 "Operacja Ukraina: 25 procent dominacji"
 feukr.25.d:0 "Rosyjskie operacje przekroczyły ćwierć całkowitego postępu. Wskaźnik nie oznacza automatycznie zdobycia stanów na mapie."
 feukr.25.a:0 "Zrozumiano"
 feukr.50.t:0 "Operacja Ukraina: 50 procent dominacji"
 feukr.50.d:0 "Suma rosyjskich postępów osiągnęła połowę możliwych punktów. Wskaźnik nie oznacza automatycznie zdobycia stanów na mapie."
 feukr.50.a:0 "Zrozumiano"
 feukr.75.t:0 "Operacja Ukraina: 75 procent dominacji"
 feukr.75.d:0 "Trzy czwarte teoretycznego postępu znajduje się pod kontrolą Rosji. Wskaźnik nie oznacza automatycznie zdobycia stanów na mapie."
 feukr.75.a:0 "Zrozumiano"
 feukr.100.t:0 "Operacja Ukraina: 100 procent dominacji"
 feukr.100.d:0 "Wszystkie 24 obwody osiągnęły maksymalny poziom rosyjskiej kontroli. Wskaźnik nie oznacza automatycznie zdobycia stanów na mapie."
 feukr.100.a:0 "Zrozumiano"
