 UNI_trojmiasto_propozycja_3:0 "Federacja Trójmiejska: zaproponować pełne połączenie"
 UNI_trojmiasto_propozycja_3_desc:0 "Gdańsk, Gdynia i Sopot – port, stocznia i kurort – w jednym organizmie miejskim nad Zatoką.\n\nZaproszenie dostanie każdy niezależny uczestnik projektu. Każdy osobno zdecyduje: zgoda, zgoda tylko na autonomię, tylko pakt albo odmowa. Po zebraniu odpowiedzi (21 dni) przychodzi czas na ratyfikację i integrację. Kto odmówi, zostaje niepodległy – a jego ziem nie można przyłączyć pokojowo."
 uni.111.t:0 "Federacja Trójmiejska: zaproszenie"
 uni.111.d:0 "[From.GetName] zaprasza nas do projektu „Federacja Trójmiejska” i proponuje: §Y[UNI_trojmiasto_forma_txt]§!.\n\nGdańsk, Gdynia i Sopot – port, stocznia i kurort – w jednym organizmie miejskim nad Zatoką.\n\nNasza zgoda dotyczy tylko nas – sąsiedzi decydują osobno. Po zebraniu odpowiedzi będzie jeszcze osobna ratyfikacja, a do jej chwili możemy się wycofać."
 uni.111.a:0 "Zgadzamy się na proponowane warunki."
 uni.111.b:0 "Wejdziemy tylko jako autonomia (federacja zamiast połączenia)."
 uni.111.c:0 "Tylko pakt obronny – niepodległość zostaje."
 uni.111.e:0 "Odmawiamy. Zostajemy niepodlegli."
 uni.113.t:0 "Federacja Trójmiejska: odpowiedzi uczestników"
 uni.113.d:0 "Minęły trzy tygodnie od zaproszeń. Zgód: §Y[?UNI_trojmiasto_zgody|0]§!. Każda zgoda obejmuje tylko kraj, który jej udzielił; kto odmówił albo nie odpowiedział, zostaje niepodległy.\n\nJeśli przejdziemy do ratyfikacji, każdy uczestnik zagłosuje jeszcze raz – osobno."
 uni.113.a:0 "Przejść do ratyfikacji."
 uni.113.b:0 "Odłożyć projekt."
 uni.114.t:0 "Federacja Trójmiejska: ratyfikacja"
 uni.114.d:0 "Warunki projektu „Federacja Trójmiejska” są gotowe. Nasz parlament głosuje osobno; inni uczestnicy głosują u siebie.\n\nPropozycja: §Y[UNI_trojmiasto_forma_txt]§!."
 uni.114.a:0 "Ratyfikujemy."
 uni.114.b:0 "Wycofujemy zgodę."
 UNI_PAKT_TROJMIASTO:0 "Federacja Trójmiejska – pakt obronny"
 UNI_trojmiasto_m_integracja:0 "Integracja: Federacja Trójmiejska"
 UNI_trojmiasto_m_integracja_desc:0 "Ratyfikacja zakończona. Przez 90 dni trwa łączenie urzędów, budżetów i dowództw. Na koniec gra sprawdzi każdego uczestnika: czy istnieje, czy ratyfikacja jest wciąż ważna (zmiana rządu ją unieważnia) i czy nie toczy z nami wojny. Uczestnicy, którzy nie spełnią warunków, zostaną niepodlegli.\n\nNowa nazwa: centrum kontroluje Gdańsk, Gdynię i Sopot."
 UNI_trojmiasto_nazwa_req:0 "Nowa nazwa: centrum kontroluje Gdańsk, Gdynię i Sopot"
 uni.116.t:0 "Federacja Trójmiejska"
 uni.116.d:0 "Zakończyła się integracja projektu „Federacja Trójmiejska”. Uczestników, którzy osobno ratyfikowali umowę: §Y[?FROM.UNI_trojmiasto_czlonkowie|0]§!. Kto odmówił, wycofał zgodę albo wszedł w wojnę, pozostał niepodległy.\n\nNowa nazwa: centrum kontroluje Gdańsk, Gdynię i Sopot."
 uni.116.a:0 "Nowy rozdział."
 uni.117.t:0 "Federacja Trójmiejska: projekt upadł"
 uni.117.d:0 "Projekt „Federacja Trójmiejska” upadł: nikt nie ratyfikował umowy albo inicjator utracił niezależność. Wszyscy uczestnicy pozostają niepodlegli."
 uni.117.a:0 "Spróbujemy kiedy indziej."
 uni.118.t:0 "Federacja Trójmiejska: integracja się zaczyna"
 uni.118.d:0 "Uczestnicy projektu „Federacja Trójmiejska” ratyfikowali umowę. Urzędnicy łączą rejestry i budżety. Do końca integracji każda zmiana rządu może odwrócić decyzję."
 uni.118.a:0 "Zobaczymy, co z tego wyjdzie."
 UNI_tt_6:0 "Posiadanie Olsztyna albo Giżycka"
