 uni.147.d:0 "Projekt „Zjednoczona Warszawa” upadł: nikt nie ratyfikował umowy albo inicjator utracił niezależność. Wszyscy uczestnicy pozostają niepodlegli."
 uni.147.a:0 "Spróbujemy kiedy indziej."
 uni.148.t:0 "Zjednoczona Warszawa: integracja się zaczyna"
 uni.148.d:0 "Uczestnicy projektu „Zjednoczona Warszawa” ratyfikowali umowę. Urzędnicy łączą rejestry i budżety. Do końca integracji każda zmiana rządu może odwrócić decyzję."
 uni.148.a:0 "Zobaczymy, co z tego wyjdzie."
 UNI_tt_9:0 "Ukończony fokus europejskiego projektu (Eurokomisariat Pomorza z Donaldem Tuskiem albo Sejm – ścieżka odbudowy)"
 UNI_europa_propozycja_2:0 "Europejska Rzeczpospolita Polska: zaproponować federację"
 UNI_europa_propozycja_2_desc:0 "Europejski projekt odbudowy Polski: federacja państw, które przyjmą wspólne instytucje, fundusze odbudowy z warunkami i wspólną politykę zagraniczną.\n\nZaproszenie dostanie każdy niezależny uczestnik projektu. Każdy osobno zdecyduje: zgoda, zgoda tylko na autonomię, tylko pakt albo odmowa. Po zebraniu odpowiedzi (21 dni) przychodzi czas na ratyfikację i integrację. Kto odmówi, zostaje niepodległy – a jego ziem nie można przyłączyć pokojowo."
 uni.151.t:0 "Europejska Rzeczpospolita Polska: zaproszenie"
 uni.151.d:0 "[From.GetName] zaprasza nas do projektu „Europejska Rzeczpospolita Polska” i proponuje: §Y[UNI_europa_forma_txt]§!.\n\nEuropejski projekt odbudowy Polski: federacja państw, które przyjmą wspólne instytucje, fundusze odbudowy z warunkami i wspólną politykę zagraniczną.\n\nNasza zgoda dotyczy tylko nas – sąsiedzi decydują osobno. Po zebraniu odpowiedzi będzie jeszcze osobna ratyfikacja, a do jej chwili możemy się wycofać."
 uni.151.a:0 "Zgadzamy się na proponowane warunki."
 uni.151.b:0 "Wejdziemy tylko jako autonomia (federacja zamiast połączenia)."
 uni.151.c:0 "Tylko pakt obronny – niepodległość zostaje."
 uni.151.e:0 "Odmawiamy. Zostajemy niepodlegli."
 uni.153.t:0 "Europejska Rzeczpospolita Polska: odpowiedzi uczestników"
 uni.153.d:0 "Minęły trzy tygodnie od zaproszeń. Zgód: §Y[?UNI_europa_zgody|0]§!. Każda zgoda obejmuje tylko kraj, który jej udzielił; kto odmówił albo nie odpowiedział, zostaje niepodległy.\n\nJeśli przejdziemy do ratyfikacji, każdy uczestnik zagłosuje jeszcze raz – osobno."
 uni.153.a:0 "Przejść do ratyfikacji."
 uni.153.b:0 "Odłożyć projekt."
 uni.154.t:0 "Europejska Rzeczpospolita Polska: ratyfikacja"
 uni.154.d:0 "Warunki projektu „Europejska Rzeczpospolita Polska” są gotowe. Nasz parlament głosuje osobno; inni uczestnicy głosują u siebie.\n\nPropozycja: §Y[UNI_europa_forma_txt]§!."
 uni.154.a:0 "Ratyfikujemy."
 uni.154.b:0 "Wycofujemy zgodę."
 UNI_PAKT_EUROPA:0 "Europejska Rzeczpospolita Polska – pakt obronny"
 UNI_europa_m_integracja:0 "Integracja: Europejska Rzeczpospolita Polska"
 UNI_europa_m_integracja_desc:0 "Ratyfikacja zakończona. Przez 60 dni trwa łączenie urzędów, budżetów i dowództw. Na koniec gra sprawdzi każdego uczestnika: czy istnieje, czy ratyfikacja jest wciąż ważna (zmiana rządu ją unieważnia) i czy nie toczy z nami wojny. Uczestnicy, którzy nie spełnią warunków, zostaną niepodlegli.\n\nNowa nazwa: w federacji są co najmniej §Y4§! państwa członkowskie."
 UNI_europa_nazwa_req:0 "Nowa nazwa: w federacji są co najmniej §Y4§! państwa członkowskie"
 uni.156.t:0 "Europejska Rzeczpospolita Polska"
 uni.156.d:0 "Zakończyła się integracja projektu „Europejska Rzeczpospolita Polska”. Uczestników, którzy osobno ratyfikowali umowę: §Y[?FROM.UNI_europa_czlonkowie|0]§!. Kto odmówił, wycofał zgodę albo wszedł w wojnę, pozostał niepodległy.\n\nNowa nazwa: w federacji są co najmniej §Y4§! państwa członkowskie."
 uni.156.a:0 "Nowy rozdział."
 uni.157.t:0 "Europejska Rzeczpospolita Polska: projekt upadł"
 uni.157.d:0 "Projekt „Europejska Rzeczpospolita Polska” upadł: nikt nie ratyfikował umowy albo inicjator utracił niezależność. Wszyscy uczestnicy pozostają niepodlegli."
 uni.157.a:0 "Spróbujemy kiedy indziej."
 uni.158.t:0 "Europejska Rzeczpospolita Polska: integracja się zaczyna"
 uni.158.d:0 "Uczestnicy projektu „Europejska Rzeczpospolita Polska” ratyfikowali umowę. Urzędnicy łączą rejestry i budżety. Do końca integracji każda zmiana rządu może odwrócić decyzję."
 uni.158.a:0 "Zobaczymy, co z tego wyjdzie."
 UNI_forma_1:0 "pakt obronny – wszyscy pozostają niepodlegli"
 UNI_forma_2:0 "federacja – własne rządy, wspólna polityka zagraniczna i obrona"
 UNI_forma_3:0 "pełne połączenie w jedno państwo"
 uni.90.t:0 "Nowy rząd a umowy o unii"
 uni.90.d:0 "Zmiana władzy unieważniła wcześniejsze zgody i ratyfikacje. Nowy rząd musi jeszcze raz zdecydować – bez tego żadna integracja nas nie obejmie."
 uni.90.a:0 "Rozumiemy."
 UNI_odbudowa_administracji:0 "Odbudowa administracji"
 UNI_odbudowa_administracji_desc:0 "Na przyłączonych ziemiach urzędnicy zaczynają od zera: rejestry, podatki, posterunki, szkoły. Zanim ludzie uznają nową władzę, minie wiele miesięcy."
 UNI_odbudowa_ziem:0 "Odbudowa administracji na przyłączonych ziemiach"
 UNI_odbudowa_ziem_desc:0 "Ziemie zdobyte siłą nie stają się naszymi same z siebie. Przez 120 dni odbudowujemy urzędy, posterunki i szkoły – potem regiony, które kontrolujemy dłużej niż pół roku, stają się rdzennymi. W tym czasie nie możemy prowadzić wojny."
