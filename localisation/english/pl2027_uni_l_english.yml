l_english:
 UNI_kat:0 "Integracja regionów"
 UNI_kat_desc:0 "Pokojowe łączenie państw wymaga zgody każdego niezależnego uczestnika i osobnej ratyfikacji. Zgoda na rozmowy nie oznacza zgody na przyłączenie: warunki – forma, stolica, instytucje, dowództwo i autonomia – trzeba wynegocjować, a każda strona może je odrzucić albo zgłosić kontrpropozycję. Po ratyfikacji trwa §Yintegracja§! (60 dni dla federacji, 90 dla połączenia); przed jej końcem gra ponownie sprawdza, czy uczestnicy istnieją, nie walczą ze sobą i nie wycofali zgody. Ziemie zdobyte siłą nie łączą się same – wymagają odbudowy administracji."
 UNI_federacja_idea:0 "Członek federacji"
 UNI_federacja_idea_desc:0 "Mamy własny rząd, budżet i flagę, ale politykę zagraniczną i obronę prowadzimy wspólnie z centrum federacji."
 UNI_integracja_trwa:0 "Integracja w toku"
 UNI_integracja_trwa_desc:0 "Urzędy obu stron uzgadniają rejestry, budżety i regulaminy. Część decyzji czeka, aż ruszą wspólne instytucje."
 UNI_btu_forma_1:0 "pakt obronny (oba miasta niepodległe)"
 UNI_btu_forma_2:0 "federacja (wspólna polityka zagraniczna, własne rządy)"
 UNI_btu_forma_3:0 "pełne połączenie w jedno państwo"
 UNI_btu_stolica_1:0 "Toruń"
 UNI_btu_stolica_2:0 "Bydgoszcz"
 UNI_btu_stolica_3:0 "dwie stolice (rząd w mieście proponującym, sejm w drugim)"
 UNI_btu_instytucje_1:0 "wspólny Sejm Unii"
 UNI_btu_instytucje_2:0 "Rada Miast (równa liczba głosów)"
 UNI_btu_dowodztwo_1:0 "wspólne dowództwo"
 UNI_btu_dowodztwo_2:0 "oddzielne dowództwa miast"
 UNI_btu_autonomia_1:0 "szeroka (własne sądy, policja, podatki)"
 UNI_btu_autonomia_2:0 "ograniczona (wspólne urzędy, jedno prawo)"
 UNI_tt_tylko_rozmowy:0 "Zgadzamy się §Ywyłącznie na rozmowy§!. Warunki unii (forma, stolica, instytucje, dowództwo, autonomia) trzeba jeszcze wynegocjować, a potem osobno ratyfikować."
 UNI_tt_1:0 "Druga strona dostanie propozycję rozmów. §YZgoda na rozmowy nie oznacza zgody na połączenie.§!"
 UNI_btu_propozycja_TRN:0 "Unia Bydgosko-Toruńska: zaproponować rozmowy"
 UNI_btu_propozycja_TRN_desc:0 "Toruń proponuje sąsiadowi zza Wisły rozmowy o unii. Na razie tylko rozmowy: forma, stolica, instytucje, dowództwo i autonomia zostaną wynegocjowane później, a druga strona może w każdej chwili odmówić. Odmowa nie zmienia granic."
 UNI_btu_w_forma_TRN:0 "Warunki unii – forma: zmienić"
 UNI_btu_w_forma_TRN_desc:0 "Zmienia proponowany warunek „Forma” na następny wariant. Obecnie: [UNI_btu_forma_txt]."
 UNI_btu_w_stolica_TRN:0 "Warunki unii – stolica: zmienić"
 UNI_btu_w_stolica_TRN_desc:0 "Zmienia proponowany warunek „Stolica” na następny wariant. Obecnie: [UNI_btu_stolica_txt]."
 UNI_btu_w_instytucje_TRN:0 "Warunki unii – instytucje: zmienić"
 UNI_btu_w_instytucje_TRN_desc:0 "Zmienia proponowany warunek „Instytucje” na następny wariant. Obecnie: [UNI_btu_instytucje_txt]."
 UNI_btu_w_dowodztwo_TRN:0 "Warunki unii – dowództwo: zmienić"
 UNI_btu_w_dowodztwo_TRN_desc:0 "Zmienia proponowany warunek „Dowództwo” na następny wariant. Obecnie: [UNI_btu_dowodztwo_txt]."
 UNI_btu_w_autonomia_TRN:0 "Warunki unii – autonomia: zmienić"
 UNI_btu_w_autonomia_TRN_desc:0 "Zmienia proponowany warunek „Autonomia” na następny wariant. Obecnie: [UNI_btu_autonomia_txt]."
 UNI_btu_przedstaw_TRN:0 "Przedstawić warunki unii"
 UNI_btu_przedstaw_TRN_desc:0 "Delegacja przekazuje drugiej stronie pakiet warunków:\n§YForma:§! [UNI_btu_forma_txt]\n§YStolica:§! [UNI_btu_stolica_txt]\n§YInstytucje:§! [UNI_btu_instytucje_txt]\n§YDowództwo:§! [UNI_btu_dowodztwo_txt]\n§YAutonomia:§! [UNI_btu_autonomia_txt]\n\nDruga strona może je przyjąć, zgłosić jedną kontrpropozycję albo odrzucić."
 UNI_btu_propozycja_BYD:0 "Unia Bydgosko-Toruńska: zaproponować rozmowy"
 UNI_btu_propozycja_BYD_desc:0 "Bydgoszcz proponuje sąsiadowi zza Wisły rozmowy o unii. Na razie tylko rozmowy: forma, stolica, instytucje, dowództwo i autonomia zostaną wynegocjowane później, a druga strona może w każdej chwili odmówić. Odmowa nie zmienia granic."
 UNI_btu_w_forma_BYD:0 "Warunki unii – forma: zmienić"
 UNI_btu_w_forma_BYD_desc:0 "Zmienia proponowany warunek „Forma” na następny wariant. Obecnie: [UNI_btu_forma_txt]."
 UNI_btu_w_stolica_BYD:0 "Warunki unii – stolica: zmienić"
 UNI_btu_w_stolica_BYD_desc:0 "Zmienia proponowany warunek „Stolica” na następny wariant. Obecnie: [UNI_btu_stolica_txt]."
 UNI_btu_w_instytucje_BYD:0 "Warunki unii – instytucje: zmienić"
 UNI_btu_w_instytucje_BYD_desc:0 "Zmienia proponowany warunek „Instytucje” na następny wariant. Obecnie: [UNI_btu_instytucje_txt]."
 UNI_btu_w_dowodztwo_BYD:0 "Warunki unii – dowództwo: zmienić"
 UNI_btu_w_dowodztwo_BYD_desc:0 "Zmienia proponowany warunek „Dowództwo” na następny wariant. Obecnie: [UNI_btu_dowodztwo_txt]."
 UNI_btu_w_autonomia_BYD:0 "Warunki unii – autonomia: zmienić"
 UNI_btu_w_autonomia_BYD_desc:0 "Zmienia proponowany warunek „Autonomia” na następny wariant. Obecnie: [UNI_btu_autonomia_txt]."
 UNI_btu_przedstaw_BYD:0 "Przedstawić warunki unii"
 UNI_btu_przedstaw_BYD_desc:0 "Delegacja przekazuje drugiej stronie pakiet warunków:\n§YForma:§! [UNI_btu_forma_txt]\n§YStolica:§! [UNI_btu_stolica_txt]\n§YInstytucje:§! [UNI_btu_instytucje_txt]\n§YDowództwo:§! [UNI_btu_dowodztwo_txt]\n§YAutonomia:§! [UNI_btu_autonomia_txt]\n\nDruga strona może je przyjąć, zgłosić jedną kontrpropozycję albo odrzucić."
 uni.1.t:0 "Propozycja rozmów o unii"
 uni.1.d:0 "[From.GetName] proponuje rozmowy o Unii Bydgosko-Toruńskiej. W liście z ratusza jest mowa o „wspólnym regionie”, ale nie ma jeszcze żadnych warunków: formę, stolicę, instytucje, dowództwo i autonomię trzeba dopiero wynegocjować.\n\n§YZgoda na rozmowy nie jest zgodą na połączenie.§! Na każdym etapie możemy odmówić, a bez naszej ratyfikacji nic się nie zmieni."
 uni.1.a:0 "Zgadzamy się na rozmowy – nic więcej."
 uni.1.b:0 "Rozmawiajmy, ale tylko o pakcie obronnym."
 uni.1.c:0 "Odmawiamy. Zostajemy niepodlegli."
 uni.2.t:0 "Rozmowy o unii przyjęte"
 uni.2.d:0 "[From.GetName] zgadza się usiąść do stołu – na razie wyłącznie do rozmów.\n\nWarunki ustalamy w panelu „Integracja regionów”, a potem przedstawiamy je drugiej stronie. Obecny projekt:\n§YForma:§! [UNI_btu_forma_txt]\n§YStolica:§! [UNI_btu_stolica_txt]\n§YInstytucje:§! [UNI_btu_instytucje_txt]\n§YDowództwo:§! [UNI_btu_dowodztwo_txt]\n§YAutonomia:§! [UNI_btu_autonomia_txt]"
 uni.2.a:0 "Przygotujmy warunki."
 uni.3.t:0 "Odmowa rozmów"
 uni.3.d:0 "[From.GetName] nie chce rozmawiać o unii. Oba miasta pozostają niepodległe; ponowną propozycję można złożyć za pół roku."
 uni.3.a:0 "Szkoda."
 uni.4.t:0 "Warunki unii"
 uni.4.d:0 "[From.GetName] przedstawia warunki Unii Bydgosko-Toruńskiej:\n\n§YForma:§! [UNI_btu_forma_txt]\n§YStolica:§! [UNI_btu_stolica_txt]\n§YInstytucje:§! [UNI_btu_instytucje_txt]\n§YDowództwo:§! [UNI_btu_dowodztwo_txt]\n§YAutonomia:§! [UNI_btu_autonomia_txt]\n\nMożemy je przyjąć (wtedy obie strony osobno głosują ratyfikację), zgłosić jedną kontrpropozycję albo odrzucić całość – wtedy oba miasta zostają niepodległe."
 uni.4.a:0 "Przyjmujemy warunki i kierujemy je do ratyfikacji."
 uni.4.b:0 "Kontrpropozycja: stolica unii u nas."
 uni.4.c:0 "Kontrpropozycja: federacja zamiast połączenia, szeroka autonomia."
 uni.4.e:0 "Kontrpropozycja: tylko pakt obronny."
 uni.4.f:0 "Odrzucamy warunki. Każde miasto zostaje u siebie."
 uni.5.t:0 "Kontrpropozycja w sprawie unii"
 uni.5.d:0 "[From.GetName] odpowiada kontrpropozycją. Po zmianach warunki wyglądają tak:\n\n§YForma:§! [UNI_btu_forma_txt]\n§YStolica:§! [UNI_btu_stolica_txt]\n§YInstytucje:§! [UNI_btu_instytucje_txt]\n§YDowództwo:§! [UNI_btu_dowodztwo_txt]\n§YAutonomia:§! [UNI_btu_autonomia_txt]\n\nTo ostatnia runda: albo przyjmujemy, albo rozmowy się kończą."
 uni.5.a:0 "Przyjmujemy kontrpropozycję."
 uni.5.b:0 "Nie zgadzamy się. Koniec rozmów."
 UNI_tt_2:0 "Jeśli druga strona też ratyfikuje: pakt – od razu; federacja – po §Y60§! dniach integracji; połączenie – po §Y90§! dniach."
 uni.6.t:0 "Ratyfikacja unii"
 uni.6.d:0 "Warunki Unii Bydgosko-Toruńskiej są uzgodnione:\n\n§YForma:§! [UNI_btu_forma_txt]\n§YStolica:§! [UNI_btu_stolica_txt]\n§YInstytucje:§! [UNI_btu_instytucje_txt]\n§YDowództwo:§! [UNI_btu_dowodztwo_txt]\n§YAutonomia:§! [UNI_btu_autonomia_txt]\n\nTeraz decyduje nasz parlament. Druga strona głosuje osobno – unia powstanie tylko, jeśli ratyfikują ją obie."
 uni.6.a:0 "Ratyfikujemy."
 uni.6.b:0 "Odrzucamy w głosowaniu."
 uni.7.t:0 "Rozmowy o unii zakończone"
 uni.7.d:0 "Rozmowy o Unii Bydgosko-Toruńskiej zakończyły się bez porozumienia. Toruń i Bydgoszcz pozostają osobnymi państwami."
 uni.7.a:0 "Każdy u siebie."
 UNI_PAKT_BTU:0 "Pakt Bydgosko-Toruński"
 UNI_btu_m_integracja_2:0 "Integracja Unii Bydgosko-Toruńskiej"
 UNI_btu_m_integracja_2_desc:0 "Unia jest ratyfikowana. Przez 60 dni urzędy obu miast łączą rejestry, budżety i dowództwa. Na koniec gra sprawdzi, czy obie strony nadal istnieją, nie walczą ze sobą i nie wycofały ratyfikacji (np. po zmianie rządu). Wojna między stronami przerywa integrację."
 UNI_btu_m_integracja_3:0 "Integracja Unii Bydgosko-Toruńskiej"
 UNI_btu_m_integracja_3_desc:0 "Unia jest ratyfikowana. Przez 90 dni urzędy obu miast łączą rejestry, budżety i dowództwa. Na koniec gra sprawdzi, czy obie strony nadal istnieją, nie walczą ze sobą i nie wycofały ratyfikacji (np. po zmianie rządu). Wojna między stronami przerywa integrację."
 uni.10.t:0 "Unia Bydgosko-Toruńska"
 uni.10.d:0 "Toruń i Bydgoszcz zakończyły integrację. Po latach sporów o most, lotnisko i gminy między miastami region ma wspólny projekt – zgodnie z warunkami, które obie strony ratyfikowały osobno.\n\n§YForma:§! [UNI_btu_forma_txt]\n§YStolica:§! [UNI_btu_stolica_txt]\n§YInstytucje:§! [UNI_btu_instytucje_txt]\n§YDowództwo:§! [UNI_btu_dowodztwo_txt]\n§YAutonomia:§! [UNI_btu_autonomia_txt]"
 uni.10.a:0 "Most zamiast muru."
 uni.11.t:0 "Integracja przerwana"
 uni.11.d:0 "Integracja Unii Bydgosko-Toruńskiej została przerwana: jedna ze stron przestała istnieć, wycofała ratyfikację albo doszło do wojny. Oba państwa zachowują dotychczasowe granice."
 uni.11.a:0 "Wracamy do punktu wyjścia."
 uni.12.t:0 "Pakt Bydgosko-Toruński"
 uni.12.d:0 "Toruń i Bydgoszcz podpisały pakt obronny. Oba miasta pozostają niepodległe, ale wspólnie bronią regionu i otwierają granice dla wojska."
 uni.12.a:0 "Razem bezpieczniej."
 uni.13.t:0 "Unia ratyfikowana"
 uni.13.d:0 "Parlamenty Torunia i Bydgoszczy ratyfikowały unię. Zaczyna się integracja urzędów – potrwa kilka miesięcy, a do jej końca każda zmiana rządu może wszystko zatrzymać."
 uni.13.a:0 "Zobaczymy."
 UNI_btu_sejm:0 "Sejm Unii"
 UNI_btu_sejm_desc:0 "Wspólny parlament obu miast. Debaty są długie, ale decyzje zapadają w jednym miejscu."
 UNI_btu_rada_miast:0 "Rada Miast"
 UNI_btu_rada_miast_desc:0 "Toruń i Bydgoszcz mają po równo głosów. Nic nie przejdzie bez zgody obu – ale nikt nie czuje się pominięty."
 UNI_btu_dowodztwo_wspolne:0 "Wspólne dowództwo"
 UNI_btu_dowodztwo_wspolne_desc:0 "Jedna komenda, jeden sztab, jeden plan obrony regionu."
 UNI_btu_dwa_dowodztwa:0 "Dwa dowództwa"
 UNI_btu_dwa_dowodztwa_desc:0 "Każde miasto zachowało własne dowództwo. Lojalność żołnierzy jest pewna, koordynacja – mniej."
 UNI_btu_dwie_stolice:0 "Dwie stolice"
 UNI_btu_dwie_stolice_desc:0 "Rząd w jednym mieście, sejm w drugim. Urzędnicy jeżdżą tramwajem przez most w Fordonie częściej niż kiedykolwiek."
 UNI_btu_autonomia_miast:0 "Autonomia miast"
 UNI_btu_autonomia_miast_desc:0 "Obie dawne stolice zachowały sądy, policję i część podatków."
 UNI_tt_3:0 "Posiadanie co najmniej §Y2§! z trzech miast: Toruń, Bydgoszcz, Włocławek"
 UNI_tt_4:0 "Uczestnicy projektu dostaną zaproszenie. Po §Y21§! dniach – podsumowanie odpowiedzi."
 UNI_kujpom_propozycja_2:0 "Państwo Kujawsko-Pomorskie: zaproponować federację"
 UNI_kujpom_propozycja_2_desc:0 "Kujawy i Pomorze Nadwiślańskie w jednym państwie – od Tucholi po Włocławek i od Brodnicy po Inowrocław.\n\nZaproszenie dostanie każdy niezależny uczestnik projektu. Każdy osobno zdecyduje: zgoda, zgoda tylko na autonomię, tylko pakt albo odmowa. Po zebraniu odpowiedzi (21 dni) przychodzi czas na ratyfikację i integrację. Kto odmówi, zostaje niepodległy – a jego ziem nie można przyłączyć pokojowo."
 UNI_kujpom_propozycja_3:0 "Państwo Kujawsko-Pomorskie: zaproponować pełne połączenie"
 UNI_kujpom_propozycja_3_desc:0 "Kujawy i Pomorze Nadwiślańskie w jednym państwie – od Tucholi po Włocławek i od Brodnicy po Inowrocław.\n\nZaproszenie dostanie każdy niezależny uczestnik projektu. Każdy osobno zdecyduje: zgoda, zgoda tylko na autonomię, tylko pakt albo odmowa. Po zebraniu odpowiedzi (21 dni) przychodzi czas na ratyfikację i integrację. Kto odmówi, zostaje niepodległy – a jego ziem nie można przyłączyć pokojowo."
 uni.101.t:0 "Państwo Kujawsko-Pomorskie: zaproszenie"
 uni.101.d:0 "[From.GetName] zaprasza nas do projektu „Państwo Kujawsko-Pomorskie” i proponuje: §Y[UNI_kujpom_forma_txt]§!.\n\nKujawy i Pomorze Nadwiślańskie w jednym państwie – od Tucholi po Włocławek i od Brodnicy po Inowrocław.\n\nNasza zgoda dotyczy tylko nas – sąsiedzi decydują osobno. Po zebraniu odpowiedzi będzie jeszcze osobna ratyfikacja, a do jej chwili możemy się wycofać."
 uni.101.a:0 "Zgadzamy się na proponowane warunki."
 uni.101.b:0 "Wejdziemy tylko jako autonomia (federacja zamiast połączenia)."
 uni.101.c:0 "Tylko pakt obronny – niepodległość zostaje."
 uni.101.e:0 "Odmawiamy. Zostajemy niepodlegli."
 uni.103.t:0 "Państwo Kujawsko-Pomorskie: odpowiedzi uczestników"
 uni.103.d:0 "Minęły trzy tygodnie od zaproszeń. Zgód: §Y[?UNI_kujpom_zgody|0]§!. Każda zgoda obejmuje tylko kraj, który jej udzielił; kto odmówił albo nie odpowiedział, zostaje niepodległy.\n\nJeśli przejdziemy do ratyfikacji, każdy uczestnik zagłosuje jeszcze raz – osobno."
 uni.103.a:0 "Przejść do ratyfikacji."
 uni.103.b:0 "Odłożyć projekt."
 uni.104.t:0 "Państwo Kujawsko-Pomorskie: ratyfikacja"
 uni.104.d:0 "Warunki projektu „Państwo Kujawsko-Pomorskie” są gotowe. Nasz parlament głosuje osobno; inni uczestnicy głosują u siebie.\n\nPropozycja: §Y[UNI_kujpom_forma_txt]§!."
 uni.104.a:0 "Ratyfikujemy."
 uni.104.b:0 "Wycofujemy zgodę."
 UNI_PAKT_KUJPOM:0 "Państwo Kujawsko-Pomorskie – pakt obronny"
 UNI_kujpom_m_integracja:0 "Integracja: Państwo Kujawsko-Pomorskie"
 UNI_kujpom_m_integracja_desc:0 "Ratyfikacja zakończona. Przez 90 dni trwa łączenie urzędów, budżetów i dowództw. Na koniec gra sprawdzi każdego uczestnika: czy istnieje, czy ratyfikacja jest wciąż ważna (zmiana rządu ją unieważnia) i czy nie toczy z nami wojny. Uczestnicy, którzy nie spełnią warunków, zostaną niepodlegli.\n\nNowa nazwa państwa tylko przy kontroli co najmniej §Y96§! z §Y129§! regionów województwa, w tym Torunia, Bydgoszczy i Włocławka."
 UNI_kujpom_nazwa_req:0 "Nowa nazwa państwa tylko przy kontroli co najmniej §Y96§! z §Y129§! regionów województwa, w tym Torunia, Bydgoszczy i Włocławka"
 uni.106.t:0 "Państwo Kujawsko-Pomorskie"
 uni.106.d:0 "Zakończyła się integracja projektu „Państwo Kujawsko-Pomorskie”. Uczestników, którzy osobno ratyfikowali umowę: §Y[?FROM.UNI_kujpom_czlonkowie|0]§!. Kto odmówił, wycofał zgodę albo wszedł w wojnę, pozostał niepodległy.\n\nNowa nazwa państwa tylko przy kontroli co najmniej §Y96§! z §Y129§! regionów województwa, w tym Torunia, Bydgoszczy i Włocławka."
 uni.106.a:0 "Nowy rozdział."
 uni.107.t:0 "Państwo Kujawsko-Pomorskie: projekt upadł"
 uni.107.d:0 "Projekt „Państwo Kujawsko-Pomorskie” upadł: nikt nie ratyfikował umowy albo inicjator utracił niezależność. Wszyscy uczestnicy pozostają niepodlegli."
 uni.107.a:0 "Spróbujemy kiedy indziej."
 uni.108.t:0 "Państwo Kujawsko-Pomorskie: integracja się zaczyna"
 uni.108.d:0 "Uczestnicy projektu „Państwo Kujawsko-Pomorskie” ratyfikowali umowę. Urzędnicy łączą rejestry i budżety. Do końca integracji każda zmiana rządu może odwrócić decyzję."
 uni.108.a:0 "Zobaczymy, co z tego wyjdzie."
 UNI_tt_5:0 "Państwo posiada swoje miasto nad Zatoką i nie walczy z sąsiadami z Trójmiasta"
 UNI_trojmiasto_propozycja_1:0 "Federacja Trójmiejska: zaproponować pakt obronny"
 UNI_trojmiasto_propozycja_1_desc:0 "Gdańsk, Gdynia i Sopot – port, stocznia i kurort – w jednym organizmie miejskim nad Zatoką.\n\nZaproszenie dostanie każdy niezależny uczestnik projektu. Każdy osobno zdecyduje: zgoda, zgoda tylko na autonomię, tylko pakt albo odmowa. Po zebraniu odpowiedzi (21 dni) przychodzi czas na ratyfikację i integrację. Kto odmówi, zostaje niepodległy – a jego ziem nie można przyłączyć pokojowo."
 UNI_trojmiasto_propozycja_2:0 "Federacja Trójmiejska: zaproponować federację"
