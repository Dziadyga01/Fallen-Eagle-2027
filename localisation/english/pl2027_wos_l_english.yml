 zpp.252.d:0 "Prokuratura w Lublinie wszczyna „postępowanie w sprawie nieprawidłowości” u sąsiadów i proponuje wyjście: wspólne państwo, wspólne sądy. Odmowa zostanie potraktowana jako utrudnianie śledztwa. Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcja moda.)"
 zpp.252.a:0 "Ustępujemy."
