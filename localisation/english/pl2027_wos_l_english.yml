 PRW_tt_reg_ma_ptk:0 "Ziemia Piotrkowska dostaje propozycję: „Apel o wspólny front: Ziemia Piotrkowska”. Odmowa da nam cel wojenny tylko wobec tego państwa."
 zpp.240.t:0 "Umowa rozwojowa: Podlasie Nadbużańskie"
 zpp.240.d:0 "Lublin proponuje wspólny fundusz inwestycyjny, kontrakty dla firm i drogę ekspresową. W zamian – jeden budżet i jeden rząd. Pieniądze są na stole. Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcja moda.)"
 zpp.240.a:0 "Inwestycje są ważniejsze niż flagi."
 zpp.240.b:0 "Nie sprzedamy się za kontrakty."
 PRW_tt_reg_mo_pdl:0 "Podlasie Nadbużańskie dostaje propozycję: „Umowa rozwojowa: Podlasie Nadbużańskie”. Odmowa nie oznacza wojny – rozmowy można ponowić po 120 dniach."
 zpp.241.t:0 "Umowa rozwojowa: Ziemia Radomska"
 zpp.241.d:0 "Lublin proponuje wspólny fundusz inwestycyjny, kontrakty dla firm i drogę ekspresową. W zamian – jeden budżet i jeden rząd. Pieniądze są na stole. Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcja moda.)"
 zpp.241.a:0 "Inwestycje są ważniejsze niż flagi."
 zpp.241.b:0 "Nie sprzedamy się za kontrakty."
 PRW_tt_reg_mo_rad:0 "Ziemia Radomska dostaje propozycję: „Umowa rozwojowa: Ziemia Radomska”. Odmowa nie oznacza wojny – rozmowy można ponowić po 120 dniach."
