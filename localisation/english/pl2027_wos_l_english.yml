 TR2_kow_mobilizacja_obywatelska:0 "Obywatelska mobilizacja"
 TR2_kow_mobilizacja_obywatelska_desc:0 "Komitety mieszkańców same łatają drogi, naprawiają przepusty i spisują, czego brakuje w każdej dzielnicy. Kowalczyk chce, żeby ten ruch miał głos w rządzie."
 WOS_tt_36:0 "[PDG.GetName] dostaje propozycję przyłączenia do Torunia. Odmowa da nam cel wojenny tylko wobec tego jednego państwa."
