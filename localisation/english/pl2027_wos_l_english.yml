 WOS_tt_43:0 "[KUJ.GetName] dostaje propozycję oddania gmin: Gniewkowo, Rojewo i Aleksandrów. Odmowa da nam cel wojenny tylko na te gminy."
 WOS_tt_44:0 "[CHE.GetName] dostaje propozycję przyłączenia do Torunia. Odmowa da nam cel wojenny tylko wobec tego jednego państwa."
