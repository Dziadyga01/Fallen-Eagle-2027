 zpp.250.t:0 "Nakaz współpracy: Podlasie Nadbużańskie"
 zpp.250.d:0 "Prokuratura w Lublinie wszczyna „postępowanie w sprawie nieprawidłowości” u sąsiadów i proponuje wyjście: wspólne państwo, wspólne sądy. Odmowa zostanie potraktowana jako utrudnianie śledztwa. Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcja moda.)"
 zpp.250.a:0 "Ustępujemy."
 zpp.250.b:0 "Nie uznajemy lubelskich sądów."
 PRW_tt_reg_zi_pdl:0 "Podlasie Nadbużańskie dostaje propozycję: „Nakaz współpracy: Podlasie Nadbużańskie”. Odmowa da nam cel wojenny tylko wobec tego państwa."
