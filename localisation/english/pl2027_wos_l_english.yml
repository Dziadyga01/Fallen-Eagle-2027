 tza.200.t:0 "Ultimatum Komendantury: Podgórz wraca do miasta"
 tza.200.d:0 "Komendantura Toruńska stawia sprawę jasno: podporządkowanie albo konsekwencje. Na rogatkach stoją już ciężarówki z żołnierzami. Lewobrzeżna dzielnica ogłosiła niezależność w pierwszych dniach chaosu. Most łączy oba brzegi Wisły – czas połączyć też urzędy."
 tza.200.a:0 "Ustępujemy. Opór nie ma sensu."
 tza.200.b:0 "Nie ugniemy się. Niech przyjdą."
