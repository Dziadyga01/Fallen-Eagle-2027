 tza.160.t:0 "Wolne dzielnice zapraszają: Podgórz wraca do miasta"
 tza.160.d:0 "Zgromadzenie dzielnic Torunia zaprasza mieszkańców gminy do federacji bez prezydenta: każda wspólnota decyduje sama, a współpracuje dobrowolnie. Lewobrzeżna dzielnica ogłosiła niezależność w pierwszych dniach chaosu. Most łączy oba brzegi Wisły – czas połączyć też urzędy."
