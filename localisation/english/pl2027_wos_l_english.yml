 tza.165.d:0 "Zgromadzenie dzielnic Torunia zaprasza mieszkańców gminy do federacji bez prezydenta: każda wspólnota decyduje sama, a współpracuje dobrowolnie. Wolne Miasto Chełmża ma cukrownię, jezioro i drogę na Grudziądz. Ma też za mało ludzi, żeby samo się obronić."
 tza.165.a:0 "Zgromadzenie mieszkańców się zgadza."
 tza.165.b:0 "Nie chcemy eksperymentów."
 tza.166.t:0 "Wolne dzielnice zapraszają: Dąbrowa Chełmińska"
 tza.166.d:0 "Zgromadzenie dzielnic Torunia zaprasza mieszkańców gminy do federacji bez prezydenta: każda wspólnota decyduje sama, a współpracuje dobrowolnie. Gmina na skarpie nad Wisłą zamyka drogę do Chełmna. Jej rada od miesięcy pyta, kto zapłaci za zimę."
 tza.166.a:0 "Zgromadzenie mieszkańców się zgadza."
 tza.166.b:0 "Nie chcemy eksperymentów."
 tza.167.t:0 "Wolne dzielnice zapraszają: Gniewkowo, Rojewo i Aleksandrów"
 tza.167.d:0 "Zgromadzenie dzielnic Torunia zaprasza mieszkańców gminy do federacji bez prezydenta: każda wspólnota decyduje sama, a współpracuje dobrowolnie. Trzy gminy Republiki Kujawskiej leżą bliżej toruńskiego ratusza niż inowrocławskiego. Toruń chce tylko ich – nie całych Kujaw."
 tza.167.a:0 "Zgromadzenie mieszkańców się zgadza."
 tza.167.b:0 "Nie chcemy eksperymentów."
 tza.168.t:0 "Wolne dzielnice zapraszają: Ziemia Chełmińska"
 tza.168.d:0 "Zgromadzenie dzielnic Torunia zaprasza mieszkańców gminy do federacji bez prezydenta: każda wspólnota decyduje sama, a współpracuje dobrowolnie. Stare miasto prawa chełmińskiego i jego gminy tworzą własne państwo. Dla Torunia to kolebka regionu – i ostatni brakujący kawałek."
 tza.168.a:0 "Zgromadzenie mieszkańców się zgadza."
 tza.168.b:0 "Nie chcemy eksperymentów."
 tza.180.t:0 "Kontrakt metropolitalny: Podgórz wraca do miasta"
 tza.180.d:0 "Dyrektoriat Rozwoju Torunia przysyła gotową umowę: gmina staje się dzielnicą metropolii, dostaje inwestycje – i traci samorząd. Odmowa zostanie uznana za blokowanie rozwoju regionu. Lewobrzeżna dzielnica ogłosiła niezależność w pierwszych dniach chaosu. Most łączy oba brzegi Wisły – czas połączyć też urzędy."
 tza.180.a:0 "Podpisujemy – inwestycje są ważniejsze."
 tza.180.b:0 "Nie oddamy samorządu za asfalt."
 tza.181.t:0 "Kontrakt metropolitalny: Łysomice"
 tza.181.d:0 "Dyrektoriat Rozwoju Torunia przysyła gotową umowę: gmina staje się dzielnicą metropolii, dostaje inwestycje – i traci samorząd. Odmowa zostanie uznana za blokowanie rozwoju regionu. Gmina na północ od miasta żyje z Torunia: tu pracuje, tu się leczy, tu kupuje. Granica na rogatkach nikomu nie służy."
 tza.181.a:0 "Podpisujemy – inwestycje są ważniejsze."
 tza.181.b:0 "Nie oddamy samorządu za asfalt."
 tza.182.t:0 "Kontrakt metropolitalny: Lubicz"
 tza.182.d:0 "Dyrektoriat Rozwoju Torunia przysyła gotową umowę: gmina staje się dzielnicą metropolii, dostaje inwestycje – i traci samorząd. Odmowa zostanie uznana za blokowanie rozwoju regionu. Gmina nad Drwęcą jest przedmieściem Torunia z własnym wójtem i własną strażą. Wspólna administracja oznacza wspólny prąd, wodę i autobusy."
 tza.182.a:0 "Podpisujemy – inwestycje są ważniejsze."
 tza.182.b:0 "Nie oddamy samorządu za asfalt."
