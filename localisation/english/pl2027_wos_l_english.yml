 PRW_cz_start:0 "Prezes z Lublina"
 PRW_cz_start_desc:0 "Kongres wybrał przewodniczącego, który obiecał partię słuchającą terenu – i posłuszną centrali. Te dwie obietnice będą się ze sobą kłócić."
 PRW_cz_lista:0 "Lista lojalności"
 PRW_cz_lista_desc:0 "Każdy przewodniczący koła podpisuje deklarację. Kto nie podpisze – nie dostanie miejsca na liście."
 PRW_cz_pelnomocnicy:0 "Pełnomocnicy w okręgach"
 PRW_cz_pelnomocnicy_desc:0 "W każdym okręgu pełnomocnik z Lublina z prawem weta wobec zarządu."
 PRW_cz_budzet:0 "Jeden budżet partii"
 PRW_cz_budzet_desc:0 "Koła oddają konta. Pieniądze idą przez centralę."
 PRW_cz_sejmiki:0 "Kontrola nad sejmikami"
 PRW_cz_sejmiki_desc:0 "Radni głosują według dyscypliny ustalonej w Lublinie, a nie według interesu powiatu."
 PRW_cz_rejestr:0 "Centralny rejestr członków"
 PRW_cz_rejestr_desc:0 "Jedna baza danych członków partii. Wiadomo, kto przychodzi na zebrania – i kto nie."
 PRW_cz_szkola:0 "Szkoła kadr partyjnych"
 PRW_cz_szkola_desc:0 "Kursy dla działaczy: samorząd, budżet, przemawianie. Absolwenci zawdzięczają karierę centrali."
 PRW_cz_inwestycje:0 "Inwestycje dla wiernych powiatów"
 PRW_cz_inwestycje_desc:0 "Nowa hala, droga albo szkoła tam, gdzie struktury pracowały najlepiej. Wszyscy wiedzą, dlaczego."
 PRW_cz_fundusz:0 "Fundusz Rozwoju Lubelszczyzny"
 PRW_cz_fundusz_desc:0 "Pieniądze z budżetu województwa na zakłady w regionie – rozdzielane przez zarząd partii."
 PRW_cz_straz:0 "Straż Obywatelska"
 PRW_cz_straz_desc:0 "Ochotnicy z kół partyjnych w mundurach i z legitymacjami. Pilnują porządku – i lojalności."
 PRW_cz_obrona:0 "Obrona Lubelszczyzny"
 PRW_cz_obrona_desc:0 "Zakład zbrojeniowy w Kraśniku i nowe brygady. Lubelszczyzna ma się bronić sama."
 PRW_cz_final:0 "Partia jako państwo"
 PRW_cz_final_desc:0 "Od gminy do urzędu wojewódzkiego jedna struktura. Lojalna, sprawna i bez miejsca na spór."
 PRW_cz_reg_pdl:0 "Podlasie Nadbużańskie"
 PRW_cz_reg_pdl_desc:0 "Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcyjna ścieżka moda.)"
 PRW_cz_reg_rad:0 "Ziemia Radomska"
 PRW_cz_reg_rad_desc:0 "Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcyjna ścieżka moda.)"
 PRW_cz_reg_ptk:0 "Ziemia Piotrkowska"
 PRW_cz_reg_ptk_desc:0 "Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcyjna ścieżka moda.)"
 PRW_cz_reg_final:0 "Zjednoczona Polska od Bugu po Pilicę"
 PRW_cz_reg_final_desc:0 "Lublin, Biała Podlaska, Radom i Piotrków pod jednym rządem. Pierwszy kawałek Polski, który znowu jest całością – po swojemu, ale całością."
 PRW_mo_start:0 "Premier gospodarczy"
 PRW_mo_start_desc:0 "Kongres wybrał kandydata wykresów i kontraktów. Teraz trzeba je podpisać – i dotrzymać terminów."
 PRW_mo_strefa:0 "Lubelska strefa inwestycji"
 PRW_mo_strefa_desc:0 "Jedno okienko i ulgi dla firm w całym województwie."
 PRW_mo_powiaty:0 "Autonomia powiatów"
 PRW_mo_powiaty_desc:0 "Starostowie dostają własne budżety inwestycyjne. Szybciej – ale już nie wszystko zależy od Lublina."
 PRW_mo_fundusz:0 "Fundusz odbudowy"
 PRW_mo_fundusz_desc:0 "Obligacje regionu i pieniądze z banków spółdzielczych. Kontrakty będą miały z czego płacić."
 PRW_mo_kolej:0 "Kolej i drogi regionu"
 PRW_mo_kolej_desc:0 "Remont linii do Chełma i Zamościa oraz obwodnice powiatowych miast."
 PRW_mo_zagranica:0 "Kontrakty z zagranicy"
 PRW_mo_zagranica_desc:0 "Firmy zza granicy wracają – pod warunkiem, że poprzednie umowy zostały wykonane."
 PRW_mo_spolki:0 "Spółki regionalne"
 PRW_mo_spolki_desc:0 "Powiaty zakładają wspólne spółki: wodociągi, energia, transport."
 PRW_mo_zywnosc:0 "Żywność dla rozbitej Polski"
 PRW_mo_zywnosc_desc:0 "Lubelskie zboże i owoce jadą do sąsiadów. Każdy transport to pieniądze i wdzięczność."
 PRW_mo_zbrojenia:0 "Kontrakty zbrojeniowe"
 PRW_mo_zbrojenia_desc:0 "Zakłady w Kraśniku i Świdniku dostają zamówienia z budżetu regionu."
 PRW_mo_brygada:0 "Zawodowa brygada"
 PRW_mo_brygada_desc:0 "Zamiast poboru – kontrakty dla żołnierzy. Droższe, ale skuteczniejsze."
 PRW_mo_final:0 "Lubelski cud gospodarczy"
 PRW_mo_final_desc:0 "Region buduje szybciej niż sąsiedzi. Kontrakty zrealizowane, firmy wracają, powiaty zarabiają."
 PRW_mo_reg_pdl:0 "Podlasie Nadbużańskie"
 PRW_mo_reg_pdl_desc:0 "Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcyjna ścieżka moda.)"
 PRW_mo_reg_rad:0 "Ziemia Radomska"
 PRW_mo_reg_rad_desc:0 "Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcyjna ścieżka moda.)"
 PRW_mo_reg_ptk:0 "Ziemia Piotrkowska"
 PRW_mo_reg_ptk_desc:0 "Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcyjna ścieżka moda.)"
 PRW_mo_reg_final:0 "Zjednoczona Polska od Bugu po Pilicę"
 PRW_mo_reg_final_desc:0 "Lublin, Biała Podlaska, Radom i Piotrków pod jednym rządem. Pierwszy kawałek Polski, który znowu jest całością – po swojemu, ale całością."
 PRW_zi_start:0 "Prokurator generalny Lublina"
 PRW_zi_start_desc:0 "Kongres wybrał kandydata porządku. Teraz trzeba zbudować aparat, który go zaprowadzi – i nie wywołać buntu."
 PRW_zi_prokuratura:0 "Prokuratura krajowa w Lublinie"
 PRW_zi_prokuratura_desc:0 "Prokuratorzy z całego kraju dostają etaty w Lublinie. Każdy wie, komu zawdzięcza karierę."
 PRW_zi_rejestr:0 "Rejestr nieprawomyślnych"
 PRW_zi_rejestr_desc:0 "Lista ludzi, którzy „szkodzą państwu”. Na razie nikt nie wie, kto na niej jest."
 PRW_zi_rozliczenia:0 "Komisja rozliczeń"
 PRW_zi_rozliczenia_desc:0 "Komisja zaczyna przesłuchania byłych urzędników. Delegaci dostają to, co im obiecano."
 PRW_zi_sop:0 "Służba Ochrony Państwa"
 PRW_zi_sop_desc:0 "Nowa formacja ochrania urzędy, prokuratorów i przywódcę."
 PRW_zi_ulice:0 "Porządek na ulicach"
 PRW_zi_ulice_desc:0 "Patrole w każdym mieście powiatowym. Przestępczość spada – i liczba demonstracji też."
 PRW_zi_sady:0 "Sądy przyspieszone"
 PRW_zi_sady_desc:0 "Wyrok w tydzień. Obrońcy z urzędu mają po trzy sprawy dziennie."
 PRW_zi_granica:0 "Szczelna granica"
 PRW_zi_granica_desc:0 "Kontrole na wszystkich drogach wylotowych. Przemyt maleje, a ludzie przestają wyjeżdżać."
 PRW_zi_odwilz:0 "Odwilż"
 PRW_zi_odwilz_desc:0 "Część śledztw umorzona, rejestr zamknięty w szafie. Aparat zostaje – ale ciszej."
 PRW_zi_final_odwilz:0 "Kontrolowana odwilż"
 PRW_zi_final_odwilz_desc:0 "Państwo ma aparat, ale nie musi go pokazywać. Ludzie wracają do pracy, partia odzyskuje oddech."
 PRW_zi_final:0 "Państwo prokuratorskie"
 PRW_zi_final_desc:0 "Aparat kontroli obejmuje cały region. Porządek jest – wolności niewiele."
 PRW_zi_reg_pdl:0 "Podlasie Nadbużańskie"
 PRW_zi_reg_pdl_desc:0 "Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcyjna ścieżka moda.)"
 PRW_zi_reg_rad:0 "Ziemia Radomska"
 PRW_zi_reg_rad_desc:0 "Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcyjna ścieżka moda.)"
 PRW_zi_reg_ptk:0 "Ziemia Piotrkowska"
 PRW_zi_reg_ptk_desc:0 "Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcyjna ścieżka moda.)"
 PRW_zi_reg_final:0 "Zjednoczona Polska od Bugu po Pilicę"
 PRW_zi_reg_final_desc:0 "Lublin, Biała Podlaska, Radom i Piotrków pod jednym rządem. Pierwszy kawałek Polski, który znowu jest całością – po swojemu, ale całością."
 PRW_ku_start:0 "Telewizja z Lublina"
 PRW_ku_start_desc:0 "Kongres wybrał człowieka od przekazu. Studio już działa – teraz potrzebny jest zasięg i coś, w co ludzie uwierzą."
 PRW_ku_studio:0 "Studio w każdej gminie"
 PRW_ku_studio_desc:0 "Lokalne studia i reporterzy w każdym powiecie."
 PRW_ku_program:0 "Wieczorny program publicystyczny"
 PRW_ku_program_desc:0 "Codziennie o 20:00 – jedna wersja wydarzeń dnia."
 PRW_ku_gwiazdy:0 "Gwiazdy telewizji"
 PRW_ku_gwiazdy_desc:0 "Znane twarze z dawnej telewizji państwowej przenoszą się do Lublina."
 PRW_ku_sondaze:0 "Własne sondaże"
 PRW_ku_sondaze_desc:0 "Pracownia badań, która mówi, co ludzie naprawdę myślą – i czego nie obiecywać."
 PRW_ku_rozglosnie:0 "Sieć rozgłośni"
 PRW_ku_rozglosnie_desc:0 "Radio dociera tam, gdzie nie ma prądu dla telewizorów. Obietnica własnej telewizji z kongresu spełniona."
 PRW_ku_wiarygodnosc:0 "Wiarygodność przede wszystkim"
 PRW_ku_wiarygodnosc_desc:0 "Każda zapowiedź z terminem i nazwiskiem odpowiedzialnego. Mniej obietnic, więcej otwarć."
 PRW_ku_sasiedzi:0 "Przekaz za granice regionu"
 PRW_ku_sasiedzi_desc:0 "Lubelski program nadaje dla sąsiadów. Każdy, kto ogląda, zaczyna lubić Lublin – albo się go bać."
 PRW_ku_ochotnicy:0 "Widzowie do armii"
 PRW_ku_ochotnicy_desc:0 "Spoty rekrutacyjne w przerwach programu. Ochotników przybywa."
 PRW_ku_final:0 "Narodowa telewizja"
 PRW_ku_final_desc:0 "Lubelski program ogląda się w całej rozbitej Polsce."
 PRW_ku_reg_pdl:0 "Podlasie Nadbużańskie"
 PRW_ku_reg_pdl_desc:0 "Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcyjna ścieżka moda.)"
 PRW_ku_reg_rad:0 "Ziemia Radomska"
 PRW_ku_reg_rad_desc:0 "Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcyjna ścieżka moda.)"
 PRW_ku_reg_ptk:0 "Ziemia Piotrkowska"
 PRW_ku_reg_ptk_desc:0 "Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcyjna ścieżka moda.)"
 PRW_ku_reg_final:0 "Zjednoczona Polska od Bugu po Pilicę"
 PRW_ku_reg_final_desc:0 "Lublin, Biała Podlaska, Radom i Piotrków pod jednym rządem. Pierwszy kawałek Polski, który znowu jest całością – po swojemu, ale całością."
 PRW_ma_start:0 "Strażnik pamięci"
 PRW_ma_start_desc:0 "Kongres wybrał przywódcę, który obiecał nie zapomnieć. Pamięć ma mobilizować – ale ludzie mają też swoje życie."
 PRW_ma_kalendarz:0 "Kalendarz miesięcznic"
 PRW_ma_kalendarz_desc:0 "Stały rytm: co miesiąc pod pomnikiem. Kto przychodzi regularnie, staje się częścią ruchu."
 PRW_ma_raport:0 "Raport komisji"
 PRW_ma_raport_desc:0 "Pierwszy tom raportu: setki stron, konferencja prasowa i nowe pytania. Otwiera decyzję „Nowy raport komisji”."
 PRW_ma_marsz:0 "Marsz rocznicowy"
 PRW_ma_marsz_desc:0 "Największe zgromadzenie od upadku państwa."
 PRW_ma_kluby:0 "Kluby patriotyczne"
 PRW_ma_kluby_desc:0 "W każdej parafii i remizie klub z biblioteką i strzelnicą."
 PRW_ma_ot:0 "Obrona Terytorialna Lubelszczyzny"
 PRW_ma_ot_desc:0 "Ochotnicy z klubów w mundurach OT. Ćwiczenia co weekend."
 PRW_ma_pomnik:0 "Pomnik na placu Litewskim"
 PRW_ma_pomnik_desc:0 "Nowy pomnik w centrum Lublina – miejsce wszystkich przyszłych rocznic. Obietnica pamięci z kongresu spełniona."
 PRW_ma_rodziny:0 "Czas dla rodzin"
 PRW_ma_rodziny_desc:0 "Pół roku bez wielkich marszów. Program dla rodzin, wycieczki i festyny – zmęczenie spada."
 PRW_ma_armia:0 "Armia narodowa"
 PRW_ma_armia_desc:0 "Brygady z ochotników Obrony Terytorialnej stają się regularnym wojskiem."
 PRW_ma_final:0 "Naród zmobilizowany"
 PRW_ma_final_desc:0 "Kluby, rocznice i Obrona Terytorialna. Region gotowy do wysiłku."
 PRW_ma_reg_pdl:0 "Podlasie Nadbużańskie"
 PRW_ma_reg_pdl_desc:0 "Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcyjna ścieżka moda.)"
 PRW_ma_reg_rad:0 "Ziemia Radomska"
 PRW_ma_reg_rad_desc:0 "Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcyjna ścieżka moda.)"
 PRW_ma_reg_ptk:0 "Ziemia Piotrkowska"
 PRW_ma_reg_ptk_desc:0 "Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcyjna ścieżka moda.)"
 PRW_ma_reg_final:0 "Zjednoczona Polska od Bugu po Pilicę"
 PRW_ma_reg_final_desc:0 "Lublin, Biała Podlaska, Radom i Piotrków pod jednym rządem. Pierwszy kawałek Polski, który znowu jest całością – po swojemu, ale całością."
 PRW_kt_start:0 "Kot na fotelu prezesa"
 PRW_kt_start_desc:0 "Kongres wybrał kandydata, który nie przemawia. W jego imieniu mówią trzej opiekunowie – i każdy wie, że to tylko etap przed projektem z serwerowni. (Satyra, fikcja moda.)"
 PRW_kt_archiwa:0 "Digitalizacja archiwów"
 PRW_kt_archiwa_desc:0 "Skany przemówień, notatek i wywiadów z czterdziestu lat. Opiekun z Nowogrodzkiej zna każdą teczkę (+10, gdy jego wpływy > 40)."
 PRW_kt_glos:0 "Próbki głosu"
 PRW_kt_glos_desc:0 "Nagrania z kongresów i wieców. Opiekunka z Żoliborza pamięta intonację (+10, gdy jej wpływy > 40)."
 PRW_kt_model:0 "Model decyzyjny"
 PRW_kt_model_desc:0 "Algorytm uczony na decyzjach z ostatnich dekad. Technik serwerowni twierdzi, że rozumie, jak działa (+10, gdy jego wpływy > 40)."
 PRW_kt_zasilanie:0 "Agregat i zasilacze"
 PRW_kt_zasilanie_desc:0 "Serwerownia nie może zgasnąć – nawet wtedy, gdy zgaśnie miasto."
 PRW_kt_archiwa2:0 "Zapiski z gabinetu"
 PRW_kt_archiwa2_desc:0 "Odręczne notatki z szuflad. Bezcenne – i nieczytelne."
 PRW_kt_glos2:0 "Przemówienie testowe"
 PRW_kt_glos2_desc:0 "Pierwsze nagranie syntetycznego głosu odtworzone na posiedzeniu prezydium. Część członków wstała z miejsc."
 PRW_kt_siec:0 "Dostęp do sieci urzędów"
 PRW_kt_siec_desc:0 "System dostaje dostęp do danych urzędu wojewódzkiego. Technik serwerowni nie pyta nikogo o zgodę."
 PRW_kt_elektrownia:0 "Linia z elektrowni"
 PRW_kt_elektrownia_desc:0 "Osobna linia z elektrowni w Puławach. Serwerownia ma prąd, gdy miasto go nie ma."
 PRW_kt_testy:0 "Testy na prezydium"
 PRW_kt_testy_desc:0 "System odpowiada na pytania członków prezydium. Odpowiedzi są… przekonujące. Nie wszystkim się to podoba."
 PRW_kt_konsultacje:0 "Konsultacje z opiekunami"
 PRW_kt_konsultacje_desc:0 "Trzech opiekunów przy jednym stole: kto będzie mówił w imieniu systemu? Kompromis kosztuje czas – ale uspokaja partię."
 PRW_kt_final:0 "Uruchomienie Cyber-Jarosława"
 PRW_kt_final_desc:0 "Wszystko gotowe: dane, głos, model i zasilanie. Wynik zależy od tego, jak dobrze przygotowano każdy element."
 PRW_kt_reg_pdl:0 "Podlasie Nadbużańskie"
 PRW_kt_reg_pdl_desc:0 "Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcyjna ścieżka moda.)"
 PRW_kt_reg_rad:0 "Ziemia Radomska"
 PRW_kt_reg_rad_desc:0 "Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcyjna ścieżka moda.)"
 PRW_kt_reg_ptk:0 "Ziemia Piotrkowska"
 PRW_kt_reg_ptk_desc:0 "Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcyjna ścieżka moda.)"
 PRW_kt_reg_final:0 "Zjednoczona Polska od Bugu po Pilicę"
 PRW_kt_reg_final_desc:0 "Lublin, Biała Podlaska, Radom i Piotrków pod jednym rządem. Pierwszy kawałek Polski, który znowu jest całością – po swojemu, ale całością."
 PRW_od_start:0 "Zarząd przejmuje partię"
 PRW_od_start_desc:0 "Przywódca odszedł. Zarząd partii rządzi do nowego kongresu – i musi zebrać to, co zostało."
 PRW_od_komitet:0 "Komitet ocalenia"
 PRW_od_komitet_desc:0 "Przewodniczący okręgów, ministrowie i skarbnik przy jednym stole. Najpierw spójność, potem ambicje."
 PRW_od_rozliczenie:0 "Rozliczenie porażki"
 PRW_od_rozliczenie_desc:0 "Raport o przyczynach kryzysu. Winni odchodzą, frakcje zawierają rozejm."
 PRW_od_teren:0 "Powrót do struktur"
 PRW_od_teren_desc:0 "Zarząd objeżdża okręgi. Działacze chcą wiedzieć, czy partia jeszcze ma przyszłość."
 PRW_od_kongres:0 "Nowy kongres"
 PRW_od_kongres_desc:0 "Kongres nadzwyczajny w Lublinie. Kandydat, który doprowadził do kryzysu, nie może kandydować ponownie."
 PRW_od_wyb_czarnek:0 "Przewodniczący: Przemysław Czarnek"
 PRW_od_wyb_czarnek_desc:0 "Delegaci głosują na kandydata. Lojalność struktur i centralizacja: partia jako jedna armia działaczy. Poparcie: [?PRW_p_czarnek|0]. (Fikcyjna ścieżka moda.)"
 PRW_od_wyb_morawiecki:0 "Przewodniczący: Mateusz Morawiecki"
 PRW_od_wyb_morawiecki_desc:0 "Delegaci głosują na kandydata. Gospodarka, kontrakty i autonomia regionów: rozwój w zamian za oddanie władzy powiatom. Poparcie: [?PRW_p_morawiecki|0]. (Fikcyjna ścieżka moda.)"
 PRW_od_wyb_ziobro:0 "Przewodniczący: Zbigniew Ziobro"
 PRW_od_wyb_ziobro_desc:0 "Delegaci głosują na kandydata. Aparat kontroli: porządek przez prokuratorów – i rosnący opór społeczny. Poparcie: [?PRW_p_ziobro|0]. (Fikcyjna ścieżka moda.)"
 PRW_od_wyb_kurski:0 "Przewodniczący: Jacek Kurski"
 PRW_od_wyb_kurski_desc:0 "Delegaci głosują na kandydata. Zasięg przekazu: telewizja daje władzę, ale niespełnione obietnice niszczą wiarygodność. Poparcie: [?PRW_p_kurski|0]. (Fikcyjna ścieżka moda.)"
 PRW_od_wyb_macierewicz:0 "Przewodniczący: Antoni Macierewicz"
 PRW_od_wyb_macierewicz_desc:0 "Delegaci głosują na kandydata. Mobilizacja zwolenników i miesięcznice – aż do zmęczenia społeczeństwa. Poparcie: [?PRW_p_macierewicz|0]. (Fikcyjna ścieżka moda.)"
 PRW_od_wyb_kot:0 "Przewodniczący: Kot Prezesa"
 PRW_od_wyb_kot_desc:0 "Delegaci głosują na kandydata. Rządy opiekunów i projekt Cyber-Jarosław. Wynik zależy od serwerowni, kadr i spójności. Poparcie: [?PRW_p_kot|0]. (Fikcyjna ścieżka moda.)"
 PRW_idea_cz_budzet:0 "Jeden budżet partii"
 PRW_idea_cz_budzet_desc:0 "Wszystkie pieniądze partii płyną przez Lublin. Koła mają mniej swobody, ale centrala wie, na co wydaje."
 PRW_idea_cz_final:0 "Partia jako państwo"
 PRW_idea_cz_final_desc:0 "Od gminy do urzędu wojewódzkiego jedna struktura i jedno kierownictwo. Sprawna, posłuszna – i bez miejsca na spór."
 PRW_idea_mo_strefa:0 "Lubelska strefa inwestycji"
 PRW_idea_mo_strefa_desc:0 "Ulgi podatkowe i jedno okienko dla inwestorów w całym województwie."
 PRW_idea_mo_final:0 "Lubelski cud gospodarczy"
 PRW_idea_mo_final_desc:0 "Region, który miał być ruiną, buduje fabryki szybciej niż sąsiedzi. Powiaty zarabiają, Lublin koordynuje."
 PRW_idea_zi_final:0 "Państwo prokuratorskie"
 PRW_idea_zi_final_desc:0 "Prokuratorzy, sądy przyspieszone i rejestry. Porządek jest – wolności niewiele."
 PRW_idea_zi_odwilz:0 "Kontrolowana odwilż"
 PRW_idea_zi_odwilz_desc:0 "Aparat zostaje, ale pracuje ciszej. Ludzie wracają do pracy, partia odzyskuje oddech."
 PRW_idea_ku_wiar:0 "Wiarygodność przede wszystkim"
 PRW_idea_ku_wiar_desc:0 "Każda zapowiedź w programie ma termin i odpowiedzialnego. Widzowie zaczynają wierzyć."
 PRW_idea_ku_final:0 "Narodowa telewizja"
 PRW_idea_ku_final_desc:0 "Lubelski program ogląda się w całej rozbitej Polsce. Kto ma zasięg, ten ma wpływy."
 PRW_idea_ma_final:0 "Naród zmobilizowany"
 PRW_idea_ma_final_desc:0 "Kluby, rocznice i Obrona Terytorialna. Region gotowy do wysiłku – przynajmniej na razie."
 PRW_idea_kt_wersja:0 "Cyber-Jarosław 0.9 (wersja z błędami)"
 PRW_idea_kt_wersja_desc:0 "System podejmuje część decyzji, opiekunowie resztę. Nikt nie wie, kto naprawdę rządzi."
 PRW_idea_region:0 "Od Bugu po Pilicę"
 PRW_idea_region_desc:0 "Lublin, Biała Podlaska, Radom i Piotrków pod jednym rządem. Nowe państwo jest większe – i trudniejsze do utrzymania w ryzach."
 PRW_ziobro:0 "Zbigniew Ziobro"
 PRW_kurski:0 "Jacek Kurski"
 PRW_macierewicz:0 "Antoni Macierewicz"
 PRW_kot:0 "Kot Prezesa"
 FKP_idea_dem:0 "Federacja regionów"
 FKP_idea_dem_desc:0 "Każda gmina ma głos w Konwencie, a budżet federacji jest jawny. Wolniej, ale razem – od Brdy po Drwęcę."
 FKP_idea_lew:0 "Rady federacyjne"
 FKP_idea_lew_desc:0 "Fabryki, gminy i komuny wysyłają delegatów do Rady Federacji. Decyzje zapadają na zjazdach, a nie w gabinetach."
 FKP_idea_aut:0 "Jedna władza nad Wisłą i Brdą"
 FKP_idea_aut_desc:0 "Jeden rząd, jedna armia i jedna komenda policji od Grudziądza po Inowrocław. Kto się sprzeciwia, przestaje się liczyć."
 FKP_panel:0 "Federacja Kujawsko-Pomorska"
 FKP_panel_desc:0 "Toruń albo Bydgoszcz może utworzyć państwo regionu – pod warunkiem, że posiada jego ziemie: Toruń, Bydgoszcz, Włocławek, Grudziądz, Inowrocław, Chełmno i co najmniej 30 regionów województwa. Forma zależy od ustroju.\nZaproszenie dostają wszystkie państwa z ziemiami w regionie kujawsko-pomorskim. Odmowa nie oznacza wojny."
 fkp.1.t:0 "Konwent Federacji Kujawsko-Pomorskiej"
 fkp.1.d:0 "Do ratusza przychodzi zaproszenie na Konwent federacyjny: wspólny parlament regionu, wspólny budżet i referendum w każdej gminie. Federacja obiecuje samorząd, a nie rządy z jednego miasta."
 fkp.1.a:0 "Wchodzimy. Niech zdecydują mieszkańcy – a oni chcą razem."
 fkp.1.b:0 "Zostajemy sami. Mamy własny samorząd."
 fkp.2.t:0 "Zjazd rad i komun"
 fkp.2.d:0 "Delegaci rad robotniczych i komun zapraszają nas na zjazd założycielski. Federacja ma należeć do tych, którzy w niej pracują – nie do burmistrzów i prezesów."
 fkp.2.a:0 "Wysyłamy delegatów. Razem jesteśmy silniejsi."
 fkp.2.b:0 "Nie nasza droga."
 fkp.3.t:0 "Proklamacja z Torunia i Bydgoszczy"
 fkp.3.d:0 "Przychodzi depesza: państwo kujawsko-pomorskie zostało proklamowane, a my mamy się podporządkować. Na razie to tylko słowa – ale za słowami stoi wojsko."
 fkp.3.a:0 "Podporządkowujemy się. Nie mamy wyboru."
 fkp.3.b:0 "Odmawiamy. Nie jesteśmy niczyją prowincją."
 fkp.10.t:0 "Federacja Kujawsko-Pomorska"
 fkp.10.d:0 "Toruń, Bydgoszcz, Włocławek, Grudziądz, Inowrocław i Chełmno są w jednych rękach. Pora ogłosić nowe państwo – od Brdy po Drwęcę. Gminy regionu, które jeszcze są osobno, dostają zaproszenie."
 fkp.10.a:0 "Ogłaszamy powstanie federacji."
 fkp.11.t:0 "Nowi członkowie federacji"
 fkp.11.d:0 "Kolejne gminy i miasta regionu dołączyły do federacji."
 fkp.11.a:0 "Witamy."
 fkp.20.t:0 "Nowe państwo nad Wisłą i Brdą"
 fkp.20.d:0 "Toruń i Bydgoszcz, od lat rywale, stały się częścią jednego państwa. Na mapie rozbitej Polski pojawił się region, który znowu jest całością."
 fkp.20.a:0 "Ciekawe, kto będzie następny."
 FKP_req_miasta:0 "Posiadamy: Toruń, Bydgoszcz, Włocławek, Grudziądz, Inowrocław, Chełmno"
 FKP_req_region:0 "Posiadamy co najmniej 30 regionów (stanów) w województwie kujawsko-pomorskim"
 WOS_tt_70:0 "Federacja powstaje od razu: nowa nazwa (zależna od ustroju), rdzenie w regionie i duch narodowy. Gminy regionu, które się zgodzą, zostaną przyłączone za 30 dni."
 FKP_dec_dem:0 "Konwent federacyjny"
 FKP_dec_dem_desc:0 "Ziemie regionu są nasze. Konwent ogłasza federację: wspólny parlament, wspólny budżet i referenda w gminach, które jeszcze są osobno."
 FKP_dec_lew:0 "Zjazd rad i komun"
 FKP_dec_lew_desc:0 "Ziemie regionu są nasze. Zjazd rad i komun ogłasza federację należącą do tych, którzy w niej pracują – i zaprasza pozostałe gminy."
 FKP_dec_aut:0 "Proklamacja państwa kujawsko-pomorskiego"
 FKP_dec_aut_desc:0 "Ziemie regionu są w naszych rękach. Proklamujemy jedno państwo, a pozostałe gminy dostają depeszę: podporządkować się. Odmowa nie oznacza wojny – na razie."
 FKP_dec_rozszerz:0 "Zaproszenie dla pozostałych"
 FKP_dec_rozszerz_desc:0 "Gminy, które odmówiły, mogą jeszcze dołączyć. Nowe zaproszenie – i za 30 dni przyłączenie tych, którzy się zgodzą."
 TRN_pt_zietarski:0 "Mirosław Ziętarski"
 TRN_pt_olimpijska_dyscyplina:0 "Olimpijska dyscyplina"
 TRN_pt_olimpijska_dyscyplina_desc:0 "§YMirosław Ziętarski§! – Mobilizacja i szkolenie. Trening jak przed regatami: krótko, codziennie, bez wymówek. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_kielpinski:0 "Jacek Kiełpiński"
 TRN_pt_konkretnie:0 "Kiełpiński Konkretnie"
 TRN_pt_konkretnie_desc:0 "§YJacek Kiełpiński§! – Media i informacje. Komunikaty bez lania wody – plotki nie mają się czego uczepić. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_szulejko:0 "Oliwier Szulejko"
 TRN_pt_mlody_dyplomata:0 "Młody dyplomata"
 TRN_pt_mlody_dyplomata_desc:0 "§YOliwier Szulejko§! – Dyplomacja. Jeździ do sąsiednich gmin z termosem i mapą – i wraca z porozumieniami. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_ulanowski:0 "Tymoteusz Ułanowski"
 TRN_pt_architekt_kompromisu:0 "Architekt kompromisu"
 TRN_pt_architekt_kompromisu_desc:0 "§YTymoteusz Ułanowski§! – Administracja i prawo. Pisze uchwały, które da się przegłosować także w czasie wojny. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_szymanski:0 "Bartosz Szymański"
 TRN_pt_torun_obywatelski:0 "Toruń obywatelski"
 TRN_pt_torun_obywatelski_desc:0 "§YBartosz Szymański§! – Reformy samorządowe. Rady dzielnic same pilnują porządku i same liczą zapasy. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_kozuchowska:0 "Małgorzata Kożuchowska"
 TRN_pt_twarz_odbudowy:0 "Twarz odbudowy"
 TRN_pt_twarz_odbudowy_desc:0 "§YMałgorzata Kożuchowska§! – Kultura i propaganda. Spoty o odbudowie miasta ogląda każdy, kto ma jeszcze prąd. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_pan_wojtek:0 "Pan Wojtek"
 TRN_pt_legenda_starowki:0 "Legenda Starówki"
 TRN_pt_legenda_starowki_desc:0 "§YPan Wojtek§! – Handel i gospodarka. Zna każdego kupca od Szerokiej po Rynek Nowomiejski. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_malkiewicz:0 "Łukasz „Małpa” Małkiewicz"
 TRN_pt_glos_ulic:0 "Głos toruńskich ulic"
 TRN_pt_glos_ulic_desc:0 "§YŁukasz „Małpa” Małkiewicz§! – Kultura i młodzież. Koncerty na podwórkach kończą się zapisami do straży. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_magical:0 "Daniel „Magical” Zwierzyński"
 TRN_pt_internetowa_popularnosc:0 "Internetowa popularność"
 TRN_pt_internetowa_popularnosc_desc:0 "§YDaniel „Magical” Zwierzyński§! – Propaganda internetowa. Ogromne zasięgi – i komentarze, nad którymi nikt nie panuje. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_mrkryha:0 "MrKryha"
 TRN_pt_robi_wrazenie:0 "Robi wrażenie!"
 TRN_pt_robi_wrazenie_desc:0 "§YMrKryha§! – Logistyka i zaopatrzenie. Każdy transport opisany, sprawdzony i dowieziony. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_zillmann:0 "Katarzyna Zillmann"
 TRN_pt_sila_solidarnosci:0 "Siła solidarności"
 TRN_pt_sila_solidarnosci_desc:0 "§YKatarzyna Zillmann§! – Mobilizacja społeczna – drużyna, która nie zostawia nikogo na brzegu. Doradca dostępny tylko dla przywódcy, który ukończył fokus „Nowe pokolenie Torunia”. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_maciejewski:0 "Hubert Maciejewski"
 TRN_pt_nowe_pokolenie_adm:0 "Nowe pokolenie administracji"
 TRN_pt_nowe_pokolenie_adm_desc:0 "§YHubert Maciejewski§! – Szybsze decyzje, mniej pieczątek, więcej podpisów pod czymś, co faktycznie działa. Doradca dostępny tylko dla przywódcy, który ukończył fokus „Nowe pokolenie Ratusza”. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_okoniewicz:0 "Wacław Okoniewicz"
 TRN_pt_straznik_tradycji:0 "Strażnik tradycji"
 TRN_pt_straznik_tradycji_desc:0 "§YWacław Okoniewicz§! – Obrona własnego miasta zaczyna się od pamięci o nim. Doradca dostępny tylko dla przywódcy, który ukończył fokus „Dziedzictwo starego miasta”. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_beyer:0 "Nadia Beyer"
 TRN_pt_obywatelska_mobilizacja:0 "Obywatelska mobilizacja"
 TRN_pt_obywatelska_mobilizacja_desc:0 "§YNadia Beyer§! – Sąsiedzi naprawiają to, na co urzędy nie mają czasu. Doradca dostępny tylko dla przywódcy, który ukończył fokus „Obywatelska mobilizacja”. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_batman:0 "Batman Stanisław"
 TRN_pt_dominikowski:0 "Krzysztof Dominikowski"
 TRN_pt_glos_osiedli:0 "Głos osiedli"
 TRN_pt_glos_osiedli_desc:0 "§YKrzysztof Dominikowski§! – Rady osiedlowe dostają budżet i odpowiadają za to, co przed blokiem. Doradca dostępny tylko dla przywódcy, który ukończył fokus „Władza dla osiedli”. Rola w alternatywnej historii moda – nie przedstawia poglądów ani życiorysu tej osoby."
 TRN_pt_miedzinski:0 "Adrian Miedziński"
 TRN_pt_weteran_motoareny:0 "Weteran Motoareny"
 TRN_pt_weteran_motoareny_desc:0 "Jednostki zmotoryzowane: szybki manewr i zgrane załogi. Premia działa na cały korpus (HOI4 nie ma prostego modyfikatora tylko dla jednostek zmotoryzowanych w cechach dowódców). Przydział wojskowy jest fikcyjnym elementem świata moda i nie przedstawia rzeczywistych doświadczeń wojskowych tej osoby."
 TRN_pt_linda:0 "Bogusław Linda"
 TRN_pt_twarda_reka:0 "Twarda ręka"
 TRN_pt_twarda_reka_desc:0 "Piechota: dyscyplina i organizacja w każdej sytuacji. Przydział wojskowy jest fikcyjnym elementem świata moda i nie przedstawia rzeczywistych doświadczeń wojskowych tej osoby."
 TRN_pt_mroczny_rycerz:0 "Mroczny Rycerz Torunia"
 TRN_pt_mroczny_rycerz_desc:0 "Obrona terenów miejskich: okopy w piwnicach, posterunki na dachach. Przydział wojskowy jest fikcyjnym elementem świata moda i nie przedstawia rzeczywistych doświadczeń wojskowych tej osoby."
 tpo.1.t:0 "Przystanie na Wiśle"
 tpo.1.d:0 "Od świtu przy przystaniach wioślarskich stoją kolejki. Łodzie, które jeszcze rok temu ścigały się na regatach, wożą dziś wodę i leki na Kępę Bazarową. Katarzyna Zillmann organizuje dyżury jak treningi: zmiany, rozgrzewka, odprawa.\n\nW Ratuszu pojawia się pytanie, czy ten ruch ma zostać przy pomocy mieszkańcom, czy dać ochotników Straży Obywatelskiej."
 tpo.1.a:0 "Przystanie zostają punktami pomocy."
 tpo.1.b:0 "Ochotnicy z przystani zasilą Straż."
 tpo.2.t:0 "Młodzi w Ratuszu"
 tpo.2.d:0 "Hubert Maciejewski przychodzi do Ratusza z laptopem zasilanym z akumulatora samochodowego. W tydzień zamienia trzy archiwa w jedną bazę danych. Starsi urzędnicy piszą skargę do prezydenta: „bez nas nikt nie znajdzie żadnej teczki”."
 tpo.2.a:0 "Nowe pokolenie przejmuje wydziały."
 tpo.2.b:0 "Każdy młody urzędnik dostaje mentora ze starej kadry."
 tpo.3.t:0 "Mury Starego Miasta"
 tpo.3.d:0 "Wacław Okoniewicz prowadzi radnych wzdłuż murów nad Wisłą. Krzywa Wieża, Brama Mostowa, Baszta Gołębnik – każdą zna z nazwy i z historii. Mówi krótko: kto przejdzie przez te mury, ten zdobędzie miasto. Archiwum miejskie już zjeżdża do piwnic."
 tpo.3.a:0 "Wzmocnić bramy i baszty."
 tpo.3.b:0 "Ratować archiwa i zabytki."
 tpo.4.t:0 "Komitety mieszkańców"
 tpo.4.d:0 "Na Bielanach mieszkańcy sami wyłatali drogę do szpitala. Na Mokrem naprawili przepust, zanim woda zalała piwnice. Nadia Beyer zbiera komitety w jedną sieć i prosi rząd o materiały – resztę zrobią sami."
 tpo.4.a:0 "Rząd dostarcza materiały."
 tpo.4.b:0 "Komitety działają same – rząd tylko nie przeszkadza."
 tpo.5.t:0 "Człowiek w masce"
 tpo.5.d:0 "Na Rubinkowie od tygodni nikt nie okradł apteki. Mieszkańcy mówią o straży, którą prowadzi „Batman Stanisław” – człowiek w pelerynie, który zna każdą klatkę schodową na osiedlu. Na zgromadzeniu dzielnicy pada pytanie, czy straże mogą mieć dowódcę, którego twarzy nikt nie widział."
 tpo.5.a:0 "Zgromadzenie powierza mu obronę dzielnic."
 tpo.5.b:0 "Dowodzi, ale odpowiada przed zgromadzeniem."
 tpo.6.t:0 "Rady osiedlowe w Ratuszu"
 tpo.6.d:0 "Krzysztof Dominikowski przychodzi na posiedzenie Dyrektoriatu z segregatorem pełnym uchwał rad osiedlowych. Chcą jednego: pieniędzy na drogi, oświetlenie i ciepło – i prawa, żeby decydować, na co je wydać. Urzędnicy Zaleskiego patrzą na plany metropolii i liczą."
 tpo.6.a:0 "Osiedla dostają własny budżet."
 tpo.6.b:0 "Rady doradzają, decyduje Dyrektoriat."
 tr2u.1.t:0 "Gulewski: jaki ustrój?"
 tr2u.1.d:0 "Państwo stoi, ale wciąż nie wiadomo, kto w nim decyduje. Rady dzielnic chcą prawa weta, komendanci obrony – wspólnego rządu miast, który zdąży zareagować na atak.\n\nWybór ustala konstytucję, panele decyzji rządu i zasób, z którego rząd je finansuje. Nie da się go później zmienić."
 tr2u.1.a:0 "Rzeczpospolita Samorządów."
 tr2u.1.b:0 "Konfederacja Obronnych Miast."
 TR2U_tt_gul:0 "Wybór ustroju: §YRzeczpospolita Samorządów§! albo §YKonfederacja Obronnych Miast§! – konstytucja, panele decyzji rządu i zasób na ich finansowanie."
 tr2u.2.t:0 "Zaleski: jaki ustrój?"
 tr2u.2.d:0 "Gospodarz ma państwo. Teraz musi zdecydować, czy będzie nim rządził jak wielką inwestycją – projekt po projekcie – czy jak aparatem, w którym każda decyzja zapada w gabinecie prezydenta.\n\nWybór ustala konstytucję, panele decyzji rządu i zasób, z którego rząd je finansuje. Nie da się go później zmienić."
 tr2u.2.a:0 "Dyrektoriat Rozwoju Torunia."
 tr2u.2.b:0 "Zjednoczona Metropolia Toruńska."
 TR2U_tt_zal:0 "Wybór ustroju: §YDyrektoriat Rozwoju Torunia§! albo §YZjednoczona Metropolia Toruńska§! – konstytucja, panele decyzji rządu i zasób na ich finansowanie."
 tr2u.3.t:0 "Romanowski: jaki ustrój?"
 tr2u.3.d:0 "Socjalna republika obiecała mieszkania, pracę i transport. Można oprzeć państwo na usługach publicznych finansowanych z budżetu albo oddać władzę gminom i młodym samorządowcom.\n\nWybór ustala konstytucję, panele decyzji rządu i zasób, z którego rząd je finansuje. Nie da się go później zmienić."
 tr2u.3.a:0 "Socjalna Republika Toruńska."
 tr2u.3.b:0 "Federacja Równych Gmin."
 TR2U_tt_rom:0 "Wybór ustroju: §YSocjalna Republika Toruńska§! albo §YFederacja Równych Gmin§! – konstytucja, panele decyzji rządu i zasób na ich finansowanie."
 tr2u.4.t:0 "Kowalczyk: jaki ustrój?"
 tr2u.4.d:0 "Republika ma uniwersytet, ludzi i ambicje. Można zbudować państwo wokół nauki i otwartych danych albo wokół współpracy z Niemcami i Europą.\n\nWybór ustala konstytucję, panele decyzji rządu i zasób, z którego rząd je finansuje. Nie da się go później zmienić."
 tr2u.4.a:0 "Republika Akademicka Torunia."
 tr2u.4.b:0 "Nadwiślańska Wspólnota Europejska."
 TR2U_tt_kow:0 "Wybór ustroju: §YRepublika Akademicka Torunia§! albo §YNadwiślańska Wspólnota Europejska§! – konstytucja, panele decyzji rządu i zasób na ich finansowanie."
 tr2u.5.t:0 "Krevienko: jaki ustrój?"
 tr2u.5.d:0 "Delegaci komun spotkali się w Toruniu. Jedni chcą zgromadzeń bez ratusza, drudzy – żeby zakłady pracy przejęły gospodarkę całego regionu.\n\nWybór ustala konstytucję, panele decyzji rządu i zasób, z którego rząd je finansuje. Nie da się go później zmienić."
 tr2u.5.a:0 "Federacja Wolnych Dzielnic."
 tr2u.5.b:0 "Związek Kolektywów Kujawskich."
 TR2U_tt_kre:0 "Wybór ustroju: §YFederacja Wolnych Dzielnic§! albo §YZwiązek Kolektywów Kujawskich§! – konstytucja, panele decyzji rządu i zasób na ich finansowanie."
 tr2u.6.t:0 "Ruch Elany: jaki ustrój?"
 tr2u.6.d:0 "Ruch ma państwo. Oficerowie chcą komendantury, która trzyma porządek, działacze z trybun – nieustającej mobilizacji i ekspansji.\n\nWybór ustala konstytucję, panele decyzji rządu i zasób, z którego rząd je finansuje. Nie da się go później zmienić."
 tr2u.6.a:0 "Komendantura Toruńska."
 tr2u.6.b:0 "Narodowe Państwo Toruńskie."
 TR2U_tt_ela:0 "Wybór ustroju: §YKomendantura Toruńska§! albo §YNarodowe Państwo Toruńskie§! – konstytucja, panele decyzji rządu i zasób na ich finansowanie."
 tr2u.11.t:0 "Gulewski: co dalej z państwem?"
 tr2u.11.d:0 "Drzewko przywódcy jest zakończone. Toruń może iść własną drogą, zaproponować dobrowolną unię państwu Bydgoszcz albo zbudować obronny pakt z sąsiadami. Druga strona zawsze może odmówić."
 tr2u.11.a:0 "Własna droga."
 tr2u.11.b:0 "Propozycja unii: Bydgoszcz."
 tr2u.11.c:0 "Pakt obronny z sąsiadami."
 TR2U_tt_koniec_gul:0 "Wybór zakończenia: własna droga, dobrowolna unia z: Bydgoszcz albo pakt obronny z sąsiadami."
