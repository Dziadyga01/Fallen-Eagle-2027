 tza.140.t:0 "Republika Akademicka zaprasza: Podgórz wraca do miasta"
 tza.140.d:0 "Uniwersytet, szkoły i wspólne granty – Toruń zaprasza gminę do republiki, która stawia na naukę i współpracę z Europą. Lewobrzeżna dzielnica ogłosiła niezależność w pierwszych dniach chaosu. Most łączy oba brzegi Wisły – czas połączyć też urzędy."
 tza.140.a:0 "Przyjmujemy zaproszenie."
 tza.140.b:0 "To nie dla nas."
