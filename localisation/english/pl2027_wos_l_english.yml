 ROS_p_szl_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_naw_ak2_majatki:0 "Majątki urzędników jawne"
 ROS_p_naw_ak2_majatki_desc:0 "Każdy urzędnik musi pokazać, co ma – i skąd to ma."
 ROS_p_naw_ak2_sledztwa:0 "Śledztwa w sprawie pałaców"
 ROS_p_naw_ak2_sledztwa_desc:0 "Śledczy wchodzą do pałaców, jachtów i winnic byłych dygnitarzy."
 ROS_p_naw_ak2_zwrot:0 "Zwrot ukradzionych miliardów"
 ROS_p_naw_ak2_zwrot_desc:0 "Pieniądze z zagranicznych kont wracają do budżetu."
 ROS_p_naw_ak2_policja:0 "Nowa policja"
 ROS_p_naw_ak2_policja_desc:0 "Policja zaczyna od zera – z nowym naborem i nowymi zasadami."
 ROS_p_naw_ak2_final:0 "Państwo bez łapówek"
