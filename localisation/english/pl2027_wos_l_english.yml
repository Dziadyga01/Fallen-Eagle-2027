l_english:
 WOS_dm_SMR:0 "Straż Marszałkowska: Legitymacja Sejmu"
 WOS_m_nazwa_SMR:0 "Legitymacja Sejmu"
 WOS_m_opis_SMR:0 "Czy Polacy wciąż uważają, że prawo stanowi się na Wiejskiej. Rośnie, gdy Sejm obraduje i kontroluje gmach, spada w czasie bratobójczych wojen."
 WOS_dm_KPR:0 "Kancelaria Prezydenta: Autorytet Prezydenta"
 WOS_m_nazwa_KPR:0 "Autorytet Prezydenta"
 WOS_m_opis_KPR:0 "Siła dekretów i lojalność SOP. Sama rośnie z każdym miesiącem centralizacji – powyżej 70 zaczyna jednak budzić opór i obniża stabilność."
 WOS_dm_MPR:0 "Mafia Pruszkowska: Sieć wpływów"
 WOS_m_nazwa_MPR:0 "Sieć wpływów"
 WOS_m_opis_MPR:0 "Koperty, kantory, myjnie, ludzie w urzędach. Im szersza sieć, tym więcej władzy i towaru z czarnego rynku – i tym bardziej boją się jej inni."
 WOS_dm_LEG:0 "Kibice Legii: Jedność trybun"
 WOS_m_nazwa_LEG:0 "Jedność trybun"
 WOS_m_opis_LEG:0 "Żyleta śpiewa jednym głosem tylko wtedy, gdy ma wspólnego wroga i swój stadion. W czasie pokoju grupy zaczynają się kłócić o pieniądze i przywództwo."
 WOS_dm_PLC:0 "Policja: Porządek publiczny"
 WOS_m_nazwa_PLC:0 "Porządek publiczny"
 WOS_m_opis_PLC:0 "Paliwo w radiowozach, amunicja w magazynach i ludzie, którzy przychodzą na służbę. Korupcja i wpływy Pruszkowa zjadają go od środka."
 WOS_dm_WOJ:0 "Wojsko: Łańcuch dowodzenia"
 WOS_m_nazwa_WOJ:0 "Łańcuch dowodzenia"
 WOS_m_opis_WOJ:0 "Czy rozkaz z góry dociera do kompanii i czy ktoś go wykona. Spada, gdy zwierzchnik toczy wojnę z innymi organami państwa."
 WOS_dm_PRG:0 "Praga: Autonomia prawego brzegu"
 WOS_m_nazwa_PRG:0 "Autonomia prawego brzegu"
 WOS_m_opis_PRG:0 "Rady mieszkańców, straże sąsiedzkie i mosty. Rośnie, gdy Praga trzyma oba przyczółki, spada w czasie wojny."
 WOS_dm_ZIE:0 "Zieloni z Bielan: Samowystarczalność"
 WOS_m_nazwa_ZIE:0 "Samowystarczalność"
 WOS_m_opis_ZIE:0 "Kooperatywy, ogrody działkowe, piece na drewno i własna sieć wymiany. Rośnie powoli w czasie pokoju, spada, gdy w mieście nie ma prądu."
 WOS_dm_TEC:0 "Tęczowa Republika: Poparcie społeczne"
 WOS_m_nazwa_TEC:0 "Poparcie społeczne"
 WOS_m_opis_TEC:0 "Rady obywatelskie działają tylko wtedy, gdy ludzie przychodzą na zebrania. Rośnie razem z nastrojami w mieście, spada w czasie wojny."
 wos.1.t:0 "Strzały na Moście Poniatowskiego"
 wos.1.d:0 "O trzeciej w nocy ktoś otworzył ogień z rotundy przy Rondzie Waszyngtona w stronę posterunku na wiadukcie. Nikt nie przyznaje się do pierwszego strzału, ale obie strony mostu twierdzą, że to „prowokacja”. Rano most stoi pusty, a ludzie z Pragi, którzy pracują w Śródmieściu, patrzą na niego z drugiego brzegu."
 wos.1.a:0 "Zamknąć most. Nikt nie przejdzie bez przepustki."
 wos.1.b:0 "Wspólny patrol z drugim brzegiem."
 wos.1.c:0 "Wysłać na most negocjatora z białą flagą i termosem."
 wos.2.t:0 "Noc bez prądu"
 wos.2.d:0 "O 19:42 zgasło całe lewobrzeżne Śródmieście, kwadrans później Praga. Elektrociepłownie dostają coraz mniej węgla, a każda frakcja ma własną listę „priorytetowych odbiorców”. W szpitalach pracują agregaty, w blokach – świeczki i radia na baterie."
 wos.2.a:0 "Racjonować prąd: dzielnice dostają go na zmianę."
 wos.2.b:0 "Agregaty do szpitali i kuchni polowych."
 wos.2.c:0 "To wina rywali – powiedzieć to w radiu."
 wos.3.t:0 "Ostatnia transmisja z Wiejskiej"
 wos.3.d:0 "Kamera w sali plenarnej działa na akumulatorach, a sygnał nadaje jeden przekaźnik na dachu hotelu sejmowego. Na sali jest mniej posłów niż ochroniarzy. Prowadzący obrady zastanawia się, czy to jeszcze posiedzenie, czy już tylko pamiątka po państwie."
 wos.3.a:0 "Obradujemy dalej. Dopóki trwa posiedzenie, trwa Rzeczpospolita."
 wos.3.b:0 "Powołać nadzwyczajne prezydium z pełnią władzy."
 wos.4.t:0 "Pruszków proponuje układ"
 wos.4.d:0 "Do kancelarii przychodzi elegancki pan z teczką. Nie przedstawia się. Proponuje „wzajemne zrozumienie”: Rodzina nie wchodzi w nasze dzielnice, my nie zaglądamy do magazynów w Ursusie. Na stole zostawia kopertę – „na koszty administracyjne”."
 wos.4.a:0 "Przyjąć. W mieście jest wojna, a pieniądze są pieniędzmi."
 wos.4.b:0 "Odesłać kopertę i spisać numer rejestracyjny auta."
 wos.5.t:0 "Żyleta wychodzi na ulice"
 wos.5.d:0 "Po meczu, którego nikt nie rozegrał, kilka tysięcy ludzi idzie Łazienkowską w stronę centrum. Racowisko widać z Pałacu Kultury. Grupy z Mokotowa i Ursynowa chcą pokazać, że to one, a nie Pruszków, rządzą stadionem."
 wos.5.a:0 "Trybuny są nasze. Pokażmy to Pruszkowowi."
 wos.5.b:0 "Rozejść się, zanim przyjedzie „kierownictwo”."
 wos.6.t:0 "Barykady na Pradze"
 wos.6.d:0 "Na Ząbkowskiej i Targowej w jedną noc wyrastają barykady z tramwajowych wagonów, kostki brukowej i lodówek. Babcie z kamienicy przy Brzeskiej robią kanapki dla straży, a na murach pojawia się napis: „Prawy brzeg nie klęka”."
 wos.6.a:0 "Bronić każdej bramy."
 wos.6.b:0 "Wysłać delegację na drugi brzeg."
 wos.7.t:0 "Kryzys w Pałacu"
 wos.7.d:0 "Dekret za dekretem, a w korytarzach Pałacu coraz więcej szeptów. Dwóch dowódców zmian SOP odmówiło podpisania nowego regulaminu, a szef Kancelarii proponuje „okres uspokojenia”. Centralizacja daje władzę, ale ludzie wokół zaczynają się bać."
 wos.7.a:0 "Czystka w SOP. Lojalność albo dymisja."
 wos.7.b:0 "Okres uspokojenia: część dekretów zawieszona."
 wos.8.t:0 "Policja odmawia wykonania rozkazu"
 wos.8.d:0 "Rozkaz był jasny: oczyścić przejście przy Placu Bankowym. Kompania z Woli nie wyjechała z komendy. Dowódca mówi, że nie będzie strzelał do ludzi, którzy stoją w kolejce po chleb. Telefon z góry dzwoni od rana."
 wos.8.a:0 "Wykonać rozkaz. Bez dyscypliny nie ma policji."
 wos.8.b:0 "Kto pilnuje tych, którzy pilnują miasta? My sami."
 wos.9.t:0 "Wojsko ogłasza neutralność"
 wos.9.d:0 "Z Rembertowa przychodzi depesza: „Siły Zbrojne nie będą uczestniczyć w sporze między organami Rzeczypospolitej”. Dowódcy brygad nie chcą wybierać między Prezydentem a Sejmem. Kancelaria nazywa to dezercją, Wiejska – przyzwoitością."
 wos.9.a:0 "Neutralność. Wojsko nie strzela do państwa."
 wos.9.b:0 "Rozkaz jest rozkazem. Wykonujemy polecenia zwierzchnika."
 wos.10.t:0 "Warszawa głosuje nad przyszłością"
 wos.10.d:0 "W szkołach, parafiach i domach kultury stoją urny z kartonu. Pytanie jest jedno: czy miasto ma mieć jedną władzę. Komisje liczą głosy przy latarkach, a każda frakcja ma własnych mężów zaufania przy każdym stoliku."
 wos.10.a:0 "Uszanujemy wynik, jakikolwiek będzie."
 wos.10.b:0 "Wynik ogłosimy, gdy będzie „właściwy”."
 wos.11.t:0 "Kto kontroluje metro, kontroluje ruch przez miasto"
 wos.11.d:0 "Pod Świętokrzyską stoi skład, którym da się przewieźć batalion z Woli na Pragę w dwadzieścia minut, pod ziemią i bez strzału. Stacja Centrum jest teraz w naszych rękach. Inżynierowie z Kabat pytają, kogo mają wozić."
 wos.11.a:0 "Metro dla naszych oddziałów."
 wos.11.b:0 "Metro dla mieszkańców – niech miasto widzi, kto dba o ludzi."
 wos.12.t:0 "Zamknięcie przepraw przez Wisłę"
 wos.12.d:0 "Mamy w rękach większość mostów. Wystarczy jeden rozkaz, żeby drugi brzeg został bez dostaw z zachodu – albo żeby każda ciężarówka płaciła myto przy szlabanie. Sztab czeka na decyzję."
 wos.12.a:0 "Zamknąć mosty. Drugi brzeg musi zrozumieć, kto tu rządzi."
 wos.12.b:0 "Myto przy szlabanach."
 wos.12.c:0 "Mosty zostają otwarte – to dowód, że jesteśmy odpowiedzialni."
 wos.20.t:0 "Koalicja: kto obejmie władzę?"
 wos.20.d:0 "Pierwsze wspólne posiedzenie w Belwederze trwa do rana. Sejm chce rządu parlamentarnego, Pałac – silnej egzekutywy. Przy kawie z termosu pada pytanie, którego wszyscy unikali: kto będzie podpisywał dokumenty „w imieniu Rzeczypospolitej”?"
 wos.20.a:0 "Władza Sejmu, Prezydent jako gwarant."
 wos.20.b:0 "Władza Prezydenta, Sejm jako kontrola."
 wos.20.c:0 "Rada Jedności: rotacyjne przewodnictwo co pół roku."
 wos.21.t:0 "Koalicja: kto dowodzi wojskiem?"
 wos.21.d:0 "Generałowie z Rembertowa i komendanci policji czekają na korytarzu. Wspólny sztab antymafijny działa, ale każdy rozkaz idzie dwoma kanałami. Trzeba zdecydować, czyj podpis wystarcza, by batalion wyjechał z koszar."
 wos.21.a:0 "Wspólny sztab – rozkazy podpisują obie strony."
 wos.21.b:0 "Wojsko podlega temu, kto je wystawił."
 wos.22.t:0 "Koalicja: jak dzielimy budżet?"
 wos.22.d:0 "Skarbiec koalicji to kilka kont w bankach, które jeszcze działają, i hangar pełen zarekwirowanych dóbr z hurtowni Pruszkowa. Każda strona ma listę potrzeb dłuższą niż lista możliwości."
 wos.22.a:0 "Po połowie. Uczciwie, nawet jeśli nieefektywnie."
 wos.22.b:0 "Według potrzeb frontu – kto walczy, ten dostaje."
 wos.23.t:0 "Koalicja: co z dzielnicami i partnerami?"
 wos.23.d:0 "Praga, Bielany i Powiśle patrzą na koalicję z nieufnością, a Policja i Wojsko pytają, czy po zwycięstwie dalej będą osobnymi siłami. Od tej odpowiedzi zależy, jak będzie wyglądała zjednoczona Warszawa."
 wos.23.a:0 "Dzielnice zachowają autonomię, partnerzy – niezależność."
 wos.23.b:0 "Jedno miasto, jedna władza. Autonomie po wojnie."
 wos.24.t:0 "Zdrada w koalicji?"
 wos.24.d:0 "Na biurko trafia teczka: partner prowadzi „rozmowy rozpoznawcze” z Pruszkowem, a jego ludzie wynoszą dokumenty ze wspólnego sztabu. Zaufanie w koalicji jest na dnie. Możemy jeszcze wszystko uratować – albo odejść pierwsi."
 wos.24.a:0 "Odchodzimy z koalicji, zanim nas sprzedadzą."
 wos.24.b:0 "Ratować koalicję: wspólna komisja i wymiana sztabowców."
 wos.30.t:0 "Liga: wspólna straż dzielnic?"
 wos.30.d:0 "Delegaci Pragi, Bielan i Powiśla spotykają się w bibliotece na Żoliborzu – na neutralnym gruncie. Każda dzielnica ma własne straże, własnych dowódców i własne zwyczaje. Czy Liga ma mieć jedną straż?"
 wos.30.a:0 "Jedna straż, rotacyjny komendant."
 wos.30.b:0 "Każda dzielnica broni się sama, pomagamy sobie na wezwanie."
 wos.31.t:0 "Liga: wspólna kasa?"
 wos.31.d:0 "Bielany mają kooperatywy i warzywa, Powiśle – drukarnie i lekarzy, Praga – rynek na Bazarze Różyckiego. Wymiana działa, ale ktoś musi płacić za wspólne radio i amunicję dla straży."
 wos.31.a:0 "Wspólna kasa Ligi."
 wos.31.b:0 "Wymiana barterowa, bez wspólnych pieniędzy."
 wos.32.t:0 "Liga: na jakich warunkach zjednoczenie?"
 wos.32.d:0 "Ktoś w końcu mówi głośno to, o czym myślą wszyscy: Liga nie przetrwa wiecznie między Sejmem, Pałacem i Pruszkowem. Albo dzielnice stworzą coś więcej niż sojusz, albo prędzej czy później ktoś je wchłonie."
 wos.32.a:0 "Federacja Wolnych Dzielnic: wspólny statut, osobne rady."
 wos.32.b:0 "Liga pozostaje sojuszem obronnym."
 wos.33.t:0 "Spór w Lidze"
 wos.33.d:0 "Kłótnia o ostatnią dostawę amunicji przerodziła się w wymianę obelg w radiu. Jedna z dzielnic oskarża pozostałe, że „zostawiły ją samą”. Delegaci przestali przychodzić na posiedzenia."
 wos.33.a:0 "Odchodzimy z Ligi. Sami poradzimy sobie lepiej."
 wos.33.b:0 "Zostajemy. Bez siebie nie przetrwamy."
 WOS_most_zamkniety:0 "Most zamknięty"
 WOS_most_zamkniety_desc:0 "Szlabany, worki z piaskiem i przepustki. Drugi brzeg jest blisko, ale nikt tam nie przejdzie bez naszej zgody."
 WOS_racjonowanie:0 "Racjonowanie prądu"
 WOS_racjonowanie_desc:0 "Dzielnice dostają prąd na zmianę, według grafiku wywieszonego na drzwiach klatek schodowych."
 WOS_czystka_sop:0 "Czystka w SOP"
 WOS_czystka_sop_desc:0 "Nowi ludzie na starych stanowiskach. Lojalni, ale jeszcze nie wiedzą, gdzie są klucze."
 WOS_barykady_pragi:0 "Barykady na Pradze"
 WOS_barykady_pragi_desc:0 "Każda brama to punkt oporu, a każda babcia na oknie – obserwator."
 WOS_metro_wojskowe:0 "Metro dla wojska"
 WOS_metro_wojskowe_desc:0 "Składy jeżdżą bez rozkładu i bez pasażerów. Oddziały przemieszczają się pod miastem."
 WOS_bunt_podwladnego:0 "Nieposłuszny podwładny"
 WOS_dialog:0 "Dialog w stolicy"
 WOS_panel:0 "Warszawa: walka o stolicę"
 WOS_panel_desc:0 "Zasilanie miasta: §Y[?global.WOS_prad|0]§!/100 · Zaopatrzenie: §Y[?global.WOS_zaopatrzenie|0]§!/100 · Nastroje mieszkańców: §Y[?global.WOS_nastroje|0]§!/100\nWpływy: Sejm §Y[?global.TFE_wwa_smr|0]§! · Pałac §Y[?global.TFE_wwa_kpr|0]§! · Pruszków §Y[?global.TFE_wwa_mpr|0]§!\nZaufanie w Koalicji przeciw Przestępczości: §Y[?global.WOS_zaufanie_k|0]§! · w Lidze Wolnych Dzielnic: §Y[?global.WOS_zaufanie_l|0]§!\n\n§Y[WOS_Get_mechanika]§!: §Y[?WOS_m|0]§!/100\n[WOS_Get_mechanika_opis]\n[WOS_Get_mechanika_cel]\n\n§YJak działa miasto§!\n§YZasilanie§! spada o 1 co miesiąc. Elektrociepłownie na Białołęce i Mokotowie w spokojnych rękach dają po +1, walki w mieście −3. Poniżej §R30§! – „Noc bez prądu”, poniżej 35 psują się nastroje, powyżej 50 rośnie zaopatrzenie.\n§YZaopatrzenie§! spada o 2 co miesiąc. Spokojny Ożarów daje +2, Pruszków w rękach mafii +1. Poniżej §R30§! nastroje spadają o 2 co miesiąc.\n§YNastroje§! rosną przy zasilaniu i zaopatrzeniu powyżej 55. Od nich zależą wskaźniki Sejmu, Pałacu i Tęczowej Republiki.\n§YZaufanie§! poniżej §R25§! grozi zdradą w Koalicji albo sporem w Lidze."
 WOS_m_cel_SMR:0 "Cel: §Gpowyżej 50§! – każdy punkt ponad 50 daje stabilność i władzę. Rośnie, gdy Sejm jest w twoich rękach i nie walczysz z Pałacem, w koalicji i przy nastrojach >55. Spada w wojnie (−2/mies.) i przy wpływach Sejmu <25. Poniżej §R25§! – „Ostatnia transmisja z Wiejskiej”."
 WOS_m_cel_KPR:0 "Cel: §Gmiędzy 40 a 70§!. Rośnie sam o 1 co miesiąc. Spada w wojnie z Sejmem, przy nastrojach <35 i bez Belwederu i Śródmieścia. Powyżej §R70§! obniża stabilność, powyżej §R80§! – „Kryzys w Pałacu”."
 WOS_m_cel_MPR:0 "Cel: §Gjak najwyżej§! – władza, tańsze dobra i szybsza budowa. Rośnie z Pruszkowem przy wpływach >40 i gdy w mieście brakuje towaru (zaopatrzenie <40). Spada, gdy działa Koalicja przeciw Przestępczości (−1) i w wojnie z jej przywódcą (−2)."
 WOS_m_cel_LEG:0 "Cel: §Gpowyżej 50§! – organizacja i pobór. W pokoju spada o 1 co miesiąc, bez stadionu o kolejne 2. Wojna i stadion podnoszą. Powyżej 60 ze stadionem – „Żyleta wychodzi na ulice”."
 WOS_m_cel_PLC:0 "Cel: §Gpowyżej 50§! – stabilność i obrona. Spada o 1 co miesiąc. Rośnie przy zaopatrzeniu >50 i pod silnym Sejmem. Wpływy Pruszkowa >60 to −2 co miesiąc. Poniżej §R35§! jako podwładny – „Policja odmawia wykonania rozkazu”."
 WOS_m_cel_WOJ:0 "Cel: §Gpowyżej 50§! – organizacja i planowanie. Rośnie w pokoju i z Rembertowem. Spada, gdy zwierzchnik walczy z Sejmem, i w wojnie przy zaopatrzeniu <30."
 WOS_m_cel_PRG:0 "Cel: §Gpowyżej 40§! – obrona. Rośnie, gdy trzymasz Pragę-Północ i Pragę-Południe, oraz w Lidze. Spada w wojnie (−2) i gdy jesteś podwładnym."
 WOS_m_cel_ZIE:0 "Cel: §Gpowyżej 30§! – tańsze dobra i szybsza budowa. Rośnie w pokoju i w Lidze. Spada w wojnie i gdy zasilanie spada poniżej 30 (−2)."
 WOS_m_cel_TEC:0 "Cel: §Gpowyżej 50§!. Rośnie przy nastrojach >50 i w Lidze. Spada przy nastrojach <35 i w wojnie (−2)."
 WOS_dec_siec:0 "Naprawa sieci ciepłowniczej"
 WOS_dec_siec_desc:0 "Ekipy z MPWiK i Veolii pracują pod ochroną naszych ludzi. Jeśli trzymamy elektrociepłownię albo magistralę, miasto odzyska trochę ciepła."
 WOS_dec_bronisze:0 "Konwój z Bronisz"
 WOS_dec_bronisze_desc:0 "Ciężarówki z rynku hurtowego jadą przez Ożarów, jeśli tylko ktoś zapłaci za paliwo i ochronę."
 WOS_dec_kuchnie:0 "Kuchnie polowe dla mieszkańców"
 WOS_dec_kuchnie_desc:0 "Grochówka na Placu Defilad, zupa w szkołach na Woli. Ludzie zapamiętają, kto ich nakarmił."
 WOS_wezel_grodzisk:0 "Węzeł grodziski"
 WOS_wezel_grodzisk_desc:0 "Pociągi z zachodu zatrzymują się w Grodzisku, a hurtownie przy torach znów mają towar."
 WOS_poludniowe_podejscia:0 "Południowe podejścia"
 WOS_poludniowe_podejscia_desc:0 "Piaseczno trzyma drogi z południa: Puławską, siódemkę i lasy chojnowskie."
 wos.50.t:0 "Propozycja związku miast"
 wos.50.d:0 "Z drugiej strony rogatki przyjechała delegacja: [From.GetNameDef] proponuje związek miast zamiast wojny. My zachowamy samorząd i własnych ludzi w urzędach, oni dostaną dostęp do naszych dróg, magazynów i rąk do pracy. Na stole leży projekt umowy – i mapa, na której nasza gmina jest już zaznaczona ich kolorem."
 wos.50.a:0 "Przyjmujemy. Lepszy związek niż wojna."
 wos.50.b:0 "Odmawiamy. Gmina nie jest na sprzedaż."
 wos.51.t:0 "Statut dzielnicy"
 wos.51.d:0 "Przychodzi propozycja z drugiej strony barykady: [From.GetNameDef] gwarantuje dzielnicy własną radę, własną straż i prawo weta w sprawach lokalnych – w zamian za uznanie zwierzchnictwa i wspólną obronę miasta. To nie ultimatum. To pierwsza propozycja, w której ktoś pyta nas o zdanie."
 wos.51.a:0 "Podpisujemy statut. Autonomia w zjednoczonym mieście."
 wos.51.b:0 "Wolność nie jest przedmiotem negocjacji."
 wos.52.t:0 "Odmowa"
 wos.52.d:0 "[From.GetNameDef] odrzuca naszą propozycję. Delegacja wraca z pustymi rękami, a po drugiej stronie rogatki już ustawiają worki z piaskiem."
 wos.52.a:0 "Szkoda. Spróbujemy inaczej."
 ivr.1.t:0 "Wezwanie do rozwiązania"
 ivr.1.d:0 "Kurier przynosi pismo z pieczęcią IV Rzeczypospolitej: wszystkie zbrojne formacje w stolicy mają złożyć broń i wejść w struktury nowego państwa. Oficerowie i radni dostaną stanowiska, a ludzie – amnestię. Kto odmówi, zostanie uznany za rebelianta."
 ivr.1.a:0 "Przyjąć. Wojna o stolicę się skończyła."
 ivr.1.b:0 "Odmówić. Nie uznajemy tej „Rzeczypospolitej”."
 ivr.2.t:0 "Wojna o zjednoczenie"
 ivr.2.d:0 "Rozmowy z sąsiadem utknęły. Sztab przedstawia plan kampanii przeciwko jednemu państwu – temu, które najdłużej odrzuca zjednoczenie. Reszta sąsiadów patrzy, czy IV Rzeczpospolita dotrzyma słowa, że nie zaatakuje nikogo, kto rozmawia."
 ivr.2.a:0 "Wydać rozkaz."
 WOS_idea_smr_pakiet:0 "Pakiet ocalenia stolicy"
 WOS_idea_smr_pakiet_desc:0 "Trzy ustawy, jedno głosowanie i podpisy, które znów coś znaczą. Urzędnicy wiedzą, na jakiej podstawie działają."
 WOS_idea_smr_twarda_reka:0 "Państwo wraca na ulice"
 WOS_idea_smr_twarda_reka_desc:0 "Straż Marszałkowska patroluje Śródmieście, a w gazetach drukowane są listy gończe. Ludzie znowu dzwonią po pomoc do państwa."
 WOS_idea_smr_demokracja:0 "Odrodzona Rzeczpospolita"
 WOS_idea_smr_demokracja_desc:0 "Sejm przetrwał najgorszą zimę w swojej historii. Każda ustawa jest dziś dowodem, że państwo prawa da się odbudować."
 WOS_idea_smr_prezydium:0 "Nadzwyczajne Prezydium"
 WOS_idea_smr_prezydium_desc:0 "Kilkoro ludzi w sali kolumnowej decyduje za czterystu sześćdziesięciu. Szybko, skutecznie – i bez pytania kogokolwiek o zgodę."
 wos.101.t:0 "Ostatnie posiedzenie Sejmu"
 wos.101.d:0 "Sala plenarna oświetlona latarkami czołowymi. Na galerii siedzą ludzie z Mokotowa, Woli i Powiśla, którzy przeszli przez trzy posterunki, żeby to zobaczyć. Marszałek odczytuje porządek obrad: jeden punkt – „przyszłość Rzeczypospolitej”. Za drzwiami czekają oficerowie z gotowym projektem uchwały o nadzwyczajnym Prezydium."
 wos.101.a:0 "Głosujemy. Rzeczpospolita jest tam, gdzie obraduje Sejm."
 wos.101.b:0 "Przekazać władzę nadzwyczajnemu Prezydium."
 WOS_tt_1:0 "Odblokowuje decyzję „Jedność stolicy” (panel wpływów w Warszawie)."
 WOS_req_m_min_45:0 "Wskaźnik frakcji (panel „Warszawa: walka o stolicę”) co najmniej 45"
 WOS_req_m_min_40:0 "Wskaźnik frakcji (panel „Warszawa: walka o stolicę”) co najmniej 40"
 WOS_tt_2:0 "Dzielnica dostaje propozycję statutu. Zgoda: staje się naszym podmiotem z autonomią."
 WOS_tt_3:0 "Gmina dostaje propozycję związku miast. Zgoda: staje się naszym podmiotem (z funkcją strategiczną dla stolicy)."
 WOS_idea_smr_m_tusk:0 "Rząd przy Wiejskiej"
 WOS_idea_smr_m_tusk_desc:0 "Premier urzęduje w gmachu Sejmu, a jego klub prowadzi obrady. Rząd i parlament mówią jednym głosem – dopóki premier ma większość. (Ścieżka w modzie jest fikcją.)"
 WOS_idea_smr_m_czarzasty:0 "Marszałek Czarzasty"
 WOS_idea_smr_m_czarzasty_desc:0 "Marszałek z klubu Lewicy prowadzi Sejm twardo, według regulaminu i z własnym kalendarzem. Decyzje zapadają szybko. (Ścieżka w modzie jest fikcją.)"
 WOS_idea_smr_m_konopka:0 "Marszałek-legislatorka"
 WOS_idea_smr_m_konopka_desc:0 "Barbara Konopka prowadzi obrady jak posiedzenie komisji: każda uchwała ma podstawę prawną, każda poprawka – uzasadnienie. Sejm działa wolniej, ale nikt nie może mu zarzucić bezprawia."
 WOS_idea_smr_m_kukiz:0 "Sejm referendów"
 WOS_idea_smr_m_kukiz_desc:0 "Marszałek Paweł Kukiz zapowiada, że najważniejsze decyzje rozstrzygną mieszkańcy w głosowaniach. Ludzie przychodzą do lokali w szkołach, a kluby tracą część władzy. (Ścieżka w modzie jest fikcją.)"
 WOS_idea_smr_m_ostrowski:0 "Marszałek w mundurze"
 WOS_idea_smr_m_ostrowski_desc:0 "Komendant Straży Marszałkowskiej przewodniczy obradom w mundurze. Sejm jest bezpieczny jak nigdy – i jak nigdy cichy."
 WOS_idea_smr_m_prezydium:0 "Kolegialne Prezydium"
 WOS_idea_smr_m_prezydium_desc:0 "Marszałek i wicemarszałkowie decydują wspólnie. Każda decyzja wymaga kompromisu między klubami – co trwa, ale wszyscy biorą za nią odpowiedzialność."
 WOS_idea_smr_m_rada:0 "Rada Ocalenia Państwa"
 WOS_idea_smr_m_rada_desc:0 "Marszałkowski fotel stoi pusty. O sprawach Sejmu decydują wojewodowie i dowódcy, którzy przetrwali w Warszawie – sprawnie i bez debat."
 wos.102.t:0 "Wybór Marszałka Sejmu"
 wos.102.d:0 "Fotel marszałka jest pusty, a sala plenarna pełna po raz pierwszy od tygodni. Kluby zgłaszają kandydatów, sekretarze liczą głosy przy świetle latarek. Ten, kogo wybiorą posłowie, nie tylko poprowadzi obrady – pokieruje całym sejmowym ośrodkiem władzy w Warszawie. (Ścieżki prawdziwych polityków w modzie są fikcją.)"
 wos.102.a:0 "Donald Tusk – premier zostaje w Warszawie, a Sejm powierza mu władzę."
 wos.102.b:0 "Włodzimierz Czarzasty – marszałek, który już prowadzi obrady."
 wos.102.c:0 "Barbara Konopka – szefowa Biura Legislacyjnego, która zna każdy przepis."
 wos.102.e:0 "Paweł Kukiz – pełnomocnik ds. referendów, który chce oddać głos ludziom."
 wos.102.f:0 "płk Henryk Ostrowski – komendant Straży Marszałkowskiej. Porządek przed polityką."
 wos.102.g:0 "Nikt sam. Kolegialne Prezydium Sejmu przejmuje obowiązki Marszałka."
 wos.102.h:0 "Rada Ocalenia Państwa – wojewodowie i dowódcy zamiast marszałka."
 wos.102.i:0 "Posłowie potwierdzają obecny wybór."
 WOS_tt_marszalek:0 "Posłowie wybierają, kto pokieruje Sejmem: nowy przywódca państwa i duch narodowy zależny od wybranego marszałka. Wybór Donalda Tuska otwiera ścieżkę „Premier w Sejmie”, każdy inny – „Sejm bez premiera”."
 WOS_req_m_min_35:0 "Wskaźnik frakcji (panel „Warszawa: walka o stolicę”) co najmniej 35"
 WOS_dec_smr_wotum:0 "Wotum nieufności wobec Marszałka"
 WOS_dec_smr_wotum_desc:0 "Kluby zbierają podpisy pod wnioskiem o odwołanie Marszałka. Jeśli wniosek przejdzie, sala wybierze kogoś nowego."
 WOS_smr_kworum:0 "Liczymy kworum"
 WOS_smr_kworum_desc:0 "Na sali jest stu trzydziestu posłów, część dotarła piechotą z Ursynowa. Prawnicy z Biura Legislacyjnego przekonują, że w stanie wyższej konieczności wystarczy, żeby obrady były jawne. Trzeba to przegłosować – pierwszy raz od upadku państwa."
 WOS_smr_rada_obrony:0 "Rada Obrony przy Wiejskiej"
 WOS_smr_rada_obrony_desc:0 "Komendant Straży Marszałkowskiej, dwóch emerytowanych pułkowników i sekretarz komisji obrony. Pierwsza rada, która może wydawać rozkazy w imieniu Sejmu."
 WOS_smr_u_kleska:0 "Ustawa o stanie klęski żywiołowej"
 WOS_smr_u_kleska_desc:0 "Nie wojna, nie stan wyjątkowy – klęska. Ta jedna ustawa daje Sejmowi podstawę prawną do rekwizycji, kartek i wydawania poleceń służbom."
 WOS_smr_u_kartki:0 "Ustawa o zaopatrzeniu ludności"
 WOS_smr_u_kartki_desc:0 "Kartki na chleb, mleko i paliwo dla piekarni. Nikt nie lubi kartek, ale wszyscy wolą je od kolejek, w których rządzi ten, kto ma pałkę."
 WOS_smr_u_amnestia:0 "Ustawa amnestyjna"
 WOS_smr_u_amnestia_desc:0 "Kto odda broń i zgłosi się do Straży Marszałkowskiej, ten nie odpowie za grabieże z pierwszych tygodni. Prawnicy kręcą nosem, komendanci zacierają ręce."
 WOS_smr_u_pakiet:0 "Pakiet ratunkowy dla stolicy"
 WOS_smr_u_pakiet_desc:0 "Trzy ustawy w jednym pakiecie: zaopatrzenie, ciepło i odbudowa sieci. Przygotowane przez Biuro Legislacyjne w piwnicy, przy agregacie."
 WOS_smr_p_belweder:0 "Telefon do Belwederu"
 WOS_smr_p_belweder_desc:0 "Linia specjalna między Wiejską a Pałacem nadal działa. Wystarczy podnieść słuchawkę. Pytanie tylko, kto pierwszy się odezwie."
 WOS_smr_p_dzielnice:0 "Komisja wspólna z dzielnicami"
 WOS_smr_p_dzielnice_desc:0 "Przedstawiciele Pragi, Bielan i Powiśla przychodzą na Wiejską jako goście, a nie petenci. Rozmawiamy o wodzie, chlebie i o tym, kto będzie pilnował mostów."
 WOS_smr_p_jednosc:0 "Rząd Jedności Narodowej"
 WOS_smr_p_jednosc_desc:0 "Ministrowie z różnych klubów, wiceministrowie z dzielnic, a w resorcie spraw wewnętrznych – komendant, któremu ufają wszyscy. Tylko taki rząd ma szansę mówić w imieniu całej Warszawy."
 WOS_smr_t_komisja:0 "Komisja śledcza ds. Pruszkowa"
 WOS_smr_t_komisja_desc:0 "Przesłuchania w sali kolumnowej transmitowane przez radio. Świadkowie przychodzą z ochroną, a niektórzy nie przychodzą wcale."
 WOS_smr_t_listy:0 "Listy gończe"
 WOS_smr_t_listy_desc:0 "Twarze ludzi Rodziny na każdym słupie ogłoszeniowym między Placem Zbawiciela a Dworcem Centralnym. Nagroda: kanister paliwa i miesięczny przydział żywności."
 WOS_smr_t_ulice:0 "Straż Marszałkowska na ulicach"
 WOS_smr_t_ulice_desc:0 "Granatowe mundury na Nowym Świecie. Funkcjonariusze, którzy dotąd pilnowali drzwi do sali plenarnej, teraz pilnują kolejek po chleb."
 WOS_smr_t_panstwo:0 "Państwo wraca na ulice"
 WOS_smr_t_panstwo_desc:0 "Patrole, komisariaty tymczasowe w szkołach, numer alarmowy, który znów ktoś odbiera. Państwo nie jest już tylko adresem na Wiejskiej."
 WOS_smr_glosowanie:0 "Wielkie głosowanie: ocalenie stolicy"
 WOS_smr_glosowanie_desc:0 "Pierwsze od miesięcy głosowanie, w którym liczy się każda ręka. Kluby zostawiają spory za drzwiami. Jeśli uchwała przejdzie, Warszawa będzie miała wspólny program – i jedno miejsce, w którym zapadają decyzje."
 WOS_smr_kohabitacja:0 "Kohabitacja z Pałacem"
 WOS_smr_kohabitacja_desc:0 "Prezydent i Marszałek podpisują protokół o współpracy. Nikt nie oddaje władzy – obaj zgadzają się tylko, że wróg jest w Pruszkowie, nie na Krakowskim Przedmieściu."
 WOS_smr_nadzwyczajny:0 "Tryb nadzwyczajny wobec Pałacu"
 WOS_smr_nadzwyczajny_desc:0 "Uchwała stwierdza, że Prezydent „nie sprawuje urzędu w sposób zgodny z Konstytucją”. Prawnie wątpliwe, politycznie – jasne: Sejm nie uznaje Pałacu za równego partnera."
 WOS_smr_posiedzenie:0 "Ostatnie posiedzenie Sejmu"
 WOS_smr_posiedzenie_desc:0 "To może być ostatnie posiedzenie w tej kadencji – albo ostatnie w historii tej izby. Sala zdecyduje, czy Rzeczpospolita odrodzi się jako republika parlamentarna, czy przetrwa w rękach nadzwyczajnego Prezydium."
 WOS_smr_demokracja:0 "Odrodzenie demokratycznej Rzeczypospolitej"
 WOS_smr_demokracja_desc:0 "Konstytucja wraca do szkół, a na budynkach urzędów – godło. Sejm ogłasza harmonogram wyborów, gdy tylko pozwolą na to warunki. To nie koniec walki o Warszawę, ale koniec walki o to, czym ma być Polska."
 WOS_smr_prezydium:0 "Rządy nadzwyczajnego Prezydium"
 WOS_smr_prezydium_desc:0 "Prezydium zbiera się codziennie o szóstej rano. Uchwały mają moc ustaw, a posłowie, którzy protestują, dostają przepustki tylko na galerię. Państwo działa – ale już nie jest tym samym państwem."
 WOS_smr_statut_prg:0 "Statut dla dzielnicy: Praga"
 WOS_smr_statut_prg_desc:0 "Ultimatum to nie jedyna droga. Proponujemy dzielnicy autonomię: własną radę, straż i prawo weta w sprawach lokalnych – w zamian za uznanie wspólnej władzy."
 WOS_smr_statut_zie:0 "Statut dla dzielnicy: Bielany"
 WOS_smr_statut_zie_desc:0 "Ultimatum to nie jedyna droga. Proponujemy dzielnicy autonomię: własną radę, straż i prawo weta w sprawach lokalnych – w zamian za uznanie wspólnej władzy."
 WOS_smr_statut_tec:0 "Statut dla dzielnicy: Powiśle"
 WOS_smr_statut_tec_desc:0 "Ultimatum to nie jedyna droga. Proponujemy dzielnicy autonomię: własną radę, straż i prawo weta w sprawach lokalnych – w zamian za uznanie wspólnej władzy."
 WOS_smr_neg_ozm:0 "Porozumienie: Ożarów Mazowiecki"
 WOS_smr_neg_ozm_desc:0 "Zamiast ofensywy – związek miast. Ożarów Mazowiecki to zachodni korytarz zaopatrzeniowy (Bronisze i DK92). Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 WOS_smr_neg_grd:0 "Porozumienie: Grodzisk Mazowiecki"
 WOS_smr_neg_grd_desc:0 "Zamiast ofensywy – związek miast. Grodzisk Mazowiecki to logistyka i handel (węzeł kolejowy i hurtownie). Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 WOS_smr_neg_psc:0 "Porozumienie: Piaseczno"
 WOS_smr_neg_psc_desc:0 "Zamiast ofensywy – związek miast. Piaseczno to południowe podejścia do stolicy. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 WOS_smr_wybor_marszalka:0 "Wybór Marszałka Sejmu"
 WOS_smr_wybor_marszalka_desc:0 "Sejm nie ma marszałka. Posłowie, którzy dotarli na Wiejską, muszą zdecydować, kto będzie mówił w imieniu izby: premier, jeden z kandydatów klubów albo kolegium. Od tego wyboru zależy cała dalsza droga Sejmu."
 WOS_idea_kpr_stan:0 "Stan wyjątkowy w stolicy"
 WOS_idea_kpr_stan_desc:0 "Zakaz zgromadzeń, kontrola na rogatkach i komunikaty Kancelarii o pełnych godzinach w radiu."
 WOS_idea_kpr_pierscien:0 "Pierścień wokół Pałacu"
 WOS_idea_kpr_pierscien_desc:0 "Bramy na Krakowskim Przedmieściu, snajperzy na dachach Hotelu Bristol i SOP przy każdej bramie."
 WOS_idea_kpr_cod:0 "Centralny Ośrodek Decyzyjny"
 WOS_idea_kpr_cod_desc:0 "Jedno biurko, jeden telefon i jedna pieczęć. Decyzje, które dawniej szły przez ministerstwa, zapadają w godzinę."
 WOS_idea_kpr_porozumienie:0 "Porozumienie konstytucyjne"
 WOS_idea_kpr_porozumienie_desc:0 "Prezydent i Sejm uznają się nawzajem. Spory przenoszą się z ulicy do sali posiedzeń – tam, gdzie powinny być."
 WOS_idea_kpr_dekrety:0 "Państwo dekretów"
 WOS_idea_kpr_dekrety_desc:0 "Dekret numer sto dwadzieścia trzy reguluje ceny chleba. Numer sto dwadzieścia cztery – kto może mieć radio. Państwo działa, ale tylko w jedną stronę."
 WOS_idea_kpr_rada_wojskowa:0 "Pod kuratelą generałów"
 WOS_idea_kpr_rada_wojskowa_desc:0 "Prezydent wciąż podpisuje dokumenty. Tyle że teraz najpierw czyta je Rada Wojskowa."
 wos.111.t:0 "Dwa ośrodki władzy, jedna Polska"
 wos.111.d:0 "Kolumna SOP zatrzymuje się na Wiejskiej pierwszy raz od upadku państwa. Prezydent i Marszałek siedzą naprzeciw siebie w gabinecie, w którym przed laty przyjmowano zagraniczne delegacje. Na stole leżą dwa dokumenty: projekt porozumienia konstytucyjnego i dekret o „przejęciu obowiązków Sejmu do czasu przywrócenia normalności”."
 wos.111.a:0 "Podpisać porozumienie. Polska potrzebuje dwóch filarów."
 wos.111.b:0 "Prezydent ponad Sejmem. Dekret zostaje."
 wos.112.t:0 "Generałowie w Belwederze"
 wos.112.d:0 "Trzech generałów z Rembertowa wchodzi do gabinetu bez zapowiedzi. Mówią spokojnie: autorytet Pałacu się skończył, a wojsko nie będzie umierać za dekrety, których nikt nie wykonuje. Proponują „Radę Wojskową przy Prezydencie”. Za oknem stoją transportery."
 wos.112.a:0 "Zgodzić się na Radę Wojskową."
 wos.112.b:0 "Odwołać generałów. Prezydent jest zwierzchnikiem Sił Zbrojnych."
 WOS_tt_4:0 "Zabezpiecza Pałac przed wojskowym zamachem stanu (zdarzenie „Generałowie w Belwederze”)."
 WOS_kpr_d1:0 "Dekret nr 1: stan wyjątkowy w stolicy"
 WOS_kpr_d1_desc:0 "Pierwszy dekret ma jedną stronę. Ogłasza, że w Warszawie obowiązuje stan wyjątkowy, a Prezydent przejmuje „bezpośrednie kierownictwo nad służbami”. Reszta to podpisy i pieczęcie."
 WOS_kpr_d2:0 "Dekret nr 2: godzina policyjna"
 WOS_kpr_d2_desc:0 "Od 22:00 do 5:00 na ulicach tylko patrole i karetki. Złodzieje i bojówki mają mniej czasu. Mieszkańcy – mniej życia."
 WOS_kpr_d3:0 "Dekret nr 3: rekwizycja paliwa"
 WOS_kpr_d3_desc:0 "Cysterny z baz paliwowych przechodzą pod zarząd Kancelarii. Benzyna jest teraz walutą, a Pałac – bankiem centralnym."
 WOS_kpr_d4:0 "Dekret nr 4: komisarze Prezydenta"
 WOS_kpr_d4_desc:0 "W każdej kontrolowanej dzielnicy siedzi komisarz z pieczątką i dwoma funkcjonariuszami SOP. Burmistrzowie dzielnic doradzają. Komisarze decydują."
 WOS_kpr_d5:0 "Dekret nr 5: sądy doraźne"
 WOS_kpr_d5_desc:0 "Sprawy o rabunek, dezercję i współpracę z mafią rozpatruje trzyosobowy skład w ciągu doby. Prawnicy z Kancelarii zapewniają, że to „tymczasowe”."
 WOS_kpr_wiejska:0 "Rozmowa na Wiejskiej"
 WOS_kpr_wiejska_desc:0 "Dwa ośrodki władzy, jedna Polska. Prezydent jedzie na Wiejską, żeby rozstrzygnąć, czy Rzeczpospolita będzie miała dwa filary, czy jeden."
 WOS_kpr_porozumienie:0 "Porozumienie konstytucyjne"
 WOS_kpr_porozumienie_desc:0 "Uchwała Sejmu i postanowienie Prezydenta ogłoszone tego samego dnia, o tej samej godzinie. Kancelaria oddaje część władzy – i zyskuje coś, czego nie dają dekrety: uznanie."
 WOS_kpr_dekrety:0 "Państwo dekretów"
 WOS_kpr_dekrety_desc:0 "Kancelaria zostaje jedynym ośrodkiem władzy. Sejm może obradować – jeśli chce – ale nie ma już nic do uchwalenia."
 WOS_kpr_s_przysiega:0 "Przysięga funkcjonariuszy SOP"
 WOS_kpr_s_przysiega_desc:0 "Każdy funkcjonariusz podpisuje nową rotę: „Prezydentowi Rzeczypospolitej, nie partii, nie dzielnicy, nie rodzinie”. Kilku nie podpisuje. Ich broń zostaje w magazynie."
 WOS_kpr_s_pierscien:0 "Pierścień wokół Pałacu"
 WOS_kpr_s_pierscien_desc:0 "Krakowskie Przedmieście od Placu Zamkowego do Kopernika zamienia się w twierdzę. Turyści dawno wyjechali, zostały bramy, zasieki i punkty obserwacyjne."
 WOS_kpr_s_kontrwywiad:0 "Kontrwywiad w Kancelarii"
 WOS_kpr_s_kontrwywiad_desc:0 "Każdy telefon z Rembertowa jest nagrywany, każdy generał ma swojego „oficera łącznikowego”. Pałac już raz prawie stracił władzę przez zaniedbanie – drugi raz się to nie zdarzy."
 WOS_kpr_s_gwardia:0 "Gwardia Belwederska"
 WOS_kpr_s_gwardia_desc:0 "Najlepsi funkcjonariusze SOP, dawni żołnierze sił specjalnych i ochotnicy z Akademii Sztuki Wojennej. Mała formacja, ale lojalna do końca."
 WOS_kpr_a_cod:0 "Centralny Ośrodek Decyzyjny"
 WOS_kpr_a_cod_desc:0 "W sali kolumnowej Pałacu stoją biurka ministerstw, których już nie ma. Jeden sekretarz zastępuje dziesięć departamentów."
 WOS_kpr_a_rzad:0 "Kancelaria jako rząd"
 WOS_kpr_a_rzad_desc:0 "Szef Kancelarii zostaje „pełniącym obowiązki Prezesa Rady Ministrów”. Prawnicy nazywają to konstrukcją wątpliwą. Urzędnicy – po prostu nową pieczątką."
 WOS_kpr_a_regiony:0 "Pełnomocnicy w regionach"
 WOS_kpr_a_regiony_desc:0 "Kancelaria wysyła ludzi do Płocka, Radomia, Białegostoku i Łodzi. Nie z rozkazami – z listami uwierzytelniającymi i ofertą współpracy."
 WOS_kpr_a_rada:0 "Rada Regionów przy Prezydencie"
 WOS_kpr_a_rada_desc:0 "Raz w miesiącu do Belwederu przyjeżdżają przedstawiciele regionów, które uznały Pałac za rozmówcę. Nikt nie oddaje władzy – ale wszyscy wiedzą, gdzie można się dogadać."
 WOS_kpr_statut_prg:0 "Dekret o autonomii: Praga"
 WOS_kpr_statut_prg_desc:0 "Ultimatum to nie jedyna droga. Proponujemy dzielnicy autonomię: własną radę, straż i prawo weta w sprawach lokalnych – w zamian za uznanie wspólnej władzy."
 WOS_kpr_statut_zie:0 "Dekret o autonomii: Bielany"
 WOS_kpr_statut_zie_desc:0 "Ultimatum to nie jedyna droga. Proponujemy dzielnicy autonomię: własną radę, straż i prawo weta w sprawach lokalnych – w zamian za uznanie wspólnej władzy."
 WOS_kpr_statut_tec:0 "Dekret o autonomii: Powiśle"
 WOS_kpr_statut_tec_desc:0 "Ultimatum to nie jedyna droga. Proponujemy dzielnicy autonomię: własną radę, straż i prawo weta w sprawach lokalnych – w zamian za uznanie wspólnej władzy."
 WOS_kpr_neg_otw:0 "Porozumienie z Pałacem: Otwock"
 WOS_kpr_neg_otw_desc:0 "Zamiast ofensywy – związek miast. Otwock to schronienie dla ludności i zaplecze szpitalne. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 WOS_kpr_neg_wlm:0 "Porozumienie z Pałacem: Wołomin"
 WOS_kpr_neg_wlm_desc:0 "Zamiast ofensywy – związek miast. Wołomin to lokalna polityka i walka o władzę w powiecie. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 WOS_kpr_neg_psc:0 "Porozumienie z Pałacem: Piaseczno"
 WOS_kpr_neg_psc_desc:0 "Zamiast ofensywy – związek miast. Piaseczno to południowe podejścia do stolicy. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 WOS_idea_mpr_monopol:0 "Monopol Rodziny"
 WOS_idea_mpr_monopol_desc:0 "Papierosy, wódka, paliwo i leki – wszystko, czego brakuje w mieście, ma jedno źródło. I jedną cenę."
 WOS_idea_mpr_ochrona:0 "Firmy ochroniarskie Rodziny"
 WOS_idea_mpr_ochrona_desc:0 "Na kurtkach napis „Security”, w kieszeniach legitymacje z pieczątką spółki z o.o. W praktyce – prywatna armia."
 WOS_idea_mpr_panstwo:0 "Przestępcze państwo w Warszawie"
 WOS_idea_mpr_panstwo_desc:0 "Nie ma już różnicy między urzędem a „biurem” Rodziny. Podatki płaci się w kopertach, a sprawiedliwość wymierza ktoś, kogo wszyscy znają z ksywki."
 WOS_idea_mpr_legalizacja:0 "Administracja z łapanki"
 WOS_idea_mpr_legalizacja_desc:0 "Burmistrz, rada i urząd – wszystko jak w podręczniku. Tylko że każdy urzędnik wie, komu zawdzięcza stanowisko."
 wos.121.t:0 "Rodzina jest ważniejsza od państwa"
 wos.121.d:0 "Rada Rodzin zbiera się w restauracji przy Alejach Jerozolimskich, zamkniętej dla gości od miesięcy. Przy stole siedzą ludzie z Ursusa, Piastowa, Raszyna i Włoch. Jedni chcą państwa – urzędów, mundurów, flag. Inni mówią, że Rodzina przetrwała dlatego, że nigdy nie udawała państwa. A kilku już liczy, ile zarobiłoby na odejściu."
 wos.121.a:0 "Rodzina zostaje razem. Kto odejdzie – odejdzie bez niczego."
 wos.121.b:0 "Rozliczyć zdrajców siłą."
 wos.121.c:0 "Pozwolić niezadowolonym odejść z częścią interesów."
 wos.122.t:0 "Rodzina się rozpada"
 wos.122.d:0 "Telefony przestają odpowiadać, a ludzie z Ursusa otwierają własne „biuro” na Włochach. Kibice przestali brać pieniądze, a kantory na Marszałkowskiej płacą już komuś innemu. Ośmiornica traci macki."
 wos.122.a:0 "Ratować, co się da."
 WOS_dec_mpr_koperta:0 "Koperta dla urzędnika rywala"
 WOS_dec_mpr_koperta_desc:0 "Ktoś w Kancelarii albo na Wiejskiej ma długi. Rodzina może je spłacić – w zamian za informacje i drobne „przeoczenia”."
 WOS_dec_mpr_przemyt:0 "Przemyt przez Bronisze"
 WOS_dec_mpr_przemyt_desc:0 "Ciężarówki z hurtowni jadą nocą bocznymi drogami przez Piastów. Rodzina bierze swoją dolę, miasto dostaje towar."
 WOS_req_m_min_60:0 "Wskaźnik frakcji (panel „Warszawa: walka o stolicę”) co najmniej 60"
 WOS_mpr_zarzad:0 "Zarząd w Pruszkowie"
 WOS_mpr_zarzad_desc:0 "Nikt nie nazywa tego zarządem, ale wszyscy wiedzą, gdzie zapadają decyzje: w biurze nad hurtownią przy Alejach, z widokiem na tory WKD."
 WOS_mpr_cz_kantory:0 "Kantory na Marszałkowskiej"
 WOS_mpr_cz_kantory_desc:0 "Złotówka nic nie jest warta, ale dolary, euro i złoto zawsze mają kurs. Kantory Rodziny ustalają go codziennie o dziewiątej."
 WOS_mpr_cz_cysterny:0 "Cysterny z Płocka"
 WOS_mpr_cz_cysterny_desc:0 "Paliwo jedzie z Orlenu „bocznym torem”: kierowcy dostają koperty, a wartownicy – nowe telefony. Cysterny zatrzymują się w Ursusie."
 WOS_mpr_cz_monopol:0 "Monopol na papierosy i alkohol"
 WOS_mpr_cz_monopol_desc:0 "W całym lewobrzeżnym Śródmieściu tylko jeden dostawca. Konkurencja albo przeszła na stronę Rodziny, albo zniknęła."
 WOS_mpr_ko_koperta:0 "Koperta dla radnego"
 WOS_mpr_ko_koperta_desc:0 "Radni dzielnic nie zarabiają nic od miesięcy. Rodzina płaci regularnie, w terminie i bez pytań."
 WOS_mpr_ko_komisariaty:0 "Ludzie na komisariatach"
 WOS_mpr_ko_komisariaty_desc:0 "Dyżurny na Woli dostaje „premię”, kierownik magazynu dowodów – samochód. Policja dalej działa, ale wie, czego nie widzieć."
 WOS_mpr_ko_teczki:0 "Teczki na polityków"
 WOS_mpr_ko_teczki_desc:0 "Zdjęcia, nagrania, rachunki. Każdy, kto w Warszawie coś znaczy, ma swoją teczkę w sejfie w Raszynie."
 WOS_mpr_bi_bronisze:0 "Przejęcie hurtowni w Broniszach"
 WOS_mpr_bi_bronisze_desc:0 "Największy rynek hurtowy w regionie dostaje nową „ochronę”. Ceny ustala Rodzina, a dostawy trafiają tam, gdzie płacą najwięcej."
 WOS_mpr_bi_ochrona:0 "Firmy ochroniarskie"
 WOS_mpr_bi_ochrona_desc:0 "Rodzina rejestruje sześć spółek ochroniarskich. Ich pracownicy noszą broń legalnie – przynajmniej według papierów."
 WOS_mpr_bi_deweloperka:0 "Deweloperka na gruzach"
 WOS_mpr_bi_deweloperka_desc:0 "Spalone kamienice na Woli kupuje się za grosze. Odbudowuje się je za pieniądze, których pochodzenia nikt nie sprawdza."
 WOS_mpr_bo_milicje:0 "Pensje dla milicji osiedlowych"
 WOS_mpr_bo_milicje_desc:0 "Na Ursusie, Włochach i Piastowie osiedla mają własne straże. Od dziś płaci im Rodzina – i od dziś słuchają Rodziny."
 WOS_mpr_bo_kibice:0 "Kibice na etatach"
 WOS_mpr_bo_kibice_desc:0 "Grupy z Żylety dostają regularne pensje, a nie jednorazowe koperty. Pieniądze kupują lojalność – przynajmniej na jakiś czas."
 WOS_mpr_bo_lojalnosc:0 "Lojalność bojówek"
 WOS_mpr_bo_lojalnosc_desc:0 "Każdy dowódca bojówki dostaje udział w interesach. Kto ma udział, ten nie zdradza – takie są zasady, które Rodzina zna od trzydziestu lat."
 WOS_mpr_le_fundacja:0 "Fundacja Dobroczynna"
 WOS_mpr_le_fundacja_desc:0 "Paczki dla emerytów, opał dla szkół, wigilia dla bezdomnych na dworcu. Na każdej paczce logo fundacji – i nazwisko sponsora."
 WOS_mpr_le_kandydaci:0 "Kandydaci Rodziny"
 WOS_mpr_le_kandydaci_desc:0 "W radach dzielnic zasiadają „niezależni przedsiębiorcy”. Mają czyste rejestry, dobre garnitury i bardzo bogatych sponsorów."
 WOS_mpr_le_rzecznik:0 "Rzecznik prasowy Rodziny"
 WOS_mpr_le_rzecznik_desc:0 "Elegancki pan w okularach udziela wywiadów radiu. Mówi o „bezpieczeństwie biznesu”, „odbudowie miasta” i „chaosie wywołanym przez polityków”."
 WOS_mpr_rada:0 "Rada Rodzin w komplecie"
 WOS_mpr_rada_desc:0 "Pierwszy raz od lat przy jednym stole siedzą wszystkie rodziny: z Ursusa, Piastowa, Raszyna, Włoch i Michałowic. Trzeba ustalić, czym Rodzina ma być po wojnie."
 WOS_mpr_panstwo:0 "Przestępcze państwo w Warszawie"
 WOS_mpr_panstwo_desc:0 "Rodzina nie udaje już, że jest czymś innym niż władzą. Urzędy działają, sklepy są pełne, ulice spokojne – a cena za to wszystko jest wypisana w zeszycie w Pruszkowie."
 WOS_mpr_legalizacja:0 "Legalizacja przez marionetkową administrację"
 WOS_mpr_legalizacja_desc:0 "Burmistrz z dyplomem prawnika, rada z wyborów, urząd z prawdziwą pieczątką. Rodzina wycofuje się na drugi plan – i zarabia więcej niż kiedykolwiek."
 WOS_mpr_neg_psc:0 "Interes z gminą: Piaseczno"
 WOS_mpr_neg_psc_desc:0 "Zamiast ofensywy – związek miast. Piaseczno to południowe podejścia do stolicy. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 WOS_mpr_neg_grd:0 "Interes z gminą: Grodzisk Mazowiecki"
 WOS_mpr_neg_grd_desc:0 "Zamiast ofensywy – związek miast. Grodzisk Mazowiecki to logistyka i handel (węzeł kolejowy i hurtownie). Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 WOS_mpr_neg_ozm:0 "Interes z gminą: Ożarów Mazowiecki"
 WOS_mpr_neg_ozm_desc:0 "Zamiast ofensywy – związek miast. Ożarów Mazowiecki to zachodni korytarz zaopatrzeniowy (Bronisze i DK92). Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 WOS_idea_leg_twierdza:0 "Twierdza Łazienkowska"
 WOS_idea_leg_twierdza_desc:0 "Trybuny zamienione w bunkry, parking w strzelnicę, a tunel dla zawodników w magazyn amunicji."
 WOS_idea_leg_niezalezni:0 "Warszawa kibicowska"
 WOS_idea_leg_niezalezni_desc:0 "Stadion jest stolicą, Żyleta – parlamentem, a gniazdowy – burmistrzem. Działa, dopóki wszyscy śpiewają razem."
 WOS_idea_leg_junta:0 "Junta trybun"
 WOS_idea_leg_junta_desc:0 "Zgoda między grupami skończyła się wraz z ostatnią kłótnią. Teraz decyduje rada dowódców bojówek – i nikt inny."
 WOS_idea_leg_normalizacja:0 "Klub, nie armia"
 WOS_idea_leg_normalizacja_desc:0 "Wojna się skończyła, a z bojówek zostało stowarzyszenie, straż porządkowa i drużyna, która znów gra w niedzielę."
 wos.131.t:0 "Spór o kasę"
 wos.131.d:0 "Zrzutka z ostatniego miesiąca zniknęła. Grupa z Ursynowa twierdzi, że pieniądze wziął skarbnik z Mokotowa, Mokotów mówi, że to „ludzie z Pruszkowa”. Na trybunie Krytej doszło do bójki, a dwie grupy nie przyszły na zbiórkę."
 wos.131.a:0 "Sąd koleżeński na Krytej. Winni oddają kasę i przepraszają."
 wos.131.b:0 "Nowy skarbnik i nowe zasady – kasa jest wspólna."
 wos.131.c:0 "Niech się biją. Silniejszy będzie rządził."
 wos.53.t:0 "Kibice proponują sojusz"
 wos.53.d:0 "Na naszą bramę przychodzi delegacja z Łazienkowskiej: kilku gniazdowych w szalikach i jeden prawnik. Proponują sojusz – oni dadzą ludzi i stadion, my daj im uznanie i pieniądze na sprzęt. Wyglądają poważniej, niż się spodziewaliśmy."
 wos.53.a:0 "Przyjąć ich pod nasze skrzydła."
 wos.53.b:0 "Nie potrzebujemy kibiców w polityce."
 WOS_dec_leg_oprawa:0 "Oprawa na całą Łazienkowską"
 WOS_dec_leg_oprawa_desc:0 "Sektorówka na całą trybunę, race i flagi wszystkich grup. Przez jeden wieczór nikt nie pamięta o sporach."
 WOS_dec_leg_zrzutka:0 "Zrzutka na sprzęt"
 WOS_dec_leg_zrzutka_desc:0 "Każda grupa daje, ile może. Za pieniądze z puszek kupuje się kamizelki, radia i hełmy z demobilu."
 WOS_tt_5:0 "Najsilniejszy ośrodek władzy w Warszawie (Sejm albo Pałac) dostaje propozycję sojuszu – zgoda: stajemy się jego partnerem."
 WOS_leg_z_oprawa:0 "Oprawa na całą trybunę"
 WOS_leg_z_oprawa_desc:0 "Sektorówka z herbem miasta, którą szyto przez trzy noce w hali na Bemowie. Pokazuje, że Żyleta jest jedna – przynajmniej na dziewięćdziesiąt minut."
 WOS_leg_z_mlyn:0 "Młyn"
 WOS_leg_z_mlyn_desc:0 "Najbardziej zagorzali stoją w środku sektora. Teraz stoją też w pierwszym szeregu na barykadach przy Łazienkowskiej."
 WOS_leg_z_doping:0 "Doping, który słychać na Pradze"
 WOS_leg_z_doping_desc:0 "Kiedy Żyleta śpiewa, słychać to na drugim brzegu Wisły. W Pruszkowie też słuchają – i liczą, ilu ludzi naprawdę ma stadion."
 WOS_leg_o_mokotow:0 "Grupy osiedlowe z Mokotowa"
 WOS_leg_o_mokotow_desc:0 "Stegny, Sielce, Służew. Każde osiedle ma swoją grupę, swój sektor i swoje porachunki – ale wszystkie mają jeden herb."
 WOS_leg_o_ursynow:0 "Ursynów w gotowości"
 WOS_leg_o_ursynow_desc:0 "Blokowiska na Kabatach i Natolinie to labirynt, w którym obcy gubią się w pięć minut. Dla swoich – idealna linia obrony."
 WOS_leg_o_kosa:0 "Kosa na Pruszków"
 WOS_leg_o_kosa_desc:0 "Kibice z Ursynowa nie chcą być „ludźmi Rodziny”. Na murach pojawiają się hasła, których w Pruszkowie nikt nie chciałby przeczytać."
 WOS_leg_k_wiarusy:0 "Starzy wiarusy z Krytej"
 WOS_leg_k_wiarusy_desc:0 "Ludzie, którzy jeździli na wyjazdy, zanim połowa obecnej Żylety się urodziła. Znają wszystkich i wszyscy ich słuchają."
 WOS_leg_k_kasa:0 "Spór o kasę"
 WOS_leg_k_kasa_desc:0 "Pieniądze z Pruszkowa, zrzutki i „sponsoring” lokalnych firm. Ktoś musi to policzyć – i ktoś na pewno będzie niezadowolony."
 WOS_leg_k_zgoda:0 "Zgoda między grupami"
 WOS_leg_k_zgoda_desc:0 "Gniazdowi wszystkich grup podają sobie ręce na środku murawy. Zgoda ma trzy zasady: wspólna kasa, wspólny wróg, żadnych porachunków przed końcem wojny."
 WOS_leg_g_kasy:0 "Własne kasy biletowe"
 WOS_leg_g_kasy_desc:0 "Bilet na „mecz” kosztuje kanister paliwa. Za kanister można też kupić spokój na osiedlu przy Łazienkowskiej."
 WOS_leg_g_wilanow:0 "Zaplecze na Wilanowie"
 WOS_leg_g_wilanow_desc:0 "Pałac, park i nowe osiedla. Na parkingach centrów handlowych powstają warsztaty, a w garażach podziemnych – magazyny."
 WOS_leg_g_twierdza:0 "Stadion jako twierdza"
 WOS_leg_g_twierdza_desc:0 "Stadion przy Łazienkowskiej 3 to najlepiej ufortyfikowany obiekt w lewobrzeżnej Warszawie. Ma beton, tunele, zasilanie awaryjne i kilka tysięcy ludzi, którzy znają każdy jego kąt."
 WOS_leg_murawa:0 "Mecz o miasto"
 WOS_leg_murawa_desc:0 "Wszystkie sektory schodzą na murawę. Nie ma już grup z Mokotowa, Ursynowa i Krytej – jest jedna Żyleta, która chce zdecydować o losie Warszawy."
 WOS_leg_niezaleznosc:0 "Niezależność od Rodziny"
 WOS_leg_niezaleznosc_desc:0 "Kontrakt z Pruszkowem wygasa. Kibice oddają pieniądze, a w zamian odzyskują to, czego nie da się kupić: prawo do decydowania o sobie."
 WOS_leg_warszawa_kib:0 "Niezależna Warszawa kibicowska"
 WOS_leg_warszawa_kib_desc:0 "Rada Gniazdowych zostaje władzą. Stadion jest stolicą, a herb klubu – godłem. Kto nie śpiewa z Żyletą, ten może wyjechać."
 WOS_leg_junta:0 "Junta trybun"
 WOS_leg_junta_desc:0 "Nie wszyscy chcą rad i głosowań. Najsilniejsze bojówki przejmują dowództwo i ogłaszają, że miasto potrzebuje „porządku z trybun”."
 WOS_leg_sojusz:0 "Sojusz z innym ośrodkiem władzy"
 WOS_leg_sojusz_desc:0 "Żyleta nie musi rządzić, żeby wygrać. Wystarczy wybrać właściwego partnera – kogoś, kto da uznanie, pieniądze i miejsce przy stole."
 WOS_leg_normalizacja:0 "Klub, nie armia"
 WOS_leg_normalizacja_desc:0 "Warszawa ma jedną władzę. Bojówki oddają broń, a stowarzyszenie kibiców dostaje stadion, straż porządkową i miejsce w radzie miasta. Żyleta znów śpiewa o piłce."
 WOS_idea_plc_siec:0 "Sieć posterunków"
 WOS_idea_plc_siec_desc:0 "Komisariaty na Woli, Ochocie, Żoliborzu i Bemowie łączy jedno radio i jeden grafik patroli. Miasto znów ma numer alarmowy."
 WOS_idea_plc_sluzba:0 "Policja Rzeczypospolitej"
 WOS_idea_plc_sluzba_desc:0 "Mundur znów oznacza służbę, a nie władzę. Komendant składa raporty przed komisją cywilną – i przestrzega jej decyzji."
 WOS_idea_plc_panstwo:0 "Państwo policyjne"
 WOS_idea_plc_panstwo_desc:0 "Godzina policyjna jest stała, punkty kontrolne – na każdym skrzyżowaniu. Przestępczość spada. Ludzie przestają się odzywać."
 wos.141.t:0 "Kto pilnuje tych, którzy pilnują miasta?"
 wos.141.d:0 "Narada komendantów w sali odpraw na Nowolipkach. Jedni chcą wrócić pod kontrolę cywilną – Sejmu, rady miasta, kogokolwiek, kto ma mandat. Inni mówią, że tylko policja utrzymała Warszawę przy życiu i nie odda władzy politykom, którzy ją stracili. Na tablicy ktoś napisał po łacinie: „Quis custodiet ipsos custodes?”"
 wos.141.a:0 "Służymy miastu, nie rządzimy nim. Kontrola cywilna."
 wos.141.b:0 "Porządek ponad wszystko. Policja przejmuje odpowiedzialność."
 WOS_dec_plc_patrole:0 "Wspólne patrole z dzielnicami"
 WOS_dec_plc_patrole_desc:0 "Policjanci i miejscowi ochotnicy chodzą razem. Ludzie łatwiej rozmawiają z sąsiadem w kamizelce niż z obcym w mundurze."
 WOS_dec_plc_paliwo:0 "Paliwo dla radiowozów"
 WOS_dec_plc_paliwo_desc:0 "Kanistry z bazy na Okęciu, zarekwirowane przy przemycie. Każdy litr to godzina patrolu."
 WOS_plc_tetra:0 "Kryzys łączności"
 WOS_plc_tetra_desc:0 "Sieć radiowa służb działa na trzech nadajnikach z pięćdziesięciu. Patrol na Bemowie nie słyszy Komendy, a Komenda nie wie, gdzie są jej ludzie. Najpierw trzeba to naprawić."
 WOS_plc_k_wola:0 "Komisariat Wola"
 WOS_plc_k_wola_desc:0 "Ulica Żytnia, budynek z lat siedemdziesiątych i trzy radiowozy na chodzie. Wola to brama na zachód – i najczęstsze strzelaniny w mieście."
 WOS_plc_k_ochota:0 "Komisariat Ochota"
 WOS_plc_k_ochota_desc:0 "Grójecka pełna barykad i ludzi, którzy pamiętają, że kiedyś po prostu dzwoniło się na 112. Komisariat ma prąd tylko z agregatu."
 WOS_plc_k_zoliborz:0 "Komisariat Żoliborz"
 WOS_plc_k_zoliborz_desc:0 "Spokojne wille i Cytadela w tle. Żoliborz pilnuje Mostu Gdańskiego – a więc jednej z dróg na Pragę."
 WOS_plc_k_bemowo:0 "Komisariat Bemowo"
 WOS_plc_k_bemowo_desc:0 "Fort, lotnisko sportowe i ogromne osiedla. Bemowo to zaplecze Komendy: magazyny, warsztaty i najwięcej ochotników."
 WOS_plc_siec_zachod:0 "Linia patrolowa Wola–Ochota"
 WOS_plc_siec_zachod_desc:0 "Dwa komisariaty, jeden grafik i radio, które wreszcie działa. Zachodnia część miasta ma stały patrol od Kercelaka po Szczęśliwice."
 WOS_plc_siec_polnoc:0 "Linia patrolowa Żoliborz–Bemowo"
 WOS_plc_siec_polnoc_desc:0 "Patrole na Powązkach, przy Cytadeli i na Górczewskiej. Północne dzielnice znów mają policję, której można się nie bać."
 WOS_plc_siec:0 "Sieć posterunków"
 WOS_plc_siec_desc:0 "Wszystkie komisariaty połączone, wszystkie patrole na jednej częstotliwości. Komenda Stołeczna znów wie, co się dzieje w jej mieście."
 WOS_plc_paliwo:0 "Paliwo dla radiowozów"
 WOS_plc_paliwo_desc:0 "Bez paliwa policja to ludzie z pałkami na przystankach. Komenda przejmuje stację przy Wolskiej i ustala racje dla każdej jednostki."
 WOS_plc_amunicja:0 "Amunicja z Legionowa"
 WOS_plc_amunicja_desc:0 "Magazyn szkoły policji w Legionowie przetrwał rozpad państwa. Konwój przejeżdża przez trzy punkty kontrolne i dociera na Bemowo w nocy."
 WOS_plc_bsw:0 "Biuro Spraw Wewnętrznych"
 WOS_plc_bsw_desc:0 "Nikt nie lubi BSW, ale bez niego połowa wydziału kryminalnego pracowałaby dla Pruszkowa. Pierwsze zatrzymania – wśród swoich."
 WOS_plc_czyste_rece:0 "Akcja „Czyste ręce”"
 WOS_plc_czyste_rece_desc:0 "Jednego dnia o świcie zatrzymanych zostaje czterdziestu policjantów i dwunastu urzędników. W piwnicy Komendy znajdują się koperty z nazwiskami. W Pruszkowie od rana dzwonią telefony."
 WOS_plc_straz_miejska:0 "Straż Miejska wraca"
 WOS_plc_straz_miejska_desc:0 "Strażnicy, którzy do niedawna wypisywali mandaty za parkowanie, teraz kierują ruchem przy punktach wydawania żywności. Ktoś musi."
 WOS_plc_ratownictwo:0 "Jedno dowództwo dla służb ratunkowych"
 WOS_plc_ratownictwo_desc:0 "Pogotowie, straż pożarna i policja pod jednym dowództwem i na jednej częstotliwości. Karetka przyjeżdża w dwadzieścia minut, a nie wcale."
 WOS_plc_narada:0 "Narada komendantów"
 WOS_plc_narada_desc:0 "Komenda przetrwała, miasto ma posterunki, a policja – władzę, której nikt jej formalnie nie dał. Czas zdecydować, czym chce być."
 WOS_plc_sluzba:0 "Policja Rzeczypospolitej"
 WOS_plc_sluzba_desc:0 "Komendant składa ślubowanie przed komisją cywilną. Policja nie będzie już stroną w walce o stolicę – będzie jej strażnikiem, niezależnie od tego, kto wygra."
 WOS_plc_panstwo:0 "Państwo policyjne"
 WOS_plc_panstwo_desc:0 "Komenda Stołeczna ogłasza „tymczasowy zarząd policyjny” nad miastem. Tymczasowy, dopóki politycy się nie dogadają – czyli bardzo długo."
 WOS_idea_woj_zandarmeria:0 "Żandarmeria w każdej kompanii"
 WOS_idea_woj_zandarmeria_desc:0 "Patrol żandarmerii sprawdza przepustki, magazyny i listy obecności. Dezercji jest mniej, a rozkazy częściej docierają tam, gdzie powinny."
 WOS_idea_woj_cywilna:0 "Wojsko pod władzą cywilną"
 WOS_idea_woj_cywilna_desc:0 "Generałowie oddali władzę, ale nie broń. Armia znów podlega konstytucyjnym organom – i pilnuje, żeby te organy nie poszły na wojnę same ze sobą."
 WOS_idea_woj_rada:0 "Wojskowa Rada Ocalenia"
 WOS_idea_woj_rada_desc:0 "Rada generałów rządzi dekretami „do czasu przywrócenia normalnego funkcjonowania państwa”. Pociągi jeżdżą, sklepy są otwarte, a gazety piszą to, co dostały."
 WOS_idea_woj_armia_rp:0 "Armia odrodzonej Rzeczypospolitej"
 WOS_idea_woj_armia_rp_desc:0 "Garnizon Warszawa staje się zalążkiem nowego Wojska Polskiego – z przysięgą złożoną państwu, a nie jednej z frakcji."
 wos.151.t:0 "Spór generałów"
 wos.151.d:0 "W sali odpraw akademii jest zimno, bo ogrzewanie działa tylko w skrzydle szpitalnym. Dowódca garnizonu mówi, że wojsko ma słuchać zwierzchnika z Belwederu. Jego zastępca odpowiada, że przysięga dotyczy Rzeczypospolitej i konstytucji, nie jednego urzędu. Trzeci generał milczy – a potem mówi, że ani jeden, ani drugi nie zapewni miastu spokoju."
 wos.151.a:0 "Wierni Prezydentowi – konstytucyjnemu zwierzchnikowi sił zbrojnych."
 wos.151.b:0 "Wierni Konstytucji – armia nie wybiera stron w sporze organów państwa."
 wos.151.c:0 "Wierni sobie. Skoro politycy zawiedli, rządzić musi rada wojskowa."
 wos.152.t:0 "Rozkaz, którego nikt nie wykonał"
 wos.152.d:0 "Kompania z Wawra miała w nocy obsadzić przyczółek przy Moście Siekierkowskim. Rano okazuje się, że rozkaz dotarł, ale połowa żołnierzy była na przepustkach, a dowódca plutonu „nie dostał potwierdzenia”. Wszyscy wiedzą, że to nie przypadek."
 wos.152.a:0 "Sąd polowy dla dowódcy plutonu."
 wos.152.b:0 "Rozmowa w cztery oczy i nowy przydział. Bez rozgłosu."
 wos.152.c:0 "Wycofać kompanię. Nie będziemy wysyłać ludzi, którzy nie chcą iść."
 WOS_dec_woj_odprawa:0 "Odprawa dowódców batalionów"
 WOS_dec_woj_odprawa_desc:0 "Wszyscy dowódcy w jednej sali, z mapą i jednym planem. Po odprawie każdy wie, czyje rozkazy wykonuje."
 WOS_dec_woj_rezerwisci:0 "Wezwanie rezerwistów z Wawra i Wesołej"
 WOS_dec_woj_rezerwisci_desc:0 "Karty mobilizacyjne rozwozi się samochodami. Przychodzą ci, którzy jeszcze wierzą, że wojsko jest po to, żeby bronić ludzi."
 WOS_tt_6:0 "Jeśli jesteśmy podporządkowani innej frakcji, Rada wypowiada posłuszeństwo – bez wojny, ale z trwałą urazą dawnego zwierzchnika."
 WOS_woj_sztab:0 "Stanowisko dowodzenia w Rembertowie"
 WOS_woj_sztab_desc:0 "Sztab garnizonu przenosi się do budynków Akademii Sztuki Wojennej. Są tam mapy, łączność przewodowa i piwnice, które wytrzymają ostrzał. Tu powstanie plan obrony aglomeracji."
 WOS_woj_lacznosc:0 "Łączność przewodowa i kurierzy"
 WOS_woj_lacznosc_desc:0 "Radiostacje są podsłuchiwane, więc rozkazy idą kablem polowym i motocyklami. Wolniej, ale nikt w Pruszkowie nie wie, co planujemy."
 WOS_woj_r_akademia:0 "Kierunek Rembertów: akademia"
 WOS_woj_r_akademia_desc:0 "Słuchacze akademii – kapitanowie i majorzy z całego kraju – utknęli w Warszawie. Dostają kompanie i przydziały zamiast egzaminów."
 WOS_woj_r_poligon:0 "Poligon za torami"
 WOS_woj_r_poligon_desc:0 "Na poligonie w Rembertowie szkoli się ochotników w trzytygodniowym cyklu. Po pierwszym cyklu połowa wraca do domu. Druga połowa zostaje na zawsze."
 WOS_woj_r_kadra:0 "Kadra dla nowych batalionów"
 WOS_woj_r_kadra_desc:0 "Z absolwentów akademii i podoficerów rezerwy powstaje kadra trzech batalionów. Rozkaz z góry ma wreszcie komu trafić."
 WOS_woj_w_wisla:0 "Kierunek Wawer: linia Wisły"
 WOS_woj_w_wisla_desc:0 "Od Siekierek po Wał Miedzeszyński – to granica, której nie wolno oddać. Saperzy liczą, ile ładunków potrzeba, żeby w razie czego zamknąć przeprawę."
 WOS_woj_w_saperzy:0 "Saperzy na przeprawach"
 WOS_woj_w_saperzy_desc:0 "Pontony, liny i ładunki. Saperzy mogą w jedną noc postawić przeprawę – albo wysadzić tę, która już stoi."
 WOS_woj_w_przyczolek:0 "Przyczółek siekierkowski"
 WOS_woj_w_przyczolek_desc:0 "Kompania z Wawra okopuje się przy wschodnim zjeździe z mostu. Dopóki tu stoi, nikt nie przejdzie na prawy brzeg bez wiedzy sztabu."
 WOS_woj_e_koszary:0 "Kierunek Wesoła: koszary"
 WOS_woj_e_koszary_desc:0 "W koszarach w Wesołej stoją pojazdy, na które nie ma paliwa, i żołnierze, na których nie ma rozkazów. Jeszcze."
 WOS_woj_e_park:0 "Park sprzętu na chodzie"
 WOS_woj_e_park_desc:0 "Mechanicy rozbierają trzy wozy, żeby uruchomić czwarty. Po miesiącu batalion ma kolumnę, która przejedzie przez Wawer w godzinę."
 WOS_woj_e_droga:0 "Droga na wschód"
 WOS_woj_e_droga_desc:0 "Trasa na Mińsk Mazowiecki to jedyna droga, którą przychodzą zaopatrzenie i uciekinierzy. Posterunek na granicy miasta sprawdza jedno i drugie."
 WOS_woj_d_zandarmeria:0 "Żandarmeria wraca do koszar"
 WOS_woj_d_zandarmeria_desc:0 "Patrole żandarmerii sprawdzają magazyny i listy obecności. Kilku chorążych trafia do aresztu za handel paliwem z Pruszkowem."
 WOS_woj_d_dezercje:0 "Koniec cichych dezercji"
 WOS_woj_d_dezercje_desc:0 "Kto odchodzi z jednostki, musi oddać broń i podpisać zwolnienie. Kto ucieka z bronią – trafia przed sąd. Liczba „przepustek bez powrotu” spada o połowę."
 WOS_woj_spor:0 "Spór generałów"
 WOS_woj_spor_desc:0 "Trzy kierunki obsadzone, łańcuch dowodzenia działa. Pozostaje pytanie, na które nie odpowie żaden regulamin: komu tak naprawdę podlega Wojsko Polskie w Warszawie?"
 WOS_woj_cywilna:0 "Wojsko przywraca władzę cywilną"
 WOS_woj_cywilna_desc:0 "Generałowie stają przed posłami i urzędnikami Kancelarii jednocześnie. Armia gwarantuje bezpieczeństwo rozmów o wspólnym rządzie – ale nie weźmie udziału w wojnie żadnej ze stron."
 WOS_woj_rada_ocalenia:0 "Wojskowa Rada Ocalenia"
 WOS_woj_rada_ocalenia_desc:0 "Rada ogłasza się „tymczasowym organem władzy do czasu przywrócenia porządku konstytucyjnego”. Zwierzchnik z Belwederu dowiaduje się o tym z radia."
 WOS_woj_armia_rp:0 "Armia odrodzonej Rzeczypospolitej"
 WOS_woj_armia_rp_desc:0 "Proklamowano nowe państwo. Żołnierze garnizonu składają przysięgę na nowo – Rzeczypospolitej, nie frakcji. Z Garnizonu Warszawa powstaje pierwsza dywizja nowego wojska."
 WOS_idea_prg_otwarte:0 "Otwarte mosty"
 WOS_idea_prg_otwarte_desc:0 "Przez Most Gdański i Śląsko-Dąbrowski przejeżdżają wozy z towarem, ludzie chodzą do pracy na lewy brzeg. Praga zarabia na handlu, ale nie ma pełnej kontroli nad tym, kto do niej wchodzi."
 WOS_idea_prg_zamkniete:0 "Zamknięte mosty"
 WOS_idea_prg_zamkniete_desc:0 "Na każdym moście stoi zapora z betonowych bloków, a przejście wymaga przepustki od Rady. Praga jest bezpieczna – i coraz bardziej samotna."
 WOS_idea_prg_autonomia:0 "Autonomiczny prawy brzeg"
 WOS_idea_prg_autonomia_desc:0 "Praga uznaje wspólną władzę w mieście, ale ma własną radę, własną straż i prawo weta w sprawach dzielnic. Umowa jest zapisana – i wisi na drzwiach każdego ratusza."
 WOS_idea_prg_udzial:0 "Praga współtworzy stolicę"
 WOS_idea_prg_udzial_desc:0 "Radni z Grochowa, Bródna i Białołęki zasiadają w radzie całego miasta. Prawy brzeg nie jest już przedmieściem, tylko połową Warszawy."
 wos.161.t:0 "Konwent Prawego Brzegu"
 wos.161.d:0 "W sali widowiskowej na Pradze zbierają się delegaci wszystkich rad: Grochowa, Bródna, Żerania, Ząbkowskiej. Przewodnicząca konwentu czyta trzy wnioski. Pierwszy: pełna niezależność. Drugi: autonomia w ramach wspólnej władzy nad miastem. Trzeci: wejście do rady całej Warszawy na równych prawach. Głosowanie trwa do świtu."
 wos.161.a:0 "Wolna Praga. Nikt z lewego brzegu nie będzie nam rozkazywał."
 wos.161.b:0 "Autonomia: własna rada, własna straż, wspólna stolica."
 wos.161.c:0 "Pełny udział: Praga to połowa Warszawy, nie jej przedmieście."
 wos.162.t:0 "Praga proponuje wspólną stolicę"
 wos.162.d:0 "Delegacja Rady Prawego Brzegu przechodzi przez most z białą flagą i teczką dokumentów. Proponują, żeby Praga weszła do wspólnego zarządu miasta – z zachowaniem własnej rady dzielnic i straży. Warunek jest jeden: żadnych żołnierzy z lewego brzegu na Targowej."
 wos.162.a:0 "Przyjąć. Warszawa ma dwa brzegi."
 wos.162.b:0 "Odrzucić. Na naszych warunkach albo wcale."
 WOS_dec_prg_bazar:0 "Dzień targowy na Różyckim"
 WOS_dec_prg_bazar_desc:0 "Stragany od Ząbkowskiej po Targową. Handlarze płacą Radzie myto, a ludzie z lewego brzegu przychodzą po to, czego nie mają u siebie."
 WOS_dec_prg_prom:0 "Nocny prom przez Wisłę"
 WOS_dec_prg_prom_desc:0 "Kiedy mosty są zamknięte, przez rzekę płyną łodzie. Rada wie o tym i bierze swoją część – w zamian za to, że nikt nie strzela."
 WOS_tt_7:0 "Najsilniejszy ośrodek władzy w Warszawie (Sejm albo Pałac), z którym nie walczymy, dostaje propozycję wspólnej stolicy – zgoda: stajemy się jego podmiotem z własną radą."
 WOS_prg_rada:0 "Rada Dzielnic Prawego Brzegu"
 WOS_prg_rada_desc:0 "Delegaci z czterech dzielnic siadają przy jednym stole w budynku urzędu na Kłopotowskiego. Nikt nie chce oddać władzy, ale wszyscy wiedzą, że osobno Praga nie przetrwa zimy."
 WOS_prg_d_pn:0 "Praga Północ: Ząbkowska i Brzeska"
 WOS_prg_d_pn_desc:0 "Kamienice z dziurami po kulach z poprzedniej wojny i po kulach z tej. Na podwórkach działają kuchnie, warsztaty i straż sąsiedzka."
 WOS_prg_d_pd:0 "Praga Południe: Grochów i Saska Kępa"
 WOS_prg_d_pd_desc:0 "Grochów chce handlu z lewym brzegiem, Saska Kępa – spokoju. Obie części dzielnicy patrzą na Most Poniatowskiego z zupełnie innych stron."
 WOS_prg_d_targowek:0 "Targówek Fabryczny"
 WOS_prg_d_targowek_desc:0 "Hale magazynowe przy Radzymińskiej i resztki zakładów przemysłowych. Jeśli Praga ma coś produkować, to właśnie tutaj."
 WOS_prg_d_bialoleka:0 "Białołęka: ciepło z Żerania"
 WOS_prg_d_bialoleka_desc:0 "Elektrociepłownia Żerań to serce ciepłej wody dla połowy miasta. Kto ją kontroluje, ten decyduje, gdzie zimą będzie ciepło."
 WOS_prg_straze:0 "Straże sąsiedzkie"
 WOS_prg_straze_desc:0 "Każde podwórko ma swoją straż, każda kamienica – dyżurnego. Kiedy dzwoni dzwon na Kawęczyńskiej, wiadomo, że trzeba zejść na dół."
 WOS_prg_zaplecze:0 "Zaplecze prawego brzegu"
 WOS_prg_zaplecze_desc:0 "Hale z Targówka, ciepło z Żerania i ludzie z Grochowa. Praga może przetrwać oblężenie – byle nie trwało za długo."
 WOS_prg_m_straz:0 "Straż Mostowa"
 WOS_prg_m_straz_desc:0 "Na każdym przyczółku stoi posterunek Rady: kilka osób, radio i szlaban. Mosty to jedyna rzecz, której lewy brzeg potrzebuje od Pragi bardziej niż Praga od lewego brzegu."
 WOS_prg_m_myto:0 "Myto mostowe"
 WOS_prg_m_myto_desc:0 "Każdy wóz z towarem płaci przy szlabanie. Część pieniędzy idzie na kuchnie na Pradze, część – na broń. Na lewym brzegu mówią o „praskiej celnicy”."
 WOS_prg_m_otwarte:0 "Otwarte mosty"
 WOS_prg_m_otwarte_desc:0 "Szlabany zostają podniesione. Kto przechodzi, płaci myto albo pokazuje przepustkę z pracy. Praga staje się bazarem dla całego miasta."
 WOS_prg_m_zamkniete:0 "Zamknięte mosty"
 WOS_prg_m_zamkniete_desc:0 "Betonowe bloki, druty i zakaz przejścia nocą. Lewy brzeg może walczyć o stolicę – Praga nie będzie jego polem bitwy."
 WOS_prg_konwent:0 "Konwent Prawego Brzegu"
 WOS_prg_konwent_desc:0 "Dzielnice zjednoczone, mosty pod kontrolą. Delegaci wszystkich rad zbierają się, żeby zdecydować, czym będzie Praga po wojnie."
 WOS_prg_autonomia:0 "Autonomiczny prawy brzeg"
 WOS_prg_autonomia_desc:0 "Umowa z władzą nad miastem: Praga uznaje wspólny zarząd, a w zamian zachowuje radę, straż i prawo weta w sprawach dzielnic. To nie niepodległość – ale też nie kapitulacja."
 WOS_prg_udzial:0 "Praga współtworzy stolicę"
 WOS_prg_udzial_desc:0 "Rada Prawego Brzegu wysyła delegację na drugi brzeg z propozycją wspólnego zarządu miasta. Praga nie chce być podbita – chce być współgospodarzem."
 WOS_prg_wolna:0 "Deklaracja niepodległości Pragi"
 WOS_prg_wolna_desc:0 "Konwent głosował za pełną niezależnością. Na ratuszu przy Kłopotowskiego zawisa nowa flaga, a Rada ogłasza, że prawy brzeg nie uzna żadnej władzy, której sam nie wybierze."
 WOS_prg_a_batalion:0 "Batalion Praski"
 WOS_prg_a_batalion_desc:0 "Straż bazaru i ochotnicy z podwórek zostają jednym batalionem z własnym sztabem w dawnej szkole na Kawęczyńskiej."
 WOS_prg_a_strzelnica:0 "Strzelnica na Kawęczyńskiej"
 WOS_prg_a_strzelnica_desc:0 "Piwnica szkoły zamienia się w strzelnicę. Każdy ochotnik oddaje sto strzałów, zanim dostanie własny karabin."
 WOS_prg_a_arsenal:0 "Arsenał na Żeraniu"
 WOS_prg_a_arsenal_desc:0 "Hale przy porcie żerańskim mieszczą broń, amunicję i warsztat. Praga ma wreszcie własny magazyn, a nie tylko piwnice."
 WOS_prg_a_drugi:0 "Drugi batalion: Grochów"
 WOS_prg_a_drugi_desc:0 "Grochów wystawia własny batalion. Dwa bataliony to już pułk – i argument w każdej rozmowie z lewym brzegiem."
 WOS_prg_a_pulk:0 "Pułk Obrony Prawego Brzegu"
 WOS_prg_a_pulk_desc:0 "Bataliony, strzelnica i arsenał pod jednym dowództwem. Pułk broni mostów, a nie polityków – i wszyscy w mieście o tym wiedzą."
 WOS_idea_zie_siec:0 "Sieć kooperatyw"
 WOS_idea_zie_siec_desc:0 "Ogrody, warsztaty, studnie i kurierzy rowerowi połączeni jednym systemem wymiany. Bielany produkują mniej, niż zjadają – ale z każdym miesiącem mniej."
 WOS_idea_zie_ekokomuna:0 "Ekokomuna Bielańska"
 WOS_idea_zie_ekokomuna_desc:0 "Żadnego handlu z tymi, którzy palą las albo strzelają do sąsiadów. Bielany żyją z tego, co same wyhodują – skromnie, ale po swojemu."
 WOS_idea_zie_federacja:0 "Federacja kooperatyw"
 WOS_idea_zie_federacja_desc:0 "Bielańskie kooperatywy łączą się z praskimi radami i powiślańskimi spółdzielniami. Wymiana towarów idzie przez trzy dzielnice, a decyzje – przez trzy zgromadzenia."
 WOS_tb_zie:0 "Laboratoria uniwersyteckie"
 wos.171.t:0 "Las czy piece?"
 wos.171.d:0 "Zima idzie szybciej, niż rosną zapasy. Pragmatycy z kooperatywy opałowej chcą wyciąć część Lasu Bielańskiego i handlować z każdym, kto ma węgiel – nawet z Pruszkowem. Radykałowie odpowiadają, że las jest ostatnią rzeczą, której nikt im jeszcze nie odebrał, i że handel z Rodziną to koniec ruchu. Zgromadzenie musi zagłosować."
 wos.171.a:0 "Pragmatycy: wycinka pod nadzorem i handel z każdym, kto uczciwie płaci."
 wos.171.b:0 "Radykałowie: las zostaje, a z mafią nie handlujemy."
 wos.171.c:0 "Kompromis: zbieramy tylko suche drewno i szukamy partnerów w innych dzielnicach."
 wos.172.t:0 "Kooperatywa się kłóci"
 wos.172.d:0 "Na zebraniu kooperatywy ogrodowej dochodzi do awantury: ktoś sprzedawał warzywa „na boku” do Śródmieścia. Połowa chce go wykluczyć, połowa mówi, że bez handlu nikt nie przeżyje zimy."
 wos.172.a:0 "Wykluczyć. Zasady są dla wszystkich."
 wos.172.b:0 "Ustalić limit handlu na zewnątrz i zapisać go w regulaminie."
 WOS_dec_zie_wymiana:0 "Jarmark wymiany przy AWF"
 WOS_dec_zie_wymiana_desc:0 "Ziemniaki za rowery, słoiki za baterie, naprawa butów za lekcje matematyki. Pieniądze nic nie znaczą – liczy się to, co kto umie."
 WOS_req_m_min_25:0 "Wskaźnik frakcji (panel „Warszawa: walka o stolicę”) co najmniej 25"
 WOS_dec_zie_szklarnie:0 "Zimowe szklarnie"
 WOS_dec_zie_szklarnie_desc:0 "Folia, palety i ciepło z kompostu. W styczniu na Bielanach rośnie szczypiorek i rzodkiewka."
 WOS_tt_8:0 "Jeśli Liga Wolnych Dzielnic działa, jej członkowie zyskują lepszą opinię o nas, a Liga przyjmuje statut federacji (otwiera to Powiślu zakończenie „Federacja Wolnych Dzielnic”)."
 WOS_zie_zgromadzenie:0 "Zgromadzenie kooperatyw"
 WOS_zie_zgromadzenie_desc:0 "W hali sportowej przy Marymonckiej zbierają się przedstawiciele ogrodów, warsztatów i podwórek. Każdy ma jeden głos – i każdy ma coś do powiedzenia."
 WOS_zie_k_dzialki:0 "Działki na Marymoncie"
 WOS_zie_k_dzialki_desc:0 "Rodzinne ogródki działkowe zamieniają się w pola uprawne. Altanki są magazynami, a ich właściciele – pierwszymi rolnikami nowej Warszawy."
 WOS_zie_k_studnie:0 "Studnie oligoceńskie"
 WOS_zie_k_studnie_desc:0 "Stare publiczne studnie głębinowe znów mają kolejki. Kooperatywa wodna pilnuje pomp i rozlicza każde wiadro."
 WOS_zie_k_awf:0 "Magazyn w hali AWF"
 WOS_zie_k_awf_desc:0 "Hala sportowa akademii wychowania fizycznego mieści teraz zapasy na zimę: worki z ziemniakami, słoiki i opał. Studenci pilnują wejścia na zmiany."
 WOS_zie_k_rowery:0 "Kurierzy rowerowi"
 WOS_zie_k_rowery_desc:0 "Rower nie potrzebuje paliwa. Kurierzy kooperatywy wożą listy, leki i części między Bielanami a resztą miasta – i wiedzą, co się dzieje w każdej dzielnicy."
 WOS_zie_k_laboratorium:0 "Laboratoria uniwersyteckie"
 WOS_zie_k_laboratorium_desc:0 "Kampus uniwersytecki przy Dewajtis ma laboratoria, generator i ludzi, którzy wiedzą, jak zrobić biogaz z odpadów. Teraz mają też powód."
 WOS_zie_k_biogaz:0 "Biogazownia z odpadów"
 WOS_zie_k_biogaz_desc:0 "Kompost, odpady z kuchni i resztki z targów zamieniają się w gaz, a gaz – w prąd dla dwóch szkół i ośrodka zdrowia."
 WOS_zie_siec:0 "Sieć kooperatyw"
 WOS_zie_siec_desc:0 "Ogrody, studnie, magazyn, kurierzy i biogazownia działają jak jeden organizm. Bielany wciąż są biedne – ale coraz mniej zależne od kogokolwiek."
 WOS_zie_las:0 "Las czy piece?"
 WOS_zie_las_desc:0 "Zima pokazuje granice samowystarczalności. Ruch musi zdecydować, czy przetrwa za wszelką cenę, czy zostanie wierny temu, po co powstał."
 WOS_zie_ekokomuna:0 "Ekokomuna Bielańska"
 WOS_zie_ekokomuna_desc:0 "Radykałowie wygrali. Bielany zamykają się na handel z mafią i z wojującymi frakcjami. Kooperatywy żyją z tego, co mają – i nikt nie musi się z tego tłumaczyć."
 WOS_zie_federacja:0 "Federacja kooperatyw"
 WOS_zie_federacja_desc:0 "Pragmatycy proponują to, czego nie zrobiła żadna frakcja: wymianę zamiast wojny. Kooperatywy Bielan łączą się z radami Pragi i spółdzielniami Powiśla w jedną federację."
 WOS_zie_republika:0 "Zielona Republika Bielan"
 WOS_zie_republika_desc:0 "Bielany ogłaszają się niezależną wspólnotą: ze swoją radą, strażą i Lasem Bielańskim jako granicą. Pragmatycy dostają handel, radykałowie – las nietknięty na wieki."
 WOS_zie_a_batalion:0 "Batalion Leśny"
 WOS_zie_a_batalion_desc:0 "Straż Lasu Bielańskiego dostaje mundury w kolorze mchu i etat batalionu. Znają każdą ścieżkę między Marymontem a Wisłą."
 WOS_zie_a_strzelcy:0 "Strzelcy z Lasu Bielańskiego"
 WOS_zie_a_strzelcy_desc:0 "Myśliwi i sportowcy z AWF uczą młodszych strzelać z dystansu. Las staje się najlepiej bronionym kawałkiem Warszawy."
 WOS_zie_a_warsztat:0 "Warsztat na Marymoncie"
 WOS_zie_a_warsztat_desc:0 "Spółdzielnia ślusarzy naprawia broń z demobilu i dorabia części. Wszystko jest wymieniane w barterze – nawet amunicja."
 WOS_zie_a_drugi:0 "Drugi batalion: Wawrzyszew"
 WOS_zie_a_drugi_desc:0 "Osiedla na Wawrzyszewie wystawiają drugi batalion. Kooperatywy żywią go same – bez żołdu, za udział w zbiorach."
 WOS_zie_a_pulk:0 "Zielona Gwardia Bielan"
 WOS_zie_a_pulk_desc:0 "Bataliony, strzelcy i warsztat w jednej formacji. Gwardia nie atakuje – ale nikt, kto wejdzie do lasu bez zaproszenia, nie wyjdzie z niego łatwo."
 WOS_idea_tec_mozaika:0 "Mozaika rad"
 WOS_idea_tec_mozaika_desc:0 "Rada lokatorów, rada kuchni, rada bulwarów, rada szpitala. Każda decyduje o swoim kawałku dzielnicy, a wszystkie razem – o Powiślu."
 WOS_idea_tec_federacja:0 "Federacja Wolnych Dzielnic"
 WOS_idea_tec_federacja_desc:0 "Powiśle, Praga i Bielany mają wspólny statut i osobne rady. Federacja nie ma stolicy – ma trzy zgromadzenia i jedną zasadę: nikt nie decyduje za innych."
 WOS_idea_tec_demokracja:0 "Demokratyczna Warszawa"
 WOS_idea_tec_demokracja_desc:0 "Powiśle nie chce rządzić miastem – chce, żeby miasto wybrało, kto ma nim rządzić. Lokale wyborcze w szkołach, komisje z ochotników i listy wyborców spisane od nowa."
 wos.181.t:0 "Głosowanie na Tamce"
 wos.181.d:0 "Sala gimnastyczna szkoły przy Drewnianej jest pełna. Głosują wszystkie rady razem: lokatorzy, kuchnie, bulwary, szpital. Trzy wnioski wiszą na tablicy: Powiśle niezależne i samowystarczalne; federacja z innymi wolnymi dzielnicami; albo coś, czego jeszcze nikt nie próbował – wolne wybory w całym mieście."
 wos.181.a:0 "Wolne Powiśle: najpierw nasza dzielnica, potem reszta świata."
 wos.181.b:0 "Federacja: razem z Pragą i Bielanami, na równych prawach."
 wos.181.c:0 "Wybory dla całej Warszawy. Niech miasto samo zdecyduje."
 wos.182.t:0 "Powiśle proponuje wybory"
 wos.182.d:0 "Kurierzy z Powiśla przynoszą list podpisany przez wszystkie rady dzielnicy: propozycję wyborów w całej Warszawie, z komisjami złożonymi z ochotników i obserwatorami z każdej strony. Do listu dołączono gotową ordynację, wydrukowaną na powielaczu."
 wos.182.a:0 "Poprzeć. Niech ludzie zdecydują – a my powalczymy o ich głosy."
 wos.182.b:0 "Odrzucić. Wybory w czasie wojny to fikcja."
 wos.183.t:0 "Puste krzesła"
 wos.183.d:0 "Na zebranie rady lokatorów przyszło sześć osób. Ludzie są zmęczeni, głodni i nie wierzą, że głosowanie cokolwiek zmieni. Przewodniczący pyta, czy nie lepiej, żeby decyzje podejmował zarząd – „tylko do wiosny”."
 wos.183.a:0 "Nie. Zebrania zostają otwarte – przeniesiemy je do kuchni społecznych."
 wos.183.b:0 "Zarząd do wiosny. Rady wrócą, kiedy będzie cieplej."
 WOS_dec_tec_zebranie:0 "Otwarte zebranie na bulwarach"
 WOS_dec_tec_zebranie_desc:0 "Krzesła z kawiarni, megafon na akumulator i lista spraw na tablicy. Kto przyjdzie, ten decyduje."
 WOS_dec_tec_apel:0 "Apel do mieszkańców całego miasta"
 WOS_dec_tec_apel_desc:0 "Ulotki zrzucane z mostów i nadawane przez radio studenckie: Powiśle zaprasza wszystkich, którzy mają dość wojny."
 WOS_tt_9:0 "Każda frakcja Warszawy, z którą nie walczymy, dostaje propozycję wyborów w całym mieście. Poparcie poprawia jej opinię o nas."
 WOS_req_m_min_65:0 "Wskaźnik frakcji (panel „Warszawa: walka o stolicę”) co najmniej 65"
 WOS_tec_zebranie:0 "Pierwsze zebranie na Tamce"
 WOS_tec_zebranie_desc:0 "Nikt nie wie, kto zwołał to zebranie, ale przyszło trzysta osób. Do rana powstały cztery rady i jedna zasada: decyzje podejmuje się na głos, przy wszystkich."
 WOS_tec_lokatorzy:0 "Rada Lokatorów z Tamki"
 WOS_tec_lokatorzy_desc:0 "Kamienice przy Tamce i Dobrej wybierają swoich przedstawicieli na klatkach schodowych. Pierwsza uchwała: nikt nie zostanie eksmitowany w czasie wojny."
 WOS_tec_kuchnie:0 "Rada Kuchni Społecznych"
 WOS_tec_kuchnie_desc:0 "Pięć kuchni, dwie zmiany dziennie, grafik wywieszony na drzwiach kościoła. Rada pilnuje, żeby jedzenie trafiało do tych, którzy go najbardziej potrzebują."
 WOS_tec_bulwary:0 "Rada Bulwarów"
 WOS_tec_bulwary_desc:0 "Bulwary nad Wisłą to teraz targ, przystań i punkt obserwacyjny jednocześnie. Rada decyduje, kto może tu handlować – i kto pilnuje rzeki nocą."
 WOS_tec_biblioteka:0 "Czytelnia w bibliotece uniwersyteckiej"
 WOS_tec_biblioteka_desc:0 "Biblioteka uniwersytecka na Dobrej ma ogród na dachu, grube mury i agregat. Teraz ma też otwartą czytelnię, kursy pierwszej pomocy i biuro rady."
 WOS_tec_kopernik:0 "Generatory z Centrum Nauki"
 WOS_tec_kopernik_desc:0 "Pracownicy centrum nauki nad Wisłą uruchamiają generatory i panele z wystaw. Prądu starczy na kilka kamienic i jedno radio."
 WOS_tec_solec:0 "Szpital na Solcu"
 WOS_tec_solec_desc:0 "Szpital przy Solcu działa na agregatach i darach. Rada szpitala ustala, kogo leczy się najpierw – i nikt nie pyta, z której frakcji jest pacjent."
 WOS_tec_gazeta:0 "Gazeta ścienna Powiśla"
 WOS_tec_gazeta_desc:0 "Co rano na murach pojawia się nowa gazeta: uchwały rad, ceny na bazarze, lista zaginionych. Ludzie wiedzą, co się dzieje, zanim usłyszą plotki."
 WOS_tec_szkoly:0 "Szkoły otwarte po godzinach"
 WOS_tec_szkoly_desc:0 "Po lekcjach szkoły zamieniają się w świetlice, punkty zbiórek i sale zebrań. Każdy rodzic jest teraz trochę radnym."
 WOS_tec_mediacje:0 "Sąd sąsiedzki"
 WOS_tec_mediacje_desc:0 "Spory o mieszkania, kradzieże i bójki rozstrzyga trzech sąsiadów wybranych losowo. Wyroki są łagodne, ale szanowane – bo każdy może być następnym sędzią."
 WOS_tec_mozaika:0 "Mozaika rad"
 WOS_tec_mozaika_desc:0 "Dziewięć rad, jedna dzielnica. Każda pilnuje swojego, a wszystkie razem tworzą coś, czego nie ma nigdzie indziej w Warszawie: władzę, której nikt się nie boi."
 WOS_tec_glosowanie:0 "Zgromadzenie ogólne"
 WOS_tec_glosowanie_desc:0 "Wszystkie rady w jednej sali. Powiśle przetrwało – teraz musi zdecydować, czy chce być wyspą, częścią archipelagu, czy zaczynem nowego miasta."
 WOS_tec_federacja:0 "Federacja Wolnych Dzielnic"
 WOS_tec_federacja_desc:0 "Wspólny statut z Pragą i Bielanami: każda dzielnica ma swoją radę, a federacja – wspólną obronę i wspólny rynek. Pierwsza władza w Warszawie, która powstała z umowy, a nie z wojny."
 WOS_tec_demokracja:0 "Demokratyczna Warszawa"
 WOS_tec_demokracja_desc:0 "Powiśle wysyła ordynację wyborczą do wszystkich ośrodków władzy w mieście. Nie ma armii, która mogłaby ją narzucić – ma tylko ludzi, którzy przyszli na zebrania i chcą, żeby to samo mogło się wydarzyć w całej Warszawie."
 WOS_tec_a_batalion:0 "Batalion Studencki"
 WOS_tec_a_batalion_desc:0 "Studenci z akademików przy Dobrej i Tamce tworzą batalion. Pierwszy rozkaz dzienny jest napisany w formie uchwały rady."
 WOS_tec_a_kursy:0 "Kursy w salach wykładowych"
 WOS_tec_a_kursy_desc:0 "Rezerwiści prowadzą zajęcia z taktyki w salach, w których jeszcze rok temu odbywały się wykłady z prawa. Notatki są równie dokładne."
 WOS_tec_a_warsztat:0 "Warsztaty w dawnej elektrowni"
 WOS_tec_a_warsztat_desc:0 "Hale dawnej elektrowni na Powiślu zamieniają się w warsztat: naprawa broni, radiostacji i samochodów."
 WOS_tec_a_drugi:0 "Drugi batalion: Solec"
 WOS_tec_a_drugi_desc:0 "Mieszkańcy Solca i Czerniakowa wystawiają drugi batalion. Każda kompania wybiera swojego dowódcę w głosowaniu."
 WOS_tec_a_pulk:0 "Gwardia Rad Powiśla"
 WOS_tec_a_pulk_desc:0 "Bataliony pod dowództwem wybieranym przez zgromadzenie dzielnicy. Pierwsza armia w Warszawie, która odpowiada przed radami."
 IVR_s_samorzady:0 "Samorządy odtworzone"
 IVR_s_samorzady_desc:0 "Rady gmin i powiatów znów decydują o szkołach, drogach i wodzie. Warszawa nie musi wszystkiego robić sama."
 IVR_s_trybunal:0 "Trybunał i sądy"
 IVR_s_trybunal_desc:0 "Ustawy przechodzą kontrolę konstytucyjną, a wyroki są publikowane. Wolniej – ale nikt nie podważa decyzji państwa."
 IVR_s_wot:0 "Obrona Terytorialna IV RP"
 IVR_s_wot_desc:0 "Ochotnicy z każdej gminy ćwiczą w weekendy i bronią swoich miejscowości. Armia obywatelska, nie gwardia."
 IVR_s_f_parlament:0 "Rzeczpospolita Parlamentarna"
 IVR_s_f_parlament_desc:0 "Wybory co cztery lata, rząd odpowiedzialny przed Sejmem, wolne media i niezawisłe sądy. Państwo odbudowane według najstarszej polskiej recepty: przez parlament."
 IVR_s_f_federacja:0 "Rzeczpospolita Federalna"
 IVR_s_f_federacja_desc:0 "Ziemie mają własne sejmiki i budżety, a Senat Ziem decyduje o sprawach wspólnych. Polska składa się z regionów, które same zdecydowały, że chcą być razem."
 IVR_s_f_ocalenie:0 "Rząd Ocalenia Narodowego"
 IVR_s_f_ocalenie_desc:0 "Większość się rozpadła, więc kluby oddały władzę rządowi nadzwyczajnemu. Sejm zbiera się raz w miesiącu, żeby przedłużyć jego mandat."
 ivr.3.t:0 "Komisja Prawdy i Rozliczeń"
 ivr.3.d:0 "Przed komisją staje pierwszy świadek: urzędnik, który przez rok podpisywał przepustki dla ciężarówek Rodziny. Za nim w kolejce czeka kilkuset następnych. Posłowie muszą zdecydować, czy chcą sądzić wszystkich, czy zamknąć ten rozdział."
 ivr.3.a:0 "Procesy dla wszystkich winnych. Bez wyjątków."
 ivr.3.b:0 "Amnestia dla małych, sąd dla dużych."
 ivr.3.c:0 "Zamknąć archiwa. Państwo potrzebuje ludzi, nie winnych."
 ivr.4.t:0 "Kryzys koalicyjny"
 ivr.4.d:0 "Dwa kluby wychodzą z sali w trakcie głosowania nad budżetem. W kuluarach mówi się o wotum nieufności, a w gazetach – o tym, że „parlamentaryzm się nie sprawdził”. Premier ma jedną noc na znalezienie większości."
 ivr.4.a:0 "Nowa umowa koalicyjna – ustępstwa dla mniejszych klubów."
 ivr.4.b:0 "Przedterminowe wybory. Niech zdecydują wyborcy."
 ivr.4.c:0 "Rząd mniejszościowy. Jakoś to będzie."
 IVR_dec_s_debata:0 "Debata nad orędziem"
 IVR_dec_s_debata_desc:0 "Premier przedstawia plan na najbliższy rok, a kluby przez dwa dni zadają pytania. Na końcu – głosowanie nad wotum zaufania."
 IVR_dec_s_konsultacje:0 "Konsultacje z samorządami"
 IVR_dec_s_konsultacje_desc:0 "Rząd wysyła projekt ustawy do gmin i powiatów. Odpowiedzi przychodzą po miesiącu – ale potem nikt nie może powiedzieć, że go nie zapytano."
 IVR_req_min_60:0 "Wskaźnik republiki (panel „IV Rzeczpospolita”) co najmniej 60"
 IVR_req_min_45:0 "Wskaźnik republiki (panel „IV Rzeczpospolita”) co najmniej 45"
 IVR_req_max_35:0 "Wskaźnik republiki (panel „IV Rzeczpospolita”) najwyżej 35"
 WOS_tt_10:0 "Odblokowuje panel decyzji „IV Rzeczpospolita” i wskaźnik republiki: Większość sejmowa."
 WOS_tt_11:0 "Pozostałe frakcje stolicy dostają wezwanie do rozwiązania. Zgoda: wcielenie bez walki. Odmowa: cel wojenny tylko wobec tej jednej frakcji."
 WOS_tt_12:0 "Cel wojenny tylko wobec jednego sąsiada, który odrzucił unię. Kolejni – następnymi celami drzewka, po zakończeniu wojny."
 IVS_s_samorzad:0 "Przywrócenie samorządów"
 IVS_s_samorzad_desc:0 "Pierwsza ustawa IV RP oddaje gminom ich rady i budżety. Wójtowie, którzy przez rok rządzili jak udzielni książęta, znów odpowiadają przed mieszkańcami."
 IVS_s_wojewodztwa:0 "Wybory do sejmików"
 IVS_s_wojewodztwa_desc:0 "Pierwsze wybory poza Warszawą. Lokale w remizach i szkołach, karty drukowane w Radomiu. Frekwencja jest niska, ale wynik – uznany przez wszystkich."
 IVS_s_senat:0 "Senat Ziem"
 IVS_s_senat_desc:0 "Druga izba składa się z przedstawicieli regionów, nie partii. Każda ziemia ma tyle samo głosów – Mazowsze i Podlasie, Kujawy i Ziemia Łódzka."
 IVS_s_fundusz:0 "Krajowy Fundusz Odbudowy"
 IVS_s_fundusz_desc:0 "Jedna ustawa, jeden fundusz i jedna lista priorytetów: prąd, woda, mosty, szpitale. Każda złotówka z funduszu ma swój numer w jawnym rejestrze."
 IVS_s_energia:0 "Ustawa o bezpieczeństwie energetycznym"
 IVS_s_energia_desc:0 "Elektrownie i ciepłownie wracają pod nadzór państwa, a ich naprawa ma pierwszeństwo przed wszystkim innym. Zima nie może się powtórzyć."
 IVS_s_koleje:0 "Odbudowa węzła kolejowego"
 IVS_s_koleje_desc:0 "Warszawa Zachodnia, Wschodnia i linia średnicowa. Pociągi to jedyny sposób, żeby państwo dotarło do każdej gminy szybciej niż plotka."
 IVS_s_budzet:0 "Pierwszy budżet IV RP"
 IVS_s_budzet_desc:0 "Budżet przechodzi w trzecim czytaniu, po dwóch tygodniach poprawek. Deficyt jest ogromny, ale jawny – i po raz pierwszy od rozpadu ktoś wie, ile państwo naprawdę ma."
 IVS_s_trybunal:0 "Trybunał odtworzony"
 IVS_s_trybunal_desc:0 "Sędziowie składają ślubowanie w sali, w której jeszcze niedawno spali żołnierze. Pierwsza sprawa: czy uchwały z czasów rozpadu mają moc prawną."
 IVS_s_komisja:0 "Komisja Prawdy i Rozliczeń"
 IVS_s_komisja_desc:0 "Kto współpracował z Rodziną, kto strzelał do sąsiadów, kto podpisywał przepustki? Państwo musi odpowiedzieć – albo świadomie nie pytać."
 IVS_s_media:0 "Rada mediów publicznych"
 IVS_s_media_desc:0 "Radio i telewizja publiczna dostają radę złożoną z przedstawicieli wszystkich klubów i dziennikarzy. Kłócą się codziennie – i właśnie o to chodziło."
 IVS_s_wot:0 "Obrona Terytorialna IV RP"
 IVS_s_wot_desc:0 "Każda gmina wystawia kompanię ochotników. Uczą się w weekendy, bronią swoich miejscowości i nie słuchają żadnej frakcji – tylko ustawy."
 IVS_s_akademia:0 "Akademia Sztuki Wojennej IV RP"
 IVS_s_akademia_desc:0 "Rembertów kształci pierwszy rocznik oficerów nowego państwa. Przysięgają Rzeczypospolitej i konstytucji – w tej kolejności."
 IVS_s_zbrojenia:0 "Ustawa o modernizacji armii"
 IVS_s_zbrojenia_desc:0 "Kontrakty jawne, przetargi otwarte, a każda dostawa kontrolowana przez komisję obrony. Broń przychodzi wolniej niż w państwach dekretów – ale nikt na niej nie zarabia po cichu."
 IVS_s_bruksela:0 "Delegacja do Brukseli"
 IVS_s_bruksela_desc:0 "Pierwsza oficjalna delegacja IV RP jedzie na Zachód z teczką dokumentów: konstytucja, ordynacja wyborcza, sprawozdanie komisji. Państwo prawa jest najlepszym argumentem."
 IVS_s_fundusze:0 "Fundusz odbudowy z Zachodu"
 IVS_s_fundusze_desc:0 "Pieniądze przychodzą z warunkami: jawne przetargi, niezależne sądy, wolne wybory. Dla Republiki Sejmowej to nie warunki, tylko program."
 IVS_s_konstytuanta:0 "Zgromadzenie Konstytucyjne"
 IVS_s_konstytuanta_desc:0 "Wszystkie kluby, Senat Ziem i delegaci regionów w jednej sali. Konstytucja z czasów rozpadu była tymczasowa – teraz trzeba zdecydować, jakim państwem ma być IV Rzeczpospolita na lata."
 IVS_s_f_parlament:0 "Rzeczpospolita Parlamentarna"
 IVS_s_f_parlament_desc:0 "Sejm uchwala konstytucję republiki parlamentarnej: rząd odpowiada przed izbą, prezydent ma tylko reprezentować, a wybory odbywają się co cztery lata – także w czasie kryzysu."
 IVS_s_f_federacja:0 "Rzeczpospolita Federalna"
 IVS_s_f_federacja_desc:0 "Senat Ziem staje się równorzędną izbą, a regiony dostają własne sejmiki i budżety. Polska nie jest już państwem jednej stolicy, tylko wspólnotą ziem, które same chcą być razem."
 IVS_s_f_ocalenie:0 "Rząd Ocalenia Narodowego"
 IVS_s_f_ocalenie_desc:0 "Większość się rozpadła, a kraj nie może czekać na kolejne wybory. Kluby przekazują władzę rządowi nadzwyczajnemu – na rok, który może trwać bardzo długo."
 IVS_s_obowiazek:0 "Ustawa o powszechnym obowiązku obrony"
 IVS_s_obowiazek_desc:0 "Sejm uchwala to, czego nie odważył się uchwalić żaden rząd przed rozpadem: każdy obywatel ma obowiązek obrony, a państwo – obowiązek go wyszkolić i uzbroić."
 IVS_s_brygady_ot:0 "Brygady OT w każdym województwie"
 IVS_s_brygady_ot_desc:0 "Kompanie gminne łączą się w brygady. Każde województwo ma swoją, z dowódcą zatwierdzonym przez komisję obrony Sejmu."
 IVS_s_artyleria:0 "Pułki artylerii"
 IVS_s_artyleria_desc:0 "Działa z magazynów rezerwy wracają do służby. Artylerzyści uczą się od emerytów, którzy pamiętają jeszcze poligony w Orzyszu."
 IVS_s_dywizja:0 "Pierwsza Dywizja Obywatelska"
 IVS_s_dywizja_desc:0 "Dywizja złożona z ochotników ze wszystkich regionów, dowodzona przez absolwentów Rembertowa. Pierwsza wielka jednostka, która przysięga Rzeczypospolitej, a nie frakcji."
 IVS_s_armia:0 "Armia IV Rzeczypospolitej"
 IVS_s_armia_desc:0 "Brygady, pułki i dywizje pod jednym dowództwem podległym ministrowi obrony, który odpowiada przed Sejmem. Armia obywatelska jest gotowa."
 IVS_e_wojna2:0 "Wojna o zjednoczenie – etap 2"
 IVS_e_wojna2_desc:0 "Poprzednia kampania się skończyła. Sztab wskazuje kolejnego sąsiada, który odrzuca unię – i tylko jego."
 IVS_e_wojna3:0 "Wojna o zjednoczenie – etap 3"
 IVS_e_wojna3_desc:0 "Poprzednia kampania się skończyła. Sztab wskazuje kolejnego sąsiada, który odrzuca unię – i tylko jego."
 IVS_e_wojna4:0 "Wojna o zjednoczenie – etap 4"
 IVS_e_wojna4_desc:0 "Poprzednia kampania się skończyła. Sztab wskazuje kolejnego sąsiada, który odrzuca unię – i tylko jego."
 IVS_n_neg_ozm:0 "Związek miast: Ożarów Mazowiecki"
 IVS_n_neg_ozm_desc:0 "Zamiast ofensywy – związek miast. Ożarów Mazowiecki to zachodni korytarz zaopatrzeniowy (Bronisze i DK92). Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVS_n_neg_grd:0 "Związek miast: Grodzisk Mazowiecki"
 IVS_n_neg_grd_desc:0 "Zamiast ofensywy – związek miast. Grodzisk Mazowiecki to logistyka i handel (węzeł kolejowy i hurtownie). Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVS_n_neg_psc:0 "Związek miast: Piaseczno"
 IVS_n_neg_psc_desc:0 "Zamiast ofensywy – związek miast. Piaseczno to południowe podejścia do stolicy. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVS_n_neg_otw:0 "Związek miast: Otwock"
 IVS_n_neg_otw_desc:0 "Zamiast ofensywy – związek miast. Otwock to schronienie dla ludności i zaplecze szpitalne. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVS_n_neg_wlm:0 "Związek miast: Wołomin"
 IVS_n_neg_wlm_desc:0 "Zamiast ofensywy – związek miast. Wołomin to lokalna polityka i walka o władzę w powiecie. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVR_p_dekrety:0 "Rządy dekretów"
 IVR_p_dekrety_desc:0 "Dekret ma moc ustawy od chwili ogłoszenia w radiu. Urzędnicy wykonują je szybko – bo wiedzą, że następny może dotyczyć ich."
 IVR_p_bbn:0 "Biuro Bezpieczeństwa Narodowego"
 IVR_p_bbn_desc:0 "Wszystkie służby raportują do jednego biura przy Pałacu. Prezydent wie o spiskach, zanim spiskowcy zdążą się umówić."
 IVR_p_koncern:0 "Państwowy koncern paliwowy"
 IVR_p_koncern_desc:0 "Rafineria, rurociągi i stacje pod jednym zarządem mianowanym dekretem. Paliwo jest tanie dla wojska i drogie dla wszystkich innych."
 IVR_p_f_republika:0 "Republika Prezydencka"
 IVR_p_f_republika_desc:0 "Silny prezydent wybierany w wyborach powszechnych, rząd mianowany przez Pałac, Sejm z prawem weta. Władza wykonawcza jest silna – ale ma kadencję."
 IVR_p_f_dyktatura:0 "Dyktatura komisaryczna"
 IVR_p_f_dyktatura_desc:0 "Stan wyjątkowy nie ma daty końcowej. Prezydent rządzi przez komisarzy w każdym województwie, a wybory odbędą się „po pełnej stabilizacji”."
 IVR_p_f_zgromadzenie:0 "Władza oddana Zgromadzeniu"
 IVR_p_f_zgromadzenie_desc:0 "Prezydent ogłosił, że jego misja się skończyła. Zgromadzenie Narodowe przejmuje władzę i przygotowuje wybory, a Pałac wraca do roli strażnika konstytucji."
 ivr.11.t:0 "Referendum konstytucyjne"
 ivr.11.d:0 "W lokalach wyborczych pilnowanych przez żandarmerię ludzie odpowiadają na jedno pytanie: czy akceptują konstytucję republiki prezydenckiej. Komisja ogłasza wyniki o świcie. (Ścieżka prezydenta w modzie jest fikcją.)"
 ivr.11.a:0 "Większość na „tak”. Konstytucja ma mandat."
 ivr.11.b:0 "Frekwencja poniżej połowy. Wynik ważny, ale słaby."
 ivr.11.c:0 "Większość na „nie”. Prezydent musi się z tym zmierzyć."
 ivr.12.t:0 "Opozycja na ulicach"
 ivr.12.d:0 "Kilkadziesiąt tysięcy ludzi idzie Krakowskim Przedmieściem pod Pałac. Niosą konstytucję z czasów sprzed rozpadu i żądają wyborów. Żandarmeria stoi w szyku i czeka na rozkaz."
 ivr.12.a:0 "Przyjąć delegację i zapowiedzieć wybory samorządowe."
 ivr.12.b:0 "Rozproszyć demonstrację. Państwo nie negocjuje z ulicą."
 ivr.12.c:0 "Przeczekać. Zmarzną i pójdą do domu."
 ivr.13.t:0 "Generałowie tracą cierpliwość"
 ivr.13.d:0 "Trzech dowódców okręgów prosi o spotkanie w cztery oczy. Mówią uprzejmie, ale jasno: armia nie będzie bronić władzy, która nie umie rządzić. Na biurku leży lista ich żądań."
 ivr.13.a:0 "Spełnić żądania. Wojsko dostaje budżet i ministerstwo."
 ivr.13.b:0 "Zdymisjonować całą trójkę. Dziś, przed obiadem."
 IVR_dec_p_oredzie:0 "Orędzie do narodu"
 IVR_dec_p_oredzie_desc:0 "Prezydent przemawia w radiu i telewizji jednocześnie. Kilka zdań o odbudowie, kilka o wrogach i jedno o tym, że Pałac nigdy nie zostawi ludzi samych."
 IVR_dec_p_komisarz:0 "Komisarz w opornym województwie"
 IVR_dec_p_komisarz_desc:0 "Wojewoda nie wykonuje dekretów, więc Pałac wysyła komisarza z żandarmerią. Dekrety zaczynają działać – a w województwie robi się cicho."
 IVR_req_min_50:0 "Wskaźnik republiki (panel „IV Rzeczpospolita”) co najmniej 50"
 IVR_req_min_75:0 "Wskaźnik republiki (panel „IV Rzeczpospolita”) co najmniej 75"
 WOS_tt_13:0 "Odblokowuje panel decyzji „IV Rzeczpospolita” i wskaźnik republiki: Autorytet Prezydenta."
 IVP_p_d1:0 "Dekret o stanie odbudowy"
 IVP_p_d1_desc:0 "Pierwszy dekret nowego ustroju ogłasza „stan odbudowy”: Pałac może przejmować budynki, pojazdy i magazyny na potrzeby państwa – z odszkodowaniem wypłacanym później."
 IVP_p_d2:0 "Dekret o mediach publicznych"
 IVP_p_d2_desc:0 "Radio i telewizja przechodzą pod zarząd rady mianowanej przez Prezydenta. Wiadomości są krótsze, spokojniejsze – i zawsze zaczynają się od Pałacu."
 IVP_p_d3:0 "Dekret o administracji wojewódzkiej"
 IVP_p_d3_desc:0 "Wojewodów mianuje i odwołuje Prezydent, a samorządy dostają „opiekunów” z Kancelarii. Decyzje zapadają szybko – i zawsze w Warszawie."
 IVP_p_d4:0 "Dekret o gospodarce strategicznej"
 IVP_p_d4_desc:0 "Energetyka, paliwa, koleje i zbrojeniówka zostają „sektorami strategicznymi”. Ich zarządy podlegają bezpośrednio Pałacowi."
 IVP_p_d5:0 "Dekret o obronie państwa"
 IVP_p_d5_desc:0 "Prezydent jest zwierzchnikiem sił zbrojnych w czasie pokoju i wojny, a minister obrony – jego pełnomocnikiem. Sztab Generalny przenosi się bliżej Pałacu."
 IVP_p_bbn:0 "Rada Bezpieczeństwa przy Pałacu"
 IVP_p_bbn_desc:0 "Wszystkie służby – wojskowe, cywilne i to, co zostało z policji – raportują do jednego biura. Prezydent dostaje teczkę na biurko codziennie o siódmej."
 IVP_p_zandarmeria:0 "Żandarmeria w miastach"
 IVP_p_zandarmeria_desc:0 "Patrole Żandarmerii Wojskowej w Łodzi, Radomiu i Siedlcach. Formalnie pilnują żołnierzy na przepustkach. W praktyce pilnują wszystkich."
 IVP_p_rezerwa:0 "Rezerwa Narodowa"
 IVP_p_rezerwa_desc:0 "Każdy mężczyzna do czterdziestego piątego roku życia ma przydział mobilizacyjny. Pałac liczy nie dywizje, tylko roczniki."
 IVP_p_armia:0 "Armia Prezydencka IV RP"
 IVP_p_armia_desc:0 "Gwardia, rezerwa i zawodowe jednostki pod jednym dowództwem. Armia składa przysięgę na konstytucję – i na wierność urzędowi Prezydenta."
 IVP_p_koncern:0 "Państwowy koncern paliwowy"
 IVP_p_koncern_desc:0 "Rafineria, magazyny i stacje paliw pod jednym zarządem. Wojsko tankuje bez kolejki, cywile – według przydziałów."
 IVP_p_zbrojeniowka:0 "Państwowy przemysł zbrojeniowy"
 IVP_p_zbrojeniowka_desc:0 "Zakłady w Radomiu, Stalowej Woli i Skarżysku – tam, gdzie sięga władza Pałacu – pracują na trzy zmiany według planu ogłoszonego dekretem."
 IVP_p_plan:0 "Centralny plan odbudowy"
 IVP_p_plan_desc:0 "Jeden plan, jeden harmonogram i jeden urząd, który go pilnuje. Mosty i elektrownie powstają szybko – szybciej niż tam, gdzie decyduje parlament."
 IVP_p_weterani:0 "Rada Weteranów"
 IVP_p_weterani_desc:0 "Żołnierze, strażacy i ochotnicy z czasów rozpadu dostają medale, renty i miejsce w radzie przy Pałacu. Kto bronił państwa, ten je teraz popiera."
 IVP_p_referendum:0 "Referendum konstytucyjne"
 IVP_p_referendum_desc:0 "Prezydent chce, żeby nowy ustrój miał mandat od ludzi, a nie tylko od wojska. Jedno pytanie, jedna odpowiedź – i ryzyko, że będzie to „nie”."
 IVP_p_f_republika:0 "Republika Prezydencka"
 IVP_p_f_republika_desc:0 "Konstytucja przyjęta w referendum daje Prezydentowi szerokie uprawnienia – i kadencję. Wybory prezydenckie odbędą się za pięć lat, a Sejm odzyskuje prawo weta."
 IVP_p_f_dyktatura:0 "Dyktatura komisaryczna"
 IVP_p_f_dyktatura_desc:0 "Stan wyjątkowy zostaje przedłużony bezterminowo. W każdym województwie rządzi komisarz Prezydenta, a referendum, wybory i Sejm mogą poczekać. (Ścieżka w modzie jest fikcją.)"
 IVP_p_f_zgromadzenie:0 "Przekazanie władzy Zgromadzeniu Narodowemu"
 IVP_p_f_zgromadzenie_desc:0 "Ludzie powiedzieli „nie” – albo Pałac sam uznał, że czas nadzwyczajny się skończył. Prezydent przekazuje władzę Zgromadzeniu Narodowemu, które przygotuje wolne wybory."
 IVP_p_akademia:0 "Akademia Prezydencka"
 IVP_p_akademia_desc:0 "Szkoła oficerska przy Pałacu przyjmuje pierwszy rocznik. Absolwenci dostają szable z rąk Prezydenta – i przydziały do jednostek, które mają pilnować dekretów."
 IVP_p_gwardia:0 "Dywizja Gwardii Prezydenckiej"
 IVP_p_gwardia_desc:0 "Gwardia z rdzenia państwa rośnie do rozmiarów dywizji: piechota, zwiad i żandarmeria. Jednostka pierwszego rzutu – i ostatniej obrony Pałacu."
 IVP_p_zmot:0 "Brygady zmotoryzowane"
 IVP_p_zmot_desc:0 "Ciężarówki z państwowego koncernu i terenówki z rekwizycji. Brygada zmotoryzowana dociera do każdego województwa w jeden dzień – tam, gdzie dekret potrzebuje wsparcia."
 IVP_p_artyleria:0 "Pułki artylerii dekretowej"
 IVP_p_artyleria_desc:0 "Dekret o obronie państwa przenosi całą artylerię rezerwy pod jedno dowództwo. Pułki dostają działa, amunicję i rozkaz ćwiczeń co tydzień."
 IVP_e_wojna2:0 "Wojna o jedność państwa – etap 2"
 IVP_e_wojna2_desc:0 "Poprzednia kampania się skończyła. Sztab wskazuje kolejnego sąsiada, który odrzuca unię – i tylko jego."
 IVP_e_wojna3:0 "Wojna o jedność państwa – etap 3"
 IVP_e_wojna3_desc:0 "Poprzednia kampania się skończyła. Sztab wskazuje kolejnego sąsiada, który odrzuca unię – i tylko jego."
 IVP_e_wojna4:0 "Wojna o jedność państwa – etap 4"
 IVP_e_wojna4_desc:0 "Poprzednia kampania się skończyła. Sztab wskazuje kolejnego sąsiada, który odrzuca unię – i tylko jego."
 IVP_n_neg_ozm:0 "Akt przyłączenia: Ożarów Mazowiecki"
 IVP_n_neg_ozm_desc:0 "Zamiast ofensywy – związek miast. Ożarów Mazowiecki to zachodni korytarz zaopatrzeniowy (Bronisze i DK92). Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVP_n_neg_grd:0 "Akt przyłączenia: Grodzisk Mazowiecki"
 IVP_n_neg_grd_desc:0 "Zamiast ofensywy – związek miast. Grodzisk Mazowiecki to logistyka i handel (węzeł kolejowy i hurtownie). Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVP_n_neg_psc:0 "Akt przyłączenia: Piaseczno"
 IVP_n_neg_psc_desc:0 "Zamiast ofensywy – związek miast. Piaseczno to południowe podejścia do stolicy. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVP_n_neg_otw:0 "Akt przyłączenia: Otwock"
 IVP_n_neg_otw_desc:0 "Zamiast ofensywy – związek miast. Otwock to schronienie dla ludności i zaplecze szpitalne. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVP_n_neg_wlm:0 "Akt przyłączenia: Wołomin"
 IVP_n_neg_wlm_desc:0 "Zamiast ofensywy – związek miast. Wołomin to lokalna polityka i walka o władzę w powiecie. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVR_m_przetargi:0 "Przetargi bez konkurencji"
 IVR_m_przetargi_desc:0 "Każdy przetarg ma jednego oferenta, a każda umowa – aneks. Budowy idą szybko, bo nikt nie składa odwołań."
 IVR_m_ochrona:0 "Praskie agencje ochrony"
 IVR_m_ochrona_desc:0 "Sklepy, stacje i bazary płacą co miesiąc. Kradzieży prawie nie ma – kto by śmiał."
 IVR_m_bojowki:0 "Bojówki w mundurach"
 IVR_m_bojowki_desc:0 "Ludzie z rodzin dostali mundury i stopnie. Strzelają dobrze, słuchają gorzej – ale zawsze wiedzą, kto płaci."
 IVR_m_f_holding:0 "Państwo-holding"
 IVR_m_f_holding_desc:0 "Rzeczpospolita działa jak spółka: zarząd, udziałowcy i dywidendy. Obywatele są klientami – dopóki płacą rachunki."
 IVR_m_f_oligarchia:0 "Republika oligarchów"
 IVR_m_f_oligarchia_desc:0 "Rodziny zamieniły się w koncerny, a szefowie – w prezesów z dyplomami. Wybory są, partie są, a wszystkie kampanie finansują te same nazwiska."
 IVR_m_f_upadek:0 "Państwo w rozsypce"
 IVR_m_f_upadek_desc:0 "Rodziny walczą o resztki, urzędy stoją puste, a w Pałacu nikt nie odbiera telefonów. Rzeczpospolita Rodzin istnieje tylko na pieczątkach."
 ivr.21.t:0 "Zjazd Rodzin"
 ivr.21.d:0 "Restauracja za miastem, zamknięta dla gości od rana. Przy jednym stole siadają szefowie trzech rodzin i ich prawnicy. Na stole leży mapa państwa podzielona flamastrem na strefy. Ktoś musi zdecydować, czy ta mapa zostanie podpisana."
 ivr.21.a:0 "Podział rynku. Każda rodzina dostaje swoje strefy i swoje ministerstwa."
 ivr.21.b:0 "Jeden szef nad wszystkimi. Reszta dostaje udziały, nie głos."
 ivr.21.c:0 "Zjazd kończy się strzelaniną na parkingu."
 ivr.22.t:0 "Ktoś mówi za dużo"
 ivr.22.d:0 "Dziennikarz tygodnika z Krakowa publikuje listę firm, które wygrały przetargi w ostatnim roku. Wszystkie mają tego samego księgowego. Telefon w gabinecie dzwoni od rana."
 ivr.22.a:0 "Kupić tygodnik razem z drukarnią."
 ivr.22.b:0 "Pozwolić mu pisać. Nikt i tak nie zrobi nic z tą listą."
 ivr.22.c:0 "Wysłać chłopaków, żeby porozmawiali z redakcją."
 ivr.23.t:0 "Wojna rodzin"
 ivr.23.d:0 "Koperty przestały przychodzić na czas, a w Ursusie ktoś podpalił hurtownię ludzi z Pragi. W ciągu tygodnia na ulicach ginie więcej ludzi niż przez cały poprzedni rok. Państwo Rodzin pęka wzdłuż rodzinnych szwów."
 ivr.23.a:0 "Zapłacić wszystkim podwójnie, żeby przestali strzelać."
 ivr.23.b:0 "Niech wygra silniejszy."
 IVR_dec_m_koperty:0 "Koperty dla rodzin"
 IVR_dec_m_koperty_desc:0 "Na koniec miesiąca każda rodzina dostaje swoją kopertę – grubszą, jeśli ostatnio była cierpliwa."
 IVR_dec_m_przyslugi:0 "Przysługa za przysługę"
 IVR_dec_m_przyslugi_desc:0 "Rodzina odpuszcza dług urzędnikowi z ministerstwa, a ministerstwo odpuszcza kontrolę w hurtowni. Wszyscy są zadowoleni."
 IVR_req_min_40:0 "Wskaźnik republiki (panel „IV Rzeczpospolita”) co najmniej 40"
 WOS_tt_14:0 "Podległe państwa odzyskują niezależność (bez wojny)."
 WOS_tt_15:0 "Odblokowuje panel decyzji „IV Rzeczpospolita” i wskaźnik republiki: Lojalność Rodzin."
 IVM_r_p_holding:0 "Ród z Pruszkowa: holding"
 IVM_r_p_holding_desc:0 "Kantory, myjnie i hurtownie zostają spółkami jednego holdingu z siedzibą w biurowcu przy Alejach. Zarząd zbiera się w poniedziałki, dywidendy wypłaca w gotówce."
 IVM_r_p_przetargi:0 "Przetargi bez konkurencji"
 IVM_r_p_przetargi_desc:0 "Każdy przetarg ma jednego oferenta i każdy zostaje rozstrzygnięty w tydzień. Budowy idą szybciej niż kiedykolwiek."
 IVM_r_p_bank:0 "Bank Rodzinny"
 IVM_r_p_bank_desc:0 "Pierwszy bank IV RP ma licencję, oddziały i pieniądze, których pochodzenia nikt nie bada. Kredyty dla przyjaciół, windykacja dla reszty."
 IVM_r_g_bazary:0 "Ród z Pragi: bazary"
 IVM_r_g_bazary_desc:0 "Bazary, targowiska i stragany od Targowej po Grochów płacą jedną stawkę. Ceny są wyższe, ale towar jest zawsze."
 IVM_r_g_ochrona:0 "Agencje ochrony z Pragi"
 IVM_r_g_ochrona_desc:0 "Agencje ochrony z Pragi obsługują sklepy w całym państwie. Kto płaci, ma spokój. Kto nie płaci, ma problem."
 IVM_r_g_wisla:0 "Barki na Wiśle"
 IVM_r_g_wisla_desc:0 "Port praski i barki płynące w górę i w dół rzeki. Celnicy patrzą w drugą stronę, a towar dociera tam, gdzie nie dociera kolej."
 IVM_r_u_hale:0 "Ród z Ursusa: hale"
 IVM_r_u_hale_desc:0 "Dawne hale fabryczne w Ursusie znów pracują – tym razem dla wojska. Kto zna kogo trzeba, ten dostaje zamówienie."
 IVM_r_u_bojowki:0 "Bojówki w mundurach"
 IVM_r_u_bojowki_desc:0 "Chłopcy z Ursusa dostają mundury, stopnie i przydziały do jednostek. Teraz są wojskiem – przynajmniej na papierze."
 IVM_r_u_warsztaty:0 "Warsztaty pancerne"
 IVM_r_u_warsztaty_desc:0 "W warsztatach przy torach mechanicy spawają pancerze do terenówek i ciężarówek. Wyglądają strasznie i jeżdżą zaskakująco dobrze."
 IVM_r_telewizja:0 "Telewizja Rodziny"
 IVM_r_telewizja_desc:0 "Kanał informacyjny pokazuje otwarcia mostów, przecinanie wstęg i uśmiechniętych ministrów. Wiadomości kryminalne zniknęły z ramówki."
 IVM_r_sedziowie:0 "Sędziowie na liście płac"
 IVM_r_sedziowie_desc:0 "Sprawy przeciw ludziom rodzin trafiają do „właściwych” wydziałów i kończą się umorzeniem. Reszta sądów działa normalnie – i to wystarcza, żeby wyglądało jak państwo."
 IVM_r_zjazd:0 "Zjazd Rodzin"
 IVM_r_zjazd_desc:0 "Trzy rody, jedno państwo i mapa podzielona flamastrem. Szefowie siadają przy jednym stole, żeby ustalić, jak Rzeczpospolita Rodzin będzie wyglądać po wojnie."
 IVM_r_f_holding:0 "Państwo-holding"
 IVM_r_f_holding_desc:0 "Rodziny podpisują umowę spółki. Rzeczpospolita ma zarząd, radę nadzorczą i udziałowców – a obywatele dostają usługi, dopóki płacą rachunki."
 IVM_r_f_oligarchia:0 "Legalizacja: republika oligarchów"
 IVM_r_f_oligarchia_desc:0 "Szefowie rodzin zostają prezesami koncernów, a ich prawnicy – posłami. Odbywają się wybory, ale wygrywają w nich zawsze ci sami sponsorzy. Interes został zalegalizowany do końca."
 IVM_r_f_upadek:0 "Upadek Rodziny"
 IVM_r_f_upadek_desc:0 "Wojna rodzin skończyła się tak, jak kończą się takie wojny: nikt nie wygrał. Urzędy stoją puste, a regiony przestają słuchać Warszawy. Rzeczpospolita Rodzin rozpada się na oczach wszystkich."
 IVM_r_u_najemnicy:0 "Najemnicy z zagranicy"
 IVM_r_u_najemnicy_desc:0 "Weterani z wojen na wschodzie, ochroniarze z Bałkanów i byli żołnierze kontraktowi. Kosztują dużo, ale umieją to, czego bojówki nie umieją."
 IVM_r_u_dywizja:0 "Dywizje Ochrony Rodziny"
 IVM_r_u_dywizja_desc:0 "Bojówki dostają etaty, sztandary i numery. Dywizje Ochrony pilnują granic państwa – i interesów tych, którzy je opłacają."
 IVM_r_u_kolumny:0 "Kolumny terenówek"
 IVM_r_u_kolumny_desc:0 "Opancerzone terenówki z warsztatów jeżdżą w kolumnach po dwadzieścia. Szybkie, głośne i zaskakująco skuteczne na wąskich drogach Mazowsza."
 IVM_r_u_kadry:0 "Kursy oficerskie dla rodzin"
 IVM_r_u_kadry_desc:0 "Synowie szefów idą do szkoły oficerskiej. Wracają z dyplomami, mundurami i znajomościami, które się przydadzą."
 IVM_r_u_armia:0 "Prywatna armia państwa"
 IVM_r_u_armia_desc:0 "Wszystkie oddziały rodzin pod jednym dowództwem i na jednej liście płac. Armia jest lojalna wobec tego, kto płaci – a płaci państwo, czyli Rodzina."
 IVM_e_wojna2:0 "Wojna o rynek – etap 2"
 IVM_e_wojna2_desc:0 "Poprzednia kampania się skończyła. Sztab wskazuje kolejnego sąsiada, który odrzuca unię – i tylko jego."
 IVM_e_wojna3:0 "Wojna o rynek – etap 3"
 IVM_e_wojna3_desc:0 "Poprzednia kampania się skończyła. Sztab wskazuje kolejnego sąsiada, który odrzuca unię – i tylko jego."
 IVM_e_wojna4:0 "Wojna o rynek – etap 4"
 IVM_e_wojna4_desc:0 "Poprzednia kampania się skończyła. Sztab wskazuje kolejnego sąsiada, który odrzuca unię – i tylko jego."
 IVM_n_neg_ozm:0 "Umowa z gminą: Ożarów Mazowiecki"
 IVM_n_neg_ozm_desc:0 "Zamiast ofensywy – związek miast. Ożarów Mazowiecki to zachodni korytarz zaopatrzeniowy (Bronisze i DK92). Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVM_n_neg_grd:0 "Umowa z gminą: Grodzisk Mazowiecki"
 IVM_n_neg_grd_desc:0 "Zamiast ofensywy – związek miast. Grodzisk Mazowiecki to logistyka i handel (węzeł kolejowy i hurtownie). Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVM_n_neg_psc:0 "Umowa z gminą: Piaseczno"
 IVM_n_neg_psc_desc:0 "Zamiast ofensywy – związek miast. Piaseczno to południowe podejścia do stolicy. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVM_n_neg_otw:0 "Umowa z gminą: Otwock"
 IVM_n_neg_otw_desc:0 "Zamiast ofensywy – związek miast. Otwock to schronienie dla ludności i zaplecze szpitalne. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 IVM_n_neg_wlm:0 "Umowa z gminą: Wołomin"
 IVM_n_neg_wlm_desc:0 "Zamiast ofensywy – związek miast. Wołomin to lokalna polityka i walka o władzę w powiecie. Jeśli przyjmie ofertę, zostanie naszym partnerem z własnym samorządem, a integracja będzie możliwa bez jednego strzału."
 GER_panel:0 "Niemcy wobec rozbitej Polski"
 GER_panel_desc:0 "Zależność Eurostaatów od Berlina – Pomorze: [?PMN.EUR_zaleznosc|0], Śląsk: [?SLS.EUR_zaleznosc|0], Wielkopolska: [?PSN.EUR_zaleznosc|0]\nWysoka zależność wzmacnia Berlin, ale rodzi opór. Niska otwiera Eurostaatom drogę do samodzielności.\nKoszt podporządkowania: każdy Eurostaat z zależnością powyżej 60 – władza polityczna −4% i stabilność −1,5% (teraz: [?GER_koszt|0]). Ochrona Eurostaatów w kursie „Tarcza Europy” kosztuje dobra konsumpcyjne (+1% za każdy)."
 GER_idea_porzadek:0 "Nowy porządek europejski"
 GER_idea_porzadek_desc:0 "Berlin nie czeka na Brukselę. Eurostaaty mają komisarzy, a granica na Odrze – zasady ustalane w jednym ministerstwie."
 GER_idea_tarcza:0 "Tarcza Europy"
 GER_idea_tarcza_desc:0 "Niemcy chronią sąsiadów, zamiast nimi rządzić. Bundeswehr stoi na Odrze, a pieniądze na odbudowę idą tam, gdzie działają wybrane władze."
 GER_idea_korpus:0 "Korpus Stabilizacyjny Wschód"
 GER_idea_korpus_desc:0 "Trzy brygady w stałej gotowości do działań za Odrą. Oficjalnie – misja stabilizacyjna. Dla sąsiadów – armia na granicy."
 GER_idea_flanka:0 "Wschodnia flanka"
 GER_idea_flanka_desc:0 "Rosja jest za Królewcem i za Bugiem. Każda niemiecka brygada na wschodzie to sygnał: tu kończy się strefa wpływów Moskwy."
 GER_idea_stowarzyszony:0 "Kraj stowarzyszony z Niemcami"
 GER_idea_stowarzyszony_desc:0 "Niemiecki budżet na odbudowę, doradcy w ministerstwach i wspólna granica celna. Rząd jest nasz – ale coraz mniej decyzji zapada u nas."
 GER_idea_opor_landy:0 "Opór w nowych landach"
 GER_idea_opor_landy_desc:0 "Na murach napisy po polsku, w urzędach strajki włoskie, w lasach pierwsze kryjówki. Wcielenie na papierze to jeszcze nie wcielenie w głowach."
 GER_idea_f_porzadek:0 "Nowy porządek nad Odrą i Wisłą"
 GER_idea_f_porzadek_desc:0 "Zachodnia Polska jest częścią niemieckiego porządku: prawo, pieniądz i wojsko mają jedno centrum. Działa sprawnie – i budzi coraz więcej oporu."
 GER_idea_f_regiony:0 "Europa regionów"
 GER_idea_f_regiony_desc:0 "Eurostaaty są partnerami, nie prowincjami. Wspólny rynek, wspólna obrona i prawo każdego regionu do własnej drogi."
 GER_idea_f_tarcza:0 "Bastion na wschodzie"
 GER_idea_f_tarcza_desc:0 "Tarcza Europy zamieniła się w sojusz obronny z własnym sztabem i armią. Niemcy są jego kręgosłupem."
 GER_tarcza_frakcja:0 "Tarcza Europy"
 ger.1.t:0 "Debata w Bundestagu: co z Polską?"
 ger.1.d:0 "Sala plenarna Reichstagu jest pełna. Opozycja żąda „porządku za Odrą”: komisarzy w Eurostaatach, kontroli granicy i armii gotowej do interwencji. Rząd federalny odpowiada, że Niemcy mają chronić sąsiadów, a nie nimi rządzić. Głosowanie wyznaczy kurs Berlina na lata."
 ger.1.a:0 "Nowy porządek europejski. Ktoś musi wziąć odpowiedzialność za chaos."
 ger.1.b:0 "Tarcza Europy. Chronimy, wspieramy – nie rządzimy."
 ger.10.t:0 "Komisarze z Berlina"
 ger.10.d:0 "Do budynku zarządu przyjeżdża delegacja z Berlina z nowym rozporządzeniem: komisarz federalny będzie zatwierdzał budżet, nominacje i każdą umowę z polskimi państwami. Urzędnicy pytają, czy to jeszcze autonomia."
 ger.10.a:0 "Przyjąć. Bez Berlina nie przetrwamy zimy."
 ger.10.b:0 "Złożyć protest. Statut gwarantuje nam samorząd."
 ger.11.t:0 "Kraj stowarzyszony?"
 ger.11.d:0 "Berlin proponuje, żeby nasz Eurostaat stał się krajem stowarzyszonym z federacją: niemiecki budżet na odbudowę, niemieccy doradcy w ministerstwach i wspólna granica celna – ale własny rząd i własna nazwa. Połowa mieszkańców mówi o bezpieczeństwie. Druga połowa – o końcu samodzielności."
 ger.11.a:0 "Przyjąć. Lepiej być blisko silnego państwa niż samemu w ruinie."
 ger.11.b:0 "Odrzucić. Jesteśmy tymczasowi z wyboru, nie na zawsze."
 ger.12.t:0 "Fundusz odbudowy z Berlina"
 ger.12.d:0 "Ambasador Niemiec przynosi propozycję: wieloletni fundusz odbudowy dla państwa, które ma wybrane władze i działające sądy. Warunek jest jeden – pieniądze idą przez jawne przetargi."
 ger.12.a:0 "Przyjąć z wdzięcznością."
 ger.12.b:0 "Odmówić. Nie będziemy zależni od Berlina."
 ger.13.t:0 "Tarcza Europy"
 ger.13.d:0 "Berlin ogłasza powstanie paktu obronnego z Eurostaatami i sąsiadami. Niemieckie brygady zajmują pozycje na Odrze i przy granicy z Obwodem Królewieckim. W Warszawie jedni mówią o ochronie, inni – o nowej granicy Europy."
 ger.13.a:0 "Zobaczymy, co z tego wyniknie."
 ger.14.t:0 "Interwencja stabilizacyjna"
 ger.14.d:0 "Kolumny Korpusu Stabilizacyjnego przekraczają Odrę. Berlin ogłasza, że celem jest wyłącznie ochrona Eurostaatu przed agresją – i że wojsko wróci, gdy tylko granice będą bezpieczne."
 ger.14.a:0 "Niech świat zobaczy, że Berlin dotrzymuje słowa."
 ger.15.t:0 "Strajk w Eurostaacie"
 ger.15.d:0 "Urzędnicy, kolejarze i nauczyciele w jednym z Eurostaatów odchodzą od pracy. Na transparentach: „Autonomia, nie protektorat”. Komisarz federalny dzwoni do Berlina z pytaniem, czy wezwać policję."
 ger.15.a:0 "Ustąpić: więcej samorządu, mniej komisarzy."
 ger.15.b:0 "Twardo: strajk jest nielegalny."
 ger.20.t:0 "Berlin proponuje wcielenie"
 ger.20.d:0 "Kanclerz przysyła list: tymczasowość się skończyła. Eurostaat może stać się częścią Republiki Federalnej – z niemieckim prawem, budżetem i armią. Komisarz czeka na odpowiedź. Na ulicach jedni mówią o bezpieczeństwie, inni o końcu polskiej ziemi."
 ger.20.a:0 "Zgoda. Wchodzimy do Republiki Federalnej."
 ger.20.b:0 "Nigdy. Ogłaszamy niepodległość."
 ger.21.t:0 "Eurostaat odrzuca wcielenie"
 ger.21.d:0 "Zarząd Eurostaatu ogłosił niepodległość i wypowiedział nam wojnę. Na granicy na Odrze padły pierwsze strzały."
 ger.21.a:0 "Przywrócić porządek."
 GER_dec_audyt:0 "Audyt w Eurostaatach"
 GER_dec_audyt_desc:0 "Kontrolerzy federalni przeglądają budżety, nominacje i umowy wszystkich zarządów tymczasowych. Każdy zarząd musi się wytłumaczyć."
 GER_dec_transza:0 "Transza funduszu odbudowy"
 GER_dec_transza_desc:0 "Pieniądze idą do Eurostaatów bez komisarzy – za to z raportem dla Bundestagu po roku."
 GER_dec_cwiczenia:0 "Ćwiczenia nad Odrą"
 GER_dec_cwiczenia_desc:0 "Dwie brygady ćwiczą przeprawy przez Odrę i obronę mostów. Po drugiej stronie rzeki ktoś na pewno patrzy."
 WOS_tt_16:0 "Cel wojenny wobec jednego państwa, które prowadzi wojnę z naszym Eurostaatem. Jeśli nikt go nie atakuje – tylko gotowość bojowa."
 WOS_tt_17:0 "Eurostaaty z zależnością od Berlina co najmniej 70 dostają propozycję stowarzyszenia (mogą odmówić). O wcieleniu Eurostaatów Berlin może rozmawiać dopiero w późnej grze (fokus „Jedno państwo nad Odrą”, od 2034)."
 WOS_tt_18:0 "Powstaje sojusz „Tarcza Europy” z państwami podległymi Berlinowi (gdy Niemcy nie należą do innego sojuszu)."
 WOS_tt_19:0 "IV Rzeczpospolita (jeśli istnieje) dostaje propozycję funduszu odbudowy."
 WOS_tt_20:0 "Eurostaaty z zależnością od Berlina poniżej 40 mogą ogłosić samodzielność (prośba trafi do Berlina)."
 GER_req_2034:0 "Najwcześniej w 2034 roku"
 GER_req_wcielono:0 "Co najmniej jeden Eurostaat został wcielony"
 WOS_tt_21:0 "Polskie Eurostaaty dostają propozycję wcielenia. Zgoda zależy od zależności od Berlina (powyżej 70 – prawie pewna, poniżej 30 – prawie wykluczona). Odmowa: niepodległość i wojna z Niemcami."
 WOS_tt_22:0 "Ziemie wcielonych Eurostaatów stają się rdzennymi ziemiami Niemiec. Przez rok opór w nowych landach."
 GER_b_rada:0 "Rada Bezpieczeństwa: sprawa polska"
 GER_b_rada_desc:0 "Kanclerz zwołuje Radę Bezpieczeństwa. Na stole leży mapa: trzy Eurostaaty pod niemieckim zarządem, kilkadziesiąt polskich państw za Odrą i Rosja, która przygląda się wszystkiemu z Królewca."
 GER_b_debata:0 "Debata w Bundestagu"
 GER_b_debata_desc:0 "Opozycja chce porządku za Odrą, rząd – ochrony sąsiadów. Bundestag musi zdecydować, jakim państwem Niemcy będą dla rozbitej Polski."
 GER_b_np_start:0 "Nowy porządek europejski"
 GER_b_np_start_desc:0 "Berlin bierze odpowiedzialność za chaos na wschodzie – i władzę, która z nią przychodzi. Eurostaaty przestają być tymczasowe."
 GER_b_np_komisarze:0 "Komisarze zamiast namiestników"
 GER_b_np_komisarze_desc:0 "Każdy Eurostaat dostaje komisarza federalnego z prawem weta wobec budżetu i nominacji. Lokalne zarządy mogą protestować – na piśmie."
 GER_b_np_granica:0 "Granica na Odrze pod kontrolą"
 GER_b_np_granica_desc:0 "Przejścia graniczne obsadza Policja Federalna, a każdy transport do polskich państw wymaga zezwolenia. Przemyt maleje, ale handel też."
 GER_b_np_korpus:0 "Korpus Stabilizacyjny Wschód"
 GER_b_np_korpus_desc:0 "Trzy brygady w stałej gotowości, sztab we Frankfurcie nad Odrą i rozkaz: chronić Eurostaaty przed każdym, kto je zaatakuje."
 GER_b_np_interwencja:0 "Interwencja stabilizacyjna"
 GER_b_np_interwencja_desc:0 "Jeśli którekolwiek polskie państwo napadnie na Eurostaat, Korpus wkroczy. Jedna wojna, jeden przeciwnik – i ani kroku dalej, niż trzeba."
 GER_b_np_kraje:0 "Kraje stowarzyszone"
 GER_b_np_kraje_desc:0 "Eurostaaty najbardziej zależne od Berlina dostają propozycję: status kraju stowarzyszonego z federacją. Zostają osobnymi państwami – ale z niemieckim budżetem i doradcami."
 GER_b_np_final:0 "Nowy porządek nad Odrą i Wisłą"
 GER_b_np_final_desc:0 "Zachodnia Polska jest częścią niemieckiego porządku – jako kraje stowarzyszone i protektoraty. Prawo, pieniądz i wojsko mają jedno centrum."
 GER_b_te_start:0 "Tarcza Europy"
 GER_b_te_start_desc:0 "Niemcy chronią sąsiadów, zamiast nimi rządzić. Eurostaaty zachowają samorząd, a Berlin da im armię i pieniądze na obronę."
 GER_b_te_samorzad:0 "Samorząd dla Eurostaatów"
 GER_b_te_samorzad_desc:0 "Zarządy tymczasowe stają się rządami regionalnymi z własnym budżetem. Komisarz federalny zostaje doradcą, a nie nadzorcą."
 GER_b_te_odra:0 "Bundeswehr na Odrze"
 GER_b_te_odra_desc:0 "Brygady obrony stoją po obu stronach Odry, a ich sztaby pracują razem z gwardiami Eurostaatów. Wspólne ćwiczenia, wspólna łączność, wspólne magazyny."
 GER_b_te_pakt:0 "Pakt obronny Tarczy"
 GER_b_te_pakt_desc:0 "Eurostaaty, Czechy i Litwa podpisują pakt: atak na jednego z członków jest atakiem na wszystkich. Pakt jest obronny – nikogo nie wciąga w cudzą wojnę zaczepną."
 GER_b_te_fundusz:0 "Fundusz Odbudowy Polski"
 GER_b_te_fundusz_desc:0 "Wieloletni fundusz dla polskiego państwa, które ma wybrane władze i działające sądy. Pieniądze za Odrę – ale tylko przez jawne przetargi."
 GER_b_te_flanka:0 "Wschodnia flanka"
 GER_b_te_flanka_desc:0 "Brygady przesuwają się na wschód, w stronę Królewca i Bugu. Moskwa dostaje jasny sygnał: tu kończy się jej strefa wpływów."
 GER_b_te_f_regiony:0 "Europa regionów"
 GER_b_te_f_regiony_desc:0 "Eurostaaty stają się partnerami Niemiec: mają własne rządy, prawo do wyboru drogi i miejsce we wspólnym rynku. Kto zechce, może kiedyś wrócić do odbudowanej Rzeczypospolitej."
 GER_b_te_f_bastion:0 "Bastion na wschodzie"
 GER_b_te_f_bastion_desc:0 "Tarcza Europy staje się trwałym sojuszem z własnym sztabem, magazynami i planem obrony od Bałtyku po Karpaty. Niemcy są jego kręgosłupem."
 GER_b_wcielenie:0 "Jedno państwo nad Odrą"
 GER_b_wcielenie_desc:0 "Tymczasowość trwa już kilka lat. Berlin proponuje Eurostaatom wcielenie do Republiki Federalnej – zgodzą się te, które najbardziej zależą od Niemiec. Pozostałe mogą wybrać wojnę."
 GER_b_woj_les:0 "Wojna z [LES.GetNameDef]"
 GER_b_woj_les_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [LES.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_woj_kls:0 "Wojna z [KLS.GetNameDef]"
 GER_b_woj_kls_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [KLS.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_woj_not:0 "Wojna z [NOT.GetNameDef]"
 GER_b_woj_not_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [NOT.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_woj_gnz:0 "Wojna z [GNZ.GetNameDef]"
 GER_b_woj_gnz_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [GNZ.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_woj_wmp:0 "Wojna z [WMP.GetNameDef]"
 GER_b_woj_wmp_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [WMP.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_woj_krj:0 "Wojna z [KRJ.GetNameDef]"
 GER_b_woj_krj_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [KRJ.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_woj_srd:0 "Wojna z [SRD.GetNameDef]"
 GER_b_woj_srd_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [SRD.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_woj_kpm:0 "Wojna z [KPM.GetNameDef]"
 GER_b_woj_kpm_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [KPM.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_woj_plk:0 "Wojna z [PLK.GetNameDef]"
 GER_b_woj_plk_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [PLK.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_woj_lwc:0 "Wojna z [LWC.GetNameDef]"
 GER_b_woj_lwc_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [LWC.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_woj_chj:0 "Wojna z [CHJ.GetNameDef]"
 GER_b_woj_chj_desc:0 "Granica Republiki Federalnej biegnie teraz wzdłuż ziem [CHJ.GetNameDef]. Jedna wojna, jeden przeciwnik."
 GER_b_landy:0 "Nowe landy nad Odrą i Wartą"
 GER_b_landy_desc:0 "Wcielone Eurostaaty stają się landami: wybory do landtagów, niemieckie sądy i urzędy. Mieszkańcy dostają paszporty – i nie wszyscy chcą je odebrać."
 GER_b_bundeswehr_warta:0 "Bundeswehra nad Wartą"
 GER_b_bundeswehr_warta_desc:0 "Garnizony w Szczecinie, Poznaniu i Wrocławiu przechodzą pod dowództwo Bundeswehry. Nowa granica wymaga nowych brygad."
 GER_dm_protektorat:0 "Koszty protektoratu nad Eurostaatami"
 WOS_tt_23:0 "Jeśli zależność od Berlina spadnie poniżej 30, wniosek o samodzielność trafia do Niemiec."
 EUR_autonomia_ratio:0 "Decyzje Eurostaatu"
 EUR_req_2031:0 "Najwcześniej w 2031 roku"
 WOS_tt_24:0 "Na propozycję wcielenia (od 2034) Eurostaat odpowie raczej odmową – i wojną z Niemcami."
 WOS_tt_25:0 "Na propozycję wcielenia (od 2034) Eurostaat odpowie raczej zgodą."
 EK_PMN_k_kurs:0 "Szczecin wobec kursu Berlina"
 EK_PMN_k_kurs_desc:0 "Berlin zmienia kurs, a Szczecin musi zdecydować, jak na to odpowie. Port, stocznia i terminal gazowy są zbyt ważne, żeby ktoś o nich zapomniał."
 EK_PMN_k_lojalnosc:0 "Port w niemieckim systemie"
 EK_PMN_k_lojalnosc_desc:0 "Port Szczecin–Świnoujście wchodzi do niemieckiego systemu celnego. Statki pływają, pieniądze płyną – a decyzje zapadają w Berlinie."
 EK_PMN_k_opor:0 "Cichy opór w Szczecinie"
 EK_PMN_k_opor_desc:0 "Urzędnicy wykonują polecenia komisarza powoli i dokładnie według przepisów. Po trzech miesiącach nikt w Berlinie nie wie, dlaczego nic nie działa."
 EK_PMN_k_obrona:0 "Straż Wybrzeża z Bundeswehrą"
 EK_PMN_k_obrona_desc:0 "Okręty Straży Wybrzeża ćwiczą z niemiecką marynarką na Zalewie Szczecińskim. Wspólne patrole, wspólna łączność i wspólny wróg za Bałtykiem."
 EK_PMN_k_samodzielnosc:0 "Referendum o przyszłości Pomorza"
 EK_PMN_k_samodzielnosc_desc:0 "Sejmik Pomorza uchwala, że o przyszłości regionu zdecydują jego mieszkańcy. Berlin dostaje uchwałę i prośbę o odpowiedź."
 EK_PMN_r_start:0 "Szczecin przed rozstrzygnięciem"
 EK_PMN_r_start_desc:0 "Za kilka lat Berlin zapyta, czy chcemy zostać częścią Republiki Federalnej. To, co zrobimy teraz, zdecyduje, jak odpowiemy – i czy ktoś nas wysłucha."
 EK_PMN_r_a1:0 "Statut wolnego portu"
 EK_PMN_r_a1_desc:0 "Własne przepisy, własne urzędy i mniej podpisów komisarza. Berlin traci trochę kontroli, my zyskujemy trochę swobody."
 EK_PMN_r_a2:0 "Rada Pomorza Zachodniego"
 EK_PMN_r_a2_desc:0 "Instytucje, które działają bez komisarza: sejmik, sądy, szkoły. Swoboda, której nie da się odebrać jednym rozporządzeniem."
 EK_PMN_r_i1:0 "Kapitał z Hamburga"
 EK_PMN_r_i1_desc:0 "Pieniądze z Niemiec budują fabryki i drogi. Każda inwestycja to także jeden powód mniej, żeby odmówić Berlinowi."
 EK_PMN_r_i2:0 "Wspólne prawo z Meklemburgią"
 EK_PMN_r_i2_desc:0 "Te same przepisy co w sąsiednim landzie: łatwiej handlować, łatwiej pracować – i łatwiej kiedyś wejść do federacji."
 EK_PMN_r_niezal:0 "Pomorze samo stanowi o sobie"
 EK_PMN_r_niezal_desc:0 "Postanowione: gdy Berlin zaproponuje wcielenie, odpowiemy „nie” – nawet jeśli będzie to oznaczało wojnę."
 EK_PMN_r_integr:0 "Pomorze przy Republice Federalnej"
 EK_PMN_r_integr_desc:0 "Postanowione: przyszłość regionu jest w Republice Federalnej. Gdy przyjdzie propozycja, będziemy gotowi ją przyjąć."
 EK_SLS_k_kurs:0 "Wrocław wobec kursu Berlina"
 EK_SLS_k_kurs_desc:0 "Berlin zmienia kurs. Wrocław ma miedź, fabryki i Odrę – i musi zdecydować, czy będzie partnerem, czy zapleczem."
 EK_SLS_k_lojalnosc:0 "Miedź dla niemieckiego przemysłu"
 EK_SLS_k_lojalnosc_desc:0 "Kombinat miedziowy podpisuje wieloletnie kontrakty z niemieckimi hutami. Pieniądze są pewne, ale o cenach decyduje kupujący."
 EK_SLS_k_opor:0 "Śląski upór"
 EK_SLS_k_opor_desc:0 "Komisarz dostaje raporty po śląsku, terminy przesuwają się o tydzień, a każda decyzja wraca do konsultacji. Opór bez jednego strzału."
 EK_SLS_k_obrona:0 "Straż Odrzańska z Bundeswehrą"
 EK_SLS_k_obrona_desc:0 "Straż Odrzańska i niemieckie brygady wspólnie pilnują mostów od Opola po Głogów. Śląsk po raz pierwszy od rozpadu czuje się bezpieczny."
 EK_SLS_k_samodzielnosc:0 "Śląsk na własny rachunek"
 EK_SLS_k_samodzielnosc_desc:0 "Wrocław ogłasza, że Śląsk chce decydować sam za siebie. Berlin dostaje wniosek – i całe miasto czeka na odpowiedź."
 EK_SLS_r_start:0 "Wrocław przed rozstrzygnięciem"
 EK_SLS_r_start_desc:0 "Za kilka lat Berlin zapyta, czy chcemy zostać częścią Republiki Federalnej. To, co zrobimy teraz, zdecyduje, jak odpowiemy – i czy ktoś nas wysłucha."
 EK_SLS_r_a1:0 "Miedź pod śląską kontrolą"
 EK_SLS_r_a1_desc:0 "Własne przepisy, własne urzędy i mniej podpisów komisarza. Berlin traci trochę kontroli, my zyskujemy trochę swobody."
 EK_SLS_r_a2:0 "Sejmik Dolnośląski z prawem weta"
 EK_SLS_r_a2_desc:0 "Instytucje, które działają bez komisarza: sejmik, sądy, szkoły. Swoboda, której nie da się odebrać jednym rozporządzeniem."
 EK_SLS_r_i1:0 "Niemieckie udziały w kombinacie"
 EK_SLS_r_i1_desc:0 "Pieniądze z Niemiec budują fabryki i drogi. Każda inwestycja to także jeden powód mniej, żeby odmówić Berlinowi."
 EK_SLS_r_i2:0 "Odrzańska wspólnota z Saksonią"
 EK_SLS_r_i2_desc:0 "Te same przepisy co w sąsiednim landzie: łatwiej handlować, łatwiej pracować – i łatwiej kiedyś wejść do federacji."
 EK_SLS_r_niezal:0 "Śląsk na własnych nogach"
 EK_SLS_r_niezal_desc:0 "Postanowione: gdy Berlin zaproponuje wcielenie, odpowiemy „nie” – nawet jeśli będzie to oznaczało wojnę."
 EK_SLS_r_integr:0 "Śląsk przy Republice Federalnej"
 EK_SLS_r_integr_desc:0 "Postanowione: przyszłość regionu jest w Republice Federalnej. Gdy przyjdzie propozycja, będziemy gotowi ją przyjąć."
 EUR_PSN_k_kurs:0 "Poznań wobec kursu Berlina"
 EUR_PSN_k_kurs_desc:0 "Berlin zmienia kurs. Poznań – najbliżej Odry i najdalej od Warszawy – musi zdecydować, co to dla niego znaczy."
 EUR_PSN_k_lojalnosc:0 "Wielkopolska jako wzorcowy Eurostaat"
 EUR_PSN_k_lojalnosc_desc:0 "Wielkopolska spełnia wszystkie standardy przed terminem i staje się wzorem dla innych Eurostaatów. Berlin jest zadowolony – Warszawa mniej."
 EUR_PSN_k_opor:0 "Poznańska praca organiczna"
 EUR_PSN_k_opor_desc:0 "Zamiast protestów – szkoły, spółdzielnie i własne instytucje. Wielkopolska buduje państwo od dołu, zanim ktokolwiek zauważy."
 EUR_PSN_k_obrona:0 "Gwardia Krajowa z Bundeswehrą"
 EUR_PSN_k_obrona_desc:0 "Gwardia Krajowa ćwiczy z niemieckimi brygadami na poligonie pod Poznaniem. Granica z rozbitą Polską jest teraz dobrze strzeżona."
 EUR_PSN_k_samodzielnosc:0 "Wielkopolska sama o sobie"
 EUR_PSN_k_samodzielnosc_desc:0 "Sejmik ogłasza, że Wielkopolska jest gotowa na samodzielność. Wniosek trafia do Berlina – a w Poznaniu wszyscy pamiętają, jak to było ostatnim razem."
 EUR_PSN_r_start:0 "Poznań przed rozstrzygnięciem"
 EUR_PSN_r_start_desc:0 "Za kilka lat Berlin zapyta, czy chcemy zostać częścią Republiki Federalnej. To, co zrobimy teraz, zdecyduje, jak odpowiemy – i czy ktoś nas wysłucha."
 EUR_PSN_r_a1:0 "Wielkopolska szkoła samorządu"
 EUR_PSN_r_a1_desc:0 "Własne przepisy, własne urzędy i mniej podpisów komisarza. Berlin traci trochę kontroli, my zyskujemy trochę swobody."
 EUR_PSN_r_a2:0 "Pamięć powstania"
 EUR_PSN_r_a2_desc:0 "Instytucje, które działają bez komisarza: sejmik, sądy, szkoły. Swoboda, której nie da się odebrać jednym rozporządzeniem."
 EUR_PSN_r_i1:0 "Poznańskie targi dla Niemiec"
 EUR_PSN_r_i1_desc:0 "Pieniądze z Niemiec budują fabryki i drogi. Każda inwestycja to także jeden powód mniej, żeby odmówić Berlinowi."
 EUR_PSN_r_i2:0 "Wspólne prawo z Brandenburgią"
 EUR_PSN_r_i2_desc:0 "Te same przepisy co w sąsiednim landzie: łatwiej handlować, łatwiej pracować – i łatwiej kiedyś wejść do federacji."
 EUR_PSN_r_niezal:0 "Wielkopolska sama o sobie stanowi"
 EUR_PSN_r_niezal_desc:0 "Postanowione: gdy Berlin zaproponuje wcielenie, odpowiemy „nie” – nawet jeśli będzie to oznaczało wojnę."
 EUR_PSN_r_integr:0 "Wielkopolska przy Republice Federalnej"
 EUR_PSN_r_integr_desc:0 "Postanowione: przyszłość regionu jest w Republice Federalnej. Gdy przyjdzie propozycja, będziemy gotowi ją przyjąć."
 IVR_dm_S:0 "Większość sejmowa"
 IVR_m_nazwa_S:0 "Większość sejmowa"
 IVR_m_opis_S:0 "Ilu posłów stoi za rządem. Rośnie, gdy państwo działa i odbywają się wybory, spada w czasie wojny i kryzysów. Poniżej 30 grozi kryzys koalicyjny."
 IVR_dm_P:0 "Autorytet Prezydenta"
 IVR_m_nazwa_P:0 "Autorytet Prezydenta"
 IVR_m_opis_P:0 "Czy dekrety są wykonywane i czy ktoś się jeszcze sprzeciwia. Opozycja co miesiąc go podgryza; zbyt wysoki rodzi protesty."
 IVR_dm_M:0 "Lojalność Rodzin"
 IVR_m_nazwa_M:0 "Lojalność Rodzin"
 IVR_m_opis_M:0 "Czy rodziny dostają swoje koperty i trzymają się umowy. Co miesiąc kosztuje; w czasie wojny spada szybciej. Poniżej 25 – wojna rodzin."
 IVR_panel:0 "IV Rzeczpospolita"
 IVR_panel_desc:0 "§Y[IVR_Get_nazwa]§!: [?IVR_m|0]/100\n[IVR_Get_opis]"
 FAB2_panel:0 "Przemysł i fabryki"
 FAB2_panel_desc:0 "Budowa fabryk poza drzewkiem: cywilne i zbrojeniowe, nowe tereny przemysłowe, infrastruktura i specjalna strefa ekonomiczna."
 FAB2_cywilna:0 "Nowa fabryka cywilna"
 FAB2_cywilna_desc:0 "Hala, maszyny z demobilu i załoga z urzędu pracy. Za pół roku – kolejna."
 FAB2_zbrojeniowa:0 "Nowa fabryka zbrojeniowa"
 FAB2_zbrojeniowa_desc:0 "Linia produkcyjna amunicji i broni strzeleckiej w dawnej hali magazynowej."
 FAB2_tereny:0 "Nowe tereny przemysłowe"
 FAB2_tereny_desc:0 "Uzbrojenie działek pod fabryki: prąd, woda, bocznica kolejowa. Miejsce na dwa nowe zakłady."
 FAB2_drogi:0 "Remont dróg i torów"
 FAB2_drogi_desc:0 "Drogi i tory w dwóch regionach państwa wracają do używalności."
 FAB2_strefa_idea:0 "Specjalna strefa ekonomiczna"
 FAB2_strefa_idea_desc:0 "Ulgi podatkowe, szybkie pozwolenia i jedno okienko dla inwestorów. Fabryki rosną szybciej – przez pół roku."
 FAB2_strefa:0 "Specjalna strefa ekonomiczna"
 FAB2_strefa_desc:0 "Przez pół roku budowa fabryk idzie o jedną czwartą szybciej."
 ROS_tt_marionetka:0 "Państwa, których ziemie zajęliśmy w wojnie (polskie państwa i Ukraina), wracają na mapę jako nasze marionetki."
 ROS_tt_aneksja:0 "Zdobyte ziemie (cele operacji mazurskiej i Ukraina) stają się rdzennymi ziemiami Rosji. Przez rok opór obniża stabilność."
 ROS_p_putin_ural_przeniesienie:0 "Fabryki jadą na wschód"
 ROS_p_putin_ural_przeniesienie_desc:0 "Linie produkcyjne z zachodnich obwodów przenoszone są za Ural, poza zasięg dronów i dywersantów."
 ROS_p_putin_ural_energia:0 "Energia z Syberii"
 ROS_p_putin_ural_energia_desc:0 "Elektrownie wodne na Angarze zasilają nowe zakłady. Prądu wystarczy dla całego przemysłu obronnego."
 ROS_p_putin_ural_kadry:0 "Inżynierowie z zamkniętych miast"
 ROS_p_putin_ural_kadry_desc:0 "Dawne zamknięte miasta nauki znów pracują dla armii – za podwójną pensję."
 ROS_p_putin_ural_eszelony:0 "Eszelony na zachód"
 ROS_p_putin_ural_eszelony_desc:0 "Co tydzień z Jekaterynburga wyjeżdżają pociągi z amunicją dla Królewca."
 ROS_p_putin_ural_final:0 "Zaplecze nie do zniszczenia"
 ROS_p_putin_ural_final_desc:0 "Przemysł Rosji leży tysiące kilometrów od frontu. Żadna wojna w Polsce go nie dosięgnie."
 ROS_p_putin_hyb_trolle:0 "Fabryka trolli"
 ROS_p_putin_hyb_trolle_desc:0 "Setki kont w sieci pisze po polsku o tym, że Warszawa zdradziła regiony, a regiony – Warszawę."
 ROS_p_putin_hyb_sabotaz:0 "Dywersja na kolei"
 ROS_p_putin_hyb_sabotaz_desc:0 "Pożary nastawni i przecięte kable na liniach do Gdańska i Olsztyna. Nikt nie przyznaje się do autorstwa."
 ROS_p_putin_hyb_lapowki:0 "Pieniądze dla przyjaznych polityków"
 ROS_p_putin_hyb_lapowki_desc:0 "Kilku lokalnych przywódców w rozbitej Polsce dostaje „darowizny” od fundacji z Cypru."
 ROS_p_putin_hyb_gaz:0 "Gaz jako broń"
 ROS_p_putin_hyb_gaz_desc:0 "Ceny gazu dla państw przyjaznych spadają, dla wrogich – rosną. Zimą to argument silniejszy niż czołgi."
 ROS_p_putin_hyb_final:0 "Szara strefa wojny"
 ROS_p_putin_hyb_final_desc:0 "Rosja prowadzi wojnę bez wypowiedzenia: w sieci, w budżetach i na torach kolejowych."
 ROS_p_putin_el_oligarchowie:0 "Lojalność oligarchów"
 ROS_p_putin_el_oligarchowie_desc:0 "Ci, którzy płacą na front, zachowują majątki. Ci, którzy narzekają – wypadają z okien."
 ROS_p_putin_el_silowiki:0 "Siłowicy w rządzie"
 ROS_p_putin_el_silowiki_desc:0 "Ludzie ze służb obejmują ministerstwa gospodarcze. Decyzje zapadają szybciej – i ciszej."
 ROS_p_putin_el_regiony:0 "Gubernatorzy na krótkiej smyczy"
 ROS_p_putin_el_regiony_desc:0 "Każdy gubernator ma kuratora z Moskwy. Budżety regionów płyną najpierw przez Kreml."
 ROS_p_putin_el_nastepca:0 "Lista następców"
 ROS_p_putin_el_nastepca_desc:0 "Na biurku prezydenta leży lista nazwisk. Każdy z nich wie, że na niej jest – i że może z niej zniknąć."
 ROS_p_putin_el_final:0 "Pionowa władza"
 ROS_p_putin_el_final_desc:0 "Od Kremla do ostatniego urzędu gminy – jedna linia rozkazów i jedna lojalność."
 ROS_p_putin_druga_op:0 "Druga operacja mazurska"
 ROS_p_putin_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
 ROS_p_putin_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_putin_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_putin_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_putin_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_mazury_log_kolej:0 "Szerokie tory do Królewca"
 ROS_p_mazury_log_kolej_desc:0 "Bocznice i rampy rozładunkowe dla eszelonów z Białorusi pracują całą dobę."
 ROS_p_mazury_log_paliwo:0 "Cysterny dla kolumn"
 ROS_p_mazury_log_paliwo_desc:0 "Paliwo jedzie za czołgami, a nie tydzień po nich. Tym razem sztab o tym pamiętał."
 ROS_p_mazury_log_remonty:0 "Polowe warsztaty remontowe"
 ROS_p_mazury_log_remonty_desc:0 "Uszkodzone wozy wracają do walki w trzy dni zamiast w trzy tygodnie."
 ROS_p_mazury_log_szpitale:0 "Szpitale polowe pod Gołdapią"
 ROS_p_mazury_log_szpitale_desc:0 "Ranni wracają na front, a nie do domów. Morale rośnie razem z liczbą łóżek."
 ROS_p_mazury_log_final:0 "Zaplecze operacji mazurskiej"
 ROS_p_mazury_log_final_desc:0 "Front ma wszystko, czego potrzebuje: paliwo, amunicję i części zamienne."
 ROS_p_mazury_inf_radio:0 "Radio „Królewiec” po polsku"
 ROS_p_mazury_inf_radio_desc:0 "Stacja nadaje muzykę, wiadomości i uspokajające komunikaty dla mieszkańców Mazur."
 ROS_p_mazury_inf_ulotki:0 "Ulotki nad Olsztynem"
 ROS_p_mazury_inf_ulotki_desc:0 "Z samolotów spadają ulotki z obietnicą prądu, ciepła i spokoju dla tych, którzy nie stawiają oporu."
 ROS_p_mazury_inf_kolaboracja:0 "Lokalni pomocnicy"
 ROS_p_mazury_inf_kolaboracja_desc:0 "W kilku gminach znajdują się ludzie gotowi współpracować – za żywność, paliwo albo władzę."
 ROS_p_mazury_inf_zaklocanie:0 "Zagłuszanie łączności"
 ROS_p_mazury_inf_zaklocanie_desc:0 "Polskie radiostacje na Mazurach słyszą tylko szum. Dowódcy obrony działają na ślepo."
 ROS_p_mazury_inf_final:0 "Przewaga informacyjna"
 ROS_p_mazury_inf_final_desc:0 "Na Mazurach to rosyjskie radio mówi ludziom, co się dzieje – i co ich czeka."
 ROS_p_mazury_adm_komendantury:0 "Komendantury wojskowe"
 ROS_p_mazury_adm_komendantury_desc:0 "W każdym zajętym mieście urzęduje komendant z tłumaczem i listą zakazów."
 ROS_p_mazury_adm_ruble:0 "Rubel w obiegu"
 ROS_p_mazury_adm_ruble_desc:0 "Na zajętych terenach płaci się rublami. Kto ich nie ma, płaci dwa razy więcej."
 ROS_p_mazury_adm_paszporty:0 "Paszporty dla mieszkańców"
 ROS_p_mazury_adm_paszporty_desc:0 "Rosyjski paszport oznacza przydział żywności i prawo do pracy. Kolejki są długie."
 ROS_p_mazury_adm_szkoly:0 "Nowe programy w szkołach"
 ROS_p_mazury_adm_szkoly_desc:0 "Dzieci uczą się historii, w której Mazury zawsze patrzyły na wschód."
 ROS_p_mazury_adm_final:0 "Zarząd zajętych ziem"
 ROS_p_mazury_adm_final_desc:0 "Zajęte gminy mają administrację, walutę i policję. Opór schodzi do podziemia."
 ROS_p_mazury_druga_op:0 "Druga operacja mazurska"
 ROS_p_mazury_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
 ROS_p_mazury_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_mazury_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_mazury_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_mazury_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_kryzys_suk_silowiki:0 "Klan siłowików"
 ROS_p_kryzys_suk_silowiki_desc:0 "Służby specjalne chcą jednego z swoich na Kremlu. Mają teczki na wszystkich pozostałych."
 ROS_p_kryzys_suk_technokraci:0 "Klan technokratów"
 ROS_p_kryzys_suk_technokraci_desc:0 "Ministrowie gospodarki obiecują stabilność rubla w zamian za spokój na ulicach."
 ROS_p_kryzys_suk_armia:0 "Głos generałów"
 ROS_p_kryzys_suk_armia_desc:0 "Sztab Generalny ogłasza, że armia „nie będzie się mieszać” – co wszyscy rozumieją odwrotnie."
 ROS_p_kryzys_suk_ulica:0 "Nastroje ulicy"
 ROS_p_kryzys_suk_ulica_desc:0 "W Moskwie i Petersburgu ludzie wychodzą na ulice – po raz pierwszy od lat bez natychmiastowych aresztowań."
 ROS_p_kryzys_suk_final:0 "Kompromis klanów"
 ROS_p_kryzys_suk_final_desc:0 "Klany dzielą ministerstwa i ustalają, kto poprowadzi państwo do wyborów."
 ROS_p_kryzys_ryn_rubel:0 "Obrona rubla"
 ROS_p_kryzys_ryn_rubel_desc:0 "Bank centralny podnosi stopy i zamyka wymianę walut dla osób prywatnych."
 ROS_p_kryzys_ryn_zloto:0 "Złoto z rezerw"
 ROS_p_kryzys_ryn_zloto_desc:0 "Sztabki z rezerw państwowych idą na pokrycie importu leków i części do maszyn."
 ROS_p_kryzys_ryn_ceny:0 "Zamrożenie cen"
 ROS_p_kryzys_ryn_ceny_desc:0 "Chleb, paliwo i leki mają ceny urzędowe. Półki pustoszeją, ale kolejki są spokojne."
 ROS_p_kryzys_ryn_eksport:0 "Ropa za każdą cenę"
 ROS_p_kryzys_ryn_eksport_desc:0 "Tankowce płyną do każdego, kto zapłaci – nawet z rabatem."
 ROS_p_kryzys_ryn_final:0 "Gospodarka przetrwania"
 ROS_p_kryzys_ryn_final_desc:0 "Państwo trzyma gospodarkę za gardło, żeby ta nie przestała oddychać."
 ROS_p_kryzys_arm_lojalnosc:0 "Przysięga na nowo"
 ROS_p_kryzys_arm_lojalnosc_desc:0 "Dowódcy okręgów składają przysięgę Radzie Bezpieczeństwa – nie osobie."
 ROS_p_kryzys_arm_zold:0 "Żołd na czas"
 ROS_p_kryzys_arm_zold_desc:0 "Najprostszy sposób na lojalność armii: wypłacić pieniądze w terminie."
 ROS_p_kryzys_arm_rotacje:0 "Rotacja dowódców"
 ROS_p_kryzys_arm_rotacje_desc:0 "Najbardziej ambitni generałowie dostają przydziały daleko od Moskwy."
 ROS_p_kryzys_arm_rezerwy:0 "Rezerwy w koszarach"
 ROS_p_kryzys_arm_rezerwy_desc:0 "Dywizje z głębi kraju zostają w koszarach – na wypadek, gdyby ktoś chciał zrobić z nich użytek."
 ROS_p_kryzys_arm_final:0 "Armia ponad sporem"
 ROS_p_kryzys_arm_final_desc:0 "Wojsko nie bierze udziału w walce o Kreml – i dzięki temu wszyscy się go boją."
 ROS_p_kryzys_druga_op:0 "Druga operacja mazurska"
 ROS_p_kryzys_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
 ROS_p_kryzys_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_kryzys_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_kryzys_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_kryzys_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_poklonska_pr_archiwa:0 "Otwarcie archiwów"
 ROS_p_poklonska_pr_archiwa_desc:0 "Dokumenty z ostatnich lat trafiają do prokuratury. Niektórzy ministrowie wyjeżdżają za granicę."
 ROS_p_poklonska_pr_sady:0 "Sędziowie z nowego naboru"
 ROS_p_poklonska_pr_sady_desc:0 "Połowa sędziów odchodzi na emeryturę. Na ich miejsce przychodzą ludzie z czystą kartą."
 ROS_p_poklonska_pr_majatki:0 "Konfiskata majątków zbiegłych"
 ROS_p_poklonska_pr_majatki_desc:0 "Pałace, jachty i kopalnie uciekinierów wracają do państwa."
 ROS_p_poklonska_pr_policja:0 "Policja bez polityki"
 ROS_p_poklonska_pr_policja_desc:0 "Funkcjonariusze, którzy pałowali demonstrantów, tracą mundury."
 ROS_p_poklonska_pr_final:0 "Rządy prawa w budowie"
 ROS_p_poklonska_pr_final_desc:0 "Państwo ma prawo, sądy i prokuraturę, które działają – na razie powoli, ale działają."
 ROS_p_poklonska_gp_kredyty:0 "Kredyty z Azji"
 ROS_p_poklonska_gp_kredyty_desc:0 "Banki z Azji pożyczają pieniądze rządowi, który obiecuje spokój."
 ROS_p_poklonska_gp_rolnictwo:0 "Ziarno na eksport"
 ROS_p_poklonska_gp_rolnictwo_desc:0 "Zboże z południa jest najlepszym argumentem w rozmowach z całym światem."
 ROS_p_poklonska_gp_pensje:0 "Pensje dla budżetówki"
 ROS_p_poklonska_gp_pensje_desc:0 "Nauczyciele i lekarze dostają zaległe wypłaty. Ulice się uspokajają."
 ROS_p_poklonska_gp_zbrojeniowka:0 "Konwersja zbrojeniówki"
 ROS_p_poklonska_gp_zbrojeniowka_desc:0 "Część zakładów obronnych wraca do produkcji cywilnej – reszta pracuje dla armii."
 ROS_p_poklonska_gp_final:0 "Stabilizacja przejściowa"
 ROS_p_poklonska_gp_final_desc:0 "Gospodarka nie rośnie, ale też nie spada. Na czas przejściowy to sukces."
 ROS_p_poklonska_bp_krym:0 "Garnizon na Krymie"
 ROS_p_poklonska_bp_krym_desc:0 "Flota i garnizon na półwyspie dostają gwarancje: nikt ich nie zostawi."
 ROS_p_poklonska_bp_granice:0 "Straż graniczna w gotowości"
 ROS_p_poklonska_bp_granice_desc:0 "Na granicach na zachodzie i południu stoją posterunki gotowe na każdy wariant."
 ROS_p_poklonska_bp_sluzby:0 "Kontrola nad służbami"
 ROS_p_poklonska_bp_sluzby_desc:0 "Każdy wydział służb ma nowego szefa – i nowego kontrolera z prokuratury."
 ROS_p_poklonska_bp_armia:0 "Umowa z generałami"
 ROS_p_poklonska_bp_armia_desc:0 "Armia dostaje budżet i spokój, a w zamian zostaje w koszarach do wyborów."
 ROS_p_poklonska_bp_final:0 "Spokojne przejście"
 ROS_p_poklonska_bp_final_desc:0 "Rosja dochodzi do wyborów bez zamachu stanu. Mało kto w to wierzył."
 ROS_p_poklonska_druga_op:0 "Druga operacja mazurska"
 ROS_p_poklonska_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
 ROS_p_poklonska_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_poklonska_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_poklonska_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_poklonska_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_szojgu_jn_rada:0 "Rada Obrony Państwa"
 ROS_p_szojgu_jn_rada_desc:0 "Pięciu generałów i jeden cywil decydują o wszystkim. Cywil najczęściej milczy."
 ROS_p_szojgu_jn_dekrety:0 "Dekrety nadzwyczajne"
 ROS_p_szojgu_jn_dekrety_desc:0 "Prawo stanowi się rozkazem. Duma zbiera się, żeby go oklaskiwać."
 ROS_p_szojgu_jn_godzina:0 "Godzina policyjna"
 ROS_p_szojgu_jn_godzina_desc:0 "Po dwudziestej drugiej na ulicach są tylko patrole."
 ROS_p_szojgu_jn_cenzura:0 "Wojskowa cenzura"
 ROS_p_szojgu_jn_cenzura_desc:0 "Każdy artykuł przechodzi przez biuro prasowe sztabu."
 ROS_p_szojgu_jn_final:0 "Państwo w mundurze"
 ROS_p_szojgu_jn_final_desc:0 "Rosją rządzi armia – sprawnie, twardo i bez pytania kogokolwiek o zdanie."
 ROS_p_szojgu_mp_komisarze:0 "Komisarze w fabrykach"
 ROS_p_szojgu_mp_komisarze_desc:0 "Każdy dyrektor ma obok siebie oficera, który pilnuje terminów."
 ROS_p_szojgu_mp_amunicja:0 "Amunicja na pierwszym miejscu"
 ROS_p_szojgu_mp_amunicja_desc:0 "Fabryki nawozów produkują materiały wybuchowe, a zakłady samochodowe – ciężarówki wojskowe."
 ROS_p_szojgu_mp_czolgi:0 "Czołgi z magazynów"
 ROS_p_szojgu_mp_czolgi_desc:0 "Stare wozy z magazynów na Uralu przechodzą remont i jadą na zachód."
 ROS_p_szojgu_mp_paliwo:0 "Paliwo dla armii"
 ROS_p_szojgu_mp_paliwo_desc:0 "Rafinerie najpierw tankują wojsko, potem resztę kraju."
 ROS_p_szojgu_mp_final:0 "Przemysł pod rozkazami"
 ROS_p_szojgu_mp_final_desc:0 "Każda fabryka w Rosji jest teraz zakładem obronnym."
 ROS_p_szojgu_kr_gubernatorzy:0 "Gubernatorzy w mundurach"
 ROS_p_szojgu_kr_gubernatorzy_desc:0 "Cywilnych gubernatorów zastępują komendanci okręgów."
 ROS_p_szojgu_kr_kaukaz:0 "Spokój na Kaukazie"
 ROS_p_szojgu_kr_kaukaz_desc:0 "Regiony Kaukazu dostają pieniądze i swobodę – w zamian za ludzi do armii."
 ROS_p_szojgu_kr_syberia:0 "Syberia dla frontu"
 ROS_p_szojgu_kr_syberia_desc:0 "Dalekie regiony wysyłają rekrutów i surowce, a dostają obietnice."
 ROS_p_szojgu_kr_media:0 "Lokalne media pod nadzorem"
 ROS_p_szojgu_kr_media_desc:0 "Regionalne gazety drukują te same artykuły co moskiewskie."
 ROS_p_szojgu_kr_final:0 "Jedna linia rozkazów"
 ROS_p_szojgu_kr_final_desc:0 "Od Kaliningradu po Władywostok – jedna armia, jedno państwo, jeden rozkaz."
 ROS_p_szojgu_druga_op:0 "Druga operacja mazurska"
 ROS_p_szojgu_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
 ROS_p_szojgu_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_szojgu_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_szojgu_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_szojgu_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_wybory_kw_ural:0 "Wiec w Jekaterynburgu"
 ROS_p_wybory_kw_ural_desc:0 "Pierwszy wielki wiec poza Moskwą. Przychodzą robotnicy z zakładów i studenci."
 ROS_p_wybory_kw_wolga:0 "Głosy znad Wołgi"
 ROS_p_wybory_kw_wolga_desc:0 "Miasta nad Wołgą decydują o wyniku. Kandydaci odwiedzają je po kilka razy."
 ROS_p_wybory_kw_syberia:0 "Syberia chce być słyszana"
 ROS_p_wybory_kw_syberia_desc:0 "Regiony Syberii żądają, żeby pieniądze z ropy zostawały u nich."
 ROS_p_wybory_kw_mlodzi:0 "Młodzi idą głosować"
 ROS_p_wybory_kw_mlodzi_desc:0 "Po raz pierwszy od dekad młodzi ludzie stoją w kolejkach do urn."
 ROS_p_wybory_kw_final:0 "Mapa wyborcza Rosji"
 ROS_p_wybory_kw_final_desc:0 "Kraj jest podzielony, ale głosuje. To już coś."
 ROS_p_wybory_md_telewizja:0 "Telewizja dla wszystkich kandydatów"
 ROS_p_wybory_md_telewizja_desc:0 "Każdy kandydat dostaje czas antenowy. Widzowie nie wierzą własnym oczom."
 ROS_p_wybory_md_internet:0 "Sieć bez blokad"
 ROS_p_wybory_md_internet_desc:0 "Odblokowane serwisy i komunikatory. Kampania przenosi się do telefonów."
 ROS_p_wybory_md_sondaze:0 "Niezależne sondaże"
 ROS_p_wybory_md_sondaze_desc:0 "Pierwsze od lat sondaże, których wyniki nie są znane przed badaniem."
 ROS_p_wybory_md_dziennikarze:0 "Powrót dziennikarzy"
 ROS_p_wybory_md_dziennikarze_desc:0 "Redakcje z emigracji otwierają biura w Moskwie."
 ROS_p_wybory_md_final:0 "Wolna kampania"
 ROS_p_wybory_md_final_desc:0 "Rosjanie wybierają, wiedząc, na kogo głosują."
 ROS_p_wybory_bw_komisje:0 "Komisje z obserwatorami"
 ROS_p_wybory_bw_komisje_desc:0 "W każdej komisji siedzą przedstawiciele wszystkich kandydatów."
 ROS_p_wybory_bw_wojsko:0 "Wojsko w koszarach"
 ROS_p_wybory_bw_wojsko_desc:0 "Armia ogłasza neutralność i zostaje w jednostkach w dniu głosowania."
 ROS_p_wybory_bw_policja:0 "Policja pilnuje lokali"
 ROS_p_wybory_bw_policja_desc:0 "Policja chroni lokale wyborcze przed prowokatorami z każdej strony."
 ROS_p_wybory_bw_liczenie:0 "Liczenie przy kamerach"
 ROS_p_wybory_bw_liczenie_desc:0 "Głosy liczone są przy włączonych kamerach, a protokoły wiszą na drzwiach."
 ROS_p_wybory_bw_final:0 "Uczciwe wybory"
 ROS_p_wybory_bw_final_desc:0 "Wynik może się nie podobać, ale nikt nie może powiedzieć, że został sfałszowany."
 ROS_p_wybory_druga_op:0 "Druga operacja mazurska"
 ROS_p_wybory_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
 ROS_p_wybory_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_wybory_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_wybory_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_wybory_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_car_dw_cer:0 "Ceremoniał dworski"
 ROS_p_car_dw_cer_desc:0 "Przyjęcia, ordery i parady. Kreml przypomina bardziej dwór niż urząd."
 ROS_p_car_dw_cerkiew:0 "Błogosławieństwo patriarchy"
 ROS_p_car_dw_cerkiew_desc:0 "Patriarcha nazywa władzę „darem opatrzności”. Telewizja pokazuje to co godzinę."
 ROS_p_car_dw_dworzanie:0 "Ludzie z najbliższego kręgu"
 ROS_p_car_dw_dworzanie_desc:0 "Najważniejsze decyzje zapadają przy stole, przy którym siedzi dziesięć osób."
 ROS_p_car_dw_pomniki:0 "Pomniki i nazwy ulic"
 ROS_p_car_dw_pomniki_desc:0 "Nowe pomniki stają w każdym mieście obwodowym."
 ROS_p_car_dw_final:0 "Władza ponad państwem"
 ROS_p_car_dw_final_desc:0 "Państwo to on. Wszyscy inni są tylko wykonawcami."
 ROS_p_car_ia_gwardia:0 "Gwardia Kremlowska"
 ROS_p_car_ia_gwardia_desc:0 "Elitarne pułki strzegą Kremla i nikogo poza nim."
 ROS_p_car_ia_kadeci:0 "Korpusy kadetów"
 ROS_p_car_ia_kadeci_desc:0 "Szkoły wojskowe dla chłopców od dwunastego roku życia otwierają się w każdym obwodzie."
 ROS_p_car_ia_pancerni:0 "Nowe dywizje pancerne"
 ROS_p_car_ia_pancerni_desc:0 "Fabryki na Uralu dostają zamówienie na czołgi z najnowszymi systemami ochrony."
 ROS_p_car_ia_rakiety:0 "Rakiety średniego zasięgu"
 ROS_p_car_ia_rakiety_desc:0 "Nowe wyrzutnie stają w obwodzie królewieckim. Europa patrzy z niepokojem."
 ROS_p_car_ia_final:0 "Armia imperium"
 ROS_p_car_ia_final_desc:0 "Armia jest znowu największą siłą w Europie – i największym argumentem Kremla."
 ROS_p_car_au_import:0 "Zastępowanie importu"
 ROS_p_car_au_import_desc:0 "Zakłady produkują wszystko, czego nie da się kupić za granicą – gorzej, ale własne."
 ROS_p_car_au_zboze:0 "Zboże jako waluta"
 ROS_p_car_au_zboze_desc:0 "Rosja płaci zbożem za maszyny i elektronikę z Azji."
 ROS_p_car_au_chiny:0 "Szlak przez Azję"
 ROS_p_car_au_chiny_desc:0 "Kolej transsyberyjska wozi części, których brakuje w kraju."
 ROS_p_car_au_fabryki:0 "Nowe fabryki zbrojeniowe"
 ROS_p_car_au_fabryki_desc:0 "Zakłady zbrojeniowe powstają w miastach, o których świat nie słyszał."
 ROS_p_car_au_final:0 "Twierdza gospodarcza"
 ROS_p_car_au_final_desc:0 "Rosja nie potrzebuje świata – przynajmniej tak mówi telewizja."
 ROS_p_car_druga_op:0 "Druga operacja mazurska"
 ROS_p_car_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
 ROS_p_car_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_car_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_car_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_car_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_mie_bk_ministerstwa:0 "Reforma ministerstw"
 ROS_p_mie_bk_ministerstwa_desc:0 "Połączenie resortów i nowe struktury. Urzędników jest mniej, papierów – więcej."
 ROS_p_mie_bk_cyfryzacja:0 "Państwo w aplikacji"
 ROS_p_mie_bk_cyfryzacja_desc:0 "Obywatel może załatwić sprawę w telefonie – o ile ma zasięg i nie jest na liście."
 ROS_p_mie_bk_nomenklatura:0 "Nowa nomenklatura"
 ROS_p_mie_bk_nomenklatura_desc:0 "Na ważne stanowiska trafiają ludzie lojalni wobec prezydenta, nie wobec poprzednika."
 ROS_p_mie_bk_regiony:0 "Reforma podziału kraju"
 ROS_p_mie_bk_regiony_desc:0 "Mniej regionów, więcej władzy w Moskwie."
 ROS_p_mie_bk_final:0 "Państwo urzędników"
 ROS_p_mie_bk_final_desc:0 "Rosją rządzą procedury. Wolno, ale przewidywalnie."
 ROS_p_mie_zw_kolej:0 "Kolej do Azji"
 ROS_p_mie_zw_kolej_desc:0 "Nowe tory i terminale na granicy wschodniej. Towary płyną w obie strony."
 ROS_p_mie_zw_technologie:0 "Technologie z Azji"
 ROS_p_mie_zw_technologie_desc:0 "Elektronika, obrabiarki i części do maszyn przychodzą tam, gdzie Zachód zamknął drzwi."
 ROS_p_mie_zw_ropa:0 "Rurociągi na wschód"
 ROS_p_mie_zw_ropa_desc:0 "Ropa i gaz płyną do Azji. Ceny są niższe, ale klient jest pewny."
 ROS_p_mie_zw_juan:0 "Rozliczenia bez dolara"
 ROS_p_mie_zw_juan_desc:0 "Handel zagraniczny przechodzi na waluty, których nie da się zablokować z Waszyngtonu."
 ROS_p_mie_zw_final:0 "Partner Azji"
 ROS_p_mie_zw_final_desc:0 "Rosja jest teraz młodszym partnerem gospodarki azjatyckiej – ale partnerem."
 ROS_p_mie_ak_kontrakty:0 "Kontrakty za pieniądze"
 ROS_p_mie_ak_kontrakty_desc:0 "Żołnierz kontraktowy zarabia trzy razy więcej niż robotnik. Chętnych nie brakuje."
 ROS_p_mie_ak_szkolenia:0 "Ośrodki szkoleniowe"
 ROS_p_mie_ak_szkolenia_desc:0 "Nowe poligony i ośrodki dla kontraktowców w każdym okręgu."
 ROS_p_mie_ak_sprzet:0 "Nowy sprzęt dla zawodowców"
 ROS_p_mie_ak_sprzet_desc:0 "Kontraktowcy dostają lepsze kamizelki, gogle nocne i radiostacje."
 ROS_p_mie_ak_drony:0 "Pułki dronów"
 ROS_p_mie_ak_drony_desc:0 "Każda brygada ma własną kompanię dronów – rozpoznawczych i uderzeniowych."
 ROS_p_mie_ak_final:0 "Zawodowa armia"
 ROS_p_mie_ak_final_desc:0 "Armia składa się z ludzi, którzy wybrali wojsko – i dobrze za to zapłacono."
 ROS_p_mie_druga_op:0 "Druga operacja mazurska"
 ROS_p_mie_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
 ROS_p_mie_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_mie_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_mie_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_mie_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_szo_ps_sztab:0 "Sztab zamiast rządu"
 ROS_p_szo_ps_sztab_desc:0 "Posiedzenia rządu odbywają się w sali odpraw Sztabu Generalnego."
 ROS_p_szo_ps_plany:0 "Plany pięcioletnie obrony"
 ROS_p_szo_ps_plany_desc:0 "Każdy resort ma plan obronny z terminami i odpowiedzialnymi oficerami."
 ROS_p_szo_ps_kontrola:0 "Kontrola wojskowa urzędów"
 ROS_p_szo_ps_kontrola_desc:0 "Inspektorzy w mundurach sprawdzają urzędy cywilne."
 ROS_p_szo_ps_wywiad:0 "Wywiad wojskowy w polityce"
 ROS_p_szo_ps_wywiad_desc:0 "Raporty wywiadu decydują o polityce zagranicznej."
 ROS_p_szo_ps_final:0 "Rządy sztabu"
 ROS_p_szo_ps_final_desc:0 "Rosja działa jak armia: rozkaz, wykonanie, meldunek."
 ROS_p_szo_zb_zaklady:0 "Wojskowe kombinaty za Uralem"
 ROS_p_szo_zb_zaklady_desc:0 "Kombinaty produkują wszystko: od amunicji po rakiety."
 ROS_p_szo_zb_artyleria:0 "Artyleria dalekiego zasięgu"
 ROS_p_szo_zb_artyleria_desc:0 "Nowe działa i wyrzutnie rakietowe dla brygad artylerii."
 ROS_p_szo_zb_pancerne:0 "Modernizacja czołgów"
 ROS_p_szo_zb_pancerne_desc:0 "Stare czołgi dostają nowe celowniki i osłony przed dronami."
 ROS_p_szo_zb_lotnictwo:0 "Śmigłowce i drony szturmowe"
 ROS_p_szo_zb_lotnictwo_desc:0 "Pułki śmigłowców i dronów wspierają piechotę na każdym odcinku."
 ROS_p_szo_zb_final:0 "Arsenał Rosji"
 ROS_p_szo_zb_final_desc:0 "Rosja produkuje więcej broni niż cała Europa razem."
 ROS_p_szo_ds_szkoly:0 "Wychowanie wojskowe w szkołach"
 ROS_p_szo_ds_szkoly_desc:0 "Musztra i strzelanie na lekcjach. Każdy uczeń zna stopnie wojskowe."
 ROS_p_szo_ds_media:0 "Jedna narracja"
 ROS_p_szo_ds_media_desc:0 "Wszystkie stacje nadają te same wiadomości o tej samej godzinie."
 ROS_p_szo_ds_praca:0 "Praca dla obronności"
 ROS_p_szo_ds_praca_desc:0 "Każdy dorosły ma przydział: fabryka, rezerwa albo służba."
 ROS_p_szo_ds_nagrody:0 "Ordery dla robotników"
 ROS_p_szo_ds_nagrody_desc:0 "Najlepsze zespoły w fabrykach dostają ordery i premie."
 ROS_p_szo_ds_final:0 "Społeczeństwo w szyku"
 ROS_p_szo_ds_final_desc:0 "Rosja maszeruje w jednym rytmie – z ostrożności czy z przekonania, trudno powiedzieć."
 ROS_p_szo_druga_op:0 "Druga operacja mazurska"
 ROS_p_szo_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
 ROS_p_szo_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_szo_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_szo_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_szo_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_cho_rp_gielda:0 "Otwarcie giełdy dla zagranicy"
 ROS_p_cho_rp_gielda_desc:0 "Inwestorzy z zagranicy mogą kupować akcje rosyjskich spółek – na nowych zasadach."
 ROS_p_cho_rp_przetargi:0 "Przejrzyste przetargi"
 ROS_p_cho_rp_przetargi_desc:0 "Każdy przetarg jest publiczny, a wyniki można sprawdzić w internecie."
 ROS_p_cho_rp_mali:0 "Ulgi dla małych firm"
 ROS_p_cho_rp_mali_desc:0 "Właściciele sklepów i warsztatów płacą niższe podatki i nie muszą płacić łapówek."
 ROS_p_cho_rp_energetyka:0 "Prywatna energetyka"
 ROS_p_cho_rp_energetyka_desc:0 "Elektrownie trafiają w ręce prywatnych inwestorów, którzy muszą je zmodernizować."
 ROS_p_cho_rp_final:0 "Gospodarka rynkowa"
 ROS_p_cho_rp_final_desc:0 "Rosja handluje, inwestuje i zarabia – bardziej niż kiedykolwiek od dekad."
 ROS_p_cho_pw_sady:0 "Sądy gospodarcze"
 ROS_p_cho_pw_sady_desc:0 "Nowe sądy rozstrzygają spory firm w miesiąc, a nie w rok."
 ROS_p_cho_pw_rejestr:0 "Rejestr własności"
 ROS_p_cho_pw_rejestr_desc:0 "Każda działka, każda fabryka i każdy statek ma właściciela zapisanego w jednym rejestrze."
 ROS_p_cho_pw_amnestia:0 "Amnestia kapitałowa"
 ROS_p_cho_pw_amnestia_desc:0 "Kto przywiezie pieniądze z zagranicy, nie będzie pytany, skąd je ma."
 ROS_p_cho_pw_korupcja:0 "Koniec haraczy"
 ROS_p_cho_pw_korupcja_desc:0 "Urzędnicy, którzy żądali łapówek od firm, tracą pracę."
 ROS_p_cho_pw_final:0 "Bezpieczna własność"
 ROS_p_cho_pw_final_desc:0 "W Rosji można wreszcie coś mieć – i nie bać się, że to zabiorą."
 ROS_p_cho_pa_kontrakty:0 "Kontrakty z firmami wojskowymi"
 ROS_p_cho_pa_kontrakty_desc:0 "Prywatne firmy wojskowe dostają kontrakty od państwa – z jasnymi zasadami."
 ROS_p_cho_pa_szkolenia:0 "Szkolenia zachodnim standardem"
 ROS_p_cho_pa_szkolenia_desc:0 "Instruktorzy z doświadczeniem z całego świata szkolą rosyjskich żołnierzy."
 ROS_p_cho_pa_sprzet:0 "Sprzęt z rynku"
 ROS_p_cho_pa_sprzet_desc:0 "Firmy kupują sprzęt tam, gdzie jest najlepszy i najtańszy."
 ROS_p_cho_pa_ochrona:0 "Ochrona infrastruktury"
 ROS_p_cho_pa_ochrona_desc:0 "Rurociągi, porty i kopalnie pilnują prywatne firmy, odciążając armię."
 ROS_p_cho_pa_final:0 "Wojna jako usługa"
 ROS_p_cho_pa_final_desc:0 "Bezpieczeństwo Rosji jest kontraktem – drogim, ale dotrzymywanym."
 ROS_p_cho_druga_op:0 "Druga operacja mazurska"
 ROS_p_cho_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
