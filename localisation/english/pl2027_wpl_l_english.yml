l_english:
 WPL_odmowa_koncesji:0 "Odrzucona koncesja kolejowa"
 WPL_blokada_op:0 "Kolejowa blokada"
 WPL_odmowa_wykupu:0 "Odrzucony wykup"
 WPL_blokada_kolejowa:0 "Blokada kolejowa"
 WPL_blokada_kolejowa_desc:0 "Pociągi PKP omijają nasze stacje, a towary utknęły na bocznicach. Ktoś w Tczewie bardzo chce, żebyśmy to odczuli."
 WPL_straty_przewozowe:0 "Straty przewozowe"
 WPL_straty_przewozowe_desc:0 "Puste składy też kosztują. Księgowi holdingu liczą straty z blokady i nie są zachwyceni."
 WPL_dostawy_wloclawek:0 "Dostawy z Włocławka"
 WPL_dostawy_wloclawek_desc:0 "Mąka, ser i olej płyną z Włocławka na kredyt. Sklepy są pełne – na razie."
 WPL_spolka_zalezna:0 "Spółka zależna PKP"
 WPL_spolka_zalezna_desc:0 "Nasze państwo figuruje w rejestrze holdingu jako spółka zależna. Pociągi jeżdżą punktualnie, decyzje zapadają w Tczewie."
 WPL_siec_wplywow:0 "Sieć wpływów regionalnych"
 WPL_siec_wplywow_desc:0 "Umowy handlowe z partnerami (wpływy 25+) dają +2% siły politycznej każda, a wspólne projekty (wpływy 50+) +2% szybkości budowy każdy (maks. +10%)."
 WPL_tt_1:0 "Wpływy PKP w państwie [ROOT.GetName]: §G+5§!"
 WPL_tt_2:0 "Wpływy PKP w państwie [ROOT.GetName]: §R-5§!"
 wpl.1.t:0 "Wniosek o koncesję na dworzec"
 wpl.1.d:0 "Delegacja PKP w nienagannie skrojonych mundurach złożyła wniosek o koncesję na nasz główny dworzec. Obiecują remont, czyste toalety i pociągi o czasie. W zamian chcą jedynie kontroli nad tym, kto i co przez ten dworzec przewozi."
 wpl.1.a:0 "Podpisać koncesję. Dworzec i tak się sypie."
 wpl.1.b:0 "Dworzec zostaje w naszych rękach."
 wpl.2.t:0 "Koncesja przyznana"
 wpl.2.d:0 "Władze państwa [FROM.GetName] przyznały nam koncesję na dworzec. Ekipy remontowe już wymieniają tablice – na nowych logo holdingu jest nieco większe niż nazwa miasta."
 wpl.2.a:0 "Kolejny peron w naszej sieci."
 wpl.3.t:0 "Koncesja odrzucona"
 wpl.3.d:0 "Władze państwa [FROM.GetName] odrzuciły nasz wniosek. Miejscowi radni tłumaczą się „interesem lokalnym”. Zarząd zapamięta, który interes był ważniejszy."
 wpl.3.a:0 "Zapamiętamy to."
 WPL_tt_3:0 "Wpływy PKP w państwie [ROOT.GetName]: §R-10§!"
 wpl.4.t:0 "Odwet za blokadę kolejową"
 wpl.4.d:0 "Blokada PKP sparaliżowała nasze zakłady. Na posiedzeniu rządu padają mocne słowa: jedni chcą odpowiedzieć siłą, inni proponują protest dyplomatyczny, a skarbnik po cichu sugeruje, żeby po prostu przeczekać."
 wpl.4.a:0 "Odpowiemy siłą – czas na wojnę z holdingiem."
 wpl.4.b:0 "Protest dyplomatyczny i bojkot przewozów."
 wpl.4.c:0 "Przeczekać. Nie stać nas na kłótnię z koleją."
 wpl.5.t:0 "Odwet: groźba wojny"
 wpl.5.d:0 "Nasz kolejowy szantaż odbił się czkawką. Władze państwa [FROM.GetName] ogłosiły, że „nie da się trzymać za gardło” i przygotowuje się do zbrojnej odpowiedzi."
 wpl.5.a:0 "Trzeba było liczyć się z ryzykiem."
 wpl.9.t:0 "Protest dyplomatyczny"
 wpl.9.d:0 "Władze państwa [FROM.GetName] wręczyły naszemu przedstawicielowi notę protestacyjną i wezwało do bojkotu naszych przewozów. Na razie bojkot trwa głównie w mediach społecznościowych."
 wpl.9.a:0 "Pociągi i tak pojadą."
 WPL_tt_4:0 "Wpływy PKP w państwie [ROOT.GetName]: §R-20§!"
 wpl.6.t:0 "Oferta wrogiego przejęcia"
 wpl.6.d:0 "Holding PKP złożył nam ofertę „restrukturyzacji”: nasze państwo ma stać się spółką zależną, a rząd – radą nadzorczą. Odmowa, jak dyskretnie dodano, może skończyć się mniej uprzejmą formą negocjacji."
 wpl.6.a:0 "Zgodzić się. Lepiej być spółką niż ruiną."
 wpl.6.b:0 "Nie jesteśmy na sprzedaż."
 wpl.7.t:0 "Przejęcie zakończone"
 wpl.7.d:0 "Władze państwa [FROM.GetName] przyjęły naszą ofertę. Od dziś to spółka zależna holdingu PKP – z własną flagą, własnym rządem i naszym zarządem."
 wpl.7.a:0 "Witamy w grupie kapitałowej."
 wpl.8.t:0 "Przejęcie odrzucone"
 wpl.8.d:0 "Władze państwa [FROM.GetName] odrzuciły ofertę przejęcia. Rada nadzorcza uznała, że negocjacje trzeba będzie kontynuować innymi środkami – mamy cel wojenny."
 wpl.8.a:0 "Skoro nie po dobroci…"
 WPL_tt_5:0 "Dług wobec T-Pizzy zostaje §Gumorzony§!."
 WPL_tt_6:0 "Dług wobec T-Pizzy: §R+20§!."
 wpl.10.t:0 "Oferta wykupu od T-Pizzy"
 wpl.10.d:0 "Prezes T-Pizzy przysłał list z rachunkiem i propozycją. Rachunek jest długi, propozycja krótka: dług zostanie umorzony, jeśli zgodzimy się na „nadzór właścicielski”. W kopercie był też kupon na darmową pizzę."
 wpl.10.a:0 "Przyjąć. Długi same się nie spłacą."
 wpl.10.b:0 "Odmówić. Spłacimy po swojemu."
 wpl.11.t:0 "Wykup sfinalizowany"
 wpl.11.d:0 "Władze państwa [FROM.GetName] podpisały umowę. Dług umorzony, państwo pod naszym nadzorem, a w ratuszu wisi już menu z aktualnymi cenami."
 wpl.11.a:0 "Smacznego."
 wpl.12.t:0 "Wykup odrzucony"
 wpl.12.d:0 "Władze państwa [FROM.GetName] odrzuciły naszą ofertę. Dział windykacji dopisał odsetki karne i zaostrzył ton monitów."
 wpl.12.a:0 "Odsetki rosną."
 wpl.20.t:0 "Referendum: mieszkańcy za Bydgoszczą"
 wpl.20.d:0 "Lokale wyborcze zamknięto, a wyniki nie pozostawiają wątpliwości: mieszkańcy państwa [WPL_ref_cel.GetName] chcą łączyć się z Bydgoszczą. Na rynku już wiszą nowe tablice, a stary herb trafił do muzeum regionalnego."
 wpl.20.a:0 "Region wraca do domu."
 wpl.21.t:0 "Referendum przegrane"
 wpl.21.d:0 "Mieszkańcy państwa [WPL_ref_cel.GetName] powiedzieli „nie”. Nasi agitatorzy wracają do Bydgoszczy z pustymi rękami i plikiem niewykorzystanych ulotek."
 wpl.21.a:0 "Spróbujemy za kilka lat."
 WPL_tt_pkp_siec:0 "Wpływy PKP §G+8§! we wszystkich państwach strefy (Gdańsk, Gdynia, Świecie, Grudziądz, Tuchola, Chełmno, Bydgoszcz, Toruń, Zakon); powstają stałe połączenia kolejowe."
 WPL_tt_pkp_tranzyt:0 "Wpływy PKP §G+5§! w państwach, gdzie mamy już co najmniej 25 wpływów."
 WPL_tt_pkp_dworce:0 "Państwa, w których mamy co najmniej 50 wpływów, rozpatrzą wnioski koncesyjne. Każda koncesja daje co miesiąc §G+2§! siły politycznej."
 WPL_tt_pkp_szantaz:0 "Państwa z wpływami PKP od 25 do 79 dostają §Rblokadę kolejową§! (90 dni), a my §G+10§! wpływów. §RRyzyko odwetu§! – ok. 35% w każdym z nich."
 WPL_tt_pkp_przejecia:0 "Państwa z wpływami PKP §Y80+§! otrzymają ofertę przejęcia. Zgoda: stają się naszą §Yspółką zależną§!. Odmowa: §Rcel wojenny§!."
 WPL_tt_tpz_fr:0 "Wpływy T-Pizzy §G+8§! w państwach strefy (Dobrzyń, Kujawy, Toruń, Bydgoszcz, Płock); franczyzy dają co miesiąc wpływy i siłę polityczną."
 WPL_tt_tpz_kr:0 "Państwa strefy dostają dostawy (90 dni), a ich dług wobec T-Pizzy rośnie o §R15§!. Wpływy §G+6§!."
 WPL_req_satysfakcja2:0 "Satysfakcja klientów T-Pizzy jest wyższa niż §Y59§!"
 WPL_tt_tpz_wykup:0 "Państwa z wpływami §Y80+§! i długiem §Y30+§! otrzymają ofertę wykupu (zgoda: stają się naszym podmiotem)."
