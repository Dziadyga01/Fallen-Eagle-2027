 WWD_kpr_wojna_mpr_desc:0 "Państwo nie negocjuje z gangsterami. Oddziały ruszają na Ursus i Włochy."
 WWD_kpr_ofensywa:0 "Ofensywa w śródmieściu"
 WWD_kpr_ofensywa_desc:0 "Walka toczy się o mosty, skrzyżowania i stacje metra. Kto pierwszy je zajmie, ten wygra stolicę."
 WWD_kpr_z_umocnienie:0 "Wschodnie dzielnice w ręku Wojska"
 WWD_kpr_z_umocnienie_desc:0 "Rembertów, Wawer i Wesoła należą do Wojska. Kancelaria zamienia garnizony w bazy wypadowe na wschodnie przedmieścia."
 WWD_kpr_z_rekrutacja:0 "Pobór do Gwardii"
 WWD_kpr_z_rekrutacja_desc:0 "Kancelaria ogłasza nabór do Gwardii Prezydenckiej. Rezerwiści z wschodnich dzielnic stawiają się w koszarach."
 WWD_kpr_z_zaplecze:0 "Arsenał w Rembertowie"
 WWD_kpr_z_zaplecze_desc:0 "Magazyny Akademii i warsztaty garnizonowe pracują na potrzeby Kancelarii. Prezydent nie będzie zależny od cudzych dostaw."
 WWD_kpr_z_przyg_0:0 "Rozkaz operacyjny: Otwock"
 WWD_kpr_z_przyg_0_desc:0 "Sztab rysuje mapy dróg dojazdowych do miejscowości Otwock, liczy mosty i wybiera miejsca na punkty zborne. Granica zostaje zabezpieczona, a roszczenia – ogłoszone."
