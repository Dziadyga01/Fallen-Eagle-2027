 WWD_smr_z_wojna_2_desc:0 "Mamy ludzi, broń i plan. Kolumny ruszają w stronę miejscowości Piaseczno – szybkie zajęcie węzłów drogowych zdecyduje o wyniku."
 WWD_smr_z_int_2:0 "Integracja: Piaseczno"
 WWD_smr_z_int_2_desc:0 "Nowa administracja przejmuje urzędy, posterunki i magazyny. Mieszkańcy dostają przydziały żywności – i nowe dowody tożsamości."
 WWD_smr_z_region:0 "Region stołeczny pod władzą Sejmu"
 WWD_smr_z_region_desc:0 "Zachodnie przedmieścia uznają władzę Sejmu. Warszawa znów ma zaplecze – drogi, magazyny i ludzi."
 WWD_smr_proklamacja:0 "Proklamacja IV Rzeczypospolitej"
 WWD_smr_proklamacja_desc:0 "Warszawa jest nasza. Straż Marszałkowska może ogłosić narodziny nowego państwa – IV Rzeczypospolitej Polskiej."
 WWD_kpr_start:0 "Pałac nie ewakuuje się"
 WWD_kpr_start_desc:0 "Kancelaria zostaje w Pałacu Prezydenckim. Rozkaz jest krótki: państwo ma głowę i ta głowa się nie ukrywa."
 WWD_kpr_mob:0 "Rozkaz mobilizacyjny"
 WWD_kpr_mob_desc:0 "Kancelaria podpisuje rozkaz mobilizacyjny. Jednostki Wojska z Rembertowa i Wesołej dostają amunicję z magazynów centralnych."
 WWD_kpr_poparcie:0 "Orędzie do narodu"
 WWD_kpr_poparcie_desc:0 "Orędzie nadawane z Pałacu trafia do każdego radia w Warszawie: „Państwo nie zniknęło. Państwo jest tutaj”."
 WWD_kpr_sztab:0 "Biuro Bezpieczeństwa Narodowego"
 WWD_kpr_sztab_desc:0 "BBN zamienia się w sztab wojenny. Na stołach leżą plany ochrony mostów, elektrowni i Dworca Centralnego."
 WWD_kpr_propaganda:0 "Prezydent jest z wami"
 WWD_kpr_propaganda_desc:0 "Billboardy z flagą i hasłem „Prezydent jest z wami” pojawiają się na każdym skrzyżowaniu od Woli po Wawer."
 WWD_kpr_gospodarka:0 "Dekret o odbudowie"
 WWD_kpr_gospodarka_desc:0 "Dekret przekazuje opuszczone zakłady pod zarząd komisarzy Kancelarii. Linie produkcyjne ruszają jeszcze w tym miesiącu."
 WWD_kpr_marionetka:0 "Zwierzchnik Sił Zbrojnych"
 WWD_kpr_marionetka_desc:0 "Dowódcy garnizonów stawiają się w Pałacu. Wojsko uznaje zwierzchnictwo Prezydenta – na razie jako sojusznik, nie jako podwładny."
 WWD_kpr_wcielenie:0 "Gwardia Prezydencka"
 WWD_kpr_wcielenie_desc:0 "Wojsko zostaje formalnie podporządkowane Kancelarii jako Gwardia Prezydencka. Sztandary jednostek dostają nowe barwy."
 WWD_kpr_autonomia:0 "Armia jako partner"
 WWD_kpr_autonomia_desc:0 "Wojsko zachowuje własne dowództwo i budżet. Pałac daje sprzęt, Wojsko daje bagnety – układ wygodny dla obu stron."
 WWD_kpr_dzielnice:0 "Pełnomocnicy Prezydenta w dzielnicach"
 WWD_kpr_dzielnice_desc:0 "Do niezależnych dzielnic jadą pełnomocnicy z listami nominacyjnymi i eskortą żandarmerii."
 WWD_kpr_ult_prg:0 "Ultimatum: Praga"
 WWD_kpr_ult_prg_desc:0 "Kancelaria Prezydenta żąda od władz dzielnicy Praga podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_kpr_ult_zie:0 "Ultimatum: Bielany (Zieloni)"
 WWD_kpr_ult_zie_desc:0 "Kancelaria Prezydenta żąda od władz dzielnicy Bielany (Zieloni) podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_kpr_ult_tec:0 "Ultimatum: Powiśle (Tęczowa Republika)"
 WWD_kpr_ult_tec_desc:0 "Kancelaria Prezydenta żąda od władz dzielnicy Powiśle (Tęczowa Republika) podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_kpr_nasze:0 "Stolica pod jedną flagą"
 WWD_kpr_nasze_desc:0 "Biało-czerwone flagi wracają na ratusze dzielnic. Pałac mówi już nie o „strefach”, ale o „odzyskanej stolicy”."
 WWD_kpr_koalicja:0 "Koalicja przeciw przestępczości"
 WWD_kpr_koalicja_desc:0 "Prezydent proponuje Marszałkowi zawieszenie sporów. Najpierw trzeba rozbić Pruszków – o władzę można się kłócić później."
 WWD_kpr_k_sztab:0 "Wspólny sztab antymafijny"
 WWD_kpr_k_sztab_desc:0 "Oficerowie Policji, żandarmerii i Straży Marszałkowskiej siadają przy jednym stole. Listy gończe są wspólne, a kartoteki Pruszkowa – po raz pierwszy kompletne."
