l_english:
 WWD_smr_start:0 "Sejm obraduje dalej"
 WWD_smr_start_desc:0 "Kraj się rozpadł, ale Sejm wciąż obraduje – w kurtkach, przy agregatach. Marszałek ogłasza, że Rzeczpospolita trwa tak długo, jak trwa posiedzenie."
 WWD_smr_mob:0 "Mobilizacja Straży Marszałkowskiej"
 WWD_smr_mob_desc:0 "Straż Marszałkowska otwiera magazyny, a komendy Policji dostają nowe radiowozy, kamizelki i amunicję."
 WWD_smr_poparcie:0 "Głos z Wiejskiej"
 WWD_smr_poparcie_desc:0 "Pod Sejmem gromadzą się tysiące ludzi. Chcą prądu, chleba i kogoś, kto powie, że państwo jeszcze istnieje."
 WWD_smr_sztab:0 "Sztab kryzysowy przy Wiejskiej"
 WWD_smr_sztab_desc:0 "W Sali Kolumnowej powstaje sztab: mapy dzielnic, telefony satelitarne i posłowie na dyżurach przez całą dobę."
 WWD_smr_propaganda:0 "Transmisje z sali plenarnej"
 WWD_smr_propaganda_desc:0 "Telewizja sejmowa nadaje bez przerwy. Każda uchwała to dowód, że prawo nie umarło razem z państwem."
 WWD_smr_gospodarka:0 "Ustawa o odbudowie stolicy"
 WWD_smr_gospodarka_desc:0 "Pierwsza ustawa przyjęta w nowej rzeczywistości: pieniądze z rezerw idą na zakłady na Woli i warsztaty na Bemowie."
 WWD_smr_marionetka:0 "Policja pod nadzorem Sejmu"
 WWD_smr_marionetka_desc:0 "Komendant Stołeczny składa raport Marszałkowi. Policja zostaje formalnie podporządkowana Komisji Bezpieczeństwa."
 WWD_smr_wcielenie:0 "Straż Sejmowa"
 WWD_smr_wcielenie_desc:0 "Policja przestaje być osobnym bytem. Funkcjonariusze składają przysięgę przed Marszałkiem i stają się Strażą Sejmową."
 WWD_smr_autonomia:0 "Policja jako partner"
 WWD_smr_autonomia_desc:0 "Policja zachowuje własne dowództwo, ale dostaje pieniądze, sprzęt i pełne wsparcie Sejmu. Lojalność kupiona zaufaniem."
 WWD_smr_dzielnice:0 "Dzielnice pod opieką Sejmu"
 WWD_smr_dzielnice_desc:0 "Posłowie jadą do niezależnych dzielnic z jedną propozycją: wróćcie do Rzeczypospolitej, zanim zabierze was ktoś inny."
 WWD_smr_ult_prg:0 "Ultimatum: Praga"
 WWD_smr_ult_prg_desc:0 "Straż Marszałkowska żąda od władz dzielnicy Praga podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_smr_ult_zie:0 "Ultimatum: Bielany (Zieloni)"
 WWD_smr_ult_zie_desc:0 "Straż Marszałkowska żąda od władz dzielnicy Bielany (Zieloni) podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_smr_ult_tec:0 "Ultimatum: Powiśle (Tęczowa Republika)"
 WWD_smr_ult_tec_desc:0 "Straż Marszałkowska żąda od władz dzielnicy Powiśle (Tęczowa Republika) podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_smr_nasze:0 "Warszawa wraca do państwa"
 WWD_smr_nasze_desc:0 "Na urzędach dzielnic znów wiszą godła. Sejm ma za sobą większość stolicy."
 WWD_smr_koalicja:0 "Koalicja przeciw przestępczości"
 WWD_smr_koalicja_desc:0 "Marszałek dzwoni do Pałacu Prezydenckiego. Dawni rywale mają wspólnego wroga: Pruszków kupuje dzielnicę po dzielnicy. Propozycja jest prosta – wspólny front przeciw mafii."
 WWD_smr_k_sztab:0 "Wspólny sztab antymafijny"
 WWD_smr_k_sztab_desc:0 "Oficerowie Policji, żandarmerii i Straży Marszałkowskiej siadają przy jednym stole. Listy gończe są wspólne, a kartoteki Pruszkowa – po raz pierwszy kompletne."
 WWD_smr_k_majatki:0 "Zamrożenie majątków Pruszkowa"
 WWD_smr_k_majatki_desc:0 "Konta, kantory, myjnie i hurtownie Rodziny trafiają pod nadzór koalicji. Pruszków musi płacić swoim ludziom z zapasów."
 WWD_smr_k_pruszkow:0 "Operacja „Pruszków”"
 WWD_smr_k_pruszkow_desc:0 "Koalicja uderza na Ursus, Włochy i zaplecze w Pruszkowie. Cel: rozbić Rodzinę i jej bojówki stadionowe, zanim przejmą resztę stolicy."
 WWD_smr_k_wspolna:0 "Wspólna Rzeczpospolita"
 WWD_smr_k_wspolna_desc:0 "Mafia jest rozbita. Teraz koalicja musi odpowiedzieć na najtrudniejsze pytanie: kto stanie na czele odrodzonej Rzeczypospolitej?"
 WWD_smr_samo:0 "Sami ocalimy państwo"
 WWD_smr_samo_desc:0 "Sejm nie będzie dzielił władzy z Pałacem. Rzeczpospolitą odbuduje parlament – sam, z Policją u boku."
 WWD_smr_wojna_par:0 "Rozprawa z Kancelarią Prezydenta"
 WWD_smr_wojna_par_desc:0 "Dwa ośrodki władzy w jednym mieście to o jeden za dużo. Straż Marszałkowska rusza przeciw rywalom z drugiej strony Krakowskiego Przedmieścia."
 WWD_smr_wojna_mpr:0 "Wojna z Pruszkowem"
 WWD_smr_wojna_mpr_desc:0 "Państwo nie negocjuje z gangsterami. Oddziały ruszają na Ursus i Włochy."
 WWD_smr_ofensywa:0 "Ofensywa w śródmieściu"
 WWD_smr_ofensywa_desc:0 "Walka toczy się o mosty, skrzyżowania i stacje metra. Kto pierwszy je zajmie, ten wygra stolicę."
 WWD_smr_z_umocnienie:0 "Kontrola nad zachodnimi dzielnicami"
 WWD_smr_z_umocnienie_desc:0 "Bemowo, Wola, Ochota i Żoliborz są pod kontrolą Policji. Sejm umacnia posterunki i przejmuje urzędy dzielnic – to zaplecze dla każdej dalszej operacji."
 WWD_smr_z_rekrutacja:0 "Nabór do Straży Marszałkowskiej"
 WWD_smr_z_rekrutacja_desc:0 "Ochotnicy z zachodnich dzielnic zgłaszają się do Straży. Sejm obiecuje żołd, mieszkania służbowe i amnestię dla dezerterów."
 WWD_smr_z_zaplecze:0 "Zaplecze na Bemowie"
 WWD_smr_z_zaplecze_desc:0 "Hale na Bemowie zamieniają się w warsztaty i magazyny. Straż Marszałkowska będzie miała własną broń i amunicję."
 WWD_smr_z_przyg_0:0 "Przygotowanie operacji: Ożarów Mazowiecki"
 WWD_smr_z_przyg_0_desc:0 "Sztab rysuje mapy dróg dojazdowych do miejscowości Ożarów Mazowiecki, liczy mosty i wybiera miejsca na punkty zborne. Granica zostaje zabezpieczona, a roszczenia – ogłoszone."
 WWD_smr_z_wojna_0:0 "Ofensywa: Ożarów Mazowiecki"
 WWD_smr_z_wojna_0_desc:0 "Mamy ludzi, broń i plan. Kolumny ruszają w stronę miejscowości Ożarów Mazowiecki – szybkie zajęcie węzłów drogowych zdecyduje o wyniku."
 WWD_smr_z_int_0:0 "Integracja: Ożarów Mazowiecki"
 WWD_smr_z_int_0_desc:0 "Nowa administracja przejmuje urzędy, posterunki i magazyny. Mieszkańcy dostają przydziały żywności – i nowe dowody tożsamości."
 WWD_smr_z_przyg_1:0 "Przygotowanie operacji: Grodzisk Mazowiecki"
 WWD_smr_z_przyg_1_desc:0 "Sztab rysuje mapy dróg dojazdowych do miejscowości Grodzisk Mazowiecki, liczy mosty i wybiera miejsca na punkty zborne. Granica zostaje zabezpieczona, a roszczenia – ogłoszone."
