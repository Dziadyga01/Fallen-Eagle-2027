 WWD_kpr_z_wojna_2_desc:0 "Mamy ludzi, broń i plan. Kolumny ruszają w stronę miejscowości Piaseczno – szybkie zajęcie węzłów drogowych zdecyduje o wyniku."
 WWD_kpr_z_int_2:0 "Integracja: Piaseczno"
 WWD_kpr_z_int_2_desc:0 "Nowa administracja przejmuje urzędy, posterunki i magazyny. Mieszkańcy dostają przydziały żywności – i nowe dowody tożsamości."
 WWD_kpr_z_region:0 "Region stołeczny pod władzą Prezydenta"
 WWD_kpr_z_region_desc:0 "Wschodnie przedmieścia podlegają komisarzom Kancelarii. Pałac kontroluje drogi, mosty i linie kolejowe wokół stolicy."
 WWD_kpr_proklamacja:0 "Proklamacja IV Rzeczypospolitej"
 WWD_kpr_proklamacja_desc:0 "Warszawa jest nasza. Kancelaria Prezydenta może ogłosić narodziny nowego państwa – IV Rzeczypospolitej Polskiej."
 WWD_mpr_start:0 "Pruszków przejmuje interes"
 WWD_mpr_start_desc:0 "Państwo upadło, ale interes się kręci. Rodzina zwołuje naradę: kto dziś trzyma Warszawę, ten jutro będzie ją trzymał legalnie."
 WWD_mpr_mob:0 "Gotówka na stół"
 WWD_mpr_mob_desc:0 "Pruszków płaci gotówką. Kibice dostają kominiarki, a „ochrona” z Ursusa – nowe furgonetki i broń z magazynów hurtowni."
 WWD_mpr_poparcie:0 "Ochrona dla każdego sklepu"
 WWD_mpr_poparcie_desc:0 "Sklepy, stacje i bazary płacą za „ochronę”. W zamian kradzieże na ulicach znikają – konkurencja nie ma szans."
 WWD_mpr_sztab:0 "Narada na Ursusie"
 WWD_mpr_sztab_desc:0 "Na zapleczu restauracji na Ursusie zbiera się „zarząd”. Plan jest prosty: każda dzielnica ma swojego opiekuna."
 WWD_mpr_propaganda:0 "Ludzie z miasta mówią"
 WWD_mpr_propaganda_desc:0 "Na podwórkach mówi się, że Rodzina płaci lepiej niż państwo i dotrzymuje słowa. Plotka działa lepiej niż telewizja."
 WWD_mpr_gospodarka:0 "Pralnia na pełnych obrotach"
 WWD_mpr_gospodarka_desc:0 "Myjnie, kantory i hurtownie piorą pieniądze, a za pieniądze rosną nowe warsztaty i magazyny."
 WWD_mpr_marionetka:0 "Żyleta na usługach Rodziny"
 WWD_mpr_marionetka_desc:0 "Kibice Legii dostają etaty w „firmach ochroniarskich” Pruszkowa. Kto rządzi Żyletą, ten ma żołnierzy."
 WWD_mpr_wcielenie:0 "Kibice w firmach ochroniarskich"
 WWD_mpr_wcielenie_desc:0 "Bojówki stadionowe przestają być osobną siłą. Klub zostaje, niezależność – nie."
 WWD_mpr_autonomia:0 "Klub zostaje klubem"
 WWD_mpr_autonomia_desc:0 "Kibice zachowują własne struktury i własne barwy. Rodzina płaci, a Żyleta pamięta, kto płaci."
 WWD_mpr_dzielnice:0 "Propozycje nie do odrzucenia"
 WWD_mpr_dzielnice_desc:0 "Do rad niezależnych dzielnic przychodzą eleganccy panowie z kopertami i równie eleganckimi groźbami."
 WWD_mpr_ult_prg:0 "Ultimatum: Praga"
 WWD_mpr_ult_prg_desc:0 "Mafia Pruszkowska żąda od władz dzielnicy Praga podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_mpr_ult_zie:0 "Ultimatum: Bielany (Zieloni)"
 WWD_mpr_ult_zie_desc:0 "Mafia Pruszkowska żąda od władz dzielnicy Bielany (Zieloni) podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_mpr_ult_tec:0 "Ultimatum: Powiśle (Tęczowa Republika)"
 WWD_mpr_ult_tec_desc:0 "Mafia Pruszkowska żąda od władz dzielnicy Powiśle (Tęczowa Republika) podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_mpr_nasze:0 "Całe miasto płaci"
 WWD_mpr_nasze_desc:0 "Od Białołęki po Wilanów każdy wie, komu się płaci. Rodzina nie potrzebuje flag – wystarczą jej faktury."
 WWD_mpr_przekupstwo:0 "Kupowanie polityków"
 WWD_mpr_przekupstwo_desc:0 "Koperty trafiają do posłów, urzędników Kancelarii i oficerów. Nie wszyscy biorą – ale wystarczy, że biorą niektórzy."
 WWD_mpr_osmiornica:0 "Ośmiornica"
 WWD_mpr_osmiornica_desc:0 "Ludzie Rodziny są w urzędach dzielnic, na komisariatach i w spółdzielniach mieszkaniowych."
 WWD_mpr_obrona:0 "Obrona Pruszkowa"
 WWD_mpr_obrona_desc:0 "Koalicja państwowa szykuje się do uderzenia. Rodzina zamienia hurtownie w bunkry, a kibiców – w garnizony."
 WWD_mpr_wojna_smr:0 "Wojna z Sejmem"
 WWD_mpr_wojna_smr_desc:0 "Parlament, który nie ma pieniędzy, ma tylko słowa. Rodzina pokaże, ile są warte."
 WWD_mpr_wojna_kpr:0 "Wojna z Kancelarią"
 WWD_mpr_wojna_kpr_desc:0 "Pałac ma Wojsko, ale Wojsko też trzeba karmić. Rodzina uderza tam, gdzie kończą się zapasy."
 WWD_mpr_ofensywa:0 "Nocna ofensywa"
 WWD_mpr_ofensywa_desc:0 "Furgonetki bez tablic, bojówki w kominiarkach i ataki tam, gdzie nikt się nie spodziewa."
 WWD_mpr_z_umocnienie:0 "Pruszków i Ursus pod kontrolą"
 WWD_mpr_z_umocnienie_desc:0 "Rodzina trzyma Pruszków, Ursus i Włochy. Każda hurtownia ma ochronę, każdy przystanek – obserwatora. To baza dla dalszych interesów."
 WWD_mpr_z_rekrutacja:0 "Nowi ludzie w Rodzinie"
 WWD_mpr_z_rekrutacja_desc:0 "Kto chce zarobić, zgłasza się do „biura” na Ursusie. Rodzina płaci lepiej niż państwo i nie zadaje pytań."
 WWD_mpr_z_zaplecze:0 "Magazyny w Pruszkowie"
 WWD_mpr_z_zaplecze_desc:0 "Hurtownie w Pruszkowie dostają nowy towar: broń, amunicję i kamizelki. Interes musi mieć zabezpieczenie."
 WWD_mpr_z_przyg_0:0 "Przygotowanie operacji: Piaseczno"
 WWD_mpr_z_przyg_0_desc:0 "Sztab rysuje mapy dróg dojazdowych do miejscowości Piaseczno, liczy mosty i wybiera miejsca na punkty zborne. Granica zostaje zabezpieczona, a roszczenia – ogłoszone."
 WWD_mpr_z_wojna_0:0 "Ofensywa: Piaseczno"
 WWD_mpr_z_wojna_0_desc:0 "Mamy ludzi, broń i plan. Kolumny ruszają w stronę miejscowości Piaseczno – szybkie zajęcie węzłów drogowych zdecyduje o wyniku."
 WWD_mpr_z_int_0:0 "Integracja: Piaseczno"
 WWD_mpr_z_int_0_desc:0 "Nowa administracja przejmuje urzędy, posterunki i magazyny. Mieszkańcy dostają przydziały żywności – i nowe dowody tożsamości."
 WWD_mpr_z_przyg_1:0 "Przygotowanie operacji: Grodzisk Mazowiecki"
 WWD_mpr_z_przyg_1_desc:0 "Sztab rysuje mapy dróg dojazdowych do miejscowości Grodzisk Mazowiecki, liczy mosty i wybiera miejsca na punkty zborne. Granica zostaje zabezpieczona, a roszczenia – ogłoszone."
 WWD_mpr_z_wojna_1:0 "Ofensywa: Grodzisk Mazowiecki"
 WWD_mpr_z_wojna_1_desc:0 "Mamy ludzi, broń i plan. Kolumny ruszają w stronę miejscowości Grodzisk Mazowiecki – szybkie zajęcie węzłów drogowych zdecyduje o wyniku."
 WWD_mpr_z_int_1:0 "Integracja: Grodzisk Mazowiecki"
 WWD_mpr_z_int_1_desc:0 "Nowa administracja przejmuje urzędy, posterunki i magazyny. Mieszkańcy dostają przydziały żywności – i nowe dowody tożsamości."
 WWD_mpr_z_przyg_2:0 "Przygotowanie operacji: Ożarów Mazowiecki"
 WWD_mpr_z_przyg_2_desc:0 "Sztab rysuje mapy dróg dojazdowych do miejscowości Ożarów Mazowiecki, liczy mosty i wybiera miejsca na punkty zborne. Granica zostaje zabezpieczona, a roszczenia – ogłoszone."
 WWD_mpr_z_wojna_2:0 "Ofensywa: Ożarów Mazowiecki"
 WWD_mpr_z_wojna_2_desc:0 "Mamy ludzi, broń i plan. Kolumny ruszają w stronę miejscowości Ożarów Mazowiecki – szybkie zajęcie węzłów drogowych zdecyduje o wyniku."
 WWD_mpr_z_int_2:0 "Integracja: Ożarów Mazowiecki"
 WWD_mpr_z_int_2_desc:0 "Nowa administracja przejmuje urzędy, posterunki i magazyny. Mieszkańcy dostają przydziały żywności – i nowe dowody tożsamości."
 WWD_mpr_z_region:0 "Region stołeczny pod opieką Rodziny"
 WWD_mpr_z_region_desc:0 "Od Piaseczna po Grodzisk wszyscy wiedzą, komu się płaci. Rodzina kontroluje południe i zachód stolicy."
 WWD_mpr_proklamacja:0 "Proklamacja IV Rzeczypospolitej"
 WWD_mpr_proklamacja_desc:0 "Warszawa jest nasza. Mafia Pruszkowska może ogłosić narodziny nowego państwa – IV Rzeczypospolitej Polskiej."
 WWD_plc_start:0 "Komenda Stołeczna działa"
 WWD_plc_start_desc:0 "Pałac Mostowskich wciąż ma prąd i łączność. Komendant ogłasza, że Policja pozostaje na służbie – i że ktoś musi za tę służbę płacić."
 WWD_plc_kadry:0 "Szkoła Policji"
 WWD_plc_kadry_desc:0 "Kursanci kończą szkolenie w trybie przyspieszonym. Teoria jest krótka, praktyka – na ulicach Woli i Ochoty."
 WWD_plc_sprzet:0 "Magazyny Komendy"
 WWD_plc_sprzet_desc:0 "Z magazynów Komendy wyjeżdżają kamizelki, hełmy, tarcze i broń długa, która od lat czekała na przetarg."
 WWD_plc_szkolenie:0 "Ćwiczenia w terenie zabudowanym"
 WWD_plc_szkolenie_desc:0 "Opuszczone bloki i hale stają się poligonem. Żołnierze uczą się zdobywać klatki schodowe i bronić skrzyżowań."
 WWD_plc_rekrutacja:0 "Nabór ochotników"
 WWD_plc_rekrutacja_desc:0 "Punkty werbunkowe w dzielnicach przyjmują każdego, kto umie trzymać broń – i kilku, którzy dopiero się nauczą."
 WWD_plc_magazyny:0 "Uzupełnienie zapasów"
 WWD_plc_magazyny_desc:0 "Amunicja, racje i części zamienne – bez nich najlepsza armia staje po tygodniu."
 WWD_plc_warsztaty:0 "Własne warsztaty zbrojeniowe"
 WWD_plc_warsztaty_desc:0 "Warsztaty w podwarszawskich halach zaczynają produkować broń i amunicję na potrzeby formacji."
 WWD_plc_doktryna:0 "Doktryna walki w mieście"
 WWD_plc_doktryna_desc:0 "Doświadczenia z pierwszych starć trafiają do regulaminów. Każdy dowódca plutonu wie, co robić, gdy straci łączność."
 WWD_plc_bron:0 "Modernizacja uzbrojenia"
 WWD_plc_bron_desc:0 "Rusznikarze i inżynierowie poprawiają to, co mamy, i projektują to, czego nam brakuje."
 WWD_plc_bron_tb:0 "Modernizacja uzbrojenia"
 WWD_plc_elita:0 "Biuro Operacji Antyterrorystycznych"
 WWD_plc_elita_desc:0 "Kontrterroryści z BOA stają się zalążkiem elitarnej formacji. Każdy ich oddział jest wart batalionu zwykłej piechoty."
 WWD_plc_dowodcy:0 "Nowi dowódcy"
 WWD_plc_dowodcy_desc:0 "Awanse dla tych, którzy sprawdzili się w walce, emerytury dla tych, którzy sprawdzili się tylko na naradach."
 WWD_plc_ciezki:0 "Opancerzone radiowozy"
 WWD_plc_ciezki_desc:0 "Warsztaty na Bemowie montują pancerz na furgonetki i radiowozy. Brzydkie, ciężkie – i odporne na kule."
 WWD_plc_ciezki_tb:0 "Opancerzone radiowozy"
 WWD_plc_lojalnosc:0 "Do dyspozycji Marszałka"
 WWD_plc_lojalnosc_desc:0 "Komendant przekazuje Straży Marszałkowskiej część sprzętu i najlepszych ludzi. Sejm wie, kto stoi za jego bezpieczeństwem."
 WWD_plc_final:0 "Stołeczna Gwardia Porządku"
 WWD_plc_final_desc:0 "Z policji miejskiej powstała formacja zdolna prowadzić walkę o stolicę: wyszkolona, uzbrojona i lojalna."
 WWD_woj_start:0 "Garnizon Warszawa w gotowości"
 WWD_woj_start_desc:0 "Jednostki z Rembertowa, Wesołej i Wawra nie rozeszły się do domów. Dowódcy czekają na rozkazy – i pilnują magazynów."
 WWD_woj_kadry:0 "Akademia w Rembertowie"
 WWD_woj_kadry_desc:0 "Wykładowcy Akademii Sztuki Wojennej prowadzą kursy dla oficerów rezerwy. Wojna o stolicę wymaga dowódców, nie tylko żołnierzy."
 WWD_woj_sprzet:0 "Magazyny garnizonowe"
 WWD_woj_sprzet_desc:0 "Otwieramy magazyny mobilizacyjne: broń, amunicja, radiostacje i sprzęt inżynieryjny."
 WWD_woj_szkolenie:0 "Ćwiczenia w terenie zabudowanym"
 WWD_woj_szkolenie_desc:0 "Opuszczone bloki i hale stają się poligonem. Żołnierze uczą się zdobywać klatki schodowe i bronić skrzyżowań."
 WWD_woj_rekrutacja:0 "Nabór ochotników"
 WWD_woj_rekrutacja_desc:0 "Punkty werbunkowe w dzielnicach przyjmują każdego, kto umie trzymać broń – i kilku, którzy dopiero się nauczą."
 WWD_woj_magazyny:0 "Uzupełnienie zapasów"
 WWD_woj_magazyny_desc:0 "Amunicja, racje i części zamienne – bez nich najlepsza armia staje po tygodniu."
 WWD_woj_warsztaty:0 "Własne warsztaty zbrojeniowe"
 WWD_woj_warsztaty_desc:0 "Warsztaty w podwarszawskich halach zaczynają produkować broń i amunicję na potrzeby formacji."
 WWD_woj_doktryna:0 "Doktryna walki w mieście"
 WWD_woj_doktryna_desc:0 "Doświadczenia z pierwszych starć trafiają do regulaminów. Każdy dowódca plutonu wie, co robić, gdy straci łączność."
 WWD_woj_bron:0 "Modernizacja uzbrojenia"
 WWD_woj_bron_desc:0 "Rusznikarze i inżynierowie poprawiają to, co mamy, i projektują to, czego nam brakuje."
 WWD_woj_bron_tb:0 "Modernizacja uzbrojenia"
 WWD_woj_elita:0 "Brygada zmechanizowana"
 WWD_woj_elita_desc:0 "Najlepsze kompanie łączą się w brygadę zmechanizowaną z własną artylerią i rozpoznaniem."
 WWD_woj_dowodcy:0 "Nowi dowódcy"
 WWD_woj_dowodcy_desc:0 "Awanse dla tych, którzy sprawdzili się w walce, emerytury dla tych, którzy sprawdzili się tylko na naradach."
 WWD_woj_ciezki:0 "Artyleria z Wesołej"
 WWD_woj_ciezki_desc:0 "Haubice i moździerze z parku sprzętowego wracają do służby. W walkach ulicznych liczy się siła ognia."
 WWD_woj_ciezki_tb:0 "Artyleria z Wesołej"
 WWD_woj_lojalnosc:0 "Do dyspozycji Prezydenta"
 WWD_woj_lojalnosc_desc:0 "Wojsko przekazuje Kancelarii sprzęt i oddziały. Zwierzchnik Sił Zbrojnych nie będzie już tylko tytułem."
 WWD_woj_final:0 "Armia Prezydencka"
 WWD_woj_final_desc:0 "Wojsko jest znów armią: z dowództwem, logistyką i doktryną. Pałac ma za sobą siłę, z którą trzeba się liczyć."
 WWD_leg_start:0 "Żyleta zwiera szeregi"
 WWD_leg_start_desc:0 "Stadion przy Łazienkowskiej stał się koszarami. Kibice dzielą się na „sekcje” i pilnują Mokotowa jak własnej trybuny."
 WWD_leg_kadry:0 "Obozy na Mazurach"
 WWD_leg_kadry_desc:0 "Treningi w lasach, walki w formule bez zasad i musztra z gwizdkiem. Bojówki uczą się działać jak wojsko."
 WWD_leg_sprzet:0 "Arsenał z Łazienkowskiej"
 WWD_leg_sprzet_desc:0 "Pod trybunami znaleziono więcej broni, niż ktokolwiek się spodziewał. Pruszków dorzuca resztę."
 WWD_leg_szkolenie:0 "Ćwiczenia w terenie zabudowanym"
 WWD_leg_szkolenie_desc:0 "Opuszczone bloki i hale stają się poligonem. Żołnierze uczą się zdobywać klatki schodowe i bronić skrzyżowań."
 WWD_leg_rekrutacja:0 "Nabór ochotników"
 WWD_leg_rekrutacja_desc:0 "Punkty werbunkowe w dzielnicach przyjmują każdego, kto umie trzymać broń – i kilku, którzy dopiero się nauczą."
 WWD_leg_magazyny:0 "Uzupełnienie zapasów"
 WWD_leg_magazyny_desc:0 "Amunicja, racje i części zamienne – bez nich najlepsza armia staje po tygodniu."
 WWD_leg_warsztaty:0 "Własne warsztaty zbrojeniowe"
 WWD_leg_warsztaty_desc:0 "Warsztaty w podwarszawskich halach zaczynają produkować broń i amunicję na potrzeby formacji."
 WWD_leg_doktryna:0 "Doktryna walki w mieście"
 WWD_leg_doktryna_desc:0 "Doświadczenia z pierwszych starć trafiają do regulaminów. Każdy dowódca plutonu wie, co robić, gdy straci łączność."
 WWD_leg_bron:0 "Modernizacja uzbrojenia"
 WWD_leg_bron_desc:0 "Rusznikarze i inżynierowie poprawiają to, co mamy, i projektują to, czego nam brakuje."
 WWD_leg_bron_tb:0 "Modernizacja uzbrojenia"
 WWD_leg_elita:0 "Bojówki stadionowe"
 WWD_leg_elita_desc:0 "Najtwardsi z twardych tworzą oddziały szturmowe – szybkie, brutalne i lojalne wobec swoich."
 WWD_leg_dowodcy:0 "Nowi dowódcy"
 WWD_leg_dowodcy_desc:0 "Awanse dla tych, którzy sprawdzili się w walce, emerytury dla tych, którzy sprawdzili się tylko na naradach."
 WWD_leg_ciezki:0 "Furgonetki szturmowe"
 WWD_leg_ciezki_desc:0 "Furgonetki z blachą zamiast szyb i karabinami na dachu. Mobilność ważniejsza niż elegancja."
 WWD_leg_ciezki_tb:0 "Furgonetki szturmowe"
 WWD_leg_lojalnosc:0 "Na usługach Rodziny"
 WWD_leg_lojalnosc_desc:0 "Kibice przekazują Pruszkowowi ludzi i sprzęt. Rodzina płaci – Żyleta dowozi."
 WWD_leg_final:0 "Legion Warszawski"
 WWD_leg_final_desc:0 "Z kibiców powstała armia z własnymi barwami, dowódcami i legendą. Kto ich lekceważy, przegrywa."
 WWD_prg_start:0 "Praga sama sobie"
 WWD_prg_start_desc:0 "Most Śląsko-Dąbrowski stoi pusty, a po drugiej stronie Wisły trzy bloki walczą o władzę. Praga od zawsze radziła sobie sama – teraz też musi."
 WWD_prg_straz:0 "Straż Bazaru Różyckiego"
 WWD_prg_straz_desc:0 "Kupcy z Różyckiego i chłopaki z Ząbkowskiej tworzą straż dzielnicową. Mają opaski, krótkofalówki i znają każde podwórko."
 WWD_prg_zasoby:0 "Zapasy z Bródna"
 WWD_prg_zasoby_desc:0 "Magazyny na Targówku i Bródnie przechodzą pod zarząd rady dzielnicy. Najpierw chleb i opał, potem polityka."
 WWD_prg_barykady:0 "Barykady na Targowej"
 WWD_prg_barykady_desc:0 "Tramwaje ustawione w poprzek ulic, worki z piaskiem na rogach. Kto chce wejść na Pragę, musi przejść przez Targową."
 WWD_prg_ochotnicy:0 "Ochotnicy z podwórek"
 WWD_prg_ochotnicy_desc:0 "Każda klatka schodowa wystawia kilku ochotników. Nie są żołnierzami, ale bronią własnych domów."
 WWD_prg_gospodarka:0 "Warsztaty prawego brzegu"
 WWD_prg_gospodarka_desc:0 "Dawne zakłady na Pradze Południe znów pracują – na potrzeby dzielnicy, nie stolicy."
 WWD_prg_liga:0 "Liga Wolnych Dzielnic"
 WWD_prg_liga_desc:0 "Niezależne dzielnice muszą trzymać się razem, inaczej bloki zjedzą je po kolei. Proponujemy Pradze, Bielanom i Powiślu wspólną obronę."
 WWD_prg_patron:0 "Pod skrzydła patrona"
 WWD_prg_patron_desc:0 "Samotna dzielnica nie przetrwa wojny bloków. Lepiej samemu wybrać opiekuna, niż czekać, aż ktoś wybierze nas siłą."
 WWD_prg_twierdza:0 "Wspólna obrona"
 WWD_prg_twierdza_desc:0 "Dzielnice Ligi wymieniają się bronią, ludźmi i informacjami. Atak na jedną z nich to atak na wszystkie."
 WWD_prg_nagroda:0 "Nagroda za lojalność"
 WWD_prg_nagroda_desc:0 "Patron dotrzymuje słowa: dzielnica dostaje sprzęt, pieniądze i obietnicę, że jej rada zachowa autonomię."
 WWD_prg_final:0 "Wolna Praga"
 WWD_prg_final_desc:0 "Praga przetrwała. Ma własną radę, własną straż i własne zdanie – jak zawsze."
 WWD_zie_start:0 "Bielany w kryzysie"
 WWD_zie_start_desc:0 "Zieloni przejmują zarząd dzielnicy z obietnicą: żadnych bloków, żadnej mafii, tylko ludzie i Las Bielański."
 WWD_zie_straz:0 "Straż Lasu Bielańskiego"
 WWD_zie_straz_desc:0 "Ochotnicy z AWF i harcerze tworzą straż dzielnicową. Znają las lepiej niż ktokolwiek z centrum."
 WWD_zie_zasoby:0 "Ogrody społeczne"
 WWD_zie_zasoby_desc:0 "Trawniki zamieniają się w grządki, a szklarnie przy uczelniach – w spiżarnie dzielnicy."
 WWD_zie_barykady:0 "Linia na Marymonckiej"
 WWD_zie_barykady_desc:0 "Wzdłuż Marymonckiej powstają umocnienia z drzew, gruzu i porzuconych samochodów."
 WWD_zie_ochotnicy:0 "Ochotnicy z podwórek"
 WWD_zie_ochotnicy_desc:0 "Każda klatka schodowa wystawia kilku ochotników. Nie są żołnierzami, ale bronią własnych domów."
 WWD_zie_gospodarka:0 "Zielona energia dla dzielnicy"
 WWD_zie_gospodarka_desc:0 "Panele na dachach bloków i magazyny energii w szkołach dają Bielanom prąd, gdy reszta miasta tonie w ciemności."
 WWD_zie_liga:0 "Liga Wolnych Dzielnic"
 WWD_zie_liga_desc:0 "Niezależne dzielnice muszą trzymać się razem, inaczej bloki zjedzą je po kolei. Proponujemy Pradze, Bielanom i Powiślu wspólną obronę."
 WWD_zie_patron:0 "Pod skrzydła patrona"
 WWD_zie_patron_desc:0 "Samotna dzielnica nie przetrwa wojny bloków. Lepiej samemu wybrać opiekuna, niż czekać, aż ktoś wybierze nas siłą."
 WWD_zie_twierdza:0 "Wspólna obrona"
 WWD_zie_twierdza_desc:0 "Dzielnice Ligi wymieniają się bronią, ludźmi i informacjami. Atak na jedną z nich to atak na wszystkie."
 WWD_zie_nagroda:0 "Nagroda za lojalność"
 WWD_zie_nagroda_desc:0 "Patron dotrzymuje słowa: dzielnica dostaje sprzęt, pieniądze i obietnicę, że jej rada zachowa autonomię."
 WWD_zie_final:0 "Zielona Republika Bielan"
 WWD_zie_final_desc:0 "Bielany pokazały, że da się przetrwać bez bloków i bez mafii. Inne dzielnice zaczynają się przyglądać."
 WWD_tec_start:0 "Powiśle się nie poddaje"
 WWD_tec_start_desc:0 "Studenci, aktywiści i mieszkańcy kamienic nad Wisłą ogłaszają, że Powiśle będzie rządzić się samo – otwarcie i po swojemu."
 WWD_tec_straz:0 "Straż Bulwarów"
 WWD_tec_straz_desc:0 "Ochotnicy z bulwarów i okolic BUW-u tworzą straż sąsiedzką. Zaczynali od rozdawania wody, kończą na patrolach."
 WWD_tec_zasoby:0 "Spółdzielnia Powiśla"
 WWD_tec_zasoby_desc:0 "Kawiarnie, księgarnie i stołówki studenckie tworzą spółdzielnię zaopatrzenia. Każdy dokłada, co ma."
 WWD_tec_barykady:0 "Barykady na Tamce"
 WWD_tec_barykady_desc:0 "Strome uliczki Tamki i Dobrej łatwo zablokować. Kto chce zająć Powiśle, musi walczyć o każde schody."
 WWD_tec_ochotnicy:0 "Ochotnicy z podwórek"
 WWD_tec_ochotnicy_desc:0 "Każda klatka schodowa wystawia kilku ochotników. Nie są żołnierzami, ale bronią własnych domów."
 WWD_tec_gospodarka:0 "Uniwersytet dla dzielnicy"
 WWD_tec_gospodarka_desc:0 "Laboratoria i pracownie uczelni pracują dla dzielnicy: od napraw sprzętu po produkcję leków."
 WWD_tec_liga:0 "Liga Wolnych Dzielnic"
 WWD_tec_liga_desc:0 "Niezależne dzielnice muszą trzymać się razem, inaczej bloki zjedzą je po kolei. Proponujemy Pradze, Bielanom i Powiślu wspólną obronę."
 WWD_tec_patron:0 "Pod skrzydła patrona"
 WWD_tec_patron_desc:0 "Samotna dzielnica nie przetrwa wojny bloków. Lepiej samemu wybrać opiekuna, niż czekać, aż ktoś wybierze nas siłą."
 WWD_tec_twierdza:0 "Wspólna obrona"
 WWD_tec_twierdza_desc:0 "Dzielnice Ligi wymieniają się bronią, ludźmi i informacjami. Atak na jedną z nich to atak na wszystkie."
 WWD_tec_nagroda:0 "Nagroda za lojalność"
 WWD_tec_nagroda_desc:0 "Patron dotrzymuje słowa: dzielnica dostaje sprzęt, pieniądze i obietnicę, że jej rada zachowa autonomię."
 WWD_tec_final:0 "Wolne Powiśle"
 WWD_tec_final_desc:0 "Tęczowa Republika przetrwała walkę bloków. Na bulwarach znów gra muzyka – tym razem w wolnej dzielnicy."
