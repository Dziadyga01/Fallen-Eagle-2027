l_english:
 WWD_smr_start:0 "Sejm obraduje dalej"
 WWD_smr_start_desc:0 "Kraj się rozpadł, ale Sejm wciąż obraduje – w kurtkach, przy agregatach. Marszałek ogłasza, że Rzeczpospolita trwa tak długo, jak trwa posiedzenie."
 WWD_smr_mob:0 "Mobilizacja Straży Marszałkowskiej"
 WWD_smr_mob_desc:0 "Straż Marszałkowska otwiera magazyny, a komendy Policji dostają nowe radiowozy, kamizelki i amunicję."
 WWD_smr_poparcie:0 "Głos z Wiejskiej"
 WWD_smr_poparcie_desc:0 "Pod Sejmem gromadzą się tysiące ludzi. Chcą prądu, chleba i kogoś, kto powie, że państwo jeszcze istnieje."
 WWD_smr_sztab:0 "Sztab kryzysowy przy Wiejskiej"
 WWD_smr_sztab_desc:0 "W Sali Kolumnowej powstaje sztab: mapy dzielnic, telefony satelitarne i posłowie na dyżurach przez całą dobę."
 WWD_smr_propaganda:0 "Transmisje z sali plenarnej"
 WWD_smr_propaganda_desc:0 "Telewizja sejmowa nadaje bez przerwy. Każda uchwała to dowód, że prawo nie umarło razem z państwem."
 WWD_smr_gospodarka:0 "Ustawa o odbudowie stolicy"
 WWD_smr_gospodarka_desc:0 "Pierwsza ustawa przyjęta w nowej rzeczywistości: pieniądze z rezerw idą na zakłady na Woli i warsztaty na Bemowie."
 WWD_smr_marionetka:0 "Policja pod nadzorem Sejmu"
 WWD_smr_marionetka_desc:0 "Komendant Stołeczny składa raport Marszałkowi. Policja zostaje formalnie podporządkowana Komisji Bezpieczeństwa."
 WWD_smr_wcielenie:0 "Straż Sejmowa"
 WWD_smr_wcielenie_desc:0 "Policja przestaje być osobnym bytem. Funkcjonariusze składają przysięgę przed Marszałkiem i stają się Strażą Sejmową."
 WWD_smr_autonomia:0 "Policja jako partner"
 WWD_smr_autonomia_desc:0 "Policja zachowuje własne dowództwo, ale dostaje pieniądze, sprzęt i pełne wsparcie Sejmu. Lojalność kupiona zaufaniem."
 WWD_smr_dzielnice:0 "Dzielnice pod opieką Sejmu"
 WWD_smr_dzielnice_desc:0 "Posłowie jadą do niezależnych dzielnic z jedną propozycją: wróćcie do Rzeczypospolitej, zanim zabierze was ktoś inny."
 WWD_smr_ult_prg:0 "Uchwała w sprawie Pragi"
 WWD_smr_ult_prg_desc:0 "Straż Marszałkowska żąda od władz dzielnicy Praga podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_smr_ult_zie:0 "Uchwała w sprawie Bielan"
 WWD_smr_ult_zie_desc:0 "Straż Marszałkowska żąda od władz dzielnicy Bielany (Zieloni) podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_smr_ult_tec:0 "Uchwała w sprawie Powiśla"
 WWD_smr_ult_tec_desc:0 "Straż Marszałkowska żąda od władz dzielnicy Powiśle (Tęczowa Republika) podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_smr_nasze:0 "Warszawa wraca do państwa"
 WWD_smr_nasze_desc:0 "Na urzędach dzielnic znów wiszą godła. Sejm ma za sobą większość stolicy."
 WWD_smr_koalicja:0 "Koalicja przeciw przestępczości"
 WWD_smr_koalicja_desc:0 "Marszałek dzwoni do Pałacu Prezydenckiego. Dawni rywale mają wspólnego wroga: Pruszków kupuje dzielnicę po dzielnicy. Propozycja jest prosta – wspólny front przeciw mafii."
 WWD_smr_k_sztab:0 "Wspólny sztab antymafijny"
 WWD_smr_k_sztab_desc:0 "Oficerowie Policji, żandarmerii i Straży Marszałkowskiej siadają przy jednym stole. Listy gończe są wspólne, a kartoteki Pruszkowa – po raz pierwszy kompletne."
 WWD_smr_k_majatki:0 "Zamrożenie majątków Pruszkowa"
 WWD_smr_k_majatki_desc:0 "Konta, kantory, myjnie i hurtownie Rodziny trafiają pod nadzór koalicji. Pruszków musi płacić swoim ludziom z zapasów."
 WWD_smr_k_pruszkow:0 "Operacja „Pruszków”"
 WWD_smr_k_pruszkow_desc:0 "Koalicja uderza na Ursus, Włochy i zaplecze w Pruszkowie. Cel: rozbić Rodzinę i jej bojówki stadionowe, zanim przejmą resztę stolicy."
 WWD_smr_k_wspolna:0 "Wspólna Rzeczpospolita"
 WWD_smr_k_wspolna_desc:0 "Mafia jest rozbita. Teraz koalicja musi odpowiedzieć na najtrudniejsze pytanie: kto stanie na czele odrodzonej Rzeczypospolitej?"
 WWD_smr_samo:0 "Sami ocalimy państwo"
 WWD_smr_samo_desc:0 "Sejm nie będzie dzielił władzy z Pałacem. Rzeczpospolitą odbuduje parlament – sam, z Policją u boku."
 WWD_smr_wojna_par:0 "Rozprawa z Kancelarią Prezydenta"
 WWD_smr_wojna_par_desc:0 "Dwa ośrodki władzy w jednym mieście to o jeden za dużo. Straż Marszałkowska rusza przeciw rywalom z drugiej strony Krakowskiego Przedmieścia."
 WWD_smr_wojna_mpr:0 "Wojna z Pruszkowem"
 WWD_smr_wojna_mpr_desc:0 "Państwo nie negocjuje z gangsterami. Oddziały ruszają na Ursus i Włochy."
 WWD_smr_ofensywa:0 "Ofensywa w śródmieściu"
 WWD_smr_ofensywa_desc:0 "Walka toczy się o mosty, skrzyżowania i stacje metra. Kto pierwszy je zajmie, ten wygra stolicę."
 WWD_smr_z_umocnienie:0 "Kontrola nad zachodnimi dzielnicami"
 WWD_smr_z_umocnienie_desc:0 "Bemowo, Wola, Ochota i Żoliborz są pod kontrolą Policji. Sejm umacnia posterunki i przejmuje urzędy dzielnic – to zaplecze dla każdej dalszej operacji."
 WWD_smr_z_rekrutacja:0 "Nabór do Straży Marszałkowskiej"
 WWD_smr_z_rekrutacja_desc:0 "Ochotnicy z zachodnich dzielnic zgłaszają się do Straży. Sejm obiecuje żołd, mieszkania służbowe i amnestię dla dezerterów."
 WWD_smr_z_zaplecze:0 "Zaplecze na Bemowie"
 WWD_smr_z_zaplecze_desc:0 "Hale na Bemowie zamieniają się w warsztaty i magazyny. Straż Marszałkowska będzie miała własną broń i amunicję."
 WWD_smr_z_przyg_0:0 "Mandat Sejmu: Ożarów Mazowiecki"
 WWD_smr_z_przyg_0_desc:0 "Sztab rysuje mapy dróg dojazdowych do miejscowości Ożarów Mazowiecki, liczy mosty i wybiera miejsca na punkty zborne. Granica zostaje zabezpieczona, a roszczenia – ogłoszone."
 WWD_smr_z_wojna_0:0 "Interwencja Sejmu: Ożarów Mazowiecki"
 WWD_smr_z_wojna_0_desc:0 "Mamy ludzi, broń i plan. Kolumny ruszają w stronę miejscowości Ożarów Mazowiecki – szybkie zajęcie węzłów drogowych zdecyduje o wyniku."
 WWD_smr_z_int_0:0 "Przywrócenie samorządu: Ożarów Mazowiecki"
 WWD_smr_z_int_0_desc:0 "Nowa administracja przejmuje urzędy, posterunki i magazyny. Mieszkańcy dostają przydziały żywności – i nowe dowody tożsamości."
 WWD_smr_z_przyg_1:0 "Mandat Sejmu: Grodzisk Mazowiecki"
 WWD_smr_z_przyg_1_desc:0 "Sztab rysuje mapy dróg dojazdowych do miejscowości Grodzisk Mazowiecki, liczy mosty i wybiera miejsca na punkty zborne. Granica zostaje zabezpieczona, a roszczenia – ogłoszone."
 WWD_smr_z_wojna_1:0 "Interwencja Sejmu: Grodzisk Mazowiecki"
 WWD_smr_z_wojna_1_desc:0 "Mamy ludzi, broń i plan. Kolumny ruszają w stronę miejscowości Grodzisk Mazowiecki – szybkie zajęcie węzłów drogowych zdecyduje o wyniku."
 WWD_smr_z_int_1:0 "Przywrócenie samorządu: Grodzisk Mazowiecki"
 WWD_smr_z_int_1_desc:0 "Nowa administracja przejmuje urzędy, posterunki i magazyny. Mieszkańcy dostają przydziały żywności – i nowe dowody tożsamości."
 WWD_smr_z_przyg_2:0 "Mandat Sejmu: Piaseczno"
 WWD_smr_z_przyg_2_desc:0 "Sztab rysuje mapy dróg dojazdowych do miejscowości Piaseczno, liczy mosty i wybiera miejsca na punkty zborne. Granica zostaje zabezpieczona, a roszczenia – ogłoszone."
 WWD_smr_z_wojna_2:0 "Interwencja Sejmu: Piaseczno"
 WWD_smr_z_wojna_2_desc:0 "Mamy ludzi, broń i plan. Kolumny ruszają w stronę miejscowości Piaseczno – szybkie zajęcie węzłów drogowych zdecyduje o wyniku."
 WWD_smr_z_int_2:0 "Przywrócenie samorządu: Piaseczno"
 WWD_smr_z_int_2_desc:0 "Nowa administracja przejmuje urzędy, posterunki i magazyny. Mieszkańcy dostają przydziały żywności – i nowe dowody tożsamości."
 WWD_smr_z_region:0 "Region stołeczny pod władzą Sejmu"
 WWD_smr_z_region_desc:0 "Zachodnie przedmieścia uznają władzę Sejmu. Warszawa znów ma zaplecze – drogi, magazyny i ludzi."
 WWD_smr_proklamacja:0 "Proklamacja IV Rzeczypospolitej"
 WWD_smr_proklamacja_desc:0 "Warszawa jest nasza. Straż Marszałkowska może ogłosić narodziny nowego państwa – IV Rzeczypospolitej Polskiej."
 EK_SMR_premier:0 "Premier w Sejmie"
 EK_SMR_premier_desc:0 "Donald Tusk (fikcyjna ścieżka moda) zostaje przy Wiejskiej. Sejm przejmuje archiwa rządu, łączność i to, co zostało z ministerstw."
 EK_SMR_negocjacje:0 "Negocjacje z regionami"
 EK_SMR_negocjacje_desc:0 "Sejm rozmawia z regionami, które przed Godziną Zero podpisały umowy z rządem. Kto ma umowę – dostaje kontrakt na dostawy."
 EK_SMR_zaopatrzenie:0 "Zaopatrzenie stolicy"
 EK_SMR_zaopatrzenie_desc:0 "Konwoje z żywnością i paliwem z regionów, które jeszcze ufają Sejmowi. Warszawa nie może głodować, jeśli ma być stolicą."
 EK_SMR_legalnosc:0 "Walka o legalność"
 EK_SMR_legalnosc_desc:0 "Sejm ogłasza, że jest jedyną legalną władzą ustawodawczą. Pałac i Pruszków odpowiadają, że legalność bez wojska to tylko papier."
 EK_SMR_palac:0 "Rywalizacja z Pałacem"
 EK_SMR_palac_desc:0 "Kancelaria Prezydenta ma działa, Sejm ma ustawy. Sejm wykorzystuje każdą lukę: wypłaty dla żołnierzy, przepustki, prawo do ewakuacji."
 EK_SMR_pruszkow:0 "Przeciw Pruszkowowi"
 EK_SMR_pruszkow_desc:0 "Policja z Sejmem przeciw mafii: zamknięte hurtownie, przechwycone transporty, odcięte długi."
 EK_SMR_bruksela:0 "Most powietrzny z Brukseli"
 EK_SMR_bruksela_desc:0 "Samoloty z lekami i sprzętem lądują na Okęciu – dla Sejmu, nie dla Pałacu. Warunek: przejrzyste wydatki."
 EK_SMR_rada:0 "Rada Regionów Rzeczypospolitej"
 EK_SMR_rada_desc:0 "Sejm zwołuje regiony do Warszawy. Nie po to, by je wcielać – po to, by ustalić wspólne zasady odbudowy. Odblokowuje panel „Rada Regionów”."
 EK_SMR_konstytucja:0 "Konstytucja Odrodzenia"
 EK_SMR_konstytucja_desc:0 "Projekt nowej konstytucji: Rzeczpospolita federalna, szeroka autonomia regionów, prawo wyjścia. Lepsza niż wojna o każdą gminę."
 EK_SMR_odbudowa:0 "Odbudowa Polski"
 EK_SMR_odbudowa_desc:0 "Sejm uruchamia europejski projekt odbudowy Polski – z Warszawą jako stolicą. Regiony mogą przystąpić przez negocjacje i ratyfikację (panel „Integracja regionów”)."
 EK_SMR_stolica:0 "Stolica dla całej Polski"
 EK_SMR_stolica_desc:0 "Warszawa ma znowu być stolicą – nie zdobytą, tylko uznaną. Sejm proponuje frakcjom stolicy Zjednoczoną Warszawę bez zwycięzcy."
 EK_SMR_nastepca:0 "Sejm bez premiera"
 EK_SMR_nastepca_desc:0 "Posłowie nie powierzyli władzy premierowi. Sejm musi pokazać, że instytucja jest silniejsza niż jeden człowiek."
 EK_SMR_prezydium:0 "Kolegialne prezydium"
 EK_SMR_prezydium_desc:0 "Prezydium podejmuje decyzje wspólnie. Wolno – ale nikt nie może powiedzieć, że Sejm działa bezprawnie."
 EK_SMR_marszalek:0 "Jeden głos Sejmu"
 EK_SMR_marszalek_desc:0 "Marszałek wybrany przez posłów mówi w imieniu Sejmu i nie czeka na kworum. Decyzje są szybkie – i coraz bardziej osobiste."
 EK_SMR_rada_ocalenia:0 "Rada Ocalenia Państwa"
 EK_SMR_rada_ocalenia_desc:0 "Wojewodowie i dowódcy przejmują stery. Sejm ma porządek i wojsko – i coraz mniej parlamentu."
 EK_SMR_szczecin:0 "Rozmowy ze Szczecinem"
 EK_SMR_szczecin_desc:0 "Premier jest teraz w Eurokomisariacie Pomorza. Sejm może z nim współpracować – albo konkurować o to, kto odbuduje Polskę."
 EK_SMR_wlasna_droga:0 "Własna droga Sejmu"
 EK_SMR_wlasna_droga_desc:0 "Sejm odbudowuje Polskę po swojemu: z Warszawy, z regionami, które mu ufają, i bez czekania na Szczecin."
 WWD_kpr_start:0 "Pałac nie ewakuuje się"
 WWD_kpr_start_desc:0 "Kancelaria zostaje w Pałacu Prezydenckim. Rozkaz jest krótki: państwo ma głowę i ta głowa się nie ukrywa."
 WWD_kpr_mob:0 "Rozkaz mobilizacyjny"
 WWD_kpr_mob_desc:0 "Kancelaria podpisuje rozkaz mobilizacyjny. Jednostki Wojska z Rembertowa i Wesołej dostają amunicję z magazynów centralnych."
 WWD_kpr_poparcie:0 "Orędzie do narodu"
 WWD_kpr_poparcie_desc:0 "Orędzie nadawane z Pałacu trafia do każdego radia w Warszawie: „Państwo nie zniknęło. Państwo jest tutaj”."
 WWD_kpr_sztab:0 "Biuro Bezpieczeństwa Narodowego"
 WWD_kpr_sztab_desc:0 "BBN zamienia się w sztab wojenny. Na stołach leżą plany ochrony mostów, elektrowni i Dworca Centralnego."
 WWD_kpr_propaganda:0 "Prezydent jest z wami"
 WWD_kpr_propaganda_desc:0 "Billboardy z flagą i hasłem „Prezydent jest z wami” pojawiają się na każdym skrzyżowaniu od Woli po Wawer."
 WWD_kpr_gospodarka:0 "Dekret o odbudowie"
 WWD_kpr_gospodarka_desc:0 "Dekret przekazuje opuszczone zakłady pod zarząd komisarzy Kancelarii. Linie produkcyjne ruszają jeszcze w tym miesiącu."
 WWD_kpr_marionetka:0 "Zwierzchnik Sił Zbrojnych"
 WWD_kpr_marionetka_desc:0 "Dowódcy garnizonów stawiają się w Pałacu. Wojsko uznaje zwierzchnictwo Prezydenta – na razie jako sojusznik, nie jako podwładny."
 WWD_kpr_wcielenie:0 "Gwardia Prezydencka"
 WWD_kpr_wcielenie_desc:0 "Wojsko zostaje formalnie podporządkowane Kancelarii jako Gwardia Prezydencka. Sztandary jednostek dostają nowe barwy."
 WWD_kpr_autonomia:0 "Armia jako partner"
 WWD_kpr_autonomia_desc:0 "Wojsko zachowuje własne dowództwo i budżet. Pałac daje sprzęt, Wojsko daje bagnety – układ wygodny dla obu stron."
 WWD_kpr_dzielnice:0 "Pełnomocnicy Prezydenta w dzielnicach"
 WWD_kpr_dzielnice_desc:0 "Do niezależnych dzielnic jadą pełnomocnicy z listami nominacyjnymi i eskortą żandarmerii."
 WWD_kpr_ult_prg:0 "Dekret o Pradze"
 WWD_kpr_ult_prg_desc:0 "Kancelaria Prezydenta żąda od władz dzielnicy Praga podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_kpr_ult_zie:0 "Dekret o Bielanach"
 WWD_kpr_ult_zie_desc:0 "Kancelaria Prezydenta żąda od władz dzielnicy Bielany (Zieloni) podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_kpr_ult_tec:0 "Dekret o Powiślu"
 WWD_kpr_ult_tec_desc:0 "Kancelaria Prezydenta żąda od władz dzielnicy Powiśle (Tęczowa Republika) podporządkowania. Odmowa oznacza wojnę – a wojna w środku miasta oznacza barykady na każdym rogu."
 WWD_kpr_nasze:0 "Stolica pod jedną flagą"
 WWD_kpr_nasze_desc:0 "Biało-czerwone flagi wracają na ratusze dzielnic. Pałac mówi już nie o „strefach”, ale o „odzyskanej stolicy”."
 WWD_kpr_koalicja:0 "Koalicja przeciw przestępczości"
 WWD_kpr_koalicja_desc:0 "Prezydent proponuje Marszałkowi zawieszenie sporów. Najpierw trzeba rozbić Pruszków – o władzę można się kłócić później."
 WWD_kpr_k_sztab:0 "Wspólny sztab antymafijny"
 WWD_kpr_k_sztab_desc:0 "Oficerowie Policji, żandarmerii i Straży Marszałkowskiej siadają przy jednym stole. Listy gończe są wspólne, a kartoteki Pruszkowa – po raz pierwszy kompletne."
 WWD_kpr_k_majatki:0 "Zamrożenie majątków Pruszkowa"
 WWD_kpr_k_majatki_desc:0 "Konta, kantory, myjnie i hurtownie Rodziny trafiają pod nadzór koalicji. Pruszków musi płacić swoim ludziom z zapasów."
 WWD_kpr_k_pruszkow:0 "Operacja „Pruszków”"
 WWD_kpr_k_pruszkow_desc:0 "Koalicja uderza na Ursus, Włochy i zaplecze w Pruszkowie. Cel: rozbić Rodzinę i jej bojówki stadionowe, zanim przejmą resztę stolicy."
 WWD_kpr_k_wspolna:0 "Wspólna Rzeczpospolita"
 WWD_kpr_k_wspolna_desc:0 "Mafia jest rozbita. Teraz koalicja musi odpowiedzieć na najtrudniejsze pytanie: kto stanie na czele odrodzonej Rzeczypospolitej?"
 WWD_kpr_samo:0 "Sami ocalimy państwo"
 WWD_kpr_samo_desc:0 "Pałac nie będzie negocjował z parlamentem, który nie potrafi zebrać kworum. Państwo odbuduje Prezydent – razem z Wojskiem."
 WWD_kpr_wojna_par:0 "Rozprawa z Sejmem"
 WWD_kpr_wojna_par_desc:0 "Dwa ośrodki władzy w jednym mieście to o jeden za dużo. Kancelaria Prezydenta rusza przeciw rywalom z drugiej strony Krakowskiego Przedmieścia."
