l_english:
 ZKR_rozciagniecie:0 "Nadmierne rozciągnięcie Zakonu"
 ZKR_rozciagniecie_desc:0 "Zakon kontroluje §Y[?ZKR_regiony|0]§! regionów, w tym §Y[?ZKR_obce|0]§! poza swoimi rdzeniami. Powyżej 45 regionów każda nowa komturia kosztuje stabilność, władzę polityczną i poparcie dla wojny. Integracja ziem zmniejsza kary o połowę."
 ZKR_garnizony_komturii:0 "Garnizony w komturiach"
 ZKR_garnizony_komturii_desc:0 "Rycerze i najemnicy pilnują podbitych miast zamiast walczyć na froncie."
 zk2.1.t:0 "Opór w komturiach"
 zk2.1.d:0 "W podbitych miastach ludzie nie chcą płacić dziesięciny Zakonowi. Ktoś zrywa chorągwie z krzyżem, ktoś inny podpala magazyn. Komturowie piszą do Malborka o posiłki.\n\nRegiony poza rdzeniami Zakonu: §Y[?ZKR_obce|0]§!."
 zk2.1.a:0 "Wysłać garnizony (spowalnia ofensywę)."
 zk2.1.b:0 "Ustępstwa: niższe daniny w podbitych ziemiach."
 zk2.1.c:0 "Ignorować – wojna jest ważniejsza."
 ZKR_integracja_tt:0 "Kary za §Ynadmierne rozciągnięcie§! Zakonu spadają o połowę."
 ZKR_req_rozciagniecie:0 "Zakon kontroluje co najmniej 45 regionów"
