 ZKR_TARCZA_BALTYKU:0 "Tarcza Bałtyku"
 zkr.1.t:0 "Ultimatum z Malborka"
 zkr.1.d:0 "Do naszej siedziby przybyło poselstwo Zakonu Krzyżackiego w białych płaszczach z czarnym krzyżem. Wielki Mistrz proponuje „opiekę”: wspólną armię, ochronę przed chaosem i zachowanie samorządu – w zamian za uznanie zwierzchnictwa Malborka.\n\nOdmowa, jak dali do zrozumienia posłowie, zostanie potraktowana jako zaproszenie do wojny."
 zkr.1.a:0 "Przyjąć zwierzchnictwo Zakonu."
 zkr.1.b:0 "Nigdy!"
 zkr.4.t:0 "Odmowa – ale jeszcze nie wojna"
 zkr.4.d:0 "[From.GetName] odrzuca naszą propozycję. Kapituła nie jest gotowa do wojny: armia, skarb i komturie potrzebują czasu. Do sprawy wrócimy najwcześniej we wrześniu 2029 roku – i tylko wtedy, gdy Zakon nie będzie prowadził innej wojny."
 zkr.4.a:0 "Cierpliwości, bracia."
 zkr.2.t:0 "Ultimatum przyjęte"
 zkr.2.d:0 "[From.GetName] uznaje zwierzchnictwo Zakonu. Komtur obejmuje urząd w ratuszu, a lokalne oddziały dołączają do chorągwi."
 zkr.2.a:0 "Kolejna komturia."
 zkr.3.t:0 "Ultimatum odrzucone"
 zkr.3.d:0 "[From.GetName] odrzuca nasze żądania. Kapituła przygotowała już uzasadnienie wojny – teraz decyzja należy do Wielkiego Mistrza."
 zkr.3.a:0 "Do broni!"
 zkr.3.b:0 "Jeszcze nie teraz."
 zkr.10.t:0 "Rosjanie przekroczyli granicę"
 zkr.10.d:0 "Rosyjskie kolumny przekroczyły granicę obwodu i idą na Mazury. Z wież Malborka nie widać jeszcze dymów, ale w kapitule nikt nie ma wątpliwości: od tego, co teraz zrobimy, zależy los Prus.\n\nKongres Malborski musi zebrać się natychmiast – nawet jeśli Zakon nie zdążył dokończyć przygotowań."
 zkr.10.a:0 "Nie pozwolimy na drugi rozbiór Prus!"
 zkr.10.b:0 "Kreml może być sojusznikiem…"
 zkr.10.c:0 "Zakon pójdzie własną drogą."
 zkr.10.e:0 "Jesteśmy gotowi."
 zkr.30.t:0 "Zaproszenie do Tarczy Bałtyku"
 zkr.30.d:0 "Zakon Krzyżacki proponuje wspólny sojusz przeciw Rosji: gwarancje niepodległości, pomoc wojskową i wspólny sztab. Nie wszyscy w naszym rządzie ufają Malborkowi – pamiętamy, jak Zakon traktował sąsiadów."
 zkr.30.a:0 "Przystępujemy do sojuszu."
 zkr.30.b:0 "Nie ufamy Zakonowi."
 zkr.31.t:0 "Nowy członek Tarczy Bałtyku"
 zkr.31.d:0 "[From.GetName] przystępuje do sojuszu."
 zkr.31.a:0 "Razem jesteśmy silniejsi."
 zkr.32.t:0 "Odmowa sojuszu"
 zkr.32.d:0 "[From.GetName] nie chce dołączyć do Tarczy Bałtyku. Ultimatum sprzed kilku miesięcy wciąż jest pamiętane."
 zkr.32.a:0 "Szkoda."
 zkr.35.t:0 "Zakon oferuje ochronę"
 zkr.35.d:0 "Poselstwo z Malborka ogłosiło, że Zakon gwarantuje naszą niepodległość wobec Rosji. Tym razem bez ultimatum."
 zkr.35.a:0 "Przyjmujemy z ostrożnością."
 zkr.41.t:0 "Kreml milczy"
 zkr.41.d:0 "Po śmierci Putina rosyjscy doradcy w Malborku przestali dostawać rozkazy. Część z nich pakuje walizki. Komturowie, którzy nie chcieli rosyjskiej opieki, mówią głośno: teraz albo nigdy."
 zkr.41.a:0 "Czas odzyskać Zakon."
 zkr.50.t:0 "Kreml żąda traktatu"
 zkr.50.d:0 "Rosyjski ambasador przekazał Wielkiemu Mistrzowi projekt traktatu: Zakon zachowa zamek, sztandar i tytuły, a Moskwa – armię, politykę zagraniczną i ostatnie słowo. Generał Radecki jest gotów objąć urząd Namiestnika.\n\nKapituła jest podzielona."
 zkr.50.a:0 "Kapituła musi zdecydować."
 zkr.52.t:0 "Kreml przejmuje kontrolę"
 zkr.52.d:0 "Rosyjscy doradcy kontrolują sztab, skarb i telewizję. Wczoraj generał Radecki przyjechał do Malborka z rosyjską eskortą i listą nowych komturów. To moment, w którym Zakon albo się podda, albo stanie do walki."
 zkr.52.a:0 "Przyjąć rosyjski protektorat."
 zkr.52.b:0 "Teraz albo nigdy – bunt rycerzy!"
 zkr.60.t:0 "Moskwa wycofuje poparcie"
 zkr.60.d:0 "Nowe władze w Moskwie nie zamierzają utrzymywać protektoratu generała Radeckiego. Rosyjscy doradcy wyjeżdżają, a ambasador informuje, że Namiestnictwo „jest odtąd państwem w pełni suwerennym”."
 zkr.60.a:0 "Wielki Mistrz wraca do Malborka."
 zkr.60.b:0 "Namiestnik zostaje – sam."
 zkr.60.c:0 "Namiestnik ogłasza pełną niezależność."
 zkr.61.t:0 "Namiestnik w mundurze"
 zkr.61.d:0 "Po przejęciu władzy w Moskwie przez wojskowych generał Radecki zmienia urzędowy ton: Namiestnictwo staje się administracją wojskową, a jego urzędnicy zakładają mundury."
 zkr.61.a:0 "Rozkaz to rozkaz."
 zkr.70.t:0 "Wojna domowa w Zakonie"
 zkr.70.d:0 "Chorągwie wierne Wielkiemu Mistrzowi wypędziły rosyjskich doradców z Malborka. W odpowiedzi generał Radecki ogłosił w Elblągu powstanie Pruskiego Rządu Tymczasowego i wezwał Rosję na pomoc. Bracia zakonni strzelają do braci zakonnych."
 zkr.70.a:0 "Za Zakon i za Malbork!"
 zkr.71.t:0 "Pruski Rząd Tymczasowy"
 zkr.71.d:0 "Generał Aleksander Radecki ogłasza, że Wielki Mistrz zdradził Prusy, zrywając porozumienie z Rosją. Pruski Rząd Tymczasowy przejmuje odpowiedzialność za kraj – z rosyjskim wsparciem."
 zkr.71.a:0 "Porządek wróci do Prus."
 zkr.75.t:0 "Zwycięstwo Wielkiego Mistrza"
 zkr.75.d:0 "Pruski Rząd Tymczasowy upadł. Generał Radecki uciekł do obwodu, a jego oficerowie złożyli broń. Zakon zerwał kajdany Moskwy – teraz musi się odbudować."
 zkr.75.a:0 "Zerwać kajdany Moskwy!"
 zkr.76.t:0 "Rosyjskie Prusy"
 zkr.76.d:0 "Wielki Mistrz przegrał. Generał Radecki wkracza do Malborka jako Namiestnik Prus. Rosyjskie flagi powiewają obok czarnego krzyża."
 zkr.76.a:0 "Niech żyje Namiestnik."
 zkr.80.t:0 "Korona Prus"
 zkr.80.d:0 "W Wielkim Refektarzu kapituła ogłasza utworzenie Pruskiego Państwa Zakonnego. Malbork, Grudziądz i Warmia stają się jednym państwem – pierwszym od 1525 roku. Sąsiedzi patrzą z niepokojem, a w Królewcu rosyjscy oficerowie rozkładają mapy."
 zkr.80.a:0 "Preußischer Ordensstaat!"
 zkr.81.t:0 "Narodziny Pruskiego Państwa Zakonnego"
 zkr.81.d:0 "Zakon Krzyżacki ogłosił utworzenie Pruskiego Państwa Zakonnego obejmującego Malbork, Grudziądz i Warmię. Wielki Mistrz zapowiada, że następnym celem jest Królewiec."
 zkr.81.a:0 "Zakon wrócił."
 zkr.90.t:0 "Sekularyzacja Zakonu"
 zkr.90.d:0 "Jak w 1525 roku: Wielki Mistrz zrzuca habit i oddaje władzę Albrechtowi Kowalewskiemu, marszałkowi Zakonu, który przyjmuje tytuł księcia w Prusach. Państwo zakonne staje się świeckim Księstwem Pruskim. Historycy na całym świecie nie mogą uwierzyć, że to się dzieje naprawdę."
 zkr.90.a:0 "Niech żyje Książę!"
 zkr.91.t:0 "Księstwo Pruskie"
 zkr.91.d:0 "Zakon Krzyżacki uległ sekularyzacji. Na jego miejscu powstało świeckie Księstwo Pruskie – pierwsze od niemal pięciu stuleci."
 zkr.91.a:0 "Historia zatoczyła koło."
 ZKR_wplywy_kat:0 "Wpływy rosyjskie: [?ZKR_wplywy|0]%"
 ZKR_wplywy_kat_desc:0 "Rosyjscy doradcy zdobywają wpływy w administracji i armii Zakonu. Przy 100% Kreml przejmie kontrolę – chyba że rycerze wcześniej chwycą za broń.\n\nWpływy rosyjskie: §Y[?ZKR_wplywy|0]%§!"
 ZKR_dec_doradcy:0 "Przyjąć doradców (+15%)"
 ZKR_dec_doradcy_desc:0 "Rosyjscy oficerowie przejmą szkolenie chorągwi."
 ZKR_dec_dostawy:0 "Rosyjskie dostawy (+10%)"
 ZKR_dec_dostawy_desc:0 "Transport broni i amunicji z Królewca."
 ZKR_dec_odsunac:0 "Odsunąć oficerów (−10%)"
 ZKR_dec_odsunac_desc:0 "Najbardziej prorosyjscy oficerowie zostaną przeniesieni do odległych komturii."
 ZKR_dec_wzmocnic:0 "Wzmocnić Zakon (−15%)"
 ZKR_dec_wzmocnic_desc:0 "Kapituła przejmuje z powrotem kontrolę nad skarbem i sztabem."
 ZKR_dec_bunt:0 "Bunt rycerzy"
 ZKR_dec_bunt_desc:0 "Wierni Wielkiemu Mistrzowi komturowie wypędzą Rosjan z Malborka. Oznacza to wojnę domową z Pruskim Rządem Tymczasowym generała Radeckiego."
 ZKR_zakon_tree:0 "Powrót Czarnego Krzyża"
 ZKR_ordensstaat_tree:0 "Pruskie Państwo Zakonne"
 ZKR_kajdany_tree:0 "Zerwać kajdany Moskwy"
 ZKR_rosyjskie_prusy_tree:0 "Rosyjskie Prusy"
