l_english:
 ZKR_mury_malborka:0 "Mury Malborka"
 ZKR_mury_malborka_desc:0 "Zamek wytrzymał już jedno wielkie oblężenie."
 ZKR_wspolny_sztab:0 "Wspólny sztab"
 ZKR_wspolny_sztab_desc:0 "Oficerowie Zakonu i sojuszników planują razem."
 ZKR_linia_pasleki:0 "Linia Pasłęki"
 ZKR_linia_pasleki_desc:0 "Rzeka i bunkry zatrzymają uderzenie z obwodu."
 ZKR_kampania_pruska:0 "Kampania pruska"
 ZKR_kampania_pruska_desc:0 "Szybkie uderzenia i zajmowanie mostów."
 ZKR_tarcza_baltyku:0 "Tarcza Bałtyku"
 ZKR_tarcza_baltyku_desc:0 "Zakon stoi na czele sojuszu państw nad Bałtykiem."
 ZKR_wolne_prusy:0 "Prusy wolne od Moskwy"
 ZKR_wolne_prusy_desc:0 "Rosja nie zabrała Prus. Zakon jest gwarantem pokoju."
 ZKR_militaryzacja:0 "Pełna militaryzacja"
 ZKR_militaryzacja_desc:0 "Każdy brat jest żołnierzem, każda komturia koszarami."
 ZKR_wsparcie_rosji:0 "Wsparcie Rosji"
 ZKR_wsparcie_rosji_desc:0 "Rosyjscy doradcy, sprzęt i pieniądze stoją za Pruskim Rządem Tymczasowym."
 ZKR_namiestnictwo:0 "Namiestnictwo Prus"
 ZKR_namiestnictwo_desc:0 "Zakon stał się rosyjskim protektoratem. Fabryki pracują, decyzje zapadają w Moskwie."
 ZKR_wierny_kremlowi:0 "Wierny Kremlowi"
 ZKR_wierny_kremlowi_desc:0 "Dopóki Moskwa jest silna, Namiestnictwo jest bezpieczne."
 ZKR_izolacja:0 "Porzuceni przez Moskwę"
 ZKR_izolacja_desc:0 "Nowe władze w Moskwie nie chcą mieć nic wspólnego z protektoratem generała."
 ZKR_wolny_zakon:0 "Wolny Zakon"
 ZKR_wolny_zakon_desc:0 "Zakon wyszedł z wojny domowej silniejszy."
 ZKR_ordensstaat:0 "Pruskie Państwo Zakonne"
 ZKR_ordensstaat_desc:0 "Preußischer Ordensstaat znów istnieje."
 ZKR_wielkie_prusy:0 "Wielkie Prusy"
 ZKR_wielkie_prusy_desc:0 "Od Wisły po Niemen."
 ZKR_maryja:0 "Pod opieką Najświętszej Maryi Panny"
 ZKR_maryja_desc:0 "Zakon Szpitala Najświętszej Maryi Panny Domu Niemieckiego – tak brzmiała pełna nazwa. Bracia znów modlą się w kościele zamkowym przed każdą kapitułą."
 ZKR_regula:0 "Reguła zakonna"
 ZKR_regula_desc:0 "Urzędnicy komturii składają ślubowanie według reguły: posłuszeństwo, dyscyplina i skromność. Korupcja spada – entuzjazm też."
 ZKR_wiara_miecz:0 "Wiara i miecz"
 ZKR_wiara_miecz_desc:0 "Kapelani w każdej chorągwi, bractwa świeckie w każdej parafii, kazania o Prusach w każdą niedzielę. Zakon jest jednocześnie państwem, armią i wspólnotą."
 ZKR_ksiestwo:0 "Księstwo Pruskie"
 ZKR_ksiestwo_desc:0 "Świeckie państwo, jak po 1525 roku."
 ZKR_wplywy_mod:0 "Wpływy rosyjskie"
 ZKR_wplywy_mod_desc:0 "Rosyjscy doradcy kontrolują coraz większą część administracji i armii Zakonu. Fabryki dostają zamówienia z Moskwy, ale Wielki Mistrz traci władzę."
 ZKR_radecki:0 "Aleksander Radecki"
