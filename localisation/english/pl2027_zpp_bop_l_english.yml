l_english:
 ZPP_rownowaga_sil:0 "Równowaga w Zjednoczonej Prawicy"
 ZPP_rownowaga_sil_desc:0 "Władza w Lublinie zależy od kompromisu między urzędnikami a strukturami terenowymi. Przesunięcie paska zmienia korzyści i ryzyko kryzysu."
 ZPP_bop_harcerze:0 "Harcerze"
 ZPP_bop_maslarze:0 "Maślarze"
 ZPP_bop_kompromis:0 "Porozumienie frakcyjne"
 ZPP_bop_kompromis_desc:0 "Porozumienie kierownictwa wzmacnia stabilność i ułatwia podejmowanie decyzji."
 ZPP_bop_harcerze_przewaga:0 "Przewaga Harcerzy"
 ZPP_bop_harcerze_przewaga_desc:0 "Technokraci obsadzają urzędy i przyspieszają modernizację kraju."
 ZPP_bop_harcerze_dominacja:0 "Dominacja Harcerzy"
 ZPP_bop_harcerze_dominacja_desc:0 "Rząd przejmuje zarządzanie partią. Struktury terenowe zaczynają mówić o rozłamie."
 ZPP_bop_maslarze_przewaga:0 "Przewaga Maślarzy"
 ZPP_bop_maslarze_przewaga_desc:0 "Aparat partyjny odgrywa coraz większą rolę w podejmowaniu decyzji."
 ZPP_bop_maslarze_dominacja:0 "Dominacja Maślarzy"
 ZPP_bop_maslarze_dominacja_desc:0 "Sieć lojalności umacnia władzę, ale rosną koszty patronatu i naciski na administrację."
 ZPP_bop_decyzje:0 "Podział władzy"
 ZPP_bop_decyzje_desc:0 "Harcerze to technokratyczne kierownictwo i administracja. Maślarze to aparat terenowy i patronat partyjny. Dążenie do centrum stabilizuje rząd, dominacja jednej frakcji odblokowuje mocniejsze premie kosztem kryzysu."
 ZPP_bop_reforma_urzedow:0 "Obsadzić urzędy technokratami"
 ZPP_bop_reforma_urzedow_desc:0 "Nowe kadry ograniczają wpływy działaczy terenowych. Harcerze zdobywają większą kontrolę."
 ZPP_bop_kontrakty_ministerialne:0 "Kontrakty ministerialne"
 ZPP_bop_kontrakty_ministerialne_desc:0 "Ministerstwa przejmują planowanie inwestycji i centralne zamówienia."
 ZPP_bop_mianowania_terenowe:0 "Nominacje dla struktur terenowych"
 ZPP_bop_mianowania_terenowe_desc:0 "Aparat terenowy otrzymuje kontrolę nad administracją regionalną."
 ZPP_bop_kontrola_spolek:0 "Oddać spółki działaczom"
 ZPP_bop_kontrola_spolek_desc:0 "Stanowiska dla partyjnych nominatów wzmacniają Maślarzy."
 ZPP_bop_pakt_z_harcerzami:0 "Pakt z Harcerzami"
 ZPP_bop_pakt_z_harcerzami_desc:0 "Kompromis z technokratami ogranicza monopol aparatu partyjnego."
 ZPP_bop_pakt_z_maslarzami:0 "Pakt z Maślarzami"
 ZPP_bop_pakt_z_maslarzami_desc:0 "Kompromis ze strukturami terenowymi łagodzi konflikt z administracją."
 ZPP_bop_stanowiska_kompromisowe:0 "Gabinet kompromisu"
 ZPP_bop_stanowiska_kompromisowe_desc:0 "Obie frakcje uzgadniają podział resortów i wspólny plan pracy."
 ZPP_bop_przekaz_telewizyjny:0 "Mobilizacja medialna frakcji"
 ZPP_bop_przekaz_telewizyjny_desc:0 "Państwowe media wzmacniają obecnie dominującą frakcję."
 zppbop.10.t:0 "Harcerze przejmują ster"
 zppbop.10.d:0 "Technokraci kontrolują większość departamentów. Terenowe struktury partii żądają nadzwyczajnego porozumienia. Dalsza centralizacja grozi rozpadem obozu władzy."
 zppbop.10.a:0 "Przyjąć ugodę z terenem."
 zppbop.10.b:0 "Rząd nie cofnie reform."
 zppbop.20.t:0 "Maślarze obsadzają państwo"
 zppbop.20.d:0 "Regionalne struktury partyjne przejęły kluczowe instytucje. Ministrowie skarżą się na naciski i blokowanie decyzji. Powstaje pytanie, czy partia zdoła utrzymać jednolite kierownictwo."
 zppbop.20.a:0 "Zgodzić się na kompromis."
 zppbop.20.b:0 "Utrzymać kontrolę nad strukturami."
