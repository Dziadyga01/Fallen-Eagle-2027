 WMZ_start_zy_k_owoce_desc:0 "Nowe ziemie, nowe fabryki i nowi obywatele. Zwycięstwo trzeba zamienić w porządek."
 WMZ_start_zy_p_straty:0 "Liczymy straty"
 WMZ_start_zy_p_straty_desc:0 "Listy poległych wiszą na drzwiach urzędów. Ci, którzy przeżyli, wracają do domów – albo do koszar."
 WMZ_start_zy_p_rzad:0 "Rząd jedności"
 WMZ_start_zy_p_rzad_desc:0 "Po klęsce wszystkie stronnictwa siadają do jednego stołu. Nikt nie ma siły na kłótnie."
 WMZ_start_zy_p_rewanz:0 "Nigdy więcej klęski"
 WMZ_start_zy_p_rewanz_desc:0 "Każdy rocznik przechodzi szkolenie, każda fabryka ma plan wojenny. Następnym razem będzie inaczej."
 WMZ_start_zy_p_pojednanie:0 "Pojednanie"
 WMZ_start_zy_p_pojednanie_desc:0 "Przegrana wojna nie musi oznaczać upadku. Ważne, kto zostanie i co zbudujemy."
 WMZ_start_zy_p_odbudowa:0 "Odbudowa armii"
 WMZ_start_zy_p_odbudowa_desc:0 "Z magazynów wyjeżdża ostatni sprzęt, a do koszar wracają ranni, którzy wyzdrowieli."
 WWD_KPR_zy_s_ulica:0 "Głos ulicy"
 WWD_KPR_zy_s_ulica_desc:0 "Pod siedzibą władz zbierają się ludzie. Chcą wiedzieć, co dalej – i nie wszyscy przyszli z pustymi rękami."
 WWD_KPR_zy_s_media:0 "Gazeta i radio"
 WWD_KPR_zy_s_media_desc:0 "Lokalne radio i gazeta stają się głosem władz. Dziennikarze dostają przepustki – i listę tematów, o których lepiej nie mówić."
 WWD_KPR_zy_s_spis:0 "Spis mieszkańców"
 WWD_KPR_zy_s_spis_desc:0 "Nikt nie wie, ilu ludzi naprawdę mieszka w granicach państwa. Urzędnicy ruszają od drzwi do drzwi."
 WWD_KPR_zy_s_kartki:0 "Kartki na żywność"
 WWD_KPR_zy_s_kartki_desc:0 "Każdy dostaje przydział: chleb, cukier, olej i paliwo. Nikt nie jest syty, ale nikt nie głoduje."
 WWD_KPR_zy_s_rynek:0 "Wolny rynek żywności"
 WWD_KPR_zy_s_rynek_desc:0 "Ceny ustalają kupcy, nie urzędnicy. Na targach jest wszystko – dla tych, których stać."
 WWD_KPR_zy_s_szkoly:0 "Szkoły znów otwarte"
 WWD_KPR_zy_s_szkoly_desc:0 "Dzieci wracają do ławek, a nauczyciele dostają pensje w żywności. Normalność zaczyna się od dzwonka na przerwę."
 WWD_KPR_zy_s_czarny:0 "Czarny rynek"
 WWD_KPR_zy_s_czarny_desc:0 "Na bazarach można kupić wszystko – paliwo, leki, amunicję. Trzeba zdecydować, co z tym zrobić."
 WWD_KPR_zy_s_straze:0 "Ochotnicze straże i kuchnie"
 WWD_KPR_zy_s_straze_desc:0 "W każdej dzielnicy powstaje straż ochotnicza i kuchnia społeczna. Ludzie pilnują porządku i karmią się nawzajem."
 WWD_KPR_zy_s_wspolnota:0 "Wspólnota w czasie rozpadu"
 WWD_KPR_zy_s_wspolnota_desc:0 "Kuchnie, szkoły, straże i radio – ludzie przestali czekać, aż ktoś ich uratuje."
 WWD_KPR_zy_k_admin:0 "Administracja nowych ziem"
 WWD_KPR_zy_k_admin_desc:0 "Na zdobytych terenach trzeba ustanowić urzędy, policję i sądy – i znaleźć ludzi, którzy zechcą w nich pracować."
 WWD_KPR_zy_k_defilada:0 "Defilada zwycięstwa"
 WWD_KPR_zy_k_defilada_desc:0 "Żołnierze maszerują przez stolicę, a tłum wiwatuje. Przez jeden dzień nikt nie pyta o ceny chleba."
 WWD_KPR_zy_k_opor:0 "Opór na nowych ziemiach"
 WWD_KPR_zy_k_opor_desc:0 "Nie wszyscy cieszą się z nowej władzy. Trzeba zdecydować, jak rządzić zdobytymi ziemiami."
 WWD_KPR_zy_k_owoce:0 "Owoce zwycięstwa"
 WWD_KPR_zy_k_owoce_desc:0 "Nowe ziemie, nowe fabryki i nowi obywatele. Zwycięstwo trzeba zamienić w porządek."
 WWD_KPR_zy_p_straty:0 "Liczymy straty"
 WWD_KPR_zy_p_straty_desc:0 "Listy poległych wiszą na drzwiach urzędów. Ci, którzy przeżyli, wracają do domów – albo do koszar."
