 ZKR_kajdany_zy_s_ulica:0 "Głos ulicy"
 ZKR_kajdany_zy_s_ulica_desc:0 "Pod siedzibą władz zbierają się ludzie. Chcą wiedzieć, co dalej – i nie wszyscy przyszli z pustymi rękami."
 ZKR_kajdany_zy_s_media:0 "Gazeta i radio"
 ZKR_kajdany_zy_s_media_desc:0 "Lokalne radio i gazeta stają się głosem władz. Dziennikarze dostają przepustki – i listę tematów, o których lepiej nie mówić."
 ZKR_kajdany_zy_s_spis:0 "Spis mieszkańców"
 ZKR_kajdany_zy_s_spis_desc:0 "Nikt nie wie, ilu ludzi naprawdę mieszka w granicach państwa. Urzędnicy ruszają od drzwi do drzwi."
 ZKR_kajdany_zy_s_kartki:0 "Kartki na żywność"
 ZKR_kajdany_zy_s_kartki_desc:0 "Każdy dostaje przydział: chleb, cukier, olej i paliwo. Nikt nie jest syty, ale nikt nie głoduje."
 ZKR_kajdany_zy_s_rynek:0 "Wolny rynek żywności"
 ZKR_kajdany_zy_s_rynek_desc:0 "Ceny ustalają kupcy, nie urzędnicy. Na targach jest wszystko – dla tych, których stać."
 ZKR_kajdany_zy_s_szkoly:0 "Szkoły znów otwarte"
 ZKR_kajdany_zy_s_szkoly_desc:0 "Dzieci wracają do ławek, a nauczyciele dostają pensje w żywności. Normalność zaczyna się od dzwonka na przerwę."
 ZKR_kajdany_zy_s_czarny:0 "Czarny rynek"
 ZKR_kajdany_zy_s_czarny_desc:0 "Na bazarach można kupić wszystko – paliwo, leki, amunicję. Trzeba zdecydować, co z tym zrobić."
 ZKR_kajdany_zy_s_straze:0 "Ochotnicze straże i kuchnie"
 ZKR_kajdany_zy_s_straze_desc:0 "W każdej dzielnicy powstaje straż ochotnicza i kuchnia społeczna. Ludzie pilnują porządku i karmią się nawzajem."
 ZKR_kajdany_zy_s_wspolnota:0 "Wspólnota w czasie rozpadu"
 ZKR_kajdany_zy_s_wspolnota_desc:0 "Kuchnie, szkoły, straże i radio – ludzie przestali czekać, aż ktoś ich uratuje."
 ZKR_kajdany_zy_k_admin:0 "Administracja nowych ziem"
 ZKR_kajdany_zy_k_admin_desc:0 "Na zdobytych terenach trzeba ustanowić urzędy, policję i sądy – i znaleźć ludzi, którzy zechcą w nich pracować."
