 ROS_kryzys_zy_k_defilada_desc:0 "Żołnierze maszerują przez stolicę, a tłum wiwatuje. Przez jeden dzień nikt nie pyta o ceny chleba."
 ROS_kryzys_zy_k_opor:0 "Opór na nowych ziemiach"
 ROS_kryzys_zy_k_opor_desc:0 "Nie wszyscy cieszą się z nowej władzy. Trzeba zdecydować, jak rządzić zdobytymi ziemiami."
 ROS_kryzys_zy_k_owoce:0 "Owoce zwycięstwa"
 ROS_kryzys_zy_k_owoce_desc:0 "Nowe ziemie, nowe fabryki i nowi obywatele. Zwycięstwo trzeba zamienić w porządek."
 ROS_kryzys_zy_p_straty:0 "Liczymy straty"
 ROS_kryzys_zy_p_straty_desc:0 "Listy poległych wiszą na drzwiach urzędów. Ci, którzy przeżyli, wracają do domów – albo do koszar."
 ROS_kryzys_zy_p_rzad:0 "Rząd jedności"
 ROS_kryzys_zy_p_rzad_desc:0 "Po klęsce wszystkie stronnictwa siadają do jednego stołu. Nikt nie ma siły na kłótnie."
 ROS_kryzys_zy_p_rewanz:0 "Nigdy więcej klęski"
 ROS_kryzys_zy_p_rewanz_desc:0 "Każdy rocznik przechodzi szkolenie, każda fabryka ma plan wojenny. Następnym razem będzie inaczej."
 ROS_kryzys_zy_p_pojednanie:0 "Pojednanie"
 ROS_kryzys_zy_p_pojednanie_desc:0 "Przegrana wojna nie musi oznaczać upadku. Ważne, kto zostanie i co zbudujemy."
 ROS_kryzys_zy_p_odbudowa:0 "Odbudowa armii"
 ROS_kryzys_zy_p_odbudowa_desc:0 "Z magazynów wyjeżdża ostatni sprzęt, a do koszar wracają ranni, którzy wyzdrowieli."
 ROS_mazury_zy_r_tv:0 "Telewizja państwowa"
 ROS_mazury_zy_r_tv_desc:0 "Wieczorne wiadomości pokazują zwycięstwa, nawet gdy ich nie ma. Kanały niezależne „przechodzą konserwację”."
 ROS_mazury_zy_r_listy:0 "Listy z frontu"
 ROS_mazury_zy_r_listy_desc:0 "Rodziny żołnierzy piszą do urzędów i redakcji. Władza musi odpowiedzieć – jakoś."
 ROS_mazury_zy_r_oligarchowie:0 "Oligarchowie płacą"
 ROS_mazury_zy_r_oligarchowie_desc:0 "Najbogatsi dostają zaproszenie na rozmowę. Wszyscy wiedzą, co się dzieje z tymi, którzy nie płacą."
 ROS_mazury_zy_r_rubel:0 "Ratowanie rubla"
 ROS_mazury_zy_r_rubel_desc:0 "Bank centralny pali rezerwy, żeby utrzymać kurs i ceny w sklepach."
