 ROS_poklonska_zy_r_listy_desc:0 "Rodziny żołnierzy piszą do urzędów i redakcji. Władza musi odpowiedzieć – jakoś."
 ROS_poklonska_zy_r_oligarchowie:0 "Oligarchowie płacą"
 ROS_poklonska_zy_r_oligarchowie_desc:0 "Najbogatsi dostają zaproszenie na rozmowę. Wszyscy wiedzą, co się dzieje z tymi, którzy nie płacą."
 ROS_poklonska_zy_r_rubel:0 "Ratowanie rubla"
 ROS_poklonska_zy_r_rubel_desc:0 "Bank centralny pali rezerwy, żeby utrzymać kurs i ceny w sklepach."
 ROS_poklonska_zy_r_druk:0 "Drukujemy ruble"
 ROS_poklonska_zy_r_druk_desc:0 "Pensje wypłacane na czas – w pieniądzach, które z tygodnia na tydzień są warte mniej."
 ROS_poklonska_zy_r_cenzura:0 "Cenzura sieci"
 ROS_poklonska_zy_r_cenzura_desc:0 "VPN-y blokowane, kanały w komunikatorach zamykane, blogerzy wzywani na rozmowy."
 ROS_poklonska_zy_r_regiony:0 "Lojalność regionów"
 ROS_poklonska_zy_r_regiony_desc:0 "Gubernatorzy dostają pieniądze i obowiązek dostarczenia rekrutów. Kto nie dostarczy, przestaje być gubernatorem."
 ROS_poklonska_zy_r_jednosc:0 "Jedność frontu wewnętrznego"
 ROS_poklonska_zy_r_jednosc_desc:0 "Kraj jest zmęczony, ale posłuszny. Władza pilnuje, by tak zostało."
 ROS_poklonska_zy_k_admin:0 "Administracja nowych ziem"
 ROS_poklonska_zy_k_admin_desc:0 "Na zdobytych terenach trzeba ustanowić urzędy, policję i sądy – i znaleźć ludzi, którzy zechcą w nich pracować."
 ROS_poklonska_zy_k_defilada:0 "Defilada zwycięstwa"
 ROS_poklonska_zy_k_defilada_desc:0 "Żołnierze maszerują przez stolicę, a tłum wiwatuje. Przez jeden dzień nikt nie pyta o ceny chleba."
 ROS_poklonska_zy_k_opor:0 "Opór na nowych ziemiach"
 ROS_poklonska_zy_k_opor_desc:0 "Nie wszyscy cieszą się z nowej władzy. Trzeba zdecydować, jak rządzić zdobytymi ziemiami."
 ROS_poklonska_zy_k_owoce:0 "Owoce zwycięstwa"
 ROS_poklonska_zy_k_owoce_desc:0 "Nowe ziemie, nowe fabryki i nowi obywatele. Zwycięstwo trzeba zamienić w porządek."
 ROS_poklonska_zy_p_straty:0 "Liczymy straty"
 ROS_poklonska_zy_p_straty_desc:0 "Listy poległych wiszą na drzwiach urzędów. Ci, którzy przeżyli, wracają do domów – albo do koszar."
 ROS_poklonska_zy_p_rzad:0 "Rząd jedności"
 ROS_poklonska_zy_p_rzad_desc:0 "Po klęsce wszystkie stronnictwa siadają do jednego stołu. Nikt nie ma siły na kłótnie."
 ROS_poklonska_zy_p_rewanz:0 "Nigdy więcej klęski"
 ROS_poklonska_zy_p_rewanz_desc:0 "Każdy rocznik przechodzi szkolenie, każda fabryka ma plan wojenny. Następnym razem będzie inaczej."
 ROS_poklonska_zy_p_pojednanie:0 "Pojednanie"
 ROS_poklonska_zy_p_pojednanie_desc:0 "Przegrana wojna nie musi oznaczać upadku. Ważne, kto zostanie i co zbudujemy."
 ROS_poklonska_zy_p_odbudowa:0 "Odbudowa armii"
 ROS_poklonska_zy_p_odbudowa_desc:0 "Z magazynów wyjeżdża ostatni sprzęt, a do koszar wracają ranni, którzy wyzdrowieli."
