 ZAG_CZE_zy_p_rewanz_desc:0 "Każdy rocznik przechodzi szkolenie, każda fabryka ma plan wojenny. Następnym razem będzie inaczej."
 ZAG_CZE_zy_p_pojednanie:0 "Pojednanie"
 ZAG_CZE_zy_p_pojednanie_desc:0 "Przegrana wojna nie musi oznaczać upadku. Ważne, kto zostanie i co zbudujemy."
 ZAG_CZE_zy_p_odbudowa:0 "Odbudowa armii"
 ZAG_CZE_zy_p_odbudowa_desc:0 "Z magazynów wyjeżdża ostatni sprzęt, a do koszar wracają ranni, którzy wyzdrowieli."
 ZAG_GER_zy_z_uchodzcy:0 "Uchodźcy znad Wisły"
 ZAG_GER_zy_z_uchodzcy_desc:0 "Na przejściach granicznych stoją kolejki samochodów i autobusów z rozbitej Polski."
 ZAG_GER_zy_z_przemyt:0 "Przemyt przez granicę"
 ZAG_GER_zy_z_przemyt_desc:0 "Broń, paliwo i papierosy płyną przez granicę w obie strony."
 ZAG_GER_zy_z_ochotnicy:0 "Ochotnicy do Polski"
 ZAG_GER_zy_z_ochotnicy_desc:0 "Byli żołnierze chcą jechać walczyć w polskich wojnach – za różne strony."
 ZAG_GER_zy_z_pomoc:0 "Pomoc humanitarna"
 ZAG_GER_zy_z_pomoc_desc:0 "Konwoje z żywnością i lekami jadą do polskich miast. Polska zapamięta, kto pomógł."
 ZAG_GER_zy_z_mur:0 "Zamknięta granica"
 ZAG_GER_zy_z_mur_desc:0 "Płot, patrole i drony. Chaos zza granicy ma zostać po tamtej stronie."
 ZAG_GER_zy_z_media:0 "Polska w wiadomościach"
 ZAG_GER_zy_z_media_desc:0 "Korespondenci z Warszawy, Gdańska i Torunia relacjonują rozpad sąsiada na żywo."
 ZAG_GER_zy_z_konsulaty:0 "Konsulaty w polskich państwach"
 ZAG_GER_zy_z_konsulaty_desc:0 "Dyplomaci otwierają placówki w kilku polskich stolicach naraz. Każda z nich twierdzi, że jest jedyną prawdziwą."
 ZAG_GER_zy_z_polityka:0 "Nowa polityka wobec Polski"
 ZAG_GER_zy_z_polityka_desc:0 "Rozbita Polska to problem i szansa. Rząd ma plan na jedno i drugie."
 ZAG_GER_zy_k_admin:0 "Administracja nowych ziem"
 ZAG_GER_zy_k_admin_desc:0 "Na zdobytych terenach trzeba ustanowić urzędy, policję i sądy – i znaleźć ludzi, którzy zechcą w nich pracować."
 ZAG_GER_zy_k_defilada:0 "Defilada zwycięstwa"
 ZAG_GER_zy_k_defilada_desc:0 "Żołnierze maszerują przez stolicę, a tłum wiwatuje. Przez jeden dzień nikt nie pyta o ceny chleba."
 ZAG_GER_zy_k_opor:0 "Opór na nowych ziemiach"
 ZAG_GER_zy_k_opor_desc:0 "Nie wszyscy cieszą się z nowej władzy. Trzeba zdecydować, jak rządzić zdobytymi ziemiami."
 ZAG_GER_zy_k_owoce:0 "Owoce zwycięstwa"
 ZAG_GER_zy_k_owoce_desc:0 "Nowe ziemie, nowe fabryki i nowi obywatele. Zwycięstwo trzeba zamienić w porządek."
 ZAG_GER_zy_p_straty:0 "Liczymy straty"
 ZAG_GER_zy_p_straty_desc:0 "Listy poległych wiszą na drzwiach urzędów. Ci, którzy przeżyli, wracają do domów – albo do koszar."
