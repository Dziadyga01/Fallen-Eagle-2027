 TR2_romanowski_zy_k_owoce_desc:0 "Nowe ziemie, nowe fabryki i nowi obywatele. Zwycięstwo trzeba zamienić w porządek."
 TR2_romanowski_zy_p_straty:0 "Liczymy straty"
 TR2_romanowski_zy_p_straty_desc:0 "Listy poległych wiszą na drzwiach urzędów. Ci, którzy przeżyli, wracają do domów – albo do koszar."
 TR2_romanowski_zy_p_rzad:0 "Rząd jedności"
 TR2_romanowski_zy_p_rzad_desc:0 "Po klęsce wszystkie stronnictwa siadają do jednego stołu. Nikt nie ma siły na kłótnie."
 TR2_romanowski_zy_p_rewanz:0 "Nigdy więcej klęski"
 TR2_romanowski_zy_p_rewanz_desc:0 "Każdy rocznik przechodzi szkolenie, każda fabryka ma plan wojenny. Następnym razem będzie inaczej."
 TR2_romanowski_zy_p_pojednanie:0 "Pojednanie"
 TR2_romanowski_zy_p_pojednanie_desc:0 "Przegrana wojna nie musi oznaczać upadku. Ważne, kto zostanie i co zbudujemy."
 TR2_romanowski_zy_p_odbudowa:0 "Odbudowa armii"
 TR2_romanowski_zy_p_odbudowa_desc:0 "Z magazynów wyjeżdża ostatni sprzęt, a do koszar wracają ranni, którzy wyzdrowieli."
 TR2_zaleski_zy_s_ulica:0 "Głos ulicy"
 TR2_zaleski_zy_s_ulica_desc:0 "Pod siedzibą władz zbierają się ludzie. Chcą wiedzieć, co dalej – i nie wszyscy przyszli z pustymi rękami."
 TR2_zaleski_zy_s_media:0 "Gazeta i radio"
 TR2_zaleski_zy_s_media_desc:0 "Lokalne radio i gazeta stają się głosem władz. Dziennikarze dostają przepustki – i listę tematów, o których lepiej nie mówić."
 TR2_zaleski_zy_s_spis:0 "Spis mieszkańców"
 TR2_zaleski_zy_s_spis_desc:0 "Nikt nie wie, ilu ludzi naprawdę mieszka w granicach państwa. Urzędnicy ruszają od drzwi do drzwi."
 TR2_zaleski_zy_s_kartki:0 "Kartki na żywność"
 TR2_zaleski_zy_s_kartki_desc:0 "Każdy dostaje przydział: chleb, cukier, olej i paliwo. Nikt nie jest syty, ale nikt nie głoduje."
 TR2_zaleski_zy_s_rynek:0 "Wolny rynek żywności"
 TR2_zaleski_zy_s_rynek_desc:0 "Ceny ustalają kupcy, nie urzędnicy. Na targach jest wszystko – dla tych, których stać."
 TR2_zaleski_zy_s_szkoly:0 "Szkoły znów otwarte"
 TR2_zaleski_zy_s_szkoly_desc:0 "Dzieci wracają do ławek, a nauczyciele dostają pensje w żywności. Normalność zaczyna się od dzwonka na przerwę."
 TR2_zaleski_zy_s_czarny:0 "Czarny rynek"
 TR2_zaleski_zy_s_czarny_desc:0 "Na bazarach można kupić wszystko – paliwo, leki, amunicję. Trzeba zdecydować, co z tym zrobić."
 TR2_zaleski_zy_s_straze:0 "Ochotnicze straże i kuchnie"
 TR2_zaleski_zy_s_straze_desc:0 "W każdej dzielnicy powstaje straż ochotnicza i kuchnia społeczna. Ludzie pilnują porządku i karmią się nawzajem."
 TR2_zaleski_zy_s_wspolnota:0 "Wspólnota w czasie rozpadu"
 TR2_zaleski_zy_s_wspolnota_desc:0 "Kuchnie, szkoły, straże i radio – ludzie przestali czekać, aż ktoś ich uratuje."
 TR2_zaleski_zy_k_admin:0 "Administracja nowych ziem"
 TR2_zaleski_zy_k_admin_desc:0 "Na zdobytych terenach trzeba ustanowić urzędy, policję i sądy – i znaleźć ludzi, którzy zechcą w nich pracować."
 TR2_zaleski_zy_k_defilada:0 "Defilada zwycięstwa"
 TR2_zaleski_zy_k_defilada_desc:0 "Żołnierze maszerują przez stolicę, a tłum wiwatuje. Przez jeden dzień nikt nie pyta o ceny chleba."
 TR2_zaleski_zy_k_opor:0 "Opór na nowych ziemiach"
 TR2_zaleski_zy_k_opor_desc:0 "Nie wszyscy cieszą się z nowej władzy. Trzeba zdecydować, jak rządzić zdobytymi ziemiami."
