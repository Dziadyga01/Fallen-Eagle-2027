 ROS_car_zy_r_tv:0 "Telewizja państwowa"
 ROS_car_zy_r_tv_desc:0 "Wieczorne wiadomości pokazują zwycięstwa, nawet gdy ich nie ma. Kanały niezależne „przechodzą konserwację”."
 ROS_car_zy_r_listy:0 "Listy z frontu"
 ROS_car_zy_r_listy_desc:0 "Rodziny żołnierzy piszą do urzędów i redakcji. Władza musi odpowiedzieć – jakoś."
 ROS_car_zy_r_oligarchowie:0 "Oligarchowie płacą"
 ROS_car_zy_r_oligarchowie_desc:0 "Najbogatsi dostają zaproszenie na rozmowę. Wszyscy wiedzą, co się dzieje z tymi, którzy nie płacą."
 ROS_car_zy_r_rubel:0 "Ratowanie rubla"
 ROS_car_zy_r_rubel_desc:0 "Bank centralny pali rezerwy, żeby utrzymać kurs i ceny w sklepach."
 ROS_car_zy_r_druk:0 "Drukujemy ruble"
 ROS_car_zy_r_druk_desc:0 "Pensje wypłacane na czas – w pieniądzach, które z tygodnia na tydzień są warte mniej."
 ROS_car_zy_r_cenzura:0 "Cenzura sieci"
 ROS_car_zy_r_cenzura_desc:0 "VPN-y blokowane, kanały w komunikatorach zamykane, blogerzy wzywani na rozmowy."
 ROS_car_zy_r_regiony:0 "Lojalność regionów"
 ROS_car_zy_r_regiony_desc:0 "Gubernatorzy dostają pieniądze i obowiązek dostarczenia rekrutów. Kto nie dostarczy, przestaje być gubernatorem."
 ROS_car_zy_r_jednosc:0 "Jedność frontu wewnętrznego"
 ROS_car_zy_r_jednosc_desc:0 "Kraj jest zmęczony, ale posłuszny. Władza pilnuje, by tak zostało."
