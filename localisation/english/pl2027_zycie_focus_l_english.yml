 ZAG_CZE_zy_z_uchodzcy:0 "Uchodźcy znad Wisły"
 ZAG_CZE_zy_z_uchodzcy_desc:0 "Na przejściach granicznych stoją kolejki samochodów i autobusów z rozbitej Polski."
 ZAG_CZE_zy_z_przemyt:0 "Przemyt przez granicę"
 ZAG_CZE_zy_z_przemyt_desc:0 "Broń, paliwo i papierosy płyną przez granicę w obie strony."
 ZAG_CZE_zy_z_ochotnicy:0 "Ochotnicy do Polski"
 ZAG_CZE_zy_z_ochotnicy_desc:0 "Byli żołnierze chcą jechać walczyć w polskich wojnach – za różne strony."
 ZAG_CZE_zy_z_pomoc:0 "Pomoc humanitarna"
 ZAG_CZE_zy_z_pomoc_desc:0 "Konwoje z żywnością i lekami jadą do polskich miast. Polska zapamięta, kto pomógł."
 ZAG_CZE_zy_z_mur:0 "Zamknięta granica"
 ZAG_CZE_zy_z_mur_desc:0 "Płot, patrole i drony. Chaos zza granicy ma zostać po tamtej stronie."
 ZAG_CZE_zy_z_media:0 "Polska w wiadomościach"
 ZAG_CZE_zy_z_media_desc:0 "Korespondenci z Warszawy, Gdańska i Torunia relacjonują rozpad sąsiada na żywo."
 ZAG_CZE_zy_z_konsulaty:0 "Konsulaty w polskich państwach"
 ZAG_CZE_zy_z_konsulaty_desc:0 "Dyplomaci otwierają placówki w kilku polskich stolicach naraz. Każda z nich twierdzi, że jest jedyną prawdziwą."
 ZAG_CZE_zy_z_polityka:0 "Nowa polityka wobec Polski"
 ZAG_CZE_zy_z_polityka_desc:0 "Rozbita Polska to problem i szansa. Rząd ma plan na jedno i drugie."
