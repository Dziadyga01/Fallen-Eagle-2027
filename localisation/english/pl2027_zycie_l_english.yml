l_english:
 TFR_media:0 "Media pod opieką władz"
 TFR_media_desc:0 "Radio i gazeta mówią jednym głosem. Ludzie wiedzą, co się dzieje – przynajmniej to, co powinni wiedzieć."
 TFR_kartki:0 "Kartki na żywność"
 TFR_kartki_desc:0 "Każdy dostaje przydział: chleb, cukier, olej, paliwo. Nikt nie jest syty, ale nikt nie głoduje."
 TFR_wolny_rynek:0 "Wolny rynek żywności"
 TFR_wolny_rynek_desc:0 "Ceny ustalają kupcy, nie urzędnicy. Na targach jest wszystko – dla tych, których stać."
 TFR_spoleczenstwo:0 "Wspólnota w czasie rozpadu"
 TFR_spoleczenstwo_desc:0 "Kuchnie, szkoły, straże ochotnicze i radio – ludzie przestali czekać, aż ktoś ich uratuje."
 TFR_ros_tv:0 "Telewizja państwowa"
 TFR_ros_tv_desc:0 "Wieczorne wiadomości pokazują zwycięstwa, nawet gdy ich nie ma."
 TFR_ros_rubel:0 "Ratowanie rubla"
 TFR_ros_rubel_desc:0 "Bank centralny pali rezerwy, żeby utrzymać kurs. Sklepy mają towar, budżet – coraz mniej."
 TFR_ros_druk:0 "Drukarnia rubli"
 TFR_ros_druk_desc:0 "Pensje są wypłacane na czas, tylko kupić za nie można coraz mniej."
 TFR_ros_jednosc:0 "Jedność frontu wewnętrznego"
 TFR_ros_jednosc_desc:0 "Kraj jest zmęczony, ale posłuszny. Władza pilnuje, by tak zostało."
 TFR_zag_pomoc:0 "Pomoc dla sąsiadów"
 TFR_zag_pomoc_desc:0 "Konwoje z żywnością i lekami jadą przez granicę. Polska pamięta, kto pomógł."
 TFR_zag_granica:0 "Zamknięta granica"
 TFR_zag_granica_desc:0 "Płot, patrole i drony. Chaos zza granicy ma zostać po tamtej stronie."
 TFR_zag_polityka:0 "Nowa polityka wobec Polski"
 TFR_zag_polityka_desc:0 "Rozbita Polska to problem i szansa. Rząd ma plan na jedno i drugie."
 TFR_owoce:0 "Owoce zwycięstwa"
 TFR_owoce_desc:0 "Nowe ziemie, nowe fabryki i nowi obywatele. Zwycięstwo trzeba jeszcze zamienić w porządek."
 TFR_rewanz:0 "Nigdy więcej klęski"
 TFR_rewanz_desc:0 "Każdy rocznik przechodzi szkolenie, każda fabryka ma plan wojenny. Następnym razem będzie inaczej."
 TFR_pojednanie:0 "Pojednanie"
 TFR_pojednanie_desc:0 "Przegrana wojna nie musi oznaczać upadku. Ważne, kto zostanie i co zbudujemy."
 TFR_zima:0 "Sroga zima"
 TFR_zima_desc:0 "Brakuje opału, a mróz nie odpuszcza. Fabryki pracują na pół gwizdka."
 TFR_blackout:0 "Przerwy w dostawach prądu"
 TFR_blackout_desc:0 "Elektrownia pracuje na resztkach. Prąd jest po kilka godzin dziennie."
 TFR_strajk:0 "Strajk"
 TFR_strajk_desc:0 "Hale stoją, a przed bramą płoną opony."
 TFR_afera:0 "Afera w urzędach"
 TFR_afera_desc:0 "Wszyscy wiedzą, kto brał. Nikt nie wie, kto jeszcze bierze."
 TFR_inflacja:0 "Inflacja"
 TFR_inflacja_desc:0 "Ceny zmieniają się z dnia na dzień. Ludzie płacą papierosami i paliwem."
 TFR_powodz:0 "Po powodzi"
 TFR_powodz_desc:0 "Woda opadła, zostało błoto, zniszczone drogi i ludzie bez dachu nad głową."
 TFR_jednosc:0 "Duch jedności"
 TFR_jednosc_desc:0 "Na chwilę wszyscy są po tej samej stronie. Warto to wykorzystać."
 TFR_zniwa:0 "Dobre zbiory"
 TFR_zniwa_desc:0 "Spichlerze są pełne. Tej zimy nikt nie będzie głodny."
 TFR_panika:0 "Panika wojenna"
 TFR_panika_desc:0 "Plotki o wojnie krążą szybciej niż wiadomości. Sklepy pustoszeją, a ochotnicy ustawiają się w kolejkach."
 zycie.1.t:0 "Głos ulicy"
 zycie.1.d:0 "Pod siedzibą władz zbiera się tłum. Ludzie chcą wiedzieć, kiedy wróci prąd, czy będzie chleb i kto właściwie rządzi. Część przyszła z transparentami, część – z kijami."
 zycie.1.a:0 "Wyjść do ludzi i rozmawiać."
 zycie.1.b:0 "Rozpędzić zgromadzenie."
 zycie.1.c:0 "Obiecać wybory, gdy sytuacja się uspokoi."
 zycie.2.t:0 "Czarny rynek"
 zycie.2.d:0 "Na bazarach można kupić wszystko: paliwo, leki, amunicję. Handlarze płacą policjantom, a policjanci przymykają oczy. Trzeba coś z tym zrobić – albo na tym zarobić."
 zycie.2.a:0 "Zalegalizować i opodatkować."
 zycie.2.b:0 "Rozbić siatki handlarzy."
 zycie.2.c:0 "Kupić od nich broń."
 zycie.3.t:0 "Spis mieszkańców"
 zycie.3.d:0 "Urzędnicy chodzą od drzwi do drzwi. Okazuje się, że w mieście mieszka dużo więcej ludzi, niż mówiły stare rejestry – uciekinierzy, przyjezdni, ludzie bez dokumentów."
 zycie.3.a:0 "Wszyscy dostają dokumenty i przydział."
 zycie.3.b:0 "Pierwszeństwo dla stałych mieszkańców."
 zycie.10.t:0 "Opór na nowych ziemiach"
 zycie.10.d:0 "Na zdobytych terenach nie wszyscy cieszą się z nowej władzy. Ktoś zrywa flagi, ktoś inny podpala magazyn. Urzędnicy boją się jeździć bez eskorty."
 zycie.10.a:0 "Amnestia i lokalne rady."
 zycie.10.b:0 "Twarda ręka – patrole i godzina policyjna."
 zycie.10.c:0 "Szeroka autonomia dla nowych ziem."
 zycie.11.t:0 "Rachunek klęski"
 zycie.11.d:0 "Wojna jest przegrana albo prawie przegrana. Na pogrzebach mówi się już nie o bohaterstwie, ale o winnych. Ktoś musi wziąć odpowiedzialność."
 zycie.11.a:0 "Dymisja dowództwa."
 zycie.11.b:0 "Winni są zdrajcy i obcy agenci."
 zycie.20.t:0 "Listy z frontu"
 zycie.20.d:0 "Do redakcji i urzędów przychodzą listy od rodzin żołnierzy. Pytają, kiedy synowie wrócą do domu i dlaczego nikt nie mówi prawdy o stratach."
 zycie.20.a:0 "Wypłacić odszkodowania i spotkać się z rodzinami."
 zycie.20.b:0 "Odpowiedzieć patriotyczną kampanią."
 zycie.20.c:0 "Listy nigdy nie dotarły."
 zycie.21.t:0 "Oligarchowie płacą"
 zycie.21.d:0 "Najbogatsi ludzie w kraju zostają zaproszeni na rozmowę. Nikt im nie grozi. Po prostu wszyscy wiedzą, co się dzieje z tymi, którzy nie płacą."
 zycie.21.a:0 "Specjalny podatek wojenny."
 zycie.21.b:0 "Fabryki pracują dla armii."
 zycie.30.t:0 "Uchodźcy znad Wisły"
 zycie.30.d:0 "Na przejściach granicznych z rozbitą Polską stoją kolejki samochodów i autobusów. Ludzie uciekają przed wojnami lokalnych państewek."
 zycie.30.a:0 "Otworzyć punkty pomocy."
 zycie.30.b:0 "Wpuścić tylko z dokumentami."
 zycie.31.t:0 "Ochotnicy do Polski"
 zycie.31.d:0 "Byli żołnierze i najemnicy chcą jechać walczyć w Polsce – za różne strony. Rząd może ich zatrzymać albo przymknąć oko."
 zycie.31.a:0 "Zakazać wyjazdów."
 zycie.31.b:0 "Przymknąć oko – niech zdobywają doświadczenie."
 zycie.32.t:0 "Przemyt przez granicę"
 zycie.32.d:0 "Przez granicę z Polską płynie broń, paliwo i papierosy – w obie strony. Celnicy mówią, że bez wojska nie dadzą rady."
 zycie.32.a:0 "Wysłać wojsko na granicę."
 zycie.32.b:0 "Pobierać „opłaty” od przemytników."
 TFR_tt_zwyciestwo:0 "Zdobyliśmy nowe ziemie albo pokonaliśmy przeciwnika w wojnie"
 TFR_tt_kleska:0 "Przegraliśmy wojnę albo ponieśliśmy ciężkie straty"
 zycie.100.t:0 "Sroga zima"
 zycie.100.d:0 "Mróz nie odpuszcza od tygodnia. Brakuje węgla, a w blokach ludzie śpią w kurtkach. W kolejce po opał doszło do bójki."
 zycie.100.a:0 "Kupić węgiel za wszelką cenę."
 zycie.100.b:0 "Racjonować opał."
 zycie.100.c:0 "Wyciąć park miejski na opał."
 zycie.101.t:0 "Ciemność w mieście"
 zycie.101.d:0 "Elektrownia stanęła. Szpitale pracują na agregatach, a fabryki stoją. Inżynierowie mówią, że naprawa potrwa."
 zycie.101.a:0 "Ściągnąć inżynierów z całego regionu."
 zycie.101.b:0 "Prąd tylko dla fabryk zbrojeniowych."
 zycie.102.t:0 "Strajk w zakładach"
 zycie.102.d:0 "Robotnicy największego zakładu stają przy maszynach i nie ruszają ich. Chcą wypłat w żywności, nie w obietnicach."
 zycie.102.a:0 "Spełnić żądania."
 zycie.102.b:0 "Przeczekać."
 zycie.102.c:0 "Wysłać straż pod bramę."
 zycie.103.t:0 "Afera w urzędach"
 zycie.103.d:0 "Dziennikarze ujawniają, że urzędnicy sprzedawali przydziały paliwa. Na liście nazwisk są ludzie z samej góry."
 zycie.103.a:0 "Dymisje i proces."
 zycie.103.b:0 "Zamieść pod dywan."
 zycie.104.t:0 "Dezerterzy z sąsiedniej armii"
 zycie.104.d:0 "Kilkudziesięciu żołnierzy z sąsiedniego państwa przechodzi do nas z bronią. Proszą o azyl – i o żołd."
 zycie.104.a:0 "Przyjąć ich do wojska."
 zycie.104.b:0 "Odesłać ich – nie chcemy kłopotów."
 zycie.105.t:0 "Handlarze bronią"
 zycie.105.d:0 "Ludzie zza wschodniej granicy proponują skrzynie z karabinami i amunicją. Cena jest dobra. Pochodzenie – lepiej nie pytać."
 zycie.105.a:0 "Kupujemy."
 zycie.105.b:0 "Aresztować handlarzy."
 zycie.106.t:0 "Konwój humanitarny"
 zycie.106.d:0 "Konwój organizacji pomocowych przywozi żywność, leki i agregaty. Kierowcy pytają, komu mają to przekazać."
 zycie.106.a:0 "Rozdać mieszkańcom."
 zycie.106.b:0 "Część dla armii."
 zycie.107.t:0 "Inflacja"
 zycie.107.d:0 "Ceny rosną szybciej, niż urzędnicy zdążą je wpisać do tabel. Na targach płaci się papierosami i paliwem."
 zycie.107.a:0 "Zamrozić ceny."
 zycie.107.b:0 "Niech rynek się wyrówna."
 zycie.108.t:0 "Powódź"
 zycie.108.d:0 "Rzeka wylała po roztopach. Zalane są osiedla, drogi i magazyny."
 zycie.108.a:0 "Wszyscy do worków z piaskiem."
 zycie.108.b:0 "Ratować tylko fabryki."
 zycie.109.t:0 "Kradzież paliwa"
 zycie.109.d:0 "Z magazynu wojskowego zniknęły cysterny z paliwem. Strażnicy niczego nie widzieli."
 zycie.109.a:0 "Śledztwo i kary."
 zycie.109.b:0 "Kupić paliwo od tych, którzy je ukradli."
 zycie.110.t:0 "Uciekinierzy z Warszawy"
 zycie.110.d:0 "Z płonącej stolicy przyjeżdżają rodziny z dziećmi i dobytkiem w samochodach. Pytają o dach nad głową i pracę."
 zycie.110.a:0 "Przyjąć wszystkich."
 zycie.110.b:0 "Przyjąć fachowców i rodziny żołnierzy."
 zycie.111.t:0 "Lokalny bohater"
 zycie.111.d:0 "Strażak, który wyniósł z pożaru dwanaścioro dzieci, staje się bohaterem całego miasta. Jego zdjęcie wisi w każdym sklepie."
 zycie.111.a:0 "Uroczystość na rynku."
 zycie.111.b:0 "Zrobić z niego twarz kampanii werbunkowej."
 zycie.112.t:0 "Mecz jedności"
 zycie.112.d:0 "Na lokalnym stadionie odbywa się mecz charytatywny. Na trybunach siedzą obok siebie ludzie, którzy jeszcze miesiąc temu by się bili."
 zycie.112.a:0 "Wszyscy na trybuny!"
 zycie.112.b:0 "Zbiórka na armię w przerwie."
 zycie.113.t:0 "Szpieg ujęty"
 zycie.113.d:0 "Kontrwywiad zatrzymał człowieka, który fotografował koszary i mosty. Przy sobie miał pieniądze i telefon z numerami z sąsiedniego państwa."
 zycie.113.a:0 "Proces pokazowy."
 zycie.113.b:0 "Wymienić go po cichu."
 zycie.114.t:0 "Bunt w garnizonie"
 zycie.114.d:0 "Żołnierze w jednym z garnizonów od trzech miesięcy nie dostali żołdu. Zamknęli bramę i żądają rozmowy."
 zycie.114.a:0 "Wypłacić zaległości."
 zycie.114.b:0 "Wymienić dowódców."
 zycie.115.t:0 "Dobre zbiory"
 zycie.115.d:0 "Pierwszy raz od rozpadu pola dały więcej, niż się spodziewano. Spichlerze są pełne."
 zycie.115.a:0 "Zapasy na zimę."
 zycie.115.b:0 "Sprzedać nadwyżki sąsiadom."
 zycie.116.t:0 "Zagraniczni dziennikarze"
 zycie.116.d:0 "Ekipa zagranicznej telewizji kręci reportaż o „najmniejszych państwach Europy”. Chcą wywiadu z przywódcą."
 zycie.116.a:0 "Udzielić wywiadu."
 zycie.116.b:0 "Wyprosić ich – to nie zoo."
 zycie.117.t:0 "Plotka o wojnie"
 zycie.117.d:0 "Na targu ktoś mówi, że sąsiedzi szykują atak. Do wieczora wie o tym całe miasto."
 zycie.117.a:0 "Uspokoić ludzi."
 zycie.117.b:0 "Wykorzystać – mobilizacja!"
