 PL2027_BOOKMARK_NAME:0 "The Fallen Eagle 2027"
 PL2027_BOOKMARK_DESC:0 "11 listopada 2027. Po wyborach parlamentarnych, których wyniku nikt nie uznał, Polska rozpadła się na kilkanaście państw. Toruń i Bydgoszcz rywalizują o to, kto zostanie metropolią Kujaw i Pomorza, a między nimi powstały gminne mikropaństwa. Warszawa rozpadła się na strefy kontrolowane przez różne siły. Trójmiasto rozpadło się na trzy państwa, w Malborku odrodził się Zakon Krzyżacki, a Olsztyn stanął na czele Warmii i Mazur. Na zachodzie Berlin i Bruksela „tymczasowo” przejęły Pomorze Zachodnie, Wielkopolskę i Śląsk – powstały tam Eurostaaty pod niemieckim zarządem."
 PL2027_OTHER_DESC:0 "Pozostałe państwa obserwują rozpad z niepokojem."
