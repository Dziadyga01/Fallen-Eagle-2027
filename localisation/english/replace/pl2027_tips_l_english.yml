l_english:
 LOADING_TIP_0:0 "„Jeszcze Polska nie zginęła, kiedy my żyjemy.”\n— Józef Wybicki, 1797"
 LOADING_TIP_1:0 "„Jest jedna tylko rzecz w życiu ludzi, narodów i państw, która jest bezcenna. Tą rzeczą jest honor.”\n— Józef Beck, Sejm, 5 maja 1939"
 LOADING_TIP_2:0 "„Ojczyzna nasza znalazła się nad przepaścią.”\n— Wojciech Jaruzelski, 13 grudnia 1981"
 LOADING_TIP_3:0 "„Przeszłość odkreślamy grubą linią.”\n— Tadeusz Mazowiecki, 1989"
 LOADING_TIP_4:0 "„Chciałem, by Warszawa była wielka. Wierzyłem, że wielka będzie.”\n— Stefan Starzyński, wrzesień 1939"
 LOADING_TIP_5:0 "„Być zwyciężonym i nie ulec – to zwycięstwo; zwyciężyć i spocząć na laurach – to klęska.”\n— Józef Piłsudski"
 LOADING_TIP_6:0 "„O nierządne królestwo i zginienia bliskie, gdzie ani prawa ważą, ani sprawiedliwość ma miejsce, ale wszystko złotem kupić trzeba!”\n— Jan Kochanowski, Odprawa posłów greckich"
 LOADING_TIP_7:0 "„Nową przypowieść Polak sobie kupi, że i przed szkodą, i po szkodzie głupi.”\n— Jan Kochanowski"
 LOADING_TIP_8:0 "„Takie będą Rzeczypospolite, jakie ich młodzieży chowanie.”\n— Jan Zamoyski"
 LOADING_TIP_9:0 "„Nihil novi nisi commune consensu – nic nowego bez wspólnej zgody.”\n— Konstytucja radomska, 1505"
 LOADING_TIP_10:0 "„Nie pozwalam!”\n— formuła liberum veto, Sejm 1652"
 LOADING_TIP_11:0 "„Wszelka władza społeczności ludzkiej początek swój bierze z woli narodu.”\n— Konstytucja 3 Maja, 1791"
 LOADING_TIP_12:0 "„Finis Poloniae!”\n— słowa przypisywane Kościuszce pod Maciejowicami, 1794 – sam im zaprzeczał"
 LOADING_TIP_13:0 "„Za wolność naszą i waszą.”\n— hasło powstańcze, 1831"
 LOADING_TIP_14:0 "„Mierz siłę na zamiary, nie zamiar podług sił.”\n— Adam Mickiewicz, Oda do młodości"
 LOADING_TIP_15:0 "„Polsko! lecz ciebie błyskotkami łudzą; pawiem narodów byłaś i papugą.”\n— Juliusz Słowacki, Grób Agamemnona"
 LOADING_TIP_16:0 "„Miałeś, chamie, złoty róg.”\n— Stanisław Wyspiański, Wesele"
 LOADING_TIP_17:0 "„Jestem Polakiem – więc mam obowiązki polskie.”\n— Roman Dmowski, 1903"
 LOADING_TIP_18:0 "„Nie oddamy nawet guzika.”\n— Edward Rydz-Śmigły, 1939 (parafraza)"
 LOADING_TIP_19:0 "„Rzeczpospolita Polska jest dobrem wspólnym wszystkich obywateli.”\n— Konstytucja RP, art. 1"
 LOADING_TIP_20:0 "„Nie chcę, ale muszę.”\n— Lech Wałęsa"
 LOADING_TIP_21:0 "„Warto być przyzwoitym.”\n— Władysław Bartoszewski"
 LOADING_TIP_22:0 "„Wojna jest kontynuacją polityki innymi środkami.”\n— Carl von Clausewitz, O wojnie"
 LOADING_TIP_23:0 "„Chcesz pokoju, szykuj się do wojny.”\n— Wegecjusz (parafraza)"
 LOADING_TIP_24:0 "„Najwyższą sztuką wojenną jest pokonać wroga bez walki.”\n— Sun Zi, Sztuka wojny"
 LOADING_TIP_25:0 "„Silni robią, co mogą, a słabi cierpią, co muszą.”\n— Tukidydes, dialog melijski"
 LOADING_TIP_26:0 "„Bez wspólnej władzy życie człowieka jest samotne, biedne, okropne, zwierzęce i krótkie.”\n— Thomas Hobbes, Lewiatan (parafraza)"
 LOADING_TIP_27:0 "„Państwo to wspólnota, która skutecznie rości sobie monopol na prawomocne użycie przemocy fizycznej.”\n— Max Weber, 1919"
 LOADING_TIP_28:0 "„Stary świat umiera, a nowy nie może się narodzić. W tym bezkrólewiu pojawiają się najróżniejsze objawy chorobowe.”\n— Antonio Gramsci"
 LOADING_TIP_29:0 "„Rewolucja, jak Saturn, pożera własne dzieci.”\n— Pierre Vergniaud, 1793"
 LOADING_TIP_30:0 "„Ci, którzy nie pamiętają przeszłości, skazani są na jej powtarzanie.”\n— George Santayana"
 LOADING_TIP_31:0 "„Dom podzielony przeciw sobie nie może się ostać.”\n— Abraham Lincoln, 1858 (za Ewangelią Marka)"
 LOADING_TIP_32:0 "„Demokracja jest najgorszą formą rządu, jeśli nie liczyć wszystkich innych.”\n— Winston Churchill, 1947"
 LOADING_TIP_33:0 "„Socjalizm to ustrój, który bohatersko walczy z problemami nieznanymi w żadnym innym ustroju.”\n— Stefan Kisielewski"
