l_polish:
 TRN_gosp_budzet:0 "Nadzwyczajny budżet miasta"
 TRN_gosp_budzet_desc:0 "Rozpad państwa odciął Toruń od subwencji z Warszawy. Ratusz musi sam zebrać pieniądze na pensje, szpitale i ogrzewanie."
 TRN_gosp_handel_wisla:0 "Handel na Wiśle"
 TRN_gosp_handel_wisla_desc:0 "Wisła znów staje się drogą handlową. Barki z Włocławka i Grudziądza mogą przywozić towary, których brakuje na rynku."
 TRN_handel_wisla:0 "Handel na Wiśle"
 TRN_gosp_piernik:0 "Toruński piernik na eksport"
 TRN_gosp_piernik_desc:0 "Piernik to najlepiej znana marka miasta. Lokalne piekarnie i fabryka cukiernicza mogą przynieść twardą walutę."
 TRN_gosp_kadry_umk:0 "Kadry z UMK"
 TRN_gosp_kadry_umk_desc:0 "Absolwenci ekonomii i zarządzania z UMK zamiast wyjeżdżać, mogą zasilić miejskie spółki i urzędy."
 TRN_kadry_umk:0 "Kadry z UMK"
 TRN_gosp_stabilizacja:0 "Stabilizacja gospodarki Torunia"
 TRN_gosp_stabilizacja_desc:0 "Ceny przestały rosnąć z dnia na dzień, a sklepy na Rubinkowie i Starówce znów mają towar. Czas utrwalić ten spokój."
 TRN_prz_firmy:0 "Rozwój toruńskich firm"
 TRN_prz_firmy_desc:0 "Toruń ma własny przemysł – od elektroniki po tworzywa sztuczne. Trzeba go utrzymać przy życiu w nowej rzeczywistości."
 TRN_rozwoj_firm:0 "Rozwój toruńskich firm"
 TRN_prz_apator:0 "Modernizacja Apatora"
 TRN_prz_apator_desc:0 "Zakłady Apatora produkują liczniki i aparaturę elektryczną. Ich inżynierowie mogą pracować także dla potrzeb miasta."
 TRN_apator:0 "Modernizacja Apatora"
 TRN_prz_towimor:0 "Zamówienia dla Towimoru"
 TRN_prz_towimor_desc:0 "Towimor od dziesięcioleci buduje urządzenia okrętowe. Te same hale mogą wytwarzać sprzęt dla toruńskiej obrony."
 TRN_prz_przemysl_20:0 "Piernikowy Przemysł 2.0"
 TRN_prz_przemysl_20_desc:0 "Małe zakłady z Grębocina, Czerniewic i Podgórza łączą siły. Lokalny przemysł ma pracować jak jeden organizm."
 TRN_prz_kopernik:0 "Zakłady Kopernika"
 TRN_prz_kopernik_desc:0 "Nowe linie produkcyjne nazwane imieniem najsłynniejszego torunianina. Miasto potrzebuje własnej zbrojeniówki."
 TRN_prz_eksport:0 "Toruńskie firmy na nowych rynkach"
 TRN_prz_eksport_desc:0 "Skoro Polska się rozpadła, każdy sąsiad jest teraz zagranicą. Toruńskie firmy mogą sprzedawać im swoje produkty."
 TRN_nowe_rynki:0 "Toruńskie firmy na nowych rynkach"
 TRN_inf_mosty:0 "Mosty na Wiśle"
 TRN_inf_mosty_desc:0 "Kto kontroluje mosty, ten kontroluje Toruń. Trzeba je zabezpieczyć i utrzymać w dobrym stanie."
 TRN_inf_most_drogowy:0 "Most im. gen. Elżbiety Zawackiej"
 TRN_inf_most_drogowy_desc:0 "Drugi most drogowy odciąża stary most i łączy wschodnie dzielnice z lewym brzegiem Wisły."
 TRN_inf_most_kolejowy:0 "Most kolejowy"
 TRN_inf_most_kolejowy_desc:0 "Stary most kolejowy to jedyne połączenie torów obu brzegów. Bez niego Toruń Główny jest odcięty od reszty miasta."
 TRN_inf_autostrada:0 "Piernikowa Autostrada"
 TRN_inf_autostrada_desc:0 "Remont obwodnicy i dróg wylotowych pozwoli szybko przerzucać ludzi i towary wokół miasta."
 TRN_inf_wezel:0 "Węzeł Toruń Główny"
 TRN_inf_wezel_desc:0 "Dworzec Toruń Główny i bocznice na Podgórzu znów obsługują pociągi towarowe. To kręgosłup zaopatrzenia miasta."
 TRN_miasto_mzk:0 "Tramwaje i autobusy MZK"
 TRN_miasto_mzk_desc:0 "Komunikacja miejska musi jeździć mimo wszystko. Kursujące tramwaje to dla mieszkańców znak, że miasto działa."
 TRN_miasto_rubinkowo:0 "Odnowa Rubinkowa"
 TRN_miasto_rubinkowo_desc:0 "Największe osiedle Torunia potrzebuje ciepła, wody i spokoju. Zadowolone Rubinkowo to stabilne miasto."
 TRN_miasto_skarpa:0 "Rewitalizacja Skarpy"
 TRN_miasto_skarpa_desc:0 "Skarpa była zaniedbywana latami. Remont bloków i placów pokaże, że ratusz pamięta o wszystkich dzielnicach."
 TRN_miasto_bulwar:0 "Bulwar nad Wisłą"
 TRN_miasto_bulwar_desc:0 "Bulwar Filadelfijski znów tętni życiem. Z drugiego brzegu patrzy na nas Podgórz – na razie tylko patrzy."
 TRN_miasto_szkoly:0 "Toruńskie szkoły"
 TRN_miasto_szkoly_desc:0 "Szkoły pracują, nauczyciele dostają pensje, a dzieci wracają do ławek. To inwestycja w przyszłość Grodu."
 TRN_szkoly:0 "Toruńskie szkoły"
 TRN_miasto_umk:0 "Uniwersytet Mikołaja Kopernika"
 TRN_miasto_umk_desc:0 "UMK to jeden z największych uniwersytetów w tej części dawnej Polski. Jego laboratoria pracują teraz dla Torunia."
 TRN_woj_wot:0 "Toruńska Obrona Terytorialna"
 TRN_woj_wot_desc:0 "Żołnierze dawnej brygady OT zostali w mieście. Teraz bronią Torunia, a nie kraju, którego już nie ma."
 TRN_woj_artyleria:0 "Tradycje artyleryjskie Torunia"
 TRN_woj_artyleria_desc:0 "Toruń od zawsze był miastem artylerzystów. Poligon i szkoła artylerii to atut, którego nie mają sąsiedzi."
 TRN_artyleria:0 "Tradycje artyleryjskie Torunia"
 TRN_woj_lotnisko:0 "Lotnisko Toruń"
 TRN_woj_lotnisko_desc:0 "Stare lotnisko na Kniewie może znów przyjmować samoloty – także te w barwach Torunia."
 TRN_woj_forty:0 "Forty Twierdzy Toruń"
 TRN_woj_forty_desc:0 "Pierścień XIX-wiecznych fortów wciąż otacza miasto. Kilka z nich można przywrócić do służby."
 TRN_woj_garnizon:0 "Garnizon toruński"
 TRN_woj_garnizon_desc:0 "Koszary, magazyny i kadra – Toruń ma wszystko, czego potrzeba do utrzymania własnej armii."
 TRN_garnizon:0 "Garnizon toruński"
 TRN_wolny_torun:0 "Toruń po upadku Rzeczypospolitej"
 TRN_wolny_torun_desc:0 "11 listopada 2027 roku Toruń obudził się jako samodzielne państwo. Nikt tego nie planował. Rada Tymczasowa Miasta próbuje utrzymać urzędy, wodociągi i tramwaje, ale nikt nie wie, kto naprawdę rządzi."
 TRN_kryzys_administracji:0 "Kryzys miejskiej administracji"
 TRN_kryzys_administracji_desc:0 "Połowa urzędników nie przychodzi do pracy, druga połowa nie wie, komu podlega. Wydziały Ratusza wydają sobie nawzajem sprzeczne polecenia."
 TRN_puste_finanse:0 "Puste miejskie finanse"
 TRN_puste_finanse_desc:0 "Subwencje z Warszawy już nie przyjdą, a podatki płaci tylko część mieszkańców. Skarbnik ostrzega, że pieniędzy wystarczy na dwie wypłaty."
 TRN_przywrocenie_instytucji:0 "Przywrócenie instytucji"
 TRN_przywrocenie_instytucji_desc:0 "Sąd rejonowy, wydział ewidencji i miejska straż wracają do pracy – na razie w trybie awaryjnym, z kartkami zamiast systemów informatycznych. Mieszkańcy znowu wiedzą, gdzie załatwić sprawę."
 TRN_bezpieczenstwo:0 "Bezpieczeństwo wewnętrzne"
 TRN_bezpieczenstwo_desc:0 "Policja miejska, straż pożarna i ochotnicy pilnują magazynów, mostów i stacji paliw. Bez tego każda kłótnia w Ratuszu może skończyć się na ulicy."
 TRN_napiecia_polityczne:0 "Napięcia polityczne"
 TRN_napiecia_polityczne_desc:0 "Obecna ekipa Ratusza, stara gwardia samorządu, miejska lewica, komitet obywatelski, kibice Elany i anarchiści Krevienki – każdy ma własny plan na Toruń. Na ulicach robi się nerwowo."
 TRN_ostatnie_posiedzenie:0 "Ostatnie posiedzenie Rady Miasta"
 TRN_ostatnie_posiedzenie_desc:0 "Radni zbierają się w Ratuszu Staromiejskim po raz ostatni w starym składzie. Rada Tymczasowa zapowiada, że odda władzę temu, kto zdobędzie poparcie miasta."
 TRN_kto_przejmie:0 "Kto przejmie Toruń?"
 TRN_kto_przejmie_desc:0 "Zaczyna się walka o władzę w mieście. Decyzje w zakładce „Kto przejmie Toruń?” pozwalają wspierać wybrane środowisko i przejmować dla niego dzielnice miasta, a lokalne konflikty co kilka tygodni przesuwają poparcie. Po 120 dniach – albo wcześniej (najwcześniej po 75 dniach), gdy któraś frakcja zdobędzie 80 punktów wpływów – władzę przejmie najsilniejsza z nich."
 TRN_rom_start:0 "Toruń dla mieszkańców"
 TRN_rom_start_desc:0 "Michał Romanowski i ruch Toruń dla Mieszkańców przejmują Ratusz. Bez rewolucji i bez czerwonych sztandarów – z programem tanich mieszkań, transportu i usług publicznych dla zwykłych ludzi."
 TRN_rom_sto_dni:0 "Pierwsze sto dni"
 TRN_rom_sto_dni_desc:0 "Nowa ekipa w Ratuszu ma sto dni, żeby pokazać, że „Toruń dla Mieszkańców” to coś więcej niż hasło z plakatu. Lista obietnic jest długa, a kasa miejska – pusta."
 TRN_rom_mieszkania:0 "Mieszkanie to prawo"
 TRN_rom_mieszkania_desc:0 "Pustostany po firmach, które uciekły z miasta, i mieszkania komunalne trafiają do rodzin z najdłuższych kolejek. Deweloperzy protestują – na Facebooku."
 TRN_rom_informacja:0 "Informacja zamiast paniki"
 TRN_rom_informacja_desc:0 "Kanały na komunikatorach, grupy osiedlowe i transmisje na żywo z Ratusza. Romanowski robi to, co umie najlepiej – mówi ludziom, co się dzieje, zanim zrobią to plotki."
 TRN_rom_straz_osiedlowa:0 "Dyżury osiedlowe"
 TRN_rom_straz_osiedlowa_desc:0 "Nocne dyżury przy blokach, sklepach i przystankach. Sąsiedzi pilnują sąsiadów – w kamizelkach odblaskowych i z termosami."
 TRN_rom_kuchnie:0 "Wspólne kuchnie"
 TRN_rom_kuchnie_desc:0 "Stołówki szkolne na Rubinkowie i Skarpie wydają obiady dla każdego. Ludzie zapamiętują, kto przyszedł z pomocą, kiedy reszta kraju milczała."
 TRN_rom_mzk:0 "Darmowe tramwaje"
 TRN_rom_mzk_desc:0 "Tramwaje i autobusy MZK jeżdżą bez biletów. Kanarzy zostają motorniczymi, a zajezdnia na Olimpijskiej pracuje na trzy zmiany."
 TRN_rom_internet:0 "Chłopak z internetu"
 TRN_rom_internet_desc:0 "Przeciwnicy z przekąsem nazywają Romanowskiego „chłopakiem z internetu”. Miało być obraźliwie – a stało się marką, którą rozpoznaje całe miasto."
 TRN_rom_rady_dzielnic:0 "Rady dzielnic"
 TRN_rom_rady_dzielnic_desc:0 "W każdej dzielnicy – od Mokrego po Bielany – działa rada mieszkańców, która decyduje o lokalnym budżecie, opale i remontach. Ratusz słucha, bo musi."
 TRN_rom_rubinkowo:0 "Odnowa Rubinkowa"
 TRN_rom_rubinkowo_desc:0 "Nowe elewacje, przychodnia i szkoła na największym osiedlu miasta. Rubinkowo z sypialni Torunia staje się jego wizytówką."
 TRN_rom_kadry_umk:0 "Kadry z UMK"
 TRN_rom_kadry_umk_desc:0 "Absolwenci i wykładowcy UMK zastępują urzędników, którzy wyjechali do Warszawy i nie wrócili. Średnia wieku w Ratuszu spada o dwadzieścia lat."
 TRN_rom_kadry:0 "Kadry z UMK"
 TRN_rom_kow_opozycja:0 "Kowalczyk jako legalna opozycja"
 TRN_rom_kow_opozycja_desc:0 "Katharina Schmidt-Kowalczyk zostaje liderką opozycji w nowej Radzie Miasta. Romanowski pokazuje, że lewica nie boi się krytyki."
 TRN_rom_kow_szkoly:0 "Kowalczyk odpowiada za szkoły"
 TRN_rom_kow_szkoly_desc:0 "Nauczycielka z Frankfurtu wchodzi do administracji jako bezpartyjna pełnomocniczka do spraw edukacji. Szkoły mają ogrzewanie, a nauczyciele – pensje."
 TRN_rom_szkoly:0 "Kowalczyk odpowiada za szkoły"
 TRN_rom_kow_wyjazd:0 "Kowalczyk wraca do Niemiec"
 TRN_rom_kow_wyjazd_desc:0 "Nauczycielka z Frankfurtu pakuje walizki. Jedni mówią o rozsądnym wyborze, inni o stracie dla miasta. W Ratuszu robi się luźniej."
 TRN_rom_udzialy:0 "Udziały pracownicze"
 TRN_rom_udzialy_desc:0 "Miasto kupuje udziały w zakładach, których właściciele uciekli przed kryzysem, i oddaje część z nich załogom. Zysk ma zostać w Toruniu."
 TRN_rom_plan_2035:0 "Plan „Toruń 2035”"
 TRN_rom_plan_2035_desc:0 "Pierwszy od lat plan rozwoju miasta: hale, mieszkania, tramwaj na Jar i nowy most dla rowerów. Część planu nawet zostanie zrealizowana."
 TRN_rom_plan:0 "Plan „Toruń 2035”"
 TRN_rom_wybory:0 "Pierwsze wolne wybory"
 TRN_rom_wybory_desc:0 "Romanowski dotrzymuje słowa: Toruń wybiera nową Radę Miasta. Lokale wyborcze w szkołach, hali przy Bema i zajezdni tramwajowej."
 TRN_rom_skarpa:0 "Tramwaj na Skarpę"
 TRN_rom_skarpa_desc:0 "Nowa linia tramwajowa, dom kultury i targowisko. Żadna dzielnica nie zostanie w tyle – nawet ta, o której Ratusz przez lata zapominał."
 TRN_rom_uniwersytet:0 "Uniwersytet dla wszystkich"
 TRN_rom_uniwersytet_desc:0 "UMK otwiera wykłady dla mieszkańców, a laboratoria pracują dla miasta: energia, woda, łączność. Kopernik byłby dumny – albo przynajmniej zaciekawiony."
 TRN_rom_umk:0 "Uniwersytet dla wszystkich"
 TRN_rom_straz_obywatelska:0 "Straż Obywatelska Torunia"
 TRN_rom_straz_obywatelska_desc:0 "Dyżury osiedlowe zostają połączone w Straż Obywatelską – z przeszkoleniem, mundurami i przysięgą na statut miasta, a nie na partię."
 TRN_rom_miasto:0 "Miasto dla mieszkańców"
 TRN_rom_miasto_desc:0 "Mieszkania, tramwaje, szkoły i rady dzielnic działają razem. Toruń Romanowskiego nie jest rajem, ale w środku rozpadu kraju to jedno z niewielu miejsc, gdzie ludzie wiedzą, na co idą ich podatki."
 TRN_rom_metropolia:0 "Metropolia otwarta"
 TRN_rom_metropolia_desc:0 "Toruń nie musi podbijać sąsiadów, żeby stać się centrum regionu. Wystarczy, że będzie miejscem, do którego ludzie chcą przyjeżdżać – i w którym chcą zostać."
 TRN_gul_start:0 "Paweł Gulewski"
 TRN_gul_start_desc:0 "Ekipa Gulewskiego chce utrzymać obecną administrację i przeprowadzić Toruń przez kryzys bez rewolucji. Paweł Gulewski obejmuje władzę w Toruniu wraz ze swoją partią – Samorządowy Toruń."
 TRN_gul_ciaglosc:0 "Ciągłość administracji"
 TRN_gul_ciaglosc_desc:0 "Urzędy pracują dalej, pensje są wypłacane, decyzje podejmowane na czas. Miasto nie może sobie pozwolić na przerwę."
 TRN_gul_budzet_obywatelski:0 "Budżet obywatelski"
 TRN_gul_budzet_obywatelski_desc:0 "Mieszkańcy sami zdecydują, na co pójdzie część miejskich pieniędzy. Zaufanie jest dziś walutą."
 TRN_gul_stabilny:0 "Stabilny Toruń"
 TRN_gul_stabilny_desc:0 "Bez rewolucji i bez eksperymentów. Toruń ma być spokojną wyspą w morzu chaosu."
 TRN_gul_samorzad:0 "Samorząd dla wszystkich"
 TRN_gul_samorzad_desc:0 "Rada Miasta pozostaje miejscem, gdzie spotykają się wszystkie środowiska. Toruń pokazuje sąsiadom, że da się rządzić spokojnie."
 TRN_samorzad:0 "Samorząd dla wszystkich"
 TRN_zal_start:0 "Michał Zaleski"
 TRN_zal_start_desc:0 "Powrót starego porządku samorządowego. Zaleski i jego ludzie znają każdą ulicę i każdy urząd w tym mieście. Michał Zaleski obejmuje władzę w Toruniu wraz ze swoją partią – Ruch Gospodarzy Torunia."
 TRN_zal_stary_porzadek:0 "Stary porządek w Ratuszu"
 TRN_zal_stary_porzadek_desc:0 "Wracają dawne procedury, dawne komisje i dawne zwyczaje. Sprawdzone rozwiązania są lepsze niż nowinki."
 TRN_zal_urzednicy:0 "Sprawdzeni urzędnicy"
 TRN_zal_urzednicy_desc:0 "Do urzędów wracają doświadczeni urzędnicy. Mniej eksperymentów, więcej załatwionych spraw."
 TRN_zal_ostroznie:0 "Ostrożne inwestycje"
 TRN_zal_ostroznie_desc:0 "Każda złotówka jest liczona dwa razy. Inwestujemy tylko tam, gdzie zwrot jest pewny."
 TRN_zal_konserwatywny:0 "Konserwatywny Gród"
 TRN_zal_konserwatywny_desc:0 "Toruń jako spokojne, zachowawcze i dobrze zarządzane miasto-państwo, przywiązane do tradycji Grodu Kopernika."
 TRN_kow_start:0 "Nauczycielka z Frankfurtu"
 TRN_kow_start_desc:0 "Katharina Schmidt-Kowalczyk pochodzi z Torunia, ale przez lata uczyła matematyki we Frankfurcie, a po pracy fotografowała. Wróciła do rodzinnego miasta z powodów rodzinnych – i zobaczyła, że Toruń, który pamięta, rozpada się na kawałki. Katharina Schmidt-Kowalczyk obejmuje władzę w Toruniu wraz ze swoją partią – Toruński Komitet Obywatelski."
 TRN_kow_pomoc:0 "Pomoc sąsiedzka"
 TRN_kow_pomoc_desc:0 "Zbiórki, spotkania w szkołach i sąsiedzka pomoc. Kowalczyk nie zakłada partii – po prostu organizuje ludzi."
 TRN_kow_szkoly:0 "Szkoły muszą działać"
 TRN_kow_szkoly_desc:0 "Nauczyciele bez pensji, szkoły bez ogrzewania. Była nauczycielka matematyki wie, od czego zacząć."
 TRN_kow_komitet:0 "Toruński Komitet Obywatelski"
 TRN_kow_komitet_desc:0 "Ludzie zaczynają traktować zwykłą nauczycielkę jak osobę zdolną do zarządzania miastem. Toruński Komitet Obywatelski z ruchu sąsiedzkiego staje się prawdziwą partią władzy."
 TRN_kow_frankfurt:0 "Kontakty z Frankfurtem"
 TRN_kow_frankfurt_desc:0 "Znajomość języka i kontakty z niemieckimi samorządami i organizacjami otwierają drogę do pomocy i inwestycji."
 TRN_kow_administracja:0 "Przywrócić administrację"
 TRN_kow_administracja_desc:0 "Urzędy, sądy i ewidencje muszą znowu działać. Bez nudnej administracji nie ma normalnego miasta."
 TRN_kow_samorzad:0 "Normalny samorząd"
 TRN_kow_samorzad_desc:0 "Wybory do rady miasta, przejrzysty budżet, otwarte posiedzenia. Przeciw nacjonalistom, radykałom i anarchistom – za zwykłą demokracją."
 TRN_kow_odbudowa:0 "Ruch Odbudowy Torunia"
 TRN_kow_odbudowa_desc:0 "Komitet przekształca się w Ruch Odbudowy Torunia: szkoły, mosty, tramwaje i miejsca pracy – w tej kolejności."
 TRN_kow_europa:0 "Proeuropejski Toruń"
 TRN_kow_europa_desc:0 "Toruń jako otwarte, proeuropejskie miasto-państwo, które handluje, uczy i współpracuje – zamiast walczyć."
 TRN_ela_gniew:0 "Gniew na trybunach"
 TRN_ela_gniew_desc:0 "Na stadionie i w kibicowskich pubach rośnie gniew. Kibice Elany obwiniają za rozpad wszystkich: polityków, przyjezdnych i „obcych”. Przywódca Elany obejmuje władzę w Toruniu wraz ze swoją partią – Nacjonaliści Elany."
 TRN_ela_nacjonalisci:0 "Nacjonaliści Elany"
 TRN_ela_nacjonalisci_desc:0 "Z kibicowskich grup powstaje ruch polityczny. Nacjonaliści Elany mają własne biuro, własne pieniądze i własnych ludzi."
 TRN_ela_ulice:0 "Ulice należą do nas"
 TRN_ela_ulice_desc:0 "Bojówki kibicowskie patrolują ulice zamiast policji. Kto im się sprzeciwia, szybko się o tym przekonuje."
 TRN_ela_torun_dla_torunian:0 "Toruń dla Torunian"
 TRN_ela_torun_dla_torunian_desc:0 "Nacjonaliści domagają się, by o mieście decydowali wyłącznie rodowici torunianie. Przyjezdni stają się celem ich kampanii."
 TRN_ela_granice:0 "Zamknąć granice miasta"
 TRN_ela_granice_desc:0 "Na mostach i rogatkach stają posterunki. Do Torunia nie wjedzie nikt bez zgody nowej władzy."
 TRN_ela_narodowy:0 "Narodowy Toruń"
 TRN_ela_narodowy_desc:0 "Nacjonaliści przejmują pełną kontrolę nad Ratuszem i kończą z wyborami. Toruń ma być twierdzą narodu w rozpadającym się kraju."
 TRN_ela_rozbic:0 "Rozbić przeciwników"
 TRN_ela_rozbic_desc:0 "Bojówki rozbijają wiece komunistów i liberałów. Opozycja schodzi do podziemia."
 TRN_ela_jedno_miasto:0 "Jedno miasto, jeden naród"
 TRN_ela_jedno_miasto_desc:0 "Nie ma już dzielnic, partii ani klubów – jest tylko narodowy Toruń i jego wrogowie."
 TRN_kre_start:0 "Maksim Andrei Krevienko"
 TRN_kre_start_desc:0 "Nikt nie wie dokładnie, skąd przyszedł. Krevienko nie chce być burmistrzem ani prezydentem – mówi, że Toruń ma rządzić się sam, przez zgromadzenia osiedli, kooperatywy i straże sąsiedzkie. Jego Federacja Wolnych Dzielnic przejmuje Ratusz, żeby go rozwiązać."
 TRN_kre_zgromadzenia:0 "Zgromadzenia osiedlowe"
 TRN_kre_zgromadzenia_desc:0 "Na Rubinkowie, Skarpie, Mokrem i Bydgoskim Przedmieściu mieszkańcy co tydzień sami decydują o swoich sprawach. Ratusz dowiaduje się o decyzjach z ogłoszeń na klatkach schodowych."
 TRN_kre_samoobrona:0 "Samoobrona dzielnic"
 TRN_kre_samoobrona_desc:0 "Zamiast policji – ochotnicze straże sąsiedzkie. Każda dzielnica wybiera własnych dowódców i może ich w każdej chwili odwołać."
 TRN_kre_kooperatywy:0 "Kooperatywy zamiast urzędów"
 TRN_kre_kooperatywy_desc:0 "Piekarnie, warsztaty i zajezdnie przechodzą w ręce tych, którzy w nich pracują. Część zakładów kwitnie, część upada – ale wszystkie należą do załóg."
 TRN_kre_rozwiazanie:0 "Rozwiązanie Ratusza"
 TRN_kre_rozwiazanie_desc:0 "Rada Miasta przestaje istnieć. Władzę przejmuje Zgromadzenie Ogólne Torunia, w którym każdy delegat może zostać odwołany przez swoją dzielnicę. Wyborów w starym stylu już nie będzie."
 TRN_kre_komuna:0 "Wolna Komuna Toruńska"
 TRN_kre_komuna_desc:0 "Toruń staje się wolną komuną – bez panów, bez prezydenta i bez stałych urzędników. Sąsiednie gminy patrzą na eksperyment z ciekawością, a dawne elity ze strachem."
 TRN_reg_pozycja:0 "Zabezpieczenie pozycji Torunia"
 TRN_reg_pozycja_desc:0 "Walka o Ratusz się skończyła, a nowa władza po raz pierwszy patrzy dalej niż na rogatki miasta. Najpierw jednak trzeba wiedzieć, czego bronimy: mostów, węzła kolejowego i skarpy nad Wisłą."
 TRN_reg_sily:0 "Rozbudowa sił zbrojnych"
 TRN_reg_sily_desc:0 "Ochotnicy, rezerwiści i magazyny dawnego garnizonu. Toruń buduje armię, która może więcej niż pilnować mostów."
 TRN_kuj_region:0 "Myśleć jak region"
 TRN_kuj_region_desc:0 "Toruń sam nie przetrwa. Ratusz zaczyna mówić o „Kujawach i Pomorzu” zamiast o „mieście”."
 TRN_reg_przygotowania:0 "Przygotowanie do konfliktów regionalnych"
 TRN_reg_przygotowania_desc:0 "Plany obrony, mapy sąsiednich gmin i listy przepraw. Sztab nie mówi o wojnie – mówi o „scenariuszach”."
 TRN_kuj_sasiedzi:0 "Dominacja nad okolicą"
 TRN_kuj_sasiedzi_desc:0 "Podgórz, Lubicz, Łysomice, Chełmża – małe państwa wokół Torunia muszą wybrać: z nami albo przeciw nam. Odblokowuje decyzje zjednoczenia lokalnego (ultimata i wcielenia)."
 TRN_kuj_wisla:0 "Wisła łączy"
 TRN_kuj_wisla_desc:0 "Barki, promy i mosty – kto kontroluje Wisłę, kontroluje Kujawy."
 TRN_kuj_lokalne:0 "Zjednoczenie lokalne"
 TRN_kuj_lokalne_desc:0 "Etap I zakończony: najbliższe gminy uznają władzę Torunia. Można myśleć o czymś większym."
 TRN_kuj_bydgoszcz:0 "Ekspansja w kierunku Bydgoszczy"
 TRN_kuj_bydgoszcz_desc:0 "Odwieczny rywal po drugiej stronie Wisły. Rozmowy, presja albo wojna – ale nie obojętność."
 TRN_kuj_kongres:0 "Kongres Kujawsko-Pomorski"
 TRN_kuj_kongres_desc:0 "Samorządowcy z całego regionu zjeżdżają do Torunia. Demokratyczna federacja Kujaw i Pomorza wymaga ich zgody."
 TRN_reg_metropolia:0 "Spór o metropolię"
 TRN_reg_metropolia_desc:0 "Sześć gmin między Toruniem a Bydgoszczą: Solec, Zławieś, Ostromecko, Unisław, Nowa Wieś Wielka i Chełmno. Kto zdobędzie ich serca, ten zostanie metropolią. Odblokowuje referenda i rozstrzygnięcie sporu."
 TRN_reg_inwestycje:0 "Inwestycje podmiejskie"
 TRN_reg_inwestycje_desc:0 "Nowe przystanki, oświetlenie i boiska w Solcu, Unisławiu i Nowej Wsi Wielkiej. Na każdej tablicy jest herb Torunia."
 TRN_reg_kampania:0 "Kampania w gminach"
 TRN_reg_kampania_desc:0 "Wiece w Chełmnie, ulotki w Zławsi i koncert w Ostromecku. Bydgoszcz odpowiada tym samym – atmosfera gęstnieje."
 TRN_reg_przewaga:0 "Toruń – serce regionu"
 TRN_reg_przewaga_desc:0 "Gminy coraz częściej dzwonią najpierw do Torunia. Bydgoszcz wciąż ma swoje atuty, ale inicjatywa jest po naszej stronie."
 TRN_kuj_projekt_kopernik:0 "Projekt Kopernik"
 TRN_kuj_projekt_kopernik_desc:0 "UMK, Centrum Astronomii w Piwnicach i miejskie spółki technologiczne łączą siły w jednym programie. Niektórzy profesorowie mówią, że nauka mogłaby rządzić lepiej niż politycy."
 TRN_kuj_regionalna_armia:0 "Armia regionu"
 TRN_kuj_regionalna_armia_desc:0 "Brygady z Torunia i podporządkowanych gmin tworzą jedną armię."
 TRN_kuj_gotowi:0 "Dalsze zjednoczenie regionu"
 TRN_kuj_gotowi_desc:0 "Etap II: Toruń może utworzyć nowe państwo – zależnie od tego, kto rządzi w Ratuszu. Decyzje formowania czekają w zakładce Decyzje."
