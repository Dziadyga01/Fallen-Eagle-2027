l_polish:
 ATAK_tt_cel:0 "Celem zostanie §Ylosowy sąsiad§!, który nie jest od nas silniejszy, nie jest naszym sojusznikiem ani podmiotem. Otrzymamy §Ycel wojenny§! (aneksja)."
 ATAK_req_cel:0 "Mamy sąsiada, który nie jest od nas silniejszy, nie jest sojusznikiem ani podmiotem"
 ATAK_req_pokoj:0 "Nie prowadzimy teraz żadnej wojny"
 ATAK_plan:0 "Plan kampanii"
 ATAK_plan_desc:0 "Sztab kładzie na stole mapę sąsiadów. Każde państwo w okolicy jest albo sojusznikiem, albo celem – a sojuszników jest niewielu."
 ATAK_cel1:0 "Pierwsza kampania"
 ATAK_cel1_desc:0 "Wybieramy najsłabszego sąsiada i przygotowujemy uderzenie. Krótka, zwycięska wojna wzmocni państwo i jego armię."
 ATAK_cel2:0 "Druga kampania"
 ATAK_cel2_desc:0 "Pierwsza wojna pokazała, że armia jest gotowa. Czas na kolejny cel."
 ATAK_integracja:0 "Integracja zdobyczy"
 ATAK_integracja_desc:0 "Zdobyte ziemie dostają urzędników, garnizony i nowe tablice na granicach."
 ATAK_cel3:0 "Wielka kampania"
 ATAK_cel3_desc:0 "Region ma mieć jedno centrum – i to my nim będziemy."
 ATAK_dominacja:0 "Dominacja regionalna"
 ATAK_dominacja_desc:0 "Sąsiedzi wiedzą, kto rządzi w okolicy. Ci, którzy jeszcze się opierają, są następni."
