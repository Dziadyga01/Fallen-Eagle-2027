 ZKR_kajdany_atak_dominacja:0 "Dominacja regionalna"
 ZKR_kajdany_atak_dominacja_desc:0 "Sąsiedzi wiedzą, kto rządzi w okolicy. Ci, którzy jeszcze się opierają, są następni."
 ZKR_rosyjskie_prusy_atak_plan:0 "Plan kampanii"
 ZKR_rosyjskie_prusy_atak_plan_desc:0 "Sztab kładzie na stole mapę sąsiadów. Każde państwo w okolicy jest albo sojusznikiem, albo celem – a sojuszników jest niewielu."
 ZKR_rosyjskie_prusy_atak_cel1:0 "Pierwsza kampania"
 ZKR_rosyjskie_prusy_atak_cel1_desc:0 "Wybieramy najsłabszego sąsiada i przygotowujemy uderzenie. Krótka, zwycięska wojna wzmocni państwo i jego armię."
 ZKR_rosyjskie_prusy_atak_cel2:0 "Druga kampania"
 ZKR_rosyjskie_prusy_atak_cel2_desc:0 "Pierwsza wojna pokazała, że armia jest gotowa. Czas na kolejny cel."
 ZKR_rosyjskie_prusy_atak_integracja:0 "Integracja zdobyczy"
 ZKR_rosyjskie_prusy_atak_integracja_desc:0 "Zdobyte ziemie dostają urzędników, garnizony i nowe tablice na granicach."
