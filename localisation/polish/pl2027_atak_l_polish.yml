 ZAG_GER_atak_cel3:0 "Wielka kampania"
 ZAG_GER_atak_cel3_desc:0 "Region ma mieć jedno centrum – i to my nim będziemy."
 ZAG_GER_atak_dominacja:0 "Dominacja regionalna"
 ZAG_GER_atak_dominacja_desc:0 "Sąsiedzi wiedzą, kto rządzi w okolicy. Ci, którzy jeszcze się opierają, są następni."
 ZAG_LIT_atak_plan:0 "Plan kampanii"
 ZAG_LIT_atak_plan_desc:0 "Sztab kładzie na stole mapę sąsiadów. Każde państwo w okolicy jest albo sojusznikiem, albo celem – a sojuszników jest niewielu."
 ZAG_LIT_atak_cel1:0 "Pierwsza kampania"
 ZAG_LIT_atak_cel1_desc:0 "Wybieramy najsłabszego sąsiada i przygotowujemy uderzenie. Krótka, zwycięska wojna wzmocni państwo i jego armię."
 ZAG_LIT_atak_cel2:0 "Druga kampania"
 ZAG_LIT_atak_cel2_desc:0 "Pierwsza wojna pokazała, że armia jest gotowa. Czas na kolejny cel."
