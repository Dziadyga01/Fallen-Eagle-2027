l_polish:
 BLR_dobry_sasiad:0 "Dobry sąsiad z Mińska"
 BLR_presja_graniczna:0 "Presja na granicy z Białorusią"
 BLR_lojalny_sojusznik:0 "Lojalny sojusznik Państwa Związkowego"
 BLR_nielojalnosc:0 "Nielojalność Mińska"
 BLR_lukaszenka:0 "Aleksandr Łukaszenka"
 BLR_rada_bezpieczenstwa:0 "Rada Bezpieczeństwa Białorusi"
 BLR_rada_narodowa:0 "Rada Narodowa Białorusi"
 BLR_tt_niez_p:0 "Samodzielność wobec Moskwy rośnie (§YBLR_niezaleznosc§!)."
 BLR_panstwo_zwiazkowe:0 "Państwo Związkowe"
 BLR_panstwo_zwiazkowe_desc:0 "Wspólna przestrzeń gospodarcza i obronna z Rosją. Tani gaz i kredyty z Moskwy – za cenę coraz mniejszej swobody decyzji."
 BLR_gospodarka_panstwowa:0 "Gospodarka państwowa"
 BLR_gospodarka_panstwowa_desc:0 "Zakłady MAZ, BiełAZ i Biełaruśkalij pracują według planu. Stabilnie – ale bez inwestorów z zewnątrz."
 BLR_wielowektorowosc:0 "Wielowektorowość"
 BLR_wielowektorowosc_desc:0 "Mińsk handluje ze wszystkimi i nikomu nie obiecuje zbyt wiele. Każdy partner płaci za to, że Białoruś nie wybiera przeciwnika."
 BLR_integracja:0 "Głęboka integracja z Rosją"
 BLR_integracja_desc:0 "Wspólne dowództwo, wspólny budżet obronny i rosyjskie bazy. Mińsk decyduje coraz mniej – ale Moskwa płaci rachunki."
 BLR_otwarcie:0 "Ostrożne otwarcie"
 BLR_otwarcie_desc:0 "Granica z Litwą i polskimi państwami znów przepuszcza tiry. Pierwsi inwestorzy pytają o strefy ekonomiczne."
 BLR_izolacja:0 "Izolacja międzynarodowa"
 BLR_izolacja_desc:0 "Sąsiedzi zamknęli przejścia graniczne i zamrozili kontrakty. Każda dostawa idzie przez Rosję – i drożeje."
 BLR_rada_przejsciowa:0 "Rząd przejściowy"
 BLR_rada_przejsciowa_desc:0 "Okrągły stół w Mińsku zakończył się porozumieniem: rząd przejściowy, wybory za dwa lata i amnestia. Kraj oddycha – i nie wie jeszcze, dokąd idzie."
 BLR_wskazniki:0 "Białoruś na rozdrożu"
 BLR_wskazniki_desc:0 "Samodzielność wobec Moskwy: §Y[?BLR_niezaleznosc|0]§!/100 · stabilność państwa: §Y[?BLR_stabilnosc|0]§!/100.\nWysoka samodzielność daje więcej władzy politycznej, ale osłabia stabilność, dopóki gospodarka nie znajdzie innych partnerów niż Rosja."
 BLR_tt_stp5:0 "Stabilność państwa: §G+5§!"
 BLR_tt_nzm10:0 "Samodzielność wobec Moskwy: §R-10§!"
 BLR_tt_stp10:0 "Stabilność państwa: §G+10§!"
 BLR_tt_nzp20:0 "Samodzielność wobec Moskwy: §G+20§!"
 BLR_tt_stm10:0 "Stabilność państwa: §R-10§!"
 blr.10.t:0 "Kwestia sukcesji"
 blr.10.d:0 "Pytanie, którego nikt w Mińsku nie zadaje głośno, wraca na posiedzenia rządu: co dalej z państwem, gdy przyjdzie zmiana pokoleniowa? Konstytucja przewiduje procedury, ale w tym kraju o sukcesji decydują instytucje, które mają realną siłę.\n\nSamodzielność wobec Moskwy: §Y[?BLR_niezaleznosc|0]§!, stabilność państwa: §Y[?BLR_stabilnosc|0]§!."
 blr.10.a:0 "Ciągłość – kurs się nie zmienia."
 blr.10.b:0 "Władzę przejmuje Rada Bezpieczeństwa."
 blr.10.c:0 "Okrągły stół i rząd przejściowy."
 blr.11.t:0 "Paliwo z Mozyrza"
 blr.11.d:0 "Białoruskie rafinerie oferują paliwo – za twardą walutę, za żywność albo za przysługi. Ciężarówki z cysternami stoją już przed przejściem granicznym.\n\nOferta od: §Y[From.GetName]§!."
 blr.11.a:0 "Kupujemy (50 PP)."
 blr.11.b:0 "Nie bierzemy paliwa od Mińska."
 BLR_tt_nzp5:0 "Samodzielność wobec Moskwy: §G+5§!"
 BLR_tt_stm3:0 "Stabilność państwa: §R-3§!"
 blr.12.t:0 "Ludzie w lesie"
 blr.12.d:0 "Strażnicy po naszej stronie znaleźli w przygranicznym lesie grupę wyczerpanych ludzi. Uzbrojeni przemytnicy wspierani przez służby obiecali im przejście do Europy, zabrali pieniądze i porzucili ich przy granicy. Sąsiedzi patrzą, co zrobi Mińsk."
 blr.12.a:0 "Wpuścić organizacje humanitarne i rozbić siatki przemytnicze."
 blr.12.b:0 "Zaprzeczyć wszystkiemu."
 BLR_tt_nzm15:0 "Samodzielność wobec Moskwy: §R-15§!"
 BLR_tt_nzm5:0 "Samodzielność wobec Moskwy: §R-5§!"
 BLR_tt_nzp10:0 "Samodzielność wobec Moskwy: §G+10§!"
 BLR_tt_stm4:0 "Stabilność państwa: §R-4§!"
 blr.13.t:0 "Moskwa prosi o bazy"
 blr.13.d:0 "Rosyjski minister obrony przywozi projekt umowy: dwie nowe bazy lotnicze i stały kontyngent przy granicy z rozbitą Polską. W zamian – kredyt i umorzenie części długu."
 blr.13.a:0 "Zgoda – Państwo Związkowe jest jedno."
 blr.13.b:0 "Jedna baza, bez stałego kontyngentu."
 blr.13.c:0 "Odmówić – Białoruś ma własną armię."
 blr.14.t:0 "Białoruski korytarz dla polskich towarów"
 blr.14.d:0 "[From.GetName] proponuje korytarz tranzytowy: towary z Chin i Azji jadą przez Białoruś do Polski koleją przez Małaszewicze. Mińsk zarobi na każdym kontenerze."
 blr.14.a:0 "Podpisujemy umowę tranzytową."
 blr.14.b:0 "Nie uzależnimy się od Mińska."
 BLR_tranzyt_odbiorca:0 "Tranzyt przez Białoruś"
 BLR_tranzyt_odbiorca_desc:0 "Kontenery z Azji jadą przez Małaszewicze – drożej niż kiedyś, ale jadą."
 BLR_tree:0 "Białoruś na rozdrożu"
 BLR_tt_stp3:0 "Stabilność państwa: §G+3§!"
 BLR_tt_nzp15:0 "Samodzielność wobec Moskwy: §G+15§!"
 BLR_tt_stm5:0 "Stabilność państwa: §R-5§!"
 BLR_tt_paliwo:0 "Polskie państwa przy granicy dostaną §Yofertę paliwa§! (zdarzenie)."
 BLR_tt_nzm8:0 "Samodzielność wobec Moskwy: §R-8§!"
 BLR_tt_stp8:0 "Stabilność państwa: §G+8§!"
 BLR_tt_stm2:0 "Stabilność państwa: §R-2§!"
 BLR_zaplecze_kraju:0 "Kraj poza mapą"
 BLR_zaplecze_kraju_desc:0 "Mińsk, Homel, Mohylew i Witebsk leżą poza mapą, ale pracują dla państwa: 5 fabryk cywilnych i 4 wojskowe działają poza mapą (jak fabryki rządu na emigracji), a pobór z dalszych obwodów uzupełnia rezerwy (decyzja „Pobór w obwodach wschodnich”)."
 BLR_sily_zbrojne:0 "Siły Zbrojne Białorusi"
 BLR_sily_zbrojne_desc:0 "Armia Białorusi opiera się na zapleczu całego kraju – także tej części, której nie widać na mapie."
 BLR_pobor_wschod:0 "Pobór w obwodach wschodnich"
 BLR_pobor_wschod_desc:0 "Komisje wojskowe w Mińsku, Homlu, Mohylewie i Witebsku powołują kolejny rocznik. Rekruci jadą koleją na zachód."
 BLR_zamowienia_maz:0 "Zamówienia w zakładach MAZ i BiełAZ"
 BLR_zamowienia_maz_desc:0 "Fabryki ciężarówek z Mińska i Żodzina dostarczają pojazdy i ciągniki dla armii."
