 PL2027_BM_POL:0 "§YRzeczpospolita Polska (start 22.10.2027)§!\nStolica: §YWarszawa - Śródmieście§! · regionów: §Y1§!\n\nRząd w Alejach Ujazdowskich ma dwadzieścia dni do Godziny Zero. Regiony grożą referendami i secesją, w ministerstwach wybuchają afery, a Bruksela tworzy eurokomisariaty w Szczecinie i Wrocławiu. Negocjacje, referenda, ustępstwa albo odwlekanie – władzy politycznej nie wystarczy dla wszystkich. Bilans prologu ustala start regionalny: Śródmieście, administracja, rezerwy i relacje. 11 listopada wybierasz, czy grasz dalej Sejmem w Warszawie, czy jednym z eurokomisariatów.\n\n§GW drzewku:§! Żądania regionów z licznikiem eskalacji, 6 afer, secesje eurokomisariatów, wybór Donalda Tuska (fikcja), Godzina Zero.\n\nTrudność: §Rbardzo trudna§!"
 PL2027_BM_TRN:0 "§YRepublika Toruńska§!\nStolica: §YToruń§! · regionów: §Y4§!\n\nMiasto Kopernika bez rządu i bez armii. Rada Miasta musi w kilka miesięcy wyłonić władzę: liberałowie, konserwatyści, socjaldemokraci, kibice Elany albo rady dzielnic Krevienki. Potem – spór z Bydgoszczą o metropolię, gminy wokół i cała Ziemia Chełmińska.\n\n§GW drzewku:§! Kampania wyborcza, sześć dróg politycznych, wojna metropolitalna, formacje regionu.\n\nTrudność: §Yśrednia§!"
 PL2027_BM_BYD:0 "§YPaństwo Bydgoskie§!\nStolica: §YBydgoszcz§! · regionów: §Y3§!\n\nNajwiększe miasto regionu, przemysł i węzeł kolejowy – ale też komitet tymczasowy, junta i rady robotnicze, które każde chcą rządzić inaczej. Bydgoszcz ma ludzi i fabryki, by zdominować Kujawy i Pomorze. Pytanie, czy zdąży przed Toruniem.\n\n§GW drzewku:§! Kilka frakcji, Solec Kujawski, przemysł, droga do metropolii Kujaw i Pomorza.\n\nTrudność: §Yśrednia§!"
 PL2027_BM_SMR:0 "§YStraż Marszałkowska (Sejm)§!\nStolica: §YWarszawa - Sejm§! · regionów: §Y1§!\n\nOstatni bastion parlamentu przy Wiejskiej. Jeden region, mała armia i legitymacja, której nikt poza Sejmem nie uznaje. Trzeba pokonać blok prezydencki i mafię, zanim oni pokonają Ciebie – i ogłosić IV Rzeczpospolitą.\n\n§GW drzewku:§! Walka trzech bloków o Warszawę, zaplecze w Policji, IV RP w wersji parlamentarnej.\n\nTrudność: §Rbardzo trudna§!"
 PL2027_BM_KPR:0 "§YKancelaria Prezydenta§!\nStolica: §YWarszawa - Belweder§! · regionów: §Y1§!\n\nPałac przy Krakowskim Przedmieściu, ochrona i lojalne Wojsko. Prezydencki blok ma najwięcej dział w Warszawie, ale najmniej przyjaciół. Silna ręka może zjednoczyć stolicę – albo spalić ją doszczętnie.\n\n§GW drzewku:§! Blok prezydencki, zaplecze w Wojsku, IV RP w wersji prezydenckiej.\n\nTrudność: §Rtrudna§!"
 PL2027_BM_MPR:0 "§YMafia Pruszkowska§!\nStolica: §YPruszków§! · regionów: §Y8§!\n\nPieniądze, przemyt i kibice Legii. Mafia nie potrzebuje legitymacji – wystarczą jej ludzie, broń i strach. Jeśli przejmie Warszawę, powstanie „Rzeczpospolita Rodzin”, w której każdy dostanie swoją działkę.\n\n§GW drzewku:§! Blok mafijny, czarny rynek, bojówki kibiców, IV RP w wersji mafijnej.\n\nTrudność: §Rtrudna§!"
 PL2027_BM_ZKR:0 "§YZakon Krzyżacki§!\nStolica: §YMalbork§! · regionów: §Y33§!\n\nW Malborku rekonstruktorzy i biznesmeni ogłosili odrodzenie Zakonu – i znaleźli sponsorów. Z zamku nad Nogatem rusza krucjata po ziemie dawnego Państwa Zakonnego. Najbardziej nieprawdopodobne państwo rozpadu i jedno z najgroźniejszych.\n\n§GW drzewku:§! Od rekonstruktorów do Państwa Zakonnego, wyprawa krzyżowa, układ z Rosją.\n\nTrudność: §Yśrednia§!"
 PL2027_BM_PMN:0 "§YEurokomisariat Pomorza§!\nStolica: §YSzczecin§! · regionów: §Y28§!\n\nSzczecin pod zarządem tymczasowym Unii: sprawne urzędy, fundusze z warunkami i mała armia. Z Donaldem Tuskiem (fikcyjna ścieżka) – projekt Europejskiej Rzeczypospolitej Polskiej; bez niego – spokojny euroregion albo walka o samodzielność. Trójmiasto pozostaje osobne – można mu tylko zaproponować stowarzyszenie.\n\n§GW drzewku:§! Rada Regionów, pomoc z warunkami, spór o zależność od Unii, federacja przez ratyfikację, Oś Odry.\n\nTrudność: §Yśrednia§!"
 PL2027_BM_SLS:0 "§YEurokomisariat Śląska§!\nStolica: §YWrocław§! · regionów: §Y46§!\n\nWrocław, Dolny Śląsk i Opolszczyzna pod zarządem Borysa Budki (fikcyjna ścieżka). Odbudowa gospodarcza: miedź, fabryki, Odra. Współpraca z Pomorzem bez łączenia eurokomisariatów – i wybór: odbudowa bez Warszawy albo most do Sejmu.\n\n§GW drzewku:§! Zagłębie Miedziowe, Oś Odry, statut Śląska, kredyty dla Sejmu, obrona Sudetów.\n\nTrudność: §Yśrednia§!"
 PL2027_BM_ROS:0 "§YFederacja Rosyjska§!\nStolica: §YKrólewiec§! · regionów: §Y66§!\n\nRosja z obwodu królewieckiego patrzy na Mazury. Armia jest wyczerpana wojną w Ukrainie, elity szukają następcy, a Kreml potrzebuje zwycięstwa. Interwencja na Warmii i Mazurach może dać Moskwie nowe ziemie – albo wywołać kryzys sukcesji.\n\n§GW drzewku:§! Operacja mazurska, los Kremla, kryzys sukcesji i wybory, druga fala ekspansji z Białorusią.\n\nTrudność: §Głatwa§!"
 PL2027_BM_WMZ:0 "§YRepublika Warmińsko-Mazurska§!\nStolica: §YOlsztyn§! · regionów: §Y31§!\n\nOlsztyn stanął na czele Warmii i Mazur – akurat tam, gdzie granica z Rosją jest najbliżej. Federacja ziem, lasów i jezior musi przygotować obronę, zanim kolumny z obwodu przekroczą granicę.\n\n§GW drzewku:§! Federacja Warmii i Mazur, obrona przed Rosją, sojusz mazurski.\n\nTrudność: §Rbardzo trudna§!"
 PL2027_BM_NNA:0 "§YKonfederacja Północna§!\nStolica: §YCiechanów§! · regionów: §Y68§!\n\nNajwiększe państwo północnego Mazowsza – od Ciechanowa po Mławę. Ma ludzi i przestrzeń, ale też Warszawę na południu i Rosję na północy. Może stać się zalążkiem nowej Rzeczypospolitej albo kolejną ofiarą rozpadu.\n\n§GW drzewku:§! Regionalna potęga, droga do zjednoczenia Mazowsza i odrodzenia Rzeczypospolitej.\n\nTrudność: §Głatwa§!"
 PL2027_BM_PRW:0 "§YZjednoczona Polska Prawica§!\nStolica: §YLublin§! · regionów: §Y108§! · rządzi: §YPrawo i Sprawiedliwość§!\n\nRegionalna potęga – ma ludzi i przemysł, by sięgnąć po całą dzielnicę, a potem po odrodzenie Rzeczypospolitej.\n\nTrudność: §Głatwa§!"
