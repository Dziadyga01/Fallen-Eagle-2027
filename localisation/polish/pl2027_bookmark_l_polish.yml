 PL2027_BOOKMARK_PROLOG_NAME:0 "Godzina Zero – 22 października 2027"
 PL2027_BOOKMARK_PROLOG_DESC:0 "Polska jest jeszcze jednym państwem. Rząd ma dwadzieścia dni do Godziny Zero: regiony żądają referendów, w ministerstwach wybuchają afery, a Bruksela tworzy Eurokomisariat Pomorza i Eurokomisariat Śląska. Graj rządem centralnym (zalecane) albo dowolnym województwem. 11 listopada świat staje się tym samym, od którego zaczyna się start listopadowy – ale z bilansem twoich decyzji."
