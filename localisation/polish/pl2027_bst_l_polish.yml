l_polish:
 BST_kononowicz:0 "Krzysztof Kononowicz"
 BST_gen_riazancew:0 "gen. Arkadij Riazancew"
 BST_gen_sobolewski:0 "płk Marek Sobolewski"
 BST_granica_mod:0 "Kryzys na granicy"
 BST_granica_mod_desc:0 "Presja na granicy z Białorusią: §Y[?BST_presja|0]/100§!. Destabilizacja regionu: §R[?BST_destab|0]/100§!.\nUzbrojone grupy przemytników, wspierane przez białoruskie służby, przechodzą przez zieloną granicę od Kuźnicy po Mielnik. Większość starć wygrywa Białystok, ale każda porażka podkopuje zaufanie do władz. Przy destabilizacji §R80§! grozi przewrót."
 BST_odcinek_utracony:0 "Odcinek poza kontrolą"
 BST_odcinek_utracony_desc:0 "Po przegranym starciu ten odcinek granicy przez kilka miesięcy pozostaje poza realną kontrolą władz."
 BST_zapora:0 "Zapora na granicy"
 BST_zapora_desc:0 "Stalowa zapora, kamery i czujki od Kuźnicy po Bug. Presja rośnie wolniej, a starcia częściej kończą się sukcesem."
 BST_spokojna_granica:0 "Spokojna granica"
 BST_spokojna_granica_desc:0 "Siatki przemytnicze rozbite, patrole działają, a mieszkańcy znów jeżdżą do Białowieży na grzyby."
 BST_nizina_1:0 "Rada Regionu"
 BST_nizina_1_desc:0 "Aleksiej Kaczyński rządzi z Pałacu Branickich: spokojnie, metodycznie i z mapą całego Podlasia na ścianie."
 BST_nizina_2:0 "Nizina Podlaska"
 BST_nizina_2_desc:0 "Od Biebrzy po Bug i od Suwałk po Łomżę – jedna kraina, jeden rząd, jedna armia."
 BST_mleko_1:0 "Mleczny Ład"
 BST_mleko_1_desc:0 "Każde gospodarstwo ma krowę, każda szkoła – kartony mleka, a każdy urzędnik wie, że prezes nie lubi bałaganu."
 BST_mleko_2:0 "Mleczne Imperium"
 BST_mleko_2_desc:0 "Od Olsztyna po Siemiatycze płyną cysterny z mlekiem. Imperium zbudowane na nabiale okazało się zaskakująco trwałe."
 BST_enklawa_1:0 "Stan wojenny w enklawie"
 BST_enklawa_1_desc:0 "Godzina policyjna, patrole na każdym skrzyżowaniu i rozkazy wydawane po rosyjsku."
 BST_enklawa_2:0 "Enklawa Podlaska"
 BST_enklawa_2_desc:0 "Generał zbudował twierdzę między Litwą, Polską a Białorusią. Nikt nie wie, komu tak naprawdę służy."
 BST_party_mleko:0 "Ruch Mlecznego Ładu"
 BST_party_enklawa:0 "Komenda Enklawy Podlaskiej"
 BST_szanse:0 "Szanse w starciu: bazowo §Y75%§! (armia powyżej 10 000: §G+10§!, poniżej 3 000: §R-15§!, zapora: §G+10§!, rozbite siatki: §G+5§!, stabilność poniżej 30%: §R-10§!)."
 BST_tt_pm4_d2:0 "Presja na granicy: §G-4§!\nDestabilizacja: §R+2§!"
 bst.10.t:0 "Incydent na granicy: [BST_odcinek.GetName]"
 bst.10.d:0 "Patrol Straży Granicznej natrafił na uzbrojoną grupę przemytników w lesie pod [BST_odcinek.GetName]. Po drugiej stronie płotu widać światła samochodów białoruskich służb, które od tygodni przerzucają ludzi i towar przez zieloną granicę. Wśród przeprowadzanych są też zwykli ludzie, oszukani przez przemytników. Trzeba zdecydować, jak odpowiedzieć."
 bst.10.a:0 "Wysłać wojsko i Straż Graniczną."
 bst.10.b:0 "Sama Straż Graniczna – bez angażowania armii."
 bst.10.c:0 "Kanały dyplomatyczne i pomoc humanitarna na miejscu."
 BST_tt_pm8_dm3:0 "Presja na granicy: §G-8§!\nDestabilizacja: §G-3§!"
 bst.11.t:0 "Granica utrzymana"
 bst.11.d:0 "Grupa przemytników została rozbita, a ludzi, których przeprowadzali, przekazano do punktów pomocy. Na odcinku [BST_odcinek.GetName] znów jest spokojnie – na jakiś czas."
 bst.11.a:0 "Dobra robota."
 BST_tt_p5_d8:0 "Presja na granicy: §R+5§!\nDestabilizacja: §R+8§!"
 bst.12.t:0 "Porażka na odcinku [BST_odcinek.GetName]"
 bst.12.d:0 "Starcie zakończyło się porażką. Przemytnicy przerzucili ludzi i broń w głąb regionu, a patrol musiał się wycofać. Mieszkańcy pytają, czy Białystok w ogóle panuje nad granicą."
 bst.12.a:0 "Musimy wzmocnić granicę."
 BST_tt_p0_dm30:0 "Destabilizacja: §G-30§!"
 bst.40.t:0 "Region na krawędzi"
 bst.40.d:0 "Destabilizacja Ziemi Białostockiej osiągnęła poziom, przy którym władze tracą kontrolę. W koszarach w Białymstoku mówi się otwarcie, że rosyjski generał, który od miesięcy „doradza” lokalnym dowódcom, jest gotów przejąć władzę i „przywrócić porządek”."
 bst.40.a:0 "Ostatnia próba ratowania władzy."
 bst.40.b:0 "Nie mamy już sił – generał przejmuje Białystok."
 bst.41.t:0 "Enklawa Podlaska"
 bst.41.d:0 "W Białymstoku władzę przejął rosyjski generał Arkadij Riazancew. Ziemia Białostocka nazywa się teraz Enklawą Podlaską, a jej armia stoi kilkanaście kilometrów od naszych granic."
 bst.41.a:0 "Wzmocnić granicę."
 bst.70.t:0 "Propozycja z Białegostoku"
 bst.70.d:0 "[From.GetName] proponuje nam przyłączenie: wspólną obronę granicy, wspólny rynek i zachowanie samorządu."
 bst.70.a:0 "Przyjmujemy."
 bst.70.b:0 "Zostajemy niezależni."
 bst.71.t:0 "Ultimatum z Białegostoku"
 bst.71.d:0 "[From.GetName] żąda podporządkowania. Kolumny wojska stoją już przy granicy."
 bst.71.a:0 "Przyjmujemy warunki."
 bst.71.b:0 "Nie ugniemy się."
 bst.72.t:0 "Propozycja przyjęta"
 bst.72.d:0 "Władze państwa [From.GetName] przyjęły nasze warunki."
 bst.72.a:0 "Podlasie rośnie."
 bst.73.t:0 "Odmowa"
 bst.73.d:0 "Władze państwa [From.GetName] odrzuciły naszą propozycję. Pozostaje siła."
 bst.73.a:0 "Zapamiętamy to."
 bst.50.t:0 "Nieznany Warmiańczyk"
 bst.50.d:0 "Na rynku w Białymstoku pojawia się mężczyzna w garniturze, który przedstawia się jako Krzysztof Kononowicz i zapowiada start w wyborach. Program mieści się na jednej kartce: porządek, praca i mleko w każdej szkole. Dziennikarze się śmieją – ale ludzie zaczynają słuchać."
 bst.50.a:0 "Niech kandyduje."
 bst.51.t:0 "Kononowicz wygrywa"
 bst.51.d:0 "Ku zdumieniu komentatorów kandydat znikąd wygrywa wybory. Pierwsze zarządzenie nowego prezydenta: w każdej szkole i każdych koszarach ma stać lodówka z mlekiem."
 bst.51.a:0 "Zaczyna się Mleczny Ład."
 BST_tree:0 "Ziemia Białostocka"
 BST_tt_pm5_d0:0 "Presja na granicy: §G-5§!"
 BST_tt_granica:0 "Incydenty graniczne pojawiają się w zdarzeniach. Bazowo ok. §Y75%§! starć wygrywa Białystok; porażki zwiększają §Rdestabilizację§!."
 BST_tt_pm8_d0:0 "Presja na granicy: §G-8§!"
 BST_tt_p0_dm6:0 "Destabilizacja: §G-6§!"
 BST_tt_pm6_dm2:0 "Presja na granicy: §G-6§!\nDestabilizacja: §G-2§!"
 BST_tt_pm15_dm5:0 "Presja na granicy: §G-15§!\nDestabilizacja: §G-5§!"
 BST_tt_pm20_dm15:0 "Presja na granicy: §G-20§!\nDestabilizacja: §G-15§!"
 BST_req_nizina:0 "Kontrolujemy Suwałki i Łomżę (albo te państwa nie istnieją lub są naszymi podmiotami)"
 BST_req_mleczne:0 "Kontrolujemy Suwałki, Łomżę, Olsztyn i stolicę Mazur (albo te państwa nie istnieją lub są naszymi podmiotami)"
