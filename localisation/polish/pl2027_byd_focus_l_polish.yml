l_polish:
 BYD_miasto_bez_rzadu:0 "Miasto bez rządu"
 BYD_miasto_bez_rzadu_desc:0 "Jedenastego listopada Bydgoszcz obudziła się bez państwa nad sobą. Komitet Tymczasowy zebrał się w Ratuszu przy Jezuickiej, bo nikt inny nie chciał wziąć kluczy."
 BYD_mosty_na_brdzie:0 "Zabezpieczyć mosty na Brdzie"
 BYD_mosty_na_brdzie_desc:0 "Przez Brdę i Wisłę prowadzi kilkanaście mostów – od Bernardyńskiego po Fordoński. Bez nich miasto rozpada się na osobne dzielnice."
 BYD_zaopatrzenie:0 "Przywrócić zaopatrzenie"
 BYD_zaopatrzenie_desc:0 "Hurtownie na Fordońskiej mają towar na tydzień. Trzeba ustalić, kto rozdziela chleb, paliwo i leki – i według jakich zasad."
 BYD_administracja:0 "Odbudować administrację"
 BYD_administracja_desc:0 "Urzędnicy z Urzędu Wojewódzkiego i Ratusza wracają do biurek, jeśli ktoś zagwarantuje im pensje. Z ich teczek można zbudować państwo – i sieć wpływów w okolicznych gminach."
 BYD_kryzys_przemyslu:0 "Kryzys bydgoskiego przemysłu"
 BYD_kryzys_przemyslu_desc:0 "PESA bez zamówień, Nitro-Chem bez kontraktów, a ruiny Zachemu wciąż zatruwają wodę. Tysiące robotników czekają przed bramami na decyzję."
 BYD_straz_obywatelska:0 "Straż Obywatelska"
 BYD_straz_obywatelska_desc:0 "Na Szwederowie i Okolu sąsiedzi sami zaczęli patrolować ulice. Można ich uzbroić, podporządkować albo zostawić w spokoju."
 BYD_granica_torun:0 "Granica z Toruniem"
 BYD_granica_torun_desc:0 "Między Bydgoszczą a Toruniem jest tylko czterdzieści kilometrów lasów, wiosek i stara rywalizacja o to, kto jest stolicą regionu. Teraz ta rywalizacja ma posterunki."
 BYD_spor_solec:0 "Spór o Solec Kujawski"
 BYD_spor_solec_desc:0 "Solec leży dokładnie w połowie drogi do Torunia i obie metropolie uważają go za swoje przedmieście. Mieszkańcy Solca uważają, że są przede wszystkim z Solca."
 BYD_kto_rzadzi:0 "Kto powinien rządzić?"
 BYD_kto_rzadzi_desc:0 "Komitet Tymczasowy nie może trwać wiecznie. W Operze Nova odbywa się debata: republikanie, wojskowi i rady dzielnic przedstawiają swoje wizje miasta."
 BYD_wybory:0 "Wybory przyszłości Bydgoszczy"
 BYD_wybory_desc:0 "Lokale wyborcze w szkołach, punkty kontrolne przy mostach i obserwatorzy z każdej frakcji. Bydgoszcz wybierze swoją drogę – a zwycięzca weźmie wszystko."
 BYD_nowa_rada_miasta:0 "Nowa Rada Miasta"
 BYD_nowa_rada_miasta_desc:0 "Pierwsza sesja nowej Rady Miasta odbywa się w Ratuszu przy Jezuickiej. Radni przysięgają na wspólnotę, której jeszcze nie ma w żadnej konstytucji."
 BYD_wolne_wybory:0 "Wolne wybory"
 BYD_wolne_wybory_desc:0 "Ordynacja wyborcza dla Bydgoszczy, Białych Błot i Nakła: okręgi, komisje i liczenie głosów przy kamerach."
 BYD_konstytucja_brdy:0 "Konstytucja Brdy"
 BYD_konstytucja_brdy_desc:0 "Konstytucję piszą prawnicy z UKW w kamienicach na Wyspie Młyńskiej. Pierwszy artykuł mówi, że władza należy do obywateli – a nie do tych, którzy mają mosty."
 BYD_niezalezne_sady:0 "Niezależne sądy"
 BYD_niezalezne_sady_desc:0 "Sąd Okręgowy przy Wałach Jagiellońskich znów orzeka. Sędziowie nie pytają, której frakcji jest oskarżony."
 BYD_wolne_media:0 "Wolne media"
 BYD_wolne_media_desc:0 "Lokalne gazety, radio i telewizja nadają bez cenzury. Krytykują rząd, ale też przypominają, że Toruń ma gorzej."
 BYD_republika_obywateli:0 "Republika obywateli"
 BYD_republika_obywateli_desc:0 "Bydgoszcz to państwo prawa w regionie, który go zapomniał. To przyciąga ludzi – i ich pieniądze."
 BYD_odbudowac_pese:0 "Odbudować PESĘ"
 BYD_odbudowac_pese_desc:0 "Hale przy Zielonej znów pracują. Pierwszy tramwaj z nowej serii trafi do Bydgoszczy, następne – do każdego, kto zapłaci."
 BYD_kanal_bydgoski:0 "Rozwój Kanału Bydgoskiego"
 BYD_kanal_bydgoski_desc:0 "Najstarsze śluzy kanału łączącego Brdę z Notecią znów przepuszczają barki – od Nakła aż po Wisłę."
 BYD_przemysl_bydgoski:0 "Przemysł Bydgoski"
 BYD_przemysl_bydgoski_desc:0 "Fabryki narzędzi, mebli i elektroniki z Parku Przemysłowo-Technologicznego dostają ulgi i zamówienia od Republiki."
 BYD_przemysl_tb:0 "Przemysł Bydgoski"
 BYD_port_rzeczny:0 "Port rzeczny"
 BYD_port_rzeczny_desc:0 "Port w Brdyujściu przeładowuje zboże, drewno i kontenery. Barki z Bydgoszczy płyną do Gdańska bez pytania nikogo o zgodę."
 BYD_nowe_miejsca_pracy:0 "Nowe miejsca pracy"
 BYD_nowe_miejsca_pracy_desc:0 "Codziennie rano autobusy z Nowej Wsi Wielkiej i Białych Błot przywożą ludzi do bydgoskich fabryk. Pensje w euro przekonują lepiej niż ulotki."
 BYD_serce_regionu:0 "Gospodarcze serce regionu"
 BYD_serce_regionu_desc:0 "Bydgoszcz znów jest miastem, w którym się pracuje, handluje i produkuje. Sąsiedzi kupują jej tramwaje i jej argumenty."
 BYD_ostromecko_wybiera:0 "Ostromecko wybiera"
 BYD_ostromecko_wybiera_desc:0 "Mieszkańcy Ostromecka po drugiej stronie Wisły patrzą przez Most Fordoński na Bydgoszcz, nie na Toruń. Republika zaprasza ich do pałacu na rozmowę."
 BYD_referendum_solec:0 "Referendum w Solcu"
 BYD_referendum_solec_desc:0 "Solec Kujawski sam zdecyduje, z kim chce współpracować. Republika wierzy, że wolny wybór przemawia za Bydgoszczą."
 BYD_rozmowy_zlawies:0 "Rozmowy ze Złąwsią Wielką"
 BYD_rozmowy_zlawies_desc:0 "Gmina na skarpie nad Wisłą handluje z obydwoma miastami. Republika proponuje jej most, szkołę i przychodnię."
 BYD_oferta_unislaw:0 "Oferta dla Unisławia"
 BYD_oferta_unislaw_desc:0 "Unisław dostaje ofertę wspólnej linii autobusowej i dostaw prądu. Toruń oferuje to samo – ale później."
 BYD_dabrowa_chelminska:0 "Dąbrowa Chełmińska"
 BYD_dabrowa_chelminska_desc:0 "Rolnicy z Dąbrowy sprzedają zboże na bydgoskim rynku. Republika gwarantuje im ceny skupu i ochronę przed rekwizycjami."
 BYD_dialog_torun:0 "Dialog z Toruniem"
 BYD_dialog_torun_desc:0 "Pierwsze od lat spotkanie prezydentów Bydgoszczy i Torunia – w Solcu, na neutralnym gruncie. Nikt nie mówi o fuzji, ale wszyscy o niej myślą."
 BYD_gwardia_republiki:0 "Gwardia Republiki"
 BYD_gwardia_republiki_desc:0 "Ochotnicy z dawnej obrony terytorialnej tworzą Gwardię Republiki – wojsko, które przysięga na konstytucję, a nie na dowódcę."
 BYD_obrona_przepraw:0 "Obrona przepraw"
 BYD_obrona_przepraw_desc:0 "Saperzy przygotowują stanowiska przy każdym moście na Brdzie i przy przeprawie w Fordonie."
 BYD_wojska_inzynieryjne:0 "Wojska inżynieryjne"
 BYD_wojska_inzynieryjne_desc:0 "Bydgoszcz ma tradycje saperskie i pontonowe. Gwardia uczy się budować mosty szybciej, niż wróg je wysadza."
 BYD_inz_tb:0 "Wojska inżynieryjne"
 BYD_modernizacja_uzbrojenia:0 "Modernizacja uzbrojenia"
 BYD_modernizacja_uzbrojenia_desc:0 "Magazyny dawnego Inspektoratu Wsparcia otwierają się dla Gwardii – pod warunkiem pełnej ewidencji."
 BYD_sojusze_sasiedzkie:0 "Sojusze sąsiedzkie"
 BYD_sojusze_sasiedzkie_desc:0 "Republika gwarantuje bezpieczeństwo małym sąsiadom. Kto ma Bydgoszcz za plecami, nie musi bać się Torunia."
 BYD_bezpieczna_brda:0 "Bezpieczna Brda"
 BYD_bezpieczna_brda_desc:0 "Gwardia, saperzy i sojusznicy tworzą linię obrony od Koronowa po Fordon."
 BYD_traktat_bydgoski:0 "Traktat Bydgoski"
 BYD_traktat_bydgoski_desc:0 "Gminy wokół Bydgoszczy podpisują traktat o wspólnym rynku, wspólnych drogach i wspólnej obronie. Podpisy składa się w Operze Nova."
 BYD_integracja_regionu:0 "Integracja regionu"
 BYD_integracja_regionu_desc:0 "Urzędnicy z Bydgoszczy przejmują ewidencje gmin, które dobrowolnie przystąpiły do Republiki. Rolnicy z Ziemi Chełmińskiej też zaczynają pytać o warunki."
 BYD_wspolny_sejm:0 "Wspólny Sejm Kujawski"
 BYD_wspolny_sejm_desc:0 "Delegaci z Solca, Koronowa, Osielska i Złąwsi obradują wspólnie. Kujawy i Krajna pierwszy raz mówią jednym głosem."
 BYD_umowa_torun:0 "Umowa z Toruniem"
 BYD_umowa_torun_desc:0 "Dwa miasta, jedna metropolia – przynajmniej na papierze. Umowa reguluje wspólną kolej, wodę i granicę na Wiśle."
 BYD_federacja_albo:0 "Federacja albo samodzielność"
 BYD_federacja_albo_desc:0 "Wspólny Sejm musi zdecydować: czy Bydgoszcz ma szukać federacji z sąsiadami, czy budować własną Republikę od Noteci po Wisłę?"
 BYD_nrkp:0 "Nowa Republika Kujawsko-Pomorska"
 BYD_nrkp_desc:0 "Od Tucholi po Inowrocław i od Nakła po Toruń – Republika obywateli staje się państwem regionu. Stolica jest tam, gdzie zawsze powinna być."
 BYD_komitet_bezpieczenstwa:0 "Komitet Bezpieczeństwa"
 BYD_komitet_bezpieczenstwa_desc:0 "Oficerowie z koszar przy Szubińskiej i Gdańskiej powołują Komitet Bezpieczeństwa. Płk Fordoński obiecuje, że to tylko na czas kryzysu."
 BYD_stan_wyjatkowy:0 "Stan wyjątkowy"
 BYD_stan_wyjatkowy_desc:0 "Godzina policyjna, punkty kontrolne przy mostach i zakaz zgromadzeń powyżej dwudziestu osób."
 BYD_rozwiazanie_rady:0 "Rozwiązanie Rady"
 BYD_rozwiazanie_rady_desc:0 "Radni dostają list z podziękowaniem za służbę. Do Ratusza wchodzi żandarmeria."
 BYD_wojskowy_gubernator:0 "Wojskowy gubernator"
 BYD_wojskowy_gubernator_desc:0 "Każda dzielnica dostaje oficera łącznikowego. Fordon, Szwederowo i Wyżyny mają teraz komendantów, nie burmistrzów."
 BYD_kontrola_administracji:0 "Kontrola administracji"
 BYD_kontrola_administracji_desc:0 "Urzędnicy składają przysięgę lojalności. Ci, którzy odmówili, sprzątają gruzy po Zachemie."
 BYD_porzadek_w_miescie:0 "Porządek w mieście"
 BYD_porzadek_w_miescie_desc:0 "Bydgoszcz jest bezpieczna. Teraz Komitet może patrzeć dalej – za Wisłę i za Brdę."
 BYD_gospodarka_wojenna:0 "Gospodarka wojenna"
 BYD_gospodarka_wojenna_desc:0 "Komitet przejmuje nadzór nad największymi zakładami miasta. Plan produkcji pisze sztab, nie rada nadzorcza."
 BYD_produkcja_amunicji:0 "Produkcja amunicji"
 BYD_produkcja_amunicji_desc:0 "Nitro-Chem i Belma znów produkują to, do czego je zbudowano – trotyl i miny."
 BYD_amunicja_tb:0 "Produkcja amunicji"
 BYD_przemysl_ciezki:0 "Przemysł ciężki"
 BYD_przemysl_ciezki_desc:0 "Hale PESY przestawiają się na podwozia, pancerze i wagony do przewozu wojska."
 BYD_ciezki_tb:0 "Przemysł ciężki"
 BYD_wojskowe_warsztaty:0 "Wojskowe warsztaty"
 BYD_wojskowe_warsztaty_desc:0 "Wojskowe Zakłady Lotnicze przy lotnisku naprawiają wszystko – od śmigłowców po ciężarówki."
 BYD_panstwowe_zamowienia:0 "Państwowe zamówienia"
 BYD_panstwowe_zamowienia_desc:0 "Komitet płaci za zamówienia bonami skarbowymi. Kto odmówi, traci koncesję."
 BYD_mobilizacja_fabryk:0 "Mobilizacja fabryk"
 BYD_mobilizacja_fabryk_desc:0 "Każda hala w Bydgoszczy pracuje dla armii. Konsumenci muszą poczekać."
 BYD_reorganizacja_dowodztwa:0 "Reorganizacja dowództwa"
 BYD_reorganizacja_dowodztwa_desc:0 "Oficerowie dawnego Inspektoratu Wsparcia i centrum szkoleniowego NATO tworzą sztab z prawdziwego zdarzenia."
 BYD_bydgoskie_brygady:0 "Bydgoskie brygady"
 BYD_bydgoskie_brygady_desc:0 "Pierwsze pełne brygady piechoty z artylerią, saperami i żandarmerią."
 BYD_obrona_przeciwlotnicza:0 "Obrona przeciwlotnicza"
 BYD_obrona_przeciwlotnicza_desc:0 "Na dachach w Fordonie i przy lotnisku stają stanowiska przeciwlotnicze. Drony sąsiadów nie przelecą już nad Brdą."
 BYD_opl_tb:0 "Obrona przeciwlotnicza"
 BYD_jednostki_pancerne:0 "Nowe jednostki pancerne"
 BYD_jednostki_pancerne_desc:0 "Opancerzone ciężarówki z warsztatów PESY i transportery z demobilu tworzą pierwszy bydgoski batalion pancerny."
 BYD_sztab_operacyjny:0 "Sztab operacyjny"
 BYD_sztab_operacyjny_desc:0 "W bunkrze pod Myślęcinkiem powstaje sztab, który planuje operacje na całe Kujawy."
 BYD_sztab_tb:0 "Sztab operacyjny"
 BYD_armia_regionalna:0 "Armia Regionalna"
 BYD_armia_regionalna_desc:0 "Armia Bydgoszczy jest gotowa – zdyscyplinowana, wyposażona i głodna działania."
 BYD_kontrola_solca:0 "Kontrola Solca"
 BYD_kontrola_solca_desc:0 "Pierwszy przyczółek: Solec Kujawski i drogi do Torunia. Komitet nie pyta już o referendum."
 BYD_zabezpieczyc_ostromecko:0 "Zabezpieczyć Ostromecko"
 BYD_zabezpieczyc_ostromecko_desc:0 "Drugi przyczółek – za Wisłą, przy Moście Fordońskim. Pałac w Ostromecku zostaje kwaterą batalionu."
 BYD_ultimatum_wisla:0 "Ultimatum nad Wisłą"
 BYD_ultimatum_wisla_desc:0 "Złąwieś Wielka dostaje ultimatum: podporządkowanie Komitetowi albo wojna. Odpowiedź ma przyjść w ciągu tygodnia."
 BYD_blokada_torunia:0 "Blokada Torunia"
 BYD_blokada_torunia_desc:0 "Pierwsza wielka kampania: okrążyć Toruń od zachodu i od Wisły. Rywalizacja dwóch miast kończy się tam, gdzie zaczyna się artyleria."
 BYD_grudziadz_sojusznik:0 "Grudziądz jako sojusznik"
 BYD_grudziadz_sojusznik_desc:0 "Twierdza Grudziądz ma koszary, mosty i własne ambicje. Komitet proponuje pakt o nieagresji i współpracę sztabów."
 BYD_przygotowania_kampanii:0 "Przygotowania do kampanii"
 BYD_przygotowania_kampanii_desc:0 "Ciężarówki, paliwo i mapy całych Kujaw. Sztab pod Myślęcinkiem wie już, co dalej."
 BYD_wojskowa_rada_regionu:0 "Wojskowa Rada Regionu"
 BYD_wojskowa_rada_regionu_desc:0 "Oficerowie z podporządkowanych gmin dostają miejsca w Radzie. Formalnie to sojusz, w praktyce – łańcuch dowodzenia."
 BYD_administracja_okupacyjna:0 "Administracja okupacyjna"
 BYD_administracja_okupacyjna_desc:0 "Komendanci wojskowi przejmują urzędy w Solcu, Dąbrowie i Unisławiu. Lokalni wójtowie mogą zostać – jako zastępcy."
 BYD_budowa_fortyfikacji:0 "Budowa fortyfikacji"
 BYD_budowa_fortyfikacji_desc:0 "Bunkry na skarpie fordońskiej, zapory na Brdzie i stanowiska wzdłuż Kanału Bydgoskiego."
 BYD_ostateczny_plan:0 "Ostateczny plan zjednoczenia"
 BYD_ostateczny_plan_desc:0 "Sztab kładzie na stole ostatnią mapę: Chełmno, Świecie i Inowrocław. Region ma mieć jedno dowództwo."
 BYD_kujawski_okreg:0 "Kujawski Okręg Wojskowy"
 BYD_kujawski_okreg_desc:0 "Państwo Bydgoskie przestaje udawać miasto. Od dziś to Kujawski Okręg Wojskowy – z jednym dowódcą i jedną mapą."
 BYD_nowy_porzadek:0 "Nowy porządek regionalny"
 BYD_nowy_porzadek_desc:0 "Od Noteci po Wisłę obowiązuje jedno prawo – rozkaz Komitetu. Płk Fordoński awansuje sam siebie na generała."
 BYD_powstanie_rad:0 "Powstanie rad dzielnic"
 BYD_powstanie_rad_desc:0 "W świetlicach na Szwederowie, Okolu i Kapuściskach powstają rady dzielnic. Każdy mieszkaniec ma głos – i każdy chce go użyć."
 BYD_samorzad_mieszkancow:0 "Samorząd mieszkańców"
 BYD_samorzad_mieszkancow_desc:0 "Rady przejmują sprawy, które dotąd załatwiał urząd: wywóz śmieci, remonty i przydział mieszkań."
 BYD_odwolanie_urzednikow:0 "Odwołanie urzędników"
 BYD_odwolanie_urzednikow_desc:0 "Urzędnik, który nie służy mieszkańcom, może zostać odwołany na zebraniu w każdy czwartek."
 BYD_wiec_stary_rynek:0 "Wiec na Starym Rynku"
 BYD_wiec_stary_rynek_desc:0 "Tysiące ludzi na Starym Rynku, pod pomnikiem Walki i Męczeństwa. Kuba Szwederowski mówi bez mikrofonu – nie potrzebuje go."
 BYD_federacja_dzielnic:0 "Federacja dzielnic"
 BYD_federacja_dzielnic_desc:0 "Fordon, Śródmieście i Błonie podpisują porozumienie federacyjne. Miasto składa się teraz z równych sobie wspólnot."
 BYD_wolna_bydgoszcz:0 "Wolna Bydgoszcz"
 BYD_wolna_bydgoszcz_desc:0 "Bydgoszcz bez prezydenta, bez wojewody i bez strachu. Federacja dzielnic jest faktem."
 BYD_rady_pracownicze:0 "Rady pracownicze"
 BYD_rady_pracownicze_desc:0 "W PESIE, Nitro-Chemie i zakładach na Fordońskiej robotnicy wybierają własne rady. Dyrektorzy mogą zostać – jako doradcy."
 BYD_rady_prac_tb:0 "Rady pracownicze"
 BYD_spoldzielnie_produkcyjne:0 "Spółdzielnie produkcyjne"
 BYD_spoldzielnie_produkcyjne_desc:0 "Opuszczone hale przy Kanale zamieniają się w spółdzielnie: meble, części, odzież i chleb."
 BYD_kontrola_zakladow:0 "Społeczna kontrola zakładów"
 BYD_kontrola_zakladow_desc:0 "Każda faktura i każdy kontrakt są jawne. Księgi zakładów leżą w świetlicach do wglądu."
 BYD_wspolne_magazyny:0 "Wspólne magazyny"
 BYD_wspolne_magazyny_desc:0 "Magazyny przy porcie w Brdyujściu należą do wszystkich. Każda dzielnica wie, ile ma mąki i paliwa."
 BYD_reforma_mieszkaniowa:0 "Reforma mieszkaniowa"
 BYD_reforma_mieszkaniowa_desc:0 "Puste mieszkania w kamienicach na Gdańskiej i Dworcowej trafiają do rodzin z kontenerów. Spekulanci wyjeżdżają do Torunia."
 BYD_gospodarka_wspolnotowa:0 "Gospodarka wspólnotowa"
 BYD_gospodarka_wspolnotowa_desc:0 "Spółdzielnie, rady i wspólne magazyny działają razem. Bydgoszcz pokazuje, że da się inaczej."
 BYD_zgromadzenia_lokalne:0 "Zgromadzenia lokalne"
 BYD_zgromadzenia_lokalne_desc:0 "Każde osiedle ma swoje zgromadzenie. W blokach na Wyżynach zebrania trwają do północy."
 BYD_zniesienie_przywilejow:0 "Zniesienie przywilejów"
 BYD_zniesienie_przywilejow_desc:0 "Służbowe samochody, specjalne przepustki i miejsca w loży Opery Nova – wszystko to znika."
 BYD_edukacja_obywatelska:0 "Edukacja obywatelska"
 BYD_edukacja_obywatelska_desc:0 "Studenci UKW i Politechniki prowadzą otwarte zajęcia w szkołach i świetlicach."
 BYD_edukacja_tb:0 "Edukacja obywatelska"
 BYD_lokalne_referenda:0 "Lokalne referenda"
 BYD_lokalne_referenda_desc:0 "Każda ważna decyzja trafia pod głosowanie mieszkańców. Sąsiednie gminy obserwują to z zainteresowaniem."
 BYD_wspolnoty_sasiedzkie:0 "Wspólnoty sąsiedzkie"
 BYD_wspolnoty_sasiedzkie_desc:0 "Sąsiedzi wspólnie prowadzą żłobki, ogrody w Myślęcinku i nocne patrole."
 BYD_autonomia_mieszkancow:0 "Autonomia mieszkańców"
 BYD_autonomia_mieszkancow_desc:0 "Każda dzielnica rządzi się sama, a federacja zajmuje się tylko tym, czego nie da się załatwić na miejscu."
 BYD_milicje_dzielnicowe:0 "Milicje dzielnicowe"
 BYD_milicje_dzielnicowe_desc:0 "Każda dzielnica wystawia oddział – z wybieranymi dowódcami i karabinami z magazynów obrony terytorialnej."
 BYD_obrona_mostow:0 "Obrona mostów"
 BYD_obrona_mostow_desc:0 "Mosty na Brdzie bronione są przez tych, którzy mieszkają po obu ich stronach."
 BYD_koordynacja_oddzialow:0 "Koordynacja oddziałów"
 BYD_koordynacja_oddzialow_desc:0 "Milicje uzgadniają sygnały, trasy i zapasy. Nikt nie wydaje rozkazów, ale wszyscy wiedzą, co robić."
 BYD_obrona_samorzadow:0 "Obrona samorządów"
 BYD_obrona_samorzadow_desc:0 "Każda rada dzielnicy ma plan obrony i zapasy na miesiąc oblężenia."
 BYD_uklad_wspolnot:0 "Układ wspólnot"
 BYD_uklad_wspolnot_desc:0 "Wspólnoty z Białych Błot i Nakła podpisują układ o wzajemnej pomocy. Jeśli zaatakują jedną – staną wszystkie."
 BYD_obywatelska_mobilizacja:0 "Obywatelska mobilizacja"
 BYD_obywatelska_mobilizacja_desc:0 "Gdy trzeba bronić miasta, staje całe miasto. Milicje zamieniają się w armię obywateli."
 BYD_wezwanie_do_gmin:0 "Wezwanie do gmin"
 BYD_wezwanie_do_gmin_desc:0 "Rady Bydgoszczy wysyłają list do każdej gminy w regionie: przyłączcie się, nie jako poddani, lecz jako równi."
 BYD_wspolnoty_pod_bydgoszcza:0 "Wspólnoty pod Bydgoszczą"
 BYD_wspolnoty_pod_bydgoszcza_desc:0 "Rolnicy z Nowej Wsi Wielkiej i działkowicze z Solca zakładają pierwsze wspólnoty poza miastem."
 BYD_rozmowy_anarchisci:0 "Rozmowy z anarchistami Torunia"
 BYD_rozmowy_anarchisci_desc:0 "W Toruniu rządzi Maksim Krevienko i jego zgromadzenia osiedlowe. Dwa miasta, które od wieków się kłócą, mogą mieć wreszcie wspólny język."
 BYD_kongres_rad:0 "Regionalny Kongres Rad"
 BYD_kongres_rad_desc:0 "Delegaci z gmin, wspólnot i zakładów zjeżdżają do Opery Nova na pierwszy Regionalny Kongres Rad."
 BYD_federacja_brdy_wisly:0 "Federacja Brdy i Wisły"
 BYD_federacja_brdy_wisly_desc:0 "Sojusz wolnych miast i gmin od Brdy po Wisłę. Jeśli Toruń się zgodzi – będzie to sojusz dwóch metropolii. Jeśli nie – Bydgoszcz pójdzie sama."
 BYD_zwiazek_wolnych_miast:0 "Związek Wolnych Miast"
 BYD_zwiazek_wolnych_miast_desc:0 "Bydgoszcz nie jest już miastem ani państwem w starym sensie. Jest węzłem wolnych miast i wspólnot – Związkiem Wolnych Miast."
