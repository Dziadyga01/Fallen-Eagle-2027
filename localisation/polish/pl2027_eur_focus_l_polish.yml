l_polish:
 EUR_PSN_zarzad:0 "Tymczasowy zarząd"
 EUR_PSN_zarzad_desc:0 "Poznań ma namiestnika z Berlina, komisarza z Brukseli i sejmik, który chce mieć coś do powiedzenia. Na razie wszyscy udają, że to tymczasowe."
 EUR_PSN_sejmik:0 "Namiestnik i sejmik"
 EUR_PSN_sejmik_desc:0 "Namiestnik podpisuje rozporządzenia, sejmik je opiniuje. W praktyce każda decyzja wymaga trzech podpisów i jednego tłumacza."
 EUR_PSN_fundusze:0 "Fundusz odbudowy"
 EUR_PSN_fundusze_desc:0 "Pierwsze transze trafiają na zakłady przemysłowe Wielkopolski. Komisarz pilnuje przetargów, sejmik – żeby pieniądze nie omijały mniejszych miast."
 EUR_PSN_przemysl:0 "Odbudowa przemysłu"
 EUR_PSN_przemysl_desc:0 "Linie produkcyjne, które stały od miesięcy, wracają do pracy: zakłady przemysłowe Wielkopolski."
 EUR_PSN_drogi:0 "Drogi i mosty"
 EUR_PSN_drogi_desc:0 "Nowe przeprawy i remonty dróg. Warta i Noteć znów łączy, zamiast dzielić."
 EUR_PSN_standardy:0 "Europejskie standardy"
 EUR_PSN_standardy_desc:0 "Szpitale, sądy i urzędy według europejskich procedur. Działa – choć wymaga mnóstwa papierów."
 EUR_PSN_energetyka:0 "Sieć energetyczna"
 EUR_PSN_energetyka_desc:0 "Połączenie z niemiecką siecią daje prąd, którego brakuje po drugiej stronie granicy."
 EUR_PSN_integracja:0 "Droga integracji"
 EUR_PSN_integracja_desc:0 "Sejmik głosuje za pozostaniem pod europejskim zarządem na stałe. Stabilność i fundusze – zamiast niepewnej niepodległości."
 EUR_PSN_obywatelstwo:0 "Obywatelstwo europejskie"
 EUR_PSN_obywatelstwo_desc:0 "Mieszkańcy dostają paszporty z gwiazdami. Kolejki w urzędach ciągną się przez kwartał."
 EUR_PSN_policja_ue:0 "Wspólna policja"
 EUR_PSN_policja_ue_desc:0 "Policja Eurostaatu działa według europejskich procedur i z niemieckim sprzętem."
 EUR_PSN_euroregion:0 "Euroregion"
 EUR_PSN_euroregion_desc:0 "Komisja i Berlin uznają region za stały euroregion. Koniec tymczasowości – i koniec marzeń o własnym państwie."
 EUR_PSN_samodzielnosc:0 "Droga samodzielności"
 EUR_PSN_samodzielnosc_desc:0 "Sejmik domaga się przekazania kolejnych kompetencji. W lokalnych gazetach wraca słowo, którego nikt nie używał od lat: suwerenność."
 EUR_PSN_kompetencje:0 "Przejęcie kompetencji"
 EUR_PSN_kompetencje_desc:0 "Podatki, szkoły i policja przechodzą pod władzę sejmiku. Namiestnik podpisuje – z coraz większą niechęcią."
 EUR_PSN_gwardia:0 "Gwardia Krajowa"
 EUR_PSN_gwardia_desc:0 "Pierwsza formacja wojskowa regionu: ochotnicy i dawni żołnierze."
 EUR_PSN_wniosek:0 "Wniosek do Berlina"
 EUR_PSN_wniosek_desc:0 "Sejmik przyjmuje wniosek o pełną samodzielność. Odpowiedź Berlina zdecyduje, czy rozstanie będzie spokojne."
 EUR_PSN_nowe_panstwo:0 "Wolne państwo: Wielkopolska"
 EUR_PSN_nowe_panstwo_desc:0 "Region jest samodzielny. Teraz musi udowodnić, że potrafi utrzymać szpitale, armię i granice bez europejskich funduszy."
 EUR_PSN_powrot:0 "Powrót do Rzeczypospolitej?"
 EUR_PSN_powrot_desc:0 "Część polityków chce połączenia z odradzającą się Rzecząpospolitą. Inni wolą zostać samodzielni. Decyzja zależy od tego, czy jest do czego wracać."
 EUR_PSN_granica:0 "Granica z rozbitą Polską"
 EUR_PSN_granica_desc:0 "Na wschodzie kilka państw zamiast jednego. Każde ma inne cła, inne przepisy i inne pretensje do mostów na rzece."
 EUR_PSN_komisja:0 "Wspólne komisje graniczne"
 EUR_PSN_komisja_desc:0 "Komisje graniczne z sąsiadami: kto pilnuje mostów, kto płaci za przeprawy, kto ściga przemytników."
 EUR_PSN_twarda_granica:0 "Twarda granica"
 EUR_PSN_twarda_granica_desc:0 "Zasieki, kontrole i wizy. Sąsiedzi protestują, a przemytnicy szukają innych dróg."
 EUR_PSN_handel:0 "Handel przez granicę"
 EUR_PSN_handel_desc:0 "Mimo sporów ciężarówki jadą: maszyny na wschód, żywność na zachód."
 EUR_PSN_wojna_graniczna:0 "Spór zbrojny o przeprawy"
 EUR_PSN_wojna_graniczna_desc:0 "Gdy rozmowy zawodzą, ktoś musi przejąć kontrolę nad mostami – po dobroci albo siłą."
