l_polish:
 EUR_spor_graniczny:0 "Spór graniczny z Eurostaatem"
 EUR_dobre_sasiedztwo:0 "Dobre sąsiedztwo z Eurostaatem"
 EUR_separatyzm:0 "Separatyzm w Eurostaacie"
 EUR_administracja:0 "Administracja pod nadzorem UE"
 EUR_administracja_desc:0 "Zależność od instytucji europejskich: §Y[?EUR_zaleznosc|0]§!/100. Fundusze odbudowy przyspieszają budowy i obniżają koszty dóbr konsumpcyjnych, ale każda decyzja wymaga zgody Komisarza, a ludzie nie chcą walczyć za cudzą administrację."
 EUR_tt_zp6:0 "Zależność od instytucji europejskich: §Y+6§!"
 EUR_tt_zm6:0 "Zależność od instytucji europejskich: §Y-6§!"
 eur.1.t:0 "Audyt Komisarza"
 eur.1.d:0 "Z Brukseli przyjeżdża zespół audytorów. Sprawdzają przetargi, rachunki funduszy odbudowy i listy płac w urzędach. Raport może zatrzymać kolejną transzę – albo ją przyspieszyć.\n\nZależność od instytucji europejskich: §Y[?EUR_zaleznosc|0]§!."
 eur.1.a:0 "Pełna współpraca – fundusze muszą płynąć."
 eur.1.b:0 "Utrudniać audyt – to nasze pieniądze."
 eur.2.t:0 "Spór z Eurostaatem"
 eur.2.d:0 "[From.GetName] wprowadza nowe kontrole na granicy: kolejki ciężarówek, opłaty za przejazd i spór o to, kto pilnuje mostów na rzece. Ludzie po obu stronach pracują, handlują i mają rodziny po drugiej stronie."
 eur.2.a:0 "Twarda linia – nie ustąpimy."
 eur.2.b:0 "Wspólna komisja graniczna."
 eur.3.t:0 "Wniosek o pełną samodzielność"
 eur.3.d:0 "[From.GetName] przesyła do Berlina wniosek: koniec tymczasowego zarządu, własna armia i własna polityka zagraniczna. W Bundestagu spór – jedni mówią o odpowiedzialności, drudzy o kosztach."
 eur.3.a:0 "Zgoda – zarząd był tymczasowy."
 eur.3.b:0 "Jeszcze nie teraz."
 EUR_wlasne_panstwo:0 "Własne państwo nad Odrą"
 EUR_wlasne_panstwo_desc:0 "Koniec tymczasowego zarządu. Urzędnicy zdejmują niebieskie flagi z gwiazdami i zastanawiają się, kto teraz zapłaci pensje."
 eur.4.t:0 "Koniec tymczasowego zarządu"
 eur.4.d:0 "Berlin zgodził się na pełną samodzielność. [Root.GetName] jest od dziś niezależnym państwem – i jednym z graczy na ziemiach dawnej Rzeczypospolitej."
 eur.4.a:0 "Nowy rozdział."
 EUR_rozczarowanie:0 "Rozczarowanie Berlinem"
 EUR_rozczarowanie_desc:0 "Berlin odmówił samodzielności. Na ulicach coraz częściej słychać, że „tymczasowy” znaczy „na zawsze”."
 eur.5.t:0 "Berlin odmawia"
 eur.5.d:0 "Berlin odpowiada, że „warunki nie zostały jeszcze spełnione”. Sejmik zbiera się na nadzwyczajnej sesji."
 eur.5.a:0 "Przyjąć odmowę – na razie."
 eur.5.b:0 "Ogłosić samodzielność jednostronnie."
 eur.6.t:0 "Euroregion"
 eur.6.d:0 "Komisja Europejska i Berlin uznają [Root.GetName] za pełnoprawny euroregion: stałe fundusze, wspólna administracja i obywatelstwo europejskie dla mieszkańców. Własnej armii i polityki zagranicznej nie będzie – ale emerytury przychodzą na czas."
 eur.6.a:0 "Stabilność ponad wszystko."
 EUR_fundusze:0 "Fundusze odbudowy"
 EUR_fundusze_desc:0 "Transze z funduszu odbudowy finansują drogi, szpitale i zakłady pracy. Pod warunkiem, że przetargi przejdą audyt."
 EUR_euroregion_idea:0 "Euroregion pod zarządem UE"
 EUR_euroregion_idea_desc:0 "Stałe fundusze, europejskie standardy i administracja, która działa. Cena: brak własnej armii i polityki zagranicznej."
 EUR_straz:0 "Straż graniczna Eurostaatu"
 EUR_straz_desc:0 "Patrole na granicy z rozbitą Polską: przemyt, uchodźcy i spory o mosty."
 EUR_PSN_tree:0 "Wielkopolska pod zarządem UE"
