l_polish:
 PL2027_generic_focus:0 "Drzewko państw Polski 2027"
 PLG_odbudowa:0 "Odbudowa gospodarki"
 PLG_odbudowa_desc:0 "Po rozpadzie Rzeczypospolitej urwały się dostawy, przelewy i zamówienia. Trzeba na nowo uruchomić lokalną gospodarkę."
 PLG_lokalny_przemysl:0 "Lokalny przemysł"
 PLG_lokalny_przemysl_desc:0 "Zakłady, hurtownie i warsztaty w okolicy stolicy dostają ulgi i zamówienia od nowego państwa."
 PLG_zbrojeniowka:0 "Własna zbrojeniówka"
 PLG_zbrojeniowka_desc:0 "Hale magazynowe zamieniają się w warsztaty produkujące amunicję i wyposażenie dla własnego wojska."
 PLG_drogi:0 "Drogi i mosty"
 PLG_drogi_desc:0 "Remont dróg powiatowych i mostów pozwala szybciej przewozić towary i żołnierzy."
 PLG_fabryki:0 "Nowe zakłady pracy"
 PLG_fabryki_desc:0 "Inwestorzy, którzy zostali na miejscu, dostają tanie grunty. W zamian budują nowe zakłady."
 PLG_amunicja:0 "Produkcja amunicji"
 PLG_amunicja_desc:0 "Własna amunicja to podstawa niezależności. Nikt nie sprzeda jej tanio w czasie rozpadu."
 PLG_paliwo:0 "Rezerwy paliwa"
 PLG_paliwo_desc:0 "Stacje paliw i bazy magazynowe przechodzą pod kontrolę państwa. Bez paliwa nie pojedzie żaden transporter."
 PLG_kolej:0 "Koleje regionalne"
 PLG_kolej_desc:0 "Pociągi regionalne znów kursują – teraz według rozkładu ustalanego w naszej stolicy."
 PLG_technologie:0 "Nowoczesne technologie"
 PLG_technologie_desc:0 "Lokalne firmy informatyczne i automatyki pracują teraz dla państwa."
 PLG_technologie:0 "Nowoczesne technologie"
 PLG_produkcja:0 "Linie produkcyjne"
 PLG_produkcja_desc:0 "Zakłady przestawiają się na pracę zmianową. Produkcja dla wojska idzie pełną parą."
 PLG_badania:0 "Ośrodek badawczy"
 PLG_badania_desc:0 "Najlepsi inżynierowie i naukowcy z regionu dostają laboratoria i pensje."
 PLG_elektronika:0 "Elektronika i łączność"
 PLG_elektronika_desc:0 "Sieć komórkowa, radiostacje i serwery muszą działać niezależnie od Warszawy."
 PLG_elektronika:0 "Elektronika i łączność"
 PLG_samowystarczalnosc:0 "Samowystarczalność"
 PLG_samowystarczalnosc_desc:0 "Państwo potrafi samo się wyżywić, ogrzać i uzbroić. Rozpad przestaje być wyrokiem."
 PLG_armia:0 "Własne siły zbrojne"
 PLG_armia_desc:0 "Żołnierze, policjanci i ochotnicy, którzy zostali na miejscu, tworzą zalążek nowej armii."
 PLG_ot:0 "Obrona terytorialna"
 PLG_ot_desc:0 "Batalion obrony terytorialnej zostaje nową armią. Ludzie znają teren, bo tu mieszkają."
 PLG_ot:0 "Obrona terytorialna"
 PLG_rezerwisci:0 "Powołanie rezerwistów"
 PLG_rezerwisci_desc:0 "Kto służył w wojsku, dostaje kartę powołania. Nie wszyscy są zachwyceni."
 PLG_transport:0 "Transport wojskowy"
 PLG_transport_desc:0 "Ciężarówki z firm transportowych i gmin zostają zarekwirowane dla wojska."
 PLG_artyleria:0 "Artyleria"
 PLG_artyleria_desc:0 "Kilka haubic i moździerzy z dawnych jednostek to dziś najcenniejszy sprzęt w regionie."
 PLG_artyleria:0 "Artyleria"
 PLG_szkolenie:0 "Szkolenie żołnierzy"
 PLG_szkolenie_desc:0 "Poligony znów tętnią życiem. Instruktorzy z dawnego wojska szkolą nowych rekrutów."
 PLG_zmotoryzowani:0 "Oddziały zmotoryzowane"
 PLG_zmotoryzowani_desc:0 "Szybkie oddziały na ciężarówkach i terenówkach mogą w kilka godzin dotrzeć do każdej granicy."
 PLG_bron:0 "Broń strzelecka"
 PLG_bron_desc:0 "Magazyny dawnego wojska i policji zostają przejęte. Każdy żołnierz musi mieć karabin."
 PLG_bron:0 "Broń strzelecka"
 PLG_fortyfikacje:0 "Umocnienia granic"
 PLG_fortyfikacje_desc:0 "Na drogach wjazdowych stają zapory i posterunki. Granica, której wczoraj nie było, dziś jest pilnowana."
 PLG_doktryna:0 "Własna doktryna wojenna"
 PLG_doktryna_desc:0 "Sztab spisuje zasady walki dostosowane do małego państwa w rozpadającym się kraju."
 PLG_doktryna:0 "Własna doktryna wojenna"
 PLG_sztab:0 "Sztab generalny"
 PLG_sztab_desc:0 "Nowe państwo ma już nie tylko oddziały, ale i dowództwo zdolne prowadzić wojnę."
 PLG_lotnisko:0 "Lotnisko"
 PLG_lotnisko_desc:0 "Lotnisko aeroklubu i pas startowy dawnej bazy znów przyjmują maszyny."
 PLG_drony:0 "Drony"
 PLG_drony_desc:0 "Tanie drony z hurtowni elektroniki to najskuteczniejsza broń, na jaką stać małe państwo."
 PLG_drony:0 "Drony"
 PLG_plot:0 "Obrona przeciwlotnicza"
 PLG_plot_desc:0 "Działka i wyrzutnie z dawnych jednostek osłaniają stolicę przed atakiem z powietrza."
 PLG_radar:0 "Radar"
 PLG_radar_desc:0 "Stacja radiolokacyjna widzi każdy samolot i dron w promieniu kilkudziesięciu kilometrów."
 PLG_nowe_panstwo:0 "Nowe państwo"
 PLG_nowe_panstwo_desc:0 "11 listopada 2027 roku powstało nowe państwo. Trzeba zdecydować, kto nim rządzi i na jakich zasadach."
 PLG_rada:0 "Tymczasowa rada"
 PLG_rada_desc:0 "Radni, sołtysi i lokalni przedsiębiorcy zasiadają przy jednym stole. Ktoś musi podpisywać decyzje."
 PLG_porzadek:0 "Porządek publiczny"
 PLG_porzadek_desc:0 "Policja i straż gminna wracają na ulice. Mieszkańcy muszą wiedzieć, że państwo działa."
 PLG_kierunek:0 "Kierunek państwa"
 PLG_kierunek_desc:0 "Pierwsze tygodnie minęły. Czas zdecydować, jakim państwem chcemy być."
 PLG_demokracja:0 "Wolne wybory"
 PLG_demokracja_desc:0 "Pierwsze wybory w nowym państwie. Partie demokratyczne walczą o głosy mieszkańców."
 PLG_socjalliberalowie:0 "Zwycięstwo socjalliberałów"
 PLG_socjalliberalowie_desc:0 "Wybory wygrywają socjalliberałowie: wolność osobista, sprawne usługi publiczne i otwartość na sąsiadów."
 PLG_socjaldemokraci:0 "Zwycięstwo socjaldemokratów"
 PLG_socjaldemokraci_desc:0 "Wybory wygrywa lewica socjaldemokratyczna: miejsca pracy, mieszkania i państwo opiekuńcze."
 PLG_liberalowie:0 "Zwycięstwo liberałów rynkowych"
 PLG_liberalowie_desc:0 "Wybory wygrywają liberałowie rynkowi: niskie podatki, wolny handel i mało państwa."
 PLG_konserwatysci:0 "Zwycięstwo konserwatystów"
 PLG_konserwatysci_desc:0 "Wybory wygrywają konserwatyści: tradycja, rodzina i ostrożne rządy."
 PLG_wolne_media:0 "Wolne media"
 PLG_wolne_media_desc:0 "Lokalne portale, radio i telewizja kablowa mogą krytykować władzę. To cena demokracji – i jej siła."
 PLG_samorzad:0 "Silny samorząd"
 PLG_samorzad_desc:0 "Gminy i dzielnice dostają realny wpływ na budżet. Mieszkańcy czują, że państwo jest ich."
 PLG_panstwo_prawa:0 "Państwo prawa"
 PLG_panstwo_prawa_desc:0 "Sądy, prokuratura i urzędy działają według jasnych zasad. Inwestorzy i sąsiedzi zaczynają nam ufać."
 PLG_panstwo_prawa:0 "Państwo prawa"
 PLG_silna_reka:0 "Rządy silnej ręki"
 PLG_silna_reka_desc:0 "W czasach chaosu ludzie chcą porządku bardziej niż wyborów. Władzę przejmuje wąska grupa."
 PLG_rada_ocalenia:0 "Rada Ocalenia"
 PLG_rada_ocalenia_desc:0 "Rada Ocalenia zawiesza wybory „do czasu stabilizacji”. Formalnie państwo pozostaje demokracją."
 PLG_dyktatura:0 "Dyktatura narodowa"
 PLG_dyktatura_desc:0 "Władzę przejmuje jeden człowiek i jego ludzie – wojskowi, biznesmeni albo duchowni. Liczy się porządek."
 PLG_rada_bezpieczenstwa:0 "Rada Bezpieczeństwa"
 PLG_rada_bezpieczenstwa_desc:0 "Policja, wojsko i służby podlegają jednemu ciału. Opozycja ma coraz mniej do powiedzenia."
 PLG_porzadek_ponad:0 "Porządek ponad wszystko"
 PLG_porzadek_ponad_desc:0 "Ulice są spokojne, pociągi jeżdżą punktualnie, a gazety piszą to, co trzeba."
 PLG_rewolucja:0 "Rewolucja socjalna"
 PLG_rewolucja_desc:0 "Bezrobocie i bieda pchają ludzi na lewo. Komitety robotnicze przejmują zakłady i urzędy."
 PLG_komunizm:0 "Partia komunistyczna"
 PLG_komunizm_desc:0 "Władzę przejmuje partia komunistyczna. Gospodarka ma służyć ludziom pracy, a nie właścicielom."
 PLG_komuny:0 "Federacja komun"
 PLG_komuny_desc:0 "Zamiast partii – rady, spółdzielnie i zgromadzenia mieszkańców. Państwo ma być jak najmniejsze."
 PLG_rady_robotnicze:0 "Rady robotnicze"
 PLG_rady_robotnicze_desc:0 "Zakładami zarządzają rady wybierane przez załogi. Produkcja ma odpowiadać na potrzeby mieszkańców."
 PLG_gwardia_ludowa:0 "Gwardia ludowa"
 PLG_gwardia_ludowa_desc:0 "Uzbrojeni robotnicy bronią rewolucji przed wrogami z zewnątrz i wewnątrz."
 PLG_narod:0 "Odrodzenie narodowe"
 PLG_narod_desc:0 "Radykałowie obwiniają za rozpad elity i obcych. Ich hasła trafiają do coraz większej liczby ludzi."
 PLG_front_narodowy:0 "Front narodowy"
 PLG_front_narodowy_desc:0 "Skrajna prawica przejmuje władzę. Opozycja zostaje rozwiązana, a wybory odwołane."
 PLG_straze:0 "Straże narodowe"
 PLG_straze_desc:0 "Ochotnicze straże patrolują ulice i granice. Posłuszeństwo jest obowiązkiem."
 PLG_mobilizacja:0 "Mobilizacja narodu"
 PLG_mobilizacja_desc:0 "Cały naród ma być gotowy do walki o przyszłość regionu."
 PLG_sasiedzi:0 "Rozmowy z sąsiadami"
 PLG_sasiedzi_desc:0 "Nowe granice dzielą wsie, rodziny i firmy. Trzeba rozmawiać z sąsiadami, zanim zaczną mówić karabiny."
 PLG_handel:0 "Handel przygraniczny"
 PLG_handel_desc:0 "Targowiska przy nowych granicach kwitną. Cło to pierwszy dochód nowego państwa."
 PLG_handel:0 "Handel przygraniczny"
 PLG_wywiad:0 "Wywiad lokalny"
 PLG_wywiad_desc:0 "Taksówkarze, kierowcy ciężarówek i księża wiedzą, co dzieje się po drugiej stronie granicy."
 PLG_dawne_granice:0 "Dawne granice"
 PLG_dawne_granice_desc:0 "Mieszkańcy pamiętają, gdzie kończył się dawny powiat. Politycy coraz częściej o tym przypominają."
 PLG_przyszlosc_regionu:0 "Przyszłość regionu"
 PLG_przyszlosc_regionu_desc:0 "Rozpad nie musi trwać wiecznie. Kto zbuduje najsilniejsze państwo, ten zdecyduje o kształcie regionu."
 PLG_mo_start:0 "Mała ojczyzna"
 PLG_mo_start_desc:0 "Gmina, powiat, miasteczko – tu ludzie znają się po imieniu. Państwo upadło, ale wspólnota została. Teraz trzeba zdecydować, jak ją ocalić."
 PLG_mo_kronika:0 "Kronika gminy"
 PLG_mo_kronika_desc:0 "Nauczycielka historii zaczyna spisywać kronikę gminy w czasach rozpadu. Każdy chce w niej mieć swój wpis – i każdy ma coś do powiedzenia."
 PLG_mo_patron:0 "Pod skrzydła silniejszego"
 PLG_mo_patron_desc:0 "Nie przetrwamy sami. Wójt jedzie do najsilniejszego sąsiada z prośbą o opiekę: zachowamy samorząd, oni dostaną naszych ludzi i nasze drogi."
 PLG_mo_autonomia:0 "Autonomia w unii"
 PLG_mo_autonomia_desc:0 "Mamy opiekuna, ale zachowujemy własną radę, własne święta i własną straż. Zależność nie musi oznaczać zniknięcia."
 PLG_mo_wspolnota:0 "Wspólny rynek z opiekunem"
 PLG_mo_wspolnota_desc:0 "Towary jadą bez ceł, a nasi ludzie pracują w fabrykach opiekuna. Gmina żyje lepiej niż przed rozpadem."
 PLG_mo_liga:0 "Liga Małych Ojczyzn"
 PLG_mo_liga_desc:0 "Gminy i miasteczka mają ten sam problem: są za małe, by się obronić. Razem mogą być za duże, by je połknąć."
 PLG_mo_obrona:0 "Wspólna obrona gmin"
 PLG_mo_obrona_desc:0 "Strażacy, myśliwi i rezerwiści ze wszystkich gmin Ligi ćwiczą razem. Alarm w jednej gminie podnosi wszystkie."
 PLG_mo_unia:0 "Unia gmin"
 PLG_mo_unia_desc:0 "Członkowie Ligi dostają propozycję wspólnego państwa: jedna rada, jedna straż, wiele herbów."
 PLG_mo_twierdza:0 "Sami sobie panami"
 PLG_mo_twierdza_desc:0 "Nikt nam nie pomoże i nikomu się nie poddamy. Każdy dom może być posterunkiem, każdy las – kryjówką."
 PLG_mo_straz:0 "Straż gminna"
 PLG_mo_straz_desc:0 "Ochotnicza straż pożarna, koło łowieckie i rezerwiści tworzą straż gminną. Mało ludzi, ale każdy zna teren."
 PLG_mo_przetrwanie:0 "Gmina-twierdza"
 PLG_mo_przetrwanie_desc:0 "Bunkry pod remizą, zapory na drogach dojazdowych i magazyny w piwnicach. Kto przyjdzie nas zdobyć, zapłaci drogo."
 PLG_mo_dom:0 "Nasz dom"
 PLG_mo_dom_desc:0 "Kronika gminy ma już setki stron. Ostatni wpis jest krótki: „Przetrwaliśmy. I wiemy, kim jesteśmy”."
