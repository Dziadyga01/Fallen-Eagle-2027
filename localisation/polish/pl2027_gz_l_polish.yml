l_polish:
 gz.1.t:0 "Kolejka po paliwo"
 gz.1.d:0 "Na stacji przy wylotówce kolejka ma dwa kilometry. Kierowca karetki prosi o przepuszczenie, ktoś mu odmawia, ktoś inny wyciąga telefon i nagrywa."
 gz.1.a:0 "Priorytet dla służb na każdej stacji."
 gz.1.b:0 "Niech kolejka sama się ułoży."
 gz.2.t:0 "Protest pod urzędem"
 gz.2.d:0 "Kilkaset osób stoi pod urzędem z transparentami „Gdzie są nasze emerytury?”. Urzędnicy wychodzą tylnym wyjściem."
 gz.2.a:0 "Wypłacić zaliczki z lokalnych rezerw."
 gz.2.b:0 "Zamknąć urząd do odwołania."
 gz.3.t:0 "Puste półki"
 gz.3.d:0 "Do marketów od tygodnia nie przyjeżdżają ciężarówki z centrów dystrybucyjnych. Ludzie kupują to, co zostało: konserwy, ocet i świece."
 gz.3.a:0 "Kartki na chleb, mleko i cukier."
 gz.3.b:0 "Rolnicy sprzedają bezpośrednio na rynkach."
 gz.4.t:0 "Bankomaty bez pieniędzy"
 gz.4.d:0 "Bankomaty wyświetlają „Usługa chwilowo niedostępna”. W sklepach wraca zeszyt z długami klientów – pierwszy raz od lat dziewięćdziesiątych."
 gz.4.a:0 "Lokalne bony na zakupy."
 gz.4.b:0 "Handel wymienny – jakoś to będzie."
 gz.5.t:0 "Ostatni komunikat radia publicznego"
 gz.5.d:0 "O 21:00 spiker czyta krótki komunikat: nadajnik przechodzi na zasilanie awaryjne, a redakcja nie wie, kto jutro zapłaci za prąd. Potem – hymn i cisza."
 gz.5.a:0 "Uruchomić własne radio regionu."
 gz.5.b:0 "Ludzie znajdą sobie inne źródła."
 gz.6.t:0 "Policja i wojsko na jednej rogatce"
 gz.6.d:0 "Na tej samej rogatce stoją patrol policji i posterunek wojska. Każdy ma inne rozkazy, a kierowcy nie wiedzą, kogo słuchać."
 gz.6.a:0 "Wspólne dowództwo posterunków."
 gz.6.b:0 "Policja ustępuje wojsku."
 gz.7.t:0 "Szkoły bez ogrzewania"
 gz.7.d:0 "Dyrektorzy szkół przenoszą lekcje do jednej ogrzewanej sali. Dzieci siedzą w kurtkach, a rodzice pytają, czy w ogóle posyłać je do szkoły."
 gz.7.a:0 "Opał najpierw dla szkół i przedszkoli."
 gz.7.b:0 "Ferie zimowe od jutra."
 GZ_opal_szkoly:0 "Opał dla szkół"
 GZ_opal_szkoly_desc:0 "Węgiel trafia najpierw do szkół i przedszkoli."
 gz.8.t:0 "Przemówienie lidera"
 gz.8.d:0 "Wieczorem przywódca [Root.GetName] mówi do mieszkańców przez lokalną telewizję. Za plecami ma mapę regionu – bez granic, które obowiązywały jeszcze rok temu."
 gz.8.a:0 "Mówić o wspólnocie i odbudowie."
 gz.8.b:0 "Mówić o wrogach i obronie granic."
 gz.9.t:0 "Ochotnicy z OSP"
 gz.9.d:0 "Strażacy ochotnicy z kilku wsi zgłaszają się do władz: mają wozy, pompy i ludzi. Chcą tylko paliwa i jasnych rozkazów."
 gz.9.a:0 "Włączyć OSP do obrony cywilnej."
 gz.9.b:0 "OSP zostaje przy gaszeniu pożarów."
 gz.10.t:0 "Leki na kartki"
 gz.10.d:0 "Hurtownie farmaceutyczne wydają leki tylko szpitalom. W aptekach ludzie wymieniają się lekami na nadciśnienie i insulinę."
 gz.10.a:0 "Leki z rezerw państwowych dla aptek."
 gz.10.b:0 "Najpierw szpitale i wojsko."
 gz.11.t:0 "Ćwiczenia po drugiej stronie granicy"
 gz.11.d:0 "Po białoruskiej stronie granicy od tygodnia trwają ćwiczenia. W nocy słychać kolumny ciężarówek, a straż graniczna prosi o posiłki."
 gz.11.a:0 "Ogłosić podwyższoną gotowość."
 gz.11.b:0 "Nie dać się sprowokować."
 GZ_gotowosc:0 "Podwyższona gotowość"
 GZ_gotowosc_desc:0 "Patrole na granicy, rezerwiści w koszarach."
 gz.12.t:0 "Uzbrojeni przemytnicy"
 gz.12.d:0 "Uzbrojona grupa przemytników, wspierana przez białoruskie służby, przerzuca przez granicę ludzi, których potem zostawia w lesie. Straż znajduje w lesie rodziny z dziećmi – ofiary przemytników, nie napastników."
 gz.12.a:0 "Ścigać przemytników i pomóc porzuconym ludziom."
 gz.12.b:0 "Zamknąć granicę i zostawić to wojsku."
 gz.13.t:0 "Przesmyk"
 gz.13.d:0 "Wilno pyta, czy region utrzyma drogi między Litwą a resztą kraju. Litewscy oficerowie proponują wspólne patrole na przesmyku."
 gz.13.a:0 "Zgoda na wspólne patrole."
 gz.13.b:0 "Nie wpuścimy obcych żołnierzy."
 gz.14.t:0 "Strajk maszynistów"
 gz.14.d:0 "Maszyniści z Tczewa i Starogardu odstawiają lokomotywy. Chcą wypłat w euro i ochrony na trasach, gdzie kradzieże paliwa są codziennością."
 gz.14.a:0 "Płacić w euro."
 gz.14.b:0 "Wojsko obsadzi lokomotywy."
 gz.15.t:0 "Sabotaż na węźle"
 gz.15.d:0 "Na węźle kolejowym ktoś przeciął kable sterowania. Trzy pociągi stoją, a dyspozytor pyta, czy to złodzieje miedzi, czy obce służby."
 gz.15.a:0 "Brygada naprawcza i strażnicy na węzłach."
 gz.15.b:0 "Naprawić i nie robić z tego afery."
 gz.16.t:0 "Sprzedaż dostępu do torów"
 gz.16.d:0 "Sąsiednie państwa pytają, ile kosztuje przejazd ich składów przez nasze tory. Kolej może być najlepszym towarem eksportowym regionu."
 gz.16.a:0 "Cennik dla wszystkich – bez wyjątków."
 gz.16.b:0 "Przejazd tylko dla przyjaciół."
 gz.17.t:0 "Warmia kontra Mazury"
 gz.17.d:0 "Radni z Lidzbarka i Reszla chcą, by o budżecie decydowała Warmia, a delegaci z Giżycka i Mrągowa – Mazury. Spór o pieniądze staje się sporem o tożsamość."
 gz.17.a:0 "Podzielić budżet po równo."
 gz.17.b:0 "Budżet według liczby mieszkańców."
 gz.18.t:0 "Bałtycka propozycja"
 gz.18.d:0 "Z Wilna i Rygi przychodzi list: luźna współpraca państw nadbałtyckich – wspólne patrole, handel i łączność. Bez polityki, przynajmniej na razie."
 gz.18.a:0 "Rozmawiać – Bałtyk to nasze okno."
 gz.18.b:0 "Najpierw porządek w domu."
