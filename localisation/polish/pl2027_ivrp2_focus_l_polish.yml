 IVS_e_region:0 "Region stołeczny"
 IVS_e_region_desc:0 "Przedmieścia są nasze. Nowa administracja przejmuje powiaty wokół Warszawy, a ich mieszkańcy dostają dokumenty IV Rzeczypospolitej."
 IVS_e_w_nna:0 "Zaproszenie do Unii: Konfederacja Północna (północ)"
 IVS_e_w_nna_desc:0 "Zanim ruszą kolumny, ruszają emisariusze. Państwo Konfederacja Północna dostaje ofertę: podporządkowanie Warszawie i ochronę – albo samotność wobec nadchodzącej ofensywy."
 IVS_e_o_nna:0 "Interwencja zbrojna: Konfederacja Północna"
 IVS_e_o_nna_desc:0 "Kierunek: północ. Armia IV RP przekracza granicę państwa Konfederacja Północna. To pierwsza kampania, która rozstrzygnie o kształcie odbudowanej Polski."
