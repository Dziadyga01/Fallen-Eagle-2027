l_polish:
 IVS_w0:0 "Pierwsze posiedzenie IV RP"
 IVS_w0_desc:0 "Sala plenarna jest pełna: posłowie, senatorowie i delegaci dzielnic. Marszałek otwiera pierwsze posiedzenie odrodzonego państwa."
 IVS_w1:0 "Ustawa o rozwiązaniu bojówek"
 IVS_w1_desc:0 "Sejm uchwala rozwiązanie wszystkich zbrojnych grup poza armią i policją. Frakcje stolicy dostają wezwanie: złożyć broń i wejść do nowego państwa – albo zostać uznanymi za rebeliantów."
 IVS_w2:0 "Proces Pruszkowa"
 IVS_w2_desc:0 "Przed sądem stają przywódcy Rodziny. Proces jest transmitowany na żywo – państwo pokazuje, że prawo wróciło do Warszawy."
 IVS_w3:0 "Rząd jedności narodowej"
 IVS_w3_desc:0 "Do rządu wchodzą przedstawiciele dzielnic, związków zawodowych i dawnych urzędników. Każdy ma się czuć częścią nowego państwa."
 IVS_w4:0 "Konstytucja IV RP"
 IVS_w4_desc:0 "Nowa konstytucja przywraca trójpodział władzy, wolne media i niezawisłe sądy – i dodaje rozdział o stanie nadzwyczajnym, na wszelki wypadek."
 IVS_w5:0 "Pierwsze wybory parlamentarne"
 IVS_w5_desc:0 "Lokale wyborcze w szkołach od Bielan po Wawer. Frekwencja przekracza oczekiwania – państwo ma demokratyczny mandat."
 IVS_w6:0 "Państwo prawa"
 IVS_w6_desc:0 "Sądy działają, urzędy wydają dokumenty, a policja wystawia mandaty zamiast strzelać. IV RP jest państwem, a nie tylko zwycięską frakcją."
 IVS_odb_dzielnice:0 "Odbudowa zniszczonych dzielnic"
 IVS_odb_dzielnice_desc:0 "Wojna o stolicę zostawiła spalone kamienice, zerwane trakcje i barykady na skrzyżowaniach. Czas to uprzątnąć."
 IVS_odb_przemysl:0 "Przywrócenie przemysłu"
 IVS_odb_przemysl_desc:0 "Zakłady na Woli, Żeraniu i w Ursusie wznawiają produkcję. Brakuje części, ale nie brakuje chętnych do pracy."
 IVS_odb_integracja:0 "Integracja dzielnic"
 IVS_odb_integracja_desc:0 "Wszystkie dzielnice dostają tę samą administrację, te same dokumenty i ten sam budżet. Warszawa jest znów jednym miastem."
 IVS_odb_infra:0 "Infrastruktura stołeczna"
 IVS_odb_infra_desc:0 "Mosty, wiadukty i trasy wylotowe wracają do użytku. Bez nich nie da się ani handlować, ani prowadzić wojny."
 IVS_odb_energia:0 "Elektrownie i ciepłownie"
 IVS_odb_energia_desc:0 "Siekierki i Żerań znów dają prąd i ciepło. Warszawa przestaje marznąć w ciemności."
 IVS_odb_uczelnie:0 "Uczelnie warszawskie"
 IVS_odb_uczelnie_desc:0 "Politechnika i Uniwersytet wznawiają zajęcia. Laboratoria pracują dla przemysłu i armii."
 IVRP2_uczelnie_a_tb:0 "Uczelnie warszawskie"
 IVRP2_uczelnie_b_tb:0 "Uczelnie warszawskie"
 IVS_odb_transport:0 "Kolej i metro"
 IVS_odb_transport_desc:0 "Pociągi znów kursują z Dworca Centralnego, a metro wozi robotników do zakładów. Transport to krwiobieg państwa."
 IVS_odb_gospodarka:0 "Gospodarka stolicy"
 IVS_odb_gospodarka_desc:0 "Banki, giełda i zakłady pracują pełną parą. Warszawa jest znów sercem gospodarki – na razie małego państwa, ale to się zmieni."
 IVS_woj_rekrutacja:0 "Rekrutacja do armii IV RP"
 IVS_woj_rekrutacja_desc:0 "Punkty werbunkowe w każdej dzielnicy. Nowa armia potrzebuje dziesiątek tysięcy ludzi."
 IVS_woj_pobor:0 "Pobór powszechny"
 IVS_woj_pobor_desc:0 "Służba wojskowa staje się obowiązkiem każdego obywatela IV Rzeczypospolitej."
 IVS_woj_przemysl:0 "Przemysł zbrojeniowy"
 IVS_woj_przemysl_desc:0 "Zakłady na Żeraniu i w Ursusie produkują broń, amunicję i pojazdy dla armii."
 IVS_woj_dywizje:0 "Nowe dywizje"
 IVS_woj_dywizje_desc:0 "Z rekrutów i weteranów wojny o stolicę powstają pierwsze pełne dywizje armii IV RP."
 IVS_woj_modernizacja:0 "Modernizacja uzbrojenia"
 IVS_woj_modernizacja_desc:0 "Biura konstrukcyjne pracują nad nową bronią strzelecką i artylerią."
 IVRP2_mod_a_tb:0 "Modernizacja uzbrojenia"
 IVRP2_mod_b_tb:0 "Modernizacja uzbrojenia"
 IVS_woj_zmotoryzowane:0 "Jednostki zmotoryzowane"
 IVS_woj_zmotoryzowane_desc:0 "Ciężarówki i transportery dają armii mobilność potrzebną do kampanii poza stolicą."
 IVS_woj_kadra:0 "Akademia wojskowa"
 IVS_woj_kadra_desc:0 "Akademia Sztuki Wojennej szkoli oficerów dla armii, która będzie walczyć o całą Polskę."
 IVS_woj_armia:0 "Armia IV Rzeczypospolitej"
 IVS_woj_armia_desc:0 "Armia ma kadrę, doktrynę, sprzęt i zaplecze. Jest gotowa na kampanie, które zdecydują o przyszłości kraju."
 IVS_e_plan:0 "Plan odbudowy państwa"
 IVS_e_plan_desc:0 "Warszawa jest nasza, ale państwo to więcej niż stolica. Sztab przygotowuje plan: najpierw przedmieścia, potem Mazowsze, potem cały kraj."
 IVS_e_r1_ozm:0 "Interwencja: Ożarów Mazowiecki"
 IVS_e_r1_ozm_desc:0 "Przedmieścia muszą wrócić pod władzę stolicy. Ożarów Mazowiecki kontroluje drogi wylotowe i węzły kolejowe – bez nich IV RP jest tylko miastem."
 IVS_e_r1_grd:0 "Interwencja: Grodzisk Mazowiecki"
