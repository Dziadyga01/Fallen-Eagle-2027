 IVP_e_o_mla_desc:0 "Kierunek: daleka północ. Armia IV RP przekracza granicę państwa Ziemia Mławska. To pierwsza kampania, która rozstrzygnie o kształcie odbudowanej Polski."
 IVP_e_mazowsze:0 "Mazowsze pod jednym dekretem"
 IVP_e_mazowsze_desc:0 "Od Płocka po Siedlce, od Mławy po Radom – ziemie wokół stolicy znów tworzą jeden organizm. Kolejne regiony patrzą na Warszawę."
 IVP_e_rp:0 "Państwo odzyskane"
 IVP_e_rp_desc:0 "Państwo, które zaczęło się od kilku dzielnic Warszawy, kontroluje dziś setki gmin. Czas ogłosić, że Rzeczpospolita wróciła – i że chce odzyskać resztę."
 IVP_e_wojna:0 "Wojna o jedność państwa"
 IVP_e_wojna_desc:0 "Rozmowy z jednym z sąsiadów utknęły. Armia dostaje rozkaz kampanii przeciwko temu państwu – tylko jednemu naraz. Kolejne decyzje o wojnie zapadają osobno, po zakończeniu poprzedniej."
 IVP_e_unia:0 "Unia pod zwierzchnictwem Pałacu"
 IVP_e_unia_desc:0 "Nie każdy musi zostać podbity. Mniejsze państwa dostają propozycję: autonomia w zamian za uznanie zwierzchnictwa Rzeczypospolitej."
 IVP_e_zjednoczona:0 "Polska zjednoczona pod Pałacem"
 IVP_e_zjednoczona_desc:0 "Polska jest znów jednym państwem. Historia zapamięta, że odrodziła się w Warszawie – w czasie, gdy wszyscy spisali ją na straty."
 IVM_w0:0 "Rodzina rządzi stolicą"
 IVM_w0_desc:0 "Akt proklamacji wisi w ratuszu, a „zarząd” przeniósł się z restauracji na Ursusie do gabinetów przy Placu Bankowym. Interes został zalegalizowany."
 IVM_w1:0 "Koniec konkurencji"
 IVM_w1_desc:0 "Resztki Straży Marszałkowskiej i Kancelarii dostają propozycję nie do odrzucenia: wejść do nowego państwa i dostać udziały – albo zostać wrogiem Rodziny."
 IVM_w2:0 "Wojsko na liście płac"
 IVM_w2_desc:0 "Oficerowie dostają koperty, żołnierze – podwyżki. Armia jest lojalna wobec tego, kto płaci, a płaci Rodzina."
 IVM_w3:0 "Ministerstwa dla przyjaciół"
 IVM_w3_desc:0 "Każde ministerstwo ma swojego „opiekuna”. Przetargi wygrywają zaprzyjaźnione firmy, a budżet rośnie – o dziwo – szybciej niż kiedyś."
 IVM_w4:0 "Ochrona dla wszystkich"
 IVM_w4_desc:0 "Sklepy, stacje i bazary w całym państwie płacą za „ochronę”. W zamian przestępczość na ulicach spada – konkurencja nie ma szans."
 IVM_w5:0 "Legalizacja interesów"
 IVM_w5_desc:0 "Kantory stają się bankami, myjnie – sieciami usługowymi, a hurtownie – spółkami skarbu państwa. Pieniądze Rodziny pracują teraz legalnie."
 IVM_w6:0 "Państwo Rodzin"
 IVM_w6_desc:0 "Rzeczpospolita Rodzin działa jak dobrze naoliwiona maszyna: każdy wie, komu się płaci, i każdy wie, że Rodzina dotrzymuje słowa."
 IVM_odb_dzielnice:0 "Odbudowa zniszczonych dzielnic"
 IVM_odb_dzielnice_desc:0 "Wojna o stolicę zostawiła spalone kamienice, zerwane trakcje i barykady na skrzyżowaniach. Czas to uprzątnąć."
 IVM_odb_przemysl:0 "Przywrócenie przemysłu"
 IVM_odb_przemysl_desc:0 "Zakłady na Woli, Żeraniu i w Ursusie wznawiają produkcję. Brakuje części, ale nie brakuje chętnych do pracy."
 IVM_odb_integracja:0 "Integracja dzielnic"
 IVM_odb_integracja_desc:0 "Wszystkie dzielnice dostają tę samą administrację, te same dokumenty i ten sam budżet. Warszawa jest znów jednym miastem."
 IVM_odb_infra:0 "Infrastruktura stołeczna"
 IVM_odb_infra_desc:0 "Mosty, wiadukty i trasy wylotowe wracają do użytku. Bez nich nie da się ani handlować, ani prowadzić wojny."
 IVM_odb_energia:0 "Elektrownie i ciepłownie"
 IVM_odb_energia_desc:0 "Siekierki i Żerań znów dają prąd i ciepło. Warszawa przestaje marznąć w ciemności."
 IVM_odb_uczelnie:0 "Uczelnie warszawskie"
 IVM_odb_uczelnie_desc:0 "Politechnika i Uniwersytet wznawiają zajęcia. Laboratoria pracują dla przemysłu i armii."
 IVM_odb_transport:0 "Kolej i metro"
 IVM_odb_transport_desc:0 "Pociągi znów kursują z Dworca Centralnego, a metro wozi robotników do zakładów. Transport to krwiobieg państwa."
 IVM_odb_gospodarka:0 "Gospodarka stolicy"
 IVM_odb_gospodarka_desc:0 "Banki, giełda i zakłady pracują pełną parą. Warszawa jest znów sercem gospodarki – na razie małego państwa, ale to się zmieni."
 IVM_woj_rekrutacja:0 "Rekrutacja do armii IV RP"
 IVM_woj_rekrutacja_desc:0 "Punkty werbunkowe w każdej dzielnicy. Nowa armia potrzebuje dziesiątek tysięcy ludzi."
 IVM_woj_pobor:0 "Pobór powszechny"
 IVM_woj_pobor_desc:0 "Służba wojskowa staje się obowiązkiem każdego obywatela IV Rzeczypospolitej."
 IVM_woj_przemysl:0 "Przemysł zbrojeniowy"
 IVM_woj_przemysl_desc:0 "Zakłady na Żeraniu i w Ursusie produkują broń, amunicję i pojazdy dla armii."
 IVM_woj_dywizje:0 "Nowe dywizje"
 IVM_woj_dywizje_desc:0 "Z rekrutów i weteranów wojny o stolicę powstają pierwsze pełne dywizje armii IV RP."
 IVM_woj_modernizacja:0 "Modernizacja uzbrojenia"
 IVM_woj_modernizacja_desc:0 "Biura konstrukcyjne pracują nad nową bronią strzelecką i artylerią."
 IVM_woj_zmotoryzowane:0 "Jednostki zmotoryzowane"
 IVM_woj_zmotoryzowane_desc:0 "Ciężarówki i transportery dają armii mobilność potrzebną do kampanii poza stolicą."
 IVM_woj_kadra:0 "Akademia wojskowa"
 IVM_woj_kadra_desc:0 "Akademia Sztuki Wojennej szkoli oficerów dla armii, która będzie walczyć o całą Polskę."
 IVM_woj_armia:0 "Armia IV Rzeczypospolitej"
 IVM_woj_armia_desc:0 "Armia ma kadrę, doktrynę, sprzęt i zaplecze. Jest gotowa na kampanie, które zdecydują o przyszłości kraju."
 IVM_e_plan:0 "Biznesplan dla Polski"
 IVM_e_plan_desc:0 "Warszawa jest nasza, ale państwo to więcej niż stolica. Sztab przygotowuje plan: najpierw przedmieścia, potem Mazowsze, potem cały kraj."
 IVM_e_r1_ozm:0 "Przejęcie: Ożarów Mazowiecki"
 IVM_e_r1_ozm_desc:0 "Przedmieścia muszą wrócić pod władzę stolicy. Ożarów Mazowiecki kontroluje drogi wylotowe i węzły kolejowe – bez nich IV RP jest tylko miastem."
 IVM_e_r1_grd:0 "Przejęcie: Grodzisk Mazowiecki"
 IVM_e_r1_grd_desc:0 "Przedmieścia muszą wrócić pod władzę stolicy. Grodzisk Mazowiecki kontroluje drogi wylotowe i węzły kolejowe – bez nich IV RP jest tylko miastem."
 IVM_e_r1_psc:0 "Przejęcie: Piaseczno"
 IVM_e_r1_psc_desc:0 "Przedmieścia muszą wrócić pod władzę stolicy. Piaseczno kontroluje drogi wylotowe i węzły kolejowe – bez nich IV RP jest tylko miastem."
