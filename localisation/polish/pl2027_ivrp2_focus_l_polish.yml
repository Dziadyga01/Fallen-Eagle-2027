 IVS_e_mazowsze:0 "Mazowsze zjednoczone"
 IVS_e_mazowsze_desc:0 "Od Płocka po Siedlce, od Mławy po Radom – ziemie wokół stolicy znów tworzą jeden organizm. Kolejne regiony patrzą na Warszawę."
 IVS_e_rp:0 "Rzeczpospolita odbudowana"
 IVS_e_rp_desc:0 "Państwo, które zaczęło się od kilku dzielnic Warszawy, kontroluje dziś setki gmin. Czas ogłosić, że Rzeczpospolita wróciła – i że chce odzyskać resztę."
 IVS_e_wojna:0 "Wojna o zjednoczenie"
 IVS_e_wojna_desc:0 "Rozmowy z jednym z sąsiadów utknęły. Armia dostaje rozkaz kampanii przeciwko temu państwu – tylko jednemu naraz. Kolejne decyzje o wojnie zapadają osobno, po zakończeniu poprzedniej."
 IVS_e_unia:0 "Unia państw polskich"
 IVS_e_unia_desc:0 "Nie każdy musi zostać podbity. Mniejsze państwa dostają propozycję: autonomia w zamian za uznanie zwierzchnictwa Rzeczypospolitej."
 IVS_e_zjednoczona:0 "Zjednoczona Rzeczpospolita"
 IVS_e_zjednoczona_desc:0 "Polska jest znów jednym państwem. Historia zapamięta, że odrodziła się w Warszawie – w czasie, gdy wszyscy spisali ją na straty."
 IVP_w0:0 "Dekret nr 2"
 IVP_w0_desc:0 "Drugi dekret Prezydenta reguluje wszystko, czego nie uregulował pierwszy: od cen chleba po godziny policyjne."
 IVP_w1:0 "Rozbrojenie bojówek"
 IVP_w1_desc:0 "Żandarmeria rusza na stadion przy Łazienkowskiej i do hurtowni w Pruszkowie – ale najpierw przychodzi pismo: kto odda broń dobrowolnie, dostanie amnestię. Kto odmówi, zostanie rozbrojony siłą."
 IVP_w2:0 "Rozliczenie z Pruszkowem"
 IVP_w2_desc:0 "Specjalna komisja Kancelarii przejmuje majątki Rodziny. Myjnie, kantory i hurtownie stają się własnością państwa."
 IVP_w3:0 "Stan wyjątkowy"
 IVP_w3_desc:0 "Prezydent przedłuża stan wyjątkowy „do czasu pełnej stabilizacji”. Ulice są spokojne – głównie dlatego, że po 22:00 nikogo na nich nie ma."
 IVP_w4:0 "Konstytucja prezydencka"
 IVP_w4_desc:0 "Nowa ustawa zasadnicza daje Prezydentowi prawo dekretów, mianowania rządu i rozwiązywania parlamentu. Sejm głosuje „za” – prawie jednogłośnie."
 IVP_w5:0 "Gwardia Prezydencka IV RP"
 IVP_w5_desc:0 "Najlepsze jednostki Wojska składają przysięgę osobiście Prezydentowi. Gwardia staje się rdzeniem nowej armii."
 IVP_w6:0 "Silna władza"
 IVP_w6_desc:0 "Kancelaria jest centrum państwa: dekrety, armia i administracja podlegają jednemu ośrodkowi. Rzeczpospolita ma wreszcie gospodarza."
 IVP_odb_dzielnice:0 "Odbudowa zniszczonych dzielnic"
