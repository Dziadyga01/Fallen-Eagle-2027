 IVM_e_r1_otw_desc:0 "Przedmieścia muszą wrócić pod władzę stolicy. Otwock kontroluje drogi wylotowe i węzły kolejowe – bez nich IV RP jest tylko miastem."
 IVM_e_r1_wlm:0 "Przejęcie: Wołomin"
 IVM_e_r1_wlm_desc:0 "Przedmieścia muszą wrócić pod władzę stolicy. Wołomin kontroluje drogi wylotowe i węzły kolejowe – bez nich IV RP jest tylko miastem."
 IVM_e_region:0 "Strefa stołeczna Rodzin"
 IVM_e_region_desc:0 "Przedmieścia są nasze. Nowa administracja przejmuje powiaty wokół Warszawy, a ich mieszkańcy dostają dokumenty IV Rzeczypospolitej."
