l_polish:
 IVRP2_odbudowa:0 "Odbudowa stolicy"
 IVRP2_odbudowa_desc:0 "Ekipy budowlane pracują na trzy zmiany, a każda odbudowana kamienica jest dowodem, że państwo wraca."
 IVRP2_gospodarka:0 "Gospodarka stolicy"
 IVRP2_gospodarka_desc:0 "Warszawa znów jest centrum gospodarczym: banki, zakłady, hurtownie i węzły kolejowe pracują dla państwa."
 IVRP2_pobor:0 "Pobór do armii IV RP"
 IVRP2_pobor_desc:0 "Każdy rocznik staje przed komisją. Armia IV Rzeczypospolitej ma być największą siłą na ziemiach polskich."
 IVRP2_kadra:0 "Kadra IV RP"
 IVRP2_kadra_desc:0 "Oficerowie z doświadczeniem wojny o stolicę uczą nowe roczniki."
 IVRP2_armia:0 "Armia IV Rzeczypospolitej"
 IVRP2_armia_desc:0 "Nowoczesna, zawodowa armia z doktryną, zapleczem i dowódcami, którzy wygrali wojnę o Warszawę."
 IVRP2_region:0 "Region stołeczny"
 IVRP2_region_desc:0 "Przedmieścia i powiaty wokół Warszawy podlegają stolicy. Drogi, magazyny i ludzie pracują dla IV RP."
 IVRP2_mazowsze:0 "Mazowsze zjednoczone"
 IVRP2_mazowsze_desc:0 "Od Płocka po Siedlce i od Mławy po Radom – Mazowsze jest znów jednym organizmem."
 IVRP2_zjednoczona:0 "Zjednoczona Rzeczpospolita"
 IVRP2_zjednoczona_desc:0 "Państwo odrodziło się z Warszawy. Dawne granice są znów granicami jednego kraju."
 IVRP2_req_ring:0 "Co najmniej §Y4§! z 6 państw wokół Warszawy przestało istnieć albo jest nam podporządkowanych"
 IVRP2_req_maz:0 "Kontrolujemy co najmniej §Y120§! regionów"
 IVRP2_req_rp:0 "Kontrolujemy co najmniej §Y250§! regionów"
 IVRP2_req_zj:0 "Kontrolujemy co najmniej §Y600§! regionów"
 IVRP2_req_wplywy:0 "To państwo istnieje, nie jest niczyim państwem zależnym i nie walczy z nami"
 IVRP2_s_prawo:0 "Państwo prawa"
 IVRP2_s_prawo_desc:0 "Sądy, urzędy i policja działają według prawa, a nie według siły."
 IVRP2_p_wladza:0 "Silna władza prezydencka"
 IVRP2_p_wladza_desc:0 "Jeden ośrodek decyzji, szybkie dekrety i lojalna armia."
 IVRP2_m_rodzina:0 "Państwo Rodzin"
 IVRP2_m_rodzina_desc:0 "Wszyscy płacą, wszyscy wiedzą komu, nikt nie pyta."
 IVRP_sejm_tree:0 "IV Rzeczpospolita – Republika Sejmowa"
 IVRP2_tt_likw_sejm:0 "Nasze warszawskie państwa zależne zostają wcielone, a wobec ostatnich niezależnych organizacji ze stolicy (także poza Warszawą) dostajemy cele wojenne."
 IVRP2_tt_rp:0 "Roszczenia do wszystkich regionów Polski poza naszą kontrolą."
 IVRP2_tt_wojna:0 "Cele wojenne wobec wszystkich sąsiednich państw polskich, które nie są nam podporządkowane."
 IVRP2_tt_unia:0 "Mniejsze sąsiednie państwa polskie (do 14 regionów) dostają ofertę podporządkowania."
 IVRP_prezydent_tree:0 "IV Rzeczpospolita – Republika Prezydencka"
 IVRP2_tt_likw_prezydent:0 "Nasze warszawskie państwa zależne zostają wcielone, a wobec ostatnich niezależnych organizacji ze stolicy (także poza Warszawą) dostajemy cele wojenne."
 IVRP_mafia_tree:0 "Rzeczpospolita Rodzin"
 IVRP2_tt_likw_mafia:0 "Nasze warszawskie państwa zależne zostają wcielone, a wobec ostatnich niezależnych organizacji ze stolicy (także poza Warszawą) dostajemy cele wojenne."
 ivrp2.10.t:0 "Oferta z Warszawy"
 ivrp2.10.d:0 "[From.GetName] proponuje nam podporządkowanie: zachowamy własne władze i armię, ale polityka zagraniczna i obrona będą należeć do Warszawy. Odmowa – jak dają do zrozumienia emisariusze – zostanie potraktowana jako wybór wojny."
 ivrp2.10.a:0 "Przyjmujemy zwierzchnictwo Warszawy."
 ivrp2.10.b:0 "Nigdy. Bronimy niepodległości."
 ivrp2.11.t:0 "Kolejne państwo uznaje Warszawę"
 ivrp2.11.d:0 "[From.GetName] przyjmuje zwierzchnictwo Rzeczypospolitej. Nasza strefa wpływów rośnie bez jednego wystrzału."
 ivrp2.11.a:0 "Witamy."
 ivrp2.12.t:0 "Odmowa"
 ivrp2.12.d:0 "[From.GetName] odrzuca naszą ofertę. Sztab dostaje zgodę na przygotowanie kampanii."
 ivrp2.12.a:0 "Mają wybór, którego dokonali."
 ivrp2.20.t:0 "Zjednoczona Rzeczpospolita"
 ivrp2.20.d:0 "Polska znów jest jednym państwem. Państwo, które zaczęło się od walki o kilka warszawskich dzielnic, rozciąga się dziś od Wisły po dawne granice. W całym kraju biją dzwony – a dyplomaci w Berlinie, Wilnie i Moskwie liczą na nowo."
 ivrp2.20.a:0 "Niech żyje Rzeczpospolita!"
