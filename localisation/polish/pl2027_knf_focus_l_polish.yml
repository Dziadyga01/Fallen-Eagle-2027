l_polish:
 KNF_start:0 "Konfederacja Północna"
 KNF_start_desc:0 "Ciechanów ogłasza, że północne Mazowsze nie czeka na Warszawę. Sławomir Mentzen staje na czele rządu tymczasowego i obiecuje państwo „taniej, prościej i bez pośredników”."
 KNF_sztab:0 "Sztab w Ciechanowie"
 KNF_sztab_desc:0 "W starostwie powstaje sztab: mapy, telefony satelitarne i wolontariusze, którzy wiedzą, jak zorganizować wiec w dwie godziny."
 KNF_rynek:0 "Polska bez pośredników"
 KNF_rynek_desc:0 "Gminy dostają prawo do obniżania podatków, a urzędy – zakaz mnożenia przepisów. Kto chce otworzyć firmę, zakłada ją w jeden dzień."
 KNF_podatki:0 "Niskie podatki"
 KNF_podatki_desc:0 "Najniższy podatek od Bałtyku po Tatry przyciąga firmy z całego rozbitego kraju."
 KNF_drogi:0 "Mazowieckie drogi"
 KNF_drogi_desc:0 "Prywatne firmy remontują drogi z Ciechanowa do Mławy i Płońska w zamian za opłaty za przejazd."
 KNF_fabryki:0 "Fabryki pod Ciechanowem"
 KNF_fabryki_desc:0 "Hale magazynowe przy S7 zamieniają się w zakłady produkcyjne."
 KNF_zbrojownie:0 "Prywatne zbrojownie"
 KNF_zbrojownie_desc:0 "Producenci broni sportowej i amunicji przestawiają linie na potrzeby Straży Narodowej."
 KNF_kapital:0 "Kapitał wraca do Polski"
 KNF_kapital_desc:0 "Firmy, które uciekły przed chaosem, wracają. Ciechanów staje się najszybciej rosnącym miastem Mazowsza."
 KNF_strefa:0 "Strefa wolnej gospodarki"
 KNF_strefa_desc:0 "Całe północne Mazowsze zostaje specjalną strefą ekonomiczną. Nowe zakłady wyrastają szybciej, niż urzędnicy zdążą je policzyć."
 KNF_sn:0 "Straż Narodowa"
 KNF_sn_desc:0 "Ochotnicy z każdej gminy dostają opaski, broń i dowódców. Straż Narodowa ma bronić Konfederacji, zanim powstanie prawdziwa armia."
 KNF_ochotnicy:0 "Ochotnicy z Kurpiów i Mazowsza"
 KNF_ochotnicy_desc:0 "Z Ostrołęki, Przasnysza i Makowa przyjeżdżają autokary pełne ochotników."
 KNF_magazyny:0 "Magazyny broni"
 KNF_magazyny_desc:0 "Sklepy myśliwskie, strzelnice i magazyny rezerw oddają broń Straży."
 KNF_szkola:0 "Szkoła podoficerska w Ciechanowie"
 KNF_szkola_desc:0 "Rezerwiści z doświadczeniem uczą ochotników, jak dowodzić drużyną i plutonem."
 KNF_kolumny:0 "Zmotoryzowane kolumny"
 KNF_kolumny_desc:0 "Pikapy i busy z karabinami maszynowymi – szybka odpowiedź na każde zagrożenie."
 KNF_gwardia:0 "Gwardia Konfederacji"
 KNF_gwardia_desc:0 "Najlepsze bataliony Straży dostają mundury, radiostacje i oficerów. Powstaje Gwardia Konfederacji."
 KNF_artyleria:0 "Artyleria z demobilu"
 KNF_artyleria_desc:0 "Haubice z magazynów demobilu trafiają do Straży. Pierwszy raz Konfederacja może ostrzelać cel, którego nie widzi."
 KNF_program:0 "Program Konfederacji"
 KNF_program_desc:0 "Pięć punktów na ulotce: niskie podatki, silna armia, porządek, wolność słowa i Polska jako jedno państwo. Reszta – „po zwycięstwie”."
 KNF_wybor:0 "Czas wyboru"
 KNF_wybor_desc:0 "Konfederacja jest za słaba, by zjednoczyć Polskę sama – albo jeszcze o tym nie wie. Trzeba zdecydować, z kim (i przeciw komu) iść dalej."
 KNF_a_korona:0 "Rozmowy z Siedlcami"
 KNF_a_korona_desc:0 "Mentzen jedzie do Siedlec. Grzegorz Braun ma ludzi, ziemię i przekonanie, że Polska potrzebuje korony. Konfederacja ma pieniądze i plan."
 KNF_a_front:0 "Wspólny front prawicy"
 KNF_a_front_desc:0 "Wspólny sztab w Węgrowie i wspólna lista celów. Kto będzie rządził – o tym porozmawiamy po wojnie."
 KNF_a_strefy:0 "Podział stref wpływów"
 KNF_a_strefy_desc:0 "Na mapie w Siedlcach kreśli się linie: północ dla Konfederacji, wschód dla Korony. Sąsiedzi nie zostali zaproszeni do rozmowy."
 KNF_a_ekspansja:0 "Ekspansja z Koroną"
 KNF_a_ekspansja_desc:0 "Z Koroną u boku Konfederacja może wreszcie ruszyć na sąsiadów: Mławę i Państwo Narodowe."
 KNF_a_imperium:0 "Imperium z Koroną"
 KNF_a_imperium_desc:0 "Front rośnie z każdym miesiącem. Na wiecach mówi się już nie o „Konfederacji”, ale o „imperium”."
 KNF_a_ivrp:0 "Starcie z przywódcą IV RP"
 KNF_a_ivrp_desc:0 "Warszawa ogłasza się sercem odrodzonego państwa. Ale w Ciechanowie i Siedlcach nikt nie zamierza słuchać rozkazów ze stolicy."
 KNF_a_unia:0 "Konfederacja i Korona"
 KNF_a_unia_desc:0 "Front wygrał wojnę. Teraz trzeba zdecydować, czy Korona wejdzie do Skonfederowanej Polski – dobrowolnie albo wcale."
 KNF_b_palac:0 "List do Pałacu Prezydenckiego"
 KNF_b_palac_desc:0 "Do Pałacu trafia list: Konfederacja uzna zwierzchnictwo Prezydenta nad siłami zbrojnymi w zamian za miejsce w rządzie Zjednoczenia Narodowego."
 KNF_b_wojsko:0 "Wojsko po naszej stronie"
 KNF_b_wojsko_desc:0 "Oficerowie z Rembertowa przyjeżdżają do Ciechanowa. Straż Narodowa dostanie broń z magazynów wojskowych."
 KNF_b_sztab:0 "Wspólny sztab"
 KNF_b_sztab_desc:0 "Oficerowie Wojska i dowódcy Straży planują operacje przy jednym stole."
 KNF_b_warszawa:0 "Warszawa dla Zjednoczenia"
 KNF_b_warszawa_desc:0 "Rywale Pałacu w stolicy muszą zniknąć: Sejm i Pruszków nie będą dzielić Warszawy ze Zjednoczeniem Narodowym."
 KNF_b_rzad:0 "Rząd Zjednoczenia Narodowego"
 KNF_b_rzad_desc:0 "Konfederacja dostaje ministerstwa gospodarki i obrony. Mentzen staje się wicepremierem państwa, które dopiero powstaje."
 KNF_b_front:0 "Front Narodowy"
 KNF_b_front_desc:0 "Zjednoczenie Narodowe rusza na północ i zachód: Mława, Płock i Państwo Narodowe mają wybrać – przyłączenie albo wojna."
 KNF_b_zn:0 "Zjednoczenie Narodowe"
 KNF_b_zn_desc:0 "Pałac, Wojsko i Konfederacja mają wspólny rząd, wspólną armię i wspólny cel. Polska znów ma centrum."
 KNF_c_stolik:0 "Ku lepszemu jutru"
 KNF_c_stolik_desc:0 "Żadnych sojuszy ze starym układem. Mentzen ogłasza na wiecu: „Wywracamy stolik. Państwo zbudujemy sami – od zera”."
 KNF_c_rzad:0 "Rząd Konfederacji"
 KNF_c_rzad_desc:0 "Konfederacja tworzy własny rząd: ministrowie z list partyjnych, eksperci z firm i ludzie z ulicy. Nikt z „poprzedniej epoki”."
 KNF_c_ultimata:0 "Ultimata dla sąsiadów"
 KNF_c_ultimata_desc:0 "Mława, Wołomin i Ożarów dostają ten sam list: podporządkujcie się rządowi w Ciechanowie albo poniesiecie konsekwencje."
 KNF_c_nikt:0 "Nikt nam nie będzie mówił"
 KNF_c_nikt_desc:0 "Płock i Państwo Narodowe odrzucają rząd Konfederacji. Odpowiedź jest jedna – kolumny Straży Narodowej ruszają na zachód i wschód."
 KNF_c_warszawa:0 "Marsz na Warszawę"
 KNF_c_warszawa_desc:0 "Stolica jest podzielona między bloki i ich bojówki. Konfederacja idzie po nią – bez zaproszenia i bez koalicjantów."
 KNF_c_korona:0 "Rozprawa z Koroną"
 KNF_c_korona_desc:0 "Siedlce nie uznają rządu w Ciechanowie. Na prawicy może być tylko jeden lider."
 KNF_c_pelnia:0 "Pełnia władzy"
 KNF_c_pelnia_desc:0 "Rząd Konfederacji kontroluje armię, skarb i media. Teraz może zbudować państwo po swojemu."
 KNF_skonf:0 "Skonfederowana Polska"
 KNF_skonf_desc:0 "Nad Ciechanowem, Warszawą i ziemiami Mazowsza powiewa jedna flaga. Konfederacja przestaje być ruchem – staje się państwem."
 KNF_konstytucja:0 "Konstytucja Wolnościowa"
 KNF_konstytucja_desc:0 "Krótka konstytucja: własność, wolność słowa, niskie podatki, silna armia. Gminy decydują o reszcie."
 KNF_armia:0 "Armia Skonfederowanej Polski"
 KNF_armia_desc:0 "Straż Narodowa, Gwardia i jednostki byłego Wojska tworzą jedną armię pod jednym dowództwem."
