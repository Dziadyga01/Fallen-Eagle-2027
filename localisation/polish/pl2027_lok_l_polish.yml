 LOK_gnz_grodowski:0 "płk Bolesław Grodowski"
 lok.1.t:0 "„Jo” w urzędowych pismach"
 lok.1.d:0 "Urzędnicy, którzy uciekli do Torunia z Warszawy, skarżą się, że odpowiedzi z rad dzielnic zaczynają się od „jo”. Jeden z nich przyniósł na posiedzenie wydruk: „Czy dzielnica przyjmie dwa transporty mąki? – Jo.” Sala parsknęła śmiechem.\n\n„Jo” mówi się zresztą nie tylko w Toruniu – usłyszysz je i w Gdańsku, i w Tucholi."
 lok.1.a:0 "Jo."
 lok.1.b:0 "Pisma urzędowe tylko po urzędowemu."
 lok.1.c:0 "Dopisać „jo” do wzoru odpowiedzi."
 lok.2.t:0 "Pierniki zamiast premii"
 lok.2.d:0 "Kasa miejska świeci pustkami, a w magazynach fabryki cukierniczej leżą tony pierników. Skarbnik proponuje wypłacić część premii w naturze. „W czasie wojny piernik to waluta twardsza od złotówki” – przekonuje."
 lok.2.a:0 "Premie w piernikach."
 lok.2.b:0 "Pierniki dla żołnierzy na posterunkach."
 lok.2.c:0 "Sprzedać je sąsiadom – za mąkę i paliwo."
 lok.3.t:0 "Motoarena w czasie kryzysu"
 lok.3.d:0 "Klub żużlowy chce rozegrać mecz na Motoarenie. Paliwo do motocykli, prąd do świateł i policjanci do ochrony – wszystkiego brakuje. Ale kibice od tygodni pytają tylko o jedno: „Jedziemy w niedzielę?”"
 lok.3.a:0 "Mecz się odbędzie – miasto tego potrzebuje."
 lok.3.b:0 "Paliwo dla wojska, nie dla motocykli."
 lok.4.t:0 "Wojna na nagłówki"
 lok.4.d:0 "Gazeta z drugiego miasta wydrukowała na pierwszej stronie: „Kto rządzi regionem, ten rządzi Wisłą”. Pod spodem mapa, na której nasze miasto jest podpisane mniejszą czcionką niż ich osiedle. Redakcja pyta, czy odpowiadamy."
 lok.4.a:0 "Odpowiedzieć felietonem. Ostrym."
 lok.4.b:0 "Ponad to. Mamy ważniejsze sprawy."
 lok.4.c:0 "Zakazać sprzedaży ich gazety."
 lok.5.t:0 "Lotnisko: Bydgoszcz czy Bydgoszcz-Toruń?"
 lok.5.d:0 "Wraca spór z 2016 roku: czy w nazwie portu lotniczego ma się pojawić Toruń. Tym razem po drugiej stronie stołu siedzą nie samorządowcy, ale delegaci sąsiedniego państwa – i oferują paliwo lotnicze za dopisanie jednego słowa."
 lok.5.a:0 "Lotnisko zostaje bydgoskie."
 lok.5.b:0 "Dopisać Toruń – paliwo się przyda."
 lok.5.c:0 "Odłożyć sprawę na po wojnie."
 lok.6.t:0 "Worki z piaskiem pod Łuczniczką"
 lok.6.d:0 "Rano mieszkańcy obłożyli pomnik Łuczniczki workami z piaskiem. Nikt nie wydał takiego polecenia – „na wszelki wypadek”, mówi starsza pani, która przyniosła pierwszy worek. Sztab pyta, czy worki nie przydałyby się raczej na przedpolu."
 lok.6.a:0 "Zostawić. Łuczniczka jest symbolem miasta."
 lok.6.b:0 "Worki na przedpole."
 lok.7.t:0 "Ostatnia szneka z glancem"
 lok.7.d:0 "Piekarnie nad Brdą kończą cukier. Za tydzień w witrynach nie będzie szneki z glancem – i ludzie traktują to poważniej niż komunikaty z frontu."
 lok.7.a:0 "Cukier dla piekarni z rezerw."
 lok.7.b:0 "Cukier to kalorie dla wojska."
 lok.8.t:0 "Słoiki wracają do domów"
 lok.8.d:0 "Na dworcach tłum ludzi z walizkami i torbami. Przyjechali kiedyś do Warszawy z Kielc, Siedlec i Białegostoku – teraz wracają, bo w rodzinnych miastach przynajmniej wiadomo, kto rządzi. Część radnych chce zatrzymać fachowców na rogatkach."
 lok.8.a:0 "Niech jadą – nie zatrzymujemy nikogo siłą."
 lok.8.b:0 "Fachowcy zostają. Przepustki tylko dla rodzin."
 lok.9.t:0 "Bazar Różyckiego"
 lok.9.d:0 "Na bazarze przy Targowej handluje się wszystkim: kurtkami, paliwem w kanistrach, a od tygodnia – karabinami z rozbitych magazynów. Kupcy obiecują, że „towar dla swoich” będzie po starej cenie."
 lok.9.a:0 "Kupić, co się da – dla naszych straży."
 lok.9.b:0 "Zamknąć handel bronią."
 lok.10.t:0 "Żyleta śpiewa"
 lok.10.d:0 "Przed wymarszem oddziałów kibice zebrali się pod trybuną przy Łazienkowskiej. Śpiew słychać było aż na Powiślu. Dowódcy przyznają, że po takim pożegnaniu nikt nie chce zawrócić."
 lok.10.a:0 "Zabrać śpiew na front."
 lok.10.b:0 "Najpierw dyscyplina, potem śpiewy."
 lok.11.t:0 "Pruszków pamięta lata dziewięćdziesiąte"
 lok.11.d:0 "Do sztabu przychodzi kilku starszych panów w skórzanych kurtkach. Nie podają nazwisk, ale „znają ludzi” na każdej trasie wylotowej i proponują pomoc w zaopatrzeniu. Za odpowiednim udziałem, rzecz jasna."
 lok.11.a:0 "Doświadczenie się przyda."
 lok.11.b:0 "Dziękujemy. Mamy własnych ludzi."
 lok.12.t:0 "Lotnisko Warszawa-Radom"
 lok.12.d:0 "Na pasie lotniska, z którego przed rozpadem latało kilka czarterów tygodniowo, wylądował wojskowy transportowiec. Pracownicy portu zrobili sobie zdjęcie z samolotem i podpisali je: „W końcu ktoś tu lata”."
 lok.12.a:0 "Lotnisko dla wojska."
 lok.12.b:0 "Port przestał być memem. Wystarczy."
 lok.13.t:0 "Bilet na molo"
 lok.13.d:0 "Kasa przy wejściu na molo znów pracuje. Miasto pyta, czy w czasie kryzysu podnieść cenę biletu – mieszkańcy pytają, czy w czasie kryzysu w ogóle trzeba płacić za spacer nad morzem."
 lok.13.a:0 "Podnieść cenę – budżet tego potrzebuje."
 lok.13.b:0 "Wstęp wolny do odwołania."
 lok.14.t:0 "Derby Trójmiasta"
 lok.14.d:0 "Arka i Lechia mają zagrać mimo kryzysu. Policja ostrzega, że po derbach będzie więcej rannych niż po niejednej potyczce na granicy. Prezydent proponuje „mecz pojednania” z kibicami obu drużyn na jednej trybunie."
 lok.14.a:0 "Mecz pojednania."
 lok.14.b:0 "Mecz bez kibiców gości."
 lok.14.c:0 "Odwołać derby."
 lok.15.t:0 "Pod Bramą nr 2"
 lok.15.d:0 "Stoczniowcy znów stanęli pod Bramą nr 2. Nie żądają wolności – żądają wypłat, które od trzech miesięcy dostają w bonach. Na bramie ktoś zawiesił kartkę: „Tu już raz zmieniliśmy historię”."
 lok.15.a:0 "Negocjować przy stoczniowym stole."
 lok.15.b:0 "Stocznia pracuje dla wojska – bez dyskusji."
 lok.16.t:0 "Cena na pylonie"
 lok.16.d:0 "Na pylonie stacji przy wjeździe do miasta wyświetla się cena, której nikt nie potrafi przeliczyć na złotówki. Mieszkańcy miasta z rafinerią czują się oszukani: „Ropa płynie obok nas, a za kanister płacimy jak w Warszawie”."
 lok.16.a:0 "Zniżka dla mieszkańców."
 lok.16.b:0 "Ceny bez zmian – rafineria musi zarabiać."
 lok.17.t:0 "Tama na Wiśle"
 lok.17.d:0 "Inżynierowie z zapory pod Włocławkiem alarmują: konstrukcja pamięta lata siedemdziesiąte, a od rozpadu nikt nie płaci za przeglądy. Jeśli coś pójdzie nie tak, woda nie będzie pytać o granice."
 lok.17.a:0 "Remont z budżetu."
 lok.17.b:0 "Wojsko pilnuje zapory, remont później."
 lok.18.t:0 "Święto Róży w czasie rozpadu"
 lok.18.d:0 "Kutno od dekad świętuje róże – i nie zamierza przestać tylko dlatego, że państwo się rozpadło. Ogrodnicy pytają, czy miasto da pieniądze na kwiaty."
 lok.18.a:0 "Święto się odbędzie."
 lok.18.b:0 "W tym roku bez parady."
 lok.19.t:0 "Wszystkie pociągi przez Kutno"
 lok.19.d:0 "Przez węzeł w Kutnie przejeżdżają składy z czterech kierunków – i każdy z sąsiadów chce, żeby jego pociąg jechał pierwszy. Dyżurny ruchu mówi, że jeszcze nigdy nie był tak ważny."
 lok.19.a:0 "Opłata za przejazd przez węzeł."
 lok.19.b:0 "Najpierw nasze składy."
 lok.20.t:0 "Procesja w pasiakach"
 lok.20.d:0 "Na Boże Ciało ulicami Łowicza przeszła procesja w pasiakach. Mieszkańcy przyjechali z całej ziemi łowickiej, choć połowa dróg jest zamknięta. Nawet żołnierze na posterunkach zdjęli hełmy."
 lok.20.a:0 "Księstwo ma swoją tradycję."
 lok.20.b:0 "Zachować czujność na posterunkach."
 lok.21.t:0 "Tężnie w Inowrocławiu"
 lok.21.d:0 "Lekarze proponują wysłać rannych na rekonwalescencję do parku Solanki. Sanatoria stoją puste od rozpadu, a tężnie wciąż działają."
 lok.21.a:0 "Sanatoria dla rannych."
 lok.21.b:0 "Sanatoria dla płacących gości z zagranicy."
 lok.22.t:0 "Konie z Cytadeli"
 lok.22.d:0 "W Grudziądzu przed wojną szkolono kawalerię całego kraju. Dziś stowarzyszenie rekonstruktorów oferuje sztabowi trzydzieści koni i jeźdźców, którzy znają każdą leśną drogę nad Wisłą."
 lok.22.a:0 "Przyjąć – patrole konne do lasów."
 lok.22.b:0 "Konie do pracy w polu."
 lok.23.t:0 "Kortowiada mimo wszystko"
 lok.23.d:0 "Studenci z Kortowa ogłaszają, że juwenalia się odbędą – z wojskiem czy bez. Dziekanaty pytają władze, kto zapłaci za scenę nad jeziorem."
 lok.23.a:0 "Niech się bawią – to też jest normalność."
 lok.23.b:0 "Odwołać. Teraz nie czas na festyny."
 lok.24.t:0 "Polski biegun zimna"
 lok.24.d:0 "Termometry w Suwałkach znów pokazują najniższą temperaturę w regionie. Żołnierze na posterunkach przy przesmyku mówią, że zimno to ich najlepszy sojusznik – o ile dostaną nowe kurtki."
 lok.24.a:0 "Kurtki i opał dla posterunków."
 lok.24.b:0 "Hartujemy się."
 lok.25.t:0 "Byki na torze"
 lok.25.d:0 "Klub żużlowy z Leszna wywiesza plakaty: „Byki jadą dalej”. Na stadionie zebrało się pół miasta. Kibice śpiewają, że Leszno zawsze było mistrzem – i nie zamierzają tego zmieniać."
 lok.25.a:0 "Puchar dla zwycięzcy z budżetu miasta."
 lok.25.b:0 "Zawodnicy do jednostek zmotoryzowanych."
 lok.26.t:0 "Najstarsze miasto"
 lok.26.d:0 "Kronikarz miejski przypomina na wiecu, że Kalisz jest najstarszym miastem w Polsce. „Pisał o nas już Ptolemeusz, zanim ktokolwiek słyszał o Warszawie” – mówi i dostaje owację."
 lok.26.a:0 "Wydrukować to na plakatach."
 lok.26.b:0 "Historia nie napełni żołądków."
 lok.27.t:0 "Turyści pytają o bilety"
 lok.27.d:0 "Pod bramą zamku stoi grupa niemieckich emerytów z przewodnikiem. Pytają, czy zamek jest otwarty dla zwiedzających i czy można zrobić zdjęcie z rycerzem."
 lok.27.a:0 "Bilety po nowej, zakonnej cenie."
 lok.27.b:0 "Zakon nie jest skansenem."
 LOK_sprawy_lokalne:0 "Sprawy lokalne"
 LOK_sprawy_lokalne_desc:0 "Drobne decyzje, o których mówi całe miasto."
 LOK_pierniki_front:0 "Paczki z piernikami na posterunki"
 LOK_pierniki_front_desc:0 "Fabryka cukiernicza wysyła na posterunki paczki z piernikami. Żołnierze piszą, że to najlepsza amunicja, jaką dostali."
 LOK_opera_lesna:0 "Koncert w Operze Leśnej"
 LOK_opera_lesna_desc:0 "Orkiestra i chór dają darmowy koncert w Operze Leśnej. Przez jeden wieczór nikt w Sopocie nie myśli o granicach."
