l_polish:
 NRT_nurt_mod:0 "Nurt rządzący"
 NRT_nurt_mod_desc:0 "Subideologia przywódcy kształtuje ustrój: §Y[Root.GetLeader]§! ([Root.GetRulingParty]). Szczegóły w panelu „Atlas nurtów politycznych”."
 NRT_atlas:0 "Atlas nurtów politycznych"
 NRT_atlas_desc:0 "Każde państwo ma §Ypartie§! jedenastu §Ygrup ideologicznych§!, a przywódca reprezentuje konkretną §Ysubideologię§!. Tutaj: rządzi §Y[Root.GetRulingParty]§!, przywódca §Y[Root.GetLeader]§!.\n\nRozwiń grupę, aby zobaczyć jej subideologie – także te, które nigdzie nie rządzą. Wpisy są tylko informacyjne (nie można ich wybrać). Efekty subideologii przywódcy działają przez modyfikator „Nurt rządzący”."
 NRT_g_totalitarian_socialist:0 "Socjalizm totalitarny: rozwiń / zwiń"
 NRT_g_totalitarian_socialist_desc:0 "Grupa ideologiczna „Socjalizm totalitarny” – subideologie: Totalizm, Maoizm, Lewicowa junta, Neostalinizm."
 NRT_t_totalism:0 "   Totalizm"
 NRT_t_totalism_desc:0 "§YGrupa:§! Socjalizm totalitarny\n§YSubideologia:§! Totalizm\n\nPaństwo-partia, które obiecuje równość przez całkowitą kontrolę.\n\n§YCechy ustroju:§! jedna partia, planowanie centralne, cenzura.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, stabilność §R-3%§!, poparcie dla wojny §G+5%§!, pobór §G+10%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Socjalizm totalitarny” na wykresie poparcia."
 NRT_t_maoism:0 "   Maoizm"
 NRT_t_maoism_desc:0 "§YGrupa:§! Socjalizm totalitarny\n§YSubideologia:§! Maoizm\n\nRewolucja oparta na wsi i masowej mobilizacji.\n\n§YCechy ustroju:§! komuny, kampanie masowe, kult przywódcy.\n§YEfekty (gdy przywódca ją reprezentuje):§! stabilność §R-2%§!, poparcie dla wojny §G+8%§!, pobór §G+12%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Socjalizm totalitarny” na wykresie poparcia."
 NRT_t_left_wing_junta:0 "   Lewicowa junta"
 NRT_t_left_wing_junta_desc:0 "§YGrupa:§! Socjalizm totalitarny\n§YSubideologia:§! Lewicowa junta\n\nWojskowi, którzy rządzą w imię ludu.\n\n§YCechy ustroju:§! rada wojskowa, nacjonalizacje, stan wyjątkowy.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, stabilność §G+2%§!, poparcie dla wojny §G+8%§!, pobór §G+8%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Socjalizm totalitarny” na wykresie poparcia."
 NRT_t_neo_stalinism:0 "   Neostalinizm"
 NRT_t_neo_stalinism_desc:0 "§YGrupa:§! Socjalizm totalitarny\n§YSubideologia:§! Neostalinizm\n\nTwarda ręka, plan pięcioletni i wróg za każdą granicą.\n\n§YCechy ustroju:§! centralizacja, przemysł ciężki, aparat represji.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+8%§!, stabilność §R-4%§!, poparcie dla wojny §G+10%§!, szybkość budowy §G+5%§!, pobór §G+10%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Socjalizm totalitarny” na wykresie poparcia."
 NRT_g_communist:0 "Komunizm: rozwiń / zwiń"
 NRT_g_communist_desc:0 "Grupa ideologiczna „Komunizm” – subideologie: Marksizm-leninizm, Eurokomunizm, Trockizm."
 NRT_t_marxism_leninism:0 "   Marksizm-leninizm"
 NRT_t_marxism_leninism_desc:0 "§YGrupa:§! Komunizm\n§YSubideologia:§! Marksizm-leninizm\n\nKlasyczna partia awangardy i własność państwowa.\n\n§YCechy ustroju:§! partia kadrowa, gospodarka planowa.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, poparcie dla wojny §G+5%§!, szybkość budowy §G+3%§!, pobór §G+5%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Komunizm” na wykresie poparcia."
 NRT_t_eurocommunism:0 "   Eurokomunizm"
 NRT_t_eurocommunism_desc:0 "§YGrupa:§! Komunizm\n§YSubideologia:§! Eurokomunizm\n\nKomunizm, który chce wygrywać wybory.\n\n§YCechy ustroju:§! pluralizm, związki zawodowe, sektor publiczny.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §G+3%§!, szybkość budowy §G+3%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Komunizm” na wykresie poparcia."
 NRT_t_trotskyism:0 "   Trockizm"
 NRT_t_trotskyism_desc:0 "§YGrupa:§! Komunizm\n§YSubideologia:§! Trockizm\n\nRewolucja permanentna – i spór z każdym, kto jej nie chce.\n\n§YCechy ustroju:§! rady robotnicze, internacjonalizm.\n§YEfekty (gdy przywódca ją reprezentuje):§! stabilność §R-3%§!, poparcie dla wojny §G+5%§!, pobór §G+5%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Komunizm” na wykresie poparcia."
 NRT_g_libertarian_socialist:0 "Socjalizm wolnościowy: rozwiń / zwiń"
 NRT_g_libertarian_socialist_desc:0 "Grupa ideologiczna „Socjalizm wolnościowy” – subideologie: Socjalizm reformistyczny, Anarchizm lewicowy, Ekosocjalizm, Syndykalizm."
 NRT_t_reformist_socialism:0 "   Socjalizm reformistyczny"
 NRT_t_reformist_socialism_desc:0 "§YGrupa:§! Socjalizm wolnościowy\n§YSubideologia:§! Socjalizm reformistyczny\n\nSocjalizm budowany stopniowo, przez spółdzielnie i samorząd.\n\n§YCechy ustroju:§! spółdzielnie, demokracja zakładowa.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §G+3%§!, szybkość budowy §G+3%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Socjalizm wolnościowy” na wykresie poparcia."
 NRT_t_left_anarchist:0 "   Anarchizm lewicowy"
 NRT_t_left_anarchist_desc:0 "§YGrupa:§! Socjalizm wolnościowy\n§YSubideologia:§! Anarchizm lewicowy\n\nWolne komuny bez państwa i bez szefów.\n\n§YCechy ustroju:§! zgromadzenia, rotacja funkcji, federacja gmin.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §R-5%§!, poparcie dla wojny §G+5%§!, pobór §G+5%§!.\n§YPrzywódcy w świecie moda:§! Maksim Andrei Krevienko, Kuba Szwederowski.\n§YPartia w tym państwie:§! partia grupy „Socjalizm wolnościowy” na wykresie poparcia."
 NRT_t_eco_socialism:0 "   Ekosocjalizm"
 NRT_t_eco_socialism_desc:0 "§YGrupa:§! Socjalizm wolnościowy\n§YSubideologia:§! Ekosocjalizm\n\nGospodarka podporządkowana klimatowi i wspólnocie.\n\n§YCechy ustroju:§! planowanie ekologiczne, własność komunalna.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+2%§!, stabilność §G+3%§!, poparcie dla wojny §R-3%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Socjalizm wolnościowy” na wykresie poparcia."
 NRT_t_labour_syndicalism:0 "   Syndykalizm"
 NRT_t_labour_syndicalism_desc:0 "§YGrupa:§! Socjalizm wolnościowy\n§YSubideologia:§! Syndykalizm\n\nPaństwo rad zakładowych i związków.\n\n§YCechy ustroju:§! związki zawodowe zamiast parlamentu.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+2%§!, poparcie dla wojny §G+3%§!, szybkość budowy §G+5%§!, pobór §G+3%§!.\n§YPrzywódcy w świecie moda:§! Prezydium Rad Robotniczych, Kongres Rad Łódzkich.\n§YPartia w tym państwie:§! partia grupy „Socjalizm wolnościowy” na wykresie poparcia."
 NRT_g_social_democrat:0 "Socjaldemokracja: rozwiń / zwiń"
 NRT_g_social_democrat_desc:0 "Grupa ideologiczna „Socjaldemokracja” – subideologie: Socjaldemokracja, Progresywizm, Polityka zielonych, Populizm lewicowy."
 NRT_t_social_democracy:0 "   Socjaldemokracja"
 NRT_t_social_democracy_desc:0 "§YGrupa:§! Socjaldemokracja\n§YSubideologia:§! Socjaldemokracja\n\nRynek z silnym państwem opiekuńczym.\n\n§YCechy ustroju:§! wybory, związki, podatki progresywne.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §G+5%§!, poparcie dla wojny §R-2%§!.\n§YPrzywódcy w świecie moda:§! Adrian Zandberg, Michał Romanowski, Lew Szlosberg, Kazimierz Brakoniecki, Marek Sokołowski, Rada Delegatów Sodowni i 7 innych.\n§YPartia w tym państwie:§! partia grupy „Socjaldemokracja” na wykresie poparcia."
 NRT_t_progressivism:0 "   Progresywizm"
 NRT_t_progressivism_desc:0 "§YGrupa:§! Socjaldemokracja\n§YSubideologia:§! Progresywizm\n\nReformy społeczne i nowoczesne instytucje.\n\n§YCechy ustroju:§! prawa obywatelskie, edukacja, inwestycje.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, stabilność §G+3%§!, poparcie dla wojny §R-3%§!, szybkość budowy §G+3%§!.\n§YPrzywódcy w świecie moda:§! Filip Orłowski.\n§YPartia w tym państwie:§! partia grupy „Socjaldemokracja” na wykresie poparcia."
 NRT_t_green_politics:0 "   Polityka zielonych"
 NRT_t_green_politics_desc:0 "§YGrupa:§! Socjaldemokracja\n§YSubideologia:§! Polityka zielonych\n\nOchrona środowiska i transformacja energetyczna.\n\n§YCechy ustroju:§! samorządy, energetyka odnawialna.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+2%§!, stabilność §G+3%§!, poparcie dla wojny §R-5%§!, szybkość budowy §G+3%§!, pobór §R-3%§!.\n§YPrzywódcy w świecie moda:§! Przywódca – Zieloni.\n§YPartia w tym państwie:§! partia grupy „Socjaldemokracja” na wykresie poparcia."
 NRT_t_left_populism:0 "   Populizm lewicowy"
 NRT_t_left_populism_desc:0 "§YGrupa:§! Socjaldemokracja\n§YSubideologia:§! Populizm lewicowy\n\n„Lud przeciw elitom” – z lewej strony.\n\n§YCechy ustroju:§! referenda, transfery socjalne, silny lider.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, poparcie dla wojny §G+3%§!, pobór §G+3%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Socjaldemokracja” na wykresie poparcia."
 NRT_g_social_liberal:0 "Socjalliberalizm: rozwiń / zwiń"
 NRT_g_social_liberal_desc:0 "Grupa ideologiczna „Socjalliberalizm” – subideologie: Socjalliberalizm, Centryzm, Zielony liberalizm."
 NRT_t_social_liberalism:0 "   Socjalliberalizm"
 NRT_t_social_liberalism_desc:0 "§YGrupa:§! Socjalliberalizm\n§YSubideologia:§! Socjalliberalizm\n\nLiberalna demokracja z siatką bezpieczeństwa socjalnego.\n\n§YCechy ustroju:§! wybory, sądy, integracja europejska.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, stabilność §G+5%§!, poparcie dla wojny §R-3%§!, szybkość budowy §G+3%§!.\n§YPrzywódcy w świecie moda:§! Rada Narodowa Białorusi, Rafał Bruski, Donald Tusk, Aleksiej Kaczyński, Przywódca – Państwo Bydgoskie, Ewa Malinowska i 51 innych.\n§YPartia w tym państwie:§! partia grupy „Socjalliberalizm” na wykresie poparcia."
 NRT_t_centrist:0 "   Centryzm"
 NRT_t_centrist_desc:0 "§YGrupa:§! Socjalliberalizm\n§YSubideologia:§! Centryzm\n\nKompromis, zarządzanie i unikanie skrajności.\n\n§YCechy ustroju:§! koalicje, technokraci, gradualizm.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, stabilność §G+5%§!, poparcie dla wojny §R-2%§!, szybkość budowy §G+2%§!.\n§YPrzywódcy w świecie moda:§! prof. Barbara Rejewska, Krystian Kinastowski, Arkadiusz Fajok, Rada Tymczasowa Miasta, Katharina Schmidt-Kowalczyk, Wałerij Załużny i 3 innych.\n§YPartia w tym państwie:§! partia grupy „Socjalliberalizm” na wykresie poparcia."
 NRT_t_green_liberalism:0 "   Zielony liberalizm"
 NRT_t_green_liberalism_desc:0 "§YGrupa:§! Socjalliberalizm\n§YSubideologia:§! Zielony liberalizm\n\nRynek i klimat w jednym programie.\n\n§YCechy ustroju:§! regulacje środowiskowe, innowacje.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §G+3%§!, poparcie dla wojny §R-3%§!, szybkość budowy §G+5%§!, pobór §R-3%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Socjalliberalizm” na wykresie poparcia."
 NRT_g_market_liberal:0 "Liberalizm rynkowy: rozwiń / zwiń"
 NRT_g_market_liberal_desc:0 "Grupa ideologiczna „Liberalizm rynkowy” – subideologie: Liberalizm klasyczny, Prawicowy libertarianizm, Nacjonalizm obywatelski."
 NRT_t_classical_liberalism:0 "   Liberalizm klasyczny"
 NRT_t_classical_liberalism_desc:0 "§YGrupa:§! Liberalizm rynkowy\n§YSubideologia:§! Liberalizm klasyczny\n\nWolny rynek, prawa jednostki, małe państwo.\n\n§YCechy ustroju:§! niskie podatki, deregulacja.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §G+2%§!, poparcie dla wojny §R-2%§!, szybkość budowy §G+5%§!, pobór §R-3%§!.\n§YPrzywódcy w świecie moda:§! Sławomir Mentzen, Michaił Chodorkowski, Rada Przemysłowa Bydgoszczy, Starszy Gildii Wiślanej, Pełnomocnik Trójmiasta, Prezes Korporacji Energetycznej i 12 innych.\n§YPartia w tym państwie:§! partia grupy „Liberalizm rynkowy” na wykresie poparcia."
 NRT_t_right_libertarianism:0 "   Prawicowy libertarianizm"
 NRT_t_right_libertarianism_desc:0 "§YGrupa:§! Liberalizm rynkowy\n§YSubideologia:§! Prawicowy libertarianizm\n\nPaństwo minimalne – albo żadne.\n\n§YCechy ustroju:§! prywatyzacja wszystkiego, milicje obywatelskie.\n§YEfekty (gdy przywódca ją reprezentuje):§! stabilność §R-2%§!, poparcie dla wojny §G+3%§!, szybkość budowy §G+8%§!.\n§YPrzywódcy w świecie moda:§! Zarząd PKP, Kamil Wolański.\n§YPartia w tym państwie:§! partia grupy „Liberalizm rynkowy” na wykresie poparcia."
 NRT_t_civic_nationalism:0 "   Nacjonalizm obywatelski"
 NRT_t_civic_nationalism_desc:0 "§YGrupa:§! Liberalizm rynkowy\n§YSubideologia:§! Nacjonalizm obywatelski\n\nWspólnota obywateli, nie krwi.\n\n§YCechy ustroju:§! patriotyzm konstytucyjny, obrona terytorialna.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §G+3%§!, poparcie dla wojny §G+5%§!, pobór §G+3%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Liberalizm rynkowy” na wykresie poparcia."
 NRT_g_conservative:0 "Konserwatyzm: rozwiń / zwiń"
 NRT_g_conservative_desc:0 "Grupa ideologiczna „Konserwatyzm” – subideologie: Konserwatyzm klasyczny, Konserwatyzm chrześcijański, Populizm prawicowy, Konserwatyzm narodowy, Populizm klientelistyczny, Konserwatyzm menedżerski."
 NRT_t_classical_conservatism:0 "   Konserwatyzm klasyczny"
 NRT_t_classical_conservatism_desc:0 "§YGrupa:§! Konserwatyzm\n§YSubideologia:§! Konserwatyzm klasyczny\n\nPorządek, ciągłość i instytucje.\n\n§YCechy ustroju:§! parlamentaryzm, Kościół, tradycja.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §G+5%§!, poparcie dla wojny §G+3%§!.\n§YPrzywódcy w świecie moda:§! Przemysław Czarnek, Statthalterin Helga Brandt, Michał Zaleski, Rada Koronna Kujaw, Prezes Zrzeszenia Kaszubsko-Pomorskiego, Starosta Kurpiowski i 11 innych.\n§YPartia w tym państwie:§! partia grupy „Konserwatyzm” na wykresie poparcia."
 NRT_t_christian_conservatism:0 "   Konserwatyzm chrześcijański"
 NRT_t_christian_conservatism_desc:0 "§YGrupa:§! Konserwatyzm\n§YSubideologia:§! Konserwatyzm chrześcijański\n\nPolityka oparta na nauce społecznej Kościoła.\n\n§YCechy ustroju:§! rodzina, parafie, szkoły wyznaniowe.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+2%§!, stabilność §G+6%§!, poparcie dla wojny §G+3%§!, pobór §G+2%§!.\n§YPrzywódcy w świecie moda:§! Grzegorz Braun, Kapituła Lubawska, Rada przy Kolegiacie, Rada Bractwa Katedralnego.\n§YPartia w tym państwie:§! partia grupy „Konserwatyzm” na wykresie poparcia."
 NRT_t_right_populism:0 "   Populizm prawicowy"
 NRT_t_right_populism_desc:0 "§YGrupa:§! Konserwatyzm\n§YSubideologia:§! Populizm prawicowy\n\n„Lud przeciw elitom” – z prawej strony.\n\n§YCechy ustroju:§! silny lider, referenda, nieufność wobec sądów.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, poparcie dla wojny §G+5%§!, pobór §G+3%§!.\n§YPrzywódcy w świecie moda:§! Maciej Maciak, Wiktor Brdowski.\n§YPartia w tym państwie:§! partia grupy „Konserwatyzm” na wykresie poparcia."
 NRT_t_national_conservatism:0 "   Konserwatyzm narodowy"
 NRT_t_national_conservatism_desc:0 "§YGrupa:§! Konserwatyzm\n§YSubideologia:§! Konserwatyzm narodowy\n\nNaród, suwerenność i silne państwo.\n\n§YCechy ustroju:§! centralizacja, armia, polityka historyczna.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §G+3%§!, poparcie dla wojny §G+8%§!, pobór §G+5%§!.\n§YPrzywódcy w świecie moda:§! Komendant Marchii.\n§YPartia w tym państwie:§! partia grupy „Konserwatyzm” na wykresie poparcia."
 NRT_t_patronage_populism:0 "   Populizm klientelistyczny"
 NRT_t_patronage_populism_desc:0 "§YGrupa:§! Konserwatyzm\n§YSubideologia:§! Populizm klientelistyczny\n\nPaństwo struktur: lojalność aktywu w zamian za stanowiska i pieniądze.\n\n§YCechy ustroju:§! sieć patronatu, spółki dla swoich, struktury terenowe.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §R-3%§!, stabilność §G+8%§!, poparcie dla wojny §G+5%§!, szybkość budowy §R-3%§!, pobór §G+5%§!.\n§YPrzywódcy w świecie moda:§! Przewodniczący Struktur Terenowych.\n§YPartia w tym państwie:§! partia grupy „Konserwatyzm” na wykresie poparcia."
 NRT_t_managerial_conservatism:0 "   Konserwatyzm menedżerski"
 NRT_t_managerial_conservatism_desc:0 "§YGrupa:§! Konserwatyzm\n§YSubideologia:§! Konserwatyzm menedżerski\n\nKonserwatywne cele, menedżerskie metody: wskaźniki, raporty i pragmatyczne układy.\n\n§YCechy ustroju:§! technokracja partyjna, budżet zadaniowy.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+10%§!, szybkość budowy §G+8%§!.\n§YPrzywódcy w świecie moda:§! Mateusz Morawiecki.\n§YPartia w tym państwie:§! partia grupy „Konserwatyzm” na wykresie poparcia."
 NRT_g_authoritarian_democrat:0 "Demokracja autorytarna: rozwiń / zwiń"
 NRT_g_authoritarian_democrat_desc:0 "Grupa ideologiczna „Demokracja autorytarna” – subideologie: Demokracja autorytarna, Oligarchia, Demokracja wojskowa, Korporacjonizm, Streamokracja."
 NRT_t_authoritarian_democracy:0 "   Demokracja autorytarna"
 NRT_t_authoritarian_democracy_desc:0 "§YGrupa:§! Demokracja autorytarna\n§YSubideologia:§! Demokracja autorytarna\n\nWybory są, ale wynik jest znany.\n\n§YCechy ustroju:§! silna władza wykonawcza, kontrola mediów.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, stabilność §G+3%§!, poparcie dla wojny §G+3%§!, pobór §G+3%§!.\n§YPrzywódcy w świecie moda:§! Aleksandr Łukaszenka, Karol Nawrocki, Krzysztof Wypij, Arseniusz Finster, Ryszard Kulesza, Henryk Zieliński i 39 innych.\n§YPartia w tym państwie:§! partia grupy „Demokracja autorytarna” na wykresie poparcia."
 NRT_t_oligarchist:0 "   Oligarchia"
 NRT_t_oligarchist_desc:0 "§YGrupa:§! Demokracja autorytarna\n§YSubideologia:§! Oligarchia\n\nRządzą ci, którzy mają pieniądze.\n\n§YCechy ustroju:§! układy biznesowe, korupcja, stabilność dla elit.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+8%§!, szybkość budowy §G+3%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Demokracja autorytarna” na wykresie poparcia."
 NRT_t_military_democracy:0 "   Demokracja wojskowa"
 NRT_t_military_democracy_desc:0 "§YGrupa:§! Demokracja autorytarna\n§YSubideologia:§! Demokracja wojskowa\n\nWojsko jako gwarant konstytucji.\n\n§YCechy ustroju:§! wpływ armii, stan wyjątkowy, wybory pod nadzorem.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §G+3%§!, poparcie dla wojny §G+8%§!, pobór §G+8%§!.\n§YPrzywódcy w świecie moda:§! Rada Bezpieczeństwa Białorusi.\n§YPartia w tym państwie:§! partia grupy „Demokracja autorytarna” na wykresie poparcia."
 NRT_t_corporatism:0 "   Korporacjonizm"
 NRT_t_corporatism_desc:0 "§YGrupa:§! Demokracja autorytarna\n§YSubideologia:§! Korporacjonizm\n\nPaństwo cechów, izb i porozumień zbiorowych.\n\n§YCechy ustroju:§! rady gospodarcze, związki pod kontrolą.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, stabilność §G+3%§!, szybkość budowy §G+5%§!.\n§YPrzywódcy w świecie moda:§! Rafał „Archadzio” Archacki.\n§YPartia w tym państwie:§! partia grupy „Demokracja autorytarna” na wykresie poparcia."
 NRT_t_streamocracy:0 "   Streamokracja"
 NRT_t_streamocracy_desc:0 "§YGrupa:§! Demokracja autorytarna\n§YSubideologia:§! Streamokracja\n\nWładza z transmisji na żywo: czat decyduje, sponsor płaci.\n\n§YCechy ustroju:§! głosowania online, celebryci, chaos.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+8%§!, stabilność §R-3%§!.\n§YPrzywódcy w świecie moda:§! Yungwazon, Daniel Magical.\n§YPartia w tym państwie:§! partia grupy „Demokracja autorytarna” na wykresie poparcia."
 NRT_g_nationalist:0 "Nacjonalizm: rozwiń / zwiń"
 NRT_g_nationalist_desc:0 "Grupa ideologiczna „Nacjonalizm” – subideologie: Autokracja, Monarchia absolutna, Junta wojskowa, Państwo mafijne, Teokracja, Cyberkratyzm."
 NRT_t_autocrat:0 "   Autokracja"
 NRT_t_autocrat_desc:0 "§YGrupa:§! Nacjonalizm\n§YSubideologia:§! Autokracja\n\nJeden człowiek, jedna decyzja.\n\n§YCechy ustroju:§! dekrety, kult osoby, lojalne służby.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+8%§!, poparcie dla wojny §G+5%§!, pobór §G+5%§!.\n§YPrzywódcy w świecie moda:§! Kibic Legii, Robert Bąkiewicz, Tomasz Lidzbarski.\n§YPartia w tym państwie:§! partia grupy „Nacjonalizm” na wykresie poparcia."
 NRT_t_absolute_monarchist:0 "   Monarchia absolutna"
 NRT_t_absolute_monarchist_desc:0 "§YGrupa:§! Nacjonalizm\n§YSubideologia:§! Monarchia absolutna\n\nKorona ponad parlamentem.\n\n§YCechy ustroju:§! dwór, arystokracja, ceremoniał.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, stabilność §G+5%§!, poparcie dla wojny §G+3%§!.\n§YPrzywódcy w świecie moda:§! Świebodzin, Rada Regencyjna.\n§YPartia w tym państwie:§! partia grupy „Nacjonalizm” na wykresie poparcia."
 NRT_t_military_junta:0 "   Junta wojskowa"
 NRT_t_military_junta_desc:0 "§YGrupa:§! Nacjonalizm\n§YSubideologia:§! Junta wojskowa\n\nGenerałowie przejmują władzę „do czasu uspokojenia”.\n\n§YCechy ustroju:§! rada wojskowa, godzina policyjna.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, poparcie dla wojny §G+10%§!, pobór §G+10%§!.\n§YPrzywódcy w świecie moda:§! Przywódca – Wojsko, Siergiej Szojgu, Anna Wójcikowska, Komendant Cytadeli, Dowódca Okręgu Wschód, Dowódca Brygady Suwalskiej i 7 innych.\n§YPartia w tym państwie:§! partia grupy „Nacjonalizm” na wykresie poparcia."
 NRT_t_mafia_state:0 "   Państwo mafijne"
 NRT_t_mafia_state_desc:0 "§YGrupa:§! Nacjonalizm\n§YSubideologia:§! Państwo mafijne\n\nPaństwo jako rodzina – i jako interes.\n\n§YCechy ustroju:§! haracz, lojalność, czarny rynek.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+10%§!, stabilność §R-3%§!, poparcie dla wojny §G+3%§!, pobór §G+3%§!.\n§YPrzywódcy w świecie moda:§! „Słowik”.\n§YPartia w tym państwie:§! partia grupy „Nacjonalizm” na wykresie poparcia."
 NRT_t_theocracy:0 "   Teokracja"
 NRT_t_theocracy_desc:0 "§YGrupa:§! Nacjonalizm\n§YSubideologia:§! Teokracja\n\nWładza z nadania wiary – albo zakonu.\n\n§YCechy ustroju:§! kapituła, reguła, rycerze.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §G+6%§!, poparcie dla wojny §G+8%§!, pobór §G+5%§!.\n§YPrzywódcy w świecie moda:§! Frank Bayard.\n§YPartia w tym państwie:§! partia grupy „Nacjonalizm” na wykresie poparcia."
 NRT_t_cyberocracy:0 "   Cyberkratyzm"
 NRT_t_cyberocracy_desc:0 "§YGrupa:§! Nacjonalizm\n§YSubideologia:§! Cyberkratyzm\n\nRządzi system: urzędy automatyczne, decyzje w milisekundach, wyłącznik w jednej serwerowni.\n\n§YCechy ustroju:§! centralizacja cyfrowa, automatyzacja, inwigilacja.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+8%§!, stabilność §R-6%§!, szybkość budowy §G+12%§!.\n§YPrzywódcy w świecie moda:§! CyberJarek.\n§YPartia w tym państwie:§! partia grupy „Nacjonalizm” na wykresie poparcia."
 NRT_g_fascist:0 "Faszyzm: rozwiń / zwiń"
 NRT_g_fascist_desc:0 "Grupa ideologiczna „Faszyzm” – subideologie: Neofaszyzm, Klerykalny faszyzm, Falangizm."
 NRT_t_neofascism:0 "   Neofaszyzm"
 NRT_t_neofascism_desc:0 "§YGrupa:§! Faszyzm\n§YSubideologia:§! Neofaszyzm\n\nSkrajny nacjonalizm i kult siły. W grze – zagrożenie, nie wzór.\n\n§YCechy ustroju:§! partia-ruch, bojówki, wróg wewnętrzny.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, stabilność §R-3%§!, poparcie dla wojny §G+12%§!, pobór §G+8%§!.\n§YPrzywódcy w świecie moda:§! Przywódca Elany.\n§YPartia w tym państwie:§! partia grupy „Faszyzm” na wykresie poparcia."
 NRT_t_clerofascism:0 "   Klerykalny faszyzm"
 NRT_t_clerofascism_desc:0 "§YGrupa:§! Faszyzm\n§YSubideologia:§! Klerykalny faszyzm\n\nSkrajny nacjonalizm w religijnym przebraniu.\n\n§YCechy ustroju:§! teokracja, bojówki, cenzura.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, poparcie dla wojny §G+10%§!, pobór §G+8%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Faszyzm” na wykresie poparcia."
 NRT_t_falangism:0 "   Falangizm"
 NRT_t_falangism_desc:0 "§YGrupa:§! Faszyzm\n§YSubideologia:§! Falangizm\n\nRuch korporacyjny z kultem wodza.\n\n§YCechy ustroju:§! syndykaty państwowe, milicje.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+5%§!, poparcie dla wojny §G+10%§!, szybkość budowy §G+3%§!, pobór §G+5%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Faszyzm” na wykresie poparcia."
 NRT_g_national_socialist:0 "Narodowy socjalizm: rozwiń / zwiń"
 NRT_g_national_socialist_desc:0 "Grupa ideologiczna „Narodowy socjalizm” – subideologie: Neonazizm, Narodowy bolszewizm."
 NRT_t_neonazism:0 "   Neonazizm"
 NRT_t_neonazism_desc:0 "§YGrupa:§! Narodowy socjalizm\n§YSubideologia:§! Neonazizm\n\nMargines ideologii nienawiści. W grze nie ma ścieżki, która by ją nagradzała.\n\n§YCechy ustroju:§! przemoc, rasizm, izolacja.\n§YEfekty (gdy przywódca ją reprezentuje):§! stabilność §R-10%§!, poparcie dla wojny §G+10%§!, pobór §G+5%§!.\n§YPrzywódcy w świecie moda:§! Grzegorz Elański.\n§YPartia w tym państwie:§! partia grupy „Narodowy socjalizm” na wykresie poparcia."
 NRT_t_national_bolshevism:0 "   Narodowy bolszewizm"
 NRT_t_national_bolshevism_desc:0 "§YGrupa:§! Narodowy socjalizm\n§YSubideologia:§! Narodowy bolszewizm\n\nHybryda skrajnej lewicy i skrajnej prawicy.\n\n§YCechy ustroju:§! autorytaryzm, antyzachodniość.\n§YEfekty (gdy przywódca ją reprezentuje):§! władza polityczna §G+3%§!, stabilność §R-5%§!, poparcie dla wojny §G+10%§!, pobór §G+8%§!.\n§YPrzywódcy w świecie moda:§! na starcie nikt – nurt może dojść do władzy w trakcie gry.\n§YPartia w tym państwie:§! partia grupy „Narodowy socjalizm” na wykresie poparcia."
 NRT_info:0 "Atlas nurtów"
