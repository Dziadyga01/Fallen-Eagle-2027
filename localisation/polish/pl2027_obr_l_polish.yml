l_polish:
 OBR_wsparcie_op:0 "Wsparcie w obronie przed Rosją"
 ROS_priorytet_mazurski:0 "Priorytet: operacja mazurska"
 ROS_priorytet_mazurski_desc:0 "Sztab generalny zakazał innych operacji, dopóki nie zakończy się operacja na Mazurach. Uzasadnianie celów wojennych trwa §R11 razy dłużej§!, a wysyłanie ochotników jest wstrzymane. Obrona, produkcja i logistyka działają normalnie. Blokadę znosi tylko §Yzwycięstwo§! w operacji – nie rozejm ani zmiana władzy."
 ROS_req_cel_wolny:0 "Warmia i Mazury, Mazury albo Suwalszczyzna jest niepodległym państwem (nie województwem Rzeczypospolitej)"
 ROS_req_operacja_wygrana:0 "Rosja wygrała operację mazurską (inne podboje są zablokowane do zwycięstwa – rozejm ani zmiana władzy go nie zastępują)"
 ROS_odbudowa_po_mazurach:0 "Odbudowa po Mazurach"
 ROS_odbudowa_po_mazurach_desc:0 "Jednostki wracające z Mazur są przeformowywane. Sztab liczy straty i szuka winnych – i planuje, co zrobić inaczej następnym razem."
 OBR_ros:0 "Mazury: druga operacja"
 OBR_ros_desc:0 "Pierwsza operacja się nie powiodła. Rosja może odbudować siły i spróbować jeszcze raz – ten sam cel, te same warunki zwycięstwa. Inne podboje pozostają zablokowane."
 OBR_tt_1:0 "Minął rok od klęski, Rosja nie jest w stanie wojny i nie rządzi nią władza pokojowa"
 OBR_d_druga_operacja:0 "Druga operacja mazurska"
 OBR_d_druga_operacja_desc:0 "Sztab przedstawia nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia."
 obr.20.t:0 "Rosja wraca na Mazury"
 obr.20.d:0 "Rok po klęsce rosyjskie kolumny znowu przekraczają granicę obwodu. Tym razem idą wolniej – i z większą liczbą dział."
 obr.20.a:0 "Bronimy się jak poprzednio."
 obr.21.t:0 "Druga operacja mazurska"
 obr.21.d:0 "Rosja rozpoczęła drugą próbę zajęcia Warmii, Mazur i Suwalszczyzny."
 obr.21.a:0 "Znowu."
 OBR_obrona:0 "Obrona Warmii, Mazur i Suwalszczyzny"
 OBR_obrona_desc:0 "Rosja przygotowuje operację z obwodu królewieckiego (najwcześniej w lutym 2028). Przygotowania wymagają czasu i władzy politycznej – nie zdążymy ze wszystkim.\n\nStan operacji: Rosja kontroluje §Y[?ROS.ROS_proc_kontroli|0]%§! regionów celu (dni walk §Y[?ROS.ROS_dni_wojny|0]§!, tygodnie przewagi §Y[?ROS.ROS_tyg_przewagi|0]§!/4).\n§YRosja wygrywa§!, jeśli przez 4 tygodnie z rzędu kontroluje co najmniej 75% regionów celu i wszystkie stolice (Olsztyn, Giżycko, Suwałki).\n§YObrona się udaje§!, jeśli po 300 dniach Rosja kontroluje mniej niż 40%, straci Królewiec, jej poparcie dla wojny spadnie poniżej 5% albo walki skończą się bez zdobyczy.\nŻadne zdarzenie nie wymusza kapitulacji – decyduje front."
 OBR_tt_2:0 "Efekt po 45 dniach przygotowań."
 OBR_d_jeziora:0 "Linia Wielkich Jezior"
 OBR_d_jeziora_desc:0 "Saperzy i ochotnicy kopią rowy i stawiają schrony między jeziorami: Mamry, Niegocin, Śniardwy. Kolumny z obwodu mają tylko kilka dróg – trzeba je zamknąć. Budowa trwa 45 dni."
 OBR_d_rezerwy:0 "Mobilizacja rezerw"
 OBR_d_rezerwy_desc:0 "Wezwania dla rezerwistów i ochotników. Szkolenie w lasach koło Orzysza i Bemowa Piskiego."
 OBR_tt_3:0 "Efekt po 30 dniach przygotowań."
 OBR_d_magazyny:0 "Magazyny i ochrona zaopatrzenia"
 OBR_d_magazyny_desc:0 "Magazyny paliwa i amunicji w lasach, patrole na drogach i mostach, zapasowe łącza. Zaopatrzenie ma przetrwać pierwsze tygodnie ofensywy. Przygotowania trwają 30 dni."
 OBR_d_teren:0 "Obrona w lasach i na bagnach"
 OBR_d_teren_desc:0 "Puszcza Piska, Borecka i Romincka, bagna Biebrzy – teren, który spowalnia każdą kolumnę. Jednostki ćwiczą zasadzki i obronę przepraw."
 OBR_d_dowodztwo:0 "Wspólne dowództwo mazurskie"
 OBR_d_dowodztwo_desc:0 "Sztaby Olsztyna, Giżycka i Suwałk uzgadniają jeden plan obrony i wspólną łączność. Sojusz mazurski powstaje przed wojną, nie w jej trakcie."
 OBR_d_rozpoznanie:0 "Rozpoznanie przy granicy obwodu"
 OBR_d_rozpoznanie_desc:0 "Drony, posterunki i łączność z mieszkańcami przy granicy. Wiemy, gdzie stoją kolumny, zanim ruszą."
 OBR_d_ochotnicy:0 "Ochotnicy z Podlasia"
 OBR_d_ochotnicy_desc:0 "Białystok wysyła ochotników i sprzęt do sąsiadów zaatakowanych przez Rosję. Nie wypowiadamy wojny – pomagamy tym, którzy się bronią."
 OBR_d_korytarz:0 "Korytarz zaopatrzenia z Białegostoku"
 OBR_d_korytarz_desc:0 "Ciężarówki z paliwem i amunicją jadą przez Augustów i Ełk. Sąsiedzi dostają zaopatrzenie, my – ryzyko, że Rosja to zapamięta."
 OBR_rezerwy:0 "Rezerwy powołane"
 OBR_rezerwy_desc:0 "Rezerwiści i ochotnicy w koszarach. Gospodarka odczuwa brak rąk do pracy."
 OBR_zaopatrzenie:0 "Magazyny w lasach"
 OBR_zaopatrzenie_desc:0 "Ukryte magazyny i ochrona dróg zaopatrzenia."
 OBR_teren:0 "Lasy, jeziora i bagna"
 OBR_teren_desc:0 "Jednostki wyszkolone do walki w terenie, który spowalnia każdą kolumnę."
 OBR_dowodztwo:0 "Wspólne dowództwo mazurskie"
 OBR_dowodztwo_desc:0 "Jeden plan obrony, wspólna łączność i koordynacja."
 OBR_rozpoznanie:0 "Rozpoznanie graniczne"
 OBR_rozpoznanie_desc:0 "Wiemy, gdzie stoją kolumny, zanim ruszą."
 OBR_korytarz:0 "Korytarz z Białegostoku"
 OBR_korytarz_desc:0 "Zaopatrzenie z Podlasia dociera do frontu."
 obr.10.t:0 "Ochotnicy z Podlasia"
 obr.10.d:0 "[From.GetName] przysyła ochotników i sprzęt. Dwie brygady stają w linii obok naszych żołnierzy."
 obr.10.a:0 "Dziękujemy."
