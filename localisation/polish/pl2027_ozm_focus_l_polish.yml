l_polish:
 OZM_01_godzina_zero:0 "Godzina Zero nad Ożarowem"
 OZM_01_godzina_zero_desc:0 "Warszawa nie odbiera telefonów. Ożarów musi sam zabezpieczyć kablownię, Bronisze i drogi do stolicy."
 OZM_02_urzad:0 "Tymczasowy urząd prezydenta"
 OZM_02_urzad_desc:0 "Burmistrz przyjmuje obowiązki prezydenta miasta-państwa – „do czasu przywrócenia łączności z Warszawą”."
 OZM_03_kablownia:0 "Kto pilnuje kablowni?"
 OZM_03_kablownia_desc:0 "Hale dawnej Fabryki Kabli to największy majątek miasta. Pilnować ich ma straż przemysłowa czy cywilny zarząd?"
 OZM_04_dk92:0 "Droga numer 92"
 OZM_04_dk92_desc:0 "Stara „poznańska” to jedyna pewna droga do Warszawy. Trzeba ją patrolować i utrzymać ruch."
 OZM_05_bronisze:0 "Bronisze muszą handlować"
 OZM_05_bronisze_desc:0 "Rynek hurtowy w Broniszach karmi pół Mazowsza. Jeśli przestanie handlować, Ożarów zgłodnieje pierwszy."
 OZM_06_echo:0 "Echo dawnej Rzeczypospolitej"
 OZM_06_echo_desc:0 "Sejm i Pałac przysyłają pełnomocników. Każdy chce, żeby Ożarów uznał jego władzę."
 OZM_07_kryzys:0 "Kryzys reprezentacji"
 OZM_07_kryzys_desc:0 "Rada miasta jest podzielona, a mieszkańcy pytają, kto ich właściwie reprezentuje. W piwnicach zaczyna grać muzyka, która ma odpowiedź."
 OZM_08_glosy:0 "Głosy zza ściany studia"
 OZM_08_glosy_desc:0 "W opuszczonym studiu przy hali działa Świebodzin Records. Ich nagrania słychać na każdym osiedlu."
 OZM_09_wieczor:0 "Ostatni wieczór normalności"
 OZM_09_wieczor_desc:0 "Jutro trzeba wybrać: urząd, który obiecuje porządek, albo studio, które obiecuje, że wszyscy zostaną usłyszani."
 OZM_10_nie_oddamy:0 "Nie oddamy urzędu"
 OZM_10_nie_oddamy_desc:0 "Burmistrz ogłasza, że władza w mieście nie przejdzie w ręce wytwórni ani serwera. Urząd zostaje urzędem."
 OZM_11_rada:0 "Rada nadzwyczajna"
 OZM_11_rada_desc:0 "Radni, dyrektorzy szkół i komendant straży tworzą radę nadzwyczajną przy burmistrzu."
 OZM_12_mieszkancy:0 "Mieszkańcy mają głos"
 OZM_12_mieszkancy_desc:0 "Rada obywatelska ma zbierać się co tydzień w hali sportowej."
 OZM_13_budzet:0 "Budżet kryzysowy"
 OZM_13_budzet_desc:0 "Miasto tnie inwestycje i kupuje żywność na zapas. Trzy miesiące bez głodu – za cenę wszystkiego innego."
 OZM_14_sluzby:0 "Służby miejskie"
 OZM_14_sluzby_desc:0 "Straż miejska, wodociągi i pogotowie pod jednym dowództwem kryzysowym."
 OZM_15_kontrakty:0 "Kontrakty z Broniszami"
 OZM_15_kontrakty_desc:0 "Miasto podpisuje stałe kontrakty z hurtownikami. Dostawy przestają zależeć od dobrej woli."
 OZM_16_pakt:0 "Pakt gmin zachodnich"
 OZM_16_pakt_desc:0 "Ożarów proponuje sąsiednim gminom wspólne patrole i wymianę towarów."
 OZM_17_sejm:0 "Rozmowy z Sejmem"
 OZM_17_sejm_desc:0 "Ożarów uznaje Sejm za prawowitą władzę – w zamian za gwarancje dla miasta."
 OZM_18_palac:0 "Kanał do Pałacu"
 OZM_18_palac_desc:0 "Ożarów utrzymuje łączność z Kancelarią Prezydenta. Pałac obiecuje osłonę wojskową zachodniej bramy."
 OZM_19_neutralnosc:0 "Neutralność zachodniego Mazowsza"
 OZM_19_neutralnosc_desc:0 "Ożarów nie wybiera między blokami Warszawy. Broni się sam i handluje ze wszystkimi."
 OZM_20_konstytucja:0 "Konstytucja Ożarowska"
 OZM_20_konstytucja_desc:0 "Tymczasowy urząd zamienia się w Republikę Ożarowską: konstytucja, rada i kadencyjny prezydent."
 OZM_21_sady:0 "Sądy i komisje arbitrażowe"
 OZM_21_sady_desc:0 "Spory o magazyny i długi rozstrzygają komisje arbitrażowe zamiast „ochrony”. Szara strefa się kurczy."
 OZM_22_referendum:0 "Referendum o przyszłości"
 OZM_22_referendum_desc:0 "Mieszkańcy zdecydują, czy Republika ma trwać samodzielnie. Wynik nie jest przesądzony."
 OZM_23_samorzad:0 "Samorząd po rozpadzie"
 OZM_23_samorzad_desc:0 "Rady osiedli dostają budżety i dyżury radnych. Władza bliżej ludzi – i trudniej ją zmobilizować do wojny."
 OZM_24_brama:0 "Zachodnia Brama Warszawy"
 OZM_24_brama_desc:0 "Ożarów ogłasza, że będzie strzegł szlaków na zachód od stolicy – bez roszczeń do cudzych ziem."
 OZM_25_bemowo:0 "Bezpieczne przejścia na Bemowo"
 OZM_25_bemowo_desc:0 "Korytarz dla mieszkańców i ciężarówek do zachodnich dzielnic Warszawy – porozumienie albo sankcje, zależnie od tego, kto rządzi po drugiej stronie."
 OZM_26_twierdza:0 "Twierdza Ożarów"
 OZM_26_twierdza_desc:0 "Plany umocnień wokół węzła autostrad. Każdy etap kosztuje – decyzja „Umocnienia zachodniej bramy”."
 OZM_27_tranzyt:0 "Umowa o tranzycie"
 OZM_27_tranzyt_desc:0 "Tranzyt przez węzeł A2/S8 dla sąsiada, który podpisze umowę – opłaty i ochrona konwojów."
 OZM_28_straz:0 "Straż obywatelska"
 OZM_28_straz_desc:0 "Ochotnicze kompanie z każdego osiedla. Bezpieczniej na ulicach – mniej rąk w halach."
 OZM_29_naczelnik:0 "Odpowiedzialny naczelnik"
 OZM_29_naczelnik_desc:0 "Republika musi wybrać styl rządzenia: technokratyczny, wyborczy albo kryzysowy."
 OZM_30_konferencja:0 "Konferencja zachodniego Mazowsza"
 OZM_30_konferencja_desc:0 "Ożarów zaprasza sąsiadów do wspólnego sojuszu obronnego. Żadnej aneksji – tylko sojusz z wolnej woli."
 OZM_31_republika:0 "Republika przetrwała"
 OZM_31_republika_desc:0 "Ożarów przetrwał rozpad jako mała, nudna i sprawna republika. Dla wielu to najlepsze zakończenie."
 OZM_32_studio:0 "Piwniczne studio"
 OZM_32_studio_desc:0 "Burmistrz pozwala wytwórni korzystać z opuszczonej hali. Studio szybko staje się najważniejszym miejscem w mieście."
 OZM_33_archiwum:0 "#SxmmerSZN: Archiwum Sxmmersosy"
 OZM_33_archiwum_desc:0 "Archiwalne nagrania wytwórni krążą po mieście. Promocja czy zbiórka pieniędzy?"
 OZM_34_telefon:0 "Wazon odbiera telefon"
 OZM_34_telefon_desc:0 "Do studia dzwoni urząd. Odbiera Yungwazon – i od tej rozmowy zależy, czy wytwórnia będzie z urzędem współpracować."
 OZM_35_serwer:0 "SERWER"
 OZM_35_serwer_desc:0 "Kanał głosowy wytwórni rośnie do tysięcy członków. Moderacja, role, awarie – serwer staje się osobną instytucją."
 OZM_36_kawka:0 "KAWKA"
 OZM_36_kawka_desc:0 "Poranne spotkania przy kawie dla młodych z osiedli. Wytwórnia słucha, urząd się przygląda."
 OZM_37_nie_gadaj:0 "NIE GADAJ 2"
 OZM_37_nie_gadaj_desc:0 "Kampania wytwórni przeciw „urzędowi, który nic nie słyszy”."
 OZM_38_moja_tura:0 "MOJA TURA"
 OZM_38_moja_tura_desc:0 "Ze środowiska fanów powstaje organizacja: struktury, rzecznicy i program dla miasta."
 OZM_39_topka:0 "TOPKA"
 OZM_39_topka_desc:0 "Wytwórnia jest w topce całego Mazowsza. Fani zgłaszają się do lokalnych formacji."
 OZM_40_koncert:0 "Koncert na zachodniej bramie"
 OZM_40_koncert_desc:0 "Wielki koncert przy węźle autostrad. Sukces podniesie zasięgi, porażka skończy się zamieszkami."
 OZM_41_diss:0 "Diss na urząd"
 OZM_41_diss_desc:0 "Wytwórnia wydaje numer o urzędzie. Urząd odpowiada komunikatem. Spór propagandowy zaczyna żyć własnym życiem."
 OZM_42_komentarze:0 "Wojna na komentarze"
 OZM_42_komentarze_desc:0 "Urząd i wytwórnia walczą o każdą grupę osiedlową."
 OZM_43_ref_serwer:0 "Referendum przez serwer"
 OZM_43_ref_serwer_desc:0 "Wytwórnia żąda głosowania: kto ma rządzić Ożarowem? Głosują wszyscy mieszkańcy – przez serwer albo w urnie."
 OZM_44_mikrofon:0 "Records przejmuje mikrofon"
 OZM_44_mikrofon_desc:0 "Referendum wygrane. Urząd przekazuje władzę – Ożarów staje się Republiką Świebodzin Records."
 OZM_45_rzad_wazona:0 "Rząd Yungwazona"
 OZM_45_rzad_wazona_desc:0 "Wytwórnia uczy się rządzić: sekretariat, budżet i dyżury. Zaczyna się profesjonalna administracja."
 OZM_46_minister:0 "Sxmmersosa ministrem kultury"
 OZM_46_minister_desc:0 "Resort kultury przejmuje człowiek z wytwórni. Każdy komunikat rządu ma premierę."
 OZM_47_nie_chicago:0 "TO ŚWIEBODZIN NIE CHICAGO"
 OZM_47_nie_chicago_desc:0 "Ożarów nie da się wciągnąć w spory wielkich miast. Rząd stawia na własną drogę."
 OZM_48_nigdy_wiecej:0 "NIGDY WIĘCEJ CHLANIA"
 OZM_48_nigdy_wiecej_desc:0 "Program naprawy administracji: kontrole, jawne delegacje i koniec biesiad w urzędzie."
 OZM_49_tlen:0 "POTRZEBUJĘ TLENU"
 OZM_49_tlen_desc:0 "Smog i przerwy w dostawach prądu. Elektrociepłownia i sieć muszą dostać pieniądze."
 OZM_50_kraj_serwer:0 "Kraj na SERWERZE"
 OZM_50_kraj_serwer_desc:0 "Konsultacje społeczne przenoszą się na kanały głosowe. Więcej władzy – i więcej ryzyka, gdy serwer pada."
 OZM_51_topka_final:0 "JESZCZE RAZ: Państwo w TOPCE"
 OZM_51_topka_final_desc:0 "Yungwazon zostaje przywódcą na dobre, a Ożarów – muzyczną republiką. Koniec przejściowych rządów."
 OZM_52_slady:0 "Na śladach 66-200"
 OZM_52_slady_desc:0 "Na starych taśmach słychać sygnał z zachodu i numer kierunkowy Świebodzina. Część wytwórni wyrusza tropem tej transmisji."
 OZM_53_souljah:0 "ŚWIEBODZIN SOULJAH"
 OZM_53_souljah_desc:0 "Ochrona transmisji: wymyślony przez wytwórnię zakon strażników przekaźników."
 OZM_54_kasa:0 "ONI NIE ROBIĄ TEJ KASY"
 OZM_54_kasa_desc:0 "Tajne przedsięwzięcie pożera budżet. Pieniądze idą na nadajniki, nie na sklepy."
 OZM_55_bejem:0 "JESTEM BEJEM"
 OZM_55_bejem_desc:0 "Wytwórnia musi zdecydować: grać mit do końca czy przywrócić racjonalną kontrolę nad projektem."
 OZM_56_cztery:0 "4 GRAMY"
 OZM_56_cztery_desc:0 "Utracony master nagrania ma cztery części. Każda leży gdzie indziej: w kablowni, na Broniszach, w urzędzie i na serwerze."
 OZM_57_glos:0 "Głos zza miasta"
 OZM_57_glos_desc:0 "Tajemnicza transmisja słychać w każdym radiu. Mieszkańcy przestają ufać komunikatom rządu."
 OZM_58_nadajnik:0 "Nadajnik Świebodziński"
 OZM_58_nadajnik_desc:0 "Nadajnik na dachu kablowni: wymaga energii, fabryki i słuchaczy."
 OZM_59_rytual:0 "Rytuał wielkiego odsłuchu"
 OZM_59_rytual_desc:0 "Wielki odsłuch na placu przy kablowni: trzy etapy, każdy może się nie udać."
 OZM_60_przywolac:0 "Przywołać Świebodzina"
 OZM_60_przywolac_desc:0 "Sygnał jest pełny. Na scenie stoi ktoś, kogo nikt nie zaprosił – Świebodzin we własnej osobie."
 OZM_61_wszedzie:0 "Świebodzin jest wszędzie"
 OZM_61_wszedzie_desc:0 "Każdy przekaźnik nadaje ten sam sygnał. Sąsiedzi patrzą z niepokojem – a Ożarów patrzy dalej."
 OZM_62_kabel:0 "Ożarowski kabel"
 OZM_62_kabel_desc:0 "Zakłady dawnej Fabryki Kabli ruszają na nowo – produkcja albo modernizacja dróg dojazdowych."
 OZM_63_warzywa:0 "Warzywa z Bronisz"
 OZM_63_warzywa_desc:0 "Rynek hurtowy dostaje ochronę i paliwo. Miasto ma jedzenie i towar na wymianę."
 OZM_64_wezel:0 "Węzeł A2 i S8"
 OZM_64_wezel_desc:0 "Remont węzła autostrad: drogo, ale wojsko i ciężarówki pojadą szybciej."
 OZM_65_kablownia_studio:0 "Kablownia czy studio?"
 OZM_65_kablownia_studio_desc:0 "Hala może znów produkować – albo stać się największym studiem i centrum propagandy zachodniego Mazowsza."
 OZM_66_plakaty:0 "Papier, tusz i plakaty"
 OZM_66_plakaty_desc:0 "Drukarnia przy hali: plakaty wytwórni albo neutralne ogłoszenia miejskie."
 OZM_67_magazyny:0 "Zachodnie magazyny"
 OZM_67_magazyny_desc:0 "Centra logistyczne przy drodze na Poznań pracują dla miasta. Konwoje z Bronisz dowożą więcej."
 OZM_68_prad:0 "Prąd dla nadajnika"
 OZM_68_prad_desc:0 "Stała linia zasilania z podstacji. Przyda się halom – i każdemu, kto chciałby nadawać daleko."
 OZM_69_kultura:0 "Przemysł kultury i przetrwania"
 OZM_69_kultura_desc:0 "Gospodarka małego miasta, które nauczyło się żyć samo – inna w republice, inna pod wytwórnią."
 OZM_70_obrona:0 "Ochotnicza obrona Ożarowa"
 OZM_70_obrona_desc:0 "Mała formacja z ochotników: magazynierów, kierowców i strażaków."
 OZM_71_patrole:0 "Patrole na DK92"
 OZM_71_patrole_desc:0 "Stałe patrole na „poznańskiej”. Mniej przemytu, wyższe rachunki."
 OZM_72_radiowezel:0 "Radiowęzeł obrony"
 OZM_72_radiowezel_desc:0 "Kto ma łączność, ten dowodzi. Państwowa sieć czy sieć wytwórni?"
 OZM_73_posterunki:0 "Posterunki zachodniej bramy"
 OZM_73_posterunki_desc:0 "Pozycje obronne na granicach gminy."
 OZM_74_wojna_brama:0 "Wojna o zachodnią bramę"
 OZM_74_wojna_brama_desc:0 "Gdy rozpad wejdzie w fazę wojen, Ożarów może upomnieć się o drogi zachodniego Mazowsza – siłą, nie darmową aneksją."
 OZM_75_warszawa:0 "Kto rządzi Warszawą?"
 OZM_75_warszawa_desc:0 "Rozstrzygnięcie w stolicy zmienia wszystko. Ożarów musi ułożyć się ze zwycięzcą – albo się mu przeciwstawić."
