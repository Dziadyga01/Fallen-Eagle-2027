l_polish:
 OZM_dobry_sasiad:0 "Pakt gmin zachodnich"
 OZM_porozumienie:0 "Porozumienie z Ożarowem"
 OZM_niepokoj:0 "Niepokój z powodu Świebodzina"
 OZM_kanal:0 "Kanał do Ożarowa"
 OZM_panel_mod:0 "Ożarów między urzędem a studiem"
 OZM_panel_mod_desc:0 "Legitymizacja administracji §Y[?OZM_legit|0]§!/100 · Zasięgi Records §Y[?OZM_zasiegi|0]§!/100 · Dostawy Bronisz §Y[?OZM_dostawy|0]§!/100.\nWysoka legitymizacja daje stabilność, zasięgi – władzę polityczną, a braki w dostawach podnoszą koszt towarów konsumpcyjnych."
 OZM_paraliz:0 "Paraliż władzy"
 OZM_paraliz_desc:0 "Urząd nie ma zaufania mieszkańców, a studio straciło słuchaczy. Nikt nie rządzi – decyzje zapadają na parkingach hurtowni."
 OZM_tt_legit5:0 "Legitymizacja administracji: §G+5§!"
 ozm.23.t:0 "Nikt nie rządzi Ożarowem"
 ozm.23.d:0 "Urzędnicy nie przychodzą do pracy, a koncerty odbywają się przy pustych placach. Legitymizacja §Y[?OZM_legit|0]§!, zasięgi §Y[?OZM_zasiegi|0]§!. Ożarów przetrwa – ale jako miasto bez władzy, z którym nikt nie musi się liczyć."
 ozm.23.a:0 "Przeczekać."
 OZM_yungwazon:0 "Yungwazon"
 OZM_swiebodzin:0 "Świebodzin"
 OZM_urzad_tymczasowy:0 "Tymczasowy urząd"
 OZM_urzad_tymczasowy_desc:0 "Burmistrz pełni obowiązki prezydenta miasta-państwa. Wszystko jest „do odwołania” – także on."
 OZM_brama:0 "Zachodnia Brama Warszawy"
 OZM_brama_desc:0 "Kto trzyma Ożarów, trzyma drogę na Poznań i węzeł autostrad. Ożarów nie żąda ziem – pilnuje szlaków."
 OZM_neutralnosc:0 "Neutralność zachodniego Mazowsza"
 OZM_neutralnosc_desc:0 "Ożarów nie wybiera między Sejmem a Pałacem. Broni się sam i handluje ze wszystkimi."
 OZM_samorzad:0 "Samorząd po rozpadzie"
 OZM_samorzad_desc:0 "Rady osiedli, budżet obywatelski i dyżury radnych. Władza jest blisko – i mobilizacja wymaga zgody."
 OZM_republika:0 "Republika przetrwała"
 OZM_republika_desc:0 "Ożarów ma konstytucję, sądy i wybory. Nie rośnie, ale się nie rozpada."
 OZM_straz:0 "Straż obywatelska"
 OZM_straz_desc:0 "Ochotnicy pilnują hal i skrzyżowań. Bezpieczniej – ale ktoś musi zastąpić ich w pracy."
 OZM_patrole:0 "Patrole na DK92"
 OZM_patrole_desc:0 "Mniej przemytu, więcej rachunków za paliwo i nadgodziny."
 OZM_bronisze:0 "Warzywa z Bronisz"
 OZM_bronisze_desc:0 "Rynek hurtowy pracuje od świtu. Miasto ma jedzenie – i towar na wymianę."
 OZM_nie_chicago:0 "To Świebodzin, nie Chicago"
 OZM_nie_chicago_desc:0 "Ożarów nie da się wciągnąć w spory wielkich miast. Odporny na presję – ale handel z metropoliami słabnie."
 OZM_minister_kultury:0 "Sxmmersosa ministrem kultury"
 OZM_minister_kultury_desc:0 "Resort kultury prowadzi człowiek z wytwórni. Komunikaty rządu brzmią jak zapowiedzi premier."
 OZM_nigdy_wiecej:0 "Program „Nigdy więcej chlania”"
 OZM_nigdy_wiecej_desc:0 "Koniec biesiad w urzędzie: kontrole, jawne delegacje i kary za nadużycia. Administracja trzeźwieje."
 OZM_serwer_kraj:0 "Kraj na SERWERZE"
 OZM_serwer_kraj_desc:0 "Konsultacje społeczne odbywają się na kanale głosowym. Szybko i tanio – dopóki serwer działa."
 OZM_topka:0 "Państwo w TOPCE"
 OZM_topka_desc:0 "Ożarów jest muzyczną republiką: rząd ma wytwórnię, wytwórnia ma rząd. Propaganda działa jak hit radiowy."
 OZM_swiebodzin_idea:0 "Świebodzin jest wszędzie"
 OZM_swiebodzin_idea_desc:0 "Na każdym przekaźniku ten sam sygnał. Mieszkańcy śpiewają, sąsiedzi się niepokoją, a koszty społeczne rosną."
 OZM_kultura:0 "Przemysł kultury i przetrwania"
 OZM_kultura_desc:0 "Hale kablowni produkują i kable, i koncerty. Gospodarka małego miasta, które nauczyło się żyć samo."
 OZM_toksyczny_smog:0 "POTRZEBUJĘ TLENU"
 OZM_toksyczny_smog_desc:0 "Przerwy w dostawach prądu i smog nad halami. Elektrociepłownia musi dostać inwestycje."
 OZM_topka_ochotnicy:0 "TOPKA: ochotnicy"
 OZM_topka_ochotnicy_desc:0 "Fani zgłaszają się do służby w lokalnych formacjach."
 OZM_panel:0 "Ożarów: urząd, Bronisze i SERWER"
 OZM_panel_desc:0 "Miasto-państwo na zachodniej bramie Warszawy.\n§YLegitymizacja administracji§!: [?OZM_legit|0]/100 – spada od strajków, kryzysów dostaw i kampanii Records.\n§YZasięgi Records§!: [?OZM_zasiegi|0]/100 – rosną od koncertów, nagrań i SERWERA.\n§YDostawy Bronisz§!: [?OZM_dostawy|0]/100 – co miesiąc maleją; duży deficyt kosztuje stabilność.\n[OZM_sygnal_tekst]"
 OZM_sygnal_jest:0 "§YSygnał Świebodzina§!: [?OZM_sygnal|0]/100 – tylko na drodze przywołania."
 OZM_sygnal_brak:0 ""
 OZM_tt_zasiegi8:0 "Zasięgi Records: §G+8§!"
 OZM_d_koncert:0 "Siedmiodniowy koncert"
 OZM_d_koncert_desc:0 "Scena na parkingu przy hali, tydzień grania i transmisje na żywo. Przy pustych magazynach tłum łatwo zamienia się w zamieszki."
 OZM_tt_zasiegi5:0 "Zasięgi Records: §G+5§!"
 OZM_d_singiel:0 "Wydanie singla"
 OZM_d_singiel_desc:0 "Nowy numer z piwnicznego studia trafia do sieci o północy."
 OZM_d_serwer:0 "Reorganizacja SERWERA"
 OZM_d_serwer_desc:0 "Nowi moderatorzy, kopie zapasowe i jasne zasady kanałów. Przez trzy miesiące awarie są rzadsze."
 OZM_tt_dostawy15:0 "Dostawy Bronisz: §G+15§!"
 OZM_tt_dostawy5:0 "Dostawy Bronisz: §G+5§!"
 OZM_d_bronisze:0 "Dostawy z Bronisz"
 OZM_d_bronisze_desc:0 "Konwój z rynku hurtowego: warzywa, owoce i paliwo dla piekarni."
 OZM_tt_legit6_zasiegim3:0 "Legitymizacja administracji: §G+6§!, Zasięgi Records: §R-3§!"
 OZM_d_debata:0 "Debata w urzędzie"
 OZM_d_debata_desc:0 "Burmistrz odpowiada na pytania mieszkańców na otwartej sesji rady. Fani studia mówią, że to nudne."
 OZM_tt_sygnal15:0 "Sygnał Świebodzina: §G+15§!"
 OZM_d_przekaznik:0 "Naprawa przekaźnika"
 OZM_d_przekaznik_desc:0 "Technicy rozbierają stary przekaźnik na dachu kablowni. Przez miesiąc jedna fabryka pracuje tylko dla nich."
 OZM_tt_sygnal10:0 "Sygnał Świebodzina: §G+10§!"
 OZM_tt_1:0 "Zasięgi Records: co najmniej §Y50§!"
 OZM_tt_2:0 "Dostawy Bronisz: co najmniej §Y50§!"
 OZM_tt_sygnalm5:0 "Sygnał Świebodzina: §R-5§!"
 OZM_d_czestotliwosc:0 "Odzyskać świebodzińską częstotliwość"
 OZM_d_czestotliwosc_desc:0 "Głos z zachodu słychać tylko przy pełnej sieci i pełnych magazynach. Mamy 60 dni, żeby utrzymać jedno i drugie."
 OZM_d_umocnienia:0 "Umocnienia zachodniej bramy"
 OZM_d_umocnienia_desc:0 "Zapory betonowe i stanowiska przy węźle autostrad."
 OZM_tt_3:0 "Zasięgi Records: co najmniej §Y60§!"
 OZM_d_powtorz_ref:0 "Nowe głosowanie na SERWERZE"
 OZM_d_powtorz_ref_desc:0 "Pierwsze referendum przegrane. Records może spróbować jeszcze raz – drożej."
 OZM_tt_4:0 "Sygnał Świebodzina: co najmniej §Y80§!"
 OZM_d_jeszcze_raz:0 "JESZCZE RAZ: powtórzyć wielki odsłuch"
 OZM_d_jeszcze_raz_desc:0 "Odsłuch się nie udał, ale sygnał wciąż słychać. Jedna, ostatnia próba – za wysoką cenę."
 OZM_tt_zasiegi4_legitm1:0 "Zasięgi Records: §G+4§!, Legitymizacja administracji: §R-1§!"
 OZM_tt_zasiegi6_legitm2:0 "Zasięgi Records: §G+6§!, Legitymizacja administracji: §R-2§!"
 OZM_d_memy:0 "Fala memów"
 OZM_d_memy_desc:0 "Grafiki z burmistrzem w roli bohatera kreskówki krążą po wszystkich grupach osiedlowych."
 OZM_d_live:0 "Live do rana"
 OZM_d_live_desc:0 "Trzygodzinna transmisja z komentarzami na żywo. Czat odpowiada szybciej niż urząd."
 OZM_d_exclusive:0 "Ekskluzywny materiał"
 OZM_d_exclusive_desc:0 "Wytwórnia zapowiada „materiał, którego nikt jeszcze nie słyszał”."
 OZM_d_porozumienie:0 "Regionalne porozumienie"
 OZM_d_porozumienie_desc:0 "Wspólne patrole, przepustki dla ciężarówek i gorąca linia między urzędami."
 OZM_tt_legit3:0 "Legitymizacja administracji: §G+3§!"
 OZM_tt_legitm1:0 "Legitymizacja administracji: §R-1§!"
 ozm.30.t:0 "Propozycja z Ożarowa"
 ozm.30.d:0 "[From.GetName] proponuje porozumienie: wspólne patrole na drogach, przepustki dla transportów z Bronisz i gorącą linię między urzędami."
 ozm.30.a:0 "Podpisujemy."
 ozm.30.b:0 "Nie teraz."
 OZM_tree:0 "Ożarów Mazowiecki: urząd i studio"
 OZM_tt_5:0 "Misja: w ciągu 60 dni podnieś §YDostawy Bronisz§! do 70 – sukces da §G+5§! legitymizacji."
 OZM_tt_legit5_zasiegim5:0 "Legitymizacja administracji: §G+5§!, Zasięgi Records: §R-5§!"
 OZM_tt_dostawy10:0 "Dostawy Bronisz: §G+10§!"
 OZM_tt_legit4:0 "Legitymizacja administracji: §G+4§!"
 OZM_tt_6:0 "Istnieje Sejm (Warszawa)"
 OZM_tt_7:0 "Istnieje Kancelaria Prezydenta (Warszawa)"
 OZM_tt_legit8:0 "Legitymizacja administracji: §G+8§!"
 OZM_tt_8:0 "Odblokowuje decyzję §YUmocnienia zachodniej bramy§!."
 OZM_tt_9:0 "Sąsiad o dobrych relacjach (opinia powyżej 19)"
 OZM_tt_legit10:0 "Legitymizacja administracji: §G+10§!"
 OZM_tt_10:0 "Odblokowuje decyzję §YReorganizacja SERWERA§!. Bez niej serwer co jakiś czas się kłóci."
 OZM_tt_zasiegi4:0 "Zasięgi Records: §G+4§!"
 OZM_tt_zasiegi10_legitm5:0 "Zasięgi Records: §G+10§!, Legitymizacja administracji: §R-5§!"
 OZM_tt_11:0 "Zasięgi Records: co najmniej §Y40§!"
 OZM_tt_12:0 "Odblokowuje trzy decyzje medialne w panelu."
 OZM_tt_13:0 "Referendum przez serwer wygrane"
 OZM_tt_zasiegim5:0 "Zasięgi Records: §R-5§!"
 OZM_tt_14:0 "Zasięgi Records: co najmniej §Y70§!"
 OZM_tt_15:0 "Ukończony fokus „Prąd dla nadajnika”"
 OZM_tt_16:0 "Rządzi Yungwazon albo rząd Records"
 OZM_tt_17:0 "Nie trwa wojna domowa"
 OZM_tt_sygnal5:0 "Sygnał Świebodzina: §G+5§!"
 OZM_tt_18:0 "Odnaleziono wszystkie §Ycztery części mastera§!."
 OZM_tt_sygnal15_legitm5:0 "Sygnał Świebodzina: §G+15§!, Legitymizacja administracji: §R-5§!"
 OZM_tt_19:0 "Odblokowuje misję §YOdzyskać świebodzińską częstotliwość§!."
 OZM_tt_20:0 "Co najmniej 2 fabryki cywilne"
 OZM_tt_21:0 "Wielki odsłuch zakończony sukcesem"
 OZM_tt_zasiegi6:0 "Zasięgi Records: §G+6§!"
 OZM_tt_22:0 "Decyzja §YDostawy z Bronisz§! daje §G+5§! dostaw więcej."
 OZM_tt_23:0 "Sąsiednie państwo polskie bez dobrych relacji z nami"
 OZM_budzet_kryzysowy:0 "Budżet kryzysowy"
 OZM_budzet_kryzysowy_desc:0 "Żywność na zapas, inwestycje wstrzymane."
 OZM_sluzby:0 "Służby miejskie"
 OZM_sluzby_desc:0 "Jedno dowództwo kryzysowe dla straży, wodociągów i pogotowia."
 OZM_tranzyt:0 "Umowa o tranzycie"
 OZM_tranzyt_desc:0 "Opłaty tranzytowe i ochrona konwojów przez węzeł A2/S8."
 OZM_koszty_nadajnika:0 "Koszty nadajnika"
 OZM_koszty_nadajnika_desc:0 "Pieniądze idą na przekaźniki, nie na sklepy."
 OZM_hala_propaganda:0 "Hala studio"
 OZM_hala_propaganda_desc:0 "Największe studio zachodniego Mazowsza i centrum propagandy."
 OZM_rzad_technokratow:0 "Naczelnik technokrata"
 OZM_rzad_technokratow_desc:0 "Rządzą fachowcy z urzędu i firm logistycznych."
 OZM_rzad_wyborczy:0 "Naczelnik z wyboru"
 OZM_rzad_wyborczy_desc:0 "Kadencja, wybory i rozliczenie przed radą."
 OZM_rzad_kryzysowy:0 "Naczelnik kryzysowy"
 OZM_rzad_kryzysowy_desc:0 "Szybkie decyzje, mniej konsultacji."
 OZM_konferencja:0 "Konferencja Zachodniego Mazowsza"
 OZM_tt_legit2_zasiegi2:0 "Legitymizacja administracji: §G+2§!, Zasięgi Records: §G+2§!"
 ozm.1.t:0 "Godzina Zero w Ożarowie"
 ozm.1.d:0 "Łączność z Warszawą zerwana, autobusy stoją w zajezdni, a w urzędzie zbiera się sztab kryzysowy. Ożarów jest sam – i musi zdecydować, co robić."
 ozm.1.a:0 "Zabezpieczyć drogi i magazyny."
 ozm.1.b:0 "Zwołać mieszkańców przed urzędem."
 OZM_tt_legitm3:0 "Legitymizacja administracji: §R-3§!"
 ozm.2.t:0 "Na Broniszach brakuje dostaw"
 ozm.2.d:0 "Dostawy Bronisz spadły do §Y[?OZM_dostawy|0]§!. Hurtownicy chcą zaliczek, kolejki rosną."
 ozm.2.a:0 "Zapłacić hurtownikom."
 ozm.2.b:0 "Nie mamy z czego."
 OZM_tt_zasiegi3:0 "Zasięgi Records: §G+3§!"
 OZM_tt_zasiegim4_legitm2:0 "Zasięgi Records: §R-4§!, Legitymizacja administracji: §R-2§!"
 OZM_tt_zasiegi2_legit2:0 "Zasięgi Records: §G+2§!, Legitymizacja administracji: §G+2§!"
 ozm.3.t:0 "Pierwszy klip Records"
 ozm.3.d:0 "Klip wytwórni ma więcej wyświetleń niż wszystkie komunikaty urzędu razem. Jak reaguje burmistrz?\n\n§Y(Fabuła moda – fikcyjna, satyryczna alternatywna historia. Postacie nie są opisem prawdziwych osób ani ich działań.)§!"
 ozm.3.a:0 "Z dystansem."
 ozm.3.b:0 "Cenzura – zdjąć z miejskich ekranów."
 ozm.3.c:0 "Zaprosić wytwórnię na rozmowę."
 OZM_tt_zasiegi2_legit3:0 "Zasięgi Records: §G+2§!, Legitymizacja administracji: §G+3§!"
 ozm.4.t:0 "Yungwazon odbiera telefon"
 ozm.4.d:0 "Urząd dzwoni do studia. Yungwazon może być rzecznikiem, producentem albo strategiem wytwórni – i od tego zależy ton całej kampanii.\n\n§Y(Fabuła moda – fikcyjna, satyryczna alternatywna historia. Postacie nie są opisem prawdziwych osób ani ich działań.)§!"
 ozm.4.a:0 "Rzecznik – twarz kampanii."
 ozm.4.b:0 "Producent – najpierw nagrania."
 ozm.4.c:0 "Strateg – rozmowy z urzędem."
 OZM_tt_zasiegim2_legitm4:0 "Zasięgi Records: §R-2§!, Legitymizacja administracji: §R-4§!"
 ozm.5.t:0 "Kłótnia na SERWERZE"
 ozm.5.d:0 "Moderatorzy pokłócili się o zasady, kanały znikają, a połowa członków przenosi się gdzie indziej."
 ozm.5.a:0 "Przeczekać."
 ozm.5.b:0 "Uciszyć kłótnię decyzją urzędu."
 OZM_tt_zasiegi14:0 "Zasięgi Records: §G+14§!"
 ozm.6.t:0 "Koncert pod Warszawą"
 ozm.6.d:0 "Tłum na parkingach przy węźle autostrad. Zabezpieczyć teren czy postawić wszystko na promocję?"
 ozm.6.a:0 "Zabezpieczenia i wolontariusze."
 ozm.6.b:0 "Promocja – im więcej ludzi, tym lepiej."
 OZM_tt_zasiegi8_legitm5:0 "Zasięgi Records: §G+8§!, Legitymizacja administracji: §R-5§!"
 OZM_tt_zasiegi3_legit2:0 "Zasięgi Records: §G+3§!, Legitymizacja administracji: §G+2§!"
 ozm.7.t:0 "Diss i kontrdiss"
 ozm.7.d:0 "Wytwórnia wydaje numer o urzędzie, urząd odpowiada komunikatem. Mieszkańcy liczą punkty: legitymizacja §Y[?OZM_legit|0]§!, zasięgi §Y[?OZM_zasiegi|0]§!.\n\n§Y(Fabuła moda – fikcyjna, satyryczna alternatywna historia. Postacie nie są opisem prawdziwych osób ani ich działań.)§!"
 ozm.7.a:0 "Oddać pole wytwórni."
 ozm.7.b:0 "Odpowiedzieć konkretami z urzędu."
 ozm.8.t:0 "Serwer żąda referendum"
 ozm.8.d:0 "Głosowanie o władzy w mieście. Records wygra, jeśli ma co najmniej 60 zasięgów, więcej zasięgów niż legitymizacji urząd, a stabilność jest co najmniej 30%."
 ozm.8.a:0 "Liczymy głosy."
 ozm.44.t:0 "Referendum wygrane"
 ozm.44.d:0 "Większość mieszkańców chce rządów wytwórni. Urząd zapowiada pokojowe przekazanie władzy."
 ozm.44.a:0 "Oddajemy mikrofon."
 OZM_tt_zasiegim10_legit4:0 "Zasięgi Records: §R-10§!, Legitymizacja administracji: §G+4§!"
 ozm.45.t:0 "Referendum przegrane"
 ozm.45.d:0 "Mieszkańcy zostają przy urzędzie. Wytwórnia traci zasięgi – i myśli o kolejnym głosowaniu."
 ozm.45.a:0 "Kryzys polityczny."
 ozm.9.t:0 "Z Ożarowa do Świebodzina"
 ozm.9.d:0 "Na mapie zachodniej Polski pojawiają się punkty: stare nadajniki, które od lat milczały. Teraz każdy z nich szumi.\n\n§Y(Fabuła moda – fikcyjna, satyryczna alternatywna historia. Postacie nie są opisem prawdziwych osób ani ich działań.)§!"
 ozm.9.a:0 "Jedziemy tropem sygnału."
 OZM_tt_sygnal5_legitm2:0 "Sygnał Świebodzina: §G+5§!, Legitymizacja administracji: §R-2§!"
 OZM_tt_legit2:0 "Legitymizacja administracji: §G+2§!"
 ozm.10.t:0 "Sygnał 66-200"
 ozm.10.d:0 "Źródło głosu jest niepewne: stary przekaźnik, czyjś żart, a może coś więcej. Technicy się kłócą, fani słuchają."
 ozm.10.a:0 "Słuchać dalej."
 ozm.10.b:0 "Zachować ostrożność."
 ozm.11.t:0 "Wielki odsłuch: pierwsza strona taśmy"
 ozm.11.d:0 "Plac przy kablowni, tysiące ludzi i cisza przed pierwszym utworem. Każdy etap może się nie udać."
 ozm.11.a:0 "Gramy."
 ozm.26.t:0 "Wielki odsłuch: druga strona"
 ozm.26.d:0 "Sąsiedzi wysyłają obserwatorów, a ktoś próbuje zagłuszać nadajnik. Sygnał trzeszczy."
 ozm.26.a:0 "Podkręcić moc."
 ozm.27.t:0 "Wielki odsłuch: ostatni utwór"
 ozm.27.d:0 "Ostatni utwór gra na całej częstotliwości. Przy pełnych magazynach ludzie zostaną do końca."
 ozm.27.a:0 "Do końca."
 OZM_tt_sygnalm30_zasiegim10:0 "Sygnał Świebodzina: §R-30§!, Zasięgi Records: §R-10§!"
 ozm.28.t:0 "Odsłuch przerwany"
 ozm.28.d:0 "Prąd siadł, tłum się rozchodzi, a sygnał cichnie. Projekt nie upadł – ale cofnął się daleko."
 ozm.28.a:0 "Spróbujemy jeszcze raz."
 ozm.20.t:0 "JESZCZE RAZ"
 ozm.20.d:0 "Druga i ostatnia próba wielkiego odsłuchu. Jeśli się nie uda, droga przywołania się zamknie."
 ozm.20.a:0 "Gramy jeszcze raz."
 ozm.12.t:0 "Przybył Świebodzin"
 ozm.12.d:0 "Na scenie stoi postać w koronie, której nikt nie zaprosił. Mówi głosem wszystkich przekaźników naraz. Od dziś Ożarowem rządzi Świebodzin.\n\n§Y(Fabuła moda – fikcyjna, satyryczna alternatywna historia. Postacie nie są opisem prawdziwych osób ani ich działań.)§!"
 ozm.12.a:0 "Niech rządzi."
 ozm.13.t:0 "Za szybkie zwycięstwo?"
 ozm.13.d:0 "Z Ożarowa nadaje sygnał, którego nikt nie rozumie. Sąsiedzi zastanawiają się, czy to jeszcze miasto – czy już coś innego."
 ozm.13.a:0 "Obserwujemy."
 ozm.14.t:0 "Republika trwa"
 ozm.14.d:0 "Ożarów przetrwał rozpad jako Republika: z konstytucją, sądami i wyborami. Nie zdobył ziem – zachował siebie."
 ozm.14.a:0 "Dobra wiadomość."
 ozm.15.t:0 "TOPKA"
 ozm.15.d:0 "Ożarów jest muzyczną republiką. Rząd ma wytwórnię, wytwórnia ma rząd, a sąsiedzi znają refreny."
 ozm.15.a:0 "Gramy dalej."
 ozm.16.t:0 "M0N3Y"
 ozm.16.d:0 "Fani rozliczają się punktami z serwera – nieformalną walutą wytwórni. Promocja czy prawdziwy budżet?"
 ozm.16.a:0 "Promocja – punkty za udział w akcjach."
 ozm.16.b:0 "Zamienić na prawdziwy budżet."
 ozm.17.t:0 "NOWY BŁYSK"
 ozm.17.d:0 "Hala studio dostaje nową identyfikację wizualną: logo wytwórni na każdym urzędowym piśmie."
 ozm.17.a:0 "Nowa twarz miasta."
 OZM_tt_zasiegim2:0 "Zasięgi Records: §R-2§!"
 ozm.18.t:0 "LAWENDA"
 ozm.18.d:0 "Spokojny program kulturalny: wieczory akustyczne w parku i warsztaty dla dzieci. Stabilnie – i trochę mniej głośno."
 ozm.18.a:0 "Spokojny wieczór."
 ozm.19.t:0 "MY KONTRA ŚWIAT"
 ozm.19.d:0 "Po nieudanych rozmowach z sąsiadem wytwórnia gra nocny koncert mobilizacyjny."
 ozm.19.a:0 "Gramy do rana."
 OZM_tt_zasiegi6_legitm3:0 "Zasięgi Records: §G+6§!, Legitymizacja administracji: §R-3§!"
 ozm.21.t:0 "WAZON EXCLUSIVE"
 ozm.21.d:0 "W środku sporu medialnego wytwórnia publikuje ekskluzywny materiał. Urząd nie ma odpowiedzi.\n\n§Y(Fabuła moda – fikcyjna, satyryczna alternatywna historia. Postacie nie są opisem prawdziwych osób ani ich działań.)§!"
 ozm.21.a:0 "Materiał robi swoje."
 ozm.22.t:0 "POKAHONTAZ"
 ozm.22.d:0 "Koncert specjalny i nowy poziom cyfrowej kultury: transmisja na wszystkich ekranach miasta."
 ozm.22.a:0 "Kolejny poziom."
 ozm.35.t:0 "Kto pilnuje kablowni?"
 ozm.35.d:0 "Hale dawnej Fabryki Kabli: straż przemysłowa z bronią czy cywilny zarząd z księgową?"
 ozm.35.a:0 "Straż przemysłowa."
 ozm.35.b:0 "Cywilny zarząd."
 ozm.36.t:0 "Echo dawnej Rzeczypospolitej"
 ozm.36.d:0 "Pełnomocnicy Sejmu i Pałacu czekają w sekretariacie. Komu Ożarów okaże lojalność?"
 ozm.36.a:0 "Sejmowi."
 ozm.36.b:0 "Pałacowi."
 ozm.36.c:0 "Nikomu – Ożarów sam o sobie decyduje."
 ozm.37.t:0 "Głosy zza ściany studia"
 ozm.37.d:0 "Yungwazon i Sxmmersosa z Świebodzin Records nagrywają w opuszczonej hali. Ich numery puszcza pół miasta, a na osiedlach mówi się, że wytwórnia rozumie ludzi lepiej niż urząd.\n\n§Y(Fabuła moda – fikcyjna, satyryczna alternatywna historia. Postacie nie są opisem prawdziwych osób ani ich działań.)§!"
 ozm.37.a:0 "Słuchamy."
 OZM_tt_legit1:0 "Legitymizacja administracji: §G+1§!"
 ozm.38.t:0 "Rada obywatelska"
 ozm.38.d:0 "Rada obywatelska zbiera się w hali sportowej. Trzeba za nią zapłacić – ale ludzie wreszcie mają gdzie mówić."
 ozm.38.a:0 "Finansujemy radę."
 ozm.38.b:0 "Rada bez budżetu."
 OZM_tt_legit6:0 "Legitymizacja administracji: §G+6§!"
 OZM_tt_legitm6:0 "Legitymizacja administracji: §R-6§!"
 ozm.39.t:0 "Referendum o przyszłości"
 ozm.39.d:0 "Mieszkańcy głosują, czy Republika ma trwać samodzielnie. Wynik zależy od stabilności i zaufania do urzędu."
 ozm.39.a:0 "Liczymy głosy."
 OZM_tt_dostawym5_legit2:0 "Dostawy Bronisz: §R-5§!, Legitymizacja administracji: §G+2§!"
 ozm.40.t:0 "Przejścia na Bemowo"
 ozm.40.d:0 "Po drugiej stronie granicy gminy rządzą obce władze. Porozumienie czy sankcje?"
 ozm.40.a:0 "Porozumienie – korytarz dla mieszkańców."
 ozm.40.b:0 "Sankcje – zamknąć przejścia."
 ozm.41.t:0 "Odpowiedzialny naczelnik"
 ozm.41.d:0 "Republika wybiera styl rządzenia."
 ozm.41.a:0 "Technokratyczny."
 ozm.41.b:0 "Wyborczy."
 ozm.41.c:0 "Kryzysowy."
 ozm.42.t:0 "Konferencja zachodniego Mazowsza"
 ozm.42.d:0 "[From.GetName] zaprasza nas do sojuszu obronnego zachodniego Mazowsza. Bez aneksji, bez wspólnego rządu – tylko wspólna obrona."
 ozm.42.a:0 "Dołączamy."
 ozm.42.b:0 "Odmawiamy."
 ozm.42.c:0 "Odmawiamy."
 ozm.32.t:0 "Kablownia czy studio?"
 ozm.32.d:0 "Hala dawnej Fabryki Kabli: znów produkcja – albo największe studio i centrum propagandy zachodniego Mazowsza."
 ozm.32.a:0 "Kablownia – fabryka."
 ozm.32.b:0 "Studio – centrum propagandy."
 ozm.33.t:0 "Radiowęzeł obrony"
 ozm.33.d:0 "Łączność obrony miasta: państwowy radiowęzeł czy sieć wytwórni?"
 ozm.33.a:0 "Państwowa łączność."
 ozm.33.b:0 "Sieć Records."
 OZM_tt_sygnal10_legitm3:0 "Sygnał Świebodzina: §G+10§!, Legitymizacja administracji: §R-3§!"
 OZM_tt_sygnal3_legit3:0 "Sygnał Świebodzina: §G+3§!, Legitymizacja administracji: §G+3§!"
 ozm.43.t:0 "JESTEM BEJEM"
 ozm.43.d:0 "Projekt urósł do rozmiarów mitu. Grać go do końca czy przywrócić racjonalną kontrolę?\n\n§Y(Fabuła moda – fikcyjna, satyryczna alternatywna historia. Postacie nie są opisem prawdziwych osób ani ich działań.)§!"
 ozm.43.a:0 "Grać mit."
 ozm.43.b:0 "Racjonalna kontrola."
 ozm.34.t:0 "Kto rządzi Warszawą?"
 ozm.34.d:0 "Śródmieście ma nowego gospodarza. Ożarów może się z nim ułożyć – albo przeciwstawić."
 ozm.34.a:0 "Ułożyć się ze zwycięzcą."
 ozm.34.b:0 "Przeciwstawić się."
 ozm.34.c:0 "Warszawa jest nasza."
 OZM_tt_24:0 "Dostawy Bronisz: co najmniej §Y70§!"
 OZM_tt_legitm2:0 "Legitymizacja administracji: §R-2§!"
 OZM_d_misja_bronisze:0 "Bronisze muszą handlować"
 OZM_d_misja_bronisze_desc:0 "Rynek hurtowy musi ruszyć pełną parą: w ciągu 60 dni podnieś Dostawy Bronisz do 70."
