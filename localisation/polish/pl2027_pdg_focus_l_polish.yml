l_polish:
 PDG_lewy_brzeg:0 "Lewy brzeg zostaje sam"
 PDG_lewy_brzeg_desc:0 "Po 11 listopada Toruń zajął się sobą, a Podgórz został po drugiej stronie Wisły z Radą Starszych, dworcem i jednym czynnym kioskiem. Ktoś musi to wszystko ogarnąć."
 PDG_transmisja:0 "Transmisja z Podgórza"
 PDG_transmisja_desc:0 "Na skarpie nad Wisłą ktoś rozstawia kamerę, mikrofon i lampę pierścieniową. Daniel Magical zaczyna nadawać „relację z upadku państwa”. Po godzinie ogląda go więcej ludzi niż mieszka na Podgórzu."
 PDG_czat_decyduje:0 "Czat decyduje"
 PDG_czat_decyduje_desc:0 "Każda ważna sprawa trafia pod głosowanie czatu. Ankieta trwa dwie minuty, a wynik jest wiążący – chyba że wygra „opcja żartobliwa”."
 PDG_rada_sie_niepokoi:0 "Rada Starszych się niepokoi"
 PDG_rada_sie_niepokoi_desc:0 "Rada Starszych Podgórza patrzy na liczniki widzów z rosnącym niepokojem. Ktoś w Radzie proponuje, żeby „po prostu wyłączyć mu internet”."
 PDG_wybory_na_zywo:0 "Wybory na żywo"
 PDG_wybory_na_zywo_desc:0 "Głosowanie odbywa się w trakcie transmisji: kreska w urnie, emotka na czacie. Komisja wyborcza liczy głosy na antenie, a widzowie spamują „GG”. Daniel Magical zostaje przywódcą Podgórza – i od razu ogłasza przerwę techniczną na zamówienie pizzy."
 PDG_f_minister:0 "Minister ds. Rozrywki"
 PDG_f_minister_desc:0 "Rada Starszych zawiera kompromis: władza zostaje w rękach Rady, a Daniel Magical dostaje teczkę ministra rozrywki, własne studio i nieograniczony limit transmisji z posiedzeń."
 PDG_f_donejty:0 "Budżet z donejtów"
 PDG_f_donejty_desc:0 "Skarbnik Rady dostaje nowy panel: „Ostatnie wpłaty”. Budżet państwa rośnie z każdym odczytanym komunikatem, a dźwięk syreny słychać aż na Bydgoskim Przedmieściu."
 PDG_f_moderatorzy:0 "Moderatorzy zamiast ministrów"
 PDG_f_moderatorzy_desc:0 "Ministerstwa przestają istnieć – zastępują je moderatorzy czatu. Kamil „Moderator” Nowicki obejmuje bezpieczeństwo, bo „bany rozdaje szybciej niż mandaty”."
 PDG_ban_opozycji:0 "Ban dla opozycji"
 PDG_ban_opozycji_desc:0 "Opozycja dostaje bana na czacie na 24 godziny. Potem na tydzień. Potem moderatorzy zapominają, kiedy to się miało skończyć."
 PDG_armia_widzow:0 "Armia widzów"
 PDG_armia_widzow_desc:0 "Najbardziej oddani widzowie zgłaszają się na ochotnika. Każdy pluton ma swojego moderatora, a rozkazy przychodzą w komentarzach przypiętych na górze czatu."
 PDG_najazd:0 "Najazd na czat Torunia"
 PDG_najazd_desc:0 "Widzowie z Podgórza masowo wchodzą na transmisje toruńskiego Ratusza. Konferencja prasowa prezydenta miasta tonie w emotkach z lewego brzegu."
 PDG_milion:0 "Milion widzów"
 PDG_milion_desc:0 "Licznik przebija magiczną barierę. Media z całej rozbitej Polski pokazują studio na Podgórzu, a sponsorzy ustawiają się w kolejce."
 PDG_most:0 "Magiczny most na prawy brzeg"
 PDG_most_desc:0 "Czat wybrał: idziemy na Toruń. Daniel Magical ogłasza „największy event w historii kanału” – przejście przez most na prawy brzeg. Kamery na kaskach, czat na żywo, drużyna moderatorów na czele."
 PDG_wielki_final:0 "Wielki finał transmisji"
 PDG_wielki_final_desc:0 "Transmisja z Ratusza Staromiejskiego bije wszystkie rekordy. Daniel Magical ogłasza Magiczny Toruń, a studio na Podgórzu zostaje „historycznym miejscem nadawania”."
 PDG_f_sponsor:0 "Szukamy sponsora"
 PDG_f_sponsor_desc:0 "Budżet z donejtów to za mało na całą republikę. Daniel ogłasza na streamie: „Szukamy partnera, który rozumie młodą widownię”. Najwięcej rozumie bydgoska Rada Przemysłowa."
 PDG_f_festiwal:0 "Festiwal Lewego Brzegu"
 PDG_f_festiwal_desc:0 "Minister rozrywki organizuje festiwal: koncerty pod mostem, jarmark przy forcie i transmisja na trzech kanałach. Prawy brzeg po raz pierwszy przyjeżdża na Podgórz z własnej woli."
 PDG_spoldzielnia:0 "Spółdzielnia medialna"
 PDG_spoldzielnia_desc:0 "Studio ministra staje się spółdzielnią mieszkańców. Zyski z transmisji idą na drogi, szkołę i nowy dach dworca Toruń Główny."
 PDG_most_przyjazni:0 "Most przyjaźni"
 PDG_most_przyjazni_desc:0 "Rada Starszych proponuje Toruniowi umowę: Podgórz zachowa niezależność, a w zamian będzie neutralnym, przyjaznym przedmieściem z najlepszymi festiwalami w regionie."
 PDG_miasto_festiwali:0 "Podgórz – miasto festiwali"
 PDG_miasto_festiwali_desc:0 "Podgórz nie podbił Torunia, ale Toruń przyjeżdża na Podgórz co weekend. Stabilność, sława i pełne parkingi – to też jest sposób na przetrwanie."
