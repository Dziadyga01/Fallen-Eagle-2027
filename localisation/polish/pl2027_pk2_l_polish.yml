l_polish:
 PKP_kontrakt_op:0 "Kontrakt przewozowy z Holdingiem PKP"
 PKP_odmowa_op:0 "Odrzucony kontrakt kolejowy"
 PKP_siec_mod:0 "Sieć węzłów kolejowych"
 PKP_siec_mod_desc:0 "Holding kontroluje §Y[?PKP_wezly|0]§! z §Y[?global.PKP_wezly_wszystkie|0]§! węzłów kolejowych. Każdy węzeł przyspiesza budowy, daje władzę polityczną i ułatwia zaopatrzenie armii."
 pk2.1.t:0 "Kontrakt przewozowy"
 pk2.1.d:0 "Holding PKP proponuje kontrakt: pociągi z węglem, paliwem i żywnością pojadą przez naszą stację węzłową według wspólnego rozkładu. Holding chce opłat, ale bez kontraktu składy będą omijać nasz węzeł.\n\nOferta od: §Y[From.GetName]§!."
 pk2.1.a:0 "Podpisać kontrakt (25 PP)."
 pk2.1.b:0 "Nasze tory, nasze zasady."
 PKP_kontrakt_idea:0 "Kontrakt z Holdingiem PKP"
 PKP_kontrakt_idea_desc:0 "Wspólny rozkład jazdy z Holdingiem: towary docierają na czas, a stacja węzłowa znów żyje."
 pk2.2.t:0 "Kontrakt podpisany"
 pk2.2.d:0 "[From.GetName] podpisuje kontrakt przewozowy. Co miesiąc wpływa opłata za przejazdy."
 pk2.2.a:0 "Pociągi jadą."
 pk2.3.t:0 "Kontrakt odrzucony"
 pk2.3.d:0 "[From.GetName] odrzuca kontrakt. Ich węzeł zostaje poza siecią Holdingu – na razie."
 pk2.3.a:0 "Zapamiętamy to."
 PKP_siec_frontowa_idea:0 "Kolej frontowa"
 PKP_siec_frontowa_idea_desc:0 "Rozkład jazdy podporządkowany armii: amunicja i paliwo docierają na front szybciej niż ciężarówkami."
 PKP_siec_monopol_idea:0 "Monopol przewozowy"
 PKP_siec_monopol_idea_desc:0 "Każdy pociąg w północnej Polsce jedzie według rozkładu Holdingu. Konkurencja istnieje tylko w regulaminie."
 PKP_req_wezly6:0 "Holding kontroluje co najmniej §Y6§! węzłów kolejowych"
 PKP_req_wezly10:0 "Holding kontroluje co najmniej §Y10§! węzłów kolejowych"
 PKP_tt_kontrakty:0 "Sąsiedzi z węzłami kolejowymi dostaną ofertę §Ykontraktu przewozowego§!. Każdy kontrakt: §G+4 PP§! miesięcznie."
