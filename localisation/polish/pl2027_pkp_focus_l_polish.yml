l_polish:
 PKP_ostatni_rozklad:0 "Ostatni rozkład Republiki"
 PKP_ostatni_rozklad_desc:0 "Rada Republiki Kociewskiej uchwaliła budżet, którego nie ma, i rozkład jazdy, którego nikt nie przestrzega. W Starogardzie mówi się już, że jedyną działającą instytucją regionu jest kolej."
 PKP_kryzys_na_torach:0 "Kryzys na torach"
 PKP_kryzys_na_torach_desc:0 "Składy z Gdyni utknęły w Tczewie, w Pelplinie brakuje chleba, a policja od tygodnia nie dostała pensji. Zarząd zakładu kolejowego proponuje „tymczasowe przejęcie obsługi państwa”."
 PKP_zarzad_nadzwyczajny:0 "Zarząd nadzwyczajny"
 PKP_zarzad_nadzwyczajny_desc:0 "Na mocy uchwały podjętej w wagonie restauracyjnym kierownictwo kolei obejmuje „nadzwyczajny zarząd komisaryczny” nad Kociewiem. Radni dostali bilety w jedną stronę."
 PKP_tczew_centralny:0 "Tczew Centralny"
 PKP_tczew_centralny_desc:0 "Starogard ma ratusz, ale Tczew ma węzeł, most na Wiśle i warsztaty. Siedziba władzy przenosi się tam, gdzie krzyżują się tory."
 PKP_rada_akcjonariuszy:0 "Rada Akcjonariuszy"
 PKP_rada_akcjonariuszy_desc:0 "Obywatele mogą wymienić stare akcje spółek kolejowych i bony Republiki na udziały w nowym podmiocie. Głos ma ten, kto ma pakiet – czyli głównie Zarząd."
 PKP_narodziny_holdingu:0 "Narodziny Holdingu"
 PKP_narodziny_holdingu_desc:0 "Na peronie pierwszym dworca w Tczewie Jerzy Semaforski odczytuje akt założycielski Polskiego Holdingu Kolejowego. Republika Kociewska przestaje istnieć – formalnie z powodu „zmiany rozkładu jazdy”."
 PKP_audyt_torowisk:0 "Audyt torowisk"
 PKP_audyt_torowisk_desc:0 "Inspektorzy przechodzą pieszo każdy kilometr toru od Skórcza po Tczew. Raport ma 400 stron, a jego wnioski brzmią: „wszystko do wymiany”."
 PKP_magistrala_weglowa:0 "Magistrala Węglowa"
 PKP_magistrala_weglowa_desc:0 "Stara linia Herby – Gdynia znów ma sens: Śląsk wciąż wydobywa węgiel, a porty wciąż go kupują. Trzeba tylko przepuścić składy przez Kociewie – za opłatą."
 PKP_warsztaty_starogardzkie:0 "Warsztaty Starogardzkie"
 PKP_warsztaty_starogardzkie_desc:0 "Hale naprawcze w Starogardzie dostają nowe zamówienia: zamiast wagonów sypialnych – lory opancerzone i amunicja."
 PKP_warsztaty_tb:0 "Warsztaty Starogardzkie"
 PKP_siec_magazynow:0 "Sieć magazynów"
 PKP_siec_magazynow_desc:0 "Bocznice pełne zboża, paliwa i nawozów. Holding nie musi nikomu grozić – wystarczy, że „z przyczyn technicznych” wstrzyma dostawy."
 PKP_nowe_taryfy:0 "Nowe taryfy tranzytowe"
 PKP_nowe_taryfy_desc:0 "Każdy wagon przejeżdżający przez węzeł w Tczewie płaci opłatę tranzytową, opłatę za postój, opłatę za brak postoju i opłatę manipulacyjną."
 PKP_potega_przemyslowa:0 "Kolejowa potęga przemysłowa"
 PKP_potega_przemyslowa_desc:0 "Tczew produkuje wagony, Starogard – amunicję, a Pelplin – formularze. Kociewie po raz pierwszy w historii jest przemysłowym centrum regionu."
 PKP_przemysl_tb:0 "Kolejowa potęga przemysłowa"
 PKP_bilet_dokument:0 "Bilet jako dokument"
 PKP_bilet_dokument_desc:0 "Urzędy stanu cywilnego zamknięto, kasy biletowe przejęły ich funkcje. Akt urodzenia to bilet ulgowy, akt zgonu – zwrot niewykorzystanego biletu."
 PKP_abonament:0 "Abonament obywatelski"
 PKP_abonament_desc:0 "Za stałą miesięczną opłatą obywatel dostaje przejazdy, opiekę zdrowotną w wagonie sanitarnym i prawo do bycia wysłuchanym. Rezygnacja z abonamentu wymaga trzymiesięcznego okresu wypowiedzenia."
 PKP_prywatne_perony:0 "Prywatne perony"
 PKP_prywatne_perony_desc:0 "Perony trafiają na licytację. Piekarnia z Gniewu kupiła peron drugi i od teraz pociągi zatrzymują się tam tylko w porze śniadania."
 PKP_urzad_windykacji:0 "Urząd Windykacji"
 PKP_urzad_windykacji_desc:0 "Nowy urząd ściga gapowiczów, dłużników i tych, którzy kiedyś jechali bez biletu w 2009 roku. Odsetki naliczane są wstecz."
 PKP_rynek_koncesji:0 "Rynek koncesji"
 PKP_rynek_koncesji_desc:0 "Kioski, bary dworcowe, toalety i ławki – wszystko ma swoją koncesję, a każda koncesja ma swoją cenę. Holding inkasuje od każdej."
 PKP_lojalnosc_pasazera:0 "Lojalność pasażera"
 PKP_lojalnosc_pasazera_desc:0 "Program „Lojalny Pasażer” nagradza punktami za każdy przejazd, donos i oklaski na zjeździe akcjonariuszy. Najlepsi dostają złotą kartę i miejsce przy oknie."
 PKP_reforma_sok:0 "Reforma SOK"
 PKP_reforma_sok_desc:0 "Straż Ochrony Kolei dostaje karabiny, hełmy i nowy regulamin. Pierwszy paragraf nadal zakazuje palenia na peronach, drugi pozwala strzelać."
 PKP_brygady_inzynieryjne:0 "Brygady Inżynieryjne"
 PKP_brygady_inzynieryjne_desc:0 "Kolejarze potrafią w dwa dni położyć tor, a w dwie godziny go rozebrać. W wojsku obie umiejętności są równie cenne."
 PKP_ochrona_mostow:0 "Ochrona mostów"
 PKP_ochrona_mostow_desc:0 "Most tczewski, most w Nowem i wiadukty na Wierzycy dostają stałe posterunki SOK, zapory i ładunki – na wszelki wypadek."
 PKP_pociagi_pancerne:0 "Pociągi pancerne"
 PKP_pociagi_pancerne_desc:0 "W warsztatach w Tczewie lokomotywy dostają blachy pancerne, a platformy – działka i karabiny maszynowe. Historia lubi się powtarzać, zwłaszcza na torach."
 PKP_pancerne_tb:0 "Pociągi pancerne"
 PKP_sily_szybkiego_reagowania:0 "Kolejowe siły szybkiego reagowania"
 PKP_sily_szybkiego_reagowania_desc:0 "Zmotoryzowane składy SOK dojadą w każde miejsce Kociewia w dwie godziny – szybciej niż jakikolwiek pociąg pasażerski."
 PKP_mobilizacja_konwojow:0 "Mobilizacja konwojów"
 PKP_mobilizacja_konwojow_desc:0 "Plan „Rozkład Zero”: w razie wojny cała sieć kolejowa przechodzi na transport wojskowy w 24 godziny. Pasażerowie zostają poinformowani komunikatem o opóźnieniu."
 PKP_uklad_z_gdanskiem:0 "Układ z Gdańskiem"
 PKP_uklad_z_gdanskiem_desc:0 "Port Gdańsk ma statki, Holding ma wagony. Razem mogą kontrolować wszystko, co wpływa do Polski i z niej wypływa – o ile Gdańsk zgodzi się na rolę wspólnika mniejszościowego."
 PKP_oferta_dla_swiecia:0 "Oferta dla Świecia"
 PKP_oferta_dla_swiecia_desc:0 "Świecie leży po drugiej stronie Wisły, ale jego papiernia potrzebuje bocznic. Holding oferuje rabat na przewozy – w zamian za miejsce w radzie miasta."
 PKP_przekonac_grudziadz:0 "Przekonać Grudziądz"
 PKP_przekonac_grudziadz_desc:0 "Grudziądz boi się Zakonu z Malborka bardziej niż korporacji z Tczewa. Holding uprzejmie przypomina, że pociągi pancerne jeżdżą w obie strony."
 PKP_bydgoski_wezel:0 "Bydgoski węzeł"
 PKP_bydgoski_wezel_desc:0 "Bydgoszcz Główna to klucz do całego południa. Holding nie chce jej zdobywać – chce tylko dzierżawić perony, kasy i bufet. Na dziewięćdziesiąt dziewięć lat."
 PKP_torunski_rozklad:0 "Toruński rozkład jazdy"
 PKP_torunski_rozklad_desc:0 "Toruń i Bydgoszcz spierają się o wszystko, ale oba miasta potrzebują pociągów. Holding proponuje wspólny rozkład – sporządzony oczywiście w Tczewie."
 PKP_gwarancje_bezpieczenstwa:0 "Kolejowe gwarancje bezpieczeństwa"
 PKP_gwarancje_bezpieczenstwa_desc:0 "Każde miasto ze stacją PKP otrzymuje gwarancję: w razie ataku pociąg pancerny przyjedzie zgodnie z rozkładem. Opłata za gwarancję jest wliczona w cenę biletu."
 PKP_jedno_kociewie:0 "Jedno Kociewie"
 PKP_jedno_kociewie_desc:0 "Od Skórcza po Subkowy, od Osia po Kościerzynę – całe Kociewie ma jeden rozkład jazdy i jednego właściciela. Lokalne tożsamości zostają zachowane jako nazwy stacji."
 PKP_szlak_polnoc_poludnie:0 "Szlak Północ-Południe"
 PKP_szlak_polnoc_poludnie_desc:0 "Linia z Gdyni przez Tczew, Laskowice i Bydgoszcz to kręgosłup północnej Polski. Holding chce, by ten kręgosłup miał tylko jedną głowę."
 PKP_wspolna_taryfa:0 "Wspólna taryfa Pomorza"
 PKP_wspolna_taryfa_desc:0 "Jeden bilet od Helu po Toruń – pod warunkiem, że kupiony w kasie PKP. Sąsiedzi zgadzają się, bo alternatywą jest chodzenie pieszo."
 PKP_wielki_zjazd:0 "Wielki Zjazd Akcjonariuszy"
 PKP_wielki_zjazd_desc:0 "Sala w Tczewie pęka w szwach: akcjonariusze, wierzyciele, koncesjonariusze i lojalni pasażerowie. Zarząd przedstawia plan przejęć – nie tylko spółek."
 PKP_siec_ponad_granicami:0 "Sieć ponad granicami"
 PKP_siec_ponad_granicami_desc:0 "Granice na Wiśle są dla polityków. Dla kolei liczą się tylko szerokość toru i opłata za przejazd."
 PKP_panstwo_na_torach:0 "Państwo na torach"
 PKP_panstwo_na_torach_desc:0 "Holding kontroluje szlaki, porty, magazyny i dworce. Pozostało jedno pytanie, które Zarząd musi zadać sobie na nadzwyczajnym posiedzeniu: wspólnicy czy podwładni?"
 PKP_konsorcjum:0 "Rozmowy z Płockiem"
 PKP_konsorcjum_desc:0 "Holding wysyła do Płocka propozycję: pociągi z paliwem za udziały w Konsorcjum Polskich Korporacji. Koncern ma ropę, Holding ma tory – razem mają państwo."
 PKP_cysterny:0 "Pociągi z paliwem"
 PKP_cysterny_desc:0 "Cysterny z rafinerii w Płocku jeżdżą przez Kociewie do portów i baz. Holding pobiera opłatę za każdy kilometr."
 PKP_tpizza:0 "Kontrakt z T-Pizzą"
 PKP_tpizza_desc:0 "T-Pizza potrzebuje mąki, sera i dostaw do każdej franczyzy. Holding oferuje rozkład jazdy dostosowany do godzin otwarcia pizzerii."
 PKP_logistyka:0 "Wspólna sieć logistyczna"
 PKP_logistyka_desc:0 "Magazyny Holdingu, bazy paliw Koncernu i centra dystrybucji T-Pizzy łączą się w jedną sieć."
 PKP_rada_korporacji_f:0 "Rada Korporacji"
 PKP_rada_korporacji_f_desc:0 "Zarządy trzech korporacji tworzą wspólną Radę. Państwa przychodzą i odchodzą – kontrakty zostają."
 PKP_kolej_korporacji:0 "Korporacyjna Polska na torach"
 PKP_kolej_korporacji_desc:0 "Od Bałtyku po Płock rządzą zarządy, a pociągi Holdingu są krwiobiegiem korporacyjnej Polski."
 WPL_pkp_siec:0 "Sieć połączeń regionalnych"
 WPL_pkp_siec_desc:0 "Holding uruchamia regularne kursy do wszystkich sąsiednich państw. Pasażerowie przyzwyczajają się do naszych rozkładów, a urzędnicy – do naszych biletów służbowych."
 WPL_pkp_tranzyt:0 "Kontrakty tranzytowe"
 WPL_pkp_tranzyt_desc:0 "Towary sąsiadów jadą naszymi torami – za opłatą. Umowy handlowe na lata, podpisywane w wagonie restauracyjnym."
 WPL_pkp_dworce:0 "Koncesje na dworce"
 WPL_pkp_dworce_desc:0 "Proponujemy władzom sąsiednich państw przejęcie i remont głównych dworców. Kto ma dworzec, ten ma miasto – ale tego nie piszemy we wnioskach."
 WPL_pkp_szantaz:0 "Kolejowy szantaż"
 WPL_pkp_szantaz_desc:0 "Wstrzymujemy kursy do opornych sąsiadów „z przyczyn technicznych”. Wszyscy wiedzą, jakich. Blokada boli obie strony, ale nas mniej."
 WPL_pkp_przejecia:0 "Wrogie przejęcia"
 WPL_pkp_przejecia_desc:0 "Nasi prawnicy przygotowali oferty, których władze najbardziej uzależnionych sąsiadów nie powinny odrzucić: państwo jako spółka zależna holdingu, z zarządem w Tczewie."
 WPL_pkp_przejecia2:0 "Druga fala przejęć"
 WPL_pkp_przejecia2_desc:0 "Kolejne państwa wpadły w sieć holdingu. Zarząd zatwierdza drugą rundę ofert – tym razem z większą eskortą Straży Ochrony Kolei."
 PKP_siec_mapa:0 "Mapa węzłów"
 PKP_siec_mapa_desc:0 "Inżynierowie Holdingu rysują mapę 29 węzłów kolejowych rozbitej Polski. Kto ma węzły, ten decyduje, co i kiedy dojedzie."
 PKP_siec_kontrakty:0 "Kontrakty przewozowe"
 PKP_siec_kontrakty_desc:0 "Holding oferuje sąsiadom z węzłami wspólny rozkład jazdy. Każdy podpisany kontrakt to stała opłata co miesiąc."
 PKP_siec_pociagi:0 "Pociągi pancerne"
 PKP_siec_pociagi_desc:0 "Warsztaty w Tczewie opancerzają lokomotywy i platformy. Na torach pojawiają się pociągi pancerne – jak sto lat temu."
 PKP_siec_frontowa:0 "Kolej frontowa"
 PKP_siec_frontowa_desc:0 "Rozkład jazdy podporządkowany armii. Amunicja i paliwo docierają tam, gdzie są potrzebne."
 PKP_siec_cel:0 "Węzły jako cel strategiczny"
 PKP_siec_cel_desc:0 "Sąsiad blokuje kluczowy węzeł. Holding uznaje, że rozkład jazdy trzeba przywrócić – siłą."
 PKP_siec_monopol:0 "Monopol przewozowy"
 PKP_siec_monopol_desc:0 "Holding kontroluje większość węzłów północnej Polski. Konkurencja istnieje już tylko w regulaminie."
