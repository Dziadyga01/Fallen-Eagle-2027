l_polish:
 PRL_f_godzina:0 "Sztab przy Alejach Ujazdowskich"
 PRL_f_godzina_desc:0 "Rząd przenosi się do sztabu kryzysowego. Pierwsza decyzja: kogo ratować, a kogo puścić."
 PRL_f_oredzie:0 "Orędzie do narodu"
 PRL_f_oredzie_desc:0 "Premier mówi wprost: państwo się chwieje, ale nie upadnie po cichu. Ludzie cenią szczerość – na razie."
 PRL_f_rzecznik:0 "Pełnomocnik ds. regionów"
 PRL_f_rzecznik_desc:0 "Jeden człowiek z prawem podpisu rozmawia ze wszystkimi województwami. Porozumienia tanieją."
 PRL_f_wojewodowie:0 "Narada wojewodów"
 PRL_f_wojewodowie_desc:0 "Wojewodowie ze wszystkich regionów w jednej sali. Część z nich już dawno nie wykonuje poleceń, ale przyjechali."
 PRL_f_rezerwy:0 "Rezerwy NBP"
 PRL_f_rezerwy_desc:0 "Bank centralny uruchamia rezerwy. Władza polityczna teraz – mniej zapasów po Godzinie Zero."
 PRL_f_sluzby:0 "Służby w gotowości"
 PRL_f_sluzby_desc:0 "Żandarmeria pilnuje urzędów, archiwów i przekaźników. Po Godzinie Zero Sejm przejmie je w lepszym stanie."
 PRL_f_bruksela:0 "Telefon do Brukseli"
 PRL_f_bruksela_desc:0 "Rząd otwiera kanał z Komisją. Europa pomoże – pod warunkami, które spodobają się nie wszystkim."
 PRL_f_rbn:0 "Rada Bezpieczeństwa: wschód"
 PRL_f_rbn_desc:0 "Rada Bezpieczeństwa przekazuje Warmii, Mazurom, Suwalszczyźnie i Podlasiu plany obrony i część rezerw. Po rozpadzie będą bronić się same – ale nie od zera."
