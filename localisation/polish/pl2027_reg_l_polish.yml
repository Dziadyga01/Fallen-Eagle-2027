 RLWC_tt_pl3:0 "Kontrolujemy §YWarszawę – Śródmieście§! i co najmniej §Y300§! stanów"
 REG_KKR_tree:0 "Korona nad Podlasiem"
 RKKR_duch:0 "Tradycja i korona"
 RKKR_duch_desc:0 "Korona Polska obiecuje powrót do „Polski, jaką była” – z królem, Kościołem i sejmikami. Na wsiach Podlasia te słowa brzmią lepiej niż jakikolwiek program gospodarczy."
 RKKR_duch2:0 "Gospodarstwa Korony"
 RKKR_duch2_desc:0 "Rolnicy, małe firmy i rzemieślnicy – Korona stawia na własność rodzinną. Mało przemysłu, dużo jedzenia."
 RKKR_armia:0 "Straż Koronna"
 RKKR_armia_desc:0 "Ochotnicy z sarmackimi wąsami i nowoczesnymi karabinami. Morale wysokie, musztra – różnie."
 RKKR_sojusz:0 "Liga Koronna"
 RKKR_sojusz_desc:0 "Korona i jej sojusznicy mają wspólny sztab. Kto będzie królem – o tym po wojnie."
 RKKR_region:0 "Korona Wschodnia"
 RKKR_region_desc:0 "Od Siedlec po Bug rządzi Korona. Herby wracają na ratusze, a sejmiki – do starostw."
 RKKR_a_idea:0 "Regencja"
 RKKR_a_idea_desc:0 "Rada Regencyjna rządzi w imieniu przyszłego króla. Kandydatów jest wielu, a regentów – trzech."
 RKKR_b_idea:0 "Front Prawicy"
 RKKR_b_idea_desc:0 "Korona i Konfederacja walczą razem. Wspólny wróg łączy lepiej niż wspólny program."
 RKKR_c_idea:0 "Złota wolność"
 RKKR_c_idea_desc:0 "Sejmiki ziemskie decydują o podatkach, wojsku i szkołach. Państwo jest słabe – ale nikt nie narzeka na urzędników."
 reg.118.t:0 "Msza przed obradami"
 reg.118.d:0 "Przed pierwszym posiedzeniem Sejmiku Koronnego odbywa się msza w katedrze. Kilku posłów z miast pyta, czy obecność jest obowiązkowa."
 reg.118.a:0 "Nikogo nie zmuszamy."
 reg.118.b:0 "Korona to wspólnota wiary."
 reg.119.t:0 "Złoty koronny"
 reg.119.d:0 "Monety Mennicy Koronnej szybko znikają z obiegu – ludzie chowają je do skarpet. Skarbnik proponuje bić monety z mniejszą zawartością srebra."
 reg.119.a:0 "Uczciwa moneta."
 reg.119.b:0 "Więcej monet, mniej srebra."
 reg.120.t:0 "Husaria na defiladzie"
 reg.120.d:0 "Ochotnicy z grup rekonstrukcyjnych chcą jechać na defiladzie w strojach husarskich – ze skrzydłami. Oficerowie Straży uważają, że to wojsko, nie teatr."
 reg.120.a:0 "Niech jadą – ludzie to kochają."
 reg.120.b:0 "Defilada w mundurach polowych."
 RKKR_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Regencja (monarchia), Front Prawicy (sojusz z Konfederacją) albo Złota wolność (rządy sejmików)."
