 RPTK_tt_s3:0 "Członkowie naszego sojuszu otrzymają §Ypropozycję unii§!. Odmowa oznacza koniec sojuszu."
 RPTK_tt_region:0 "Kontrolujemy co najmniej §Y73§! stanów albo prowadzimy sojusz co najmniej trzech państw"
 RPTK_tt_pl2:0 "Jeśli §YWarszawę – Śródmieście§! trzyma państwo spoza naszego sojuszu i nie jest naszym wasalem, otrzymamy przeciw niemu §Ycel wojenny§! (wojnę trzeba wypowiedzieć samodzielnie)."
 RPTK_tt_pl3:0 "Kontrolujemy §YWarszawę – Śródmieście§! i co najmniej §Y300§! stanów"
 REG_RAD_tree:0 "Radom zbrojny"
 RRAD_duch:0 "Miasto, z którego się śmiano"
 RRAD_duch_desc:0 "Przez lata Radom był tematem żartów. Teraz ma fabrykę broni, lotnisko i ludzi, którzy pamiętają 1976 rok. Nikt się już nie śmieje."
 RRAD_duch2:0 "Zbrojownia Polski"
 RRAD_duch2_desc:0 "Łucznik produkuje karabiny dla połowy rozbitego kraju. Radom handluje bronią – i wpływami."
 RRAD_armia:0 "Strzelcy Radomscy"
 RRAD_armia_desc:0 "Każdy żołnierz Radomia ma karabin z miejscowej fabryki – i wie, jak go rozebrać i naprawić."
 RRAD_sojusz:0 "Porozumienie Radomskie"
 RRAD_sojusz_desc:0 "Radom dostarcza broń, sojusznicy – żołnierzy. Prosty układ, który działa."
 RRAD_region:0 "Ziemia Radomska"
 RRAD_region_desc:0 "Od Kozienic po Szydłowiec – Radom jest stolicą, nie prowincją."
 RRAD_a_idea:0 "Rada Robotnicza"
 RRAD_a_idea_desc:0 "Pamięć Czerwca 1976 wraca: robotnicy Łucznika i Radoskóru mają decydujący głos w państwie."
 RRAD_b_idea:0 "Kontrakty Łucznika"
 RRAD_b_idea_desc:0 "Radom sprzedaje broń każdemu, kto zapłaci. Państwo jest firmą, a firma – państwem."
 RRAD_c_idea:0 "Prezydent Radomia"
 RRAD_c_idea_desc:0 "Prezydent miasta rządzi jak burmistrz w czasie oblężenia: szybko, osobiście i bez długich narad."
 reg.127.t:0 "Żarty o Radomiu"
 reg.127.d:0 "W internecie, który działa tylko kilka godzin dziennie, wciąż krążą memy o Radomiu. Biuro propagandy proponuje odpowiedź: kampanię z hasłem „Radom wygrał”."
 reg.127.a:0 "Odpowiemy z humorem."
 reg.127.b:0 "Nie ma czasu na memy."
 reg.128.t:0 "Komu sprzedać karabiny?"
 reg.128.d:0 "Do Łucznika przychodzą zamówienia z Lublina, Piotrkowa i Sochaczewa. Wszyscy płacą dobrze – ale każdy z nich może kiedyś skierować tę broń przeciw Radomiowi."
 reg.128.a:0 "Sprzedajemy wszystkim."
 reg.128.b:0 "Broń zostaje w Radomiu."
 reg.129.t:0 "Pokaz lotniczy"
 reg.129.d:0 "Na lotnisku w Radomiu – tym, z którego się śmiano – entuzjaści lotnictwa chcą zorganizować pokaz awionetek i dronów. Sztab widzi w tym okazję do rozpoznania."
 reg.129.a:0 "Pokaz i rekrutacja pilotów."
 reg.129.b:0 "Lotnisko jest dla wojska."
 RRAD_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Rada Robotnicza (socjaldemokracja), Kontrakty Łucznika (rządy firmy zbrojeniowej) albo Prezydent Radomia (silna władza)."
