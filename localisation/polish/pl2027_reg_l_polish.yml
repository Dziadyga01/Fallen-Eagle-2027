 REG_WOL_tree:0 "Wolność ponad wszystko"
 RWOL_duch:0 "Państwo minimum"
 RWOL_duch_desc:0 "Republika Wolnościowa ma jednego ministra, trzy podatki i zero dotacji. Kto chce drogę – składa się z sąsiadami. Kto chce wojsko – kupuje karabin."
 RWOL_duch2:0 "Raj podatkowy Mazowsza"
 RWOL_duch2_desc:0 "Firmy z Warszawy i Łodzi przenoszą siedziby do Sochaczewa. Nikt nie wie, co produkują, ale płacą czynsz."
 RWOL_armia:0 "Milicja ochotnicza"
 RWOL_armia_desc:0 "Każdy obywatel ma prawo do broni – i z niego korzysta. Armia jest ochotnicza, a żołd płacą prywatni sponsorzy."
 RWOL_sojusz:0 "Liga Wolnego Handlu"
 RWOL_sojusz_desc:0 "Członkowie Ligi nie pobierają ceł i bronią się wzajemnie. Wolność handlu jest najlepszym sojuszem."
 RWOL_region:0 "Wolne Mazowsze"
 RWOL_region_desc:0 "Od Sochaczewa po Łowicz – państwo, w którym urzędnik jest gatunkiem zagrożonym."
 RWOL_a_idea:0 "Kanclerz i nic więcej"
 RWOL_a_idea_desc:0 "Państwem rządzi Kanclerz z jednym sekretarzem. Ministerstwa zostały sprzedane na licytacji."
 RWOL_b_idea:0 "Konstytucja Wolności"
 RWOL_b_idea_desc:0 "Krótka konstytucja: własność, wolność słowa i zakaz podnoszenia podatków bez referendum."
 RWOL_c_idea:0 "Miasta prywatne"
 RWOL_c_idea_desc:0 "Każda gmina może stać się prywatnym miastem z własnym regulaminem. Sochaczew sprzedaje statuty."
 reg.145.t:0 "Rachunek za straż pożarną"
 reg.145.d:0 "Pali się magazyn na obrzeżach Sochaczewa. Prywatna straż pożarna przyjeżdża, ale właściciel nie wykupił abonamentu. Strażacy pytają, czy gasić."
 reg.145.a:0 "Gasić – rachunek później."
 reg.145.b:0 "Umowa to umowa."
 reg.146.t:0 "Firmy-widma"
 reg.146.d:0 "Rejestr spółek w Sochaczewie ma więcej firm niż mieszkańców. Sąsiedzi oskarżają Republikę o pranie pieniędzy."
 reg.146.a:0 "Wolność gospodarcza jest święta."
 reg.146.b:0 "Skontrolować rejestr."
 reg.147.t:0 "Najemnicy żądają premii"
 reg.147.d:0 "Firma wojskowa z kontraktem na obronę Republiki żąda premii za „podwyższone ryzyko”. Bez premii – wypowiedzenie umowy."
 reg.147.a:0 "Płacimy."
 reg.147.b:0 "Szukamy tańszej firmy."
 RWOL_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Kanclerz i nic więcej (rządy silnego kanclerza), Konstytucja Wolności (republika) albo Miasta prywatne (anarchokapitalizm)."
 RWOL_a_lider:0 "Kanclerz z pełnomocnictwami"
