 RNAR_tt_pl3:0 "Kontrolujemy §YWarszawę – Śródmieście§! i co najmniej §Y300§! stanów"
 RNAR_puszcza:0 "Wojna w puszczy"
 RNAR_puszcza_desc:0 "Każdy las to forteca, każda ziemianka – magazyn. Przeciwnik, który wejdzie do puszczy, nie wie, skąd padnie strzał."
 REG_PTK_tree:0 "Trybunał i elektrownia"
 RPTK_duch:0 "Największa elektrownia"
 RPTK_duch_desc:0 "Bełchatów to największa elektrownia w Europie. Kto ją trzyma, może włączyć i wyłączyć światło w połowie Polski."
 RPTK_duch2:0 "Kombinat Bełchatowski"
 RPTK_duch2_desc:0 "Kopalnia, elektrownia i zakłady wokół nich tworzą kombinat, który zasila całą centralną Polskę. Prąd to waluta Piotrkowa."
 RPTK_armia:0 "Gwardia Trybunalska"
 RPTK_armia_desc:0 "Gwardia nosi na naramiennikach wagę sprawiedliwości z herbu Trybunału. Pilnuje elektrowni, dróg i porządku."
 RPTK_sojusz:0 "Związek Trybunalski"
 RPTK_sojusz_desc:0 "Piotrków, Bełchatów i sąsiedzi mają wspólną obronę i wspólny sąd rozjemczy. Spory rozstrzyga się w Trybunale, nie na drodze."
 RPTK_region:0 "Ziemia Trybunalska"
 RPTK_region_desc:0 "Od Bełchatowa po Tomaszów – jedno państwo, jedna sieć energetyczna i jeden Trybunał."
 RPTK_a_idea:0 "Państwo prawa"
 RPTK_a_idea_desc:0 "Trybunał w Piotrkowie znów sądzi. Każda decyzja władzy może być zaskarżona – i bywa."
 RPTK_b_idea:0 "Dyrekcja Kombinatu"
 RPTK_b_idea_desc:0 "Państwem zarządza dyrekcja kopalni i elektrowni. Plan produkcyjny jest ważniejszy niż wybory."
 RPTK_c_idea:0 "Starosta Trybunalski"
 RPTK_c_idea_desc:0 "Starosta rządzi silną ręką, z pomocą Gwardii. Prąd jest, porządek jest – opozycji nie ma."
 reg.124.t:0 "Wyłączyć prąd Łodzi?"
 reg.124.d:0 "Łódź nie płaci za prąd od dwóch miesięcy. Dyspozytor pyta, czy odłączyć miasto. Pół miliona ludzi bez ogrzewania – albo pusty skarbiec Piotrkowa."
 reg.124.a:0 "Prąd płynie – ludzie nie mogą marznąć."
 reg.124.b:0 "Odłączyć. Niech zapłacą."
 reg.125.t:0 "Wieś pod koparkami"
 reg.125.d:0 "Odkrywka Szczerców ma się rozszerzyć o trzy wsie. Mieszkańcy blokują drogę dojazdową traktorami."
 reg.125.a:0 "Wypłacić odszkodowania i przesiedlić."
 reg.125.b:0 "Kombinat ma pierwszeństwo."
 reg.126.t:0 "Spychacze na front"
 reg.126.d:0 "Saperzy chcą zabrać spychacze i dźwigi z kopalni do budowy umocnień. Kopalnia ostrzega, że wydobycie spadnie o jedną trzecią."
 reg.126.a:0 "Umocnienia są ważniejsze."
 reg.126.b:0 "Kopalnia musi pracować."
 RPTK_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Państwo prawa (demokracja), Dyrekcja Kombinatu (technokracja) albo Starosta Trybunalski (rządy silnej ręki)."
 RPTK_a_lider:0 "Prezes Trybunału"
 RPTK_b_lider:0 "Dyrektor Kombinatu"
 RPTK_SOJUSZ:0 "Związek Trybunalski"
