 REG_DOB_tree:0 "Bracia Dobrzyńscy"
 RDOB_duch:0 "Ziemia między rzekami"
 RDOB_duch_desc:0 "Wisła, Drwęca i Skrwa zamykają Ziemię Dobrzyńską jak fosy. Rolnicy z Rypina, Lipna i Golubia od wieków wiedzą, że muszą radzić sobie sami."
 RDOB_duch2:0 "Spiżarnia Dobrzyńska"
 RDOB_duch2_desc:0 "Zboże, rzepak, mleko i mięso – Ziemia Dobrzyńska karmi Płock, Toruń i Grudziądz. Kto chce jeść, musi z nią rozmawiać."
 RDOB_armia:0 "Chorągwie Dobrzyńskie"
 RDOB_armia_desc:0 "Kompanie z każdej gminy mają własne chorągwie z herbem ziemi. Dobrzyńska szlachta zagrodowa wraca – tym razem w mundurach polowych."
 RDOB_sojusz:0 "Związek Dobrzyński"
 RDOB_sojusz_desc:0 "Ziemie nad Drwęcą mają wspólną obronę. Granice wyznaczają rzeki, nie urzędnicy."
 RDOB_region:0 "Ziemia Dobrzyńsko-Michałowska"
 RDOB_region_desc:0 "Od Golubia po Sierpc i od Drwęcy po Wisłę – jedna ziemia z jednym starostą."
 RDOB_a_idea:0 "Sejmik Dobrzyński"
 RDOB_a_idea_desc:0 "Gminy wysyłają delegatów do Rypina. Sejmik spiera się długo, ale decyzje są szanowane."
 RDOB_b_idea:0 "Zakon Braci Dobrzyńskich"
 RDOB_b_idea_desc:0 "Rycerze z Dobrzynia bronili tej ziemi przed Prusami osiemset lat temu. Nowy zakon obiecuje to samo wobec każdego najeźdźcy – także wobec Zakonu ze wschodu."
 RDOB_c_idea:0 "Unia z Płockiem"
 RDOB_c_idea_desc:0 "Rypin opiera się o silniejszy Płock: paliwo i pieniądze z rafinerii w zamian za żywność i ludzi."
 reg.148.t:0 "Turniej w Golubiu"
 reg.148.d:0 "Bractwo rycerskie z zamku w Golubiu chce zorganizować coroczny turniej mimo rozpadu kraju. Przyjadą ludzie z Torunia, Brodnicy i Płocka. Starosta obawia się, że ktoś przyjedzie z prawdziwą bronią."
 reg.148.a:0 "Turniej się odbędzie."
 reg.148.b:0 "Nie czas na zabawy."
 reg.149.t:0 "Zboże dla Zakonu?"
 reg.149.d:0 "Zakon ze wschodu oferuje za dobrzyńskie zboże paliwo i broń. Rolnicy chcą sprzedawać – ale ten sam Zakon może kiedyś stanąć na naszych mostach."
 reg.149.a:0 "Handlujemy z każdym."
 reg.149.b:0 "Zakonowi nic nie sprzedamy."
 reg.150.t:0 "Szable dziadków"
 reg.150.d:0 "Ochotnicy przychodzą na zbiórkę z szablami z rodzinnych ścian. Sierżant pyta, czy ma je zarekwirować, czy pozwolić nosić na defiladach."
 reg.150.a:0 "Na defilady – niech pamiętają, skąd są."
 reg.150.b:0 "W wojsku nosi się regulaminową broń."
