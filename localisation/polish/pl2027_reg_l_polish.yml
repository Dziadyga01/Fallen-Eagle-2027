 RCHE_tt_s3:0 "Członkowie naszego sojuszu otrzymają §Ypropozycję unii§!. Odmowa oznacza koniec sojuszu."
 RCHE_tt_region:0 "Kontrolujemy co najmniej §Y9§! stanów albo prowadzimy sojusz co najmniej trzech państw"
 RCHE_tt_pl2:0 "Jeśli §YWarszawę – Śródmieście§! trzyma państwo spoza naszego sojuszu i nie jest naszym wasalem, otrzymamy przeciw niemu §Ycel wojenny§! (wojnę trzeba wypowiedzieć samodzielnie)."
