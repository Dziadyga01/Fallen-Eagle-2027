 RSUW_tt_s3:0 "Członkowie naszego sojuszu otrzymają §Ypropozycję unii§!. Odmowa oznacza koniec sojuszu."
 RSUW_tt_region:0 "Kontrolujemy co najmniej §Y36§! stanów albo prowadzimy sojusz co najmniej trzech państw"
 RSUW_tt_pl2:0 "Jeśli §YWarszawę – Śródmieście§! trzyma państwo spoza naszego sojuszu i nie jest naszym wasalem, otrzymamy przeciw niemu §Ycel wojenny§! (wojnę trzeba wypowiedzieć samodzielnie)."
 RSUW_tt_pl3:0 "Kontrolujemy §YWarszawę – Śródmieście§! i co najmniej §Y300§! stanów"
 REG_PDL_tree:0 "Nad Bugiem"
 RPDL_duch:0 "Brama na wschód"
 RPDL_duch_desc:0 "Biała Podlaska leży przy najważniejszym przejściu granicznym z Białorusią. Przez Terespol szły towary, pociągi i ludzie. Teraz idą przez niego także przemytnicy z bronią."
 RPDL_duch2:0 "Terminal Małaszewicze"
 RPDL_duch2_desc:0 "Największy suchy port przeładunkowy w Europie znów pracuje. Pociągi ze wschodu przeładowuje się na tory europejskie – za opłatą."
 RPDL_armia:0 "Straż Nadbużańska"
 RPDL_armia_desc:0 "Straż Graniczna, terytorialsi i ochotnicy pilnują Bugu. Każdy brod jest obserwowany."
 RPDL_sojusz:0 "Związek Nadbużański"
 RPDL_sojusz_desc:0 "Podlasie i sąsiedzi pilnują razem wschodniej granicy."
 RPDL_region:0 "Podlasie Południowe"
 RPDL_region_desc:0 "Od Bugu po Łuków – jedno państwo pilnujące wschodniej bramy."
 RPDL_a_idea:0 "Otwarte Podlasie"
 RPDL_a_idea_desc:0 "Rada Podlasia, punkty pomocy na granicy i współpraca z każdym, kto chce pokoju."
 RPDL_b_idea:0 "Straż Wschodnia"
 RPDL_b_idea_desc:0 "Podlasiem rządzi dowództwo straży granicznej. Bezpieczeństwo przede wszystkim."
 RPDL_c_idea:0 "Kupcy z Małaszewicz"
 RPDL_c_idea_desc:0 "Państwem rządzą operatorzy terminalu i spedytorzy. Wszystko, co przyjeżdża ze wschodu, ma cenę."
 reg.142.t:0 "Ludzie w lesie"
 reg.142.d:0 "Patrol znajduje w lesie pod Sławatyczami grupę wycieńczonych ludzi. Uzbrojeni przemytnicy, którzy przeprowadzili ich przez Bug, uciekli z powrotem na Białoruś. Białoruskie służby milczą."
 reg.142.a:0 "Punkty pomocy i schronienie."
 reg.142.b:0 "Pomoc i ściganie przemytników."
 reg.143.t:0 "Pociąg ze wschodu"
 reg.143.d:0 "Na terminal przyjeżdża pociąg z Chin z elektroniką i częściami. Przewoźnik oferuje dodatkowe wagony – jeśli Podlasie nie będzie sprawdzać ładunku."
 reg.143.a:0 "Sprawdzamy każdy wagon."
 reg.143.b:0 "Bez kontroli, za podwójną opłatą."
 reg.144.t:0 "Przemytnicy z bronią"
 reg.144.d:0 "Uzbrojona grupa przemytników ostrzelała patrol pod Terespolem. Ślady prowadzą do białoruskich służb. Dowództwo pyta o rozkazy."
 reg.144.a:0 "Wzmocnić patrole."
 reg.144.b:0 "Protest dyplomatyczny."
 RPDL_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Otwarte Podlasie (demokracja), Straż Wschodnia (rządy straży granicznej) albo Kupcy z Małaszewicz (rządy kupców)."
