 REG_MLA_tree:0 "Reduta Mławska"
 RMLA_duch:0 "Pozycja Mławska"
 RMLA_duch_desc:0 "W 1939 roku pod Mławą przez trzy dni zatrzymywano armię niemiecką. Schrony z tamtych dni wciąż stoją w polach."
 RMLA_duch2:0 "Fabryki przy S7"
 RMLA_duch2_desc:0 "Zakłady elektroniczne i hale przy ekspresówce produkują dla Mławy – i dla każdego, kto zapłaci."
 RMLA_armia:0 "Obrońcy Reduty"
 RMLA_armia_desc:0 "Żołnierze Mławy przysięgają przy schronach z 1939 roku."
 RMLA_sojusz:0 "Związek Północnego Mazowsza"
 RMLA_sojusz_desc:0 "Mława i sąsiedzi bronią się razem."
 RMLA_region:0 "Ziemia Zawkrzeńska"
 RMLA_region_desc:0 "Od Działdowa po Przasnysz – Mława jest stolicą."
 RMLA_a_idea:0 "Mławska Unia Samorządowa"
 RMLA_a_idea_desc:0 "Rada gmin rządzi Mławą."
 RMLA_b_idea:0 "Front z Konfederacją"
 RMLA_b_idea_desc:0 "Mława wiąże się z Ciechanowem."
 RMLA_c_idea:0 "Reduta Mławska"
 RMLA_c_idea_desc:0 "Komendant reduty rządzi miastem."
 reg.184.t:0 "Schrony w polach"
 reg.184.d:0 "Rolnicy używają starych schronów z 1939 roku jako piwnic na ziemniaki. Wojsko chce je odzyskać."
 reg.184.a:0 "Schrony dla wojska."
 reg.184.b:0 "Ziemniaki też są ważne."
 reg.185.t:0 "Radiostacje na sprzedaż"
 reg.185.d:0 "Konfederacja i Płock chcą kupić radiostacje z mławskiej fabryki."
 reg.185.a:0 "Sprzedać."
 reg.185.b:0 "Tylko dla nas."
 reg.186.t:0 "Rocznica obrony Mławy"
 reg.186.d:0 "Wrześniowa rocznica obrony Mławy gromadzi tłumy."
 reg.186.a:0 "Wielkie obchody."
 reg.186.b:0 "Skromnie."
 RMLA_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Unia Samorządowa (demokracja), Front z Konfederacją (wolny rynek) albo Reduta Mławska (rządy wojskowe)."
