 REG_SWC_tree:0 "Papier i zamek"
 RSWC_duch:0 "Miasto papieru"
 RSWC_duch_desc:0 "Wielkie zakłady papiernicze w Świeciu dają pracę połowie miasta. Bez papieru nie ma ani gazet, ani kartek żywnościowych, ani rozkazów."
 RSWC_duch2:0 "Papiernia Świecie"
 RSWC_duch2_desc:0 "Papiernia pracuje na trzy zmiany. Świecie drukuje gazety, ulotki i bony dla całego regionu."
 RSWC_armia:0 "Straż Wdy"
 RSWC_armia_desc:0 "Straż pilnuje ujścia Wdy do Wisły i mostu w Grudziądzu."
 RSWC_sojusz:0 "Związek Dolnej Wdy"
 RSWC_sojusz_desc:0 "Świecie, Tuchola i sąsiedzi mają wspólną obronę."
 RSWC_region:0 "Ziemia Świecka"
 RSWC_region_desc:0 "Od Wisły po Bory – Świecie jest stolicą."
 RSWC_a_idea:0 "Świecka Unia Samorządowa"
 RSWC_a_idea_desc:0 "Rada miasta i gmin rządzi Świeciem."
 RSWC_b_idea:0 "Lewica Papiernicza"
 RSWC_b_idea_desc:0 "Załoga papierni ma decydujący głos."
 RSWC_c_idea:0 "Wydawnictwo Państwowe"
 RSWC_c_idea_desc:0 "Świecie drukuje propagandę dla wszystkich, którzy zapłacą."
 reg.178.t:0 "Papier na kartki"
 reg.178.d:0 "Sąsiedzi zamawiają papier na kartki żywnościowe i bony. Ktoś proponuje drukować także fałszywe bony sąsiadów."
 reg.178.a:0 "Uczciwy handel."
 reg.178.b:0 "Drukujemy fałszywki."
 reg.179.t:0 "Zamek nad Wdą"
 reg.179.d:0 "Krzyżacki zamek wymaga remontu. Rada może go odnowić jako siedzibę – albo zamienić w magazyn."
 reg.179.a:0 "Siedziba Rady."
 reg.179.b:0 "Magazyn."
 reg.180.t:0 "Wydanie specjalne"
 reg.180.d:0 "Gazeta miejska chce wydać numer specjalny z apelem do ochotników."
 reg.180.a:0 "Drukujcie!"
 reg.180.b:0 "Bez apeli."
