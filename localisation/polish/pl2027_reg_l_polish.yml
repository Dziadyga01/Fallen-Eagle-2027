 REG_TUC_tree:0 "Bory Tucholskie"
 RTUC_duch:0 "Borowiacy"
 RTUC_duch_desc:0 "Mieszkańcy Borów Tucholskich od wieków żyli z lasu i w lesie. Państwo upadło – las został."
 RTUC_duch2:0 "Gospodarka leśna"
 RTUC_duch2_desc:0 "Drewno, żywica, grzyby i jagody. Bory dają wszystko, czego potrzeba do przetrwania."
 RTUC_armia:0 "Leśni strzelcy"
 RTUC_armia_desc:0 "Leśnicy i myśliwi są najlepszymi zwiadowcami w regionie."
 RTUC_sojusz:0 "Związek Borowiacki"
 RTUC_sojusz_desc:0 "Tuchola, Chojnice i Świecie bronią Borów razem."
 RTUC_region:0 "Kraina Borów"
 RTUC_region_desc:0 "Bory Tucholskie mają jedną stolicę."
 RTUC_a_idea:0 "Wspólnota Borów"
 RTUC_a_idea_desc:0 "Rada gmin leśnych rządzi Tucholą."
 RTUC_b_idea:0 "Bractwo Borowiackie"
 RTUC_b_idea_desc:0 "Tradycja, gwara i porządek. Bory rządzą się po swojemu."
 RTUC_c_idea:0 "Straż Borów"
 RTUC_c_idea_desc:0 "Komendant leśnej straży rządzi Tucholą."
 reg.181.t:0 "Grzybobranie"
 reg.181.d:0 "Do Borów przyjeżdżają tłumy z Bydgoszczy i Torunia na grzyby i jagody. Leśnicy chcą opłat za wstęp."
 reg.181.a:0 "Las jest dla wszystkich."
 reg.181.b:0 "Opłata za wstęp."
 reg.182.t:0 "Wycinka"
 reg.182.d:0 "Kupcy z PKP chcą kupić drewno z całego kompleksu leśnego. Leśnicy ostrzegają, że Bory nie odrosną przez pokolenia."
 reg.182.a:0 "Wycinka z umiarem."
 reg.182.b:0 "Sprzedać wszystko."
 reg.183.t:0 "Ćwiczenia w lesie"
 reg.183.d:0 "Batalion ćwiczy w Borach. Leśni strzelcy chcą uczyć innych, jak walczyć w lesie."
 reg.183.a:0 "Szkolenie dla wszystkich."
 reg.183.b:0 "Strzelcy zostają elitą."
 RTUC_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Wspólnota Borów (demokracja), Bractwo Borowiackie (tradycja) albo Straż Borów (rządy wojskowe)."
