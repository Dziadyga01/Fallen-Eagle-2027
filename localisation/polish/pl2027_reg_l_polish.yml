 REG_KRJ_tree:0 "Wał Pomorski"
 RKRJ_duch:0 "Pogranicze Krajny"
 RKRJ_duch_desc:0 "Piła, Złotów i Wałcz leżą na dawnym pograniczu. Na zachodzie niemiecki protektorat, na północy Pomorze – Krajna znów jest ziemią graniczną."
 RKRJ_duch2:0 "Węzeł Piła"
 RKRJ_duch2_desc:0 "Piła jest węzłem kolejowym północnej Wielkopolski. Fabryki, warsztaty i magazyny – wszystko kręci się wokół torów."
 RKRJ_armia:0 "Garnizon Wałcz"
 RKRJ_armia_desc:0 "Garnizon w Wałczu był zawsze jednym z ważniejszych na zachodzie. Teraz jest armią całej Krajny."
 RKRJ_sojusz:0 "Związek Krajeński"
 RKRJ_sojusz_desc:0 "Krajna, Zabory i Bory mają wspólną obronę przed protektoratem."
 RKRJ_region:0 "Wielka Krajna"
 RKRJ_region_desc:0 "Od Wałcza po Nakło – jedno państwo na granicy."
 RKRJ_a_idea:0 "Republika Krajeńska"
 RKRJ_a_idea_desc:0 "Rada Republiki w Pile i wybory w gminach."
 RKRJ_b_idea:0 "Strażnicy Wału"
 RKRJ_b_idea_desc:0 "Republiką rządzi komendant garnizonu w Wałczu. Wszystko podporządkowane obronie granicy."
 RKRJ_c_idea:0 "Kolejarska Republika"
 RKRJ_c_idea_desc:0 "Republiką rządzą kolejarze i warsztatowcy. Pociągi jeżdżą punktualnie – to nowy ustrój."
 reg.157.t:0 "Ciężarówki z protektoratu"
 reg.157.d:0 "Na posterunku pod Wałczem stoi kolumna ciężarówek z protektoratu. Niemieccy kierowcy wiozą towary do Bydgoszczy i chcą przejazdu bez kontroli."
 reg.157.a:0 "Kontrolujemy każdy ładunek."
 reg.157.b:0 "Przepuścić za opłatą."
 reg.158.t:0 "Pociąg pancerny"
 reg.158.d:0 "Warsztaty w Pile skończyły pierwszy pociąg pancerny. Kolejarze chcą go nazwać na cześć patrona miasta, wojsko – na cześć jednostki z Wałcza."
 reg.158.a:0 "Nazwa kolejarzy."
 reg.158.b:0 "Nazwa wojska."
 reg.159.t:0 "Bunkry Wału"
 reg.159.d:0 "Saperzy znaleźli w lasach pod Wałczem nienaruszone bunkry Wału Pomorskiego. Mogą je odkopać – ale potrzebują ludzi i miesięcy pracy."
 reg.159.a:0 "Odkopać bunkry."
 reg.159.b:0 "Ludzie są potrzebni w fabrykach."
 RKRJ_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Republika Krajeńska (demokracja), Strażnicy Wału (rządy wojskowe) albo Kolejarska Republika."
 RKRJ_a_lider:0 "Prezydent Republiki Krajeńskiej"
 RKRJ_b_lider:0 "Komendant Garnizonu Wałcz"
 RKRJ_c_lider:0 "Związek Kolejarzy Krajny"
 RKRJ_SOJUSZ:0 "Związek Krajeński"
 RKRJ_tt_s1:0 "Sąsiedzi ([CHJ.GetNameDef], [KRW.GetNameDef]) otrzymają §Ypropozycję sojuszu§!."
 RKRJ_tt_s3:0 "Członkowie naszego sojuszu otrzymają §Ypropozycję unii§!. Odmowa oznacza koniec sojuszu."
 RKRJ_tt_region:0 "Kontrolujemy co najmniej §Y21§! stanów albo prowadzimy sojusz co najmniej trzech państw"
 RKRJ_tt_pl2:0 "Jeśli §YWarszawę – Śródmieście§! trzyma państwo spoza naszego sojuszu i nie jest naszym wasalem, otrzymamy przeciw niemu §Ycel wojenny§! (wojnę trzeba wypowiedzieć samodzielnie)."
 RKRJ_tt_pl3:0 "Kontrolujemy §YWarszawę – Śródmieście§! i co najmniej §Y300§! stanów"
 REG_GNZ_tree:0 "Pierwsza stolica"
 RGNZ_duch:0 "Kolebka państwa"
 RGNZ_duch_desc:0 "Tu koronowano pierwszych królów, tu stoją Drzwi Gnieźnieńskie i katedra prymasów. Gniezno uważa, że skoro Polska tu się zaczęła, tu może się zacząć od nowa."
 RGNZ_duch2:0 "Wielkopolska wieś"
 RGNZ_duch2_desc:0 "Gospodarstwa wokół Gniezna są najlepiej zorganizowane w kraju. Spółdzielnie, maszyny i magazyny – wszystko działa."
 RGNZ_armia:0 "Drużyna Piastowska"
 RGNZ_armia_desc:0 "Gwardia Gniezna nosi na tarczach białego orła z czasów Chrobrego. Mało żołnierzy, dużo symboli – i coraz więcej ochotników."
 RGNZ_sojusz:0 "Związek Piastowski"
 RGNZ_sojusz_desc:0 "Gniezno, Pałuki i Konin mają wspólną obronę – w imię wspólnej historii."
 RGNZ_region:0 "Ziemia Gnieźnieńska"
 RGNZ_region_desc:0 "Od Trzemeszna po Wrześnię – Gniezno znów jest stolicą."
 RGNZ_a_idea:0 "Ludowa Wielkopolska"
 RGNZ_a_idea_desc:0 "Ruch ludowy rządzi Gnieznem: rolnicy, spółdzielnie i samorządy. Tradycja Witosa w wersji wielkopolskiej."
 RGNZ_b_idea:0 "Królestwo Piastów"
 RGNZ_b_idea_desc:0 "Gniezno ogłasza, że jest stolicą przyszłego Królestwa. Korona leży w katedrze i czeka."
 RGNZ_c_idea:0 "Prymasowskie Gniezno"
 RGNZ_c_idea_desc:0 "Rada przy archidiecezji ma decydujący głos. Gniezno jest stolicą duchową – i coraz bardziej polityczną."
 reg.160.t:0 "Pielgrzymi z całej Polski"
 reg.160.d:0 "Do Gniezna przybywają pielgrzymi z rozbitej Polski. Chcą się modlić przy relikwiach św. Wojciecha, ale potrzebują jedzenia i noclegu."
 reg.160.a:0 "Przyjąć wszystkich."
 reg.160.b:0 "Tylko na trzy dni."
 reg.161.t:0 "Spór z Poznaniem"
 reg.161.d:0 "Niemiecki protektorat w Poznaniu ogłasza, że Gniezno należy do „historycznej Wielkopolski” pod jego zarządem. W Gnieźnie wrze."
 reg.161.a:0 "Gniezno było pierwsze."
 reg.161.b:0 "Nie odpowiadamy na prowokacje."
 reg.162.t:0 "Tarcze z orłem"
 reg.162.d:0 "Drużyna Piastowska chce nosić tarcze z orłem na defiladach. Kwatermistrz woli kamizelki kuloodporne."
 reg.162.a:0 "Tarcze na defilady, kamizelki do walki."
 reg.162.b:0 "Tylko kamizelki."
 RGNZ_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Ludowa Wielkopolska (ruch ludowy), Królestwo Piastów (monarchia) albo Prymasowskie Gniezno (rządy przy Kościele)."
 RGNZ_a_lider:0 "Prezes Stronnictwa Ludowego"
 RGNZ_b_lider:0 "Rada Koronna Gniezna"
