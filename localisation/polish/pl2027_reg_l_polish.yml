 REG_NAR_tree:0 "Nad Narwią"
 RNAR_duch:0 "Państwo Narodowe"
 RNAR_duch_desc:0 "Łomża ogłasza państwo oparte na „narodzie, porządku i pracy”. Hasła są proste, a ludzie zmęczeni chaosem – gotowi ich słuchać."
 RNAR_duch2:0 "Mleko, piwo i Narew"
 RNAR_duch2_desc:0 "Mleczarnie w Piątnicy, browar w Łomży i barki na Narwi. Gospodarka małego państwa, która wystarcza, żeby przetrwać."
 RNAR_armia:0 "Strzelcy Kurpiowscy"
 RNAR_armia_desc:0 "Kurpie znają puszczę lepiej niż ktokolwiek. Ich strzelcy potrafią zniknąć w lesie i pojawić się na tyłach wroga."
 RNAR_sojusz:0 "Związek Nadnarwiański"
 RNAR_sojusz_desc:0 "Miasta nad Narwią mają wspólną obronę i wspólne barki. Rzeka jest granicą – i drogą."
 RNAR_region:0 "Ziemia Łomżyńska"
 RNAR_region_desc:0 "Od Puszczy Kurpiowskiej po Biebrzę – jedna władza i jeden porządek."
 RNAR_a_idea:0 "Straż Narodowa"
 RNAR_a_idea_desc:0 "Twardy porządek: godzina policyjna, cenzura i Straż Narodowa na każdym rogu. Przestępczość spada, wolność też."
 RNAR_b_idea:0 "Wspólnota kurpiowska"
 RNAR_b_idea_desc:0 "Kurpie mają swoje sejmiki, swoje święta i swoją straż. Państwo jest bardziej federacją gmin niż naczelnikiem."
 RNAR_c_idea:0 "Republika Nadnarwiańska"
 RNAR_c_idea_desc:0 "Umiarkowani radni odsunęli nacjonalistów od władzy. Wybory, sąd i wolne media – nad Narwią to nowość."
 reg.121.t:0 "Opaski na ulicach"
 reg.121.d:0 "Ochotnicy w białych opaskach zatrzymują ludzi bez dokumentów. W ciągu tygodnia znikają grabieże – ale areszt w ratuszu zapełnia się ludźmi, którzy „wyglądali podejrzanie”. Rodziny czekają pod drzwiami bez żadnych informacji."
 reg.121.a:0 "Straż ma podlegać sądowi."
 reg.121.b:0 "Porządek wymaga ofiar."
 reg.122.t:0 "Piwo dla żołnierzy"
 reg.122.d:0 "Browar w Łomży ma nadwyżki. Kwatermistrz chce piwo jako dodatek do racji żołnierskich, a lekarze ostrzegają przed „morale w płynie”."
 reg.122.a:0 "Jeden kufel dziennie."
 reg.122.b:0 "Na sprzedaż – za broń."
 reg.123.t:0 "Strzelcy z puszczy"
 reg.123.d:0 "Kurpiowscy strzelcy chcą walczyć we własnych oddziałach, pod własnymi dowódcami i w puszczy, nie w okopach."
 reg.123.a:0 "Niech walczą po swojemu."
 reg.123.b:0 "Jedna armia, jeden rozkaz."
 RNAR_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Straż Narodowa (nacjonalizm), Wspólnota kurpiowska (regionalny konserwatyzm) albo Republika Nadnarwiańska (umiarkowana demokracja)."
 RNAR_b_lider:0 "Starosta Kurpiowski"
 RNAR_c_lider:0 "Burmistrz Łomży"
 RNAR_SOJUSZ:0 "Związek Nadnarwiański"
