 REG_NOT_tree:0 "Porcelana nad Notecią"
 RNOT_duch:0 "Między protektoratami"
 RNOT_duch_desc:0 "Ziemia Nadnotecka graniczy z dwoma niemieckimi protektoratami. Chodzież, Czarnków i Ujście pilnują Noteci jak granicy – bo nią są."
 RNOT_duch2:0 "Porcelana z Chodzieży"
 RNOT_duch2_desc:0 "Fabryka porcelany znów pracuje. Filiżanki z Chodzieży są towarem eksportowym – nawet do protektoratów."
 RNOT_armia:0 "Straż Noteci"
 RNOT_armia_desc:0 "Straż pilnuje rzeki i przepraw."
 RNOT_sojusz:0 "Związek Nadnotecki"
 RNOT_sojusz_desc:0 "Ziemia Nadnotecka i sąsiedzi bronią się przed protektoratami."
 RNOT_region:0 "Ziemia Nadnotecka"
 RNOT_region_desc:0 "Od Czarnkowa po Ujście – jedno państwo nad Notecią."
 RNOT_a_idea:0 "Nadnotecka Wspólnota"
 RNOT_a_idea_desc:0 "Rada gmin rządzi Ziemią."
 RNOT_b_idea:0 "Ruch Pilski"
 RNOT_b_idea_desc:0 "Ziemia wiąże się z Piłą i Krajną."
 RNOT_c_idea:0 "Handel z protektoratem"
 RNOT_c_idea_desc:0 "Chodzież handluje z Niemcami. Porcelana za paliwo."
 reg.187.t:0 "Przemyt przez Noteć"
 reg.187.d:0 "Łodzie przemytników przewożą przez Noteć paliwo z protektoratu."
 reg.187.a:0 "Zatrzymać przemyt."
 reg.187.b:0 "Pobierać cło od przemytników."
 reg.188.t:0 "Filiżanki dla protektoratu"
 reg.188.d:0 "Protektorat zamawia porcelanę dla urzędów. Płaci paliwem."
 reg.188.a:0 "Handel to handel."
 reg.188.b:0 "Nie handlujemy z okupantem."
 reg.189.t:0 "Patrol na granicy"
 reg.189.d:0 "Patrol niemieckiego protektoratu przekroczył Noteć „przez pomyłkę”. Straż pyta o rozkazy."
 reg.189.a:0 "Odprowadzić z powrotem."
 reg.189.b:0 "Zatrzymać patrol."
