 REG_CHE_tree:0 "Prawo chełmińskie"
 RCHE_duch:0 "Miasto zakochanych"
 RCHE_duch_desc:0 "Chełmno ma relikwie św. Walentego, gotyckie mury i najstarsze prawo miejskie w Polsce. Mieszkańcy żartują, że skoro miasto przetrwało osiemset lat, przetrwa i rozpad."
 RCHE_duch2:0 "Sady nad Wisłą"
 RCHE_duch2_desc:0 "Sady na skarpach, ogrody i przetwórnie owoców. Ziemia Chełmińska ma niewiele przemysłu, ale dużo jabłek – i cierpliwości."
 RCHE_armia:0 "Straż murów"
 RCHE_armia_desc:0 "Mury obronne Chełmna – jedne z najlepiej zachowanych w Polsce – znów mają obrońców."
 RCHE_sojusz:0 "Związek Ziemi Chełmińskiej"
 RCHE_sojusz_desc:0 "Chełmno, Chełmża i gminy wokół mają wspólną obronę i wspólne prawo."
 RCHE_region:0 "Ziemia Chełmińska"
 RCHE_region_desc:0 "Od Wisły po Drwęcę – Chełmno znów jest stolicą ziemi, której nazwę nosi."
 RCHE_a_idea:0 "Prawo chełmińskie"
 RCHE_a_idea_desc:0 "Przywilej z 1233 roku dał miastom samorząd, sąd i wolność. Nowa konstytucja Chełmna zaczyna się od tych samych słów."
 RCHE_b_idea:0 "Bractwo Chełmińskie"
 RCHE_b_idea_desc:0 "Miastem rządzi bractwo mieszczan, cechów i parafii. Tradycja i porządek."
 RCHE_c_idea:0 "Chełmno pod opieką Torunia"
 RCHE_c_idea_desc:0 "Chełmno szuka opieki u silniejszego sąsiada. Zachowuje swoje prawo – i zyskuje armię za plecami."
 reg.172.t:0 "Walentynki w czasie rozpadu"
 reg.172.d:0 "Zbliża się 14 lutego. Do Chełmna – „miasta zakochanych” – przyjeżdżają pary z całego regionu, mimo posterunków i zamkniętych dróg."
 reg.172.a:0 "Święto zakochanych odbędzie się."
 reg.172.b:0 "Za dużo obcych w mieście."
 reg.173.t:0 "Spór o skarpę"
 reg.173.d:0 "Toruń i Bydgoszcz – każde z miast – obiecuje Chełmnu pieniądze na umocnienie osuwającej się skarpy. W zamian chcą poparcia w sporze o metropolię."
 reg.173.a:0 "Bierzemy od Torunia."
 reg.173.b:0 "Bierzemy od Bydgoszczy."
 reg.173.c:0 "Sami umocnimy skarpę."
 reg.174.t:0 "Pręt chełmiński"
 reg.174.d:0 "Kwatermistrz proponuje, by wszystkie zapasy mierzyć według dawnej miary – pręta chełmińskiego. Żart, który staje się tradycją."
 reg.174.a:0 "Niech żyje pręt chełmiński!"
 reg.174.b:0 "Mierzymy w metrach."
 RCHE_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Prawo chełmińskie (demokracja miejska), Bractwo Chełmińskie (konserwatyzm) albo opieka silniejszego sąsiada."
 RCHE_a_lider:0 "Burmistrz Wolnego Miasta Chełmna"
 RCHE_b_lider:0 "Starszy Bractwa Chełmińskiego"
 RCHE_c_lider:0 "Rada Kupiecka Chełmna"
 RCHE_SOJUSZ:0 "Związek Ziemi Chełmińskiej"
