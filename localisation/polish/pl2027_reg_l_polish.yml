 REG_CHZ_tree:0 "Katedra i cukrownia"
 RCHZ_duch:0 "Miasto nad jeziorem"
 RCHZ_duch_desc:0 "Chełmża ma katedrę, jezioro i cukrownię. To wystarcza, żeby mieć wiarę, wodę i słodki towar na wymianę."
 RCHZ_duch2:0 "Cukrownia Chełmża"
 RCHZ_duch2_desc:0 "Najstarsza cukrownia w regionie pracuje na pełnych obrotach. Cukier to waluta."
 RCHZ_armia:0 "Straż Jeziora"
 RCHZ_armia_desc:0 "Ochotnicy pilnują brzegów jeziora i dróg do Torunia."
 RCHZ_sojusz:0 "Związek Jeziora Chełmżyńskiego"
 RCHZ_sojusz_desc:0 "Chełmża i gminy wokół jeziora mają wspólną obronę."
 RCHZ_region:0 "Ziemia Chełmżyńska"
 RCHZ_region_desc:0 "Chełmża jest stolicą gmin wokół jeziora."
 RCHZ_a_idea:0 "Wolne Miasto Chełmża"
 RCHZ_a_idea_desc:0 "Rada miasta, wybory i jawny budżet."
 RCHZ_b_idea:0 "Bractwo Katedralne"
 RCHZ_b_idea_desc:0 "Rada przy katedrze ma decydujący głos."
 RCHZ_c_idea:0 "Cukrowa Republika"
 RCHZ_c_idea_desc:0 "Miastem rządzą pracownicy i plantatorzy cukrowni."
 reg.175.t:0 "Lód na jeziorze"
 reg.175.d:0 "Jezioro zamarzło. Przemytnicy jeżdżą po lodzie z Torunia, omijając posterunki."
 reg.175.a:0 "Patrole na lodzie."
 reg.175.b:0 "Pobierać opłaty na lodzie."
 reg.176.t:0 "Cukier dla Torunia"
 reg.176.d:0 "Toruń chce kupić całą produkcję cukrowni. Płaci dobrze, ale Chełmża uzależni się od jednego odbiorcy."
 reg.176.a:0 "Sprzedać Toruniowi."
 reg.176.b:0 "Sprzedawać wszystkim."
 reg.177.t:0 "Regaty na jeziorze"
 reg.177.d:0 "Klub żeglarski proponuje regaty – i szkolenie łodzi patrolowych przy okazji."
 reg.177.a:0 "Regaty i szkolenie."
 reg.177.b:0 "Nie czas na regaty."
