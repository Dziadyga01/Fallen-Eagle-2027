 REG_KLS_tree:0 "Najstarsze miasto"
 RKLS_duch:0 "Calisia"
 RKLS_duch_desc:0 "Kalisz był wymieniany przez Ptolemeusza, zanim ktokolwiek słyszał o Polsce. Najstarsze miasto w kraju nie zamierza zniknąć razem z państwem."
 RKLS_duch2:0 "Silniki z Kalisza"
 RKLS_duch2_desc:0 "Zakłady lotnicze w Kaliszu produkują silniki i części. Kalisz sprzedaje technologię, której nie ma nikt inny w regionie."
 RKLS_armia:0 "Gwardia Kaliska"
 RKLS_armia_desc:0 "Gwardia Kaliska jest mała, dobrze wyszkolona i dumna z historii miasta."
 RKLS_sojusz:0 "Związek Południowej Wielkopolski"
 RKLS_sojusz_desc:0 "Kalisz, Ostrów i Leszno mają wspólną obronę. Południowa Wielkopolska trzyma się razem."
 RKLS_region:0 "Wielkopolska Południowa"
 RKLS_region_desc:0 "Od Ostrowa po Turek – Kalisz jest stolicą regionu, który ma dwa tysiące lat historii."
 RKLS_a_idea:0 "Republika Kaliska"
 RKLS_a_idea_desc:0 "Rada Miasta, wolne media i wybory co dwa lata. Kalisz chce być wzorem dla reszty kraju."
 RKLS_b_idea:0 "Wielkopolska organizacja"
 RKLS_b_idea_desc:0 "Porządek, oszczędność i praca u podstaw. Kalisz rządzi się jak dobre gospodarstwo."
 RKLS_c_idea:0 "Pruska granica"
 RKLS_c_idea_desc:0 "Kalisz był miastem granicznym przez stulecie. Teraz znów stawia na wojsko i umocnienia."
 reg.130.t:0 "Ostrów chce więcej"
 reg.130.d:0 "Radni z Ostrowa Wielkopolskiego twierdzą, że Kalisz decyduje o wszystkim. Chcą połowy ministerstw – albo własnego państwa."
 reg.130.a:0 "Połowa ministerstw dla Ostrowa."
 reg.130.b:0 "Stolica jest jedna."
 reg.131.t:0 "Silniki na sprzedaż"
 reg.131.d:0 "Niemiecka spółka ze Śląska oferuje świetne pieniądze za licencję na silniki z Kalisza. Inżynierowie ostrzegają, że to technologia wojskowa."
 reg.131.a:0 "Sprzedać licencję."
 reg.131.b:0 "Technologia zostaje w Kaliszu."
 reg.132.t:0 "Pianina dla żołnierzy"
 reg.132.d:0 "Dawna fabryka pianin ma w magazynach kilkadziesiąt instrumentów. Ktoś proponuje rozdać je do koszar – „żołnierze też muszą mieć coś na wieczór”."
 reg.132.a:0 "Muzyka w koszarach."
 reg.132.b:0 "Drewno na opał."
 RKLS_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Republika Kaliska (demokracja), Wielkopolska organizacja (rządy gospodarzy) albo Pruska granica (militaryzacja)."
