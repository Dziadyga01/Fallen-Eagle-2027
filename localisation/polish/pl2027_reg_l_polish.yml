l_polish:
 reg.1.t:0 "Propozycja sojuszu"
 reg.1.d:0 "[From.GetName] proponuje nam sojusz obronny: wspólny sztab, wymianę informacji i pomoc w razie ataku. Na gruzach Rzeczypospolitej nikt nie przetrwa sam – piszą posłowie, którzy przywieźli list."
 reg.1.a:0 "Przyjmujemy sojusz."
 reg.1.b:0 "Pójdziemy własną drogą."
 reg.2.t:0 "Sojusz zawarty"
 reg.2.d:0 "[From.GetName] przyjmuje naszą propozycję. Od dziś nasze sztaby pracują razem."
 reg.2.a:0 "Razem jesteśmy silniejsi."
 reg.3.t:0 "Odmowa"
 reg.3.d:0 "[From.GetName] odrzuca sojusz. Posłowie wracają z pustymi rękami i jedną pewnością: sąsiad ma własne plany."
 reg.3.a:0 "Zapamiętamy to."
 reg.4.t:0 "Propozycja unii"
 reg.4.d:0 "[From.GetName] proponuje, byśmy weszli w skład wspólnego państwa: jeden rząd, jedna armia, jeden budżet. Nasi urzędnicy zachowają stanowiska, a nasza ziemia – własne święta i własne herby. Odmowa oznacza koniec sojuszu."
 reg.4.a:0 "Zgadzamy się. Razem zbudujemy państwo."
 reg.4.b:0 "Zostajemy niezależni."
 reg.5.t:0 "Unia przyjęta"
 reg.5.d:0 "[From.GetName] wchodzi w skład naszego państwa. Na ratuszu zawisa nasza flaga, a na sesji rady – nasz herb obok ich herbu."
 reg.5.a:0 "Witamy."
 reg.6.t:0 "Unia odrzucona"
 reg.6.d:0 "[From.GetName] odrzuca unię i opuszcza sojusz. Ich rada miejska ogłasza, że „niepodległości nie oddaje się w prezencie”."
 reg.6.a:0 "W takim razie siłą."
 reg.6.b:0 "Niech idą swoją drogą."
 PLG_LIGA:0 "Liga Małych Ojczyzn"
 PLG_tt_patron:0 "Silny sąsiad (co najmniej §Ydwa razy§! silniejszy od nas) otrzyma prośbę o objęcie nas opieką. Może nas przyjąć jako państwo zależne, §Rwcielić§! albo §Rodmówić§! – po odmowie gałąź prowadzi do samodzielnej autonomii."
 PLG_req_patron:0 "Mamy polskiego sąsiada co najmniej dwa razy silniejszego od nas, z którym nie jesteśmy w stanie wojny"
 PLG_tt_liga:0 "Małe sąsiednie państwa polskie (do §Y5§! regionów) otrzymają §Ypropozycję sojuszu§!."
 PLG_tt_unia:0 "Członkowie Ligi otrzymają §Ypropozycję unii§!. Odmowa oznacza koniec sojuszu."
 PLG_autonomia:0 "Autonomia w unii"
 PLG_autonomia_desc:0 "Mamy opiekuna, ale zachowujemy własną radę, własne święta i własną straż."
 PLG_liga:0 "Liga Małych Ojczyzn"
 PLG_liga_desc:0 "Alarm w jednej gminie podnosi wszystkie. Mali razem są za duzi, by ich połknąć."
 PLG_samorzad:0 "Samorząd bez opiekuna"
 PLG_samorzad_desc:0 "Nikt nas nie chciał – więc rządzimy się sami, ostrożnie i oszczędnie."
 PLG_tt_autonomia:0 "Jeśli jesteśmy państwem zależnym: duch §YAutonomia w unii§!. Jeśli opiekun odmówił: duch §YSamorząd bez opiekuna§!."
 PLG_twierdza:0 "Sami sobie panami"
 PLG_twierdza_desc:0 "Nikt nam nie pomoże i nikomu się nie poddamy. Każdy dom to posterunek."
 plg.1.t:0 "Prośba o opiekę"
 plg.1.d:0 "[From.GetName] prosi nas o objęcie opieką. Ich wójt przyjechał osobiście: obiecuje drogi, ludzi i lojalność w zamian za ochronę i samorząd. Możemy przyjąć ich jako państwo zależne – albo od razu wcielić."
 plg.1.a:0 "Przyjmujemy pod opiekę."
 plg.1.b:0 "Wcielić ich ziemię."
 plg.1.c:0 "Nie potrzebujemy kłopotów."
 plg.2.t:0 "Mamy opiekuna"
 plg.2.d:0 "[From.GetName] obejmuje nas opieką. Zachowujemy samorząd – i zyskujemy kogoś, kto stanie w naszej obronie."
 plg.2.a:0 "Dobrze, że nie jesteśmy sami."
 plg.3.t:0 "Odmowa opieki"
 plg.3.d:0 "[From.GetName] odmawia. Wójt wraca z pustymi rękami. Trzeba będzie radzić sobie samemu."
 plg.3.a:0 "Poradzimy sobie."
 plg.4.t:0 "Odpust parafialny"
 plg.4.d:0 "Na odpust przychodzi cała gmina – i pół sąsiedniej. Między straganami z obwarzankami ktoś handluje paliwem, a ktoś inny zbiera podpisy pod petycją do rady. Proboszcz pyta, czy gmina dołoży się do remontu dachu kościoła."
 plg.4.a:0 "Dołożymy się – to nasz wspólny dom."
 plg.4.b:0 "Kasa gminy jest na straż i drogi."
 plg.5.t:0 "Sołtys kontra burmistrz"
 plg.5.d:0 "Sołtys największej wsi twierdzi, że miasto zabiera wszystkie pieniądze z unii z opiekunem. Na zebraniu wiejskim padają ostre słowa – i propozycja, by wieś miała własnego przedstawiciela w radzie."
 plg.5.a:0 "Wieś dostaje miejsce w radzie."
 plg.5.b:0 "Rada zostaje, jak była."
 plg.6.t:0 "Turniej strażaków"
 plg.6.d:0 "Ochotnicze straże pożarne organizują turniej: sikawki, wyścigi z wężami i przeciąganie liny. Komendant straży gminnej widzi w tym trening – i okazję do werbunku."
 plg.6.a:0 "Turniej i werbunek."
 plg.6.b:0 "Po prostu święto."
 REG_t_cywilna:0 "Priorytet odbudowy"
 REG_t_cywilna_desc:0 "Cement, cegły i ciężarówki idą najpierw na domy, szpitale i zakłady cywilne. Zbrojeniówka czeka w kolejce."
 REG_t_wojenna:0 "Priorytet zbrojeń"
 REG_t_wojenna_desc:0 "Każda wolna hala produkuje dla wojska. Sklepy pustoszeją, a ludzie pytają, kiedy skończy się „tymczasowy” stan."
 REG_t_mobilizacja:0 "Przyspieszona mobilizacja"
 REG_t_mobilizacja_desc:0 "Pobór obejmuje roczniki, które dotąd pracowały w fabrykach. Rekrutów jest więcej – rąk do pracy i karabinów mniej."
 REG_t_kadry:0 "Armia z kadr"
 REG_t_kadry_desc:0 "Zamiast masowego poboru – mniej ludzi, ale porządnie wyposażonych i wyszkolonych przez zawodowych instruktorów."
 REG_t_ustepstwa:0 "Ustępstwa wobec darczyńców"
 REG_t_ustepstwa_desc:0 "Zagraniczni darczyńcy mają swoich doradców w ministerstwach i swoje warunki w każdej umowie."
 REG_t_samodzielnosc:0 "Bez obcych pieniędzy"
 REG_t_samodzielnosc_desc:0 "Odmówiliśmy pomocy z zewnątrz. Jest biedniej, ale nikt nie dyktuje nam warunków."
 REG_t_centralizacja:0 "Centralizacja"
 REG_t_centralizacja_desc:0 "Starostów mianuje stolica, budżety gmin zatwierdza ministerstwo. Administracja działa szybciej – i coraz mniej słucha prowincji."
 REG_t_niezadowolenie:0 "Niezadowolenie regionów"
 REG_t_niezadowolenie_desc:0 "Przyłączone ziemie protestują przeciw urzędnikom przysłanym ze stolicy. To minie – jeśli administracja dotrzyma obietnic."
 REG_t_porozumienie:0 "Porozumienie z samorządami"
 REG_t_porozumienie_desc:0 "Lokalne władze zostają na stanowiskach i współrządzą. Integracja idzie gładko, ale część dochodów zostaje w gminach."
 REG_t_przejscie:0 "Okres przejściowy"
 REG_t_przejscie_desc:0 "Nowy ustrój dopiero się uczy rządzić. Urzędnicy czekają na nowe instrukcje, a przeciwnicy liczą na potknięcie."
 REG_rzeczpospolita:0 "Rzeczpospolita Odrodzona"
 REG_rzeczpospolita_desc:0 "Jeden rząd, jedna armia, jedna waluta. Państwo, które powstało z jednego regionu, mówi teraz w imieniu całej Polski – i musi udowodnić, że potrafi."
 REG_KUJ_tree:0 "Kujawy – sól ziemi"
 RKUJ_duch:0 "Uzdrowisko w czasie rozpadu"
 RKUJ_duch_desc:0 "Tężnie w Inowrocławiu wciąż pracują, a do sanatoriów przyjeżdżają ludzie, którzy uciekli przed chaosem z Torunia i Bydgoszczy. Miasto żyje z tego, że daje innym odpocząć."
 RKUJ_duch2:0 "Kujawskie zagłębie chemiczne"
 RKUJ_duch2_desc:0 "Sodownie w Mątwach i Janikowie, cukrownie i zakłady tłuszczowe w Kruszwicy pracują na trzy zmiany. Kujawy mają to, czego potrzebuje każde rozbite państwo: chemię i jedzenie."
 RKUJ_armia:0 "Kujawska Obrona Terytorialna"
 RKUJ_armia_desc:0 "Brygada terytorialna z Inowrocławia stała się zalążkiem armii. Żołnierze znają każdą drogę między polami buraków – i każdą stodołę, w której można się okopać."
 RKUJ_sojusz:0 "Związek Kujawski"
 RKUJ_sojusz_desc:0 "Gminy Kujaw mają wspólny sztab i wspólne magazyny. Kto napadnie na jedną, ma przeciw sobie wszystkie."
 RKUJ_region:0 "Zjednoczone Kujawy"
 RKUJ_region_desc:0 "Od Gopła po Wisłę jedna administracja, jedna waluta i jedno wojsko. Kujawy przestały być pograniczem cudzych państw."
 RKUJ_a_idea:0 "Sejmik Kujawski"
 RKUJ_a_idea_desc:0 "Sejmik w Inowrocławiu obraduje co tydzień, a każda gmina ma w nim swój głos. Wolniej, ale wszyscy wiedzą, na co idą podatki."
 RKUJ_b_idea:0 "Korona Piastów"
 RKUJ_b_idea_desc:0 "Kruszwica była stolicą, zanim powstała Polska. Książę Kujaw przypomina o tym przy każdej okazji – i przy każdym poborze."
 RKUJ_c_idea:0 "Rady Sodowe"
 RKUJ_c_idea_desc:0 "Zakładami rządzą rady pracownicze. Soda, cukier i chleb są dla wszystkich – o ile wszyscy pracują."
 reg.100.t:0 "Kuracjusze z Torunia"
 reg.100.d:0 "Do sanatoriów w Inowrocławiu przyjeżdżają setki ludzi z Torunia i Bydgoszczy – ranni, chorzy i ci, którzy po prostu mają pieniądze, by przeczekać chaos w uzdrowisku. Dyrektorzy sanatoriów pytają Radę, komu dać pokoje."
 reg.100.a:0 "Sanatoria dla rannych i chorych."
 reg.100.b:0 "Kto płaci, ten mieszka."
 reg.101.t:0 "Strajk w sodowni"
 reg.101.d:0 "Robotnicy sodowni w Mątwach odchodzą od pieców. Żądają pensji w żywności, nie w bezwartościowych bonach Republiki. Bez sody stanie połowa przemysłu."
 reg.101.a:0 "Wypłacić w żywności."
 reg.101.b:0 "Straż Miejska otworzy bramy."
 reg.102.t:0 "Myszy z Mysiej Wieży"
 reg.102.d:0 "Na barykadach pod Kruszwicą ktoś namalował mysz w koronie. Żołnierze Dywizji Kujawskiej przyjmują ją za godło – „myszy zjadły Popiela, zjedzą i każdego, kto tu przyjdzie”."
 reg.102.a:0 "Niech będzie godłem dywizji."
 reg.102.b:0 "Wojsko to nie kabaret."
 RKUJ_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Sejmik Kujawski (demokracja samorządowa), Księstwo Kujawskie (monarchia Piastów) albo Rady Sodowe (rady robotnicze)."
 RKUJ_b_lider:0 "Rada Koronna Kujaw"
 RKUJ_c_lider:0 "Rada Delegatów Sodowni"
 RKUJ_SOJUSZ:0 "Związek Kujawski"
 RKUJ_tt_s1:0 "Sąsiedzi ([WLC.GetNameDef], [PLK.GetNameDef]) otrzymają §Ypropozycję sojuszu§!."
 RKUJ_tt_s3:0 "Członkowie naszego sojuszu otrzymają §Ypropozycję unii§!. Odmowa oznacza koniec sojuszu."
 RKUJ_tt_region:0 "Kontrolujemy co najmniej §Y19§! stanów albo prowadzimy sojusz co najmniej trzech państw"
 RKUJ_tt_pl2:0 "Jeśli §YWarszawę – Śródmieście§! trzyma państwo spoza naszego sojuszu i nie jest naszym wasalem, otrzymamy przeciw niemu §Ycel wojenny§! (wojnę trzeba wypowiedzieć samodzielnie)."
 RKUJ_tt_pl3:0 "Kontrolujemy §YWarszawę – Śródmieście§! i co najmniej §Y300§! stanów"
 RKUJ_sanatoria:0 "Szpitale w uzdrowisku"
 RKUJ_sanatoria_desc:0 "Tężnie, solanki i lekarze z całego regionu. Ranni wracają na front szybciej niż gdziekolwiek indziej."
 REG_GRU_tree:0 "Twierdza nad Wisłą"
 RGRU_duch:0 "Miasto-twierdza"
 RGRU_duch_desc:0 "Cytadela, spichrze nad Wisłą i koszary po dawnych pułkach. Grudziądz był zbudowany, żeby przetrwać oblężenie – i właśnie to robi."
 RGRU_duch2:0 "Port na Wiśle"
 RGRU_duch2_desc:0 "Barki z Grudziądza pływają do Torunia, Świecia i Kwidzyna. Kto ma rzekę, ten ma handel – nawet gdy drogi są zablokowane."
 RGRU_armia:0 "Szkoła Cytadeli"
 RGRU_armia_desc:0 "Na dziedzińcu Cytadeli znów musztruje się rekrutów. Grudziądz ma najlepszych podoficerów w regionie – i wie o tym."
 RGRU_sojusz:0 "Liga Dolnej Wisły"
 RGRU_sojusz_desc:0 "Miasta nad Wisłą mają wspólną flotyllę barek i wspólne posterunki na mostach. Rzeka łączy, zamiast dzielić."
 RGRU_region:0 "Ziemia Grudziądzka"
 RGRU_region_desc:0 "Od Wisły po Drwęcę Grudziądz jest stolicą, nie twierdzą na pograniczu. Spichrze pełne, mosty strzeżone."
 RGRU_a_idea:0 "Rada Wolnego Miasta"
 RGRU_a_idea_desc:0 "Grudziądz jest wolnym miastem: rada wybierana co dwa lata, sąd miejski i milicja obywatelska."
 RGRU_b_idea:0 "Komendantura Twierdzy"
 RGRU_b_idea_desc:0 "Miastem rządzi komendant Cytadeli. Godzina policyjna, racje i porządek – ale nikt nie głoduje."
 RGRU_c_idea:0 "Kupiecka Republika Wiślana"
 RGRU_c_idea_desc:0 "Miastem rządzą armatorzy barek, hurtownicy i spedytorzy. Wszystko jest na sprzedaż – także bezpieczeństwo."
 reg.103.t:0 "Kolejka na moście"
 reg.103.d:0 "Na moście przez Wisłę stoi kilometr samochodów. Uciekinierzy z Zakonu i Lubawy chcą przejechać na zachód, a rolnicy z Chełmna – na targ do miasta. Posterunek nie nadąża."
 reg.103.a:0 "Przepuścić wszystkich."
 reg.103.b:0 "Tylko z przepustkami."
 reg.104.t:0 "Barka z bronią"
 reg.104.d:0 "Patrol rzeczny zatrzymuje barkę płynącą do Torunia. Pod workami z mąką – skrzynie z karabinami. Kapitan proponuje „podział ładunku”."
 reg.104.a:0 "Zatrzymać ładunek dla miasta."
 reg.104.b:0 "Wziąć cło i puścić."
 reg.105.t:0 "Defilada w Cytadeli"
 reg.105.d:0 "Pułk Grudziądzki maszeruje przez bramę Cytadeli. Na wałach tłumy, orkiestra gra marsze sprzed stu lat. Komendant pyta, czy pozwolić żołnierzom na przysięgę „mieście, nie państwu”."
 reg.105.a:0 "Przysięga miastu."
 reg.105.b:0 "Przysięga Polsce, której jeszcze nie ma."
 RGRU_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Rada Wolnego Miasta (demokracja), Komendantura Twierdzy (rządy wojskowe) albo Kupiecka Republika Wiślana (rządy kupców)."
 RGRU_b_lider:0 "Komendant Cytadeli"
 RGRU_c_lider:0 "Starszy Gildii Wiślanej"
 RGRU_SOJUSZ:0 "Liga Dolnej Wisły"
 RGRU_tt_s1:0 "Sąsiedzi ([LBW.GetNameDef], [ZKR.GetNameDef]) otrzymają §Ypropozycję sojuszu§!."
 RGRU_tt_s3:0 "Członkowie naszego sojuszu otrzymają §Ypropozycję unii§!. Odmowa oznacza koniec sojuszu."
 RGRU_tt_region:0 "Kontrolujemy co najmniej §Y18§! stanów albo prowadzimy sojusz co najmniej trzech państw"
 RGRU_tt_pl2:0 "Jeśli §YWarszawę – Śródmieście§! trzyma państwo spoza naszego sojuszu i nie jest naszym wasalem, otrzymamy przeciw niemu §Ycel wojenny§! (wojnę trzeba wypowiedzieć samodzielnie)."
 RGRU_tt_pl3:0 "Kontrolujemy §YWarszawę – Śródmieście§! i co najmniej §Y300§! stanów"
 RGRU_port_tymczasowy:0 "Ruch na Wiśle"
 RGRU_port_tymczasowy_desc:0 "Barki przywożą zboże, paliwo i części. Nabrzeże pracuje całą dobę."
 REG_KPM_tree:0 "Pomorze między morzem a lasem"
 RKPM_duch:0 "Kaszubska wspólnota"
 RKPM_duch_desc:0 "Na wsiach mówi się po kaszubsku, w Słupsku po polsku, a w porcie w Ustce – językiem rybaków. Pomorze trzyma się razem, bo nikt inny o nie nie zadba."
 RKPM_duch2:0 "Porty Środkowego Pomorza"
 RKPM_duch2_desc:0 "Ustka i Łeba znów przyjmują statki. Ryby, drewno i paliwo z morza utrzymują Republikę przy życiu."
 RKPM_armia:0 "Pomorska Gwardia Wybrzeża"
 RKPM_armia_desc:0 "Gwardia pilnuje plaż, portów i lasów. Rybacy wiedzą o morzu więcej niż niejeden oficer marynarki."
 RKPM_sojusz:0 "Związek Pomorski"
 RKPM_sojusz_desc:0 "Słupsk, Chojnice i miasta wybrzeża mają wspólną obronę i wspólny rynek. Między morzem a lasem łatwiej przetrwać razem."
 RKPM_region:0 "Wielkie Pomorze"
 RKPM_region_desc:0 "Od Łeby po Bory Tucholskie Pomorze ma jedną stolicę – i nie jest nią ani Gdańsk, ani Szczecin."
 RKPM_a_idea:0 "Republika Gmin Pomorskich"
 RKPM_a_idea_desc:0 "Rada Republiki w Słupsku i rady gmin od Łeby po Bytów. Demokracja, w której wszyscy się znają."
 RKPM_b_idea:0 "Kaszubska Autonomia"
 RKPM_b_idea_desc:0 "Kaszubski staje się językiem urzędowym, a gminy kaszubskie – samorządem z własnym sejmikiem."
 RKPM_c_idea:0 "Unia z Trójmiastem"
 RKPM_c_idea_desc:0 "Słupsk szuka oparcia w Gdyni i Gdańsku. Porty, kolej i pieniądze z Trójmiasta – w zamian za lojalność."
 reg.106.t:0 "Kuter z Bornholmu"
 reg.106.d:0 "Do Ustki wpływa duński kuter z lekami, paliwem i… kawą. Kapitan chce zapłaty w złocie albo w rybach – i pozwolenia na regularne kursy."
 reg.106.a:0 "Płacimy rybami, kursy dozwolone."
 reg.106.b:0 "Konfiskujemy ładunek."
 reg.107.t:0 "Sztorm nad Ustką"
 reg.107.d:0 "Sztorm niszczy falochron i zatapia trzy kutry. Rybacy żądają odszkodowań, a Republika ma pustą kasę."
 reg.107.a:0 "Wypłacić z rezerw."
 reg.107.b:0 "Każdy radzi sobie sam."
 reg.108.t:0 "Rozkazy po kaszubsku"
 reg.108.d:0 "Oficerowie skarżą się, że w kompaniach z Kartuz i Bytowa rozkazy wydaje się po kaszubsku. Kaszubi odpowiadają, że tak walczą lepiej."
 reg.108.a:0 "Niech walczą po swojemu."
 reg.108.b:0 "W wojsku jeden język."
 RKPM_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Republika Gmin Pomorskich, Kaszubska Autonomia albo Unia z Trójmiastem."
 RKPM_b_lider:0 "Prezes Zrzeszenia Kaszubsko-Pomorskiego"
 RKPM_c_lider:0 "Pełnomocnik Trójmiasta"
 RKPM_SOJUSZ:0 "Związek Pomorski"
 RKPM_tt_s1:0 "Sąsiedzi ([CHJ.GetNameDef], [GDY.GetNameDef]) otrzymają §Ypropozycję sojuszu§!."
 RKPM_tt_s3:0 "Członkowie naszego sojuszu otrzymają §Ypropozycję unii§!. Odmowa oznacza koniec sojuszu."
 RKPM_tt_region:0 "Kontrolujemy co najmniej §Y28§! stanów albo prowadzimy sojusz co najmniej trzech państw"
 RKPM_tt_pl2:0 "Jeśli §YWarszawę – Śródmieście§! trzyma państwo spoza naszego sojuszu i nie jest naszym wasalem, otrzymamy przeciw niemu §Ycel wojenny§! (wojnę trzeba wypowiedzieć samodzielnie)."
 RKPM_tt_pl3:0 "Kontrolujemy §YWarszawę – Śródmieście§! i co najmniej §Y300§! stanów"
 REG_KON_tree:0 "Węgiel, prąd i władza"
 RKON_duch:0 "Ostatnie kopalnie"
 RKON_duch_desc:0 "Odkrywki pod Koninem wciąż fedrują węgiel brunatny, a elektrownie dają prąd połowie Wielkopolski. Kto ma prąd, ten ma argument w każdej rozmowie."
 RKON_duch2:0 "Zagłębie Energetyczne"
 RKON_duch2_desc:0 "Elektrownie w Pątnowie i Adamowie pracują pełną mocą, a huta aluminium w Koninie znów produkuje. Konin sprzedaje prąd wszystkim sąsiadom."
 RKON_armia:0 "Bataliony górnicze"
 RKON_armia_desc:0 "Górnicy z odkrywek znają materiały wybuchowe, ciężki sprzęt i pracę w trudnych warunkach. Z nich powstają najlepsi saperzy w regionie."
 RKON_sojusz:0 "Porozumienie Energetyczne"
 RKON_sojusz_desc:0 "Kto kupuje prąd z Konina, ten broni Konina. Sojusz oparty na kablach wysokiego napięcia."
 RKON_region:0 "Wschodnia Wielkopolska"
 RKON_region_desc:0 "Konin jest stolicą regionu od Kłodawy po Słupcę. Elektrownie należą do państwa, które je obroniło."
 RKON_a_idea:0 "Samorząd Zagłębia"
 RKON_a_idea_desc:0 "Rada Zagłębia z przedstawicielami gmin, związków zawodowych i spółek energetycznych. Kompromis wpisany w ustrój."
 RKON_b_idea:0 "Republika Górnicza"
 RKON_b_idea_desc:0 "Związki zawodowe rządzą Zagłębiem. Każdy górnik ma prawo do pracy, mieszkania i głosu w radzie."
 RKON_c_idea:0 "Korporacja Energetyczna"
 RKON_c_idea_desc:0 "Państwem zarządza zarząd spółki energetycznej. Prąd jest towarem, a towar ma cenę."
 reg.109.t:0 "Prąd dla wroga?"
 reg.109.d:0 "Kujawy i Kalisz proszą o prąd. Gniezno też – ale gnieźnieńska straż strzelała ostatnio do naszych monterów. Dyspozytornia czeka na decyzję."
 reg.109.a:0 "Prąd dla wszystkich – za opłatą."
 reg.109.b:0 "Gniezno zostaje w ciemności."
 reg.110.t:0 "Osuwisko w odkrywce"
 reg.110.d:0 "Ściana odkrywki osuwa się po ulewach. Koparka zasypana, dwóch górników rannych. Związkowcy żądają wstrzymania wydobycia do czasu kontroli."
 reg.110.a:0 "Wstrzymać wydobycie."
 reg.110.b:0 "Kopiemy dalej."
 reg.111.t:0 "Materiały wybuchowe"
 reg.111.d:0 "Magazyn materiałów wybuchowych w kopalni to skarb dla armii – i pokusa dla przemytników. Kierownik magazynu proponuje „ewidencję wojenną”."
 reg.111.a:0 "Wszystko dla saperów."
 reg.111.b:0 "Sprzedać nadwyżki."
 RKON_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Samorząd Zagłębia (demokracja), Republika Górnicza (związki zawodowe) albo Korporacja Energetyczna (rządy spółki)."
 RKON_b_lider:0 "Przewodniczący Rady Górniczej"
 RKON_c_lider:0 "Prezes Korporacji Energetycznej"
 RKON_SOJUSZ:0 "Porozumienie Energetyczne"
 RKON_tt_s1:0 "Sąsiedzi ([WLC.GetNameDef], [GNZ.GetNameDef]) otrzymają §Ypropozycję sojuszu§!."
 RKON_tt_s3:0 "Członkowie naszego sojuszu otrzymają §Ypropozycję unii§!. Odmowa oznacza koniec sojuszu."
 RKON_tt_region:0 "Kontrolujemy co najmniej §Y49§! stanów albo prowadzimy sojusz co najmniej trzech państw"
 RKON_tt_pl2:0 "Jeśli §YWarszawę – Śródmieście§! trzyma państwo spoza naszego sojuszu i nie jest naszym wasalem, otrzymamy przeciw niemu §Ycel wojenny§! (wojnę trzeba wypowiedzieć samodzielnie)."
 RKON_tt_pl3:0 "Kontrolujemy §YWarszawę – Śródmieście§! i co najmniej §Y300§! stanów"
 REG_PRW_tree:0 "Rzeczpospolita z Lublina"
 RPRW_duch:0 "Państwo, które zostało"
 RPRW_duch_desc:0 "Lublin twierdzi, że Rzeczpospolita nie upadła – przeniosła się tylko na wschód. Ministerstwa w akademikach, sztab w koszarach, a Sejm w auli uniwersytetu."
 RPRW_duch2:0 "Przemysł Wschodu"
 RPRW_duch2_desc:0 "Świdnik, Puławy, Stalowa Wola i Bogdanka pracują dla jednego państwa. Wschód, który przez lata nazywano „Polską B”, utrzymuje teraz resztę kraju."
 RPRW_armia:0 "Armia Rzeczypospolitej"
 RPRW_armia_desc:0 "Jednostki z garnizonów Lubelszczyzny i Podkarpacia mają wspólne dowództwo, sztandary i przysięgę złożoną Rzeczypospolitej, nie województwu."
 RPRW_sojusz:0 "Porozumienie Lubelskie"
 RPRW_sojusz_desc:0 "Sąsiedzi uznają rząd w Lublinie za „koordynatora obrony”. Wspólne magazyny, wspólny sztab i wspólne cele."
 RPRW_region:0 "Rzeczpospolita Odrodzona"
 RPRW_region_desc:0 "Od Bugu po Wisłę i od Sanu po Narew – jedno państwo, które nie musi już tłumaczyć, że jest kontynuacją Polski."
 RPRW_a_idea:0 "Rząd Ocalenia Narodowego"
 RPRW_a_idea_desc:0 "Konserwatywny rząd z silnym premierem: szkoła, rodzina, Kościół i wojsko jako filary państwa w czasie próby."
 RPRW_b_idea:0 "Rząd Jedności Narodowej"
 RPRW_b_idea_desc:0 "Wszystkie partie w jednym rządzie – od lewicy po prawicę. Spory są głośne, ale budżet się zgadza."
 RPRW_c_idea:0 "Dowództwo Wschód"
 RPRW_c_idea_desc:0 "Generałowie z Lublina przejmują władzę „do czasu zjednoczenia kraju”. Rozkaz zastępuje ustawę."
 reg.112.t:0 "Ministerstwo w akademiku"
 reg.112.d:0 "Ministerstwo Finansów mieści się w akademiku przy Radziszewskiego. Urzędnicy śpią w pokojach studenckich, a studenci – w salach wykładowych. Rektor pyta, kiedy uczelnia odzyska budynki."
 reg.112.a:0 "Uczelnia ma pierwszeństwo – szukamy innych budynków."
 reg.112.b:0 "Państwo ma pierwszeństwo."
 reg.113.t:0 "Haubice ze Stalowej Woli"
 reg.113.d:0 "Pierwsze haubice z odbudowanej linii w Stalowej Woli są gotowe. Sztab chce wszystkie dla armii, ale Podlasie i Radom proponują za nie paliwo i żywność."
 reg.113.a:0 "Wszystkie dla naszej armii."
 reg.113.b:0 "Sprzedać część sąsiadom."
 reg.114.t:0 "Pobór na wschodzie"
 reg.114.d:0 "Pobór idzie lepiej, niż się spodziewano – na wsiach Lubelszczyzny zgłaszają się całe rodziny. Ale ktoś musi zebrać plony. Wójtowie proszą o odroczenia dla rolników."
 reg.114.a:0 "Odroczenia dla gospodarzy."
 reg.114.b:0 "Ojczyzna jest ważniejsza."
 RPRW_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Rząd Ocalenia Narodowego (konserwatyzm), Rząd Jedności Narodowej (wielka koalicja) albo Dowództwo Wschód (rządy wojskowe)."
 RPRW_b_lider:0 "Premier Rządu Jedności"
 RPRW_c_lider:0 "Dowódca Okręgu Wschód"
 RPRW_SOJUSZ:0 "Porozumienie Lubelskie"
 RPRW_tt_s1:0 "Sąsiedzi ([PDL.GetNameDef], [RAD.GetNameDef]) otrzymają §Ypropozycję sojuszu§!."
