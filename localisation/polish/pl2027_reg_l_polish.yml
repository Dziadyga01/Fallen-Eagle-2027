 REG_SUW_tree:0 "Przesmyk"
 RSUW_duch:0 "Przesmyk suwalski"
 RSUW_duch_desc:0 "Sto kilometrów między obwodem królewieckim a Białorusią. Przez dziesięciolecia nazywano to miejsce najbardziej niebezpiecznym w Europie. Teraz Suwałki muszą się bronić same."
 RSUW_duch2:0 "Gospodarka pogranicza"
 RSUW_duch2_desc:0 "Handel z Litwą, turystyka nad Wigrami i drewno z Puszczy Augustowskiej. Pogranicze żyje z tego, że łączy."
 RSUW_armia:0 "Strażnicy Przesmyku"
 RSUW_armia_desc:0 "Brygada, która od lat ćwiczyła obronę przesmyku, zna każde wzgórze i każde jezioro."
 RSUW_sojusz:0 "Związek Północno-Wschodni"
 RSUW_sojusz_desc:0 "Suwałki, Białystok i Łomża mają wspólną obronę. Wschodnia granica jest wspólna."
 RSUW_region:0 "Ziemia Suwalska"
 RSUW_region_desc:0 "Od Wigier po Biebrzę – jedno państwo pilnujące przesmyku."
 RSUW_a_idea:0 "Republika Suwalska"
 RSUW_a_idea_desc:0 "Rada Suwalszczyzny, wybory i współpraca z sąsiadami. Pogranicze otwarte na świat."
 RSUW_b_idea:0 "Przyjaźń z Litwą"
 RSUW_b_idea_desc:0 "Suwałki szukają oparcia na Litwie. Puńsk i Sejny są mostem między narodami."
 RSUW_c_idea:0 "Twierdza Przesmyk"
 RSUW_c_idea_desc:0 "Suwalszczyzną rządzi dowództwo brygady. Cały region jest jednym wielkim posterunkiem."
 reg.139.t:0 "Ciężarówki z Litwy"
 reg.139.d:0 "Na przejściu w Budzisku stoi kolumna litewskich ciężarówek z paliwem. Kierowcy chcą zapłaty w euro, a Suwałki mają tylko złotówki i drewno."
 reg.139.a:0 "Płacimy drewnem."
 reg.139.b:0 "Paliwo konfiskujemy."
 reg.140.t:0 "Biegun zimna"
 reg.140.d:0 "Mróz minus trzydzieści. Suwałki jak zwykle są najzimniejszym miastem w Polsce. Drewno z puszczy musi trafić do ciepłowni, nie na sprzedaż."
 reg.140.a:0 "Drewno dla mieszkańców."
 reg.140.b:0 "Kontrakty trzeba dotrzymać."
 reg.141.t:0 "Manewry przy granicy"
 reg.141.d:0 "Po drugiej stronie granicy obwodu królewieckiego rosyjskie jednostki prowadzą manewry. Dowództwo pyta, czy postawić dywizję w stan gotowości."
 reg.141.a:0 "Pełna gotowość."
 reg.141.b:0 "Nie prowokujemy."
 RSUW_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Republika Suwalska (demokracja), Przyjaźń z Litwą (współpraca z sąsiadem) albo Twierdza Przesmyk (rządy wojskowe)."
 RSUW_a_lider:0 "Przewodniczący Rady Suwalszczyzny"
 RSUW_b_lider:0 "Pełnomocnik ds. Unii z Litwą"
 RSUW_c_lider:0 "Dowódca Brygady Suwalskiej"
