 REG_LWC_tree:0 "Czerwona Łódź"
 RLWC_duch:0 "Miasto fabryk"
 RLWC_duch_desc:0 "Łódź zawsze była miastem robotników – najpierw włókniarek, potem magazynierów i informatyków. Teraz ma pierwszy rząd, który mówi ich językiem."
 RLWC_duch2:0 "Ziemia obiecana"
 RLWC_duch2_desc:0 "Fabryki włókiennicze szyją mundury, centra logistyczne przy A1 i A2 rozwożą towary, a mieszkania komunalne rosną szybciej niż kiedykolwiek."
 RLWC_armia:0 "Gwardia Robotnicza"
 RLWC_armia_desc:0 "Związki zawodowe wystawiają bataliony. Żołnierz w Łodzi zarabia tyle, co tokarz, i ma te same prawa."
 RLWC_sojusz:0 "Sojusz Miast Centralnej Polski"
 RLWC_sojusz_desc:0 "Łódź, Piotrków, Sieradz i Kutno mają wspólną obronę i wspólną kasę na zasiłki. Centrum kraju trzyma się razem."
 RLWC_region:0 "Rzeczpospolita Socjalna"
 RLWC_region_desc:0 "Łódź jest stolicą państwa, które obiecuje każdemu dach nad głową, pracę i lekarza. Obietnicę trzeba teraz spełnić."
 RLWC_a_idea:0 "Państwo dobrobytu"
 RLWC_a_idea_desc:0 "Darmowe przychodnie, mieszkania komunalne i 35-godzinny tydzień pracy. Drogo – ale ludzie wiedzą, za co walczą."
 RLWC_b_idea:0 "Komuna Łódzka"
 RLWC_b_idea_desc:0 "Fabryki należą do rad pracowniczych, a rady – do wszystkich. Każde zebranie trwa do północy."
 RLWC_c_idea:0 "Wielka koalicja centrum"
 RLWC_c_idea_desc:0 "Lewica rządzi razem z samorządowcami i liberałami. Mniej rewolucji, więcej budżetu."
 reg.115.t:0 "Zima w kamienicach"
 reg.115.d:0 "W kamienicach w Śródmieściu nie ma ogrzewania od miesiąca. Rada może przekierować węgiel z fabryk do ciepłowni – ale wtedy staną szwalnie."
 reg.115.a:0 "Najpierw ludzie."
 reg.115.b:0 "Najpierw fabryki."
 reg.116.t:0 "Mundury dla sąsiadów"
 reg.116.d:0 "Piotrków i Radom zamawiają mundury z łódzkich szwalni. Płacą paliwem i bronią. Część rady protestuje: „szyjemy dla tych, którzy mogą nas zaatakować”."
 reg.116.a:0 "Handel to pokój."
 reg.116.b:0 "Mundury tylko dla nas."
 reg.117.t:0 "Kino frontowe"
 reg.117.d:0 "Studenci Filmówki proponują, by nakręcić kronikę o batalionach związkowych. Pokazy w kinach miały by przyciągnąć ochotników."
 reg.117.a:0 "Kręcić!"
 reg.117.b:0 "Lepiej niech uczą się strzelać."
 RLWC_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Państwo dobrobytu (socjaldemokracja), Komuna Łódzka (rady pracownicze) albo Wielka koalicja centrum."
 RLWC_b_lider:0 "Kongres Rad Łódzkich"
 RLWC_c_lider:0 "Premier Koalicji Łódzkiej"
 RLWC_SOJUSZ:0 "Sojusz Miast Centralnej Polski"
 RLWC_tt_s1:0 "Sąsiedzi ([PTK.GetNameDef], [SRD.GetNameDef]) otrzymają §Ypropozycję sojuszu§!."
 RLWC_tt_s3:0 "Członkowie naszego sojuszu otrzymają §Ypropozycję unii§!. Odmowa oznacza koniec sojuszu."
