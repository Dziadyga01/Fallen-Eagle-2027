 REG_KTN_tree:0 "Węzeł i diabeł Boruta"
 RKTN_duch:0 "Węzeł Kutno"
 RKTN_duch_desc:0 "Przez Kutno przechodzi połowa pociągów z zachodu na wschód. Kto ma węzeł, ma klucz do środka Polski."
 RKTN_duch2:0 "Kutnowska logistyka"
 RKTN_duch2_desc:0 "Magazyny, przeładunki i warsztaty – Kutno żyje z tego, że wszystko przez nie przejeżdża."
 RKTN_armia:0 "Pamięć Bzury"
 RKTN_armia_desc:0 "W 1939 roku nad Bzurą stoczono największą bitwę kampanii wrześniowej. Żołnierze Kutna przysięgają na ten sam sztandar."
 RKTN_sojusz:0 "Związek Nadbzurzański"
 RKTN_sojusz_desc:0 "Kutno, Łęczyca i Łowicz mają wspólną obronę."
 RKTN_region:0 "Ziemia Nadbzurzańska"
 RKTN_region_desc:0 "Od Łęczycy po Gostynin – Kutno jest stolicą."
 RKTN_a_idea:0 "Inicjatywa Kutnowska"
 RKTN_a_idea_desc:0 "Rada wybierana przez gminy rządzi Ziemią. Kutno chce być miastem, które łączy."
 RKTN_b_idea:0 "Kolej przede wszystkim"
 RKTN_b_idea_desc:0 "Ziemią rządzi dyrekcja węzła. Wszystko podporządkowane kolei."
 RKTN_c_idea:0 "Łęczycki gród"
 RKTN_c_idea_desc:0 "Łęczyca – dawna stolica dzielnicy – przejmuje przewodnictwo. Tradycja i porządek."
 reg.163.t:0 "Pociąg, którego nikt nie odbiera"
 reg.163.d:0 "Na bocznicy w Kutnie stoi skład z kontenerami bez właściciela. Firma przewozowa upadła razem z państwem."
 reg.163.a:0 "Otworzyć kontenery."
 reg.163.b:0 "Czekać na właściciela."
 reg.164.t:0 "Opłaty dla Łodzi"
 reg.164.d:0 "Łódź protestuje przeciw opłatom za przejazd pociągów. Grozi blokadą dostaw."
 reg.164.a:0 "Zniżka dla Łodzi."
 reg.164.b:0 "Opłaty dla wszystkich równe."
 reg.165.t:0 "Rocznica bitwy nad Bzurą"
 reg.165.d:0 "We wrześniu przypada rocznica bitwy nad Bzurą. Weterani i rekonstruktorzy chcą wielkich obchodów."
 reg.165.a:0 "Wielkie obchody."
 reg.165.b:0 "Skromnie – czas wojny."
 RKTN_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Inicjatywa Kutnowska (demokracja), Kolej przede wszystkim (technokracja) albo Łęczycki gród (konserwatyzm)."
 RKTN_b_lider:0 "Dyrektor Węzła Kutno"
 RKTN_c_lider:0 "Kasztelan Łęczycki"
