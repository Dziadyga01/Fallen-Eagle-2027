 REG_PLK_tree:0 "Pałuki – kraina grodów"
 RPLK_duch:0 "Kraina grodów"
 RPLK_duch_desc:0 "Biskupin, Gąsawa, Żnin – na Pałukach ludzie mieszkali w grodach, zanim powstała Polska. Teraz znowu budują palisady."
 RPLK_duch2:0 "Cukier i kolejka"
 RPLK_duch2_desc:0 "Cukrownie, gospodarstwa i wąskotorowa kolejka z Żnina do Gąsawy. Mała gospodarka, która nie potrzebuje paliwa z daleka."
 RPLK_armia:0 "Drużyny grodowe"
 RPLK_armia_desc:0 "Każdy gród ma drużynę. Drużyny znają bagna i jeziora jak własne podwórko."
 RPLK_sojusz:0 "Związek Pałucko-Krajeński"
 RPLK_sojusz_desc:0 "Pałuki i sąsiedzi mają wspólną obronę."
 RPLK_region:0 "Wielkie Pałuki"
 RPLK_region_desc:0 "Od Kcyni po Gąsawę – jedno księstwo."
 RPLK_a_idea:0 "Wiec Pałucki"
 RPLK_a_idea_desc:0 "Wiec wszystkich mieszkańców decyduje o najważniejszych sprawach. Jak tysiąc lat temu – tylko z mikrofonem."
 RPLK_b_idea:0 "Książę Pałuk"
 RPLK_b_idea_desc:0 "Księstwo ma księcia z wyboru. Tradycja Pałuków – rodu, który dał nazwę ziemi – wraca na pieczęcie."
 RPLK_c_idea:0 "Spółdzielnie pałuckie"
 RPLK_c_idea_desc:0 "Cukrownie i gospodarstwa należą do spółdzielni."
 reg.154.t:0 "Gród w Biskupinie"
 reg.154.d:0 "Rekonstruktorzy z Biskupina proponują, by drewniany gród stał się punktem obrony. Archeolodzy protestują: „to zabytek, nie bunkier!”."
 reg.154.a:0 "Zabytek zostaje zabytkiem."
 reg.154.b:0 "Gród znów będzie bronił ludzi."
 reg.155.t:0 "Kolejka czy złom?"
 reg.155.d:0 "Handlarze złomem oferują dobrą cenę za stare tory wąskotorówki. Kolejka jest jednak jedynym transportem niezależnym od paliwa."
 reg.155.a:0 "Kolejka jeździ dalej."
 reg.155.b:0 "Sprzedać tory."
 reg.156.t:0 "Bagna jako obrona"
 reg.156.d:0 "Saperzy proponują zalanie łąk wokół Żnina, by utworzyć bagna obronne. Rolnicy stracą pastwiska."
 reg.156.a:0 "Zalać łąki."
 reg.156.b:0 "Pastwiska zostają."
 RPLK_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Wiec Pałucki (demokracja bezpośrednia), Książę Pałuk (monarchia z wyboru) albo Spółdzielnie pałuckie."
