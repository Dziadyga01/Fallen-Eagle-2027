 REG_LOW_tree:0 "Księstwo w pasiakach"
 RLOW_duch:0 "Księżacy"
 RLOW_duch_desc:0 "Łowiczanie w kolorowych pasiakach, wycinanki i procesje Bożego Ciała. Najbardziej rozpoznawalny region Polski staje się państwem."
 RLOW_duch2:0 "Łowickie mleko i sady"
 RLOW_duch2_desc:0 "Mleczarnie, sady i przetwórnie owoców – Łowicz karmi Warszawę, Łódź i Sochaczew."
 RLOW_armia:0 "Gwardia Księżacka"
 RLOW_armia_desc:0 "Żołnierze Księstwa noszą pasiaki na naszywkach. Na defiladach wyglądają jak z obrazu Chełmońskiego."
 RLOW_sojusz:0 "Związek Księżacki"
 RLOW_sojusz_desc:0 "Łowicz i sąsiedzi mają wspólną obronę."
 RLOW_region:0 "Ziemia Łowicka"
 RLOW_region_desc:0 "Od Skierniewic po Bzurę – jedno księstwo."
 RLOW_a_idea:0 "Stronnictwo Księżackie"
 RLOW_a_idea_desc:0 "Stronnictwo regionalne rządzi Księstwem. Tradycja i samorząd."
 RLOW_b_idea:0 "Księstwo prymasów"
 RLOW_b_idea_desc:0 "Łowicz był przez wieki rezydencją prymasów. Rada przy kolegiacie rządzi Księstwem."
 RLOW_c_idea:0 "Unia z Sochaczewem"
 RLOW_c_idea_desc:0 "Łowicz wiąże się z Republiką Wolnościową. Wolny rynek z pasiakami."
 reg.166.t:0 "Pasiaki na mundurach?"
 reg.166.d:0 "Rada proponuje, by żołnierze nosili pasiaste naszywki. Oficerowie się krzywią, ale rekruci są zachwyceni."
 reg.166.a:0 "Pasiaki na naszywkach."
 reg.166.b:0 "Mundur to mundur."
 reg.167.t:0 "Mleko dla Warszawy"
 reg.167.d:0 "Bloki warszawskie chcą kupować łowickie mleko. Płacą dobrze – ale każdy blok chce wyłączności."
 reg.167.a:0 "Sprzedajemy wszystkim."
 reg.167.b:0 "Wyłączność dla jednego bloku."
 reg.168.t:0 "Wycinanki na plakatach"
 reg.168.d:0 "Artystki z Łowicza projektują plakaty werbunkowe w stylu wycinanek. Plakaty robią furorę."
 reg.168.a:0 "Drukować!"
 reg.168.b:0 "Lepiej zwykłe plakaty."
 RLOW_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Stronnictwo Księżackie (samorząd), Księstwo prymasów (konserwatyzm) albo Unia z Sochaczewem (wolny rynek)."
