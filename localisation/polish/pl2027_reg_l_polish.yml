 RKLS_silniki:0 "Silniki z Kalisza"
 REG_LES_tree:0 "Szybowce, żużel i tron"
 RLES_duch:0 "Miasto mistrzów"
 RLES_duch_desc:0 "Leszno ma najlepszy klub żużlowy w Polsce i najstarsze szybowisko w Wielkopolsce. Miasto jest małe, ale przyzwyczajone do wygrywania."
 RLES_duch2:0 "Wielkopolski porządek"
 RLES_duch2_desc:0 "Gospodarstwa, zakłady i warsztaty pracują jak w zegarku. Leszno nie ma bogactw – ma organizację."
 RLES_armia:0 "Lotnicy z Leszna"
 RLES_armia_desc:0 "Szybownicy i piloci awionetek stają się zwiadowcami armii. Leszno widzi wroga, zanim ten zobaczy Leszno."
 RLES_sojusz:0 "Związek Zachodniej Wielkopolski"
 RLES_sojusz_desc:0 "Leszno, Kalisz i sąsiedzi pilnują granicy z niemieckimi protektoratami."
 RLES_region:0 "Ziemia Leszczyńska"
 RLES_region_desc:0 "Od Rydzyny po Gostyń – Leszno jest stolicą małego, porządnego państwa."
 RLES_a_idea:0 "Republika Leszczyńska"
 RLES_a_idea_desc:0 "Rada Miasta i wybory – po wielkopolsku: punktualnie i bez awantur."
 RLES_b_idea:0 "Tron Leszczyńskich"
 RLES_b_idea_desc:0 "Leszno przypomina, że dało Polsce króla – Stanisława Leszczyńskiego. Rada Koronna szuka dziedzica, a herb Wieniawa wraca na flagi."
 RLES_c_idea:0 "Republika Żużlowa"
 RLES_c_idea_desc:0 "Kibice Unii Leszno przejęli władzę. Mecze są świętem państwowym, a stadion – siedzibą rządu."
 reg.136.t:0 "Mecz w czasie wojny"
 reg.136.d:0 "Kibice domagają się wznowienia ligi żużlowej. Paliwo do motocykli jest drogie, ale ludzie potrzebują czegoś, co przypomina normalne życie."
 reg.136.a:0 "Mecze się odbędą."
 reg.136.b:0 "Paliwo jest dla wojska."
 reg.137.t:0 "Szybowiec nad granicą"
 reg.137.d:0 "Szybownik z Leszna wrócił z lotu nad granicą protektoratu z dokładnymi notatkami o niemieckich posterunkach. Niemcy protestują."
 reg.137.a:0 "Takie loty to nasze prawo."
 reg.137.b:0 "Zakazać lotów nad granicą."
 reg.138.t:0 "Żużlowcy w armii"
 reg.138.d:0 "Zawodnicy Unii zgłaszają się do armii jako motocykliści zwiadowcy. Trener protestuje: sezon się zaczyna."
 reg.138.a:0 "Kraj ważniejszy niż liga."
 reg.138.b:0 "Niech jeżdżą na torze."
 RLES_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Republika Leszczyńska (demokracja), Tron Leszczyńskich (monarchia) albo Republika Żużlowa (rządy kibiców)."
