 REG_SRD_tree:0 "Nad Wartą"
 RSRD_duch:0 "Spokojna ziemia"
 RSRD_duch_desc:0 "Sieradz nie ma wielkich fabryk ani elektrowni. Ma za to spokój, pola i ludzi, którzy wiedzą, jak przetrwać trudne czasy."
 RSRD_duch2:0 "Spichlerz centralnej Polski"
 RSRD_duch2_desc:0 "Pola Ziemi Sieradzkiej karmią Łódź, Piotrków i Kalisz. Kto ma chleb, ten ma przyjaciół."
 RSRD_armia:0 "Straż Nadwarciańska"
 RSRD_armia_desc:0 "Straż zna każdy bród na Warcie i każdą drogę między wsiami."
 RSRD_sojusz:0 "Związek Nadwarciański"
 RSRD_sojusz_desc:0 "Miasta nad Wartą mają wspólną obronę. Rzeka łączy Sieradz, Wieluń i Zduńską Wolę."
 RSRD_region:0 "Ziemia Nadwarciańska"
 RSRD_region_desc:0 "Od Wielunia po Zduńską Wolę – Sieradz jest stolicą spokojnej, ale niezależnej ziemi."
 RSRD_a_idea:0 "Wspólnota gmin"
 RSRD_a_idea_desc:0 "Gminy Ziemi Sieradzkiej rządzą się same, a Sieradz tylko koordynuje."
 RSRD_b_idea:0 "Spółdzielnie rolnicze"
 RSRD_b_idea_desc:0 "Rolnicy łączą się w spółdzielnie, a spółdzielnie – w państwo."
 RSRD_c_idea:0 "Protektorat łódzki"
 RSRD_c_idea_desc:0 "Sieradz szuka ochrony u silniejszego sąsiada. Spokój ma swoją cenę."
 reg.133.t:0 "Kolejka po chleb z Łodzi"
 reg.133.d:0 "Na rogatkach Sieradza stoją setki ludzi z Łodzi. Przyjechali po chleb i ziemniaki – płacą czym mogą: telefonami, biżuterią, narzędziami."
 reg.133.a:0 "Sprzedawać po uczciwej cenie."
 reg.133.b:0 "Najpierw nasi."
 reg.134.t:0 "Susza nad Wartą"
 reg.134.d:0 "Susza zagraża zbiorom. Rolnicy chcą wody z Warty do nawadniania, ale wtedy rzeka stanie się płytka i łatwa do przekroczenia."
 reg.134.a:0 "Nawadniać pola."
 reg.134.b:0 "Rzeka jest naszą obroną."
 reg.135.t:0 "Rolnicy w mundurach"
 reg.135.d:0 "Pobór przypada na żniwa. Rolnicy mówią: albo wojsko, albo chleb."
 reg.135.a:0 "Pobór po żniwach."
 reg.135.b:0 "Pobór teraz."
 RSRD_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Wspólnota gmin (demokracja), Spółdzielnie rolnicze (socjaldemokracja) albo Protektorat łódzki (ochrona silniejszego sąsiada)."
