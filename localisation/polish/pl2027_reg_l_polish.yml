 REG_LBW_tree:0 "Księstwo nad jeziorami"
 RLBW_duch:0 "Ziemia biskupów"
 RLBW_duch_desc:0 "Lubawa była przez stulecia siedzibą biskupów chełmińskich. Ich zamek jest ruiną, ale tradycja „księstwa” – żywa w każdej parafii."
 RLBW_duch2:0 "Zakłady Lubawy"
 RLBW_duch2_desc:0 "Fabryki w Lubawie szyją namioty, osłony balistyczne i siatki maskujące. Iława i Ostróda dają drewno, łodzie i ludzi."
 RLBW_armia:0 "Strzelcy Pojezierza"
 RLBW_armia_desc:0 "Żołnierze z Iławy i Ostródy znają każdą zatokę Jezioraka. Łodzie są dla nich tym, czym dla innych ciężarówki."
 RLBW_sojusz:0 "Związek Pojezierza"
 RLBW_sojusz_desc:0 "Lubawa, Nowe Miasto i sąsiedzi pilnują jezior i kanałów razem."
 RLBW_region:0 "Pojezierze Iławskie"
 RLBW_region_desc:0 "Od Ostródy po Nowe Miasto – jedno księstwo nad jeziorami."
 RLBW_a_idea:0 "Rada Księstwa"
 RLBW_a_idea_desc:0 "Księstwo ma radę wybieraną przez gminy, a „książę” jest tylko przewodniczącym."
 RLBW_b_idea:0 "Kapituła Lubawska"
 RLBW_b_idea_desc:0 "Księstwem rządzi kapituła – rada duchownych i świeckich przy kościele św. Anny. Porządek, tradycja i pielgrzymki."
 RLBW_c_idea:0 "Warmiński sojusz"
 RLBW_c_idea_desc:0 "Lubawa opiera się o Warmię i Olsztyn. Granice gmin są ważniejsze niż granice dawnych województw."
 reg.151.t:0 "Książę w radiu"
 reg.151.d:0 "Lokalne radio przedstawia przewodniczącego Rady jako „Jego Wysokość księcia Lubawy”. Ludzie są zachwyceni, sąsiedzi – rozbawieni. Przewodniczący pyta, czy sprostować."
 reg.151.a:0 "Niech zostanie księciem."
 reg.151.b:0 "Sprostować – jesteśmy poważnym państwem."
 reg.152.t:0 "Statek na trawie"
 reg.152.d:0 "Pierwsza barka przejeżdża pochylnię Kanału Elbląskiego. Turyści z Elbląga chcą płacić za rejsy, armia chce kanału tylko dla siebie."
 reg.152.a:0 "Rejsy dla turystów."
 reg.152.b:0 "Kanał dla wojska."
 reg.153.t:0 "Siatki maskujące"
 reg.153.d:0 "Fabryka w Lubawie ma zamówienie od Zakonu na siatki maskujące. Zakon płaci złotem."
 reg.153.a:0 "Zamówienie dla Zakonu."
 reg.153.b:0 "Siatki tylko dla nas."
 RLBW_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Rada Księstwa (demokracja), Kapituła Lubawska (konserwatyzm) albo Warmiński sojusz."
