 REG_CHJ_tree:0 "Zabory i Bory"
 RCHJ_duch:0 "Kaszubskie Południe"
 RCHJ_duch_desc:0 "Zaborszczyzna – południowe Kaszuby – zawsze była na uboczu. Teraz to zaleta: wielkie armie mają ważniejsze cele."
 RCHJ_duch2:0 "Drewno i jeziora"
 RCHJ_duch2_desc:0 "Tartaki, meble i turystyka nad Charzykowami. Mała gospodarka, która ma swoje drewno i swoją wodę."
 RCHJ_armia:0 "Strzelcy Zaborscy"
 RCHJ_armia_desc:0 "Strzelcy znają Bory Tucholskie lepiej niż ktokolwiek."
 RCHJ_sojusz:0 "Związek Borów i Zaborów"
 RCHJ_sojusz_desc:0 "Chojnice, Tuchola i Krajna mają wspólną obronę lasów."
 RCHJ_region:0 "Ziemia Zaborska i Bory"
 RCHJ_region_desc:0 "Od Człuchowa po Tucholę – jedno państwo w lasach."
 RCHJ_a_idea:0 "Zaborska Wspólnota"
 RCHJ_a_idea_desc:0 "Rada gmin rządzi Ziemią Zaborską."
 RCHJ_b_idea:0 "Kaszubskie Zabory"
 RCHJ_b_idea_desc:0 "Kaszubski język i tradycja w urzędach. Zabory należą do Kaszubów."
 RCHJ_c_idea:0 "Unia Pomorska"
 RCHJ_c_idea_desc:0 "Chojnice wiążą się ze Słupskiem i Republiką Pomorską."
 reg.169.t:0 "Żeglarze z Charzykowów"
 reg.169.d:0 "Kluby żeglarskie z Charzykowów oferują łodzie do patrolowania jezior."
 reg.169.a:0 "Przyjmujemy łodzie."
 reg.169.b:0 "Jeziora są spokojne."
 reg.170.t:0 "Pożar w Borach"
 reg.170.d:0 "Susza i pożar w Borach Tucholskich. Straż prosi o wszystkich ludzi – także żołnierzy."
 reg.170.a:0 "Wszyscy do gaszenia."
 reg.170.b:0 "Wojsko zostaje na posterunkach."
 reg.171.t:0 "Bitwa pod Chojnicami"
 reg.171.d:0 "Rekonstruktorzy chcą odtworzyć bitwę pod Chojnicami z 1454 roku. Wojsko proponuje połączyć to z manewrami."
 reg.171.a:0 "Rekonstrukcja i manewry."
 reg.171.b:0 "Tylko manewry."
 RCHJ_tt_wybor:0 "Odblokowuje §Ytrzy drogi§!: Zaborska Wspólnota (demokracja), Kaszubskie Zabory (autonomia kaszubska) albo Unia Pomorska."
 RCHJ_a_lider:0 "Przewodniczący Rady Zaborskiej"
 RCHJ_b_lider:0 "Prezes Kaszubów Południowych"
 RCHJ_c_lider:0 "Pełnomocnik Unii Pomorskiej"
 RCHJ_SOJUSZ:0 "Związek Borów i Zaborów"
 RCHJ_tt_s1:0 "Sąsiedzi ([KRJ.GetNameDef], [KPM.GetNameDef]) otrzymają §Ypropozycję sojuszu§!."
