 ROS_kl_rozmowy_mazury_desc:0 "Rosyjscy dyplomaci jadą do Olsztyna – tym razem samochodami, nie czołgami. Rozmowy dotyczą jeńców, granicy i handlu."
 ROS_kl_reforma_mazury:0 "Reforma armii"
 ROS_kl_reforma_mazury_desc:0 "Nowe regulaminy, nowi dowódcy i nowe szkolenia. Armia ma się uczyć na błędach z Mazur, a nie je ukrywać."
 ROS_kl_spokoj_mazury:0 "Spokój w obwodzie"
 ROS_kl_spokoj_mazury_desc:0 "Matki poległych dostają odszkodowania, a telewizja przestaje mówić o wojnie. Ludzie chcą po prostu żyć."
 ROS_kl_odbudowa_mazury:0 "Odbudowa potęgi"
 ROS_kl_odbudowa_mazury_desc:0 "Rosja przegrała bitwę o Mazury, ale nie przestała być Rosją. Następnym razem będzie lepiej przygotowana."
 ROS_zw_aneksja_mazury:0 "Aneksja Mazur"
 ROS_zw_aneksja_mazury_desc:0 "Zdobyte ziemie zostaną włączone do Federacji Rosyjskiej. Państwa mazurskie przestaną istnieć."
 ROS_zw_administracja_mazury:0 "Administracja wojskowa"
 ROS_zw_administracja_mazury_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_mazury:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_mazury_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_mazury:0 "Pokój bez aneksji"
 ROS_zw_pokoj_mazury_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_mazury_tree:0 "Operacja Mazurska"
 ROS_kreml_bez_gospodarza:0 "Kreml bez gospodarza"
 ROS_kreml_bez_gospodarza_desc:0 "§Y«Кремль без хозяина»§!\n\nGabinet w Senacie stoi pusty. Premier pełni obowiązki prezydenta, ale wszyscy wiedzą, że prawdziwa władza leży gdzie indziej – w sztabie, w służbach i na ulicach Moskwy."
 ROS_pogrzeb:0 "Pogrzeb państwowy"
 ROS_pogrzeb_desc:0 "Przed Soborem Chrystusa Zbawiciela stoją tysiące ludzi. Jedni płaczą, inni przyszli się upewnić, że to prawda."
 ROS_rada_bezpieczenstwa:0 "Nadzwyczajna Rada Bezpieczeństwa"
 ROS_rada_bezpieczenstwa_desc:0 "Członkowie Rady siedzą przy jednym stole po raz pierwszy od pogrzebu. Każdy z nich przyszedł z listą żądań."
 ROS_uspokoic_rynki:0 "Uspokoić rynki"
 ROS_uspokoic_rynki_desc:0 "Bank Centralny wydaje rezerwy, żeby rubel nie stracił połowy wartości w tydzień."
 ROS_dokonczyc_operacje:0 "Dokończyć operację mazurską"
 ROS_dokonczyc_operacje_desc:0 "Dyrektywa leżała na biurku prezydenta, gdy zabrakło go na Kremlu. Sztab twierdzi, że plan jest gotowy, a wojsko czeka tylko na rozkaz – kto go wyda, ten pokaże, że rządzi Rosją."
 ROS_kto_dowodzi:0 "Kto dowodzi na Mazurach?"
 ROS_kto_dowodzi_desc:0 "Dowódca zgrupowania pyta Moskwę o rozkazy i dostaje trzy sprzeczne odpowiedzi. Trzeba wybrać, kto ma prawo je wydawać."
 ROS_lojalnosc_gwardii:0 "Lojalność Gwardii Narodowej"
 ROS_lojalnosc_gwardii_desc:0 "Rosgwardia obstawia Kreml i telewizję. Jej dowództwo jeszcze nie zdecydowało, komu salutuje."
 ROS_wstrzymac_natarcie:0 "Wstrzymać natarcie"
 ROS_wstrzymac_natarcie_desc:0 "Bez prezydenta nikt nie chce brać odpowiedzialności za nowe straty. Jednostki okopują się na zdobytych pozycjach."
 ROS_naprzod:0 "Naprzód mimo wszystko"
 ROS_naprzod_desc:0 "Generałowie uważają, że zatrzymanie ofensywy byłoby przyznaniem się do porażki. Rozkaz jest jeden: nacierać."
 ROS_droga_poklonskiej:0 "Administracja Pokłonskiej"
 ROS_droga_poklonskiej_desc:0 "Cywilna administracja kryzysowa ma zabezpieczyć Krym, rozmawiać z politykami i przygotować wybory. Jej władza opiera się na nadzwyczajnym dekrecie i poparciu części Dumy."
 ROS_droga_szojgu:0 "Zarząd Szojgu"
 ROS_droga_szojgu_desc:0 "Rada Bezpieczeństwa i sztab generalny przejmują władzę „do czasu wyborów”. Stan wyjątkowy, kontrola nad armią i utrzymanie ofensywy."
 ROS_zw_triumf_kryzys:0 "Defilada w Królewcu"
 ROS_zw_triumf_kryzys_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
 ROS_zw_obwod_kryzys:0 "Wsparcie dla Rady Obwodu"
 ROS_zw_obwod_kryzys_desc:0 "Obwód Warmińsko-Mazurski potrzebuje broni, pieniędzy i urzędników. Moskwa przysyła wszystkiego po trochu – i własnych doradców do każdego wydziału."
 ROS_zw_garnizony_kryzys:0 "Garnizony nad jeziorami"
 ROS_zw_garnizony_kryzys_desc:0 "Stałe garnizony w Giżycku, Olsztynie i Ełku. Żołnierze, którzy mieli wrócić do domów, zostają na Mazurach na czas nieokreślony."
 ROS_zw_kolej_kryzys:0 "Kolej Królewiec–Olsztyn"
 ROS_zw_kolej_kryzys_desc:0 "Remont linii kolejowej łączącej obwód z Mazurami. Pierwszy pociąg wiezie czołgi, drugi – ziemniaki."
 ROS_zw_polityka_kryzys:0 "Polityka wobec rozbitej Polski"
 ROS_zw_polityka_kryzys_desc:0 "Polskie państewka patrzą na Mazury i liczą rosyjskie czołgi. Część z nich chętnie przyjmie ochronę Moskwy – za odpowiednią cenę. "
 ROS_zw_media_kryzys:0 "Rosyjskie media w regionie"
 ROS_zw_media_kryzys_desc:0 "Telewizja, portale i „niezależni” blogerzy w państwach przy granicy obwodu zaczynają mówić głosem Moskwy."
 ROS_zw_protektorat_kryzys:0 "Oferta protektoratu"
 ROS_zw_protektorat_kryzys_desc:0 "Moskwa proponuje słabszym sąsiadom ochronę, tanie paliwo i rosyjskich doradców. W zamian oczekuje lojalności – pełnej."
 ROS_zw_przemysl_kryzys:0 "Przemysł zbrojeniowy obwodu"
 ROS_zw_przemysl_kryzys_desc:0 "Zakłady w Królewcu i Czerniachowsku dostają zamówienia państwowe na lata. Konwoje przez Białoruś przestają być jedynym źródłem amunicji."
 ROS_zw_strefa_kryzys:0 "Strefa wpływów"
 ROS_zw_strefa_kryzys_desc:0 "Ambasadorzy, banki i telewizja. Rosyjskie wpływy sięgają tam, gdzie nie dojechały czołgi."
 ROS_zw_bufor_kryzys:0 "Strefa buforowa"
 ROS_zw_bufor_kryzys_desc:0 "Pas umocnień od Zalewu Wiślanego po Suwałki. Kto chce odbić Mazury, musi przejść przez beton i pola minowe."
 ROS_zw_final_kryzys:0 "Rosja nad Wisłą?"
 ROS_zw_final_kryzys_desc:0 "Mapy w sztabie generalnym kończą się już nie na Łynie, ale na Wiśle. Na razie to tylko mapy."
 ROS_zw_zwiazkowe_kryzys:0 "Państwo Związkowe w akcji"
 ROS_zw_zwiazkowe_kryzys_desc:0 "Moskwa przypomina Mińskowi, że Państwo Związkowe to nie tylko wspólne defilady. Białoruś może dołączyć do sojuszu, przysłać sprzęt – albo odmówić."
 ROS_zw_druga_fala_kryzys:0 "Druga fala"
 ROS_zw_druga_fala_kryzys_desc:0 "Sztab generalny wyjmuje z sejfu mapy, które kończyły się na Wiśle. Każde państewko przy nowej granicy obwodu jest teraz celem – najpierw najsłabsze."
 ROS_zw_podlasie_kryzys:0 "Uderzenie z dwóch stron"
 ROS_zw_podlasie_kryzys_desc:0 "Gdy rosyjskie kolumny idą z Mazur na południe, białoruskie dywizje mogą wejść na Podlasie od wschodu. Polskie państewka nie mają tylu ludzi, by bronić dwóch frontów."
 ROS_zw_wisla_kryzys:0 "Rosja nad Wisłą"
 ROS_zw_wisla_kryzys_desc:0 "To, co było tylko mapą w sztabie, staje się granicą. Gubernatorzy z Moskwy obejmują urzędy w miastach, których nazw jeszcze niedawno nie umieli wymówić."
 ROS_kl_lekcja_kryzys:0 "Gorzka lekcja"
 ROS_kl_lekcja_kryzys_desc:0 "Kolumny wracają do obwodu z połową stanu. W sztabie nikt nie mówi „klęska” – mówi się „zakończenie operacji”. Ale wszyscy wiedzą."
 ROS_kl_zdobycze_kryzys:0 "Utrzymać to, co zostało"
 ROS_kl_zdobycze_kryzys_desc:0 "Rozejm zostawił w rosyjskich rękach przygraniczne gminy, których obrońcy nie zdołali odbić. Trzeba je umocnić, zanim ktoś spróbuje."
 ROS_kl_rozliczenia_kryzys:0 "Rozliczenia w sztabie"
 ROS_kl_rozliczenia_kryzys_desc:0 "Dowódcy odpowiedzialni za klęskę tracą stanowiska. Ich następcy mają jedną zaletę: nie było ich na Mazurach."
 ROS_kl_gospodarka_kryzys:0 "Gospodarka po wojnie"
 ROS_kl_gospodarka_kryzys_desc:0 "Koniec wydatków na ofensywę oznacza pieniądze na fabryki, drogi i pensje. Przynajmniej w teorii."
 ROS_kl_rozmowy_kryzys:0 "Rozmowy z Mazurami"
 ROS_kl_rozmowy_kryzys_desc:0 "Rosyjscy dyplomaci jadą do Olsztyna – tym razem samochodami, nie czołgami. Rozmowy dotyczą jeńców, granicy i handlu."
 ROS_kl_reforma_kryzys:0 "Reforma armii"
 ROS_kl_reforma_kryzys_desc:0 "Nowe regulaminy, nowi dowódcy i nowe szkolenia. Armia ma się uczyć na błędach z Mazur, a nie je ukrywać."
 ROS_kl_spokoj_kryzys:0 "Spokój w obwodzie"
 ROS_kl_spokoj_kryzys_desc:0 "Matki poległych dostają odszkodowania, a telewizja przestaje mówić o wojnie. Ludzie chcą po prostu żyć."
 ROS_kl_odbudowa_kryzys:0 "Odbudowa potęgi"
 ROS_kl_odbudowa_kryzys_desc:0 "Rosja przegrała bitwę o Mazury, ale nie przestała być Rosją. Następnym razem będzie lepiej przygotowana."
 ROS_zw_aneksja_kryzys:0 "Aneksja Mazur"
 ROS_zw_aneksja_kryzys_desc:0 "Zdobyte ziemie zostaną włączone do Federacji Rosyjskiej. Państwa mazurskie przestaną istnieć."
 ROS_zw_administracja_kryzys:0 "Administracja wojskowa"
 ROS_zw_administracja_kryzys_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_kryzys:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_kryzys_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_kryzys:0 "Pokój bez aneksji"
 ROS_zw_pokoj_kryzys_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_kryzys_tree:0 "Kryzys sukcesji"
 ROS_pok_administracja:0 "Cywilna administracja kryzysowa"
 ROS_pok_administracja_desc:0 "Natalia Pokłonska staje na czele tymczasowej administracji. Nie jest konstytucyjną następczynią – jej władza wynika z dekretu Rady i z tego, że nikt inny nie chciał podpisać się pod tym chaosem."
 ROS_pok_krym:0 "Zabezpieczenie Krymu"
 ROS_pok_krym_desc:0 "Pierwsza decyzja: półwysep nie może wymknąć się spod kontroli w czasie, gdy Moskwa szuka nowego przywódcy."
 ROS_pok_rozmowy:0 "Rozmowy z politykami"
 ROS_pok_rozmowy_desc:0 "Do Białego Domu przychodzą ludzie, których jeszcze rok temu nazywano zdrajcami. Rozmawia się o terminie wyborów i o tym, kto będzie mógł w nich startować."
 ROS_pok_prokuratura:0 "Prokuratura przeciw korupcji"
 ROS_pok_prokuratura_desc:0 "Kilka głośnych zatrzymań w ministerstwach ma pokazać, że nowe władze nie chronią nikogo."
 ROS_pok_sztab:0 "Porozumienie ze sztabem"
 ROS_pok_sztab_desc:0 "Generałowie zgadzają się słuchać administracji cywilnej, jeśli nikt nie będzie im przeszkadzał w prowadzeniu wojny."
 ROS_pok_amnestia:0 "Amnestia dla więźniów politycznych"
 ROS_pok_amnestia_desc:0 "Bramy kolonii karnych otwierają się dla setek ludzi skazanych za protesty i wpisy w internecie. Część z nich od razu zapisuje się do sztabów wyborczych."
 ROS_pok_okragly_stol:0 "Okrągły stół w Moskwie"
 ROS_pok_okragly_stol_desc:0 "Przy jednym stole siadają Jedna Rosja, Jabłoko, emigranci i ludzie oligarchów. Każdy chce gwarancji, że po wyborach nie skończy w więzieniu."
 ROS_pok_komisja:0 "Niezależna komisja wyborcza"
 ROS_pok_komisja_desc:0 "Po raz pierwszy od dekad wyniki wyborów policzą ludzie, którzy nie znają ich z góry."
 ROS_pok_wybory:0 "Przygotowanie wyborów"
 ROS_pok_wybory_desc:0 "Data wyborów prezydenckich zostaje ogłoszona. Pokłonska zapowiada, że nie wystartuje – jej zadaniem było tylko doprowadzić kraj do urn."
