 ROS_zw_obwod_wm_cho_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_cho:0 "Pokój bez aneksji"
 ROS_zw_pokoj_cho_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_cho_tree:0 "Prezydent Chodorkowski"
 ROS_szl_prezydent:0 "Parlament ponad Kremlem"
 ROS_szl_prezydent_desc:0 "Lew Szlosberg obejmuje urząd z jedną obietnicą: będzie ostatnim prezydentem, który ma tyle władzy."
 ROS_szl_federalizm:0 "Federalizm regionów"
 ROS_szl_federalizm_desc:0 "Gubernatorzy znów będą wybierani, a regiony dostaną własne budżety."
 ROS_szl_wybory_lokalne:0 "Wolne wybory lokalne"
 ROS_szl_wybory_lokalne_desc:0 "Po raz pierwszy od lat w radach miast zasiadają ludzie spoza partii władzy."
 ROS_szl_prawda:0 "Prawda o wojnie"
 ROS_szl_prawda_desc:0 "Ministerstwo Obrony publikuje prawdziwe liczby poległych. Kraj milknie."
 ROS_szl_sady:0 "Reforma sądów"
 ROS_szl_sady_desc:0 "Sędziowie przestają dostawać telefony z administracji prezydenta."
 ROS_szl_konstytucja:0 "Nowa konstytucja Federacji"
 ROS_szl_konstytucja_desc:0 "Republika parlamentarna z silnymi regionami. Projekt trafia pod referendum."
 ROS_szl_rozmowy_wilno:0 "Rozmowy w Wilnie"
 ROS_szl_rozmowy_wilno_desc:0 "Delegacje Rosji i państw mazurskich spotykają się na neutralnym gruncie. Litwini pilnują, by nikt nie wyszedł przed czasem."
 ROS_szl_wycofanie:0 "Wycofanie ciężkiego sprzętu"
 ROS_szl_wycofanie_desc:0 "Artyleria odjeżdża na trzydzieści kilometrów od linii frontu. Pierwszy gest dobrej woli."
 ROS_szl_jency:0 "Wymiana jeńców"
 ROS_szl_jency_desc:0 "Autobusy z jeńcami mijają się na przejściu w Gołdapi. Matki czekają po obu stronach."
 ROS_szl_pokoj:0 "Pokój negocjowany"
 ROS_szl_pokoj_desc:0 "Rosja wycofuje oddziały z Mazur, a sąsiednie państwa dostają wiadomość o zawieszeniu broni."
 ROS_szl_gwarancje:0 "Gwarancje dla Mazur"
 ROS_szl_gwarancje_desc:0 "Rosja uznaje granice państw mazurskich i zobowiązuje się nie stacjonować wojsk ofensywnych w obwodzie."
 ROS_szl_koniec_gosp_wojennej:0 "Koniec gospodarki wojennej"
 ROS_szl_koniec_gosp_wojennej_desc:0 "Zakłady zbrojeniowe wracają do produkcji cywilnej. Budżet obrony zostaje obcięty o połowę."
 ROS_szl_sankcje:0 "Rozmowy o sankcjach"
 ROS_szl_sankcje_desc:0 "Bruksela jest gotowa znieść część ograniczeń – w zamian za konkretne kroki."
 ROS_szl_regiony:0 "Inwestycje w regiony"
 ROS_szl_regiony_desc:0 "Pieniądze, które szły na wojnę, trafiają do szpitali i dróg w obwodzie."
 ROS_szl_baltyk:0 "Otwarcie na Bałtyk"
 ROS_szl_baltyk_desc:0 "Promy z Kłajpedy i Gdańska znów zawijają do Królewca."
 ROS_szl_nauka:0 "Powrót naukowców"
 ROS_szl_nauka_desc:0 "Badacze, którzy wyjechali po 2022 roku, dostają zaproszenie do domu."
 ROS_nauka_tb:0 "Powrót naukowców"
 ROS_nauka2_tb:0 "Powrót naukowców"
 ROS_szl_po_wojnie:0 "Rosja po wojnie"
 ROS_szl_po_wojnie_desc:0 "Wojna na Mazurach dobiegła końca albo przestała być najważniejszą sprawą państwa. Czas zdecydować, jaka Rosja wyłoni się z tych lat."
 ROS_zw_triumf_szl:0 "Defilada w Królewcu"
 ROS_zw_triumf_szl_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
 ROS_zw_obwod_szl:0 "Wsparcie dla Rady Obwodu"
 ROS_zw_obwod_szl_desc:0 "Obwód Warmińsko-Mazurski potrzebuje broni, pieniędzy i urzędników. Moskwa przysyła wszystkiego po trochu – i własnych doradców do każdego wydziału."
 ROS_zw_garnizony_szl:0 "Garnizony nad jeziorami"
 ROS_zw_garnizony_szl_desc:0 "Stałe garnizony w Giżycku, Olsztynie i Ełku. Żołnierze, którzy mieli wrócić do domów, zostają na Mazurach na czas nieokreślony."
 ROS_zw_kolej_szl:0 "Kolej Królewiec–Olsztyn"
 ROS_zw_kolej_szl_desc:0 "Remont linii kolejowej łączącej obwód z Mazurami. Pierwszy pociąg wiezie czołgi, drugi – ziemniaki."
 ROS_zw_polityka_szl:0 "Polityka wobec rozbitej Polski"
 ROS_zw_polityka_szl_desc:0 "Polskie państewka patrzą na Mazury i liczą rosyjskie czołgi. Część z nich chętnie przyjmie ochronę Moskwy – za odpowiednią cenę. "
 ROS_zw_media_szl:0 "Rosyjskie media w regionie"
 ROS_zw_media_szl_desc:0 "Telewizja, portale i „niezależni” blogerzy w państwach przy granicy obwodu zaczynają mówić głosem Moskwy."
 ROS_zw_protektorat_szl:0 "Oferta protektoratu"
 ROS_zw_protektorat_szl_desc:0 "Moskwa proponuje słabszym sąsiadom ochronę, tanie paliwo i rosyjskich doradców. W zamian oczekuje lojalności – pełnej."
 ROS_zw_przemysl_szl:0 "Przemysł zbrojeniowy obwodu"
 ROS_zw_przemysl_szl_desc:0 "Zakłady w Królewcu i Czerniachowsku dostają zamówienia państwowe na lata. Konwoje przez Białoruś przestają być jedynym źródłem amunicji."
 ROS_zw_strefa_szl:0 "Strefa wpływów"
 ROS_zw_strefa_szl_desc:0 "Ambasadorzy, banki i telewizja. Rosyjskie wpływy sięgają tam, gdzie nie dojechały czołgi."
 ROS_zw_bufor_szl:0 "Strefa buforowa"
 ROS_zw_bufor_szl_desc:0 "Pas umocnień od Zalewu Wiślanego po Suwałki. Kto chce odbić Mazury, musi przejść przez beton i pola minowe."
 ROS_zw_final_szl:0 "Rosja nad Wisłą?"
 ROS_zw_final_szl_desc:0 "Mapy w sztabie generalnym kończą się już nie na Łynie, ale na Wiśle. Na razie to tylko mapy."
 ROS_zw_zwiazkowe_szl:0 "Państwo Związkowe w akcji"
 ROS_zw_zwiazkowe_szl_desc:0 "Moskwa przypomina Mińskowi, że Państwo Związkowe to nie tylko wspólne defilady. Białoruś może dołączyć do sojuszu, przysłać sprzęt – albo odmówić."
 ROS_zw_druga_fala_szl:0 "Druga fala"
 ROS_zw_druga_fala_szl_desc:0 "Sztab generalny wyjmuje z sejfu mapy, które kończyły się na Wiśle. Każde państewko przy nowej granicy obwodu jest teraz celem – najpierw najsłabsze."
 ROS_zw_podlasie_szl:0 "Uderzenie z dwóch stron"
 ROS_zw_podlasie_szl_desc:0 "Gdy rosyjskie kolumny idą z Mazur na południe, białoruskie dywizje mogą wejść na Podlasie od wschodu. Polskie państewka nie mają tylu ludzi, by bronić dwóch frontów."
 ROS_zw_wisla_szl:0 "Rosja nad Wisłą"
 ROS_zw_wisla_szl_desc:0 "To, co było tylko mapą w sztabie, staje się granicą. Gubernatorzy z Moskwy obejmują urzędy w miastach, których nazw jeszcze niedawno nie umieli wymówić."
 ROS_kl_lekcja_szl:0 "Gorzka lekcja"
 ROS_kl_lekcja_szl_desc:0 "Kolumny wracają do obwodu z połową stanu. W sztabie nikt nie mówi „klęska” – mówi się „zakończenie operacji”. Ale wszyscy wiedzą."
 ROS_kl_zdobycze_szl:0 "Utrzymać to, co zostało"
 ROS_kl_zdobycze_szl_desc:0 "Rozejm zostawił w rosyjskich rękach przygraniczne gminy, których obrońcy nie zdołali odbić. Trzeba je umocnić, zanim ktoś spróbuje."
 ROS_kl_rozliczenia_szl:0 "Rozliczenia w sztabie"
 ROS_kl_rozliczenia_szl_desc:0 "Dowódcy odpowiedzialni za klęskę tracą stanowiska. Ich następcy mają jedną zaletę: nie było ich na Mazurach."
 ROS_kl_gospodarka_szl:0 "Gospodarka po wojnie"
 ROS_kl_gospodarka_szl_desc:0 "Koniec wydatków na ofensywę oznacza pieniądze na fabryki, drogi i pensje. Przynajmniej w teorii."
 ROS_kl_rozmowy_szl:0 "Rozmowy z Mazurami"
 ROS_kl_rozmowy_szl_desc:0 "Rosyjscy dyplomaci jadą do Olsztyna – tym razem samochodami, nie czołgami. Rozmowy dotyczą jeńców, granicy i handlu."
 ROS_kl_reforma_szl:0 "Reforma armii"
 ROS_kl_reforma_szl_desc:0 "Nowe regulaminy, nowi dowódcy i nowe szkolenia. Armia ma się uczyć na błędach z Mazur, a nie je ukrywać."
 ROS_kl_spokoj_szl:0 "Spokój w obwodzie"
 ROS_kl_spokoj_szl_desc:0 "Matki poległych dostają odszkodowania, a telewizja przestaje mówić o wojnie. Ludzie chcą po prostu żyć."
 ROS_kl_odbudowa_szl:0 "Odbudowa potęgi"
 ROS_kl_odbudowa_szl_desc:0 "Rosja przegrała bitwę o Mazury, ale nie przestała być Rosją. Następnym razem będzie lepiej przygotowana."
 ROS_zw_aneksja_szl:0 "Aneksja Mazur"
 ROS_zw_aneksja_szl_desc:0 "Zdobyte ziemie zostaną włączone do Federacji Rosyjskiej. Państwa mazurskie przestaną istnieć."
 ROS_zw_administracja_szl:0 "Administracja wojskowa"
 ROS_zw_administracja_szl_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_szl:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_szl_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_szl:0 "Pokój bez aneksji"
 ROS_zw_pokoj_szl_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_szl_tree:0 "Prezydent Szlosberg"
 ROS_naw_prezydent:0 "Prezydent Nawalna"
 ROS_naw_prezydent_desc:0 "Julia Nawalna wygrywa wybory, w które wielu nie wierzyło. W pierwszym przemówieniu mówi o więźniach politycznych, korupcji i końcu wojny."
 ROS_naw_fbk:0 "Fundacja Antykorupcyjna u władzy"
 ROS_naw_fbk_desc:0 "Śledczy, którzy latami publikowali filmy o pałacach urzędników, dostają uprawnienia prokuratorów."
 ROS_naw_lustracja:0 "Lustracja elit"
 ROS_naw_lustracja_desc:0 "Każdy urzędnik musi wyjaśnić pochodzenie majątku. Wielu woli wyjechać, niż odpowiadać."
 ROS_naw_slowo:0 "Wolność słowa"
 ROS_naw_slowo_desc:0 "Zablokowane strony wracają, a dziennikarze z emigracji otwierają redakcje w Moskwie."
 ROS_naw_rosgwardia:0 "Rozwiązanie Rosgwardii"
 ROS_naw_rosgwardia_desc:0 "Gwardia Narodowa przestaje istnieć. Jej funkcjonariusze trafiają do policji – po weryfikacji."
 ROS_naw_rosja_przyszlosci:0 "Rosja przyszłości"
 ROS_naw_rosja_przyszlosci_desc:0 "Kraj, w którym władza się zmienia, a obywatele nie boją się policji. Na razie to tylko obietnica – ale coraz więcej osób w nią wierzy."
 ROS_naw_zawieszenie:0 "Natychmiastowe zawieszenie broni"
 ROS_naw_zawieszenie_desc:0 "Pierwszy dekret nowej prezydent: wojska na Mazurach przerywają ogień."
 ROS_naw_powrot:0 "Powrót żołnierzy do domów"
 ROS_naw_powrot_desc:0 "Pociągi z obwodu wiozą żołnierzy do rodzin. Wielu z nich nie wie, co teraz robić."
 ROS_naw_przeprosiny:0 "Przeprosiny dla Mazur"
 ROS_naw_przeprosiny_desc:0 "Prezydent jedzie do Olsztyna. Jej słowa nie przywrócą życia zabitym, ale otwierają drogę do rozmów."
 ROS_naw_odszkodowania:0 "Odszkodowania"
 ROS_naw_odszkodowania_desc:0 "Część zamrożonych aktywów rosyjskich trafia na odbudowę zniszczonych miast Mazur."
 ROS_naw_bez_imperium:0 "Rosja bez imperium"
 ROS_naw_bez_imperium_desc:0 "Pierwszy raz od trzystu lat Rosja oficjalnie nie chce być imperium. Nie wszyscy się z tym godzą."
 ROS_naw_miliardy:0 "Odzyskane miliardy"
 ROS_naw_miliardy_desc:0 "Pieniądze z pałaców i jachtów wracają do budżetu."
 ROS_naw_jawnosc:0 "Jawność budżetu"
 ROS_naw_jawnosc_desc:0 "Każdy rubel wydany przez państwo można sprawdzić w internecie."
 ROS_naw_pomoc:0 "Pomoc z Zachodu"
 ROS_naw_pomoc_desc:0 "Pierwsze transze pomocy przychodzą pod warunkiem dalszych reform."
 ROS_naw_gospodarka:0 "Nowa gospodarka"
 ROS_naw_gospodarka_desc:0 "Mniej ropy i gazu, więcej firm, które nie potrzebują znajomości w Kremlu."
 ROS_nowa_gosp_tb:0 "Nowa gospodarka"
 ROS_naw_kultura:0 "Kultura bez cenzury"
 ROS_naw_kultura_desc:0 "Filmy, książki i koncerty, które przez lata były zakazane, wracają do kin i sal."
 ROS_naw_po_wojnie:0 "Rosja po wojnie"
 ROS_naw_po_wojnie_desc:0 "Wojna na Mazurach dobiegła końca albo przestała być najważniejszą sprawą państwa. Czas zdecydować, jaka Rosja wyłoni się z tych lat."
