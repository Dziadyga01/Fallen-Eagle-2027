 ROS_zw_administracja_cho_future:0 "Administracja wojskowa"
 ROS_zw_administracja_cho_future_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_cho_future:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_cho_future_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_cho_future:0 "Pokój bez aneksji"
 ROS_zw_pokoj_cho_future_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_cho_future_tree:0 "Republika oligarchów"
 ROS_szl_f_start:0 "Federacja wolnych republik"
 ROS_szl_f_start_desc:0 "Lew Szlosberg chce, by Rosja przestała być imperium rządzonym z Moskwy, a stała się federacją równych republik."
 ROS_szl_f1:0 "Traktat federacyjny"
 ROS_szl_f1_desc:0 "Republiki i obwody podpisują nową umowę z centrum."
 ROS_szl_f2:0 "Rada Republik"
 ROS_szl_f2_desc:0 "Druga izba parlamentu reprezentuje regiony, nie Moskwę."
 ROS_szl_f3:0 "Samorząd Królewca"
 ROS_szl_f3_desc:0 "Obwód dostaje szeroką autonomię i specjalny status nad Bałtykiem."
 ROS_szl_f4:0 "Prawa mniejszości"
 ROS_szl_f4_desc:0 "Języki narodów Rosji wracają do szkół."
 ROS_szl_f5:0 "Rozliczenie wojny"
 ROS_szl_f5_desc:0 "Komisja prawdy bada zbrodnie wojenne – także te na Mazurach."
 ROS_szl_f6:0 "Separatyzmy"
 ROS_szl_f6_desc:0 "Nie wszyscy chcą zostać w federacji. Czeczenia i Tuwa pytają o referendum."
 ROS_szl_sukces1:0 "Federacja Wolnych Republik"
 ROS_szl_sukces1_desc:0 "Nowa konstytucja wchodzi w życie. Rosja jest federacją z prawdziwego zdarzenia."
 ROS_szl_upadek1:0 "Rozpad federacji"
 ROS_szl_upadek1_desc:0 "Klęska i kryzys osłabiają centrum. Kolejne republiki ogłaszają suwerenność."
 ROS_szl_sukces2:0 "Rosja w Europie"
 ROS_szl_sukces2_desc:0 "Moskwa składa wniosek o członkostwo w Radzie Europy. Pierwszy krok na długiej drodze."
 ROS_szl_upadek2:0 "Rosja regionów"
 ROS_szl_upadek2_desc:0 "Moskwa rządzi już tylko Moskwą. Reszta kraju żyje własnym życiem."
 ROS_zw_triumf_szl_future:0 "Defilada w Królewcu"
