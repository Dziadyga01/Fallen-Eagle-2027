l_polish:
 ROS_imperium:0 "Imperium na skraju rozpadu"
 ROS_imperium_desc:0 "§Y«Империя на грани распада»§!\n\nWojna w Ukrainie trwa czwarty rok. Rubel słabnie, w regionach brakuje lekarzy i nauczycieli, a w Królewcu stacjonuje armia, której nikt nie potrafi już uzupełnić. Kreml wciąż mówi o zwycięstwie, choć coraz mniej osób w to wierzy."
 ROS_wojna_bez_konca:0 "Wojna bez końca"
 ROS_wojna_bez_konca_desc:0 "Front w Ukrainie pochłania ludzi, sprzęt i pieniądze. Sztab chce wiedzieć, ile jeszcze wytrzyma budżet – i ile wytrzyma eksklawa odcięta od reszty kraju."
 ROS_gospodarka_na_granicy:0 "Gospodarka na granicy"
 ROS_gospodarka_na_granicy_desc:0 "Sklepy w Królewcu mają towar tylko dlatego, że ciężarówki wciąż przejeżdżają przez Litwę na podstawie starych umów tranzytowych. Trzeba ograniczyć wydatki, zanim kryzys zacznie się w kolejkach."
 ROS_jantar:0 "Stocznia „Jantar”"
 ROS_jantar_desc:0 "Najstarsza stocznia Królewca może naprawiać okręty Floty Bałtyckiej i składać pojazdy dla piechoty morskiej. Wystarczy przestawić kilka hal na produkcję wojskową."
 ROS_bursztyn:0 "Kombinat bursztynowy"
 ROS_bursztyn_desc:0 "Kombinat w Palmnikach wydobywa niemal cały bursztyn świata. Dochody z jego sprzedaży przez Chiny i Emiraty mogą sfinansować garnizon."
 ROS_most_powietrzny:0 "Most powietrzny z Moskwy"
 ROS_most_powietrzny_desc:0 "Samoloty transportowe lecą nad Bałtykiem, omijając przestrzeń powietrzną NATO. Każdy rejs to amunicja, części zamienne i kilkuset rezerwistów."
 ROS_niezadowolenie_generalow:0 "Niezadowolenie generałów"
 ROS_niezadowolenie_generalow_desc:0 "Dowódcy 11. Korpusu Armii skarżą się, że Moskwa zabiera im najlepsze jednostki na front ukraiński. Ich lojalność zależy od tego, czy Kreml da im wojnę, którą mogą wygrać."
 ROS_nowi_dowodcy:0 "Nowi dowódcy z frontu"
 ROS_nowi_dowodcy_desc:0 "Oficerowie, którzy przeżyli Bachmut i Awdijiwkę, wracają do Królewca. Nie znają Mazur, ale znają wojnę lepiej niż ktokolwiek w sztabie."
 ROS_lojalnosc_za_pieniadze:0 "Lojalność za pieniądze"
 ROS_lojalnosc_za_pieniadze_desc:0 "Premie, mieszkania służbowe i udziały w spółkach – elity obwodu dostają powód, by nie zadawać pytań o przyszłość."
 ROS_propaganda:0 "Propaganda ostatniego zwycięstwa"
 ROS_propaganda_desc:0 "Telewizja pokazuje mapę rozbitej Polski i pyta, kto będzie następny. Odpowiedź ma być jedna: Rosja znów jest silna."
 ROS_rosgwardia_krolewiec:0 "Rosgwardia w Królewcu"
 ROS_rosgwardia_krolewiec_desc:0 "W obwodzie działają ludzie, którzy marzą o „Republice Bałtyckiej”. Gwardia Narodowa dostaje listy nazwisk i wolną rękę."
 ROS_front_informacyjny:0 "Front informacyjny"
 ROS_front_informacyjny_desc:0 "Kanały w komunikatorach, boty i „niezależni” blogerzy mają przekonać Polaków z Mazur, że Moskwa przychodzi zaprowadzić porządek."
 ROS_polska_upadla:0 "Polska upadła"
 ROS_polska_upadla_desc:0 "§Y«Польша пала»§!\n\nRzeczpospolita rozpadła się na kilkadziesiąt państw. Granica NATO na północy przestała być linią – jest teraz mozaiką gmin, powiatów i samozwańczych rządów."
 ROS_rozpoznanie:0 "Rozpoznanie na Mazurach"
 ROS_rozpoznanie_desc:0 "Drony i agenci sprawdzają, kto naprawdę rządzi w Olsztynie, Giżycku i Suwałkach – i ile mają ludzi pod bronią."
 ROS_rozmowy_minsk:0 "Rozmowy z Mińskiem"
 ROS_rozmowy_minsk_desc:0 "Bez Białorusi Mazury są poza zasięgiem. Mińsk zgodzi się na przemarsz wojsk – za odpowiednią cenę."
 ROS_ostatnia_szansa:0 "Ostatnia szansa Rosji"
 ROS_ostatnia_szansa_desc:0 "Jeśli Rosja nie wykorzysta tej chwili, za kilka lat Mazury staną się częścią czyjegoś sojuszu. Kreml uznaje, że czas działać."
 ROS_operacja_mazurska:0 "Operacja Mazurska"
 ROS_operacja_mazurska_desc:0 "Putin podpisuje dyrektywę. Od tej chwili kraj żyje przygotowaniami do ofensywy na północną Polskę – a niedokończone sprawy muszą poczekać."
 ROS_11_korpus:0 "Odbudowa 11. Korpusu Armii"
 ROS_11_korpus_desc:0 "Korpus stracił połowę stanów w Ukrainie. Nowi poborowi, sprzęt z magazynów i kilka miesięcy ćwiczeń – tyle trzeba, by znów był siłą."
 ROS_artyleria:0 "Artyleria obwodu"
 ROS_artyleria_desc:0 "Ukraina nauczyła wszystkich jednego: wojnę wygrywa ten, kto ma więcej pocisków. Magazyny w Czerniachowsku zostają otwarte."
 ROS_artyleria_tb:0 "Artyleria obwodu"
 ROS_rezerwy_pancerne:0 "Rezerwy pancerne"
 ROS_rezerwy_pancerne_desc:0 "Stare transportery i ciężarówki z baz pod Gusiewem trafiają do warsztatów. Nie są nowoczesne, ale jest ich dużo."
 ROS_brygada_iskander:0 "Brygada Iskanderów"
 ROS_brygada_iskander_desc:0 "152. Brygada Rakietowa stacjonuje w Czerniachowsku od lat. Teraz jej cele nie leżą już w Warszawie, ale w Olsztynie i Ełku."
 ROS_zw_triumf_putin:0 "Defilada w Królewcu"
 ROS_zw_triumf_putin_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
 ROS_zw_obwod_putin:0 "Wsparcie dla Rady Obwodu"
 ROS_zw_obwod_putin_desc:0 "Obwód Warmińsko-Mazurski potrzebuje broni, pieniędzy i urzędników. Moskwa przysyła wszystkiego po trochu – i własnych doradców do każdego wydziału."
 ROS_zw_garnizony_putin:0 "Garnizony nad jeziorami"
 ROS_zw_garnizony_putin_desc:0 "Stałe garnizony w Giżycku, Olsztynie i Ełku. Żołnierze, którzy mieli wrócić do domów, zostają na Mazurach na czas nieokreślony."
 ROS_zw_kolej_putin:0 "Kolej Królewiec–Olsztyn"
 ROS_zw_kolej_putin_desc:0 "Remont linii kolejowej łączącej obwód z Mazurami. Pierwszy pociąg wiezie czołgi, drugi – ziemniaki."
 ROS_zw_polityka_putin:0 "Polityka wobec rozbitej Polski"
 ROS_zw_polityka_putin_desc:0 "Polskie państewka patrzą na Mazury i liczą rosyjskie czołgi. Część z nich chętnie przyjmie ochronę Moskwy – za odpowiednią cenę. "
 ROS_zw_media_putin:0 "Rosyjskie media w regionie"
 ROS_zw_media_putin_desc:0 "Telewizja, portale i „niezależni” blogerzy w państwach przy granicy obwodu zaczynają mówić głosem Moskwy."
 ROS_zw_protektorat_putin:0 "Oferta protektoratu"
 ROS_zw_protektorat_putin_desc:0 "Moskwa proponuje słabszym sąsiadom ochronę, tanie paliwo i rosyjskich doradców. W zamian oczekuje lojalności – pełnej."
 ROS_zw_przemysl_putin:0 "Przemysł zbrojeniowy obwodu"
 ROS_zw_przemysl_putin_desc:0 "Zakłady w Królewcu i Czerniachowsku dostają zamówienia państwowe na lata. Konwoje przez Białoruś przestają być jedynym źródłem amunicji."
 ROS_zw_strefa_putin:0 "Strefa wpływów"
 ROS_zw_strefa_putin_desc:0 "Ambasadorzy, banki i telewizja. Rosyjskie wpływy sięgają tam, gdzie nie dojechały czołgi."
 ROS_zw_bufor_putin:0 "Strefa buforowa"
 ROS_zw_bufor_putin_desc:0 "Pas umocnień od Zalewu Wiślanego po Suwałki. Kto chce odbić Mazury, musi przejść przez beton i pola minowe."
 ROS_zw_final_putin:0 "Rosja nad Wisłą?"
 ROS_zw_final_putin_desc:0 "Mapy w sztabie generalnym kończą się już nie na Łynie, ale na Wiśle. Na razie to tylko mapy."
 ROS_zw_zwiazkowe_putin:0 "Państwo Związkowe w akcji"
 ROS_zw_zwiazkowe_putin_desc:0 "Moskwa przypomina Mińskowi, że Państwo Związkowe to nie tylko wspólne defilady. Białoruś może dołączyć do sojuszu, przysłać sprzęt – albo odmówić."
 ROS_zw_druga_fala_putin:0 "Druga fala"
 ROS_zw_druga_fala_putin_desc:0 "Sztab generalny wyjmuje z sejfu mapy, które kończyły się na Wiśle. Każde państewko przy nowej granicy obwodu jest teraz celem – najpierw najsłabsze."
 ROS_zw_podlasie_putin:0 "Uderzenie z dwóch stron"
 ROS_zw_podlasie_putin_desc:0 "Gdy rosyjskie kolumny idą z Mazur na południe, białoruskie dywizje mogą wejść na Podlasie od wschodu. Polskie państewka nie mają tylu ludzi, by bronić dwóch frontów."
 ROS_zw_wisla_putin:0 "Rosja nad Wisłą"
 ROS_zw_wisla_putin_desc:0 "To, co było tylko mapą w sztabie, staje się granicą. Gubernatorzy z Moskwy obejmują urzędy w miastach, których nazw jeszcze niedawno nie umieli wymówić."
 ROS_kl_lekcja_putin:0 "Gorzka lekcja"
 ROS_kl_lekcja_putin_desc:0 "Kolumny wracają do obwodu z połową stanu. W sztabie nikt nie mówi „klęska” – mówi się „zakończenie operacji”. Ale wszyscy wiedzą."
 ROS_kl_zdobycze_putin:0 "Utrzymać to, co zostało"
 ROS_kl_zdobycze_putin_desc:0 "Rozejm zostawił w rosyjskich rękach przygraniczne gminy, których obrońcy nie zdołali odbić. Trzeba je umocnić, zanim ktoś spróbuje."
 ROS_kl_rozliczenia_putin:0 "Rozliczenia w sztabie"
 ROS_kl_rozliczenia_putin_desc:0 "Dowódcy odpowiedzialni za klęskę tracą stanowiska. Ich następcy mają jedną zaletę: nie było ich na Mazurach."
 ROS_kl_gospodarka_putin:0 "Gospodarka po wojnie"
 ROS_kl_gospodarka_putin_desc:0 "Koniec wydatków na ofensywę oznacza pieniądze na fabryki, drogi i pensje. Przynajmniej w teorii."
 ROS_kl_rozmowy_putin:0 "Rozmowy z Mazurami"
 ROS_kl_rozmowy_putin_desc:0 "Rosyjscy dyplomaci jadą do Olsztyna – tym razem samochodami, nie czołgami. Rozmowy dotyczą jeńców, granicy i handlu."
 ROS_kl_reforma_putin:0 "Reforma armii"
 ROS_kl_reforma_putin_desc:0 "Nowe regulaminy, nowi dowódcy i nowe szkolenia. Armia ma się uczyć na błędach z Mazur, a nie je ukrywać."
 ROS_kl_spokoj_putin:0 "Spokój w obwodzie"
 ROS_kl_spokoj_putin_desc:0 "Matki poległych dostają odszkodowania, a telewizja przestaje mówić o wojnie. Ludzie chcą po prostu żyć."
 ROS_kl_odbudowa_putin:0 "Odbudowa potęgi"
 ROS_kl_odbudowa_putin_desc:0 "Rosja przegrała bitwę o Mazury, ale nie przestała być Rosją. Następnym razem będzie lepiej przygotowana."
 ROS_zw_aneksja_putin:0 "Aneksja Mazur"
 ROS_zw_aneksja_putin_desc:0 "Zdobyte ziemie zostaną włączone do Federacji Rosyjskiej. Państwa mazurskie przestaną istnieć."
 ROS_zw_administracja_putin:0 "Administracja wojskowa"
 ROS_zw_administracja_putin_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_putin:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_putin_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_putin:0 "Pokój bez aneksji"
 ROS_zw_pokoj_putin_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_putin_tree:0 "Ostatnia ambicja Putina"
 ROS_operacja_mazury:0 "Operacja „Mazury”"
 ROS_operacja_mazury_desc:0 "§Y«Операция «Мазурия»»§!\n\nSztab Zachodniego Okręgu Wojskowego przejmuje dowodzenie nad obwodem. Na mapach w Królewcu pojawiają się strzałki wymierzone w Olsztyn, Giżycko i Suwałki."
 ROS_rodziny_poleglych:0 "Rodziny poległych"
 ROS_rodziny_poleglych_desc:0 "Każda wioska w obwodzie ma kogoś, kto nie wrócił z Ukrainy. Państwo obiecuje im renty i pomniki – i prosi o kolejnych synów."
 ROS_przygotowanie_ofensywy:0 "Przygotowanie ofensywy"
 ROS_przygotowanie_ofensywy_desc:0 "Ćwiczenia „Zapad” odbywają się co kilka lat. Tym razem nikt nie udaje, że to tylko ćwiczenia."
 ROS_roszczenia:0 "Roszczenia wobec Suwalszczyzny"
 ROS_roszczenia_desc:0 "Państwowe media przypominają o „rosyjskich” Mazurach i o przesmyku, który dzieli Królewiec od Białorusi. Prawnicy MSZ piszą uzasadnienie."
 ROS_mobilizacja_rezerw:0 "Mobilizacja rezerw"
 ROS_mobilizacja_rezerw_desc:0 "Wezwania trafiają do mężczyzn z całego obwodu. Ci, którzy mogli, wyjechali już przez Litwę – reszta stawia się w komendach."
 ROS_korytarz_bialoruski:0 "Korytarz białoruski"
 ROS_korytarz_bialoruski_desc:0 "Kolumny z Grodna mogą uderzyć na Suwałki od wschodu. Mińsk otwiera drogi, a rosyjscy oficerowie łącznikowi zajmują biura w sztabie białoruskiej armii."
 ROS_ostatnie_rozkazy:0 "Ostatnie rozkazy Kremla"
 ROS_ostatnie_rozkazy_desc:0 "Plan zatwierdzony. Zostało tylko jedno: rozkaz Prezydenta."
 ROS_rozpoczecie_interwencji:0 "Rozpoczęcie interwencji"
 ROS_rozpoczecie_interwencji_desc:0 "O świcie artyleria otwiera ogień wzdłuż całej granicy obwodu. Rosja wkracza na Mazury."
 ROS_lotnictwo_mazury:0 "Lotnictwo nad Mazurami"
 ROS_lotnictwo_mazury_desc:0 "Śmigłowce i drony szturmowe polują na kolumny pojazdów na drogach między jeziorami."
 ROS_szturm_gizycko:0 "Szturm na Giżycko"
 ROS_szturm_gizycko_desc:0 "Giżycko zamyka drogę między jeziorami Niegocin i Kisajno. Kto ma Giżycko, ma serce Mazur."
 ROS_przesmyk_suwalski:0 "Przesmyk suwalski"
 ROS_przesmyk_suwalski_desc:0 "Sześćdziesiąt pięć kilometrów między Królewcem a Białorusią. Jeśli kolumny się spotkają, eksklawa przestanie być eksklawą."
 ROS_wojna_elektroniczna:0 "Wojna elektroniczna"
 ROS_wojna_elektroniczna_desc:0 "Zakłócanie GPS nad Bałtykiem to dla obwodu codzienność. Teraz oślepione mają zostać drony obrońców."
 ROS_wre_tb:0 "Wojna elektroniczna"
 ROS_kociol_mazurski:0 "Kocioł mazurski"
 ROS_kociol_mazurski_desc:0 "Lasy i jeziora dzielą obrońców na małe grupy. Sztab chce je okrążyć, zanim zdążą się połączyć."
 ROS_twierdza_boyen:0 "Twierdza Boyen"
 ROS_twierdza_boyen_desc:0 "XIX-wieczne pruskie forty w Giżycku znów mają garnizon – tym razem rosyjski."
 ROS_zw_triumf_mazury:0 "Defilada w Królewcu"
 ROS_zw_triumf_mazury_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
