 ROS_zw_administracja_naw:0 "Administracja wojskowa"
 ROS_zw_administracja_naw_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_naw:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_naw_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_naw:0 "Pokój bez aneksji"
 ROS_zw_pokoj_naw_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_naw_tree:0 "Prezydent Nawalna"
 ROS_put_f_start:0 "Ostatni prezydent starej Rosji"
 ROS_put_f_start_desc:0 "Władimir Putin rządzi dłużej niż ktokolwiek od czasów Stalina. Pytanie nie brzmi już, czy odejdzie, ale co zostanie po nim."
 ROS_put_f1:0 "Pomnik za życia"
 ROS_put_f1_desc:0 "Na placu w Królewcu staje pomnik prezydenta. Odsłania go sam zainteresowany."
 ROS_put_f2:0 "Rosja-twierdza"
 ROS_put_f2_desc:0 "Granice zamknięte, gospodarka samowystarczalna, wróg za każdą miedzą."
 ROS_put_f3:0 "Rosyjski Bałtyk"
 ROS_put_f3_desc:0 "Flota Bałtycka ma panować na morzu od Piławy po Zatokę Fińską."
 ROS_put_f4:0 "Ludzie Kremla"
 ROS_put_f4_desc:0 "Nowe pokolenie urzędników wychowane w kulcie prezydenta."
 ROS_put_f5:0 "Testament polityczny"
 ROS_put_f5_desc:0 "Prezydent spisuje, jak ma wyglądać Rosja po nim. Dokument trafia do sejfu."
 ROS_put_f6:0 "Zmęczenie władzą"
 ROS_put_f6_desc:0 "Na ulicach coraz więcej młodych ludzi, którzy nie pamiętają innego prezydenta – i mają go dość."
 ROS_put_sukces1:0 "Wieczna Rosja"
 ROS_put_sukces1_desc:0 "System okazuje się silniejszy niż jakakolwiek kryzys. Rosja wkracza w nową dekadę taka sama jak była – tylko większa."
 ROS_put_upadek1:0 "Jesień patriarchy"
 ROS_put_upadek1_desc:0 "Prezydent słabnie, a dwór walczy o sukcesję. Rozkazy z Kremla przestają być wykonywane."
 ROS_put_sukces2:0 "Pax Russica nad Bałtykiem"
 ROS_put_sukces2_desc:0 "Sąsiedzi uczą się żyć z rosyjską siłą. Królewiec jest bezpieczny jak nigdy."
 ROS_put_upadek2:0 "Smuta"
 ROS_put_upadek2_desc:0 "Rosja wchodzi w nowy czas zamętu. Regiony przestają płacić podatki, generałowie budują własne księstwa."
 ROS_zw_triumf_putin_future:0 "Defilada w Królewcu"
 ROS_zw_triumf_putin_future_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
