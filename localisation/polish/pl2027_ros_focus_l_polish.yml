 ROS_zw_triumf_naw_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
