 ROS_zw_pokoj_mie_future:0 "Pokój bez aneksji"
 ROS_zw_pokoj_mie_future_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_mie_future_tree:0 "Drugie imperium rosyjskie"
 ROS_szo_f_start:0 "Rosja pod żelazną ręką"
 ROS_szo_f_start_desc:0 "Wojsko rządzi krajem od lat. Teraz musi zdecydować, czy chce oddać władzę – czy zbudować państwo na zawsze."
 ROS_szo_f1:0 "Dyrektoriat"
 ROS_szo_f1_desc:0 "Rada Najwyższego Dowództwa zmienia nazwę na Dyrektoriat. Zmienia się tylko nazwa."
 ROS_szo_f2:0 "Szkoły kadetów"
 ROS_szo_f2_desc:0 "Każde miasto wojewódzkie ma korpus kadetów. Elita przyszłości nosi mundury od dwunastego roku życia."
 ROS_szo_f3:0 "Zakłady obronne"
 ROS_szo_f3_desc:0 "Przemysł zbrojeniowy jest jedyną gałęzią gospodarki, która rośnie."
 ROS_szo_f4:0 "Porządek na ulicach"
 ROS_szo_f4_desc:0 "Przestępczość spada, wolność także."
 ROS_szo_f5:0 "Ideologia służby"
 ROS_szo_f5_desc:0 "Nowa państwowa doktryna: obywatel istnieje, by służyć ojczyźnie."
 ROS_szo_f6:0 "Pęknięcia w Dyrektoriacie"
 ROS_szo_f6_desc:0 "Generałowie zaczynają walczyć o wpływy. Każdy ma swoją armię."
 ROS_szo_sukces1:0 "Państwo-koszary"
 ROS_szo_sukces1_desc:0 "System działa. Rosja staje się państwem wojskowym na dekady."
 ROS_szo_upadek1:0 "Bunt generałów"
 ROS_szo_upadek1_desc:0 "Dowódcy okręgów odmawiają wykonania rozkazów Dyrektoriatu. Szojgu traci kontrolę nad armią."
 ROS_szo_sukces2:0 "Pokój zbrojny"
 ROS_szo_sukces2_desc:0 "Armia nie musi już walczyć. Wystarczy, że wszyscy wiedzą, że może."
 ROS_szo_upadek2:0 "Wojskowa smuta"
 ROS_szo_upadek2_desc:0 "Kilka armii, kilka rządów, jedna Rosja na mapach – i żadna w rzeczywistości."
