 ROS_zw_obwod_wm_mie:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_mie_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_mie:0 "Pokój bez aneksji"
 ROS_zw_pokoj_mie_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_mie_tree:0 "Prezydent Miedwiediew"
 ROS_szo_najwyzszy:0 "Najwyższy Dowódca"
 ROS_szo_najwyzszy_desc:0 "Siergiej Szojgu nie nosi tytułu prezydenta. Woli „Najwyższego Dowódcę” – bo armia jest teraz państwem, a państwo armią."
 ROS_szo_rada_dowodztwa:0 "Rada Najwyższego Dowództwa"
 ROS_szo_rada_dowodztwa_desc:0 "Zamiast rządu – rada generałów. Ministrowie cywilni zostają ich zastępcami."
 ROS_szo_prawo_wojenne:0 "Prawo wojenne"
 ROS_szo_prawo_wojenne_desc:0 "Sądy wojskowe zajmują się teraz także cywilami. Wyroki zapadają w kilka dni."
 ROS_szo_oczyszczenie:0 "Oczyszczenie administracji"
 ROS_szo_oczyszczenie_desc:0 "Urzędnicy, którzy służyli oligarchom, zostają zastąpieni oficerami rezerwy."
 ROS_szo_kult_zwyciestwa:0 "Kult zwycięstwa"
 ROS_szo_kult_zwyciestwa_desc:0 "Parady co miesiąc. Każda zdobyta wieś na Mazurach to święto w telewizji."
 ROS_szo_armia_panstwem:0 "Armia jako państwo"
 ROS_szo_armia_panstwem_desc:0 "Ministerstwo Obrony przejmuje koleje, energetykę i łączność. Cywilne państwo istnieje już tylko na papierze."
 ROS_szo_totalna_mobilizacja:0 "Totalna mobilizacja obwodu"
 ROS_szo_totalna_mobilizacja_desc:0 "Każdy mężczyzna między osiemnastym a pięćdziesiątym rokiem życia dostaje przydział."
 ROS_szo_sztab_mazury:0 "Sztab na Mazurach"
 ROS_szo_sztab_mazury_desc:0 "Najwyższy Dowódca przenosi wysunięte stanowisko dowodzenia do Węgorzewa."
 ROS_szo_saperzy:0 "Saperzy Floty Bałtyckiej"
 ROS_szo_saperzy_desc:0 "Mosty pontonowe przez kanały mazurskie i przejścia przez bagna – bez nich ofensywa ugrzęźnie."
 ROS_saperzy_tb:0 "Saperzy Floty Bałtyckiej"
 ROS_szo_szturm_generalny:0 "Szturm generalny"
 ROS_szo_szturm_generalny_desc:0 "Wszystkie jednostki naraz, na całej długości frontu. Szojgu chce skończyć tę wojnę jednym uderzeniem."
 ROS_szo_zelazna_dyscyplina:0 "Żelazna dyscyplina"
 ROS_szo_zelazna_dyscyplina_desc:0 "Dezercja karana jest śmiercią. Morale nie rośnie – ale linie się nie załamują."
 ROS_szo_lotnictwo:0 "Lotnictwo frontowe"
 ROS_szo_lotnictwo_desc:0 "Bombowce z Czkałowska latają nad Mazurami codziennie. Obrona przeciwlotnicza obrońców jest za słaba."
 ROS_szo_przemysl:0 "Przemysł pod nadzorem armii"
 ROS_szo_przemysl_desc:0 "Każda fabryka ma swojego komisarza wojskowego. Plan produkcji ustala sztab."
 ROS_szo_kartki:0 "Kartki żywnościowe"
 ROS_szo_kartki_desc:0 "Racjonowanie oszczędza zasoby dla armii. Kolejki wracają, ale nikt nie głoduje."
 ROS_szo_kombinaty:0 "Wojskowe kombinaty"
 ROS_szo_kombinaty_desc:0 "Stocznie i zakłady naprawcze łączą się w jeden państwowy koncern pod zarządem wojska."
 ROS_szo_rekwizycje:0 "Rekwizycje"
 ROS_szo_rekwizycje_desc:0 "Prywatne ciężarówki, koparki i agregaty zostają „wypożyczone” przez armię na czas wojny."
 ROS_szo_eksport:0 "Eksport broni"
 ROS_szo_eksport_desc:0 "Sprzęt, którego armia nie potrzebuje, trafia do Afryki i na Bliski Wschód. Pieniądze wracają do kasy wojska."
 ROS_szo_po_wojnie:0 "Rosja po wojnie"
 ROS_szo_po_wojnie_desc:0 "Wojna na Mazurach dobiegła końca albo przestała być najważniejszą sprawą państwa. Czas zdecydować, jaka Rosja wyłoni się z tych lat."
 ROS_zw_triumf_szo:0 "Defilada w Królewcu"
 ROS_zw_triumf_szo_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
 ROS_zw_obwod_szo:0 "Wsparcie dla Rady Obwodu"
 ROS_zw_obwod_szo_desc:0 "Obwód Warmińsko-Mazurski potrzebuje broni, pieniędzy i urzędników. Moskwa przysyła wszystkiego po trochu – i własnych doradców do każdego wydziału."
 ROS_zw_garnizony_szo:0 "Garnizony nad jeziorami"
 ROS_zw_garnizony_szo_desc:0 "Stałe garnizony w Giżycku, Olsztynie i Ełku. Żołnierze, którzy mieli wrócić do domów, zostają na Mazurach na czas nieokreślony."
 ROS_zw_kolej_szo:0 "Kolej Królewiec–Olsztyn"
 ROS_zw_kolej_szo_desc:0 "Remont linii kolejowej łączącej obwód z Mazurami. Pierwszy pociąg wiezie czołgi, drugi – ziemniaki."
 ROS_zw_polityka_szo:0 "Polityka wobec rozbitej Polski"
 ROS_zw_polityka_szo_desc:0 "Polskie państewka patrzą na Mazury i liczą rosyjskie czołgi. Część z nich chętnie przyjmie ochronę Moskwy – za odpowiednią cenę. "
 ROS_zw_media_szo:0 "Rosyjskie media w regionie"
 ROS_zw_media_szo_desc:0 "Telewizja, portale i „niezależni” blogerzy w państwach przy granicy obwodu zaczynają mówić głosem Moskwy."
 ROS_zw_protektorat_szo:0 "Oferta protektoratu"
 ROS_zw_protektorat_szo_desc:0 "Moskwa proponuje słabszym sąsiadom ochronę, tanie paliwo i rosyjskich doradców. W zamian oczekuje lojalności – pełnej."
 ROS_zw_przemysl_szo:0 "Przemysł zbrojeniowy obwodu"
 ROS_zw_przemysl_szo_desc:0 "Zakłady w Królewcu i Czerniachowsku dostają zamówienia państwowe na lata. Konwoje przez Białoruś przestają być jedynym źródłem amunicji."
 ROS_zw_strefa_szo:0 "Strefa wpływów"
 ROS_zw_strefa_szo_desc:0 "Ambasadorzy, banki i telewizja. Rosyjskie wpływy sięgają tam, gdzie nie dojechały czołgi."
 ROS_zw_bufor_szo:0 "Strefa buforowa"
 ROS_zw_bufor_szo_desc:0 "Pas umocnień od Zalewu Wiślanego po Suwałki. Kto chce odbić Mazury, musi przejść przez beton i pola minowe."
 ROS_zw_final_szo:0 "Rosja nad Wisłą?"
 ROS_zw_final_szo_desc:0 "Mapy w sztabie generalnym kończą się już nie na Łynie, ale na Wiśle. Na razie to tylko mapy."
 ROS_zw_zwiazkowe_szo:0 "Państwo Związkowe w akcji"
 ROS_zw_zwiazkowe_szo_desc:0 "Moskwa przypomina Mińskowi, że Państwo Związkowe to nie tylko wspólne defilady. Białoruś może dołączyć do sojuszu, przysłać sprzęt – albo odmówić."
 ROS_zw_druga_fala_szo:0 "Druga fala"
 ROS_zw_druga_fala_szo_desc:0 "Sztab generalny wyjmuje z sejfu mapy, które kończyły się na Wiśle. Każde państewko przy nowej granicy obwodu jest teraz celem – najpierw najsłabsze."
 ROS_zw_podlasie_szo:0 "Uderzenie z dwóch stron"
 ROS_zw_podlasie_szo_desc:0 "Gdy rosyjskie kolumny idą z Mazur na południe, białoruskie dywizje mogą wejść na Podlasie od wschodu. Polskie państewka nie mają tylu ludzi, by bronić dwóch frontów."
 ROS_zw_wisla_szo:0 "Rosja nad Wisłą"
 ROS_zw_wisla_szo_desc:0 "To, co było tylko mapą w sztabie, staje się granicą. Gubernatorzy z Moskwy obejmują urzędy w miastach, których nazw jeszcze niedawno nie umieli wymówić."
 ROS_kl_lekcja_szo:0 "Gorzka lekcja"
 ROS_kl_lekcja_szo_desc:0 "Kolumny wracają do obwodu z połową stanu. W sztabie nikt nie mówi „klęska” – mówi się „zakończenie operacji”. Ale wszyscy wiedzą."
 ROS_kl_zdobycze_szo:0 "Utrzymać to, co zostało"
 ROS_kl_zdobycze_szo_desc:0 "Rozejm zostawił w rosyjskich rękach przygraniczne gminy, których obrońcy nie zdołali odbić. Trzeba je umocnić, zanim ktoś spróbuje."
 ROS_kl_rozliczenia_szo:0 "Rozliczenia w sztabie"
 ROS_kl_rozliczenia_szo_desc:0 "Dowódcy odpowiedzialni za klęskę tracą stanowiska. Ich następcy mają jedną zaletę: nie było ich na Mazurach."
 ROS_kl_gospodarka_szo:0 "Gospodarka po wojnie"
 ROS_kl_gospodarka_szo_desc:0 "Koniec wydatków na ofensywę oznacza pieniądze na fabryki, drogi i pensje. Przynajmniej w teorii."
 ROS_kl_rozmowy_szo:0 "Rozmowy z Mazurami"
 ROS_kl_rozmowy_szo_desc:0 "Rosyjscy dyplomaci jadą do Olsztyna – tym razem samochodami, nie czołgami. Rozmowy dotyczą jeńców, granicy i handlu."
 ROS_kl_reforma_szo:0 "Reforma armii"
 ROS_kl_reforma_szo_desc:0 "Nowe regulaminy, nowi dowódcy i nowe szkolenia. Armia ma się uczyć na błędach z Mazur, a nie je ukrywać."
 ROS_kl_spokoj_szo:0 "Spokój w obwodzie"
 ROS_kl_spokoj_szo_desc:0 "Matki poległych dostają odszkodowania, a telewizja przestaje mówić o wojnie. Ludzie chcą po prostu żyć."
 ROS_kl_odbudowa_szo:0 "Odbudowa potęgi"
 ROS_kl_odbudowa_szo_desc:0 "Rosja przegrała bitwę o Mazury, ale nie przestała być Rosją. Następnym razem będzie lepiej przygotowana."
 ROS_zw_aneksja_szo:0 "Aneksja Mazur"
 ROS_zw_aneksja_szo_desc:0 "Zdobyte ziemie zostaną włączone do Federacji Rosyjskiej. Państwa mazurskie przestaną istnieć."
 ROS_zw_administracja_szo:0 "Administracja wojskowa"
 ROS_zw_administracja_szo_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_szo:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_szo_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_szo:0 "Pokój bez aneksji"
 ROS_zw_pokoj_szo_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_szo_tree:0 "Najwyższy Dowódca Szojgu"
 ROS_cho_prezydent:0 "Republika inwestorów"
 ROS_cho_prezydent_desc:0 "Michaił Chodorkowski wygrywa wybory dzięki pieniądzom, mediom i zmęczeniu wojną. To wariant fikcyjny: nowa Rosja ma być rządzona jak korporacja – przez tych, którzy potrafią liczyć."
 ROS_cho_rada_oligarchow:0 "Rada Gospodarcza"
 ROS_cho_rada_oligarchow_desc:0 "Najbogatsi ludzie kraju dostają miejsca w radzie przy prezydencie. W zamian finansują państwo."
 ROS_cho_prywatyzacja:0 "Prywatyzacja spółek państwowych"
 ROS_cho_prywatyzacja_desc:0 "Gazprom, Rosnieft i Rostec trafiają na giełdę. Akcje kupują ci, którzy mają pieniądze – czyli ci sami co zawsze."
 ROS_cho_media:0 "Wolne media (prawie)"
 ROS_cho_media_desc:0 "Cenzura zostaje zniesiona. Większość stacji należy jednak do członków Rady."
 ROS_cho_konstytucja:0 "Nowa konstytucja"
 ROS_cho_konstytucja_desc:0 "Silny parlament, słabszy prezydent i gwarancje dla własności prywatnej."
 ROS_cho_republika:0 "Republika właścicieli"
 ROS_cho_republika_desc:0 "Prawo głosu ma każdy, ale wpływ – ten, kto płaci podatki. Rosja wchodzi w nową epokę."
 ROS_cho_wojna_biznes:0 "Wojna jako interes"
 ROS_cho_wojna_biznes_desc:0 "Chodorkowski nie kończy wojny od razu. Liczy, ile kosztuje każdy miesiąc – i ile może przynieść kontrola nad Mazurami."
 ROS_cho_prywatne_armie:0 "Prywatne firmy wojskowe"
 ROS_cho_prywatne_armie_desc:0 "Kontrakty na ochronę i „stabilizację” dostają firmy należące do członków Rady."
 ROS_cho_negocjacje_sila:0 "Negocjacje z pozycji siły"
 ROS_cho_negocjacje_sila_desc:0 "Rosja jest gotowa rozmawiać – ale dopiero wtedy, gdy kontroluje najważniejsze miasta."
 ROS_cho_strefa_zalezna:0 "Mazurska strefa zależna"
 ROS_cho_strefa_zalezna_desc:0 "Zamiast aneksji: zależny rząd w Olsztynie, który podpisze umowy koncesyjne. Taniej niż okupacja."
 ROS_cho_rozejm:0 "Rozejm handlowy"
 ROS_cho_rozejm_desc:0 "Jeżeli wojna przestaje się opłacać, trzeba ją zakończyć. Ziemie, których nie zdobyto, zostaną zwrócone."
 ROS_cho_ochrona_kontraktow:0 "Ochrona kontraktów"
 ROS_cho_ochrona_kontraktow_desc:0 "Zakłady i porty na Mazurach dostają uzbrojoną ochronę. Inwestycja musi być bezpieczna."
 ROS_cho_kapital:0 "Kapitał wraca do Rosji"
 ROS_cho_kapital_desc:0 "Amnestia podatkowa przyciąga miliardy ukryte na Cyprze i w Dubaju."
 ROS_cho_strefa_ekonomiczna:0 "Specjalna strefa ekonomiczna Królewiec"
 ROS_cho_strefa_ekonomiczna_desc:0 "Zerowe cła i niskie podatki. Obwód ma stać się rosyjskim Hongkongiem nad Bałtykiem."
 ROS_cho_port:0 "Port w Piławie"
 ROS_cho_port_desc:0 "Dawna baza wojenna otwiera się dla statków handlowych."
 ROS_cho_gielda:0 "Giełda moskiewska"
 ROS_cho_gielda_desc:0 "Notowania rosną z każdym sygnałem, że wojna się kończy."
 ROS_gielda_tb:0 "Giełda moskiewska"
 ROS_cho_konsorcjum:0 "Konsorcjum bursztynowe"
 ROS_cho_konsorcjum_desc:0 "Kombinat w Palmnikach przechodzi w ręce międzynarodowego konsorcjum. Państwo bierze dywidendę."
 ROS_cho_po_wojnie:0 "Rosja po wojnie"
 ROS_cho_po_wojnie_desc:0 "Wojna na Mazurach dobiegła końca albo przestała być najważniejszą sprawą państwa. Czas zdecydować, jaka Rosja wyłoni się z tych lat."
