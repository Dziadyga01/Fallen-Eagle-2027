 ROS_zw_wisla_szo_future:0 "Rosja nad Wisłą"
 ROS_zw_wisla_szo_future_desc:0 "To, co było tylko mapą w sztabie, staje się granicą. Gubernatorzy z Moskwy obejmują urzędy w miastach, których nazw jeszcze niedawno nie umieli wymówić."
 ROS_kl_lekcja_szo_future:0 "Gorzka lekcja"
 ROS_kl_lekcja_szo_future_desc:0 "Kolumny wracają do obwodu z połową stanu. W sztabie nikt nie mówi „klęska” – mówi się „zakończenie operacji”. Ale wszyscy wiedzą."
 ROS_kl_zdobycze_szo_future:0 "Utrzymać to, co zostało"
 ROS_kl_zdobycze_szo_future_desc:0 "Rozejm zostawił w rosyjskich rękach przygraniczne gminy, których obrońcy nie zdołali odbić. Trzeba je umocnić, zanim ktoś spróbuje."
 ROS_kl_rozliczenia_szo_future:0 "Rozliczenia w sztabie"
 ROS_kl_rozliczenia_szo_future_desc:0 "Dowódcy odpowiedzialni za klęskę tracą stanowiska. Ich następcy mają jedną zaletę: nie było ich na Mazurach."
 ROS_kl_gospodarka_szo_future:0 "Gospodarka po wojnie"
 ROS_kl_gospodarka_szo_future_desc:0 "Koniec wydatków na ofensywę oznacza pieniądze na fabryki, drogi i pensje. Przynajmniej w teorii."
 ROS_kl_rozmowy_szo_future:0 "Rozmowy z Mazurami"
 ROS_kl_rozmowy_szo_future_desc:0 "Rosyjscy dyplomaci jadą do Olsztyna – tym razem samochodami, nie czołgami. Rozmowy dotyczą jeńców, granicy i handlu."
 ROS_kl_reforma_szo_future:0 "Reforma armii"
 ROS_kl_reforma_szo_future_desc:0 "Nowe regulaminy, nowi dowódcy i nowe szkolenia. Armia ma się uczyć na błędach z Mazur, a nie je ukrywać."
 ROS_kl_spokoj_szo_future:0 "Spokój w obwodzie"
 ROS_kl_spokoj_szo_future_desc:0 "Matki poległych dostają odszkodowania, a telewizja przestaje mówić o wojnie. Ludzie chcą po prostu żyć."
 ROS_kl_odbudowa_szo_future:0 "Odbudowa potęgi"
 ROS_kl_odbudowa_szo_future_desc:0 "Rosja przegrała bitwę o Mazury, ale nie przestała być Rosją. Następnym razem będzie lepiej przygotowana."
 ROS_zw_aneksja_szo_future:0 "Aneksja Mazur"
 ROS_zw_aneksja_szo_future_desc:0 "Zdobyte ziemie zostaną włączone do Federacji Rosyjskiej. Państwa mazurskie przestaną istnieć."
 ROS_zw_administracja_szo_future:0 "Administracja wojskowa"
 ROS_zw_administracja_szo_future_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_szo_future:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_szo_future_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_szo_future:0 "Pokój bez aneksji"
 ROS_zw_pokoj_szo_future_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_szo_future_tree:0 "Rosja pod żelazną ręką"
 ROS_cho_f_start:0 "Republika oligarchów"
 ROS_cho_f_start_desc:0 "Rosja Chodorkowskiego to kraj, w którym wszystko ma cenę – nawet demokracja. Wariant fikcyjny."
 ROS_cho_f1:0 "Korporacyjna Duma"
 ROS_cho_f1_desc:0 "Połowa mandatów należy do przedstawicieli izb gospodarczych."
 ROS_cho_f2:0 "Prywatne regiony"
 ROS_cho_f2_desc:0 "Konsorcja przejmują zarządzanie całymi obwodami w zamian za inwestycje."
 ROS_cho_f3:0 "Inwestorzy z Zachodu"
 ROS_cho_f3_desc:0 "Pierwsze zachodnie banki wracają do Moskwy."
 ROS_cho_f4:0 "Ochrona własności"
 ROS_cho_f4_desc:0 "Sądy chronią własność – zwłaszcza dużą."
 ROS_cho_f5:0 "Klasa średnia"
 ROS_cho_f5_desc:0 "Po raz pierwszy od lat ludzie mają za co planować przyszłość."
 ROS_cho_f6:0 "Gniew biednych"
 ROS_cho_f6_desc:0 "Prowincja patrzy na stolicę i widzi, że bogaci się tylko Moskwa."
 ROS_cho_sukces1:0 "Republika Rosyjska"
 ROS_cho_sukces1_desc:0 "Nowa konstytucja, nowa nazwa i nowe pieniądze. Rosja staje się normalnym – choć nierównym – krajem."
 ROS_cho_upadek1:0 "Wymuszone negocjacje"
 ROS_cho_upadek1_desc:0 "Klęska na Mazurach i krach na giełdzie zmuszają Chodorkowskiego do ustępstw wobec wszystkich naraz."
 ROS_cho_sukces2:0 "Rosja S.A."
 ROS_cho_sukces2_desc:0 "Kraj działa jak dobrze zarządzana spółka. Dywidenda trafia do akcjonariuszy."
 ROS_cho_upadek2:0 "Bankructwo państwa"
 ROS_cho_upadek2_desc:0 "Rosja nie spłaca długów. Oligarchowie wyjeżdżają z tym, co zdążyli wywieźć."
 ROS_zw_triumf_cho_future:0 "Defilada w Królewcu"
 ROS_zw_triumf_cho_future_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
 ROS_zw_obwod_cho_future:0 "Wsparcie dla Rady Obwodu"
 ROS_zw_obwod_cho_future_desc:0 "Obwód Warmińsko-Mazurski potrzebuje broni, pieniędzy i urzędników. Moskwa przysyła wszystkiego po trochu – i własnych doradców do każdego wydziału."
 ROS_zw_garnizony_cho_future:0 "Garnizony nad jeziorami"
 ROS_zw_garnizony_cho_future_desc:0 "Stałe garnizony w Giżycku, Olsztynie i Ełku. Żołnierze, którzy mieli wrócić do domów, zostają na Mazurach na czas nieokreślony."
 ROS_zw_kolej_cho_future:0 "Kolej Królewiec–Olsztyn"
 ROS_zw_kolej_cho_future_desc:0 "Remont linii kolejowej łączącej obwód z Mazurami. Pierwszy pociąg wiezie czołgi, drugi – ziemniaki."
 ROS_zw_polityka_cho_future:0 "Polityka wobec rozbitej Polski"
 ROS_zw_polityka_cho_future_desc:0 "Polskie państewka patrzą na Mazury i liczą rosyjskie czołgi. Część z nich chętnie przyjmie ochronę Moskwy – za odpowiednią cenę. "
 ROS_zw_media_cho_future:0 "Rosyjskie media w regionie"
 ROS_zw_media_cho_future_desc:0 "Telewizja, portale i „niezależni” blogerzy w państwach przy granicy obwodu zaczynają mówić głosem Moskwy."
 ROS_zw_protektorat_cho_future:0 "Oferta protektoratu"
 ROS_zw_protektorat_cho_future_desc:0 "Moskwa proponuje słabszym sąsiadom ochronę, tanie paliwo i rosyjskich doradców. W zamian oczekuje lojalności – pełnej."
 ROS_zw_przemysl_cho_future:0 "Przemysł zbrojeniowy obwodu"
 ROS_zw_przemysl_cho_future_desc:0 "Zakłady w Królewcu i Czerniachowsku dostają zamówienia państwowe na lata. Konwoje przez Białoruś przestają być jedynym źródłem amunicji."
 ROS_zw_strefa_cho_future:0 "Strefa wpływów"
 ROS_zw_strefa_cho_future_desc:0 "Ambasadorzy, banki i telewizja. Rosyjskie wpływy sięgają tam, gdzie nie dojechały czołgi."
 ROS_zw_bufor_cho_future:0 "Strefa buforowa"
 ROS_zw_bufor_cho_future_desc:0 "Pas umocnień od Zalewu Wiślanego po Suwałki. Kto chce odbić Mazury, musi przejść przez beton i pola minowe."
 ROS_zw_final_cho_future:0 "Rosja nad Wisłą?"
 ROS_zw_final_cho_future_desc:0 "Mapy w sztabie generalnym kończą się już nie na Łynie, ale na Wiśle. Na razie to tylko mapy."
 ROS_zw_zwiazkowe_cho_future:0 "Państwo Związkowe w akcji"
 ROS_zw_zwiazkowe_cho_future_desc:0 "Moskwa przypomina Mińskowi, że Państwo Związkowe to nie tylko wspólne defilady. Białoruś może dołączyć do sojuszu, przysłać sprzęt – albo odmówić."
 ROS_zw_druga_fala_cho_future:0 "Druga fala"
 ROS_zw_druga_fala_cho_future_desc:0 "Sztab generalny wyjmuje z sejfu mapy, które kończyły się na Wiśle. Każde państewko przy nowej granicy obwodu jest teraz celem – najpierw najsłabsze."
 ROS_zw_podlasie_cho_future:0 "Uderzenie z dwóch stron"
 ROS_zw_podlasie_cho_future_desc:0 "Gdy rosyjskie kolumny idą z Mazur na południe, białoruskie dywizje mogą wejść na Podlasie od wschodu. Polskie państewka nie mają tylu ludzi, by bronić dwóch frontów."
