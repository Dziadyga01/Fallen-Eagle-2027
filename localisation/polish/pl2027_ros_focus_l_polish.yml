 ROS_szl_future_tree:0 "Federacja wolnych republik"
 ROS_naw_f_start:0 "Nowa demokratyczna Rosja"
 ROS_naw_f_start_desc:0 "Julia Nawalna wie, że wolne wybory to dopiero początek. Prawdziwa demokracja wymaga instytucji, których Rosja nigdy nie miała."
 ROS_naw_f1:0 "Niezależne sądy"
 ROS_naw_f1_desc:0 "Sędziowie wybierani przez samorząd sędziowski, nie przez Kreml."
 ROS_naw_f2:0 "Policja dla obywateli"
 ROS_naw_f2_desc:0 "Reforma policji wzorowana na Gruzji z czasów Saakaszwilego."
 ROS_naw_f3:0 "Społeczeństwo obywatelskie"
 ROS_naw_f3_desc:0 "Organizacje pozarządowe, które jeszcze niedawno były „agentami zagranicznymi”, dostają dotacje."
 ROS_naw_f4:0 "Pojednanie z sąsiadami"
 ROS_naw_f4_desc:0 "Rosja podpisuje traktaty o przyjaźni z Litwą, Polską i państwami Mazur."
 ROS_naw_f5:0 "Gospodarka bez korupcji"
 ROS_naw_f5_desc:0 "Przetargi publiczne są jawne. Ceny budowy dróg spadają o połowę."
 ROS_naw_f6:0 "Nostalgia za porządkiem"
 ROS_naw_f6_desc:0 "Nie każdy jest zadowolony. Starsi ludzie wspominają czasy, gdy „był porządek”."
 ROS_naw_sukces1:0 "Rosja Przyszłości"
 ROS_naw_sukces1_desc:0 "Rosja zmienia się naprawdę. Kraj, o którym marzyło pokolenie protestujących, przestaje być snem."
 ROS_naw_upadek1:0 "Kontrrewolucja"
 ROS_naw_upadek1_desc:0 "Ludzie starego systemu nie zniknęli. Po klęsce i kryzysie przechodzą do ofensywy."
 ROS_naw_sukces2:0 "Demokracja, która przetrwała"
 ROS_naw_sukces2_desc:0 "Pierwsze pokojowe przekazanie władzy w historii kraju."
 ROS_naw_upadek2:0 "Stracona szansa"
 ROS_naw_upadek2_desc:0 "Reformy grzęzną. Rosja znów czeka na kogoś, kto „zaprowadzi porządek”."
 ROS_zw_triumf_naw_future:0 "Defilada w Królewcu"
 ROS_zw_triumf_naw_future_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
 ROS_zw_obwod_naw_future:0 "Wsparcie dla Rady Obwodu"
 ROS_zw_obwod_naw_future_desc:0 "Obwód Warmińsko-Mazurski potrzebuje broni, pieniędzy i urzędników. Moskwa przysyła wszystkiego po trochu – i własnych doradców do każdego wydziału."
 ROS_zw_garnizony_naw_future:0 "Garnizony nad jeziorami"
 ROS_zw_garnizony_naw_future_desc:0 "Stałe garnizony w Giżycku, Olsztynie i Ełku. Żołnierze, którzy mieli wrócić do domów, zostają na Mazurach na czas nieokreślony."
 ROS_zw_kolej_naw_future:0 "Kolej Królewiec–Olsztyn"
 ROS_zw_kolej_naw_future_desc:0 "Remont linii kolejowej łączącej obwód z Mazurami. Pierwszy pociąg wiezie czołgi, drugi – ziemniaki."
 ROS_zw_polityka_naw_future:0 "Polityka wobec rozbitej Polski"
 ROS_zw_polityka_naw_future_desc:0 "Polskie państewka patrzą na Mazury i liczą rosyjskie czołgi. Część z nich chętnie przyjmie ochronę Moskwy – za odpowiednią cenę. "
 ROS_zw_media_naw_future:0 "Rosyjskie media w regionie"
 ROS_zw_media_naw_future_desc:0 "Telewizja, portale i „niezależni” blogerzy w państwach przy granicy obwodu zaczynają mówić głosem Moskwy."
 ROS_zw_protektorat_naw_future:0 "Oferta protektoratu"
 ROS_zw_protektorat_naw_future_desc:0 "Moskwa proponuje słabszym sąsiadom ochronę, tanie paliwo i rosyjskich doradców. W zamian oczekuje lojalności – pełnej."
 ROS_zw_przemysl_naw_future:0 "Przemysł zbrojeniowy obwodu"
 ROS_zw_przemysl_naw_future_desc:0 "Zakłady w Królewcu i Czerniachowsku dostają zamówienia państwowe na lata. Konwoje przez Białoruś przestają być jedynym źródłem amunicji."
 ROS_zw_strefa_naw_future:0 "Strefa wpływów"
 ROS_zw_strefa_naw_future_desc:0 "Ambasadorzy, banki i telewizja. Rosyjskie wpływy sięgają tam, gdzie nie dojechały czołgi."
 ROS_zw_bufor_naw_future:0 "Strefa buforowa"
 ROS_zw_bufor_naw_future_desc:0 "Pas umocnień od Zalewu Wiślanego po Suwałki. Kto chce odbić Mazury, musi przejść przez beton i pola minowe."
 ROS_zw_final_naw_future:0 "Rosja nad Wisłą?"
 ROS_zw_final_naw_future_desc:0 "Mapy w sztabie generalnym kończą się już nie na Łynie, ale na Wiśle. Na razie to tylko mapy."
 ROS_zw_zwiazkowe_naw_future:0 "Państwo Związkowe w akcji"
 ROS_zw_zwiazkowe_naw_future_desc:0 "Moskwa przypomina Mińskowi, że Państwo Związkowe to nie tylko wspólne defilady. Białoruś może dołączyć do sojuszu, przysłać sprzęt – albo odmówić."
 ROS_zw_druga_fala_naw_future:0 "Druga fala"
 ROS_zw_druga_fala_naw_future_desc:0 "Sztab generalny wyjmuje z sejfu mapy, które kończyły się na Wiśle. Każde państewko przy nowej granicy obwodu jest teraz celem – najpierw najsłabsze."
 ROS_zw_podlasie_naw_future:0 "Uderzenie z dwóch stron"
 ROS_zw_podlasie_naw_future_desc:0 "Gdy rosyjskie kolumny idą z Mazur na południe, białoruskie dywizje mogą wejść na Podlasie od wschodu. Polskie państewka nie mają tylu ludzi, by bronić dwóch frontów."
 ROS_zw_wisla_naw_future:0 "Rosja nad Wisłą"
 ROS_zw_wisla_naw_future_desc:0 "To, co było tylko mapą w sztabie, staje się granicą. Gubernatorzy z Moskwy obejmują urzędy w miastach, których nazw jeszcze niedawno nie umieli wymówić."
 ROS_kl_lekcja_naw_future:0 "Gorzka lekcja"
 ROS_kl_lekcja_naw_future_desc:0 "Kolumny wracają do obwodu z połową stanu. W sztabie nikt nie mówi „klęska” – mówi się „zakończenie operacji”. Ale wszyscy wiedzą."
 ROS_kl_zdobycze_naw_future:0 "Utrzymać to, co zostało"
 ROS_kl_zdobycze_naw_future_desc:0 "Rozejm zostawił w rosyjskich rękach przygraniczne gminy, których obrońcy nie zdołali odbić. Trzeba je umocnić, zanim ktoś spróbuje."
 ROS_kl_rozliczenia_naw_future:0 "Rozliczenia w sztabie"
 ROS_kl_rozliczenia_naw_future_desc:0 "Dowódcy odpowiedzialni za klęskę tracą stanowiska. Ich następcy mają jedną zaletę: nie było ich na Mazurach."
 ROS_kl_gospodarka_naw_future:0 "Gospodarka po wojnie"
 ROS_kl_gospodarka_naw_future_desc:0 "Koniec wydatków na ofensywę oznacza pieniądze na fabryki, drogi i pensje. Przynajmniej w teorii."
 ROS_kl_rozmowy_naw_future:0 "Rozmowy z Mazurami"
 ROS_kl_rozmowy_naw_future_desc:0 "Rosyjscy dyplomaci jadą do Olsztyna – tym razem samochodami, nie czołgami. Rozmowy dotyczą jeńców, granicy i handlu."
 ROS_kl_reforma_naw_future:0 "Reforma armii"
 ROS_kl_reforma_naw_future_desc:0 "Nowe regulaminy, nowi dowódcy i nowe szkolenia. Armia ma się uczyć na błędach z Mazur, a nie je ukrywać."
 ROS_kl_spokoj_naw_future:0 "Spokój w obwodzie"
 ROS_kl_spokoj_naw_future_desc:0 "Matki poległych dostają odszkodowania, a telewizja przestaje mówić o wojnie. Ludzie chcą po prostu żyć."
 ROS_kl_odbudowa_naw_future:0 "Odbudowa potęgi"
 ROS_kl_odbudowa_naw_future_desc:0 "Rosja przegrała bitwę o Mazury, ale nie przestała być Rosją. Następnym razem będzie lepiej przygotowana."
 ROS_zw_aneksja_naw_future:0 "Aneksja Mazur"
 ROS_zw_aneksja_naw_future_desc:0 "Zdobyte ziemie zostaną włączone do Federacji Rosyjskiej. Państwa mazurskie przestaną istnieć."
 ROS_zw_administracja_naw_future:0 "Administracja wojskowa"
 ROS_zw_administracja_naw_future_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_naw_future:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_naw_future_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_naw_future:0 "Pokój bez aneksji"
 ROS_zw_pokoj_naw_future_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_naw_future_tree:0 "Nowa demokratyczna Rosja"
