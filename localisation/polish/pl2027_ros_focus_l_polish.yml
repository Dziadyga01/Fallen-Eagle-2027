 ROS_kl_odbudowa_wybory_desc:0 "Rosja przegrała bitwę o Mazury, ale nie przestała być Rosją. Następnym razem będzie lepiej przygotowana."
 ROS_zw_aneksja_wybory:0 "Aneksja Mazur"
 ROS_zw_aneksja_wybory_desc:0 "Zdobyte ziemie zostaną włączone do Federacji Rosyjskiej. Państwa mazurskie przestaną istnieć."
 ROS_zw_administracja_wybory:0 "Administracja wojskowa"
 ROS_zw_administracja_wybory_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_wybory:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_wybory_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_wybory:0 "Pokój bez aneksji"
 ROS_zw_pokoj_wybory_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_wybory_tree:0 "Wybory i walka o Kreml"
 ROS_car_przetrwal:0 "Prezydent przetrwał"
 ROS_car_przetrwal_desc:0 "§Y«Последний царь Кремля»§!\n\nPlotki o chorobie prezydenta okazały się przedwczesne. Władimir Putin pojawia się w telewizji, odbiera meldunki z Mazur i zapowiada, że wojna zostanie doprowadzona do końca."
 ROS_car_kult:0 "Kult przywódcy"
 ROS_car_kult_desc:0 "Portrety prezydenta w każdej szkole i każdym urzędzie. Kto przeżył plotki o własnej śmierci, ten – według telewizji – jest niezniszczalny."
 ROS_car_czystka:0 "Czystka wśród zdrajców"
 ROS_car_czystka_desc:0 "Ci, którzy w tygodniach niepewności zbyt głośno rozmawiali o następcy, tracą stanowiska, majątki i paszporty."
 ROS_car_wieczny:0 "Wieczny prezydent"
 ROS_car_wieczny_desc:0 "Poprawki do konstytucji znoszą ostatnie ograniczenia kadencji. Wybory pozostają formalnością."
 ROS_car_nastepca:0 "Następca w cieniu"
 ROS_car_nastepca_desc:0 "Kreml po cichu przygotowuje człowieka, który kiedyś przejmie władzę. Na razie nikt nie zna jego nazwiska."
 ROS_car_russkij_mir:0 "Ruski mir nad Bałtykiem"
 ROS_car_russkij_mir_desc:0 "Ideologia „rosyjskiego świata” dostaje nowe uzasadnienie: Mazury, Prusy i Królewiec mają być jego zachodnią granicą."
 ROS_car_mazury_rosyjskie:0 "Mazury będą rosyjskie"
 ROS_car_mazury_rosyjskie_desc:0 "Prezydent zapowiada, że zdobyte ziemie zostaną włączone do Federacji. Odwrotu nie będzie."
 ROS_car_wszystkie_sily:0 "Wszystkie siły na północ"
 ROS_car_wszystkie_sily_desc:0 "Część jednostek zostaje ściągnięta z frontu ukraińskiego. Moskwa ryzykuje, by wygrać tutaj."
 ROS_car_ani_kroku:0 "Ani kroku w tył"
 ROS_car_ani_kroku_desc:0 "Rozkaz numer jeden: żadnego odwrotu bez zgody Moskwy. Oddziały zaporowe stoją za liniami."
 ROS_car_brama:0 "Królewiec – brama imperium"
 ROS_car_brama_desc:0 "Obwód staje się jedną wielką twierdzą. Bunkry, zapory przeciwpancerne i baterie obrony wybrzeża."
 ROS_car_pruska_linia:0 "Pruska linia natarcia"
 ROS_car_pruska_linia_desc:0 "Stare pruskie drogi i linie kolejowe znów służą armii, która idzie na południe."
 ROS_car_mobilizacja_gosp:0 "Gospodarka mobilizacyjna"
 ROS_car_mobilizacja_gosp_desc:0 "Fabryki w obwodzie pracują na trzy zmiany. Zyski? Nieważne, liczą się pociski."
 ROS_car_minsk:0 "Sojusz z Mińskiem"
 ROS_car_minsk_desc:0 "Państwo Związkowe przestaje być fikcją: białoruskie koleje wożą amunicję, a białoruskie fabryki naprawiają rosyjskie pojazdy."
 ROS_car_baltyk:0 "Ropa przez Bałtyk"
 ROS_car_baltyk_desc:0 "Flota cieni przewozi ropę z Ust-Ługi do Azji. Część zysków zostaje w obwodzie."
 ROS_car_kontrakty:0 "Kontrakty zbrojeniowe"
 ROS_car_kontrakty_desc:0 "Rostec otwiera w Królewcu filię. Wojsko dostaje sprzęt szybciej niż kiedykolwiek od początku wojny."
 ROS_kontrakty_tb:0 "Kontrakty zbrojeniowe"
 ROS_car_przemysl:0 "Zakłady w Czerniachowsku"
 ROS_car_przemysl_desc:0 "Nowa hala montażowa transporterów to symbol: obwód ma się utrzymać sam, nawet jeśli Moskwa przestanie pomagać."
 ROS_car_po_wojnie:0 "Rosja po wojnie"
 ROS_car_po_wojnie_desc:0 "Wojna na Mazurach dobiegła końca albo przestała być najważniejszą sprawą państwa. Czas zdecydować, jaka Rosja wyłoni się z tych lat."
 ROS_zw_triumf_car:0 "Defilada w Królewcu"
 ROS_zw_triumf_car_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
 ROS_zw_obwod_car:0 "Wsparcie dla Rady Obwodu"
 ROS_zw_obwod_car_desc:0 "Obwód Warmińsko-Mazurski potrzebuje broni, pieniędzy i urzędników. Moskwa przysyła wszystkiego po trochu – i własnych doradców do każdego wydziału."
 ROS_zw_garnizony_car:0 "Garnizony nad jeziorami"
 ROS_zw_garnizony_car_desc:0 "Stałe garnizony w Giżycku, Olsztynie i Ełku. Żołnierze, którzy mieli wrócić do domów, zostają na Mazurach na czas nieokreślony."
 ROS_zw_kolej_car:0 "Kolej Królewiec–Olsztyn"
 ROS_zw_kolej_car_desc:0 "Remont linii kolejowej łączącej obwód z Mazurami. Pierwszy pociąg wiezie czołgi, drugi – ziemniaki."
 ROS_zw_polityka_car:0 "Polityka wobec rozbitej Polski"
 ROS_zw_polityka_car_desc:0 "Polskie państewka patrzą na Mazury i liczą rosyjskie czołgi. Część z nich chętnie przyjmie ochronę Moskwy – za odpowiednią cenę. "
 ROS_zw_media_car:0 "Rosyjskie media w regionie"
 ROS_zw_media_car_desc:0 "Telewizja, portale i „niezależni” blogerzy w państwach przy granicy obwodu zaczynają mówić głosem Moskwy."
 ROS_zw_protektorat_car:0 "Oferta protektoratu"
 ROS_zw_protektorat_car_desc:0 "Moskwa proponuje słabszym sąsiadom ochronę, tanie paliwo i rosyjskich doradców. W zamian oczekuje lojalności – pełnej."
 ROS_zw_przemysl_car:0 "Przemysł zbrojeniowy obwodu"
 ROS_zw_przemysl_car_desc:0 "Zakłady w Królewcu i Czerniachowsku dostają zamówienia państwowe na lata. Konwoje przez Białoruś przestają być jedynym źródłem amunicji."
 ROS_zw_strefa_car:0 "Strefa wpływów"
 ROS_zw_strefa_car_desc:0 "Ambasadorzy, banki i telewizja. Rosyjskie wpływy sięgają tam, gdzie nie dojechały czołgi."
 ROS_zw_bufor_car:0 "Strefa buforowa"
 ROS_zw_bufor_car_desc:0 "Pas umocnień od Zalewu Wiślanego po Suwałki. Kto chce odbić Mazury, musi przejść przez beton i pola minowe."
 ROS_zw_final_car:0 "Rosja nad Wisłą?"
 ROS_zw_final_car_desc:0 "Mapy w sztabie generalnym kończą się już nie na Łynie, ale na Wiśle. Na razie to tylko mapy."
 ROS_zw_zwiazkowe_car:0 "Państwo Związkowe w akcji"
 ROS_zw_zwiazkowe_car_desc:0 "Moskwa przypomina Mińskowi, że Państwo Związkowe to nie tylko wspólne defilady. Białoruś może dołączyć do sojuszu, przysłać sprzęt – albo odmówić."
 ROS_zw_druga_fala_car:0 "Druga fala"
 ROS_zw_druga_fala_car_desc:0 "Sztab generalny wyjmuje z sejfu mapy, które kończyły się na Wiśle. Każde państewko przy nowej granicy obwodu jest teraz celem – najpierw najsłabsze."
 ROS_zw_podlasie_car:0 "Uderzenie z dwóch stron"
 ROS_zw_podlasie_car_desc:0 "Gdy rosyjskie kolumny idą z Mazur na południe, białoruskie dywizje mogą wejść na Podlasie od wschodu. Polskie państewka nie mają tylu ludzi, by bronić dwóch frontów."
 ROS_zw_wisla_car:0 "Rosja nad Wisłą"
 ROS_zw_wisla_car_desc:0 "To, co było tylko mapą w sztabie, staje się granicą. Gubernatorzy z Moskwy obejmują urzędy w miastach, których nazw jeszcze niedawno nie umieli wymówić."
 ROS_kl_lekcja_car:0 "Gorzka lekcja"
 ROS_kl_lekcja_car_desc:0 "Kolumny wracają do obwodu z połową stanu. W sztabie nikt nie mówi „klęska” – mówi się „zakończenie operacji”. Ale wszyscy wiedzą."
 ROS_kl_zdobycze_car:0 "Utrzymać to, co zostało"
 ROS_kl_zdobycze_car_desc:0 "Rozejm zostawił w rosyjskich rękach przygraniczne gminy, których obrońcy nie zdołali odbić. Trzeba je umocnić, zanim ktoś spróbuje."
 ROS_kl_rozliczenia_car:0 "Rozliczenia w sztabie"
 ROS_kl_rozliczenia_car_desc:0 "Dowódcy odpowiedzialni za klęskę tracą stanowiska. Ich następcy mają jedną zaletę: nie było ich na Mazurach."
 ROS_kl_gospodarka_car:0 "Gospodarka po wojnie"
 ROS_kl_gospodarka_car_desc:0 "Koniec wydatków na ofensywę oznacza pieniądze na fabryki, drogi i pensje. Przynajmniej w teorii."
 ROS_kl_rozmowy_car:0 "Rozmowy z Mazurami"
 ROS_kl_rozmowy_car_desc:0 "Rosyjscy dyplomaci jadą do Olsztyna – tym razem samochodami, nie czołgami. Rozmowy dotyczą jeńców, granicy i handlu."
 ROS_kl_reforma_car:0 "Reforma armii"
 ROS_kl_reforma_car_desc:0 "Nowe regulaminy, nowi dowódcy i nowe szkolenia. Armia ma się uczyć na błędach z Mazur, a nie je ukrywać."
 ROS_kl_spokoj_car:0 "Spokój w obwodzie"
 ROS_kl_spokoj_car_desc:0 "Matki poległych dostają odszkodowania, a telewizja przestaje mówić o wojnie. Ludzie chcą po prostu żyć."
 ROS_kl_odbudowa_car:0 "Odbudowa potęgi"
 ROS_kl_odbudowa_car_desc:0 "Rosja przegrała bitwę o Mazury, ale nie przestała być Rosją. Następnym razem będzie lepiej przygotowana."
 ROS_zw_aneksja_car:0 "Aneksja Mazur"
 ROS_zw_aneksja_car_desc:0 "Zdobyte ziemie zostaną włączone do Federacji Rosyjskiej. Państwa mazurskie przestaną istnieć."
 ROS_zw_administracja_car:0 "Administracja wojskowa"
 ROS_zw_administracja_car_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_car:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_car_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_car:0 "Pokój bez aneksji"
 ROS_zw_pokoj_car_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_car_tree:0 "Ostatni car Kremla"
 ROS_mie_prezydent:0 "Prezydent Miedwiediew"
 ROS_mie_prezydent_desc:0 "Dmitrij Miedwiediew składa przysięgę na konstytucję, którą wiele razy zmieniano. Obiecuje kontynuację – i to, że Rosja nie wyjdzie z Mazur z pustymi rękami."
 ROS_mie_dziedzictwo:0 "Dziedzictwo Władimira Putina"
 ROS_mie_dziedzictwo_desc:0 "Nowy prezydent przemawia przy grobie poprzednika. Każde zdanie ma przypominać, że to on jest prawowitym spadkobiercą."
 ROS_mie_nowa_elita:0 "Nowa elita Kremla"
 ROS_mie_nowa_elita_desc:0 "Ludzie z Petersburga ustępują miejsca nowym twarzom – lojalnym wobec Miedwiediewa, a nie wobec pamięci Putina."
 ROS_mie_emigracja:0 "Rozprawa z emigracją"
 ROS_mie_emigracja_desc:0 "Opozycjoniści za granicą dostają zaoczne wyroki. Ich zwolennicy w kraju – wezwania na przesłuchania."
 ROS_mie_jedna_rosja:0 "Jedna Rosja ponad wszystko"
 ROS_mie_jedna_rosja_desc:0 "Partia władzy znów jest jedyną partią, która się liczy."
 ROS_mie_konstytucja:0 "Poprawki konstytucyjne"
 ROS_mie_konstytucja_desc:0 "Kadencja prezydenta zostaje wydłużona „na czas zagrożenia”. Duma głosuje jednogłośnie."
 ROS_mie_nie_ustapi:0 "Rosja nie ustąpi"
 ROS_mie_nie_ustapi_desc:0 "W pierwszym orędziu Miedwiediew mówi wprost: żadnych negocjacji, dopóki Mazury nie będą bezpieczne."
 ROS_mie_mazury_nasze:0 "Mazury będą nasze"
 ROS_mie_mazury_nasze_desc:0 "Na mapach w Moskwie Mazury są już zaznaczone jako „nowe terytoria”. Pozostaje je zdobyć."
 ROS_mie_ogien:0 "Ogień zaporowy"
 ROS_mie_ogien_desc:0 "Tysiące pocisków dziennie. Jeśli obrońcy nie mogą wyjść z okopów, nie mogą też się bronić."
 ROS_ogien_tb:0 "Ogień zaporowy"
 ROS_mie_zwyciestwo:0 "Zwycięstwo za wszelką cenę"
 ROS_mie_zwyciestwo_desc:0 "Straty przestają mieć znaczenie. Liczy się tylko flaga nad ratuszem w Olsztynie."
 ROS_mie_dywizje:0 "Dywizje z głębi kraju"
 ROS_mie_dywizje_desc:0 "Pociągi z Pskowa przez Białoruś wiozą nowe jednostki na północny front."
 ROS_mie_panstwo_zwiazkowe:0 "Państwo Związkowe"
 ROS_mie_panstwo_zwiazkowe_desc:0 "Mińsk dostaje tani gaz i zapewnienie, że Moskwa go nie porzuci. Moskwa dostaje drogi, lotniska i magazyny."
 ROS_mie_gospodarka:0 "Gospodarka wojenna"
 ROS_mie_gospodarka_desc:0 "Budżet państwa podporządkowany jest jednemu celowi. Inwestycje cywilne mogą poczekać."
 ROS_mie_import:0 "Import przez Chiny"
 ROS_mie_import_desc:0 "Chińskie ciężarówki, elektronika i maszyny docierają do obwodu morzem. Ceny w sklepach przestają rosnąć tak szybko."
 ROS_mie_twierdza:0 "Obwód jako twierdza"
 ROS_mie_twierdza_desc:0 "Wybrzeże obwodu otrzymuje nowe baterie i schrony. Nikt nie odetnie Królewca od morza."
 ROS_mie_telewizja:0 "Telewizja państwowa"
 ROS_mie_telewizja_desc:0 "Wieczorne programy publicystyczne trwają po cztery godziny. Każdy, kto ogląda, wie, kto jest wrogiem."
 ROS_mie_kontraktowcy:0 "Kontraktowcy"
 ROS_mie_kontraktowcy_desc:0 "Wysokie żołdy przyciągają ochotników z biednych regionów. Mobilizacja nie jest potrzebna, jeśli jest pieniądz."
 ROS_mie_po_wojnie:0 "Rosja po wojnie"
 ROS_mie_po_wojnie_desc:0 "Wojna na Mazurach dobiegła końca albo przestała być najważniejszą sprawą państwa. Czas zdecydować, jaka Rosja wyłoni się z tych lat."
