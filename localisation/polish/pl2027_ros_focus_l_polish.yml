 ROS_zw_pokoj_poklonska_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_poklonska_tree:0 "Rząd tymczasowy Pokłonskiej"
 ROS_szo_zarzad:0 "Tymczasowe rządy wojskowych"
 ROS_szo_zarzad_desc:0 "Siergiej Szojgu ogłasza powołanie Tymczasowego Komitetu Rady Bezpieczeństwa. To nie zamach stanu – zapewnia – tylko „zarząd kryzysowy do czasu wyborów”."
 ROS_szo_kontrola_armii:0 "Kontrola nad armią"
 ROS_szo_kontrola_armii_desc:0 "Dowódcy okręgów składają meldunki bezpośrednio Komitetowi. Kto się waha, traci stanowisko."
 ROS_szo_stan_wyjatkowy:0 "Stan wyjątkowy"
 ROS_szo_stan_wyjatkowy_desc:0 "Godzina policyjna w dużych miastach, zakaz zgromadzeń i kontrola przy wyjazdach za granicę."
 ROS_szo_ofensywa:0 "Utrzymanie ofensywy"
 ROS_szo_ofensywa_desc:0 "Wojska na Mazurach dostają nowy rozkaz: żadnego odwrotu, dopóki w Moskwie trwa kryzys."
 ROS_szo_rosgwardia:0 "Czystka w Rosgwardii"
 ROS_szo_rosgwardia_desc:0 "Gwardia Narodowa przechodzi pod rozkazy wojska. Jej dotychczasowi dowódcy zostają „przeniesieni do rezerwy”."
 ROS_szo_media:0 "Media pod kontrolą wojska"
 ROS_szo_media_desc:0 "Wieczorne wiadomości otwiera teraz rzecznik Ministerstwa Obrony. O polityce mówi się mało, o zwycięstwach dużo."
 ROS_szo_mobilizacja:0 "Częściowa mobilizacja"
 ROS_szo_mobilizacja_desc:0 "Komitet ogłasza drugą falę mobilizacji. Tym razem nikt nie pyta Dumy o zgodę."
 ROS_szo_kontrolowane_wybory:0 "Kontrolowane wybory"
 ROS_szo_kontrolowane_wybory_desc:0 "Wybory się odbędą – ale komisje liczące głosy podlegają Komitetowi, a kandydaci muszą przejść „weryfikację bezpieczeństwa”."
 ROS_szo_zamach:0 "Zamach stanu"
 ROS_szo_zamach_desc:0 "Po co wybory, skoro wojsko i tak rządzi? Szojgu ogłasza się Najwyższym Dowódcą, a Duma zostaje rozwiązana."
 ROS_zw_triumf_szojgu:0 "Defilada w Królewcu"
 ROS_zw_triumf_szojgu_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
 ROS_zw_obwod_szojgu:0 "Wsparcie dla Rady Obwodu"
 ROS_zw_obwod_szojgu_desc:0 "Obwód Warmińsko-Mazurski potrzebuje broni, pieniędzy i urzędników. Moskwa przysyła wszystkiego po trochu – i własnych doradców do każdego wydziału."
 ROS_zw_garnizony_szojgu:0 "Garnizony nad jeziorami"
 ROS_zw_garnizony_szojgu_desc:0 "Stałe garnizony w Giżycku, Olsztynie i Ełku. Żołnierze, którzy mieli wrócić do domów, zostają na Mazurach na czas nieokreślony."
 ROS_zw_kolej_szojgu:0 "Kolej Królewiec–Olsztyn"
 ROS_zw_kolej_szojgu_desc:0 "Remont linii kolejowej łączącej obwód z Mazurami. Pierwszy pociąg wiezie czołgi, drugi – ziemniaki."
 ROS_zw_polityka_szojgu:0 "Polityka wobec rozbitej Polski"
 ROS_zw_polityka_szojgu_desc:0 "Polskie państewka patrzą na Mazury i liczą rosyjskie czołgi. Część z nich chętnie przyjmie ochronę Moskwy – za odpowiednią cenę. "
 ROS_zw_media_szojgu:0 "Rosyjskie media w regionie"
 ROS_zw_media_szojgu_desc:0 "Telewizja, portale i „niezależni” blogerzy w państwach przy granicy obwodu zaczynają mówić głosem Moskwy."
 ROS_zw_protektorat_szojgu:0 "Oferta protektoratu"
 ROS_zw_protektorat_szojgu_desc:0 "Moskwa proponuje słabszym sąsiadom ochronę, tanie paliwo i rosyjskich doradców. W zamian oczekuje lojalności – pełnej."
 ROS_zw_przemysl_szojgu:0 "Przemysł zbrojeniowy obwodu"
 ROS_zw_przemysl_szojgu_desc:0 "Zakłady w Królewcu i Czerniachowsku dostają zamówienia państwowe na lata. Konwoje przez Białoruś przestają być jedynym źródłem amunicji."
 ROS_zw_strefa_szojgu:0 "Strefa wpływów"
 ROS_zw_strefa_szojgu_desc:0 "Ambasadorzy, banki i telewizja. Rosyjskie wpływy sięgają tam, gdzie nie dojechały czołgi."
 ROS_zw_bufor_szojgu:0 "Strefa buforowa"
 ROS_zw_bufor_szojgu_desc:0 "Pas umocnień od Zalewu Wiślanego po Suwałki. Kto chce odbić Mazury, musi przejść przez beton i pola minowe."
 ROS_zw_final_szojgu:0 "Rosja nad Wisłą?"
 ROS_zw_final_szojgu_desc:0 "Mapy w sztabie generalnym kończą się już nie na Łynie, ale na Wiśle. Na razie to tylko mapy."
 ROS_zw_zwiazkowe_szojgu:0 "Państwo Związkowe w akcji"
 ROS_zw_zwiazkowe_szojgu_desc:0 "Moskwa przypomina Mińskowi, że Państwo Związkowe to nie tylko wspólne defilady. Białoruś może dołączyć do sojuszu, przysłać sprzęt – albo odmówić."
 ROS_zw_druga_fala_szojgu:0 "Druga fala"
 ROS_zw_druga_fala_szojgu_desc:0 "Sztab generalny wyjmuje z sejfu mapy, które kończyły się na Wiśle. Każde państewko przy nowej granicy obwodu jest teraz celem – najpierw najsłabsze."
 ROS_zw_podlasie_szojgu:0 "Uderzenie z dwóch stron"
 ROS_zw_podlasie_szojgu_desc:0 "Gdy rosyjskie kolumny idą z Mazur na południe, białoruskie dywizje mogą wejść na Podlasie od wschodu. Polskie państewka nie mają tylu ludzi, by bronić dwóch frontów."
 ROS_zw_wisla_szojgu:0 "Rosja nad Wisłą"
 ROS_zw_wisla_szojgu_desc:0 "To, co było tylko mapą w sztabie, staje się granicą. Gubernatorzy z Moskwy obejmują urzędy w miastach, których nazw jeszcze niedawno nie umieli wymówić."
 ROS_kl_lekcja_szojgu:0 "Gorzka lekcja"
 ROS_kl_lekcja_szojgu_desc:0 "Kolumny wracają do obwodu z połową stanu. W sztabie nikt nie mówi „klęska” – mówi się „zakończenie operacji”. Ale wszyscy wiedzą."
 ROS_kl_zdobycze_szojgu:0 "Utrzymać to, co zostało"
 ROS_kl_zdobycze_szojgu_desc:0 "Rozejm zostawił w rosyjskich rękach przygraniczne gminy, których obrońcy nie zdołali odbić. Trzeba je umocnić, zanim ktoś spróbuje."
 ROS_kl_rozliczenia_szojgu:0 "Rozliczenia w sztabie"
 ROS_kl_rozliczenia_szojgu_desc:0 "Dowódcy odpowiedzialni za klęskę tracą stanowiska. Ich następcy mają jedną zaletę: nie było ich na Mazurach."
 ROS_kl_gospodarka_szojgu:0 "Gospodarka po wojnie"
 ROS_kl_gospodarka_szojgu_desc:0 "Koniec wydatków na ofensywę oznacza pieniądze na fabryki, drogi i pensje. Przynajmniej w teorii."
 ROS_kl_rozmowy_szojgu:0 "Rozmowy z Mazurami"
 ROS_kl_rozmowy_szojgu_desc:0 "Rosyjscy dyplomaci jadą do Olsztyna – tym razem samochodami, nie czołgami. Rozmowy dotyczą jeńców, granicy i handlu."
 ROS_kl_reforma_szojgu:0 "Reforma armii"
 ROS_kl_reforma_szojgu_desc:0 "Nowe regulaminy, nowi dowódcy i nowe szkolenia. Armia ma się uczyć na błędach z Mazur, a nie je ukrywać."
 ROS_kl_spokoj_szojgu:0 "Spokój w obwodzie"
 ROS_kl_spokoj_szojgu_desc:0 "Matki poległych dostają odszkodowania, a telewizja przestaje mówić o wojnie. Ludzie chcą po prostu żyć."
 ROS_kl_odbudowa_szojgu:0 "Odbudowa potęgi"
 ROS_kl_odbudowa_szojgu_desc:0 "Rosja przegrała bitwę o Mazury, ale nie przestała być Rosją. Następnym razem będzie lepiej przygotowana."
 ROS_zw_aneksja_szojgu:0 "Aneksja Mazur"
 ROS_zw_aneksja_szojgu_desc:0 "Zdobyte ziemie zostaną włączone do Federacji Rosyjskiej. Państwa mazurskie przestaną istnieć."
 ROS_zw_administracja_szojgu:0 "Administracja wojskowa"
 ROS_zw_administracja_szojgu_desc:0 "Zajęte ziemie przejdą pod zarząd komendantur wojskowych. Reszta państw mazurskich dostanie pokój."
 ROS_zw_obwod_wm_szojgu:0 "Obwód Warmińsko-Mazurski"
 ROS_zw_obwod_wm_szojgu_desc:0 "Zdobyte ziemie staną się nowym państwem – Obwodem Warmińsko-Mazurskim, zależnym od Moskwy. Na czele Rady Obwodu stanie Maciej Maciak."
 ROS_zw_pokoj_szojgu:0 "Pokój bez aneksji"
 ROS_zw_pokoj_szojgu_desc:0 "Rosja zwróci zajęte ziemie i zakończy wojnę."
 ROS_szojgu_tree:0 "Zarząd wojskowy Szojgu"
 ROS_wyb_kampania:0 "Kampania prezydencka"
 ROS_wyb_kampania_desc:0 "§Y«Выборы»§!\n\nPięciu kandydatów, jedna kampania i kraj w stanie wojny. Na ulicach Moskwy wiszą plakaty, których jeszcze rok temu nikt nie odważyłby się wydrukować."
 ROS_wyb_mie:0 "Aparat Jednej Rosji"
 ROS_wyb_mie_desc:0 "Dmitrij Miedwiediew ma za sobą partię, gubernatorów i państwową telewizję. Obiecuje kontynuację – i zwycięstwo na Mazurach."
 ROS_wyb_szo:0 "Głosy z koszar"
 ROS_wyb_szo_desc:0 "Żołnierze i ich rodziny to miliony wyborców. Siergiej Szojgu chce, by głosowali w mundurach."
 ROS_wyb_cho:0 "Kapitał z emigracji"
 ROS_wyb_cho_desc:0 "Michaił Chodorkowski wraca z Londynu z pieniędzmi i obietnicą kraju „dla tych, którzy umieją zarabiać”. (Wariant fikcyjny.)"
 ROS_wyb_szl:0 "Regiony za Jabłokiem"
 ROS_wyb_szl_desc:0 "Lew Szlosberg jeździ od Pskowa po Władywostok i mówi o parlamencie, samorządach i końcu wojny."
 ROS_wyb_naw:0 "Powrót Julii Nawalnej"
 ROS_wyb_naw_desc:0 "Na lotnisku Wnukowo czekają dziesiątki tysięcy ludzi. Julia Nawalna mówi o korupcji, więźniach politycznych i Rosji bez imperium."
 ROS_wyb_debata:0 "Debata telewizyjna"
 ROS_wyb_debata_desc:0 "Pierwsza od dekad prawdziwa debata w państwowej telewizji ogląda ją pół kraju."
 ROS_wyb_obserwatorzy:0 "Obserwatorzy międzynarodowi"
 ROS_wyb_obserwatorzy_desc:0 "Misja OBWE wraca do Rosji. Każda komisja wyborcza będzie miała świadków."
 ROS_wyb_dzien:0 "Dzień wyborów"
 ROS_wyb_dzien_desc:0 "Lokale wyborcze otwierają się od Kaliningradu po Kamczatkę. Wynik zdecyduje nie tylko o prezydencie, ale też o tym, co stanie się z wojną na Mazurach."
 ROS_zw_triumf_wybory:0 "Defilada w Królewcu"
 ROS_zw_triumf_wybory_desc:0 "Kolumny wracające z Mazur przejeżdżają przez Plac Zwycięstwa. Telewizja pokazuje kwiaty, flagi i mapę z nowymi granicami – i ani jednego zdjęcia z cmentarzy."
