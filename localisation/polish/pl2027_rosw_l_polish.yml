l_polish:
 ROSW_odmowa_protektoratu:0 "Odrzucony protektorat"
 ROSW_strefa_wplywow:0 "Strefa wpływów"
 ROSW_strefa_wplywow_desc:0 "Rosyjscy ambasadorzy, bankierzy i dziennikarze są wszędzie tam, gdzie nie dojechały czołgi."
 ROSW_linia_rozejmu:0 "Linia rozejmu"
 ROSW_linia_rozejmu_desc:0 "Okopy, zapory i pola minowe wzdłuż nowej granicy. Zachowane gminy mają zostać rosyjskie."
 ROSW_odbudowa:0 "Odbudowa potęgi"
 ROSW_odbudowa_desc:0 "Armia uczy się na błędach z Mazur, a gospodarka wraca do pracy w pokoju."
 OWM_pod_opieka:0 "Pod opieką Moskwy"
 OWM_pod_opieka_desc:0 "Każdy wydział Rady Obwodu ma rosyjskiego doradcę, a każdy garnizon – rosyjskiego dowódcę."
 OWM_maciej_maciak:0 "Maciej Maciak"
 OWM_partia:0 "Rada Obwodu"
 OWM_partia_long:0 "Rada Obwodu Warmińsko-Mazurskiego"
 ROSW_tt_obwod:0 "Ziemie zdobyte na Mazurach tworzą §YObwód Warmińsko-Mazurski§! – państwo zależne od Rosji. Przewodniczącym Rady Obwodu zostaje §YMaciej Maciak§!. Pozostałe państwa mazurskie dostają pokój."
 ROSW_tt_umocnij:0 "Zachowane gminy dostają umocnienia: idea §YLinia rozejmu§! na 2 lata."
 rosw.1.t:0 "Linia rozejmu"
 rosw.1.d:0 "Rozejm kończy ofensywę, ale nie wszystko wraca do dawnych granic. Przygraniczne gminy, których obrońcy nie zdołali odbić, zostają w rosyjskich rękach – liczba zachowanych regionów: §Y[?ROS_zdob_zatrzymane|0]§!."
 rosw.1.a:0 "Tego nie oddamy."
 rosw.2.t:0 "Powstaje Obwód Warmińsko-Mazurski"
 rosw.2.d:0 "Na ratuszu w Olsztynie zawieszono nową flagę. Rada Obwodu Warmińsko-Mazurskiego, z Maciejem Maciakiem jako przewodniczącym, ogłasza „wieczną przyjaźń” z Moskwą. Rosyjscy doradcy zajmują gabinety obok polskich urzędników."
 rosw.2.a:0 "Moskwa ma nowego sojusznika."
 rosw.2.b:0 "Mazury pod rosyjską opieką."
 rosw.10.t:0 "Rosyjska oferta protektoratu"
 rosw.10.d:0 "Ambasador Federacji Rosyjskiej przywiózł propozycję: ochronę wojskową, tanie paliwo i kredyty – w zamian za „koordynację polityki zagranicznej i obronnej” z Moskwą. Wszyscy wiedzą, co to oznacza."
 rosw.10.a:0 "Przyjąć ochronę Moskwy."
 rosw.10.b:0 "Nie jesteśmy na sprzedaż."
 rosw.11.t:0 "Protektorat przyjęty"
 rosw.11.d:0 "Władze państwa [FROM.GetName] przyjęły ochronę Moskwy. Na mapach sztabu generalnego pojawia się kolejny kolor."
 rosw.11.a:0 "Rosyjska strefa rośnie."
 rosw.12.t:0 "Protektorat odrzucony"
 rosw.12.d:0 "Władze państwa [FROM.GetName] odrzuciły naszą ofertę. Sztab generalny pyta, czy dyplomacja ma się na tym skończyć."
 rosw.12.a:0 "Uzasadnić interwencję."
 rosw.12.b:0 "Na razie odpuścić."
