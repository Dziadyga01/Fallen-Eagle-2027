l_polish:
 ROZ_godzina_zero:0 "Godzina Zero"
 ROZ_godzina_zero_desc:0 "Rząd zbiera się w Alejach Ujazdowskich. Pierwsza decyzja: ogłosić, że państwo działa – nawet jeśli działa tylko w Śródmieściu."
 ROZ_sztab:0 "Rządowy Zespół Zarządzania Kryzysowego"
 ROZ_sztab_desc:0 "Sztab kryzysowy przejmuje koordynację ministerstw, wojewodów i służb. Telefony dzwonią całą dobę."
 ROZ_rozporzadzenia:0 "Rozporządzenia z mocą ustawy"
 ROZ_rozporzadzenia_desc:0 "Sejm nie zbiera kworum, więc rząd rządzi rozporządzeniami. Prawnicy protestują, urzędnicy wykonują."
 ROZ_kurierzy:0 "Poczta rządowa"
 ROZ_kurierzy_desc:0 "Łączność padła, więc rozporządzenia jeżdżą pociągami i samochodami służbowymi. Wolniej, ale dochodzą."
 ROZ_rbn:0 "Rada Bezpieczeństwa Narodowego"
 ROZ_rbn_desc:0 "Pierwsze od miesięcy posiedzenie RBN z udziałem dowódców rodzajów sił zbrojnych i komendantów służb."
 ROZ_pelnomocnicy:0 "Pełnomocnicy rządu w regionach"
 ROZ_pelnomocnicy_desc:0 "Do każdego województwa jedzie pełnomocnik z budżetem i prawem podpisu. Ma słuchać, płacić i meldować."
 ROZ_konstytucja:0 "Konstytucja przejściowa"
 ROZ_konstytucja_desc:0 "Projekt konstytucji przejściowej: silniejsze regiony, wspólna armia, wspólna waluta. Kompromis, który nikogo nie zachwyca – i może dlatego działa."
 ROZ_kongres:0 "Kongres samorządów"
 ROZ_kongres_desc:0 "Marszałkowie, prezydenci miast i starostowie w jednej sali. Pierwszy raz od lat mówią sobie prawdę w oczy."
 ROZ_srodki:0 "Nowy podział środków"
 ROZ_srodki_desc:0 "Większa część podatków zostaje w regionach. Budżet centralny chudnie, a województwa mają mniej powodów, by odchodzić."
 ROZ_statut:0 "Statut autonomii regionów"
 ROZ_statut_desc:0 "Rząd sam proponuje autonomię trzem regionom najbliższym secesji – lepiej dać ją na swoich warunkach."
 ROZ_gwarancje:0 "Gwarancje dla miast"
 ROZ_gwarancje_desc:0 "Rząd gwarantuje miastom dostawy prądu, paliwa i leków. Małe gminy przestają rozglądać się za nowymi zwierzchnikami."
 ROZ_umowa:0 "Umowa społeczna regionów"
 ROZ_umowa_desc:0 "Regiony podpisują umowę: autonomia w zamian za wspólną obronę i wspólny rynek. Rzeczpospolita staje się federacją z nazwy – i z treści."
 ROZ_zandarmeria:0 "Żandarmeria w urzędach"
 ROZ_zandarmeria_desc:0 "Żandarmeria Wojskowa pilnuje urzędów wojewódzkich, archiwów i przekaźników. Spokojniej – i bardziej nerwowo."
 ROZ_garnizony:0 "Lojalność garnizonów"
 ROZ_garnizony_desc:0 "Żołd na czas, premie i rozmowy z dowódcami garnizonów. Część oficerów wciąż odbiera telefon z Warszawy."
 ROZ_kolej:0 "Ochrona węzłów kolejowych"
 ROZ_kolej_desc:0 "Straż Ochrony Kolei i wojsko pilnują węzłów w Kutnie, Iławie i Tczewie. Pociągi z węglem i lekami muszą jeździć."
 ROZ_stan_wyjatkowy:0 "Stan wyjątkowy"
 ROZ_stan_wyjatkowy_desc:0 "Godzina policyjna, zakaz zgromadzeń i kontrole na drogach. Służby odzyskują kontrolę – kosztem zaufania ludzi."
 ROZ_armia_rp:0 "Wojsko Rzeczypospolitej"
 ROZ_armia_rp_desc:0 "Z lojalnych garnizonów i ochotników powstają brygady podległe bezpośrednio rządowi."
 ROZ_rezerwy:0 "Rezerwy NBP"
 ROZ_rezerwy_desc:0 "Bank centralny uruchamia rezerwy walutowe. Wypłaty w budżetówce przychodzą na czas – jeszcze przez kilka miesięcy."
 ROZ_pozyczka:0 "Pożyczka pomostowa z Brukseli"
 ROZ_pozyczka_desc:0 "Unia daje pieniądze – pod warunkiem, że rząd zachowa kontrolę nad granicą i wypłatami. Eurostaaty patrzą na to z zazdrością."
 ROZ_bony:0 "Bony i kartki"
 ROZ_bony_desc:0 "Bony na paliwo, chleb i leki. Kolejki krótsze, ale ludzie wspominają lata osiemdziesiąte."
 ROZ_energetyka:0 "Sieć awaryjna"
 ROZ_energetyka_desc:0 "Energetycy łączą elektrownie w sieć awaryjną. Prąd wraca do szpitali i wodociągów w całym kraju."
 ROZ_przetrwac:0 "Przetrwać do wiosny"
 ROZ_przetrwac_desc:0 "Każdy tydzień ciągłości państwa to tydzień, w którym regiony mogą jeszcze zmienić zdanie. Rząd mobilizuje wszystkie siły przed najtrudniejszym okresem."
 ROZ_odbudowa:0 "Rzeczpospolita trwa"
 ROZ_odbudowa_desc:0 "Rząd przetrwał najgorsze. Teraz trzeba przekonać lojalne województwa, że warto zostać – i pokazać reszcie kraju, że jest do czego wracać."
 ROZ_administracja:0 "Wspólna administracja"
 ROZ_administracja_desc:0 "Urzędy lojalnych województw przechodzą pod bezpośredni zarząd rządu. Decyzja „Przywrócenie administracji” kosztuje mniej czasu i pieniędzy."
 ROZ_porzadek:0 "Przywrócić porządek"
 ROZ_porzadek_desc:0 "Rząd uznaje, że secesje sąsiednich regionów były bezprawne. Wojsko Rzeczypospolitej dostaje rozkaz przywrócenia władzy państwowej."
 ROZ_odrodzona:0 "Odrodzona Rzeczpospolita"
 ROZ_odrodzona_desc:0 "Rząd ogłasza, że państwo wróciło: wspólne prawo, wspólna armia, wspólny Sejm. Teraz trzeba przekonać resztę kraju – albo ją pokonać."
