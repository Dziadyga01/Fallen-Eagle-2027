 ROZ_tt_22:0 "Lojalność samorządów §G+8§!, Jedność państwa §G+4§!, Presja rozpadu §G-6§!"
 ROZ_tt_23:0 "Kontrola służb §G+6§!, Zaufanie społeczne §R-3§!"
