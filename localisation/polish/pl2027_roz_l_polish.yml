 ROZ_tt_25:0 "Stabilność gospodarcza §G+4§!, Kontrola służb §G+2§!"
 ROZ_tt_26:0 "Kontrola służb §G+10§!, Zaufanie społeczne §R-8§!, Presja rozpadu §G-6§!"
