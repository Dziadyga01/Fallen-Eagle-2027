l_polish:
 ROS_req_cel_wolny:0 "Warmia i Mazury, Mazury albo Suwalszczyzna jest niepodległym państwem (nie województwem Rzeczypospolitej)"
 ROZ_mloda_niepodleglosc:0 "Młoda niepodległość"
 ROZ_mloda_niepodleglosc_desc:0 "Własne pieczątki, własne granice i własne kłopoty. Urzędnicy pracują po godzinach, a ludzie czekają, czy nowe państwo zapłaci emerytury."
 roz.1.t:0 "Rząd Rzeczypospolitej"
 roz.1.d:0 "Gabinet zbiera się w Alejach Ujazdowskich przy świecach – w Śródmieściu znów nie ma prądu. Na stole leżą raporty z szesnastu województw. Formalnie wszystkie regiony są częścią Rzeczypospolitej. W praktyce marszałkowie, prezydenci miast, komendanci i lokalni liderzy coraz rzadziej odbierają telefony z Warszawy.\n\n§YJak gra się Rzeczpospolitą:§! regiony mają §Yskłonność do secesji§! (0–100). W fazie II żądają autonomii, w fazie III ogłaszają niepodległość, a w fazie IV rząd przetrwa tylko wtedy, gdy powstanie §Yrząd jedności narodowej§! przy średniej wskaźników kryzysu co najmniej §Y40§! (albo sama średnia wyniesie §Y50§!). Rozmowy z regionami, dobrowolna autonomia i panel „Kryzys Rzeczypospolitej” spowalniają rozpad."
 roz.1.a:0 "Do pracy. Państwo musi przetrwać do wiosny."
 roz.2.t:0 "Godzina Zero: jedna Rzeczpospolita"
 roz.2.d:0 "11 listopada 2027. Rzeczpospolita wciąż istnieje – na mapach, w ustawach i w przemówieniach. Ale Sejm, Pałac i sądy wydają sprzeczne decyzje, a regiony coraz głośniej mówią o samodzielności.\n\nNa razie wszystkie ziemie są §Ywojewództwami Rzeczypospolitej§!. W kolejnych fazach rozpadu regiony będą żądać autonomii, ogłaszać niepodległość albo wypowiadać posłuszeństwo władzom centralnym."
 roz.2.a:0 "Zobaczymy, kto pierwszy się wyłamie."
 ROZ_tt_1:0 "Lojalność samorządów §G+2§!"
 roz.10.t:0 "Żądanie autonomii"
 roz.10.d:0 "Sesja sejmiku trwa do rana. Radni chcą, żeby [Root.GetName] sama ustalała podatki, prowadziła policję i decydowała o swoich szpitalach – wciąż w Rzeczypospolitej, ale już nie na rozkaz Warszawy.\n\nSkłonność do secesji regionu: §Y[?ROZ_sklonnosc|0]§!/100."
 roz.10.a:0 "Wysłać żądanie autonomii do rządu."
 roz.10.b:0 "Zostajemy województwem – na razie."
 ROZ_odmowa_warszawy:0 "Upokorzeni przez Warszawę"
 ROZ_odmowa_warszawy_desc:0 "Rząd odrzucił nasze żądania. Na ulicach słychać, że „skoro nie po dobroci, to po swojemu”."
 ROZ_tt_2:0 "Lojalność samorządów §G+3§!, Jedność państwa §R-2§!, Presja rozpadu §R+2§!"
 ROZ_tt_3:0 "Lojalność samorządów §G+2§!, Stabilność gospodarcza §R-2§!"
 ROZ_tt_4:0 "Jedność państwa §G+2§!, Lojalność samorządów §R-3§!, Presja rozpadu §R+2§!"
 roz.11.t:0 "[From.GetName] żąda autonomii"
 roz.11.d:0 "Delegacja z regionu przywozi uchwałę: własny budżet, własna policja, własne prawo w sprawach lokalnych. Wojewoda radzi ustąpić, minister spraw wewnętrznych – nie.\n\nSkłonność do secesji regionu: §Y[?FROM.ROZ_sklonnosc|0]§!. Autonomia daje regionowi własny kolor na mapie i swobodę, ale wciąż w Rzeczypospolitej."
 roz.11.a:0 "Przyznać autonomię – lepiej ustąpić, niż stracić region."
 roz.11.b:0 "Negocjować – pieniądze w zamian za lojalność (30 PP)."
 roz.11.c:0 "Odmówić – Rzeczpospolita nie jest federacją."
 ROZ_tt_5:0 "Jedność państwa §R-4§!, Presja rozpadu §R+4§!"
 roz.12.t:0 "Warszawa mówi „nie”"
 roz.12.d:0 "Rząd odrzucił nasze żądania. Wojewoda wywiesza na drzwiach urzędu rozporządzenie o „bezprawnych uchwałach”. Ludzie pod urzędem czekają, co zrobimy."
 roz.12.a:0 "Ogłosić autonomię bez zgody Warszawy."
 roz.12.b:0 "Podporządkować się – na razie."
 roz.20.t:0 "Wypowiedzenie posłuszeństwa"
 roz.20.d:0 "[Root.GetName] ogłasza, że nie wykonuje już poleceń rządu Rzeczypospolitej. Gmach przy Wiejskiej, Pałac na Krakowskim Przedmieściu i biura w Pruszkowie mają teraz własne straże, własne radiostacje – i własne plany wobec stolicy.\n\nPolicja, Wojsko i Kibice Legii wracają pod zwierzchnictwo swoich bloków."
 roz.20.a:0 "Stolica należy do tych, którzy ją utrzymają."
 roz.21.t:0 "Warszawa się dzieli"
 roz.21.d:0 "Straż Marszałkowska, Kancelaria Prezydenta i Mafia Pruszkowska wypowiedziały posłuszeństwo rządowi. Rzeczpospolita trzyma już tylko Śródmieście i tych, którzy wciąż odbierają telefony z Alei Ujazdowskich.\n\nNiepodległych państw na ziemiach polskich: §Y[?global.ROZ_niepodlegle|0]§!."
 roz.21.a:0 "Zaczyna się prawdziwy rozpad."
 ROZ_tt_6:0 "Jedność państwa §G+2§!, Lojalność samorządów §G+2§!"
 roz.30.t:0 "Deklaracja niepodległości?"
 roz.30.d:0 "Faza III rozpadu: ministerstwa nie mają łączności z połową kraju. [Root.GetName] jest autonomią od miesięcy – a w sali obrad leży gotowy tekst deklaracji niepodległości.\n\nSkłonność do secesji: §Y[?ROZ_sklonnosc|0]§!/100."
 roz.30.a:0 "Ogłaszamy niepodległość."
 roz.30.b:0 "Zostajemy autonomią Rzeczypospolitej."
 ROZ_tt_7:0 "Zaufanie społeczne §G+2§!, Jedność państwa §R-2§!"
 ROZ_tt_8:0 "Jedność państwa §G+2§!, Presja rozpadu §R+2§!"
 roz.31.t:0 "[From.GetName] ogłasza niepodległość"
 roz.31.d:0 "Deklaracja przyszła faksem – jedyną linią, która jeszcze działa. Region przestaje uznawać ustawy Sejmu i rozporządzenia rządu. Sąsiednie województwa przyglądają się uważnie."
 roz.31.a:0 "Uznać fakty i rozmawiać o granicach."
 roz.31.b:0 "Potępić secesję – Rzeczpospolita jest jedna."
 ROZ_req_przetrwanie:0 "Powstał §Yrząd jedności narodowej§! i średnia wskaźników kryzysu wynosi co najmniej §Y40§! – albo średnia wynosi co najmniej §Y50§!"
 ROZ_okrojona_rp:0 "Okrojona Rzeczpospolita"
 ROZ_okrojona_rp_desc:0 "Rząd przetrwał, ale rządzi już tylko województwami, które zostały lojalne. Każda decyzja jest negocjacją."
 ROZ_rzad_rp:0 "Rząd Rzeczypospolitej"
 ROZ_rzad_rp_desc:0 "Ministerstwa wciąż działają, choć coraz częściej tylko na papierze. Każdy dzień ciągłości państwa jest sukcesem."
 roz.40.t:0 "Ostatnia narada rządu"
 roz.40.d:0 "Faza IV rozpadu. Regiony ogłaszają niepodległość, a spory o granice przestają być sporami na papierze. Premier zwołuje ostatnią naradę w pełnym składzie. Pytanie jest jedno: czy Rzeczpospolita może jeszcze istnieć jako państwo – choćby okrojone – czy rząd powinien przekazać władzę w stolicy tym, którzy ją realnie trzymają?\n\nŚrednia wskaźników kryzysu: §Y[?global.TFE_srednia|0]§!. Niepodległych państw: §Y[?global.ROZ_niepodlegle|0]§!."
 roz.40.a:0 "Rzeczpospolita trwa – z tymi, którzy zostali lojalni."
 roz.40.b:0 "Przekazać władzę Pałacowi (Kancelaria Prezydenta)."
 roz.40.c:0 "Przekazać władzę Sejmowi (Straż Marszałkowska)."
 roz.41.t:0 "Upadek rządu Rzeczypospolitej"
 roz.41.d:0 "Rząd Rzeczypospolitej ogłasza samorozwiązanie. Śródmieście przejmuje stołeczny blok, a województwa, które jeszcze czekały na decyzję, stają się niepodległymi państwami. Na mapie Polski nie ma już jednej barwy."
 roz.41.a:0 "Koniec pewnej epoki."
 roz.42.t:0 "Rzeczpospolita trwa"
 roz.42.d:0 "Rząd przetrwał najgorsze tygodnie. Rzeczpospolita jest mniejsza, uboższa i podzielona – ale istnieje, a lojalne województwa wciąż wysyłają delegatów do Sejmu. Regiony, które ogłosiły niepodległość, nie zamierzają wracać."
 roz.42.a:0 "Zobaczymy, czy to początek odbudowy."
 ROZ_rzeczpospolita:0 "Rzeczpospolita i regiony"
 ROZ_rzeczpospolita_desc:0 "Rząd prowadzi rozmowy z regionami, przyznaje autonomię albo – po fazie IV, jeśli przetrwa – przywraca administrację w lojalnych województwach. Każdy region ma §Yskłonność do secesji§! (0–100): powyżej 55 chętnie żąda autonomii, powyżej 60 – niepodległości. Niepodległych państw na ziemiach polskich: §Y[?global.ROZ_niepodlegle|0]§!."
 ROZ_d_rozmowy:0 "Rozmowy z regionem"
 ROZ_d_rozmowy_desc:0 "Minister jedzie do regionu z ofertą: pieniądze na szpitale i drogi w zamian za lojalność. Skłonność regionu do secesji spada o 20."
 ROZ_tt_9:0 "Presja rozpadu §G-3§!, Lojalność samorządów §G+3§!, Jedność państwa §R-2§!"
 ROZ_d_autonomia:0 "Dobrowolna autonomia"
 ROZ_d_autonomia_desc:0 "Rząd sam przyznaje regionowi autonomię i podpisuje z nim umowę. Region zyskuje swobodę, ale zostaje lojalny wobec Rzeczypospolitej."
 ROZ_tt_10:0 "Jedność państwa §G+4§!"
 ROZ_d_integracja:0 "Przywrócenie administracji"
 ROZ_d_integracja_desc:0 "Lojalne województwo wraca pod bezpośrednią administrację rządu: jego wojsko, fabryki i urzędy stają się częścią Rzeczypospolitej."
 ROZ_tt_11:0 "Jedność państwa §G+3§!"
 ROZ_d_kurier:0 "Kurierzy rządowi"
 ROZ_d_kurier_desc:0 "Rozporządzenia jadą do regionów samochodami i pociągami. Wolniej, ale dochodzą. Lojalność wszystkich województw rośnie."
 ROZ_region:0 "Region w Rzeczypospolitej"
 ROZ_region_desc:0 "Nasz region jest częścią Rzeczypospolitej. Możemy żądać autonomii, a od fazy III rozpadu – ogłosić niepodległość. Skłonność do secesji: §Y[?ROZ_sklonnosc|0]§!/100."
 ROZ_d_zadanie:0 "Żądać autonomii"
 ROZ_d_zadanie_desc:0 "Sejmik uchwala żądanie autonomii i wysyła je do Warszawy. Rząd może się zgodzić, negocjować albo odmówić."
 ROZ_d_niepodleglosc:0 "Ogłosić niepodległość"
 ROZ_d_niepodleglosc_desc:0 "Region ogłasza niepodległość i zrywa z Rzeczpospolitą. Nowe państwo dostaje własne granice, armię i kłopoty."
 ROZ_rzeczpospolita_tree:0 "Rzeczpospolita w kryzysie"
 ROZ_tt_12:0 "Kontrola służb §G+5§!, Jedność państwa §G+3§!"
 ROZ_tt_13:0 "Jedność państwa §G+5§!, Zaufanie społeczne §R-2§!"
 ROZ_tt_14:0 "Jedność państwa §G+4§!, Stabilność gospodarcza §R-2§!"
