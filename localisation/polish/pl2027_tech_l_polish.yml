l_polish:
 aircraft_equipment:0 "Samolot cywilny"
 aircraft_equipment_short:0 "Samolot cywilny"
 aircraft_equipment_desc:0 "Cywilne samoloty zgromadzone przez naszą armię, wykorzystywane do wykonywania prostych zadań zwiadowczych."
 primitive_aircraft_equipment:0 "Samolot cywilny z odzysku"
 primitive_aircraft_equipment_short:0 "Samolot cywilny z odzysku"
 primitive_aircraft_equipment_desc:0 "Wszelkiego rodzaju małe i średnie cywilne samoloty, które splądrowała horda różnorakich watażków. Większość z nich nie nadaje się do niczego innego niż do zwiadu albo do przelotu nad głowami wrogów tylko po to, by irytować ich odgłosem silnika."
 fighter_equipment:0 "Fighter Equipment"
 fighter_equipment_short:0 "Fighter Equipment"
 fighter_equipment_0:0 "Fighter Equipment 0"
 fighter_equipment_0_short:0 "Fighter Equipment 0"
 fighter_equipment_1:0 "Fighter Equipment 1"
 fighter_equipment_1_short:0 "Fighter Equipment 1"
 fighter_equipment_2:0 "Fighter Equipment 2"
 fighter_equipment_2_short:0 "Fighter Equipment 2"
 fighter_equipment_3:0 "Fighter Equipment 3"
 fighter_equipment_3_short:0 "Fighter Equipment 3"
 fighter_equipment_4:0 "Myśliwiec 5. generacji"
 fighter_equipment_4_short:0 "Myśliwiec 5. generacji"
 fighter_equipment_4_desc:0 "Nowoczesne myśliwce 5. generacji używane przez ruskich i Amerykanów, a także zmodernizowane myśliwce 4. i 4.5 generacji, które wciąż znajdują zastosowanie w ich armiach - albo jako importowane z zagranicy jako 'pomoc humanitarna', albo bezwstydnie okrojone z funkcjonalności i kopiowane na miejscu, bo jak do cholery mielibyśmy sobie pozwolić na choćby jednego F-35?"
 bomber_equipment:0 "Bombowiec"
 bomber_equipment_short:0 "Bombowiec"
 bomber_equipment_desc:0 "I'm trying my hardest to make a ''all toasters toast toast'' bit here but ''all bombers drop bombs'' 's missing the mark a bit."
 bomber_equipment_0:0 "Samolot rolniczy"
 bomber_equipment_0_short:0 "Samolot rolniczy"
 bomber_equipment_0_desc:0 "Samoloty rolnicze pełniące rolę lekkich bombowców i myśliwców wielozadaniowych, wykorzystywane do opryskiwania różnymi substancjami żrącymi, drażniącymi lub odrażającymi oraz (ręcznego) zrzucania bomb na głowy wrogów."
 bomber_equipment_1:0 "Prowizoryczny lekki bombowiec"
 bomber_equipment_1_short:0 "Prowizoryczny lekki bombowiec"
 bomber_equipment_1_desc:0 "Samoloty rolnicze oraz cięższe modele samolotów szkoleniowych z dodanymi pylonami, zdolne do przenoszenia bomb podwieszanych pod skrzydłami i zrzucania bomb beczkowych bezpośrednio na swoich 'klientów'."
 bomber_equipment_2:0 "Klasyczny myśliwiec bombardujący"
 bomber_equipment_2_short:0 "Klasyczny myśliwiec bombardujący"
 bomber_equipment_2_desc:0 "Stare, masowo eksportowane bombowce z wczesnych lat zimnej wojny, które w przeszłości zostały zakupione przez Polskie Siły Powietrzne. Z czasów, gdy Polska jeszcze istniała."
 bomber_equipment_3:0 "Klasyczny samolot szturmowy"
 bomber_equipment_3_short:0 "Klasyczny samolot szturmowy"
 bomber_equipment_3_desc:0 "Su-25 i inne sprawdzone samoloty z czasów zimnej wojny, zaprojektowane z myślą o bliskim wsparciu powietrznym i roli samolotów szturmowych"
 bomber_equipment_4:0 "Nowoczesny samolot bliskiego wsparcia powietrznego"
 bomber_equipment_4_short:0 "Nowoczesny samolot bliskiego wsparcia powietrznego"
 bomber_equipment_4_desc:0 "Bardziej zaawansowane samoloty z czasów zimnej wojny wyposażone w różne nowoczesne gadżety i technologie, które do dziś zapewniają bliskie wsparcie powietrzne Amerykanom i ich strefie wpływów."
 transport_equipment:0 "Samolot transportowy"
 transport_equipment_short:0 "Samolot transportowy"
 transport_equipment_desc:0 "Samoloty używane przez spadochroniarzy oraz do zrzutów zaopatrzenia."
 transport_equipment_0:0 "Lekki samolot pasażerski"
 transport_equipment_0_short:0 "Lekki samolot pasażerski"
 transport_equipment_0_desc:0 "Samoloty użytkowe mieszczące się w definicji "lekkich samolotów" (tzw. "awionetki") oraz małe samoloty regionalne, wykorzystywane przez polskie zbieraniny wojsk w częściowo znormalizowanych flotach powietrznych do transportu zaopatrzenia i żołnierzy drogą powietrzną."
 transport_equipment_1:0 "Mały wojskowy samolot transportowy"
 transport_equipment_1_short:0 "Mały wojskowy samolot transportowy"
 transport_equipment_1_desc:0 "Modele wojskowych i przerobionych cywilnych samolotów, które mogą transportować ładunki i spadochroniarzy, lądować praktycznie wszędzie i być naprawiane przez niemal każdego, kto ma warsztat. Kategoria obejmująca samoloty takie jak legendarny An-2 - "Kukuruźnik" lub "Antek"."
 transport_equipment_2:0 "Samolot pasażerski"
 transport_equipment_2_short:0 "Samolot pasażerski"
 transport_equipment_2_desc:0 "Droższe, bardziej zaawansowane średniej wielkości samoloty transportowe lub maszyny, które można łatwo przekształcić w takowe, głównie stare radzieckie An-24 i An-26 lub ich kopie."
 transport_equipment_3:0 "Klasyczny samolot transportowy"
 transport_equipment_3_short:0 "Klasyczny samolot transportowy"
 transport_equipment_3_desc:0 "Kopie ciężkich, zimnowojennych modeli samolotów transportowych, które były używane przez wiele armii z krajów trzeciego, a nawet drugiego świata aż do początku lat 2000.."
 transport_equipment_4:0 "Współczesny samolot transportowy"
 transport_equipment_4_short:0 "Współczesny samolot transportowy"
 transport_equipment_4_desc:0 "Technologicznie zaawansowane i dobrze przystosowane do trudnych warunków lądowania modele samolotów transportowych (oraz ich kopie) z końca okresu zimnej wojny, używane do dziś przez największe światowe potęgi, takie jak rosyjski Ił-76 i An-12, indyjski A-50E/I oraz amerykański C-130 Hercules."
