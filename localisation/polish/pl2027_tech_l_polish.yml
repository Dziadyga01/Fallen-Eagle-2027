 floating_harbor_equipment:0 "Floating Harbor Equipment"
 floating_harbor_equipment_short:0 "Floating Harbor Equipment"
 floating_harbor_equipment_1:0 "Floating Harbor Equipment 1"
 floating_harbor_equipment_1_short:0 "Floating Harbor Equipment 1"
 guided_missile_equipment:0 "Guided Missile Equipment"
 guided_missile_equipment_short:0 "Guided Missile Equipment"
 guided_missile_equipment_desc:0 "Pocisk balistyczny dalekiego zasięgu"
 guided_missile_equipment_1:0 "Guided Missile Equipment 1"
 guided_missile_equipment_1_short:0 "Guided Missile Equipment 1"
 guided_missile_equipment_2:0 "Guided Missile Equipment 2"
 guided_missile_equipment_2_short:0 "Guided Missile Equipment 2"
 guided_missile_equipment_3:0 "Guided Missile Equipment 3"
 guided_missile_equipment_3_short:0 "Guided Missile Equipment 3"
 guided_missile_equipment_4:0 "Zimnowojenny pocisk balistyczny krótkiego zasięgu"
 guided_missile_equipment_4_short:0 "Zimnowojenny pocisk balistyczny krótkiego zasięgu"
 guided_missile_equipment_4_desc:0 "Pociski balistyczne z późnego okresu zimnej wojny, które są bardziej zaawansowane i destrukcyjne niż ich wcześniejsze modele, ale wciąż mają pewne trudności z nowoczesnymi systemami obrony przeciwrakietowej."
 guided_missile_equipment_5:0 "Współczesny pocisk balistyczny krótkiego zasięgu"
 guided_missile_equipment_5_short:0 "Współczesny pocisk balistyczny krótkiego zasięgu"
 guided_missile_equipment_5_desc:0 "Najbardziej zaawansowana forma rozwalania budynków cywilnych z odległości kilkuset kilometrów"
 melee_equipment:0 "Broń biała"
 melee_equipment_short:0 "Broń biała"
 melee_equipment_desc:0 "Kategoria sprzętu obejmująca broń i narzędzia, które znajdują zastosowanie w strefach wojennych - łopaty, noże, kilofy i pałki do kopania w ziemi i rozłupywania wrogich czaszek."
 melee_equipment_0:0 "Prowizoryczna broń biała"
 melee_equipment_0_short:0 "Prowizoryczna broń biała"
 melee_equipment_0_desc:0 "Kije bejsbolowe, noże kuchenne, pałki, kastety, metalowe rury, narzędzia ogrodowe, szklane noże itp. - wszystko, co można znaleźć w domu, magazynie, opuszczonym kiosku, w ogrodzie dziadka lub wykonać własnoręcznie. Niezbyt wyrafinowane ani zbyt użyteczne przeciwko komuś z faktyczną bronią."
 melee_equipment_1:0 "Ustandaryzowana broń biała"
 melee_equipment_1_short:0 "Ustandaryzowana broń biała"
 melee_equipment_1_desc:0 "Znalezione maczety, siekiery, narzędzia i noże myśliwskie, które mogłyby być używane w armii, odnowione i ustandaryzowane w naszych szeregach, aby nasi saperzy nie musieli już kopać ziemi kijami i łyżkami do zupy."
 melee_equipment_2:0 "Broń biała użytku specjalistycznego"
 melee_equipment_2_short:0 "Broń biała użytku specjalistycznego"
 melee_equipment_2_desc:0 "Narzędzia i broń biała zaprojektowane z myślą o walce w miastach i okopach. Nieco przypominające uzbrojenie okopowe z czasów I wojny światowej."
 melee_equipment_3:0 "Wojskowa broń biała"
 melee_equipment_3_short:0 "Wojskowa broń biała"
 melee_equipment_3_desc:0 "Noże, łopaty i inny sprzęt, który dobrze sprawdziłby się w nowoczesnej armii, z dodatkowo odnowioną antyczną szablą lub łopatą wrzuconą tu i ówdzie wśród szturmowców, by uczynić twoich przodków wyjątkowo dumnymi."
 melee_equipment_4:0 "Broń biała najwyższej klasy"
 melee_equipment_4_short:0 "Broń biała najwyższej klasy"
 melee_equipment_4_desc:0 "Wojskowa biała broń najwyższej jakości, który wygląda jakby wyszła prosto z amerykańskiego sklepu dla miłośników noży. Wszystko wielofunkcyjne, zimne w dotyku, w kolorze czarnym jak śmierć (z fajnymi białymi wykończeniami przy krawędziach)."
 flamethrower_equipment:0 "Miotacz ognia"
 flamethrower_equipment_short:0 "Miotacz ognia"
 flamethrower_equipment_0:0 "Nowoczesny miotacz ognia"
 flamethrower_equipment_0_short:0 "Nowoczesny miotacz ognia"
 ranged_equipment:0 "Broń strzelecka"
 ranged_equipment_short:0 "Broń strzelecka"
 ranged_equipment_desc:0 "Kategoria sprzętu obejmująca wszelką przenośną broń dalekiego zasięgu - pistolety, karabiny, łuki, karabiny maszynowe, granaty, oszczepy, amunicję, a nawet kamienie."
 ranged_equipment_0:0 "Broń miotana"
 ranged_equipment_0_short:0 "Broń miotana"
 ranged_equipment_0_desc:0 "Kije i kamienie kości mi połamią, ale powodzenia w próbie rzucenia pieprzonym kamieniem w kogoś, kto naprawdę jest uzbrojony."
 ranged_equipment_1:0 "Broń pneumatyczna"
 ranged_equipment_1_short:0 "Broń pneumatyczna"
 ranged_equipment_1_desc:0 "Znalezione lub domowej roboty bronie pneumatyczne czy wiatrówki. Choć używanie ich w walce może wydawać się głupie, może dać ci to przewagę nad gościem z nożem."
 ranged_equipment_2:0 "Prowizoryczna broń palna"
 ranged_equipment_2_short:0 "Prowizoryczna broń palna"
 ranged_equipment_2_desc:0 "Domowej roboty strzelby rurowe oraz pistolety maszynowe w stylu Stena czy Błyskawicy. Samo trzymanie ich w rękach sprawia, że czujesz się jak partyzant warszawski gotowy do wywołania powstania"
 ranged_equipment_3:0 "Zimnowojenna broń palna"
 ranged_equipment_3_short:0 "Zimnowojenna broń palna"
 ranged_equipment_3_desc:0 "Dobre, stare kałachy i ich pochodne, wraz z innymi broniami powszechnie sprzedawanymi na czarnym rynku. Choć są dość nieporęczne w porównaniu do nowoczesnej broni, w pełni rekompensują to swoją odpornością i odrzutem, a także łatwością czyszczenia i konserwacji."
 ranged_equipment_4:0 "Współczesna broń palna"
 ranged_equipment_4_short:0 "Współczesna broń palna"
 ranged_equipment_4_desc:0 "Karabiny, karabinki i lekkie karabiny maszynowe używane przez większość europejskich armii. Teraz wystarczy tylko zamontować podlufowe granatniki i celowniki kolimatorowe, żeby uzyskać pełne wyposażenie."
 ranged_equipment_5:0 "Współczesna broń palna z dodatkami"
 ranged_equipment_5_short:0 "Współczesna broń palna z dodatkami"
 ranged_equipment_5_desc:0 "Nowoczesne bronie z powszechnie dostępnymi, ustandaryzowanymi akcesoriami, stojące na równi z francuskimi i brytyjskimi pukawkami."
 ranged_equipment_tesla:0 "Ranged Equipment Tesla"
 ranged_equipment_tesla_short:0 "Ranged Equipment Tesla"
 ranged_equipment_plasma:0 "Ranged Equipment Plasma"
 ranged_equipment_plasma_short:0 "Ranged Equipment Plasma"
 ranged_equipment_laser:0 "Ranged Equipment Laser"
 ranged_equipment_laser_short:0 "Ranged Equipment Laser"
 inf_anti_tank_equipment:0 "Broń przeciwpancerna"
 inf_anti_tank_equipment_short:0 "Broń przeciwpancerna"
 inf_anti_tank_equipment_desc:0 "Kategoria sprzętu używanego do przebijania i niszczenia ciężko opancerzonych pojazdów, takich jak czołgi, bojowe wozy piechoty (IFV) czy opancerzone transportery żołnierzy (APC)."
 inf_anti_tank_equipment_0:0 "Prymitywna broń przeciwpancerna"
 inf_anti_tank_equipment_0_short:0 "Prymitywna broń przeciwpancerna"
 inf_anti_tank_equipment_0_desc:0 "Mołotowy i działa wykonane z dużych rur, wykorzystujące karbid jako proch strzelniczy oraz ostrzone szyny jako amunicję. Choć brakuje im konwencjonalnej siły rażenia, z pewnością zatrzymają kierowcę czołgu i sprawią, że będzie się zastanawiał, co się właśnie wydarzyło."
 inf_anti_tank_equipment_1:0 "Improwizowana broń przeciwpancerna"
 inf_anti_tank_equipment_1_short:0 "Improwizowana broń przeciwpancerna"
 inf_anti_tank_equipment_1_desc:0 "Mołotowy, domowej roboty wyrzutnie rakiet, miny przeciwpancerne, miny zaczepne oraz improwizowane karabiny przeciwpancerne w stylu rusznicy Ur, mające wystarczającą moc, by jednocześnie zwichnąć ramię użytkownika i lekko zarysować pancerz czołgu przy jednym strzale."
 inf_anti_tank_equipment_2:0 "Zimnowojenna broń przeciwpancerna"
 inf_anti_tank_equipment_2_short:0 "Zimnowojenna broń przeciwpancerna"
 inf_anti_tank_equipment_2_desc:0 "Klasyczne uzbrojenie przeciwpancerne, głównie pochodzenia radzieckiego. Rzeczy takie jak RPG, TM-46 czy jakiekolwiek inne, które można zaliczyć do kategorii "stare, ale wciąż dobre"."
 inf_anti_tank_equipment_3:0 "Współczesna broń przeciwpancerna"
 inf_anti_tank_equipment_3_short:0 "Współczesna broń przeciwpancerna"
 inf_anti_tank_equipment_3_desc:0 "Zachodnie, importowane uzbrojenie przeciwpancerne lub kopie wschodnich systemów - nowoczesne broń, która może stanowić wyzwanie nawet dla europejskiego pancerza."
 special_forces_equipment:0 "Sprzęt jednostek specjalnych"
 special_forces_equipment_short:0 "Sprzęt jednostek specjalnych"
 special_forces_equipment_desc:0 "Kategoria sprzętu używanego przez żołnierzy specjalizujących się w określonych rolach."
 special_forces_equipment_0:0 "Znaleziony sprzęt jednostek specjalnych"
 special_forces_equipment_0_short:0 "Znaleziony sprzęt jednostek specjalnych"
 special_forces_equipment_0_desc:0 "Rzeczy pochodzące głównie z cywilnych źródeł, które można przystosować do specjalistycznych żołnierzy skoncentrowanych na walce w określonych rodzajach terenu, takie jak narzędzia i odzież do obozowania w górach, sprzęt do kopania i zakładania pułapek w gęstych lasach, kamizelki ratunkowe i suche skafandry, pontony, kajaki oraz łodzie morskie, które można transportować lądowo lub przystosować do skoków spadochronowych."
 special_forces_equipment_1:0 "Ustandaryzowany sprzęt jednostek specjalnych"
 special_forces_equipment_1_short:0 "Ustandaryzowany sprzęt jednostek specjalnych"
 special_forces_equipment_1_desc:0 "Sprzęt zaprojektowany specjalnie dla naszych sił specjalnych, taki jak trwalsze wojskowe spadochrony, wyposażenie dla wspinaczy i leśników, ghillie suity oraz łodzie i pontony dla naszego korpusu morskiego."
 special_forces_equipment_2:0 "Zaawansowany sprzęt jednostek specjalnych"
 special_forces_equipment_2_short:0 "Zaawansowany sprzęt jednostek specjalnych"
 special_forces_equipment_2_desc:0 "Nowoczesny sprzęt dla sił specjalnych, który umożliwia naszym jednostkom specjalnym skuteczne działanie w ich środowisku."
 special_forces_equipment_3:0 "Special Forces Equipment 3"
 special_forces_equipment_3_short:0 "Special Forces Equipment 3"
 robot_component_equipment:0 "Robot Component Equipment"
 robot_component_equipment_short:0 "Robot Component Equipment"
 robot_component_equipment_1:0 "Robot Component Equipment 1"
 robot_component_equipment_1_short:0 "Robot Component Equipment 1"
 robot_component_equipment_2:0 "Robot Component Equipment 2"
 robot_component_equipment_2_short:0 "Robot Component Equipment 2"
 mech_equipment:0 "Mech Equipment"
 mech_equipment_short:0 "Mech Equipment"
 mech_equipment_1:0 "Mech Equipment 1"
 mech_equipment_1_short:0 "Mech Equipment 1"
 mech_equipment_2:0 "Mech Equipment 2"
 mech_equipment_2_short:0 "Mech Equipment 2"
 mini_nuke_equipment:0 "Zminiaturyzowany ładunek atomowy"
 mini_nuke_equipment_short:0 "Zminiaturyzowany ładunek atomowy"
 mini_nuke_equipment_1:0 "Zminiaturyzowany ładunek atomowy"
 mini_nuke_equipment_1_short:0 "Zminiaturyzowany ładunek atomowy"
 strat_bomber_intercontinental_equipment:0 "Strat Bomber Intercontinental Equipment"
 strat_bomber_intercontinental_equipment_short:0 "Strat Bomber Intercontinental Equipment"
 strat_bomber_intercontinental_equipment_1:0 "Strat Bomber Intercontinental Equipment 1"
 strat_bomber_intercontinental_equipment_1_short:0 "Strat Bomber Intercontinental Equipment 1"
 kayak_hull:0 "Kayak Hull"
 kayak_hull_short:0 "Kayak Hull"
 kayak_hull_desc:0 "Znalezione bączki, kajaki i dmuchane pontony (takie same, jakich twój ojciec używał do wędkowania)."
 kayak_hull_equipment:0 "Kajak"
 kayak_hull_equipment_short:0 "Kajak"
 kayak_hull_equipment_desc:0 "Znalezione bączki, kajaki i dmuchane pontony (takie same, jakich twój ojciec używał do wędkowania)."
 apc_equipment:0 "Transporter opancerzony"
 apc_equipment_short:0 "Transporter opancerzony"
 apc_equipment_desc:0 "Kategoria pojazdów składająca się z różnych mocno opancerzonych pojazdów przeznaczonych do transportu piechoty. W tej kategorii znajdują się również technicale."
 apc_equipment_1:0 "Technical"
 apc_equipment_1_short:0 "Technical"
 apc_equipment_1_desc:0 "Nieuchwytny. Niezawodny. Niezniszczalny. Te wszystkie cechy są odpowiednie dla pojazdu każdego buntownika.\n\nPick-upy wyposażone w zamontowane karabiny maszynowe lub cięższe uzbrojenie, służące jako symbole władzy i prestiżu w sytuacjach wojny domowej. Na polu bitwy wypełniają niszę lekkiej kawalerii.\n\nAbsolutny klasyk pól bitew trzeciego świata."
 apc_equipment_2:0 "Improwizowany transporter"
 apc_equipment_2_short:0 "Improwizowany transporter"
 apc_equipment_2_desc:0 "Pokaźne cywilne samochody dostawcze i mikrobusy, które zostały częściowo ustandaryzowane, przystosowane do warunków terenowych, pokryte warstwą kuloodpornego pancerza i worków z piaskiem, a także wyposażone w jeden lub dwa karabiny zamontowane przy oknach lub w prowizorycznych wieżyczkach strzeleckich. Nawet sami projektanci nie wiedzą, dlaczego ten pojazd w ogóle działa."
 apc_equipment_3:0 "Zimnowojenny transporter"
 apc_equipment_3_short:0 "Zimnowojenny transporter"
 apc_equipment_3_desc:0 "Kupione lub znalezione i odnowione transportery opancerzone z wczesnego i średniego okresu zimnej wojny. Potwory uzbrojone w działa łańcuchowe i automatyczne armatki, zdolne spalić własny zapas diesla szybciej niż cała chińska gospodarka. Modele takie jak rodzina LAV II, sowieckie BTR-70 lub BTR-60 oraz ich polsko-czechosłowacka wersja - OT-64 SKOT."
 apc_equipment_4:0 "Współczesny transporter"
 apc_equipment_4_short:0 "Współczesny transporter"
 apc_equipment_4_desc:0 "Co przyniosły nam lata 90.? Internet, upadek ZSRR i konsolę Pegasus. Ale mniejsza z tym; po upadku ZSRR, Rosjanie w końcu zrozumieli, że bezpieczniej jest, gdy piechota wysiada z pojazdów z tyłu, a nie z boku, dlatego zaprojektowali BTR-80 i BTR-90, które wciąż mają drzwi po bokach. W międzyczasie Zachód zaczął dodawać systemy rakiet przeciwpancernych i bezzałogowe wieżyczki strzelnicze do swoich transporterów opancerzonych. Skopiowane Rosomaki, Partia AMV i inne zagraniczne projekty, takie jak BTR-90, Boxer, Saur 1, FNSS Pars i inne."
 mothership_equipment:0 "Mothership Equipment"
 mothership_equipment_short:0 "Mothership Equipment"
 mothership_equipment_0:0 "Mothership Equipment 0"
 mothership_equipment_0_short:0 "Mothership Equipment 0"
 ufo:0 "Pojazd z napędem antygrawitacyjnym"
 ufo_short:0 "Pojazd z napędem antygrawitacyjnym"
 ufo_desc:0 "Chciałbym wierzyć, że to w ogóle zadziała."
 ufo_0:0 "Pojazd z napędem antygrawitacyjnym"
 ufo_0_short:0 "Pojazd z napędem antygrawitacyjnym"
 motorbike_equipment:0 "Motorbike Equipment"
 motorbike_equipment_short:0 "Motorbike Equipment"
 motorbike_equipment_desc:0 "W Polsce powszechnie żartuje się z motocyklistów, nazywając ich "dawcami organów" i samobójczymi zapierdalaczami. W walce jednak ich prędkość może okazać się bardzo przydatna, ponieważ bardziej prawdopodobne jest, że zginiesz od przypadkowej kuli niż w wypadku na motocyklu."
 enduro_equipment:0 "Motocykl enduro"
 enduro_equipment_short:0 "Motocykl enduro"
 enduro_equipment_desc:0 "Motocykle zaprojektowane specjalnie do jazdy w trudnym terenie z dużymi prędkościami."
 sidecar_equipment:0 "Motocykl z bocznym wózkiem"
 sidecar_equipment_short:0 "Motocykl z bocznym wózkiem"
 sidecar_equipment_desc:0 "Motocykl z dodatkowym siedzeniem po boku."
 motorboat_hull:0 "Motorboat Hull"
 motorboat_hull_short:0 "Motorboat Hull"
 motorboat_hull_desc:0 "Nowoczesne małe kutry, łodzie hybrydowe, łodzie torpedowe lub łodzie patrolowe. Pod względem skali przypominają statki używane przez Serbską Flotę Rzeczną."
 motorboat_hull_equipment:0 "Zmodyfikowana motorówka/jacht"
 motorboat_hull_equipment_short:0 "Zmodyfikowana motorówka/jacht"
 motorboat_hull_equipment_desc:0 "Szybkie, małe cywilne jednostki różnego rodzaju (takie jak łodzie motorowe, kutry rybackie czy jachty), które zostały naprawione, odnowione i opancerzone w celu przystosowania ich do użytku wojskowego, w stylu somalijskich piratów."
 armored_motorboat_hull_equipment:0 "Łódź patrolowa"
 armored_motorboat_hull_equipment_short:0 "Łódź patrolowa"
 armored_motorboat_hull_equipment_desc:0 "Małe, nieco prymitywne jednostki wojskowe stworzone specjalnie do walki."
 torpedo_boat_hull_equipment:0 "Torpedowiec"
 torpedo_boat_hull_equipment_short:0 "Torpedowiec"
 torpedo_boat_hull_equipment_desc:0 "Nowoczesne małe kutry, łodzie hybrydowe, łodzie torpedowe lub łodzie patrolowe. Pod względem skali przypominają statki używane przez Serbską Flotę Rzeczną."
 motorboat_equipment:0 "Zmodyfikowana motorówka/jacht"
 motorboat_equipment_short:0 "Zmodyfikowana motorówka/jacht"
 motorboat_equipment_desc:0 "Szybkie, małe cywilne jednostki różnego rodzaju (takie jak łodzie motorowe, kutry rybackie czy jachty), które zostały naprawione, odnowione i opancerzone w celu przystosowania ich do użytku wojskowego, w stylu somalijskich piratów."
