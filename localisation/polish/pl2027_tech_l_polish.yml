 attack_monitor:0 "Duży kuter"
 attack_monitor_desc:0 "Jednostki wojenne średniej i małej wielkości - wystarczająco duże, aby mieć na pokładzie odpowiednie działa morskie, ale wciąż niewielkie w porównaniu do typowych okrętów wojennych."
 monitor:0 "Lekki okręt wojenny"
