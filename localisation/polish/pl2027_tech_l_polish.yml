 torpedo_boat_equipment:0 "Torpedowiec"
 torpedo_boat_equipment_short:0 "Torpedowiec"
 torpedo_boat_equipment_desc:0 "Nowoczesne małe kutry, łodzie hybrydowe, łodzie torpedowe lub łodzie patrolowe. Pod względem skali przypominają statki używane przez Serbską Flotę Rzeczną."
 motorized_equipment:0 "Motorized Equipment"
 motorized_equipment_short:0 "Motorized Equipment"
 motorized_equipment_1:0 "Samochód cywilny"
 motorized_equipment_1_short:0 "Samochód cywilny"
 motorized_equipment_2:0 "Zmodyfikowany samochód dostawczy"
 motorized_equipment_2_short:0 "Zmodyfikowany samochód dostawczy"
 motorized_equipment_2_desc:0 "Ciężarówki dostawcze, które zostały przystosowane do jazdy w trudnym terenie, aby ułatwić dostarczanie wszystkich tych słoików z rosołem i pomidorówką do naszych żołnierzy."
 motorized_equipment_3:0 "Prowizoryczna ciężarówka"
 motorized_equipment_3_short:0 "Prowizoryczna ciężarówka"
 motorized_equipment_3_desc:0 "Półstandaryzowane ciężarówki, które mają mniej więcej jednolity model, produkowane w prymitywnych warunkach."
 motorized_equipment_4:0 "Zimnowojenna ciężarówka"
 motorized_equipment_4_short:0 "Zimnowojenna ciężarówka"
 motorized_equipment_4_desc:0 "Stare, ale jare - klasyczne ciężarówki wojskowe, które są jednocześnie bardzo odporne na trudne warunki drogowe i niezwykle łatwe oraz tanie w produkcji. Nie tak wygodne ani szybkie jak nowoczesne modele, ale doskonale spełniają swoje zadanie."
 motorized_equipment_5:0 "Współczesna ciężarówka"
 motorized_equipment_5_short:0 "Współczesna ciężarówka"
 motorized_equipment_5_desc:0 "Nowoczesne modele wojskowych ciężarówek transportowych, które są odporne na uszkodzenia, trwałe i szybkie, a w przeciwieństwie do ciężarówek z czasów zimnej wojny, oferują rzeczywistą przestrzeń na nogi."
 nuclear_missile_equipment:0 "Nuclear Missile Equipment"
 nuclear_missile_equipment_short:0 "Nuclear Missile Equipment"
 nuclear_missile_equipment_1:0 "Nuclear Missile Equipment 1"
 nuclear_missile_equipment_1_short:0 "Nuclear Missile Equipment 1"
 nuclear_missile_equipment_2:0 "Nuclear Missile Equipment 2"
 nuclear_missile_equipment_2_short:0 "Nuclear Missile Equipment 2"
 railway_gun_equipment:0 "Railway Gun Equipment"
 railway_gun_equipment_short:0 "Railway Gun Equipment"
 railway_gun_equipment_1:0 "Railway Gun Equipment 1"
 railway_gun_equipment_1_short:0 "Railway Gun Equipment 1"
 railway_gun_equipment_1_desc:0 "Duże, kolejowe działa artyleryjskie rozpętujące piekło na pobliskich pozycjach wroga."
 railway_gun_equipment_2:0 "Działo kolejowe"
 railway_gun_equipment_2_short:0 "Działo kolejowe"
 railway_gun_equipment_2_desc:0 "Gigantyczne działa typu 'Spierdalaj-Wypierdalaj' z kalibrami zaczynającymi się od DWUSTU PIERDOLONYCH milimetrów, a nawet sięgającymi 500 mm. Niektóre z nich wystrzeliwują pociski większe niż ludzie. Jeden dobrze wymierzony strzał z tych potworów może zrównać z ziemią całe wioski."
