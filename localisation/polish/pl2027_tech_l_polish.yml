 better_januszex:0 "Ulepszenie infrastruktury komercyjnej i korporacyjnej"
 better_januszex_desc:0 "Our commercial infrastructure projects have managed to bring back some normalcy in our people's lives, but in order to fully bring them back to the XXIst century, we'll have to provide more than 80's sheet metal warehouses and kiosks. \n\nOur country's existing and future commercial infrastructure needs to be reelectrified and modernized: streets with shops need to be lit up again, shopping malls need to be repopulated by stores and corporate high-rises need to be resettled by poor office workers, toiling their lives away for their lovely corporate overlords."
 better_citystuff:0 "Better Citystuff"
 less_limits:0 "Less Limits"
