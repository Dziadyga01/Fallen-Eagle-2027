 helicopter_1:0 "Zmodyfikowany śmigłowiec cywilny"
 helicopter_2:0 "Uzbrojony stary śmigłowiec wielozadaniowy"
 helicopter_3:0 "Klasyczny śmigłowiec szturmowy"
 helicopter_4:0 "Współczesny śmigłowiec szturmowy"
 transport_helicopter_0:0 "Stary śmigłowiec wielozadaniowy"
 transport_helicopter_1:0 "Klasyczny śmigłowiec transportowy"
 transport_helicopter_2:0 "Współczesny śmigłowiec transportowy"
 light_artillery:0 "Lekka Artyleria"
 light_artillery1:0 "Machina miotająca"
 light_artillery2:0 "Prymitywny moździerz"
 light_artillery_upgrade1:0 "Bliskie wsparcie ogniowe"
 light_artillery_upgrade1_desc:0 "Wojna to praca zespołowa. Jeśli mamy wygrać, musimy zapewnić, że wszystkie części maszyny (czyli wszystkie sektory naszej armii) będą współpracować ze sobą. Armia złożona wyłącznie z piechoty będzie miała trudności z obroną i posuwaniem się do przodu na linii frontu, a załoga moździerzy pozostawiona sama sobie niewiele zdziała. Dlatego musimy nauczyć naszą piechotę i artylerzystów synchronizacji i wzajemnej pomocy, aby mogli skutecznie osiągnąć swoje cele w bitwie."
 light_artillery3:0 "Prowizoryczny moździerz"
 light_artillery_upgrade2:0 "Ogień pośredni"
 light_artillery_upgrade2_desc:0 "Wymaga to trochę praktyki, aby celnie ostrzeliwywać pozycje wroga bez bezpośredniego pola widzenia lub ustalać odpowiednią trajektorię metodą prób i błędów. Jednak wraz z rosnącą dokładnością i wygodą użycia naszych moździerzy zaczynamy dostrzegać potrzebę nauczenia naszych załóg moździerzy sztuki ognia pośredniego, aby w pełni wykorzystać ich uzbrojenie i uwolnić ich prawdziwy potencjał."
 light_artillery4:0 "Zimnowojenny/współczesny moździerz"
 light_artillery_upgrade3:0 "Wyspecjalizowane rodzaje pocisków"
 light_artillery_upgrade3_desc:0 "Pociski odłamkowe, pociski burzące, pociski fosforowe, pociski przeciwpancerne, pociski kierowane, a także pociski manewrujące. Bo każdy jest wyjątkowy i zasługuje na to, aby *wybuchnąć* w swój unikalny sposób."
 light_artillery5:0 "Moździerz samobieżny"
 heavy_artillery:0 "Wsparcie artyleryjskie"
 heavy_artillery_desc:0 "Jak sama nazwa wskazuje - wspiera resztę wojska. Artylerią."
 heavy_artillery2:0 "Prowizoryczna haubica"
 heavy_artillery_upgrade1:0 "Ogień precyzyjny"
 heavy_artillery_upgrade1_desc:0 "Strzelanie na oślep i obserwowanie, jak przypadkowe rzeczy przed tobą są rozrywane na strzępy jest fajne. Przynajmniej do momentu, gdy przypadkowo wysadzisz swoich żołnierzy. Dlatego, pomimo prymitywnego charakteru naszej artylerii, powinniśmy nauczyć naszych artylerzystów, jak prowadzić bardziej precyzyjny ogień oraz jak montować działa zgodnie z wytycznymi, aby w miarę możliwości przypominały konkretne modele."
 heavy_artillery3:0 "Drugowojenne haubica"
 heavy_artillery_upgrade2:0 "Częściowa standaryzacja"
 heavy_artillery_upgrade2_desc:0 "Aby ułatwić masową produkcję i użytkowanie amunicji w terenie, powinniśmy przynajmniej częściowo ustandaryzować nasze działa artyleryjskie, produkując kopie kilku konkretnych modeli lub dostosowując różne piece artyleryjskie do tych samych kalibrów."
 heavy_artillery4:0 "Zimnowojenna haubica"
 heavy_artillery_upgrade3:0 "Kierowane pociski artyleryjskie"
 heavy_artillery_upgrade3_desc:0 "Kierowane pociski artyleryjskie znane jako CLGP (ang. cannon-launched guided projectiles), to amunicja, która wykorzystuje systemy geokoordynacyjne do korekcji swojej trajektorii, aby wylądować bliżej celu lub bezpośrednio na nim. Chyba że w jakiś sposób spieprzysz namierzanie."
 heavy_artillery5:0 "Współczesna haubica"
 self_propelled_artillery:0 "Działo samobieżne"
 self_propelled_artillery_desc:0 "Kategoria artylerii która sama z siebie potrafi się poruszać"
 self_propelled_artillery_upgrade:0 "Podkręcanie"
 self_propelled_artillery_upgrade_desc:0 "Hmm... Okazuje się, że samochody z prowizorycznymi działami zamontowanymi na dachu są szybkie, ale z drugiej strony to absolutnie tragiczne bronie. Jeśli mamy używać samochodów jako podwozia dla naszych samobieżnych dział artyleryjskich, musimy najpierw przygotować je do użytku wojskowego, przekształcając je w lekko opancerzone samochody opancerzone z otwartymi wieżami uzbrojonymi w lżejsze, mniej prowizoryczne działa artyleryjskie."
 self_propelled_artillery2:0 "Technical z artylerią"
 self_propelled_artillery_upgrade1:0 "Taktyki artylerii samobieżnej"
 self_propelled_artillery_upgrade1_desc:0 "Możemy poprawić skuteczność naszych operatorów dział samobieżnych i przygotować ich na ten dzień, gdy usiądą za kierownicą prawdziwego samobieżnego działa artyleryjskiego, ucząc ich, że prawdziwa walka SPG to niestety nie tylko wykonywanie brawurowych przejazdów z zajebiście wielką armatą"
 self_propelled_artillery3:0 "Zimnowojenna artyleria samobieżna"
 self_propelled_artillery_upgrade3:0 "Dziedzictwo Kraba"
 self_propelled_artillery_upgrade3_desc:0 "Kraby zyskały wiele uwagi w 2022 roku, gdy pomogły ukraińskiej armii odeprzeć Rosjan. Ich sukces oraz reputacja, jaką zdobyły wśród rosyjskich najeźdźców oraz ukraińskich użytkowników, stały się źródłem dumy i nadziei dla Polaków zainteresowanych własną armią, którzy zaczęli dostrzegać, że być może polska armia wciąż ma w rękawie kilka asów. Nasi żołnierze, pragnący przynajmniej małego kawałka chwały dla Polski, mają nadzieję na odtworzenie sukcesu Kraba."
 self_propelled_artillery4:0 "Współczesna artyleria samobieżna"
 rocket_artillery:0 "Rocket Artillery"
 rocket_artillery2:0 "Rocket Artillery 2"
 rocket_artillery_upgrade1:0 "Zwiększona aerostabilność"
 rocket_artillery_upgrade1_desc:0 "Zrozumiałe jest, że rakieta składająca się z drewnianego patyka z przyczepionym zbiornikiem na paliwo nie będzie precyzyjna. Powinna jednak być w stanie lecieć w ładnym, szerokim łuku, zamiast krążyć w powietrzu jak ćma naćpana kokainą w *tym* okresie miesiąca."
 rocket_artillery3:0 "Rocket Artillery 3"
 rocket_artillery_upgrade2:0 "Systemy rakietowe z prawdziwego zdarzenia"
 rocket_artillery_upgrade2_desc:0 "Aby ulepszyć naszą artylerię rakietową, musimy porzucić prymitywne, samodzielnie zrobione rakiety i systemy wyrzutni rakiet, niezależnie od tego, jak bardzo były one tańsze i jak łatwo można było zdobyć lajki w Internecie, publikując zdjęcia naszych improwizowanych, madmaxowych konstrukcji bojowych."
 rocket_artillery4:0 "Zimnowojenna wyrzutnia rakietowa"
 rocket_artillery_upgrade3:0 "Zaawansowane pociski niekierowane i kierowane"
 rocket_artillery_upgrade3_desc:0 "GMLRS, ATACMS, PrSM - te nazwy wzbudzały strach w sercach Rosjan podczas straszliwej wojny na Ukrainie w 2022 roku, w której w pełni udowodniły swoją skuteczność, umożliwiając bardziej niszczycielskie ataki z większych odległości niż cokolwiek, co kiedykolwiek używał, produkował czy widział były Układ Warszawski. Z tymi bestiami w naszym arsenale, przesłonimy słońce, rozjarzymy niebo rakietowym paliwem oraz latającymi pozostałościami tego, co nasi wrogowie próbowali przeciwko nam wysłać..."
 rocket_artillery5:0 "Współczesna wyrzutnia rakietowa"
 anti_air:0 "Anti Air"
 anti_air_upgrade:0 "Celowanie z wyprzedzeniem"
 anti_air_upgrade_desc:0 "Jeśli musimy uciekać się do używania karabinów maszynowych przeciwko samolotom, jak w I wojnie światowej, musimy nauczyć się efektywnie nimi operować - ucząc naszych operatorów dział przeciwlotniczych, jak dokładnie przewidywać trajektorie ich pocisków oraz jak wrogie samoloty będą próbowały unikać ich ognia, umożliwiamy sobie poleganie na prostych karabinach maszynowych w obronie przed wrogimi flotami powietrznymi, przynajmniej do momentu, gdy zaczną one zawierać faktyczne maszyny bojowe."
 anti_air2:0 "Anti Air 2"
 anti_air_upgrade2:0 "Zimnowojenne działa przeciwlotnicze"
 anti_air_upgrade2_desc:0 "W miarę jak powoli zaczynamy wycofywać improwizowane pojazdy przeciwlotnicze, możemy już zacząć kupować i instalować odpowiednie działa przeciwlotnicze na naszych ciężarówkach bojowych, aby nie tylko zwiększyć nasze zdolności ofensywne, ale także mieć możliwość łatwego przenoszenia ich na odpowiednie pojazdy opancerzone."
 anti_air3:0 "Zimnowojenny samobieżny zestaw przeciwlotniczy"
 anti_air_upgrade3:0 "Radary i komputery balistyczne"
 anti_air_upgrade3_desc:0 "Wszystkie te nowe działa przeciwlotnicze są fajne i w ogóle, ale brakuje im czegoś - integracji nowoczesnej technologii. Komputery balistyczne, nowoczesne radary i tym podobne systemy, które pozwalają wykrywać obecność wrogich statków powietrznych zanim stanie się to fizycznie zauważalne (to znaczy: zanim w powietrzu pojawią się setki kul i około 20 rakiet zmierzających w naszą stronę)."
 anti_air4:0 "Współczesny samobieżny zestaw przeciwlotniczy"
 artillery_coordination1:0 "Podstawowy trening artylerzysty"
 artillery_coordination1_desc:0 "Podstawowe szkolenie, które sprawia, że nasza artyleria przynajmniej częściowo zachowuje się jak prawdziwa formacja wojskowa."
 artillery_coordination2:0 "Zaawansowany trening artylerzysty"
 artillery_coordination2_desc:0 "Przegląd taktyk i technik artyleryjskich stosowanych przez prawdziwe baterie artyleryjskie."
 artillery_coordination3:0 "Zaawansowany trening artylerzysty II"
 artillery_coordination3_desc:0 "Bardziej zaawansowane szkolenie dla naszych formacji artyleryjskich, które teraz będą miały jeszcze łatwiej z bezpiecznym przemieszczaniem się i precyzyjnym trafianiem w cele."
 artillery_coordination4:0 "Zaawansowany trening artylerzysty III"
 artillery_coordination4_desc:0 "Taktyki i techniki stosowane przez najbardziej zaawansowane i doświadczone formacje artyleryjskie armii. Dzięki tej elitarnej wiedzy nasi artylerzyści będą w stanie snajpersko trafiać cele na odległości setek, a nawet tysięcy metrów z *doskonałą* precyzją."
 post_collapse_assesment:0 "Poupadkowa reorganizacja"
 post_collapse_assesment_desc:0 "The Polish state has succumbed into chaos and disintegrated. Laws are enforced ad-hoc, most industries have died or stopped working and most people have to ration food, water and other resources due to the downfall of most supply chains and shops (besides Żabka. Żabka could survive a fucking nuclear disaster and still somehow capitalize on it), resulting in what is basically a light post-apo scenario. \n\nWe have to assess the damage done during the Fall to start rebuilding a new state out of the ruins of old Poland."
 improvised_radio:0 "Cywilna technologia radia i radarów"
 improvised_radio_desc:0 "As Poland vanished, so did most of its military infrastructure and equipment - most army facilities have been robbed clean or thrashed completely, leaving us only with civilian radios (usually household ones or old, portable ones used by fishing grandpas), walkie-takies used by kids and few civilian radars that usually serve single, very specific purposes. Thankfully, most cliques in Poland are as ragtag as us, so currently we're fine with civilian radios and radars that have been tinkered with to adapt them for army purposes."
 radio:0 "Radio"
 battlefield_management_systems:0 "Współczesny system zarządzania polem bitwy"
 battlefield_management_systems_desc:0 "A battlefield management system - BMS for short - is a system meant to integrate information acquisition and processing to enhance command and control of a military unit. Tech like this whould sharply increase our commandeering possibilities and the ease of acquiring data about the battlefield and the general terrain around it for both us AND for soldiers transmitting data to us."
 air_radio_control_1:0 "Prowizoryczne metody wykrywania lotnictwa"
 air_radio_control_1_desc:0 "Prowizoryczny plane detection techniques consisting of browsing the web for information on nearby air traffic and the usage of modified, civilian radars as aircraft detectors."
 air_radio_control_2:0 "Poprawione metody wykrywania lotnictwa"
 air_radio_control_2_desc:0 "Still provisionary, but improved in efficiency techniques of calculating the location of nearby enemy planes without proper army radars or other detection devices, such as knowledge on how to use images posted on the Internet to calculate enemy plane movement and which boards and sites are the best choices for gathering intel."
 air_radio_control_3:0 "Zimnowojenny radar"
 air_radio_control_3_desc:0 "Cheap military air radars that - given their age and Soviet origins - were probably used back in the Polish People's Army before getting sold and then bought back to Poland. Obviously, they're completely terrible compared to modern detection techniques."
 air_radio_control_4:0 "Współczesne metody wykrywania lotnictwa"
 air_radio_control_4_desc:0 "Współczesny military aircraft detection techniques and systems that help with detecting and dealing with most modern air vehicles used in armies."
 improvised_computing:0 "Cywilna informatyka rządowa"
 improvised_computing_desc:0 "We currently have to rely on mobile phones, handwritten documents and a few spare printers and laptops that belonged to people forming our new government, most of them still running Windows Vista. By gathering and restoring whatever civilian computers we can find, we can at least *partially* restore normalcy in how the government operates. At least in moments when the neighbouring warlords aren't burdening the power grid."
 early_civilian_computing:0 "Przywrócenie biznesowej i cywilnej informatyki"
 early_civilian_computing_desc:0 "As the chaos in the country died down, the emerging political movements became entrenched and people got used to living in a war-torn country, the population slowly started rebuilding itself, reestablishing their businesses and/or workplaces and using computers on a daily basis again, which sets us on a course to veeeeeeeeeeery slowly revert the brain drain that our country suffered from during the Fall."
 civilian_computing:0 "Przywrócenie systemu edukacji i podstawowych sektorów wojskowego rozwoju"
 civilian_computing_desc:0 "As our statelet grows in power and possesses more resources, we can finally start rebuilding the education sector of the government, reestablishing smaller, rural education facilities, providing them with resources and providing people with easier access to them. \nWe can also establish a proper - if very basic - military development sector in the army and the government, so that our army no longer has to test and adapt new equipment by testing it in a far-away field, hoping that it doesn't explode and instantly kill them during usage."
 imported_mainframes:0 "Przywrócenie elit technologicznych"
 imported_mainframes_desc:0 "As the country rebuilds itself, and more and more elements of pre-Fall life return back, our political and academic spheres start to claw back to life, with academies and universities slowly filling back in and various small political notions evolving amongst people. By luring parts of intelligentsia back to our country, we can start to properly revert the brain drain in our lands."
 military_grade_computing:0 "Wojskowa informatyka rządowa"
 military_grade_computing_desc:0 "As we've evolved into a proper state, our need for computing power, room for data storage and a proper military development sector in the government has increased tenfold. By establishing an advanced governmental military R&D body and restoring the military-grade governmental computers that used to serve the old Polish gov, we can finally enter the Proper Government Club and start operating as a proper, established power in Central Europe."
 reconnecting_to_www:0 "Logowanie do sieci"
 reconnecting_to_www_desc:0 "In order to grow our influence, enstreghten our agendas and make new connections with powerful factions, we need to establish a social media presence that will appeal to useful idiots such as jaded millenials, 12 year old redditors and weirdos enhabiting various imageboards. Having our own social media presence, it will be easy for us to "
 basic_opsec:0 "Podstawowe bezpieczeństwo operacyjne"
 basic_opsec_desc:0 "Guide on how to avoid blewing all of our plans by talking too much on the Internet: \n1) DO NOT TALK ABOUT OUR PLANS, GOALS AND LOCATIONS, 2) CHECK WHAT'S IN THE BACKGROUND OF PHOTOS TAKEN BY YOU, 3) DO NOT CLICK SHADY LINKS OR RUN SHADY PROGRAMS, 4) DO NOT BROWSE PORN ON COMPUTERS BELONGING TO GOVERNMENT BODIES, 5) IF YOU'RE ABOVE 45 YEARS OLD, LET THE YOUNGSTERS OPERATE YOUR WORK STATION - AT THIS POINT, YOU'RE JUST TOO OLD TO LEARN HOW TO USE A COMPUTER."
 vpn_and_tor:0 "Wirtualne sieci prywatne i trasowanie cebulowe"
 vpn_and_tor_desc:0 "To further secure our data, we can employ cheaply available civilian-grade encryption techniques, such as using VPNs and onion routing. A proper government would still have an easy time finding our Internet activity, but for Polish standards such measures will be more than enough. \n\nNow comes the hard part, however: how do we teach 60 years old clerks how to use Tor?"
 not_pegasus:0 "Eksklusywne sieci komunikacyjne"
 not_pegasus_desc:0 "With much more funds and power in our hands, we are finally able to create our own network for exchanging information between various government agencies - one inaccessible to anyone outside the government. Though we may still lack plenty of technical coding know-how, but at least it will be harder for enemy spies and saboteurs to search for our intelligence."
 military_grade_encryption:0 "Wojskowe szyfrowanie"
 military_grade_encryption_desc:0 "Proper, military-grade encryption used by governments and armies of the 21st century. With security like this, no amateur will be able to hijack our data and listen to our secret meetings."
 adhoc_trollbrigades:0 "Prowizoryczne brygady trolli"
 adhoc_trollbrigades_desc:0 "Cold War has ruined the public image of wars. World order set in 2001 started to break down and now people start to thirst for blood of others once more, yet war is still percieved as an ugly, and - most importantly - a very unnecessary thing. Because of that, every modern country that gets into conflicts with others employs internet trolls to sway people to their side and cover any mishaps that happened while they were enforcing their will upon others. We should do the same - let's recruit some people to start spreading propaganda in social media to turn people against our enemies and to make ourselves look better in their eyes."
 internet_troll_agencies:0 "Profesjonalne brygady trolli"
 internet_troll_agencies_desc:0 "Amateurish trolls can be useful, but over time people start to realise they're just shouting things on the Internet. Professional troll agencies, however, are able to sow so much disinformation and chaos in the Web to affect politics in other countries and create loyalists that support foreign regimes with their lives despite never having any contact with them or their countries. The past Russian government has mastered this technique, employing internet troll farms to dictate how anti-American politics are conducted on the Internet, and we should establish similar troll cells in our government to sow foreign support for our cause."
 ai_trollbots:0 "Brygady trolli i botów"
 ai_trollbots_desc:0 "The early '20s were a period of major development of machine learning bots. Bots of all kinds - image-creating bots, chat bots, and of course - trollbots. Trollbots that were fed with so many data samples, that they were almost able to pass the Turing test, as shown by a bot fed with samples from /pol/ that managed to fool many 4chan users into thinking that it's a real person. Over years, more and more such bots were employed by troll farms to spread agendas over the Internet, therefore, to increase the effeciency of our troll agencies, we should start investing into bots (let's start with simple ones) helping with sowing chaos in Internet discourses."
 advanced_ai_trollbots:0 "Profesjonalne boty trollujące ze sztuczną inteligencją"
 advanced_ai_trollbots_desc:0 "An advanced, machine-learning algorythm - a perfect propaganda machine, that lures edgy American teenargers and 'woke' horoscope-reading spiritualists into sacrificing their hearts and minds for an agenda that was made up by a bunch of old men fighting a war in Central Europe. If we were to find the right person that could create a bot like this for our purposes, our government's trolls could multiply the effectiveness and the reach of our troll agencies by tenfolds, potentially creating a permament mark on Internet politics and worldviews."
 improvised_ballistic_computer:0 "Cywilne komputery z integracją wojskową"
 improvised_ballistic_computer_desc:0 "We have barely any (if any at all) access to computers that whould allow us to use modern military vehicles and equipment - ergo, we have to resort to using normal, civilian computers that have been integrated with military tech, allowing us to use modern weapons or to use them as improvised onboard computers."
 ballistic_computer:0 "Zimnowojenna technologia wojskowa"
 ballistic_computer_desc:0 "Old military onboard computers (e.g. ballistic ones), radars, scanners and other toys that allows army boys to kill each other more effectively."
 modern_ballistic_computer:0 "Współczesna technologia wojskowa"
 modern_ballistic_computer_desc:0 "G.I. Joe shit used by modern military weapon systems and vehicles, such as onboard computers, radars, guiding lasers, etc."
 improvised_ballistic_missles:0 "Znaleziony pocisk balistyczny krótkiego zasięgu"
 improvised_ballistic_missles_desc:0 "Stare, pozostałe rakiety znalezione w opuszczonych obiektach Polskich Sił Zbrojnych. Choć technologicznie są porównywalne z większością balistycznych rakiet z czasów zimnej wojny, większość z nich nie ma paliwa lub została już porośnięta mchem i roślinnością."
 ww2_ballistic_missles:0 "Prowizoryczny pocisk balistyczny krótkiego zasięgu"
 ww2_ballistic_missles_desc:0 "Stare, pozostałe rakiety, które zostały ponownie napełnione paliwem i oczyszczone, aby wyglądały jak nowe przez te kilka sekund przed zderzeniem z ziemią."
 modern_ballistic_missles:0 "Klasyczny pocisk balistyczny krótkiego zasięgu"
 modern_ballistic_missles_desc:0 "Pociski z wcześniejszego okresu zimnej wojny, które zostały albo znalezione przez jednego z polskich watażków, albo zakupione na czarnym rynku, na przykład w Rosji."
 laser_guided_missles:0 "Zimnowojenny pocisk balistyczny krótkiego zasięgu"
 laser_guided_missles_desc:0 "Pociski balistyczne z późnego okresu zimnej wojny, które są bardziej zaawansowane i destrukcyjne niż ich wcześniejsze modele, ale wciąż mają pewne trudności z nowoczesnymi systemami obrony przeciwrakietowej."
 intercontinental_ballistic_missles:0 "Współczesny pocisk balistyczny krótkiego zasięgu"
 intercontinental_ballistic_missles_desc:0 "Najbardziej zaawansowana forma rozwalania budynków cywilnych z odległości kilkuset kilometrów"
 school_of_the_lion_silent_hunters:0 "Silent Witchers"
 basic_fortification_tech:0 "Basic Fortification"
