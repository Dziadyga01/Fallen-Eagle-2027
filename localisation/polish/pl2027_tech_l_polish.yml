 excavation2:0 "Excavation 2"
 excavation3:0 "Excavation 3"
 primitive_high_tech_industry:0 "Profesjonalna kradzież kabli"
 primitive_high_tech_industry_desc:0 "We can supply ourselves with found, old electronics by recruiting people who already have some experience with stealing electronic wires and dumpster diving, and speaking of cable theft - do you remember how people before the Fall used scare off cable thieves? How they'd call cops on them? How they'd shout at them that they should 'get a real job' and that they should 'stop being homeless fucks who waste their life savings on alcohol'? Yeah, I wonder how those dumbasses feel NOW when these 'homeless fucks' are supplying the whole nation in cables and circuitry!"
 basic_high_tech_industry:0 "Repurposed Civilian Electronics"
 basic_high_tech_industry_desc:0 "Plenty of still functioning PC rigs and screens can be found in abandoned houses that scavengers didn't manage to break into. These machines - used previously to run the newest CoD and Arma installments at a whopping +20 frames per second - are just begging to be used by our military for what such games are trying (...or at least claiming) to replicate: actual combat. \n...so what that our armored vehicles are going to be operated using Xbox pads? I've even heard some soldiers actually prefer driving them by using console pads over their native steering devices!..."
 advanced_high_tech_industry:0 "Chinese-Style Tech & Electronics Factories"
 advanced_high_tech_industry_desc:0 "If we are to truly modernize our military, we have to have a developed tech & electronic systems manufacturing sector, and if we are to revive our mil-tech industry, we'll need to bring back the manufacturing of simple electronics first to then move up and restore the production of more advanced military tech of it. Let's begin by establishing low-cost electronic devices factories that employ thousands of badly paid workers. \nStep aside, China - it's OUR time to trap hundreds of people in factories to make iPhones for rich westerners!"
 world_renown_high_tech_industry:0 "Military High-Tech & Electronics Industry Revival"
 world_renown_high_tech_industry_desc:0 "Our state has completely changed over the years, evolving from a small clique centered around a bunch of hooligans commanded around by some old, rich people into a state with a proper, modern, *computerized* army - one whose very weapons make complex calculations to provide their users with information and guide their missiles to score pinpoint hits on enemy positions and vehicles. \nSuch smart weaponry costs extreme amounts of cash on the market, so supplying ourselves in foreign-made models only is a no-no at this point -- we have to kickstart our own production of smart weapons and military computers instead."
 basic_recycling:0 "Badania terenów opuszczonych"
 basic_recycling_desc:0 "Our ''army'' lives off found items left behind by those who escaped or perished during the Fall, collecting tools, materials and even their service weapons from locations near their posts. All this work must be very tiring to them, however, and we should relieve them from this. \nWe need to survey the areas abandoned during the Fall and thoroughly search through them, collecting any supplies that can be used by our troops and sending them to 'em so that they don't have to bother with scavenging for supplies themselves."
 improved_recycling:0 "Zinstytucjonalizowana gospodarka odpadami"
 improved_recycling_desc:0 "Bringing trash recycling facilities back to function could greatly raise the standard of living in our lands by restoring everyday items like bottles or cans back to a serviceable state, reducing their scarcity and thus - the amount of hoarding of trash everyday citizens have to do. Sure, we might be ideologically opposed to this and sure, it will be very costly, but - counterpoint: \na) who said we can't use this to punish people \nand b) ...who said we have to pay them?"
 advanced_recycling:0 "Odrodzenie przemysłu metalurgicznego"
 advanced_recycling_desc:0 "As our army increases in size and we simultaneously move towards forming armored corps, we need to make sure we've got enough equipment to give them. To have enough equipment, we need to produce enough stuff to make that equipment from - and thankfully, it doesn't take a genius to reforge some scrap into a big metal donut. \nWe have enough money and usable scrap to partially restart the fragments of steel industry that reside in our lands. Soon, we can have our own, properly made knives, shovels, guns, cars and even simplistic tanks."
 basic_coalstuff:0 "Pionierzy rzemiosła górniczego"
 basic_coalstuff_desc:0 "Mining in bootleg pits ain't easy, son. Random people thrown into the mines with the hope that they won't send the mine's ceiling crashing down are too unreliable and unprepared for hard physical work underground for 15 hours at a time. \n\nWe need SPECIALISTS. The most crafty and resilient types -- those who can endure crawling though a suffocating wooden tunnel for long enough to strike it big. It's those specific people we should rely on to provide us with the black stuff."
 improved_coalstuff:0 "Odrodzenie przemysłu górniczego"
 improved_coalstuff_desc:0 "No matter if it's a strip mine, a shaft mine or an open-pit mine, digging for coal ultimately boils down to hitting dirt with a shovel or a pick. And what's so hard in bringing a couple of elevators and air pumps glued to a tunnel back to function? We're perfectly capable of restoring our country's coal mines without any hardships. \n\nWe'll just have to ignore their profitability."
 advanced_coalstuff:0 "Nowoczesne kopalnie węgla"
 advanced_coalstuff_desc:0 "Poland managed to quickly reestablish her communist economy into a free market one, but in order to do so, she had to sacrifice her mining industry. Due to this, plenty of coal mines in the country remain in an unrenovated, outdated Cold War-era form, lagging behind modern ones in efficiency. So -... \n\n...if we are to fully restore them to function, we might as well renovate and upgrade them, right?"
 basic_smelters:0 "Małe zakłady produkcyjne stopów wysokiej jakości"
 basic_smelters_desc:0 "Attempting to develop an industry producing tank armor-issue materials whilst ruling over a bumfuck statelet that hasn't even developed a proper infantry army seems like a lost cause... \n\n...because it is, but by organizing at least a few small alloy producing plants we could potentially start supplying ourselves in enough military-grade metal to be able to conduct very basic, uncomplicated repairs of armored vehicles we managed to purchase from abroad."
 improved_smelters:0 "Zastosowanie metali wysokiej jakości"
 improved_smelters_desc:0 "With more money in our hands and less bombs flying over our industrial centers that might accidentally set off some weird chemical reaction in one of our metal-making facilities that would burn it and the entire city surrounding it, we're more easily able to supply ourselves in higher-grade, less commonly available materials used to produce vehicle armor that's harder, better, lighter and stronger."
 advanced_smelters:0 "Wielkoskalowa produkcja stopów metali wysokiej jakości"
 advanced_smelters_desc:0 "Since we're getting closer and closer to completely restoring the country's borders, we have to start preparing our troops to defend the country from foreign forces - ones that aren't composed of ragtag militias with just a few properly organized units hidden among the ranks. In order to at the very least bog down any invading forces, we need to at least be able to produce our own rockets or drones and to outfit old vehicles with some additional armor made of more durable, advanced materials."
 wind_farm:0 "Elektrownia OZE"
 wind_farm_desc:0 "Podstawowy koszt budowy: §Y500 milionów§!\nPodstawowy miesięczny koszt utrzymania: §Y2 miliony§!\n§YKwoty mogą ulegać zmianie§!\n\n§RUWAGA! Pieniądze przeznaczone na budynek będą odjęte od budżetu dopiero PO jego zbudowaniu. Zaplanuj swój budżet z odpowiednim wyprzedzeniem.§!\n\nPowietrze! Woda! Słońce! Geotermia! Biomasa! Z połączenia tych mocy powstałem ja, Kapitan Planeta!\n\nNie zużywa żadnych surowców, lecz wytwarza mniej energii\n\nDostarcza §G+750§!£energy_texticon"
 power_generation:0 "Elektrownia Węglowa"
 industry_revival:0 "Pełna Reunifikacja"
 public_services:0 "Etap Subregionalny"
 melee_weapons:0 "Broń Biała"
 melee_weapons_upgrade:0 "Ząbkowanie"
 melee_weapons_upgrade_desc:0 "W powojennej Polsce brutalna siła jest jedynym i ostatecznym argumentem. Nikt nie przejmuje się zasadami wojny - każdy może być ofiarą. Szczególnie że ludzie umierają na lewo i prawo, nawet poza polem bitwy, z powodu braku środków medycznych i infrastruktury. Jedynym sposobem, by uniknąć śmierci, jest grać nieczysto, a mówiąc o nieczystości: wszystkie te zardzewiałe noże i narzędzia leżące w pobliżu mogą się przydać, zwłaszcza po dodaniu nowych zębów na ich ostrzach."
 melee_weapons1:0 "Ustandaryzowana broń biała"
 melee_weapons_upgrade_1:0 "Odpowiednia renowacja i konserwacja"
 melee_weapons_upgrade_1_desc:0 "Nasi żołdacy otrzymali broń dostosowaną do ich ról. Zostały one odpowiednio odnowione - teraz są ich, więc muszą przetrwać długo i być w dobrym stanie. Dzięki przekazaniu naszym wojskom podstawowych informacji na temat konserwacji oraz zapewnieniu ogólnodostępnego dostępu do sprzętu takiego jak papier ścierny, kamienie do ostrzenia i taśma o dużej wytrzymałości, możemy zapewnić, że ich broń nie złamie się w połowie ani nie okaże się całkowicie tępa, gdy będą próbowali nią kogoś pokonać.."
 melee_weapons2:0 "Broń biała użytku specjalistycznego"
 melee_weapons_upgrade_2:0 "Trening walki wręcz"
 melee_weapons_upgrade_2_desc:0 "Dźganie bez ryzyka bycia dźgniętym w zamian. Pacyfikowanie wrogich bojowników pojedynczym uderzeniem pałki w głowę. Precyzyjne cięcia siekierą w kierunku wrogów. Nauka fechtunku.\n\nTrenując nasze oddziały walki wręcz w sztuce walki, zapewniamy, że gdy dwie grupy brutali spotkają się na polu bitwy, grupa, która należy do nas, wróci z tej konfrontacji z tarczą, a nie na tarczy. O ile takową w ogóle dostaną."
 melee_weapons3:0 "Wojskowa broń biała"
 melee_weapons_upgrade_3:0 "Taktyki bezpiecznego szturmu"
 melee_weapons_upgrade_3_desc:0 "W miarę jak wszystkie zdziczałe armie i bandyckie grupy przekształcały się w pełnoprawne siły zbrojne, broń palna stała się stałym elementem na polskich polach bitew. Jeśli mamy nadal wykorzystywać oddziały dedykowane do walki na bliski zasięg, musimy opracować taktyki, które pozwolą naszym ludziom zbliżyć się do wrogów bez otrzymywania 20 kul prosto w twarz."
 melee_weapons4:0 "Broń biała najwyższej klasy"
 melee_weapons_upgrade_4:0 "Mistrzostwo w walce w zwarciu"
 melee_weapons_upgrade_4_desc:0 "Opanowaliśmy walkę w bliskim kontakcie w miastach dzięki połączeniu innowacyjnemu systemowi infiltracji pozycji wroga oraz umiejętnego pozycjonowania i dynamicznego ruchu. Sprytni i niezwykle skuteczni, nasi szturmowcy nastawieni na walkę wręcz potrafią bez trudu utrzymać i przełamać wszelkie linie obrony w miastach."
 ranged_weapons:0 "Broń Dystansowa"
 ranged_weapons_upgrade:0 "Broń dni minionych"
 ranged_weapons_upgrade_desc:0 "Brak nam broni palnej, dlatego musimy sięgać po najprostsze, najbardziej prymitywne metody zabijania ludzi z daleka. Dlatego powinniśmy zaadaptować broń naszych przodków: łuki, kusze, proce i oszczepy - oręż, który łatwo wyprodukować bez specjalistycznych narzędzi, a która wciąż może zabić i dać przewagę nad ludźmi uzbrojonymi tylko w łopaty i bagnety."
 ranged_weapons1:0 "Broń pneumatyczna"
 ranged_weapons_upgrade1:0 "Prowizoryczne strzelby pneumatyczne"
 ranged_weapons_upgrade1_desc:0 "Broni pneumatycznej brakuje zasięgu i rażenia obalającego w porównaniu do konwencjonalnej broni palnej, co ogranicza jej użyteczność poza starciami w zwarciu. Choć niewiele możemy zrobić w kwestii ich efektywnego zasięgu, możemy na przykład dostosować je do użycia specjalnie na krótkich i średnich dystansach, dodając po prostu więcej śrucin na pocisk, aby zwiększyć ich moc rażenia obalającego. Bo jak wszyscy wiedzą - jeśli problemu nie da się rozwiązać za pomocą broni, to najlepszym sposobem na jego rozwiązanie jest użycie WIĘKSZEJ ilości broni.\n\nA tak właściwie to większej ilości śrutu."
 ranged_weapons2:0 "Prowizoryczna broń palna"
 ranged_weapons_upgrade2:0 "Standardy bezpieczeństwa"
 ranged_weapons_upgrade2_desc:0 "Zrozumiałym jest, że trudno jest skonstruować działającą broń z samych sprężyn i rur, siedząc w stodołach i piwnicach, ale powinniśmy mimo wszystko wprowadzić pewne standardy bezpieczeństwa dla naszych broni, by nie wybuchały w naszych rękach tylko dlatego, że do komory wpadł mały okruch chleba."
 ranged_weapons3:0 "Zimnowojenna broń palna"
 ranged_weapons_upgrade3:0 "Zimnowojenny sprzęt optyczny"
 ranged_weapons_upgrade3_desc:0 "Możemy posiadać broń do prowadzenia wojen na dużą skalę, ale wciąż brakuje nam technologii do jej efektywnego wykorzystania. Wdrożenie starych, radzieckich celowników, sprzętu do nocnego widzenia i widzenia termalnego oraz innych urządzeń służących do śledzenia ruchów i obserwacji pozycji wroga mogłoby nam w tym pomóc. Tylko proszę, nie używajcie tych rzeczy do szpiegowania wrogów podczas kąpieli."
 ranged_weapons4:0 "Współczesna broń palna"
 ranged_weapons_upgrade4:0 "Specjalne rodzaje amunicji"
 ranged_weapons_upgrade4_desc:0 "Jedną z zalet broni z późniejszych dni NATO jest standaryzacja kalibrów wśród broni tego samego typu. Dzięki temu, że te same naboje pasują do większości karabinów w jednostce, możemy znacznie wygodniej wdrażać specjalne typy amunicji do naszej armii, ponieważ nie musimy już kupować 20 różnych kalibrów spełniających ten sam cel."
 ranged_weapons5:0 "Współczesna broń palna z dodatkami"
 inf_antitank_1:0 "Improwizowana broń przeciwpancerna"
 inf_antitank_upgrade:0 "Pocisk pełnokalibrowy z czepcem"
 inf_antitank_upgrade_desc:0 "Poprzez użycie specjalnych nasadek wykonanych z słabszego metalu w naszych broniach przeciwpancernych, jesteśmy w stanie ograniczyć rozpryskiwanie pocisku/strzały/czegokolwiek, co wystrzeliwujemy w kierunku wrogów."
 inf_antitank_2:0 "Zimnowojenna broń przeciwpancerna"
 inf_antitank_upgrade1:0 "Pocisk pełnokalibrowy z rdzeniem"
 inf_antitank_upgrade1_desc:0 "Dodanie bardzo ciężkiego i wytrzymałego metalowego rdzenia wewnątrz pocisku zapewnia lepsze właściwości przebijania pancerza, ponieważ rdzeń przejmuje funkcje zarówno nasadki, jak i nasadki balistycznej."
 inf_antitank_3:0 "Współczesna broń przeciwpancerna"
 inf_antitank_upgrade2:0 "Pocisk kumulacyjny"
 inf_antitank_upgrade2_desc:0 "Podstawa nowoczesnych osobistych broni przeciwpancernych. Takie pociski po trafieniu tworzą strumień metalicznego nadplastyku o wysokiej prędkości, który jest w stanie przebić nawet największe i najsilniejsze pancerze."
 infantry_training:0 "Szkolenie Wojskowe"
 infantry_training_desc:0 "'Skacz, zrób dziesięć przysiadów, a potem dwadzieścia pompek.' - najprostszy trening fizyczny, który przygotowuje naszych chłopaków do akcji."
 infantry_training1:0 "Podstawowe szkolenie piechoty"
 infantry_training1_desc:0 "Szkolenie w udzielaniu pierwszej pomocy poległym towarzyszom oraz przechodzenie krok po kroku przez podstawowe taktyki bojowe znacznie zwiększy przeżywalność naszych żołnierzy i jest pierwszym krokiem do przekształcenia ich w prawdziwą armię, zamiast bardziej lub mniej zorganizowanej hołoty, jaką są obecnie."
 infantry_training2:0 "Zaawansowane szkolenie piechoty"
 infantry_training2_desc:0 "Ekstremalnie efektywny i ważny sposób na poprawienie odruchów, celności oraz samodzielnego myślenia naszych żołnierzy w trakcie akcji to zorganizowanie intensywnych i bolesnych meczów paintballowych, w których będą musieli stawiać czoła sobie nawzajem. Przed wdrożeniem tego systemu po prostu wystrzeliwywaliśmy w nich całe magazynki kulek z farbą."
 infantry_training3:0 "Zaawansowane szkolenie piechoty II"
 infantry_training3_desc:0 "Trening fizyczny i psychiczny, który zapewnia, że nasi żołnierze nie załamią się pod wpływem surowej rzeczywistości walk w czasach postupadkowych."
 infantry_training4:0 "Zaawansowane szkolenie piechoty III"
 infantry_training4_desc:0 "Techniki dowodzenia wojskowego i prowadzenia działań, które jednocześnie przygotowują nas do walki na dużą skalę, nie pomijając naszych doświadczeń oraz zdolności do obrony przed taktykami partyzanckimi stosowanymi przeciwko mniejszym watażkom."
 infantry_training5:0 "Zaawansowane szkolenie piechoty IV"
 infantry_training5_desc:0 "Metody szkolenia zainspirowane byłymi standardami NATO, wzbogacone o nasze własne doznania z Polskiej Wojny Domowej. Dzięki tak doskonałemu treningowi i ogromnemu doświadczeniu w armii, nasi wrogowie mogą liczyć na to, że będziemy na nich gotowi. Będziemy skuteczni. Będziemy zabójczy. Nawet jeśli miałaby zostać przeprowadzona wspólna inwazja europejsko-rosyjska, jeśli mury miałyby się zawalić - przetrwamy. Będziemy walczyć. I W KOŃCU... może W KOŃCU nasi żołnierze nauczą się, że '4' w rzymskich liczbach zapisuje się jako 'IV', a nie 'IIII'."
 infantry_armor1:0 "Znaleziony sprzęt ochronny"
 infantry_armor1_desc:0 "Znalezione ochraniacze na kolana, ochraniacze na łokcie, kaski rowerowe i motocyklowe itp. Nie ochronią cię przed nożem, ale przynajmniej nie zadrapiesz kolan, gdy upadniesz na ziemię po zadaniu ciosu."
 infantry_armor2:0 "Improwizowane płyty ochronne"
 infantry_armor2_desc:0 "Metalowe płyty mające na celu (częściową) ochronę przed bronią białą i odłamkami. Nie tak wypasione jak pełne metalowe zbroje z czasów I wojny światowej, ale bardziej skuteczne i znacznie łatwiejsze do noszenia."
 infantry_armor3:0 "Stare kamizelki kuloodporne"
 infantry_armor3_desc:0 "Kamizelki kuloodporne chroniące przed odłamkami z pocisków wybuchowych, takimi jak fragmenty granatów czy odłamki pocisków przeciwlotniczych. Mimo wszystko, nie zapewnią ochrony przed kulą."
 infantry_armor4:0 "Sprzęt policyjny do tłumienia zamieszek"
 infantry_armor4_desc:0 "Groźnie wyglądająca zbroja policyjna do tłumienia zamieszek, zaprojektowana w celu ochrony przed atakami z bliskiej odległości, w tym przed pociskami małokalibrowymi."
 infantry_armor5:0 "Nowoczesny sprzęt ochronny"
 infantry_armor5_desc:0 "Nowoczesny sprzęt ochronny, który zapewnia użytkownikowi przetrwanie w przypadku nieprzyjemnego frontalnego spotkania z pociskiem."
 army_uniform:0 "Znalezione przypadkowe ubrania"
 army_uniform_desc:0 "Rzeczy wystarczająco grube, by złagodzić cios nożem lub uderzenie pałką. Dosłownie wszystko mieści się w tej kategorii, od grubych bluz i zimowych kurtek po dywany używane jako prowizoryczne peleryny ochronne."
 army_uniform1:0 "Ubrania z kamuflażem"
 army_uniform1_desc:0 "Wszystko, co pokryte jest wzorami kamuflażowymi, od bluz i majtek po stare mundury wojskowe i harcerskie. Większość z nich nie pasuje, ma dziury i nie jest rzeczywiście przeznaczona do walki."
 camouflage_upgrade1:0 "Stare mundury i kamizelki bojowe"
 camouflage_upgrade1_desc:0 "Większość 'wojskowych' ubrań, których dotychczas używaliśmy, to po prostu zwykłe ciuchy lub takie z wojskowym nadrukiem, które nie nadają się do kamuflażu. Zamiast tego powinniśmy ponownie dostosować stare mundury i kamizelki bojowe, które zostały rzeczywiście zaprojektowane do walki i przetestowane w praktyce."
 army_uniform2:0 "Zimnowojenne wzory kamuflażu"
 army_uniform2_desc:0 "Nieco nowsze (ale wciąż bardzo stare - po prostu nie TAK stare) wzory kamuflażu, które polska armia stosowała, gdy Polska jeszcze istniała."
 camouflage_upgrade2:0 "Współczesne mundury i kamizelki bojowe"
 camouflage_upgrade2_desc:0 "Nowoczesne mundury wojskowe i kamizelki bojowe, porównywalne z tymi używanymi przez większość armii krajów drugiego świata. Ponieważ to Polska, wciąż stosują wzory kamuflażu, które są przestarzałe o co najmniej 20 lat - dzięki wszystkim betonowi w naszej armii."
 army_uniform3:0 "Współczesne wzory kamuflażu"
 army_uniform3_desc:0 "Teraz, gdy jesteśmy 'prawie' prawdziwym państwem, w końcu możemy naprawić największy błąd starej polskiej armii: przestarzałe wzory kamuflażu.\nOk, ale teraz na poważnie: nawet Ukraina zdołała szybko opracować coś znacznie bardziej nowoczesnego i odpowiedniego od sytuacji w 2014 roku kiedy wybuchła wojna w Donbasie, podczas gdy my tylko siedzieliśmy na tyłkach i wciąż lamentowaliśmy: "ŁEEEE TO ZBYT DROGIE, ŻEBY ZAPROJEKTOWAĆ COŚ NOWEGO ŁEEEEEEE NIE MOŻEMY SOBIE POZWOLIĆ NA ODPOWIEDNIE WYPOSAŻENIE NASZEJ ARMII KWIIIIIIIIIIII".\nSerio... no naprawdę, czas w końcu zrobić coś z tym, co nosi nasza armia."
 special_forces_equipment1:0 "Ustandaryzowany sprzęt jednostek specjalnych"
 special_forces_equipment2:0 "Zaawansowany sprzęt jednostek specjalnych"
 special_forces_training:0 "Szkolenie Sił Specjalnych"
 special_forces_training_desc:0 "Podstawowe szkolenie piechoty, które obejmuje również przegląd najważniejszych celów i taktyk stosowanych przez ich jednostki, takich jak bardziej zorganizowany ruch w trudnym terenie czy wykorzystywanie tegoż terenu przeciwko wrogom."
 special_forces_training2:0 "Zaawansowany trening jednostek specjalnych"
 special_forces_training2_desc:0 "Szkolenie technik walki stosowanych przez ludzi z najtrudniejszych regionów i najsilniejszych jednostek. Nasi górale będą strzelać zza skał i szorstkich szczytów jak Taliban, nasi specjaliści leśni i partyzanci będą się ukrywać jak Wietkong, nasi marines zdobędą najbardziej umocnione wybrzeża jak fale tsunami, a nasi spadochroniarze wylądują bezpiecznie i spokojnie."
 special_forces_quantity:0 "Wiejski pobór"
 special_forces_quantity_desc:0 "W miarę jak nasze granice się poszerzają, zwiększa się również różnorodność naszego krajobrazu. Rekrutacja zarówno z serca naszego kraju, jak i z prowincjonalnych wsi, które już teraz muszą radzić sobie z surowszym życiem i terenem, zapewni nam zarówno *więcej* siły roboczej, jak i *bardziej doświadczoną* siłę roboczą."
 special_forces_quantity1:0 "Wyspecjalizowany pobór"
 special_forces_quantity1_desc:0 "Rekruci, którzy są już zaznajomieni z typami terenu, na którym potrzebujemy wojsk, powinni być automatycznie przydzielani do przyszłej służby w odpowiednich elitarnych jednostkach. Nie ma sensu, aby Mazur, który całe życie spędził na wędkowaniu i kajakarstwie, marnował swoją wiedzę i doświadczenie na siedzeniu w tylnej linii jako artylerzysta."
 special_forces_quantity3:0 "Duma lokalna"
 special_forces_quantity3_desc:0 "Bersaglieri, arditi, gurkhowie - to przykłady znanych jednostek regionalnych, które są źródłem lokalnej dumy dla swoich ojczyzn. A mówiąc o dumie - nacjonalizm i duma to jedne z najłatwiejszych do wykorzystania uczuć, które od wieków były używane przez różne rządy, aby skłonić ludzi do służby w ich armiach. Wykorzystując sentymenty regionalne wśród naszych górskich, leśnych i nadmorskich populacji, możemy stworzyć nową tożsamość specjalności i służby dla państwa, co z kolei może budować opowieści i legendy o ich osiągnięciach, przyciągając setki nowych rekrutów pragnących dorównać imionom swoich lokalnych bohaterów."
 special_forces_quality:0 "Lokalny pobór"
 special_forces_quality_desc:0 "W miarę jak nasze granice się poszerzają, różnorodność krajobrazu również rośnie - po co poświęcać dodatkowy czas i zasoby na przekształcanie Warszawiaków czy innych mieszkańców miast w górali, leśnych partyzantów czy żołnierzy morskich, gdy możemy szukać rekrutów wśród wieśniaków, którzy już zajmują konkretne rodzaje terenu? To dodatkowe doświadczenie w życiu w mniej optymalnych warunkach będzie przydatne, jeśli chcemy stworzyć siły odpowiedzialne za radzenie sobie z bardzo specyficznymi polem bitwy."
 special_forces_quality1:0 "Sztuka przetrwania"
 special_forces_quality1_desc:0 "Trudno jest zapewnić zaopatrzenie jednostkom, których zadaniem jest podejmowanie najcięższych walk lub ukrywanie się w górach i lasach. Jeśli zamierzamy utrzymać tak wielu ludzi w naszych specjalnych batalionach, musimy nauczyć ich, jak zbierać pożywienie i kraść jedzenie od lokalnej ludności, a nawet jak przetrwać dzień lub dwa na pusty żołądek."
 special_forces_quality3:0 "Duma naszego wojska"
 special_forces_quality3_desc:0 "Podobnie jak amerykańscy marines zdobyli swoją reputację, zajmując się najniebezpieczniejszymi operacjami, które zleca im armia USA, nasze specjalne wojska szczycą się walką w najgorszych warunkach, często wykorzystując te warunki jako dodatkowe narzędzie w swoich rękach. Biorąc pod uwagę dość prymitywne środki, jakimi musimy walczyć, ich zwycięstwa i przebiegłość są jeszcze bardziej imponujące."
