 better_city_stuff:0 "Odbudowana sieć szkolnictwa wyższego"
 better_city_stuff_desc:0 "Though our universities were reduced to mere ruins, and our professors scattered like leaves in the wind, the pursuit of knowledge cannot be extinguished so easily. With great effort (and a fair bit of bartering for intact textbooks), we have begun rebuilding a network of higher education institutions. While some faculties operate out of abandoned shopping malls and professors are paid in potatoes, the wheels of academia are turning once more."
 coal_deposit_unlock_1:0 "Odblokowuje kolejny poziom złóż węgla"
 coal_deposit_unlock_2:0 "Odblokowuje kolejny poziom złóż węgla"
 coal_deposit_unlock_3:0 "Odblokowuje kolejny poziom złóż węgla"
 specialized_service_desc:0 "Specialized service is able to repair any defect in our equipment in a very short time. Properly maintained equipment significantly contributes to the quality of the operations performed."
 expensive_upgrades_desc:0 "Specialized service allows us the repair of any defect our equipment may have in a moment's notice. Properly maintained equipment significantly contributes to the quality of how we perform our operations."
 hardened_materials_desc:0 "The use of hardened materials proved to be a very efficient solution after many tests. Thanks to a better, stronger and lighter material, our vehicles and buildings will be more resistant to enemy ordinance."
 simplified_instructions_desc:0 "The complicated rules of operating new devices can only unnecessarily confuse our people. All recommendations and instructions should be kept to a minimum to help our soldiers manage their equipment."
 intensive_planning_desc:0 "Planning is more important than the battle itself. It has allowed miniscule forces defeat great armies thanks to staying coordinated and ready."
 precise_strike_desc:0 "Thanks to land-air reconnaissance, the most vulnerable focal points of the enemy army are very easy to spot. A quick, powerful attack should paralyze the enemy's forces for a long time."
 rotation_of_soldiers_desc:0 "The efficiency of soldiers on the front lines rapidly declines due to stress and fatigue. With sufficient staff and well-organized transport, we can transfer fresh troops to the front, replacing the tired ones."
 lets_gooo_desc:0 "The worst that a speeding war machine can do is stop. The army should push forward without giving the enemy any time to reorganize and prepare their defences or counterattacks."
 emergency_methods_of_operation_desc:0 "At times, soldiers may find themselves in unexpected positions on the battlefield. Our field officers should know methods to overcome such situations in order to restore the chain of command and combat capability."
 saving_rations_desc:0 "It cannot be allowed to run out of provisions and fuel, especially in key moments of the war campaign. Methods and principles of rationing should be implemented to maintain safety of stocks."
 the_allseeing_desc:0 "Discovering the enemy's plans and the movements of his units is half a win. Focusing on training and expanding our reconnaissance troops is crucial for our guerilla forces."
 terrain_usage_desc:0 "For the partisans, the forest is home, the mountains are a respite, and the swamp is a line of defense. Nature protects us and is deadly to the ignorant enemy, therefore our people must know every nook and cranny of our land."
 lar_false_flag_operations_desc:0 "Confusing the enemy is very effective and gives us a lot of time to carry out the right operations. In addition, we are thus sowing chaos in the enemy's headquarters, weakening the enemy organization"
 dont_let_them_sleep_desc:0 "Sleep depravity it can completely ruin a soldier functioning. By attacking the enemy positions with our rested troops at night, he will show him the ferocity of our faction"
 lar_dont_let_them_sleep_desc:0 "Sleep depravity it can completely ruin a soldier functioning. By attacking the enemy positions with our rested troops at night, he will show him the ferocity of our faction"
 blending_in_desc:0 "If the enemy sees the enemy everywhere and nowhere at the same time, he will become paranoid, and such an enemy is much easier to kill"
 indoctrination_desc:0 "Sometimes the people we recruit are hesitant or, in a human manner, are scared. We should work on it from the very beginning and very intensively. Special seminarians will straighten even the most crooked twigs."
 prisoners_recruitment_desc:0 "If a soldier fights for his freedom, he's damn effective, and who doesn't want freedom any more than a criminal? Their brutality and obstinacy give an additional assault abilities."
 grace_desc:0 "Many shameful deeds can happen in life. The noble soul, however, is ready for redemption and a return to the right path. Such a warrior will know what he is fighting for, more than ever."
 best_of_the_best_desc:0 "The most persistent, strongest and fastest champions are the pride of our faction. In addition to the destructive power they are on the battlefield, they motivate the rest of the army by taking away their fear and increasing morale and loyalty."
 meaning_of_bravery_and_sword_desc:0 "Why are we fighting with a sword, being able to fight with firearms? Choosing the toil of a melee fight may seem stupid, but only the ignorant will not recognize the way of greatness in it. Power is in our blood and will keep this country in its prime."
 devouring_desc:0 "Feasting on the bodies of slain enemies energizes and drives us to further expansion. It is true that this will arouse even greater disgust and resistance among the occupied human centers, but it should not be a problem for long."
 copying_of_prey_desc:0 "Our enemy is strong and cannot be underestimated. We should allow our front units to copy the enemy's fighting methods, it may save the branches of our marching army from unnecessary damage and increase their combat capabilities."
 learning_to_fly_again_desc:0 "The fall has caused mass deterioration in many important fields. It did not bypass the youngest military branch - aviation. Teaching from old pilots, recreating destroyed knowledge and dusting off closed hangars will quickly help us get back above the clouds again."
 arming_the_planes_desc:0 "We've lost most of our combat planes, even civilian ones are rare. But thanks to Polish ingenuity, even a kite can be our advantage in the battle. It is enough to know what and where to attach, to cause panic and casualities in enemy troops."
 creating_the_airforce_desc:0 "Our air force personnel is vestigial now, but it is growing in numbers every day. Through theory studies, meticulous training, hard selection and instilling pride in defending the skies, these chosen ones can perform operations of various kinds even more effectively."
 fighter_doctrine_4_desc:0 "Rivalisation in the same lane is usually an undesirable phenomenon. However, turning it into meaningful competition can contribute to increasing the motivation of pilots to achieve better results."
 fighter_doctrine_5_desc:0 "In addition to the main objectives of fighters, it is important to allocate special forces to escort bombers vulnerable to surprise attacks. Additionally training in radar reading, communication and perceptiveness will be carried out."
 fighter_doctrine_6_desc:0 "While our swift and deadly fighters scour the skies and fight against every flying danger, there are also ground-based shootout attempts. Our heavy bombers will especially destroy anti-aircraft artillery positions to best protect the airwings."
 bomber_doctrine_3_desc:0 "Bombers need to be more vigilant in missions as they are unequal in the fight against enemy fighters. Therefore, their radars and their service should be of the highest possible level, also on the ground."
 bomber_usage_desc:0 "We should focus our bombings on the battlefields, enemy trenches and the closest fortifications to support our troops fighting on the ground as effectively as possible."
 fixed_wing_cas_4_desc:0 "A quick response is indicative, but acting in front of the enemy is even better. Increased vigilance and rapid surprise attacks should sufficiently reduce enemy airwings."
 lf_doctrine_2_desc:0 "The most important thing is that our people are eager to defend national sky. Those with experience give open lessons and the defense staff eagerly learns the techniques of fighting the flying enemy."
 lf_doctrine_5_desc:0 "Our light planes are good at gliding when you don't need an engine to run, in this way we save on fuel, extending the range and it's also a way of disguising yourself from the enemy."
 promotion_of_aa_desc:0 "We do not have the ability to fight a stronger enemy in the air, but it does not mean that we are defenseless. Our anti-air systems will be operational and the crew will fully repel enemy air strikes."
 aa_doctrine_3_desc:0 "The dug and mobile AAA positions scattered across our land are in constant communication with each other. An unidentified movement will be noticed and distributed among our defence mesh."
 aa_doctrine_4_desc:0 "Those who prove to be the best in all aspects will be able to fight in our small air fleet. It is not much, but their influence may determine the fate of the air defense of our lands."
 massing_the_boats_desc:0 "Organizing civic boats does not prove to be an easy and quick task. However, when we finally collect and set them in formation, they can count as a fighting force on water reservoirs."
 rods_to_rifles_desc:0 "The basic armament of our boats is not difficult, there is only needed couple of mariners and gun for them and it will give us water units with the ability to board enemy boats and to cover land formations."
 creating_the_navy_desc:0 "With the development of warfare, our amateur navy must be turned into a professional fleet. Boats and larger units must be standardized and crews trained in one common operating system."
 escort_buffs_desc:0 "Our fleet is too vulnerable and an attack on the enemy could mean the end of our presence in the waters. Everything we have should focus on protecting our transport, trade and other civilian units."
 escort_buffs_2_desc:0 "Our captains shouldn't be playing tough, especially when they're escorting defenseless units. Careful observation and retreat when the enemy is certainly pushing forward will save a lot of valuable people and equipment."
 escort_buffs_3_desc:0 "Checking the underwater for mines is essential prior to transport operations. Often these small, makeshift loads are difficult to detect, but with time and with the right methods, it is possible."
 raiding_buffs_desc:0 "With small and fast units, we can bite the enemy vulnerable units devoid of firepower and run away when he tries to return the blow. This will quickly cause the enemy's logistical ruin."
 raiding_buffs_2_desc:0 "The old technique of small offensive groups can be perfected in the fashion of Post-Fall Poland. Little needs to be changed and the effectiveness of the attacks will surely increase."
 raiding_buffs_3_desc:0 "Observation is the most arduous but the most important element of planning an attack. When we know the paths of enemy units and the time of patrols, we will be able to strike without our losses."
 tbs_as_escorts_desc:0 "Focusing the core of our fleet on defending weak boats is essential. Engaging in unnecessary combat will not bring much at this point and the risk of lossing some unit is too great."
 tbs_as_escorts_2_desc:0 "It's not about how hard you hit. It's about how hard you can get hit and keep moving forward. How much you can take and keep moving forward. That's how winning is done!"
 tbs_as_escorts_3_desc:0 "Knowing, seeing or hearing which side to expect the attack from, gives the defenders a great advantage at the start. Let the radio operators remain vigilant at all times is a great task."
 river_battleships_desc:0 "We have the ability to rule in the waters of former Poland. Our ships are powerful, but let us not leave indifferent to the arming enemy. Let's destroy it while we have the upper hand."
 river_battleships_2_desc:0 "It can get hot with any battle. When the sides crumble under a hail of missiles and the deck is smeared with the blood of the sailors, control can be lost. That's when it is necessary to keep the grip and restore order on the board."
 river_battleships_3_desc:0 "Fluency in the formation of our ships and, above all, in the minds of admiralty is the key to win in any unusual battle. Thanks to the unlimited way out of oppression, the enemy can easily get lost in action."
