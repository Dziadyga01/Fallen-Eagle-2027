 nsb_bicycle:0 "Rower"
 nsb_sidecar:0 "Motocykle Enduro"
 nsb_sidecar_desc:0 "Motorbikes designed for cross-country travel -- much better at handling rough terrain."
 nsb_enduro_tech:0 "Enduro"
 nsb_mbt_0:0 "Prymitywny czołg"
 nsb_mbt_1:0 "Prowizoryczny czołg"
 nsb_mbt_2:0 "Klasyczny czołg podstawowy"
 nsb_mbt_3:0 "Zimnowojenny czołg podstawowy"
 nsb_mbt_4:0 "Współczesny czołg podstawowy"
 nsb_armored_car_1:0 "Adaptacja off-roadowa"
 nsb_armored_car_1_desc:0 "Niezależnie od tego, jak bardzo będziesz się starać, ile będziesz płakać, jak głośno będziesz krzyczeć i jak żarliwie będziesz się modlić - nie da się osiągnąć prędkości powyżej 30 km/h w trudnym terenie w opancerzonym Yarisie. Możesz jednak przerobić go na improwizowane 4x4 z zawieszeniem jak w buggy (a potem spróbować osiągnąć 50 km/h)."
 car_engine_upgrade:0 "Ulepszenie silnika"
 car_engine_upgrade_desc:0 ""
 nsb_armored_car_2:0 "Ulepszony schemat pancerza"
 nsb_armored_car_2_desc:0 "Pociski, koktajle Mołotowa i granaty nadal stanowią poważny problem dla naszych pojazdów. Dlatego musimy dostosować nasze projekty opancerzenia, aby lepiej radziły sobie z tymi zagrożeniami."
 car_armor_upgrade_1:0 "Podstawowe ulepszenie pancerza"
 car_armor_upgrade_1_desc:0 ""
 nsb_armored_car_3:0 "Ulepszona broń pokładowa"
 nsb_armored_car_3_desc:0 "Przeszliśmy z przerobionych samochodów cywilnych na prawdziwe pojazdy rozpoznawcze, a teraz nadszedł czas, aby całkowicie zrezygnować z montowania broni piechoty na naszych opancerzonych pojazdach - pora zacząć integrować nowoczesne systemy uzbrojenia."
 car_gun_upgrade:0 "Ulepszenie broni głównej"
 car_gun_upgrade_desc:0 ""
 nsb_armored_car_4:0 "Wzmocnione środki przeciwpancerne"
 nsb_armored_car_4_desc:0 "Typy pojazdów rozpoznawczych, które kupujemy z zagranicy, mogą się wahać od standardowych, masywnych pojazdów opancerzonych przez pojazdy do kontroli zamieszek, a kończąc na całkiem mocno opancerzonych jeepach wyposażonych w zintegrowane systemy uzbrojenia, które jednostki chciały się pozbyć w zamian za pieniądze. Te lżejsze, bardziej przypominające samochody opancerzone auta są całkowicie niszczone przez jakiekolwiek pociski artyleryjskie i broń wybuchową, dlatego musimy je wyposażyć w dodatkowe uzbrojenie przeciwpancerne oraz środki ochrony przeciwwybuchowej, aby mogły łatwiej operować w pobliżu wrogich pojazdów opancerzonych."
 car_armor_upgrade_2:0 "Zaawansowane ulepszenie pancerza"
 car_armor_upgrade_2_desc:0 ""
 nsb_truck_1:0 "Samochody cywilne w wojsku"
 nsb_truck_1_desc:0 "Używanie starych, zardzewiałych samochodów, które były zakopane w błocie przez całe tygodnie, jest niezwykle ryzykowne zarówno dla naszych żołnierzy, jak i dla naszej skuteczności w walce. Już teraz otrzymujemy liczne doniesienia o awariach występujących wśród naszych oddziałów w trakcie akcji. Możemy znacznie zwiększyć efektywność naszych zmotoryzowanych wojsk, przeznaczając dodatkowe zasoby na przynajmniej częściowe odnowienie ich pojazdów."
 basic_truck_tire_upgrade:0 "Podstawowe ulepszenie opon"
 basic_truck_tire_upgrade_desc:0 "dsada"
 nsb_truck_2:0 "Większe możliwości manewrowe"
 nsb_truck_2_desc:0 "Sprzętowi naszych jednostek zmotoryzowanych i logistycznych brakuje JAKICHKOLWIEK form standaryzacji, a obecnie używamy co najmniej stu różnych modeli pojazdów i modyfikacji. Jednak w miarę użytkowania zaczynamy dostrzegać, które typy pojazdów i modyfikacji są najskuteczniejsze; pojazdy przypominające jeepy są zwrotne i zwinne, a jednocześnie mają dużą pojemność. W związku z tym powinniśmy przerabiać nasze ciężarówki na improwizowane jeepy, humvee i MRAP-y, aby ułatwić naszym zmotoryzowanym oddziałom wydostanie się z trudnych sytuacji oraz unikanie nadchodzących ostrzałów artyleryjskich."
 truck_frame_protection_upgrade:0 ""
 nsb_truck_3:0 "Wzmocnione części pojazdów"
 nsb_truck_3_desc:0 "Możemy poprawić nasz wybór części do ciężarówek wojskowych, aby zapewnić im jeszcze większą prędkość i zwrotność."
 truck_tank_upgrade:0 "Ulepszenie zbiornika"
 truck_tank_upgrade_desc:0 "nie nie chodzi o czołgi :/ "
 nsb_truck_4:0 "Zredukowany pobór paliwa"
 nsb_truck_4_desc:0 "Możemy zaoszczędzić mnóstwo pieniędzy, redukując zużycie paliwa naszych pojazdów dzięki lepszym silnikom oraz dodatkowym środkom mającym na celu uczynienie ich eksploatację bardziej ekonomiczną."
 truck_maintance_upgrade:0 "Ulepszenie serwisowalności"
 truck_maintance_upgrade_desc:0 "Ulepszenie serwisowalności"
 nsb_truck_5:0 "Ulepszone silniki"
 nsb_truck_5_desc:0 "Sprawia że nasze ciężarówki robią 'BRRRRRRRRRRRR' szybciej."
 truck_engine_upgrade:0 "Ulepszenie silnika"
 truck_engine_upgrade_desc:0 ""
 nsb_apc_1:0 "Ulepszenie uzbrojenia"
 nsb_apc_1_desc:0 "Po co montować karabin maszynowy 12,7 mm na ciężarówce, skoro można tam zamontować działko automatyczne 25 mm?"
 apc_main_gun_upgrade:0 "Ulepszenie broni głównej"
 apc_main_gun_upgrade_desc:0 ""
 nsb_apc_2:0 "Ulepszenie opancerzenia"
 nsb_apc_2_desc:0 "Jak dotąd nasze "BTR-y" były jedynie opancerzonymi samochodami zbudowanymi na bazie ciężarówek i mikrobusów. Aby w pełni odróżnić je od naszych konstrukcji samochodów pancernych i zwiększyć ich przydatność, powinniśmy wyposażyć nasze opancerzone transportery piechoty w cięższy i masywniejszy pancerz. Dzięki temu zapewnią one bezpieczniejszy transport żołnierzy."
 apc_armor_upgrade:0 "Ulepszenie pancerza"
 apc_armor_upgrade_desc:0 ""
 nsb_apc_3:0 "Usprawniona ochrona pasażerów"
 nsb_apc_3_desc:0 "Aby chronić pojazd i jego załogę przed kulami, potrzeba więcej niż tylko pokrycie go warstwami stali o maksymalnej grubości i fajrant. Pancerz musi mieć odpowiedni kształt i grubość, aby nie ograniczać prędkości pojazdu oraz chronić załogę przed uszkodzeniami."
 apc_infantry_protection_upgrade:0 "Zaawansowana ochrona pasażerów"
 apc_infantry_protection_upgrade_desc:0 ""
 nsb_apc_4:0 "Usprawniona mobilność"
 nsb_apc_4_desc:0 "Aby poruszać taką ilością kuloodpornego materiału w stałym tempie, potrzeba sporej mocy silnika, a do tego jeszcze lepszych opon i zawieszenia, aby ten ciężar w ogóle mógł się poruszać."
 apc_engine_upgrade:0 "Przemodelowany schemat silnika"
 apc_engine_upgrade_desc:0 ""
 nsb_ifv_1:0 "Prowizoryczny BWP"
 nsb_ifv_2:0 "Klasyczny BWP"
 nsb_ifv_3:0 "Zimnowojenny BWP"
 nsb_ifv_4:0 "Współczesny BWP"
 primitive_aircraft:0 "Samolot cywilny z odzysku"
 primitive_aircraft_desc:0 "Wszelkiego rodzaju małe i średnie cywilne samoloty, które splądrowała horda różnorakich watażków. Większość z nich nie nadaje się do niczego innego niż do zwiadu albo do przelotu nad głowami wrogów tylko po to, by irytować ich odgłosem silnika."
 fighter_0:0 "Fighter 0"
 bomber_0:0 "Samolot rolniczy"
 transport_0:0 "Lekki samolot pasażerski"
