 monitor_3_equipment_desc:0 "Korwety, które mogą zarówno walczyć na morzu, jak i oblegać cele w głębi lądu na brzegach rzek, imitujące małe okręty wojenne europejskich marynarek, takie jak niemieckie jednostki klasy Gepard lub klasy Braunschweig."
 attack_monitor_1_equipment:0 "Zmodyfikowany średni okręt cywilny"
 attack_monitor_1_equipment_short:0 "Zmodyfikowany średni okręt cywilny"
 attack_monitor_1_equipment_desc:0 "Jednostki średniej i małej wielkości, takie jak prywatne statki rybackie lub większe jachty, zmodyfikowane do użytku wojskowego."
 attack_monitor_2_equipment:0 "Uzbrojony ścigacz"
 attack_monitor_2_equipment_short:0 "Uzbrojony ścigacz"
 attack_monitor_2_equipment_desc:0 "Małe, prymitywne okręty wojenne, zaprojektowane jako duże kutry wojskowe lub szybkie jednostki szturmowe."
 attack_monitor_3_equipment:0 "Kuter rakietowy"
 attack_monitor_3_equipment_short:0 "Kuter rakietowy"
 attack_monitor_3_equipment_desc:0 "Nowoczesne małe okręty wojenne, takie jak korwety rakietowe i kutry rakietowe, zaprojektowane z myślą o łatwej produkcji, dużej zwrotności i zdolności do zadawania ciosów jednostkom znacznie przekraczających ich możliwości."
 heavy_monitor_hull:0 "Heavy Monitor Hull"
 heavy_monitor_hull_short:0 "Heavy Monitor Hull"
 heavy_monitor_hull_desc:0 "Większe okręty wojenne, w tym monitory rzeczne, okręty pancerne i niszczyciele do działań na otwartych morzach."
 heavy_monitor_hull_equipment:0 "Prowizoryczny okręt pancerny"
 heavy_monitor_hull_equipment_short:0 "Prowizoryczny okręt pancerny"
 heavy_monitor_hull_equipment_desc:0 "Klasa jednostek składająca się z rzecznych barek towarowych wyposażonych w pancerz i działa artyleryjskie, prymitywnych monitorów oraz prowizorycznych pancerników."
 heavy_monitor_hull_2_equipment:0 "Okręt pancerny"
 heavy_monitor_hull_2_equipment_short:0 "Okręt pancerny"
 heavy_monitor_hull_2_equipment_desc:0 "Projekty rzecznych okrętów wojennych, które w pewnym stopniu przypominają monitory i pancerniki o płytkim zanurzeniu, używane podczas wojny secesyjnej oraz pod koniec XIX i na początku XX wieku."
 heavy_monitor_hull_3_equipment:0 "Niszczyciel"
 heavy_monitor_hull_3_equipment_short:0 "Niszczyciel"
 heavy_monitor_hull_3_equipment_desc:0 "Małe niszczyciele używany we flotach watażków położonych nad morzem Bałtyckim."
