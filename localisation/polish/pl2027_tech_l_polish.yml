 stealth_bomber:0 "Bombowiec stealth"
 stealth_bomber_desc:0 "Podstępny, ciężki do zobaczenia i załadowany po brzegi bombami. Zabawa dla całego pułku lotniczego."
 ptak:0 "Uzbrojone ptactwo"
 ptak_desc:0 "To profesjonalne ptaki. Prawdopodobnie nie narobią na maskę twojego samochodu, za to wysadzą jakikolwiek pojazd który znajdzie się w twoim pobliżu."
