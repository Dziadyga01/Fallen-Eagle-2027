 monitor_hull:0 "Monitor Hull"
 monitor_hull_short:0 "Monitor Hull"
 monitor_hull_desc:0 "Nieopancerzone lub lekko opancerzone okręty wojenne zdolne do działania zarówno w rzekach, jak i na otwartym morzu."
 monitor_hull_equipment:0 "Prowizoryczna kanonierka"
 monitor_hull_equipment_short:0 "Prowizoryczna kanonierka"
 monitor_hull_equipment_desc:0 "Jednostki średniej wielkości, na przykład barki turystyczne lub małe statki towarowe, przerobione na nieopancerzone i lekko uzbrojone łodzie wojenne."
 monitor_hull_2_equipment:0 "Kanonierka"
 monitor_hull_2_equipment_short:0 "Kanonierka"
 monitor_hull_2_equipment_desc:0 "Klasa prostych okrętów wojennych morskich i rzecznych. Choć są przestarzałym konceptem w dzisiejszych czasach, w scenariuszu wojny domowej, gdzie większość infrastruktury dawno zniknęła, sprawdzają się jako niezwykle wszechstronne jednostki wojenne."
 monitor_hull_3_equipment:0 "Korweta"
 monitor_hull_3_equipment_short:0 "Korweta"
 monitor_hull_3_equipment_desc:0 "Korwety, które mogą zarówno walczyć na morzu, jak i oblegać cele w głębi lądu na brzegach rzek, imitujące małe okręty wojenne europejskich marynarek, takie jak niemieckie jednostki klasy Gepard lub klasy Braunschweig."
 monitor_1_equipment:0 "Prowizoryczna kanonierka"
