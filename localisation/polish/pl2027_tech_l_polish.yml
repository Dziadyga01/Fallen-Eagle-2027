 ifv_chassis:0 "Bojowy wóz piechoty"
 ifv_chassis_short:0 "Bojowy wóz piechoty"
 ifv_chassis_desc:0 "Kategoria obejmująca różne pojazdy opancerzone, które są zaprojektowane zarówno do ostrzeliwania wrogów, jak i do dostarczania piechoty na pole bitwy."
 ifv_chassis_1:0 "Prowizoryczne podwozie BWP"
 ifv_chassis_1_short:0 "Prowizoryczne podwozie BWP"
 ifv_chassis_1_desc:0 "Bojowy wóz piechoty (BWP) to rodzaj opancerzonego pojazdu bojowego, który służy do transportu piechoty na pole bitwy i zapewnienia wsparcia ogniowego.\n\nJednakże - to nie jest BWP. To opancerzony buldożer z zamontowanymi kilkoma karabinami maszynowymi."
 ifv_chassis_2:0 "Klasyczne podwozie BWP"
 ifv_chassis_2_short:0 "Klasyczne podwozie BWP"
 ifv_chassis_2_desc:0 "Łatwe do skopiowania, kupienia lub znalezienia w porzuconych magazynach wojskowych modele BWP (np. BMP-1 i M113 w różnych konfiguracjach) z wczesnych czasów zimnej wojny. Mają kanciasty kształt i prostą budowę, pełniąc rolę opancerzonych klatek dla ludzi, które ostrzeliwują pozycje obronne wroga i transportują żołnierzy po polu bitwy, trochę jak taksówki bojowe."
 ifv_chassis_3:0 "Zimnowojenne podwozie BWP"
 ifv_chassis_3_short:0 "Zimnowojenne podwozie BWP"
 ifv_chassis_3_desc:0 "Późniejsze BWP z czasów zimnej wojny, zintegrowane z znacznie szerszym zestawem gadżetów, takich jak automatyczne działa czy wyrzutnie rakiet przeciwpancernych. Wczesne Bradleye, BMP-2, Mardery i tym podobne."
 ifv_chassis_4:0 "Współczesne podwozie BWP"
 ifv_chassis_4_short:0 "Współczesne podwozie BWP"
 ifv_chassis_4_desc:0 "Nowoczesne wersje Bradleya, BMP-3, Pumy, Patria AMV, VAB, VBMR itp. - BWP, które oferują wysoki poziom ochrony, silne uzbrojenie I - uwaga, uwaga: wysoki komfort użytkowania. Tak, oddziały desantowe nie muszą już siedzieć upchnięci jak sardynki w puszce, ponieważ te maszyny mają wystarczająco dużo miejsca, aby mogli wyprostować się i usiąść wygodnie, tak jak przystało na każdego dumnie służącego żołnierza, który od pięciu miesięcy nie otrzymał żołdu."
 mbt_chassis:0 "Czołg"
 mbt_chassis_short:0 "Czołg"
 mbt_chassis_desc:0 "Kategoria ciężko opancerzonych pojazdów gąsienicowych uzbrojonych w... No, nie muszę ci tłumaczyć co to.. Czołg jaki jest, każdy widzi."
 mbt_chassis_0:0 "Prymitywne podwozie czołgu"
 mbt_chassis_0_short:0 "Prymitywne podwozie czołgu"
 mbt_chassis_0_desc:0 "BARDZO prymitywne, kanciaste projekty czołgów składające się z dużych cywilnych samochodów pokrytych wielkimi 'płytami pancerza' (czyli losowymi, znalezionymi metalowymi płytami). Niemal niemożliwe jest skręcanie, przyspieszanie czy odpowiednie ustawienie się z tymi pojazdami, ale przynajmniej można liczyć na to, że wrogowie umierają ze śmiechu na widok tych abominacji."
 mbt_chassis_1:0 "Prowizoryczne podwozie czołgu"
 mbt_chassis_1_short:0 "Prowizoryczne podwozie czołgu"
 mbt_chassis_1_desc:0 "Różne improwizowane czołgi, zaczynając od dużych, gąsienicowych pojazdów budowlanych pokrytych ogromnymi ilościami domowej roboty pancerza ze stali i betonu, po mniejsze, prymitywne czołgi średniej wagi. Bardzo proste i nieporęczne, ale w pewnym sensie skuteczne."
 mbt_chassis_2:0 "Klasyczne podwozie czołgu podstawowego"
 mbt_chassis_2_short:0 "Klasyczne podwozie czołgu podstawowego"
 mbt_chassis_2_desc:0 "Stare, radzieckie, paskudne bojowe gównowozy, które nie mają żadnych skomplikowanych, drogich ani wyszukanych części, co sprawia, że można je naprawić za pomocą zwykłego młotka i wkrętaka. Po prostu czołgi - nic więcej.\n\nBez pancerza reaktywnego czy kompozytowego, bez termowizji, bez systemów kierowania ogniem - bez niczego, to po prostu najzwyklejszy czołg. Modele z czasów T-54/T-55.."
 mbt_chassis_3:0 "Zimnowojenne podwozie czołgu podstawowego"
 mbt_chassis_3_short:0 "Zimnowojenne podwozie czołgu podstawowego"
 mbt_chassis_3_desc:0 "Nieco nowsze czołgi z czasów zimnej wojny. Choć wciąż ustępują w porównaniu do nowoczesnych czołgów podstawowych, zapewniają swoim operatorom przynajmniej minimalną ilość technologii, która ułatwia i umila ich pracę. Leopardy 1, T-72, M60 i inne stare modele, które wciąż mają wielu użytkowników na całym świecie."
 mbt_chassis_4:0 "Współczesne podwozie czołgu podstawowego"
 mbt_chassis_4_short:0 "Współczesne podwozie czołgu podstawowego"
 mbt_chassis_4_desc:0 "Crème de la crème czołgów podstawowych. Zagraniczne modele wyposażone w najnowocześniejsze i najbardziej efektowne gadżety, jakie można sobie wyobrazić. Oprócz zapewnienia załogom najlepszych osłon i najdokładniejszych systemów kierowania ogniem i celowania, oferują również wiele udogodnień, które sprawiają, że prowadzenie tych bestii to faktycznie komfortowe zajęcie. Modele takie jak Abrams, Leopard 2, Merkava, T-90MS, czy...T-14 Armata? O, przepraszam, tego ostatniego raczej nie zobaczymy."
 super_heavy_tank_equipment:0 "Super Heavy Tank Equipment"
 super_heavy_tank_equipment_short:0 "Super Heavy Tank Equipment"
 super_heavy_tank_equipment_1:0 "Super Heavy Tank Equipment 1"
 super_heavy_tank_equipment_1_short:0 "Super Heavy Tank Equipment 1"
 train_equipment:0 "Train Equipment"
 train_equipment_short:0 "Train Equipment"
 train_equipment_1:0 "Train Equipment 1"
 train_equipment_1_short:0 "Train Equipment 1"
 train_equipment_2:0 "Train Equipment 2"
 train_equipment_2_short:0 "Train Equipment 2"
 train_equipment_3:0 "Train Equipment 3"
 train_equipment_3_short:0 "Train Equipment 3"
 train_equipment_4:0 "Uzbrojony pociąg pancerny"
 train_equipment_4_short:0 "Uzbrojony pociąg pancerny"
 train_equipment_4_desc:0 "Mobilne fortece pokryte betonem, stalą i solidną siłą ognia, które mogą bezpiecznie przemieszczać się po niebezpiecznych/objętych wojną terenach."
 train_equipment_5:0 "Train Equipment 5"
 train_equipment_5_short:0 "Train Equipment 5"
 train_equipment_6:0 "Train Equipment 6"
 train_equipment_6_short:0 "Train Equipment 6"
 train_equipment_7:0 "Train Equipment 7"
 train_equipment_7_short:0 "Train Equipment 7"
 ifv_equipment_1:0 "Prowizoryczny BWP"
 ifv_equipment_1_short:0 "Prowizoryczny BWP"
 ifv_equipment_1_desc:0 "Bojowy wóz piechoty (BWP) to rodzaj opancerzonego pojazdu bojowego, który służy do transportu piechoty na pole bitwy i zapewnienia wsparcia ogniowego.\n\nJednakże - to nie jest BWP. To opancerzony buldożer z zamontowanymi kilkoma karabinami maszynowymi."
 ifv_equipment_2:0 "Klasyczny BWP"
 ifv_equipment_2_short:0 "Klasyczny BWP"
 ifv_equipment_2_desc:0 "Łatwe do skopiowania, kupienia lub znalezienia w porzuconych magazynach wojskowych modele BWP (np. BMP-1 i M113 w różnych konfiguracjach) z wczesnych czasów zimnej wojny. Mają kanciasty kształt i prostą budowę, pełniąc rolę opancerzonych klatek dla ludzi, które ostrzeliwują pozycje obronne wroga i transportują żołnierzy po polu bitwy, trochę jak taksówki bojowe."
 ifv_equipment_3:0 "Zimnowojenny BWP"
 ifv_equipment_3_short:0 "Zimnowojenny BWP"
 ifv_equipment_3_desc:0 "Późniejsze BWP z czasów zimnej wojny, zintegrowane z znacznie szerszym zestawem gadżetów, takich jak automatyczne działa czy wyrzutnie rakiet przeciwpancernych. Wczesne Bradleye, BMP-2, Mardery i tym podobne."
 ifv_equipment_4:0 "Współczesny BWP"
 ifv_equipment_4_short:0 "Współczesny BWP"
 ifv_equipment_4_desc:0 "Nowoczesne wersje Bradleya, BMP-3, Pumy, Patria AMV, VAB, VBMR itp. - BWP, które oferują wysoki poziom ochrony, silne uzbrojenie I - uwaga, uwaga: wysoki komfort użytkowania. Tak, oddziały desantowe nie muszą już siedzieć upchnięci jak sardynki w puszce, ponieważ te maszyny mają wystarczająco dużo miejsca, aby mogli wyprostować się i usiąść wygodnie, tak jak przystało na każdego dumnie służącego żołnierza, który od pięciu miesięcy nie otrzymał żołdu."
 mbt_equipment_0:0 "Prymitywny czołg"
 mbt_equipment_0_short:0 "Prymitywny czołg"
 mbt_equipment_0_desc:0 "BARDZO prymitywne, kanciaste projekty czołgów składające się z dużych cywilnych samochodów pokrytych wielkimi 'płytami pancerza' (czyli losowymi, znalezionymi metalowymi płytami). Niemal niemożliwe jest skręcanie, przyspieszanie czy odpowiednie ustawienie się z tymi pojazdami, ale przynajmniej można liczyć na to, że wrogowie umierają ze śmiechu na widok tych abominacji."
 mbt_equipment_1:0 "Prowizoryczny czołg"
 mbt_equipment_1_short:0 "Prowizoryczny czołg"
 mbt_equipment_1_desc:0 "Różne improwizowane czołgi, zaczynając od dużych, gąsienicowych pojazdów budowlanych pokrytych ogromnymi ilościami domowej roboty pancerza ze stali i betonu, po mniejsze, prymitywne czołgi średniej wagi. Bardzo proste i nieporęczne, ale w pewnym sensie skuteczne."
 mbt_equipment_2:0 "Klasyczny czołg podstawowy"
 mbt_equipment_2_short:0 "Klasyczny czołg podstawowy"
 mbt_equipment_2_desc:0 "Stare, radzieckie, paskudne bojowe gównowozy, które nie mają żadnych skomplikowanych, drogich ani wyszukanych części, co sprawia, że można je naprawić za pomocą zwykłego młotka i wkrętaka. Po prostu czołgi - nic więcej.\n\nBez pancerza reaktywnego czy kompozytowego, bez termowizji, bez systemów kierowania ogniem - bez niczego, to po prostu najzwyklejszy czołg. Modele z czasów T-54/T-55."
 mbt_equipment_3:0 "Zimnowojenny czołg podstawowy"
 mbt_equipment_3_short:0 "Zimnowojenny czołg podstawowy"
 mbt_equipment_3_desc:0 "Nieco nowsze czołgi z czasów zimnej wojny. Choć wciąż ustępują w porównaniu do nowoczesnych czołgów podstawowych, zapewniają swoim operatorom przynajmniej minimalną ilość technologii, która ułatwia i umila ich pracę. Leopardy 1, T-72, M60 i inne stare modele, które wciąż mają wielu użytkowników na całym świecie."
 mbt_equipment_4:0 "Współczesny czołg podstawowy"
 mbt_equipment_4_short:0 "Współczesny czołg podstawowy"
 mbt_equipment_4_desc:0 "Crème de la crème czołgów podstawowych. Zagraniczne modele wyposażone w najnowocześniejsze i najbardziej efektowne gadżety, jakie można sobie wyobrazić. Oprócz zapewnienia załogom najlepszych osłon i najdokładniejszych systemów kierowania ogniem i celowania, oferują również wiele udogodnień, które sprawiają, że prowadzenie tych bestii to faktycznie komfortowe zajęcie. Modele takie jak Abrams, Leopard 2, Merkava, T-90MS, czy...T-14 Armata? O, przepraszam, tego ostatniego raczej nie zobaczymy."
 self_propelled_artillery_equipment_3:0 "Zimnowojenna artyleria samobieżna"
 self_propelled_artillery_equipment_3_short:0 "Zimnowojenna artyleria samobieżna"
 self_propelled_artillery_equipment_3_desc:0 "Wcześniejsze projekty samobieżnej artylerii, które nadal dobrze sprawdzają się zarówno w krajach rozwiniętych, jak i w zapadłych dziurach, takie jak amerykańskie M109 czy rosyjskie Goździki."
 self_propelled_artillery_equipment_4:0 "Współczesna artyleria samobieżna"
 self_propelled_artillery_equipment_4_short:0 "Współczesna artyleria samobieżna"
 self_propelled_artillery_equipment_4_desc:0 "Bardziej nowoczesne projekty samobieżnej artylerii, które służą głównym mocarstwom świata. Głównie importowane Panzerhaubitze 2000, M109 lub AS-90 oraz kopie Krabów produkowane przed 2027 rokiem."
 land_cruiser_equipment:0 "Land Cruiser Equipment"
 land_cruiser_equipment_short:0 "Land Cruiser Equipment"
 land_cruiser_equipment_1:0 "Krążownik lądowy"
 land_cruiser_equipment_1_short:0 "Krążownik lądowy"
 mbt_flame_chassis:0 "Mbt Flame Chassis"
 mbt_flame_chassis_short:0 "Mbt Flame Chassis"
 armored_motorboat_hull:0 "Łódź patrolowa"
 torpedo_boat_hull:0 "Torpedowiec"
 monitor_armor_2:0 "Prowizoryczny lekki pancerz okrętowy"
 monitor_armor_2_desc:0 "More professionally made, but still improvised light hull armor."
 monitor_hull_2:0 "Kanonierka"
 monitor_armor_3:0 "Lekki pancerz okrętowy"
 monitor_armor_3_desc:0 "Simple river warship hull armor."
 monitor_hull_3:0 "Korweta"
 monitor_armor_4:0 "Współczesny pancerz okrętowy"
 monitor_armor_4_desc:0 "Lekki naval armor used by most modern warships."
 heavy_monitor_hull_1:0 "Prowizoryczny okręt pancerny"
 heavy_monitor_hull_2:0 "Okręt pancerny"
 heavy_monitor_hull_3:0 "Niszczyciel"
 heavy_monitor_armor_2:0 "Prowizoryczny ciężki pancerz okrętowy"
 heavy_monitor_armor_2_desc:0 "Heavier and more advanced impromptu hull armor."
 heavy_monitor_armor_3:0 "Ciężki pancerz okrętowy"
 heavy_monitor_armor_3_desc:0 "Simple, but thick armor used by heavy ships, mitigating most of damage dealt by impromptu weaponry used by warlord navies."
 heavy_monitor_armor_4:0 "Współczesny ciężki pancerz okrętowy"
 heavy_monitor_armor_4_desc:0 "Though most modern navies only use light armor due to heavier armor not being that effective against most modern naval and rocket weaponry, in a combat between not as strongly armed warlord fleets heavy protection can be extremely useful."
 early_ship_hull_submarine:0 "Early Ship Hull Submarine"
 basic_ship_hull_submarine:0 "Basic Ship Hull Submarine"
 improved_ship_hull_submarine:0 "Improved Ship Hull Submarine"
 early_gunnery:0 "Broń ręczna dla załogi"
 early_gunnery_desc:0 "Infantry weapons such as pistols, rifles, submachine guns, grenades or mortars, used by raiding parties to shoot at enemy boats and coastal positions."
 light_guns_2:0 "Klasyczne KMy"
 light_guns_2_desc:0 "Lekki and heavy machine guns from the earlier days of the Cold War that have been either found or bought from a third world country and then mounted onto boats."
 light_guns_3:0 "Współczesne CKMy"
 light_guns_3_desc:0 "More modern heavy machine guns capable of piercing through the hulls of enemy ships, usually bought from abroad."
 light_guns_4:0 "Miniguny"
 light_guns_4_desc:0 "Rotary machine guns capable of flooding enemy small ships with hundreds of bullets per second and serving as icons of pure, unfiltered, extra-fattened American patriotism."
 medium_guns_2:0 "Prowizoryczne działka i klasyczne działka automatyczne"
 medium_guns_2_desc:0 "As Polish warlords move on from the kayak flotillas era into the dissected-and-then-rebuilt-as-a-half-sunk-ironclad river barge flotillas era, they also start to upgrade their weaponry, outfitting their ships with improvised naval guns and bought old autocannons of various kinds."
 medium_guns_3:0 "Klasyczne działa okrętowe"
 medium_guns_3_desc:0 "Early-to-mid Cold War-era naval guns and small naval batteries."
 medium_guns_4:0 "Współczesne działa okrętowe"
 medium_guns_4_desc:0 "Naval guns and whole naval battery models based off ones mounted on late Cold War-era and early 21st century warships."
 heavy_guns_2:0 "Broń przeciwpancerna"
 heavy_guns_2_desc:0 "Bought or improvised AT missile launchers, placed on boats as makeshift ship-to-ship missiles."
 heavy_guns_3:0 "Prowizoryczne rakiety typu woda-woda"
 heavy_guns_3_desc:0 "Various missile weaponry, that has usually have to be mounted in very rudimentary ways, resembling large weapons used on technicals due to its size and the small size of our ships."
 heavy_guns_4:0 "Współczesne rakiety typu woda-woda"
 heavy_guns_4_desc:0 "Współczesny guided anti-ship missiles, comparable to ones used by most navies."
 torpedos_1:0 "Wybuchowe zabawkowe łódki"
 torpedos_1_desc:0 "Remote controlled toys, armed with explosive charges, used to detonate enemy boats and crewmen."
 torpedos_2:0 "Prowizoryczne torpedy"
 torpedos_2_desc:0 "Makeshift torpedoes consisting of various anti-tank missiles, bombs or anti-tank mines that have been encased in torpedo bodies and modded to allow them to float, self-propel and (hopefully) explode in contact with the enemy."
 torpedos_3:0 "Klasyczne torpedy"
 torpedos_3_desc:0 "Rudimentary torpedo launchers and old-ass torpedoes that probably still remember the Second World War. Still, they do the job against such basic warships as the ones used by Polish warlords."
 torpedos_4:0 "Współczesne torpedy"
 torpedos_4_desc:0 "Proper torpedo launchers and modern torpedoes, used by navies worldwide."
