 spaa_equipment:0 "Samobieżne działo przeciwlotnicze"
 spaa_equipment_short:0 "Samobieżne działo przeciwlotnicze"
 spaa_equipment_desc:0 "Uzbrojone pojazdy strzelające panu Bogu w okno"
 spaa_equipment_1:0 "Zimnowojenny samobieżny zestaw przeciwlotniczy"
 spaa_equipment_1_short:0 "Zimnowojenny samobieżny zestaw przeciwlotniczy"
 spaa_equipment_1_desc:0 "Starsze samobieżne działa przeciwlotnicze, które wciąż znajdują zastosowanie w niektórych biedniejszych krajach. Głównie relikty byłego bloku wschodniego, takie jak Shilki, ZSU czy czeskie M53/59 Praga."
 spaa_equipment_2:0 "Współczesny samobieżny zestaw przeciwlotniczy"
 spaa_equipment_2_short:0 "Współczesny samobieżny zestaw przeciwlotniczy"
 spaa_equipment_2_desc:0 "Samobieżne działa przeciwlotnicze współczesnej epoki (cóż... *prawie* współczesnej), używane przez światowe mocarstwa militarne, takie jak rosyjska Tunguska, amerykański M163 VADS, niemiecki Flakpanzer Gepard czy polska wersja ZSU-23 - 'Biała'."
 armored_car_equipment:0 "Armored Car Equipment"
 armored_car_equipment_short:0 "Armored Car Equipment"
 gw_armored_car_equipment:0 "Gw Armored Car Equipment"
 gw_armored_car_equipment_short:0 "Gw Armored Car Equipment"
 armored_car_equipment_1:0 "Armored Car Equipment 1"
 armored_car_equipment_1_short:0 "Armored Car Equipment 1"
 armored_car_equipment_2:0 "Armored Car Equipment 2"
 armored_car_equipment_2_short:0 "Armored Car Equipment 2"
 armored_car_equipment_3:0 "Zimnowojenny samochód pancerny"
 armored_car_equipment_3_short:0 "Zimnowojenny samochód pancerny"
 armored_car_equipment_3_desc:0 "BRDM-1, BRDM-2 i inne modele wozów pancernych z czasów zimnej wojny, które zostały skopiowane lub kupione od przemytników z krajów trzeciego świata. Są znacznie lepsze od domowej roboty opancerzonych pojazdów, ale tak naprawdę...co nie jest od nich lepsze?"
 armored_car_equipment_4:0 "Współczesny samochód pancerny"
 armored_car_equipment_4_short:0 "Współczesny samochód pancerny"
 armored_car_equipment_4_desc:0 "Nowoczesne opancerzone samochody i inne lżejsze pojazdy rozpoznawcze. Kopie polskich AMZ Dzik-3 i AMZ Tur, lub zagraniczne modele z lat 80. i późniejszych (jak francuskie ERC i VBL)."
 armored_car_at_equipment:0 "Armored Car At Equipment"
 armored_car_at_equipment_short:0 "Armored Car At Equipment"
 heat_ray_equipment:0 "Mikrofalowa Broń Obezwładniająca"
 heat_ray_equipment_short:0 "Mikrofalowa Broń Obezwładniająca"
 heat_ray_equipment_1:0 "Mikrofalowa Broń Obezwładniająca"
 heat_ray_equipment_1_short:0 "Mikrofalowa Broń Obezwładniająca"
 light_artillery_equipment:0 "Moździerz"
 light_artillery_equipment_short:0 "Moździerz"
 light_artillery_equipment_desc:0 "Kategoria artylerii obejmująca różne rodzaje moździerzy i/lub lekkiej artylerii, które są łatwo przenośne ze względu na rozmiar i wagę oraz/lub łatwość szybkiej rekonstrukcji w trakcie bitwy."
 light_artillery_equipment_0:0 "Ciężka proca"
 light_artillery_equipment_0_short:0 "Ciężka proca"
 light_artillery_equipment_0_desc:0 "Najbardziej prymitywny sposób na bombardowanie wrogów granatami i kamieniami."
 light_artillery_equipment_1:0 "Machina miotająca"
 light_artillery_equipment_1_short:0 "Machina miotająca"
 light_artillery_equipment_2:0 "Prymitywny moździerz"
 light_artillery_equipment_2_short:0 "Prymitywny moździerz"
 light_artillery_equipment_2_desc:0 "Improwizowane moździerze, które są bliższe kształtem i działaniem moździerzom z epoki prochu strzelniczego niż nowoczesnym. Większość z nich składa się z wzmocnionych koszy na śmieci lub prymitywnych, wykonanych na miejscu dział, które zamontowano na wózkach widłowych lub innych podobnych wózkach transportowych."
 light_artillery_equipment_3:0 "Prowizoryczny moździerz"
 light_artillery_equipment_3_short:0 "Prowizoryczny moździerz"
 light_artillery_equipment_3_desc:0 "Choć wciąż improwizowane, te moździerze przynajmniej w pewnym stopniu przypominają prawdziwe, posiadając długą lufę i głównie używając pocisków z lotkami, zamiast improwizowanych kul armatnich i przypadkowych ciężkich przedmiotów znalezionych w pobliżu."
 light_artillery_equipment_4:0 "Zimnowojenny/współczesny moździerz"
 light_artillery_equipment_4_short:0 "Zimnowojenny/współczesny moździerz"
 light_artillery_equipment_4_desc:0 "Moździerze z okresu zimnej wojny i wczesnych lat 2000, skopiowane lub zakupione od mocarstw, które wciąż ich używają, takie jak 2B11 czy LM-60."
 self_propelled_mortar_equipment:0 "Moździerz samobieżny"
 self_propelled_mortar_equipment_short:0 "Moździerz samobieżny"
 self_propelled_mortar_equipment_desc:0 "Samobieżne działa z wysokimi kątami strzału, używane do prowadzenia bezpiecznego, dalekosiężnego ognia pośredniego."
 self_propelled_mortar_equipment_1:0 "Moździerz samobieżny"
 self_propelled_mortar_equipment_1_short:0 "Moździerz samobieżny"
 self_propelled_mortar_equipment_1_desc:0 "Moździerze z wczesnego XXI wieku i późnych czasów zimnej wojny, wspierane przez kopie nowoczesnych i zimnowojennych moździerzy samobieżnych (takich jak polski M120 Rak czy radziecka 2S3 Akacja), które nadal są używane w armiach globalnych mocarstw."
 heavy_artillery_equipment:0 "Ciężka artyleria"
 heavy_artillery_equipment_short:0 "Ciężka artyleria"
 heavy_artillery_equipment_desc:0 "Kategoria artylerii zawierająca ciężkie, holowane haubice i działa."
 heavy_artillery_equipment_1:0 "Działo karbidowe"
 heavy_artillery_equipment_1_short:0 "Działo karbidowe"
 heavy_artillery_equipment_1_desc:0 "Te śmieszne żulowe armatki z filmików w internecie."
 heavy_artillery_equipment_2:0 "Prowizoryczna haubica"
 heavy_artillery_equipment_2_short:0 "Prowizoryczna haubica"
 heavy_artillery_equipment_2_desc:0 "Improwizowane działa zrobione z beczek, śmietników i złomu, wystrzeliwujące kuliste i pociskokształtne obiekty *mniej więcej* w kierunku pozycji wroga."
 heavy_artillery_equipment_3:0 "Drugowojenne haubica"
 heavy_artillery_equipment_3_short:0 "Drugowojenne haubica"
 heavy_artillery_equipment_3_desc:0 "Znalezione i odrestaurowane lub skopiowane działa muzealne oraz starsze haubice znalezione w porzuconych magazynach armijnych, z niektórymi tak starymi, że pamiętają II wojnę światową. Choć prymitywne według współczesnych standardów, przynajmniej potrafią oddać kilka celnych strzałów, zanim się zepsują. Modele z czasów radzieckich haubic M-30 i D-1 oraz amerykańskich M101."
 heavy_artillery_equipment_4:0 "Zimnowojenna haubica"
 heavy_artillery_equipment_4_short:0 "Zimnowojenna haubica"
 heavy_artillery_equipment_4_desc:0 "Kupione, skopiowane lub licencjonowane haubice z wczesnych lat zimnej wojny, które wciąż służą w amerykańskich i różnych postradzieckich armiach. Modele takie jak 2A18 D-30, M198, D-20 i inne."
 heavy_artillery_equipment_5:0 "Współczesna haubica"
 heavy_artillery_equipment_5_short:0 "Współczesna haubica"
 heavy_artillery_equipment_5_desc:0 "Najwyższej klasy holowane działa artyleryjskie z późnych lat zimnej wojny oraz przełomu XX i XXI wieku, takie jak M198, M777 czy Msta-B."
 rocket_artillery_equipment:0 "Rocket Artillery Equipment"
 rocket_artillery_equipment_short:0 "Rocket Artillery Equipment"
 rocket_artillery_equipment_1:0 "Rocket Artillery Equipment 1"
 rocket_artillery_equipment_1_short:0 "Rocket Artillery Equipment 1"
 rocket_artillery_equipment_2:0 "Rocket Artillery Equipment 2"
 rocket_artillery_equipment_2_short:0 "Rocket Artillery Equipment 2"
 motorized_rocket_equipment:0 "Motorized Rocket Equipment"
 motorized_rocket_equipment_short:0 "Motorized Rocket Equipment"
 motorized_rocket_equipment_1:0 "Motorized Rocket Equipment 1"
 motorized_rocket_equipment_1_short:0 "Motorized Rocket Equipment 1"
 motorized_rocket_equipment_2:0 "Zimnowojenna wyrzutnia rakietowa"
 motorized_rocket_equipment_2_short:0 "Zimnowojenna wyrzutnia rakietowa"
 motorized_rocket_equipment_2_desc:0 "Stare, systemy wieloprowadnicowe rakiet (MLRS) z wczesnego i środkowego okresu zimnej wojny - modele, które, choć wciąż śmiercionośne, nie dorównują skuteczności nowoczesnej artylerii rakietowej. BM-14, Grad, Katiusze i inne relikty bloku wschodniego (lub ich nieco prymitywne kopie), które wciąż są używane w krajach trzeciego świata."
 motorized_rocket_equipment_3:0 "Współczesna wyrzutnia rakietowa"
 motorized_rocket_equipment_3_short:0 "Współczesna wyrzutnia rakietowa"
 motorized_rocket_equipment_3_desc:0 "Nowoczesne, zaawansowane systemy wieloprowadnicowe rakiet, które mogą zapewniać zarówno ostrzał masowy (rosyjskie TOS-1, Uragany i Smiercze, polskie WR-40 Langusty), jak i celny ogień (systemy zachodnie, z HIMARS na czele) z dużych odległości."
 motorized_artillery_equipment:0 "Artyleria zmotoryzowana"
 motorized_artillery_equipment_short:0 "Artyleria zmotoryzowana"
 motorized_artillery_equipment_desc:0 "my guns go boom boom yo guns go *BRRRRWRRRRRWRWRWRRWRWRWRWRWRWRWRWRWRWRWRWRWRWRWRWRWRWRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR pow pow* (your gun's on a truck)"
 motorized_artillery_equipment_1:0 "Prowizoryczne działo samobieżne"
 motorized_artillery_equipment_1_short:0 "Prowizoryczne działo samobieżne"
 motorized_artillery_equipment_1_desc:0 "Samochody z armatami zamontowanymi na dachach, nazywane przez międzynarodową społeczność "technicalami dla biednych". Bardzo słabo napędzane, niewiarygodnie niedokładne i niesamowicie idiotyczne."
 motorized_artillery_equipment_2:0 "Technical z artylerią"
 motorized_artillery_equipment_2_short:0 "Technical z artylerią"
 motorized_artillery_equipment_2_desc:0 "W zasadzie - CAESAR-y z przeceny: ciężarówki uzbrojone w stare działa artyleryjskie, które służą jako ciężka, ale mobilna artyleria. Mimo swojej wagi, mają tendencję do przewracania się na bok po oddaniu strzału."
 super_heavy_artillery_equipment:0 "Super Heavy Artillery Equipment"
 super_heavy_artillery_equipment_short:0 "Super Heavy Artillery Equipment"
 super_heavy_artillery_equipment_1:0 "Super Heavy Artillery Equipment 1"
 super_heavy_artillery_equipment_1_short:0 "Super Heavy Artillery Equipment 1"
 self_propelled_super_heavy_artillery_equipment:0 "Self Propelled Super Heavy Artillery Equipment"
 self_propelled_super_heavy_artillery_equipment_short:0 "Self Propelled Super Heavy Artillery Equipment"
 self_propelled_super_heavy_artillery_equipment_1:0 "Self Propelled Super Heavy Artillery Equipment 1"
 self_propelled_super_heavy_artillery_equipment_1_short:0 "Self Propelled Super Heavy Artillery Equipment 1"
 ballistic_missile_equipment:0 "Ballistic Missile Equipment"
 ballistic_missile_equipment_short:0 "Ballistic Missile Equipment"
 ballistic_missile_equipment_1:0 "Ballistic Missile Equipment 1"
 ballistic_missile_equipment_1_short:0 "Ballistic Missile Equipment 1"
 ballistic_missile_equipment_2:0 "Ballistic Missile Equipment 2"
 ballistic_missile_equipment_2_short:0 "Ballistic Missile Equipment 2"
 ballistic_missile_equipment_3:0 "Ballistic Missile Equipment 3"
 ballistic_missile_equipment_3_short:0 "Ballistic Missile Equipment 3"
 bicycle_equipment:0 "Rower"
 bicycle_equipment_short:0 "Rower"
 bicycle_equipment_desc:0 "Rowery są powszechne zarówno w miastach, jak i na wsi, nie wymagają dodatkowego szkolenia do obsługi, a ich produkcja i konserwacja są łatwe. To naturalny wybór pojazdu mobilnego dla większości armii watażków w Polsce."
 bicycle_equipment_1:0 "Rower"
 bicycle_equipment_1_short:0 "Rower"
 bicycle_equipment_1_desc:0 "Rowery są powszechne zarówno w miastach, jak i na wsi, nie wymagają dodatkowego szkolenia do obsługi, a ich produkcja i konserwacja są łatwe. To naturalny wybór pojazdu mobilnego dla większości armii watażków w Polsce."
 convoy:0 "Convoy"
 convoy_short:0 "Convoy"
 convoy_1:0 "Convoy 1"
 convoy_1_short:0 "Convoy 1"
 convoy_1_desc:0 "Konwoje przewożące żołnierzy i towary wzdłuż rzek i/lub po Bałtyku."
 uav_equipment:0 "Bezzałogowy statek powietrzny"
 uav_equipment_short:0 "Bezzałogowy statek powietrzny"
 uav_equipment_desc:0 "Pojazdy powietrzne, które nie przewożą żadnego personelu na pokładzie. Występują w wielu rodzajach, pełniąc różne funkcje w zależności od ich kształtu i rozmiaru."
 drone_0_equipment:0 "Dron cywilny"
 drone_0_equipment_short:0 "Dron cywilny"
 drone_0_equipment_desc:0 "Małe czterowirnikowce i inne drony komercyjne używane do zwiadu oraz zrzucania rzeczy na głowy wrogów."
 drone_1_equipment:0 "Zmodyfikowany dron cywilny"
 drone_1_equipment_short:0 "Zmodyfikowany dron cywilny"
 drone_1_equipment_desc:0 "Cywilne drony, które zostały nieznacznie zmodyfikowane, aby mogły przenosić i zrzucać bomby na niedalekie pozycje wrogów."
 drone_2_equipment:0 "Uproszczony bezzałogowy dron"
 drone_2_equipment_short:0 "Uproszczony bezzałogowy dron"
 drone_2_equipment_desc:0 "Większe, ale bez uzbrojenia lub bardzo lekko uzbrojone drony używane do rozległego zwiadu."
 drone_3_equipment:0 "Nowoczesny dron zwiadowczy"
 drone_3_equipment_short:0 "Nowoczesny dron zwiadowczy"
 drone_3_equipment_desc:0 "Bardziej zaawansowane drony, które zostały zakupione online i/lub zmodyfikowane do użytku wojskowego."
 drone_4_equipment:0 "Zaawansowany dron zwiadowczy"
 drone_4_equipment_short:0 "Zaawansowany dron zwiadowczy"
 drone_4_equipment_desc:0 "Drony głównie zachodniego pochodzenia, używane przez wojska na całym świecie do przeprowadzania zwiadu na rozległych obszarach."
 ucav_equipment:0 "Bezzałogowy bojowy statek powietrzny"
 ucav_equipment_short:0 "Bezzałogowy bojowy statek powietrzny"
 combat_drone_0_equipment:0 "Improwizowany dron bojowy"
 combat_drone_0_equipment_short:0 "Improwizowany dron bojowy"
 combat_drone_0_equipment_desc:0 "Małe bezzałogowe statki powietrzne (UCAV) zbudowane z części cywilnych dronów. Choć są znacznie większe niż typowe komercyjne czterowirnikowce, nadal są zbyt małe, by przenosić duże uzbrojenie."
 combat_drone_1_equipment:0 "Nowoczesny dron bojowy"
 combat_drone_1_equipment_short:0 "Nowoczesny dron bojowy"
 combat_drone_1_equipment_desc:0 "Uzbrojone drony, które - dzięki zwiększonej wielkości, ale wciąż niewielkiemu profilowi - mogą siać większe zniszczenia wśród linii wroga i infrastruktury."
 combat_drone_2_equipment:0 "Współczesny dron bojowy"
 combat_drone_2_equipment_short:0 "Współczesny dron bojowy"
 combat_drone_2_equipment_desc:0 "Drony bojowe najwyższej klasy, nowoczesne, z wieloma zaawansowanymi funkcjami i zdolnościami."
 helicopter_equipment:0 "Śmigłowiec szturmowy"
 helicopter_equipment_short:0 "Śmigłowiec szturmowy"
 helicopter_equipment_desc:0 "...*pyr-pyr-pyr-pyr-pyr-pyr-BRRRRRRRRRRRRRRRRRRRRRRRRRRR-pyr-pyr-pyr-pyr-pyr-pyr*..."
 helicopter_0_equipment:0 "Improwizowany śmigłowiec/Aerostat"
 helicopter_0_equipment_short:0 "Improwizowany śmigłowiec/Aerostat"
 helicopter_0_equipment_desc:0 "Różne znalezione śmigłowce i aerostaty (małe sterowce i balony gazowe, niektóre nawet samodzielnie zbudowane) o bardzo niskich zdolnościach bojowych. Trudne do zestrzelenia i jeszcze trudniejsze do wykorzystania w inny sposób niż do zwiadu."
 helicopter_1_equipment:0 "Zmodyfikowany śmigłowiec cywilny"
 helicopter_1_equipment_short:0 "Zmodyfikowany śmigłowiec cywilny"
 helicopter_1_equipment_desc:0 "Cywilne śmigłowce, które zostały zmodyfikowane, aby lepiej nadawały się do użytku bojowego. Nadal trudne do zestrzelenia, a jeszcze trudniejsze do wykorzystania w inny sposób niż do zwiadu."
 helicopter_2_equipment:0 "Uzbrojony stary śmigłowiec wielozadaniowy"
 helicopter_2_equipment_short:0 "Uzbrojony stary śmigłowiec wielozadaniowy"
 helicopter_2_equipment_desc:0 "Stare, wielozadaniowe śmigłowce, dla których również produkowano wersje wojskowe. Modele, które wciąż pamiętają wojnę w Wietnamie"
 helicopter_3_equipment:0 "Klasyczny śmigłowiec szturmowy"
 helicopter_3_equipment_short:0 "Klasyczny śmigłowiec szturmowy"
 helicopter_3_equipment_desc:0 "Mi-24 i inne masowo eksportowane śmigłowce szturmowe z czasów zimnej wojny. Robią 'pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr' i sprawiają że ludzie na ich widok robią 'o Boże-o kurwa-o Boże-o kurwa-o Boże-o kurwa-o Boże-o kurwa'."
 helicopter_4_equipment:0 "Współczesny śmigłowiec szturmowy"
 helicopter_4_equipment_short:0 "Współczesny śmigłowiec szturmowy"
 helicopter_4_equipment_desc:0 "Kopie polskich W-3 Sokół i SW-4 Puszczyk produkowane w Świdniku przed Upadkiem. W końcu - dobre, nowoczesne wyposażenie, którego nie musimy nielegalnie kopiować z zagranicy."
 trans_helicopter_equipment:0 "Śmigłowiec transportowy"
 trans_helicopter_equipment_short:0 "Śmigłowiec transportowy"
 trans_helicopter_equipment_desc:0 "...*pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr*..."
 trans_helicopter_equipment_0:0 "Stary śmigłowiec wielozadaniowy"
 trans_helicopter_equipment_0_short:0 "Stary śmigłowiec wielozadaniowy"
 trans_helicopter_equipment_0_desc:0 "Odnowione ambulanse powietrzne oraz stare, wielozadaniowe cywilne i wojskowe śmigłowce używane do transportu ludzi z pola bitwy oraz na pole bitwy. Modele takie jak Mi-4."
 trans_helicopter_equipment_1:0 "Klasyczny śmigłowiec transportowy"
 trans_helicopter_equipment_1_short:0 "Klasyczny śmigłowiec transportowy"
 trans_helicopter_equipment_1_desc:0 "Śmigłowce z czasów zimnej wojny zaprojektowane z myślą o transportowaniu żołnierzy, takie jak Mi-8. Robią 'pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr-pyr', ale zamiast sprawiać że ludzie robią 'o Boże-o kurwa-o Boże-o kurwa-o Boże-o kurwa-o Boże-o kurwa' po prostu zabierają ich i wyrzucają gdzieś indziej."
 trans_helicopter_equipment_2:0 "Współczesny śmigłowiec transportowy"
 trans_helicopter_equipment_2_short:0 "Współczesny śmigłowiec transportowy"
 trans_helicopter_equipment_2_desc:0 "Chinooki i inne nowoczesne, ciężkie śmigłowce transportowe. To "choppa", do których kazałby ci wsiadać Schwarzenegger."
 vtol_equipment:0 "Vtol Equipment"
 vtol_equipment_short:0 "Vtol Equipment"
 vtol_equipment_0:0 "Vtol Equipment 0"
 vtol_equipment_0_short:0 "Vtol Equipment 0"
