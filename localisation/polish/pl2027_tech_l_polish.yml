 railways_good_tech_1:0 "Odbudowa starych lini kolejowych"
 railways_good_tech_1_desc:0 "Upadek sprawił, że wiele lini kolejowych zostało zdemontowanych, zniszczonych lub przynajmniej są w stanie całkowitego rozkładu - a PKP i tak miało problemy z ich utrzymaniem. Musimy zorganizować masowy program rekonstrukcji kolejowej, jeśli chcemy wykorzystać transport kolejowy dla naszej armii.."
 railways_good_tech_2:0 "Bezpieczne linie zaopatrzeniowe"
 railways_good_tech_2_desc:0 "Bez względu na to, jak dobre są nasze połączenia między węzłami zaopatrzeniowymi, nasi żołnierze będą głodni, jeśli nasze *kołowe* konwoje zaopatrzeniowe będą ciągle atakowane i nękane przez wrogie oddziały. Musimy zorganizować siły dedykowane ochronie naszych karawan zaopatrzeniowych, aby łatwiej eksportować towary na pole bitwy i importować łupy z powrotem. Gdy nasze łańcuchy dostaw będą zabezpieczone, znacznie łatwiej będzie nam poszerzać ich szlaki."
 railways_good_tech_3:0 "Nowoczesne rozwiązania kolejowe"
 railways_good_tech_3_desc:0 "Nowoczesne, odpowiednie rozwiązania budowlane, narzędzia i materiały, które pozwalają nam szybko tworzyć pełne połączenia kolejowe między dużymi miastami, aby zabezpieczyć łupy i zaopatrzyć nasze wojska."
