l_polish:
 TFE_faza_mod_1:0 "Rozpad Polski – faza I: Kryzys instytucjonalny"
 TFE_faza_mod_1_desc:0 "Sejm, Pałac i sądy wydają sprzeczne komunikaty. Urzędy działają siłą rozpędu, ale nikt nie wie, czyje polecenia wykonywać. Wskaźniki kryzysu: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!. Presja rozpadu §Y[?global.TFE_presja|0]§!/100."
 TFE_faza_mod_2:0 "Rozpad Polski – faza II: Bunty regionalne"
 TFE_faza_mod_2_desc:0 "Pierwsze samorządy przestają przekazywać podatki do Warszawy. Lokalni liderzy przejmują urzędy wojewódzkie i magazyny. Wskaźniki kryzysu: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!. Presja rozpadu §Y[?global.TFE_presja|0]§!/100."
 TFE_faza_mod_3:0 "Rozpad Polski – faza III: Utrata centralnej kontroli"
 TFE_faza_mod_3_desc:0 "Policja i wojsko słuchają tych, którzy płacą. Ministerstwa nie mają łączności z połową kraju. Wskaźniki kryzysu: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!. Presja rozpadu §Y[?global.TFE_presja|0]§!/100."
 TFE_faza_mod_4:0 "Rozpad Polski – faza IV: Secesje i konflikt"
 TFE_faza_mod_4_desc:0 "Regiony ogłaszają niepodległość, a spory o granice gmin przestają być sporami na papierze. Od teraz można prowadzić wojny z drzewek narodowych. Wskaźniki kryzysu: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!. Presja rozpadu §Y[?global.TFE_presja|0]§!/100."
 TFE_faza_mod_5:0 "Rozpad Polski – faza V: Walka o nowy porządek"
 TFE_faza_mod_5_desc:0 "Nikt już nie udaje, że stara Rzeczpospolita wróci sama. Liczy się, kto zbuduje nowy porządek – i jaki. Wskaźniki kryzysu: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!. Presja rozpadu §Y[?global.TFE_presja|0]§!/100."
 tfe.1.t:0 "Godzina Zero"
 tfe.1.d:0 "11 listopada 2027. W dniu, w którym kraj miał świętować niepodległość, centralne instytucje przestają się porozumiewać. Sejm, Pałac i sądy ogłaszają sprzeczne decyzje, a urzędy w regionach pytają, kogo mają słuchać.\n\nRozpad postępuje w pięciu fazach. Na razie trwa §Ykryzys instytucjonalny§!: wojny z drzewek narodowych są zablokowane do §Yfazy IV§!, a władze w Warszawie mogą próbować opóźnić rozpad decyzjami z panelu „Kryzys Rzeczypospolitej”."
 tfe.1.a:0 "Zaczynamy."
 TFE_req_faza4:0 "Okres przejściowy po rozpadzie minął (od §Ykwietnia 2028§!)"
 tfe.12.t:0 "Faza II: Bunty regionalne"
 tfe.12.d:0 "Pierwsze samorządy przestają przekazywać podatki do Warszawy. Lokalni liderzy przejmują urzędy wojewódzkie i magazyny.\n\nPresja rozpadu: §Y[?global.TFE_presja|0]§!/100."
 tfe.12.a:0 "Rozumiemy."
 tfe.13.t:0 "Faza III: Utrata centralnej kontroli"
 tfe.13.d:0 "Policja i wojsko słuchają tych, którzy płacą. Ministerstwa nie mają łączności z połową kraju.\n\nPresja rozpadu: §Y[?global.TFE_presja|0]§!/100."
 tfe.13.a:0 "Rozumiemy."
 tfe.14.t:0 "Faza IV: Secesje i konflikt"
 tfe.14.d:0 "Regiony ogłaszają niepodległość, a spory o granice gmin przestają być sporami na papierze. Od teraz można prowadzić wojny z drzewek narodowych.\n\nPresja rozpadu: §Y[?global.TFE_presja|0]§!/100."
 tfe.14.a:0 "Rozumiemy."
 tfe.15.t:0 "Faza V: Walka o nowy porządek"
 tfe.15.d:0 "Nikt już nie udaje, że stara Rzeczpospolita wróci sama. Liczy się, kto zbuduje nowy porządek – i jaki.\n\nPresja rozpadu: §Y[?global.TFE_presja|0]§!/100."
 tfe.15.a:0 "Rozumiemy."
 TFE_tt_1:0 "Lojalność samorządów §G+8§!, Stabilność gospodarcza §R-4§!"
 TFE_tt_2:0 "Kontrola służb §R-4§!, Lojalność samorządów §R-6§!, Stabilność gospodarcza §G+5§!"
 TFE_tt_3:0 "Jedność państwa §G+4§!, Zaufanie społeczne §R-6§!, Presja rozpadu §G-3§!"
 TFE_tt_4:0 "Jedność państwa §G+4§!, Stabilność gospodarcza §R-3§!"
 TFE_tt_5:0 "Lojalność samorządów §G+6§!, Jedność państwa §R-5§!, Presja rozpadu §G-4§!"
 TFE_tt_6:0 "Jedność państwa §R-8§!, Presja rozpadu §R+6§!"
 TFE_tt_7:0 "Zaufanie społeczne §G+5§!, Jedność państwa §R-6§!"
 TFE_tt_8:0 "Jedność państwa §G+6§!, Zaufanie społeczne §R-4§!"
 TFE_tt_9:0 "Zaufanie społeczne §G+6§!"
 TFE_tt_10:0 "Stabilność gospodarcza §G+6§!, Zaufanie społeczne §R-6§!"
 TFE_tt_11:0 "Stabilność gospodarcza §G+10§!, Jedność państwa §R-5§!"
 TFE_tt_12:0 "Stabilność gospodarcza §G+4§!, Zaufanie społeczne §R-3§!"
 TFE_tt_13:0 "Kontrola służb §G+10§!, Stabilność gospodarcza §R-5§!"
 TFE_tt_14:0 "Kontrola służb §G+6§!, Zaufanie społeczne §R-5§!"
 TFE_tt_15:0 "Zaufanie społeczne §G+8§!"
 TFE_tt_16:0 "Kontrola służb §G+3§!, Zaufanie społeczne §R-8§!, Presja rozpadu §R+5§!"
 TFE_tt_17:0 "Lojalność samorządów §G+12§!, Jedność państwa §R-3§!"
 TFE_tt_18:0 "Lojalność samorządów §R-5§!, Stabilność gospodarcza §G+4§!, Presja rozpadu §R+6§!"
 TFE_tt_19:0 "Lojalność samorządów §G+6§!, Presja rozpadu §G-8§!"
 tfe.2.t:0 "Regiony przestają płacić"
 tfe.2.d:0 "Skarbnicy pięciu województw nie przelali podatków. Wojewodowie pytają, czy mają egzekwować należności siłą, czy negocjować.\n\nWskaźniki: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!."
 tfe.2.a:0 "Negocjować – lepszy słaby związek niż żaden."
 tfe.2.b:0 "Egzekwować należności – państwo nie może prosić."
 tfe.2.c:0 "Ogłosić stan nadzwyczajny w finansach."
 tfe.3.t:0 "Ministerstwa bez łączności"
 tfe.3.d:0 "Serwerownie ministerstw padają jedna po drugiej. Połowa kraju nie odbiera rozporządzeń, a druga połowa ich nie wykonuje.\n\nWskaźniki: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!."
 tfe.3.a:0 "Kurierzy i radio – państwo na piechotę."
 tfe.3.b:0 "Przekazać kompetencje wojewodom."
 tfe.3.c:0 "Zostawić regiony samym sobie."
 tfe.4.t:0 "Pierwsze deklaracje niepodległości"
 tfe.4.d:0 "Regiony ogłaszają niepodległość jeden po drugim. Część z nich wciąż wysyła delegatów do Sejmu – inne zrywają łączność.\n\nWskaźniki: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!."
 tfe.4.a:0 "Uznać faktyczny stan rzeczy i negocjować granice."
 tfe.4.b:0 "Odmówić uznania – Rzeczpospolita jest jedna."
 tfe.5.t:0 "Kto zbuduje nowy porządek?"
 tfe.5.d:0 "Stare instytucje istnieją już głównie w nazwie. W Warszawie mówi się otwarcie o nowej konstytucji – albo o nowym państwie.\n\nWskaźniki: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!."
 tfe.5.a:0 "Projekt nowej konstytucji dla całego kraju."
 tfe.5.b:0 "Najpierw Warszawa, potem reszta kraju."
 tfe.20.t:0 "Krach złotego"
 tfe.20.d:0 "Kantory przestają przyjmować złotówki, a sklepy liczą ceny w euro i papierosach. Wypłaty w budżetówce opóźniają się o miesiąc.\n\nWskaźniki: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!."
 tfe.20.a:0 "Nadzwyczajna emisja pieniądza."
 tfe.20.b:0 "Przejście na euro w rozliczeniach państwa."
 tfe.20.c:0 "Kartki na podstawowe towary."
 tfe.21.t:0 "Służby się dzielą"
 tfe.21.d:0 "Komendy wojewódzkie policji i część garnizonów składają raporty lokalnym władzom, a nie Warszawie. Kontrwywiad nie wie, kto komu podlega.\n\nWskaźniki: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!."
 tfe.21.a:0 "Podwyżki i amnestia dla dezerterów."
 tfe.21.b:0 "Czystka w dowództwach."
 tfe.22.t:0 "Fala protestów"
 tfe.22.d:0 "Pod urzędami w całym kraju stoją ludzie z transparentami „Oddajcie nam państwo”. W kilku miastach protestujący zajmują budynki.\n\nWskaźniki: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!."
 tfe.22.a:0 "Wyjść do ludzi – spotkania i transmisje."
 tfe.22.b:0 "Rozpędzić blokady."
 tfe.23.t:0 "Bunt samorządów"
 tfe.23.d:0 "Związek miast i powiatów ogłasza, że do czasu wyborów nie będzie wykonywał poleceń rządu. Podpisało się ponad stu burmistrzów.\n\nWskaźniki: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!."
 tfe.23.a:0 "Okrągły stół z samorządami."
 tfe.23.b:0 "Odebrać dotacje buntownikom."
 tfe.24.t:0 "Promyk nadziei"
 tfe.24.d:0 "Pierwszy raz od tygodni sondaże pokazują, że większość ludzi wierzy w odbudowę wspólnego państwa. Regiony pytają o warunki powrotu.\n\nWskaźniki: jedność §Y[?global.TFE_jednosc|0]§!, samorządy §Y[?global.TFE_samorzady|0]§!, służby §Y[?global.TFE_sluzby|0]§!, gospodarka §Y[?global.TFE_gospodarka|0]§!, zaufanie §Y[?global.TFE_zaufanie|0]§!."
 tfe.24.a:0 "Zaproponować regionom nową umowę."
 tfe.24.b:0 "Wykorzystać chwilę do wzmocnienia Warszawy."
 TFE_suwerennosc:0 "Ogłoszona suwerenność"
 TFE_suwerennosc_desc:0 "Region ogłosił pełną niezależność od Warszawy: własny budżet, własne prawo, własna armia."
 TFE_autonomia:0 "Autonomia w Rzeczypospolitej"
 TFE_autonomia_desc:0 "Region rządzi się sam, ale formalnie zostaje częścią Rzeczypospolitej i przysyła delegatów do Sejmu."
 TFE_tt_20:0 "Lojalność samorządów §R-4§!, Presja rozpadu §R+4§!"
 TFE_tt_21:0 "Lojalność samorządów §G+5§!, Presja rozpadu §G-3§!"
 tfe.30.t:0 "Bunt w regionie"
 tfe.30.d:0 "Radni zbierają się na nadzwyczajnej sesji. Pytanie jest jedno: czy [Root.GetName] wciąż słucha Warszawy, czy od dziś rządzi się sama?"
 tfe.30.a:0 "Przejmujemy urzędy państwowe."
 tfe.30.b:0 "Zostajemy lojalni wobec Warszawy – na razie."
 TFE_tt_22:0 "Kontrola służb §G+5§!"
 TFE_tt_23:0 "Zaufanie społeczne §G+5§!, Kontrola służb §R-3§!"
 tfe.31.t:0 "Komenda Stołeczna wybiera stronę"
 tfe.31.d:0 "Komendant Stołeczny dostaje jednocześnie rozkazy z Sejmu, z Pałacu i od wojewody. Policja musi zdecydować, komu podlega."
 tfe.31.a:0 "Policja słucha Sejmu."
 tfe.31.b:0 "Policja jest neutralna – chroni ludzi, nie polityków."
 TFE_tt_24:0 "Jedność państwa §G+3§!, Kontrola służb §R-2§!"
 tfe.32.t:0 "Garnizony bez rozkazów"
 tfe.32.d:0 "Dowódcy garnizonów z Rembertowa i Wesołej czekają na rozkazy, które nie przychodzą. Żołnierze pytają, czy jutro dostaną żołd."
 tfe.32.a:0 "Wojsko słucha Prezydenta."
 tfe.32.b:0 "Wojsko broni stolicy, nie polityków."
 TFE_tt_25:0 "Jedność państwa §R-5§!, Presja rozpadu §R+5§!"
 TFE_tt_26:0 "Jedność państwa §G+3§!, Lojalność samorządów §G+4§!"
 tfe.33.t:0 "Ogłoszenie secesji?"
 tfe.33.d:0 "Faza IV rozpadu: w sali obrad leży gotowy tekst deklaracji niepodległości. Wystarczy jeden podpis."
 tfe.33.a:0 "Pełna suwerenność."
 tfe.33.b:0 "Autonomia w ramach Rzeczypospolitej."
 TFE_kryzys:0 "Kryzys Rzeczypospolitej"
 TFE_kryzys_desc:0 "Faza rozpadu: §Y[?global.TFE_faza|0]§!/5. Presja rozpadu: §Y[?global.TFE_presja|0]§!/100 – progi: 25 (faza II), 50 (III), 75 (IV), 100 (V); każda faza ma też najwcześniejszą i najpóźniejszą datę, więc rozpadu nie da się zatrzymać na zawsze.\nJedność państwa: §Y[?global.TFE_jednosc|0]§! – Im wyższa, tym wolniej rośnie presja rozpadu. Poniżej 20 regiony coraz śmielej ogłaszają suwerenność.\nLojalność samorządów: §Y[?global.TFE_samorzady|0]§! – Wysoka – samorządy przekazują podatki i wykonują polecenia. Poniżej 15 – bunt samorządów.\nKontrola służb: §Y[?global.TFE_sluzby|0]§! – Policja, wojsko i służby słuchają władz centralnych. Poniżej 20 – służby dzielą się między ośrodki władzy.\nStabilność gospodarcza: §Y[?global.TFE_gospodarka|0]§! – Wypłaty, dostawy i waluta. Poniżej 15 – krach złotego.\nZaufanie społeczne: §Y[?global.TFE_zaufanie|0]§! – Czy ludzie wierzą komunikatom władz. Poniżej 15 – fala protestów.\nCo miesiąc wskaźniki spadają, a presja rośnie tym szybciej, im niższa jest ich średnia (teraz §Y[?global.TFE_srednia|0]§!)."
 TFE_tt_27:0 "Lojalność samorządów §G+8§!, Jedność państwa §G+3§!, Presja rozpadu §G-4§!, Stabilność gospodarcza §R-2§!"
 TFE_d_samorzady:0 "Negocjacje z samorządami"
 TFE_d_samorzady_desc:0 "Delegacje rządu jadą do marszałków województw i prezydentów miast. Pieniądze w zamian za lojalność."
 TFE_tt_28:0 "Jedność państwa §G+6§!, Zaufanie społeczne §G+4§!, Presja rozpadu §G-3§!"
 TFE_d_sejm:0 "Nadzwyczajne posiedzenie Sejmu"
 TFE_d_sejm_desc:0 "Posłowie zbierają się mimo blackoutów i blokad. Uchwała o ciągłości państwa wzmacnia jedność – ale debata jest burzliwa (stabilność −2%)."
 TFE_tt_29:0 "Kontrola służb §G+10§!, Zaufanie społeczne §R-4§!, Presja rozpadu §G-2§!"
 TFE_d_zandarmeria:0 "Mobilizacja żandarmerii"
 TFE_d_zandarmeria_desc:0 "Żandarmeria Wojskowa przejmuje ochronę urzędów i łączności. Kontrola służb rośnie, zaufanie spada; kosztuje 1500 żołnierzy."
 TFE_dotacje:0 "Dotacje ratunkowe"
 TFE_dotacje_desc:0 "Budżet dopłaca do szpitali, wodociągów i komunikacji w całym kraju."
 TFE_tt_30:0 "Stabilność gospodarcza §G+8§!, Zaufanie społeczne §G+2§!, Presja rozpadu §G-2§!"
 TFE_d_dotacje:0 "Dotacje ratunkowe"
 TFE_d_dotacje_desc:0 "Pieniądze z rezerw trafiają do szpitali i wodociągów w regionach. Gospodarka stabilizuje się, ale budżet władz centralnych płaci za to dobrami konsumpcyjnymi przez 90 dni."
 TFE_ochrona_infra:0 "Ochrona infrastruktury"
 TFE_ochrona_infra_desc:0 "Strażnicy i żołnierze pilnują elektrowni, stacji kolejowych i przekaźników zamiast pracować w zakładach."
 TFE_tt_31:0 "Stabilność gospodarcza §G+4§!, Kontrola służb §G+4§!, Presja rozpadu §G-2§!"
 TFE_d_infrastruktura:0 "Ochrona infrastruktury"
 TFE_d_infrastruktura_desc:0 "Posterunki przy elektrowniach, węzłach kolejowych i przekaźnikach. Stabilniej, ale część ludzi nie pracuje w fabrykach (60 dni)."
 TFE_tt_32:0 "Zaufanie społeczne §G+5§!, Presja rozpadu §G-2§!"
 TFE_d_odezwa:0 "Odezwa do narodu"
 TFE_d_odezwa_desc:0 "Wspólne orędzie transmitowane przez wszystkie stacje, które jeszcze nadają. Działa – dopóki ludzie wierzą w słowa."
 TFE_req_obie:0 "Istnieją Straż Marszałkowska i Kancelaria Prezydenta, nie walczą ze sobą, a jedność państwa wynosi co najmniej 30"
 TFE_tt_33:0 "Jedność państwa §G+15§!, Zaufanie społeczne §G+10§!, Lojalność samorządów §G+5§!, Presja rozpadu §G-15§!"
 TFE_d_rzad_jednosci:0 "Rząd jedności narodowej"
 TFE_d_rzad_jednosci_desc:0 "Sejm i Pałac powołują wspólny rząd. Ogromny krok ku jedności – i koniec samodzielności obu ośrodków (każdy płaci 100 PP, a drugi musi być w pokoju z nami)."
 tfe.25.t:0 "Rząd jedności narodowej"
 tfe.25.d:0 "[From.GetName] powołuje wspólny rząd jedności narodowej. Ministrowie z Sejmu i z Pałacu siadają przy jednym stole – pierwszy raz od miesięcy."
 tfe.25.a:0 "Państwo jest jedno."
 TFE_tt_34:0 "Lojalność samorządów §G+4§!, Presja rozpadu §G-3§!"
 TFE_d_lojalnosc:0 "Deklaracja lojalności wobec Warszawy"
 TFE_d_lojalnosc_desc:0 "Region przekazuje część podatków i uznaje ustawy Sejmu. Mniej pieniędzy, więcej spokoju (stabilność +2%, skłonność do secesji −15; w jednej Rzeczypospolitej region uchodzi za lojalny)."
 TFE_tt_35:0 "Lojalność samorządów §R-3§!, Jedność państwa §R-2§!, Presja rozpadu §R+3§!"
 TFE_d_przejecie:0 "Przejęcie urzędów państwowych"
 TFE_d_przejecie_desc:0 "Region przejmuje urząd skarbowy, magazyny rezerw i komendy. Szybki zysk (+40 PP) kosztem Rzeczypospolitej; skłonność do secesji +15."
 TFE_koniec_korporacja:0 "Polska Spółka Narodowa"
 TFE_koniec_korporacja_desc:0 "Kraj zjednoczyła korporacja. Ministerstwa mają zarządy, obywatele – karty lojalnościowe, a konstytucję zastąpił regulamin świadczenia usług."
 TFE_koniec_regiony:0 "Rzeczpospolita Regionów"
 TFE_koniec_regiony_desc:0 "Polska wraca jako federacja regionów: każdy ma własny sejmik, własną policję i prawo weta. Państwo jest słabsze – i bardziej wspólne."
 TFE_koniec_demokracja:0 "Rzeczpospolita Polska"
 TFE_koniec_demokracja_desc:0 "Demokratyczne zjednoczenie: wybory w całym kraju, nowa konstytucja i Sejm, który znów obraduje w imieniu wszystkich."
 TFE_koniec_wojsko:0 "Państwo Polskie"
 TFE_koniec_wojsko_desc:0 "Kraj zjednoczyła siła. Rada wojskowa rządzi dekretami, a słowo „tymczasowo” nie znika z ustaw od miesięcy."
 TFE_koniec_protektorat:0 "Protektorat"
 TFE_koniec_protektorat_desc:0 "Ziemie polskie są pod zarządem obcego mocarstwa. Lokalne władze istnieją – ale decyzje zapadają gdzie indziej."
 TFE_koniec_rozpad:0 "Trwały rozpad"
 TFE_koniec_rozpad_desc:0 "Nikt nie zjednoczył kraju. Mapa zostaje mozaiką, a granice gmin stają się granicami państw na długie lata."
 TFE_zwyciezca_nazwa:0 "zwycięzca"
 tfe.60.t:0 "Zakończenie: Polska Spółka Narodowa"
 tfe.60.d:0 "Kraj zjednoczyła korporacja. Ministerstwa mają zarządy, obywatele – karty lojalnościowe, a konstytucję zastąpił regulamin świadczenia usług.\n\nNowe państwo kontroluje co najmniej 500 z 1289 polskich regionów i dostaje rdzenie na wszystkich swoich ziemiach."
 tfe.60.a:0 "Nowy rozdział."
 tfe.61.t:0 "Zakończenie: Rzeczpospolita Regionów"
 tfe.61.d:0 "Polska wraca jako federacja regionów: każdy ma własny sejmik, własną policję i prawo weta. Państwo jest słabsze – i bardziej wspólne.\n\nNowe państwo kontroluje co najmniej 500 z 1289 polskich regionów i dostaje rdzenie na wszystkich swoich ziemiach."
 tfe.61.a:0 "Nowy rozdział."
 tfe.62.t:0 "Zakończenie: Rzeczpospolita Polska"
 tfe.62.d:0 "Demokratyczne zjednoczenie: wybory w całym kraju, nowa konstytucja i Sejm, który znów obraduje w imieniu wszystkich.\n\nNowe państwo kontroluje co najmniej 500 z 1289 polskich regionów i dostaje rdzenie na wszystkich swoich ziemiach."
 tfe.62.a:0 "Nowy rozdział."
 tfe.63.t:0 "Zakończenie: Państwo Polskie"
 tfe.63.d:0 "Kraj zjednoczyła siła. Rada wojskowa rządzi dekretami, a słowo „tymczasowo” nie znika z ustaw od miesięcy.\n\nNowe państwo kontroluje co najmniej 500 z 1289 polskich regionów i dostaje rdzenie na wszystkich swoich ziemiach."
 tfe.63.a:0 "Nowy rozdział."
 tfe.64.t:0 "Zakończenie: Protektorat"
 tfe.64.d:0 "Obce mocarstwo kontroluje ponad 300 polskich regionów. W urzędach wiszą dwa godła, ale tylko jedno ma znaczenie."
 tfe.64.a:0 "Nowy rozdział."
 tfe.65.t:0 "Zakończenie: Trwały rozpad"
 tfe.65.d:0 "Mija rok 2030. Nikt nie zjednoczył kraju i nikt już tego nie obiecuje. Dzieci uczą się w szkołach historii „swoich” państw."
 tfe.65.a:0 "Nowy rozdział."
