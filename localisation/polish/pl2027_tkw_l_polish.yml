l_polish:
 TKW_mobilizacja:0 "Mobilizacja kurierów"
 TKW_mobilizacja_desc:0 "Skutery dostawcze wożą amunicję, a dyspozytornia zamówień stała się sztabem. Każdy kurier zna drogę do Inowrocławia."
 TKW_ofensywa:0 "Ofensywa na Inowrocław"
 TKW_ofensywa_desc:0 "Brygady Ekspresowej Dostawy mają jedno zadanie: dotrzeć do Inowrocławia, zanim wystygnie obiad."
 TKW_korytarz:0 "Korytarz tranzytowy przez Kujawy"
 TKW_korytarz_desc:0 "Kolumny T-Pizzy jeżdżą przez Kujawy na mocy umowy tranzytowej. Inowrocław dostaje opłaty, Włocławek – dostęp do regionu."
 TKW_obrona_kujaw:0 "Obrona Kujaw"
 TKW_obrona_kujaw_desc:0 "Inowrocław, Kruszwica i Strzelno szykują się do obrony. Solankowe uzdrowisko zamieniło się w szpital polowy, a ochotnicy kopią okopy nad Gopłem."
 TKW_tt_trasa:0 "Republika Kujawska zdecyduje: §Ykorytarz tranzytowy§! (dostęp wojskowy) albo §Rodmowa§! (otwiera drogę do wojny)."
 TKW_tt_cb:0 "Cel wojenny wobec §YRepubliki Kujawskiej§!. Wojnę wypowiada fokus §YUderzenie na Kujawy§! – po zebraniu odpowiednio dużej armii."
 TKW_req_wygrana:0 "Mamy korytarz tranzytowy, ALBO Republika Kujawska jest naszym podporządkowanym państwem, ALBO kontrolujemy Aleksandrów Kujawski i Inowrocław"
 TKW_tt_droga:0 "Rdzenie w zdobytych regionach Kujaw, roszczenia wobec §YSolca Kujawskiego§!, §YNowej Wsi Wielkiej§! i §YŻnina§!. Odblokowuje kampanie franczyzowe (dalsze cele ekspansji)."
 tkw.1.t:0 "Ultimatum T-Pizzy w sprawie DK62"
 tkw.1.d:0 "Zarząd T-Pizzy z Włocławka żąda otwarcia drogi krajowej 62 i korytarza tranzytowego dla swoich kolumn – także wojskowych. W zamian oferuje opłaty tranzytowe i darmowe dostawy dla urzędów. Odmowa oznacza, że Włocławek zostanie zamknięty w swoich granicach – i że będzie szukał innego sposobu, by się z nich wydostać."
 tkw.1.a:0 "Otwieramy drogi – korytarz tranzytowy."
 tkw.1.b:0 "Kujawy nie są na sprzedaż."
 tkw.2.t:0 "Kujawy otwierają drogi"
 tkw.2.d:0 "Inowrocław przyjął naszą ofertę. Kolumny T-Pizzy mogą przejeżdżać przez Kujawy – droga do Torunia i Bydgoszczy stoi otworem."
 tkw.2.a:0 "Pierwsza dostawa do Inowrocławia gratis."
 tkw.3.t:0 "Kujawy odmawiają"
 tkw.3.d:0 "Republika Kujawska odrzuciła ofertę korytarza. Drogi pozostają zamknięte, a myto w Kruszwicy – podwojone. Zarząd zwołuje posiedzenie przy zgaszonych światłach."
 tkw.3.a:0 "Zapamiętamy to."
 tkw.10.t:0 "T-Pizza grozi wojną"
 tkw.10.d:0 "Po incydencie pod Kruszwicą Włocławek otwarcie mówi o „przywróceniu przejezdności DK62 wszelkimi środkami”. Nasza armia jest mała, ale broni własnej ziemi. Rada Republiki musi zdecydować, jak przygotować obronę."
 tkw.10.a:0 "Pospolite ruszenie Kujaw!"
 tkw.10.b:0 "Prosimy Toruń o gwarancję niepodległości."
 tkw.11.t:0 "Kujawy proszą o pomoc"
 tkw.11.d:0 "Republika Kujawska prosi nas o gwarancję niepodległości wobec T-Pizzy. Jeśli Włocławek przejdzie przez Kujawy, następny w kolejce będzie Toruń."
 tkw.11.a:0 "Gwarantujemy niepodległość Kujaw."
 tkw.11.b:0 "Mamy własne problemy."
 tkw.20.t:0 "Droga na północ otwarta"
 tkw.20.d:0 "Pierwsza kolumna T-Pizzy wjechała do Aleksandrowa Kujawskiego. Za nią – Toruń, Solec, Nowa Wieś Wielka i Pałuki. Rafał Archacki nagrywa relację z dachu chłodni: „Dowozimy wszędzie”."
 tkw.20.a:0 "Następny przystanek: cały region."
 tkw.21.t:0 "Upadek Republiki Kujawskiej"
 tkw.21.d:0 "Inowrocław skapitulował. Flaga Republiki Kujawskiej znika z ratusza, a w jej miejsce zawisa czerwony baner z logo T-Pizzy. Kujawy zmieniły właściciela."
 tkw.21.a:0 "Region się zmienia."
