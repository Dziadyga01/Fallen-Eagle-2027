l_polish:
 TPZ_franczyza_op:0 "Lokal T-Pizzy w mieście"
 TPZ_kontrakt_maki_op:0 "Kontrakt na mąkę z T-Pizzą"
 TPZ_siec_mod:0 "Sieć T-Pizzy"
 TPZ_siec_mod_desc:0 "Lokali w sieci: §Y[?TPZ_lokale|0]§!. Łańcuch dostaw: §Y[?TPZ_dostawy|0]§!/100 – poniżej 40 brakuje mąki, sera albo paliwa, a klienci tracą cierpliwość."
 TP2_tt_dp15:0 "Łańcuch dostaw: §G+15§!"
 TP2_tt_dp5:0 "Łańcuch dostaw: §G+5§!"
 TP2_tt_dp8:0 "Łańcuch dostaw: §G+8§!"
 tp2.1.t:0 "Braki w dostawach"
 tp2.1.d:0 "Kuchnie zgłaszają braki: mąki starcza na trzy dni, ser przyjeżdża z opóźnieniem, a skutery stoją bez paliwa. Klienci czekają dłużej niż 30 minut – i zaczynają to głośno mówić.\n\nŁańcuch dostaw: §Y[?TPZ_dostawy|0]§!/100."
 tp2.1.a:0 "Zapłacić każdą cenę (40 PP)."
 tp2.1.b:0 "Mniejsze porcje, te same ceny."
 tp2.1.c:0 "Zamknąć część lokali."
 tp2.2.t:0 "Kontrakt na mąkę"
 tp2.2.d:0 "[From.GetName] proponuje stały kontrakt: nasze młyny i spółdzielnie dostarczają mąkę do centralnej kuchni, a korporacja płaci z góry. Rolnicy liczą na pewny zbyt, radni – na podatki."
 tp2.2.a:0 "Podpisać kontrakt."
 tp2.2.b:0 "Nie sprzedajemy korporacji."
 tp2.3.t:0 "T-Pizza chce otworzyć lokal"
 tp2.3.d:0 "[From.GetName] chce otworzyć w naszym mieście lokal z dostawą do domu – z gwarancją ciepłej pizzy i pracy dla kilkunastu osób. Część radnych mówi o „korporacyjnej kolonizacji”, inni pytają tylko, czy będzie wersja z ananasem."
 tp2.3.a:0 "Zgoda – ludzie potrzebują pracy i ciepłego jedzenia."
 tp2.3.b:0 "Nie wpuścimy korporacji."
 TPZ_siec_kuchnia_idea:0 "Centralna kuchnia"
 TPZ_siec_kuchnia_idea_desc:0 "Hala produkcyjna we Włocławku przygotowuje ciasto i sosy dla całej sieci. Każdy lokal dostaje to samo – i na czas."
 TPZ_siec_flota_idea:0 "Flota dostawcza"
 TPZ_siec_flota_idea_desc:0 "Setki skuterów i dostawczaków. W razie potrzeby wożą też żołnierzy – albo amunicję."
 TPZ_siec_imperium_idea:0 "Imperium dostaw"
 TPZ_siec_imperium_idea_desc:0 "Gdzie dojedzie dostawca T-Pizzy, tam sięga władza korporacji. A dostawca dojeżdża wszędzie w 30 minut."
 TPZ_req_lokale30:0 "Sieć liczy co najmniej §Y30§! lokali"
 TP2_tt_maka:0 "Sąsiednie państwa dostaną propozycję §Ykontraktu na mąkę§! (każdy podpisany: łańcuch dostaw §G+10§!)."
 TP2_tt_l2:0 "Sieć lokali: §G+2§!"
 TP2_tt_franczyza:0 "Sąsiednie państwa dostaną propozycję §Ylokalu T-Pizzy§! (każda zgoda: sieć §G+3§! lokale)."
 TP2_tt_l3:0 "Sieć lokali: §G+3§!"
 TP2_tt_dp12:0 "Łańcuch dostaw: §G+12§!"
