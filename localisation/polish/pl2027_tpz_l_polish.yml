l_polish:
 TPZ_odsetki:0 "Naliczone odsetki T-Pizzy"
 TPZ_embargo_op:0 "Wstrzymane dostawy T-Pizzy"
 TPZ_archacki:0 "Rafał „Archadzio” Archacki"
 TPZ_sobczak:0 "Bartosz Sobczak"
 TPZ_wroblewska:0 "Agnieszka Wróblewska"
 TPZ_partia:0 "T-Pizza Sp. z o.o."
 TPZ_partia_long:0 "T-Pizza Sp. z o.o."
 TPZ_duch_magazyny:0 "Awaryjne magazyny"
 TPZ_duch_magazyny_desc:0 "Hale przy centrali pękają w szwach od mąki, sera i konserw. Miasto wie, że w razie czego T-Pizza ma zapasy."
 TPZ_duch_panstwo_firma:0 "Państwo-firma"
 TPZ_duch_panstwo_firma_desc:0 "Państwem kieruje zarząd, budżet to biznesplan, a obywatel jest przede wszystkim klientem. Klient ma zawsze rację – o ile płaci w terminie."
 TPZ_duch_porzadek:0 "Korporacyjny porządek"
 TPZ_duch_porzadek_desc:0 "Każda dziedzina życia ma swój regulamin, procedurę i wskaźnik efektywności. Zaskakująco wiele rzeczy po prostu działa."
 TPZ_duch_imperium:0 "Imperium T-Pizza"
 TPZ_duch_imperium_desc:0 "Sieć dostaw obejmuje całe Kujawy. Gdzie dojeżdża skuter z czerwoną skrzynką, tam obowiązuje porządek zarządu."
 TPZ_duch_piece:0 "Piece przemysłowe"
 TPZ_duch_piece_desc:0 "Zakłady wypiekowe przestawiono na pracę w trzech zmianach – i nie tylko na pizzę."
 TPZ_duch_monopol:0 "Monopol spożywczy"
 TPZ_duch_monopol_desc:0 "Cały łańcuch od młyna po talerz należy do jednej firmy. Efektywność jest imponująca, wybór – nieco mniejszy."
 TPZ_duch_franczyza:0 "Franczyza zamiast urzędu"
 TPZ_duch_franczyza_desc:0 "Sprawy urzędowe załatwia się w lokalach sieci, przy okienku obok kasy. Kolejki są krótsze niż w dawnym magistracie."
 TPZ_duch_podatek:0 "Podatek od konkurencji"
 TPZ_duch_podatek_desc:0 "Każda pizzeria spoza sieci płaci opłatę wyrównawczą. Budżet się cieszy, klienci mniej."
 TPZ_duch_kupony:0 "Kupony żywnościowe"
 TPZ_duch_kupony_desc:0 "Miesięczna pula kuponów na pizzę, pieczywo i makaron dla każdego mieszkańca. Kartki jak za PRL-u, tylko z kodem QR."
 TPZ_duch_premium:0 "Obywatelstwo Premium"
 TPZ_duch_premium_desc:0 "Abonenci Premium mają szybszą obsługę i darmową dostawę. Reszta obywateli stoi w kolejce standardowej i patrzy z zazdrością."
 TPZ_duch_marketing:0 "Państwowy marketing"
 TPZ_duch_marketing_desc:0 "Billboardy, dżingle i uśmiechnięty prezes na każdym przystanku. Hasło: „Smakuje jak niepodległość”."
 TPZ_duch_jedna_firma:0 "Jedna firma, jeden naród"
 TPZ_duch_jedna_firma_desc:0 "Pracownik, klient i obywatel to ta sama osoba. Poranna odprawa zaczyna się od hymnu – z firmowym dżinglem na końcu."
 TPZ_duch_straz:0 "Straż Korporacyjna"
 TPZ_duch_straz_desc:0 "Czerwone berety pilnują magazynów, lokali i porządku na ulicach. Zawsze uprzejmie, zawsze z prośbą o paragon."
 TPZ_duch_armia:0 "Armia T-Pizza"
 TPZ_duch_armia_desc:0 "Mała, ale najlepiej zaopatrzona armia w środkowej Polsce. Ciepły posiłek dociera na pierwszą linię w 30 minut."
 TPZ_duch_weekend:0 "Darmowa dostawa w weekend"
 TPZ_duch_weekend_desc:0 "Weekendowa promocja kosztuje firmę sporo paliwa, ale klienci są zachwyceni."
 TPZ_duch_strajk:0 "Strajk dostawców"
 TPZ_duch_strajk_desc:0 "Skutery stoją pod centralą, a kurierzy domagają się podwyżek. Zamówienia czekają, praca stoi."
 TPZ_duch_brak_maki:0 "Brak mąki"
 TPZ_duch_brak_maki_desc:0 "Ciasto jest cieńsze, porcje mniejsze, a klienci coraz głośniej o tym mówią."
 TPZ_duch_embargo:0 "Embargo T-Pizzy"
 TPZ_duch_embargo_desc:0 "T-Pizza wstrzymała wszystkie dostawy. Puste półki, brak paliwa do agregatów i zimne kuchnie – gospodarka wpadła w kryzys."
 TPZ_satysfakcja_mod:0 "Satysfakcja klientów"
 TPZ_satysfakcja_mod_desc:0 "Zadowolenie klientów T-Pizza przekłada się na stabilność i siłę polityczną państwa. Obecnie: §Y[?TPZ_satysfakcja|0]/100§!. Powyżej 70 klienci są zachwyceni (mniej dóbr konsumpcyjnych), poniżej 30 grożą strajki, poniżej 15 – bunt."
 TPZ_sat_poziom_wys:0 "§Gklienci zachwyceni§!"
 TPZ_sat_poziom_dob:0 "§Gklienci zadowoleni§!"
 TPZ_sat_poziom_sr:0 "§Ynastroje mieszane§!"
 TPZ_sat_poziom_nis:0 "§Rgroźba strajków§!"
 TPZ_sat_poziom_kryt:0 "§Rgroźba buntu§!"
 TPZ_zarzad:0 "Zarząd T-Pizza"
 TPZ_zarzad_desc:0 "Satysfakcja klientów: §Y[?TPZ_satysfakcja|0]/100§! ([GetTPZSatPoziom])\nPunkty lojalnościowe: §Y[?TPZ_punkty|0]§!\n\nZadowolenie klientów co miesiąc wraca w stronę 50. Powyżej 70 daje premie i otwiera drogę do pokojowych przejęć (wykup państwa wymaga satysfakcji powyżej 59), poniżej 30 grożą strajki, a poniżej 15 – bunt."
 TPZ_sat_tt_p6:0 "Satysfakcja klientów: §G+6§!"
 TPZ_dec_promocja:0 "Promocja 2+1"
 TPZ_dec_promocja_desc:0 "Druga pizza za pół ceny, trzecia gratis. Księgowość płacze, klienci się cieszą."
 TPZ_sat_tt_p4:0 "Satysfakcja klientów: §G+4§!"
 TPZ_dec_weekend:0 "Darmowa dostawa w weekend"
 TPZ_dec_weekend_desc:0 "Przez najbliższy miesiąc w soboty i niedziele dowozimy za darmo – do każdego bloku i każdej wsi."
 TPZ_sat_tt_p7:0 "Satysfakcja klientów: §G+7§!"
 TPZ_dec_punkty_koszt:0 "§Y30§! punktów lojalnościowych"
 TPZ_dec_punkty:0 "Wymiana punktów lojalnościowych"
 TPZ_dec_punkty_desc:0 "Obywatele wymieniają zebrane punkty na pizzę, bilety na mecz Anwilu i inne nagrody."
 TPZ_sat_tt_m10:0 "Satysfakcja klientów: §R-10§!"
 TPZ_dec_podwyzka:0 "Podwyżka cen w całej sieci"
 TPZ_dec_podwyzka_desc:0 "Inflacja, ceny mąki i koszty paliwa – zarząd tłumaczy, klienci liczą. Budżet zyska, nastroje stracą."
 TPZ_tree:0 "Od pierwszej dostawy do własnego państwa"
 TPZ_sat_tt_p5:0 "Satysfakcja klientów: §G+5§!"
 TPZ_mech_kredyt_tt:0 "Odblokowuje §Ydostawy na kredyt§! dla sąsiadów (dług zapisywany u dłużnika)."
 TPZ_mech_franczyza_tt:0 "Odblokowuje §Yzagraniczne franczyzy§! T-Pizza w sąsiednich państwach."
 TPZ_maka_tt:0 "Braki mąki będą mniej dotkliwe."
 TPZ_sat_tt_p3:0 "Satysfakcja klientów: §G+3§!"
 TPZ_sat_tt_m5:0 "Satysfakcja klientów: §R-5§!"
 TPZ_mech_monopol_tt:0 "Sąsiedzi zaopatrywani przez T-Pizzę mogą się od nas §Yuzależnić§!."
 TPZ_lojalnosc_tt:0 "Odblokowuje §Ypunkty lojalnościowe§! (+5 co miesiąc, start: 20) i fokus ich wymiany."
 TPZ_mech_wykup_tt:0 "Odblokowuje §Ywykup państwa§! przy 80 wpływów (wymaga satysfakcji klientów powyżej 59)."
 TPZ_sat_tt_p10:0 "Satysfakcja klientów: §G+10§!"
 tpz.1.t:0 "Dzień darmowej pizzy"
 tpz.1.d:0 "Od rana pod lokalami T-Pizzy ustawiają się kolejki – emeryci, studenci, rodziny z dziećmi, nawet radni miejscy. Kurierzy kursują bez przerwy, a piece w centrali nie stygną ani na chwilę.\n\nRafał „Archadzio” Archacki osobiście wydaje pierwsze kartony i nagrywa relację na żywo. Pytanie tylko, jak daleko posunąć się z hojnością."
 tpz.1.a:0 "Margherita dla każdego – bez wyjątków!"
 tpz.1.b:0 "Za darmo, ale po rejestracji w aplikacji"
 TPZ_sat_tt_m8:0 "Satysfakcja klientów: §R-8§!"
 tpz.10.t:0 "Referendum korporacyjne"
 tpz.10.d:0 "Przez tydzień mieszkańcy głosowali w aplikacji: czy Państwo Włocławskie ma stać się w pełni spółką swoich obywateli? Każdy uczestnik dostał darmowy napój i 50 punktów lojalnościowych.\n\nObecna satysfakcja klientów: §Y[?TPZ_satysfakcja|0]/100§!. Przy dobrych nastrojach wynik będzie przekonujący; przy złych zarząd będzie musiał „podkręcić” frekwencję promocją."
 tpz.10.a:0 "Klienci kliknęli „Zamawiam”!"
 tpz.10.b:0 "Przedłużyć głosowanie i dorzucić darmową dostawę"
 TPZ_sat_tt_p2:0 "Satysfakcja klientów: §G+2§!"
 TPZ_sat_tt_m6:0 "Satysfakcja klientów: §R-6§!"
 tpz.20.t:0 "Brak mąki"
 tpz.20.d:0 "Transport z młyna nie dojechał, a w magazynie zostało mąki na trzy dni. Kierownik produkcji proponuje cieńsze ciasto, dział zakupów – zakup po każdej cenie."
 tpz.20.a:0 "Nasze silosy są pełne – kontrola mąki się opłaca"
 tpz.20.b:0 "Kupić mąkę za każdą cenę"
 tpz.20.c:0 "Cieńsze ciasto – nikt nie zauważy"
 tpz.21.t:0 "Pizzeria „U Zbyszka” nie chce się sprzedać"
 tpz.21.d:0 "Właściciel małej pizzerii na Zazamczu odmawia zapłaty opłaty wyrównawczej i przyjęcia franczyzy. Lokal ma wiernych klientów, a sprawa trafiła do lokalnych mediów.\n\nZarząd musi zdecydować, co zrobić z jedyną niezależną pizzerią w mieście."
 tpz.21.a:0 "Złożyć ofertę nie do odrzucenia – trzykrotna wycena"
 tpz.21.b:0 "Zostawić go w spokoju – konkurencja jest zdrowa"
 tpz.21.c:0 "Otworzyć lokal naprzeciwko i rozdawać kupony"
 TPZ_sat_tt_m4:0 "Satysfakcja klientów: §R-4§!"
 tpz.22.t:0 "Zimna pizza, gorące emocje"
 tpz.22.d:0 "Fala skarg zalewa infolinię: spóźnione dostawy, zimne pizze i pomylone zamówienia. Ktoś założył w sieci grupę „Czekam na pizzę od wtorku”, która ma już kilka tysięcy członków."
 tpz.22.a:0 "Rabat 20% dla wszystkich poszkodowanych"
 tpz.22.b:0 "Prezes osobiście przeprasza w nagraniu"
 tpz.22.c:0 "To wina korków na moście"
 TPZ_sat_tt_m3:0 "Satysfakcja klientów: §R-3§!"
 tpz.23.t:0 "Skandal franczyzowy"
 tpz.23.d:0 "Franczyzobiorca z Lubrańca zaczął wydawać pozwolenia na budowę razem z każdą rodzinną pizzą – „w promocji”. Mieszkańcy są zachwyceni szybkością, prawnicy zarządu – znacznie mniej."
 tpz.23.a:0 "Odebrać licencję i przeprosić klientów"
 tpz.23.b:0 "Ogłosić to nową usługą sieci"
 tpz.24.t:0 "Prezes w terenie"
 tpz.24.d:0 "Rafał „Archadzio” Archacki wsiadł na skuter i przez cały dzień rozwoził zamówienia po Włocławku – od Śródmieścia po Rybnicę. Nagranie z dostawy do domu spokojnej seniorki ma już setki tysięcy wyświetleń.\n\nDział marketingu chce z tego zrobić kampanię. Zarząd prosi o rozwagę."
 tpz.24.a:0 "Zróbmy z tego kampanię!"
 tpz.24.b:0 "Prezes ma ważniejsze obowiązki"
 tpz.30.t:0 "30 minut albo wojna!"
 tpz.30.d:0 "Zarząd zbiera się w trybie pilnym w sali konferencyjnej centrali. Na ekranie wyświetla się zestawienie: rząd państwa [FROM.GetName] nie zapłacił za strategiczną dostawę mąki, paliwa i agregatów chłodniczych. Zadłużenie wynosi już §Y[?FROM.TPZ_dlug|0]/100§!.\n\nRafał „Archadzio” Archacki odkłada telefon i patrzy na dyrektorów: „Dostarczyliśmy na czas. Teraz oni mają trzydzieści minut, żeby się wytłumaczyć.”"
 tpz.30.a:0 "Naliczamy odsetki"
 tpz.30.b:0 "Zaoferujmy nową umowę"
 tpz.30.c:0 "Wstrzymać wszystkie dostawy!"
 tpz.41.t:0 "Strajk dostawców"
 tpz.41.d:0 "Kurierzy zaparkowali skutery przed centralą i odmawiają wyjazdu. Domagają się podwyżek, lepszych kurtek i końca nocnych zmian. Zamówienia piętrzą się w systemie, a nastroje w mieście są coraz gorsze.\n\nSatysfakcja klientów: §R[?TPZ_satysfakcja|0]/100§!."
 tpz.41.a:0 "Podwyżki dla kurierów"
 tpz.41.b:0 "Zastąpić ich stażystami"
 TPZ_sat_tt_p20:0 "Satysfakcja klientów: §G+20§!"
 tpz.42.t:0 "Bunt przy okienku wydawczym"
 tpz.42.d:0 "Tłum głodnych i rozczarowanych mieszkańców otacza centralę. Ktoś przewrócił stojak z ulotkami, ktoś inny skanduje „Chcemy rady miasta!”. Straż Korporacyjna czeka na rozkazy.\n\nSatysfakcja klientów spadła do §R[?TPZ_satysfakcja|0]/100§!. Jeśli zarząd się pomyli, firma może stracić miasto."
 tpz.42.a:0 "Pizza dla wszystkich, na koszt firmy"
 tpz.42.b:0 "Straż Korporacyjna rozdaje kupony i rozładowuje tłum"
 tpz.43.t:0 "Kolejka aż do katedry"
 tpz.43.d:0 "Klienci są zachwyceni: oceny w aplikacji biją rekordy, a kolejka po nową pizzę sezonową ciągnie się aż pod katedrę. Delegacje z sąsiednich miast pytają, kiedy T-Pizza otworzy się u nich."
 tpz.43.a:0 "Wykorzystać entuzjazm w regionie"
 tpz.43.b:0 "Podziękować klientom"
