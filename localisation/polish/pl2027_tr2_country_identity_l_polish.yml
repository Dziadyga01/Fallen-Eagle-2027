l_polish:
 TR2C_gul_A_constitution:0 "Konstytucja wolnych miast"
 TR2C_gul_A_constitution_desc:0 "Dzielnice mają prawo weta, lecz każda wspólna decyzja wymaga wielu negocjacji."
 TR2C_gul_A_institution:0 "Prawo samorządów do sprzeciwu"
 TR2C_gul_A_institution_desc:0 "Rady gmin otrzymają możliwość zablokowania decyzji bez konsultacji."
 TR2C_gul_A_future:0 "Konfederacja magistratów"
 TR2C_gul_A_future_desc:0 "Wspólne usługi będą negocjowane pomiędzy równymi miastami."
 TR2C_gul_A_decision_1:0 "Referendum samorządowe"
 TR2C_gul_A_decision_1_desc:0 "Obywatele rozstrzygają spór kosztem czasu administracji."
 TR2C_gul_A_decision_2:0 "Wspólny budżet ratunkowy"
 TR2C_gul_A_decision_2_desc:0 "Samorządy wspólnie finansują niezbędne usługi."
 TR2C_gul_A_decision_3:0 "Zjazd przedstawicieli gmin"
 TR2C_gul_A_decision_3_desc:0 "Delegaci szukają kompromisu między miastami."
 tr2c.101.t:0 "Samorząd mówi nie"
 tr2c.101.d:0 "Gminy żądają prawa weta wobec decyzji stolicy. Państwo samorządowe może stać się zakładnikiem własnej konstytucji."
 tr2c.101.a:0 "Przyznać prawo sprzeciwu."
 tr2c.101.b:0 "Ograniczyć zakres weta."
 TR2C_gul_B_constitution:0 "Wspólny rząd miast"
 TR2C_gul_B_constitution_desc:0 "Wspólne instytucje ułatwiają obronę i handel, ale ograniczają samodzielność miast."
 TR2C_gul_B_institution:0 "Związkowe ministerstwa"
 TR2C_gul_B_institution_desc:0 "Związek przejmie koordynację bezpieczeństwa i dostaw."
 TR2C_gul_B_future:0 "Traktat o wspólnej obronie"
 TR2C_gul_B_future_desc:0 "Miasta uzgodnią ochronę przepraw i kluczowych szlaków."
 TR2C_gul_B_decision_1:0 "Ujednolicić instytucje"
 TR2C_gul_B_decision_1_desc:0 "Biurokracja przyspiesza, ale rady gmin tracą niezależność."
 TR2C_gul_B_decision_2:0 "Wspólne patrole"
 TR2C_gul_B_decision_2_desc:0 "Wspólna straż ochrania infrastrukturę i granice."
 TR2C_gul_B_decision_3:0 "Zjazd burmistrzów"
 TR2C_gul_B_decision_3_desc:0 "Samorządowcy odnawiają kompromis z centralą."
 tr2c.102.t:0 "Dwie stolice, jeden rząd?"
 tr2c.102.d:0 "Przywódcy nie mogą ustalić, gdzie obradować ma rada związku. Toruń chce sprawności, a partnerzy autonomii."
 tr2c.102.a:0 "Rotacyjne obrady."
 tr2c.102.b:0 "Stały sekretariat w Toruniu."
 TR2C_zal_A_constitution:0 "Władza projektów"
 TR2C_zal_A_constitution_desc:0 "Państwo buduje szybciej, lecz wzrastają koszty finansowania i napięcia społeczne."
 TR2C_zal_A_institution:0 "Centralny fundusz infrastruktury"
 TR2C_zal_A_institution_desc:0 "Magistrat przejmuje plan inwestycji regionalnych."
 TR2C_zal_A_future:0 "Most na kredyt"
 TR2C_zal_A_future_desc:0 "Nowe przeprawy podnoszą zadłużenie państwa."
 TR2C_zal_A_decision_1:0 "Emisja obligacji"
 TR2C_zal_A_decision_1_desc:0 "Budżet zyskuje szybkie finansowanie za cenę popularności."
 TR2C_zal_A_decision_2:0 "Budowa na przyspieszenie"
 TR2C_zal_A_decision_2_desc:0 "Roboty strategiczne otrzymują priorytet."
 TR2C_zal_A_decision_3:0 "Inspekcja kontraktów"
 TR2C_zal_A_decision_3_desc:0 "Kontrolerzy poszukują nadużyć i błędów w umowach."
 tr2c.111.t:0 "Projekt czy mieszkańcy?"
 tr2c.111.d:0 "Wzrost cen budowy powoduje protesty przeciw ograniczeniom finansowania usług publicznych."
 tr2c.111.a:0 "Utrzymać budowy."
 tr2c.111.b:0 "Przesunąć pieniądze na usługi."
 TR2C_zal_B_constitution:0 "Prezydencki aparat państwowy"
 TR2C_zal_B_constitution_desc:0 "Administracja centralizuje decyzje, odsuwając rady osiedlowe."
 TR2C_zal_B_institution:0 "Urzędniczy łańcuch dowodzenia"
 TR2C_zal_B_institution_desc:0 "Decyzje z magistratu staną się nadrzędne wobec rad."
 TR2C_zal_B_future:0 "Magistrat kontroluje granice"
 TR2C_zal_B_future_desc:0 "Nadzór terytorialny obejmie transport i administrację."
 TR2C_zal_B_decision_1:0 "Dekret prezydencki"
 TR2C_zal_B_decision_1_desc:0 "Prezydent omija spory, zaostrzając niezadowolenie."
 TR2C_zal_B_decision_2:0 "Nadzór nad gminami"
 TR2C_zal_B_decision_2_desc:0 "Gminy podporządkowane są wspólnej biurokracji."
 TR2C_zal_B_decision_3:0 "Zjazd urzędników"
 TR2C_zal_B_decision_3_desc:0 "Administracja uzgadnia procedury kryzysowe."
 tr2c.112.t:0 "Czy magistrat zastąpi sejm?"
 tr2c.112.d:0 "Władza dekretowa prowokuje sprzeciw radnych. Zaleski staje przed sporem o własne uprawnienia."
 tr2c.112.a:0 "Stan nadzwyczajny."
 tr2c.112.b:0 "Zostawić częściową autonomię."
 TR2C_rom_A_constitution:0 "Państwo dostępnych usług"
 TR2C_rom_A_constitution_desc:0 "Publiczne mieszkania, transport i prawa pracowników wzmacniają życie mieszkańców, lecz wymagają pieniędzy."
 TR2C_rom_A_institution:0 "Umowa społeczna Rubinkowa"
 TR2C_rom_A_institution_desc:0 "Osiedla uzyskują trwałe gwarancje mieszkaniowe."
 TR2C_rom_A_future:0 "Miejski transport dla wszystkich"
 TR2C_rom_A_future_desc:0 "Komunikacja do pracy i szkoły staje się podstawową usługą."
 TR2C_rom_A_decision_1:0 "Program mieszkań publicznych"
 TR2C_rom_A_decision_1_desc:0 "Remonty pomagają lokatorom, obciążając budżet."
 TR2C_rom_A_decision_2:0 "Rady pracownicze"
 TR2C_rom_A_decision_2_desc:0 "Załogi zakładów uzyskują głos w gospodarce."
 TR2C_rom_A_decision_3:0 "Nocne autobusy i kultura"
 TR2C_rom_A_decision_3_desc:0 "Toruń inwestuje w społeczne życie po zmroku."
 tr2c.121.t:0 "Rząd musi zapłacić za obietnice"
 tr2c.121.d:0 "Rady lokatorów domagają się mieszkań, pracownicy podwyżek, a skarbnik ostrzega przed brakiem pieniędzy."
 tr2c.121.a:0 "Najpierw usługi społeczne."
 tr2c.121.b:0 "Wzmocnić zakłady i zatrudnienie."
 TR2C_rom_B_constitution:0 "Republika młodych i samorządów"
 TR2C_rom_B_constitution_desc:0 "Federacja daje samorządom równy głos, lecz porozumienia wymagają cierpliwości."
 TR2C_rom_B_institution:0 "Związek rad Rubinkowa i Skarpy"
 TR2C_rom_B_institution_desc:0 "Dzielnice opracują wspólne programy usług i pracy."
 TR2C_rom_B_future:0 "Żadnej stolicy ponad ludźmi"
 TR2C_rom_B_future_desc:0 "Toruń zobowiąże się nie dominować nad mniejszymi gminami."
 TR2C_rom_B_decision_1:0 "Kongres lokalnych rad"
 TR2C_rom_B_decision_1_desc:0 "Gminy uzgadniają program polityczny."
 TR2C_rom_B_decision_2:0 "Spółdzielczy fundusz rozwoju"
 TR2C_rom_B_decision_2_desc:0 "Mieszkańcy finansują oddolne miejsca pracy."
 TR2C_rom_B_decision_3:0 "Porozumienie obywatelskie"
 TR2C_rom_B_decision_3_desc:0 "Kompromis ułatwia współpracę regionalną."
 tr2c.122.t:0 "Kto ma głos w federacji?"
 tr2c.122.d:0 "Mniejsze gminy oskarżają Toruń o dominację. Młody prezydent musi zadecydować, co oznacza równość."
 tr2c.122.a:0 "Jedna gmina, jeden głos."
 tr2c.122.b:0 "Głos zależny od ludności."
 TR2C_kow_A_constitution:0 "Rzeczpospolita wiedzy"
 TR2C_kow_A_constitution_desc:0 "Edukacja i otwarte dane wspierają naukę, ale rośnie obawa przed władzą ekspertów."
 TR2C_kow_A_institution:0 "Matematyka odbudowy"
 TR2C_kow_A_institution_desc:0 "Mierzalne cele i analiza danych porządkują inwestycje."
 TR2C_kow_A_future:0 "Szkoły przyszłości na Bielanach"
 TR2C_kow_A_future_desc:0 "Nauczyciele i UMK przygotowują nowy program edukacji."
 TR2C_kow_A_decision_1:0 "Granty dla nauczycieli"
 TR2C_kow_A_decision_1_desc:0 "Szkoły i wykładowcy dostają środki na nowoczesną edukację."
 TR2C_kow_A_decision_2:0 "Naukowy audyt inwestycji"
 TR2C_kow_A_decision_2_desc:0 "Eksperci ograniczają straty w projektach publicznych."
 TR2C_kow_A_decision_3:0 "Otwarte laboratoria UMK"
 TR2C_kow_A_decision_3_desc:0 "Uniwersyteckie laboratoria wspierają toruński przemysł."
 tr2c.131.t:0 "Kto ma prawo do eksperckiej władzy?"
 tr2c.131.d:0 "Mieszkańcy pytają, dlaczego to eksperci decydują o przyszłości dzielnic. Kowalczyk próbuje pogodzić matematyczną analizę z demokracją."
 tr2c.131.a:0 "Otwarte dane i konsultacje."
 tr2c.131.b:0 "Zaufać ekspertom."
 TR2C_kow_B_constitution:0 "Dwa światy, jedna wspólnota"
 TR2C_kow_B_constitution_desc:0 "Współpraca z Niemcami i Europą wspiera edukację, kulturę i handel, ale budzi pytania o niezależność."
 TR2C_kow_B_institution:0 "Fotografia dwóch światów"
 TR2C_kow_B_institution_desc:0 "Wystawy i media budują tożsamość między dwiema kulturami."
 TR2C_kow_B_future:0 "Most Frankfurt–Toruń"
 TR2C_kow_B_future_desc:0 "Edukacja i sieci gospodarcze otwierają kraj na zachód."
 TR2C_kow_B_decision_1:0 "Program wymian edukacyjnych"
 TR2C_kow_B_decision_1_desc:0 "Studenci i nauczyciele wymieniają doświadczenia."
 TR2C_kow_B_decision_2:0 "Wystawa miasta otwartego"
 TR2C_kow_B_decision_2_desc:0 "Fotografia pokazuje życie codzienne i różnorodność."
 TR2C_kow_B_decision_3:0 "Targi nowych partnerstw"
 TR2C_kow_B_decision_3_desc:0 "Międzynarodowe kontakty wspierają gospodarkę."
 tr2c.132.t:0 "Czy otwartość oznacza zależność?"
 tr2c.132.d:0 "Opozycja obawia się zbyt silnego wpływu zagranicy. Przedsiębiorcy wskazują na nowe możliwości."
 tr2c.132.a:0 "Współpraca na równych zasadach."
 tr2c.132.b:0 "Priorytet dla rozwoju gospodarczego."
 TR2C_kre_A_constitution:0 "Zgromadzenia bez ratusza"
 TR2C_kre_A_constitution_desc:0 "Autonomiczne komuny bronią samodzielności, ale mogą nie sprostać wspólnym kryzysom."
 TR2C_kre_A_institution:0 "Prawo do odłączenia komuny"
 TR2C_kre_A_institution_desc:0 "Każda komuna może zdecydować o opuszczeniu konfederacji."
 TR2C_kre_A_future:0 "Patrole bez wspólnego sztabu"
 TR2C_kre_A_future_desc:0 "Milicje dzielnicowe koordynują się przez delegatów."
 TR2C_kre_A_decision_1:0 "Wolne zgromadzenia"
 TR2C_kre_A_decision_1_desc:0 "Lokalne zebrania rozstrzygają spory."
 TR2C_kre_A_decision_2:0 "Komunalne jadłodzielnie"
 TR2C_kre_A_decision_2_desc:0 "Mieszkańcy sami rozdzielają zapasy."
 TR2C_kre_A_decision_3:0 "Ochotnicza samoobrona"
 TR2C_kre_A_decision_3_desc:0 "Dzielnice tworzą ochotnicze formacje."
 tr2c.141.t:0 "Czy wolna komuna może narzucać rozkazy?"
 tr2c.141.d:0 "W kryzysie niektóre dzielnice odmawiają przyjęcia dowódców. Krevienko stoi wobec granic anarchistycznej wolności."
 tr2c.141.a:0 "Głos oddajmy zgromadzeniom."
 tr2c.141.b:0 "Wybierzmy tymczasowych delegatów."
 TR2C_kre_B_constitution:0 "Zakłady przejmują gospodarkę"
 TR2C_kre_B_constitution_desc:0 "Kolektywy pracownicze kontrolują produkcję, lecz duże fabryki mogą zdominować mniejsze komuny."
 TR2C_kre_B_institution:0 "Delegaci z każdego zakładu"
 TR2C_kre_B_institution_desc:0 "Robotnicy ustalają plan przemysłowy w swoich kolektywach."
 TR2C_kre_B_future:0 "Kolektyw fabryczny Apatora"
 TR2C_kre_B_future_desc:0 "Produkcja podlega przedstawicielom załóg."
 TR2C_kre_B_decision_1:0 "Strajk kontrolowany"
 TR2C_kre_B_decision_1_desc:0 "Syndykaty negocjują warunki pracy."
 TR2C_kre_B_decision_2:0 "Wspólny plan produkcji"
 TR2C_kre_B_decision_2_desc:0 "Zakłady uzgadniają wspólną produkcję."
 TR2C_kre_B_decision_3:0 "Rezerwy pracownicze"
 TR2C_kre_B_decision_3_desc:0 "Robotnicy tworzą terenową rezerwę obronną."
 tr2c.142.t:0 "Kto reprezentuje kolektywy?"
 tr2c.142.d:0 "Duże zakłady zdobywają coraz większy wpływ, a małe warsztaty protestują."
 tr2c.142.a:0 "Równość syndykatów."
 tr2c.142.b:0 "Głos ważony zatrudnieniem."
 TR2C_ela_A_constitution:0 "Porządek ponad prawami"
 TR2C_ela_A_constitution_desc:0 "Państwo komendantury kontroluje społeczeństwo, ale rosną niezadowolenie i opór."
 TR2C_ela_A_institution:0 "Jedno centrum rozkazów"
 TR2C_ela_A_institution_desc:0 "Służby przejmują zarządzanie miastem."
 TR2C_ela_A_future:0 "Posterunki w każdej dzielnicy"
 TR2C_ela_A_future_desc:0 "Zorganizowane posterunki nadzorują główne dzielnice."
 TR2C_ela_A_decision_1:0 "Rozbudować komendanturę"
 TR2C_ela_A_decision_1_desc:0 "Władza zwiększa możliwości aparatu bezpieczeństwa."
 TR2C_ela_A_decision_2:0 "Zakupy dla garnizonu"
 TR2C_ela_A_decision_2_desc:0 "Zakłady przeznaczają środki na wyposażenie."
 TR2C_ela_A_decision_3:0 "Kontrola transportu"
 TR2C_ela_A_decision_3_desc:0 "Wojskowy nadzór nad przeprawami ogranicza swobody."
 tr2c.151.t:0 "Komendantura czy miasto?"
 tr2c.151.d:0 "Mieszkańcy buntują się przeciw nieustannej kontroli. Komendantura walczy z cywilną administracją."
 tr2c.151.a:0 "Jeszcze większy nadzór."
 tr2c.151.b:0 "Przywrócić cywilne urzędy."
 TR2C_ela_B_constitution:0 "Nieustająca mobilizacja"
 TR2C_ela_B_constitution_desc:0 "Ekspansja zwiększa siłę militarną, lecz powoduje niedobory i społeczne napięcia."
 TR2C_ela_B_institution:0 "Państwo nastawione na kampanię"
 TR2C_ela_B_institution_desc:0 "Armia i logistyka przygotowują ofensywy."
 TR2C_ela_B_future:0 "Rezerwa zbrojeniowa"
 TR2C_ela_B_future_desc:0 "Kosztowne rezerwy sprzętu obciążają gospodarkę."
 TR2C_ela_B_decision_1:0 "Pobór dodatkowych oddziałów"
 TR2C_ela_B_decision_1_desc:0 "Dodatkowi żołnierze wzmacniają armię."
 TR2C_ela_B_decision_2:0 "Wojenna gospodarka"
 TR2C_ela_B_decision_2_desc:0 "Zakłady przechodzą na potrzeby wojenne."
 TR2C_ela_B_decision_3:0 "Mobilizacja propagandowa"
 TR2C_ela_B_decision_3_desc:0 "Władza wzywa do poparcia kampanii zbrojnych."
 tr2c.152.t:0 "Jak długo potrwa mobilizacja?"
 tr2c.152.d:0 "Gospodarka nie nadąża za wymogami armii. Część zwolenników reżimu żąda ograniczenia ekspansji."
 tr2c.152.a:0 "Maksymalny wysiłek wojenny."
 tr2c.152.b:0 "Ochrona podstaw gospodarki."
 TR2C_gul_rzad:0 "Gulewski: polityka ustrojowa"
 TR2C_gul_rzad_desc:0 "Samorząd i kompromis zależą od demokratycznego mandatu. Decyzje po ustanowieniu państwa zależą od obranej ścieżki."
 TR2C_zal_rzad:0 "Zaleski: polityka ustrojowa"
 TR2C_zal_rzad_desc:0 "Władza magistratu dzieli społeczeństwo między rozwój a kontrolę. Decyzje po ustanowieniu państwa zależą od obranej ścieżki."
 TR2C_rom_rzad:0 "Romanowski: polityka ustrojowa"
 TR2C_rom_rzad_desc:0 "Prawa społeczne i autonomia gmin wymagają realnego finansowania. Decyzje po ustanowieniu państwa zależą od obranej ścieżki."
 TR2C_kow_rzad:0 "Kowalczyk: polityka ustrojowa"
 TR2C_kow_rzad_desc:0 "Nauka, edukacja i współpraca europejska tworzą nowy model republiki. Decyzje po ustanowieniu państwa zależą od obranej ścieżki."
 TR2C_kre_rzad:0 "Krevienko: polityka ustrojowa"
 TR2C_kre_rzad_desc:0 "Wolne komuny i syndykaty mają odmienne struktury władzy. Decyzje po ustanowieniu państwa zależą od obranej ścieżki."
 TR2C_ela_rzad:0 "Elana: polityka ustrojowa"
 TR2C_ela_rzad_desc:0 "Rządy komendantury i ekspansjonizm prowadzą do innych konfliktów politycznych. Decyzje po ustanowieniu państwa zależą od obranej ścieżki."
