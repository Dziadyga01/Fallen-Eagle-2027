 TR2END_dyplomacja:0 "Nowe państwo: unie i sojusze"
 TR2END_dyplomacja_desc:0 "Ponowne rokowania w sprawie unii oraz zaproszenia do zawartych sojuszy. Partnerzy zachowują prawo do odmowy."
 TR2END_gul_ponow_rokowania:0 "Wznowić rozmowy o zjednoczeniu"
 TR2END_gul_ponow_rokowania_desc:0 "Po wcześniejszej odmowie rząd ponawia ofertę dobrowolnej unii. Odmowa nadal jest możliwa."
 TR2END_gul_ponow_sojusz:0 "Ponowić zaproszenia: pakt wolnych miast"
