l_polish:
 TR2END_gul_solo:0 "Samorządna republika"
 TR2END_gul_solo_desc:0 "Wzmacniamy niezależne rady dzielnic oraz kontrolę obywateli nad budżetem."
 TR2END_gul_union:0 "Unia Kujawsko-Pomorska"
 TR2END_gul_union_desc:0 "Zaproponuj Bydgoszczy dobrowolną unię obu państw, bez użycia siły."
 TR2END_gul_pact:0 "Sojusz Wolnych Miast"
 TR2END_gul_pact_desc:0 "Zbuduj obronny sojusz samorządowych republik z poszanowaniem ich niezależności."
 TR2END_GUL_PAKT:0 "Pakt Wolnych Miast"
 TR2END_gul_solo_idea:0 "Samodzielna droga Gulewskiego"
 TR2END_gul_solo_idea_desc:0 "Premie niepodległego państwa okupione kosztami jego wybranego ustroju."
 tr2end.101.t:0 "Nasza własna droga"
 tr2end.101.d:0 "Nowe państwo Gulewskiego odrzuca naciski na ekspansję i sojusze. Zachowanie niezależności ma swoją cenę, ale daje decyzyjność."
 tr2end.101.a:0 "Piszemy własną historię."
 tr2end.102.t:0 "Propozycja unii z Bydgoszczy"
 tr2end.102.d:0 "Władze Torunia proponują dobrowolne zjednoczenie z Bydgoszczy. Druga strona ma prawo odmówić."
 tr2end.102.a:0 "Przyjmujemy propozycję dobrowolnej unii."
 tr2end.102.b:0 "Odmówmy. Zachowamy niezależność."
 tr2end.103.t:0 "Nie udało się rozpocząć rokowań"
 tr2end.103.d:0 "Państwo, do którego skierowano propozycję, nie istnieje albo nie może prowadzić rokowań. Rząd musi znaleźć inny kierunek."
 tr2end.103.a:0 "Zajmijmy się sprawami krajowymi."
 tr2end.104.t:0 "Zaproszenie do Pakt Wolnych Miast"
 tr2end.104.d:0 "Toruń proponuje współpracę obronną, ale zaproszone państwo pozostanie odrębnym członkiem sojuszu."
 tr2end.104.a:0 "Przystępujemy do porozumienia."
 tr2end.104.b:0 "Zachowajmy niezależność."
