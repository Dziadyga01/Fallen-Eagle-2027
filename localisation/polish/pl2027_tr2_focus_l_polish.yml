l_polish:
 TR2_warszawa_milczy:0 "Warszawa milczy"
 TR2_warszawa_milczy_desc:0 "Od tygodnia żadnych komunikatów z Warszawy. Telefony do ministerstw nie odpowiadają, a na Starówce ludzie zbierają się pod Ratuszem, czekając na kogokolwiek, kto powie, co dalej."
 TR2_sesja:0 "Nadzwyczajna sesja Rady Miasta"
 TR2_sesja_desc:0 "Radni zbierają się w Dworze Artusa. Pierwsze pytanie: kto rządzi miastem, skoro państwo przestało istnieć?"
 TR2_mosty:0 "Zabezpieczyć mosty na Wiśle"
 TR2_mosty_desc:0 "Most Piłsudskiego i most Zawackiej to jedyne drogi na Podgórz i do reszty regionu. Straż Miejska i ochotnicy przejmują posterunki."
 TR2_rubinkowo:0 "Kryzys zaopatrzenia na Rubinkowie"
 TR2_rubinkowo_desc:0 "Na największym osiedlu Torunia brakuje chleba i leków. Kolejki pod sklepami zamieniają się w wiece."
 TR2_podgorz:0 "Głos z Podgórza"
 TR2_podgorz_desc:0 "Lewy brzeg ogłosił, że będzie rządził się sam. Z Podgórza nadaje transmisja, którą ogląda pół Torunia – i która nie zostawia na Ratuszu suchej nitki."
 TR2_umk:0 "Żądania Uniwersytetu Mikołaja Kopernika"
 TR2_umk_desc:0 "Rektor, związki i studenci żądają miejsca przy stole. Uniwersytet ma ludzi, laboratoria i autorytet, którego brakuje Ratuszowi."
 TR2_elana_ulice:0 "Kibice Elany wychodzą na ulice"
 TR2_elana_ulice_desc:0 "Po meczu przy Bema tłum kibiców przechodzi pod Ratusz. Transparenty mówią o „porządku” i o tym, że „Toruń należy do torunian”."
 TR2_autorytet:0 "Ratusz traci autorytet"
 TR2_autorytet_desc:0 "Urzędnicy przestają przychodzić do pracy, a decyzje Rady ignoruje się w połowie dzielnic. Rząd tymczasowy słabnie z każdym dniem."
 TR2_zaleski_wraca:0 "Powrót Michała Zaleskiego"
 TR2_zaleski_wraca_desc:0 "Wieloletni prezydent miasta wraca do polityki. „Toruń potrzebuje gospodarza, nie eksperymentów” – mówi na pierwszym spotkaniu z mieszkańcami."
 TR2_lewica:0 "Lewica organizuje swoje struktury"
 TR2_lewica_desc:0 "Związkowcy z zajezdni, lokatorzy z Rubinkowa i aktywiści ze Skarpy tworzą własne komitety. Jedni chcą reform, drudzy – rewolucji."
 TR2_transmisje:0 "Transmisje z Podgórza"
 TR2_transmisje_desc:0 "Streamer z lewego brzegu komentuje kampanię na żywo i rozdaje „oceny” kandydatom. Nie startuje, ale pół miasta słucha, co mówi."
 TR2_koniec_rzadu:0 "Koniec rządu tymczasowego"
 TR2_koniec_rzadu_desc:0 "Rząd tymczasowy kończy misję i ogłasza wybory. Komitety mają tydzień na rejestrację – a Rada decyduje, kogo dopuścić."
 TR2_rejestracja:0 "Rejestracja nowych komitetów"
 TR2_rejestracja_desc:0 "Komisja wyborcza zamyka listy. Na kartach do głosowania znajdą się tylko ci, których Rada dopuściła."
 TR2_debata:0 "Debata o przyszłości Torunia"
 TR2_debata_desc:0 "Wielka debata w auli UMK transmitowana do każdego mieszkania, które ma prąd. Kto wygra debatę, ten może wygrać wybory."
 TR2_wybory:0 "Wybory nad Wisłą"
 TR2_wybory_desc:0 "Lokale wyborcze w szkołach od Bielan po Podgórz. Wynik zdecyduje, kim będzie Toruń przez następne lata."
 TR2_zaprzysiezenie:0 "Zaprzysiężenie nowych władz"
 TR2_zaprzysiezenie_desc:0 "Nowa władza składa przysięgę w Ratuszu Staromiejskim. Kryzys się skończył – teraz zaczyna się prawdziwa polityka."
 TR2_kamp_gul_dzielnice:0 "Spotkania w dzielnicach"
 TR2_kamp_gul_dzielnice_desc:0 "Gulewski odwiedza Bielany, Mokre i Chełmińskie Przedmieście. Słucha więcej, niż mówi – i ludzie to zauważają."
 TR2_kamp_gul_program:0 "Program „Toruń działa”"
 TR2_kamp_gul_program_desc:0 "Jawny budżet, sprawne urzędy i inwestycje w każdej dzielnicy. Program bez fajerwerków, ale z liczbami."
 TR2_kamp_gul_urzednicy:0 "Poparcie urzędników"
 TR2_kamp_gul_urzednicy_desc:0 "Urzędnicy, którzy przez kryzys trzymali miasto przy życiu, stają za swoim prezydentem."
 TR2_kamp_gul_rynek:0 "Wiec na Rynku Staromiejskim"
 TR2_kamp_gul_rynek_desc:0 "Tysiące ludzi pod pomnikiem Kopernika. Gulewski mówi o ciągłości, spokoju i odbudowie."
 TR2_kamp_gul_poparcie:0 "Ratusz popiera: Paweł Gulewski"
 TR2_kamp_gul_poparcie_desc:0 "Rząd tymczasowy oficjalnie popiera kandydaturę: Paweł Gulewski. Komitet „Obywatelski Toruń” zostanie dopuszczony do wyborów bez głosowania Rady, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 TR2_kamp_zal_artus:0 "Kolacja w Dworze Artusa"
 TR2_kamp_zal_artus_desc:0 "Stara gwardia toruńskiego samorządu siada przy jednym stole. Zaleski zna wszystkich z imienia."
 TR2_kamp_zal_program:0 "Program „Gospodarz”"
 TR2_kamp_zal_program_desc:0 "Porządek, inwestycje i silny Ratusz. Zaleski obiecuje to, co robił przez dwadzieścia lat."
 TR2_kamp_zal_firmy:0 "Poparcie przedsiębiorców"
 TR2_kamp_zal_firmy_desc:0 "Właściciele firm z Szosy Lubickiej finansują kampanię gospodarza."
 TR2_kamp_zal_seniorzy:0 "Spotkania z seniorami"
 TR2_kamp_zal_seniorzy_desc:0 "Kluby seniora i parafie – elektorat, który zawsze chodzi na wybory."
 TR2_kamp_zal_poparcie:0 "Ratusz popiera: Michał Zaleski"
 TR2_kamp_zal_poparcie_desc:0 "Rząd tymczasowy oficjalnie popiera kandydaturę: Michał Zaleski. Komitet „Czas Gospodarzy” zostanie dopuszczony do wyborów bez głosowania Rady, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 TR2_kamp_rom_rubinkowo:0 "Rubinkowo słucha"
 TR2_kamp_rom_rubinkowo_desc:0 "Romanowski prowadzi kampanię z wspólnych kuchni na Rubinkowie. Obiecuje, że tak będzie wyglądać cały Toruń."
 TR2_kamp_rom_program:0 "Program „Miasto dla mieszkańców”"
 TR2_kamp_rom_program_desc:0 "Mieszkania komunalne, darmowa komunikacja i rady pracownicze w spółkach miejskich."
 TR2_kamp_rom_zwiazki:0 "Poparcie związków"
 TR2_kamp_rom_zwiazki_desc:0 "Związkowcy z zajezdni, wodociągów i szpitala ogłaszają poparcie."
 TR2_kamp_rom_skarpa:0 "Wiec na Skarpie"
 TR2_kamp_rom_skarpa_desc:0 "Plac przed blokami na Skarpie pęka w szwach. Lewica pokazuje, że potrafi wygrywać wybory."
 TR2_kamp_rom_poparcie:0 "Ratusz popiera: Michał Romanowski"
 TR2_kamp_rom_poparcie_desc:0 "Rząd tymczasowy oficjalnie popiera kandydaturę: Michał Romanowski. Komitet „Toruń dla Mieszkańców” zostanie dopuszczony do wyborów bez głosowania Rady, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 TR2_kamp_kow_studenci:0 "Debata studencka"
 TR2_kamp_kow_studenci_desc:0 "Aula UMK pełna studentów. Kowalczyk mówi o Europie, technologiach i Toruniu, z którego nie trzeba wyjeżdżać."
 TR2_kamp_kow_program:0 "Program „Nowy Toruń”"
 TR2_kamp_kow_program_desc:0 "Nowoczesna administracja, otwarty handel i nowa tożsamość miasta."
 TR2_kamp_kow_umk:0 "Poparcie UMK"
 TR2_kamp_kow_umk_desc:0 "Rektor i senat uczelni stają po stronie Kowalczyk. Kampus na Bielanach ma swoją kandydatkę."
 TR2_kamp_kow_internet:0 "Kampania w sieci"
 TR2_kamp_kow_internet_desc:0 "Krótkie filmy, transmisje i memy. Kowalczyk dociera do ludzi, którzy nie czytają ulotek."
 TR2_kamp_kow_poparcie:0 "Ratusz popiera: Katarzyna Kowalczyk"
 TR2_kamp_kow_poparcie_desc:0 "Rząd tymczasowy oficjalnie popiera kandydaturę: Katarzyna Kowalczyk. Komitet „Toruński Komitet Obywatelski” zostanie dopuszczony do wyborów bez głosowania Rady, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 TR2_kamp_ela_trybuna:0 "Trybuna przy Bema"
 TR2_kamp_ela_trybuna_desc:0 "Po meczu z trybun schodzą setki ludzi w szalikach. Ruch Elany ma swoich agitatorów na każdym osiedlu."
 TR2_kamp_ela_program:0 "Program „Porządek”"
 TR2_kamp_ela_program_desc:0 "Patrole, zamknięty most dla prowokatorów i „Toruń dla torunian”."
 TR2_kamp_ela_kibice:0 "Poparcie kibiców"
 TR2_kamp_ela_kibice_desc:0 "Stowarzyszenia kibiców ogłaszają, że „wezmą sprawy w swoje ręce”, jeśli wybory przegrają."
 TR2_kamp_ela_marsz:0 "Marsz przez Starówkę"
 TR2_kamp_ela_marsz_desc:0 "Pochód z flagami przechodzi przez Szeroką. Jedni klaszczą, inni zamykają okiennice."
 TR2_kamp_ela_poparcie:0 "Ratusz popiera: Ruch Elany"
 TR2_kamp_ela_poparcie_desc:0 "Rząd tymczasowy oficjalnie popiera kandydaturę: Ruch Elany. Komitet „Narodowy Toruń” zostanie dopuszczony do wyborów bez głosowania Rady, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 TR2_kamp_kre_komitety:0 "Komitety osiedlowe"
 TR2_kamp_kre_komitety_desc:0 "Na Jarze i Skarpie powstają komitety, które decydują o wszystkim – od śmieci po patrole."
 TR2_kamp_kre_program:0 "Program „Wolne dzielnice”"
 TR2_kamp_kre_program_desc:0 "Koniec Ratusza, władza dla zgromadzeń mieszkańców i delegatów odwoływalnych w każdej chwili."
 TR2_kamp_kre_zajezdnie:0 "Poparcie zajezdni"
 TR2_kamp_kre_zajezdnie_desc:0 "Motorniczy i kierowcy autobusów ogłaszają, że miasto bez nich stanie."
 TR2_kamp_kre_jar:0 "Wiec na Jarze"
 TR2_kamp_kre_jar_desc:0 "Zgromadzenie na otwartym powietrzu. Nikt nie przemawia z trybuny – głos ma każdy."
 TR2_kamp_kre_poparcie:0 "Ratusz popiera: Maksim Krevienko"
 TR2_kamp_kre_poparcie_desc:0 "Rząd tymczasowy oficjalnie popiera kandydaturę: Maksim Krevienko. Komitet „Federacja Wolnych Dzielnic” zostanie dopuszczony do wyborów bez głosowania Rady, a urzędnicy w całym mieście wiedzą, na kogo stawiać."
 TR2_gul_obywatelski:0 "Obywatelski Toruń"
 TR2_gul_obywatelski_desc:0 "Pierwsza decyzja nowej władzy: jawny budżet, transmisje z sesji i konsultacje z dzielnicami."
 TR2_gul_zaufanie:0 "Odbudować zaufanie"
 TR2_gul_zaufanie_desc:0 "Urzędnicy wracają do pracy, a mieszkańcy dostają odpowiedzi na listy. Mała rzecz, która zmienia wszystko."
 TR2_gul_urzedy:0 "Urzędy dla ludzi"
 TR2_gul_urzedy_desc:0 "Okienka czynne do wieczora, sprawy online i koniec kolejek po dowody."
 TR2_gul_konstytucja:0 "Nowa konstytucja miasta"
 TR2_gul_konstytucja_desc:0 "Statut Torunia staje się konstytucją państwa: trójpodział władzy, rzecznik praw obywatelskich i wybory co cztery lata."
 TR2_gul_rada:0 "Rada Mieszkańców"
 TR2_gul_rada_desc:0 "Każda dzielnica ma przedstawiciela w radzie doradczej prezydenta."
 TR2_gul_media:0 "Wolne media"
 TR2_gul_media_desc:0 "Lokalne radio i portale dostają niezależność i finansowanie. Krytyka władzy jest dowodem, że demokracja działa."
 TR2_gul_tramwaje:0 "Nowe tramwaje"
 TR2_gul_tramwaje_desc:0 "Nowe linie tramwajowe łączą Bielany, Rubinkowo i Podgórze. Miasto znów się porusza."
 TR2_gul_inwestycje:0 "Inwestycje miejskie"
 TR2_gul_inwestycje_desc:0 "Fundusz inwestycyjny miasta finansuje zakłady, warsztaty i nowe miejsca pracy."
 TR2_gul_kampus:0 "Kampus przyszłości"
 TR2_gul_kampus_desc:0 "UMK dostaje nowe laboratoria, a miasto – patenty i specjalistów."
 TR2_gul_kampus_tb:0 "Kampus przyszłości"
 TR2_gul_kampus_b_tb:0 "Kampus przyszłości"
 TR2_gul_przedsiebiorcy:0 "Toruń dla przedsiębiorców"
 TR2_gul_przedsiebiorcy_desc:0 "Niższe podatki lokalne, szybkie pozwolenia i strefa dla małych firm."
 TR2_gul_mieszkania:0 "Mieszkania na wynajem"
 TR2_gul_mieszkania_desc:0 "Program mieszkań na wynajem zatrzymuje młodych w mieście."
 TR2_gul_metropolia:0 "Metropolia nad Wisłą"
 TR2_gul_metropolia_desc:0 "Toruń przestaje myśleć o sobie jak o mieście. Myśli o regionie – i o tym, kto w nim przewodzi."
 TR2_gul_sasiedzi:0 "Dobre sąsiedztwo"
 TR2_gul_sasiedzi_desc:0 "Delegacje z Ratusza jadą do Chełmży, Lubicza i Łysomic z ofertą współpracy, nie żądaniami."
 TR2_gul_unia_gmin:0 "Unia gmin"
 TR2_gul_unia_gmin_desc:0 "Gminy wokół Torunia dostają propozycję unii: wspólny budżet, wspólne usługi i własne rady."
 TR2_gul_referenda:0 "Referenda w gminach"
 TR2_gul_referenda_desc:0 "Mieszkańcy spornych gmin zdecydują w referendach, czy chcą należeć do Torunia."
 TR2_gul_pakt_byd:0 "Pakt z Bydgoszczą"
 TR2_gul_pakt_byd_desc:0 "Prezydent proponuje Bydgoszczy pakt: koniec sporów, wspólne lotnisko i wspólna obrona regionu."
 TR2_gul_europa:0 "Okno na Europę"
 TR2_gul_europa_desc:0 "Toruń nawiązuje kontakty z Litwą, Niemcami i Czechami. Handel wraca, a z nim – inwestorzy."
 TR2_gul_wspolny_szpital:0 "Wspólne instytucje regionu"
 TR2_gul_wspolny_szpital_desc:0 "Szpital, lotnisko i straż pożarna obsługują cały region. Współpraca okazuje się tańsza niż spór."
 TR2_gul_straz:0 "Straż Obywatelska"
 TR2_gul_straz_desc:0 "Ochotnicy z każdej dzielnicy przechodzą szkolenie i dostają mundury. Bronią miasta, nie polityków."
 TR2_gul_obrona_wisly:0 "Obrona Wisły"
 TR2_gul_obrona_wisly_desc:0 "Umocnienia przy mostach i na skarpie. Toruń nie chce wojny – ale jest na nią gotowy."
 TR2_gul_sojusz_reg:0 "Sojusz regionalny"
 TR2_gul_sojusz_reg_desc:0 "Toruń zakłada sojusz demokratycznych miast regionu i zaprasza sąsiadów."
 TR2_gul_wojsko_zaw:0 "Zawodowa armia miasta"
 TR2_gul_wojsko_zaw_desc:0 "Ochotnicy stają się zawodowymi żołnierzami z kontraktem i szkoleniem."
 TR2_gul_gwarancje:0 "Gwarancje dla sąsiadów"
 TR2_gul_gwarancje_desc:0 "Toruń gwarantuje niepodległość małym sąsiadom. Kto ich zaatakuje, zaatakuje nas."
 TR2_gul_przemysl_obr:0 "Przemysł obronny"
 TR2_gul_przemysl_obr_desc:0 "Apator i warsztaty miejskie produkują sprzęt łączności i amunicję."
 TR2_gul_republika:0 "Druga Republika Toruńska"
 TR2_gul_republika_desc:0 "Toruń jest demokratycznym państwem z konstytucją, armią i sojusznikami. Czas pomyśleć o regionie."
 TR2_gul_zjazd:0 "Zjazd miast regionu"
 TR2_gul_zjazd_desc:0 "Prezydenci i burmistrzowie zjeżdżają do Torunia. Temat: wspólna przyszłość Kujaw i Pomorza."
 TR2_gul_rzeczpospolita_miast:0 "Rzeczpospolita Miast – projekt"
 TR2_gul_rzeczpospolita_miast_desc:0 "Projekt unii miast: każde zachowuje samorząd, ale wspólnie decydują o obronie, gospodarce i polityce zagranicznej."
 TR2_gul_unia_byd:0 "Unia z Bydgoszczą"
 TR2_gul_unia_byd_desc:0 "Jeśli Bydgoszcz wybrała demokrację, dwa miasta mogą stworzyć jedną republikę."
 TR2_gul_kujawy_pomorze:0 "Kujawy i Pomorze razem"
 TR2_gul_kujawy_pomorze_desc:0 "Toruń zgłasza roszczenia do regionu – nie po to, by podbijać, ale by negocjować z pozycji siły."
 TR2_gul_final:0 "Rzeczpospolita Miast"
 TR2_gul_final_desc:0 "Toruń przewodzi unii demokratycznych miast regionu. Z państwa-miasta stał się centrum nowej, demokratycznej Polski."
 TR2_gul_r_plan:0 "Ratusz dla dzielnic"
 TR2_gul_r_plan_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: ratusz dla dzielnic."
 TR2_gul_r_rubinkowo:0 "Budżet Rubinkowa"
 TR2_gul_r_rubinkowo_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: budżet rubinkowa."
 TR2_gul_r_jar:0 "Rady młodego Jaru"
 TR2_gul_r_jar_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: rady młodego jaru."
 TR2_gul_r_bielany:0 "Uniwersyteckie Bielany"
 TR2_gul_r_bielany_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: uniwersyteckie bielany."
 TR2_gul_r_bielany_tb:0 "Bielany"
 TR2_gul_r_osiedla:0 "Mieszkania we wspólnym zarządzie"
 TR2_gul_r_osiedla_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: mieszkania we wspólnym zarządzie."
 TR2_gul_r_komunikacja:0 "Tramwaj dla każdego"
 TR2_gul_r_komunikacja_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: tramwaj dla każdego."
 TR2_gul_r_infrastruktura:0 "Jawne zamówienia drogowe"
 TR2_gul_r_infrastruktura_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: jawne zamówienia drogowe."
 TR2_gul_r_toron2030:0 "Demokratyczna metropolia"
 TR2_gul_r_toron2030_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: demokratyczna metropolia."
 TR2_gul_p_odbudowa:0 "Społeczny kontrakt odbudowy"
 TR2_gul_p_odbudowa_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: społeczny kontrakt odbudowy."
 TR2_gul_p_odbudowa_tb:0 "Partnerstwo z przedsiębiorcami"
 TR2_gul_p_apator:0 "Apator dla infrastruktury"
 TR2_gul_p_apator_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: apator dla infrastruktury."
 TR2_gul_p_apator_tb:0 "Apator"
 TR2_gul_p_pierniki:0 "Eksport marki Toruń"
 TR2_gul_p_pierniki_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: eksport marki toruń."
 TR2_gul_p_logistyka:0 "Publiczna logistyka"
 TR2_gul_p_logistyka_desc:0 "Jawne decyzje, budżet obywatelski i prawa samorządów stoją ponad centralizacją. Nowy porządek wymaga rozmów i zgody mieszkańców. Cel: publiczna logistyka."
