 TR2_zal_w_dominacja:0 "Porządek w regionie"
 TR2_zal_w_dominacja_desc:0 "Magistrat konsoliduje fundusze, zakłady i decyzje. Inwestycje przyspieszają, lecz mieszkańcy coraz mocniej odczuwają centralizację oraz zadłużenie. Cel: porządek w regionie."
 TR2_rom_dla_mieszkancow:0 "Miasto dla mieszkańców"
 TR2_rom_dla_mieszkancow_desc:0 "Pierwsze posiedzenie nowej Rady odbywa się na Rubinkowie, nie w Ratuszu. Symbol, ale ważny."
 TR2_rom_kuchnie:0 "Wspólne kuchnie"
 TR2_rom_kuchnie_desc:0 "Stołówki z czasów kryzysu zostają jako miejskie bary mleczne. Nikt w Toruniu nie będzie głodny."
 TR2_rom_informacja:0 "Informacja zamiast paniki"
 TR2_rom_informacja_desc:0 "Codzienne komunikaty, otwarte dane i radio miejskie. Plotki tracą moc, gdy ludzie wiedzą, co się dzieje."
 TR2_rom_rady:0 "Rady pracownicze"
 TR2_rom_rady_desc:0 "Pracownicy zajezdni, wodociągów i szpitala mają głos w zarządach spółek miejskich. Od teraz decyzje o pracownikach miejskich wymagają zgody związków."
 TR2_rom_kadry:0 "Kadry z UMK"
 TR2_rom_kadry_desc:0 "Absolwenci uniwersytetu zasilają urzędy i spółki – za pensje mniejsze niż w korporacjach, ale z poczuciem sensu."
 TR2_rom_kadry_tb:0 "Kadry z UMK"
 TR2_rom_chlopak:0 "Chłopak z internetu"
 TR2_rom_chlopak_desc:0 "Młody aktywista z Rubinkowa prowadzi kanał, który tłumaczy decyzje Rady prostym językiem. Ogląda go pół miasta."
 TR2_rom_rubinkowo:0 "Nowe mieszkania na Rubinkowie"
 TR2_rom_rubinkowo_desc:0 "Miejski program budowy mieszkań: czynsze na poziomie, który da się zapłacić."
 TR2_rom_transport:0 "Transport publiczny prawem mieszkańca"
 TR2_rom_transport_desc:0 "Darmowa komunikacja miejska dla wszystkich. Samochodów na moście mniej, ludzi w tramwajach więcej."
 TR2_rom_spoldzielnie:0 "Spółdzielnie pracy"
 TR2_rom_spoldzielnie_desc:0 "Zamknięte zakłady przejmują spółdzielnie pracowników z pomocą miasta."
 TR2_rom_szpital:0 "Szpital dla wszystkich"
 TR2_rom_szpital_desc:0 "Szpital miejski przyjmuje pacjentów z całego regionu. Toruń buduje autorytet troską, nie siłą."
 TR2_rom_skarpa:0 "Skarpa i Jar"
 TR2_rom_skarpa_desc:0 "Nowe osiedla na Jarze i modernizacja Skarpy. Miasto rośnie dla ludzi, którzy w nim mieszkają."
 TR2_rom_gospodarka:0 "Gospodarka komunalna"
 TR2_rom_gospodarka_desc:0 "Wodociągi, energia i transport należą do miasta i pracują dla mieszkańców, nie dla zysku."
 TR2_rom_sasiedzi:0 "Federacja dobrowolna"
 TR2_rom_sasiedzi_desc:0 "Toruń proponuje sąsiednim gminom dobrowolną federację: wspólne usługi, równe głosy."
 TR2_rom_referenda:0 "Referenda o przyłączeniu"
 TR2_rom_referenda_desc:0 "Mieszkańcy spornych gmin głosują, czy chcą należeć do Socjalnej Republiki."
 TR2_rom_kontakty_byd:0 "Kontakty z bydgoskimi radami"
 TR2_rom_kontakty_byd_desc:0 "Związkowcy z PESY i Nitro-Chemu przyjeżdżają do Torunia. Robotnicy obu miast mają więcej wspólnego niż ich ratusze."
 TR2_rom_federacja_soc:0 "Federacja socjalna z Bydgoszczą"
 TR2_rom_federacja_soc_desc:0 "Jeśli w Bydgoszczy rządzą rady robotnicze, oba miasta mogą stworzyć federację socjalną."
 TR2_rom_wspolne_inst:0 "Wspólne instytucje"
 TR2_rom_wspolne_inst_desc:0 "Wspólne kasy chorych, wspólne szkoły zawodowe i wspólna obrona. Federacja rośnie od dołu."
 TR2_rom_socjalna_metropolia:0 "Socjalna Metropolia"
 TR2_rom_socjalna_metropolia_desc:0 "Metropolia, w której liczą się ludzie, nie granice gmin."
 TR2_rom_straz:0 "Straż Obywatelska Torunia"
 TR2_rom_straz_desc:0 "Ochotnicze oddziały z dzielnic bronią miasta. Dowódców wybierają sami żołnierze."
 TR2_rom_obrona:0 "Obrona Socjalnej Republiki"
 TR2_rom_obrona_desc:0 "Republika nie atakuje – ale się broni. Umocnienia na mostach i przy węzłach kolejowych."
 TR2_rom_sojusz:0 "Sojusz lewicy regionu"
 TR2_rom_sojusz_desc:0 "Toruń zakłada sojusz lewicowych państw regionu."
 TR2_rom_zaklady:0 "Spółdzielnie zbrojeniowe"
 TR2_rom_zaklady_desc:0 "Spółdzielnie produkują broń dla Straży Obywatelskiej."
 TR2_rom_szkolenie:0 "Szkolenie ochotników"
 TR2_rom_szkolenie_desc:0 "Weterani uczą młodych. Każdy obywatel umie bronić swojego osiedla."
 TR2_rom_wyposazenie:0 "Wyposażenie Straży"
 TR2_rom_wyposazenie_desc:0 "Broń, hełmy i sprzęt łączności dla wszystkich oddziałów."
 TR2_rom_republika:0 "Socjalna Republika Toruńska"
 TR2_rom_republika_desc:0 "Mieszkania, praca i transport dla wszystkich. Toruń pokazuje, że da się inaczej."
 TR2_rom_zjazd:0 "Zjazd rad regionu"
 TR2_rom_zjazd_desc:0 "Przedstawiciele rad pracowniczych z całego regionu zjeżdżają do Torunia."
 TR2_rom_kujawy:0 "Propozycja dla Kujaw"
 TR2_rom_kujawy_desc:0 "Republika Kujawska dostaje propozycję przyłączenia do federacji na równych prawach."
 TR2_rom_integracja:0 "Równe prawa dla nowych członków"
 TR2_rom_integracja_desc:0 "Gminy, które przystąpiły do federacji, dostają pełne prawa i własnych przedstawicieli."
 TR2_rom_region:0 "Region równych"
 TR2_rom_region_desc:0 "Federacja zgłasza roszczenia do regionu – jako wspólnoty, nie zdobyczy."
 TR2_rom_final:0 "Federacja Równych"
 TR2_rom_final_desc:0 "Miasta i gminy współpracują jak równi z równymi. Toruń nie rządzi regionem – Toruń mu przewodzi."
 TR2_rom_r_plan:0 "Prawo do miasta"
 TR2_rom_r_plan_desc:0 "Rady pracownicze, spółdzielnie i organizacje lokatorskie rozdzielają środki według potrzeb. Priorytetami są mieszkania, praca i usługi publiczne. Cel: prawo do miasta."
 TR2_rom_r_rubinkowo:0 "Mieszkania dla Rubinkowa"
 TR2_rom_r_rubinkowo_desc:0 "Rady pracownicze, spółdzielnie i organizacje lokatorskie rozdzielają środki według potrzeb. Priorytetami są mieszkania, praca i usługi publiczne. Cel: mieszkania dla rubinkowa."
