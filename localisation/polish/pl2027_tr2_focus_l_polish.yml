 TR2_rom_w_roszczenia:0 "Ochrona praw mieszkańców"
 TR2_rom_w_roszczenia_desc:0 "Rady pracownicze, spółdzielnie i organizacje lokatorskie rozdzielają środki według potrzeb. Priorytetami są mieszkania, praca i usługi publiczne. Cel: ochrona praw mieszkańców."
 TR2_rom_w_lokalne:0 "Warty osiedlowe"
 TR2_rom_w_lokalne_desc:0 "Rady pracownicze, spółdzielnie i organizacje lokatorskie rozdzielają środki według potrzeb. Priorytetami są mieszkania, praca i usługi publiczne. Cel: warty osiedlowe."
 TR2_rom_w_wcielenie:0 "Dobrowolne związki obronne"
 TR2_rom_w_wcielenie_desc:0 "Rady pracownicze, spółdzielnie i organizacje lokatorskie rozdzielają środki według potrzeb. Priorytetami są mieszkania, praca i usługi publiczne. Cel: dobrowolne związki obronne."
 TR2_rom_w_kujawy:0 "Samoobrona Kujaw"
 TR2_rom_w_kujawy_desc:0 "Rady pracownicze, spółdzielnie i organizacje lokatorskie rozdzielają środki według potrzeb. Priorytetami są mieszkania, praca i usługi publiczne. Cel: samoobrona kujaw."
 TR2_rom_w_dominacja:0 "Armia społecznej republiki"
 TR2_rom_w_dominacja_desc:0 "Rady pracownicze, spółdzielnie i organizacje lokatorskie rozdzielają środki według potrzeb. Priorytetami są mieszkania, praca i usługi publiczne. Cel: armia społecznej republiki."
 TR2_kow_powrot:0 "Powrót do rodzinnego miasta"
 TR2_kow_powrot_desc:0 "Katarzyna Kowalczyk wraca z emigracji z kontaktami, doświadczeniem i planem. Toruń ma być nowoczesny."
 TR2_kow_elity:0 "Nowe elity"
 TR2_kow_elity_desc:0 "Do urzędów przychodzą ludzie z doświadczeniem z Europy i młodzi absolwenci UMK."
 TR2_kow_administracja:0 "Modernizacja administracji"
 TR2_kow_administracja_desc:0 "E-urzędy, przejrzyste procedury i audyt wszystkich spółek miejskich."
 TR2_kow_tozsamosc:0 "Nowa tożsamość Torunia"
 TR2_kow_tozsamosc_desc:0 "Toruń nie jest „miastem po upadku Polski”. Jest Toruniem – z własną flagą, historią i przyszłością."
 TR2_kow_dialog:0 "Dialog z mieszkańcami"
 TR2_kow_dialog_desc:0 "Panele obywatelskie i konsultacje online. Kowalczyk słucha – a potem decyduje."
 TR2_kow_kultura:0 "Toruń kultury"
 TR2_kow_kultura_desc:0 "Festiwale, muzea i Starówka znów przyciągają ludzi. Kultura jest walutą miękkiej siły."
 TR2_kow_otwarty:0 "Toruń otwarty na świat"
 TR2_kow_otwarty_desc:0 "Biuro handlowe Torunia otwiera przedstawicielstwa w Wilnie, Berlinie i Pradze."
 TR2_kow_handel:0 "Odbudowa handlu"
 TR2_kow_handel_desc:0 "Toruńskie pierniki, elektronika i usługi wracają na rynki zagraniczne."
 TR2_kow_technologie:0 "Centrum technologii"
 TR2_kow_technologie_desc:0 "Park technologiczny przy UMK przyciąga firmy z całego regionu."
 TR2_kow_tech_a_tb:0 "Centrum technologii"
 TR2_kow_tech_b_tb:0 "Centrum technologii"
 TR2_kow_logistyka:0 "Węzeł logistyczny"
 TR2_kow_logistyka_desc:0 "Toruń jako węzeł kolejowy i drogowy między Bałtykiem a Wielkopolską."
 TR2_kow_turystyka:0 "Usługi i turystyka"
 TR2_kow_turystyka_desc:0 "Hotele i restauracje na Starówce znów są pełne. Turyści płacą w euro."
 TR2_kow_gospodarka:0 "Nowoczesna gospodarka"
 TR2_kow_gospodarka_desc:0 "Toruń zarabia na wiedzy, logistyce i usługach."
 TR2_kow_gosp_tb:0 "Nowoczesna gospodarka"
 TR2_kow_dyplomacja:0 "Dyplomacja regionów"
 TR2_kow_dyplomacja_desc:0 "Kowalczyk proponuje regionom współpracę wzorowaną na Europie: wspólne instytucje, otwarte granice."
 TR2_kow_gminy:0 "Partnerstwo gmin"
 TR2_kow_gminy_desc:0 "Gminy wokół Torunia dostają ofertę partnerstwa: wspólne fundusze w zamian za integrację."
 TR2_kow_referenda:0 "Referenda europejskie"
 TR2_kow_referenda_desc:0 "W spornych gminach odbywają się referenda o przystąpieniu do Torunia."
 TR2_kow_sojusz:0 "Sojusz państw demokratycznych"
 TR2_kow_sojusz_desc:0 "Toruń zaprasza demokratyczne państwa regionu do wspólnego sojuszu."
 TR2_kow_litwa:0 "Porozumienie z Litwą i Niemcami"
 TR2_kow_litwa_desc:0 "Umowy handlowe z sąsiednimi państwami dają Toruniowi rynki i bezpieczeństwo."
 TR2_kow_wspolnota:0 "Wspólnota regionów"
 TR2_kow_wspolnota_desc:0 "Toruń jako stolica wspólnoty regionów Kujaw i Pomorza."
 TR2_kow_obrona:0 "Obrona terytorialna"
 TR2_kow_obrona_desc:0 "Nowoczesna obrona terytorialna według wzorów europejskich."
 TR2_kow_sprzet:0 "Zakupy sprzętu"
 TR2_kow_sprzet_desc:0 "Kontakty zagraniczne Kowalczyk pozwalają kupić sprzęt, którego Toruń nie wyprodukuje sam."
 TR2_kow_wywiad:0 "Wywiad i łączność"
 TR2_kow_wywiad_desc:0 "Nowoczesna łączność i biuro analiz. Toruń wie, co dzieje się w regionie."
 TR2_kow_wyw_tb:0 "Wywiad i łączność"
 TR2_kow_kadra:0 "Kadra oficerska"
 TR2_kow_kadra_desc:0 "Oficerowie szkoleni według standardów NATO."
 TR2_kow_gwarancje:0 "Gwarancje bezpieczeństwa"
 TR2_kow_gwarancje_desc:0 "Toruń gwarantuje niepodległość małym sąsiadom."
 TR2_kow_przemysl:0 "Przemysł obronny"
 TR2_kow_przemysl_desc:0 "Zakłady elektroniczne produkują sprzęt dla armii."
 TR2_kow_republika:0 "Republika Odrodzenia"
 TR2_kow_republika_desc:0 "Toruń jest nowoczesnym państwem z europejskimi aspiracjami."
 TR2_kow_kongres:0 "Kongres regionów"
 TR2_kow_kongres_desc:0 "Przedstawiciele regionów zjeżdżają do Torunia, by rozmawiać o wspólnej przyszłości."
 TR2_kow_integracja:0 "Integracja partnerów"
 TR2_kow_integracja_desc:0 "Gminy partnerskie stają się częścią Republiki."
 TR2_kow_bydgoszcz:0 "Most do Bydgoszczy"
 TR2_kow_bydgoszcz_desc:0 "Kowalczyk proponuje Bydgoszczy partnerstwo – jeśli tam też rządzą ludzie gotowi do rozmów."
 TR2_kow_region:0 "Mandat regionu"
 TR2_kow_region_desc:0 "Republika Odrodzenia zgłasza roszczenia do regionu, by negocjować z pozycji siły."
 TR2_kow_final:0 "Nowa wspólnota"
 TR2_kow_final_desc:0 "Toruń jest centrum wspólnoty regionów – otwartej, nowoczesnej i bezpiecznej."
 TR2_kow_r_plan:0 "Samorządny kampus"
 TR2_kow_r_plan_desc:0 "Uczelnie, nowoczesne przedsiębiorstwa i handel współtworzą państwo. Otwarty rynek wymaga wykształconych kadr i gwarancji bezpieczeństwa. Cel: samorządny kampus."
