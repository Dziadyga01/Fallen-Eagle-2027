 TR2_kow_w_dominacja:0 "Elastyczna armia republiki"
 TR2_kow_w_dominacja_desc:0 "Uczelnie, nowoczesne przedsiębiorstwa i handel współtworzą państwo. Otwarty rynek wymaga wykształconych kadr i gwarancji bezpieczeństwa. Cel: elastyczna armia republiki."
 TR2_ela_nasz_torun:0 "Toruń należy do nas"
 TR2_ela_nasz_torun_desc:0 "Ruch Elany przejmuje Ratusz. Na wieży Ratusza Staromiejskiego zawisa flaga Ruchu, a na ulicach patrole „Straży Narodowej”."
 TR2_ela_mobilizacja:0 "Mobilizacja stadionowa"
 TR2_ela_mobilizacja_desc:0 "Każdy kibic Elany staje się żołnierzem. Stadion przy Bema zamienia się w koszary."
 TR2_ela_czystka:0 "Koniec z opozycją"
 TR2_ela_czystka_desc:0 "Komitety demokratów i lewicy zostają rozwiązane. Ich liderzy wyjeżdżają – albo milkną."
 TR2_ela_propaganda:0 "Propaganda Ruchu"
 TR2_ela_propaganda_desc:0 "Radio miejskie nadaje marsze i przemówienia. Toruń ma być twierdzą narodu."
 TR2_ela_straz:0 "Straż Narodowa"
 TR2_ela_straz_desc:0 "Paramilitarna formacja Ruchu pilnuje porządku i lojalności."
 TR2_ela_mlodziez:0 "Młodzież Ruchu"
 TR2_ela_mlodziez_desc:0 "Obozy, marsze i szkolenia strzeleckie dla młodzieży."
 TR2_ela_przemysl:0 "Militaryzacja przemysłu"
 TR2_ela_przemysl_desc:0 "Zakłady miejskie przestawiają się na produkcję wojenną."
 TR2_ela_nowe_oddzialy:0 "Nowe oddziały"
 TR2_ela_nowe_oddzialy_desc:0 "Każda dzielnica wystawia batalion. Toruń ma armię większą niż kiedykolwiek."
 TR2_ela_twierdza:0 "Twierdza na Wiśle"
 TR2_ela_twierdza_desc:0 "Stare forty pruskie wracają do służby. Toruń znów jest twierdzą."
 TR2_ela_zaopatrzenie:0 "Gospodarka wojenna"
 TR2_ela_zaopatrzenie_desc:0 "Kartki, przydziały i praca przymusowa w zakładach zbrojeniowych."
 TR2_ela_artyleria:0 "Artyleria toruńska"
 TR2_ela_artyleria_desc:0 "Poligon toruński znów pracuje. Ruch tworzy własną artylerię."
 TR2_ela_dowodcy:0 "Oficerowie Ruchu"
 TR2_ela_dowodcy_desc:0 "Dawni żołnierze i najwierniejsi bojówkarze dostają stopnie oficerskie."
 TR2_ela_roszczenia:0 "Ziemie torunian"
 TR2_ela_roszczenia_desc:0 "Ruch ogłasza, że gminy wokół Torunia „zawsze należały do miasta”."
 TR2_ela_podgorz:0 "Marsz na Podgórz"
 TR2_ela_podgorz_desc:0 "Most na lewy brzeg zostaje zajęty. Podgórz ma się podporządkować – albo zostać zdobyty."
 TR2_ela_gminy:0 "Ultimata dla gmin"
 TR2_ela_gminy_desc:0 "Gminy dostają ultimatum: podporządkowanie albo wojna."
 TR2_ela_solec:0 "Zajęcie Solca"
 TR2_ela_solec_desc:0 "Solec Kujawski kontroluje przeprawę. Ruch nie zostawi go Bydgoszczy."
 TR2_ela_wcielenie:0 "Wcielenie podbitych gmin"
 TR2_ela_wcielenie_desc:0 "Podporządkowane gminy stają się częścią Narodowego Torunia."
 TR2_ela_kujawy:0 "Wojna o Kujawy"
 TR2_ela_kujawy_desc:0 "Republika Kujawska to następny cel. Ruch potrzebuje przestrzeni."
 TR2_ela_rywalizacja:0 "Rywalizacja z bydgoską juntą"
 TR2_ela_rywalizacja_desc:0 "Jeśli Bydgoszczą rządzą generałowie, region ma dwóch kandydatów na hegemona. Musi zostać jeden."
 TR2_ela_bydgoszcz:0 "Marsz na Bydgoszcz"
 TR2_ela_bydgoszcz_desc:0 "Bydgoszcz od zawsze była rywalem. Teraz rywalizacja rozstrzygnie się na polu walki."
 TR2_ela_grudziadz:0 "Marsz na Grudziądz"
 TR2_ela_grudziadz_desc:0 "Grudziądz i jego twierdza to klucz do północy."
 TR2_ela_integracja:0 "Nowy porządek regionu"
 TR2_ela_integracja_desc:0 "Zdobyte ziemie dostają komisarzy Ruchu."
 TR2_ela_wloclawek:0 "Kierunek: Włocławek"
 TR2_ela_wloclawek_desc:0 "T-Pizza i jej państwo to kolejny cel – Ruch nie zamierza płacić za dostawy."
 TR2_ela_region:0 "Cały region dla Ruchu"
 TR2_ela_region_desc:0 "Ruch zgłasza roszczenia do całych Kujaw i Pomorza."
 TR2_ela_panstwo:0 "Państwo Ruchu"
 TR2_ela_panstwo_desc:0 "Narodowy Toruń jest państwem wojskowym z jednym celem: dominacją w regionie."
 TR2_ela_armia:0 "Armia Narodowa"
 TR2_ela_armia_desc:0 "Wszystkie bataliony tworzą jedną armię z jednolitym dowództwem."
 TR2_ela_bezpieka:0 "Służba Bezpieczeństwa Ruchu"
 TR2_ela_bezpieka_desc:0 "Każda dzielnica ma informatorów. Opozycja nie ma szans się zorganizować."
 TR2_ela_przemysl2:0 "Arsenał Ruchu"
 TR2_ela_przemysl2_desc:0 "Kolejne zakłady przestawione na produkcję wojenną."
 TR2_ela_defilada:0 "Defilada zwycięstwa"
 TR2_ela_defilada_desc:0 "Kolumny Ruchu przechodzą przez Rynek Staromiejski. Pokaz siły dla sąsiadów."
 TR2_ela_final:0 "Wielkie Państwo Toruńskie"
 TR2_ela_final_desc:0 "Toruń przestał być miastem – jest twierdzą i stolicą regionu podporządkowanego Ruchowi."
 TR2_ela_r_plan:0 "Władza pod sztandarem"
 TR2_ela_r_plan_desc:0 "Komendantura podporządkowuje administrację i gospodarkę potrzebom bezpieczeństwa. Mobilizacja zwiększa siłę reżimu, ale pogłębia konflikt z mieszkańcami. Cel: władza pod sztandarem."
 TR2_ela_r_rubinkowo:0 "Nadzór nad Rubinkowem"
 TR2_ela_r_rubinkowo_desc:0 "Komendantura podporządkowuje administrację i gospodarkę potrzebom bezpieczeństwa. Mobilizacja zwiększa siłę reżimu, ale pogłębia konflikt z mieszkańcami. Cel: nadzór nad rubinkowem."
