 TR2_kre_koniec_ratusza:0 "Koniec władzy Ratusza"
 TR2_kre_koniec_ratusza_desc:0 "Zamiast prezydenta – Rada Delegatów dzielnic. Ratusz staje się domem kultury, a decyzje zapadają na zgromadzeniach."
 TR2_kre_komuny:0 "Komuny Rubinkowa"
 TR2_kre_komuny_desc:0 "Bloki na Rubinkowie tworzą komunę: wspólne kuchnie, warsztaty i patrole."
 TR2_kre_zgromadzenia:0 "Zgromadzenia mieszkańców"
 TR2_kre_zgromadzenia_desc:0 "Każda dzielnica ma zgromadzenie, które wybiera delegatów – odwoływalnych w każdej chwili. Ludzie decydują więcej, Rada Delegatów – trudniej."
 TR2_kre_kolektywy:0 "Wolne kolektywy"
 TR2_kre_kolektywy_desc:0 "Zakłady przejmują ich pracownicy. Koniec dyrektorów, koniec akcjonariuszy."
 TR2_kre_skarpa:0 "Republika Skarpy"
 TR2_kre_skarpa_desc:0 "Osiedle Na Skarpie było pierwsze – teraz jest wzorem dla całego miasta."
 TR2_kre_wymiana:0 "Sieć wymiany"
 TR2_kre_wymiana_desc:0 "Spółdzielnie wymieniają się towarami bez pośredników."
 TR2_kre_milicja:0 "Milicja ludowa"
 TR2_kre_milicja_desc:0 "Ochotnicze oddziały komun: każdy członek komuny jest żołnierzem."
 TR2_kre_warsztaty:0 "Warsztaty zbrojeniowe komun"
 TR2_kre_warsztaty_desc:0 "Kolektywy produkują broń dla milicji."
 TR2_kre_obrona_dzielnic:0 "Obrona dzielnic"
 TR2_kre_obrona_dzielnic_desc:0 "Każde osiedle ma swoje barykady i plan obrony."
 TR2_kre_szkolenie:0 "Szkolenie milicji"
 TR2_kre_szkolenie_desc:0 "Weterani uczą ochotników. Dowódców wybierają oddziały – ale wspólne ćwiczenia uczą ich też słuchać sąsiednich dzielnic."
 TR2_kre_wyposazenie:0 "Broń dla ludu"
 TR2_kre_wyposazenie_desc:0 "Magazyny wojskowe zostają otwarte dla milicji."
 TR2_kre_gospodarka:0 "Gospodarka bez państwa"
 TR2_kre_gospodarka_desc:0 "Kolektywy, spółdzielnie i wymiana zastępują rynek i budżet."
 TR2_kre_gminy:0 "Wezwanie do gmin"
 TR2_kre_gminy_desc:0 "Komuny wzywają mieszkańców okolicznych gmin do przyłączenia się do federacji – jako równi wśród równych."
 TR2_kre_podgorz:0 "Komuna na Podgórzu"
 TR2_kre_podgorz_desc:0 "Lewy brzeg ma swoją niezależność – komuny proponują mu federację."
 TR2_kre_rady_byd:0 "Federacja komun z Bydgoszczą"
 TR2_kre_rady_byd_desc:0 "Jeśli w Bydgoszczy rządzą rady robotnicze, komuny proponują federację – ale ideologiczne różnice mogą skończyć się konfliktem."
 TR2_kre_wcielenie:0 "Federacja rośnie"
 TR2_kre_wcielenie_desc:0 "Gminy, które przyłączyły się do federacji, stają się jej pełnoprawnymi członkami."
 TR2_kre_roszczenia:0 "Rewolucja nie zna granic"
 TR2_kre_roszczenia_desc:0 "Komuny ogłaszają, że każda gmina w regionie ma prawo do wolności – i że pomogą jej ją zdobyć."
 TR2_kre_solec:0 "Wyzwolenie Solca"
 TR2_kre_solec_desc:0 "Solec Kujawski ma zostać wyzwolony spod władzy burmistrza."
 TR2_kre_kujawy:0 "Rewolucja na Kujawach"
 TR2_kre_kujawy_desc:0 "Milicje komun ruszają na Kujawy, by obalić władzę Republiki Kujawskiej."
 TR2_kre_dobrzyn:0 "Rewolucja w Ziemi Dobrzyńskiej"
 TR2_kre_dobrzyn_desc:0 "Rolnicy z Ziemi Dobrzyńskiej mają się uwolnić od swoich panów."
 TR2_kre_integracja:0 "Komuny na wyzwolonych ziemiach"
 TR2_kre_integracja_desc:0 "Wyzwolone gminy zakładają własne komuny i wysyłają delegatów do Torunia."
 TR2_kre_propaganda:0 "Głos rewolucji"
 TR2_kre_propaganda_desc:0 "Radio komun nadaje na cały region."
 TR2_kre_internacjonal:0 "Międzynarodówka nadwiślańska"
 TR2_kre_internacjonal_desc:0 "Komuny wzywają lewicowe ruchy w całym regionie do wspólnej walki."
 TR2_kre_region:0 "Wolny region"
 TR2_kre_region_desc:0 "Federacja ogłasza, że cały region jest jej przestrzenią wolności."
 TR2_kre_rada_delegatow:0 "Rada Delegatów Regionu"
 TR2_kre_rada_delegatow_desc:0 "Delegaci wszystkich komun spotykają się w Toruniu."
 TR2_kre_armia:0 "Armia federacji"
 TR2_kre_armia_desc:0 "Milicje komun tworzą wspólną armię – z wybieralnymi dowódcami."
 TR2_kre_bydgoszcz:0 "Rewolucja w Bydgoszczy"
 TR2_kre_bydgoszcz_desc:0 "Bydgoszcz z jej fabrykami to serce przemysłu regionu. Robotnicy muszą przejąć zakłady."
 TR2_kre_gospodarka2:0 "Federacja kolektywów"
 TR2_kre_gospodarka2_desc:0 "Kolektywy z całego regionu tworzą sieć produkcji i wymiany."
 TR2_kre_obrona2:0 "Obrona rewolucji"
 TR2_kre_obrona2_desc:0 "Rewolucja ma wrogów. Federacja buduje umocnienia na granicach."
 TR2_kre_final:0 "Rewolucja nad Wisłą"
 TR2_kre_final_desc:0 "Federacja Komun obejmuje region. Bez prezydenta, bez państwa – ale z armią i ideą."
 TR2_kre_r_plan:0 "Likwidacja ostatnich urzędów"
 TR2_kre_r_plan_desc:0 "Dzielnice podejmują decyzje samodzielnie. Kolektywy i zgromadzenia zastępują prezydenta, lecz wspólne działania wymagają oddolnej zgody. Cel: likwidacja ostatnich urzędów."
 TR2_kre_r_rubinkowo:0 "Zgromadzenie Rubinkowa"
