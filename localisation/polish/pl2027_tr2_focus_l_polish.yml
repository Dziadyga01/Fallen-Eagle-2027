 TR2_zal_stare_porzadki:0 "Stare porządki"
 TR2_zal_stare_porzadki_desc:0 "Zaleski wraca do gabinetu, w którym spędził dwadzieścia lat. Pierwszy rozkaz: wszystkie wydziały raportują codziennie."
 TR2_zal_gospodarz:0 "Gospodarz zna miasto"
 TR2_zal_gospodarz_desc:0 "Zaleski zna każdy wydział, każdą spółkę miejską i każdego dyrektora. Władza znów działa."
 TR2_zal_centralizacja:0 "Centralizacja administracji"
 TR2_zal_centralizacja_desc:0 "Rady dzielnic tracą kompetencje na rzecz Ratusza. Szybciej, sprawniej – i bez dyskusji."
 TR2_zal_budzet:0 "Budżet gospodarza"
 TR2_zal_budzet_desc:0 "Twardy budżet: inwestycje tak, rozdawnictwo nie. Część zaległych faktur zostaje wreszcie zapłacona."
 TR2_zal_spolki:0 "Spółki miejskie"
 TR2_zal_spolki_desc:0 "Wodociągi, ciepłownia i komunikacja miejska dostają nowych prezesów i nowe cele."
 TR2_zal_porzadek:0 "Porządek na ulicach"
 TR2_zal_porzadek_desc:0 "Straż Miejska dostaje nowe uprawnienia, a policja – nowe radiowozy."
 TR2_zal_wielkie_inwestycje:0 "Toruń wielkich inwestycji"
 TR2_zal_wielkie_inwestycje_desc:0 "Nowe hale, drogi i zakłady. Zaleski buduje tak, jak budował przez dwadzieścia lat – dużo i szybko."
 TR2_zal_arterie:0 "Rozbudowa arterii"
 TR2_zal_arterie_desc:0 "Nowe arterie wylotowe łączą miasto z autostradą i regionem."
 TR2_zal_nowy_most:0 "Nowy most"
 TR2_zal_nowy_most_desc:0 "Trzeci most przez Wisłę – symbol miasta, które się rozwija mimo wszystko."
 TR2_zal_przemysl:0 "Przemysł Torunia"
 TR2_zal_przemysl_desc:0 "Zakłady dostają zamówienia miejskie i ulgi podatkowe."
 TR2_zal_przemysl_tb:0 "Przemysł Torunia"
 TR2_zal_lotnisko:0 "Lotnisko regionalne"
 TR2_zal_lotnisko_desc:0 "Stary pomysł Zaleskiego wraca: lotnisko dla regionu – i dla wojska, jeśli zajdzie potrzeba."
 TR2_zal_inwestycje_idea:0 "Plan inwestycyjny"
 TR2_zal_inwestycje_idea_desc:0 "Wieloletni plan inwestycyjny zatwierdzony przez Radę jednogłośnie – bo opozycja nie przyszła na sesję. Banki podpiszą go tylko wtedy, gdy miasto nie tonie w długach."
 TR2_zal_sasiedzi:0 "Pragmatyczne sąsiedztwo"
 TR2_zal_sasiedzi_desc:0 "Zaleski nie obiecuje gminom wolności. Obiecuje drogi, wodociągi i porządek – w zamian za posłuszeństwo."
 TR2_zal_opieka:0 "Opieka nad gminami"
 TR2_zal_opieka_desc:0 "Gminy wokół Torunia dostają propozycję „opieki”: wspólnej administracji i ochrony."
 TR2_zal_wcielenie:0 "Wcielenie gmin"
 TR2_zal_wcielenie_desc:0 "Gminy pod opieką Torunia stają się dzielnicami miasta."
 TR2_zal_metropolia:0 "Spór o metropolię"
 TR2_zal_metropolia_desc:0 "Bydgoszcz chce być stolicą regionu. Zaleski przypomina, kto był nią przez stulecia."
 TR2_zal_referenda:0 "Referenda pod nadzorem"
 TR2_zal_referenda_desc:0 "Referenda w spornych gminach odbywają się pod nadzorem urzędników z Torunia."
 TR2_zal_metropolia_t:0 "Metropolia Toruńska"
 TR2_zal_metropolia_t_desc:0 "Mamy przewagę w gminach – czas postawić Bydgoszcz przed faktem dokonanym."
 TR2_zal_straz:0 "Straż Grodzka"
 TR2_zal_straz_desc:0 "Nowa formacja porządkowa – lojalna wobec Ratusza, wyszkolona przez byłych oficerów."
 TR2_zal_garnizon:0 "Garnizon toruński"
 TR2_zal_garnizon_desc:0 "Stare koszary znów są pełne. Toruń ma wojsko, które może bronić regionu."
 TR2_zal_artyleria:0 "Tradycje artyleryjskie"
 TR2_zal_artyleria_desc:0 "Toruń był miastem artylerzystów. Poligon znów słychać aż na Starówce."
 TR2_zal_art_tb:0 "Tradycje artyleryjskie"
 TR2_zal_roszczenia:0 "Pragmatyczne poszerzanie granic"
 TR2_zal_roszczenia_desc:0 "Gminy, które odmówiły opieki, dostają drugą szansę – tym razem z wojskiem przy granicy."
 TR2_zal_solec:0 "Operacja Solec"
 TR2_zal_solec_desc:0 "Solec Kujawski kontroluje przeprawę i drogę do Bydgoszczy. Toruń nie może go oddać rywalowi."
 TR2_zal_przemysl_obr:0 "Zakłady zbrojeniowe"
 TR2_zal_przemysl_obr_desc:0 "Hale przy Szosie Lubickiej produkują broń dla Straży i garnizonu."
 TR2_zal_porzadek_rozwoj:0 "Porządek i rozwój"
 TR2_zal_porzadek_rozwoj_desc:0 "Silna administracja, wielkie inwestycje i bezpieczeństwo. Toruń znów ma gospodarza – i ambicje."
 TR2_zal_kujawy:0 "Operacja Kujawy"
 TR2_zal_kujawy_desc:0 "Republika Kujawska blokuje drogę na południe. Zaleski uznaje, że czas na „uporządkowanie” regionu."
 TR2_zal_grudziadz:0 "Porozumienie z Grudziądzem"
 TR2_zal_grudziadz_desc:0 "Grudziądz dostaje ofertę opieki i wspólnej obrony Wisły."
 TR2_zal_integracja:0 "Integracja nowych ziem"
 TR2_zal_integracja_desc:0 "Nowe gminy dostają urzędy, drogi i lojalnych urzędników."
 TR2_zal_region:0 "Gród regionu"
 TR2_zal_region_desc:0 "Toruń zgłasza roszczenia do całego regionu."
 TR2_zal_final:0 "Wielki Toruń"
 TR2_zal_final_desc:0 "Gród Kopernika jest znów stolicą regionu. Gospodarz zrobił to, co obiecał – a może i więcej."
 TR2_zal_r_plan:0 "Jedno centrum zarządzania"
 TR2_zal_r_plan_desc:0 "Magistrat konsoliduje fundusze, zakłady i decyzje. Inwestycje przyspieszają, lecz mieszkańcy coraz mocniej odczuwają centralizację oraz zadłużenie. Cel: jedno centrum zarządzania."
