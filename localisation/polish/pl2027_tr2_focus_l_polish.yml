 TR2_rom_w_obrona:0 "Obrona ludzi i zakładów"
 TR2_rom_w_obrona_desc:0 "Rady pracownicze, spółdzielnie i organizacje lokatorskie rozdzielają środki według potrzeb. Priorytetami są mieszkania, praca i usługi publiczne. Cel: obrona ludzi i zakładów."
