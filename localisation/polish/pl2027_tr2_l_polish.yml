 TR2_sup_zaleski_p2:0 "Poparcie: Michał Zaleski §G+2§!, partia „Czas Gospodarzy” §G+1%§! popularności"
 tr2.30.t:0 "Debata w auli UMK"
 tr2.30.d:0 "Rada Miasta jako organizator wybiera główny temat debaty. Każdy kandydat jest mocny w innej sprawie – wybór tematu to wybór, kto zabłyśnie przed kamerami. Zwycięzca debaty wygrywa też ewentualny remis w wyborach."
 tr2.30.a:0 "Temat: ogrzewanie i ceny w sklepach."
 tr2.30.b:0 "Temat: mosty, drogi i odbudowa miasta."
 tr2.30.c:0 "Temat: bezpieczeństwo i granice miasta."
 tr2.30.e:0 "Temat: uczciwość władzy i sprawne urzędy."
 tr2.30.f:0 "Temat: kto ma decydować w dzielnicach."
 tr2.30.g:0 "Temat: Toruń, region i świat."
 tr2.60.t:0 "Ulica przejmuje inicjatywę"
 tr2.60.d:0 "Stabilność w mieście spadła tak nisko, że radykałowie nie chcą czekać na wybory. Kibice Elany zajmują Ratusz, a komitety Krevienki – zajezdnie i osiedla."
 tr2.60.a:0 "Rząd tymczasowy jeszcze się utrzyma."
 tr2.60.b:0 "Elana przejmuje miasto."
 tr2.60.c:0 "Rady dzielnic przejmują miasto."
 TR2_gulewski_1:0 "Odbudowa zaufania"
 TR2_gulewski_1_desc:0 "Urzędy działają, budżet jest jawny, a mieszkańcy znów wierzą, że głos ma znaczenie."
 TR2_gulewski_2:0 "Rzeczpospolita Miast"
 TR2_gulewski_2_desc:0 "Toruń jest wzorem dla innych miast regionu: demokracja, inwestycje i współpraca."
 TR2_zaleski_1:0 "Gospodarz zna miasto"
 TR2_zaleski_1_desc:0 "Zaleski wie, który wydział działa, a który tylko udaje. Decyzje zapadają szybko."
 TR2_zaleski_2:0 "Porządek i rozwój"
 TR2_zaleski_2_desc:0 "Silna administracja, wielkie inwestycje i bezpieczeństwo. Toruń znów ma gospodarza."
 TR2_romanowski_1:0 "Miasto dla mieszkańców"
 TR2_romanowski_1_desc:0 "Mieszkania komunalne, tani transport i rady pracownicze. Toruń dba o ludzi, nie o deweloperów."
 TR2_romanowski_2:0 "Federacja Równych"
 TR2_romanowski_2_desc:0 "Miasta i gminy współpracują dobrowolnie, dzieląc się zasobami i odpowiedzialnością."
 TR2_kowalczyk_1:0 "Nowe elity"
 TR2_kowalczyk_1_desc:0 "Ludzie z doświadczeniem z Europy i absolwenci UMK zarządzają miastem jak nowoczesną organizacją."
 TR2_kowalczyk_2:0 "Nowa wspólnota"
 TR2_kowalczyk_2_desc:0 "Toruń otwarty na świat: handel, dyplomacja i regionalna tożsamość."
 TR2_elana_1:0 "Toruń należy do nas"
 TR2_elana_1_desc:0 "Ulice należą do Ruchu, a Ratusz – do tych, którzy wygrali. Kto się sprzeciwia, milknie."
 TR2_elana_2:0 "Wielkie Państwo Toruńskie"
 TR2_elana_2_desc:0 "Twierdza na Wiśle z armią gotową do marszu. Region ma jedno centrum."
 TR2_krevienko_1:0 "Zgromadzenia mieszkańców"
 TR2_krevienko_1_desc:0 "Każda dzielnica decyduje o sobie na otwartych zgromadzeniach. Wolność jest głośna i powolna – ale prawdziwa."
 TR2_krevienko_2:0 "Federacja Komun"
 TR2_krevienko_2_desc:0 "Wolne komuny nad Wisłą tworzą federację bez państwa – i bronią jej z bronią w ręku."
 TR2_tt_unia_byd:0 "Jeśli Bydgoszczą rządzi §YRafał Bruski§!, Bydgoszcz otrzyma propozycję wspólnej republiki demokratycznej."
 TR2_tt_fed_soc:0 "Jeśli Bydgoszczą rządzą §YBydgoskie Rady Robotnicze§!, otrzymają propozycję federacji socjalnej."
 TR2_tt_fed_kom:0 "Jeśli Bydgoszczą rządzą §YBydgoskie Rady Robotnicze§!, otrzymają propozycję federacji komun (z ryzykiem konfliktu)."
 TR2_SOJUSZ_MIAST:0 "Sojusz Miast Nadwiślańskich"
 TR2_FRONT_SPOLECZNY:0 "Front Społeczny Kujaw"
 TR2_WSPOLNOTA:0 "Wspólnota Regionów"
 TR2_FEDERACJA_KOMUN:0 "Federacja Komun"
 TR2_gulewski_tree:0 "Druga Republika Toruńska"
 TR2_zaleski_tree:0 "Republika Toruńska"
 TR2_romanowski_tree:0 "Socjalna Republika Toruńska"
 TR2_kowalczyk_tree:0 "Republika Odrodzenia Torunia"
 TR2_elana_tree:0 "Narodowy Toruń"
 TR2_krevienko_tree:0 "Wolna Komuna Toruńska"
 TR2_wspolpraca:0 "Współpraca z Toruniem"
 tr2.70.t:0 "Propozycja z Torunia"
 tr2.70.d:0 "[From.GetName] proponuje nam przyłączenie: wspólne instytucje, ochronę i zachowanie samorządu. Odmowa nie zostanie potraktowana jako zniewaga – ale nikt nie wie, co przyniesie przyszłość."
 tr2.70.a:0 "Przyjmujemy propozycję."
 tr2.70.b:0 "Zostajemy niezależni."
 tr2.71.t:0 "Zaproszenie do sojuszu"
 tr2.71.d:0 "[From.GetName] zaprasza nas do sojuszu państw regionu."
 tr2.71.a:0 "Dołączamy."
 tr2.71.b:0 "Nie teraz."
 tr2.75.t:0 "Pakt z Toruniem"
 tr2.75.d:0 "[From.GetName] proponuje Bydgoszczy pakt: koniec sporów, wspólne lotnisko i wspólną obronę regionu."
 tr2.75.a:0 "Zgoda – koniec wojny między miastami."
 tr2.75.b:0 "Bydgoszcz nie potrzebuje paktów."
 tr2.76.t:0 "Wspólna republika demokratyczna"
 tr2.76.d:0 "[From.GetName] proponuje połączenie obu miast w jedną demokratyczną republikę. Bydgoszcz zachowa samorząd i równą reprezentację."
 tr2.76.a:0 "Zgoda – jedna republika, dwie stolice."
 tr2.76.b:0 "Bydgoszcz zostaje osobnym państwem."
 tr2.77.t:0 "Federacja socjalna"
 tr2.77.d:0 "[From.GetName] proponuje federację socjalną robotników obu miast."
 tr2.77.a:0 "Robotnicy obu miast – łączcie się!"
 tr2.77.b:0 "Rady Bydgoszczy zostają niezależne."
 tr2.78.t:0 "Dwóch kandydatów na hegemona"
 tr2.78.d:0 "[From.GetName] – Ruch Elany – ogłasza, że region ma tylko jedno centrum. Generałowie w Bydgoszczy odpowiadają mobilizacją."
 tr2.78.a:0 "Przyjmujemy wyzwanie."
 tr2.79.t:0 "Federacja komun"
 tr2.79.d:0 "[From.GetName] proponuje federację komun. Ideologowie obu stron spierają się o wszystko – od rad zakładowych po rolę milicji."
 tr2.79.a:0 "Federacja – mimo różnic."
 tr2.79.b:0 "Rady nie podporządkują się anarchistom."
 tr2.79.c:0 "Odrzucamy, ale bez wojny."
