 tr2.29.t:0 "Listy zamknięte"
 tr2.29.d:0 "Komisja wyborcza zamyka listy kandydatów."
 tr2.29.a:0 "Do wyborów!"
 tr2.29.b:0 "Nikt nie został dopuszczony – dodatkowa tura."
