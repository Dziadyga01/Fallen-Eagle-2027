 tr2.1.t:0 "Warszawa milczy"
 tr2.1.d:0 "Radio nadaje muzykę i komunikaty o „chwilowych utrudnieniach”. Na Rynku Staromiejskim ktoś rozwiesza kartkę: „Kto rządzi Polską?”. Nikt nie zna odpowiedzi."
 tr2.1.a:0 "Ratusz przejmuje odpowiedzialność."
 tr2.1.b:0 "Trzeba wezwać doświadczonych samorządowców."
 tr2.2.t:0 "Kto przewodniczy Radzie?"
 tr2.2.d:0 "Radni spierają się, kto ma prowadzić obrady w czasie kryzysu. Każda propozycja to sygnał dla mieszkańców, kto naprawdę trzyma ster."
 tr2.2.a:0 "Prezydent Gulewski – ciągłość władzy."
 tr2.2.b:0 "Najstarszy radny – szacunek dla doświadczenia."
 tr2.2.c:0 "Przedstawiciel osiedli – głos mieszkańców."
 TR2_sup_krevienko_p3:0 "Poparcie: Maksim Krevienko §G+3§!, partia „Federacja Wolnych Dzielnic” §G+1.5%§! popularności\n  Kurs: wolne dzielnice (90 dni): §G+3%§! poparcie wojny, §G+5%§! obrona dywizji, §R-10%§! punkty polityczne"
 tr2.4.t:0 "Kolejki na Rubinkowie"
 tr2.4.d:0 "Pod sklepami na Rubinkowie stoją setki ludzi. Lokatorzy organizują wspólne kuchnie, a część radnych domaga się wysłania Straży Miejskiej."
 tr2.4.a:0 "Wspólne kuchnie i kartki na żywność."
 tr2.4.b:0 "Straż Miejska ma przywrócić porządek."
 TR2_sup_gulewski_p3:0 "Poparcie: Paweł Gulewski §G+3§!, partia „Obywatelski Toruń” §G+1.5%§! popularności\n  Kurs: ciągłość władzy (90 dni): §G+3%§! stabilność, §G+5%§! punkty polityczne, §R-3%§! poparcie wojny"
 TR2_sup_zaleski_p3:0 "Poparcie: Michał Zaleski §G+3§!, partia „Czas Gospodarzy” §G+1.5%§! popularności\n  Kurs: gospodarz (90 dni): §G+5%§! szybkość budowy, §G+5%§! punkty polityczne, §R-2%§! stabilność"
 tr2.5.t:0 "Lewy brzeg idzie własną drogą"
 tr2.5.d:0 "Podgórz ogłosił samorząd. Z drugiego brzegu płyną transmisje, w których Ratusz jest bohaterem drwin. Co robimy z Podgórzem?"
 tr2.5.a:0 "Rozmawiać – Podgórz to nadal część miasta."
 tr2.5.b:0 "Twarda linia: most zamknięty dla prowokatorów."
 TR2_sup_kowalczyk_p7:0 "Poparcie: Katarzyna Kowalczyk §G+7§!, partia „Toruński Komitet Obywatelski” §G+3.5%§! popularności\n  Kurs: nowy Toruń (90 dni): §G+5%§! badania, §G+3%§! punkty polityczne, §R-4%§! poparcie wojny"
 TR2_sup_gulewski_p2:0 "Poparcie: Paweł Gulewski §G+2§!, partia „Obywatelski Toruń” §G+1%§! popularności"
 TR2_sup_elana_p2:0 "Poparcie: Ruch Elany §G+2§!, partia „Narodowy Toruń” §G+1%§! popularności"
 tr2.6.t:0 "Uniwersytet przy stole"
 tr2.6.d:0 "UMK żąda miejsca w radzie kryzysowej, ekspertów w urzędach i ochrony kampusu na Bielanach."
 tr2.6.a:0 "Eksperci z UMK do rządu tymczasowego."
 tr2.6.b:0 "Uniwersytet ma uczyć, nie rządzić."
 TR2_sup_kowalczyk_p3:0 "Poparcie: Katarzyna Kowalczyk §G+3§!, partia „Toruński Komitet Obywatelski” §G+1.5%§! popularności\n  Kurs: nowy Toruń (90 dni): §G+5%§! badania, §G+3%§! punkty polityczne, §R-4%§! poparcie wojny"
 TR2_sup_elana_p8:0 "Poparcie: Ruch Elany §G+8§!, partia „Narodowy Toruń” §G+4%§! popularności\n  Kurs: porządek (90 dni): §G+5%§! poparcie wojny, §G+10%§! pobór, §R-4%§! stabilność"
 TR2_sup_romanowski_p3:0 "Poparcie: Michał Romanowski §G+3§!, partia „Toruń dla Mieszkańców” §G+1.5%§! popularności\n  Kurs: miasto dla mieszkańców (90 dni): §G+4%§! stabilność, §R+2%§! dobra konsumpcyjne, §R-3%§! punkty polityczne"
 tr2.7.t:0 "Marsz kibiców"
 tr2.7.d:0 "Kibice Elany maszerują pod Ratusz. Część mieszkańców bije brawo, część zamyka okna. Na Skarpie zbiera się kontrmanifestacja."
 tr2.7.a:0 "Zakazać marszów do końca kryzysu."
 tr2.7.b:0 "Pozwolić im mówić – to też mieszkańcy."
 tr2.7.c:0 "Wspierać kontrmanifestację."
 tr2.8.t:0 "Pusty Ratusz"
 tr2.8.d:0 "Urzędnicy nie przychodzą do pracy, decyzje Rady nie docierają do dzielnic. Trzeba wybrać, na czym oprzeć władzę do wyborów."
 tr2.8.a:0 "Nadzwyczajne pełnomocnictwa dla prezydenta."
 tr2.8.b:0 "Rady dzielnic przejmują sprawy lokalne."
 tr2.8.c:0 "Eksperci i menedżerowie w urzędach."
 TR2_sup_romanowski_p2:0 "Poparcie: Michał Romanowski §G+2§!, partia „Toruń dla Mieszkańców” §G+1%§! popularności"
 tr2.9.t:0 "Gospodarz wraca"
 tr2.9.d:0 "Michał Zaleski zaprasza na spotkanie w Dworze Artusa. Sala pęka w szwach. „Wiem, jak rządzić tym miastem” – mówi i nikt nie śmie mu przerwać."
 tr2.9.a:0 "To głos rozsądku."
 tr2.9.b:0 "Toruń potrzebuje nowych twarzy."
 TR2_sup_romanowski_p8:0 "Poparcie: Michał Romanowski §G+8§!, partia „Toruń dla Mieszkańców” §G+4%§! popularności\n  Kurs: miasto dla mieszkańców (90 dni): §G+4%§! stabilność, §R+2%§! dobra konsumpcyjne, §R-3%§! punkty polityczne"
 TR2_sup_krevienko_p8:0 "Poparcie: Maksim Krevienko §G+8§!, partia „Federacja Wolnych Dzielnic” §G+4%§! popularności\n  Kurs: wolne dzielnice (90 dni): §G+3%§! poparcie wojny, §G+5%§! obrona dywizji, §R-10%§! punkty polityczne"
 tr2.10.t:0 "Lewica na rozdrożu"
 tr2.10.d:0 "Komitety lewicy spierają się, czy iść do wyborów, czy budować rady dzielnic poza Ratuszem."
 tr2.10.a:0 "Reformy przez wybory – Romanowski."
 tr2.10.b:0 "Rady dzielnic zamiast Ratusza – Krevienko."
 TR2_sup_elana_p3:0 "Poparcie: Ruch Elany §G+3§!, partia „Narodowy Toruń” §G+1.5%§! popularności\n  Kurs: porządek (90 dni): §G+5%§! poparcie wojny, §G+10%§! pobór, §R-4%§! stabilność"
 tr2.11.t:0 "Transmisja z drugiego brzegu"
 tr2.11.d:0 "Streamer z Podgórza wystawia kandydatom „oceny” na żywo. Jego widzowie to tysiące niezdecydowanych wyborców, którzy nie ufają nikomu z Ratusza."
 tr2.11.a:0 "Niech mówi – to nie nasz problem."
 tr2.11.b:0 "Zaprosić go do debaty."
