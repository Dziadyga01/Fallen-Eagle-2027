 TR2_rzad_tymczasowy:0 "Rząd tymczasowy"
 TR2_rzad_tymczasowy_desc:0 "Paweł Gulewski kieruje tymczasową administracją miasta. Nikt nie wie, jak długo – i nikt nie chce zaczynać wojen, dopóki Toruń nie wybierze nowych władz."
 TR2_kontrowersyjny:0 "Kontrowersyjny wynik wyborów"
 TR2_kontrowersyjny_desc:0 "Nowa władza wygrała mimo słabego poparcia. Część mieszkańców nie uznaje wyniku."
 TR2_kampania_mod:0 "Kampania wyborcza w Toruniu"
 TR2_kampania_mod_desc:0 "Sondaż (udział w poparciu, w nawiasie punkty):\nGulewski §Y[?TR2_udzial_gulewski|0]%§! ([?TR2_pop_gulewski|0]), Zaleski §Y[?TR2_udzial_zaleski|0]%§! ([?TR2_pop_zaleski|0]), Romanowski §Y[?TR2_udzial_romanowski|0]%§! ([?TR2_pop_romanowski|0]),\nKowalczyk §Y[?TR2_udzial_kowalczyk|0]%§! ([?TR2_pop_kowalczyk|0]), Ruch Elany §Y[?TR2_udzial_elana|0]%§! ([?TR2_pop_elana|0]), Krevienko §Y[?TR2_udzial_krevienko|0]%§! ([?TR2_pop_krevienko|0]).\nWygrywa zarejestrowany kandydat z największym poparciem. Remis: wygrywa zwycięzca debaty, potem kandydat wyżej w sondażu z początku kampanii. Wybory odbywają się najpóźniej 4 kwietnia 2028 r. (145. dzień kampanii)."
 TR2_start_tree:0 "Miasto w cieniu rozpadu"
 TR2_sup_zaleski_p8:0 "Poparcie: Michał Zaleski §G+8§!, partia „Czas Gospodarzy” §G+4%§! popularności\n  Kurs: gospodarz (90 dni): §G+5%§! szybkość budowy, §G+5%§! punkty polityczne, §R-2%§! stabilność"
 TR2_tt_kand:0 "Kandydaci zgłoszą się w kolejnych zdarzeniach: każdego można §Gdopuścić§! albo §Rodrzucić§!. Odrzucenie wszystkich oznacza §Ydodatkową turę§!."
 TR2_req_kand:0 "Co najmniej jeden komitet został dopuszczony do wyborów"
 TR2_req_cisza:0 "Trwa cisza wyborcza (od 25 marca 2028 r.)"
 TR2_tt_wybory:0 "Głosy liczone są według §Ypoparcia zarejestrowanych kandydatów§!. Wygrywa najwyższe poparcie; przy remisie – zwycięzca debaty, potem kandydat wyżej w sondażu z początku kampanii."
 TR2_req_zwyciezca:0 "Wybory się odbyły i znamy zwycięzcę"
 TR2_tt_zaprz:0 "Zwycięzca obejmuje władzę, zmienia się ustrój, nazwa państwa i drzewko narodowe. Odblokowują się §Ygospodarka, wojsko, sojusze i ekspansja§!."
 TR2_req_kampania:0 "Wybory jeszcze się nie odbyły"
