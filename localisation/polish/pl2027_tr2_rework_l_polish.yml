l_polish:
 TR2_RW_gul_review:0 "Kryzys mandatu Rady Miasta"
 TR2_RW_gul_review_desc:0 "Po rozszerzeniu republiki mieszkańcy pytają, kto kontroluje nową władzę. Audyt ujawni koszt kompromisów i otworzy debatę o przyszłym ustroju."
 TR2_RW_gul_civic:0 "Budżety osiedlowe"
 TR2_RW_gul_civic_desc:0 "Rady osiedli otrzymają środki na odbudowę i lokalne inwestycje. Władza centralna odda część swobody finansowej."
 TR2_RW_gul_executive:0 "Gabinet ekspertów"
 TR2_RW_gul_executive_desc:0 "Prezydent powoła niezależnych specjalistów. Szybsze decyzje ograniczą udział dzielnic w rządzeniu."
 TR2_RW_gul_civic_work:0 "Referenda na osiedlach"
 TR2_RW_gul_civic_work_desc:0 "Mieszkańcy Rubinkowa, Skarpy i Podgórza zagłosują nad lokalnymi priorytetami."
 TR2_RW_gul_executive_work:0 "Sprawne urzędy"
 TR2_RW_gul_executive_work_desc:0 "Ujednolicone procedury przywrócą sprawność magistratu i ułatwią realizację inwestycji."
 TR2_RW_gul_accord:0 "Statut republikański"
 TR2_RW_gul_accord_desc:0 "Nowy statut określi kontrolę społeczną nad władzą i prawa jednostek samorządu."
 TR2_RW_gul_legacy:0 "Wisła łączy miasta"
 TR2_RW_gul_legacy_desc:0 "Toruń pozostanie ośrodkiem demokratycznej współpracy miast nad Wisłą."
 tr2rw.1.t:0 "Cena kompromisu"
 tr2rw.1.d:0 "Miasto rosło szybciej niż jego instytucje. Rady dzielnic żądają własnych budżetów, a urzędnicy chcą jednolitych przepisów. Obie strony powołują się na wolę mieszkańców."
 tr2rw.1.a:0 "Zaprosić rady osiedli"
 tr2rw.1.b:0 "Zebrać ekspertów"
 tr2rw.21.t:0 "Nowa republika miejska"
 tr2rw.21.d:0 "Samorządowcy z Torunia podpisali porozumienie o wspólnej administracji i kontroli wydatków. Od tego dnia nowa republika musi udowodnić, że wybory cokolwiek znaczą."
 tr2rw.21.a:0 "Zaczynamy nowy rozdział."
 TR2_RW_zal_review:0 "Bilans wielkich inwestycji"
 TR2_RW_zal_review_desc:0 "Ambitne projekty przyniosły sukcesy, lecz koszty utrzymania rosną. Magistrat musi ujawnić bilans inwestycji."
 TR2_RW_zal_civic:0 "Dyscyplina budżetowa"
 TR2_RW_zal_civic_desc:0 "Prezydent zamrozi wydatki inne niż niezbędne. Administracja odzyska kontrolę nad finansami kosztem tempa odbudowy."
 TR2_RW_zal_executive:0 "Kredyt odbudowy"
 TR2_RW_zal_executive_desc:0 "Pożyczki umożliwią szybkie roboty budowlane. Zadłużenie zwiększy niepokój mieszkańców."
 TR2_RW_zal_civic_work:0 "Reforma spółek miejskich"
 TR2_RW_zal_civic_work_desc:0 "Spółki miejskie dostaną jasne cele, kontrolę wydatków i wspólny plan zaopatrzenia."
 TR2_RW_zal_executive_work:0 "Przebudowa arterii"
 TR2_RW_zal_executive_work_desc:0 "Nowe arterie połączą obie strony Wisły z zachodnimi węzłami transportu."
 TR2_RW_zal_accord:0 "Gospodarski kompromis"
 TR2_RW_zal_accord_desc:0 "Silna administracja pogodzi tempo inwestycji z bezpieczeństwem budżetu."
 TR2_RW_zal_legacy:0 "Wielki Toruń 2030"
 TR2_RW_zal_legacy_desc:0 "Plan rozwoju miasta wejdzie w ostatnią fazę. Toruń będzie bronił pozycji regionalnego centrum inwestycji."
 tr2rw.2.t:0 "Ile kosztuje odbudowa?"
 tr2rw.2.d:0 "Z raportu magistratu wynika, że Toruń nie jest w stanie jednocześnie sfinansować wszystkich zaplanowanych inwestycji. Rząd musi wybrać między dyscypliną a wzrostem."
 tr2rw.2.a:0 "Chronić budżet"
 tr2rw.2.b:0 "Nie zatrzymywać budów"
 tr2rw.22.t:0 "Toruń po raz drugi"
 tr2rw.22.d:0 "Zespół prezydenta ogłosił zakończenie pierwszego etapu przebudowy. Mieszkańcy zobaczą efekty, lecz rachunek za ambicje magistratu dopiero nadejdzie."
 tr2rw.22.a:0 "Zaczynamy nowy rozdział."
 TR2_RW_rom_review:0 "Głos z Rubinkowa"
 TR2_RW_rom_review_desc:0 "Kryzys uderzył najmocniej w dzielnice mieszkalne. Organizacje społeczne żądają gwarancji zatrudnienia, transportu i mieszkania."
 TR2_RW_rom_civic:0 "Spółdzielnie mieszkańców"
 TR2_RW_rom_civic_desc:0 "Mieszkańcy zorganizują własne spółdzielnie usług oraz remontów. Program wymaga wsparcia z budżetu miasta."
 TR2_RW_rom_executive:0 "Miejskie przedsiębiorstwa"
 TR2_RW_rom_executive_desc:0 "Ratusz przejmie odpowiedzialność za wybrane zakłady i utrzymanie infrastruktury krytycznej."
 TR2_RW_rom_civic_work:0 "Mieszkania dla rodzin"
 TR2_RW_rom_civic_work_desc:0 "Priorytetem staną się lokale komunalne oraz remonty pustostanów. Gminy muszą zapewnić materiały i wykonawców."
 TR2_RW_rom_executive_work:0 "Rady zakładowe"
 TR2_RW_rom_executive_work_desc:0 "Pracownicy uzyskają przedstawicielstwo przy podejmowaniu decyzji gospodarczych."
 TR2_RW_rom_accord:0 "Porozumienie obu brzegów"
 TR2_RW_rom_accord_desc:0 "Rubinkowo, Skarpa, Podgórz i centrum uzgodnią wspólny plan usług publicznych."
 TR2_RW_rom_legacy:0 "Republika społeczna"
 TR2_RW_rom_legacy_desc:0 "Nowy ustrój ma zagwarantować powszechne usługi i realne uczestnictwo mieszkańców w życiu gospodarczym."
 tr2rw.3.t:0 "Protest lokatorów"
 tr2rw.3.d:0 "Na Rubinkowie mieszkańcy domagają się tanich mieszkań, lecz załogi fabryk oczekują środków na miejsca pracy. Rząd musi rozdzielić ograniczony budżet."
 tr2rw.3.a:0 "Najpierw mieszkańcy"
 tr2rw.3.b:0 "Najpierw zakłady"
 tr2rw.23.t:0 "Przyjęto Kartę Społeczną"
 tr2rw.23.d:0 "Rady osiedli i zakładów zatwierdziły wspólny katalog usług publicznych. Nowa władza bierze odpowiedzialność za jego realizację."
 tr2rw.23.a:0 "Zaczynamy nowy rozdział."
 TR2_RW_kow_review:0 "Ucieczka talentów"
 TR2_RW_kow_review_desc:0 "Młodzi naukowcy i przedsiębiorcy rozważają wyjazd z regionu. Bez wiedzy i kapitału odbudowa stanie w miejscu."
 TR2_RW_kow_civic:0 "Wolny kampus"
 TR2_RW_kow_civic_desc:0 "Uniwersytet otrzyma autonomię organizacyjną i środki do prowadzenia badań."
 TR2_RW_kow_executive:0 "Strefa przedsiębiorczości"
 TR2_RW_kow_executive_desc:0 "Miasto ułatwi tworzenie nowych przedsiębiorstw, rezygnując z części doraźnych dochodów."
 TR2_RW_kow_civic_work:0 "Sieć naukowa UMK"
 TR2_RW_kow_civic_work_desc:0 "Współpraca laboratoriów UMK i warsztatów miejskich przyspieszy odbudowę zaplecza technicznego."
 TR2_RW_kow_executive_work:0 "Inkubator nad Wisłą"
 TR2_RW_kow_executive_work_desc:0 "Powstaną warsztaty i biura, w których młodzi przedsiębiorcy uruchomią produkcję oraz usługi."
 TR2_RW_kow_accord:0 "Nowy toruński kontrakt"
 TR2_RW_kow_accord_desc:0 "Samorząd ustali zasady przejrzystych zamówień i wolności gospodarczej."
 TR2_RW_kow_legacy:0 "Otwarte miasto"
 TR2_RW_kow_legacy_desc:0 "Toruń stanie się otwartym ośrodkiem wiedzy oraz handlu między pozostałymi republikami."
 tr2rw.4.t:0 "Absolwenci opuszczają miasto"
 tr2rw.4.d:0 "UMK alarmuje o wyjeździe kadry. Przedsiębiorcy przekonują, że bez swobodnego rynku nie wrócą inwestycje. Dwie strategie rywalizują o te same środki."
 tr2rw.4.a:0 "Postawić na naukę"
 tr2rw.4.b:0 "Postawić na biznes"
 tr2rw.24.t:0 "Manifest Otwartego Torunia"
 tr2rw.24.d:0 "Władze ogłosiły nowe zasady współpracy uczelni, firm i samorządów. Otwartość ma stać się źródłem przewagi regionu."
 tr2rw.24.a:0 "Zaczynamy nowy rozdział."
 TR2_RW_kre_review:0 "Kongres wolnych dzielnic"
 TR2_RW_kre_review_desc:0 "Samorządne dzielnice odrzucają stałą władzę centralną. Ich przedstawiciele zbierają się, aby ustalić granice wspólnej odpowiedzialności."
 TR2_RW_kre_civic:0 "Wolne zgromadzenia"
 TR2_RW_kre_civic_desc:0 "Zgromadzenia dzielnic podejmą decyzje o zapasach i pracy. Proces będzie wolniejszy, lecz zyska społeczną akceptację."
 TR2_RW_kre_executive:0 "Milicje sąsiedzkie"
 TR2_RW_kre_executive_desc:0 "Dzielnice powołają niezależne oddziały obronne, których koordynacja stanie się głównym wyzwaniem."
 TR2_RW_kre_civic_work:0 "Otwarta sieć wymiany"
 TR2_RW_kre_civic_work_desc:0 "Magazyny żywności i usług otworzą się na wzajemną wymianę między dzielnicami."
 TR2_RW_kre_executive_work:0 "Uzbrojone komuny"
 TR2_RW_kre_executive_work_desc:0 "Oddolne formacje szkolą się do obrony przepraw i własnych osiedli."
 TR2_RW_kre_accord:0 "Zjazd delegatów"
 TR2_RW_kre_accord_desc:0 "Delegaci ustalą zasady wspólnej obrony, nie tworząc nowego ratusza."
 TR2_RW_kre_legacy:0 "Federacja komunalna"
 TR2_RW_kre_legacy_desc:0 "Komuny połączą siły w luźną federację, w której władza pozostanie przy zgromadzeniach."
 tr2rw.5.t:0 "Wolność czy bezpieczeństwo?"
 tr2rw.5.d:0 "Na kongresie delegaci Skarpy, Rubinkowa i lewobrzeżnych dzielnic spierają się o przyszłość komun. Część chce swobodnych zgromadzeń, inni żądają uzbrojonych patroli."
 tr2rw.5.a:0 "Oddać głos zgromadzeniom"
 tr2rw.5.b:0 "Zorganizować samoobronę"
 tr2rw.25.t:0 "Bez nowego ratusza"
 tr2rw.25.d:0 "Federacja Toruńska przyjęła statut bez jednego przywódcy wykonawczego. Poszczególne dzielnice zachowają samodzielność, a spory rozstrzygnie zjazd delegatów."
 tr2rw.25.a:0 "Zaczynamy nowy rozdział."
 TR2_RW_ela_review:0 "Noc po zwycięstwie"
 TR2_RW_ela_review_desc:0 "Zwycięstwo frakcji stadionowej nie rozwiązało kwestii zarządzania miastem. Rywalizują działacze i wojskowi."
 TR2_RW_ela_civic:0 "Mobilizacja trybun"
 TR2_RW_ela_civic_desc:0 "Zwolennicy reżimu zostaną włączeni do lokalnych formacji. Wzrośnie gotowość bojowa, ale napięcia społeczne nie ustąpią."
 TR2_RW_ela_executive:0 "Rada bezpieczeństwa"
 TR2_RW_ela_executive_desc:0 "Oficerowie i urzędnicy dostaną zadanie utrzymania usług oraz rozkazów."
 TR2_RW_ela_civic_work:0 "Oddziały stadionowe"
 TR2_RW_ela_civic_work_desc:0 "Władze rozbudują ochotnicze oddziały do patrolowania dróg i obrony miasta."
 TR2_RW_ela_executive_work:0 "Aparat administracyjny"
 TR2_RW_ela_executive_work_desc:0 "Administracja odzyska nadzór nad zaopatrzeniem i produkcją wojskową."
 TR2_RW_ela_accord:0 "Narzucenie porządku"
 TR2_RW_ela_accord_desc:0 "Reżim narzuci jednolite przepisy, utrzymując porządek kosztem swobód politycznych."
 TR2_RW_ela_legacy:0 "Miasto pod sztandarem"
 TR2_RW_ela_legacy_desc:0 "Nowy ustrój utrwali militarny charakter państwa i podporządkuje gospodarkę aparatowi bezpieczeństwa."
 tr2rw.6.t:0 "Po triumfie trybun"
 tr2rw.6.d:0 "Komendantura odkrywa, że sympatycy frakcji i zawodowi oficerowie wydają sprzeczne rozkazy. Decyzja o przyszłej strukturze władzy musi zapaść dziś."
 tr2rw.6.a:0 "Słuchać działaczy"
 tr2rw.6.b:0 "Słuchać sztabu"
 tr2rw.26.t:0 "Nowy porządek Torunia"
 tr2rw.26.d:0 "Po serii narad frakcja rządząca ogłosiła pełne podporządkowanie struktur miasta. Przeciwnicy polityczni zapowiadają opór."
 tr2rw.26.a:0 "Zaczynamy nowy rozdział."
 TR2_RW_paliwa:0 "Brak paliwa w Toruniu"
 TR2_RW_paliwa_desc:0 "Dostawy z zachodu ustały. Ratusz i komitety wyborcze muszą znaleźć środki na transport przed kolejnym tygodniem kryzysu."
 TR2_RW_bronisze:0 "Zapasy z Bronisz i okolic"
 TR2_RW_bronisze_desc:0 "Dystrybucja żywności zostanie podporządkowana wspólnemu harmonogramowi dla osiedli i placówek publicznych."
 TR2_RW_wisla:0 "Obrona przepraw przez Wisłę"
 TR2_RW_wisla_desc:0 "Ochotnicy obejmą patrole mostów, aby utrzymać połączenie lewego i prawego brzegu Wisły."
 TR2_RW_kompromis:0 "Porozumienie dzielnic"
 TR2_RW_kompromis_desc:0 "Mieszkańcy zaakceptowali kompromis między zaopatrzeniem cywilnym a ochroną głównych tras."
 tr2rw.13.t:0 "Kolejki przy stacjach benzynowych"
 tr2rw.13.d:0 "Brakuje paliwa dla komunikacji miejskiej i karetek. Mieszkańcy żądają uruchomienia rezerw, a skarbnik ostrzega przed opróżnieniem miejskiej kasy."
 tr2rw.13.a:0 "Uwolnić rezerwy dla usług publicznych."
 tr2rw.13.b:0 "Wprowadzić oszczędności i racjonowanie."
