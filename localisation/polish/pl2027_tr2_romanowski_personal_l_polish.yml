l_polish:
 tr2romx.1.t:0 "Pierwszy dzień po triumfie"
 tr2romx.1.d:0 "W ratuszu czekają raporty, niewysłuchane skargi i rachunki za ogrzewanie. Młody prezydent patrzy na mapę miasta. Nie chodzi już o wygrane wybory, lecz o to, by każdy autobus rano wyjechał z zajezdni."
 tr2romx.1.a:0 "Zacznijmy od mieszkańców."
 tr2romx.1.b:0 "Najpierw porządkujemy urząd."
 tr2romx.2.t:0 "Co mieszkańcy mówią na Rubinkowie?"
 tr2romx.2.d:0 "Na osiedlu dyskusja szybko schodzi z polityki na ceny, spóźnione autobusy i remonty. Ktoś pyta, czy prezydent będzie się tutaj jeszcze pojawiał po wyborach."
 tr2romx.2.a:0 "Zobowiązać radnych do dyżurów na osiedlu."
 tr2romx.2.b:0 "Od razu skierować środki na remonty."
 tr2romx.3.t:0 "Nie starcza na wszystko"
 tr2romx.3.d:0 "Skarbnik pokazuje obliczenia: jednoczesne utrzymanie cen transportu, remontowanie mieszkań i finansowanie produkcji oznacza niedobór środków. Rozwiązanie musi zostać podjęte publicznie."
 tr2romx.3.a:0 "Stopniujemy wydatki."
 tr2romx.3.b:0 "Zaciśnijmy zęby, nie rezygnujemy."
 tr2romx.4.t:0 "Pierwsza audycja Radia Nowy Toruń"
 tr2romx.4.d:0 "W eterze słychać stary toruński rock, a po nim głosy mieszkańców. Redaktor pyta, czy stacja stanie się wolnym radiem, czy kolejnym głośnikiem magistratu."
 tr2romx.4.a:0 "Radio należy do słuchaczy."
 tr2romx.4.b:0 "Komunikaty kryzysowe mają pierwszeństwo."
 tr2romx.5.t:0 "Mosty nie znoszą granic"
 tr2romx.5.d:0 "Sąsiednie państewka chcą opłat za transport. Dowódcy sugerują zdecydowane kroki, a przedsiębiorcy ostrzegają przed blokadą. Na stole leżą dwie wersje porozumienia."
 tr2romx.5.a:0 "Wybierzmy trudne negocjacje."
 tr2romx.5.b:0 "Domagajmy się gwarancji tranzytu."
 tr2romx.6.t:0 "Kiedy idee spotykają rachunki"
 tr2romx.6.d:0 "Prezydent przegląda pierwotne obietnice. Na każdej kartce zapisano czyjeś oczekiwania. Teraz pozostaje decyzja, czy iść dalej wolniej, czy wymusić tempo wielkich reform."
 tr2romx.6.a:0 "Nie zdradzimy programu, ale musimy liczyć."
 tr2romx.6.b:0 "Czasem trzeba zaryzykować."
 tr2romx.7.t:0 "Reformatorzy zarzucają zdradę"
 tr2romx.7.d:0 "Ruch społeczny przypomina hasła z kampanii, lecz część obietnic wymaga odłożenia. Na wiecu pada pytanie, czy pragmatyzm nie zamienił się w rezygnację."
 tr2romx.7.a:0 "Ujawnijmy harmonogram reform."
 tr2romx.7.b:0 "Niech budżet przemówi za nas."
 tr2romx.8.t:0 "Zbyt wiele na jeden rok"
 tr2romx.8.d:0 "Tempo reform zachwyca część mieszkańców, ale urzędnicy ostrzegają przed przeciążeniem służb. Zarówno zwolennicy, jak i przeciwnicy czekają na rezultat."
 tr2romx.8.a:0 "Dodać konsultacje i kontrolę."
 tr2romx.8.b:0 "Zacząć inwestycje bez zwłoki."
 tr2romx.9.t:0 "Przedstawiciele metropolii"
 tr2romx.9.d:0 "Z Chełmży i okolic napływają sygnały zainteresowania dobrowolną współpracą. Każda gmina obawia się jednak dominacji Torunia. Związek metropolitalny będzie wymagał cierpliwości."
 tr2romx.9.a:0 "Każda gmina ma własny głos."
 tr2romx.9.b:0 "Budujmy najpierw wspólne usługi."
 tr2romx.10.t:0 "Toruń, w którym można zostać"
 tr2romx.10.d:0 "W kolejnej odsłonie państwowego kryzysu miasto nie jest wielką potęgą. Ktoś wraca z nocnej zmiany, na przystanku czeka autobus, a w radiu gra znajomy utwór. To wystarczy, żeby wiedzieć, dlaczego było warto."
 tr2romx.10.a:0 "Niech to miasto będzie domem."
 TR2_RMX_miasto_ktore_znam:0 "Miasto, które znam"
 TR2_RMX_miasto_ktore_znam_desc:0 "Nie znamy Torunia tylko z sal obrad. Znamy przystanki Rubinkowa, ruch na Skarpie i ulice Podgórza. Z tego doświadczenia wyrośnie program odbudowy."
 TR2_RMX_chlopak_z_rubinkowa:0 "Chłopak z Rubinkowa"
 TR2_RMX_chlopak_z_rubinkowa_desc:0 "Przywódca, który wychował się wśród zwyczajnych mieszkańców, nie może udawać, że rządzi zza szyby. Pierwsza rozmowa odbędzie się na osiedlu."
 TR2_RMX_odpowiedzialnosc:0 "Miasto nie wybacza pustych obietnic"
 TR2_RMX_odpowiedzialnosc_desc:0 "Ratusz odkrywa, że hasła z kampanii trzeba zamienić w harmonogram prac, a każda obietnica ma swój koszt. Zaczyna się prawdziwe sprawowanie władzy."
 TR2_RMX_audyt_dzielnic:0 "Mapa nierówności"
 TR2_RMX_audyt_dzielnic_desc:0 "Od centrum po Rubinkowo przygotowujemy mapę przerwanych usług, bezrobocia, potrzeb remontowych i dostępu do lekarzy."
 TR2_RMX_rubinkowo:0 "Rubinkowo nie jest peryferią"
 TR2_RMX_rubinkowo_desc:0 "Największe osiedla nie będą na końcu kolejki. Powstanie fundusz napraw dla bloków, przychodni, szkół i lokalnych usług."
 TR2_RMX_skarpa:0 "Skarpa ma głos"
 TR2_RMX_skarpa_desc:0 "Dzielnica musi mieć własną reprezentację, przejrzysty budżet i ciągłe połączenie komunikacyjne z resztą miasta."
 TR2_RMX_podgorz:0 "Dwa brzegi, jeden Toruń"
 TR2_RMX_podgorz_desc:0 "Podgórz nie może zostać zapomniany przez prawobrzeżny magistrat. Mosty i usługi mają łączyć oba brzegi Wisły."
 TR2_RMX_mieszkania:0 "Mieszkanie jest podstawą"
 TR2_RMX_mieszkania_desc:0 "Remontujemy pustostany i odbudowujemy sektor mieszkań komunalnych, ale inwestycje mają pierwszeństwo przed propagandą."
 TR2_RMX_rady_pracownikow:0 "Rady pracowników, nie komisarze"
 TR2_RMX_rady_pracownikow_desc:0 "Pracownicy Apatora, miejskich usług i transportu otrzymują reprezentację w decyzjach gospodarczych. Demokracja kończy się dopiero tam, gdzie kończy się praca."
 TR2_RMX_dzielnice_sa_panstwem:0 "Republika zaczyna się na osiedlu"
 TR2_RMX_dzielnice_sa_panstwem_desc:0 "Samorządy dzielnicowe otrzymują stałe prawo konsultowania budżetu i rozstrzygania o najpilniejszych usługach."
 TR2_RMX_nie_tylko_hasla:0 "Nie tylko hasła"
 TR2_RMX_nie_tylko_hasla_desc:0 "Ambitne programy wymagają zapasów, energii i działających przedsiębiorstw. Miasto nie może żyć wyłącznie polityką."
 TR2_RMX_apator:0 "Apator i nowa praca"
 TR2_RMX_apator_desc:0 "Zakłady i warsztaty miejskie otrzymują kontrakty na wyposażenie energetyczne oraz naprawę infrastruktury krytycznej."
 TR2_RMX_maly_biznes:0 "Małe firmy, zwykli ludzie"
 TR2_RMX_maly_biznes_desc:0 "Lokalne warsztaty, punkty usługowe i małe firmy utrzymają miasto przy życiu. Władza nie może traktować przedsiębiorców jak przeciwników."
 TR2_RMX_spoldzielnie:0 "Spółdzielnie z prawdziwego zdarzenia"
 TR2_RMX_spoldzielnie_desc:0 "Zakładamy spółdzielnie remontowe i usługowe, których celem jest praca i dostępność, a nie partyjny monopol."
 TR2_RMX_rachunki:0 "Gdzie podziały się pieniądze?"
 TR2_RMX_rachunki_desc:0 "Rosnące wydatki na mieszkania i usługi ujawniają dziurę w budżecie. Obywatele domagają się prawdy o kosztach programu."
 TR2_RMX_uczciwy_kontrakt:0 "Umowa z lokalną gospodarką"
 TR2_RMX_uczciwy_kontrakt_desc:0 "Samorząd, przedsiębiorcy i pracownicy podpisują wspólny plan inwestycji, zatrudnienia i ochrony najważniejszych usług."
 TR2_RMX_gospodarka_z_ludzka_twarza:0 "Gospodarka z ludzką twarzą"
 TR2_RMX_gospodarka_z_ludzka_twarza_desc:0 "Nie rewolucja gospodarcza, lecz stopniowe podnoszenie standardów pracy, usług publicznych i lokalnej produkcji."
 TR2_RMX_kultura:0 "Miasto też musi żyć"
 TR2_RMX_kultura_desc:0 "Poza odbudową ulic mieszkańcy potrzebują muzyki, spotkań, bibliotek i miejsc, w których mogą poczuć normalność."
 TR2_RMX_radio_nowy_torun:0 "Radio Nowy Toruń"
 TR2_RMX_radio_nowy_torun_desc:0 "Radio ma transmitować nie tylko komunikaty urzędowe. Mieszkańcy usłyszą lokalnych twórców, informacje i głosy własnych dzielnic."
 TR2_RMX_odnova:0 "Nocna OdNOVA"
 TR2_RMX_odnova_desc:0 "Pop, elektronika i alternatywna muzyka tworzą przestrzeń normalnego życia. Radio przypomina, że wojna nie odebrała ludziom przyszłości."
 TR2_RMX_republika_nie_milczy:0 "Republika nie milczy"
 TR2_RMX_republika_nie_milczy_desc:0 "Toruńska tradycja muzyczna staje się symbolem obywatelskiego oporu wobec zastraszania i kultu jednostki."
 TR2_RMX_nocny_torun:0 "Autobus po ostatnim koncercie"
 TR2_RMX_nocny_torun_desc:0 "Żywe miasto wymaga bezpiecznej komunikacji po zmroku. Nawet w kryzysie kultura nie może być przywilejem centrum."
 TR2_RMX_mlodzi_zostaja:0 "Młodzi nie muszą wyjeżdżać"
 TR2_RMX_mlodzi_zostaja_desc:0 "Staże, warsztaty i programy kształcenia pomogą mieszkańcom znaleźć pracę bez opuszczania rodzinnego miasta."
 TR2_RMX_torun_zyje:0 "Toruń jeszcze żyje"
 TR2_RMX_torun_zyje_desc:0 "W mieście znów słychać tramwaje, koncerty i rozmowy mieszkańców. Nie oznacza to końca kryzysu, ale koniec bezradności."
 TR2_RMX_dyplomacja:0 "Sąsiedzi to nie wrogowie"
 TR2_RMX_dyplomacja_desc:0 "Rozpad Polski nie musi oznaczać wojny każdego z każdym. Toruń potrzebuje komunikacji z sąsiadami i wiarygodnych porozumień."
 TR2_RMX_bydgoszcz:0 "Nie jesteśmy wrogami Bydgoszczy"
 TR2_RMX_bydgoszcz_desc:0 "Stare lokalne spory bledną wobec kryzysu. Proponujemy rozmowy o handlu, przeprawach i wspólnych usługach."
 TR2_RMX_spor_o_wisle:0 "Kto kontroluje Wisłę?"
 TR2_RMX_spor_o_wisle_desc:0 "Spór o tranzyt zaostrza relacje z innymi republikami. Pytanie brzmi, czy postawić na ustępstwa, czy na twarde gwarancje."
 TR2_RMX_tranzyt:0 "Korytarz kujawski"
 TR2_RMX_tranzyt_desc:0 "Ochrona tranzytu i dostaw z sąsiednich miast zmniejszy ryzyko przerw w zaopatrzeniu."
 TR2_RMX_sasiedzi:0 "Sieć współpracy społecznej"
 TR2_RMX_sasiedzi_desc:0 "Rady gmin i organizacje obywatelskie tworzą stały kanał komunikacji niezależny od politycznych napięć."
 TR2_RMX_kongres_wisly:0 "Kongres miast nad Wisłą"
 TR2_RMX_kongres_wisly_desc:0 "Przedstawiciele sąsiadów rozmawiają o zasadach handlu, pomocy medycznej i wspólnego bezpieczeństwa."
 TR2_RMX_mosty_nie_mury:0 "Mosty, nie mury"
 TR2_RMX_mosty_nie_mury_desc:0 "Toruń wybiera wytrwałe negocjacje i wspólne usługi zamiast narzucania sąsiadom własnego modelu ustrojowego."
 TR2_RMX_miasto_nie_spi:0 "Miasto nie śpi"
 TR2_RMX_miasto_nie_spi_desc:0 "Gdy ratusz pustoszeje, tramwaje nadal kursują, a radio gra. O zwycięstwie zdecyduje to, czy ludzie zachowają codzienność."
 TR2_RMX_rachunek_sumienia:0 "Cena słusznych idei"
 TR2_RMX_rachunek_sumienia_desc:0 "Program działa tylko wtedy, gdy wytrzymują go budżet, transport i zwyczajni ludzie. Prezydent musi wybrać między tempem zmian a ich skalą."
 TR2_RMX_pragmatyzm:0 "Reformy, które przetrwają"
 TR2_RMX_pragmatyzm_desc:0 "Wprowadzimy mniej programów naraz, ale zapewnimy im finansowanie i kontrolę. Niepopularny kompromis ma ochronić zdobycze społeczne."
 TR2_RMX_idealizm:0 "Nie czas na półśrodki"
 TR2_RMX_idealizm_desc:0 "Kryzys nie może usprawiedliwiać utrzymywania nierówności. Przyspieszymy inwestycje społeczne nawet za cenę konfliktu o budżet."
 TR2_RMX_budzet_spoleczny:0 "Zrównoważony budżet społeczny"
 TR2_RMX_budzet_spoleczny_desc:0 "Zabezpieczymy kluczowe usługi bez mnożenia niepotrzebnych wydatków i długów."
 TR2_RMX_karta_spoleczna:0 "Karta Praw Mieszkańca"
 TR2_RMX_karta_spoleczna_desc:0 "Nowa karta gwarantuje minimalne standardy mieszkań, pracy i transportu. Państwo bierze odpowiedzialność za realizację obietnic."
 TR2_RMX_kontrola_wydatkow:0 "Otwarte księgi miasta"
 TR2_RMX_kontrola_wydatkow_desc:0 "Mieszkańcy mogą sprawdzić miejskie umowy, wykonanie budżetu i termin każdej inwestycji."
 TR2_RMX_rady_mieszkancow:0 "Rady, które mogą powiedzieć nie"
 TR2_RMX_rady_mieszkancow_desc:0 "Każda dzielnica może zakwestionować inwestycję sprzeczną z lokalnymi potrzebami. Demokracja ma realny koszt, ale też realne znaczenie."
 TR2_RMX_druga_republika:0 "Nowa umowa toruńska"
 TR2_RMX_druga_republika_desc:0 "Ustrój jest demokratyczny, świecki i oparty na prawach społecznych. Teraz trzeba zdecydować, jak szeroko rozciągać współpracę."
 TR2_RMX_zwiazek_metropolitalny:0 "Związek Metropolitalny Torunia"
 TR2_RMX_zwiazek_metropolitalny_desc:0 "Miasto proponuje dobrowolny związek gmin, ze wspólnymi usługami, ale bez odebrania samorządom prawa głosu."
 TR2_RMX_niezalezny_torun:0 "Najpierw własne miasto"
 TR2_RMX_niezalezny_torun_desc:0 "Nie obiecujemy, że uzdrowimy cały region. Najpierw uczynimy z Torunia wiarygodne i stabilne miejsce do życia."
 TR2_RMX_normalnosc:0 "Zwycięstwo normalności"
 TR2_RMX_normalnosc_desc:0 "W całej Polsce wciąż trwa kryzys. W Toruniu zwycięstwo oznacza mniej spektakularną rzecz: ludzie znów mają gdzie mieszkać, pracować i spotykać się."
 TR2_RMX_panel:0 "Nowy Toruń: zaufanie i zasoby"
 TR2_RMX_panel_desc:0 "Każda reforma wymaga zaufania mieszkańców i środków na wykonanie. Obie wartości są ograniczone do 100 punktów."
 TR2_RMX_d_dyzury:0 "Stałe dyżury na osiedlach"
 TR2_RMX_d_dyzury_desc:0 "Radni spotykają się z mieszkańcami i odpowiadają za harmonogram remontów."
 TR2_RMX_d_spoldzielnie:0 "Kontrakty dla spółdzielni"
 TR2_RMX_d_spoldzielnie_desc:0 "Miejskie zamówienia trafiają do lokalnych zespołów usługowych."
 TR2_RMX_d_radio:0 "Otwarte mikrofony Radia Nowy Toruń"
 TR2_RMX_d_radio_desc:0 "Własna audycja mieszkańców daje lokalnym społecznościom dostęp do mediów."
 TR2_RMX_d_tranzyt:0 "Konsultacje w sprawie tranzytu"
 TR2_RMX_d_tranzyt_desc:0 "Przedstawiciele firm i gmin ustalają nowe zasady ruchu towarów."
 TR2_RMX_d_prawda:0 "Otwarty rejestr miejskich wydatków"
 TR2_RMX_d_prawda_desc:0 "Publikacja wydatków zwiększa przejrzystość, ale oznacza polityczne koszty."
 TR2_RMX_d_ratunek:0 "Awaryjny program oszczędności"
 TR2_RMX_d_ratunek_desc:0 "Tymczasowe cięcia chronią podstawowe usługi, lecz wywołują niezadowolenie."
