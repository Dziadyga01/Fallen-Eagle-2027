 TRK_opor_aparatu:0 "Opór aparatu"
 TRK_opor_aparatu_desc:0 "Wydziały pracują po staremu, a każda zmiana grzęźnie w komisjach. Opór słabnie, gdy reforma administracji przekroczy 50 (teraz §Y[?TRK_reforma|0]§!)."
 TRK_sprawne_urzedy:0 "Sprawne urzędy"
 TRK_sprawne_urzedy_desc:0 "Połowa wydziałów działa według nowych zasad. Reforma: §Y[?TRK_reforma|0]§!/100."
 TRK_panstwo_dziala:0 "Państwo, które działa"
 TRK_panstwo_dziala_desc:0 "Reforma zakończona. Urzędy są szybkie, przejrzyste i przewidywalne – największy kapitał Torunia."
 TRK_gulewski:0 "Reforma administracji"
 TRK_gulewski_desc:0 "Gulewski chce państwa, które działa: jawnych procedur, sprawnych urzędów i ludzi na właściwych miejscach. Każdy krok budzi opór – urzędników, radnych, związków albo przedsiębiorców.\nPostęp reformy: §Y[?TRK_reforma|0]§!/100. Poniżej 50 działa „Opór aparatu”, od 50 „Sprawne urzędy”, przy 100 „Państwo, które działa”."
 TRK_g_audyt:0 "Audyt wydziału"
 TRK_g_audyt_desc:0 "Kontrolerzy sprawdzają jeden wydział od podstaw. Postęp reformy rośnie, ale urzędnicy czują się zagrożeni (stabilność −2%)."
 TRK_g_radni:0 "Porozumienie z radnymi"
 TRK_g_radni_desc:0 "Kluby radnych dostają wpływ na harmonogram reformy. Reforma idzie wolniej, ale bez wojny na sesjach."
 TRK_g_prezesi:0 "Nowi prezesi spółek miejskich"
 TRK_g_prezesi_desc:0 "Konkursy zamiast nominacji z klucza partyjnego. Duży krok reformy – i pewny protest związków zawodowych."
 TRK_g_cyfrowe:0 "Cyfrowe urzędy"
 TRK_g_cyfrowe_desc:0 "Sprawy online i elektroniczny obieg dokumentów. Wymaga sprzętu i informatyków z UMK."
 trk.40.t:0 "Urzędnicy boją się o etaty"
 trk.40.d:0 "Związek pracowników Ratusza zbiera podpisy przeciw reformie. Mówią, że audyty to „czystki w białych rękawiczkach”."
 trk.40.a:0 "Gwarancja etatów do końca roku – reforma zwalnia."
 trk.40.b:0 "Reforma idzie dalej."
 trk.41.t:0 "Związki protestują przeciw konkursom"
 trk.41.d:0 "Związkowcy z MZK i wodociągów zapowiadają strajk ostrzegawczy. Nowi prezesi mają „rozmontować spółki”."
 trk.41.a:0 "Związki dostają miejsce w komisjach konkursowych."
 trk.41.b:0 "Strajk ostrzegawczy przetrwamy."
 trk.42.t:0 "Radni blokują budżet reformy"
 trk.42.d:0 "Opozycja w Radzie łączy się z częścią koalicji i blokuje pieniądze na reformę. „Najpierw wyniki, potem budżet”."
 trk.42.a:0 "Kompromis – mniejszy budżet."
 trk.42.b:0 "Prezydent przedstawi wyniki na sesji."
 trk.43.t:0 "Przedsiębiorcy chcą szybszych pozwoleń"
 trk.43.d:0 "Izba gospodarcza proponuje, że opłaci informatyków do e-urzędu – jeśli pozwolenia budowlane będą wydawane w dwa tygodnie."
 trk.43.a:0 "Przyjąć ofertę."
 trk.43.b:0 "Urząd nie przyjmuje prezentów."
 trk.44.t:0 "Reforma administracji zakończona"
 trk.44.d:0 "Ostatni wydział przechodzi na nowe procedury. Toruń ma urzędy, które działają – i rzecz, której zazdroszczą mu sąsiedzi."
 trk.44.a:0 "Państwo, które działa."
