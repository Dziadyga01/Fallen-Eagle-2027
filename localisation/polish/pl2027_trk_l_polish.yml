 TRK_dlugi_miasta:0 "Długi miasta"
 TRK_dlugi_miasta_desc:0 "Wykonawcy czekają na pieniądze, a odsetki zjadają budżet. Efekt znika, gdy zobowiązania spadną poniżej 50 (teraz §Y[?TRK_zob|0]§!)."
 TRK_zaleski:0 "Plan Gospodarza – inwestycje"
 TRK_zaleski_desc:0 "Zaleski buduje szybko, bo buduje na kredyt wykonawców. Inwestycje dają drogi, hale i mosty od ręki – ale każda podnosi zobowiązania. Powyżej 50 działa „Długi miasta”, powyżej 80 wybucha spór o podział środków między dzielnicami.\nZobowiązania: §Y[?TRK_zob|0]§!/100."
 TRK_z_droga:0 "Kontrakt drogowy"
 TRK_z_droga_desc:0 "Firma z Grębocina remontuje drogę wylotową. Infrastruktura od razu, zapłata – kiedyś."
 TRK_z_hala:0 "Hala przy Szosie Lubickiej"
 TRK_z_hala_desc:0 "Nowa hala produkcyjna na terenach miejskich. Fabryka od ręki, rachunek – na trzy lata. Najwyżej trzy hale."
 TRK_z_splata:0 "Spłata wykonawców"
 TRK_z_splata_desc:0 "Miasto oddaje zaległe pieniądze. Kosztowne, ale firmy znów chcą z nami pracować."
 TRK_z_renegocjacja:0 "Renegocjacja kontraktów"
 TRK_z_renegocjacja_desc:0 "Ratusz zmusza wykonawców do obniżki. Tańsze dla budżetu, ale firmy idą do sądu, a mieszkańcy czekają dłużej (stabilność −3%)."
 trk.50.t:0 "Wykonawcy w sądzie"
 trk.50.d:0 "Trzy firmy pozywają miasto po renegocjacji kontraktów. Sąd okręgowy działa wolno, ale gazety piszą szybko."
 trk.50.a:0 "Ugoda – część pieniędzy wraca do firm."
 trk.50.b:0 "Walczyć w sądzie do końca."
 trk.51.t:0 "Spór o podział środków"
 trk.51.d:0 "Rubinkowo pyta, dlaczego nowa hala powstała przy Szosie Lubickiej, a nie nowa przychodnia. Starówka pyta o remonty kamienic, a Podgórz – o most. Długi miasta są tak duże, że na wszystko nie starczy."
 trk.51.a:0 "Wstrzymać nowe inwestycje i spłacać długi."
 trk.51.b:0 "Pieniądze dla osiedli – przemysł poczeka."
 trk.51.c:0 "Budujemy dalej. Długi spłaci wzrost."
 TRK_inwestycje_stop:0 "Wstrzymane inwestycje"
 TRK_inwestycje_stop_desc:0 "Ratusz wstrzymał nowe przetargi, żeby dokończyć osiedlowe remonty."
