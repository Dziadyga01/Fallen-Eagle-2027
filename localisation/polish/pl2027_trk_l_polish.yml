 TRK_rozproszenie:0 "Rozproszona koordynacja"
 TRK_rozproszenie_desc:0 "Dzielnice decydują same, a Rada Delegatów musi przekonywać, nie rozkazywać. Ludzie są zadowoleni, sztab – mniej. Kary dla wojska znikają, gdy koordynacja przekroczy 60 (teraz §Y[?TRK_koord|0]§!)."
 TRK_federacja_dziala:0 "Federacja w działaniu"
 TRK_federacja_dziala_desc:0 "Dzielnice nadal decydują same, ale umieją działać razem – także na froncie."
 TRK_krevienko:0 "Federacja wolnych dzielnic"
 TRK_krevienko_desc:0 "Zamiast Ratusza – zgromadzenia i delegaci. Wspólnoty lokalne dają spokój i ochotników, ale wspólne decyzje, logistyka i dowodzenie idą wolniej.\nKoordynacja: §Y[?TRK_koord|0]§!/100 (poniżej 60 „Rozproszona koordynacja”, od 60 „Federacja w działaniu”). Przyjmowanie dzielnic do federacji obniża koordynację."
 TRK_k_zgromadzenie:0 "Zgromadzenie ogólne"
 TRK_k_zgromadzenie_desc:0 "Delegaci wszystkich dzielnic na jednej sali w Dworze Artusa. Długie obrady, wspólna decyzja."
 TRK_k_delegaci:0 "Delegaci wojskowi dzielnic"
 TRK_k_delegaci_desc:0 "Milicje wybierają wspólny sztab z prawem wydawania rozkazów na czas walk. Skuteczniej – i mniej wolności (stabilność −3%)."
 TRK_k_rubinkowo:0 "Wolna dzielnica: Rubinkowo"
 TRK_k_rubinkowo_desc:0 "Komuna Rubinkowa przejmuje kuchnie, pralnie i ciepłownię osiedla. Dzielnica dostaje pełną samodzielność – koordynacja federacji spada o 5."
 TRK_k_skarpa:0 "Wolna dzielnica: Skarpa"
 TRK_k_skarpa_desc:0 "Skarpa tworzy własną milicję i warsztaty naprawcze. Dzielnica dostaje pełną samodzielność – koordynacja federacji spada o 5."
 TRK_k_jar:0 "Wolna dzielnica: Jar"
 TRK_k_jar_desc:0 "Jar zakłada spółdzielnię budowlaną, która stawia domy dla uchodźców. Dzielnica dostaje pełną samodzielność – koordynacja federacji spada o 5."
 TRK_k_bielany:0 "Wolna dzielnica: Bielany"
 TRK_k_bielany_desc:0 "Bielany i kampus organizują szkoły, laboratoria i radio. Dzielnica dostaje pełną samodzielność – koordynacja federacji spada o 5."
 TRK_k_mokre:0 "Wolna dzielnica: Mokre"
 TRK_k_mokre_desc:0 "Mokre i Chełmińskie Przedmieście tworzą sieć wymiany z rolnikami z gmin. Dzielnica dostaje pełną samodzielność – koordynacja federacji spada o 5."
 trk.70.t:0 "Zgromadzenie bez decyzji"
 trk.70.d:0 "Trzecie zgromadzenie z rzędu kończy się bez uchwały. Delegaci Skarpy nie zgadzają się z Rubinkowem, a dowódcy milicji czekają na rozkazy."
 trk.70.a:0 "Dać zgromadzeniu jeszcze tydzień."
 trk.70.b:0 "Rada Delegatów decyduje sama."
 TRK_region:0 "Przeprawy, kolej i dostawy"
 TRK_region_desc:0 "Toruń żyje z przepraw przez Wisłę, z kolei i z dostaw z sąsiednich państw. Każdy spór przechodzi przez żądanie, odpowiedź drugiej strony i eskalację. Wojnę można zacząć tylko fokusem w drzewku – i dopiero po ostrzeżeniu.\nNapięcie z Bydgoszczą: §Y[?global.MET_napiecie|0]§!/100."
 TRK_oplaty_przeprawa:0 "Opłaty za przeprawę w Solcu"
 TRK_oplaty_przeprawa_desc:0 "Konwoje z Torunia płacą za przejazd przez przeprawę kontrolowaną przez sojuszników Bydgoszczy."
 TRK_wspolna_przeprawa:0 "Wspólny zarząd przeprawy"
 TRK_wspolna_przeprawa_desc:0 "Przeprawą w Solcu zarządza wspólna komisja obu miast. Nikt nie jest zadowolony – ale ciężarówki jeżdżą."
 TRK_blokada:0 "Blokada transportu"
 TRK_blokada_desc:0 "Ciężarówki stoją na rogatkach. Handel między miastami zamarł."
 TRK_umowa_pkp:0 "Węgiel i towary koleją"
 TRK_umowa_pkp_desc:0 "Pociągi PKP dowożą do Torunia węgiel i towary według stałego rozkładu."
 TRK_dostawy_tpz:0 "Dostawy T-Pizzy"
 TRK_dostawy_tpz_desc:0 "Ciężarówki z Włocławka przywożą mąkę, olej i mrożonki. Pizza na Rynku Staromiejskim smakuje jak normalność – i kosztuje coraz więcej."
 TRK_p_zadanie:0 "Żądanie: wspólny zarząd przeprawy w Solcu"
 TRK_p_zadanie_desc:0 "Toruń żąda od Bydgoszczy wspólnego zarządu przeprawy przez Wisłę i zniesienia opłat dla naszych konwojów. Bydgoszcz może się zgodzić, zaproponować arbitraż PKP albo odmówić."
 trk.80.t:0 "Opłaty na przeprawie w Solcu"
 trk.80.d:0 "Burmistrz Solca, za plecami którego stoi Bydgoszcz, wprowadza opłaty dla ciężarówek z Torunia. Kierowcy stoją po dwie godziny przy szlabanie, a hurtownie podnoszą ceny."
 trk.80.a:0 "Płacić – handel jest ważniejszy niż duma."
 trk.80.b:0 "Żądać wspólnego zarządu przeprawy."
 trk.80.c:0 "Blokada: żadnych bydgoskich ciężarówek w Toruniu."
 trk.81.t:0 "Toruń żąda wspólnego zarządu przeprawy"
 trk.81.d:0 "[From.GetName] żąda wspólnego zarządu przeprawą w Solcu i zniesienia opłat dla swoich konwojów. Radni dzielą się na tych, którzy chcą spokoju, i tych, którzy chcą pokazać, kto rządzi regionem."
 trk.81.a:0 "Zgoda – wspólna komisja przeprawy."
 trk.81.b:0 "Niech rozstrzygnie arbitraż PKP."
 trk.81.c:0 "Odmowa. Przeprawa zostaje po naszej stronie."
 TRK_tt_5:0 "§RPrzeprawa w Solcu staje się celem wojskowym.§! Wojnę można rozpocząć tylko fokusem w drzewku (np. „Operacja Solec”) – druga strona dostanie ostrzeżenie."
 trk.82.t:0 "Spór o przeprawę eskaluje"
 trk.82.d:0 "Rozmowy w sprawie przeprawy w Solcu utknęły. Na rogatkach stoją patrole obu stron, a kierowcy pytają, czy jutro w ogóle przejadą. Każda dalsza eskalacja może skończyć się wojną – ale wciąż można się dogadać, choć już drożej."
 trk.82.a:0 "Ustąpić: wspólny zarząd i zwrot opłat (−60 PP)."
 trk.82.b:0 "Arbitraż PKP – każda strona coś odda."
 trk.82.c:0 "Nie ustąpimy. Niech decydują fakty."
 trk.83.t:0 "Porozumienie w sprawie przeprawy"
 trk.83.d:0 "Komisja przeprawy zbiera się po raz pierwszy w baraku przy szlabanie w Solcu. Ciężarówki znów jeżdżą – a obie strony twierdzą, że wygrały."
 trk.83.a:0 "Koniec sporu."
 trk.84.t:0 "Arbitraż w sprawie przeprawy"
 trk.84.d:0 "Toruń i Bydgoszcz proszą Zarząd Holdingu PKP o rozstrzygnięcie sporu o przeprawę w Solcu. Holding może zarobić na obu stronach – albo nie mieszać się w politykę."
 trk.84.a:0 "Arbitraż: wspólny zarząd, opłata torowa dla PKP."
 trk.84.b:0 "PKP nie miesza się w spory miast."
 trk.95.t:0 "Ostrzeżenie z Torunia"
 trk.95.d:0 "[From.GetName] ogłasza, że ma cel wojenny wobec naszego państwa. Kolumny wojska stoją przy granicy. Możemy mobilizować obronę – albo szukać porozumienia na warunkach Torunia."
 trk.95.a:0 "Mobilizujemy obronę."
 trk.95.b:0 "Przyjąć opiekę Torunia (zostajemy państwem zależnym)."
 TRK_obrona_alarm:0 "Alarm obronny"
 TRK_obrona_alarm_desc:0 "Ochotnicy kopią okopy, a magazyny wydają broń."
 TRK_pkp_umowa:0 "Umowa przewozowa z PKP"
 TRK_pkp_umowa_desc:0 "Holding PKP może dowozić węgiel i towary do stacji Toruń Wschodni według stałego rozkładu. Za opłatą torową – i z prawem pierwszeństwa dla swoich składów."
 trk.85.t:0 "Toruń chce umowy przewozowej"
 trk.85.d:0 "[From.GetName] prosi Holding o stałe dostawy węgla i towarów koleją. Zarząd liczy, ile da się zarobić – i ile wpływów zyskać nad Wisłą."
 trk.85.a:0 "Umowa: opłata torowa i rozkład dla Torunia."
 trk.85.b:0 "Umowa na wyłączność – Toruń nie podpisuje nic z bydgoskim węzłem."
 trk.85.c:0 "Holding nie ma wolnych składów."
 TRK_tpz_kontrakt:0 "Kontrakt na dostawy z T-Pizzą"
 TRK_tpz_kontrakt_desc:0 "Korporacja z Włocławka ma ciężarówki, chłodnie i mąkę. Dostawy poprawią zaopatrzenie miasta, ale T-Pizza zyska wpływy w Toruniu, a dług wobec niej rośnie o 20. Przy długu 50 korporacja może postawić ultimatum „30 minut albo wojna!”."
 trk.87.t:0 "Zamówienie z Torunia"
 trk.87.d:0 "[From.GetName] zamawia stałe dostawy żywności. Dział sprzedaży T-Pizzy już liczy marżę."
 trk.87.a:0 "Dostarczamy – z odroczonym terminem płatności."
 trk.87.b:0 "Tylko za gotówkę."
 TRK_tpz_splata:0 "Spłata długu wobec T-Pizzy"
 TRK_tpz_splata_desc:0 "Zamiast czekać na ultimatum, Ratusz spłaca część długu (dług −30) i kupuje sobie spokój."
