 TRK_kolejki_mieszkania:0 "Kolejka po mieszkania"
 TRK_kolejki_mieszkania_desc:0 "Tysiące rodzin z gmin i Warszawy czekają na mieszkanie. Efekt znika, gdy program mieszkaniowy przekroczy 60 (teraz §Y[?TRK_mieszk|0]§!)."
 TRK_dom_dla_kazdego:0 "Dach nad głową"
 TRK_dom_dla_kazdego_desc:0 "Kolejki po mieszkania skróciły się do kilku tygodni. Ludzie zostają w Toruniu."
 TRK_romanowski:0 "Miasto dla mieszkańców"
 TRK_romanowski_desc:0 "Romanowski stawia na usługi publiczne: mieszkania komunalne, tani transport i prawa pracownicze. Każdy krok kosztuje budżet i czas – a „Układ zbiorowy” oznacza, że decyzje o pracownikach miejskich wymagają zgody związków.\nProgram mieszkaniowy: §Y[?TRK_mieszk|0]§!/100 (od 60 „Dach nad głową”)."
 TRK_r_jar:0 "Mieszkania komunalne na Jarze"
 TRK_r_jar_desc:0 "Nowe bloki na Jarze z czynszem dla zwykłych pensji. Budowa idzie, ale materiały i ludzie nie trafiają do przemysłu."
 TRK_budowa_mieszkan:0 "Budowa mieszkań"
 TRK_budowa_mieszkan_desc:0 "Ekipy budowlane pracują na osiedlach, nie w halach."
 TRK_r_remonty:0 "Spółdzielnia remontowa Rubinkowa"
 TRK_r_remonty_desc:0 "Lokatorzy sami remontują bloki – miasto daje materiały i fachowców."
 TRK_r_bilet:0 "Bilet miejski za złotówkę"
 TRK_r_bilet_desc:0 "Komunikacja niemal za darmo: mniej samochodów, więcej ludzi w tramwajach. Budżet MZK potrzebuje dopłaty (siła polityczna −5% na 180 dni)."
 TRK_bilet:0 "Bilet za złotówkę"
 TRK_bilet_desc:0 "Tramwaje są pełne, ulice spokojniejsze, a MZK żyje z dopłat."
 TRK_r_szpitale:0 "Wspólna kasa szpitali z gminami"
 TRK_r_szpitale_desc:0 "Szpitale w Toruniu przyjmują pacjentów z sąsiednich gmin w zamian za składkę. Współpraca regionalna bez podboju."
 trk.66.t:0 "Związki a rekwizycja autobusów"
 trk.66.d:0 "Układ zbiorowy wymaga zgody związków na przeniesienie kierowców do wojska. Związkowcy z zajezdni przy Legionów stawiają warunki."
 trk.66.a:0 "Dodatki dla kierowców i dyżury rotacyjne."
 trk.66.b:0 "Rekwizycja bez zgody – układ swoje, wojna swoje."
 trk.67.t:0 "Strajk w zajezdni"
 trk.67.d:0 "Kierowcy MZK odstawiają autobusy do zajezdni. Miasto staje, a wojsko dostaje tylko połowę pojazdów."
 trk.67.a:0 "Negocjować do skutku."
 trk.67.b:0 "Zakończyć rekwizycję."
