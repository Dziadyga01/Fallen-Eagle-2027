l_polish:
 TRK_zw_gulewski:0 "Paweł Gulewski (Obywatelski Toruń)"
 TRK_zw_zaleski:0 "Michał Zaleski (Czas Gospodarzy)"
 TRK_zw_romanowski:0 "Michał Romanowski (Toruń dla Mieszkańców)"
 TRK_zw_kowalczyk:0 "Katarzyna Kowalczyk (Toruński Komitet Obywatelski)"
 TRK_zw_elana:0 "Ruch Elany (Narodowy Toruń)"
 TRK_zw_krevienko:0 "Maksim Krevienko (Federacja Wolnych Dzielnic)"
 TRK_remis_tak:0 "Kilku kandydatów miało równe poparcie – o zwycięstwie przesądziła debata albo sondaż z początku kampanii."
 TRK_remis_nie:0 "Zwycięzca miał najwyższe poparcie spośród zarejestrowanych kandydatów."
 TRK_tt_1:0 "Zwycięzca zostanie zaprzysiężony fokusem §YZaprzysiężenie nowych władz§! albo automatycznie po 6 dniach."
 trk.12.t:0 "Wyniki wyborów w Toruniu"
 trk.12.d:0 "Komisja ogłasza wyniki o świcie, przy kawie z termosów. Wynik (udział w głosach zarejestrowanych komitetów):\n\nPaweł Gulewski: §Y[?TR2_wynik_gulewski|0]%§!\nMichał Zaleski: §Y[?TR2_wynik_zaleski|0]%§!\nMichał Romanowski: §Y[?TR2_wynik_romanowski|0]%§!\nKatarzyna Kowalczyk: §Y[?TR2_wynik_kowalczyk|0]%§!\nRuch Elany: §Y[?TR2_wynik_elana|0]%§!\nMaksim Krevienko: §Y[?TR2_wynik_krevienko|0]%§!\n\nZwycięzca: §G[TRK_GetZwyciezca]§!. [TRK_GetRemis]\n\nNowe władze zostaną zaprzysiężone w Ratuszu Staromiejskim – najpóźniej w ciągu sześciu dni."
 trk.12.a:0 "Wynik jest wiążący."
 trk.9.t:0 "Cisza wyborcza"
 trk.9.d:0 "Od północy obowiązuje cisza wyborcza. Plakaty zostają na słupach, ale megafony milkną, a radio nadaje tylko komunikaty komisji. Jeśli Rada nie zamknęła jeszcze list, komisja dopuszcza wszystkie komitety z poparciem co najmniej 10.\n\nWybory odbędą się najpóźniej §Y4 kwietnia§! – fokusem „Wybory nad Wisłą” albo automatycznie."
 trk.9.a:0 "Czekamy na wynik."
 TRK_kampania:0 "Kampania wyborcza w Toruniu"
 TRK_kampania_desc:0 "Wybory najpóźniej §Y4 kwietnia 2028 r.§!, cisza wyborcza od §Y25 marca§!.\nSondaż: Gulewski §Y[?TR2_udzial_gulewski|0]%§!, Zaleski §Y[?TR2_udzial_zaleski|0]%§!, Romanowski §Y[?TR2_udzial_romanowski|0]%§!, Kowalczyk §Y[?TR2_udzial_kowalczyk|0]%§!, Ruch Elany §Y[?TR2_udzial_elana|0]%§!, Krevienko §Y[?TR2_udzial_krevienko|0]%§!.\nWynik: wygrywa zarejestrowany komitet z największym poparciem; remis rozstrzyga debata, a potem kolejność sondażu z początku kampanii.\nWsparcie sztabu: najwyżej §Y2 razy§! dla jednego kandydata i §Y5 razy§! łącznie (wykorzystano: [?TRK_wsp_suma|0])."
 TRK_req_przed_cisza:0 "Przed ciszą wyborczą (do 24 marca 2028 r.)"
 TRK_wsp_gulewski:0 "Wesprzeć sztab: Paweł Gulewski"
 TRK_wsp_gulewski_desc:0 "Rada przekazuje sztabowi komitetu „Obywatelski Toruń” sale, nagłośnienie i czas antenowy w radiu miejskim. Rywal (Michał Zaleski) traci część uwagi mediów."
 TRK_wsp_zaleski:0 "Wesprzeć sztab: Michał Zaleski"
 TRK_wsp_zaleski_desc:0 "Rada przekazuje sztabowi komitetu „Czas Gospodarzy” sale, nagłośnienie i czas antenowy w radiu miejskim. Rywal (Paweł Gulewski) traci część uwagi mediów."
 TRK_wsp_romanowski:0 "Wesprzeć sztab: Michał Romanowski"
 TRK_wsp_romanowski_desc:0 "Rada przekazuje sztabowi komitetu „Toruń dla Mieszkańców” sale, nagłośnienie i czas antenowy w radiu miejskim. Rywal (Maksim Krevienko) traci część uwagi mediów."
 TRK_wsp_kowalczyk:0 "Wesprzeć sztab: Katarzyna Kowalczyk"
 TRK_wsp_kowalczyk_desc:0 "Rada przekazuje sztabowi komitetu „Toruński Komitet Obywatelski” sale, nagłośnienie i czas antenowy w radiu miejskim. Rywal (Ruch Elany) traci część uwagi mediów."
 TRK_wsp_elana:0 "Wesprzeć sztab: Ruch Elany"
 TRK_wsp_elana_desc:0 "Rada przekazuje sztabowi komitetu „Narodowy Toruń” sale, nagłośnienie i czas antenowy w radiu miejskim. Rywal (Katarzyna Kowalczyk) traci część uwagi mediów."
 TRK_wsp_krevienko:0 "Wesprzeć sztab: Maksim Krevienko"
 TRK_wsp_krevienko_desc:0 "Rada przekazuje sztabowi komitetu „Federacja Wolnych Dzielnic” sale, nagłośnienie i czas antenowy w radiu miejskim. Rywal (Michał Romanowski) traci część uwagi mediów."
 TRK_autobusy:0 "Autobusy w służbie wojska"
 TRK_autobusy_desc:0 "Autobusy MZK wożą żołnierzy i sprzęt. Linie cywilne jeżdżą co godzinę, a przystanki pękają w szwach."
 TRK_ogrzewanie:0 "Priorytet ogrzewania mieszkań"
 TRK_ogrzewanie_desc:0 "Węgiel i gaz idą najpierw do ciepłowni osiedlowych. Zakłady pracują na pół gwizdka."
 TRK_mobilizacja:0 "Szybka mobilizacja"
 TRK_mobilizacja_desc:0 "Rezerwiści zostawiają warsztaty i biura. Armia rośnie, gospodarka zwalnia."
 TRK_przedsiebiorcy:0 "Porozumienie z przedsiębiorcami"
 TRK_przedsiebiorcy_desc:0 "Firmy z Szosy Lubickiej budują szybciej – w zamian za ulgi, kontrakty i miejsce przy stole Rady."
 TRK_paliwo:0 "Kartki na paliwo"
 TRK_paliwo_desc:0 "Na stacjach obowiązują przydziały. Wojsko i karetki tankują pierwsze, prywatni kierowcy – jeśli coś zostanie."
 TRK_godzina:0 "Godzina policyjna"
 TRK_godzina_desc:0 "Od 22:00 do 5:00 ulice należą do patroli. Mniej kradzieży, mniej wieców – i mniej zaufania do władzy."
 TRK_dostawy_gmin:0 "Dostawy z gmin"
 TRK_dostawy_gmin_desc:0 "Rolnicy z Lubicza i Łysomic wożą żywność do miasta. Płacimy im paliwem i ochroną."
 TRK_kryzys:0 "Zarządzanie kryzysowe Torunia"
 TRK_kryzys_desc:0 "Decyzje na czas rozpadu państwa. Każda pomaga w jednej sprawie i szkodzi w innej. Efekty są czasowe – czas trwania widać w podpowiedzi, a część można zakończyć wcześniej osobną decyzją."
 TRK_tt_2:0 "§YUkład zbiorowy§! (droga Romanowskiego): związki muszą zgodzić się na rekwizycję – wydarzenie, a przy odmowie strajk w zajezdni."
 TRK_d_autobusy:0 "Rekwizycja autobusów MZK"
 TRK_d_autobusy_desc:0 "Wojsko dostaje autobusy i kierowców z zajezdni przy Legionów. Transport dywizji przyspiesza, ale miasto stoi w korkach i na przystankach."
 TRK_d_autobusy_zwrot:0 "Zwrot autobusów do MZK"
 TRK_d_autobusy_zwrot_desc:0 "Autobusy wracają na linie miejskie. Wojsko znów musi radzić sobie samo."
 TRK_d_ogrzewanie:0 "Priorytet ogrzewania mieszkań"
 TRK_d_ogrzewanie_desc:0 "Elektrociepłownia i kotłownie osiedlowe dostają paliwo przed zakładami. Mieszkania na Rubinkowie i Skarpie będą ciepłe – hale przy Szosie Lubickiej zimne."
 TRK_d_mobilizacja:0 "Szybka mobilizacja rezerwistów"
 TRK_d_mobilizacja_desc:0 "Wezwanie dla wszystkich rezerwistów z miasta. Natychmiast §G+3000§! rekrutów (pod rządami Krevienki: §G+1500§! ochotników i lepsza koordynacja)."
 TRK_d_przedsiebiorcy:0 "Porozumienie z przedsiębiorcami"
 TRK_d_przedsiebiorcy_desc:0 "Ratusz daje ulgi i zamówienia w zamian za szybką odbudowę. Pod rządami Zaleskiego porozumienie oznacza też nowe zobowiązania wobec wykonawców."
 TRK_d_paliwo:0 "Kartki na paliwo"
 TRK_d_paliwo_desc:0 "Przydziały paliwa na stacjach. Magazyn wojska natychmiast dostaje §G+1500§! paliwa, ale kierowcy są wściekli."
 TRK_d_godzina:0 "Godzina policyjna"
 TRK_d_godzina_desc:0 "Patrole na ulicach od 22:00 do 5:00. W czasie kampanii: Ruch Elany zyskuje, Krevienko i Kowalczyk tracą."
 TRK_d_godzina_koniec:0 "Odwołać godzinę policyjną"
 TRK_d_godzina_koniec_desc:0 "Patrole schodzą z ulic. Ludzie wracają na wieczorne spacery – i na wiece."
 TRK_d_dostawy:0 "Apel o dostawy żywności z gmin"
 TRK_d_dostawy_desc:0 "Rolnicy z sąsiednich gmin przywożą żywność. Płacimy siłą polityczną i paliwem – gminy dostają za to §Y+20 PP§! i dobrą opinię o Toruniu."
 trk.1.t:0 "Autobusy stają na Szosie Chełmińskiej"
 trk.1.d:0 "O szóstej rano na przystankach stoją tłumy. MZK dostało tylko połowę oleju napędowego, a kierowcy pytają, które linie mają jeździć. Sztaby kandydatów już nagrywają filmiki z zatłoczonych przystanków."
 trk.1.a:0 "Najpierw linie do szpitali i szkół."
 trk.1.b:0 "Wpuścić na linie prywatnych przewoźników."
 trk.1.c:0 "Kursy tylko w godzinach szczytu, resztę organizują osiedla."
 trk.1.e:0 "Oddać część autobusów zabranych wojsku."
 trk.2.t:0 "Spór o budżet zimowy"
 trk.2.d:0 "Skarbnik kładzie na stole jedną kartkę: pieniędzy wystarczy na jedno z trzech – ogrzewanie mieszkań, łatanie dróg i mostów albo nowy sprzęt dla Straży. Każdy kandydat wie, co powinno być pierwsze."
 trk.2.a:0 "Ogrzewanie mieszkań."
 trk.2.b:0 "Drogi i mosty."
 trk.2.c:0 "Sprzęt dla Straży Miejskiej."
 trk.3.t:0 "Służby pytają o listy poparcia"
 trk.3.d:0 "Funkcjonariusze, którzy zostali w toruńskiej delegaturze służb, chcą wglądu w listy podpisów komitetów. Mówią o „ingerencji z zewnątrz”. Komitety mówią o zastraszaniu."
 trk.3.a:0 "Udostępnić listy – bezpieczeństwo przede wszystkim."
 trk.3.b:0 "Odmówić. Listy są tajne."
 trk.3.c:0 "Wgląd tylko na wniosek sądu."
 trk.4.t:0 "Protest na Rubinkowie"
 trk.4.d:0 "Kaloryfery w blokach przy Rydygiera są letnie od tygodnia. Kilkaset osób blokuje skrzyżowanie i żąda, by ktoś z Ratusza przyjechał – teraz, nie po wyborach."
 trk.4.a:0 "Pokazać, że ogrzewanie mieszkań ma już priorytet."
 trk.4.b:0 "Dodatkowy węgiel z magazynów miejskich."
 trk.4.c:0 "Komitety lokatorów same rozdzielą opał."
 trk.4.e:0 "Straż Miejska ma udrożnić skrzyżowanie."
 trk.5.t:0 "Uniwersytet stawia warunki"
 trk.5.d:0 "Rektor UMK proponuje, by komisja wyborcza korzystała z sal i informatyków uczelni. W zamian chce gwarancji, że kampus na Bielanach dostanie paliwo do agregatów do wiosny."
 trk.5.a:0 "Zgoda – uczelnia pomoże w wyborach."
 trk.5.b:0 "Wybory zorganizują urzędnicy, nie profesorowie."
 trk.5.c:0 "Niech studenci sami liczą głosy w swoich komisjach."
 trk.6.t:0 "Kibice i parafie chcą pilnować wyborów"
 trk.6.d:0 "Stowarzyszenie kibiców i kilka parafii proponuje „straż obywatelską” przy lokalach wyborczych. Jedni widzą w tym pomoc, inni – zastraszanie."
 trk.6.a:0 "Przyjąć pomoc kibiców i parafii."
 trk.6.b:0 "Lokale pilnuje tylko Straż Miejska."
 trk.6.c:0 "Mężowie zaufania ze wszystkich komitetów."
 TRK_tt_3:0 "Nagranie zostaje uznane za fałszywe – nikt nie traci poparcia."
 TRK_tt_4:0 "Najwięcej tracą kandydaci, o których najwięcej się mówi."
 trk.7.t:0 "Nagranie z Podgórza"
 trk.7.d:0 "Na transmisji z lewego brzegu pojawia się nagranie, na którym jeden z kandydatów rzekomo obiecuje „sprzedać mosty Bydgoszczy”. Eksperci od razu mówią o przeróbce, ale nagranie widziało już pół miasta."
 trk.7.a:0 "Komisja zleca weryfikację nagrania."
 trk.7.b:0 "Nie komentować – samo ucichnie."
 trk.7.c:0 "Odciąć transmisje z Podgórza na czas kampanii."
 trk.8.t:0 "Przedsiębiorcy z Szosy Lubickiej"
 trk.8.d:0 "Właściciele hurtowni i firm budowlanych proponują, że opłacą transport urn, druk kart i agregaty dla lokali wyborczych. Bez faktur i bez pytań."
 trk.8.a:0 "Przyjąć – liczy się, żeby wybory się odbyły."
 trk.8.b:0 "Przyjąć, ale z jawnym rejestrem darczyńców."
 trk.8.c:0 "Odmówić. Zapłaci miasto."
 trk.13.t:0 "Tramwaj na Chełmińskie Przedmieście"
 trk.13.d:0 "Po trzech miesiącach przerwy pierwsza linia tramwajowa znów jedzie przez Starówkę na Chełmińskie Przedmieście – na prądzie z agregatów elektrociepłowni. Motorniczy dzwoni dwa razy dłużej niż zwykle, a ludzie machają z chodników. Każdy sztab chce się z tym tramwajem sfotografować."
 trk.13.a:0 "Przejazd z całą Radą – bez kandydatów."
 trk.13.b:0 "Tramwaj za darmo do wyborów."
 trk.13.c:0 "Prąd najpierw dla zakładów, tramwaj w weekendy."
 trk.14.t:0 "Pierniki dla wyborców"
 trk.14.d:0 "Na wiecach rozdawane są pierniki z logo komitetów. Komisja wyborcza pyta, czy to już przekupstwo, czy jeszcze toruńska gościnność. Jeden z radnych mówi do mikrofonu: „Jo, za piernika nikt nie sprzeda głosu”. Sala się śmieje, ale sprawa trafia do sądu wyborczego."
 trk.14.a:0 "Zakazać rozdawania czegokolwiek na wiecach."
 trk.14.b:0 "Pierniki to tradycja, nie łapówka."
 trk.14.c:0 "Pierniki tylko dla kolejek do sklepów, nie na wiecach."
 trk.15.t:0 "Bydgoszcz miesza się w kampanię"
 trk.15.d:0 "Bydgoskie media nadają reportaże o „chaosie w Toruniu” i pokazują kolejki pod sklepami na Rubinkowie. W Toruniu nikt nie ma wątpliwości, że rywal zza Wisły chce mieć wpływ na wynik."
 trk.15.a:0 "Odpowiedzieć kampanią „Toruń daje radę”."
 trk.15.b:0 "Bydgoszcz to wróg – kto broni Bydgoszczy, jest przeciw nam."
 trk.15.c:0 "Zaprosić dziennikarzy z Bydgoszczy na Rubinkowo."
 trk.20.t:0 "Zimne kaloryfery na Skarpie"
 trk.20.d:0 "Elektrociepłownia ma zapas węgla na dwa tygodnie. Na Skarpie ludzie śpią w kurtkach, a w spółdzielni ktoś przykleił kartkę: „Jo, wiemy, że zimno. Prezes też marznie”."
 trk.20.a:0 "Ogrzewanie mieszkań ma pierwszeństwo."
 trk.20.b:0 "Zakłady muszą pracować – mieszkania dostaną tyle, ile zostanie."
 trk.20.c:0 "Kotłownie już mają priorytet – dowieźć opał do najstarszych bloków."
 trk.21.t:0 "Kolejka na stacji przy Szosie Bydgoskiej"
 trk.21.d:0 "Kolejka do dystrybutorów ciągnie się aż do ronda. Kierowca autobusu z Lubicza czeka cztery godziny, a taksówkarze organizują wspólne tankowanie do kanistrów."
 trk.21.a:0 "Wprowadzić kartki na paliwo."
 trk.21.b:0 "Kartki już obowiązują – dorzucić przydział dla MZK."
 trk.21.c:0 "Niech rynek sam to rozwiąże."
 trk.22.t:0 "Radio z Bielan"
 trk.22.d:0 "Studenckie radio z kampusu nadaje co godzinę listę otwartych aptek, punktów ogrzewania i kursów autobusów. Słucha go już więcej ludzi niż miejskich komunikatów."
 trk.22.a:0 "Paliwo do nadajnika na koszt miasta."
 trk.22.b:0 "Radio ma nadawać komunikaty Ratusza."
 trk.23.t:0 "Prom zamiast mostu"
 trk.23.d:0 "Most Piłsudskiego zamknięto po wykryciu pęknięć przęsła. Ruch na Podgórz idzie przez most Zawackiej i przez prywatny prom, którego właściciel podniósł ceny trzykrotnie."
 trk.23.a:0 "Saperzy stawiają tymczasową przeprawę."
 trk.23.b:0 "Zapłacić Podgórzowi za wspólną obsługę promu."
 trk.23.c:0 "Podgórz odcięty od transmisji – to i od promu. Niech płacą sami."
 trk.24.t:0 "Szpital na Bielanach bez prądu"
 trk.24.d:0 "W nocy padł agregat w szpitalu na Bielanach. Respiratory przez godzinę pracowały na akumulatorach. Dyrektor żąda stałego przydziału paliwa – albo przeniesienia pacjentów."
 trk.24.a:0 "Paliwo z rezerw wojskowych."
 trk.24.b:0 "Autobusy zabrane wojsku przewiozą pacjentów do szpitala miejskiego."
 trk.24.c:0 "Poprosić Bydgoszcz o agregaty."
 trk.25.t:0 "Chleb z Lubicza"
 trk.25.d:0 "Rolnicy z Lubicza i Grębocina przywożą mąkę, ale nie chcą pieniędzy. Chcą paliwa, nawozów i ochrony przed kradzieżami na polach."
 trk.25.a:0 "Zapłacić paliwem."
 trk.25.b:0 "Patrole Straży na drogach do Lubicza."
 trk.25.c:0 "Dostawy z gmin już działają – rozszerzyć umowę."
 trk.26.t:0 "Zmiany w Elanie"
 trk.26.d:0 "Zakład przy Szosie Lubickiej może wznowić jedną zmianę produkcji włókien. Potrzebuje prądu, którego brakuje osiedlom, i ludzi, którzy dziś stoją w kolejkach."
 trk.26.a:0 "Uruchomić zmianę – praca jest ważniejsza."
 trk.26.b:0 "Prąd zostaje dla mieszkań."
 TRK_praca:0 "Zmiana w Elanie"
 TRK_praca_desc:0 "Jedna zmiana w zakładzie przy Szosie Lubickiej znów pracuje. Ludzie mają pensje, osiedla – mniej prądu."
 trk.27.t:0 "Bydgoskie Przedmieście kontra Starówka"
 trk.27.d:0 "Rada osiedla Bydgoskiego Przedmieścia chce przenieść targ z Rynku Nowomiejskiego „bliżej ludzi”. Kupcy ze Starówki odpowiadają petycją, pod którą podpisało się „pół Torunia i jeden turysta z Niemiec”."
 trk.27.a:0 "Targ zostaje na Starówce."
 trk.27.b:0 "Dwa targi – po jednym w każdej dzielnicy."
 trk.28.t:0 "Kra na Wiśle"
 trk.28.d:0 "Po odwilży Wisła niesie krę. Prom do Podgórza nie pływa, a przy moście Zawackiej saperzy kruszą lód ładunkami. Wieczorem radio nadaje relację „na żywo z kry”."
 trk.28.a:0 "Saperzy chronią przeprawę."
 trk.28.b:0 "Przeprawa zamknięta do odwołania."
 trk.29.t:0 "Kierowcy MZK piszą list"
 trk.29.d:0 "Kierowcy autobusów piszą otwarty list do władz: od miesięcy jeżdżą na zmianę z wojskiem, bez dodatków i bez wolnych weekendów."
 trk.29.a:0 "Premia dla kierowców."
 trk.29.b:0 "Zwrócić autobusy miastu."
 trk.29.c:0 "W czasie kryzysu nie ma dodatków."
 trk.30.t:0 "Lekarze wyjeżdżają do Bydgoszczy"
 trk.30.d:0 "Trzech chirurgów ze szpitala miejskiego przyjęło oferty z Bydgoszczy: wyższe pensje i stały prąd. Na oddziale zostali stażyści i jeden ordynator przed emeryturą."
 trk.30.a:0 "Dopłaty dla lekarzy z budżetu miasta."
 trk.30.b:0 "Ściągnąć lekarzy z UMK – kosztem badań uczelni."
 trk.30.c:0 "Bydgoszcz podkupuje nam ludzi – to też jest wojna."
 TRK_lekarze_umk:0 "Lekarze z UMK w szpitalu"
 TRK_lekarze_umk_desc:0 "Pracownicy wydziału lekarskiego dyżurują w szpitalu miejskim zamiast w laboratoriach."
 trk.31.t:0 "Rok bez Warszawy"
 trk.31.d:0 "Rocznica rozpadu państwa. Radio z Bielan nadaje cały dzień wspomnienia mieszkańców: kolejki, zimę, pierwsze wybory. Na Rynku Staromiejskim ktoś stawia świeczki pod Kopernikiem."
 trk.31.a:0 "Uroczysta sesja Rady."
 trk.31.b:0 "Dzień jak co dzień – miasto ma pracować."
