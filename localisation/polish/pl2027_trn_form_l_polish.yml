 trn.1.t:0 "Ultimatum z Torunia"
 trn.1.d:0 "[From.GetName] proponuje nam „opiekę”: wspólną administrację, ochronę i zachowanie samorządu. Odmowa – jak dali do zrozumienia posłowie – nie zostanie przyjęta dobrze."
 trn.1.a:0 "Przyjmujemy."
 trn.1.b:0 "Nigdy!"
 trn.2.t:0 "Toruń chce rozmawiać"
 trn.2.d:0 "[From.GetName] proponuje rozmowy o przyszłości regionu. W Bydgoszczy nikt nie zapomniał dawnych sporów – ale nikt też nie chce wojny."
 trn.2.a:0 "Rozmawiajmy."
 trn.2.b:0 "Nie mamy o czym."
 trn.3.t:0 "Zaproszenie od komun"
 trn.3.d:0 "Federacja Wolnych Komun z Torunia wzywa Bydgoszcz, by przyłączyła się „jako równa wśród równych”. Zgoda oznacza koniec naszej niepodległości, odmowa – wojnę z milicjami komun."
 trn.3.a:0 "Przyłączymy się."
 trn.3.b:0 "Bydgoszcz zostaje sobą!"
 trn.4.t:0 "Zgoda"
 trn.4.d:0 "[From.GetName] przyjmuje nasze warunki."
 trn.4.a:0 "Region rośnie."
 trn.5.t:0 "Odmowa"
 trn.5.d:0 "[From.GetName] odrzuca nasze żądania."
 trn.5.a:0 "Do broni!"
 trn.5.b:0 "Poczekamy."
 trn.6.t:0 "Zaproszenie do federacji"
 trn.6.d:0 "[From.GetName] tworzy Federację Kujawsko-Pomorską i zaprasza Bydgoszcz jako drugą stolicę. Bydgoszcz zachowa sądy, wojsko i gospodarkę."
 trn.6.a:0 "Rozmawiajmy o warunkach federacji (zgoda tylko na rozmowy)."
 trn.6.b:0 "Bydgoszcz zostaje niepodległa."
 trn.50.t:0 "Spór o przyszłość Torunia"
 trn.50.d:0 "Projekt Kopernik okazał się sukcesem. Część profesorów UMK otwarcie mówi, że Rada Naukowa powinna przejąć władzę, bo politycy tylko przeszkadzają."
 trn.50.a:0 "Technokraci mają rację."
 trn.50.b:0 "Nauka ma służyć, nie rządzić."
 trn.111.t:0 "Federacja Wolnych Komun Kujaw"
 trn.111.d:0 "Wolna Komuna Toruńska chce zaprosić sąsiednie gminy do federacji równych sobie. Na Rynku Staromiejskim odczytano proklamację. Nowe państwo ma nową nazwę, flagę i nowe cele."
 trn.111.a:0 "Niech żyje nowe państwo!"
 trn.112.t:0 "Wielkie Państwo Toruńskie"
 trn.112.d:0 "Nacjonaliści Elany chcą państwa, które będzie się liczyć w regionie. Na Rynku Staromiejskim odczytano proklamację. Nowe państwo ma nową nazwę, flagę i nowe cele."
 trn.112.a:0 "Niech żyje nowe państwo!"
 trn.113.t:0 "Federacja Kujawsko-Pomorska"
 trn.113.d:0 "Toruń i Bydgoszcz mogą wreszcie zbudować wspólne państwo. Na Rynku Staromiejskim odczytano proklamację. Nowe państwo ma nową nazwę, flagę i nowe cele."
 trn.113.a:0 "Niech żyje nowe państwo!"
 trn.114.t:0 "Państwo Kopernikańskie"
 trn.114.d:0 "Rada Naukowa gotowa jest przejąć państwo. Na Rynku Staromiejskim odczytano proklamację. Nowe państwo ma nową nazwę, flagę i nowe cele."
 trn.114.a:0 "Niech żyje nowe państwo!"
 trn.120.t:0 "Nowe państwo na Kujawach"
 trn.120.d:0 "[From.GetName] zmienia się w nowe państwo i rości sobie prawa do całego regionu. Musimy zdecydować, jak na to odpowiedzieć."
 trn.120.a:0 "Uznajemy nowego sąsiada."
 trn.120.b:0 "Nie uznamy tych roszczeń!"
 trn.121.t:0 "Zmiany na Kujawach"
 trn.121.d:0 "Toruń ogłosił powstanie nowego państwa, które rości sobie prawa do Kujaw i Pomorza."
 trn.121.a:0 "Region się zmienia."
 trn.125.t:0 "Zjednoczone Kujawy i Pomorze"
 trn.125.d:0 "Etap III: Toruń, Bydgoszcz, Włocławek, Grudziądz, Świecie i Tuchola są w jednym państwie."
 trn.125.a:0 "Wielkie zjednoczenie!"
 trn.130.t:0 "Nowa potęga nad Wisłą"
 trn.130.d:0 "Państwo, które zaczynało jako Republika Toruńska, osiągnęło coś, czego nikt się nie spodziewał."
 trn.130.a:0 "Historia przyspiesza."
 trn.70.t:0 "Federacja się rozpada"
 trn.70.d:0 "Równowaga federacji spadła poniżej 30%. Część komun przestaje przysyłać delegatów, a dawni radni i oficerowie zakładają Komitet Porządku. Masz 30 dni, by odzyskać poparcie."
 trn.70.a:0 "Federacja przetrwa."
 trn.72.t:0 "Bunt Komitetu Porządku"
 trn.72.d:0 "Komitet Porządku ogłosił w Bydgoskim Przedmieściu przywrócenie „normalnej władzy”. Wojna o przyszłość komun się zaczęła."
 trn.72.a:0 "Bez panów!"
 trn.80.t:0 "Przewrót radykałów"
 trn.80.d:0 "Bojówki otoczyły Ratusz. Grzegorz Elański ogłasza, że ruch potrzebuje „prawdziwego przywództwa”."
 trn.80.a:0 "Radykałowie przejmują władzę."
 trn.81.t:0 "Umiarkowani przejmują ster"
 trn.81.d:0 "Fachowcy w rządzie odsunęli bojówkarzy. Ruch staje się zwykłą autorytarną partią porządku."
 trn.81.a:0 "Porządek zamiast rewolucji."
 trn.90.t:0 "Spór stolic"
 trn.90.d:0 "Jedno z miast ma wrażenie, że federacja jest tylko przykrywką dla dominacji drugiego. Radni grożą secesją. Masz 30 dni na negocjacje."
 trn.90.a:0 "Musimy się porozumieć."
 trn.92.t:0 "Secesja Bydgoszczy"
 trn.92.d:0 "Negocjacje zawiodły. Bydgoszcz ogłosiła wystąpienie z federacji. Most w Fordonie zamknięto."
 trn.92.a:0 "Federacja musi przetrwać."
 trn.100.t:0 "Protesty przeciw technokratom"
 trn.100.d:0 "Ludzie mają dość rządów profesorów, którzy mówią im, co jest dla nich dobre."
 trn.100.a:0 "Wysłuchamy ich."
 trn.101.t:0 "Rewolta przeciw Radzie Naukowej"
 trn.101.d:0 "Zaniedbanie społeczeństwa doprowadziło do otwartego buntu. Związki zawodowe i część policji ogłaszają „Toruń dla ludzi, nie dla algorytmów”."
 trn.101.a:0 "Nauka się obroni."
 TRN_kujawy_kat:0 "Zjednoczenie lokalne (etap I)"
 TRN_kujawy_kat_desc:0 "Gminy wokół Torunia muszą uznać władzę Grodu – przez ultimatum albo wcielenie państw, które już nam podlegają."
 TRN_formacje_kat:0 "Formowanie państw"
 TRN_formacje_kat_desc:0 "Etap II: nowe państwo zależne od tego, kto rządzi w Toruniu. Etap III: Zjednoczone Kujawy i Pomorze. Można utworzyć tylko jedno państwo etapu II."
