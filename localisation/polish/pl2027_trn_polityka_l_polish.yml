 TRN_dz_nazwa_bielany:0 "Bielany (kampus UMK)"
 TRN_dz_nazwa_bydgoskie:0 "Bydgoskie Przedmieście"
 TRN_dz_nazwa_skarpa:0 "Na Skarpie"
 TRN_walka_kat:0 "Kto przejmie Toruń?"
 TRN_walka_kat_desc:0 "Wpływy frakcji (0–100) i kontrolowane dzielnice. Władzę przejmie najsilniejsza frakcja po 120 dniach – albo wcześniej (najwcześniej po 75 dniach), gdy któraś osiągnie 80. Jeśli przewaga lidera będzie mniejsza niż 15 punktów, rywale mogą przejąć Ratusz w „Noc w Ratuszu”.\n\nObecna ekipa Ratusza (Gulewski): §Y[?TRN_frak_gul|0]§! (dzielnice: [?TRN_frak_gul_dz|0])\nStara gwardia samorządu (Zaleski): §Y[?TRN_frak_zal|0]§! (dzielnice: [?TRN_frak_zal_dz|0])\nToruń dla Mieszkańców (Romanowski): §Y[?TRN_frak_rom|0]§! (dzielnice: [?TRN_frak_rom_dz|0])\nKomitet Obywatelski (Kowalczyk): §Y[?TRN_frak_kow|0]§! (dzielnice: [?TRN_frak_kow_dz|0])\nNacjonaliści Elany: §Y[?TRN_frak_ela|0]§! (dzielnice: [?TRN_frak_ela_dz|0])\nFederacja Wolnych Dzielnic (Krevienko): §Y[?TRN_frak_kre|0]§! (dzielnice: [?TRN_frak_kre_dz|0])\n\nFaworyt Rady: §Y[GetTRNFaworyt]§!   Najsilniejszy rywal: §Y[GetTRNRywal]§!\nWpływy lokalne Rady: §Y[?TRN_lok|0]§!/100 (+3 w takcie)\n§RKontrakcja:§! gdy faworyt prowadzi, w każdym takcie najsilniejszy rywal zyskuje +6, a pozostałe frakcje +1.\n\nStare Miasto: [GetTRNDz_stare] – media: właściciel dostaje +2 wpływów w takcie zamiast +1\nChełmińskie Przedmieście: [GetTRNDz_chelminskie] – +3% stabilności\nRubinkowo: [GetTRNDz_rubinkowo] – +4 wpływów lokalnych w takcie\nBielany (kampus UMK): [GetTRNDz_bielany] – +5% szybkości badań\nBydgoskie Przedmieście: [GetTRNDz_bydgoskie] – +5% poparcia dla wojny\nNa Skarpie: [GetTRNDz_skarpa] – +10% przyrostu siły politycznej"
 TRN_rada_kat:0 "Rada Tymczasowa Miasta"
 TRN_rada_kat_desc:0 "Nadzwyczajne narzędzia Rady: porządkowanie urzędów, ratowanie budżetu i budowanie wpływów lokalnych (aktualnie: §Y[?TRN_lok|0]§!/100)."
 TRN_tt_faw_gulewski:0 "Obecna ekipa Ratusza (Gulewski) zostaje §Yfaworytem Rady§! – decyzje dzielnic działają na jej korzyść, a rywale zaczynają kontrakcję, gdy prowadzi."
 TRN_tt_1:0 "Wpływy: Gulewski §G+6§!"
 TRN_wspieraj_gulewski:0 "Wesprzeć obecną ekipę Ratusza (+6)"
 TRN_wspieraj_gulewski_desc:0 "Prezydent i jego urzędnicy chcą przeprowadzić miasto przez kryzys dialogiem, budżetem obywatelskim i europejskimi kontaktami."
 TRN_tt_faw_zaleski:0 "Stara gwardia samorządu (Zaleski) zostaje §Yfaworytem Rady§! – decyzje dzielnic działają na jej korzyść, a rywale zaczynają kontrakcję, gdy prowadzi."
 TRN_tt_2:0 "Wpływy: Zaleski §G+6§!\nWpływy lokalne Rady: §G+3§!"
 TRN_wspieraj_zaleski:0 "Wesprzeć starą gwardię samorządu (+6)"
 TRN_wspieraj_zaleski_desc:0 "Doświadczeni ludzie Michała Zaleskiego obiecują porządek, twardą rękę w urzędach i inwestycje „na pewno, nie na próbę”."
 TRN_tt_faw_romanowski:0 "Toruń dla Mieszkańców (Romanowski) zostaje §Yfaworytem Rady§! – decyzje dzielnic działają na jej korzyść, a rywale zaczynają kontrakcję, gdy prowadzi."
 TRN_tt_3:0 "Wpływy: Romanowski §G+6§!\nWpływy lokalne Rady: §G+3§!"
 TRN_wspieraj_romanowski:0 "Wesprzeć ruch Toruń dla Mieszkańców (+6)"
 TRN_wspieraj_romanowski_desc:0 "Lokatorzy, pracownicy i młodzi skupieni wokół Michała Romanowskiego chcą miasta dla zwykłych ludzi."
 TRN_tt_faw_kowalczyk:0 "Komitet Obywatelski (Kowalczyk) zostaje §Yfaworytem Rady§! – decyzje dzielnic działają na jej korzyść, a rywale zaczynają kontrakcję, gdy prowadzi."
 TRN_tt_4:0 "Wpływy: Kowalczyk §G+6§!"
 TRN_wspieraj_kowalczyk:0 "Wesprzeć Komitet Obywatelski (+6)"
 TRN_wspieraj_kowalczyk_desc:0 "Sąsiedzka sieć pomocy Kathariny Schmidt-Kowalczyk staje się siłą polityczną."
 TRN_tt_faw_elana:0 "Nacjonaliści Elany zostaje §Yfaworytem Rady§! – decyzje dzielnic działają na jej korzyść, a rywale zaczynają kontrakcję, gdy prowadzi."
 TRN_tt_5:0 "Wpływy: Elana §G+6§!"
 TRN_wspieraj_elana:0 "Wesprzeć nacjonalistów Elany (+6)"
 TRN_wspieraj_elana_desc:0 "Kibice i bojówki obiecują „porządek” – na swoich warunkach."
 TRN_tt_faw_krevienko:0 "Federacja Wolnych Dzielnic (Krevienko) zostaje §Yfaworytem Rady§! – decyzje dzielnic działają na jej korzyść, a rywale zaczynają kontrakcję, gdy prowadzi."
 TRN_tt_6:0 "Wpływy: Krevienko §G+6§!\nWpływy lokalne Rady: §G+5§!"
 TRN_wspieraj_krevienko:0 "Wesprzeć Federację Wolnych Dzielnic (+6)"
 TRN_wspieraj_krevienko_desc:0 "Zgromadzenia osiedlowe Maksima Krevienki chcą, by miasto rządziło się samo."
 TRN_tt_dz_stare:0 "§YStare Miasto§! przechodzi pod kontrolę faworyta Rady (§Y[GetTRNFaworyt]§!): faworyt §G+3§!, dotychczasowa frakcja §R−3§! wpływów. Korzyść: media: właściciel dostaje +2 wpływów w takcie zamiast +1. Kolejna dzielnica – za 20 dni."
 TRN_dzielnica_stare:0 "Dzielnica: Stare Miasto ([GetTRNDz_stare])"
 TRN_dzielnica_stare_desc:0 "Ratusz Staromiejski, Rynek i urzędy. Kto ma Starówkę, ten ma kamery i mikrofony. Korzyść, gdy trzyma ją faworyt Rady: media: właściciel dostaje +2 wpływów w takcie zamiast +1."
 TRN_koszt_lok_30:0 "30 wpływów lokalnych"
 TRN_tt_lok_30:0 "Wpływy lokalne Rady: §R−30§!"
 TRN_tt_dz_chelminskie:0 "§YChełmińskie Przedmieście§! przechodzi pod kontrolę faworyta Rady (§Y[GetTRNFaworyt]§!): faworyt §G+3§!, dotychczasowa frakcja §R−3§! wpływów. Korzyść: +3% stabilności. Kolejna dzielnica – za 20 dni."
 TRN_dzielnica_chelminskie:0 "Dzielnica: Chełmińskie Przedmieście ([GetTRNDz_chelminskie])"
 TRN_dzielnica_chelminskie_desc:0 "Spokojne kamienice, parafie i starsi mieszkańcy, którzy pamiętają każdego prezydenta miasta. Korzyść, gdy trzyma ją faworyt Rady: +3% stabilności."
 TRN_koszt_lok_20:0 "20 wpływów lokalnych"
 TRN_tt_lok_20:0 "Wpływy lokalne Rady: §R−20§!"
 TRN_tt_dz_rubinkowo:0 "§YRubinkowo§! przechodzi pod kontrolę faworyta Rady (§Y[GetTRNFaworyt]§!): faworyt §G+3§!, dotychczasowa frakcja §R−3§! wpływów. Korzyść: +4 wpływów lokalnych w takcie. Kolejna dzielnica – za 20 dni."
 TRN_dzielnica_rubinkowo:0 "Dzielnica: Rubinkowo ([GetTRNDz_rubinkowo])"
 TRN_dzielnica_rubinkowo_desc:0 "Największe blokowisko Torunia. Tu decydują lokatorzy, zajezdnia i osiedlowe grupy. Korzyść, gdy trzyma ją faworyt Rady: +4 wpływów lokalnych w takcie."
 TRN_tt_dz_bielany:0 "§YBielany (kampus UMK)§! przechodzi pod kontrolę faworyta Rady (§Y[GetTRNFaworyt]§!): faworyt §G+3§!, dotychczasowa frakcja §R−3§! wpływów. Korzyść: +5% szybkości badań. Kolejna dzielnica – za 20 dni."
 TRN_dzielnica_bielany:0 "Dzielnica: Bielany (kampus UMK) ([GetTRNDz_bielany])"
 TRN_dzielnica_bielany_desc:0 "Kampus uniwersytetu, akademiki i szkoły. Studenci i nauczyciele organizują się najszybciej w mieście. Korzyść, gdy trzyma ją faworyt Rady: +5% szybkości badań."
 TRN_koszt_lok_25:0 "25 wpływów lokalnych"
 TRN_tt_lok_25:0 "Wpływy lokalne Rady: §R−25§!"
 TRN_tt_dz_bydgoskie:0 "§YBydgoskie Przedmieście§! przechodzi pod kontrolę faworyta Rady (§Y[GetTRNFaworyt]§!): faworyt §G+3§!, dotychczasowa frakcja §R−3§! wpływów. Korzyść: +5% poparcia dla wojny. Kolejna dzielnica – za 20 dni."
 TRN_dzielnica_bydgoskie:0 "Dzielnica: Bydgoskie Przedmieście ([GetTRNDz_bydgoskie])"
 TRN_dzielnica_bydgoskie_desc:0 "Stadion przy Bema, wille i stare koszary. Po meczu ulice należą do kibiców. Korzyść, gdy trzyma ją faworyt Rady: +5% poparcia dla wojny."
 TRN_tt_dz_skarpa:0 "§YNa Skarpie§! przechodzi pod kontrolę faworyta Rady (§Y[GetTRNFaworyt]§!): faworyt §G+3§!, dotychczasowa frakcja §R−3§! wpływów. Korzyść: +10% przyrostu siły politycznej. Kolejna dzielnica – za 20 dni."
 TRN_dzielnica_skarpa:0 "Dzielnica: Na Skarpie ([GetTRNDz_skarpa])"
 TRN_dzielnica_skarpa_desc:0 "Osiedle, na którym zgromadzenia mieszkańców zbierają się częściej niż Rada Miasta. Korzyść, gdy trzyma ją faworyt Rady: +10% przyrostu siły politycznej."
 TRN_koszt_lok_15:0 "15 wpływów lokalnych"
 TRN_tt_lok_15:0 "Wpływy lokalne Rady: §R−15§!"
 TRN_rozstrzygniecie:0 "Rozstrzygnięcie kryzysu"
 TRN_rozstrzygniecie_desc:0 "Gdy minie czas albo któraś frakcja zdobędzie 80 punktów wpływów (najwcześniej po 75 dniach), władzę przejmie najsilniejsze środowisko – chyba że jego przewaga będzie mniejsza niż 15 punktów."
 TRN_tt_7:0 "Wpływy: Gulewski §R-2§!, Kowalczyk §G+2§!\nWpływy lokalne Rady: §G+10§!"
 TRN_rada_audyt:0 "Audyt wydziałów"
 TRN_rada_audyt_desc:0 "Kontrolerzy Rady sprawdzają, kto naprawdę pracuje w Ratuszu – a kto tylko pobiera pensję."
 TRN_tt_8:0 "Wpływy lokalne Rady: §G+8§!"
 TRN_rada_pelnomocnicy:0 "Pełnomocnicy w dzielnicach"
 TRN_rada_pelnomocnicy_desc:0 "Rada wysyła swoich ludzi do rad osiedli. Każdy kontakt to wpływ na ulicy."
 TRN_tt_9:0 "Wpływy: Romanowski §G+4§!, Krevienko §G+2§!, Zaleski §G+1§!"
 TRN_rada_nieruchomosci:0 "Sprzedać miejskie nieruchomości"
 TRN_rada_nieruchomosci_desc:0 "Kamienice na Starówce i działki nad Wisłą mogą uratować kasę miasta. Lokatorzy i anarchiści już szykują protest."
 TRN_tt_10:0 "Wpływy: Kowalczyk §G+2§!"
 TRN_rada_zbiorka:0 "Zbiórka obywatelska"
 TRN_rada_zbiorka_desc:0 "Mieszkańcy wpłacają na wspólną kasę miasta. Wpływy lokalne Rady zamieniają się w pieniądze."
 TRN_tt_11:0 "Wpływy: Gulewski §G+2§!, Zaleski §G+2§!"
 TRN_rada_ratowanie_budzetu:0 "Program ratowania budżetu"
 TRN_rada_ratowanie_budzetu_desc:0 "Plan naprawczy: renegocjacja umów, wspólne zakupy i ściąganie zaległych podatków."
 TRN_koszt_pp50_lok_15:0 "50 PP i 15 wpływów lokalnych"
 TRN_rada_splata:0 "Spłacić dług miasta"
 TRN_rada_splata_desc:0 "Jednorazowa spłata pożyczki zaciągniętej w kryzysie."
 PL2027_TRN_test_takt:0 "TEST: takt kryzysu teraz"
 PL2027_TRN_test_takt_desc:0 "Decyzja testowa – widoczna tylko w trybie debug."
 PL2027_TRN_test_rozstrzygnij:0 "TEST: rozstrzygnij kryzys teraz"
 PL2027_TRN_test_rozstrzygnij_desc:0 "Decyzja testowa – widoczna tylko w trybie debug."
 PL2027_TRN_test_raport:0 "TEST: raport kryzysu do game.log"
 PL2027_TRN_test_raport_desc:0 "Decyzja testowa – widoczna tylko w trybie debug."
 PL2027_TRN_test_kryzysy:0 "TEST: wymuś wszystkie kryzysy (30–34)"
 PL2027_TRN_test_kryzysy_desc:0 "Decyzja testowa – widoczna tylko w trybie debug."
 PL2027_TRN_test_pien:0 "TEST: wydarzenia fokusów pnia (40–41)"
 PL2027_TRN_test_pien_desc:0 "Decyzja testowa – widoczna tylko w trybie debug."
 PL2027_TRN_test_lok:0 "TEST: +50 wpływów lokalnych"
 PL2027_TRN_test_lok_desc:0 "Decyzja testowa – widoczna tylko w trybie debug."
 trn_pol.1.t:0 "Walka o Toruń"
 trn_pol.1.d:0 "Ostatnie posiedzenie Rady Miasta skończyło się bez rozstrzygnięcia. Rada Tymczasowa ogłasza, że odda władzę temu, kto zdobędzie poparcie mieszkańców. Każde środowisko ma swoją dzielnicę – i apetyt na kolejne. Uwaga: kto zacznie wyraźnie prowadzić, ten ściągnie na siebie wszystkich pozostałych."
 trn_pol.1.a:0 "Niech wygra najsilniejszy."
 TRN_tt_12:0 "Wpływy: Romanowski §G+6§!, Gulewski §G+3§!\n§YRubinkowo§! przechodzi pod kontrolę: Romanowski"
 TRN_tt_13:0 "Wpływy: Zaleski §G+6§!, Elana §G+3§!, Romanowski §R-4§!"
 TRN_tt_14:0 "Wpływy: Krevienko §G+8§!\n§YRubinkowo§! przechodzi pod kontrolę: Krevienko"
 trn_pol.2.t:0 "Strajk w MPK"
 trn_pol.2.d:0 "Kierowcy tramwajów i autobusów od dwóch miesięcy nie dostali pensji. Zajezdnia przy Rubinkowie stoi, a miasto stoi w korkach i na przystankach."
 trn_pol.2.a:0 "Wypłacić zaległości z rezerwy."
 trn_pol.2.b:0 "Zastąpić strajkujących ochotnikami."
 trn_pol.2.c:0 "Niech dzielnice same zorganizują przewozy."
 TRN_tt_15:0 "Wpływy: Zaleski §G+6§!, Elana §R-4§!\n§YBydgoskie Przedmieście§! przechodzi pod kontrolę: Zaleski"
 TRN_tt_16:0 "Wpływy: Elana §G+8§!, Gulewski §R-2§!\n§YBydgoskie Przedmieście§! przechodzi pod kontrolę: Elana"
 TRN_tt_17:0 "Wpływy: Krevienko §G+5§!, Kowalczyk §G+3§!\nWpływy lokalne Rady: §G+5§!"
 trn_pol.3.t:0 "Zadyma po meczu"
 trn_pol.3.d:0 "Po meczu Elany kibice starli się z policją na Bydgoskim Przedmieściu. W nocy płonęły śmietniki, a rano na murach pojawiły się hasła „Toruń dla Torunian”."
 trn_pol.3.a:0 "Policja ma przywrócić porządek."
 trn_pol.3.b:0 "Trzeba rozmawiać z kibicami."
 trn_pol.3.c:0 "Mieszkańcy tworzą straże sąsiedzkie."
 TRN_tt_18:0 "Wpływy: Kowalczyk §G+8§!\n§YChełmińskie Przedmieście§! przechodzi pod kontrolę: Kowalczyk"
 TRN_tt_19:0 "Wpływy: Romanowski §G+5§!, Gulewski §G+3§!"
 TRN_tt_20:0 "Wpływy: Zaleski §G+3§!, Kowalczyk §R-3§!"
 trn_pol.4.t:0 "Szkoły bez ogrzewania"
 trn_pol.4.d:0 "W połowie toruńskich szkół – od Chełmińskiego Przedmieścia po Bielany – jest zimniej niż na korytarzu Ratusza. Rodzice organizują zbiórki opału, a nauczyciele uczą w kurtkach."
 trn_pol.4.a:0 "Wesprzeć komitet rodziców Kowalczyk."
 trn_pol.4.b:0 "Miejski program remontów."
 trn_pol.4.c:0 "Szkoły muszą poczekać."
 TRN_tt_21:0 "Wpływy: Krevienko §G+8§!\n§YNa Skarpie§! przechodzi pod kontrolę: Krevienko"
 TRN_tt_22:0 "Wpływy: Zaleski §G+4§!, Elana §G+4§!, Krevienko §R-5§!"
 TRN_tt_23:0 "Wpływy: Gulewski §G+4§!, Krevienko §G+3§!\n§YStare Miasto§! przechodzi pod kontrolę: Gulewski"
 trn_pol.5.t:0 "Mówca na Rynku"
 trn_pol.5.d:0 "Na Rynku Staromiejskim od kilku dni przemawia Maksim Andrei Krevienko. Mówi, że miasto nie potrzebuje Ratusza, tylko zgromadzeń, kooperatyw i sąsiedzkiej samoobrony. Tłum rośnie z każdym dniem."
 trn_pol.5.a:0 "Pozwolić mu mówić."
 trn_pol.5.b:0 "Rozpędzić zgromadzenie."
 trn_pol.5.c:0 "Zaprosić go do debaty w Ratuszu."
 TRN_tt_24:0 "Wpływy: Romanowski §G+8§!, Zaleski §R-3§!\n§YNa Skarpie§! przechodzi pod kontrolę: Romanowski"
 TRN_tt_25:0 "Wpływy: Gulewski §G+5§!, Romanowski §G+2§!"
 TRN_tt_26:0 "Wpływy: Zaleski §G+5§!, Romanowski §R-3§!"
 TRN_tt_27:0 "Wpływy: Krevienko §G+6§!\n§YNa Skarpie§! przechodzi pod kontrolę: Krevienko"
 trn_pol.6.t:0 "Czynsze w górę"
 trn_pol.6.d:0 "Właściciele mieszkań podnoszą czynsze, bo nikt nie wie, ile jutro będzie wart pieniądz. Na Skarpie i Rubinkowie pierwsze rodziny trafiają na bruk."
 trn_pol.6.a:0 "Zamrozić czynsze w zasobie miejskim."
 trn_pol.6.b:0 "Miejski dodatek mieszkaniowy dla najuboższych."
 trn_pol.6.c:0 "Zostawić to rynkowi."
 trn_pol.6.e:0 "Lokatorzy zajmują puste mieszkania."
 TRN_tt_28:0 "Wpływy: Kowalczyk §G+8§!, Gulewski §G+2§!, Elana §G+3§!\n§YBielany (kampus UMK)§! przechodzi pod kontrolę: Kowalczyk"
 TRN_tt_29:0 "Wpływy: Gulewski §G+4§!, Kowalczyk §R-2§!"
 TRN_tt_30:0 "Wpływy: Elana §G+5§!, Zaleski §G+3§!, Kowalczyk §R-3§!"
 trn_pol.7.t:0 "Pomoc z Frankfurtu"
 trn_pol.7.d:0 "Partnerskie samorządy z Niemiec proponują Toruniowi generatory, leki i doradców. Warunek – przejrzysty budżet i kontrola wydatków. Komitet Obywatelski od tygodni zabiegał o tę pomoc, a nacjonaliści już mówią o „niemieckich komisarzach”."
 trn_pol.7.a:0 "Przyjąć pomoc na warunkach partnerów."
 trn_pol.7.b:0 "Przyjąć tylko generatory, bez kontroli."
 trn_pol.7.c:0 "Toruń poradzi sobie sam."
 TRN_tt_31:0 "Wpływy: Gulewski §G+7§!\n§YStare Miasto§! przechodzi pod kontrolę: Gulewski"
 TRN_tt_32:0 "Wpływy: Zaleski §G+7§!, Gulewski §R-3§!\n§YStare Miasto§! przechodzi pod kontrolę: Zaleski"
 TRN_tt_33:0 "Wpływy: Romanowski §G+3§!, Kowalczyk §G+3§!, Gulewski §R-3§!, Zaleski §R-3§!"
 trn_pol.8.t:0 "Urzędnicy apelują o ciągłość"
 trn_pol.8.d:0 "Naczelnicy wydziałów Ratusza piszą list otwarty: miasto przetrwa tylko wtedy, gdy urzędy będą działać bez przerw. Jedni chcą utrzymać obecną ekipę, inni – przywrócić doświadczonych ludzi z dawnych lat."
 trn_pol.8.a:0 "Utrzymać obecną ekipę Ratusza."
 trn_pol.8.b:0 "Przywrócić doświadczonych urzędników z dawnych lat."
 trn_pol.8.c:0 "Czas na nowych ludzi."
 TRN_tt_faw_m4:0 "Faworyt Rady (§Y[GetTRNFaworyt]§!): §R−4§! wpływów."
 TRN_tt_ryw6:0 "Najsilniejszy rywal (§Y[GetTRNRywal]§!): §G+6§! wpływów."
 trn_pol.30.t:0 "Koalicja przeciw faworytowi"
 trn_pol.30.d:0 "Rywale [GetTRNFaworyt] spotkali się w nocy w kamienicy przy Szerokiej. Rano ogłosili wspólny front – na czele stanął [GetTRNRywal]."
 trn_pol.30.a:0 "Pójść na ustępstwa wobec rywali."
 trn_pol.30.b:0 "Nie ustępować."
 TRN_tt_lok25:0 "Wpływy lokalne Rady: §R−25§!"
 TRN_tt_faw_m2:0 "Faworyt Rady (§Y[GetTRNFaworyt]§!): §R−2§! wpływów."
 TRN_tt_faw_m8:0 "Faworyt Rady (§Y[GetTRNFaworyt]§!): §R−8§! wpływów."
 trn_pol.31.t:0 "Skandal w otoczeniu faworyta"
 trn_pol.31.d:0 "Lokalny portal publikuje nagrania z zamkniętego spotkania ludzi [GetTRNFaworyt]. Rywale żądają dymisji, a mieszkańcy pytają, czy Rada nie wybrała sobie złego partnera."
 trn_pol.31.a:0 "Wyciszyć sprawę przez znajomych w dzielnicach."
 trn_pol.31.b:0 "Przyjąć dymisje."
 TRN_tt_bunt:0 "Jedna z przejętych dzielnic wraca do frakcji, która rządziła nią przed kryzysem (ona §G+3§!, faworyt §R−3§!)."
 TRN_tt_lok15:0 "Wpływy lokalne Rady: §R−15§!"
 trn_pol.32.t:0 "Bunt w dzielnicy"
 trn_pol.32.d:0 "Mieszkańcy jednej z dzielnic przejętych przez [GetTRNFaworyt] wychodzą na ulice. Lokalni liderzy żądają powrotu dawnych porządków."
 trn_pol.32.a:0 "Opłacić lokalnych liderów."
 trn_pol.32.b:0 "Oddać dzielnicę."
 TRN_tt_faw_m3:0 "Faworyt Rady (§Y[GetTRNFaworyt]§!): §R−3§! wpływów."
 TRN_tt_inni3:0 "Wszystkie frakcje poza faworytem: §G+3§! wpływów."
 trn_pol.33.t:0 "Zamieszki"
 trn_pol.33.d:0 "Zwolennicy [GetTRNFaworyt] świętują na ulicach, a przeciwnicy wychodzą im naprzeciw. Kamienie lecą przez całą noc. Reszta miasta boi się, kto przejmie Ratusz."
 trn_pol.33.a:0 "Spacyfikować własnych zwolenników."
 trn_pol.33.b:0 "Przeczekać."
 TRN_tt_faw0:0 "Rada cofa poparcie: §Yfaworyt zostaje odwołany§! (decyzje dzielnic nieaktywne do kolejnego wsparcia)."
 TRN_tt_inni2:0 "Wszystkie frakcje poza faworytem: §G+2§! wpływów."
 trn_pol.34.t:0 "Rada traci cierpliwość"
 trn_pol.34.d:0 "Stabilność miasta spadła tak nisko, że radni z Rady Tymczasowej buntują się przeciw własnemu kursowi. Żądają zerwania współpracy z [GetTRNFaworyt]."
 trn_pol.34.a:0 "Przekupić radnych."
 trn_pol.34.b:0 "Zerwać współpracę."
 trn_pol.29.t:0 "Rywale się jednoczą"
 trn_pol.29.d:0 "[GetTRNFaworyt] wyraźnie prowadzi w walce o Ratusz. Pozostałe środowiska zaczynają współpracować przeciw faworytowi Rady – najmocniej [GetTRNRywal]."
 trn_pol.29.a:0 "Spodziewaliśmy się tego."
 TRN_tt_34:0 "Wpływy: Krevienko §G+2§!, Romanowski §G+2§!\nWpływy lokalne Rady: §G+10§!"
 TRN_tt_35:0 "Wpływy: Zaleski §G+2§!"
 TRN_tt_36:0 "Wpływy: Gulewski §G+3§!, Zaleski §G+3§!"
 trn_pol.40.t:0 "Kto rządzi wydziałami?"
 trn_pol.40.d:0 "Połowa wydziałów Ratusza słucha Rady Tymczasowej, druga połowa – swoich dawnych szefów. Trzeba zdecydować, kto podpisuje decyzje."
 trn_pol.40.a:0 "Pełnomocnicy dzielnic przejmą sprawy lokalne."
 trn_pol.40.b:0 "Komisarz Rady Tymczasowej nad wszystkimi wydziałami."
 trn_pol.40.c:0 "Zostawić naczelników wydziałów."
 TRN_tt_37:0 "Wpływy: Romanowski §G+4§!, Zaleski §G+2§!"
 TRN_tt_38:0 "Wpływy: Zaleski §G+3§!"
 TRN_tt_39:0 "Wpływy: Romanowski §G+3§!, Gulewski §G+1§!, Zaleski §R-2§!"
 trn_pol.41.t:0 "Skarbnik bije na alarm"
 trn_pol.41.d:0 "Skarbnik miasta przynosi do Rady jedną kartkę: pieniędzy wystarczy na sześć tygodni. Trzeba ciąć, pożyczać albo szukać nowych dochodów."
 trn_pol.41.a:0 "Cięcia we wszystkich wydziałach."
 trn_pol.41.b:0 "Pożyczka w banku."
 trn_pol.41.c:0 "Podatek od pustostanów."
 trn_pol.10.t:0 "Nowa władza w Toruniu"
 trn_pol.10.d:0 "Kryzys dobiegł końca. [GetTRNZwyciezca] przejmuje Ratusz, a Rada Tymczasowa składa urzędy.\n\nObecna ekipa Ratusza (Gulewski): [?TRN_frak_gul|0]\nStara gwardia samorządu (Zaleski): [?TRN_frak_zal|0]\nToruń dla Mieszkańców (Romanowski): [?TRN_frak_rom|0]\nKomitet Obywatelski (Kowalczyk): [?TRN_frak_kow|0]\nNacjonaliści Elany: [?TRN_frak_ela|0]\nFederacja Wolnych Dzielnic (Krevienko): [?TRN_frak_kre|0]"
 trn_pol.10.a:0 "Władzę przejmuje: Obecna ekipa Ratusza (Gulewski)."
 trn_pol.10.b:0 "Władzę przejmuje: Stara gwardia samorządu (Zaleski)."
 trn_pol.10.c:0 "Władzę przejmuje: Toruń dla Mieszkańców (Romanowski)."
 trn_pol.10.e:0 "Władzę przejmuje: Komitet Obywatelski (Kowalczyk)."
 trn_pol.10.f:0 "Władzę przejmuje: Nacjonaliści Elany."
 trn_pol.10.g:0 "Władzę przejmuje: Federacja Wolnych Dzielnic (Krevienko)."
 trn_pol.11.t:0 "Noc w Ratuszu"
 trn_pol.11.d:0 "Przewaga [GetTRNPrzegrany] była zbyt mała. W nocy przed ogłoszeniem wyniku rywale zawiązali koalicję radnych – i rano to [GetTRNZwyciezca] przejmuje Ratusz.\n\nObecna ekipa Ratusza (Gulewski): [?TRN_frak_gul|0]\nStara gwardia samorządu (Zaleski): [?TRN_frak_zal|0]\nToruń dla Mieszkańców (Romanowski): [?TRN_frak_rom|0]\nKomitet Obywatelski (Kowalczyk): [?TRN_frak_kow|0]\nNacjonaliści Elany: [?TRN_frak_ela|0]\nFederacja Wolnych Dzielnic (Krevienko): [?TRN_frak_kre|0]"
 trn_pol.11.a:0 "Władzę przejmuje: Obecna ekipa Ratusza (Gulewski)."
 trn_pol.11.b:0 "Władzę przejmuje: Stara gwardia samorządu (Zaleski)."
 trn_pol.11.c:0 "Władzę przejmuje: Toruń dla Mieszkańców (Romanowski)."
 trn_pol.11.e:0 "Władzę przejmuje: Komitet Obywatelski (Kowalczyk)."
 trn_pol.11.f:0 "Władzę przejmuje: Nacjonaliści Elany."
 trn_pol.11.g:0 "Władzę przejmuje: Federacja Wolnych Dzielnic (Krevienko)."
