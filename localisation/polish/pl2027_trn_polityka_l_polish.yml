 TRN_podzielone_miasto:0 "Podzielone miasto"
 TRN_podzielone_miasto_desc:0 "Sześć środowisk walczy o Ratusz i dzielnice. Urzędy nie wiedzą, czyje polecenia wykonywać, a mieszkańcy – komu ufać."
 TRN_kryzys_budzetu:0 "Kryzys miejskiego budżetu"
 TRN_kryzys_budzetu_desc:0 "Kasa miasta świeci pustkami. Inwestycje stoją, a każda wypłata to małe zwycięstwo skarbnika."
 TRN_dlug_miasta:0 "Dług miasta"
 TRN_dlug_miasta_desc:0 "Pożyczka uratowała wypłaty, ale raty trzeba spłacać z każdego przelewu do kasy miasta."
 TRN_dzielnice_mod:0 "Dzielnice faworyta Rady"
 TRN_dzielnice_mod_desc:0 "Korzyści z dzielnic, które kontroluje faworyt Rady Tymczasowej."
 TRN_dz_nazwa_stare:0 "Stare Miasto"
 TRN_dz_nazwa_chelminskie:0 "Chełmińskie Przedmieście"
