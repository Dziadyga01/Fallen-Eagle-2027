 ROS_p_mie_future_gi_policja_desc:0 "Nowa formacja pilnuje porządku w guberniach."
 ROS_p_mie_future_gi_final:0 "Imperium guberni"
 ROS_p_mie_future_gi_final_desc:0 "Rosja ma znowu administrację imperialną – i jej problemy."
