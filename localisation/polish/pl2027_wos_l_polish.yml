 TR2_gul_zt_chelmno_desc:0 "Stare miasto prawa chełmińskiego i jego gminy tworzą własne państwo. Dla Torunia to kolebka regionu – i ostatni brakujący kawałek."
 TR2_gul_zt_final:0 "Ziemia Toruńska"
 TR2_gul_zt_final_desc:0 "Od Chełmna po Gniewkowo – jedna administracja, jeden budżet i jedno wojsko. Toruń znowu jest stolicą regionu, a nie miastem w okrążeniu."
 TR2_gul_nowe_pokolenie:0 "Nowe pokolenie Ratusza"
 TR2_gul_nowe_pokolenie_desc:0 "W Ratuszu urzędnicy pracują przy świecach od miesięcy. Gulewski otwiera drzwi dla młodych – pierwszy raz od lat ktoś pod czterdziestkę dostaje własny gabinet."
 TR2_rom_zt_podgorz:0 "Podgórz wraca do miasta"
 TR2_rom_zt_podgorz_desc:0 "Lewobrzeżna dzielnica ogłosiła niezależność w pierwszych dniach chaosu. Most łączy oba brzegi Wisły – czas połączyć też urzędy."
 TR2_rom_zt_lysomice:0 "Łysomice"
 TR2_rom_zt_lysomice_desc:0 "Gmina na północ od miasta żyje z Torunia: tu pracuje, tu się leczy, tu kupuje. Granica na rogatkach nikomu nie służy."
 TR2_rom_zt_lubicz:0 "Lubicz"
 TR2_rom_zt_lubicz_desc:0 "Gmina nad Drwęcą jest przedmieściem Torunia z własnym wójtem i własną strażą. Wspólna administracja oznacza wspólny prąd, wodę i autobusy."
 TR2_rom_zt_zlawies:0 "Zławieś Wielka"
 TR2_rom_zt_zlawies_desc:0 "Republika Rozgarcka pilnuje mostu kolejowego i drogi na Bydgoszcz. Bez niej Toruń jest odcięty od zachodu."
 TR2_rom_zt_solec:0 "Solec Kujawski"
 TR2_rom_zt_solec_desc:0 "Wolne Miasto Solec leży między Toruniem a Bydgoszczą. Kto ma Solec, ten ma lewy brzeg Wisły aż po Puszczę Bydgoską."
 TR2_rom_zt_chelmza:0 "Chełmża"
 TR2_rom_zt_chelmza_desc:0 "Wolne Miasto Chełmża ma cukrownię, jezioro i drogę na Grudziądz. Ma też za mało ludzi, żeby samo się obronić."
 TR2_rom_zt_dabrowa:0 "Dąbrowa Chełmińska"
 TR2_rom_zt_dabrowa_desc:0 "Gmina na skarpie nad Wisłą zamyka drogę do Chełmna. Jej rada od miesięcy pyta, kto zapłaci za zimę."
 TR2_rom_zt_kujawy:0 "Gniewkowo, Rojewo i Aleksandrów"
 TR2_rom_zt_kujawy_desc:0 "Trzy gminy Republiki Kujawskiej leżą bliżej toruńskiego ratusza niż inowrocławskiego. Toruń chce tylko ich – nie całych Kujaw."
