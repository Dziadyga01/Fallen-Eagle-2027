 CPZ_P07:0 "Kordon przy alei Szucha"
 CPZ_P07_desc:0 "Protestujący pod Trybunałem blokują wjazd sędziom. Komenda Stołeczna dostaje plan ochrony siedziby Trybunału, Sejmu i budynków rządowych. (Historia alternatywna moda.)"
