 zpp.242.d:0 "Lublin proponuje wspólny fundusz inwestycyjny, kontrakty dla firm i drogę ekspresową. W zamian – jeden budżet i jeden rząd. Pieniądze są na stole. Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcja moda.)"
