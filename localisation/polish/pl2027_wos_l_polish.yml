 CPZ_tt_1a185e1e:0 "Kryzys konstytucyjny: §G-10§!"
 CPZ_tt_9b11887e:0 "Odblokowuje dodatkową decyzję pokojową w zdarzeniu „PREZYDENT POD TRYBUNAŁEM!”."
 CPZ_P15:0 "Projekt resetu Trybunału"
 CPZ_P15_desc:0 "Polska 2050 i Razem mówią o resecie: nowy skład Trybunału wybrany większością kwalifikowaną. Rząd przygotowuje własny projekt na wypadek, gdyby spór wybuchł pod Trybunałem. (Historia alternatywna moda.)"
