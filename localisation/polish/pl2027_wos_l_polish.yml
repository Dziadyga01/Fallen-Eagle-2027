 CPZ_P01:0 "Państwo na rozdrożu"
 CPZ_P01_desc:0 "Październik 2026. Rząd i prezydent nie uznają nawzajem swoich decyzji w sprawie Trybunału. Premier zwołuje sztab kryzysowy i dzieli pracę na trzy obszary: politykę, bezpieczeństwo i administrację. (Historia alternatywna moda.)"
 CPZ_tt_7651499e:0 "Lojalność administracji: §G+5§!"
