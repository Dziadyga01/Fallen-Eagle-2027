 zpp.240.t:0 "Umowa rozwojowa: Podlasie Nadbużańskie"
 zpp.240.d:0 "Lublin proponuje wspólny fundusz inwestycyjny, kontrakty dla firm i drogę ekspresową. W zamian – jeden budżet i jeden rząd. Pieniądze są na stole. Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcja moda.)"
 zpp.240.a:0 "Inwestycje są ważniejsze niż flagi."
 zpp.240.b:0 "Nie sprzedamy się za kontrakty."
 PRW_tt_reg_mo_pdl:0 "Podlasie Nadbużańskie dostaje propozycję: „Umowa rozwojowa: Podlasie Nadbużańskie”. Odmowa nie oznacza wojny – rozmowy można ponowić po 120 dniach."
