 CPZ_tt_c2ee869f:0 "Spójność koalicji: §G+8§!; Poparcie dla rządu: §G+3§!"
 CPZ_P12:0 "Utrzymać większość sejmową"
 CPZ_P12_desc:0 "Marszałek Czarzasty i premier rozmawiają z każdym klubem koalicji osobno. Bez większości nie będzie ani ślubowań w Sejmie, ani ustawy o Trybunale. (Historia alternatywna moda.)"
 CPZ_tt_cb24f0ef:0 "Napięcie społeczne: §G-6§!"
