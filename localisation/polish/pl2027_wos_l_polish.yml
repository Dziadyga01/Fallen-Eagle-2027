 ROS_p_mie_future_ig_fabryki_desc:0 "Zakłady produkują sprzęt dla armii imperium."
 ROS_p_mie_future_ig_final:0 "Gospodarka imperium"
 ROS_p_mie_future_ig_final_desc:0 "Imperium jest bogate – w każdym razie jego skarb."
