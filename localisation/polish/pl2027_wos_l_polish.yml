 cpz.600.t:0 "Warszawa: [PLC.GetNameDef]"
 cpz.600.d:0 "Komenda Stołeczna przestaje wykonywać polecenia obu stron. Policja pilnuje swoich dzielnic i nikogo nie słucha. (Historia alternatywna moda.)"
 cpz.600.a:0 "Stolica się rozpada."
 cpz.601.t:0 "Warszawa: [SMR.GetNameDef]"
 cpz.601.d:0 "Straż Marszałkowska zamyka Sejm. Marszałkowie ogłaszają, że parlament będzie bronił się sam. (Historia alternatywna moda.)"
 cpz.601.a:0 "Stolica się rozpada."
 cpz.602.t:0 "Warszawa: [MPR.GetNameDef]"
 cpz.602.d:0 "Gdy policja zniknęła z ulic Ursusa i Pruszkowa, porządek zaprowadzili ludzie, których nikt nie wybierał. (Historia alternatywna moda.)"
 cpz.602.a:0 "Stolica się rozpada."
 cpz.603.t:0 "Warszawa: [LEG.GetNameDef]"
 cpz.603.d:0 "Kibice Legii przejmują Mokotów i stadion. Mówią, że bronią dzielnicy przed wszystkimi. (Historia alternatywna moda.)"
 cpz.603.a:0 "Stolica się rozpada."
 cpz.604.t:0 "Warszawa: [PRG.GetNameDef]"
 cpz.604.d:0 "Praga ogłasza, że prawy brzeg Wisły nie będzie umierał za lewy. (Historia alternatywna moda.)"
 cpz.604.a:0 "Stolica się rozpada."
 cpz.605.t:0 "Warszawa: [WOJ.GetNameDef]"
 cpz.605.d:0 "Garnizony w Rembertowie i Wesołej odmawiają wykonywania rozkazów polityków. Wojsko staje się osobną siłą. (Historia alternatywna moda.)"
 cpz.605.a:0 "Stolica się rozpada."
 cpz.606.t:0 "Warszawa: [ZIE.GetNameDef]"
 cpz.606.d:0 "Bielany organizują własną administrację i straż obywatelską. (Historia alternatywna moda.)"
 cpz.606.a:0 "Stolica się rozpada."
 cpz.607.t:0 "Warszawa: [TEC.GetNameDef]"
 cpz.607.d:0 "Powiśle ogłasza samorządną republikę i otwiera granice dla wszystkich, którzy uciekają przed walkami. (Historia alternatywna moda.)"
 cpz.607.a:0 "Stolica się rozpada."
 cpz.608.t:0 "Warszawa: [KPR.GetNameDef]"
 cpz.608.d:0 "Kancelaria Prezydenta i SOP zostają w Belwederze jako osobny ośrodek – prezydent nie oddaje władzy w swojej dzielnicy. (Historia alternatywna moda.)"
 cpz.608.a:0 "Stolica się rozpada."
 CPZ_RP_PREZ:0 "Rzeczpospolita Polska (obóz prezydencki)"
 CPZ_RP_PREZ_DEF:0 "Rzeczpospolita Polska (obóz prezydencki)"
 CPZ_RP_PREZ_ADJ:0 "prezydencka"
 cpz.490.t:0 "Dwa ośrodki władzy"
 cpz.490.d:0 "Kancelaria Prezydenta ogłasza, że nie uznaje decyzji rządu, a rząd – że Pałac sprzeniewierzył się konstytucji. Części służb wykonują polecenia jednej strony, części drugiej. Regiony wybierają różnie: jedne popierają rząd, inne prezydenta, jeszcze inne żadnej ze stron. (Historia alternatywna moda – fikcyjny scenariusz wojny domowej.)"
 cpz.490.a:0 "Rzeczpospolita pęka."
 cpz.491.t:0 "Wojna domowa w Polsce"
 cpz.491.d:0 "W Polsce powstały dwa konkurencyjne ośrodki władzy: rząd Koalicji 15 Października i obóz prezydencko-opozycyjny. Część wojska i administracji przeszła na stronę Pałacu. (Historia alternatywna moda.)"
 cpz.491.a:0 "Świat patrzy na Warszawę."
 cpz.500.t:0 "KTO MA PRAWO RZĄDZIĆ POLSKĄ?"
 cpz.500.d:0 "Dwa ośrodki władzy, dwie armie, jedna stolica. Po której stronie stajesz?\n\n§WA§! – grasz dalej rządem Koalicji 15 Października.\n§WB§! – przejmujesz obóz prezydencko-opozycyjny.\n§WC§! – nie dołączasz do wojny: wybierasz województwo i przyszłe państwo regionalne. Przejmiesz je, gdy uzyska niepodległość."
 cpz.500.a:0 "A. Poprzeć Donalda Tuska."
 cpz.500.b:0 "B. Poprzeć obóz prezydencko-opozycyjny."
 cpz.500.c:0 "C. Pozostać neutralną Rzeczpospolitą."
 cpz.510.t:0 "Wybór regionu: województwo"
 cpz.510.d:0 "Najpierw województwo, potem miasto lub region. Gdy wybrane państwo uzyska niepodległość, przejmiesz nad nim kontrolę i zaczniesz lokalną kampanię z jego drzewkiem: niepodległość, ponowne zjednoczenie, federacja, sojusze regionalne albo własna droga ustrojowa."
 cpz.510.a:0 "Województwo: Pomorskie"
 cpz.510.b:0 "Województwo: Kujawsko-pomorskie"
 cpz.510.c:0 "Województwo: Wielkopolskie"
 cpz.510.e:0 "Województwo: Warmińsko-mazurskie"
 cpz.510.f:0 "Województwo: Podlaskie"
 cpz.510.g:0 "Województwo: Lubelskie"
 cpz.510.h:0 "Więcej województw…"
