 CPZ_S06:0 "Wzmocnić samorządność"
 CPZ_S06_desc:0 "Więcej pieniędzy i kompetencji dla województw, powiatów i gmin. (Historia alternatywna moda.)"
 CPZ_S07:0 "Odbudować zaufanie"
 CPZ_S07_desc:0 "Wspólne kampanie, debaty i komisje śledcze z udziałem obu obozów. (Historia alternatywna moda.)"
 CPZ_S08:0 "Program reform państwowych"
 CPZ_S08_desc:0 "Szybsze inwestycje, prostsze procedury, cyfrowe urzędy. (Historia alternatywna moda.)"
 CPZ_S09:0 "Nowy mandat demokratyczny"
