 cpz.511.d:0 "Najpierw województwo, potem miasto lub region. Gdy wybrane państwo uzyska niepodległość, przejmiesz nad nim kontrolę i zaczniesz lokalną kampanię z jego drzewkiem: niepodległość, ponowne zjednoczenie, federacja, sojusze regionalne albo własna droga ustrojowa."
