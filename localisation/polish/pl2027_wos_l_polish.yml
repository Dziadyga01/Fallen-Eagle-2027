 BYK_sup_brdowski_m6:0 "Poparcie: Wiktor Brdowski §R-6§!"
 BYK_kampania:0 "Kampania wyborcza w Bydgoszczy"
 BYK_kampania_desc:0 "Wybory odbywają się po fokusie §Y„Wybory nad Brdą”§!.\nSondaż: Rafał Bruski §Y[?BYD2_udzial_bruski|0]%§!, Rada Przemysłowa §Y[?BYD2_udzial_przemysl|0]%§!, Rady Robotnicze §Y[?BYD2_udzial_rady|0]%§!, płk Tomasz Fordoński §Y[?BYD2_udzial_junta|0]%§!, Wiktor Brdowski §Y[?BYD2_udzial_brdowski|0]%§!.\nWynik: wygrywa zarejestrowany komitet z największym poparciem (remis – kolejność na liście).\nWsparcie sztabu: najwyżej §Y2 razy§! dla jednego komitetu i §Y5 razy§! łącznie. Niska stabilność w czasie kampanii grozi puczem."
 BYK_req_limit:0 "Sztab może wesprzeć ten komitet najwyżej 2 razy (łącznie 5 razy)"
 BYK_wsp_bruski:0 "Wiec poparcia: Rafał Bruski"
 BYK_wsp_bruski_desc:0 "Sztab miejski organizuje wiec komitetu §YBydgoszcz Obywatelska§!: nagłośnienie, ulotki i autobusy dla wyborców."
 BYK_wsp_przemysl:0 "Wiec poparcia: Rada Przemysłowa"
 BYK_wsp_przemysl_desc:0 "Sztab miejski organizuje wiec komitetu §YRada Przemysłowa Bydgoszczy§!: nagłośnienie, ulotki i autobusy dla wyborców."
 BYK_wsp_rady:0 "Wiec poparcia: Rady Robotnicze"
 BYK_wsp_rady_desc:0 "Sztab miejski organizuje wiec komitetu §YBydgoskie Rady Robotnicze§!: nagłośnienie, ulotki i autobusy dla wyborców."
 BYK_wsp_junta:0 "Wiec poparcia: płk Tomasz Fordoński"
 BYK_wsp_junta_desc:0 "Sztab miejski organizuje wiec komitetu §YKomitet Bezpieczeństwa§!: nagłośnienie, ulotki i autobusy dla wyborców."
 BYK_wsp_brdowski:0 "Wiec poparcia: Wiktor Brdowski"
 BYK_wsp_brdowski_desc:0 "Sztab miejski organizuje wiec komitetu §YRuch „Bydgoszcz Pierwsza”§!: nagłośnienie, ulotki i autobusy dla wyborców."
 BYK_obserwatorzy:0 "Obserwatorzy wyborów"
 BYK_obserwatorzy_desc:0 "Zapraszamy obserwatorów z Torunia, Gdańska i kościołów. Mniej plotek o fałszerstwach, mniej powodów do puczu."
 byk.10.t:0 "Most Fordoński zamknięty"
 byk.10.d:0 "W nocy ktoś podpalił budkę kontrolną na Moście Fordońskim. Rano most stoi zamknięty, a Fordon jest odcięty od centrum. Każdy komitet ma gotowy pomysł – i każdy chce, żeby to jego ludzie otworzyli przejazd przed kamerami."
 byk.10.a:0 "Wojsko przejmuje kontrolę nad mostem."
 byk.10.b:0 "Brygady z zakładów naprawiają most społecznie."
 byk.10.c:0 "Remont zlecony firmom z Izby – szybko i za pieniądze."
 byk.11.t:0 "Strajk w Pesie"
 byk.11.d:0 "Hale Pesy stoją. Robotnicy chcą wypłat w złotówkach, nie w kartkach, i gwarancji, że linia nie zostanie przestawiona na zamówienia wojska. Właściciele grożą zamknięciem zakładu do wyborów."
 byk.11.a:0 "Poprzeć strajkujących."
 byk.11.b:0 "Mediacja ratusza: pół wypłaty w złotówkach."
 byk.11.c:0 "Zakład ma pracować – lokaut do odwołania."
 byk.12.t:0 "Wieczór w lokalnej telewizji"
 byk.12.d:0 "Wiktor Brdowski kupił godzinę czasu antenowego w lokalnej telewizji – festyn, konkursy i przemówienie o „Bydgoszczy pierwszej”. Pozostałe komitety żądają równego czasu, a dyrektor stacji pyta ratusz, co robić."
 byk.12.a:0 "Niech nadaje – kto zapłacił, ten ma czas."
 byk.12.b:0 "Równy czas dla wszystkich komitetów."
 byk.12.c:0 "Wspólna debata zamiast festynu."
 byk.13.t:0 "Patrole na Kapuściskach"
 byk.13.d:0 "Po serii kradzieży z piwnic na Kapuściskach pojawiają się patrole w mundurach. Komitet Bezpieczeństwa mówi o porządku, Rady Robotnicze o zastraszaniu wyborców, a mieszkańcy pytają, kto ich obroni po wyborach."
 byk.13.a:0 "Patrole zostają – mieszkańcy czują się bezpieczniej."
 byk.13.b:0 "Straż miejska zamiast wojska."
 byk.13.c:0 "Straże osiedlowe wybierane przez mieszkańców."
 BYK_falsz_bruski:0 "Komisja „przelicza” głosy: zwycięża Rafał Bruski."
 BYK_falsz_przemysl:0 "Komisja „przelicza” głosy: zwycięża Rada Przemysłowa."
 BYK_falsz_rady:0 "Komisja „przelicza” głosy: zwycięża Rady Robotnicze."
 BYK_falsz_junta:0 "Komisja „przelicza” głosy: zwycięża płk Tomasz Fordoński."
 BYK_falsz_brdowski:0 "Komisja „przelicza” głosy: zwycięża Wiktor Brdowski."
 BYK_wyniki_d:0 "Komisje liczą głosy przez całą noc. Rano Bydgoszcz zna wynik:\nRafał Bruski – §Y[?BYD2_wynik_bruski|0]%§!\nRada Przemysłowa – §Y[?BYD2_wynik_przemysl|0]%§!\nRady Robotnicze – §Y[?BYD2_wynik_rady|0]%§!\npłk Tomasz Fordoński – §Y[?BYD2_wynik_junta|0]%§!\nWiktor Brdowski – §Y[?BYD2_wynik_brdowski|0]%§!\n(Liczą się tylko zarejestrowane komitety; 0% oznacza komitet niedopuszczony do wyborów. Zwycięzca z poparciem poniżej 20 oznacza kontrowersyjny wynik. Ogłoszenie innego zwycięzcy to fałszerstwo: stabilność §R-12%§! i kontrowersyjny wynik przez rok.)"
 DZ_BLR_kat:0 "Białoruś: rząd"
 DZ_BLR_kat_desc:0 "Bieżące decyzje rządu w Mińsku: pobór we wschodnich obwodach i zamówienia dla przemysłu."
 BLR_pobor_wschod:0 "Pobór w obwodach wschodnich"
 BLR_pobor_wschod_desc:0 "Komisje wojskowe w Mińsku, Homlu, Mohylewie i Witebsku powołują kolejny rocznik. Rekruci jadą koleją na zachód."
 BLR_zamowienia_maz:0 "Zamówienia w zakładach MAZ i BiełAZ"
 BLR_zamowienia_maz_desc:0 "Fabryki ciężarówek z Mińska i Żodzina dostarczają pojazdy i ciągniki dla armii."
 FED_dec_centralizacja:0 "Centralizacja władzy"
 FED_dec_centralizacja_desc:0 "Olsztyn przejmuje kolejne kompetencje. Zjednoczenie przyspiesza, niezadowolenie rośnie."
 FED_dec_mazury:0 "Wspierać Mazury"
 FED_dec_mazury_desc:0 "Inwestycje i stanowiska dla Mazurów. Warmia będzie niezadowolona."
 FED_dec_pojednanie:0 "Kongres pojednania"
 FED_dec_pojednanie_desc:0 "Zjazd przedstawicieli obu regionów w Mrągowie."
 FED_dec_warmia:0 "Wspierać Warmię"
 FED_dec_warmia_desc:0 "Inwestycje i stanowiska dla Warmiaków. Mazury będą niezadowolone."
 DZ_KOR_kat:0 "Korporacja: zarząd"
 DZ_KOR_kat_desc:0 "Bieżące decyzje zarządu: dywidendy, akcje, ceny na stacjach i rezerwy ropy. Kurs akcji: §Y[?KOR_kurs|0]§!."
 KOR_dywidenda:0 "Wypłata dywidendy"
 KOR_dywidenda_desc:0 "Zysk trafia do „akcjonariuszy”, czyli do budżetu państwa. Rynek nie lubi, kiedy spółka wydaje gotówkę, ale państwo potrzebuje władzy politycznej."
 KOR_emisja_akcji:0 "Emisja akcji"
 KOR_emisja_akcji_desc:0 "Nowe akcje, nowi inwestorzy, nowa fabryka. Kurs spada, bo zysk trzeba dzielić z większą liczbą udziałowców."
 KOR_podwyzka_cen:0 "Podwyżka cen na stacjach"
 KOR_podwyzka_cen_desc:0 "Litr kosztuje więcej, marża rośnie, a kierowcy klną pod dystrybutorami. Rynek jest zachwycony, obywatele – mniej."
 KOR_promocja:0 "Promocja „Tankuj taniej”"
 KOR_promocja_desc:0 "Cena na totemach spada o kilkadziesiąt groszy. Kolejki pod stacjami ciągną się aż do Wisły, a popularność Zarządu rośnie."
 KOR_rezerwa:0 "Zakup interwencyjny ropy"
 KOR_rezerwa_desc:0 "Gdy zbiorniki pustoszeją, Koncern kupuje ropę na wolnym rynku – drogo, szybko i bez negocjacji."
 KOR_skup_akcji:0 "Skup akcji własnych"
 KOR_skup_akcji_desc:0 "Zarząd skupuje własne akcje, żeby uspokoić rynek. Kosztuje to trochę politycznego kapitału, ale wykres znów idzie w górę."
 DZ_PKP_kat:0 "PKP: zarząd kolei"
 DZ_PKP_kat_desc:0 "Bieżące decyzje zarządu kolei: akcje, kontrole SOK i wojenny rozkład jazdy."
 PKP_emisja_akcji:0 "Emisja akcji"
 PKP_emisja_akcji_desc:0 "Nowa transza akcji Holdingu trafia do obywateli. Kupno jest dobrowolne, ale bez akcji nie można kupić biletu miesięcznego."
 PKP_nalot_sok:0 "Nalot SOK na gapowiczów"
 PKP_nalot_sok_desc:0 "Funkcjonariusze SOK przeczesują pociągi i dworce. Złapani gapowicze mają wybór: grzywna albo dwa lata służby w Straży."
 PKP_wojenny_rozklad_dec:0 "Wojenny rozkład jazdy"
 PKP_wojenny_rozklad_dec_desc:0 "Wszystkie składy pasażerskie zostają odwołane. Tory służą wyłącznie przerzutowi wojsk i amunicji."
 DZ_ROS_kat:0 "Rosja: sztab operacji"
 DZ_ROS_kat_desc:0 "Bieżące decyzje sztabu: posiłki, most powietrzny do Królewca i mobilizacja."
 ROS_dec_mobilizacja:0 "Mobilizacja w obwodzie"
 ROS_dec_mobilizacja_desc:0 "Kolejna fala wezwań do wojska. Mieszkańcy obwodu mają coraz mniej cierpliwości."
 ROS_dec_most:0 "Most powietrzny"
 ROS_dec_most_desc:0 "Samoloty transportowe przywiozą amunicję i broń dla obwodu."
 ROS_dec_posilki:0 "Posiłki z Moskwy"
 ROS_dec_posilki_desc:0 "Dwie batalionowe grupy taktyczne przejadą przez Białoruś albo przypłyną z Ust-Ługi."
 DZ_TPZ_kat:0 "Sieć sklepów: zarząd"
 DZ_TPZ_kat_desc:0 "Bieżące decyzje zarządu sieci: promocje, ceny, dostawy i punkty lojalnościowe."
 TPZ_dec_podwyzka:0 "Podwyżka cen w całej sieci"
 TPZ_dec_podwyzka_desc:0 "Inflacja, ceny mąki i koszty paliwa – zarząd tłumaczy, klienci liczą. Budżet zyska, nastroje stracą."
 TPZ_dec_promocja:0 "Promocja 2+1"
 TPZ_dec_promocja_desc:0 "Druga pizza za pół ceny, trzecia gratis. Księgowość płacze, klienci się cieszą."
 TPZ_dec_punkty:0 "Wymiana punktów lojalnościowych"
 TPZ_dec_punkty_desc:0 "Obywatele wymieniają zebrane punkty na pizzę, bilety na mecz Anwilu i inne nagrody."
 TPZ_dec_weekend:0 "Darmowa dostawa w weekend"
 TPZ_dec_weekend_desc:0 "Przez najbliższy miesiąc w soboty i niedziele dowozimy za darmo – do każdego bloku i każdej wsi."
 ZKR_dec_doradcy:0 "Przyjąć doradców (+15%)"
 ZKR_dec_doradcy_desc:0 "Rosyjscy oficerowie przejmą szkolenie chorągwi."
 ZKR_dec_dostawy:0 "Rosyjskie dostawy (+10%)"
 ZKR_dec_dostawy_desc:0 "Transport broni i amunicji z Królewca."
 ZKR_dec_odsunac:0 "Odsunąć oficerów (−10%)"
 ZKR_dec_odsunac_desc:0 "Najbardziej prorosyjscy oficerowie zostaną przeniesieni do odległych komturii."
 ZKR_dec_wzmocnic:0 "Wzmocnić Zakon (−15%)"
 ZKR_dec_wzmocnic_desc:0 "Kapituła przejmuje z powrotem kontrolę nad skarbem i sztabem."
 WOS_tt_71:0 "Wojna tylko z jednym państwem (Warmia-Mazury, a gdy go nie ma – Suwalszczyzna albo Mazowsze). Członkowie Sojuszu Mazurskiego mogą stanąć w jego obronie."
 WOS_tt_72:0 "Wojna tylko z jednym państwem – tym, które trzyma kluczowe miasta celu."
 WOS_tt_73:0 "Sztab ma plan. Operację rozpoczyna fokus „Druga operacja mazurska” w drzewku – wojna tylko z jednym państwem."
 ROS_req_druga_gotowa:0 "Sztab przygotował drugą operację (decyzja „Druga operacja mazurska”)"
 RKK_panel:0 "Korona Polska: prawomocność korony"
 RKK_panel_desc:0 "Prawomocność korony: §Y[?KKR_korona|0]§!/100, siła pretendentów: §R[?KKR_pretendenci|0]§!/100\n§YCel:§! prawomocność co najmniej 60 – sejmiki słuchają Siedlec, a pretendenci tracą poparcie.\n§YKoszt:§! sejmiki ziemskie i uroczystości kosztują władzę polityczną; układ z pretendentem uspokaja dwór, ale osłabia koronę.\n§YZaniedbanie:§! prawomocność spada o 1 co miesiąc, pretendenci rosną o 2 (o 3, gdy korona jest słaba). Od 70 – rokosz."
 RKK_dm:0 "Korona Polska: prawomocność korony"
 RKK_dec_sejmik:0 "Sejmik ziemski"
 RKK_dec_sejmik_desc:0 "Szlachta, sołtysi i radni zjeżdżają do Siedlec. Każdy wyjeżdża z przywilejem – i z przekonaniem, że korona go słucha."
 RKK_dec_insygnia:0 "Insygnia w procesji"
 RKK_dec_insygnia_desc:0 "Kopie insygniów koronnych w procesji przez Węgrów i Sokołów. Ludzie wychodzą z domów, żeby zobaczyć koronę."
 RKK_dec_uklad:0 "Układ z pretendentem"
 RKK_dec_uklad_desc:0 "Najgroźniejszy z pretendentów dostaje urząd marszałka dworu i dobra pod Łukowem. Przestaje spiskować – na razie."
 rkk.10.t:0 "Rokosz"
 rkk.10.d:0 "Pretendent ogłasza w Białej Podlaskiej, że obecny władca nie ma prawa do korony. Część sejmików przyłącza się do rokoszu."
 rkk.10.a:0 "Sejm elekcyjny rozstrzygnie spór."
 rkk.10.b:0 "Stłumić rokosz."
 RKP_panel:0 "Republika Pomorska: Kaszuby i porty"
 RKP_panel_desc:0 "Jedność Kaszub i Pomorza: §Y[?KPM_jednosc|0]§!/100, porty i energia: §Y[?KPM_porty|0]§!/100\n§YCel:§! jedność co najmniej 50 i porty co najmniej 60 – republika ma pieniądze z morza i spokój w gminach.\n§YKoszt:§! farmy wiatrowe i inwestycje w porty rozwijają gospodarkę, ale budzą spór z gminami kaszubskimi; szkoły i sejmik kaszubski budują jedność.\n§YZaniedbanie:§! porty tracą 2 co miesiąc, jedność 1. Poniżej 25 jedności – sejmik kaszubski grozi odejściem."
 RKP_dm:0 "Republika Pomorska: Kaszuby i porty"
 RKP_dec_szkoly:0 "Szkoły kaszubskie"
 RKP_dec_szkoly_desc:0 "Język kaszubski w szkołach, tablice w dwóch językach i pieniądze dla zrzeszeń. Gminy czują, że republika jest także ich."
 RKP_dec_wiatraki:0 "Farmy wiatrowe na wybrzeżu"
 RKP_dec_wiatraki_desc:0 "Turbiny między Łebą a Ustką. Prąd dla Słupska – i protesty w gminach, które nikt nie pytał o zdanie."
 RKP_dec_porty:0 "Inwestycje w Ustce i Łebie"
 RKP_dec_porty_desc:0 "Nowe nabrzeża, chłodnie i kutry. Ryby z Ustki znowu jadą w głąb kraju."
 rkp.10.t:0 "Sejmik kaszubski grozi odejściem"
 rkp.10.d:0 "Delegaci sejmiku kaszubskiego opuszczają Radę Republiki. W Kartuzach mówi się o własnej drodze – bez Słupska."
 rkp.10.a:0 "Autonomia dla gmin kaszubskich."
 rkp.10.b:0 "Republika jest jedna i niepodzielna."
 RML_panel:0 "Ziemia Mławska: korytarz S7"
 RML_panel_desc:0 "Ruch na S7: §Y[?MLA_s7|0]§!/100, gotowość Reduty: §Y[?MLA_reduta|0]§!/100\n§YCel:§! ruch co najmniej 50 – tranzyt z Gdańska do Warszawy zostawia w Mławie pieniądze; Reduta co najmniej 60 – nikt nie przejdzie bez zgody.\n§YKoszt:§! myto daje władzę, ale odstrasza przewoźników; konwoje i prace na Reducie kosztują.\n§YZaniedbanie:§! ruch spada o 2 co miesiąc (o 4 w czasie wojny), Reduta o 1. Poniżej 20 ruchu – korytarz zamiera."
 RML_dm:0 "Ziemia Mławska: korytarz S7"
 RML_dec_myto:0 "Myto na S7"
 RML_dec_myto_desc:0 "Szlaban pod Mławą i cennik na tablicy. Każda ciężarówka płaci – i część z nich wybiera objazd."
 RML_dec_konwoje:0 "Konwoje z Gdańska"
 RML_dec_konwoje_desc:0 "Straż Ziemi eskortuje kolumny ciężarówek od Płońska po Nidzicę. Przewoźnicy wracają na S7."
 RML_dec_reduta:0 "Prace na Reducie Mławskiej"
 RML_dec_reduta_desc:0 "Schrony z 1939 roku dostają nowe stropy, a pola między nimi – rowy przeciwpancerne."
 rml.10.t:0 "Korytarz zamarł"
 rml.10.d:0 "Na S7 nie ma ciężarówek. Zajazdy zamykają się, a stacje paliw nie mają klientów. Mława żyła z drogi – teraz droga jest pusta."
 rml.10.a:0 "Zawiesić myto i zaprosić przewoźników."
 rml.10.b:0 "Przeczekać – wrócą, gdy zrobi się bezpieczniej."
 RNA_panel:0 "Państwo Narodowe: porządek i Kurpie"
 RNA_panel_desc:0 "Porządek narodowy: §Y[?NAR_porzadek|0]§!/100, gniew Kurpiów: §R[?NAR_kurpie|0]§!/100\n§YCel:§! porządek co najmniej 60 przy gniewie Kurpiów poniżej 50.\n§YKoszt:§! bataliony na ulicach podnoszą porządek, ale i gniew; sejmiki kurpiowskie uspokajają puszczę kosztem władzy centrum.\n§YZaniedbanie:§! porządek spada o 1 co miesiąc, gniew rośnie o 1 (o 2 przy porządku powyżej 70 – represje). Od 70 – puszcza się burzy."
 RNA_dm:0 "Państwo Narodowe: porządek i Kurpie"
 RNA_dec_bataliony:0 "Bataliony na ulicach"
 RNA_dec_bataliony_desc:0 "Patrole Batalionów Narodowych w Łomży i Ostrołęce. Na ulicach jest spokojnie – w puszczy coraz głośniej."
 RNA_dec_sejmiki:0 "Sejmiki kurpiowskie"
 RNA_dec_sejmiki_desc:0 "Kurpie dostają własne sejmiki i prawo do lasu. Komitet Narodowy krzywi się, ale puszcza milknie."
 RNA_dec_mleko:0 "Mleko i piwo dla miast"
 RNA_dec_mleko_desc:0 "Mleczarnie z Piątnicy i browar w Łomży pracują dla państwa. Pełne sklepy uspokajają jedno i drugie."
 rna.10.t:0 "Puszcza się burzy"
 rna.10.d:0 "W Puszczy Zielonej ktoś spalił posterunek Batalionów. Kurpie nie oddają broni myśliwskiej i nie wpuszczają patroli do wsi."
 rna.10.a:0 "Rozmowy z sołtysami."
 rna.10.b:0 "Obława w puszczy."
 RSU_panel:0 "Suwalszczyzna: przesmyk"
 RSU_panel_desc:0 "Zaufanie Wilna: §Y[?SUW_litwa|0]§!/100, presja Rosji: §R[?SUW_presja|0]§!/100\n§YCel:§! zaufanie Litwy co najmniej 50 i presja poniżej 50 – przesmyk jest wspólną sprawą, a nie polem prowokacji.\n§YKoszt:§! patrole i umocnienia kosztują władzę; handel przez Via Baltica daje pieniądze, ale ruch na granicy przyciąga uwagę Rosji.\n§YZaniedbanie:§! presja rośnie o 2 co miesiąc (o 3, gdy Rosja prowadzi wojnę); silna Litwa (przesmyk powyżej 60) ją zmniejsza. Od 75 – prowokacje na granicy."
 RSU_dm:0 "Suwalszczyzna: przesmyk"
 RSU_dec_patrole:0 "Wspólne patrole z Litwą"
 RSU_dec_patrole_desc:0 "Strażnicy z Suwałk i z Łoździej patrolują razem granicę z Obwodem. Litwini widzą, że nie są sami."
 RSU_dec_umocnienia:0 "Umocnienia przesmyku"
 RSU_dec_umocnienia_desc:0 "Zapory, rowy i stanowiska ogniowe między Budziskiem a Gołdapią."
 RSU_dec_via:0 "Handel przez Via Baltica"
 RSU_dec_via_desc:0 "Ciężarówki z Kowna jadą przez Suwałki. Dobre pieniądze – i dobry powód dla Rosji, żeby patrzeć na drogę."
 rsu.10.t:0 "Prowokacje na granicy"
 rsu.10.d:0 "Rosyjskie drony nad Wiżajnami, ostrzał posterunku pod Gołdapią i „zgubiony” patrol, który przekroczył granicę. Wilno pyta, co zamierzamy."
 rsu.10.a:0 "Wspólna odpowiedź z Litwą."
 rsu.10.b:0 "Nie dawać pretekstu – wycofać patrole."
 GDP_panel:0 "Gdynia: ruch w porcie"
 GDP_panel_desc:0 "Ruch w porcie: §Y[?GDY_port|0]§!/100\n§YCel:§! co najmniej 60 – port zarabia na państwo, a flota ma paliwo i części.\n§YKoszt:§! eskorty konwojów i pogłębianie toru kosztują władzę polityczną.\n§YZaniedbanie:§! bez eskort armatorzy omijają Gdynię – ruch spada o 3 co miesiąc (o 6 w czasie wojny). Poniżej 20 – port stoi."
 GDP_dm:0 "Gdynia: ruch w porcie"
 GDP_dec_konwoj:0 "Eskorta konwoju"
 GDP_dec_konwoj_desc:0 "Kutry Marynarki Wojennej eskortują statki z Danii i Szwecji. Armatorzy wracają do Gdyni."
 GDP_dec_tor:0 "Pogłębianie toru wodnego"
 GDP_dec_tor_desc:0 "Pogłębiarki pracują dzień i noc. Do Gdyni mogą wejść większe statki."
 GDP_dec_cla:0 "Podwyżka opłat portowych"
 GDP_dec_cla_desc:0 "Więcej pieniędzy dla miasta – i mniej statków w porcie."
 gdp.10.t:0 "Port stoi"
 gdp.10.d:0 "Przy nabrzeżach stoją tylko kutry. Dźwigi nie pracują, dokerzy idą do domów."
 gdp.10.a:0 "Zapłacić armatorom za powrót."
 gdp.10.b:0 "Przeczekać."
 SPK_panel:0 "Sopot: kurort i kapitał"
 SPK_panel_desc:0 "Kapitał kurortu: §Y[?SPT_kapital|0]§!/100, reputacja: §Y[?SPT_reputacja|0]§!/100\n§YCel:§! kapitał 70 przy reputacji co najmniej 40 – Sopot finansuje sąsiadów i kupuje wpływy.\n§YKoszt:§! kasyna i kapitał z niejasnych źródeł podnoszą kapitał, ale obniżają reputację.\n§YZaniedbanie:§! bez promocji turyści omijają kurort (kapitał −2 co miesiąc). Reputacja poniżej 20 – sąsiedzi odcinają się od Sopotu."
 SPK_dm:0 "Sopot: kurort i kapitał"
 SPK_dec_kasyno:0 "Nowa licencja kasyna"
 SPK_dec_kasyno_desc:0 "Kolejne kasyno przy Monciaku. Pieniądze płyną – razem z ludźmi, których nikt nie chce w mieście."
 SPK_dec_festiwal:0 "Festiwal w Operze Leśnej"
 SPK_dec_festiwal_desc:0 "Koncerty, transmisje i goście z całej Polski. Reputacja rośnie, kasa też – trochę."
 SPK_dec_pozyczka:0 "Pożyczka dla sąsiadów"
 SPK_dec_pozyczka_desc:0 "Sopot pożycza pieniądze Gdyni i Gdańskowi. Długi są lepsze niż wdzięczność."
 spk.10.t:0 "Skandal w kurorcie"
 spk.10.d:0 "Media w całej rozbitej Polsce piszą o praniu pieniędzy w sopockich kasynach. Gdańsk i Gdynia zamrażają wspólne projekty."
 spk.10.a:0 "Zamknąć dwa kasyna."
 spk.10.b:0 "Przeczekać – pieniądze nie śmierdzą."
 GDS_panel:0 "Gdańsk: stocznia"
 GDS_panel_desc:0 "Produkcja stoczni: §Y[?WMG_stocznia|0]§!/100, napięcie w stoczni: §R[?WMG_napiecie|0]§!/100\n§YCel:§! produkcja co najmniej 60 przy napięciu poniżej 50.\n§YKoszt:§! zamówienia i nadgodziny podnoszą produkcję, ale też napięcie; podwyżki i porozumienia z załogą obniżają napięcie, kosztują władzę polityczną.\n§YZaniedbanie:§! napięcie rośnie o 2 co miesiąc. Od 70 – strajk w stoczni (produkcja spada)."
 GDS_dm:0 "Gdańsk: stocznia"
 GDS_dec_zamowienie:0 "Zamówienie dla stoczni"
 GDS_dec_zamowienie_desc:0 "Kadłuby, barki i kutry dla sąsiadów. Praca na trzy zmiany."
 GDS_dec_podwyzki:0 "Podwyżki dla załogi"
 GDS_dec_podwyzki_desc:0 "Dyrekcja i komisja zakładowa podpisują porozumienie. Hala znów pracuje spokojnie."
 GDS_dec_zbrojenia:0 "Zbrojeniowa linia w stoczni"
 GDS_dec_zbrojenia_desc:0 "Część hal produkuje dla wojska. Lepsze pieniądze, ostrzejsze rygory."
 gds.10.t:0 "Strajk w stoczni"
 gds.10.d:0 "Załoga staje przy bramie numer dwa. Transparenty, flagi i lista postulatów – jak dawniej."
 gds.10.a:0 "Spełnić postulaty."
 gds.10.b:0 "Twardo: kto nie pracuje, ten nie zarabia."
 KNM_panel:0 "Konfederacja Północna: wolny rynek"
 KNM_panel_desc:0 "Wzrost gospodarczy: §Y[?NNA_wzrost|0]§!/100, nierówności: §R[?NNA_nierownosci|0]§!/100\n§YCel:§! wzrost co najmniej 60 przy nierównościach poniżej 60.\n§YKoszt:§! obniżki podatków i deregulacja podnoszą wzrost i nierówności; programy osłonowe obniżają nierówności, ale kosztują i spowalniają wzrost.\n§YZaniedbanie:§! nierówności rosną o 1 co miesiąc, gdy wzrost przekracza 50. Od 75 – niepokoje społeczne."
 KNM_dm:0 "Konfederacja Północna: wolny rynek"
 KNM_dec_podatki:0 "Obniżka podatków"
 KNM_dec_podatki_desc:0 "Niższe podatki dla firm i najlepiej zarabiających. Inwestycje rosną – razem z różnicami."
 KNM_dec_deregulacja:0 "Deregulacja"
 KNM_dec_deregulacja_desc:0 "Mniej zezwoleń, krótsze procedury, mniej kontroli. Firmy rosną szybciej, pracownicy mają mniej ochrony."
 KNM_dec_oslona:0 "Program osłonowy"
 KNM_dec_oslona_desc:0 "Bony na opał, darmowe obiady w szkołach i ulga dla najbiedniejszych. Libertarianie w rządzie krzywią się, ale ulica się uspokaja."
 knm.10.t:0 "Niepokoje w miastach"
 knm.10.d:0 "Demonstracje przed urzędami i blokady dróg. Hasło na transparentach: „Rynek dla wszystkich, nie tylko dla nich”."
 knm.10.a:0 "Program osłonowy natychmiast."
 knm.10.b:0 "Rynek sam to wyreguluje."
 ARM_pobor:0 "Etap 1: Komisja poborowa"
 ARM_pobor_desc:0 "W każdej gminie urzęduje komisja z listą roczników. Kto ma kategorię A, dostaje kartę powołania – a z nią mundur, żołd i przydział."
 ARM_kadry:0 "Etap 2: Szkoła podoficerska"
 ARM_kadry_desc:0 "Kaprale i sierżanci to kręgosłup każdej armii. Najlepsi rekruci idą na trzymiesięczny kurs, z którego wracają jako dowódcy drużyn."
 ARM_arsenal:0 "Etap 3: Arsenał"
 ARM_arsenal_desc:0 "Broń z magazynów policji, jednostek rezerwy i kontrabandy trafia do jednego arsenału, gdzie ktoś wreszcie ją liczy, czyści i wydaje według przydziałów."
 ARM_batalion:0 "Etap 4: Pierwsze bataliony regularne"
 ARM_batalion_desc:0 "Ochotnicy, rezerwiści i podoficerzy z nowej szkoły tworzą pierwsze regularne bataliony – z etatem, sztandarem i dowódcą, który odpowiada przed sztabem."
 ARM_fabryka:0 "Etap 5: Fabryka broni"
 ARM_fabryka_desc:0 "Hala po zakładach maszynowych dostaje nowe linie: amunicja, karabiny, granatniki. Armia, która nie produkuje własnej broni, istnieje tylko do pierwszej dłuższej wojny."
 ARM_brygada:0 "Etap 6: Brygada zmotoryzowana"
 ARM_brygada_desc:0 "Ciężarówki, terenówki i dywizjon artylerii pod jednym dowództwem. Brygada zmotoryzowana dojedzie tam, gdzie piechota dotrze za tydzień."
 ARM_c_nabor:0 "Kolejny nabór"
 ARM_c_nabor_desc:0 "Następny rocznik dostaje karty powołania. Nie wszyscy się stawiają – ale wystarczająco wielu."
 ARM_c_cwiczenia:0 "Ćwiczenia poligonowe"
 ARM_c_cwiczenia_desc:0 "Tydzień w lesie, ostra amunicja i manewry z udziałem wszystkich batalionów. Po ćwiczeniach wiadomo, kto umie dowodzić."
 ARM_c_uzupelnienia:0 "Uzupełnienia sprzętu"
 ARM_c_uzupelnienia_desc:0 "Zakupy z demobilu, naprawy i przydziały z fabryk. Magazyny znów nie są puste."
 ARM_c_batalion_nowy:0 "Nowy batalion"
 ARM_c_batalion_nowy_desc:0 "Kolejny batalion regularny dostaje sztandar i przydział."
 ARM_panel:0 "Rozbudowa wojska"
 ARM_panel_desc:0 "Główne zadanie państwa: zbudować armię, która obroni granice. Etapy programu idą po kolei; po szkole podoficerskiej odblokowują się decyzje cykliczne.\n\n§YEtap programu rozbudowy:§! [?ARM_etap|0]/6"
 SOJ_panel:0 "Sojusze"
 SOJ_panel_desc:0 "Prośby o przyjęcie do sojuszu. Druga strona decyduje sama – odmowa nie oznacza wojny, a prośbę można ponowić po pewnym czasie."
 SOJ_KORPORACJE:0 "Sojusz Korporacji"
 RKKR_tt_braun_krol:0 "Grzegorz Braun zostaje koronowany na króla Polski (fikcyjna ścieżka moda)."
 SOJ_kkr_rosja:0 "Sojusz z Rosją"
 SOJ_kkr_rosja_desc:0 "Konfederacja Korony Polskiej szuka protektora na wschodzie. Delegacja z Siedlec jedzie do Moskwy z prośbą o przyjęcie do Państwa Związkowego. (Fikcyjna ścieżka moda.)"
 soj.1.t:0 "Korona Polska prosi o sojusz"
 soj.1.d:0 "Delegacja z Siedlec przywozi prośbę Konfederacji Korony Polskiej: przyjęcie do Państwa Związkowego, wspólne dowództwo i rosyjskie gwarancje dla Korony. (Fikcyjna ścieżka moda.)"
 soj.1.a:0 "Przyjąć Koronę do sojuszu."
 soj.1.b:0 "Odmówić."
 SOJ_kor_PLO_WLC:0 "Sojusz korporacji: [WLC.GetNameDef]"
 SOJ_kor_PLO_WLC_desc:0 "Zarząd proponuje [WLC.GetNameDef] wspólny sojusz korporacji: wspólne zakupy, wspólny transport i wspólna obrona. (Fikcyjna ścieżka moda.)"
 SOJ_kor_PLO_KOC:0 "Sojusz korporacji: [KOC.GetNameDef]"
 SOJ_kor_PLO_KOC_desc:0 "Zarząd proponuje [KOC.GetNameDef] wspólny sojusz korporacji: wspólne zakupy, wspólny transport i wspólna obrona. (Fikcyjna ścieżka moda.)"
 SOJ_kor_WLC_PLO:0 "Sojusz korporacji: [PLO.GetNameDef]"
 SOJ_kor_WLC_PLO_desc:0 "Zarząd proponuje [PLO.GetNameDef] wspólny sojusz korporacji: wspólne zakupy, wspólny transport i wspólna obrona. (Fikcyjna ścieżka moda.)"
 SOJ_kor_WLC_KOC:0 "Sojusz korporacji: [KOC.GetNameDef]"
 SOJ_kor_WLC_KOC_desc:0 "Zarząd proponuje [KOC.GetNameDef] wspólny sojusz korporacji: wspólne zakupy, wspólny transport i wspólna obrona. (Fikcyjna ścieżka moda.)"
 SOJ_kor_KOC_PLO:0 "Sojusz korporacji: [PLO.GetNameDef]"
 SOJ_kor_KOC_PLO_desc:0 "Zarząd proponuje [PLO.GetNameDef] wspólny sojusz korporacji: wspólne zakupy, wspólny transport i wspólna obrona. (Fikcyjna ścieżka moda.)"
 SOJ_kor_KOC_WLC:0 "Sojusz korporacji: [WLC.GetNameDef]"
 SOJ_kor_KOC_WLC_desc:0 "Zarząd proponuje [WLC.GetNameDef] wspólny sojusz korporacji: wspólne zakupy, wspólny transport i wspólna obrona. (Fikcyjna ścieżka moda.)"
 soj.2.t:0 "Propozycja sojuszu korporacji"
 soj.2.d:0 "[From.GetNameDef] proponuje nam sojusz korporacji: wspólne zakupy, wspólny transport i wspólną obronę. W rozbitej Polsce firmy rozumieją się lepiej niż państwa. (Fikcyjna ścieżka moda.)"
 soj.2.a:0 "Wchodzimy do sojuszu."
 soj.2.b:0 "Odrzucamy ofertę."
 soj.3.t:0 "Sojusz zawarty"
 soj.3.d:0 "[From.GetNameDef] przyjmuje naszą propozycję. Od dziś jesteśmy w jednym sojuszu."
 soj.3.a:0 "Dobrze."
 soj.4.t:0 "Odmowa"
 soj.4.d:0 "[From.GetNameDef] nie przyjmuje naszej propozycji sojuszu. Możemy spróbować ponownie za kilka miesięcy."
 soj.4.a:0 "Trudno."
 CPZ_dm:0 "Kryzys konstytucyjny"
 CPZ_pasmo_0:0 "§Gpod kontrolą§!"
 CPZ_pasmo_1:0 "§Ynarastająca polaryzacja§!"
 CPZ_pasmo_2:0 "§Rparaliż instytucji§!"
 CPZ_pasmo_3:0 "§Rzagrożenie rozpadem struktur państwa§!"
 CPZ_pasmo_4:0 "§Rmożliwa wojna domowa§!"
 CPZ_panel:0 "Kryzys konstytucyjny"
 CPZ_panel_desc:0 "§WKryzys konstytucyjny:§! [?global.CPZ_kryzys|0]/100 – [GetCPZPasmo]\n§WLojalność Sił Zbrojnych RP:§! [?global.CPZ_wojsko|0]\n§WLojalność Policji:§! [?global.CPZ_policja|0]\n§WLojalność administracji:§! [?global.CPZ_administracja|0]\n§WPoparcie dla rządu:§! [?global.CPZ_rzad|0]\n§WPoparcie dla obozu prezydencko-opozycyjnego:§! [?global.CPZ_prez|0]\n§WSpójność koalicji:§! [?global.CPZ_koalicja|0]\n§WNapięcie społeczne:§! [?global.CPZ_napiecie|0]\n§WNapięcie regionalne (nastroje separatystyczne):§! [?global.CPZ_separatyzm|0]\n§WRezerwy państwowe:§! [?global.CPZ_rezerwy|0]\n\nProgi kryzysu: 0–24 pod kontrolą · 25–49 polaryzacja · 50–74 paraliż instytucji · 75–89 zagrożenie rozpadem · 90–100 możliwa wojna domowa.\n\n§WLojalność regionów (średnia):§! [?global.CPZ_lojalnosc|0]\nPomorskie: [?global.CPZ_lo_pomorskie|0] · Kujawsko-pomorskie: [?global.CPZ_lo_kujawsko_pomorskie|0] · Wielkopolskie: [?global.CPZ_lo_wielkopolskie|0] · Warmińsko-mazurskie: [?global.CPZ_lo_warminsko_mazurskie|0] · Podlaskie: [?global.CPZ_lo_podlaskie|0] · Lubelskie: [?global.CPZ_lo_lubelskie|0] · Łódzkie: [?global.CPZ_lo_lodzkie|0] · Mazowieckie: [?global.CPZ_lo_mazowieckie|0] · Pomorze Zachodnie i Śląsk: [?global.CPZ_lo_zachodnie|0]\n§WWojewództwo przechodzi do kolejnego etapu rozpadu tylko przy lojalności poniżej 65.§!\n\n§WKoalicja:§! Koalicja Obywatelska [?global.CPZ_p_ko|0] · PSL [?global.CPZ_p_psl|0] · Polska 2050 [?global.CPZ_p_p2050|0] · Lewica [?global.CPZ_p_lewica|0] – partia poniżej 25 wychodzi z koalicji.\n§WJedność obozu prezydencko-opozycyjnego:§! [?global.CPZ_jednosc|0]"
 CPZ_tt_b512cdc6:0 "Kryzys konstytucyjny: §G-2§!; Napięcie społeczne: §G-3§!; Lojalność Policji: §R-1§!"
 CPZ_d_zgromadzenia:0 "Zgoda na zgromadzenia pod TK"
 CPZ_d_zgromadzenia_desc:0 "Rząd nie blokuje demonstracji. Policja pilnuje tylko porządku i dróg ewakuacji. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_1a19d3a8:0 "Kryzys konstytucyjny: §R+3§!; Lojalność Policji: §G+2§!; Napięcie społeczne: §R+3§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+2§!"
 CPZ_d_strefa:0 "Strefa bezpieczeństwa wokół Trybunału"
 CPZ_d_strefa_desc:0 "Barierki, kordony i kontrole na Al. Szucha. Mniej ryzyka starć, więcej zdjęć policyjnych kordonów w mediach. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_1dee2505:0 "Lojalność Policji: §G+5§!; Spójność koalicji: §G+1§!"
 CPZ_d_odprawa:0 "Odprawa komendantów policji"
 CPZ_d_odprawa_desc:0 "Szef MSWiA spotyka się z komendantami wojewódzkimi: jasne rozkazy, ochrona przed naciskami politycznymi. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_2e333f5e:0 "Lojalność Policji: §G+2§!; Kryzys konstytucyjny: §R+3§!; Napięcie regionalne (nastroje separatystyczne): §R+3§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!"
 CPZ_d_posilki:0 "Posiłki policji do Warszawy"
 CPZ_d_posilki_desc:0 "Oddziały prewencji z całego kraju jadą do stolicy. Kontrola nad ulicą rośnie, ale regiony zostają bez ludzi. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_82868ee7:0 "Poparcie dla rządu: §G+2§!; Napięcie społeczne: §G-1§!"
 CPZ_d_rzecznik:0 "Codzienne konferencje rzecznika rządu"
 CPZ_d_rzecznik_desc:0 "Rząd tłumaczy każdy krok: podstawa prawna, terminy, kto podjął decyzję. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_c8f36a47:0 "Poparcie dla rządu: §G+3§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+2§!; Kryzys konstytucyjny: §R+1§!"
 CPZ_d_wywiad:0 "Wywiad premiera w telewizji"
 CPZ_d_wywiad_desc:0 "Premier odpowiada na pytania przez godzinę. Część widzów przekona, część utwierdzi w niechęci. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_53267f68:0 "Napięcie społeczne: §G-3§!; Kryzys konstytucyjny: §G-1§!"
 CPZ_d_fakty:0 "Biuro weryfikacji informacji"
 CPZ_d_fakty_desc:0 "Specjalny zespół prostuje fałszywe doniesienia o wojsku na ulicach i zamachu stanu, także te z zagranicy. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_33fd2432:0 "Kryzys konstytucyjny: §G-3§!; Spójność koalicji: §G+2§!"
 CPZ_d_marszalek:0 "Mediacja marszałka Sejmu"
 CPZ_d_marszalek_desc:0 "Marszałek proponuje spotkanie przedstawicieli rządu, Kancelarii Prezydenta i klubów. Bez gwarancji wyniku. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_2a03f951:0 "Kryzys konstytucyjny: §G-4§!; Spójność koalicji: §R-2§!; Poparcie dla obozu prezydencko-opozycyjnego: §G-2§!"
 CPZ_d_ustawa:0 "Projekt kompromisowej ustawy o TK"
 CPZ_d_ustawa_desc:0 "Projekt zakłada wybór sędziów większością kwalifikowaną i wygaszenie sporu o skład. Wymaga głosów spoza koalicji. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_ae4002bf:0 "Napięcie regionalne (nastroje separatystyczne): §G-4§!; Spójność koalicji: §G+1§!; Poparcie dla rządu: §R-1§!"
 CPZ_d_samorzady:0 "Konwent wojewodów i marszałków"
 CPZ_d_samorzady_desc:0 "Wojewodowie i marszałkowie województw siadają przy jednym stole. Regiony chcą pieniędzy i gwarancji – w zamian za lojalność. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_2e2ac977:0 "Lojalność Sił Zbrojnych RP: §G+5§!; Poparcie dla rządu: §R-1§!"
 CPZ_tt_a2d52d1a:0 "PSL: §G+4§!"
 CPZ_d_mon:0 "Rozmowa z ministrem obrony narodowej"
 CPZ_d_mon_desc:0 "Rząd i MON uzgadniają jedno: wojsko pozostaje poza sporem politycznym. Wicepremier z PSL żąda w zamian wpływu na decyzje rządu. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_ca784efe:0 "Lojalność Sił Zbrojnych RP: §G+4§!; Kryzys konstytucyjny: §G-1§!"
 CPZ_d_apel_wojsko:0 "Apel do żołnierzy o neutralność"
 CPZ_d_apel_wojsko_desc:0 "Dowództwo przypomina żołnierzom o apolityczności sił zbrojnych. (Fikcja moda: decyzja gracza.)"
 CPZ_req_okragly:0 "Kryzys poniżej 65 (z duchem „Spór o legalność instytucji” poniżej 55), stabilność koalicji co najmniej 45, lojalność wojska co najmniej 55, lojalność policji co najmniej 45 oraz wcześniejsza mediacja, projekt ustawy o TK albo rozmowy w noc 30/31 października"
 CPZ_d_okragly_stol:0 "Okrągły stół w sprawie Trybunału"
 CPZ_d_okragly_stol_desc:0 "Rząd, prezydent, kluby i sędziowie przy jednym stole. Trudna droga do zachowania jedności Rzeczypospolitej. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_f0d24d1d:0 "Lojalność Sił Zbrojnych RP: §R-3§!; Napięcie regionalne (nastroje separatystyczne): §G-2§!"
 CPZ_d_ot:0 "Mobilizacja Wojsk Obrony Terytorialnej"
 CPZ_d_ot_desc:0 "Brygady OT dostają rozkaz ochrony urzędów w województwach lojalnych wobec rządu. (Fikcja moda: decyzja gracza.)"
 CPZ_tt_predkosc:0 "Zalecamy przełączenie gry na §Wprędkość 1§! i włączenie pauzy przy zdarzeniach (ustawienia gry). Zdarzenia przychodzą o konkretnych godzinach."
 cpz.1.t:0 "Rzeczpospolita jesienią 2026"
 cpz.1.d:0 "Październik 2026. Rząd Koalicji 15 Października i prezydent Karol Nawrocki od miesięcy spierają się o Trybunał Konstytucyjny: kto jest sędzią, kto prezesem, czyje orzeczenia obowiązują. Sejm wybrał nowych sędziów, prezydent nie odebrał od nich ślubowania, a spór przeniósł się do prokuratury i na ulice.\n\nTen scenariusz zaczyna się od prawdziwych wydarzeń. Od 1 listopada 2026 to Ty piszesz dalszą historię. W panelu „Kryzys konstytucyjny” śledzisz wskaźniki; decyzje z października wpłyną na siłę kryzysu pod koniec miesiąca."
 cpz.1.a:0 "Zaczynamy."
 cpz.100.t:0 "NADCHODZI PRZESILENIE"
 cpz.100.d:0 "Piątek, 30 października 2026, 16:00. Do Kancelarii Premiera spływają sygnały, że najbliższe godziny w Trybunale Konstytucyjnym będą decydujące. Prezydent jest w drodze do Senegalu. Media czekają.\n\nOd tej chwili zdarzenia przychodzą godzina po godzinie. Kluczowe momenty dają kilka możliwych decyzji."
 cpz.100.a:0 "Przełączę grę na prędkość 1."
 CPZ_tt_d1d2a788:0 "Poparcie dla rządu: §G+1§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!; Kryzys konstytucyjny: §R+1§!"
 cpz.90.t:0 "13 października 2026 · Opinia Komisji Weneckiej"
 cpz.90.d:0 "§W13 października 2026§!\n\nKomisja Wenecka publikuje opinię (przyjętą 9 października) o roli prezydenta przy ślubowaniu sędziów Trybunału. Rzecznik prezydenta mówi, że opinia nie ma mocy prawnej. Minister sprawiedliwości Waldemar Żurek odpowiada, że prezydent nie ma prawa weta wobec sędziów wybranych przez Sejm.\n\n§WStanowiska stron:§! Kancelaria Prezydenta: opinia bez mocy prawnej. Rząd: prezydent nie wybiera sędziów."
 cpz.90.a:0 "Rząd powołuje się na opinię Komisji."
 CPZ_tt_47424b60:0 "Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!; Kryzys konstytucyjny: §R+1§!"
 cpz.91.t:0 "przed południem · Prezydent o Macieju Berku"
 cpz.91.d:0 "§W14 października 2026, przed południem§!\n\nPrezydent Karol Nawrocki stwierdza, że Maciej Berek, wybrany przez Sejm 4 września, nie jest sędzią Trybunału, dopóki nie złoży ślubowania wobec prezydenta."
 cpz.91.a:0 "Sejm ma inne zdanie."
 CPZ_tt_5cf298cd:0 "Kryzys konstytucyjny: §R+1§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!; Poparcie dla rządu: §G+1§!"
 cpz.92.t:0 "14 października 2026 · Ślubowanie Macieja Berka w Sejmie"
 cpz.92.d:0 "§W14 października 2026§!\n\nMaciej Berek składa w Sejmie ślubowanie sędziego Trybunału, z formułą skierowaną do prezydenta. Są marszałek Sejmu Włodzimierz Czarzasty, prezydium Sejmu i notariusz; prezydenta nie ma. Kancelaria Prezydenta nie uznaje ślubowania, a prezes Trybunału Bogdan Święczkowski nie dopuszcza Berka do orzekania. Pięciu sędziów wybranych przez Sejm czeka na dopuszczenie.\n\n§WStanowiska stron:§! Sejm i rząd: ośmiu z piętnastu sędziów wybrał obecny Sejm. Prezydent i prezes TK: w Trybunale orzeka dziesięciu sędziów."
 cpz.92.a:0 "Sejm zrobił, co do niego należy."
 CPZ_tt_17e5629f:0 "Napięcie społeczne: §R+3§!; Lojalność Policji: §G+1§!"
 CPZ_tt_67729139:0 "Napięcie społeczne: §R+1§!; Lojalność Policji: §R-1§!"
 cpz.93.t:0 "popołudnie · Zamieszki przed Trybunałem"
 cpz.93.d:0 "§W14 października 2026, popołudnie§!\n\nPrzed siedzibą Trybunału przez kilka godzin trwa protest. Protestujący blokują wjazd sędziom. Komenda Stołeczna Policji zatrzymuje trzy osoby."
 cpz.93.a:0 "Policja ma zapewnić sędziom wjazd."
 cpz.93.b:0 "Nie eskalować – tylko obserwować."
 CPZ_tt_9f4789fe:0 "Kryzys konstytucyjny: §R+1§!"
 cpz.94.t:0 "22 października 2026 · Prezes TK i rzecznik dyscyplinarny"
 cpz.94.d:0 "§W22 października 2026§!\n\nBogdan Święczkowski kieruje do rzecznika dyscyplinarnego sprawę sędzi Magdaleny Bentkowskiej. Według komunikatu Trybunału wprowadziła Krystiana Markiewicza do części budynku przeznaczonej dla sędziów, z pominięciem wewnętrznych procedur."
 cpz.94.a:0 "Spór przenosi się na korytarze Trybunału."
 CPZ_tt_c97f03ee:0 "Poparcie dla rządu: §G+1§!; Kryzys konstytucyjny: §R+1§!"
 cpz.95.t:0 "23 października 2026 · Pięciu sędziów odpowiada prezydentowi"
 cpz.95.d:0 "§W23 października 2026§!\n\nMaciej Berek, Marcin Dziurda, Anna Korwin-Piotrowska, Krystian Markiewicz i Maciej Taborowski ogłaszają wspólne oświadczenie: spór kompetencyjny zgłoszony przez prezydenta jest pozorny, nie blokuje dopuszczenia ich do orzekania, a rozstrzygnąć go może tylko skład co najmniej jedenastu sędziów – niemożliwy, dopóki pięciu jest wykluczonych. Sędziów wybiera Sejm, nie prezes Trybunału ani prezydent."
 cpz.95.a:0 "Rząd popiera sędziów."
 cpz.96.t:0 "26–27 października 2026 · Kancelaria: Berek nie objął urzędu"
 cpz.96.d:0 "§W26–27 października 2026§!\n\nWedług „Rzeczpospolitej” Kancelaria Prezydenta w piśmie dowodzi, że Maciej Berek nie objął urzędu, bo ślubowanie „wobec prezydenta” wymaga jego fizycznej obecności. Prezydent stoi na stanowisku, że Berek nie może orzekać."
 cpz.96.a:0 "Do przesilenia zostały dni."
 CPZ_tt_17b1dce9:0 "Poparcie dla rządu: §G+1§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!; Kryzys konstytucyjny: §R+2§!"
 CPZ_tt_493e3cb6:0 "Kryzys konstytucyjny: §R+2§!; Napięcie społeczne: §R+1§!"
 cpz.101.t:0 "ok. 17:00 · Policja przy Trybunale"
 cpz.101.d:0 "§W30 października 2026, ok. 17:00§!\n\nFunkcjonariusze stołecznej policji wchodzą na teren Trybunału Konstytucyjnego po zawiadomieniu sędzi Anny Korwin-Piotrowskiej. Policja podaje, że zgłoszono zagrożenie dla życia lub zdrowia sędziów i pracowników oraz ryzyko zakłócenia porządku; działa przy ogrodzeniu i od strony Al. Szucha.\n\n§WStanowiska stron:§! Policja: działania z poszanowaniem niezależności Trybunału. Zwolennicy prezesa Święczkowskiego: wejście policji nie ma podstawy prawnej."
 cpz.101.a:0 "Komunikat rządu: policja działa na wezwanie osoby uprawnionej."
 cpz.101.b:0 "Nie komentować – niech mówi policja."
 CPZ_tt_b803dcf7:0 "Kryzys konstytucyjny: §R+2§!"
 cpz.102.t:0 "ok. 18:00 · Przerwa w czynnościach prezesa TK"
 cpz.102.d:0 "§W30 października 2026, ok. 18:00§!\n\nNa stronie Trybunału pojawia się komunikat o miesięcznej przerwie w czynnościach służbowych prezesa Bogdana Święczkowskiego i wiceprezesa Bartłomieja Sochańskiego. Jako podstawę wskazano art. 130 ustawy Prawo o ustroju sądów powszechnych.\n\n§WStanowiska stron:§! Zwolennicy zarządzenia: prezes kierował Trybunałem bezprawnie. Przeciwnicy: przepis dotyczy sądów powszechnych, nie Trybunału."
 cpz.102.a:0 "Czekamy na dalszy rozwój."
 CPZ_tt_60aa691f:0 "Poparcie dla rządu: §G+1§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+2§!; Kryzys konstytucyjny: §R+2§!; Spójność koalicji: §R-1§!"
 CPZ_tt_f875ab7b:0 "Kryzys konstytucyjny: §R+1§!; Poparcie dla rządu: §R-1§!"
 cpz.103.t:0 "ok. 18:00 · Korwin-Piotrowska kieruje Trybunałem"
 cpz.103.d:0 "§W30 października 2026, ok. 18:00§!\n\nZarządzenia podpisuje sędzia Anna Korwin-Piotrowska jako sędzia o najdłuższym stażu zastępująca prezesa. Według oświadczenia sędziego Sławomira Patyry powaga Trybunału i interes służby wymagały natychmiastowego odsunięcia prezesa. Korwin-Piotrowska jest sędzią wybraną przez Sejm, której prezydent nie zaprzysiągł.\n\n§WStanowiska stron:§! Bogdan Święczkowski: sędzia uzurpuje sobie prawo kierowania Trybunałem. Bartłomiej Sochański: o zarządzeniu dowiedział się od dziennikarzy."
 cpz.103.a:0 "Rząd uznaje kierownictwo sędzi Korwin-Piotrowskiej."
 cpz.103.b:0 "Rząd ogranicza się do apelu o spokój."
 CPZ_tt_554f0c35:0 "Poparcie dla obozu prezydencko-opozycyjnego: §R+2§!; Kryzys konstytucyjny: §R+2§!"
 cpz.104.t:0 "Wpis na X · Prezydent przerywa lot do Senegalu"
 cpz.104.d:0 "£CPZ_p_nawrocki §WKarol Nawrocki§! na X · 30 października 2026, ok. 18:12\n\nPrezydent informuje, że przerywa wizytę w Senegalu i wraca do kraju, bo w takim momencie prezydent musi być w Polsce.\n\n§WWpływ na kryzys:§! Obóz prezydencki mobilizuje się. Rośnie napięcie przed powrotem prezydenta."
 cpz.104.a:0 "Dalej."
 CPZ_tt_12695ebd:0 "Napięcie społeczne: §R+3§!; Kryzys konstytucyjny: §R+1§!"
 cpz.105.t:0 "Wpis na X · Spór o stronę internetową TK"
 cpz.105.d:0 "§WTrybunał Konstytucyjny§! na X · 30 października 2026, ok. 18:25\n\nOficjalne konto Trybunału informuje o bezprawnym przejęciu strony internetowej i podaje, że Święczkowski pozostaje prezesem, a Sochański wiceprezesem. Sędzia Marcin Dziurda zaprzecza, by doszło do przejęcia Trybunału, ale mówi, że stronę zajęły osoby nieuprawnione.\n\n§WWpływ na kryzys:§! Dwa przekazy z jednej instytucji. Obywatele nie wiedzą, który jest oficjalny."
 cpz.105.a:0 "Dalej."
 CPZ_tt_a2b36fa2:0 "Poparcie dla rządu: §G+1§!; Napięcie społeczne: §R+1§!"
 CPZ_tt_473d26ea:0 "Napięcie społeczne: §G-1§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!"
 cpz.106.t:0 "ok. 18:42 · Wnioski o uchylenie immunitetów"
 cpz.106.d:0 "§WWaldemar Żurek§! – minister sprawiedliwości, prokurator generalny\n§W30 października 2026, ok. 18:42§!\n\n§WKontekst:§! Prokurator generalny od miesięcy prowadzi postępowania wobec kierownictwa Trybunału.\n\n§WStreszczenie wystąpienia:§! Minister sprawiedliwości informuje o pięciu wnioskach o uchylenie immunitetu skierowanych do Trybunału: czterech wobec Bogdana Święczkowskiego i jednym wobec Bartłomieja Sochańskiego, z aktami liczącymi 50 tomów.\n\n§WReakcje:§! Opozycja mówi o politycznej zemście. Koalicja przekonuje, że prawo działa wobec wszystkich."
 cpz.106.a:0 "Odpowiedź rządu: stanowczo bronić swojego stanowiska."
 cpz.106.b:0 "Odpowiedź rządu: wezwać do spokoju i rozmowy."
 cpz.106.c:0 "Bez komentarza."
 CPZ_tt_5edc6f7d:0 "Kryzys konstytucyjny: §R+1§!; Napięcie społeczne: §G-2§!; Lojalność Policji: §R-1§!"
 CPZ_tt_89b53824:0 "Kryzys konstytucyjny: §R+2§!; Lojalność Policji: §G+2§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!"
 cpz.107.t:0 "wieczór · Demonstracja przed Trybunałem"
 cpz.107.d:0 "§W30 października 2026, wieczór§!\n\nPrzed ogrodzeniem Trybunału zbiera się demonstracja przeciwko interwencji policji. Tłum rośnie z każdą godziną."
 cpz.107.a:0 "Zapewnić demonstrantom bezpieczny dostęp do ulicy."
 cpz.107.b:0 "Wzmocnić kordon przy bramie."
 CPZ_tt_91f75166:0 "Poparcie dla obozu prezydencko-opozycyjnego: §R+2§!; Kryzys konstytucyjny: §R+1§!"
 cpz.108.t:0 "wieczór · Politycy opozycji pod Trybunałem"
 cpz.108.d:0 "§W30 października 2026, wieczór§!\n\nDo demonstrantów dołączają politycy PiS z Jarosławem Kaczyńskim, członkowie klubów Gazety Polskiej i Ruchu Obrony Granic. Pod Trybunałem pojawiają się też Janusz Korwin-Mikke i Grzegorz Braun."
 cpz.108.a:0 "Opozycja na ulicy. Rząd liczy głowy."
 CPZ_tt_fe602405:0 "Poparcie dla rządu: §G+3§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!; Kryzys konstytucyjny: §R+1§!"
 cpz.110.t:0 "Wpis na X · Premier: innej drogi nie ma"
 cpz.110.d:0 "£CPZ_p_tusk §WDonald Tusk§! na X · 30 października 2026, wieczór\n\nPremier pisze, że przywracanie praworządności to obowiązek rządu – po latach rządów PiS proces trudny, czasem bolesny i wymagający zdecydowanych działań. Kończy stwierdzeniem, że innej drogi nie ma.\n\n§WWpływ na kryzys:§! Wyborcy koalicji dostają jasny sygnał. Opozycja odczytuje go jako zapowiedź siły."
 cpz.110.a:0 "Dalej."
 cpz.109.t:0 "wieczór · Przemówienia pod Trybunałem"
 cpz.109.d:0 "§WJarosław Kaczyński§! – prezes PiS\n§W30 października 2026, wieczór§!\n\n§WKontekst:§! Na ulicy przed Trybunałem stoją tysiące ludzi, a za ogrodzeniem kordon policji.\n\n§WStreszczenie wystąpienia:§! Prezes PiS mówi o zamachu na Trybunał i wzywa do obrony konstytucyjnych organów państwa. Kolejni politycy opozycji powtarzają, że nie uznają zarządzeń sędzi Korwin-Piotrowskiej.\n\n§WReakcje:§! Koalicja odpowiada, że to obrona nielegalnego stanu w Trybunale. Część komentatorów apeluje o obniżenie temperatury sporu."
 cpz.109.a:0 "Odpowiedź rządu: stanowczo bronić swojego stanowiska."
 cpz.109.b:0 "Odpowiedź rządu: wezwać do spokoju i rozmowy."
 cpz.109.c:0 "Bez komentarza."
 CPZ_tt_721eff82:0 "Napięcie społeczne: §R+2§!; Kryzys konstytucyjny: §R+1§!"
 cpz.115.t:0 "wieczór · Białe kaski przed Trybunałem"
 cpz.115.d:0 "§WAdrian Zandberg§! – Razem\n§W30 października 2026, wieczór§!\n\n§WKontekst:§! Od popołudnia na terenie Trybunału są duże siły policji. Komenda Stołeczna powołuje się na pismo sędzi Korwin-Piotrowskiej o zagrożeniu bezpieczeństwa i porządku.\n\n§WStreszczenie wystąpienia:§! W wieczornym wywiadzie w Polsat News Adrian Zandberg mówi, że spór doszedł do miejsca, w którym przed siedzibą Trybunału stoją białe kaski. Ocenia, że walka o Trybunał trwa od dekady i zdecydowanie za długo, obwinia kolejne partie rządzące o wprowadzanie do Trybunału polityków i ostrzega, że ta droga prowadzi do chaosu.\n\n§WReakcje:§! Opozycja mówi o siłowym przejęciu Trybunału, policja zaprzecza, że był jakikolwiek szturm."
 cpz.115.a:0 "Odpowiedź rządu: stanowczo bronić swojego stanowiska."
 cpz.115.b:0 "Odpowiedź rządu: wezwać do spokoju i rozmowy."
 cpz.115.c:0 "Bez komentarza."
 CPZ_tt_e5514f2d:0 "Lojalność Policji: §G+2§!; Kryzys konstytucyjny: §G-1§!"
 cpz.111.t:0 "Wpis na X · Policja: nie jesteśmy w budynku"
 cpz.111.d:0 "§WPolicja§! na X · 30 października 2026, ok. 20:00\n\nPolicja informuje, że funkcjonariusze nie przebywają w budynku Trybunału. Wezwała ich osoba uprawniona, a ich działania ograniczają się do terenu zewnętrznego i Al. Szucha.\n\n§WWpływ na kryzys:§! Policja próbuje pokazać neutralność wobec sporu."
 cpz.111.a:0 "Dalej."
 CPZ_tt_2dd766bc:0 "Lojalność Policji: §G+1§!; Kryzys konstytucyjny: §R+2§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!"
 CPZ_tt_1e82c943:0 "Kryzys konstytucyjny: §G-1§!; Poparcie dla rządu: §R-1§!"
 cpz.112.t:0 "ok. 20:00–21:00 · Prezes przed bramą"
 cpz.112.d:0 "§W30 października 2026, ok. 20:00–21:00§!\n\nBogdan Święczkowski przyjeżdża pod Trybunał i prosi policję o wpuszczenie. Nie zostaje wpuszczony. Około 21:00 łańcuch na bramie zostaje przecięty; Święczkowski wchodzi na teren posesji i staje przed kordonem policji, znów domagając się wejścia. Zapowiada, że w sobotę przyjdą sędziowie wybrani zgodnie z prawem."
 cpz.112.a:0 "Kordon stoi. Bez wejścia do budynku."
 cpz.112.b:0 "Zaproponować prezesowi rozmowę w obecności mediatora."
 cpz.113.t:0 "ok. 21:30–22:00 · Prezes odchodzi, prezydent ląduje"
 cpz.113.d:0 "§W30 października 2026, ok. 21:30–22:00§!\n\nTłum skanduje hasła poparcia dla prezesa. Przed 22:00 Święczkowski opuszcza teren Trybunału, a samolot prezydenta ląduje na Okęciu."
 cpz.113.a:0 "Noc dopiero się zaczyna."
 cpz.114.t:0 "ok. 22:00–23:00 · Narada w Pałacu Prezydenckim"
 cpz.114.d:0 "§W30 października 2026, ok. 22:00–23:00§!\n\nŚwięczkowski spotyka się z prezydentem w Pałacu. Szef gabinetu prezydenta Paweł Szefernaker zapowiada spotkanie prezydenta z pierwszym prezesem Sądu Najwyższego Zbigniewem Kapińskim. Kapiński w oświadczeniu przypomina, że granice władzy wyznacza konstytucja, a nie doraźne decyzje polityczne."
 cpz.114.a:0 "Pałac szykuje odpowiedź."
 CPZ_tt_683595f5:0 "Kryzys konstytucyjny: §R+2§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!"
 cpz.120.t:0 "chwilę przed 1:00 · Prezydent wchodzi do Trybunału"
 cpz.120.d:0 "§W31 października 2026, chwilę przed 1:00§!\n\nKarol Nawrocki wchodzi do siedziby Trybunału w towarzystwie pierwszego prezesa Sądu Najwyższego Zbigniewa Kapińskiego i współpracowników."
 cpz.120.a:0 "Śledzić sytuację na żywo."
 CPZ_tt_280b70b3:0 "Kryzys konstytucyjny: §R+2§!; Napięcie społeczne: §R+2§!"
 cpz.121.t:0 "noc · Przepychanki przy wejściu"
 cpz.121.d:0 "§W31 października 2026, noc§!\n\nPrzy bocznym wejściu dochodzi do przepychanek między otoczeniem prezydenta a grupą sędziów wybranych przez Sejm. Sędzia Maciej Berek publikuje nagranie i relację: według niego prezydent z impetem wszedł na sędzię Korwin-Piotrowską, a nikt go nie szarpał. Rzecznik prezydenta Rafał Leśkiewicz twierdzi, że blokowanie wejścia naruszyło nietykalność głowy państwa.\n\n§WStanowiska stron:§! Strona prezydencka: naruszenie nietykalności prezydenta. Sędziowie wybrani przez Sejm: prezydent siłą wszedł do budynku."
 cpz.121.a:0 "Dwie wersje jednej sceny."
 CPZ_tt_c8a041f1:0 "Kryzys konstytucyjny: §R+3§!"
 cpz.122.t:0 "noc · Konfrontacja w korytarzu"
 cpz.122.d:0 "§W31 października 2026, noc§!\n\nNa korytarzu Trybunału prezydent mówi sędziom wybranym przez Sejm – Annie Korwin-Piotrowskiej, Krystianowi Markiewiczowi i Maciejowi Berkowi – że nie są sędziami Trybunału. Szef Kancelarii Prezydenta Zbigniew Bogucki zarzuca Korwin-Piotrowskiej zamach stanu i mówi, że nie ma podstaw, by przebywała w budynku. Sędzia odrzuca zarzuty i odpowiada, że kieruje Trybunałem. Spór dotyczy też tego, kto może wchodzić do pomieszczeń Trybunału.\n\n§WStanowiska stron:§! Strona prezydencka: sędziowie wybrani przez Sejm nie są sędziami Trybunału. Sędziowie: prezydent nie ma prawa podważać wyboru dokonanego przez Sejm."
 cpz.122.a:0 "Sytuacja wymyka się spod kontroli."
