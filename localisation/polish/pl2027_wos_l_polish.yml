 CPZ_tt_b2f6da30:0 "Kryzys konstytucyjny: §G-1§!; Poparcie dla rządu: §R-2§!"
 cpz.210.t:0 "Zgromadzenie Ogólne sędziów Trybunału"
 cpz.210.d:0 "Wtorek, 3 listopada 2026. Sędzia Anna Korwin-Piotrowska zwołała na dziś Zgromadzenie Ogólne sędziów Trybunału. To, jak przebiegnie, jest już historią alternatywną moda."
 cpz.210.a:0 "Zgromadzenie bez sędziów, którzy nie uznają odsunięcia prezesa."
 cpz.210.b:0 "Zaprosić wszystkich piętnastu sędziów."
 cpz.210.c:0 "Przełożyć zgromadzenie do czasu rozmów z Pałacem."
 CPZ_tt_4635ea57:0 "Napięcie społeczne: §G-1§!"
 cpz.200.t:0 "Po Czarnym Październiku"
 cpz.200.d:0 "Niedziela, 1 listopada 2026. Zapalone znicze na cmentarzach i pusty plac przed Trybunałem. Spór o Trybunał nie został rozstrzygnięty – to, co wydarzy się dalej, jest już historią alternatywną moda.\n\nOd teraz kryzys toczy się według wskaźników: decyzje rządu, przemówienia i zdarzenia zmieniają je co tydzień. Sytuacja: [GetCPZPasmo]."
 cpz.200.a:0 "Rzeczpospolita musi przetrwać."
 CPZ_tt_uwolnij:0 "Państwo regionalne powstaje na swoich ziemiach – z przywódcami, ustrojem i wojskiem."
 CPZ_tt_b25320fb:0 "Napięcie regionalne (nastroje separatystyczne): §R+2§!; Kryzys konstytucyjny: §R+1§!"
 cpz.350.t:0 "[From.GetNameDef] ogłasza niepodległość"
 cpz.350.d:0 "[From.GetNameDef] nie czeka na Warszawę: ogłasza niepodległość, przejmuje urzędy, policję i koszary na swoim terenie. Na mapie Rzeczypospolitej pojawia się nowe państwo. (Historia alternatywna moda.)"
 cpz.350.a:0 "Kolejny region odchodzi."
 CPZ_tt_98221eb2:0 "Napięcie regionalne (nastroje separatystyczne): §R+1§!"
 cpz.351.t:0 "[From.GetNameDef] zrywa z Warszawą"
 cpz.351.d:0 "Region autonomiczny [From.GetNameDef] ogłasza pełną niezależność. (Historia alternatywna moda.)"
 cpz.351.a:0 "Autonomia nie wystarczyła."
 CPZ_tt_033d9428:0 "Napięcie regionalne (nastroje separatystyczne): §G-1§!; Napięcie społeczne: §G-1§!"
 cpz.352.t:0 "Region autonomiczny: [From.GetNameDef]"
 cpz.352.d:0 "Warszawa zgadza się na autonomię regionu [From.GetNameDef]: własny rząd, budżet i policja, wspólna armia i polityka zagraniczna – na razie. (Historia alternatywna moda.)"
 cpz.352.a:0 "Lepsza autonomia niż secesja."
 CPZ_tt_319f041b:0 "Napięcie regionalne (nastroje separatystyczne): §R+4§!; Spójność koalicji: §R-2§!"
 CPZ_tt_0513cb92:0 "Napięcie regionalne (nastroje separatystyczne): §R+7§!; Kryzys konstytucyjny: §R+2§!"
 cpz.300.t:0 "Etap I: osłabienie władzy centralnej"
 cpz.300.d:0 "Sejm uchwala ustawy, których nikt nie publikuje. Sądy wydają sprzeczne wyroki, a wojewodowie dostają sprzeczne polecenia. Władza centralna słabnie z tygodnia na tydzień. (Historia alternatywna moda.)"
 cpz.300.a:0 "Rozmawiać z każdym regionem osobno."
 cpz.300.b:0 "Wojewodowie mają wykonywać polecenia rządu."
 CPZ_tt_15efeccf:0 "Napięcie regionalne (nastroje separatystyczne): §R+6§!; Kryzys konstytucyjny: §G-2§!"
 CPZ_tt_3ac07541:0 "Napięcie regionalne (nastroje separatystyczne): §R+4§!; Kryzys konstytucyjny: §R+5§!; Lojalność Sił Zbrojnych RP: §R-2§!"
 cpz.301.t:0 "Etap II: administracje wojewódzkie"
 cpz.301.d:0 "Marszałkowie, prezydenci miast i lokalni komendanci tworzą tymczasowe administracje, które przejmują zadania niewykonywane przez Warszawę. Od teraz województwa będą się usamodzielniać – każde w swoim tempie. (Historia alternatywna moda.)"
 cpz.301.a:0 "Uznać je, by utrzymać łączność z regionami."
 cpz.301.b:0 "Uznać je za nielegalne."
 CPZ_tt_5b829a5a:0 "Napięcie regionalne (nastroje separatystyczne): §R+2§!"
 cpz.320.t:0 "Pomorskie: tymczasowa administracja"
 cpz.320.d:0 "W województwie §Wpomorskie§! władzę przejmuje tymczasowa administracja wojewódzka. Formalnie to wciąż Rzeczpospolita; w praktyce urzędnicy pytają Warszawę coraz rzadziej. (Etap II, historia alternatywna moda.)"
 cpz.320.a:0 "Przyjąć do wiadomości."
