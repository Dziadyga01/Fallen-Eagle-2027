 ROS_p_cho_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_cho_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_szl_fd_budzety:0 "Budżety dla regionów"
 ROS_p_szl_fd_budzety_desc:0 "Połowa podatków zostaje w regionach, które je zebrały."
 ROS_p_szl_fd_gubernatorzy:0 "Wybory gubernatorów"
 ROS_p_szl_fd_gubernatorzy_desc:0 "Gubernatorów wybierają mieszkańcy, a nie Kreml."
 ROS_p_szl_fd_jezyki:0 "Języki regionów"
 ROS_p_szl_fd_jezyki_desc:0 "Szkoły uczą także w językach narodów Rosji."
 ROS_p_szl_fd_rada:0 "Izba Regionów"
 ROS_p_szl_fd_rada_desc:0 "Regiony mają własną izbę parlamentu z prawem weta."
 ROS_p_szl_fd_final:0 "Federacja z prawdziwego zdarzenia"
 ROS_p_szl_fd_final_desc:0 "Rosja jest federacją nie tylko z nazwy."
 ROS_p_szl_pj_mazury:0 "Komisja historyczna z Polską"
 ROS_p_szl_pj_mazury_desc:0 "Historycy z obu stron siadają przy jednym stole."
 ROS_p_szl_pj_granice:0 "Otwarte przejścia graniczne"
 ROS_p_szl_pj_granice_desc:0 "Mieszkańcy Królewca mogą jeździć na zakupy do Olsztyna i Gdańska."
 ROS_p_szl_pj_baltyk:0 "Rada Państw Bałtyckich"
 ROS_p_szl_pj_baltyk_desc:0 "Rosja wraca do rozmów o wspólnym morzu."
 ROS_p_szl_pj_rozbrojenie:0 "Wycofanie rakiet z obwodu"
 ROS_p_szl_pj_rozbrojenie_desc:0 "Wyrzutnie wracają w głąb kraju. Sąsiedzi oddychają z ulgą."
 ROS_p_szl_pj_final:0 "Dobre sąsiedztwo"
 ROS_p_szl_pj_final_desc:0 "Rosja nie jest już zagrożeniem dla sąsiadów – przynajmniej na razie."
 ROS_p_szl_on_akademia:0 "Akademia Nauk bez cenzury"
 ROS_p_szl_on_akademia_desc:0 "Naukowcy publikują wyniki bez zgody urzędników."
 ROS_p_szl_on_powroty:0 "Granty dla wracających"
 ROS_p_szl_on_powroty_desc:0 "Naukowcy z emigracji dostają laboratoria i pensje."
 ROS_p_szl_on_uniwersytety:0 "Wolne uniwersytety"
 ROS_p_szl_on_uniwersytety_desc:0 "Uczelnie same wybierają rektorów i programy."
 ROS_p_szl_on_kosmos:0 "Program kosmiczny"
 ROS_p_szl_on_kosmos_desc:0 "Kosmodromy wracają do pracy – dla nauki, nie dla wojska."
 ROS_p_szl_on_final:0 "Rosja wiedzy"
 ROS_p_szl_on_final_desc:0 "Najlepszym rosyjskim towarem eksportowym znów są głowy, nie ropa."
 ROS_p_szl_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_szl_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
