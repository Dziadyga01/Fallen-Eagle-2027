 ROS_p_szl_future_po_wolnosc:0 "Wolność zgromadzeń"
 ROS_p_szl_future_po_wolnosc_desc:0 "Demonstracje nie wymagają zgody – tylko zgłoszenia."
 ROS_p_szl_future_po_mniejszosci:0 "Prawa mniejszości narodowych"
