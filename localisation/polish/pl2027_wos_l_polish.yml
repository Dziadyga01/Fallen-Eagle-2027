 cpz.560.t:0 "Nowe państwo, nowa kampania"
 cpz.560.d:0 "Wybrany region ogłasza niepodległość. Od teraz prowadzisz go sam. (Historia alternatywna moda.)"
 cpz.560.a:0 "Zaczynamy lokalną kampanię."
 CPZ_tt_a1229e02:0 "Kryzys konstytucyjny: §G-15§!; Poparcie dla rządu: §G+5§!; Poparcie dla obozu prezydencko-opozycyjnego: §G-10§!; Napięcie społeczne: §G-5§!"
 cpz.520.t:0 "Rząd utrzymuje władzę"
 cpz.520.d:0 "Obóz prezydencki skapitulował. Rząd kontroluje stolicę, ale państwo jest wyczerpane, a regiony nie zapomną tych miesięcy. (Historia alternatywna moda.)"
 cpz.520.a:0 "Odbudować państwo."
 CPZ_tt_49bddd12:0 "Napięcie regionalne (nastroje separatystyczne): §R+15§!; Kryzys konstytucyjny: §R+5§!"
 cpz.521.t:0 "Obóz prezydencki przejmuje stolicę"
 cpz.521.d:0 "Rząd skapitulował. Pałac ogłasza przejęcie władzy, ale część regionów nie uznaje nowego ośrodka i przyspiesza rozpad. (Historia alternatywna moda.)"
 cpz.521.a:0 "Rozpad przyspiesza."
 CPZ_tt_de17e8bc:0 "Kryzys konstytucyjny: §G-15§!; Spójność koalicji: §G+4§!; Poparcie dla obozu prezydencko-opozycyjnego: §G-6§!; Napięcie społeczne: §G-6§!; Napięcie regionalne (nastroje separatystyczne): §G-5§!"
 CPZ_tt_67eb078f:0 "Kryzys konstytucyjny: §R+6§!; Napięcie społeczne: §R+4§!"
 cpz.700.t:0 "Okrągły stół w sprawie Trybunału"
 cpz.700.d:0 "Przy jednym stole siadają przedstawiciele rządu, prezydenta, klubów i sędziów. Nikt nie wierzy w szybki sukces. Jeśli rozmowy się udadzą, Rzeczpospolita dostanie szansę na stabilizację. (Historia alternatywna moda.)"
 cpz.700.a:0 "Kompromis: reset Trybunału większością kwalifikowaną."
 cpz.700.b:0 "Rozmowy zerwane."
 cpz.790.t:0 "Rzeczpospolita ocalona"
 cpz.790.d:0 "Spór o Trybunał zakończył się kompromisem, a województwa wróciły do zwykłej pracy. Polska pozostała jednym państwem. (Historia alternatywna moda.)"
 cpz.790.a:0 "Jedna Rzeczpospolita."
 cpz.800.t:0 "Godzina Zero"
 cpz.800.d:0 "Rzeczpospolita przestaje działać jako jedno państwo. Ostatnie województwa ogłaszają niepodległość, a w Warszawie władzę dzielą Sejm, Pałac i dzielnice. Od jutra mapa wygląda tak jak 11 listopada 2027 roku. Gdzie grasz dalej? (Historia alternatywna moda.)"
 cpz.800.a:0 "Sejm i Straż Marszałkowska (rząd po rozpadzie)."
 cpz.800.b:0 "Kancelaria Prezydenta i SOP."
 cpz.800.c:0 "Wybrać państwo regionalne."
 cpz.802.t:0 "Rzeczpospolita się rozpada"
 cpz.802.d:0 "Rzeczpospolita Polska przestała istnieć jako jedno państwo. Na jej miejscu powstały dziesiątki państw regionalnych. (Historia alternatywna moda.)"
 cpz.802.a:0 "Świat z 11 listopada 2027."
 CPZ_donald_tusk:0 "Donald Tusk"
 CPZ_karol_nawrocki:0 "Karol Nawrocki"
 CPZ_i_kryzys:0 "Kryzys konstytucyjny"
 CPZ_i_kryzys_desc:0 "Rząd i prezydent spierają się o Trybunał Konstytucyjny. Każda decyzja jednej strony jest kwestionowana przez drugą."
 CPZ_i_podzielone:0 "Podzielone społeczeństwo"
 CPZ_i_podzielone_desc:0 "Dwa obozy, dwie telewizje, dwie wersje każdego wydarzenia."
 CPZ_i_podzielone_slabe:0 "Społeczeństwo szuka porozumienia"
 CPZ_i_podzielone_slabe_desc:0 "Podziały zostały, ale coraz więcej ludzi chce rozmowy zamiast konfrontacji."
 CPZ_i_spor:0 "Spór o legalność instytucji"
 CPZ_i_spor_desc:0 "Nikt nie wie, które orzeczenia obowiązują. Każde wydarzenie polityczne podnosi napięcie społeczne o dodatkowy punkt, a okrągły stół wymaga kryzysu poniżej 55 zamiast 65."
 CPZ_i_gospodarka:0 "Polska gospodarka 2026"
 CPZ_i_gospodarka_desc:0 "Gospodarka wciąż rośnie. Poważny kryzys (powyżej 74) zamieni tę premię w karę."
 CPZ_i_gospodarka_kryzys:0 "Gospodarka w kryzysie"
 CPZ_i_gospodarka_kryzys_desc:0 "Inwestorzy wstrzymują decyzje, złoty traci. Gdy kryzys spadnie poniżej 50, gospodarka wróci do wzrostu."
 CPZ_i_struktury:0 "Struktury państwa"
 CPZ_i_struktury_desc:0 "Urzędy, wojewodowie i samorządy działają. Premia do lojalności regionów jest już w wartościach startowych województw. Gdy lojalność administracji spadnie poniżej 40, struktury zaczną słabnąć."
 CPZ_i_struktury_slabe:0 "Struktury państwa słabną"
 CPZ_i_struktury_slabe_desc:0 "Urzędnicy nie wiedzą, czyje polecenia wykonywać."
 CPZ_i_wojna:0 "Wojna domowa"
 CPZ_i_wojna_desc:0 "Polacy walczą z Polakami."
 CPZ_i_odbudowa:0 "Kraj do odbudowy"
 CPZ_i_odbudowa_desc:0 "Zniszczone mosty, puste magazyny i urzędy bez ludzi."
 CPZ_i_odrodzona:0 "Rzeczpospolita odrodzona"
 CPZ_i_odrodzona_desc:0 "Państwo przetrwało najgłębszy kryzys od 1989 roku i wyszło z niego silniejsze."
 CPZ_i_reformy:0 "Program reform państwowych"
 CPZ_i_reformy_desc:0 "Szybsze inwestycje i sprawniejsza administracja."
 CPZ_i_sztab:0 "Nadzwyczajny sztab"
 CPZ_i_sztab_desc:0 "Jedno centrum dowodzenia."
 CPZ_i_finanse:0 "Wojenne finanse"
 CPZ_i_finanse_desc:0 "Budżet idzie na wojsko, nie na budowy."
 CPZ_i_lacznosc:0 "Łączność przywrócona"
 CPZ_i_lacznosc_desc:0 "Rozkazy i dostawy docierają na czas."
 CPZ_i_kprm:0 "Kancelaria Premiera w rękach rządu"
 CPZ_i_kprm_desc:0 "Aleje Ujazdowskie pod ochroną."
 CPZ_i_obrona_instytucji:0 "Obrona instytucji"
 CPZ_i_obrona_instytucji_desc:0 "Urzędy, sądy i Sejm pod ochroną wojska i policji."
 CPZ_i_obrona_stolicy:0 "Obrona stolicy"
 CPZ_i_obrona_stolicy_desc:0 "Warszawa w umocnieniach (premia działa w całej armii – silnik nie pozwala ograniczyć jej do jednego miasta)."
 CPZ_i_mon:0 "Sztab kryzysowy MON"
 CPZ_i_mon_desc:0 "Logistyka wojska pod jednym dowództwem."
 CPZ_i_gosp_wojenna:0 "Gospodarka wojenna"
 CPZ_i_gosp_wojenna_desc:0 "Fabryki przestawiają się na produkcję dla wojska."
 CPZ_i_ofensywa:0 "Ograniczona ofensywa"
 CPZ_i_ofensywa_desc:0 "Jedno uderzenie, by złamać impas."
 CPZ_i_dowodcy:0 "Lojalni dowódcy"
 CPZ_i_dowodcy_desc:0 "Oficerowie, którzy wybrali Belweder."
 CPZ_i_jedno_dowodztwo:0 "Jedno dowództwo"
 CPZ_i_jedno_dowodztwo_desc:0 "Koniec sporów między jednostkami obozu prezydenckiego."
 CPZ_i_marsz:0 "Marsz na stolicę"
 CPZ_i_marsz_desc:0 "Plany, zapasy i trasy na Warszawę."
 CPZ_i_komisja:0 "Komisja odbudowy"
 CPZ_i_komisja_desc:0 "Najpierw drogi, mosty i koleje."
 CPZ_i_zaopatrzenie:0 "Żywność i energia zabezpieczone"
 CPZ_i_zaopatrzenie_desc:0 "Administracja regionu zgromadziła zapasy."
 CPZ_i_adm_prez:0 "Tymczasowa administracja prezydencka"
 CPZ_i_adm_prez_desc:0 "Rządy dekretów do czasu nowej konstytucji."
 CPZ_i_rzad_techniczny:0 "Rząd techniczny"
 CPZ_i_rzad_techniczny_desc:0 "Rząd fachowców do czasu wyborów."
 CPZ_i_koalicja_prawicy:0 "Rząd koalicyjny prawicy"
 CPZ_i_koalicja_prawicy_desc:0 "Kilka partii, jeden rząd i wiele sporów."
 CPZ_i_pomoc_ue:0 "Pomoc gospodarcza z Brukseli"
 CPZ_i_pomoc_ue_desc:0 "Fundusze europejskie łatają budżet."
 CPZ_bop:0 "Władza w Rzeczypospolitej"
 CPZ_bop_rzad:0 "Rząd i większość parlamentarna"
 CPZ_bop_prez:0 "Obóz prezydencko-opozycyjny"
 CPZ_bop_rownowaga:0 "Chwiejna równowaga"
 CPZ_bop_rzad_przewaga:0 "Rząd ma inicjatywę"
 CPZ_bop_rzad_dominacja:0 "Rząd rządzi sam"
 CPZ_bop_prez_przewaga:0 "Pałac ma inicjatywę"
 CPZ_bop_prez_dominacja:0 "Dwuwładza"
 CPZ_tt_b810c581:0 "Napięcie społeczne: §R+2§!"
 CPZ_tt_e2756473:0 "Napięcie społeczne: §R+4§!"
 cpz.920.t:0 "Most wysadzony"
 cpz.920.d:0 "Nocą ktoś wysadził most na Wiśle. Obie strony oskarżają się nawzajem, a ciężarówki z zaopatrzeniem stoją w korkach. (Historia alternatywna moda.)"
 cpz.920.a:0 "Saperzy budują przeprawę."
 cpz.920.b:0 "Zwalić winę na przeciwnika."
 CPZ_tt_c1270a94:0 "Lojalność Sił Zbrojnych RP: §G+2§!"
 CPZ_tt_7d8f3770:0 "Lojalność Sił Zbrojnych RP: §R-3§!; Napięcie społeczne: §R+3§!"
 cpz.921.t:0 "Dezercje"
 cpz.921.d:0 "Z kilku jednostek uciekają żołnierze – nie chcą strzelać do rodaków. (Historia alternatywna moda.)"
 cpz.921.a:0 "Amnestia dla wracających."
 cpz.921.b:0 "Sądy polowe."
 CPZ_tt_11c508b6:0 "Napięcie społeczne: §G-3§!"
 CPZ_tt_d76d5998:0 "Napięcie społeczne: §R+5§!"
 cpz.922.t:0 "Kolumna uchodźców"
 cpz.922.d:0 "Drogi na zachód zapchane są samochodami. Ludzie uciekają przed walkami do Niemiec i Czech. (Historia alternatywna moda.)"
 cpz.922.a:0 "Korytarz humanitarny."
 cpz.922.b:0 "Zamknąć drogi dla cywilów."
 CPZ_tt_5c85fe9a:0 "Napięcie społeczne: §G-2§!"
 cpz.923.t:0 "Szpitale przepełnione"
 cpz.923.d:0 "Szpitale w strefie walk przyjmują rannych z obu stron. Brakuje krwi i lekarzy. (Historia alternatywna moda.)"
 cpz.923.a:0 "Zbiórka krwi w całym kraju."
 cpz.923.b:0 "Lekarze do wojska."
 cpz.924.t:0 "Zagraniczni ochotnicy"
 cpz.924.d:0 "Przez granicę przechodzą ochotnicy z całej Europy – jedni do rządu, inni do Belwederu. (Historia alternatywna moda.)"
 cpz.924.a:0 "Przyjąć ich do wojska."
 cpz.924.b:0 "Zamknąć granicę."
 cpz.925.t:0 "Front stanął"
 cpz.925.d:0 "Mróz i błoto zatrzymały ofensywę. Żołnierze kopią okopy jak sto lat temu. (Historia alternatywna moda.)"
 cpz.925.a:0 "Okopać się na zimę."
 cpz.925.b:0 "Atakować mimo pogody."
 CPZ_tt_0c0e82a0:0 "Lojalność Policji: §R-2§!; Napięcie społeczne: §R+4§!; Napięcie regionalne (nastroje separatystyczne): §R+2§!"
 CPZ_tt_44416fca:0 "Poparcie dla rządu: §R-2§!; Napięcie społeczne: §G-2§!"
 CPZ_tt_798bd17a:0 "Rezerwy państwowe: §R-4§!"
 cpz.900.t:0 "Blokady dróg"
 cpz.900.d:0 "Rolnicy i przewoźnicy blokują drogi krajowe i przejścia graniczne. Domagają się gwarancji, że ktoś w Warszawie jeszcze odpowiada za ich kontrakty. (Historia alternatywna moda.)"
 cpz.900.a:0 "Wysłać policję do udrożnienia dróg."
 cpz.900.b:0 "Negocjować z blokującymi."
 CPZ_tt_f9adf517:0 "Rezerwy państwowe: §R-6§!"
 CPZ_tt_f9d11672:0 "Napięcie społeczne: §R+3§!; Poparcie dla rządu: §R-1§!"
 cpz.901.t:0 "Kolejki na stacjach"
 cpz.901.d:0 "Plotka o braku paliwa wystarczyła: przed stacjami stoją kolejki na kilometr, a w kanistrach znikają zapasy z całego tygodnia. (Historia alternatywna moda.)"
 cpz.901.a:0 "Uwolnić paliwo z rezerw strategicznych."
 cpz.901.b:0 "Limity sprzedaży na stacjach."
 CPZ_tt_bd1323fb:0 "Rezerwy państwowe: §R-8§!"
 CPZ_tt_f5b9b0c1:0 "Napięcie społeczne: §R+5§!; Poparcie dla rządu: §R-2§!"
 cpz.902.t:0 "Szturm na bankomaty"
 cpz.902.d:0 "Ludzie wypłacają oszczędności, banki ograniczają wypłaty. Złoty traci najwięcej od lat. (Historia alternatywna moda.)"
 cpz.902.a:0 "Gwarancje rządu dla depozytów."
 cpz.902.b:0 "Czasowe limity wypłat."
 CPZ_tt_9a585a22:0 "Lojalność Policji: §R-2§!; Napięcie społeczne: §R+4§!"
 CPZ_tt_1a368140:0 "Lojalność Policji: §R-3§!; Napięcie regionalne (nastroje separatystyczne): §R+4§!"
 cpz.903.t:0 "Samozwańcze straże obywatelskie"
 cpz.903.d:0 "W kilku powiatach mieszkańcy organizują straże obywatelskie. Patrolują ulice z kijami i radiotelefonami – i nie słuchają policji. (Historia alternatywna moda.)"
 cpz.903.a:0 "Rozwiązać je."
 cpz.903.b:0 "Przymknąć oko."
 CPZ_tt_82aab0dd:0 "Lojalność Sił Zbrojnych RP: §R-1§!; Napięcie społeczne: §G-1§!; Lojalność administracji: §G+2§!"
 CPZ_tt_6219cd94:0 "Napięcie społeczne: §R+4§!; Napięcie regionalne (nastroje separatystyczne): §R+2§!"
 cpz.904.t:0 "Blackout"
 cpz.904.d:0 "Awaria w sieci przesyłowej zostawia bez prądu pół województwa. Operator mówi o przeciążeniu, internet – o sabotażu. (Historia alternatywna moda.)"
 cpz.904.a:0 "Wojsko pilnuje stacji elektroenergetycznych."
 cpz.904.b:0 "Czekać na naprawę."
 CPZ_tt_7d6b28c4:0 "Napięcie społeczne: §R+5§!; Napięcie regionalne (nastroje separatystyczne): §R+3§!"
 cpz.905.t:0 "Strajk w kopalniach"
 cpz.905.d:0 "Górnicy odchodzą od pracy. Chcą wiedzieć, kto zapłaci ich pensje, jeśli województwo przestanie słuchać Warszawy. (Historia alternatywna moda.)"
 cpz.905.a:0 "Wypłacić zaległości z rezerw."
 cpz.905.b:0 "Nie ustępować."
 CPZ_tt_e91b2188:0 "Napięcie społeczne: §G-3§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!; Poparcie dla rządu: §R-1§!"
 CPZ_tt_574c107e:0 "Napięcie społeczne: §R+2§!; Poparcie dla rządu: §G+1§!"
 cpz.906.t:0 "Fala dezinformacji"
 cpz.906.d:0 "Sfałszowane nagrania o czołgach na ulicach Warszawy krążą po sieci szybciej niż sprostowania. Część z nich pochodzi z kont spoza Polski. (Historia alternatywna moda.)"
 cpz.906.a:0 "Wspólny komunikat rządu i Pałacu."
 cpz.906.b:0 "Blokować fałszywe konta."
 CPZ_tt_7830d8d0:0 "Lojalność administracji: §R-2§!; Napięcie społeczne: §G-1§!"
 CPZ_tt_dd747b4b:0 "Lojalność administracji: §R-4§!; Napięcie społeczne: §G-3§!"
 CPZ_tt_24f3f83c:0 "Rezerwy państwowe: §R-3§!"
 cpz.907.t:0 "Ucieczka z miast"
 cpz.907.d:0 "Kto ma dom na wsi albo rodzinę za granicą, wyjeżdża. Na dworcach tłumy, w urzędach puste biurka. (Historia alternatywna moda.)"
 cpz.907.a:0 "Apel o pozostanie na miejscu."
 cpz.907.b:0 "Pomoc dla wyjeżdżających."
 CPZ_tt_8f52b7e8:0 "Lojalność Policji: §R-2§!; Napięcie społeczne: §R+2§!"
 CPZ_tt_14ce685d:0 "Lojalność Policji: §R-1§!; Poparcie dla rządu: §R-2§!"
 cpz.908.t:0 "Bunt w areszcie"
 cpz.908.d:0 "Osadzeni w areszcie śledczym przejmują jeden z pawilonów. Służba Więzienna prosi o wsparcie, którego policja nie ma skąd wziąć. (Historia alternatywna moda.)"
 cpz.908.a:0 "Szturm grupy specjalnej."
 cpz.908.b:0 "Rokowania."
 CPZ_tt_b99c6c9e:0 "Lojalność Sił Zbrojnych RP: §R-2§!; Napięcie regionalne (nastroje separatystyczne): §R+2§!"
 CPZ_tt_410c1be9:0 "Lojalność Sił Zbrojnych RP: §R-1§!; Napięcie regionalne (nastroje separatystyczne): §R+4§!; Napięcie społeczne: §R+2§!"
 cpz.909.t:0 "Splądrowany magazyn broni"
 cpz.909.d:0 "Ktoś wyniósł broń z magazynu jednostki rezerwowej. Nikt nie wie, czy to złodzieje, czy ochotnicy jednej ze stron. (Historia alternatywna moda.)"
 cpz.909.a:0 "Śledztwo Żandarmerii."
 cpz.909.b:0 "Utajnić sprawę."
 CPZ_tt_06b145d8:0 "Napięcie regionalne (nastroje separatystyczne): §R+4§!; Poparcie dla rządu: §G+1§!"
 CPZ_tt_a2c9b331:0 "Napięcie regionalne (nastroje separatystyczne): §R+6§!; Kryzys konstytucyjny: §G-1§!; Lojalność administracji: §R-3§!"
 cpz.910.t:0 "Sejmik uchwala własny budżet"
 cpz.910.d:0 "Sejmik jednego z województw uchwala budżet bez czekania na pieniądze z Warszawy – z własnych podatków. (Historia alternatywna moda.)"
 cpz.910.a:0 "Zaskarżyć uchwałę."
 cpz.910.b:0 "Uznać fakty dokonane."
 CPZ_tt_206121e4:0 "Lojalność Policji: §R-1§!; Napięcie społeczne: §R+4§!"
 CPZ_tt_ad232e9c:0 "Napięcie regionalne (nastroje separatystyczne): §R+4§!; Napięcie społeczne: §R+1§!"
 cpz.911.t:0 "Kibice na ulicach"
 cpz.911.d:0 "Po meczu kibice kilku klubów zamiast do domu idą pod urzędy wojewódzkie. Race, transparenty i jedno hasło: „Nasze miasto”. (Historia alternatywna moda.)"
 cpz.911.a:0 "Oddziały prewencji na ulice."
 cpz.911.b:0 "Pozwolić im przejść."
 CPZ_tt_ef20f920:0 "Kryzys konstytucyjny: §R+4§!; Poparcie dla rządu: §R-3§!"
 cpz.450.t:0 "PSL opuszcza koalicję"
 cpz.450.d:0 "Spór o Trybunał przelał czarę goryczy. Kierownictwo partii PSL ogłasza wyjście z koalicji rządowej. Większość sejmowa topnieje. (Historia alternatywna moda.)"
 cpz.450.a:0 "Rząd mniejszościowy też jest rządem."
 cpz.451.t:0 "Polska 2050 opuszcza koalicję"
 cpz.451.d:0 "Spór o Trybunał przelał czarę goryczy. Kierownictwo partii Polska 2050 ogłasza wyjście z koalicji rządowej. Większość sejmowa topnieje. (Historia alternatywna moda.)"
 cpz.451.a:0 "Rząd mniejszościowy też jest rządem."
 cpz.452.t:0 "Lewica opuszcza koalicję"
 cpz.452.d:0 "Spór o Trybunał przelał czarę goryczy. Kierownictwo partii Lewica ogłasza wyjście z koalicji rządowej. Większość sejmowa topnieje. (Historia alternatywna moda.)"
 cpz.452.a:0 "Rząd mniejszościowy też jest rządem."
 CPZ_tt_85a5298b:0 "Napięcie regionalne (nastroje separatystyczne): §G-8§!; Kryzys konstytucyjny: §G-3§!"
 CPZ_tt_51fce418:0 "Rozpad województw zatrzymuje się na 30 dni."
 CPZ_tt_e727eda7:0 "Napięcie regionalne (nastroje separatystyczne): §G-3§!"
 CPZ_tt_38798848:0 "Województwa w kryzysie regionalnym tworzą regiony autonomiczne."
 CPZ_tt_4eccd9b8:0 "Napięcie regionalne (nastroje separatystyczne): §R+10§!; Kryzys konstytucyjny: §R+4§!"
 cpz.380.t:0 "Statuty autonomiczne"
 cpz.380.d:0 "Sejmiki kilku województw przyjmują statuty: własne budżety, policja i prawo do decydowania o przyszłości regionu. Warszawa musi odpowiedzieć. (Historia alternatywna moda.)"
 cpz.380.a:0 "Federacja: wspólne państwo, szerokie kompetencje."
 cpz.380.b:0 "Autonomia dla regionów w kryzysie."
 cpz.380.c:0 "Prawo do secesji."
 CPZ_tt_ea7827fb:0 "Kryzys konstytucyjny: §G-8§!; Napięcie społeczne: §G-5§!"
 cpz.540.t:0 "Los Rzeczypospolitej"
 cpz.540.d:0 "Wojna trwa. Sztab kładzie na stole trzy plany: rozmowy, umocnienie tego, co zostało, albo walka do końca. (Historia alternatywna moda.)"
 cpz.540.a:0 "Szukać rozmów."
 cpz.540.b:0 "Konsolidacja."
 cpz.540.c:0 "Walka do końca."
 CPZ_tt_6ca42745:0 "Kryzys konstytucyjny: §G-10§!; Napięcie społeczne: §G-4§!"
 cpz.545.t:0 "Złamać impas"
 cpz.545.d:0 "Front stoi. Rząd może zaproponować rozejm albo jedno uderzenie, które ma przesądzić wynik. (Historia alternatywna moda.)"
 cpz.545.a:0 "Zaproponować rozejm."
 cpz.545.b:0 "Ograniczona ofensywa."
 CPZ_tt_3d77f8e5:0 "Poparcie dla rządu: §G+2§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+3§!"
 CPZ_tt_5455590f:0 "Rezerwy państwowe: §G+15§!"
 CPZ_tt_07549af2:0 "Rezerwy państwowe: §G+3§!"
 cpz.546.t:0 "Rozmowy z Brukselą"
 cpz.546.d:0 "Komisja Europejska proponuje pomoc gospodarczą dla rządu. Opozycja mówi o obcym wpływie. (Historia alternatywna moda.)"
 cpz.546.a:0 "Przyjąć pomoc."
 cpz.546.b:0 "Poradzimy sobie sami."
 cpz.547.t:0 "Komunikat do narodu"
 cpz.547.d:0 "Premier występuje w telewizji. Od tonu zależy, czy ludzie usłyszą wezwanie do spokoju, czy do obrony konstytucji. (Historia alternatywna moda.)"
 cpz.547.a:0 "Spokój i odpowiedzialność."
 cpz.547.b:0 "Obrona konstytucji."
 CPZ_tt_c05b2aca:0 "Poparcie dla obozu prezydencko-opozycyjnego: §R+3§!"
 cpz.548.t:0 "Oświadczenie prezydenta"
 cpz.548.d:0 "Kancelaria Prezydenta ogłasza powstanie alternatywnego ośrodka władzy i wzywa urzędników do wykonywania jego poleceń. (Historia alternatywna moda.)"
 cpz.548.a:0 "Czekamy na odpowiedź Warszawy."
 CPZ_tt_084b4871:0 "Jedność obozu prezydencko-opozycyjnego: §G+10§!"
 CPZ_tt_585cdcc9:0 "Jedność obozu prezydencko-opozycyjnego: §R-5§!"
 cpz.549.t:0 "Rozmowy z Konfederacją"
 cpz.549.d:0 "Konfederacja nie chce być niczyim zapleczem. Stawia warunki: wybory, reset Trybunału i własne miejsca w przyszłym rządzie. (Historia alternatywna moda.)"
 cpz.549.a:0 "Przyjąć warunki."
 cpz.549.b:0 "Niech zostaną neutralni."
 CPZ_tt_jurek:0 "Dostępne po fokusie „Rząd techniczny”."
 CPZ_tt_b60287f6:0 "Poparcie dla obozu prezydencko-opozycyjnego: §R+4§!"
 CPZ_tt_ba737b7c:0 "Jedność obozu prezydencko-opozycyjnego: §G+5§!"
 cpz.550.t:0 "Narodowa rada polityczna"
