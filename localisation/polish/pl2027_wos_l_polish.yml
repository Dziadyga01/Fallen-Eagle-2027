 TR2_kre_straze_sasiedzkie:0 "Straże sąsiedzkie"
 TR2_kre_straze_sasiedzkie_desc:0 "Każda dzielnica wystawia własną straż. Najgłośniej mówi się o tej z Rubinkowa – prowadzi ją ktoś, kto nie zdejmuje maski."
 LIT_panel:0 "Litwa: przesmyk suwalski"
 LIT_panel_desc:0 "Bezpieczeństwo przesmyku: §Y[?LIT_przesmyk|0]§!/100\n§YCel:§! utrzymać co najmniej 60 – wtedy Rosja nie próbuje wymusić korytarza do Królewca.\n§YKoszt:§! patrole, ćwiczenia i umocnienia kosztują władzę polityczną.\n§YZaniedbanie:§! presja Rosji obniża wskaźnik o 2 co miesiąc (o 5, gdy Rosja walczy na Mazurach albo szykuje drugą operację). Poniżej 25 – żądanie korytarza tranzytowego."
 LIT_dm:0 "Bezpieczeństwo przesmyku"
 LIT_dec_patrole:0 "Patrole na przesmyku"
 LIT_dec_patrole_desc:0 "Straż graniczna i strzelcy patrolują drogi między Kalwarią a Łoździejami. Każdy most ma wartę."
 LIT_dec_cwiczenia:0 "Ćwiczenia z sojusznikami"
 LIT_dec_cwiczenia_desc:0 "Wspólne ćwiczenia z brygadami sojuszników. Moskwa liczy czołgi i notuje daty."
 LIT_dec_umocnienia:0 "Umocnienia nad Szeszupą"
 LIT_dec_umocnienia_desc:0 "Rowy przeciwpancerne, zapory i stanowiska ogniowe wzdłuż granicy z Obwodem."
 lit.10.t:0 "Moskwa żąda korytarza"
 lit.10.d:0 "Ambasador Rosji przynosi notę: tranzyt wojskowy do Obwodu Królewieckiego przez terytorium Litwy „w interesie stabilności regionu”. Odmowa – jak sugeruje nota – będzie miała konsekwencje."
 lit.10.a:0 "Zgodzić się na ograniczony tranzyt."
 lit.10.b:0 "Odmówić. Granica jest zamknięta."
 lit.20.t:0 "Oferta z Wilna"
 lit.20.d:0 "Litwa proponuje Suwalszczyźnie protektorat: wspólna obrona, szkoły, pieniądze na zimę. W zamian – polityka zagraniczna ustalana w Wilnie."
 lit.20.a:0 "Przyjąć – sami nie przetrwamy."
 lit.20.b:0 "Odmówić – jesteśmy Polakami, nie protektoratem."
 lit.30.t:0 "Bastion Bałtycki"
 lit.30.d:0 "Litwa zamyka przesmyk suwalski: brygady sojusznicze, umocnienia i wspólne dowództwo. Droga z Królewca do Mińska jest teraz pod obserwacją dzień i noc."
 lit.30.a:0 "Region się zmienia."
 lit.31.t:0 "Wspólnota Nadniemeńska"
 lit.31.d:0 "Wilno ogłasza wspólnotę obronną i gospodarczą z ziemiami nad Niemnem. Jedni mówią o opiece, inni o nowej granicy."
 lit.31.a:0 "Region się zmienia."
 lit.32.t:0 "Neutralna Litwa"
 lit.32.d:0 "Litwa podpisuje umowę tranzytową z Moskwą i ogłasza neutralność w polskim konflikcie. W Berlinie i Warszawie przyjęto to chłodno."
 lit.32.a:0 "Region się zmienia."
 WOS_tt_45:0 "Uruchamia wskaźnik „Bezpieczeństwo przesmyku” (panel „Litwa: przesmyk suwalski”)."
 WOS_tt_46:0 "Dołączenie do sojuszu „Tarcza Europy”, jeśli istnieje i Litwa nie jest w innym sojuszu."
 LIT_req_60:0 "Bezpieczeństwo przesmyku co najmniej 60"
 LIT_b_rada:0 "Rada Obrony Państwa"
 LIT_b_rada_desc:0 "Rząd w Wilnie zbiera Radę Obrony. Rozpad Polski otworzył lukę między Królewcem a Białorusią – i to Litwa musi ją zamknąć."
 LIT_b_granica:0 "Przesmyk suwalski"
 LIT_b_granica_desc:0 "Sześćdziesiąt kilometrów między Obwodem a Białorusią. Mapa sztabowa wisi w każdym ministerstwie."
 LIT_b_uchodzcy:0 "Uchodźcy z Polski"
 LIT_b_uchodzcy_desc:0 "Na przejściach w Budziskach i Ogrodnikach stoją kolejki. Litwa przyjmuje ludzi – i ich historie."
 LIT_b_mniejszosc:0 "Wileńszczyzna i Polacy"
 LIT_b_mniejszosc_desc:0 "Polska mniejszość na Wileńszczyźnie patrzy na rozpad Polski z niepokojem. Rząd zapewnia: szkoły i samorządy zostają."
 LIT_b_tarcza:0 "Tarcza Bałtycka"
 LIT_b_tarcza_desc:0 "Obrona razem z sojusznikami: brygady, wspólne dowództwo i plan obrony przesmyku."
 LIT_b_wspolnota:0 "Wspólnota z Suwalszczyzną"
 LIT_b_wspolnota_desc:0 "Ziemie nad Niemnem i Czarną Hańczą mają wspólną historię. Wilno proponuje sąsiadom opiekę – i swoje warunki."
 LIT_b_neutralnosc:0 "Neutralność wobec Moskwy"
 LIT_b_neutralnosc_desc:0 "Umowa z Rosją zamiast okopów: tranzyt do Królewca na litewskich zasadach i spokój na granicy."
 LIT_b_t_brygada:0 "Brygada sojusznicza"
 LIT_b_t_brygada_desc:0 "Jeśli Berlin zbudował Tarczę Europy, Litwa do niej dołącza."
 LIT_b_t_suwalszczyzna:0 "Gwarancja dla Suwalszczyzny"
 LIT_b_t_suwalszczyzna_desc:0 "Atak na Suwalszczyznę będzie traktowany jak atak na Litwę – jeśli rządy obu stron mówią tym samym językiem politycznym."
 LIT_b_t_final:0 "Bastion Bałtycki"
 LIT_b_t_final_desc:0 "Przesmyk jest zamknięty: umocnienia, brygady sojusznicze i wspólne dowództwo."
 LIT_b_w_szkoly:0 "Szkoły i konsulaty w Sejnach"
 LIT_b_w_szkoly_desc:0 "Litewskie szkoły, konsulat i pomoc na zimę. Sąsiedzi przyzwyczajają się do Wilna."
 LIT_b_w_protektorat:0 "Oferta protektoratu"
 LIT_b_w_protektorat_desc:0 "Suwalszczyzna dostaje propozycję protektoratu. Odmowa nie oznacza wojny."
 LIT_b_w_final:0 "Wspólnota Nadniemeńska"
 LIT_b_w_final_desc:0 "Wilno i ziemie nad Niemnem – wspólna obrona, wspólny rynek, wspólne szkoły."
 LIT_b_n_tranzyt:0 "Umowa tranzytowa"
 LIT_b_n_tranzyt_desc:0 "Pociągi do Królewca jadą na litewskich zasadach: plomby, kontrole i opłaty."
 LIT_b_n_klajpeda:0 "Handel przez Kłajpedę"
 LIT_b_n_klajpeda_desc:0 "Port zarabia na tranzycie i handlu, którego w Polsce nie ma komu prowadzić."
 LIT_b_n_final:0 "Neutralna Litwa"
 LIT_b_n_final_desc:0 "Litwa nie walczy w polskich wojnach i nie pozwala ich prowadzić na swoim terenie."
 CZE_panel:0 "Czechy: pogranicze"
 CZE_panel_desc:0 "Stabilność pogranicza: §Y[?CZE_pogr|0]§!/100\n§YCel:§! co najmniej 50 – wtedy działa korytarz handlowy do Polski, a kampania „Most Środkowoeuropejski” może się zakończyć.\n§YKoszt:§! straż graniczna i pomoc humanitarna kosztują władzę polityczną.\n§YZaniedbanie:§! uchodźcy i przemyt obniżają wskaźnik o 1 co miesiąc (o 4, gdy Śląsk walczy). Poniżej 25 – bojówki na granicy."
 CZE_dm:0 "Stabilność pogranicza"
 CZE_dec_straz:0 "Straż graniczna w Sudetach"
 CZE_dec_straz_desc:0 "Policja i wojsko na przełęczach. Przemytnicy wybierają dłuższe drogi."
 CZE_dec_pomoc:0 "Pomoc humanitarna dla Śląska"
 CZE_dec_pomoc_desc:0 "Konwoje z żywnością i lekami przez Kudowę i Harrachov. Śląsk pamięta, kto pomógł."
 CZE_idea_korytarz:0 "Korytarz handlowy"
 CZE_idea_korytarz_desc:0 "Ciężarówki z czeskich fabryk jadą do polskich miast – i wracają z zamówieniami."
 CZE_req_50:0 "Stabilność pogranicza co najmniej 50"
 CZE_dec_korytarz:0 "Korytarz handlowy"
 CZE_dec_korytarz_desc:0 "Ciężarówki z towarem jadą do polskich państw. Zarabiają firmy, a granica jest spokojniejsza."
 cze.10.t:0 "Bojówki na granicy"
 cze.10.d:0 "Uzbrojeni ludzie z polskiej strony przekraczają granicę po paliwo i żywność. W dwóch wioskach doszło do strzelaniny."
 cze.10.a:0 "Wojsko na granicę."
 cze.10.b:0 "Rozmowy z sąsiadami po drugiej stronie."
 cze.30.t:0 "Wspólna granica z Niemcami"
 cze.30.d:0 "Czechy i Niemcy patrolują razem granicę z rozbitą Polską. Praga mówi o bezpieczeństwie, Wrocław – o murze."
 cze.30.a:0 "Region się zmienia."
 cze.31.t:0 "Praga – stolica regionu"
 cze.31.d:0 "Czeska mediacja i handel czynią Pragę najważniejszym partnerem polskich państw. Delegacje z Torunia, Lublina i Gdańska czekają w kolejce."
 cze.31.a:0 "Region się zmienia."
 WOS_tt_47:0 "Uruchamia wskaźnik „Stabilność pogranicza” (panel „Czechy: pogranicze”)."
 CZE_b_rada:0 "Rada Bezpieczeństwa Republiki"
 CZE_b_rada_desc:0 "Rząd zbiera Radę Bezpieczeństwa. Na północy – kraj, który przestał istnieć, i ludzie, którzy uciekają przez góry."
 CZE_b_sudety:0 "Pogranicze w Sudetach"
 CZE_b_sudety_desc:0 "Przełęcze, drogi leśne i stare przejścia. Każde trzeba obsadzić."
 CZE_b_zaolzie:0 "Zaolzie i polscy sąsiedzi"
 CZE_b_zaolzie_desc:0 "Polska mniejszość na Zaolziu boi się o rodziny po drugiej stronie granicy. Rząd obiecuje opiekę i otwarte szkoły."
 CZE_b_osrodki:0 "Ośrodki dla uchodźców"
 CZE_b_osrodki_desc:0 "Hale sportowe w Náchodzie i Trutnovie zamieniają się w ośrodki. Rąk do pracy przybywa – tak samo jak napięć."
 CZE_b_berlin:0 "Partner Berlina"
 CZE_b_berlin_desc:0 "Czechy idą razem z Niemcami: wspólna granica, wspólne patrole i wspólne zasady wobec Eurostaatów."
 CZE_b_most:0 "Most Środkowoeuropejski"
 CZE_b_most_desc:0 "Praga rozmawia z każdym: z Berlinem, z polskimi państwami i z Brukselą. Mediacja i handel zamiast murów."
 CZE_b_b_patrole:0 "Wspólne patrole na Nysie"
 CZE_b_b_patrole_desc:0 "Czeskie i niemieckie patrole na granicy z rozbitą Polską."
 CZE_b_b_przemysl:0 "Przemysł dla Tarczy"
 CZE_b_b_przemysl_desc:0 "Czeskie zbrojownie produkują dla sojuszu. Zamówienia z Berlina ratują zakłady na Morawach."
 CZE_b_b_final:0 "Wspólna granica z Niemcami"
 CZE_b_b_final_desc:0 "Granica z rozbitą Polską jest wspólną sprawą Pragi i Berlina."
 CZE_b_m_mediacja:0 "Mediacja w Polsce"
 CZE_b_m_mediacja_desc:0 "Czescy dyplomaci jeżdżą między Toruniem, Lublinem i Warszawą. Rozmawiać chcą wszyscy – Praga nikomu nie zagraża."
 CZE_b_m_kontrakty:0 "Kontrakty z polskimi państwami"
 CZE_b_m_kontrakty_desc:0 "Czeskie firmy odbudowują mosty i elektrownie w rozbitej Polsce – za pieniądze albo za węgiel."
 CZE_b_m_final:0 "Praga – stolica regionu"
 CZE_b_m_final_desc:0 "Najważniejszy partner wszystkich polskich państw jest w Pradze."
 UKW_panel:0 "Ukraina: front i wsparcie"
 UKW_panel_desc:0 "Zasoby wojny: §Y[?UKR_zasoby|0]§!/100 (amunicja, drony, rezerwy). Dominacja Rosji na mapie obwodów: §Y[?ROS.ROS_UKR_dominance|1]%§! – im wyżej, tym lepiej dla Rosji.\n§YCel:§! utrzymać dominację Rosji poniżej 50%, aż Rosja zakończy etap wojny na Ukrainie.\n§YKoszt:§! uderzenia dronów i kontrofensywy zużywają zasoby; wsparcie z zachodu trzeba wypraszać.\n§YZaniedbanie:§! w czasie wojny zasoby spadają o 3 co miesiąc. Poniżej 20 – front pęka (najwyżej raz na 120 dni Rosja zyskuje teren w obwodzie frontowym)."
 UKR_dm:0 "Zasoby wojny"
 UKR_tt_odbicie5:0 "Ukraina odbija §G5§! pkt postępu Rosji w najbliższym obwodzie frontowym."
 UKW_dec_drony:0 "Uderzenie dronów"
 UKW_dec_drony_desc:0 "Setki dronów nad rosyjskimi magazynami i węzłami kolejowymi. Każde uderzenie kosztuje – i przesuwa front."
 UKW_dec_pomoc:0 "Prośba o wsparcie z zachodu"
 UKW_dec_pomoc_desc:0 "Delegacja jedzie do Berlina z listą potrzeb: amunicja, obrona powietrzna, generatory."
 UKW_dec_mobilizacja:0 "Mobilizacja rezerw"
 UKW_dec_mobilizacja_desc:0 "Kolejne roczniki dostają karty powołania. Front dostaje ludzi, kraj – kolejną falę żałoby."
 UKR_tt_przelom5:0 "Rosja zyskuje §R5§! pkt postępu w najbliższym obwodzie frontowym."
 ukw.10.t:0 "Front pęka"
 ukw.10.d:0 "Brygady na wschodzie meldują brak amunicji. Rosyjska artyleria strzela dziesięć razy częściej niż nasza."
 ukw.10.a:0 "Wszystko, co mamy, na front."
 ukw.20.t:0 "Ukraina prosi o pomoc"
 ukw.20.d:0 "Delegacja z Kijowa przywozi listę: amunicja, obrona powietrzna, generatory. Każdy pocisk wysłany na wschód to pocisk mniej dla Bundeswehry."
 ukw.20.a:0 "Wysłać pomoc."
 ukw.20.b:0 "Nie teraz – mamy własne granice do obrony."
 ukw.30.t:0 "Niezłomna Ukraina"
 ukw.30.d:0 "Ukraina przetrwała kolejny rok wojny. Linia frontu stoi, a armia jest silniejsza niż kiedykolwiek."
 ukw.30.a:0 "Region się zmienia."
 ukw.31.t:0 "Rozejm z godnością"
 ukw.31.d:0 "Ukraina podpisuje rozejm z gwarancjami bezpieczeństwa. Front zamarza, a kraj zaczyna odbudowę."
 ukw.31.a:0 "Region się zmienia."
 UKR_req_koniec:0 "Rosja zakończyła etap „Wojna na Ukrainie”"
 WOS_tt_48:0 "Uruchamia wskaźnik „Zasoby wojny” (panel „Ukraina: front i wsparcie”)."
 WOS_tt_49:0 "Rosja dostaje możliwość „Pokoju bez zwycięstwa” na etapie wojny na Ukrainie."
 UKR_tt_odbicie10:0 "Ukraina odbija §G10§! pkt postępu Rosji w najbliższym obwodzie frontowym."
 UKR_req_front:0 "Dominacja Rosji na mapie obwodów poniżej 30% albo koniec wojny"
 UKR_b_drony:0 "Fabryki dronów"
 UKR_b_kwatera:0 "Kwatera Główna na zachodzie"
 UKR_b_kwatera_desc:0 "Część sztabu i ministerstw działa z Łucka i Lwowa. Front jest daleko – ale wszystko pracuje dla frontu."
 UKR_b_drony_desc:0 "Warsztaty w garażach i halach produkują drony szybciej niż ktokolwiek w Europie."
 UKR_b_linia:0 "Linia obrony na wschodzie"
 UKR_b_linia_desc:0 "Pola minowe, rowy i stanowiska ogniowe na setki kilometrów."
 UKR_b_koalicja:0 "Koalicja wsparcia"
 UKR_b_koalicja_desc:0 "Lista krajów, które wysyłają amunicję i generatory, rośnie z każdym miesiącem."
 UKR_b_wolyn:0 "Wołyń i polscy sąsiedzi"
 UKR_b_wolyn_desc:0 "Za Bugiem – kraj, który się rozpadł. Rząd otwiera przejścia dla uchodźców i rozmawia z każdym, kto rządzi po drugiej stronie."
 UKR_b_obrona:0 "Obrona do zwycięstwa"
 UKR_b_obrona_desc:0 "Żadnych ustępstw: każdy kilometr trzeba odzyskać."
 UKR_b_rozmowy:0 "Rozmowy w Stambule"
 UKR_b_rozmowy_desc:0 "Mediatorzy proponują rozejm z gwarancjami bezpieczeństwa. Ukraina siada do stołu – na swoich warunkach."
 UKR_b_o_kontrofensywa:0 "Kontrofensywa"
 UKR_b_o_kontrofensywa_desc:0 "Brygady szturmowe ruszają na wschód. Zasoby zgromadzone przez miesiące idą w jeden dzień."
 UKR_b_o_final:0 "Niezłomna Ukraina"
 UKR_b_o_final_desc:0 "Ukraina przetrwała. Armia jest silniejsza niż kiedykolwiek."
 UKR_b_r_gwarancje:0 "Gwarancje bezpieczeństwa"
 UKR_b_r_gwarancje_desc:0 "Sojusznicy podpisują gwarancje: jeśli Rosja złamie rozejm, Ukraina nie zostanie sama."
 UKR_b_r_final:0 "Rozejm z godnością"
 UKR_b_r_final_desc:0 "Front zamarza, ale Ukraina nie oddała niczego, czego nie musiała."
 UKR_b_odbudowa:0 "Odbudowa kraju"
 UKR_b_odbudowa_desc:0 "Wojna się skończyła. Teraz trzeba odbudować miasta, elektrownie i mosty."
 LIT_idea_bastion:0 "Bastion Bałtycki"
 LIT_idea_bastion_desc:0 "Bastion Bałtycki"
 LIT_idea_wspolnota:0 "Wspólnota Nadniemeńska"
 LIT_idea_wspolnota_desc:0 "Wspólnota Nadniemeńska"
 LIT_idea_neutralnosc:0 "Neutralna Litwa"
 LIT_idea_neutralnosc_desc:0 "Neutralna Litwa"
 CZE_idea_granica:0 "Wspólna granica z Niemcami"
 CZE_idea_granica_desc:0 "Wspólna granica z Niemcami"
 CZE_idea_most:0 "Praga – stolica regionu"
 CZE_idea_most_desc:0 "Praga – stolica regionu"
 UKR_idea_niezlomna:0 "Niezłomna Ukraina"
 UKR_idea_niezlomna_desc:0 "Niezłomna Ukraina"
 UKR_idea_rozejm:0 "Rozejm z godnością"
 UKR_idea_rozejm_desc:0 "Rozejm z godnością"
 PRW_bop:0 "Wpływy w partii"
 PRW_harcerze:0 "Harcerze"
 PRW_maslarze:0 "Maślarze"
 PRW_bop_kompromis:0 "Kompromis kongresowy"
 PRW_bop_h2:0 "Dominacja Harcerzy"
 PRW_bop_h1:0 "Przewaga Harcerzy"
 PRW_bop_m1:0 "Przewaga Maślarzy"
 PRW_bop_m2:0 "Dominacja Maślarzy"
 PRW_spojnosc_mod:0 "Spójność partii"
 PRW_dm_cz:0 "Lojalność struktur"
 PRW_dm_mo:0 "Kontrakty i autonomia regionów"
 PRW_dm_zi:0 "Aparat kontroli i opór"
 PRW_dm_ku:0 "Zasięg i wiarygodność"
 PRW_dm_ma:0 "Mobilizacja i zmęczenie"
 PRW_dm_kt:0 "Rządy opiekunów"
 PRW_bop_opis_h2:0 "§RDominacja Harcerzy§! – technokraci rządzą, struktury terenowe się burzą (spójność −2 co miesiąc)"
 PRW_bop_opis_h1:0 "§YPrzewaga Harcerzy§! – sprawna administracja, słabsza mobilizacja"
 PRW_bop_opis_k:0 "§GKompromis§! – spokój w partii (spójność +1 co miesiąc), ale każda decyzja wymaga zgody obu frakcji (władza polityczna −15%)"
 PRW_bop_opis_m1:0 "§YPrzewaga Maślarzy§! – lojalny aktyw i porządek, mniej władzy dla rządu"
 PRW_bop_opis_m2:0 "§RDominacja Maślarzy§! – aktyw rządzi partią, technokraci odchodzą (spójność −2 co miesiąc)"
 PRW_sp_opis_w:0 "§Gstruktury słuchają kierownictwa§!"
 PRW_sp_opis_s:0 "§Ypartia trzyma się razem, ale narzeka§!"
 PRW_sp_opis_n:0 "§Rgrozi rozłam (poniżej 20 – co miesiąc ryzyko odejścia posłów i struktur)§!"
 PRW_frakcje:0 "Zjednoczona Polska Prawica: partia"
 PRW_frakcje_desc:0 "Wpływy frakcji (Harcerze ⟷ Maślarze): §Y[?PRW_bop|0]§! – [PRW_Get_bop]\nSpójność partii: §Y[?PRW_spojnosc|0]§!/100 – [PRW_Get_spoj]\n\nWpływy i spójność to dwie różne rzeczy: przewaga jednej frakcji nie oznacza posłusznej partii. Dominacja obniża spójność, kompromis ją buduje, ale paraliżuje rząd.\nObietnice i nominacje z kongresu trzeba spełnić po wyborze przywódcy – niedotrzymane kosztują spójność co miesiąc."
 PRW_kongres_kat:0 "Kampania kongresowa"
 PRW_kongres_kat_desc:0 "Poparcie delegatów: Czarnek §Y[?PRW_p_czarnek|0]§!, Morawiecki §Y[?PRW_p_morawiecki|0]§!, Ziobro §Y[?PRW_p_ziobro|0]§!, Kurski §Y[?PRW_p_kurski|0]§!, Macierewicz §Y[?PRW_p_macierewicz|0]§!, Kot Prezesa §Y[?PRW_p_kot|0]§!\nNa kongresie można wybrać tylko kandydata z co najmniej §Y30§! poparcia. Poparcie kandydata to nominacja – po kongresie trzeba mu dać miejsce w rządzie, nawet jeśli przegra."
 PRW_obietnice_kat:0 "Obietnice z kongresu"
 PRW_obietnice_kat_desc:0 "Delegaci pamiętają, co im obiecano. Każda niespełniona obietnica po terminie (240 dni od kongresu) kosztuje §R2§! spójności co miesiąc, każda niespełniona nominacja – §R1§!."
 PRW_d_struktury:0 "Pieniądze dla struktur terenowych"
 PRW_d_struktury_desc:0 "Stanowiska w spółkach powiatowych i dotacje dla kół. Aktyw pamięta, kto dał – technokraci liczą koszty."
 PRW_d_kadry:0 "Kadry z ministerstw"
 PRW_d_kadry_desc:0 "Menedżerowie z dawnych ministerstw dostają departamenty. Urzędy działają sprawniej – działacze narzekają na „harcerzy w garniturach”."
 PRW_d_rozejm:0 "Rozejm frakcyjny"
 PRW_d_rozejm_desc:0 "Prezydium nakazuje frakcjom wspólną listę na pół roku. Spójność rośnie, ale kompromis paraliżuje rząd."
 WOS_tt_50:0 "Nominacja: Przemysław Czarnek dostanie miejsce w rządzie po kongresie – nawet jeśli przegra. Niespełniona nominacja kosztuje spójność."
 PRW_d_poparcie_czarnek:0 "Poparcie: Przemysław Czarnek"
 PRW_d_poparcie_czarnek_desc:0 "Ludzie ministra edukacji objeżdżają powiaty: listy poparcia, spotkania z kołami, obietnica „partii, która słucha terenu”. (Fikcyjna ścieżka moda.)"
 WOS_tt_51:0 "Nominacja: Mateusz Morawiecki dostanie miejsce w rządzie po kongresie – nawet jeśli przegra. Niespełniona nominacja kosztuje spójność."
 PRW_d_poparcie_morawiecki:0 "Poparcie: Mateusz Morawiecki"
 PRW_d_poparcie_morawiecki_desc:0 "Sztab byłego premiera przekonuje delegatów wykresami, kontraktami i obietnicą „lubelskiego cudu gospodarczego”. (Fikcyjna ścieżka moda.)"
 WOS_tt_52:0 "Nominacja: Zbigniew Ziobro dostanie miejsce w rządzie po kongresie – nawet jeśli przegra. Niespełniona nominacja kosztuje spójność."
 PRW_d_poparcie_ziobro:0 "Poparcie: Zbigniew Ziobro"
 PRW_d_poparcie_ziobro_desc:0 "Ludzie z prokuratury rozmawiają z delegatami w cztery oczy. Każdy wie, że teczki z Warszawy dojechały do Lublina. (Fikcyjna ścieżka moda.)"
 WOS_tt_53:0 "Nominacja: Jacek Kurski dostanie miejsce w rządzie po kongresie – nawet jeśli przegra. Niespełniona nominacja kosztuje spójność."
 PRW_d_poparcie_kurski:0 "Poparcie: Jacek Kurski"
 PRW_d_poparcie_kurski_desc:0 "Studio w dawnej hali widowiskowej nadaje wieczorne wydania. Na ekranach jeden kandydat wygląda jak zwycięzca. (Fikcyjna ścieżka moda.)"
 WOS_tt_54:0 "Nominacja: Antoni Macierewicz dostanie miejsce w rządzie po kongresie – nawet jeśli przegra. Niespełniona nominacja kosztuje spójność."
 PRW_d_poparcie_macierewicz:0 "Poparcie: Antoni Macierewicz"
 PRW_d_poparcie_macierewicz_desc:0 "Weterani ruchu i kluby patriotyczne zbierają podpisy pod kandydaturą „strażnika pamięci”. (Fikcyjna ścieżka moda.)"
 WOS_tt_55:0 "Nominacja: Kot Prezesa dostanie miejsce w rządzie po kongresie – nawet jeśli przegra. Niespełniona nominacja kosztuje spójność."
 PRW_d_poparcie_kot:0 "Poparcie: Kot Prezesa"
 PRW_d_poparcie_kot_desc:0 "Ktoś przyniósł na posiedzenie prezydium kota i fotografię. Opiekunowie zgodnie twierdzą, że to najlepszy kandydat – byle oni mówili w jego imieniu. (Fikcyjna ścieżka moda.)"
 PRW_d_ob_uklad:0 "Dotrzymać: Stanowiska dla dawnych koalicjantów"
 PRW_d_ob_uklad_desc:0 "Obiecaliśmy dawnym partnerom miejsca w zarządach spółek i w urzędzie wojewódzkim. Czas oddać im fotele."
 PRW_d_ob_struktury:0 "Dotrzymać: Etaty i spółki dla struktur"
 PRW_d_ob_struktury_desc:0 "Działacze z powiatów czekają na obiecane etaty, dotacje dla kół i stanowiska w spółkach komunalnych."
 PRW_d_ob_kontrakty:0 "Dotrzymać: Kontrakty dla firm z kongresu"
 PRW_d_ob_kontrakty_desc:0 "Biznes, który sfinansował kongres, czeka na zamówienia publiczne. Bez nich pieniądze na następną kampanię nie przyjdą."
 PRW_d_ob_rozliczenia:0 "Dotrzymać: Obiecane rozliczenia"
 PRW_d_ob_rozliczenia_desc:0 "Delegaci chcieli „rozliczenia winnych upadku państwa”. Komisja śledcza ma zacząć pracę – i pokazać pierwsze nazwiska."
 PRW_d_ob_media:0 "Dotrzymać: Własna telewizja partii"
 PRW_d_ob_media_desc:0 "Obiecaliśmy stację, która mówi naszym głosem. Studio, nadajnik i ludzie kosztują – ale delegaci pamiętają."
 PRW_req_mies3:0 "Odbyły się co najmniej trzy miesięcznice"
 PRW_d_ob_pamiec:0 "Dotrzymać: Obietnica pamięci"
 PRW_d_ob_pamiec_desc:0 "Obiecaliśmy, że rocznice i miesięcznice będą obchodzone w Lublinie. Trzeba odbyć co najmniej trzy."
 PRW_d_nom_czarnek:0 "Nominacja: Przemysław Czarnek w rządzie"
 PRW_d_nom_czarnek_desc:0 "Kongres obiecał miejsce w rządzie dla obozu kandydata. Teka ministra kosztuje – ale zerwana obietnica kosztuje więcej. (Fikcyjna ścieżka moda.)"
 PRW_d_nom_morawiecki:0 "Nominacja: Mateusz Morawiecki w rządzie"
 PRW_d_nom_morawiecki_desc:0 "Kongres obiecał miejsce w rządzie dla obozu kandydata. Teka ministra kosztuje – ale zerwana obietnica kosztuje więcej. (Fikcyjna ścieżka moda.)"
 PRW_d_nom_ziobro:0 "Nominacja: Zbigniew Ziobro w rządzie"
 PRW_d_nom_ziobro_desc:0 "Kongres obiecał miejsce w rządzie dla obozu kandydata. Teka ministra kosztuje – ale zerwana obietnica kosztuje więcej. (Fikcyjna ścieżka moda.)"
 PRW_d_nom_kurski:0 "Nominacja: Jacek Kurski w rządzie"
 PRW_d_nom_kurski_desc:0 "Kongres obiecał miejsce w rządzie dla obozu kandydata. Teka ministra kosztuje – ale zerwana obietnica kosztuje więcej. (Fikcyjna ścieżka moda.)"
 PRW_d_nom_macierewicz:0 "Nominacja: Antoni Macierewicz w rządzie"
 PRW_d_nom_macierewicz_desc:0 "Kongres obiecał miejsce w rządzie dla obozu kandydata. Teka ministra kosztuje – ale zerwana obietnica kosztuje więcej. (Fikcyjna ścieżka moda.)"
 PRW_d_nom_kot:0 "Nominacja: Kot Prezesa w rządzie"
 PRW_d_nom_kot_desc:0 "Kongres obiecał miejsce w rządzie dla obozu kandydata. Teka ministra kosztuje – ale zerwana obietnica kosztuje więcej. (Fikcyjna ścieżka moda.)"
 PRW_d_miesiecznica:0 "Miesięcznica"
 PRW_d_miesiecznica_desc:0 "Wieczorem pod pomnikiem w centrum Lublina: znicze, przemówienie, modlitwa i transparenty. Każda wygląda trochę inaczej – zależnie od pogody, kontrmanifestacji i tego, co padnie z mównicy."
 PRW_tt_kongres_czarnek:0 "§YPrzemysław Czarnek§! – Lojalność struktur i centralizacja: partia jako jedna armia działaczy. (Fikcyjna ścieżka moda.)"
 PRW_tt_kongres_morawiecki:0 "§YMateusz Morawiecki§! – Gospodarka, kontrakty i autonomia regionów: rozwój w zamian za oddanie władzy powiatom. (Fikcyjna ścieżka moda.)"
 PRW_tt_kongres_ziobro:0 "§YZbigniew Ziobro§! – Aparat kontroli: porządek przez prokuratorów – i rosnący opór społeczny. (Fikcyjna ścieżka moda.)"
 PRW_tt_kongres_kurski:0 "§YJacek Kurski§! – Zasięg przekazu: telewizja daje władzę, ale niespełnione obietnice niszczą wiarygodność. (Fikcyjna ścieżka moda.)"
 PRW_tt_kongres_macierewicz:0 "§YAntoni Macierewicz§! – Mobilizacja zwolenników i miesięcznice – aż do zmęczenia społeczeństwa. (Fikcyjna ścieżka moda.)"
 PRW_tt_kongres_kot:0 "§YKot Prezesa§! – Rządy opiekunów i projekt Cyber-Jarosław. Wynik zależy od serwerowni, kadr i spójności. (Fikcyjna ścieżka moda.)"
 zpp.50.t:0 "Kongres w Lublinie"
 zpp.50.d:0 "Hala widowiskowo-sportowa jest pełna. Delegaci z powiatów, ludzie z ministerstw, dziennikarze i ochrona. Za kulisami liczy się poparcie – i pamięta obietnice. Nazwisko, które padnie dziś z mównicy, wyznaczy kierunek państwa na lata.\n\nNa liście są tylko kandydaci z co najmniej 30 punktami poparcia."
 zpp.50.a:0 "Przemysław Czarnek"
 zpp.50.b:0 "Mateusz Morawiecki"
 zpp.50.c:0 "Zbigniew Ziobro"
 zpp.50.e:0 "Jacek Kurski"
 zpp.50.f:0 "Antoni Macierewicz"
 zpp.50.g:0 "Kot Prezesa"
 zpp.50.h:0 "Nikt nie ma poparcia. Kongres zostaje odroczony."
 zpp.60.t:0 "Delegaci przypominają obietnice"
 zpp.60.d:0 "Minął termin. Działacze, którym coś obiecano na kongresie, piszą listy do prezydium i dzwonią do mediów. Każdy miesiąc zwłoki kosztuje partię zaufanie."
 zpp.60.a:0 "Spełnimy je – w swoim czasie."
 zpp.61.t:0 "Rozłam w klubie"
 zpp.61.d:0 "Kilkunastu radnych i dwóch posłów ogłasza powstanie własnego koła. W powiatach zamykają się biura, a lokalni baronowie negocjują z sąsiadami."
 zpp.61.a:0 "Odpuścić odchodzącym – zostaną najwierniejsi."
 zpp.61.b:0 "Ratować za wszelką cenę: stanowiska dla zbuntowanych."
 zpp.70.t:0 "Miesięcznica"
 zpp.70.d:0 "Pod pomnikiem gromadzą się ludzie ze zniczami."
 zpp.70.a:0 "Zobaczmy, jak przebiegnie."
 zpp.71.t:0 "Miesięcznica: tłum i znicze"
 zpp.71.d:0 "Przyszło więcej ludzi niż ostatnio. Przemówienie było krótkie, znicze płonęły do północy."
 zpp.71.a:0 "Pamięć nas jednoczy."
 zpp.72.t:0 "Miesięcznica w deszczu"
 zpp.72.d:0 "Lało od południa. Na placu stała garstka najwierniejszych – i dwie kamery."
 zpp.72.a:0 "Najwierniejsi zawsze są."
 zpp.73.t:0 "Kontrmanifestacja"
 zpp.73.d:0 "Po drugiej stronie ulicy stanęli przeciwnicy z gwizdkami i transparentami. Policja rozdzieliła obie grupy."
 zpp.73.a:0 "Nie dali nam przeszkodzić."
 zpp.74.t:0 "Nowy wątek z mównicy"
 zpp.74.d:0 "Z mównicy padły „nowe ustalenia” – bez dokumentów, ale z wielkim przekonaniem. Media w regionie mówią tylko o tym."
 zpp.74.a:0 "Wątek żyje własnym życiem."
 zpp.75.t:0 "Cicha miesięcznica"
 zpp.75.d:0 "Bez przemówień: modlitwa, znicze, kilka zdań przewodniczącego regionu. Ludzie rozeszli się spokojnie."
 zpp.75.a:0 "Spokój też jest potrzebny."
 PL2027_req_po_prologu:0 "Po prologu"
 WOS_tt_56:0 "Obietnica: stanowiska dla dawnych koalicjantów (do spełnienia po kongresie)."
 WOS_tt_57:0 "Otwiera panel „Kampania kongresowa”: poparcie kandydatów i nominacje."
 WOS_tt_58:0 "Obietnica: etaty i spółki dla struktur."
 WOS_tt_59:0 "Obietnica: kontrakty dla firm z kongresu."
 WOS_tt_60:0 "Obietnica: rozliczenia."
 WOS_tt_61:0 "Obietnica: własna telewizja partii."
 WOS_tt_62:0 "Obietnica: miesięcznice (co najmniej trzy po kongresie)."
 WOS_tt_63:0 "Delegaci wybierają przewodniczącego: jeden z fokusów „Przewodniczący: …” poniżej (kandydat z co najmniej 30 punktami poparcia)."
 PRW_req_kongres_data:0 "Najwcześniej w lutym 2028"
 PRW_req_kand_czarnek:0 "Przemysław Czarnek: co najmniej 30 punktów poparcia (albo nikt ich nie ma) i nie przegrał wcześniej"
 PRW_req_kand_morawiecki:0 "Mateusz Morawiecki: co najmniej 30 punktów poparcia (albo nikt ich nie ma) i nie przegrał wcześniej"
 PRW_req_kand_ziobro:0 "Zbigniew Ziobro: co najmniej 30 punktów poparcia (albo nikt ich nie ma) i nie przegrał wcześniej"
 PRW_req_kand_kurski:0 "Jacek Kurski: co najmniej 30 punktów poparcia (albo nikt ich nie ma) i nie przegrał wcześniej"
 PRW_req_kand_macierewicz:0 "Antoni Macierewicz: co najmniej 30 punktów poparcia (albo nikt ich nie ma) i nie przegrał wcześniej"
 PRW_req_kand_kot:0 "Kot Prezesa: co najmniej 30 punktów poparcia (albo nikt ich nie ma) i nie przegrał wcześniej"
 PRW_k_start:0 "Lublin po rozpadzie koalicji"
 PRW_k_start_desc:0 "Rząd w Warszawie przestał istnieć, a koalicja rozpadła się w ciągu tygodnia. W Lublinie zostali: urząd wojewódzki, część klubu, archiwa w ciężarówkach i pytanie, kto teraz rządzi partią."
 PRW_k_koalicja:0 "Koalicjanci odchodzą"
 PRW_k_koalicja_desc:0 "Dawni partnerzy pakują biura. Jedni chcą rozmawiać o stanowiskach, inni już rozmawiają z sąsiadami."
 PRW_k_uklad:0 "Ratować układ z koalicjantami"
 PRW_k_uklad_desc:0 "Stanowiska w spółkach i urzędzie wojewódzkim w zamian za głosy w sejmiku. Harcerze liczą to na zimno – aktyw nazywa zdradą."
 PRW_k_sami:0 "Rządzić bez koalicjantów"
 PRW_k_sami_desc:0 "Lepiej mniejsza większość niż obcy w urzędach. Struktury są zachwycone, administracja mniej."
 PRW_k_sejmik:0 "Większość w sejmiku"
 PRW_k_sejmik_desc:0 "Uchwały przechodzą, budżet województwa jest przyjęty. Lublin ma rząd – tymczasowy, ale działający."
 PRW_k_archiwa:0 "Ewakuacja archiwów"
 PRW_k_archiwa_desc:0 "Ciężarówki z dokumentami z Warszawy dojeżdżają do Lublina. W jednej z nich jedzie coś, czego nie ma w żadnym spisie."
 PRW_k_kasa:0 "Kasa partii"
 PRW_k_kasa_desc:0 "Konta zamrożone, darczyńcy milczą. Skarbnik ratuje, co się da – za cenę długów u lokalnych przedsiębiorców."
 PRW_k_biura:0 "Biura okręgowe w terenie"
 PRW_k_biura_desc:0 "W każdym powiecie otwarte biuro, w każdym biurze ktoś z aktywu. Maślarze odzyskują wpływy."
 PRW_k_kadry:0 "Szkolenie nowych kadr"
 PRW_k_kadry_desc:0 "Menedżerowie z ministerstw uczą działaczy budżetu i zamówień publicznych. Harcerze rosną w siłę."
 PRW_k_struktury:0 "Struktury przetrwały"
 PRW_k_struktury_desc:0 "Partia ma biura, ludzi i pieniądze na najbliższe miesiące. Teraz trzeba zdecydować, kto nią pokieruje."
 PRW_k_komisja:0 "Komisja kongresowa"
 PRW_k_komisja_desc:0 "Prezydium powołuje komisję, która przygotuje kongres. Kampania kandydatów się zaczyna – każde poparcie to nominacja do spełnienia."
 PRW_k_delegaci:0 "Kongres delegatów"
 PRW_k_delegaci_desc:0 "Głosują delegaci z powiatów, według regulaminu. Wolniej, ale nikt nie powie, że wynik ustalono w gabinecie."
 PRW_k_rekomendacja:0 "Rekomendacja z Nowogrodzkiej"
 PRW_k_rekomendacja_desc:0 "Delegaci dostaną listę „rekomendowanych”. Szybciej i pewniej – ale część struktur uzna to za ustawkę, a w serwerowni ktoś się cieszy."
 PRW_k_ob_teren:0 "Obietnice dla terenu"
 PRW_k_ob_teren_desc:0 "Etaty, dotacje dla kół i stanowiska w spółkach komunalnych – w zamian za głosy delegatów z powiatów."
 PRW_k_ob_biznes:0 "Obietnice dla biznesu"
 PRW_k_ob_biznes_desc:0 "Firmy z regionu finansują kongres. W zamian chcą zamówień publicznych – i premiera, który zna się na gospodarce."
 PRW_k_ob_rozliczenia:0 "Obietnica rozliczeń"
 PRW_k_ob_rozliczenia_desc:0 "Delegaci chcą winnych upadku państwa. Komisja śledcza po kongresie – obietnica, która podnosi notowania twardych kandydatów."
 PRW_k_ob_przekaz:0 "Obietnica własnej telewizji"
 PRW_k_ob_przekaz_desc:0 "Partia bez telewizji przegrywa wybory, zanim się zaczną. Kandydat, który ma studio, ma przewagę."
 PRW_k_ob_pamiec:0 "Obietnica pamięci"
 PRW_k_ob_pamiec_desc:0 "Rocznice i miesięcznice w Lublinie – obietnica dla najwierniejszych, którzy pamiętają każdą datę."
 PRW_k_kongres:0 "Kongres w Lublinie"
 PRW_k_kongres_desc:0 "Delegaci przyjeżdżają do hali w Lublinie. Kongres wybierze przywódcę – i kierunek państwa. Kandydat musi mieć co najmniej 30 punktów poparcia."
 PRW_k_wyb_czarnek:0 "Przewodniczący: Przemysław Czarnek"
 PRW_k_wyb_czarnek_desc:0 "Delegaci głosują na kandydata. Lojalność struktur i centralizacja: partia jako jedna armia działaczy. Poparcie: [?PRW_p_czarnek|0]. (Fikcyjna ścieżka moda.)"
 PRW_k_wyb_morawiecki:0 "Przewodniczący: Mateusz Morawiecki"
 PRW_k_wyb_morawiecki_desc:0 "Delegaci głosują na kandydata. Gospodarka, kontrakty i autonomia regionów: rozwój w zamian za oddanie władzy powiatom. Poparcie: [?PRW_p_morawiecki|0]. (Fikcyjna ścieżka moda.)"
 PRW_k_wyb_ziobro:0 "Przewodniczący: Zbigniew Ziobro"
 PRW_k_wyb_ziobro_desc:0 "Delegaci głosują na kandydata. Aparat kontroli: porządek przez prokuratorów – i rosnący opór społeczny. Poparcie: [?PRW_p_ziobro|0]. (Fikcyjna ścieżka moda.)"
 PRW_k_wyb_kurski:0 "Przewodniczący: Jacek Kurski"
 PRW_k_wyb_kurski_desc:0 "Delegaci głosują na kandydata. Zasięg przekazu: telewizja daje władzę, ale niespełnione obietnice niszczą wiarygodność. Poparcie: [?PRW_p_kurski|0]. (Fikcyjna ścieżka moda.)"
 PRW_k_wyb_macierewicz:0 "Przewodniczący: Antoni Macierewicz"
 PRW_k_wyb_macierewicz_desc:0 "Delegaci głosują na kandydata. Mobilizacja zwolenników i miesięcznice – aż do zmęczenia społeczeństwa. Poparcie: [?PRW_p_macierewicz|0]. (Fikcyjna ścieżka moda.)"
 PRW_k_wyb_kot:0 "Przewodniczący: Kot Prezesa"
 PRW_k_wyb_kot_desc:0 "Delegaci głosują na kandydata. Rządy opiekunów i projekt Cyber-Jarosław. Wynik zależy od serwerowni, kadr i spójności. Poparcie: [?PRW_p_kot|0]. (Fikcyjna ścieżka moda.)"
 PRW_cz_kat:0 "Czarnek: lojalność struktur"
 PRW_cz_kat_desc:0 "Lojalność struktur: §Y[?PRW_loj|0]§!/100, centralizacja: §Y[?PRW_centr|0]§!/5\n§YCel:§! partia jako jedna armia działaczy – kolejne kroki centralizacji wymagają lojalności (40, 50, 55, 65).\n§YKoszt:§! nominacje z centrali i odwołania baronów obniżają spójność partii.\n§YZaniedbanie:§! lojalność spada o 2 co miesiąc (szybciej, gdy rządzą Harcerze). Poniżej 25 – bunt baronów, poniżej 10 – kryzys przywództwa.\n(Fikcyjna ścieżka moda.)"
 PRW_d_cz_nominacje:0 "Nominacje z centrali"
 PRW_d_cz_nominacje_desc:0 "Pełnomocnicy z Lublina obejmują zarządy powiatowe. Lojalni awansują, lokalni działacze tracą stanowiska."
 PRW_d_cz_zjazd:0 "Zjazd okręgów"
 PRW_d_cz_zjazd_desc:0 "Prezes objeżdża okręgi, ściska ręce, rozdaje odznaczenia. Drogo – ale ludzie wracają do domów z poczuciem, że są potrzebni."
 PRW_d_cz_baron:0 "Odwołanie barona"
 PRW_d_cz_baron_desc:0 "Najsilniejszy z lokalnych baronów traci funkcję. Pozostali rozumieją sygnał – część z nich nigdy tego nie zapomni."
 zpp.100.t:0 "Bunt baronów"
 zpp.100.d:0 "Przewodniczący trzech okręgów nie przyjechali na posiedzenie zarządu. W powiatach mówi się o „partii Lublina”, która zapomniała o terenie."
 zpp.100.a:0 "Ustępstwa: pieniądze i stanowiska dla okręgów."
 zpp.100.b:0 "Złamać bunt: zawiesić zarządy okręgów."
 zpp.101.t:0 "Struktury odmawiają posłuszeństwa"
 zpp.101.d:0 "Okręgi przestały wykonywać polecenia z Lublina. Prezydium zwołuje nadzwyczajne posiedzenie i żąda dymisji przywódcy."
 zpp.101.a:0 "Nie ma wyjścia – zarząd przejmuje partię."
 PRW_req_loj_40:0 "Lojalność struktur co najmniej 40"
 PRW_req_loj_50:0 "Lojalność struktur co najmniej 50"
 PRW_req_loj_55:0 "Lojalność struktur co najmniej 55"
 PRW_req_loj_65:0 "Lojalność struktur co najmniej 65"
 PRW_req_centr3:0 "Centralizacja co najmniej 3"
 zpp.190.t:0 "Lublin: partia jako państwo"
 zpp.190.d:0 "Zjednoczona Polska Prawica zakończyła centralizację. Jedno kierownictwo kontroluje sejmik, urzędy i spółki regionu. Sąsiedzi obserwują Lublin z mieszaniną respektu i niepokoju. (Fikcja moda.)"
 zpp.190.a:0 "Tak wygląda nowa Lubelszczyzna."
 PRW_mo_kat:0 "Morawiecki: kontrakty i regiony"
 PRW_mo_kat_desc:0 "Kontrakty zrealizowane: §Y[?PRW_kontr|0]§!, zerwane: §R[?PRW_zerwane|0]§!/3, autonomia regionów: §Y[?PRW_auto|0]§!/100\nPostęp kontraktów: [?PRW_mo_k1_p|0]% i [?PRW_mo_k2_p|0]% (co miesiąc +25, gdy autonomia ≥ 25 i stabilność > 35%; +10 więcej przy autonomii ≥ 60).\n§YCel:§! „lubelski cud gospodarczy” – 4 zrealizowane kontrakty.\n§YKoszt:§! autonomia przyspiesza budowy, ale zabiera władzę Lublinowi (powyżej 75 – spójność −1 co miesiąc).\n§YZaniedbanie:§! kontrakt bez realizacji w 120 dni jest zerwany. Trzy zerwane kontrakty – kryzys przywództwa.\n(Fikcyjna ścieżka moda.)"
 WOS_tt_64:0 "Nowy kontrakt: 120 dni na realizację. Gotowy kontrakt = nowa fabryka cywilna. Zerwany = kara i krok do kryzysu."
 PRW_d_mo_k1:0 "Kontrakt rozwojowy"
 PRW_d_mo_k1_desc:0 "Konsorcjum firm z regionu podpisuje umowę na zakład i drogę dojazdową. Realizacja zależy od powiatów – i od tego, czy w regionie jest spokój."
 PRW_d_mo_k2:0 "Kontrakt rozwojowy"
 PRW_d_mo_k2_desc:0 "Konsorcjum firm z regionu podpisuje umowę na zakład i drogę dojazdową. Realizacja zależy od powiatów – i od tego, czy w regionie jest spokój."
 PRW_d_mo_ulgi:0 "Ulgi dla regionów"
 PRW_d_mo_ulgi_desc:0 "Powiaty dostają prawo do własnych przetargów i ulg podatkowych. Szybciej buduje się wszystko – poza władzą Lublina."
 PRW_d_mo_kontrola:0 "Kontrola z Lublina"
 PRW_d_mo_kontrola_desc:0 "Urząd wojewódzki odbiera powiatom część uprawnień. Więcej władzy w centrali – wolniejsze budowy w terenie."
 zpp.110.t:0 "Kontrakt zrealizowany"
 zpp.110.d:0 "Hala stoi, maszyny pracują, droga dojazdowa jest wyasfaltowana. Konsorcjum już pyta o następną umowę."
 zpp.110.a:0 "Tak buduje się gospodarkę."
 zpp.111.t:0 "Zerwany kontrakt"
 zpp.111.d:0 "Termin minął, a na placu budowy stoją tylko ogrodzenie i tablica z logo konsorcjum. Firmy żądają odszkodowań, a opozycja liczy straty."
 zpp.111.a:0 "Zapłacić odszkodowania."
 zpp.112.t:0 "Kryzys zaufania do premiera"
 zpp.112.d:0 "Trzeci zerwany kontrakt. Partnerzy biznesowi wycofują się z regionu, a prezydium partii pyta, gdzie jest obiecany „cud”."
 zpp.112.a:0 "Premier podaje się do dymisji."
 PRW_req_kontr_1:0 "Zrealizowane kontrakty: co najmniej 1"
 PRW_req_auto40:0 "Autonomia regionów co najmniej 40"
 PRW_req_kontr_2:0 "Zrealizowane kontrakty: co najmniej 2"
 PRW_req_kontr_4:0 "Zrealizowane kontrakty: co najmniej 4"
 zpp.191.t:0 "Lubelski cud gospodarczy"
 zpp.191.d:0 "Lubelszczyzna buduje fabryki szybciej niż jakikolwiek region rozbitej Polski. Kontrakty są wykonywane, a firmy z zagranicy wracają. (Fikcja moda.)"
 zpp.191.a:0 "Tak wygląda nowa Lubelszczyzna."
 PRW_zi_kat:0 "Ziobro: aparat kontroli"
 PRW_zi_kat_desc:0 "Aparat kontroli: §Y[?PRW_aparat|0]§!/100, opór społeczny: §R[?PRW_opor|0]§!/100\n§YCel:§! „Państwo prokuratorskie” – aparat co najmniej 70 przy oporze poniżej 60. Albo kontrolowana odwilż.\n§YKoszt:§! każdy miesiąc aparatu podnosi opór (aparat ÷ 20). Represje obniżają stabilność i podnoszą wydatki na dobra konsumpcyjne.\n§YZaniedbanie:§! opór od 70 – strajk generalny, od 90 – kryzys przywództwa. Amnestia obniża opór, ale osłabia aparat i spójność.\n(Fikcyjna ścieżka moda.)"
 PRW_d_zi_teczki:0 "Teczki"
 PRW_d_zi_teczki_desc:0 "Prokuratorzy przeglądają dokumenty przywiezione z Warszawy. Każdy, kto ma coś do ukrycia, staje się lojalny."
 PRW_d_zi_proces:0 "Proces pokazowy"
 PRW_d_zi_proces_desc:0 "Sala sądowa pełna kamer. Wyrok zapadnie szybko – i każdy go zobaczy."
 PRW_d_zi_amnestia:0 "Amnestia"
 PRW_d_zi_amnestia_desc:0 "Część zatrzymanych wychodzi na wolność, kilka śledztw zostaje umorzonych. Ulica się uspokaja – twarde jądro aparatu jest wściekłe."
 zpp.120.t:0 "Strajk generalny"
 zpp.120.d:0 "Zakłady w Świdniku i Puławach stają. Na ulicach Lublina tysiące ludzi z transparentami przeciw „państwu prokuratorów”."
 zpp.120.a:0 "Ustąpić: zwolnić zatrzymanych, zawiesić procesy."
 zpp.120.b:0 "Pacyfikacja: zakaz zgromadzeń."
 zpp.121.t:0 "Państwo przeciw obywatelom"
 zpp.121.d:0 "Opór objął cały region. Policja odmawia rozkazów, a prezydium partii żąda zmiany kursu i dymisji."
 zpp.121.a:0 "Dymisja."
 PRW_req_aparat_50:0 "Aparat kontroli co najmniej 50"
 PRW_req_opor_40:0 "Opór społeczny poniżej 40"
 PRW_req_aparat_70:0 "Aparat kontroli co najmniej 70"
 PRW_req_opor_60:0 "Opór społeczny poniżej 60"
 zpp.192.t:0 "Lublin: państwo prokuratorskie"
 zpp.192.d:0 "Na Lubelszczyźnie rządzi aparat kontroli: prokuratorzy, sądy przyspieszone i rejestry. Sąsiedzi przyjmują uchodźców z regionu. (Fikcja moda.)"
 zpp.192.a:0 "Tak wygląda nowa Lubelszczyzna."
 zpp.196.t:0 "Lublin: odwilż"
 zpp.196.d:0 "Lubelski rząd zamyka rejestry i umarza część śledztw. Po miesiącach napięcia region wraca do pracy. (Fikcja moda.)"
 zpp.196.a:0 "Tak wygląda nowa Lubelszczyzna."
 PRW_ku_kat:0 "Kurski: zasięg i wiarygodność"
 PRW_ku_kat_desc:0 "Zasięg przekazu: §Y[?PRW_zasieg|0]§!/100, wiarygodność: §Y[?PRW_wiar|0]§!/100\n§YCel:§! „Narodowa telewizja” – zasięg co najmniej 70 przy wiarygodności co najmniej 50.\n§YKoszt:§! obietnica w programie daje od razu władzę polityczną, ale trzeba ją spełnić w 120 dni (decyzja „Realizacja obietnicy”).\n§YZaniedbanie:§! niespełniona obietnica: wiarygodność −12. Przy wiarygodności poniżej 30 zasięg zaczyna szkodzić (ludzie śmieją się z propagandy), poniżej 15 – kryzys.\n(Fikcyjna ścieżka moda.)"
 WOS_tt_65:0 "Otwiera obietnicę: 120 dni na realizację. Niespełniona – wiarygodność −12."
 PRW_d_ku_obietnica:0 "Obietnica w programie"
 PRW_d_ku_obietnica_desc:0 "Wieczorne wydanie: nowa droga, podwyżki, tańsze paliwo. Widzowie są zachwyceni – teraz trzeba to zrobić."
 PRW_d_ku_realizacja:0 "Realizacja obietnicy"
 PRW_d_ku_realizacja_desc:0 "Ekipa jedzie na otwarcie: wstęga, kamery, burmistrz. Tym razem obietnica się spełniła."
 PRW_d_ku_kampania:0 "Kampania w regionach"
 PRW_d_ku_kampania_desc:0 "Wozy transmisyjne w każdym powiecie, festyny i koncerty. Zasięg rośnie – kosztem budżetu."
 zpp.130.t:0 "Obietnica bez pokrycia"
 zpp.130.d:0 "Widzowie pamiętają. Nagranie z programu sprzed czterech miesięcy krąży w sieci z dopiskiem „i co?”."
 zpp.130.a:0 "Trudno – następnym razem."
 zpp.131.t:0 "Nikt już nie wierzy telewizji"
 zpp.131.d:0 "Oglądalność spada, w sieci każde wydanie ma tysiące drwiących komentarzy. Prezydium partii żąda zmiany przywódcy."
 zpp.131.a:0 "Dymisja."
 PRW_req_wiar_60:0 "Wiarygodność co najmniej 60"
 PRW_req_zasieg_50:0 "Zasięg przekazu co najmniej 50"
 PRW_req_zasieg_70:0 "Zasięg przekazu co najmniej 70"
 PRW_req_wiar_50:0 "Wiarygodność co najmniej 50"
 zpp.193.t:0 "Narodowa telewizja z Lublina"
 zpp.193.d:0 "Wieczorny program z Lublina ogląda się od Bałtyku po Tatry. Kto ma zasięg, ten ma wpływy – a Lublin ma jedno i drugie. (Fikcja moda.)"
 zpp.193.a:0 "Tak wygląda nowa Lubelszczyzna."
 PRW_ma_kat:0 "Macierewicz: mobilizacja"
 PRW_ma_kat_desc:0 "Mobilizacja zwolenników: §Y[?PRW_mob|0]§!/100, zmęczenie społeczne: §R[?PRW_zmecz|0]§!/100, odbyte miesięcznice: §Y[?PRW_mies_licznik|0]§!\n§YCel:§! „Naród zmobilizowany” – mobilizacja co najmniej 70 przy zmęczeniu poniżej 60.\n§YKoszt:§! miesięcznice (decyzja w panelu partii, co 30 dni) podnoszą mobilizację i zmęczenie – w zależności od wariantu.\n§YZaniedbanie:§! bez miesięcznicy przez 45 dni mobilizacja spada o 8. Zmęczenie od 70 – „społeczeństwo ma dość”, od 90 – kryzys.\n(Fikcyjna ścieżka moda.)"
 PRW_d_ma_odpoczynek:0 "Dzień bez marszu"
 PRW_d_ma_odpoczynek_desc:0 "Miesiąc bez wielkich zgromadzeń: festyny rodzinne zamiast przemówień. Ludzie odpoczywają, najwierniejsi się nudzą."
 PRW_d_ma_raport:0 "Nowy raport komisji"
 PRW_d_ma_raport_desc:0 "Kolejny tom raportu, kolejna konferencja prasowa. Zwolennicy są poruszeni, reszta regionu – zmęczona."
 zpp.140.t:0 "Społeczeństwo ma dość"
 zpp.140.d:0 "Na kolejną miesięcznicę przyszło więcej policjantów niż uczestników. W sklepach i tramwajach ludzie mówią o „wiecznym marszu”."
 zpp.140.a:0 "Trzeba zwolnić tempo."
 zpp.141.t:0 "Region odwraca się od partii"
 zpp.141.d:0 "Zmęczenie zamieniło się w niechęć. Radni odchodzą z klubu, a prezydium partii żąda zmiany przywódcy."
 zpp.141.a:0 "Dymisja."
 zpp.142.t:0 "Marsz rocznicowy"
 zpp.142.d:0 "Dziesiątki tysięcy ludzi w Lublinie: flagi, pochodnie, delegacje z całego regionu. Największe zgromadzenie od upadku państwa."
 zpp.142.a:0 "Naród idzie razem."
 WOS_tt_66:0 "Miesięcznice odbywa się decyzją w panelu partii co 30 dni. Bez nich mobilizacja spada."
 PRW_req_mob_50:0 "Mobilizacja co najmniej 50"
 PRW_req_mob_70:0 "Mobilizacja co najmniej 70"
 PRW_req_zmecz_60:0 "Zmęczenie społeczne poniżej 60"
 zpp.194.t:0 "Lubelszczyzna zmobilizowana"
 zpp.194.d:0 "Kluby patriotyczne, Obrona Terytorialna i comiesięczne zgromadzenia. Lublin ma najbardziej zmobilizowane społeczeństwo rozbitej Polski. (Fikcja moda.)"
 zpp.194.a:0 "Tak wygląda nowa Lubelszczyzna."
 PRW_kt_kat:0 "Kot Prezesa: opiekunowie i projekt Cyber"
 PRW_kt_kat_desc:0 "Opiekunowie: Nowogrodzka §Y[?PRW_op_n|0]§!, serwerownia §Y[?PRW_op_s|0]§!, Żoliborz §Y[?PRW_op_z|0]§!\nProjekt Cyber-Jarosław: dane §Y[?PRW_cj_dane|0]§!, głos §Y[?PRW_cj_glos|0]§!, model decyzyjny §Y[?PRW_cj_model|0]§!, zasilanie §Y[?PRW_cj_zasilanie|0]§! – razem §Y[?PRW_cj|0]§!/400\n§YWskazówka:§! uruchomienie wymaga co najmniej 30 w każdym elemencie. Wynik: 260+ – system działa, 160–259 – wersja z błędami, poniżej 160 – awaria i kryzys.\nPunkty startowe pochodzą z wcześniejszych wyborów: serwerownia (szafa z Nowogrodzkiej), spójność partii, przewaga Harcerzy, obietnica telewizji, ewakuacja archiwów.\nSilny opiekun daje premię do „swojego” elementu: Nowogrodzka – dane, serwerownia – model, Żoliborz – głos. Opiekun powyżej 70 – pozostali się buntują (spójność −2 co miesiąc).\n(Satyryczna, fikcyjna ścieżka moda.)"
 PRW_d_kt_n:0 "Klucze do gabinetu: Opiekun z Nowogrodzkiej"
 PRW_d_kt_n_desc:0 "Przez najbliższe tygodnie to opiekun z nowogrodzkiej decyduje, co „kot chciałby”. Pozostali opiekunowie notują każde słowo."
 PRW_d_kt_s:0 "Klucze do gabinetu: Technik serwerowni"
 PRW_d_kt_s_desc:0 "Przez najbliższe tygodnie to technik serwerowni decyduje, co „kot chciałby”. Pozostali opiekunowie notują każde słowo."
 PRW_d_kt_z:0 "Klucze do gabinetu: Opiekunka z Żoliborza"
 PRW_d_kt_z_desc:0 "Przez najbliższe tygodnie to opiekunka z żoliborza decyduje, co „kot chciałby”. Pozostali opiekunowie notują każde słowo."
 zpp.150.t:0 "Opiekun odchodzi z gabinetu"
 zpp.150.d:0 "Jeden z opiekunów zabrał swoje rzeczy i wyszedł, trzaskając drzwiami. Razem z nim zniknęła część danych do projektu."
 zpp.150.a:0 "Szkoda – ale projekt idzie dalej."
 zpp.160.t:0 "Uruchomienie"
 zpp.160.d:0 "Serwerownia pod urzędem wojewódzkim: wszyscy trzej opiekunowie, kot na fotelu i czerwony przycisk. Na ekranie: „Inicjalizacja. Proszę czekać”."
 zpp.160.a:0 "Wcisnąć."
 zpp.161.t:0 "Cyber-Jarosław działa"
 zpp.161.d:0 "Ekrany ożywają. Głos z głośników jest znajomy, decyzje – szybkie i spójne. Prezydium po raz pierwszy od miesięcy nie musi się kłócić. (Satyra, fikcja moda.)"
 zpp.161.a:0 "Niech system rządzi."
 zpp.162.t:0 "Wersja z błędami"
 zpp.162.d:0 "System działa – mniej więcej. Czasem odpowiada cytatami sprzed lat, czasem zawiesza się w połowie zdania. Opiekunowie tłumaczą jego decyzje każdy po swojemu. (Satyra, fikcja moda.)"
 zpp.162.a:0 "Lepsze to niż nic."
 zpp.163.t:0 "Awaria"
 zpp.163.d:0 "Spięcie, dym i ciemne ekrany. Kot uciekł pod biurko, opiekunowie oskarżają się nawzajem, a prezydium partii żąda końca eksperymentu. (Satyra, fikcja moda.)"
 zpp.163.a:0 "Koniec eksperymentu."
 PRW_req_cj30:0 "Każdy element projektu Cyber co najmniej 30"
 PRW_req_op_s30:0 "Wpływy technika serwerowni co najmniej 30"
 WOS_tt_67:0 "Wynik: 260+ punktów – system działa, 160–259 – wersja z błędami, poniżej 160 – awaria i kryzys przywództwa."
 zpp.195.t:0 "Cyber-Jarosław przejmuje władzę w Lublinie"
 zpp.195.d:0 "Serwerownia pod urzędem wojewódzkim podejmuje decyzje szybciej niż jakikolwiek rząd w rozbitej Polsce. Satyrycy nie nadążają. (Satyra, fikcja moda.)"
 zpp.195.a:0 "Tak wygląda nowa Lubelszczyzna."
 zpp.51.t:0 "Nowy przywódca w Lublinie: Przemysław Czarnek"
 zpp.51.d:0 "Kongres w Lublinie wybrał Przemysława Czarnka. Nowy przewodniczący zapowiada „partię jako jedną armię” i porządek w strukturach. (Fikcja moda.)"
 zpp.51.a:0 "Zobaczymy, dokąd to zaprowadzi Lublin."
 zpp.52.t:0 "Nowy przywódca w Lublinie: Mateusz Morawiecki"
 zpp.52.d:0 "Kongres w Lublinie wybrał Mateusza Morawieckiego. Były premier zapowiada „lubelski cud gospodarczy” i autonomię powiatów. (Fikcja moda.)"
 zpp.52.a:0 "Zobaczymy, dokąd to zaprowadzi Lublin."
 zpp.53.t:0 "Nowy przywódca w Lublinie: Zbigniew Ziobro"
 zpp.53.d:0 "Kongres w Lublinie wybrał Zbigniewa Ziobrę. Pierwsze decyzje dotyczą prokuratury i „rozliczenia winnych upadku państwa”. (Fikcja moda.)"
 zpp.53.a:0 "Zobaczymy, dokąd to zaprowadzi Lublin."
 zpp.54.t:0 "Nowy przywódca w Lublinie: Jacek Kurski"
 zpp.54.d:0 "Kongres w Lublinie wybrał Jacka Kurskiego. Pierwszy wieczorny program z nowego studia ogląda pół regionu. (Fikcja moda.)"
 zpp.54.a:0 "Zobaczymy, dokąd to zaprowadzi Lublin."
 zpp.55.t:0 "Nowy przywódca w Lublinie: Antoni Macierewicz"
 zpp.55.d:0 "Kongres w Lublinie wybrał Antoniego Macierewicza. Zapowiada comiesięczne obchody i odbudowę Obrony Terytorialnej. (Fikcja moda.)"
 zpp.55.a:0 "Zobaczymy, dokąd to zaprowadzi Lublin."
 zpp.56.t:0 "Nowy przywódca w Lublinie: Kot Prezesa"
 zpp.56.d:0 "Kongres w Lublinie wybrał… kota. Trzej opiekunowie zapewniają, że będą przekazywać jego wolę. W piwnicy szumią serwery. (Fikcja moda.)"
 zpp.56.a:0 "Zobaczymy, dokąd to zaprowadzi Lublin."
 zpp.59.t:0 "Kryzys przywództwa w Lublinie"
 zpp.59.d:0 "Przywódca Zjednoczonej Polskiej Prawicy podał się do dymisji. Zarząd partii przejmuje władzę do nowego kongresu."
 zpp.59.a:0 "Co dalej z Lublinem?"
 WOS_tt_68:0 "Kampania przed nowym kongresem: panel „Kampania kongresowa” znowu działa."
 WOS_tt_69:0 "Delegaci wybierają nowego przewodniczącego: jeden z fokusów „Przewodniczący: …” poniżej."
 PRW_req_pokoj_reg:0 "Lublin nie prowadzi wojny"
 PRW_reg_kat:0 "Lublin i sąsiedzi"
 PRW_reg_kat_desc:0 "Warunki zależą od przywódcy: §YCzarnek§! – zgoda: prawicowy rząd sąsiada i przewaga Lublina; odmowa daje cel wojenny tylko wobec tego państwa; §YMorawiecki§! – zgoda: dobra opinia o Lublinie i słaba gospodarka sąsiada; odmowa nie oznacza wojny – rozmowy po 120 dniach; §YZiobro§! – zgoda wyłącznie przy przewadze siły Lublina; odmowa daje cel wojenny tylko wobec tego państwa; §YKurski§! – zgoda rośnie z zasięgiem i wiarygodnością przekazu Lublina; odmowa nie oznacza wojny – rozmowy po 120 dniach; §YMacierewicz§! – zgoda: zagrożenie ze strony Rosji i prawicowy rząd sąsiada; odmowa daje cel wojenny tylko wobec tego państwa; §YKot§! – zgoda zależy od wyniku projektu Cyber i kryzysu u sąsiada; odmowa nie oznacza wojny – rozmowy po 120 dniach.\nPrzywódcy bez przemocy mogą ponowić rozmowy 120 dni po odmowie. (Fikcyjna ścieżka moda.)"
 zpp.200.t:0 "Ultimatum struktur: Podlasie Nadbużańskie"
 zpp.200.d:0 "Pełnomocnik z Lublina przywozi gotowy statut: wasze koła wchodzą do partii, wasz rząd – do jednego państwa. Lublin obiecuje porządek. Odmowa zostanie uznana za wrogość. Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcja moda.)"
 zpp.200.a:0 "Podpisujemy statut."
 zpp.200.b:0 "Nie będziemy filią Lublina."
 PRW_tt_reg_cz_pdl:0 "Podlasie Nadbużańskie dostaje propozycję: „Ultimatum struktur: Podlasie Nadbużańskie”. Odmowa da nam cel wojenny tylko wobec tego państwa."
 zpp.201.t:0 "Ultimatum struktur: Ziemia Radomska"
 zpp.201.d:0 "Pełnomocnik z Lublina przywozi gotowy statut: wasze koła wchodzą do partii, wasz rząd – do jednego państwa. Lublin obiecuje porządek. Odmowa zostanie uznana za wrogość. Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcja moda.)"
 zpp.201.a:0 "Podpisujemy statut."
 zpp.201.b:0 "Nie będziemy filią Lublina."
 PRW_tt_reg_cz_rad:0 "Ziemia Radomska dostaje propozycję: „Ultimatum struktur: Ziemia Radomska”. Odmowa da nam cel wojenny tylko wobec tego państwa."
 zpp.202.t:0 "Ultimatum struktur: Ziemia Piotrkowska"
 zpp.202.d:0 "Pełnomocnik z Lublina przywozi gotowy statut: wasze koła wchodzą do partii, wasz rząd – do jednego państwa. Lublin obiecuje porządek. Odmowa zostanie uznana za wrogość. Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcja moda.)"
 zpp.202.a:0 "Podpisujemy statut."
 zpp.202.b:0 "Nie będziemy filią Lublina."
 PRW_tt_reg_cz_ptk:0 "Ziemia Piotrkowska dostaje propozycję: „Ultimatum struktur: Ziemia Piotrkowska”. Odmowa da nam cel wojenny tylko wobec tego państwa."
 PRW_req_reg_ziemie:0 "Podlasie Nadbużańskie, Ziemia Radomska i Ziemia Piotrkowska należą do Lublina albo są jego podwładnymi"
 zpp.210.t:0 "Oferta systemu: Podlasie Nadbużańskie"
 zpp.210.d:0 "Na serwerach w Lublinie policzono wszystko: koszty, zyski, ryzyka. System przesyła sąsiadom raport i propozycję – wspólne państwo zarządzane według modelu. Satyrycy mają używanie. Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcja moda.)"
 zpp.210.a:0 "Liczby się zgadzają – przyjmujemy."
 zpp.210.b:0 "Nie oddamy władzy maszynie."
 PRW_tt_reg_kt_pdl:0 "Podlasie Nadbużańskie dostaje propozycję: „Oferta systemu: Podlasie Nadbużańskie”. Odmowa nie oznacza wojny – rozmowy można ponowić po 120 dniach."
 zpp.211.t:0 "Oferta systemu: Ziemia Radomska"
 zpp.211.d:0 "Na serwerach w Lublinie policzono wszystko: koszty, zyski, ryzyka. System przesyła sąsiadom raport i propozycję – wspólne państwo zarządzane według modelu. Satyrycy mają używanie. Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcja moda.)"
 zpp.211.a:0 "Liczby się zgadzają – przyjmujemy."
 zpp.211.b:0 "Nie oddamy władzy maszynie."
 PRW_tt_reg_kt_rad:0 "Ziemia Radomska dostaje propozycję: „Oferta systemu: Ziemia Radomska”. Odmowa nie oznacza wojny – rozmowy można ponowić po 120 dniach."
 zpp.212.t:0 "Oferta systemu: Ziemia Piotrkowska"
 zpp.212.d:0 "Na serwerach w Lublinie policzono wszystko: koszty, zyski, ryzyka. System przesyła sąsiadom raport i propozycję – wspólne państwo zarządzane według modelu. Satyrycy mają używanie. Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcja moda.)"
 zpp.212.a:0 "Liczby się zgadzają – przyjmujemy."
 zpp.212.b:0 "Nie oddamy władzy maszynie."
 PRW_tt_reg_kt_ptk:0 "Ziemia Piotrkowska dostaje propozycję: „Oferta systemu: Ziemia Piotrkowska”. Odmowa nie oznacza wojny – rozmowy można ponowić po 120 dniach."
 zpp.220.t:0 "Kampania przekonywania: Podlasie Nadbużańskie"
 zpp.220.d:0 "Od tygodnia w telewizji sąsiadów lecą programy z Lublina: reportaże o pełnych sklepach i spokojnych ulicach. Teraz przychodzi oferta: wspólne państwo. Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcja moda.)"
 zpp.220.a:0 "Ludzie tego chcą – przyjmujemy."
 zpp.220.b:0 "Propaganda nie zastąpi umowy."
 PRW_tt_reg_ku_pdl:0 "Podlasie Nadbużańskie dostaje propozycję: „Kampania przekonywania: Podlasie Nadbużańskie”. Odmowa nie oznacza wojny – rozmowy można ponowić po 120 dniach."
 zpp.221.t:0 "Kampania przekonywania: Ziemia Radomska"
 zpp.221.d:0 "Od tygodnia w telewizji sąsiadów lecą programy z Lublina: reportaże o pełnych sklepach i spokojnych ulicach. Teraz przychodzi oferta: wspólne państwo. Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcja moda.)"
 zpp.221.a:0 "Ludzie tego chcą – przyjmujemy."
 zpp.221.b:0 "Propaganda nie zastąpi umowy."
 PRW_tt_reg_ku_rad:0 "Ziemia Radomska dostaje propozycję: „Kampania przekonywania: Ziemia Radomska”. Odmowa nie oznacza wojny – rozmowy można ponowić po 120 dniach."
 zpp.222.t:0 "Kampania przekonywania: Ziemia Piotrkowska"
 zpp.222.d:0 "Od tygodnia w telewizji sąsiadów lecą programy z Lublina: reportaże o pełnych sklepach i spokojnych ulicach. Teraz przychodzi oferta: wspólne państwo. Piotrków zamyka drogę na Łódź i Śląsk. Kto go trzyma, ten łączy wschód z zachodem. (Fikcja moda.)"
 zpp.222.a:0 "Ludzie tego chcą – przyjmujemy."
 zpp.222.b:0 "Propaganda nie zastąpi umowy."
