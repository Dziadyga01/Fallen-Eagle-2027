 zpp.230.t:0 "Apel o wspólny front: Podlasie Nadbużańskie"
 zpp.230.d:0 "Lublin wzywa do jednego frontu przeciw Rosji: wspólne dowództwo, wspólne państwo, wspólne miesięcznice. Kto nie jest z nami, ten – jak mówią w Lublinie – sam wybrał stronę. Biała Podlaska i ziemie nad Bugiem leżą na drodze z Lublina na północ. Bez nich Lubelszczyzna ma otwartą flankę. (Fikcja moda.)"
 zpp.230.a:0 "Wspólny front – przyjmujemy."
 zpp.230.b:0 "Nie damy się wciągnąć w cudzą krucjatę."
 PRW_tt_reg_ma_pdl:0 "Podlasie Nadbużańskie dostaje propozycję: „Apel o wspólny front: Podlasie Nadbużańskie”. Odmowa da nam cel wojenny tylko wobec tego państwa."
 zpp.231.t:0 "Apel o wspólny front: Ziemia Radomska"
 zpp.231.d:0 "Lublin wzywa do jednego frontu przeciw Rosji: wspólne dowództwo, wspólne państwo, wspólne miesięcznice. Kto nie jest z nami, ten – jak mówią w Lublinie – sam wybrał stronę. Radom ma zakłady, kolej i ludzi. Ma też własny rząd, który od miesięcy nie wie, komu płacić za zimę. (Fikcja moda.)"
