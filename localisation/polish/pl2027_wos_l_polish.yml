 tza.162.d:0 "Zgromadzenie dzielnic Torunia zaprasza mieszkańców gminy do federacji bez prezydenta: każda wspólnota decyduje sama, a współpracuje dobrowolnie. Gmina nad Drwęcą jest przedmieściem Torunia z własnym wójtem i własną strażą. Wspólna administracja oznacza wspólny prąd, wodę i autobusy."
 tza.162.a:0 "Zgromadzenie mieszkańców się zgadza."
 tza.162.b:0 "Nie chcemy eksperymentów."
 tza.163.t:0 "Wolne dzielnice zapraszają: Zławieś Wielka"
 tza.163.d:0 "Zgromadzenie dzielnic Torunia zaprasza mieszkańców gminy do federacji bez prezydenta: każda wspólnota decyduje sama, a współpracuje dobrowolnie. Republika Rozgarcka pilnuje mostu kolejowego i drogi na Bydgoszcz. Bez niej Toruń jest odcięty od zachodu."
 tza.163.a:0 "Zgromadzenie mieszkańców się zgadza."
 tza.163.b:0 "Nie chcemy eksperymentów."
 tza.164.t:0 "Wolne dzielnice zapraszają: Solec Kujawski"
 tza.164.d:0 "Zgromadzenie dzielnic Torunia zaprasza mieszkańców gminy do federacji bez prezydenta: każda wspólnota decyduje sama, a współpracuje dobrowolnie. Wolne Miasto Solec leży między Toruniem a Bydgoszczą. Kto ma Solec, ten ma lewy brzeg Wisły aż po Puszczę Bydgoską."
 tza.164.a:0 "Zgromadzenie mieszkańców się zgadza."
 tza.164.b:0 "Nie chcemy eksperymentów."
