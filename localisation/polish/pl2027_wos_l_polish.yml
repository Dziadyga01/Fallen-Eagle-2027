 ROS_p_szl_future_po_final_desc:0 "Rosjanie mogą mówić, pisać i protestować bez strachu."
 ROS_p_szl_future_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_szl_future_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_szl_future_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_szl_future_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_naw_future_id_sady:0 "Niezawisłe sądy w praktyce"
 ROS_p_naw_future_id_sady_desc:0 "Pierwsze wyroki przeciwko rządowi – wykonane bez sprzeciwu."
 ROS_p_naw_future_id_wybory:0 "Druga kadencja wyborów"
 ROS_p_naw_future_id_wybory_desc:0 "Kolejne uczciwe wybory – i pierwsza pokojowa zmiana władzy."
 ROS_p_naw_future_id_partie:0 "System partyjny"
 ROS_p_naw_future_id_partie_desc:0 "Kilka silnych partii walczy o głosy, a nie o łaski Kremla."
 ROS_p_naw_future_id_kontrola:0 "Kontrola parlamentarna"
 ROS_p_naw_future_id_kontrola_desc:0 "Komisje parlamentarne przesłuchują ministrów i generałów."
 ROS_p_naw_future_id_final:0 "Dojrzała demokracja"
 ROS_p_naw_future_id_final_desc:0 "Demokracja w Rosji przestaje być eksperymentem."
 ROS_p_naw_future_gu_przetargi:0 "Jawne zamówienia publiczne"
 ROS_p_naw_future_gu_przetargi_desc:0 "Każda złotówka – i każdy rubel – wydana przez państwo jest jawna."
 ROS_p_naw_future_gu_firmy:0 "Konkurencja zamiast monopoli"
 ROS_p_naw_future_gu_firmy_desc:0 "Monopole państwowe zostają podzielone."
 ROS_p_naw_future_gu_inwestycje:0 "Inwestorzy wracają"
 ROS_p_naw_future_gu_inwestycje_desc:0 "Firmy z zagranicy wracają, bo ufają sądom."
 ROS_p_naw_future_gu_pensje:0 "Płaca minimalna"
 ROS_p_naw_future_gu_pensje_desc:0 "Najsłabiej opłacani dostają godną pensję."
 ROS_p_naw_future_gu_final:0 "Uczciwy rynek"
 ROS_p_naw_future_gu_final_desc:0 "W Rosji wygrywa najlepszy, a nie najlepiej ustawiony."
 ROS_p_naw_future_bd_armia:0 "Cywilny minister obrony"
 ROS_p_naw_future_bd_armia_desc:0 "Armia podlega cywilowi i parlamentowi."
 ROS_p_naw_future_bd_sluzby:0 "Służby pod kontrolą"
 ROS_p_naw_future_bd_sluzby_desc:0 "Służby specjalne mają ograniczone uprawnienia i stały nadzór."
 ROS_p_naw_future_bd_sprzet:0 "Nowoczesna obrona"
 ROS_p_naw_future_bd_sprzet_desc:0 "Pieniądze na armię wydawane są jawnie i skutecznie."
 ROS_p_naw_future_bd_sojusze:0 "Sojusze obronne"
 ROS_p_naw_future_bd_sojusze_desc:0 "Rosja rozmawia o wspólnej obronie z sąsiadami, a nie przeciwko nim."
 ROS_p_naw_future_bd_final:0 "Bezpieczna demokracja"
 ROS_p_naw_future_bd_final_desc:0 "Demokratyczna Rosja potrafi się bronić – i nikogo nie atakuje."
 ROS_p_naw_future_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_naw_future_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_naw_future_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_naw_future_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_idea_putin_1:0 "Gospodarka za Uralem"
 ROS_idea_putin_1_desc:0 "Przemysł Rosji leży tysiące kilometrów od frontu. Żadna wojna w Polsce go nie dosięgnie."
 ROS_idea_putin_2:0 "Wojna hybrydowa"
 ROS_idea_putin_2_desc:0 "Rosja prowadzi wojnę bez wypowiedzenia: w sieci, w budżetach i na torach kolejowych."
 ROS_idea_putin_3:0 "Elity Kremla"
 ROS_idea_putin_3_desc:0 "Od Kremla do ostatniego urzędu gminy – jedna linia rozkazów i jedna lojalność."
 ROS_idea_mazury_1:0 "Logistyka operacji"
 ROS_idea_mazury_1_desc:0 "Front ma wszystko, czego potrzebuje: paliwo, amunicję i części zamienne."
 ROS_idea_mazury_2:0 "Front informacyjny w Polsce"
 ROS_idea_mazury_2_desc:0 "Na Mazurach to rosyjskie radio mówi ludziom, co się dzieje – i co ich czeka."
 ROS_idea_mazury_3:0 "Administracja okupacyjna"
 ROS_idea_mazury_3_desc:0 "Zajęte gminy mają administrację, walutę i policję. Opór schodzi do podziemia."
 ROS_idea_kryzys_1:0 "Walka o sukcesję"
 ROS_idea_kryzys_1_desc:0 "Klany dzielą ministerstwa i ustalają, kto poprowadzi państwo do wyborów."
 ROS_idea_kryzys_2:0 "Rynki w panice"
 ROS_idea_kryzys_2_desc:0 "Państwo trzyma gospodarkę za gardło, żeby ta nie przestała oddychać."
 ROS_idea_kryzys_3:0 "Armia bez dowódcy"
 ROS_idea_kryzys_3_desc:0 "Wojsko nie bierze udziału w walce o Kreml – i dzięki temu wszyscy się go boją."
 ROS_idea_poklonska_1:0 "Prawo i prokuratura"
 ROS_idea_poklonska_1_desc:0 "Państwo ma prawo, sądy i prokuraturę, które działają – na razie powoli, ale działają."
 ROS_idea_poklonska_2:0 "Gospodarka przejściowa"
 ROS_idea_poklonska_2_desc:0 "Gospodarka nie rośnie, ale też nie spada. Na czas przejściowy to sukces."
 ROS_idea_poklonska_3:0 "Bezpieczeństwo przejściowe"
 ROS_idea_poklonska_3_desc:0 "Rosja dochodzi do wyborów bez zamachu stanu. Mało kto w to wierzył."
 ROS_idea_szojgu_1:0 "Junta"
 ROS_idea_szojgu_1_desc:0 "Rosją rządzi armia – sprawnie, twardo i bez pytania kogokolwiek o zdanie."
 ROS_idea_szojgu_2:0 "Mobilizacja przemysłu"
 ROS_idea_szojgu_2_desc:0 "Każda fabryka w Rosji jest teraz zakładem obronnym."
 ROS_idea_szojgu_3:0 "Kontrola regionów"
 ROS_idea_szojgu_3_desc:0 "Od Kaliningradu po Władywostok – jedna armia, jedno państwo, jeden rozkaz."
 ROS_idea_wybory_1:0 "Kampania w regionach"
 ROS_idea_wybory_1_desc:0 "Kraj jest podzielony, ale głosuje. To już coś."
 ROS_idea_wybory_2:0 "Media i debaty"
 ROS_idea_wybory_2_desc:0 "Rosjanie wybierają, wiedząc, na kogo głosują."
 ROS_idea_wybory_3:0 "Bezpieczeństwo wyborów"
 ROS_idea_wybory_3_desc:0 "Wynik może się nie podobać, ale nikt nie może powiedzieć, że został sfałszowany."
 ROS_idea_car_1:0 "Dwór na Kremlu"
 ROS_idea_car_1_desc:0 "Państwo to on. Wszyscy inni są tylko wykonawcami."
 ROS_idea_car_2:0 "Imperialna armia"
 ROS_idea_car_2_desc:0 "Armia jest znowu największą siłą w Europie – i największym argumentem Kremla."
 ROS_idea_car_3:0 "Autarkia"
 ROS_idea_car_3_desc:0 "Rosja nie potrzebuje świata – przynajmniej tak mówi telewizja."
 ROS_idea_mie_1:0 "Biurokracja Kremla"
 ROS_idea_mie_1_desc:0 "Rosją rządzą procedury. Wolno, ale przewidywalnie."
 ROS_idea_mie_2:0 "Zwrot na wschód"
 ROS_idea_mie_2_desc:0 "Rosja jest teraz młodszym partnerem gospodarki azjatyckiej – ale partnerem."
 ROS_idea_mie_3:0 "Armia kontraktowa"
 ROS_idea_mie_3_desc:0 "Armia składa się z ludzi, którzy wybrali wojsko – i dobrze za to zapłacono."
 ROS_idea_szo_1:0 "Państwo-sztab"
 ROS_idea_szo_1_desc:0 "Rosja działa jak armia: rozkaz, wykonanie, meldunek."
 ROS_idea_szo_2:0 "Zbrojeniówka"
 ROS_idea_szo_2_desc:0 "Rosja produkuje więcej broni niż cała Europa razem."
 ROS_idea_szo_3:0 "Dyscyplina społeczna"
 ROS_idea_szo_3_desc:0 "Rosja maszeruje w jednym rytmie – z ostrożności czy z przekonania, trudno powiedzieć."
 ROS_idea_cho_1:0 "Rynek i prywatyzacja"
 ROS_idea_cho_1_desc:0 "Rosja handluje, inwestuje i zarabia – bardziej niż kiedykolwiek od dekad."
 ROS_idea_cho_2:0 "Prawo własności"
 ROS_idea_cho_2_desc:0 "W Rosji można wreszcie coś mieć – i nie bać się, że to zabiorą."
 ROS_idea_cho_3:0 "Prywatne armie"
 ROS_idea_cho_3_desc:0 "Bezpieczeństwo Rosji jest kontraktem – drogim, ale dotrzymywanym."
 ROS_idea_szl_1:0 "Federalizm"
 ROS_idea_szl_1_desc:0 "Rosja jest federacją nie tylko z nazwy."
 ROS_idea_szl_2:0 "Pojednanie z sąsiadami"
 ROS_idea_szl_2_desc:0 "Rosja nie jest już zagrożeniem dla sąsiadów – przynajmniej na razie."
 ROS_idea_szl_3:0 "Odbudowa nauki"
 ROS_idea_szl_3_desc:0 "Najlepszym rosyjskim towarem eksportowym znów są głowy, nie ropa."
 ROS_idea_naw_1:0 "Antykorupcja"
 ROS_idea_naw_1_desc:0 "W urzędzie można załatwić sprawę bez koperty. Dla wielu to rewolucja."
 ROS_idea_naw_2:0 "Reformy demokratyczne"
 ROS_idea_naw_2_desc:0 "Rosja uczy się demokracji – z błędami, ale bez strachu."
 ROS_idea_naw_3:0 "Armia obywatelska"
 ROS_idea_naw_3_desc:0 "Wojsko jest silne, ale podlega prawu i parlamentowi."
 ROS_idea_putin_future_1:0 "Rosja-twierdza"
 ROS_idea_putin_future_1_desc:0 "Rosja jest gotowa na każdą wojnę – i na żadną nie chce iść."
 ROS_idea_putin_future_2:0 "Testament władzy"
 ROS_idea_putin_future_2_desc:0 "System ma przetrwać człowieka, który go zbudował."
 ROS_idea_putin_future_3:0 "Bałtyk pod kontrolą"
 ROS_idea_putin_future_3_desc:0 "Na Bałtyku nic nie dzieje się bez wiedzy Floty Bałtyckiej."
 ROS_idea_mie_future_1:0 "Gubernie imperium"
 ROS_idea_mie_future_1_desc:0 "Rosja ma znowu administrację imperialną – i jej problemy."
 ROS_idea_mie_future_2:0 "Prawosławne imperium"
 ROS_idea_mie_future_2_desc:0 "Imperium ma swoją misję – przynajmniej w przemówieniach."
 ROS_idea_mie_future_3:0 "Imperialna gospodarka"
 ROS_idea_mie_future_3_desc:0 "Imperium jest bogate – w każdym razie jego skarb."
 ROS_idea_szo_future_1:0 "Dyrektoriat wojskowy"
 ROS_idea_szo_future_1_desc:0 "Rosją rządzi kolegium wojskowych – sprawnie, ale nerwowo."
 ROS_idea_szo_future_2:0 "Armia przyszłości"
 ROS_idea_szo_future_2_desc:0 "Rosyjska armia jest najnowocześniejsza w swojej historii."
 ROS_idea_szo_future_3:0 "Gospodarka koszarowa"
 ROS_idea_szo_future_3_desc:0 "Kraj działa jak jednostka wojskowa. Sprawnie, ale bez radości."
 ROS_idea_cho_future_1:0 "Korporacyjne państwo"
 ROS_idea_cho_future_1_desc:0 "Rosja działa jak korporacja: z zyskiem i bez sentymentów."
 ROS_idea_cho_future_2:0 "Klasa średnia"
 ROS_idea_cho_future_2_desc:0 "Po raz pierwszy większość Rosjan ma coś do stracenia."
 ROS_idea_cho_future_3:0 "Bezpieczeństwo kontraktowe"
 ROS_idea_cho_future_3_desc:0 "Bezpieczeństwo kosztuje, ale jest skuteczne."
 ROS_idea_szl_future_1:0 "Traktat federacyjny w praktyce"
 ROS_idea_szl_future_1_desc:0 "Rosja jest zbiorem republik, które same chcą być razem."
 ROS_idea_szl_future_2:0 "Rosja w Europie"
 ROS_idea_szl_future_2_desc:0 "Po raz pierwszy od dekad Rosja jest częścią Europy, a nie jej strachem."
 ROS_idea_szl_future_3:0 "Prawa obywatelskie"
 ROS_idea_szl_future_3_desc:0 "Rosjanie mogą mówić, pisać i protestować bez strachu."
 ROS_idea_naw_future_1:0 "Instytucje demokracji"
 ROS_idea_naw_future_1_desc:0 "Demokracja w Rosji przestaje być eksperymentem."
 ROS_idea_naw_future_2:0 "Gospodarka uczciwa"
 ROS_idea_naw_future_2_desc:0 "W Rosji wygrywa najlepszy, a nie najlepiej ustawiony."
 ROS_idea_naw_future_3:0 "Bezpieczeństwo demokratyczne"
 ROS_idea_naw_future_3_desc:0 "Demokratyczna Rosja potrafi się bronić – i nikogo nie atakuje."
 ROS_idea_opor_zdobyczy:0 "Opór na zdobytych ziemiach"
 ROS_idea_opor_zdobyczy_desc:0 "Gubernatorzy meldują o spokoju, ale garnizony nie wychodzą nocą z koszar. Zdobyte miasta trzeba trzymać siłą."
 ROS_tt_spadek:0 "Spadek po poprzednim etapie: wynik wojny na Ukrainie (zwycięstwo – doświadczenie armii; zamrożenie – stabilność; pokój – gospodarka), wynik wojny mazurskiej (zwycięstwo – władza polityczna; klęska – kary) i dorobek poprzedniego przywódcy (ukończone gałęzie: 0 – kara, 1–2 – premia, 3 – duża premia)."
 ROSZ_panel:0 "Rosja: zaplecze poza mapą"
 ROSZ_panel_desc:0 "Większość Rosji leży poza mapą: fabryki za Uralem, ropa z Syberii i rezerwy z głębi kraju."
 ROS_req_ukraina:0 "Wojna na Ukrainie musi się zakończyć"
 ROS_zaplecze_poza_mapa:0 "Zaplecze poza mapą"
 ROS_zaplecze_poza_mapa_desc:0 "Fabryki za Uralem, ropa z Syberii i stal z Magnitogorska. Rosja produkuje, nawet gdy na mapie nie ma surowców."
 ROS_idea_ua_gospodarka:0 "Gospodarka wojenna"
 ROS_idea_ua_gospodarka_desc:0 "Zakłady pracują na trzy zmiany, a budżet obrony jest większy niż wydatki na szkoły i szpitale razem."
 ROS_idea_ua_linia:0 "Linia obrony na południu"
 ROS_idea_ua_linia_desc:0 "Pola minowe, rowy przeciwpancerne i bunkry na setki kilometrów. Front stoi – i właśnie o to chodzi."
 ROS_idea_ua_zwyciestwo:0 "Armia po zwycięstwie"
 ROS_idea_ua_zwyciestwo_desc:0 "Weterani wojny na Ukrainie wracają jako najbardziej doświadczona armia Europy – i szukają nowego celu."
 ROS_idea_ua_zamrozenie:0 "Zamrożony front"
 ROS_idea_ua_zamrozenie_desc:0 "Linia rozejmu przecina kraj na pół. Nikt nie wygrał, ale żołnierze mogą wrócić do koszar – albo pojechać na zachód."
 ROS_idea_ua_pokoj:0 "Pokój bez zwycięstwa"
 ROS_idea_ua_pokoj_desc:0 "Rosja wycofuje się z większości zajętych ziem. Gospodarka oddycha, generałowie milczą, a w telewizji mówi się o „przegrupowaniu”."
 ROSZ_zaklady:0 "Nowe zakłady za Uralem"
 ROSZ_zaklady_desc:0 "Linie produkcyjne przeniesione z zachodnich obwodów ruszają w Jekaterynburgu i Czelabińsku. Broń jedzie na zachód koleją."
 ROSZ_cywilne:0 "Przemysł cywilny w głębi kraju"
 ROSZ_cywilne_desc:0 "Fabryki maszyn, cementownie i zakłady chemiczne, do których nie sięga żadna wojna."
 ROSZ_mobilizacja:0 "Pobór w obwodach wewnętrznych"
 ROSZ_mobilizacja_desc:0 "Komisje wojskowe w Rostowie, Wołgogradzie i na Syberii. Rekruci jadą na zachód pociągami."
 ROSZ_transport:0 "Transport sprzętu koleją"
 ROSZ_transport_desc:0 "Eszelony z magazynów w głębi kraju: karabiny, amunicja, ciężarówki i transportery."
 ROSZ_paliwo:0 "Ropa z Syberii"
 ROSZ_paliwo_desc:0 "Cysterny z rafinerii nad Wołgą. Paliwa wystarczy na kolejną ofensywę."
 ROSZ_dywizje:0 "Brygady z Zachodniego Okręgu"
 ROSZ_dywizje_desc:0 "Dwie brygady zmechanizowane z głębi kraju przyjeżdżają do Królewca – razem ze sprzętem i dowództwem."
 ukr.1.t:0 "Front ukraiński wraca na pierwsze strony"
 ukr.1.d:0 "Wojna mazurska się skończyła, ale na południu nadal stoi front długi na tysiąc kilometrów. Sztab Generalny przedstawia rachunek: ludzie, sprzęt, pieniądze. Zanim Rosja pomyśli o kolejnej wojnie w Polsce, musi rozstrzygnąć tę."
 ukr.1.a:0 "Najpierw Ukraina."
 ROS_ua_tt_khe20:0 "Obwód chersoński: §G+20§! postępu Rosji. Za półtora miesiąca Ukraina odpowie kontrofensywą."
 ROS_ua_tt_khe10:0 "Obwód chersoński: §G+10§! postępu Rosji."
 ukr.2.t:0 "Ofensywa na południu"
 ukr.2.d:0 "Kolumny ruszają o świcie. Pierwsze raporty są dobre, ale drugi dzień przynosi kontratak i miny tam, gdzie zwiad ich nie widział."
 ukr.2.a:0 "Naciskać dalej, bez względu na straty."
 ukr.2.b:0 "Zatrzymać się i umocnić zdobyty teren."
 ROS_ua_tt_khe_10:0 "Obwód chersoński: §R-10§! postępu Rosji."
 ukr.3.t:0 "Kontrofensywa"
 ukr.3.d:0 "Ukraińskie brygady przełamują linię w dwóch miejscach. Sztab prosi o rezerwy i zgodę na wycofanie się z wysuniętych pozycji."
 ukr.3.a:0 "Rzucić rezerwy. Ani kroku w tył."
 ukr.3.b:0 "Wycofać się na przygotowane pozycje."
 ukr.4.t:0 "Rozmowy w Stambule"
 ukr.4.d:0 "Delegacje siadają w tym samym pałacu co przed laty. Mediatorzy mają gotowy projekt: linia rozejmu, wymiana jeńców, strefa zdemilitaryzowana. Pytanie, kto ustąpi pierwszy."
 ukr.4.a:0 "Twardo: linia rozejmu tam, gdzie stoją nasze wojska."
 ukr.4.b:0 "Ustąpić: wymiana jeńców i strefa buforowa."
 ukr.4.c:0 "Zerwać rozmowy."
 ukr.10.t:0 "Koniec wojny na Ukrainie"
 ukr.10.d:0 "Po latach walk front na Ukrainie milknie. Jedni mówią o zwycięstwie, inni o zdradzie, a jeszcze inni po prostu wracają do domów. W Polsce wszyscy zadają jedno pytanie: dokąd teraz pojadą rosyjskie brygady?"
 ukr.10.a:0 "Świat wstrzymuje oddech."
 ROS_ua_tt_cooldown:0 "Wszystkie operacje w obwodach Ukrainy są od razu gotowe do ponownego użycia."
 ROS_ua_tt_kha10:0 "Obwód charkowski: §G+10§! postępu Rosji."
 ROS_ua_tt_dni15:0 "Obwód dniepropetrowski: §G+15§! postępu Rosji."
 ROS_ua_tt_khe10b:0 "Obwód chersoński: §G+10§! postępu Rosji."
 ROS_ua_tt_przelamanie:0 "Obwód chersoński: §G+20§!, obwód mikołajowski: §G+10§! postępu Rosji."
 WOS_tt_26:0 "Wojna na Ukrainie się kończy, a ofensywy w obwodach zostają wstrzymane. Po miesiącu rozstrzyga się los przywódcy, a „Druga fala” (druga wojna w Polsce) staje się możliwa."
 ROS_req_dom_50:0 "Dominacja Rosji na mapie Ukrainy co najmniej 50%"
 ROS_req_dom_12:0 "Dominacja Rosji na mapie Ukrainy co najmniej 12% (Rosja utrzymuje obecne linie)"
 ROS_req_pokoj:0 "Ustępstwa w Stambule albo dominacja Rosji na mapie Ukrainy poniżej 12% (Ukraina odzyskała teren)"
 ROS_ua_drony:0 "Wojna dronów"
 ROS_ua_start:0 "Wojna na Ukrainie"
 ROS_ua_start_desc:0 "Wojna mazurska była krótka. Ta na południu trwa od lat i pochłania wszystko: ludzi, sprzęt, pieniądze i cierpliwość. Zanim Rosja ruszy na zachód, musi ją zakończyć."
 ROS_ua_sztab:0 "Sztab operacji na południu"
 ROS_ua_sztab_desc:0 "Jedno dowództwo dla całego frontu – i jeden generał, który odpowiada za wynik przed Kremlem."
 ROS_ua_mobilizacja:0 "Nowa fala mobilizacji"
 ROS_ua_mobilizacja_desc:0 "Karty powołania trafiają do roczników, które dotąd udawało się oszczędzić. Ulice dużych miast pustoszeją, a dworce się zapełniają."
 ROS_ua_ural:0 "Zakłady za Uralem"
 ROS_ua_ural_desc:0 "Fabryki czołgów i amunicji w głębi kraju dostają zamówienia na pięć lat. Na mapie ich nie widać – ale sprzęt jedzie na front co tydzień."
 ROS_ua_gospodarka:0 "Gospodarka wojenna"
 ROS_ua_gospodarka_desc:0 "Budżet, ceny i zatrudnienie podporządkowane frontowi. Ludzie narzekają, ale fabryki pracują na trzy zmiany."
 ROS_ua_rezerwy:0 "Rezerwy strategiczne"
 ROS_ua_rezerwy_desc:0 "Dwie armie odtworzone na tyłach – na wypadek przełamania albo na następną wojnę."
 ROS_ua_poludnie:0 "Ofensywa na południu"
 ROS_ua_poludnie_desc:0 "Kierunek na Zaporoże. Jeśli się uda, front przesunie się o kilkadziesiąt kilometrów. Jeśli nie – o kilkadziesiąt tysięcy ludzi mniej."
 ROS_ua_drony_desc:0 "Tysiące tanich dronów z fabryk w Tatarstanie zmieniają front w strefę, w której każdy ruch jest widoczny z powietrza."
 ROS_ua_linia:0 "Linia obrony na południu"
 ROS_ua_linia_desc:0 "Pola minowe i rowy przeciwpancerne na setki kilometrów. Ukraińskie kontrofensywy zatrzymują się na nich tygodniami."
 ROS_ua_donbas:0 "Ofensywa w Donbasie"
 ROS_ua_donbas_desc:0 "Miasta, z których zostały tylko nazwy na mapie. Każdy kilometr kosztuje więcej niż poprzedni."
 ROS_ua_lotnictwo:0 "Przewaga w powietrzu"
 ROS_ua_lotnictwo_desc:0 "Lotnictwo frontowe wreszcie działa razem z artylerią. Bomby szybujące niszczą umocnienia, zanim piechota do nich dojdzie."
 ROS_ua_przelamanie:0 "Przełamanie frontu"
 ROS_ua_przelamanie_desc:0 "Wszystko na jedną kartę: rezerwy, lotnictwo i artyleria w jednym miejscu. Jeśli front pęknie, wojna się skończy."
 ROS_ua_propaganda:0 "Wojna w telewizji"
 ROS_ua_propaganda_desc:0 "Każdy wieczór zaczyna się od mapy frontu. Strzałki zawsze idą na zachód, nawet gdy w rzeczywistości stoją w miejscu."
 ROS_ua_stambul:0 "Rozmowy w Stambule"
 ROS_ua_stambul_desc:0 "Pierwsze od lat rozmowy z udziałem obu stron. Mediatorzy mają projekt rozejmu – trzeba tylko zdecydować, ile Rosja jest gotowa oddać."
 ROS_ua_jency:0 "Wymiana jeńców"
 ROS_ua_jency_desc:0 "Autobusy przejeżdżają przez linię frontu w obie strony. Matki żołnierzy czekają na granicy z listami nazwisk."
 ROS_ua_koszty:0 "Rachunek za wojnę"
 ROS_ua_koszty_desc:0 "Ministerstwo finansów pokazuje liczby, których nie ma w telewizji. Wojna kosztuje więcej, niż Rosja może zarobić."
 ROS_ua_weterani:0 "Weterani wracają"
 ROS_ua_weterani_desc:0 "Setki tysięcy ludzi z frontu wracają do miast, w których nikt na nich nie czeka. Państwo musi im dać pracę – albo nową wojnę."
 ROS_ua_f_zwyciestwo:0 "Zwycięstwo na Ukrainie"
 ROS_ua_f_zwyciestwo_desc:0 "Front pęka, a Kijów zgadza się na rozejm na rosyjskich warunkach. Armia wraca jako najbardziej doświadczona w Europie – i patrzy na zachód."
 ROS_ua_f_zamrozenie:0 "Zamrożony konflikt"
 ROS_ua_f_zamrozenie_desc:0 "Linia rozejmu biegnie tam, gdzie stały wojska. Żadna strona nie wygrała, ale obie mogą przestać umierać. Brygady wracają do koszar – albo jadą na zachód."
 ROS_ua_f_pokoj:0 "Pokój bez zwycięstwa"
 ROS_ua_f_pokoj_desc:0 "Rosja wycofuje się z większości zajętych ziem w zamian za zniesienie części sankcji. Gospodarka oddycha, a generałowie szukają winnych."
 ROS_ua_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_ua_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_ua_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_ua_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 TPO_tt_zillmann:0 "Katarzyna Zillmann dołącza do Torunia jako doradca polityczny (do zatrudnienia za władzę polityczną). Postać tylko dla tego przywódcy."
 TPO_tt_maciejewski:0 "Hubert Maciejewski dołącza do Torunia jako doradca polityczny (do zatrudnienia za władzę polityczną). Postać tylko dla tego przywódcy."
 TPO_tt_okoniewicz:0 "Wacław Okoniewicz dołącza do Torunia jako doradca polityczny (do zatrudnienia za władzę polityczną). Postać tylko dla tego przywódcy."
 TPO_tt_beyer:0 "Nadia Beyer dołącza do Torunia jako doradca polityczny (do zatrudnienia za władzę polityczną). Postać tylko dla tego przywódcy."
 TPO_tt_batman:0 "Batman Stanisław dołącza do Torunia jako generał (od razu w kadrze dowódczej). Postać tylko dla tego przywódcy."
 TPO_tt_dominikowski:0 "Krzysztof Dominikowski dołącza do Torunia jako doradca polityczny (do zatrudnienia za władzę polityczną). Postać tylko dla tego przywódcy."
 tza.100.t:0 "Rzeczpospolita Samorządów: Podgórz wraca do miasta"
 tza.100.d:0 "Toruń proponuje dobrowolną federację samorządów: każda gmina zachowuje radę i głos we wspólnym sejmiku, a decyzje zapadają razem. Lewobrzeżna dzielnica ogłosiła niezależność w pierwszych dniach chaosu. Most łączy oba brzegi Wisły – czas połączyć też urzędy."
 tza.100.a:0 "Wchodzimy do federacji samorządów."
 tza.100.b:0 "Zostajemy sami – nasza rada, nasze decyzje."
 tza.101.t:0 "Rzeczpospolita Samorządów: Łysomice"
 tza.101.d:0 "Toruń proponuje dobrowolną federację samorządów: każda gmina zachowuje radę i głos we wspólnym sejmiku, a decyzje zapadają razem. Gmina na północ od miasta żyje z Torunia: tu pracuje, tu się leczy, tu kupuje. Granica na rogatkach nikomu nie służy."
 tza.101.a:0 "Wchodzimy do federacji samorządów."
 tza.101.b:0 "Zostajemy sami – nasza rada, nasze decyzje."
 tza.102.t:0 "Rzeczpospolita Samorządów: Lubicz"
 tza.102.d:0 "Toruń proponuje dobrowolną federację samorządów: każda gmina zachowuje radę i głos we wspólnym sejmiku, a decyzje zapadają razem. Gmina nad Drwęcą jest przedmieściem Torunia z własnym wójtem i własną strażą. Wspólna administracja oznacza wspólny prąd, wodę i autobusy."
 tza.102.a:0 "Wchodzimy do federacji samorządów."
 tza.102.b:0 "Zostajemy sami – nasza rada, nasze decyzje."
 tza.103.t:0 "Rzeczpospolita Samorządów: Zławieś Wielka"
 tza.103.d:0 "Toruń proponuje dobrowolną federację samorządów: każda gmina zachowuje radę i głos we wspólnym sejmiku, a decyzje zapadają razem. Republika Rozgarcka pilnuje mostu kolejowego i drogi na Bydgoszcz. Bez niej Toruń jest odcięty od zachodu."
 tza.103.a:0 "Wchodzimy do federacji samorządów."
 tza.103.b:0 "Zostajemy sami – nasza rada, nasze decyzje."
 tza.104.t:0 "Rzeczpospolita Samorządów: Solec Kujawski"
 tza.104.d:0 "Toruń proponuje dobrowolną federację samorządów: każda gmina zachowuje radę i głos we wspólnym sejmiku, a decyzje zapadają razem. Wolne Miasto Solec leży między Toruniem a Bydgoszczą. Kto ma Solec, ten ma lewy brzeg Wisły aż po Puszczę Bydgoską."
 tza.104.a:0 "Wchodzimy do federacji samorządów."
 tza.104.b:0 "Zostajemy sami – nasza rada, nasze decyzje."
 tza.105.t:0 "Rzeczpospolita Samorządów: Chełmża"
 tza.105.d:0 "Toruń proponuje dobrowolną federację samorządów: każda gmina zachowuje radę i głos we wspólnym sejmiku, a decyzje zapadają razem. Wolne Miasto Chełmża ma cukrownię, jezioro i drogę na Grudziądz. Ma też za mało ludzi, żeby samo się obronić."
 tza.105.a:0 "Wchodzimy do federacji samorządów."
 tza.105.b:0 "Zostajemy sami – nasza rada, nasze decyzje."
 tza.106.t:0 "Rzeczpospolita Samorządów: Dąbrowa Chełmińska"
 tza.106.d:0 "Toruń proponuje dobrowolną federację samorządów: każda gmina zachowuje radę i głos we wspólnym sejmiku, a decyzje zapadają razem. Gmina na skarpie nad Wisłą zamyka drogę do Chełmna. Jej rada od miesięcy pyta, kto zapłaci za zimę."
 tza.106.a:0 "Wchodzimy do federacji samorządów."
 tza.106.b:0 "Zostajemy sami – nasza rada, nasze decyzje."
 tza.107.t:0 "Rzeczpospolita Samorządów: Gniewkowo, Rojewo i Aleksandrów"
 tza.107.d:0 "Toruń proponuje dobrowolną federację samorządów: każda gmina zachowuje radę i głos we wspólnym sejmiku, a decyzje zapadają razem. Trzy gminy Republiki Kujawskiej leżą bliżej toruńskiego ratusza niż inowrocławskiego. Toruń chce tylko ich – nie całych Kujaw."
 tza.107.a:0 "Wchodzimy do federacji samorządów."
 tza.107.b:0 "Zostajemy sami – nasza rada, nasze decyzje."
 tza.108.t:0 "Rzeczpospolita Samorządów: Ziemia Chełmińska"
 tza.108.d:0 "Toruń proponuje dobrowolną federację samorządów: każda gmina zachowuje radę i głos we wspólnym sejmiku, a decyzje zapadają razem. Stare miasto prawa chełmińskiego i jego gminy tworzą własne państwo. Dla Torunia to kolebka regionu – i ostatni brakujący kawałek."
 tza.108.a:0 "Wchodzimy do federacji samorządów."
 tza.108.b:0 "Zostajemy sami – nasza rada, nasze decyzje."
 tza.120.t:0 "Wspólne usługi z Toruniem: Podgórz wraca do miasta"
 tza.120.d:0 "Toruń oferuje wspólne ciepło, wodę, szpital i autobusy – za darmo przez pierwszy rok. W zamian gmina wchodzi do Socjalnej Republiki. Lewobrzeżna dzielnica ogłosiła niezależność w pierwszych dniach chaosu. Most łączy oba brzegi Wisły – czas połączyć też urzędy."
 tza.120.a:0 "Ludzie potrzebują ciepła i lekarzy. Przyjmujemy."
