 ROS_p_szo_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_szo_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_szo_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_cho_rp_gielda:0 "Otwarcie giełdy dla zagranicy"
 ROS_p_cho_rp_gielda_desc:0 "Inwestorzy z zagranicy mogą kupować akcje rosyjskich spółek – na nowych zasadach."
 ROS_p_cho_rp_przetargi:0 "Przejrzyste przetargi"
 ROS_p_cho_rp_przetargi_desc:0 "Każdy przetarg jest publiczny, a wyniki można sprawdzić w internecie."
 ROS_p_cho_rp_mali:0 "Ulgi dla małych firm"
 ROS_p_cho_rp_mali_desc:0 "Właściciele sklepów i warsztatów płacą niższe podatki i nie muszą płacić łapówek."
 ROS_p_cho_rp_energetyka:0 "Prywatna energetyka"
 ROS_p_cho_rp_energetyka_desc:0 "Elektrownie trafiają w ręce prywatnych inwestorów, którzy muszą je zmodernizować."
 ROS_p_cho_rp_final:0 "Gospodarka rynkowa"
 ROS_p_cho_rp_final_desc:0 "Rosja handluje, inwestuje i zarabia – bardziej niż kiedykolwiek od dekad."
 ROS_p_cho_pw_sady:0 "Sądy gospodarcze"
 ROS_p_cho_pw_sady_desc:0 "Nowe sądy rozstrzygają spory firm w miesiąc, a nie w rok."
 ROS_p_cho_pw_rejestr:0 "Rejestr własności"
 ROS_p_cho_pw_rejestr_desc:0 "Każda działka, każda fabryka i każdy statek ma właściciela zapisanego w jednym rejestrze."
 ROS_p_cho_pw_amnestia:0 "Amnestia kapitałowa"
 ROS_p_cho_pw_amnestia_desc:0 "Kto przywiezie pieniądze z zagranicy, nie będzie pytany, skąd je ma."
 ROS_p_cho_pw_korupcja:0 "Koniec haraczy"
 ROS_p_cho_pw_korupcja_desc:0 "Urzędnicy, którzy żądali łapówek od firm, tracą pracę."
 ROS_p_cho_pw_final:0 "Bezpieczna własność"
 ROS_p_cho_pw_final_desc:0 "W Rosji można wreszcie coś mieć – i nie bać się, że to zabiorą."
 ROS_p_cho_pa_kontrakty:0 "Kontrakty z firmami wojskowymi"
 ROS_p_cho_pa_kontrakty_desc:0 "Prywatne firmy wojskowe dostają kontrakty od państwa – z jasnymi zasadami."
 ROS_p_cho_pa_szkolenia:0 "Szkolenia zachodnim standardem"
 ROS_p_cho_pa_szkolenia_desc:0 "Instruktorzy z doświadczeniem z całego świata szkolą rosyjskich żołnierzy."
 ROS_p_cho_pa_sprzet:0 "Sprzęt z rynku"
 ROS_p_cho_pa_sprzet_desc:0 "Firmy kupują sprzęt tam, gdzie jest najlepszy i najtańszy."
 ROS_p_cho_pa_ochrona:0 "Ochrona infrastruktury"
 ROS_p_cho_pa_ochrona_desc:0 "Rurociągi, porty i kopalnie pilnują prywatne firmy, odciążając armię."
 ROS_p_cho_pa_final:0 "Wojna jako usługa"
 ROS_p_cho_pa_final_desc:0 "Bezpieczeństwo Rosji jest kontraktem – drogim, ale dotrzymywanym."
 ROS_p_cho_druga_op:0 "Druga operacja mazurska"
 ROS_p_cho_druga_op_desc:0 "Sztab ma nowy plan: mniej kolumn na drogach między jeziorami, więcej artylerii i dronów. Cel się nie zmienia – ale tym razem uderzenie idzie w jedno państwo."
