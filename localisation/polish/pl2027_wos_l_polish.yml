 cpz.330.t:0 "Pomorskie: kryzys regionalny"
 cpz.330.d:0 "W województwie §Wpomorskie§! tymczasowa administracja żąda pieniędzy, policji i prawa do własnych decyzji. Miasta i powiaty spierają się między sobą, kto ma rządzić regionem. (Etap III, historia alternatywna moda.)"
 cpz.330.a:0 "Negocjować – kupić czas."
 cpz.330.b:0 "Wysłać komisarza rządu."
