 TR2_zal_dziedzictwo:0 "Dziedzictwo starego miasta"
 TR2_zal_dziedzictwo_desc:0 "Gotyckie mury przetrwały Krzyżaków, Szwedów i dwie wojny światowe. Zaleski każe je wzmocnić – i oddaje ich ochronę człowiekowi, który zna każdy kamień Starówki."
 TR2_zal_wladza_dla_osiedli:0 "Władza dla osiedli"
 TR2_zal_wladza_dla_osiedli_desc:0 "Dyrektoriat chce budować drogi i mosty, ale bez osiedli nie zbuduje nic. Zaleski zaprasza do Ratusza rzecznika rad osiedlowych."
