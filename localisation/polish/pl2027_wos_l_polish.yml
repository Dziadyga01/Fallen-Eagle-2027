 PL2027_SE_naglowek_cpz_trybunal:0 "WARSZAWA  ·  ALEJA SZUCHA  ·  NOC 30/31 PAŹDZIERNIKA 2026"
 PL2027_SE_tytul_cpz_trybunal:0 "PREZYDENT W TRYBUNALE"
 PL2027_SE_opis_cpz_trybunal:0 "Tuż przed pierwszą w nocy prezydent wchodzi do siedziby Trybunału Konstytucyjnego. Za bramą tłum, przed nią policja, na korytarzu sędziowie, których prezydent nie uznaje. Dwa ośrodki władzy po raz pierwszy stoją naprzeciw siebie w jednym budynku."
 PL2027_SE_przycisk_cpz_trybunal:0 "Co teraz zrobi rząd?"
 PL2027_SE_naglowek_cpz_pierwsze_panstwo:0 "RZECZPOSPOLITA POLSKA  ·  PIERWSZA SECESJA"
 PL2027_SE_tytul_cpz_pierwsze_panstwo:0 "PIERWSZE NOWE PAŃSTWO"
 PL2027_SE_opis_cpz_pierwsze_panstwo:0 "Na maszcie urzędu wojewódzkiego zawisła nowa flaga. Jeszcze rok temu nikt nie traktował poważnie haseł o niepodległości regionów – dziś pierwsze państwo regionalne ogłasza, że Warszawa nie ma tu już nic do powiedzenia. Nikt nie wierzy, że będzie ostatnie."
 PL2027_SE_przycisk_cpz_pierwsze_panstwo:0 "To dopiero początek."
 PL2027_SE_naglowek_cpz_wojna:0 "RZECZPOSPOLITA POLSKA  ·  DWA OŚRODKI WŁADZY"
 PL2027_SE_tytul_cpz_wojna:0 "POLACY PRZECIW POLAKOM"
 PL2027_SE_opis_cpz_wojna:0 "Rząd w Alejach Ujazdowskich i obóz prezydencki w Belwederze wydają sprzeczne rozkazy. Część jednostek słucha jednych, część drugich, część nikogo. Na drogach wyjazdowych z Warszawy stają pierwsze posterunki. Po raz pierwszy od 1945 roku w Polsce zaczyna się wojna domowa."
 PL2027_SE_przycisk_cpz_wojna:0 "Niech Bóg ma Polskę w opiece."
 PL2027_SE_naglowek_cpz_warszawa:0 "WARSZAWA  ·  STOLICA BEZ WŁADZY"
 PL2027_SE_tytul_cpz_warszawa:0 "STOLICA SIĘ ROZPADA"
 PL2027_SE_opis_cpz_warszawa:0 "Policja pilnuje tylko swoich komend, Sejm zamyka się za barierkami Straży Marszałkowskiej, a na Pradze i w Ursusie porządku pilnują ludzie, których nikt nie wybierał. Warszawa przestaje być stolicą jednego państwa – staje się mapą dzielnic."
 PL2027_SE_przycisk_cpz_warszawa:0 "Każdy broni swojej dzielnicy."
 PL2027_SE_naglowek_cpz_rzad_wygrywa:0 "WARSZAWA  ·  KONIEC WOJNY DOMOWEJ"
 PL2027_SE_tytul_cpz_rzad_wygrywa:0 "RZĄD UTRZYMUJE WŁADZĘ"
 PL2027_SE_opis_cpz_rzad_wygrywa:0 "Ostatnie oddziały obozu prezydenckiego składają broń. Rząd kontroluje stolicę, ale państwo, które obronił, jest wyczerpane, zadłużone i podzielone bardziej niż kiedykolwiek. Regiony patrzą na Warszawę z nieufnością."
 PL2027_SE_przycisk_cpz_rzad_wygrywa:0 "Rzeczpospolita przetrwała – na razie."
 PL2027_SE_naglowek_cpz_belweder:0 "WARSZAWA  ·  KONIEC WOJNY DOMOWEJ"
 PL2027_SE_tytul_cpz_belweder:0 "BELWEDER ZWYCIĘŻA"
 PL2027_SE_opis_cpz_belweder:0 "Rząd skapitulował. Nad Belwederem i Pałacem Prezydenckim powiewają flagi, a obóz prezydencki ogłasza przejęcie władzy w imię konstytucji. Część regionów nie uznaje nowego ośrodka – i właśnie zaczyna liczyć własne siły."
 PL2027_SE_przycisk_cpz_belweder:0 "Nowa władza, stare podziały."
 PL2027_SE_naglowek_cpz_ocalona:0 "RZECZPOSPOLITA POLSKA"
 PL2027_SE_tytul_cpz_ocalona:0 "RZECZPOSPOLITA PRZETRWAŁA"
 PL2027_SE_opis_cpz_ocalona:0 "Rząd, prezydent, kluby i sędziowie podpisali porozumienie. Regiony wróciły pod jedną administrację, a wojsko do koszar. Polska przeszła przez najgłębszy kryzys od 1989 roku – ale nikt nie wie, ile wytrzyma to kruche porozumienie."
 PL2027_SE_przycisk_cpz_ocalona:0 "Jeszcze Polska nie zginęła."
 PL2027_SE_naglowek_cpz_koniec:0 "RZECZPOSPOLITA POLSKA  ·  GODZINA ZERO"
 PL2027_SE_tytul_cpz_koniec:0 "KONIEC RZECZYPOSPOLITEJ"
 PL2027_SE_opis_cpz_koniec:0 "Ostatnie województwa ogłaszają niepodległość. W Warszawie władzę dzielą Sejm, Pałac i dzielnice, a na mapie zamiast jednego państwa są dziesiątki flag. Rzeczpospolita Polska przestała istnieć. Zaczyna się świat 11 listopada 2027 roku."
 PL2027_SE_przycisk_cpz_koniec:0 "Orzeł spadł."
 PL2027_BOOKMARK_CPZ_NAME:0 "Czarny Październik – 1 października 2026"
 PL2027_BOOKMARK_CPZ_DESC:0 "Polska jest jeszcze jednym państwem. Rząd Donalda Tuska i prezydent Karol Nawrocki spierają się o Trybunał Konstytucyjny. 30 października spór wychodzi na ulicę. Od twoich decyzji zależy, czy Rzeczpospolita przetrwa, czy rozpadnie się na państwa znane z 11 listopada 2027."
 PL2027_BM_CPZ_POL:0 "§WRzeczpospolita Polska (1.10.2026)§!\nStolica: §WWarszawa§! · rządzi: §WKoalicja 15 Października§!\n\nKryzys konstytucyjny wokół Trybunału, wydarzenia 30–31 października godzina po godzinie, a potem historia alternatywna: porozumienie, rozpad albo wojna domowa.\n\nTrudność: trudna"
 PL2027_BM_CPZ_GER:0 "§WNiemcy (1.10.2026)§!\nRepublika Federalna obserwuje kryzys u wschodniego sąsiada. Na starcie bez polskich podwładnych – Eurokomisariaty mogą powstać dopiero, gdy Polska zacznie się rozpadać."
 PL2027_BM_CPZ_ROS:0 "§WFederacja Rosyjska (1.10.2026)§!\nRosja i Białoruś w jednym sojuszu. Moskwa czeka, aż kryzys w Warszawie otworzy nowe możliwości."
 PL2027_BM_CPZ_KPR:0 "§WKancelaria Prezydenta i SOP (1.10.2026)§!\nNa starcie część Rzeczypospolitej. Jeśli kryzys przejdzie w wojnę domową, Pałac staje na czele obozu prezydencko-opozycyjnego."
