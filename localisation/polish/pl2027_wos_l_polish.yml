 CPZ_tt_ef178ebc:0 "Odblokowuje gałąź „Odbudowa zjednoczonej Polski”."
 CPZ_S10:0 "Rzeczpospolita przetrwała"
 CPZ_S10_desc:0 "Polska przeszła przez najgłębszy kryzys od 1989 roku i pozostała jednym państwem. (Historia alternatywna moda.)"
 CPZ_tt_b171ea18:0 "Podział dowodzenia zależy od lojalności wojska: przy wysokiej lojalności zyskuje rząd, przy niskiej – obóz prezydencki."
 CPZ_W01:0 "Dwa rozkazy"
 CPZ_W01_desc:0 "Do jednostek przychodzą sprzeczne rozkazy z Warszawy i z Belwederu. Każdy dowódca musi wybrać. (Historia alternatywna moda.)"
