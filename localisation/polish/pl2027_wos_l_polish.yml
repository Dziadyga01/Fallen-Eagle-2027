 ROS_p_szl_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_naw_ak2_majatki:0 "Majątki urzędników jawne"
 ROS_p_naw_ak2_majatki_desc:0 "Każdy urzędnik musi pokazać, co ma – i skąd to ma."
 ROS_p_naw_ak2_sledztwa:0 "Śledztwa w sprawie pałaców"
 ROS_p_naw_ak2_sledztwa_desc:0 "Śledczy wchodzą do pałaców, jachtów i winnic byłych dygnitarzy."
 ROS_p_naw_ak2_zwrot:0 "Zwrot ukradzionych miliardów"
 ROS_p_naw_ak2_zwrot_desc:0 "Pieniądze z zagranicznych kont wracają do budżetu."
 ROS_p_naw_ak2_policja:0 "Nowa policja"
 ROS_p_naw_ak2_policja_desc:0 "Policja zaczyna od zera – z nowym naborem i nowymi zasadami."
 ROS_p_naw_ak2_final:0 "Państwo bez łapówek"
 ROS_p_naw_ak2_final_desc:0 "W urzędzie można załatwić sprawę bez koperty. Dla wielu to rewolucja."
 ROS_p_naw_rd_partie:0 "Rejestracja partii"
 ROS_p_naw_rd_partie_desc:0 "Każda partia może startować w wyborach. Na kartach jest kilkanaście nazw."
 ROS_p_naw_rd_samorzady:0 "Silne samorządy"
 ROS_p_naw_rd_samorzady_desc:0 "Miasta same decydują o swoich budżetach i inwestycjach."
 ROS_p_naw_rd_media:0 "Media publiczne bez propagandy"
 ROS_p_naw_rd_media_desc:0 "Telewizja publiczna dostaje niezależną radę."
 ROS_p_naw_rd_konstytucja:0 "Konstytucja z kadencjami"
 ROS_p_naw_rd_konstytucja_desc:0 "Prezydent może rządzić tylko dwie kadencje – i nie da się tego zmienić."
 ROS_p_naw_rd_final:0 "Demokracja w budowie"
 ROS_p_naw_rd_final_desc:0 "Rosja uczy się demokracji – z błędami, ale bez strachu."
 ROS_p_naw_ao_reforma:0 "Reforma armii"
 ROS_p_naw_ao_reforma_desc:0 "Mniejsza, ale lepiej wyszkolona armia, która podlega cywilnemu ministrowi."
 ROS_p_naw_ao_zawodowcy:0 "Koniec poboru przymusowego"
 ROS_p_naw_ao_zawodowcy_desc:0 "Armia zawodowa zastępuje pobór. Rodziny poborowych oddychają z ulgą."
 ROS_p_naw_ao_sprzet:0 "Nowoczesny sprzęt"
 ROS_p_naw_ao_sprzet_desc:0 "Pieniądze z walki z korupcją idą na sprzęt dla żołnierzy, nie na pałace generałów."
 ROS_p_naw_ao_obrona:0 "Doktryna obronna"
 ROS_p_naw_ao_obrona_desc:0 "Armia ma bronić Rosji, a nie zdobywać sąsiadów."
 ROS_p_naw_ao_final:0 "Armia demokratycznej Rosji"
 ROS_p_naw_ao_final_desc:0 "Wojsko jest silne, ale podlega prawu i parlamentowi."
 ROS_p_naw_marionetka:0 "Protektoraty na zdobytych ziemiach"
 ROS_p_naw_marionetka_desc:0 "Moskwa nie musi rządzić każdym miastem sama. Lokalne władze pod rosyjską opieką utrzymają porządek – i wezmą na siebie gniew mieszkańców."
 ROS_p_naw_aneksja:0 "Zdobycze zostają przy Rosji"
 ROS_p_naw_aneksja_desc:0 "Ziemie zdobyte krwią zostają rosyjskie. Gubernatorzy, rubel i rosyjskie paszporty – a na ulicach patrole, bo nie wszyscy się z tym pogodzą."
 ROS_p_putin_future_rt_mury:0 "Linie obrony na granicach"
 ROS_p_putin_future_rt_mury_desc:0 "Bunkry i pola minowe wzdłuż zachodniej granicy."
 ROS_p_putin_future_rt_rakiety:0 "Tarcza rakietowa"
 ROS_p_putin_future_rt_rakiety_desc:0 "Systemy obrony powietrznej osłaniają każde większe miasto."
 ROS_p_putin_future_rt_rezerwy:0 "Rezerwy na lata wojny"
 ROS_p_putin_future_rt_rezerwy_desc:0 "Magazyny pełne amunicji, paliwa i żywności."
 ROS_p_putin_future_rt_zaklady:0 "Fabryki pod ziemią"
 ROS_p_putin_future_rt_zaklady_desc:0 "Najważniejsze zakłady pracują w schronach wykutych w Uralu."
 ROS_p_putin_future_rt_final:0 "Twierdza nie do zdobycia"
 ROS_p_putin_future_rt_final_desc:0 "Rosja jest gotowa na każdą wojnę – i na żadną nie chce iść."
 ROS_p_putin_future_tw_partia:0 "Partia władzy"
 ROS_p_putin_future_tw_partia_desc:0 "Jedna partia ma przetrwać swojego założyciela."
 ROS_p_putin_future_tw_media:0 "Pamięć w telewizji"
 ROS_p_putin_future_tw_media_desc:0 "Filmy, seriale i podręczniki opowiadają jedną wersję historii."
 ROS_p_putin_future_tw_mlodzi:0 "Ruch młodzieżowy"
 ROS_p_putin_future_tw_mlodzi_desc:0 "Młodzi aktywiści przygotowują się do przejęcia władzy po starszych."
 ROS_p_putin_future_tw_sluzby:0 "Służby strażnikami ciągłości"
 ROS_p_putin_future_tw_sluzby_desc:0 "Służby specjalne mają pilnować, żeby nic się nie zmieniło."
 ROS_p_putin_future_tw_final:0 "Ciągłość władzy"
 ROS_p_putin_future_tw_final_desc:0 "System ma przetrwać człowieka, który go zbudował."
 ROS_p_putin_future_bk2_flota:0 "Odbudowa Floty Bałtyckiej"
 ROS_p_putin_future_bk2_flota_desc:0 "Nowe okręty i okręty podwodne w Bałtyjsku."
 ROS_p_putin_future_bk2_porty:0 "Porty w Piławie i Królewcu"
 ROS_p_putin_future_bk2_porty_desc:0 "Rozbudowa portów dla statków handlowych i wojennych."
 ROS_p_putin_future_bk2_lotnictwo:0 "Lotnictwo nad Bałtykiem"
 ROS_p_putin_future_bk2_lotnictwo_desc:0 "Myśliwce w Czkałowsku patrolują niebo nad całym morzem."
