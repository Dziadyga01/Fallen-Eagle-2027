 ROS_p_cho_future_ks_turystyka_desc:0 "Rosjanie podróżują, a turyści przyjeżdżają do Rosji."
 ROS_p_cho_future_ks_final:0 "Kraj klasy średniej"
 ROS_p_cho_future_ks_final_desc:0 "Po raz pierwszy większość Rosjan ma coś do stracenia."
 ROS_p_cho_future_bk3_firmy:0 "Konsorcjum obronne"
 ROS_p_cho_future_bk3_firmy_desc:0 "Firmy zbrojeniowe łączą się w jedno konsorcjum z zagranicznym kapitałem."
 ROS_p_cho_future_bk3_eksport:0 "Eksport broni"
 ROS_p_cho_future_bk3_eksport_desc:0 "Rosyjska broń sprzedawana jest na całym świecie – z zyskiem dla akcjonariuszy."
 ROS_p_cho_future_bk3_ochrona:0 "Ochrona korporacyjna"
 ROS_p_cho_future_bk3_ochrona_desc:0 "Prywatne armie chronią inwestycje w regionach."
 ROS_p_cho_future_bk3_technologie:0 "Technologie z rynku"
 ROS_p_cho_future_bk3_technologie_desc:0 "Konsorcjum kupuje licencje i technologie za granicą."
 ROS_p_cho_future_bk3_final:0 "Bezpieczeństwo na zlecenie"
 ROS_p_cho_future_bk3_final_desc:0 "Bezpieczeństwo kosztuje, ale jest skuteczne."
