 tza.50.t:0 "Odmowa"
 tza.50.d:0 "Sąsiedzi odrzucili naszą propozycję. Ta ścieżka przewiduje nacisk – mamy cel wojenny, ale tylko wobec tego jednego sąsiada."
 tza.50.a:0 "Skoro nie chcą rozmawiać..."
 tza.51.t:0 "Odmowa bez wojny"
 tza.51.d:0 "Sąsiedzi odrzucili naszą propozycję. Nasza droga nie przewiduje przemocy – za 120 dni możemy wrócić do rozmów (panel „Ziemia Toruńska”)."
 tza.51.a:0 "Poczekamy i spróbujemy jeszcze raz."
 TRZ_panel:0 "Ziemia Toruńska"
 TRZ_panel_desc:0 "Warunki współpracy zależą od przywódcy Torunia: §YGulewski§! – zgoda zależy od ustroju sąsiada (demokracje chętniej) i od jego opinii o Toruniu; §YRomanowski§! – zgoda zależy od kryzysu u sąsiada (niska stabilność, mało ziem); usługi kosztują Toruń 35 władzy politycznej; §YKowalczyk§! – zgoda zależy od liberalnego albo socjaldemokratycznego ustroju sąsiada i jego opinii o Toruniu; §YKrevienko§! – zgoda zależy od lewicowego ustroju sąsiada; każde przyłączenie lekko obniża stabilność (więcej zgromadzeń, mniej decyzji); §YZaleski§! – zgoda zależy od wielkości sąsiada i przewagi Torunia; odmowa daje cel wojenny wobec tego jednego sąsiada; §YElana§! – zgoda zależy wyłącznie od przewagi militarnej Torunia; odmowa daje cel wojenny wobec tego jednego sąsiada.\nPrzywódcy, którzy nie stosują przemocy, mogą ponowić rozmowy 120 dni po odmowie."
 TRZ_ponow_podgorz:0 "Ponowić rozmowy: Podgórz wraca do miasta"
 TRZ_ponow_podgorz_desc:0 "Minęło 120 dni od odmowy. Nowa delegacja, nowe argumenty – i ta sama propozycja."
