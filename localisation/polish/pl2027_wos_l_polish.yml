 CPZ_tt_81504c82:0 "Poparcie dla rządu: §G+5§!; Kryzys konstytucyjny: §G-5§!"
 CPZ_P04:0 "Opinia Komisji Weneckiej"
 CPZ_P04_desc:0 "13 października Komisja Wenecka publikuje opinię o roli prezydenta przy ślubowaniu sędziów Trybunału. Rząd może oprzeć na niej swoją linię: sędziów wybiera Sejm, prezydent nie ma weta. (Historia alternatywna moda.)"
 CPZ_tt_3dd68496:0 "Lojalność regionów: §G+6§!"
 CPZ_P05:0 "Narada z wojewodami"
 CPZ_P05_desc:0 "Szesnastu wojewodów w Warszawie. Każdy dostaje instrukcje i numer do sztabu kryzysowego. (Historia alternatywna moda.)"
