 ROS_p_mie_future_gi_mapa_desc:0 "Rosja zostaje podzielona na gubernie z namiestnikami."
 ROS_p_mie_future_gi_namiestnicy:0 "Namiestnicy z Moskwy"
 ROS_p_mie_future_gi_namiestnicy_desc:0 "Namiestnicy mają pełnię władzy w swoich guberniach."
