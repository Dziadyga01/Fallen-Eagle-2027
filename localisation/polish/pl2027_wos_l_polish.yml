 CPZ_tt_3845753d:0 "Lojalność regionów: §G+5§!"
 cpz.123.t:0 "PREZYDENT POD TRYBUNAŁEM!"
 cpz.123.d:0 "Noc z 30 na 31 października. Prezydent i jego współpracownicy są w budynku Trybunału, przed bramą stoi tłum, a policja czeka na decyzję rządu.\n\n§RDecyzje C i D należą do historii alternatywnej moda – nie opisują rzeczywiście wydanych rozkazów.§!"
 cpz.123.a:0 "A. Rozpocząć negocjacje."
 cpz.123.b:0 "B. Utrzymać zabezpieczenia."
 cpz.123.c:0 "C. Nakazać użycie siły."
 cpz.123.e:0 "D. Wycofać część zabezpieczeń."
 cpz.123.f:0 "E. Położyć na stole przygotowany kompromis."
 cpz.125.t:0 "tuż przed 5:00 · Nocne oświadczenie prezydenta"
 cpz.125.d:0 "£CPZ_p_nawrocki §WKarol Nawrocki§! – prezydent RP\n§W31 października 2026, tuż przed 5:00§!\n\n§WKontekst:§! Prezydent opuszcza budynek Trybunału. Przed bramą wciąż trwa nocna demonstracja.\n\n§WStreszczenie wystąpienia:§! Szef gabinetu prezydenta Paweł Szefernaker odczytuje oświadczenie: prezydent mówi o siłowym przejęciu organu konstytucyjnego, wzywa do przywrócenia porządku prawnego i do opuszczenia terenu Trybunału przez siły przymusu. Zapowiada na sobotę pilne konsultacje z siłami parlamentarnymi.\n\n§WReakcje:§! Minister sprawiedliwości i sędziowie wybrani przez Sejm odrzucają zarzuty. Szef MSZ zapowiada, że rząd będzie stał na straży konstytucji."
 cpz.125.a:0 "Odpowiedź rządu: stanowczo bronić swojego stanowiska."
 cpz.125.b:0 "Odpowiedź rządu: wezwać do spokoju i rozmowy."
 cpz.125.c:0 "Bez komentarza."
 CPZ_tt_08c10d58:0 "Kryzys konstytucyjny: §R+1§!; Napięcie społeczne: §R+1§!"
 cpz.126.t:0 "rano · Prezes znów pod bramą"
 cpz.126.d:0 "§W31 października 2026, rano§!\n\nBogdan Święczkowski po raz kolejny próbuje wejść do siedziby Trybunału. Nowi sędziowie zapowiadają, że zostają w budynku i będą dalej podejmować decyzje. Sędzia Korwin-Piotrowska zwołała na 3 listopada Zgromadzenie Ogólne sędziów Trybunału."
 cpz.126.a:0 "Trybunał ma dwóch prezesów."
 CPZ_tt_268e5bfd:0 "Kryzys konstytucyjny: §R+1§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!"
 cpz.130.t:0 "rano · Naruszenie porządku konstytucyjnego"
 cpz.130.d:0 "§W31 października 2026, rano§!\n\nW oświadczeniu prezydent mówi o naruszeniu porządku konstytucyjnego i zagrożeniu bezpieczeństwa wewnętrznego. Przypomina, że konsultował się z pierwszym prezesem Sądu Najwyższego, i zwołuje na ten dzień pilne konsultacje.\n\n§WStanowiska stron:§! Prezydent: siłowe przejęcie organu. Rząd: przywracanie konstytucyjnego składu Trybunału."
 cpz.130.a:0 "Przygotować stanowisko rządu."
 CPZ_tt_5c21c5de:0 "Poparcie dla rządu: §G+2§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!; Kryzys konstytucyjny: §R+2§!"
 cpz.131.t:0 "ok. 7:09 · Prokuratura zabiera głos"
 cpz.131.d:0 "§WWaldemar Żurek§! – minister sprawiedliwości, prokurator generalny\n§W31 października 2026, ok. 7:09§!\n\n§WKontekst:§! Rano w TVN24 minister sprawiedliwości odnosi się do nocnych wydarzeń.\n\n§WStreszczenie wystąpienia:§! Waldemar Żurek mówi, że zachowanie prezydenta bardzo go zaniepokoiło, a nagranie pokazuje, jak prezydent wdziera się do budynku i atakuje sędziów. Rozmowy, m.in. z wiceprezesem Sochańskim, nie doprowadziły do kompromisu. Liczy na działania prokuratury.\n\n§WReakcje:§! Kancelaria Prezydenta mówi o zastraszaniu głowy państwa."
 cpz.131.a:0 "Odpowiedź rządu: stanowczo bronić swojego stanowiska."
 cpz.131.b:0 "Odpowiedź rządu: wezwać do spokoju i rozmowy."
 cpz.131.c:0 "Bez komentarza."
 cpz.132.t:0 "przed południem · Trybunał zmienia organizację pracy"
 cpz.132.d:0 "§W31 października 2026, przed południem§!\n\nNa stronie Trybunału ukazuje się zarządzenie sędzi Korwin-Piotrowskiej: praca tylko na bezpośrednie polecenie, większość pracowników zwolniona z obecności z zachowaniem wynagrodzenia, sędziowie mają pracować poza siedzibą, wejście tylko wyznaczonymi drzwiami, biuro podawcze zawieszone. Bogdan Święczkowski wydaje własne zarządzenie i neguje jej działania."
 cpz.132.a:0 "Dwa kierownictwa jednego Trybunału."
 CPZ_tt_fdfcddab:0 "Kryzys konstytucyjny: §G-1§!; Poparcie dla rządu: §R-1§!; Spójność koalicji: §G+1§!"
 CPZ_tt_b4887afc:0 "Kryzys konstytucyjny: §R+1§!; Poparcie dla rządu: §G+1§!"
 cpz.133.t:0 "13:00 · Prezydent wzywa liderów"
 cpz.133.d:0 "§W31 października 2026, 13:00§!\n\nW Pałacu Prezydenckim zaczynają się konsultacje z liderami środowisk parlamentarnych. Lewica nie dostała zaproszenia i zapowiada, że i tak by nie przyszła."
 cpz.133.a:0 "Wysłać do Pałacu przedstawiciela rządu jako obserwatora."
 cpz.133.b:0 "Rząd nie uczestniczy w konsultacjach."
 CPZ_tt_90aa4029:0 "Spójność koalicji: §R-2§!; Kryzys konstytucyjny: §G-1§!"
 CPZ_tt_874696fc:0 "Spójność koalicji: §R-4§!; Poparcie dla rządu: §G+1§!"
 cpz.134.t:0 "po południu · Rozmowy z koalicjantami"
 cpz.134.d:0 "§W31 października 2026, po południu§!\n\nDo prezydenta idą przedstawiciele PSL i Polski 2050. Władysław Kosiniak-Kamysz zapowiada rozmowę o bezpieczeństwie państwa, poszanowaniu demokracji i spokoju społecznym. Szymon Hołownia mówi o scenariuszach deeskalacji, wzywa premiera i prezydenta do pilnej rozmowy i opowiada się za konstytucyjnym resetem Trybunału."
 cpz.134.a:0 "Koalicjanci mają prawo do własnych rozmów."
 cpz.134.b:0 "Przypomnieć koalicjantom o jedności rządu."
 CPZ_tt_3236e35b:0 "Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!"
 cpz.135.t:0 "po południu · Opozycja przy jednym stole"
 cpz.135.d:0 "§W31 października 2026, po południu§!\n\nNa konsultacje zapowiedziani są przedstawiciele PiS: Jarosław Kaczyński i Mariusz Błaszczak. Przebieg rozmowy nie jest znany."
 cpz.135.a:0 "Czekamy na komunikat."
 CPZ_tt_2cf62bf7:0 "Kryzys konstytucyjny: §G-1§!; Napięcie społeczne: §G-1§!"
 cpz.137.t:0 "po 15:00 · Reset Trybunału"
 cpz.137.d:0 "§WAdrian Zandberg§! – Razem\n§W31 października 2026, po 15:00§!\n\n§WKontekst:§! Razem przychodzi do Pałacu z własną propozycją.\n\n§WStreszczenie wystąpienia:§! Adrian Zandberg proponuje reset Trybunału: odejście obecnych sędziów i wybór nowego składu większością kwalifikowaną, tak by żadna partia nie obsadziła go sama. Jako alternatywę wskazuje rozproszoną kontrolę konstytucyjności. Krytykuje eskalację i ocenia, że prezydent stał się stroną sporu.\n\n§WReakcje:§! Polska 2050 także mówi o resecie. PiS i Konfederacja chcą resetu na własnych warunkach."
 cpz.137.a:0 "Odpowiedź rządu: stanowczo bronić swojego stanowiska."
 cpz.137.b:0 "Odpowiedź rządu: wezwać do spokoju i rozmowy."
 cpz.137.c:0 "Bez komentarza."
 CPZ_tt_c6b29622:0 "Poparcie dla obozu prezydencko-opozycyjnego: §R+2§!; Spójność koalicji: §R-2§!; Kryzys konstytucyjny: §R+1§!"
 cpz.136.t:0 "ok. 16:00 · Rząd techniczny Marka Jurka?"
 cpz.136.d:0 "£CPZ_p_morawiecki §WMateusz Morawiecki§! – lider Rozwoju Plus\n§W31 października 2026, ok. 16:00§!\n\n§WKontekst:§! Rozwój Plus ma spotkanie w Pałacu. Wcześniej Morawiecki występuje przed Trybunałem.\n\n§WStreszczenie wystąpienia:§! Mateusz Morawiecki zapowiada konstruktywne wotum nieufności wobec rządu i wskazuje Marka Jurka jako kandydata na premiera rządu przejściowego, który miałby uspokoić sytuację i doprowadzić do wyborów w 2027 r. Środowisko zastrzega, że rozmawia też o innych kandydaturach.\n\n§WReakcje:§! Do konstruktywnego wotum potrzeba 231 głosów – zmiany układu sił w Sejmie."
 cpz.136.a:0 "Odpowiedź rządu: stanowczo bronić swojego stanowiska."
 cpz.136.b:0 "Odpowiedź rządu: wezwać do spokoju i rozmowy."
 cpz.136.c:0 "Bez komentarza."
 CPZ_tt_7f8e2c01:0 "Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!; Kryzys konstytucyjny: §R+1§!; Spójność koalicji: §R-1§!"
 cpz.138.t:0 "16:45 · Konfederacja u prezydenta"
 cpz.138.d:0 "£CPZ_p_mentzen §WSławomir Mentzen§! – Nowa Nadzieja\n§W31 października 2026, 16:45§!\n\n§WKontekst:§! Sławomir Mentzen i Krzysztof Bosak przychodzą do Pałacu Prezydenckiego.\n\n§WStreszczenie wystąpienia:§! Mentzen zapowiadał, że chce rozmawiać o przywróceniu porządku konstytucyjnego i od lat mówi o resecie Trybunału. Bosak zapowiada uchwałę o skróceniu kadencji Sejmu i przedterminowe wybory.\n\n§WReakcje:§! Koalicja nie ma większości dla skrócenia kadencji. Opozycja liczy na rozłam w klubach rządowych."
 cpz.138.a:0 "Odpowiedź rządu: stanowczo bronić swojego stanowiska."
 cpz.138.b:0 "Odpowiedź rządu: wezwać do spokoju i rozmowy."
 cpz.138.c:0 "Bez komentarza."
 CPZ_tt_2e460639:0 "Poparcie dla rządu: §G+2§!; Kryzys konstytucyjny: §R+2§!; Napięcie społeczne: §R+2§!; Poparcie dla obozu prezydencko-opozycyjnego: §R+1§!"
 cpz.139.t:0 "20:00 · Orędzie premiera"
 cpz.139.d:0 "£CPZ_p_tusk §WDonald Tusk§! – premier\n§W31 października 2026, 20:00§!\n\n§WKontekst:§! Po nocy w Trybunale i dniu konsultacji w Pałacu Prezydenckim premier występuje z orędziem.\n\n§WStreszczenie wystąpienia:§! Donald Tusk mówi o gorszących scenach pod Trybunałem i o tym, że nie chce ich więcej oglądać w Polsce. Zastrzega jednak, że spokoju nie da się kupić ustępowaniem przed bezprawiem i przemocą: demokratyczne państwo musi być silne i zdolne do egzekwowania prawa. Pyta, do czego dążą przepychający się politycy i aktywiści PiS i Konfederacji – od Brauna po Bąkiewicza. Mówi, że legalnie wybrani sędziowie Trybunału zostali zaatakowani, a policja ich ochroniła. Odrzuca kompromis z drugą stroną w sprawie Trybunału i krytykuje „symetrystów”, którzy proponują podział po równo. Kończy deklaracją, że krzyk, kłamstwo i bijatyka nie będą w Polsce źródłem prawa.\n\n§WReakcje:§! Orędzie nie zawiera nowych propozycji ustawowych. Reakcje opozycji – w kolejnych dniach."
 cpz.139.a:0 "Rozumiem."
 cpz.150.t:0 "Korwin-Mikke o roli wojska"
 cpz.150.d:0 "§RZdarzenie wyłączone – brak zweryfikowanego źródła (docs/TK_2026_LIVELOG.md).§!"
 cpz.150.a:0 "OK"
 PL2027_CZARNY_PAZDZIERNIK:0 "Czarny Październik (scenariusz 1.10.2026)"
 PL2027_CZARNY_PAZDZIERNIK_PELNY:0 "Pełny – zdarzenia godzina po godzinie"
 PL2027_CZARNY_PAZDZIERNIK_PELNY_DESC:0 "Wszystkie zdarzenia 30–31 października 2026 w kolejności i o swoich godzinach."
 PL2027_CZARNY_PAZDZIERNIK_SKROCONY:0 "Skrócony – tylko decyzje"
 PL2027_CZARNY_PAZDZIERNIK_SKROCONY_DESC:0 "Zdarzenia historyczne działają w tle (ich skutki są liczone), na ekranie tylko wstęp, kluczowa decyzja i podsumowanie."
