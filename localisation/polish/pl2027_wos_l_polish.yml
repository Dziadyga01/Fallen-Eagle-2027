 cpz.511.e:0 "Województwo: Warszawa"
 cpz.511.f:0 "Wróć"
 CPZ_tt_c1856193:0 "Przejmiesz [WMG.GetNameDef], gdy uzyska niepodległość (najpóźniej za 45 dni – województwo §Wpomorskie§! rozpadnie się jako pierwsze). Do tego czasu prowadzisz jego administrację tymczasową: gałąź G drzewka wzmacnia przyszłe państwo, a fokus „Nasza własna przyszłość” przejmuje je od razu."
