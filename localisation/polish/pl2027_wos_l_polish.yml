 zpp.198.t:0 "Odmowa"
 zpp.198.d:0 "Sąsiad odrzucił propozycję Lublina. Ta droga przewiduje nacisk – mamy cel wojenny, ale tylko wobec tego jednego państwa."
 zpp.198.a:0 "Skoro nie chcą rozmawiać..."
 zpp.199.t:0 "Odmowa bez wojny"
 zpp.199.d:0 "Sąsiad odrzucił propozycję Lublina. Nasz przywódca nie sięga po przemoc – za 120 dni możemy wrócić do rozmów (panel „Lublin i sąsiedzi”)."
 zpp.199.a:0 "Poczekamy."
 zpp.197.t:0 "Zjednoczona Polska od Bugu po Pilicę"
 zpp.197.d:0 "Lublin połączył Podlasie Nadbużańskie, Ziemię Radomską i Ziemię Piotrkowską. W rozbitej Polsce powstało państwo, które sięga od Bugu po Pilicę. (Fikcja moda.)"
 zpp.197.a:0 "Mapa znowu się zmienia."
