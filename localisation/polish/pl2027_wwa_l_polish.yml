l_polish:
 IVRP_republika_sejmowa:0 "Republika Sejmowa"
 IVRP_republika_sejmowa_desc:0 "IV Rzeczpospolita powstała w sali plenarnej: Sejm jest suwerenem, rząd jego komitetem, a każda ustawa wymaga trzech czytań – nawet w czasie wojny."
 IVRP_rzady_prezydenckie:0 "Rządy prezydenckie"
 IVRP_rzady_prezydenckie_desc:0 "Dekret ma moc ustawy, a Sejm zbiera się, gdy prezydent uzna to za stosowne. Armia salutuje Pałacowi, nie parlamentowi."
 IVRP_panstwo_mafijne:0 "Rzeczpospolita Rodzin"
 IVRP_panstwo_mafijne_desc:0 "Ministerstwa obsadzają „ludzie z Pruszkowa”, przetargi wygrywają zawsze te same firmy, a na ulicach jest spokój – bo wszyscy wiedzą, komu się płaci."
 IVRP_lider_sejm:0 "Donald Tusk"
 IVRP_partia_sejm:0 "Zgromadzenie Narodowe IV RP"
 IVRP_lider_prezydent:0 "Karol Nawrocki"
 IVRP_partia_prezydent:0 "Obóz Prezydencki"
 IVRP_lider_mafia:0 "„Słowik”"
 IVRP_partia_mafia:0 "Rodzina"
 WWA_tt_kontrola:0 "Wszystkie §Y22§! dzielnice Warszawy są kontrolowane przez nas albo nasze marionetki"
 WWA_tt_rywale:0 "Pozostałe bloki (Straż Marszałkowska, Kancelaria Prezydenta, Mafia Pruszkowska) przestały istnieć albo są naszymi marionetkami"
 WWA_tt_marionetka:0 "Nasza marionetka z bloku pozostaje lojalna albo została wcielona"
 WWA_tt_jedna:0 "Nikt jeszcze nie proklamował IV Rzeczypospolitej"
 IVRP_tt_sejm:0 "Proklamacja §YIV Rzeczypospolitej Polskiej§! w wersji: §YRepublika Sejmowa§!. Wszystkie marionetki w Warszawie zostają wcielone, zmienia się nazwa, flaga, przywódca (Donald Tusk) i ustrój."
 IVRP_tt_prezydent:0 "Proklamacja §YIV Rzeczypospolitej Polskiej§! w wersji: §YRepublika Prezydencka§!. Wszystkie marionetki w Warszawie zostają wcielone, zmienia się nazwa, flaga, przywódca (Karol Nawrocki) i ustrój."
 IVRP_tt_mafia:0 "Proklamacja §YIV Rzeczypospolitej Polskiej§! w wersji: §YRzeczpospolita Rodzin§!. Wszystkie marionetki w Warszawie zostają wcielone, zmienia się nazwa, flaga, przywódca („Słowik”) i ustrój."
 wwa.1.t:0 "Ultimatum z centrum"
 wwa.1.d:0 "Do naszego ratusza przyjechała delegacja z propozycją „współpracy”. W praktyce oznacza ona, że od dziś decyzje będą zapadać gdzie indziej. Odmowa – jak dodali – nie zostanie zapomniana."
 wwa.1.a:0 "Podporządkować się."
 wwa.1.b:0 "Nigdy. Dzielnica zostaje wolna."
 IVRP_opis_sejm:0 "W sali plenarnej przy Wiejskiej posłowie wszystkich klubów wstają z miejsc. Marszałek odczytuje akt proklamacji: Rzeczpospolita nie umarła – odradza się jako IV Rzeczpospolita Polska, republika sejmowa, w której władza należy do przedstawicieli Narodu. Policja pilnuje porządku na Placu Trzech Krzyży, a przed Sejmem tłum śpiewa hymn."
 IVRP_opis_prezydent:0 "Z balkonu Pałacu Prezydenckiego Karol Nawrocki ogłasza dekret nr 1: powstaje IV Rzeczpospolita Polska, a do czasu „przywrócenia normalności” władza należy do Prezydenta. Na Krakowskim Przedmieściu defilują kolumny Wojska, nad Wisłą przelatują śmigłowce. Parlament zbierze się później – jeśli w ogóle."
 IVRP_opis_mafia:0 "Nikt nie przemawia z balkonu. Akt proklamacji podpisano nocą w restauracji na Ursusie, w obecności „przyjaciół rodziny”. Rano Warszawa budzi się w IV Rzeczypospolitej Polskiej: Kibice pilnują urzędów, a przywódca Rodziny zapewnia, że „wszyscy dostaną swoją działkę”. Nikt nie pyta, czym jest ta działka."
 IVRP_SUPEREVENT_TYTUL:0 "NARODZINY IV RZECZYPOSPOLITEJ"
