 IVRP_lider_sejm_desc:0 "Donald Tusk pełni obowiązki tymczasowego przewodniczącego Rady Sejmowej w okresie kryzysu Rzeczypospolitej. Stanowisko i wydarzenia są fikcyjnym elementem alternatywnej historii The Fallen Eagle: 2027."
