l_polish:
 WWD_sejm_trwa:0 "Sejm trwa"
 WWD_sejm_trwa_desc:0 "Dopóki trwa posiedzenie, trwa Rzeczpospolita. Każda uchwała jest dowodem, że prawo nie umarło razem z państwem."
 WWD_dekrety:0 "Rządy dekretami"
 WWD_dekrety_desc:0 "Kancelaria nie czeka na kworum. Dekret podpisany rano obowiązuje w południe, a wieczorem jest już na każdym słupie ogłoszeniowym."
 WWD_rodzina:0 "Rodzina dba o swoich"
 WWD_rodzina_desc:0 "Kto płaci, ten śpi spokojnie. Kto nie płaci – też śpi, tylko gdzie indziej."
 WWD_koalicja:0 "Koalicja przeciw przestępczości"
 WWD_koalicja_desc:0 "Sejm i Kancelaria Prezydenta mają wspólny sztab, wspólne listy gończe i jeden cel: rozbić Pruszków, zanim Pruszków kupi resztę miasta."
 WWD_zamrozone:0 "Zamrożone majątki"
 WWD_zamrozone_desc:0 "Konta, nieruchomości i firmy-słupy zostały zablokowane. Rodzina płaci żołnierzom z zapasów – a zapasy topnieją."
 WWD_ofensywa:0 "Ofensywa w stolicy"
 WWD_ofensywa_desc:0 "Walki przenoszą się z ulicy na ulicę. Kto pierwszy zajmie skrzyżowania i mosty, ten wygra Warszawę."
 WWD_osmiornica:0 "Ośmiornica"
 WWD_osmiornica_desc:0 "Ludzie Rodziny są w urzędach, na komisariatach i w spółdzielniach. Nic w mieście nie dzieje się bez wiedzy Pruszkowa."
 WWD_obrona_pruszkowa:0 "Obrona Pruszkowa"
 WWD_obrona_pruszkowa_desc:0 "Magazyny, bunkry pod hurtowniami i ludzie, którzy nie mają dokąd uciec. Rodzina będzie się bronić do końca."
 WWD_sojusznik:0 "Lojalny sojusznik bloku"
 WWD_sojusznik_desc:0 "Formalnie osobna organizacja, w praktyce najważniejsze ramię bloku. Dostaje sprzęt, pieniądze i autonomię dowodzenia."
 WWD_dzielnica_twierdza:0 "Dzielnica-twierdza"
 WWD_dzielnica_twierdza_desc:0 "Barykady na skrzyżowaniach, punkty obserwacyjne na dachach i ochotnicy, którzy znają każde podwórko."
 WWD_region_stoleczny:0 "Region stołeczny"
 WWD_region_stoleczny_desc:0 "Stolica ma znów zaplecze: przedmieścia, drogi dojazdowe, magazyny i ludzi gotowych do służby."
 WWD_wolna_dzielnica:0 "Wolna dzielnica"
 WWD_wolna_dzielnica_desc:0 "Dzielnica przetrwała rozpad państwa i walkę bloków. Ma własną straż, własną radę i własne zdanie."
 WWD_bojowki:0 "Bojówki zamiast wojska"
 WWD_bojowki_desc:0 "Rodzina ma ludzi i pieniądze, ale nie ma oficerów, łączności ani dyscypliny. Na razie to bojówki, które dobrze straszą – gorzej walczą."
 WWD_kibole:0 "Chuligańska dyscyplina"
 WWD_kibole_desc:0 "Na trybunie wszyscy śpiewają razem. Na ulicy każda grupa ma własnego „szefa” i własny pomysł na walkę."
 WWD_gmachy:0 "Gmachy państwowe"
 WWD_gmachy_desc:0 "Grube mury, schrony z czasów zimnej wojny, własne agregaty i ludzie, którzy znają każdy korytarz. Szturm na urząd państwowy kosztuje drogo."
 WWD_req_koalicja:0 "Koalicja Sejmu i Kancelarii Prezydenta została zawarta"
 WWD_req_bez_koalicji:0 "Nie zawarto koalicji z drugim blokiem państwowym"
 WWD_req_mafia:0 "Mafia Pruszkowska przestała istnieć albo jest podporządkowana jednemu z członków koalicji"
 WWD_KOALICJA:0 "Koalicja przeciw Przestępczości"
 WWD_LIGA:0 "Liga Wolnych Dzielnic"
 WWD_SMR_tree:0 "Rzeczpospolita trwa na Wiejskiej"
 WWD_tt_koal_smr:0 "Jeśli nie ma jeszcze koalicji: tworzymy frakcję §YKoalicja przeciw Przestępczości§! i zapraszamy §YKancelaria Prezydenta§!. Jeśli koalicja już istnieje – dołączamy do wspólnego sztabu."
 WWD_tt_pruszkow:0 "Cel wojenny wobec §YMafii Pruszkowskiej§!. Członkowie koalicji walczą razem."
 WWD_tt_wspolna_smr:0 "§YKancelaria Prezydenta§! zdecyduje, czy uzna nasze przywództwo (staje się naszym państwem zależnym) – czy koalicja się rozpadnie."
 WWD_req_int_OZM:0 "Kontrolujemy stolicę państwa Ożarów Mazowiecki, ALBO to państwo nie istnieje lub jest nam podporządkowane"
 WWD_req_int_GRD:0 "Kontrolujemy stolicę państwa Grodzisk Mazowiecki, ALBO to państwo nie istnieje lub jest nam podporządkowane"
 WWD_req_int_PSC:0 "Kontrolujemy stolicę państwa Piaseczno, ALBO to państwo nie istnieje lub jest nam podporządkowane"
 WWD_KPR_tree:0 "Pałac nie kapituluje"
 WWD_tt_koal_kpr:0 "Jeśli nie ma jeszcze koalicji: tworzymy frakcję §YKoalicja przeciw Przestępczości§! i zapraszamy §YStraż Marszałkowska§!. Jeśli koalicja już istnieje – dołączamy do wspólnego sztabu."
 WWD_tt_wspolna_kpr:0 "§YStraż Marszałkowska§! zdecyduje, czy uzna nasze przywództwo (staje się naszym państwem zależnym) – czy koalicja się rozpadnie."
 WWD_req_int_OTW:0 "Kontrolujemy stolicę państwa Otwock, ALBO to państwo nie istnieje lub jest nam podporządkowane"
 WWD_req_int_WLM:0 "Kontrolujemy stolicę państwa Wołomin, ALBO to państwo nie istnieje lub jest nam podporządkowane"
 WWD_MPR_tree:0 "Ośmiornica nad Wisłą"
 WWD_tt_lapowki:0 "Sejm i Kancelaria tracą §Rstabilność§! i §Rsiłę polityczną§!. Jeśli istnieje koalicja – szansa na aferę łapówkową w jej szeregach."
 wwd.20.t:0 "Propozycja koalicji"
 wwd.20.d:0 "[From.GetName] proponuje zawieszenie sporów i wspólny front przeciw Mafii Pruszkowskiej: wspólny sztab, wspólne operacje i podział zadań w stolicy. Pytanie o to, kto ostatecznie poprowadzi państwo, zostaje odłożone – do czasu, aż Pruszków przestanie istnieć."
 wwd.20.a:0 "Wchodzimy do koalicji."
 wwd.20.b:0 "Nie będziemy dzielić władzy."
 wwd.21.t:0 "Koalicja zawarta"
 wwd.21.d:0 "[From.GetName] przyjmuje naszą propozycję. Od dziś Sejm i Kancelaria Prezydenta walczą ramię w ramię przeciw przestępczości."
 wwd.21.a:0 "Do roboty."
 wwd.22.t:0 "Koalicja odrzucona"
 wwd.22.d:0 "[From.GetName] odrzuca naszą propozycję. Każdy blok będzie walczył o Warszawę na własną rękę."
 wwd.22.a:0 "Poradzimy sobie sami."
 wwd.25.t:0 "Koalicja przeciw przestępczości"
 wwd.25.d:0 "Na wspólnej konferencji w Sejmie Marszałek i przedstawiciele Pałacu ogłaszają koalicję przeciw przestępczości. Pierwszy cel: Mafia Pruszkowska i jej bojówki stadionowe. W Pruszkowie nikt nie komentuje – ale w nocy z hurtowni wyjeżdżają ciężarówki z bronią."
 wwd.25.a:0 "Warszawa się zmienia."
 wwd.23.t:0 "Kto poprowadzi Rzeczpospolitą?"
 wwd.23.d:0 "Mafia jest rozbita. [From.GetName] proponuje, by to ona poprowadziła odrodzoną Rzeczpospolitą, a my zachowali autonomię jako jej część. Odmowa oznacza koniec koalicji – i najpewniej wojnę o to, kto będzie rządził stolicą."
 wwd.23.a:0 "Uznajemy przywództwo partnera."
 wwd.23.b:0 "Władza nam się należy."
 wwd.24.t:0 "Partner uznaje nasze przywództwo"
 wwd.24.d:0 "[From.GetName] uznaje nasze przywództwo. Droga do proklamacji IV Rzeczypospolitej stoi otworem."
 wwd.24.a:0 "Rzeczpospolita będzie jedna."
 wwd.26.t:0 "Koniec koalicji"
 wwd.26.d:0 "[From.GetName] odrzuca nasze przywództwo. Wspólny sztab się rozpada, a dawni sojusznicy znów stają po dwóch stronach barykady."
 wwd.26.a:0 "Skoro tak – rozstrzygniemy to siłą."
 wwd.40.t:0 "Afera łapówkowa w koalicji"
 wwd.40.d:0 "Dziennikarze ujawniają nagrania: kilku urzędników i oficerów koalicji brało pieniądze z Pruszkowa. Opozycja żąda dymisji, a partnerzy z koalicji – wyjaśnień."
 wwd.40.a:0 "Czystki i dymisje."
 wwd.40.b:0 "Zamieść pod dywan."
 WWD_plc_idea_szkolenie:0 "Program szkoleniowy"
 WWD_plc_idea_szkolenie_desc:0 "Codzienne ćwiczenia, kursy dowódców i strzelnica czynna od świtu do zmroku."
 WWD_plc_idea_doktryna:0 "Doktryna walki w mieście"
 WWD_plc_idea_doktryna_desc:0 "Walka o kamienice, piwnice i dachy wymaga innych zasad niż walka w polu. Dowódcy właśnie je spisali."
 WWD_plc_idea_elita:0 "Stołeczna Gwardia Porządku"
 WWD_plc_idea_elita_desc:0 "Z policji miejskiej powstała formacja zdolna prowadzić walkę o stolicę: wyszkolona, uzbrojona i lojalna."
 WWD_plc_gen:0 "Marek Zalewski"
 WWD_PLC_tree:0 "Komenda Stołeczna"
 WWD_tt_loj_plc:0 "Jeśli jesteśmy podporządkowani §YStraż Marszałkowska§!: patron dostaje §G400 broni strzeleckiej§!, §G3000 rekrutów§! i doświadczenie."
 WWD_woj_idea_szkolenie:0 "Program szkoleniowy"
 WWD_woj_idea_szkolenie_desc:0 "Codzienne ćwiczenia, kursy dowódców i strzelnica czynna od świtu do zmroku."
 WWD_woj_idea_doktryna:0 "Doktryna walki w mieście"
 WWD_woj_idea_doktryna_desc:0 "Walka o kamienice, piwnice i dachy wymaga innych zasad niż walka w polu. Dowódcy właśnie je spisali."
 WWD_woj_idea_elita:0 "Armia Prezydencka"
 WWD_woj_idea_elita_desc:0 "Wojsko jest znów armią: z dowództwem, logistyką i doktryną. Pałac ma za sobą siłę, z którą trzeba się liczyć."
 WWD_woj_gen:0 "Andrzej Sowa"
 WWD_WOJ_tree:0 "Garnizon Warszawa"
 WWD_tt_loj_woj:0 "Jeśli jesteśmy podporządkowani §YKancelaria Prezydenta§!: patron dostaje §G400 broni strzeleckiej§!, §G3000 rekrutów§! i doświadczenie."
 WWD_leg_idea_szkolenie:0 "Program szkoleniowy"
 WWD_leg_idea_szkolenie_desc:0 "Codzienne ćwiczenia, kursy dowódców i strzelnica czynna od świtu do zmroku."
 WWD_leg_idea_doktryna:0 "Doktryna walki w mieście"
 WWD_leg_idea_doktryna_desc:0 "Walka o kamienice, piwnice i dachy wymaga innych zasad niż walka w polu. Dowódcy właśnie je spisali."
 WWD_leg_idea_elita:0 "Legion Warszawski"
 WWD_leg_idea_elita_desc:0 "Z kibiców powstała armia z własnymi barwami, dowódcami i legendą. Kto ich lekceważy, przegrywa."
 WWD_leg_gen:0 "„Rudy”"
 WWD_LEG_tree:0 "Żyleta w ofensywie"
 WWD_tt_loj_leg:0 "Jeśli jesteśmy podporządkowani §YMafia Pruszkowska§!: patron dostaje §G400 broni strzeleckiej§!, §G3000 rekrutów§! i doświadczenie."
 WWD_PRG_tree:0 "Prawy brzeg nie klęka"
 WWD_tt_liga:0 "Tworzymy frakcję §YLiga Wolnych Dzielnic§! (albo dołączamy do istniejącej) i zapraszamy pozostałe niezależne dzielnice."
 WWD_tt_patron:0 "Wybierzemy blok, który stanie się naszym patronem (staniemy się jego państwem zależnym)."
 WWD_ZIE_tree:0 "Zielone Bielany"
 WWD_TEC_tree:0 "Tęczowe Powiśle"
 wwd.30.t:0 "Zaproszenie do Ligi Wolnych Dzielnic"
 wwd.30.d:0 "[From.GetName] proponuje nam wspólną obronę przed blokami: Ligę Wolnych Dzielnic. Każda dzielnica zachowuje własną radę, ale broni się razem z innymi."
 wwd.30.a:0 "Wchodzimy do Ligi."
 wwd.30.b:0 "Damy sobie radę sami."
 wwd.31.t:0 "Wybór patrona"
 wwd.31.d:0 "Rada dzielnicy głosuje: komu oddać się pod opiekę? Każdy z bloków obiecuje ochronę – i każdy będzie chciał czegoś w zamian."
 wwd.31.a:0 "Pod opiekę: Straż Marszałkowska (Sejm)."
 wwd.31.b:0 "Pod opiekę: Kancelaria Prezydenta."
 wwd.31.c:0 "Pod opiekę: Mafia Pruszkowska."
 wwd.31.e:0 "Jednak zostajemy niezależni."
