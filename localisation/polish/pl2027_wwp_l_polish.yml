l_polish:
 WWP_stolica:0 "Walka o wpływy w stolicy"
 WWP_stolica_desc:0 "Wpływy w stolicy: Sejm §Y[?global.TFE_wwa_smr|0]§!, Pałac §Y[?global.TFE_wwa_kpr|0]§!, Pruszków §Y[?global.TFE_wwa_mpr|0]§!.\nCo miesiąc każda dzielnica daje +1 blokowi, który ją kontroluje (razem z Policją, Wojskiem lub Kibicami Legii), a utrzymanie wpływów kosztuje −1.\nZakończenie: blok z wpływami co najmniej 75 i przewagą 20 nad pozostałymi przejmuje stolicę (Pruszków – nie wcześniej niż w czerwcu 2028). Sejm i Pałac w rządzie jedności wygrywają razem, gdy mają łącznie 130. Jeśli do lipca 2029 nikt nie wygra – stolica zostaje podzielona."
 WWP_tt_1:0 "Wpływy w stolicy: Sejm §G+6§!"
 WWP_smr_ustawa:0 "Ustawa o porządku publicznym"
 WWP_smr_ustawa_desc:0 "Sejm uchwala ustawę, która daje Straży Marszałkowskiej i Policji prawo do patroli w całym mieście."
 WWP_tt_2:0 "Wpływy w stolicy: Pruszków §R-8§!, Sejm §G+2§!"
 WWP_smr_sledztwo:0 "Śledztwo antymafijne"
 WWP_smr_sledztwo_desc:0 "Prokuratorzy z teczkami, naloty na kantory i hurtownie. Pruszków traci ludzi i pieniądze – ale odpowie."
 WWP_tt_3:0 "Wpływy w stolicy: Pałac §G+6§!"
 WWP_kpr_dekret:0 "Dekret o bezpieczeństwie stolicy"
 WWP_kpr_dekret_desc:0 "Prezydent podpisuje dekret o strefach bezpieczeństwa. Szybko i skutecznie – ale bez Sejmu (stabilność −2%)."
 WWP_tt_4:0 "Wpływy w stolicy: Pałac §G+5§!, Pruszków §R-3§!"
 WWP_kpr_mosty:0 "Wojsko na mostach"
 WWP_kpr_mosty_desc:0 "Żołnierze z Rembertowa obsadzają mosty Łazienkowski, Poniatowskiego i Gdański. Kosztuje 1000 żołnierzy na posterunkach."
 WWP_tt_5:0 "Wpływy w stolicy: Pruszków §G+5§!"
 WWP_mpr_ochrona:0 "Ochrona za opłatą"
 WWP_mpr_ochrona_desc:0 "Sklepy, stacje i bazary płacą za „spokój”. Pieniądze płyną szybko (+40 PP), ale ludzie mają tego dość (stabilność −2%)."
 WWP_tt_6:0 "Wpływy w stolicy: Pruszków §G+8§!"
 WWP_mpr_koperty:0 "Koperty dla urzędników"
 WWP_mpr_koperty_desc:0 "Urzędnicy dzielnic dostają koperty. Wpływy rosną, ale co czwarta koperta trafia w ręce dziennikarzy."
 WWP_tt_7:0 "Wpływy w stolicy: Pruszków §G+4§!, Sejm §R-2§!, Pałac §R-2§!"
 WWP_mpr_zyleta:0 "Żyleta na ulicach"
 WWP_mpr_zyleta_desc:0 "Kibice Legii pokazują, kto rządzi na ulicach. Wszystkie bloki tracą spokój, Pruszków – mniej niż inni."
 WWP_tt_8:0 "Wpływy w stolicy: Sejm §G+3§!"
 WWP_plc_wsparcie:0 "Wsparcie dla bloku: Sejm"
 WWP_plc_wsparcie_desc:0 "Nasi ludzie pilnują ulic w imieniu bloku: Sejm."
 WWP_tt_9:0 "Wpływy w stolicy: Pałac §G+3§!"
 WWP_woj_wsparcie:0 "Wsparcie dla bloku: Pałac"
 WWP_woj_wsparcie_desc:0 "Nasi ludzie pilnują ulic w imieniu bloku: Pałac."
 WWP_tt_10:0 "Wpływy w stolicy: Pruszków §G+3§!"
 WWP_leg_wsparcie:0 "Wsparcie dla bloku: Pruszków"
 WWP_leg_wsparcie_desc:0 "Nasi ludzie pilnują ulic w imieniu bloku: Pruszków."
 WWP_tt_11:0 "Wpływy w stolicy: Sejm §G+5§!, Pałac §G+5§!, Pruszków §R-5§!"
 WWP_jednosc_stolica:0 "Wspólny sztab stolicy"
 WWP_jednosc_stolica_desc:0 "Sejm i Pałac w rządzie jedności łączą sztaby kryzysowe. Obie strony zyskują, Pruszków traci."
 WWP_tt_12:0 "Wpływy w stolicy: Sejm §G+1§!"
 WWP_tt_13:0 "Wpływy w stolicy: Pałac §G+1§!"
 WWP_tt_14:0 "Wpływy w stolicy: Pruszków §G+1§!"
 WWP_tt_15:0 "Wpływy w stolicy: Sejm §G+2§!"
 WWP_tt_16:0 "Wpływy w stolicy: Pałac §G+2§!"
 WWP_tt_17:0 "Wpływy w stolicy: Pruszków §G+2§!"
 WWP_tt_18:0 "Wpływy w stolicy: Sejm §G+4§!"
 WWP_tt_19:0 "Wpływy w stolicy: Pałac §G+4§!"
 WWP_tt_20:0 "Wpływy w stolicy: Pruszków §G+4§!"
 WWP_tt_21:0 "Wpływy w stolicy: Sejm §G+5§!"
 WWP_tt_22:0 "Wpływy w stolicy: Pałac §G+5§!"
 wwp.1.t:0 "Blackout na Pradze"
 wwp.1.d:0 "Podstacja przy Targówku wysiadła, a z nią połowa prawego brzegu. Kto pierwszy przywiezie agregaty, ten zyska wdzięczność dzielnicy."
 wwp.1.a:0 "Agregaty z magazynów państwowych."
 wwp.1.b:0 "Niech się martwi ten, kto rządzi Pragą."
 wwp.2.t:0 "Strzelanina na Woli"
 wwp.2.d:0 "W nocy przy Kercelaku ktoś ostrzelał radiowóz. Media pytają, kto naprawdę kontroluje dzielnicę."
 wwp.2.a:0 "Pokaz siły – patrole na każdym rogu."
 wwp.2.b:0 "Wezwać do spokoju i obiecać śledztwo."
 wwp.5.t:0 "Most Łazienkowski zamknięty"
 wwp.5.d:0 "Ktoś zablokował most ciężarówkami. Komunikacja między brzegami stoi, a każda strona oskarża pozostałe."
 wwp.5.a:0 "Usunąć blokadę siłą."
 wwp.5.b:0 "Negocjować z blokującymi."
 wwp.6.t:0 "Posłowie wyjeżdżają do Szczecina"
 wwp.6.d:0 "Kilkunastu posłów z różnych klubów wyjechało do Eurostaatu Pommern. Mówią o „tymczasowej siedzibie Sejmu na emigracji”."
 wwp.6.a:0 "Uznać ich za zdrajców."
 wwp.6.b:0 "Zaprosić z powrotem – potrzebujemy kworum."
 wwp.7.t:0 "Bazar Różyckiego płaci dwa razy"
 wwp.7.d:0 "Kupcy z Pragi płacą jednocześnie „ochronę” Pruszkowowi i podatki dzielnicy. Pytają, który z tych rachunków jest prawdziwy."
 wwp.7.a:0 "Zwolnić kupców z podatków na kwartał."
 wwp.7.b:0 "Podatki to podatki."
 wwp.8.t:0 "Konwój z lekami"
 wwp.8.d:0 "Konwój z lekami dla szpitala przy Banacha utknął na rogatkach. Trzy bloki oferują eskortę – każdy na swoich warunkach."
 wwp.8.a:0 "Nasza eskorta, nasze zasługi."
 wwp.8.b:0 "Wspólna eskorta wszystkich stron."
 wwp.3.t:0 "Naloty na hurtownie"
 wwp.3.d:0 "Prokuratorzy i policja wchodzą do hurtowni i kantorów Rodziny. Część towaru przepadła, część ludzi siedzi."
 wwp.3.a:0 "Odkupić ludzi i towar."
 wwp.3.b:0 "Przeczekać – Rodzina ma czas."
 WWP_tt_23:0 "Wpływy w stolicy: Pruszków §R-6§!, Sejm §G+2§!, Pałac §G+2§!"
 wwp.4.t:0 "Afera kopertowa"
 wwp.4.d:0 "Dziennikarze publikują zdjęcia urzędników dzielnicy biorących koperty od ludzi z Pruszkowa. Opinia publiczna wrze."
 wwp.4.a:0 "Dymisje i śledztwo."
 WWP_rzady_prawa:0 "Rządy prawa w stolicy"
 WWP_rzady_prawa_desc:0 "Sejm odzyskał kontrolę nad Warszawą. Sądy działają, a policja odpowiada przed posłami."
 WWP_dekret:0 "Stolica pod dekretem"
 WWP_dekret_desc:0 "Pałac rządzi Warszawą dekretami i strefami bezpieczeństwa. Spokojnie – dopóki nikt nie zadaje pytań."
 WWP_osmiornica:0 "Ośmiornica rządzi miastem"
 WWP_osmiornica_desc:0 "Pruszków kontroluje urzędy, porty i bazary. Kto nie płaci, ten nie handluje."
 WWP_jednosc:0 "Rząd jedności w stolicy"
 WWP_jednosc_desc:0 "Sejm i Pałac rządzą Warszawą razem. Kompromis jest powolny, ale trwały."
 WWP_podzial:0 "Podzielona stolica"
 WWP_podzial_desc:0 "Nikt nie wygrał walki o Warszawę. Granice dzielnic stały się liniami frontu."
 wwp.20.t:0 "Rząd jedności w stolicy"
 wwp.20.d:0 "Sejm i Pałac ogłaszają wspólne władze stolicy. Pruszków traci urzędy, a Kibice Legii – pieniądze. Pierwszy raz od rozpadu Warszawa ma jeden rząd."
 wwp.20.a:0 "Warszawa zmienia się."
 wwp.21.t:0 "Rządy prawa wracają do Warszawy"
 wwp.21.d:0 "Ustawy znów obowiązują na wszystkich ulicach. Straż Marszałkowska i Policja przejmują dzielnice jedna po drugiej, a sądy wracają do pracy."
 wwp.21.a:0 "Warszawa zmienia się."
 wwp.22.t:0 "Stolica pod dekretem Pałacu"
 wwp.22.d:0 "Pałac przejmuje stolicę dekretami. Wojsko stoi na mostach, a prawo pisze Kancelaria – szybko i bez dyskusji."
 wwp.22.a:0 "Warszawa zmienia się."
 wwp.23.t:0 "Ośmiornica przejmuje stolicę"
 wwp.23.d:0 "Rodzina z Pruszkowa przejmuje urzędy dzielnic. Formalnie nikt nie ogłosił zwycięstwa – ale wszyscy wiedzą, komu się płaci."
 wwp.23.a:0 "Warszawa zmienia się."
 wwp.24.t:0 "Podzielona stolica"
 wwp.24.d:0 "Lipiec 2029. Nikt nie wygrał walki o Warszawę. Bloki trzymają swoje dzielnice, a mosty mają posterunki z trzech stron."
 wwp.24.a:0 "Miasto podzielone."
