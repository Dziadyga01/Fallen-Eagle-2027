l_polish:
 ZAG_GER_kryzys:0 "Gospodarka w cieniu kryzysu"
 ZAG_GER_kryzys_desc:0 "Rozpad Polski zerwał łańcuchy dostaw w całym regionie. Rząd w mieście Poczdam ogłasza program ratowania gospodarki Brandenburgii, Saksonii i Meklemburgii."
 ZAG_GER_budzet:0 "Budżet antykryzysowy"
 ZAG_GER_budzet_desc:0 "Rezerwy finansowe trafiają do szpitali, szkół i firm, które straciły rynki zbytu po drugiej stronie granicy."
 ZAG_GER_cywilne:0 "Nowe fabryki cywilne"
 ZAG_GER_cywilne_desc:0 "Specjalne strefy ekonomiczne przyciągają inwestorów. W zakładach chemicznych w Schwedt i hutach w Eisenhüttenstadt ruszają nowe linie produkcyjne."
 ZAG_GER_handel:0 "Nowe szlaki handlowe"
 ZAG_GER_handel_desc:0 "Towary, które jechały przez Polskę, płyną teraz po Odrze i Łabie albo przez porty. Handel znajduje nowe drogi."
 ZAG_GER_handel_tb:0 "Nowe szlaki handlowe"
 ZAG_GER_inwestycje:0 "Program inwestycyjny"
 ZAG_GER_inwestycje_desc:0 "Państwowy fundusz współfinansuje modernizację zakładów i nowe inwestycje przemysłowe."
 ZAG_GER_nauka:0 "Nauka dla przemysłu"
 ZAG_GER_nauka_desc:0 "Laboratoria na uniwersytetach w Dreźnie i Lipsku pracują dla przemysłu – od elektroniki po materiały."
 ZAG_GER_nauka_a_tb:0 "Nauka dla przemysłu"
 ZAG_GER_nauka_b_tb:0 "Nauka dla przemysłu"
 ZAG_GER_gospodarka:0 "Stabilna gospodarka"
 ZAG_GER_gospodarka_desc:0 "Bezrobocie spada, a budżet znów się bilansuje. Kryzys w regionie przestał być kryzysem w kraju."
 ZAG_GER_drogi:0 "Modernizacja dróg"
 ZAG_GER_drogi_desc:0 "Remonty autostrad i dróg krajowych do granic. Ciężarówki z towarami i wojskiem muszą przejechać bez opóźnień."
 ZAG_GER_kolej:0 "Modernizacja kolei"
 ZAG_GER_kolej_desc:0 "Nowe składy towarowe i wyremontowane linie łączą zakłady z magazynami i portami."
 ZAG_GER_magazyny:0 "Zaplecze logistyczne"
 ZAG_GER_magazyny_desc:0 "Magazyny strategiczne, bazy paliw i warsztaty naprawcze w każdym regionie."
 ZAG_GER_logistyka:0 "Sprawna logistyka"
 ZAG_GER_logistyka_desc:0 "Transport wojskowy i cywilny działa jak jeden system. Armia może przerzucić brygadę w ciągu jednej nocy."
 ZAG_GER_obrona:0 "Narodowa strategia obrony"
 ZAG_GER_obrona_desc:0 "Granica z rozbitą Polską stała się granicą z chaosem. Bundeswehra dostaje nowe zadania i nowy budżet."
 ZAG_GER_pobor:0 "Rozszerzony pobór"
 ZAG_GER_pobor_desc:0 "Służba wojskowa obejmuje kolejne roczniki. Rezerwa rośnie z miesiąca na miesiąc."
 ZAG_GER_ochotnicy:0 "Ochotnicze formacje obrony"
 ZAG_GER_ochotnicy_desc:0 "Ochotnicy z przygranicznych regionów tworzą formacje obrony terytorialnej."
 ZAG_GER_fabryki:0 "Fabryki zbrojeniowe"
 ZAG_GER_fabryki_desc:0 "Zakłady zbrojeniowe zwiększają produkcję broni, amunicji i pojazdów."
 ZAG_GER_jednostki:0 "Nowe brygady"
 ZAG_GER_jednostki_desc:0 "Z rezerwistów i ochotników powstają nowe jednostki: Brygada Grenadierów."
 ZAG_GER_wyposazenie:0 "Zwiększenie produkcji wyposażenia"
 ZAG_GER_wyposazenie_desc:0 "Kontrakty na broń strzelecką, sprzęt łączności i amunicję na kilka lat naprzód."
 ZAG_GER_modernizacja:0 "Modernizacja uzbrojenia"
