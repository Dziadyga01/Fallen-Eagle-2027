l_polish:
 RULE_GROUP_PL2027:0 "The Fallen Eagle"
 PL2027_SCENARIUSZ:0 "Scenariusz startowy"
 PL2027_SCENARIUSZ_GODZINA_ZERO:0 "Godzina Zero – jedna Rzeczpospolita"
 PL2027_SCENARIUSZ_GODZINA_ZERO_DESC:0 "Gra zaczyna się jako jedno państwo. Regiony są województwami Rzeczypospolitej i w kolejnych fazach rozpadu żądają autonomii, ogłaszają niepodległość albo wypowiadają posłuszeństwo. Można grać rządem albo dowolnym regionem."
 PL2027_SCENARIUSZ_PODZIELONA:0 "Polska już podzielona"
 PL2027_SCENARIUSZ_PODZIELONA_DESC:0 "Klasyczny scenariusz: 11 listopada 2027 Polska jest już podzielona na kilkadziesiąt niezależnych państw (jak w wersjach do 0.8.6 etapu I). Fazy rozpadu nadal blokują wojny do fazy IV."
 PL2027_ANEKSJA:0 "Kapitulacja państw polskich"
 PL2027_ANEKSJA_WLACZONA:0 "Natychmiastowa aneksja"
 PL2027_ANEKSJA_WLACZONA_DESC:0 "Państwo polskie, które skapituluje, zostaje od razu wcielone przez zwycięzcę razem z wojskiem."
 PL2027_ANEKSJA_WYLACZONA:0 "Konferencja pokojowa"
 PL2027_ANEKSJA_WYLACZONA_DESC:0 "Kapitulacja kończy się zwykłą konferencją pokojową, jak w grze bez modów."
 PL2027_MARIONETKI:0 "Marionetki"
 PL2027_MARIONETKI_ZAKAZ:0 "Zakaz marionetek"
 PL2027_MARIONETKI_ZAKAZ_DESC:0 "Jeśli polskie państwo stanie się czyimś podmiotem, zwierzchnik od razu je anektuje (poza układem startowym)."
 PL2027_MARIONETKI_DOZWOLONE:0 "Marionetki dozwolone"
 PL2027_MARIONETKI_DOZWOLONE_DESC:0 "Państwa mogą tworzyć marionetki – w pokoju, fokusach i zdarzeniach."
 PL2027_CODZIENNOSC:0 "Codzienność rozpadu"
 PL2027_CODZIENNOSC_WLACZONE:0 "Włączone"
 PL2027_CODZIENNOSC_WLACZONE_DESC:0 "Losowe wydarzenia z życia rozpadającego się kraju: kolejki, mróz, strajki, przemyt, dezerterzy."
 PL2027_CODZIENNOSC_WYLACZONE:0 "Wyłączone"
 PL2027_CODZIENNOSC_WYLACZONE_DESC:0 "Bez losowych wydarzeń „codzienności rozpadu” – tylko wydarzenia z drzewek i fabuły."
