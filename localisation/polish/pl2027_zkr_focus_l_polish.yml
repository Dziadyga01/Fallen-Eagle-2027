l_polish:
 ZKR_czarny_krzyz:0 "Czarny Krzyż ponownie powstaje"
 ZKR_czarny_krzyz_desc:0 "Gdy Rzeczpospolita się rozpadła, w Malborku zebrała się kapituła ludzi, którzy od lat bawili się w rekonstrukcję – i nagle przestali się bawić. Mają zamek, sztandar, kilka setek uzbrojonych ochotników i poparcie Żuław zmęczonych chaosem. Teraz muszą zbudować państwo."
 ZKR_odbudowa_malborka:0 "Odbudowa Malborka"
 ZKR_odbudowa_malborka_desc:0 "Największy ceglany zamek świata znów jest siedzibą władzy, a nie muzeum. Kapituła obraduje w Wielkim Refektarzu."
 ZKR_nowa_administracja:0 "Nowa administracja"
 ZKR_nowa_administracja_desc:0 "Komturie zastępują gminy, a urzędnicy składają ślubowanie Wielkiemu Mistrzowi. Papiery trzeba jednak wypełniać tak samo jak wcześniej."
 ZKR_warsztaty:0 "Warsztaty zbrojeniowe"
 ZKR_warsztaty_desc:0 "Zakłady w Kwidzynie i Elblągu dostają zamówienia od Zakonu: amunicja, pancerze, części do pojazdów."
 ZKR_nowi_bracia:0 "Nowi bracia zakonni"
 ZKR_nowi_bracia_desc:0 "Do Malborka przychodzą młodzi mężczyźni z całych Żuław. Jedni szukają porządku, inni żołdu, jeszcze inni przygody."
 ZKR_kapitula:0 "Wielka Kapituła"
 ZKR_kapitula_desc:0 "Rada komturów zbiera się co miesiąc. Wielki Mistrz rządzi, ale bez kapituły nie podejmie żadnej ważnej decyzji."
 ZKR_msza:0 "Msza w kościele zamkowym"
 ZKR_msza_desc:0 "Po raz pierwszy od wieków kapituła zbiera się po mszy w kościele Najświętszej Marii Panny na Zamku Wysokim. Rekonstruktorzy przestali udawać – teraz ślubują naprawdę."
 ZKR_kapelani:0 "Kapelani w chorągwiach"
 ZKR_kapelani_desc:0 "Każda chorągiew dostaje kapelana. Żołnierze, którzy wiedzą, za co walczą, nie uciekają z pola walki."
 ZKR_bractwa:0 "Bractwa świeckie"
 ZKR_bractwa_desc:0 "W parafiach Żuław powstają bractwa świeckie: pomagają ubogim, pilnują porządku i rekrutują do chorągwi."
 ZKR_pielgrzymki:0 "Pielgrzymki do Malborka"
 ZKR_pielgrzymki_desc:0 "Pielgrzymi i turyści z całej Europy przyjeżdżają zobaczyć odrodzony Zakon. Zostawiają pieniądze – i opowiadają o nim w domu."
 ZKR_regula_f:0 "Reguła dla urzędników"
 ZKR_regula_f_desc:0 "Urzędnicy komturii składają ślubowanie według reguły zakonnej: posłuszeństwo, dyscyplina, skromność."
 ZKR_kazania:0 "Kazania o Prusach"
 ZKR_kazania_desc:0 "W każdą niedzielę kazanie o dawnych Prusach: o Pomezanii, Pogezanii i Warmii, które „czekają na powrót”."
 ZKR_kapitula_generalna:0 "Kapituła Generalna"
 ZKR_kapitula_generalna_desc:0 "Wielki Mistrz zwołuje Kapitułę Generalną: komturowie, kapelani i przedstawiciele bractw. Zakon jest jednocześnie państwem, armią i wspólnotą."
 ZKR_zulawy:0 "Żuławy – spichlerz Zakonu"
 ZKR_zulawy_desc:0 "Najżyźniejsze ziemie dawnej Polski karmią Malbork i Elbląg. Nadwyżki można sprzedać sąsiadom."
 ZKR_odbudowa_drog:0 "Odbudowa dróg"
 ZKR_odbudowa_drog_desc:0 "Siódemka i drogi między Malborkiem, Sztumem i Kwidzynem są zniszczone po zimie. Zakon nie może walczyć bez dróg."
 ZKR_prochownia:0 "Prochownia w Malborku"
 ZKR_prochownia_desc:0 "Stare magazyny kolejowe zmieniają się w zakład elaboracji amunicji."
 ZKR_szkola_rycerska:0 "Szkoła rycerska w Sztumie"
 ZKR_szkola_rycerska_desc:0 "Dawni żołnierze zawodowi uczą ochotników walki w terenie zabudowanym i obsługi dronów."
 ZKR_pruski_przemysl:0 "Pruski przemysł"
 ZKR_pruski_przemysl_desc:0 "Elbląg miał kiedyś stocznie i turbiny. Zakon chce, by znów miał fabryki."
 ZKR_port_elblag:0 "Port w Elblągu"
 ZKR_port_elblag_desc:0 "Kanał przez Mierzeję otwiera Elblągowi drogę na Bałtyk – bez pytania Rosji o zgodę."
 ZKR_zbrojownia:0 "Zbrojownia Zakonu"
 ZKR_zbrojownia_desc:0 "Każdy brat zakonny dostaje karabin, kamizelkę i hełm. Na razie."
 ZKR_komturie:0 "Komturie wojskowe"
 ZKR_komturie_desc:0 "Każda komturia wystawia własną chorągiew – kompanię piechoty z własnym dowódcą."
 ZKR_komturie_tb:0 "Komturie wojskowe"
 ZKR_kanal_elblaski:0 "Kanał Elbląski"
 ZKR_kanal_elblaski_desc:0 "Barki płynące po pochylniach wiozą towary z Ostródy do Elbląga, a z nimi – wpływy Zakonu."
 ZKR_kupcy:0 "Kupcy hanzeatyccy"
 ZKR_kupcy_desc:0 "Kupcy z Gdańska i Kłajpedy znów handlują z Elblągiem. Zakon daje ochronę, kupcy dają pieniądze."
 ZKR_artyleria:0 "Artyleria Zakonu"
 ZKR_artyleria_desc:0 "Kilka haubic z demobilu i dużo ćwiczeń na poligonie pod Kwidzynem."
 ZKR_artyleria_tb:0 "Artyleria Zakonu"
 ZKR_zmotoryzowani:0 "Zmotoryzowani bracia"
 ZKR_zmotoryzowani_desc:0 "Pikapy, ciężarówki i busy z Niemiec – chorągwie muszą się szybko przemieszczać między komturiami."
 ZKR_mury_zamku:0 "Mury Malborka"
 ZKR_mury_zamku_desc:0 "Zamek wytrzymał oblężenie w 1410 roku. Zakon dba, by wytrzymał i teraz."
 ZKR_skarbiec:0 "Skarbiec Zakonu"
 ZKR_skarbiec_desc:0 "Podatki, cła na Wiśle i datki z Niemiec trafiają do jednego skarbca. Wielki Szatny pilnuje każdego euro."
 ZKR_garnizony:0 "Garnizony w komturiach"
 ZKR_garnizony_desc:0 "Pierwsze pełne chorągwie zakonne – piechota z artylerią, saperami i zwiadem."
 ZKR_gotowy_na_wojne:0 "Zakon gotowy na wojnę"
 ZKR_gotowy_na_wojne_desc:0 "Malbork ma armię, pieniądze i drogi. Teraz trzeba zdecydować, co z nimi zrobić."
 ZKR_ziemie_wokol:0 "Ziemie wokół Malborka"
 ZKR_ziemie_wokol_desc:0 "Na mapie w Wielkim Refektarzu wiszą cztery szpilki: Nowe Miasto, Grudziądz, Kociewie i Warmia. Nie każdy cel musi oznaczać wojnę."
 ZKR_ult_nml:0 "Ultimatum dla Nowego Miasta Lubawskiego"
 ZKR_ult_nml_desc:0 "Zabezpieczenie południowej granicy nad Drwęcą. Zakon proponuje podporządkowanie: ochronę, wspólną armię i własny samorząd. Do sierpnia 2029 to tylko rozmowy; od września 2029 odmowa może oznaczać wojnę."
 ZKR_cel_nml:0 "Nowe Miasto Lubawskie w rękach Zakonu"
 ZKR_cel_nml_desc:0 "Nowe Miasto Lubawskie uznaje władzę Malborka – dobrowolnie albo pod lufami chorągwi."
 ZKR_ult2_nml:0 "Drugie ultimatum dla Nowego Miasta Lubawskiego"
 ZKR_ult2_nml_desc:0 "Nowe Miasto Lubawskie odrzuciło propozycję Zakonu, gdy kapituła nie była gotowa do wojny. Teraz jest – chorągwie stoją przy granicy, a posłowie wiozą ostatnią ofertę."
 ZKR_ult_gru:0 "Ultimatum dla Grudziądza"
 ZKR_ult_gru_desc:0 "Kontrola ważnego ośrodka nad Wisłą – twierdzy, mostu i koszar. Zakon proponuje podporządkowanie: ochronę, wspólną armię i własny samorząd. Do sierpnia 2029 to tylko rozmowy; od września 2029 odmowa może oznaczać wojnę."
 ZKR_cel_gru:0 "Grudziądz w rękach Zakonu"
 ZKR_cel_gru_desc:0 "Grudziądz uznaje władzę Malborka – dobrowolnie albo pod lufami chorągwi."
 ZKR_ult2_gru:0 "Drugie ultimatum dla Grudziądza"
 ZKR_ult2_gru_desc:0 "Grudziądz odrzuciło propozycję Zakonu, gdy kapituła nie była gotowa do wojny. Teraz jest – chorągwie stoją przy granicy, a posłowie wiozą ostatnią ofertę."
 ZKR_ult_koc:0 "Ultimatum dla Ziemi Kociewskiej"
 ZKR_ult_koc_desc:0 "Rozszerzenie wpływów na zachód, aż po Starogard i Tczew. Zakon proponuje podporządkowanie: ochronę, wspólną armię i własny samorząd. Do sierpnia 2029 to tylko rozmowy; od września 2029 odmowa może oznaczać wojnę."
 ZKR_cel_koc:0 "Ziemia Kociewska w rękach Zakonu"
 ZKR_cel_koc_desc:0 "Ziemia Kociewska uznaje władzę Malborka – dobrowolnie albo pod lufami chorągwi."
 ZKR_ult2_koc:0 "Drugie ultimatum dla Ziemi Kociewskiej"
 ZKR_ult2_koc_desc:0 "Ziemia Kociewska odrzuciło propozycję Zakonu, gdy kapituła nie była gotowa do wojny. Teraz jest – chorągwie stoją przy granicy, a posłowie wiozą ostatnią ofertę."
 ZKR_ult_wmz:0 "Ultimatum dla Republiki Warmińsko-Mazurskiej"
 ZKR_ult_wmz_desc:0 "Droga do historycznych ziem pruskich i do Olsztyna. Zakon proponuje podporządkowanie: ochronę, wspólną armię i własny samorząd. Do sierpnia 2029 to tylko rozmowy; od września 2029 odmowa może oznaczać wojnę."
 ZKR_cel_wmz:0 "Republika Warmińsko-Mazurska w rękach Zakonu"
 ZKR_cel_wmz_desc:0 "Republika Warmińsko-Mazurska uznaje władzę Malborka – dobrowolnie albo pod lufami chorągwi."
 ZKR_ult2_wmz:0 "Drugie ultimatum dla Republiki Warmińsko-Mazurskiej"
 ZKR_ult2_wmz_desc:0 "Republika Warmińsko-Mazurska odrzuciło propozycję Zakonu, gdy kapituła nie była gotowa do wojny. Teraz jest – chorągwie stoją przy granicy, a posłowie wiozą ostatnią ofertę."
 ZKR_dyplomacja_sily:0 "Dyplomacja z pozycji siły"
 ZKR_dyplomacja_sily_desc:0 "Sąsiedzi wiedzą już, że Zakon nie żartuje. Część z nich woli rozmawiać, zanim chorągwie staną u ich bram."
 ZKR_nowe_komturie:0 "Nowe komturie"
 ZKR_nowe_komturie_desc:0 "Podporządkowane ziemie dostają komturów, którzy pilnują lojalności wobec Malborka. Kary za nadmierne rozciągnięcie Zakonu spadają o połowę."
 ZKR_kongres:0 "Kongres Malborski"
 ZKR_kongres_desc:0 "Komturowie, bracia i delegaci podporządkowanych ziem zjeżdżają do Malborka. Zakon musi zdecydować, kim chce być: tarczą Bałtyku, nowym państwem pruskim – czy sojusznikiem Kremla."
 ZKR_obroncy_baltyku:0 "Obrońcy Bałtyku"
 ZKR_obroncy_baltyku_desc:0 "Kongres wybiera sojusze. Zakon ma chronić sąsiadów przed Rosją, a nie ich podbijać."
 ZKR_pruska_krucjata:0 "Pruska krucjata"
 ZKR_pruska_krucjata_desc:0 "Kongres wybiera miecz. Zakon odbuduje Prusy własnymi siłami – ze wszystkimi tego konsekwencjami."
 ZKR_uklad_z_kremlem:0 "Układ z Kremlem"
 ZKR_uklad_z_kremlem_desc:0 "Kongres wybiera Moskwę. Rosja ma broń, pieniądze i plan dla Prus. Pytanie tylko, ile Zakon za to zapłaci."
 ZKR_ob_rozbior:0 "Nie pozwolimy na drugi rozbiór Prus"
 ZKR_ob_rozbior_desc:0 "Wielki Mistrz przemawia z murów Malborka: Prusy były już raz dzielone między obce mocarstwa. Nie pozwolimy na to drugi raz."
 ZKR_ob_kociewie:0 "Poselstwo do Kociewia"
 ZKR_ob_kociewie_desc:0 "Poselstwo Zakonu jedzie do Starogardu z propozycją ochrony i wspólnej obrony."
 ZKR_ob_grudziadz:0 "Układ z Grudziądzem"
 ZKR_ob_grudziadz_desc:0 "Wolne Miasto ma twierdzę i most na Wiśle. Zakon ma armię. Razem mogą więcej."
 ZKR_ob_warmia:0 "Obrona Warmii"
 ZKR_ob_warmia_desc:0 "Olsztyn jest pierwszym celem Rosjan. Zakon wysyła tam sprzęt i instruktorów."
 ZKR_ob_twierdza:0 "Twierdza Malbork"
 ZKR_ob_twierdza_desc:0 "Mury, bunkry i baterie przeciwlotnicze na Żuławach."
 ZKR_ob_sojusz:0 "Sojusz państw bałtyckich"
 ZKR_ob_sojusz_desc:0 "Zakon zaprasza sąsiadów do wspólnej frakcji. Kto wcześniej usłyszał od Malborka ultimatum, nie zapomni tego łatwo."
 ZKR_ob_ochotnicy:0 "Ochotnicy dla Mazur"
 ZKR_ob_ochotnicy_desc:0 "Bracia zakonni, którzy chcą walczyć z Rosjanami, mogą wyjechać na Mazury. Zakon zapewni im broń."
 ZKR_ob_wspolny_sztab:0 "Wspólny sztab"
 ZKR_ob_wspolny_sztab_desc:0 "Oficerowie Zakonu i sojuszników planują obronę razem."
 ZKR_ob_tarcza:0 "Tarcza Bałtyku"
 ZKR_ob_tarcza_desc:0 "Sojusz państw nad Bałtykiem staje się faktem. Zakon jest jego mieczem i tarczą."
 ZKR_ob_linia_pasleki:0 "Linia Pasłęki"
 ZKR_ob_linia_pasleki_desc:0 "Rzeka Pasłęka staje się linią obrony przed uderzeniem z obwodu."
 ZKR_ob_klajpeda:0 "Handel z Kłajpedą"
 ZKR_ob_klajpeda_desc:0 "Litewski port to okno na świat dla państw odciętych od Warszawy."
 ZKR_ob_hanza:0 "Nowa Hanza"
 ZKR_ob_hanza_desc:0 "Elbląg, Gdańsk, Kłajpeda – miasta, które kiedyś tworzyły Hanzę, znów handlują ze sobą."
 ZKR_ob_lotnictwo:0 "Skrzydła Zakonu"
 ZKR_ob_lotnictwo_desc:0 "Lotnisko w Królewie Malborskim znów przyjmuje samoloty – na razie drony i stare śmigłowce."
 ZKR_ob_bruksela:0 "Pomoc z Brukseli"
 ZKR_ob_bruksela_desc:0 "Unia Europejska nie uznaje Zakonu, ale chętnie finansuje każdego, kto stawia opór Rosji."
 ZKR_ob_wojna_z_rosja:0 "Wojna o wolność Prus"
 ZKR_ob_wojna_z_rosja_desc:0 "Zakon nie będzie patrzył, jak Rosja zabiera Mazury. Chorągwie ruszają na wschód."
 ZKR_ob_odbudowa:0 "Odbudowa Warmii"
 ZKR_ob_odbudowa_desc:0 "Po wojnie trzeba odbudować drogi, mosty i szpitale – także u sąsiadów."
 ZKR_ob_dyplomaci:0 "Dyplomacja Zakonu"
 ZKR_ob_dyplomaci_desc:0 "Posłowie Zakonu jeżdżą do Wilna, Berlina i Kopenhagi. Nikt ich oficjalnie nie przyjmuje, ale wszyscy chcą ich wysłuchać."
 ZKR_ob_otwarty_zakon:0 "Otwarty Zakon"
 ZKR_ob_otwarty_zakon_desc:0 "Do Zakonu mogą wstępować także kobiety i niewierzący. Kapituła uznaje, że państwo potrzebuje obywateli, nie tylko rycerzy."
 ZKR_ob_bractwa:0 "Bractwa obywatelskie"
 ZKR_ob_bractwa_desc:0 "W każdej wsi powstaje bractwo, które dba o obronę cywilną i pomoc sąsiedzką."
 ZKR_ob_wolne_prusy:0 "Prusy wolne od Moskwy"
 ZKR_ob_wolne_prusy_desc:0 "Rosja nie zabrała Prus. Sojusz przetrwał, a Zakon – kiedyś śmieszna rekonstrukcja – stał się gwarantem pokoju nad Bałtykiem."
 ZKR_pk_bez_zwyciestwa:0 "Nie ma pokoju bez zwycięstwa"
 ZKR_pk_bez_zwyciestwa_desc:0 "Kapituła ogłasza pełną militaryzację. Każdy brat jest żołnierzem, każda komturia – koszarami."
 ZKR_pk_ziemie_utracone:0 "Ziemie utracone"
 ZKR_pk_ziemie_utracone_desc:0 "Archiwiści Zakonu przygotowują mapy z 1410 roku. Wszystko, co kiedyś należało do Prus, ma do nich wrócić."
 ZKR_pk_militaryzacja:0 "Pełna militaryzacja"
 ZKR_pk_militaryzacja_desc:0 "Fabryki w Elblągu przestawiają się na produkcję dla armii."
 ZKR_pk_marsz_grudziadz:0 "Marsz na Grudziądz"
 ZKR_pk_marsz_grudziadz_desc:0 "Twierdza nad Wisłą zostanie podporządkowana – tak czy inaczej."
 ZKR_pk_przez_kociewie:0 "Przez Kociewie"
 ZKR_pk_przez_kociewie_desc:0 "Zakon idzie na zachód, w stronę Starogardu i Tczewa."
 ZKR_pk_warmia:0 "Dziedzictwo Warmii"
 ZKR_pk_warmia_desc:0 "Olsztyn i Lidzbark były kiedyś stolicami biskupów warmińskich. Zakon upomina się o nie."
 ZKR_pk_choragwie:0 "Zakonne chorągwie"
 ZKR_pk_choragwie_desc:0 "Każda komturia wystawia nową chorągiew."
 ZKR_pk_ciezka_jazda:0 "Ciężka jazda XXI wieku"
 ZKR_pk_ciezka_jazda_desc:0 "Rycerze dosiadają transporterów opancerzonych. Konie zostają na paradach."
 ZKR_jazda_tb:0 "Ciężka jazda XXI wieku"
 ZKR_pk_lubawa:0 "Ziemia Lubawska"
 ZKR_pk_lubawa_desc:0 "Księstwo Lubawskie zamyka drogę na południe. Zakon nie zostawi go w spokoju."
 ZKR_pk_pomezania:0 "Pomezania i Pogezania"
 ZKR_pk_pomezania_desc:0 "Stare krainy pruskie znów pojawiają się w urzędowych dokumentach."
 ZKR_pk_drogi:0 "Pruskie drogi"
 ZKR_pk_drogi_desc:0 "Wojsko potrzebuje dróg z Malborka do Olsztyna i Grudziądza."
 ZKR_pk_krzyzowcy:0 "Krzyżowcy z Europy"
 ZKR_pk_krzyzowcy_desc:0 "Z Niemiec, Austrii i Litwy przyjeżdżają ochotnicy – jedni z przekonania, inni dla przygody."
 ZKR_pk_ordensburgi:0 "Ordensburgi"
 ZKR_pk_ordensburgi_desc:0 "Zamki w Kwidzynie, Sztumie i Gniewie znów mają garnizony."
 ZKR_pk_prawo:0 "Prawo chełmińskie"
 ZKR_pk_prawo_desc:0 "Średniowieczne prawo miejskie wraca jako podstawa samorządu w podbitych miastach."
 ZKR_pk_integracja:0 "Integracja ziem pruskich"
 ZKR_pk_integracja_desc:0 "Zdobyte ziemie stają się pełnoprawną częścią państwa Zakonu."
 ZKR_pk_administracja:0 "Pruska administracja"
 ZKR_pk_administracja_desc:0 "Urzędnicy Zakonu są ponoć najbardziej punktualni w całej dawnej Polsce."
 ZKR_pk_kampania:0 "Kampania pruska"
 ZKR_pk_kampania_desc:0 "Szybkie uderzenia, okrążenia i zajmowanie mostów, zanim przeciwnik zdąży się zorganizować."
 ZKR_pk_kapitula_wojenna:0 "Wojenna kapituła"
 ZKR_pk_kapitula_wojenna_desc:0 "Na czas wojny kapituła zbiera się w sztabie, nie w refektarzu."
 ZKR_pk_korona_prus:0 "Korona Prus"
 ZKR_pk_korona_prus_desc:0 "Malbork, Grudziądz i Olsztyn są w rękach Zakonu. Czas ogłosić to, o czym marzono od początku."
 ZKR_kr_tajny_uklad:0 "Tajny układ z Moskwą"
 ZKR_kr_tajny_uklad_desc:0 "§Y«Тайный договор с Москвой»§!\n\nW hotelu w Kaliningradzie emisariusz Wielkiego Mistrza podpisuje dokument, którego treści nie zna nawet kapituła."
 ZKR_kr_doradcy:0 "Rosyjscy doradcy wojskowi"
 ZKR_kr_doradcy_desc:0 "Oficerowie z Królewca uczą chorągwie walki z dronami. Siedzą też na każdej odprawie sztabu."
 ZKR_kr_dostawy:0 "Dostawy broni z Królewca"
 ZKR_kr_dostawy_desc:0 "Ciężarówki z obwodu przywożą karabiny, amunicję i stare transportery."
 ZKR_kr_kredyt:0 "Kredyt z Moskwy"
 ZKR_kr_kredyt_desc:0 "Rosyjski bank otwiera oddział w Malborku. Oprocentowanie jest niskie – pod warunkiem lojalności."
 ZKR_kr_operacja:0 "Wspólna operacja mazurska"
 ZKR_kr_operacja_desc:0 "Gdy Rosjanie idą na Mazury, chorągwie Zakonu uderzają na Warmię od zachodu."
 ZKR_kr_fabryki:0 "Rosyjskie fabryki w Elblągu"
 ZKR_kr_fabryki_desc:0 "Rosyjski koncern przejmuje zakłady w Elblągu. Produkcja rośnie, ale dyrektorzy meldują się w Królewcu."
 ZKR_kr_media:0 "Rosyjskie media w Malborku"
 ZKR_kr_media_desc:0 "Nowa telewizja kablowa nadaje po polsku, ale opowiada historię tak, jak widzi ją Moskwa."
 ZKR_kr_administracja:0 "Powołanie administracji prorosyjskiej"
 ZKR_kr_administracja_desc:0 "Generał Aleksander Radecki, dawny oficer Wojska Polskiego, zostaje pełnomocnikiem do spraw współpracy z Rosją. W kapitule mówi się o nim „Namiestnik”."
 ZKR_kr_gaz:0 "Gaz z Królewca"
 ZKR_kr_gaz_desc:0 "Tani gaz z obwodu ogrzewa domy na Żuławach. Kurek jest jednak w Królewcu."
 ZKR_kr_szkolenia:0 "Szkolenia w Królewcu"
 ZKR_kr_szkolenia_desc:0 "Najlepsi oficerowie Zakonu wyjeżdżają na kursy do Kaliningradu. Wracają z nowymi przyjaciółmi."
 ZKR_kr_nowy_porzadek:0 "Nowy porządek w Prusach"
 ZKR_kr_nowy_porzadek_desc:0 "Zakon, Rosja i ich wspólny plan dla regionu. Wielki Mistrz podpisuje dekrety, które przygotował ktoś inny."
 ZKR_kr_korytarz:0 "Korytarz do obwodu"
 ZKR_kr_korytarz_desc:0 "Nowa droga z Elbląga do granicy obwodu przyspiesza dostawy – i przemarsz wojsk."
 ZKR_kr_parasol:0 "Parasol rakietowy"
 ZKR_kr_parasol_desc:0 "Rosyjskie systemy przeciwlotnicze osłaniają Malbork. Obsługują je Rosjanie."
 ZKR_kr_zalezny:0 "Zakon państwem zależnym"
 ZKR_kr_zalezny_desc:0 "Moskwa przedstawia projekt traktatu: Zakon zachowa sztandar i zamek, a Kreml – armię, politykę zagraniczną i ostatnie słowo. Kapituła jest podzielona."
 ZKR_kr_kolej:0 "Kolej do Królewca"
 ZKR_kr_kolej_desc:0 "Po raz pierwszy od 1945 roku pociąg z Malborka jedzie prosto do Królewca."
 ZKR_kr_lojalnosc:0 "Lojalność wobec Moskwy"
 ZKR_kr_lojalnosc_desc:0 "Wielki Mistrz publicznie dziękuje Rosji za pomoc. Kapituła milczy."
 ZKR_kr_tajna_kapitula:0 "Tajna kapituła"
 ZKR_kr_tajna_kapitula_desc:0 "W piwnicach zamku spotykają się komturowie, którzy nie chcą być rosyjskimi urzędnikami. Przygotowują chorągwie do buntu."
 ZKR_kr_protektorat:0 "Przyjęcie rosyjskiego protektoratu"
 ZKR_kr_protektorat_desc:0 "Zakon staje się rosyjskim protektoratem. Władzę przejmuje Namiestnik Prus – generał Radecki."
 ZKR_kr_bunt:0 "Bunt rycerzy"
 ZKR_kr_bunt_desc:0 "Chorągwie wierne Wielkiemu Mistrzowi wypędzają rosyjskich doradców z Malborka. Generał Radecki ogłasza powstanie Pruskiego Rządu Tymczasowego. Zaczyna się wojna domowa o niezależność Zakonu."
 ZKR_os_panstwo:0 "Pruskie Państwo Zakonne"
 ZKR_os_panstwo_desc:0 "Preußischer Ordensstaat znów istnieje – na mapie, w dokumentach i w głowach ludzi, którzy jeszcze niedawno się z niego śmiali."
 ZKR_os_komturie:0 "Administracja komturii"
 ZKR_os_komturie_desc:0 "Państwo dzieli się na komturie z własnymi garnizonami i sądami."
 ZKR_os_prawo:0 "Prawo chełmińskie na nowo"
 ZKR_os_prawo_desc:0 "Średniowieczny przywilej staje się konstytucją. Miasta dostają samorząd, a Zakon – posłuszeństwo."
 ZKR_os_hanza:0 "Hanza nad Bałtykiem"
 ZKR_os_hanza_desc:0 "Pruskie miasta wracają do handlu morskiego."
 ZKR_os_roszczenia:0 "Roszczenia do Królewca"
 ZKR_os_roszczenia_desc:0 "Królewiec był stolicą Prus przez czterysta lat. Państwo Zakonne nie zrezygnuje z niego."
 ZKR_os_armia:0 "Armia Państwa Zakonnego"
 ZKR_os_armia_desc:0 "Chorągwie stają się regularną armią z własnymi pułkami pancernymi."
 ZKR_os_przygotowania:0 "Przygotowania do wojny o Królewiec"
 ZKR_os_przygotowania_desc:0 "Rosja to nie Grudziądz. Wojna o Królewiec może być ostatnią wojną Zakonu."
 ZKR_os_krolewiec:0 "Powrót do Królewca"
 ZKR_os_krolewiec_desc:0 "Chorągwie przekraczają granicę obwodu. Zaczyna się wojna, o której nikt nie wierzył, że się wydarzy."
 ZKR_os_krolewiec_pruski:0 "Królewiec znów pruski"
 ZKR_os_krolewiec_pruski_desc:0 "Nad zamkiem królewieckim – a właściwie nad miejscem, gdzie stał – powiewa czarno-biały sztandar."
 ZKR_os_wielkie_prusy:0 "Wielkie Prusy"
 ZKR_os_wielkie_prusy_desc:0 "Od Wisły po Niemen. Zakon, który zaczynał jako rekonstrukcja historyczna, stworzył państwo."
 ZKR_os_sekularyzacja:0 "Sekularyzacja Zakonu"
 ZKR_os_sekularyzacja_desc:0 "Jak w 1525 roku: Wielki Mistrz zrzuca habit, a Państwo Zakonne staje się świeckim Księstwem Pruskim."
 ZKR_kj_zwyciestwo:0 "Zwycięstwo Wielkiego Mistrza"
 ZKR_kj_zwyciestwo_desc:0 "Pruski Rząd Tymczasowy upadł. Generał Radecki uciekł do Królewca, a nad Malborkiem znów powiewa czarny krzyż."
 ZKR_kj_wydalenie:0 "Wydalenie doradców"
 ZKR_kj_wydalenie_desc:0 "Ostatni rosyjscy oficerowie dostają 48 godzin na opuszczenie terytorium Zakonu."
 ZKR_kj_czystka:0 "Czystka w kapitule"
 ZKR_kj_czystka_desc:0 "Komturowie, którzy poparli Namiestnika, tracą stanowiska."
 ZKR_kj_armia:0 "Nowa armia Zakonu"
 ZKR_kj_armia_desc:0 "Armia odbudowana po wojnie domowej, lojalna tylko wobec Malborka."
 ZKR_kj_bez_moskwy:0 "Bez Moskwy i bez Berlina"
 ZKR_kj_bez_moskwy_desc:0 "Zakon nie będzie niczyim protektoratem."
 ZKR_kj_wolny_zakon:0 "Wolny Zakon"
 ZKR_kj_wolny_zakon_desc:0 "Zakon wyszedł z wojny domowej silniejszy niż przed nią."
 ZKR_kj_odbudowa:0 "Odbudowa po wojnie domowej"
 ZKR_kj_odbudowa_desc:0 "Zniszczone mosty, spalone magazyny, opuszczone wsie – trzeba to wszystko naprawić."
 ZKR_kj_odrodzony:0 "Zakon odrodzony"
 ZKR_kj_odrodzony_desc:0 "Czarny Krzyż przetrwał najgorsze. Teraz może myśleć o przyszłości – i o Prusach."
 ZKR_kj_sekularyzacja:0 "Sekularyzacja Zakonu"
 ZKR_kj_sekularyzacja_desc:0 "Jak w 1525 roku: Wielki Mistrz zrzuca habit, a Zakon staje się świeckim Księstwem Pruskim."
 ZKR_rp_namiestnik:0 "Namiestnik Prus"
 ZKR_rp_namiestnik_desc:0 "Generał Aleksander Radecki, dawny oficer, który po rozpadzie Polski uznał rosyjską zwierzchność w zamian za własne państwo, obejmuje urząd Namiestnika Prus."
 ZKR_rp_garnizon:0 "Rosyjski garnizon w Malborku"
 ZKR_rp_garnizon_desc:0 "Na dziedzińcu zamku stoją rosyjskie transportery. Turyści robią sobie z nimi zdjęcia."
 ZKR_rp_prawo:0 "Prawo rosyjskie"
 ZKR_rp_prawo_desc:0 "Kodeksy Federacji Rosyjskiej obowiązują „pomocniczo”. W praktyce – zawsze."
 ZKR_rp_rubel:0 "Rubel w Prusach"
 ZKR_rp_rubel_desc:0 "Rubel staje się drugą walutą Namiestnictwa. Ceny w sklepach podaje się w dwóch walutach."
 ZKR_rp_mazury:0 "Mazury pod opieką Namiestnika"
 ZKR_rp_mazury_desc:0 "Ziemie zajęte przez Rosję na Mazurach przechodzą pod zarząd Namiestnictwa – pod rosyjską zwierzchnością."
 ZKR_rp_warmia:0 "Warmia rosyjska"
 ZKR_rp_warmia_desc:0 "Namiestnik zgłasza roszczenia do reszty Warmii – z błogosławieństwem Kremla."
 ZKR_rp_gubernatorstwo:0 "Pruskie gubernatorstwo"
 ZKR_rp_gubernatorstwo_desc:0 "Namiestnictwo przestaje udawać państwo zakonne. Jest rosyjską prowincją z polskim generałem na czele."
 ZKR_rp_wiernosc:0 "Wierność Kremlowi"
 ZKR_rp_wiernosc_desc:0 "Dopóki Moskwa jest silna, Namiestnictwo jest bezpieczne."
