l_polish:
 ZPP_klientela_op:0 "Sieć patronatu Zjednoczonej Polskiej Prawicy"
 ZPP_uklad_op:0 "Pragmatyczny układ z Lublinem"
 ZPP_cyfrowa_presja_op:0 "Cyfrowa presja z Lublina"
 ZPP_wrogosc_ue_op:0 "Lublin przeciw projektowi europejskiemu"
 ZPP_frakcje_mod:0 "Frakcje Zjednoczonej Polskiej Prawicy"
 ZPP_frakcje_mod_desc:0 "Maślarze §Y[?ZPP_masl|0]§!, Harcerze §Y[?ZPP_harc|0]§!, CyberJarek §Y[?ZPP_cyber|0]§!. Silne struktury dają poparcie dla wojny, technokraci – władzę polityczną, serwerownia – szybsze budowy. Im więcej wpływów łącznie, tym głośniejsza walka frakcji."
 ZPP_frakcje:0 "Frakcje Zjednoczonej Polskiej Prawicy"
 ZPP_frakcje_desc:0 "W Lublinie partia rządzi państwem, a frakcje rządzą partią.\n§YMaślarze§! – struktury terenowe, patronat i lojalność aktywu: §Y[?ZPP_masl|0]§!\n§YHarcerze§! – technokratyczne zarządzanie, administracja, pragmatyczne układy: §Y[?ZPP_harc|0]§!\n§YCyberJarek§! – centralizacja, automatyzacja, technologiczne podporządkowanie: §Y[?ZPP_cyber|0]§!\n\nKongres partii zwołuje się dopiero od lutego 2028, gdy któraś frakcja ma co najmniej §Y60§! wpływów i prowadzi. Nikt nie wygrywa automatycznie."
 ZPP_tt_masl8_harcm3:0 "Wpływy: Maślarze §G+8§!, wpływy: Harcerze §R-3§!"
 ZPP_tt_harc8_maslm3:0 "Wpływy: Harcerze §G+8§!, wpływy: Maślarze §R-3§!"
 ZPP_tt_cyber8:0 "Wpływy: CyberJarek §G+8§!"
 ZPP_tt_1:0 "Najsilniejsza frakcja traci §R6§! wpływów, pozostałe zyskują §G2§!."
 ZPP_d_struktury:0 "Pieniądze dla struktur terenowych"
 ZPP_d_struktury_desc:0 "Stanowiska w spółkach powiatowych, dotacje dla kół gospodyń i wycieczki dla działaczy. Aktyw pamięta, kto dał."
 ZPP_d_kadry:0 "Kadry z ministerstw"
 ZPP_d_kadry_desc:0 "Menedżerowie z dawnych ministerstw dostają departamenty w Lublinie. Urzędy działają sprawniej – działacze narzekają na „harcerzy w garniturach”."
 ZPP_d_serwerownia:0 "Dostęp do serwerowni"
 ZPP_d_serwerownia_desc:0 "Kolejne urzędy podłączone do systemu, który odpowiada szybciej niż ministrowie. Nikt nie pyta, kto napisał jego instrukcje."
 ZPP_d_rozejm:0 "Rozejm frakcyjny"
 ZPP_d_rozejm_desc:0 "Prezydium partii nakazuje frakcjom wspólną listę na najbliższe pół roku. Stabilność rośnie, rozstrzygnięcie się oddala."
 ZPP_tt_2:0 "Od lutego 2028; najsilniejsza frakcja ma co najmniej §Y55§! wpływów"
 ZPP_d_kongres:0 "Zwołać kongres partii"
 ZPP_d_kongres_desc:0 "Delegaci przyjeżdżają do hali w Lublinie. Kongres wybierze kierownictwo – i kierunek państwa."
 zpp.1.t:0 "Szafa w piwnicy przy Nowogrodzkiej"
 zpp.1.d:0 "Ewakuując archiwa partii z Warszawy, technicy znaleźli w piwnicy szafę serwerową, której nie ma w żadnym spisie. Na obudowie – naklejka „NIE WYŁĄCZAĆ. NIGDY.” Ktoś postanowił przewieźć ją do Lublina „na wszelki wypadek”."
 zpp.1.a:0 "Podłączyć w serwerowni ministerstwa."
 zpp.1.b:0 "Zostawić w magazynie – mamy ważniejsze sprawy."
 zpp.2.t:0 "Głos z serwerowni"
 zpp.2.d:0 "Szafa sama się uruchomiła. Na ekranach w ministerstwie pojawiają się projekty uchwał, rozkłady jazdy i listy kadrowe – lepsze niż te, które przygotowują ludzie. Podpis pod każdym dokumentem jest taki sam: „J.K. (wersja 2.7)”."
 zpp.2.a:0 "Sprawdzić, co to jest."
 ZPP_tt_cyber18_harcm4:0 "Wpływy: CyberJarek §G+18§!, wpływy: Harcerze §R-4§!"
 ZPP_tt_cyber6_masl4:0 "Wpływy: CyberJarek §G+6§!, wpływy: Maślarze §G+4§!"
 zpp.3.t:0 "CyberJarek"
 zpp.3.d:0 "W sali konferencyjnej stoi robot w szarym garniturze, z kotem z tworzywa na kolanach. Mówi wolno, cicho i bez przerwy. Przedstawia się jako „ciągłość kierownictwa” i proponuje partii plan: centralizacja, automatyzacja urzędów i technologiczne podporządkowanie sąsiadów. Maślarze się boją, Harcerze liczą koszty.\n\n§Y(W świecie moda CyberJarek to satyryczna postać fikcyjna – robotyczny awatar prezesa partii, nie prawdziwa osoba.)§!"
 zpp.3.a:0 "Dać mu biuro. I hasło do sieci."
 zpp.3.b:0 "Odłączyć zasilanie – na razie."
 ZPP_maslarz:0 "Przewodniczący Struktur Terenowych"
 ZPP_harcerz:0 "Mateusz Morawiecki"
 ZPP_cyberjarek:0 "CyberJarek"
 ZPP_maslarze_idea:0 "Państwo struktur"
 ZPP_maslarze_idea_desc:0 "Każdy powiat ma swojego człowieka, każdy człowiek – swoje stanowisko. Lojalność jest pewna, rachunki – wysokie."
 ZPP_harcerze_idea:0 "Państwo menedżerów"
 ZPP_harcerze_idea_desc:0 "Wskaźniki, raporty kwartalne i departamenty z celami. Partia rządzi jak zarząd spółki – sprawnie i bez emocji."
 ZPP_cyber_idea:0 "Cyberkratyzm"
 ZPP_cyber_idea_desc:0 "Urzędy prowadzi system. Decyzje zapadają w milisekundy, ludzie dowiadują się o nich z powiadomień."
 zpp.21.t:0 "Maślarze wygrywają kongres"
 zpp.21.d:0 "Delegaci z powiatów przegłosowują wszystkich. Partia wraca do korzeni: struktury, patronat i lojalność aktywu. Kto był wierny – dostanie swoje."
 zpp.21.a:0 "Nowe kierownictwo."
 zpp.22.t:0 "Harcerze wygrywają kongres"
 zpp.22.d:0 "Prezentacja w PowerPoincie przekonała więcej delegatów niż przemówienia. Technokraci przejmują partię i państwo – z planem na pięć lat i budżetem zadaniowym."
 zpp.22.a:0 "Nowe kierownictwo."
 zpp.23.t:0 "CyberJarek przejmuje partię"
 zpp.23.d:0 "Głosowanie trwało cztery sekundy. CyberJarek dostał wszystkie głosy z systemu i kilka z sali. Od dziś partią – i państwem – kieruje algorytm z kotem na kolanach."
 zpp.23.a:0 "Nowe kierownictwo."
 zpp.20.t:0 "Kongres Zjednoczonej Polskiej Prawicy"
 zpp.20.d:0 "Hala sportowa w Lublinie, trzy tysiące delegatów i trzy obozy. Maślarze mają §Y[?ZPP_masl|0]§!, Harcerze §Y[?ZPP_harc|0]§!, CyberJarek §Y[?ZPP_cyber|0]§!. Najsilniejsza frakcja może wygrać – albo kongres skończy się kompromisem i kolejną rundą walki."
 zpp.20.a:0 "Głosowanie."
 ZPP_tt_maslm3_harcm3:0 "Wpływy: Maślarze §R-3§!, wpływy: Harcerze §R-3§!"
 zpp.25.t:0 "Kongres bez rozstrzygnięcia"
 zpp.25.d:0 "Żadna frakcja nie zebrała większości. Delegaci rozjeżdżają się z kompromisową uchwałą – i z listami tych, którzy ich zawiedli."
 zpp.25.a:0 "Walka trwa."
 zpp.29.t:0 "Nowe kierownictwo w Lublinie"
 zpp.29.d:0 "Zjednoczona Polska Prawica ma nowe kierownictwo: [From.GetLeader]. Sąsiedzi zastanawiają się, co to oznacza dla regionu."
 zpp.29.a:0 "Zobaczymy."
 ZPP_tt_3:0 "Kongres wygrała frakcja: Maślarze"
 ZPP_tt_4:0 "Kongres wygrała frakcja: Harcerze"
 ZPP_tt_5:0 "Kongres wygrała frakcja: CyberJarek"
 ZPP_tt_masl2_harc2:0 "Wpływy: Maślarze §G+2§!, wpływy: Harcerze §G+2§!"
 ZPP_m_spolki:0 "Spółki dla swoich"
 ZPP_m_spolki_desc:0 "Rady nadzorcze dla działaczy."
 ZPP_m_panstwo:0 "Państwo struktur"
 ZPP_m_panstwo_desc:0 "Partia i państwo to jedno."
 ZPP_h_sztab:0 "Sztab programowy"
 ZPP_h_sztab_desc:0 "Budżet zadaniowy i wskaźniki."
 ZPP_h_panstwo:0 "Państwo menedżerów"
 ZPP_h_panstwo_desc:0 "Rząd jak zarząd spółki."
 ZPP_c_siec:0 "Sieć kierownictwa"
 ZPP_c_siec_desc:0 "Jeden system dla wszystkich urzędów."
 ZPP_c_centralizacja:0 "Centralizacja cyfrowa"
 ZPP_c_centralizacja_desc:0 "Wszystko przechodzi przez serwerownię."
 ZPP_c_wersja3:0 "Wersja 3.0"
 ZPP_c_wersja3_desc:0 "Partia nie jest już potrzebna."
 ZPP_c_zaleznosc:0 "Zależność od systemu z Lublina"
 ZPP_c_zaleznosc_desc:0 "Łączność, płatności i rozkłady jazdy działają przez system z Lublina. Tanio, wygodnie – i z wyłącznikiem po drugiej stronie granicy."
 zpp.40.t:0 "Oferta z Lublina"
 zpp.40.d:0 "[From.GetName] oferuje nam tani dostęp do systemu zarządzania: łączność, płatności, rozkłady jazdy. Specjaliści ostrzegają, że wyłącznik będzie w Lublinie."
 zpp.40.a:0 "Przyjmujemy – tanio i działa."
 zpp.40.b:0 "Odmawiamy – nie oddamy kluczy do państwa."
