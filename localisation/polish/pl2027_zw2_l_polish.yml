l_polish:
 zw2.1.t:0 "Kolejki po chleb"
 zw2.1.d:0 "Piekarnie dostają mąkę co trzeci dzień. Przed sklepami od świtu stoją kolejki, a ceny zmieniają się z godziny na godzinę. Radni chcą wiedzieć, czy władza ma plan – czy tylko obietnice."
 zw2.1.a:0 "Kartki na chleb i mąkę."
 zw2.1.b:0 "Kupimy zboże od sąsiadów – za każdą cenę."
 zw2.1.c:0 "Rynek sam się ureguluje."
 zw2.2.t:0 "Mróz i puste składy węgla"
 zw2.2.d:0 "Termometry pokazują minus osiemnaście. Ciepłownia ma węgiel na cztery dni, a w blokach na osiedlach ludzie śpią w kurtkach. Wojsko trzyma zapasy w magazynach – i nie chce ich oddawać."
 zw2.2.a:0 "Otworzyć magazyny wojska."
 zw2.2.b:0 "Ogrzewalnie w szkołach i kościołach."
 zw2.2.c:0 "Każdy radzi sobie sam."
 zw2.3.t:0 "Dezerterzy przy rogatkach"
 zw2.3.d:0 "Na posterunek przy wjeździe do miasta przychodzi kilkudziesięciu mężczyzn w mundurach innej formacji. Mają broń, ale nie chcą już walczyć za swoich dowódców. Proszą o jedzenie i nowe przydziały."
 zw2.3.a:0 "Przyjąć ich do naszych oddziałów."
 zw2.3.b:0 "Rozbroić i odesłać do domów."
 zw2.3.c:0 "Internować do wyjaśnienia."
 zw2.4.t:0 "Uzbrojeni przemytnicy na granicy"
 zw2.4.d:0 "Straż przy granicy zatrzymała konwój uzbrojonej grupy przemytniczej działającej przy wsparciu białoruskich służb. Przemytnicy uciekli w las, zostawiając broń i ludzi, których przewozili – zmarzniętych, wycieńczonych i oszukanych. Ofiary trafiły do punktu pomocy, a sztab pyta, co dalej z grupą."
 zw2.4.a:0 "Obława z wojskiem – rozbić grupę."
 zw2.4.b:0 "Więcej punktów pomocy i lekarzy dla ofiar."
 zw2.4.c:0 "Wzmocnić posterunki na całej granicy."
 zw2.5.t:0 "Radio, którego nikt nie kontroluje"
 zw2.5.d:0 "Studenci uruchomili w akademiku nadajnik i nadają wiadomości bez zgody władz: listy zaginionych, ceny w sklepach, plotki z frontu. Słucha ich pół miasta."
 zw2.5.a:0 "Przejąć nadajnik."
 zw2.5.b:0 "Dać im koncesję i czas antenowy."
 zw2.5.c:0 "Niech nadają – byle o naszych sukcesach."
 zw2.6.t:0 "Strajk w komunikacji miejskiej"
 zw2.6.d:0 "Motorniczy i kierowcy od trzech miesięcy dostają wypłaty w bonach. Dziś rano tramwaje nie wyjechały z zajezdni."
 zw2.6.a:0 "Podwyżki z budżetu obrony."
 zw2.6.b:0 "Wojsko za kierownicą."
 zw2.6.c:0 "Negocjacje przy okrągłym stole."
 zw2.7.t:0 "Wybuch w składzie amunicji"
 zw2.7.d:0 "W nocy niebo nad magazynem rozświetliła seria eksplozji. Nikt nie zginął, ale część zapasów przepadła, a w mieście mówi się o sabotażu."
 zw2.7.a:0 "Niezależne śledztwo."
 zw2.7.b:0 "To robota obcych agentów!"
 zw2.7.c:0 "Wyciszyć sprawę."
 zw2.8.t:0 "Powroty z emigracji"
 zw2.8.d:0 "Z Wysp, z Niemiec i z Norwegii wracają ludzie, którzy wyjechali dziesięć lat temu. Jedni chcą bronić rodzinnych miast, inni odbudowywać."
 zw2.8.a:0 "Do wojska – kraj potrzebuje żołnierzy."
 zw2.8.b:0 "Do odbudowy – kraj potrzebuje fachowców."
 zw2.8.c:0 "Najpierw weryfikacja, potem decyzje."
 zw2.9.t:0 "Szpital bez prądu"
 zw2.9.d:0 "Agregat w szpitalu wojewódzkim pracuje na ostatnich litrach paliwa. Ordynatorzy piszą do władz list otwarty."
 zw2.9.a:0 "Paliwo z rezerw wojska."
 zw2.9.b:0 "Prosić sąsiadów o pomoc."
 zw2.9.c:0 "Ewakuować oddziały poza miasto."
 zw2.10.t:0 "Zagraniczni dziennikarze"
 zw2.10.d:0 "Do miasta przyjechała ekipa zagranicznej telewizji. Chcą nagrać reportaż o „państwie, którego nie ma na mapach”."
 zw2.10.a:0 "Pokazać ład i porządek."
 zw2.10.b:0 "Pokazać prawdę – nawet tę trudną."
 zw2.10.c:0 "Odesłać ich na granicę."
 zw2.11.t:0 "Czarny rynek paliwa"
 zw2.11.d:0 "Na parkingach przy obwodnicy kwitnie handel paliwem z kanistrów. Ceny są trzy razy wyższe niż przed rozpadem, ale stacje stoją puste."
 zw2.11.a:0 "Zalegalizować i opodatkować."
 zw2.11.b:0 "Zlikwidować handel."
 zw2.11.c:0 "Przymknąć oko."
 zw2.12.t:0 "Zbiórka w parafiach"
 zw2.12.d:0 "Księża i wolontariusze zbierają koce, leki i jedzenie dla rodzin, które straciły dach nad głową. Proszą władze o transport."
 zw2.12.a:0 "Dać ciężarówki i paliwo."
 zw2.12.b:0 "Podziękować, ale bez pomocy."
 zw2.13.t:0 "Pierwsza rocznica rozpadu"
 zw2.13.d:0 "Mija rok od 11 listopada 2027. Na rynku zbierają się ludzie z flagami – jedni świętują niepodległość, inni opłakują państwo, które rozpadło się tego dnia."
 zw2.13.a:0 "Uroczysta defilada."
 zw2.13.b:0 "Msza i minuta ciszy."
 zw2.13.c:0 "Wiec za zjednoczeniem kraju."
 zw2.14.t:0 "Kibice proponują ochronę"
 zw2.14.d:0 "Liderzy miejscowej grupy kibiców przychodzą do ratusza. Oferują „ochronę” targowisk i dworca – za udział w opłatach i wolną rękę na ulicach."
 zw2.14.a:0 "Zgoda – przyda się każda pięść."
 zw2.14.b:0 "Odmowa – porządku pilnuje policja."
 zw2.14.c:0 "Przyjąć ich do straży miejskiej, na naszych zasadach."
 zw2.15.t:0 "Atak na serwery urzędu"
 zw2.15.d:0 "Rejestry mieszkańców, akty własności i listy płac zostały zaszyfrowane. Na ekranach pojawiło się żądanie okupu w kryptowalucie."
 zw2.15.a:0 "Zapłacić okup."
 zw2.15.b:0 "Odtworzyć dane z papierowych archiwów."
 zw2.15.c:0 "Ogłosić, że to atak obcego państwa."
 zw2.16.t:0 "Rolnicy blokują drogi"
 zw2.16.d:0 "Ciągniki stanęły na wszystkich wjazdach do miasta. Rolnicy nie dostali zapłaty za zboże zarekwirowane jesienią."
 zw2.16.a:0 "Zapłacić zaległości."
 zw2.16.b:0 "Rozblokować drogi siłą."
 zw2.16.c:0 "Obiecać ziemię po wojnie."
 zw2.17.t:0 "Gołębie pocztowe"
 zw2.17.d:0 "Sieć komórkowa nie działa od tygodnia. Hodowcy gołębi z działek oferują wojsku swoje ptaki – „jak w czasie wojny”."
 zw2.17.a:0 "Przyjąć z wdzięcznością."
 zw2.17.b:0 "Zamiast tego – kurierzy na rowerach."
 zw2.18.t:0 "Pociąg z pomocą humanitarną"
 zw2.18.d:0 "Organizacja pomocowa z zagranicy chce przepuścić przez nasze terytorium pociąg z lekami dla sąsiadów. Prosi o gwarancje bezpieczeństwa."
 zw2.18.a:0 "Przepuścić i eskortować."
 zw2.18.b:0 "Przepuścić – za część ładunku."
 zw2.18.c:0 "Odmówić – to może być przemyt broni."
